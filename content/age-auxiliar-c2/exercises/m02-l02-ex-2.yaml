# anchor: boe-a-1996-4997-art-2
- id: m02-l02-q013
  prompt:
    es: "¿Cuál de las siguientes es información general según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano?"
  options:
  - id: a
    text:
      es: "La concerniente al estado o contenido de los procedimientos administrativos que estén en tramitación."
  - id: b
    text:
      es: "La relativa a la identificación de las autoridades y del personal bajo cuya responsabilidad se tramita un procedimiento."
  - id: c
    correct: true
    text:
      es: "La relativa a los requisitos jurídicos o técnicos que las disposiciones impongan a los proyectos de los ciudadanos."
  - id: d
    text:
      es: "La referida a datos de carácter personal que afecten a la intimidad de las personas físicas."
  explanation:
    es: "El artículo 2.1 incluye en la información general la referida «a los requisitos jurídicos o técnicos que las disposiciones impongan a los proyectos, actuaciones o solicitudes que los ciudadanos se propongan realizar». El estado o contenido de los procedimientos en tramitación y la identificación del personal que los tramita son información particular (art. 3.1). Los datos personales que afectan a la intimidad también son información particular (art. 3.2)."
  citation: "art. 2.1 RD 208/1996"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-2
- id: m02-l02-q014
  prompt:
    es: "Un ciudadano que no es interesado en ningún procedimiento pide en una oficina de información de un Ministerio los requisitos para solicitar una beca. ¿Qué clase de información es y cómo se le facilita?"
  options:
  - id: a
    correct: true
    text:
      es: "Información general; se le facilitará obligatoriamente, sin exigirle acreditar legitimación alguna."
  - id: b
    text:
      es: "Información general; se le facilitará solo si la pide por escrito y acredita su identidad."
  - id: c
    text:
      es: "Información general; se le facilitará previo pago de la tasa que corresponda por el servicio."
  - id: d
    text:
      es: "Información particular; se le facilitará en el plazo de diez días a contar desde su solicitud."
  explanation:
    es: "Los requisitos para solicitar una prestación son información general (art. 2.1 RD 208/1996), y el artículo 2.2 dice que «se facilitará obligatoriamente a los ciudadanos, sin exigir para ello la acreditación de legitimación alguna». Exigir que la pida por escrito y se identifique, o que pague una tasa, añade condiciones que el artículo excluye. No es información particular, que es la relativa al estado o contenido de procedimientos en tramitación (art. 3.1)."
  citation: "art. 2.2 RD 208/1996"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1996-4997-art-3
- id: m02-l02-q015
  prompt:
    es: "Según el artículo 3.1 del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la información particular sólo podrá ser facilitada:"
  options:
  - id: a
    text:
      es: "A quienes acrediten un interés legítimo, aunque no sean interesados en el procedimiento."
  - id: b
    text:
      es: "A los interesados y a cualquier persona que autorice el órgano que tramita el procedimiento."
  - id: c
    text:
      es: "A los interesados en cada procedimiento, excluidos en todo caso sus representantes legales."
  - id: d
    correct: true
    text:
      es: "A quienes tengan la condición de interesados en cada procedimiento o a sus representantes legales."
  explanation:
    es: "El artículo 3.1 dice que la información particular «sólo podrá ser facilitada a las personas que tengan la condición de interesados en cada procedimiento o a sus representantes legales». No basta un interés legítimo sin ser interesado, el órgano no puede ampliar el círculo por autorización y los representantes legales sí están incluidos."
  citation: "art. 3.1 RD 208/1996"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1996-4997-art-1
- id: m02-l02-q062
  prompt:
    es: "La información encomendada a las unidades y oficinas de información administrativa podrá ser, según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano:"
  options:
  - id: a
    correct: true
    text:
      es: "General o particular."
  - id: b
    text:
      es: "Orgánica o funcional."
  - id: c
    text:
      es: "Previa o posterior."
  - id: d
    text:
      es: "Propia o delegada."
  explanation:
    es: "El artículo 1 clasifica la información en general o particular. Orgánica o funcional, previa o posterior y propia o delegada no son clases de información administrativa del real decreto."
  citation: "art. 1 RD 208/1996"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-1
- id: m02-l02-q063
  prompt:
    es: "Según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la información administrativa es un cauce adecuado para que los ciudadanos accedan al conocimiento de sus derechos y obligaciones y a:"
  options:
  - id: a
    correct: true
    text:
      es: "La utilización de los bienes y servicios públicos."
  - id: b
    text:
      es: "La participación en los procedimientos administrativos."
  - id: c
    text:
      es: "La obtención de copias de los documentos de la Administración."
  - id: d
    text:
      es: "El ejercicio de las acciones y recursos legalmente previstos."
  explanation:
    es: "El artículo 1 une el conocimiento de derechos y obligaciones con la utilización de los bienes y servicios públicos. La participación en procedimientos, la obtención de copias y el ejercicio de recursos no son lo que cita."
  citation: "art. 1 RD 208/1996"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-2
- id: m02-l02-q064
  prompt:
    es: "Un ciudadano pregunta en una oficina de información por las competencias, la estructura y la localización de un organismo administrativo. ¿Qué clase de información se le facilita?"
  options:
  - id: a
    text:
      es: "Información particular."
  - id: b
    correct: true
    text:
      es: "Información general."
  - id: c
    text:
      es: "Información reservada."
  - id: d
    text:
      es: "Información personalizada."
  explanation:
    es: "La identificación, fines, competencia, estructura, funcionamiento y localización de organismos son información general, según el artículo 2.1. La particular se refiere al estado de procedimientos en tramitación. Reservada y personalizada no son clases de información administrativa del real decreto."
  citation: "art. 2.1 RD 208/1996"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-2
- id: m02-l02-q067
  prompt:
    es: "Cuando resulte conveniente una mayor difusión, la información de carácter general deberá ofrecerse, según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, a:"
  options:
  - id: a
    text:
      es: "Los ciudadanos que la soliciten por escrito a las oficinas."
  - id: b
    text:
      es: "Los interesados en cada procedimiento y sus representantes legales."
  - id: c
    correct: true
    text:
      es: "Los grupos sociales o instituciones que estén interesados en su conocimiento."
  - id: d
    text:
      es: "Las entidades de derecho público vinculadas o dependientes de los ministerios."
  explanation:
    es: "El artículo 2.3 la dirige a los grupos sociales o instituciones interesados. Los solicitantes por escrito, los interesados en cada procedimiento con sus representantes (destinatarios de la información particular) y las entidades de derecho público no son los destinatarios que cita."
  citation: "art. 2.3 RD 208/1996"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1996-4997-art-2
- id: m02-l02-q068
  prompt:
    es: "Para difundir la información general se utilizarán, según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, los medios adecuados en cada circunstancia, potenciando aquellos que permitan:"
  options:
  - id: a
    text:
      es: "La información presencial en las oficinas."
  - id: b
    correct: true
    text:
      es: "La información a distancia."
  - id: c
    text:
      es: "La información individualizada en ventanilla."
  - id: d
    text:
      es: "La información exclusivamente impresa."
  explanation:
    es: "El artículo 2.4 potencia los medios que permitan la información a distancia, como publicaciones o sistemas telefónicos. La información presencial, la individualizada en ventanilla y la exclusivamente impresa no son los medios que prioriza."
  citation: "art. 2.4 RD 208/1996"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1996-4997-art-3
- id: m02-l02-q069
  prompt:
    es: "Según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la información concerniente al estado o contenido de los procedimientos en tramitación y a la identificación de las autoridades y personal bajo cuya responsabilidad se tramiten se denomina:"
  options:
  - id: a
    correct: true
    text:
      es: "Información particular."
  - id: b
    text:
      es: "Información general."
  - id: c
    text:
      es: "Información reservada al interesado."
  - id: d
    text:
      es: "Información sectorial."
  explanation:
    es: "El artículo 3.1 define así la información particular. La general se refiere a organismos, requisitos y trámites en abstracto; reservada y sectorial no son clases de información administrativa del real decreto."
  citation: "art. 3.1 RD 208/1996"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-3
- id: m02-l02-q070
  prompt:
    es: "La información particular podrá referirse, según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, a los datos de carácter personal que afecten:"
  options:
  - id: a
    text:
      es: "Exclusivamente a la identificación de las personas físicas."
  - id: b
    text:
      es: "A la intimidad o privacidad de las personas físicas y jurídicas."
  - id: c
    text:
      es: "Únicamente a los empleados públicos de la unidad de gestión."
  - id: d
    correct: true
    text:
      es: "De alguna forma a la intimidad o privacidad de las personas físicas."
  explanation:
    es: "El artículo 3.2 habla de datos que afecten de alguna forma a la intimidad o privacidad de las personas físicas. No se limita a la identificación, no incluye a las personas jurídicas y no se reduce a los empleados públicos."
  citation: "art. 3.2 RD 208/1996"
  difficulty: 3
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1996-4997-art-3
- id: m02-l02-q071
  prompt:
    es: "Según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la información particular será aportada por:"
  options:
  - id: a
    correct: true
    text:
      es: "Las unidades de gestión de la Administración General del Estado."
  - id: b
    text:
      es: "Las oficinas de información y atención al ciudadano."
  - id: c
    text:
      es: "El Centro de Información Administrativa y las unidades departamentales de cada Ministerio."
  - id: d
    text:
      es: "La unidad departamental de información administrativa."
  explanation:
    es: "El artículo 3.3 la atribuye a las unidades de gestión de la Administración General del Estado. Las oficinas de información, el Centro de Información Administrativa y la unidad departamental colaboran con ellas cuando así se establezca, pero no son quienes la aportan."
  citation: "art. 3.3 RD 208/1996"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1996-4997-art-3
- id: m02-l02-q072
  prompt:
    es: "Para asegurar una respuesta ágil y puntual a los interesados, las unidades de gestión podrán estar dotadas, según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, de conexiones con:"
  options:
  - id: a
    text:
      es: "El Centro de Información Administrativa, que resolverá por ellas los procedimientos y dará respuesta a los interesados."
  - id: b
    correct: true
    text:
      es: "Las unidades y oficinas de información administrativa, que colaborarán con ellas cuando así se establezca."
  - id: c
    text:
      es: "Las Delegaciones del Gobierno, que tramitarán las solicitudes en su nombre."
  - id: d
    text:
      es: "Las Inspecciones Generales de Servicios, que informarán a los interesados."
  explanation:
    es: "El artículo 3.3 prevé conexiones con las unidades y oficinas de información administrativa, que colaborarán con las unidades de gestión cuando así se establezca. El Centro de Información Administrativa no resuelve procedimientos por ellas, las Delegaciones del Gobierno no tramitan en su nombre y las Inspecciones Generales de Servicios no informan a los interesados."
  citation: "art. 3.3 RD 208/1996"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1996-4997-art-3
- id: m02-l02-q125
  prompt:
    es: "Según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la información sobre documentos que contengan datos de carácter personal que afecten a la intimidad o privacidad de las personas físicas estará reservada a:"
  options:
  - id: a
    text:
      es: "Los interesados en cualquier procedimiento tramitado por la Administración General del Estado."
  - id: b
    text:
      es: "Las unidades de gestión que aporten la información al ciudadano."
  - id: c
    correct: true
    text:
      es: "Las personas a que se refieran esos datos."
  - id: d
    text:
      es: "Cualquier ciudadano que la solicite en una oficina de información y atención."
  explanation:
    es: "El artículo 3.2 reserva la información sobre documentos con datos personales a las personas a las que se refieran. Ser interesado en un procedimiento no basta: el texto exige que los datos sean propios. Las unidades de gestión aportan la información particular según el artículo 3.3, pero no son destinatarias de esa reserva. Cualquier ciudadano que la pida contradice la reserva, que es lo contrario de la información general, que se facilita sin acreditar legitimación."
  citation: "art. 3.2 RD 208/1996"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1996-4997-art-3
- id: m02-l02-q139
  prompt:
    es: "Según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la información sobre el estado o contenido de los procedimientos en tramitación solo puede facilitarse a quienes tengan la condición de interesados en cada procedimiento o a:"
  options:
  - id: a
    correct: true
    text:
      es: "Sus representantes legales."
  - id: b
    text:
      es: "Sus familiares hasta el segundo grado de parentesco."
  - id: c
    text:
      es: "Los grupos sociales o instituciones interesados en su conocimiento."
  - id: d
    text:
      es: "Los empleados públicos de otras unidades que la soliciten."
  explanation:
    es: "El artículo 3.1 limita la información particular a los interesados y a sus representantes legales. Un familiar, aunque lo sea de segundo grado, no es ni interesado ni representante legal. Los grupos sociales e instituciones interesados reciben la información general, según el artículo 2.3, no la particular. Los empleados de otras unidades tampoco figuran entre los destinatarios."
  citation: "art. 3.1 RD 208/1996"
  difficulty: 2
  tags:
  - "requisito"
