# anchor: fuente-oecd-recomendacion-gobierno-abierto-2017-pdf
- id: m01-l06-q053
  prompt:
    es: "Señale qué organización adoptó, mediante su Consejo, el 14 de diciembre de 2017 la Recomendación sobre Gobierno Abierto en la que se basa la definición que recoge el Portal de la Transparencia:"
  options:
  - id: a
    text:
      es: "La Organización de las Naciones Unidas."
  - id: b
    text:
      es: "La Unión Europea."
  - id: c
    correct: true
    text:
      es: "La Organización para la Cooperación y el Desarrollo Económicos."
  - id: d
    text:
      es: "La Alianza para el Gobierno Abierto."
  explanation:
    es: "La Recomendación la adoptó el Consejo de la OCDE, a propuesta de su Comité de Gobernanza Pública. La ONU aprobó la Agenda 2030, no esta Recomendación. La Unión Europea no la adoptó. La Alianza para el Gobierno Abierto es el foro internacional al que pertenece España, pero no es la organización que adoptó la Recomendación."
  citation: "fuente: `oecd-recomendacion-gobierno-abierto-2017.pdf`; «The Recommendation on Open Government was adopted by the OECD Council on 14 December 2017 on the proposal of the Public Governance Committee.»"
  difficulty: 1
  tags:
  - "órgano"
