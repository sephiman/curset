type: quiz
variants:
- id: m01-l01-qa01
  prompt:
    en: According to Robert C. Martin in The Single Responsibility Principle, from whom may requests to change a
      module originate when the module follows the principle?
  options:
  - id: a
    correct: true
    text:
      en: From a single person, or a single tightly coupled group of people representing one narrowly defined business
        function
  - id: b
    text:
      en: From every department that uses the module, because a module should answer to the needs of the whole organization
        at once
  - id: c
    text:
      en: From the programmer who maintains it, because the module is itself responsible for its own bug fixes and
        refactoring
  - id: d
    text:
      en: From the technical layers it touches, such as the database, the user interface and the report format it
        produces
  explanation:
    en: Martin writes that changes to a module should only originate from a single person, or a single tightly coupled
      group of people representing one narrowly defined business function. He rejects the answer that every department
      uses the module and should be served together, because he writes that you want to isolate your modules from
      the complexities of the organization as a whole. He rejects the programmer maintaining the module as the source,
      because he writes that the code is not responsible for bug fixes or refactoring. He rejects the technical
      layers it touches, such as the database, the user interface and the report format, because he writes that
      the reasons for change are people.
  citation: martin-srp-blog#blog; martin-srp-blog#blog; martin-srp-blog#blog; martin-srp-blog#blog
- id: m01-l01-qa03
  prompt:
    en: According to Martin Fowler in Yagni, how does the practice of yagni relate to a code base that is easy to
      change, which he calls malleable code?
  options:
  - id: a
    text:
      en: Yagni excuses neglecting the health of the code base
  - id: b
    correct: true
    text:
      en: Yagni requires malleable code and also enables it
  - id: c
    text:
      en: Yagni works best on a code base that is hard to change
  - id: d
    text:
      en: Yagni makes self-testing code and continuous delivery unnecessary
  explanation:
    en: Fowler writes that yagni requires, and enables, malleable code. He rejects the claim that yagni excuses
      neglecting the health of the code base, because he writes that yagni is not a justification for neglecting
      it. He rejects the claim that yagni works best on a hard-to-change code base, because he writes that it is
      only a viable strategy if the code is easy to change. He rejects the claim that self-testing code and continuous
      delivery become unnecessary, because he writes that without these enabling practices yagni turns from a beneficial
      practice into a curse.
  citation: fowler-yagni#banner; fowler-yagni#banner; fowler-yagni#banner; fowler-yagni#banner
