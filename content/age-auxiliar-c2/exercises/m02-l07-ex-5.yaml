# anchor: fuente-ms-win-iconos-escritorio-html
- id: m02-l07-q285
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes rutas del menú contextual del escritorio inicia la creación de un acceso directo?"
  options:
  - id: a
    text:
      es: "Clic derecho en un área vacía del escritorio › Ver › Acceso directo"
  - id: b
    correct: true
    text:
      es: "Clic derecho en un área vacía del escritorio › Nuevo › Acceso directo"
  - id: c
    text:
      es: "Clic derecho en un área vacía del escritorio › Mostrar más opciones › Acceso directo"
  - id: d
    text:
      es: "Clic derecho en un área vacía del escritorio › Personalizar › Acceso directo"
  explanation:
    es: "Se hace clic derecho en un área vacía del escritorio y se selecciona Nuevo › Acceso directo. Ver sirve para el tamaño y la visibilidad de los iconos, Personalizar no es donde se crea y Mostrar más opciones › Enviar a › Escritorio crea un acceso directo desde un archivo o carpeta."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Agregar accesos directos al escritorio»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m02-l07-q288
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes rutas de Configuración activa el icono Este equipo para que aparezca en el escritorio?"
  options:
  - id: a
    correct: true
    text:
      es: "Personalización › Temas › Configuración del icono de escritorio"
  - id: b
    text:
      es: "Personalización › Colores › Elegir el modo"
  - id: c
    text:
      es: "Sistema › Acerca de › Especificaciones del dispositivo"
  - id: d
    text:
      es: "Sistema › Multitarea › Escritorios"
  explanation:
    es: "Este equipo, Papelera de reciclaje y Red se eligen en Personalización › Temas › Configuración del icono de escritorio. Colores configura el modo de color, Acerca de muestra los datos del dispositivo y Multitarea regula los escritorios virtuales."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Personalizar los iconos del escritorio predeterminados»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m02-l07-q330
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes descripciones corresponde al icono Este equipo del escritorio, según la página de Microsoft sobre los iconos del escritorio?"
  options:
  - id: a
    text:
      es: "Un lugar donde se guardan temporalmente los archivos eliminados del equipo"
  - id: b
    correct: true
    text:
      es: "Acceso a las unidades del equipo y a los dispositivos conectados"
  - id: c
    text:
      es: "Acceso a los recursos de red y conexión a ellos"
  - id: d
    text:
      es: "Un acceso directo a las carpetas personales"
  explanation:
    es: "Este equipo da acceso a las unidades del equipo y a los dispositivos conectados. Los archivos eliminados se guardan temporalmente en la Papelera de reciclaje, los recursos de red los muestra el icono Red y las carpetas personales tienen su propio acceso directo."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Personalizar los iconos del escritorio predeterminados»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m02-l07-q331
  prompt:
    es: "En Windows 11, ¿cómo se crea en el escritorio un acceso directo a un archivo o carpeta, partiendo del menú contextual de ese archivo o carpeta, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Arrastrando el icono Ver información del sitio al escritorio"
  - id: b
    text:
      es: "Con Inicio › Todo y arrastrando el elemento al escritorio"
  - id: c
    text:
      es: "Con Configuración › Personalización › Temas"
  - id: d
    correct: true
    text:
      es: "Con Mostrar más opciones › Enviar a › Escritorio"
  explanation:
    es: "Para un archivo o carpeta se usa Mostrar más opciones › Enviar a › Escritorio (crear acceso directo). Arrastrar el icono Ver información del sitio sirve para páginas web, arrastrar desde Inicio › Todo sirve para aplicaciones y Personalización › Temas sirve para elegir los iconos predeterminados del escritorio."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Agregar accesos directos al escritorio»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m02-l07-q332
  prompt:
    es: "En Windows 11, ¿cómo se ocultan temporalmente todos los iconos del escritorio, según la página de Microsoft sobre los iconos del escritorio?"
  options:
  - id: a
    correct: true
    text:
      es: "Con clic derecho › Ver y desactivando Mostrar iconos del escritorio"
  - id: b
    text:
      es: "Con clic derecho en un área vacía › Ver y eligiendo iconos pequeños para reducir su tamaño"
  - id: c
    text:
      es: "Con clic derecho en un área vacía › Nuevo"
  - id: d
    text:
      es: "Manteniendo Ctrl y girando la rueda del ratón"
  explanation:
    es: "Se oculta con clic derecho en un área vacía › Ver y desactivando Mostrar iconos del escritorio. Iconos pequeños y Ctrl con la rueda del ratón solo cambian el tamaño, y Nuevo sirve para crear elementos como un acceso directo."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Mostrar u ocultar todos los iconos del escritorio»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q095
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué método abreviado de teclado selecciona el cuadro de búsqueda para escribir un término?"
  options:
  - id: a
    text:
      es: "Alt+D"
  - id: b
    text:
      es: "Ctrl+I"
  - id: c
    correct: true
    text:
      es: "Ctrl+E"
  - id: d
    text:
      es: "Ctrl+Mayús+E"
  explanation:
    es: "La tabla del Explorador de archivos asigna a Ctrl+E «Seleccionar el cuadro de búsqueda». En la misma tabla, Alt+D selecciona la barra de direcciones, Ctrl+I se centra en la barra de direcciones y Ctrl+Mayús+E expande todas las carpetas del árbol en el panel de navegación."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q096
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes acciones realiza la tecla F3 según la tabla de métodos abreviados de teclado de Microsoft?"
  options:
  - id: a
    text:
      es: "Cambiar el nombre del elemento seleccionado"
  - id: b
    correct: true
    text:
      es: "Buscar un archivo o una carpeta"
  - id: c
    text:
      es: "Seleccionar la barra de direcciones para cambiar la ruta"
  - id: d
    text:
      es: "Actualizar la ventana del Explorador de archivos"
  explanation:
    es: "La tabla del Explorador de archivos asigna a F3 «Buscar un archivo o carpeta». En la misma tabla, F2 cambia el nombre del elemento seleccionado, F4 selecciona la barra de direcciones para cambiar la ruta de acceso y F5 actualiza la ventana."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q097
  prompt:
    es: "En Windows 11, ¿qué hace el método abreviado de teclado Windows+Ctrl+F según la tabla de métodos abreviados con la tecla Windows de Microsoft?"
  options:
  - id: a
    text:
      es: "Seleccionar el cuadro de búsqueda del Explorador"
  - id: b
    text:
      es: "Buscar un archivo o carpeta en el Explorador"
  - id: c
    text:
      es: "Abrir el Explorador de archivos en Inicio"
  - id: d
    correct: true
    text:
      es: "Buscar dispositivos en una red"
  explanation:
    es: "La tabla de la tecla Windows asigna a Windows+Ctrl+F «Buscar dispositivos en una red». Seleccionar el cuadro de búsqueda del Explorador es Ctrl+E, buscar un archivo o carpeta en el Explorador es F3 y abrir el Explorador de archivos es Windows+E."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-explorador-lector-html
- id: m02-l07-q099
  prompt:
    es: "En el Explorador de archivos de Windows 11, tras pulsar Ctrl+E y empezar a escribir un término en el cuadro de búsqueda, la búsqueda se inicia:"
  options:
  - id: a
    text:
      es: "Al pulsar Entrar tras escribir el término"
  - id: b
    correct: true
    text:
      es: "Mientras se escribe el término de búsqueda"
  - id: c
    text:
      es: "Al pulsar F6 para ir al panel de contenido"
  - id: d
    text:
      es: "Al pulsar Tab para salir del cuadro de búsqueda"
  explanation:
    es: "La página dice: «Presione Ctrl+E y escriba el término de búsqueda. La búsqueda se iniciará mientras escribe». F6 o Tab se usan después, para llegar al panel de contenido con los resultados; no inician la búsqueda. Tampoco la inicia Entrar: la búsqueda ya está en marcha mientras se escribe."
  citation: "fuente: `ms-win-explorador-lector.html`; «Usar el cuadro de búsqueda»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-explorador-lector-html
- id: m02-l07-q100
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes es la ubicación del cuadro de búsqueda según la ayuda de Microsoft para lectores de pantalla?"
  options:
  - id: a
    text:
      es: "El lado izquierdo de la barra de herramientas"
  - id: b
    text:
      es: "La barra de estado, en la parte inferior derecha"
  - id: c
    correct: true
    text:
      es: "El lado derecho de la barra de herramientas"
  - id: d
    text:
      es: "El panel de navegación, en el lado izquierdo"
  explanation:
    es: "La página dice que el cuadro de búsqueda está situado en el lado derecho de la barra de herramientas. La barra de estado, abajo a la derecha, contiene botones para cambiar la vista y el diseño. El panel de navegación, a la izquierda, da acceso a carpetas, unidades y bibliotecas."
  citation: "fuente: `ms-win-explorador-lector.html`; «Usar el cuadro de búsqueda»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-indexacion-html
- id: m02-l07-q102
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes elementos crea la indexación de búsquedas para que Windows encuentre la información con más rapidez?"
  options:
  - id: a
    text:
      es: "Una carpeta comprimida con los archivos más usados"
  - id: b
    text:
      es: "Una lista de las carpetas ancladas en Acceso rápido de Inicio"
  - id: c
    correct: true
    text:
      es: "Un índice de los archivos y sus propiedades en el dispositivo"
  - id: d
    text:
      es: "Un registro de los eventos del sistema y de las aplicaciones"
  explanation:
    es: "La página dice que la indexación mejora la velocidad y la eficacia de las búsquedas mediante la creación de un índice de archivos y sus propiedades en el dispositivo. Una carpeta comprimida la crea «Enviar a › Carpeta comprimida (en zip)». Las carpetas ancladas son las de Acceso rápido. El registro de eventos del sistema y de las aplicaciones es el Visor de eventos."
  citation: "fuente: `ms-win-indexacion.html`; «Indización de búsqueda en Windows»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-indexacion-html
- id: m02-l07-q103
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes afirmaciones describe la información que la indexación de búsqueda incluye en el índice de forma predeterminada?"
  options:
  - id: a
    text:
      es: "Solo los nombres de los archivos, sin sus propiedades ni su contenido"
  - id: b
    text:
      es: "Todas las propiedades de los archivos, pero nunca el contenido de los archivos con texto"
  - id: c
    text:
      es: "El contenido de los archivos con texto, pero no las rutas de acceso completas"
  - id: d
    correct: true
    text:
      es: "Todas las propiedades, con nombres y rutas, y el contenido de los archivos con texto"
  explanation:
    es: "La página dice que, de forma predeterminada, se indexan todas las propiedades de los archivos, incluidos los nombres y las rutas de acceso completas, y que en los archivos con texto se indexa su contenido para buscar palabras dentro de ellos. Cada una de las otras opciones quita una de esas piezas: las propiedades, el contenido o las rutas."
  citation: "fuente: `ms-win-indexacion.html`; «¿Qué información se indexa?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-indexacion-html
- id: m02-l07-q104
  prompt:
    es: "En Windows 11, si un tipo de archivo se indexa solo por sus propiedades y no por su contenido, ¿qué ocurre al buscar esos archivos?"
  options:
  - id: a
    text:
      es: "Se encuentran por su contenido, pero no por el nombre de archivo"
  - id: b
    correct: true
    text:
      es: "Se encuentran por el nombre de archivo, pero no por su contenido"
  - id: c
    text:
      es: "No aparecen en ningún resultado de la búsqueda de Windows"
  - id: d
    text:
      es: "El índice ocupa más espacio que si se indexara también el contenido"
  explanation:
    es: "La página dice que, con solo las propiedades, la indexación no atiende al contenido del archivo y se puede seguir buscando por nombre de archivo, pero no por el contenido. Lo contrario, buscar por contenido y no por nombre, invierte la frase. Los archivos siguen apareciendo por su nombre. No indexar el contenido puede reducir el tamaño del índice, no aumentarlo."
  citation: "fuente: `ms-win-indexacion.html`; «¿Puedo cambiar la cantidad de información de un archivo que se indexa?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-indexacion-html
- id: m02-l07-q105
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes rutas del cuadro de diálogo «Opciones de indexación» permite elegir cómo se indexa cada tipo de archivo?"
  options:
  - id: a
    correct: true
    text:
      es: "Avanzadas › pestaña Tipos de archivo"
  - id: b
    text:
      es: "Modificar › Ubicaciones indexadas"
  - id: c
    text:
      es: "Personalizar ubicaciones de búsqueda › Modificar"
  - id: d
    text:
      es: "Avanzadas › Encontrar mis archivos"
  explanation:
    es: "La página indica que, en el cuadro de diálogo «Opciones de indexación», se selecciona «Avanzadas» y se elige la pestaña «Tipos de archivo»; allí se elige una opción en «¿Cómo se debe indexar este archivo?». «Modificar» muestra las ubicaciones indexadas y sirve para agregar carpetas, no tipos. «Personalizar ubicaciones de búsqueda» es el enlace de Configuración que abre ese cuadro de diálogo. «Encontrar mis archivos» es el apartado de Configuración con los modos Clásico y Mejorado."
  citation: "fuente: `ms-win-indexacion.html`; «¿Qué tipos de archivos se pueden indexar?»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-indexacion-html
- id: m02-l07-q108
  prompt:
    es: "En Windows 11, ¿cuánto puede tardar la indexación de búsqueda cuando se ejecuta por primera vez, y qué hace después según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Unos minutos; después no vuelve a ejecutarse hasta reinstalar Windows"
  - id: b
    correct: true
    text:
      es: "Un par de horas; después sigue en segundo plano con los cambios"
  - id: c
    text:
      es: "Un par de horas; después solo se ejecuta al reiniciar el equipo"
  - id: d
    text:
      es: "Varios días; mientras tanto la búsqueda de Windows no funciona"
  explanation:
    es: "La página dice que la indexación inicial puede tardar un par de horas y que después se ejecuta en segundo plano mientras se usa el PC, solo para volver a indexar los datos actualizados. La opción que también dice un par de horas cambia lo que ocurre después: la indexación no espera al reinicio. Unos minutos sin repetirse y varios días sin búsqueda contradicen la página."
  citation: "fuente: `ms-win-indexacion.html`; «¿Qué es la indexación?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-indexacion-html
- id: m02-l07-q109
  prompt:
    es: "Según la ayuda de Windows 11 sobre la indexación de búsqueda, ¿para cuál de los siguientes fines usa Microsoft Edge el índice?"
  options:
  - id: a
    text:
      es: "Buscar en el correo electrónico cuando se trabaja en modo sin conexión"
  - id: b
    text:
      es: "Acceder a los archivos del equipo y seguir los cambios que se hacen"
  - id: c
    correct: true
    text:
      es: "Dar resultados del historial del explorador en la barra de direcciones"
  - id: d
    text:
      es: "Mostrar las vistas previas de los sitios web en la Búsqueda segura"
  explanation:
    es: "La página dice que Microsoft Edge usa el índice para dar resultados del historial del explorador en la barra de direcciones. Buscar el correo en modo sin conexión es el uso que hace Outlook. Acceder a los archivos y seguir sus cambios es el uso del Explorador de archivos. Las vistas previas de sitios web son de Windows Search con Bing, no un uso del índice por Edge."
  citation: "fuente: `ms-win-indexacion.html`; «¿Qué aplicaciones usan el índice?»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-indexacion-html
- id: m02-l07-q110
  prompt:
    es: "Señale la afirmación correcta sobre el índice de búsqueda de Windows 11, según la ayuda de Microsoft sobre la indexación:"
  options:
  - id: a
    correct: true
    text:
      es: "Las aplicaciones que se instalan pueden agregar su propia información al índice"
  - id: b
    text:
      es: "Solo el Explorador de archivos puede agregar información al índice de Windows"
  - id: c
    text:
      es: "Outlook no agrega mensajes al índice: usa su propio índice separado de Windows"
  - id: d
    text:
      es: "El índice solo se actualiza cuando el usuario pide reconstruirlo desde Configuración"
  explanation:
    es: "La página dice que las aplicaciones instaladas también pueden agregar su propia información al índice para acelerar la búsqueda; por ejemplo, Outlook agrega de forma predeterminada todos los mensajes sincronizados con el equipo. Eso descarta las opciones de que solo el Explorador agrega información y de que Outlook no agrega mensajes. La página también dice que Windows sigue los cambios de los archivos y actualiza el índice de forma constante."
  citation: "fuente: `ms-win-indexacion.html`; «¿Qué información se indexa?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-indexacion-html
- id: m02-l07-q111
  prompt:
    es: "En Windows 11, ¿por qué se ejecuta la indexación de búsqueda en el equipo en todo momento, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Porque Windows reconstruye el índice entero en cada inicio de sesión"
  - id: b
    correct: true
    text:
      es: "Porque Windows sigue los cambios de los archivos y actualiza el índice"
  - id: c
    text:
      es: "Porque Windows comprime los archivos poco usados para ahorrar espacio"
  - id: d
    text:
      es: "Porque Windows envía el índice a Microsoft para mejorar los resultados"
  explanation:
    es: "La página dice que el PC realiza un seguimiento constante de los cambios en los archivos y actualiza el índice con la información más reciente. No reconstruye el índice entero: tras la indexación inicial, solo vuelve a indexar los datos actualizados. La indexación no comprime archivos. La página dice que los datos de la indexación semántica se almacenan localmente y no se envían a Microsoft."
  citation: "fuente: `ms-win-indexacion.html`; «¿Por qué se ejecuta automáticamente la indexación en mi PC en todo momento?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m02-l07-q112
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes rutas de Configuración lleva a «Encontrar mis archivos», donde se elige entre los modos de indexación Clásico y Mejorado?"
  options:
  - id: a
    text:
      es: "Configuración › Sistema › Acerca de"
  - id: b
    text:
      es: "Configuración › Cuentas › Opciones de inicio de sesión"
  - id: c
    correct: true
    text:
      es: "Configuración › Privacidad & seguridad › Buscar en Windows"
  - id: d
    text:
      es: "Configuración › Sistema › Multitarea"
  explanation:
    es: "La página de privacidad de la búsqueda lleva, en Windows 11, a Configuración, «Privacidad & seguridad» y «Buscar en Windows»; la de indexación dice que allí, en «Encontrar mis archivos», hay dos modos: Clásico y Mejorado. «Acerca de» muestra la información del dispositivo, «Opciones de inicio de sesión» las formas de iniciar sesión y «Multitarea» los ajustes de ventanas y escritorios."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «Búsqueda en Windows»"
  difficulty: 1
  tags:
  - "ofimática-menú"
  - "configuración"
# anchor: fuente-ms-win-indexacion-html
- id: m02-l07-q113
  prompt:
    es: "En Windows 11, ¿qué ubicaciones indexa de forma predeterminada el modo Clásico de «Encontrar mis archivos» en la configuración de búsqueda?"
  options:
  - id: a
    text:
      es: "Todo el equipo, incluidas todas las carpetas y archivos de usuario"
  - id: b
    text:
      es: "Las carpetas Imágenes, Música y Vídeos, además del escritorio"
  - id: c
    text:
      es: "Escritorio, Documentos, Descargas, Imágenes, Música y Vídeos"
  - id: d
    correct: true
    text:
      es: "Las carpetas Documentos, Imágenes y Música, además del escritorio, de forma predeterminada"
  explanation:
    es: "La página dice que el modo Clásico indexa de forma predeterminada las carpetas Documentos, Imágenes y Música, además del escritorio. Todo el equipo es lo que indexa el modo Mejorado. La lista con Vídeos cambia una de las carpetas. Escritorio, Documentos, Descargas, Imágenes, Música y Vídeos son las carpetas conocidas que vienen ancladas en Acceso rápido, no las del modo Clásico."
  citation: "fuente: `ms-win-indexacion.html`; «Elige dónde buscará los archivos tu PC»"
