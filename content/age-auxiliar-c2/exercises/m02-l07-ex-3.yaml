# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q251
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué ocurre al pulsar Ctrl+Tab, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    text:
      es: "Se abre una pestaña nueva y se cambia a ella"
  - id: b
    text:
      es: "Se cierra la pestaña activa"
  - id: c
    correct: true
    text:
      es: "Se desplaza a la pestaña siguiente"
  - id: d
    text:
      es: "Se desplaza a la pestaña anterior"
  explanation:
    es: "Ctrl+Tab se desplaza a la pestaña siguiente. Abrir una pestaña nueva es Ctrl+T, cerrar la activa es Ctrl+W e ir a la anterior es Ctrl+Mayús+Tab."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q252
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué hace la tecla Flecha izquierda con una carpeta expandida seleccionada en el panel de navegación?"
  options:
  - id: a
    correct: true
    text:
      es: "Contrae la selección actual"
  - id: b
    text:
      es: "Expande todas las carpetas del árbol"
  - id: c
    text:
      es: "Selecciona la primera subcarpeta"
  - id: d
    text:
      es: "Va a la carpeta anterior del historial"
  explanation:
    es: "Flecha izquierda contrae la selección actual si está expandida, o selecciona la carpeta que la contenía. Expandir todo es Ctrl+Mayús+E, seleccionar la primera subcarpeta es Flecha derecha y volver a la carpeta anterior es Alt+Flecha izquierda."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q294
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes opciones de la ficha Ver reduce el espacio entre archivos, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Las casillas de elemento"
  - id: b
    correct: true
    text:
      es: "La vista compacta"
  - id: c
    text:
      es: "El panel de navegación"
  - id: d
    text:
      es: "Las extensiones de nombre de archivo"
  explanation:
    es: "La vista compacta reduce el espacio entre archivos. El panel de navegación, las casillas de elemento y las extensiones de nombre de archivo son otras opciones de Ver › Mostrar, con otro efecto."
