# anchor: fuente-ms-word-cinta-html
- id: m06-l04-q344
  prompt:
    es: "Según la página de Microsoft, ¿qué se puede personalizar de la cinta de opciones de Word 365?"
  options:
  - id: a
    text:
      es: "El tamaño del texto de la cinta de opciones"
  - id: b
    text:
      es: "El color de los iconos de la cinta de opciones"
  - id: c
    correct: true
    text:
      es: "El orden de las pestañas y los comandos"
  - id: d
    text:
      es: "El tamaño de la cinta de opciones"
  explanation:
    es: "La página dice: «puede personalizar su cinta de opciones para organizar las pestañas y los comandos en el orden que desee». La página dice que no se puede reducir el tamaño del texto ni de los iconos de la cinta. La página dice que no se puede cambiar el color de la cinta o de sus iconos. La página dice que no se puede reducir el tamaño de la cinta."
  citation: "fuente: `ms-word-cinta.html`; «¿Qué se puede personalizar?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-cinta-html
- id: m06-l04-q345
  prompt:
    es: "Según la página de Microsoft, las personalizaciones de la cinta de opciones de Word 365 se aplican:"
  options:
  - id: a
    correct: true
    text:
      es: "Solo en la aplicación de Office en la que se está trabajando"
  - id: b
    text:
      es: "En todas las aplicaciones de Office instaladas"
  - id: c
    text:
      es: "En Word y en Excel, pero no en Outlook"
  - id: d
    text:
      es: "En todos los documentos de Word, pero solo en la pestaña Inicio"
  explanation:
    es: "La página dice: «las personalizaciones solo se aplican al programa de Office en el que está trabajando en ese momento». La página dice que no se verán en Excel, por ejemplo. La página dice que los cambios hechos en Word no se ven en Excel. Las personalizaciones se aplican al programa, no a una pestaña concreta."
  citation: "fuente: `ms-word-cinta.html`; «¿Qué se puede personalizar?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-cinta-html
- id: m06-l04-q347
  prompt:
    es: "En la ventana Personalizar la cinta de opciones de Word 365, ¿cómo se oculta una pestaña predeterminada?"
  options:
  - id: a
    text:
      es: "Seleccionando Eliminar con la pestaña marcada"
  - id: b
    text:
      es: "Seleccionando Restablecer solo la pestaña seleccionada"
  - id: c
    correct: true
    text:
      es: "Desactivando la casilla situada junto a la pestaña"
  - id: d
    text:
      es: "Seleccionando Cambiar nombre y dejando el nombre en blanco"
  explanation:
    es: "La página dice: «desactive la casilla situada junto a la pestaña predeterminada o a la pestaña personalizada que desea ocultar». No se puede quitar una pestaña predeterminada, solo ocultarla. Restablecer devuelve la pestaña a su configuración predeterminada. Cambiar nombre sirve para dar otro nombre a la pestaña."
  citation: "fuente: `ms-word-cinta.html`; «Ocultar una pestaña predeterminada o personalizada»"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: fuente-ms-word-cinta-html
- id: m06-l04-q349
  prompt:
    es: "En la ventana Personalizar la cinta de opciones de Word 365, ¿cuál de las siguientes opciones se selecciona para crear una pestaña propia?"
  options:
  - id: a
    correct: true
    text:
      es: "Nueva pestaña"
  - id: b
    text:
      es: "Nuevo grupo"
  - id: c
    text:
      es: "Cambiar nombre"
  - id: d
    text:
      es: "Restablecer"
  explanation:
    es: "La página dice: «En la ventana Personalizar la cinta de opciones, seleccione Nueva pestaña». Nuevo grupo agrega un grupo personalizado a una pestaña. Cambiar nombre sirve para dar otro nombre a una pestaña, grupo o comando. Restablecer devuelve la cinta a su configuración predeterminada."
  citation: "fuente: `ms-word-cinta.html`; «Agregar o quitar pestañas o grupos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
