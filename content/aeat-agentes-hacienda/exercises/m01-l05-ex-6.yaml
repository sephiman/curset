# anchor: boe-a-2018-16673-art-5
- id: m01-l05-q0188
  prompt:
    es: "De acuerdo con el artículo 5.3 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, el deber de confidencialidad de quienes intervienen en el tratamiento:"
  options:
  - id: a
    correct: true
    text:
      es: "Se mantiene aun cuando hubiese finalizado la relación del obligado con el responsable o encargado."
  - id: b
    text:
      es: "Se extingue cuando finaliza la relación del obligado con el responsable o encargado."
  - id: c
    text:
      es: "Se mantiene durante los cinco años siguientes al fin de la relación con el responsable."
  - id: d
    text:
      es: "Se mantiene solo mientras los datos sigan siendo objeto de tratamiento por el responsable."
  explanation:
    es: "El artículo 5.3 dice que las obligaciones de confidencialidad «se mantendrán aun cuando hubiese finalizado la relación del obligado con el responsable o encargado del tratamiento». No se extinguen al acabar esa relación. La ley no les pone un límite de cinco años. Tampoco las liga a que el tratamiento siga en curso."
  citation: "art. 5.3 LOPDGDD"
  difficulty: 1
  tags:
  - "efecto"
# anchor: celex-32016r0679-art-6
- id: m01-l05-q0189
  prompt:
    es: "Según el artículo 6.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016, ¿qué condición de licitud queda excluida para el tratamiento realizado por las autoridades públicas en el ejercicio de sus funciones?"
  options:
  - id: a
    text:
      es: "El cumplimiento de una misión realizada en interés público."
  - id: b
    text:
      es: "El cumplimiento de una obligación legal aplicable al responsable."
  - id: c
    correct: true
    text:
      es: "La satisfacción de intereses legítimos del responsable o de un tercero."
  - id: d
    text:
      es: "La protección de intereses vitales del interesado o de otra persona."
  explanation:
    es: "El párrafo segundo del artículo 6.1 dice que la letra f), la de los intereses legítimos del responsable o de un tercero, «no será de aplicación al tratamiento realizado por las autoridades públicas en el ejercicio de sus funciones». La misión en interés público, la obligación legal y los intereses vitales son los artículos 6.1.e), 6.1.c) y 6.1.d), y la exclusión no los alcanza."
  citation: "art. 6.1 RGPD"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2018-16673-art-7
- id: m01-l05-q0190
  prompt:
    es: "¿Cuándo puede fundarse en su propio consentimiento el tratamiento de los datos de un menor de edad, según la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales?"
  options:
  - id: a
    text:
      es: "Cuando sea mayor de dieciséis años."
  - id: b
    text:
      es: "Cuando sea mayor de doce años."
  - id: c
    text:
      es: "Cuando sea mayor de trece años."
  - id: d
    correct: true
    text:
      es: "Cuando sea mayor de catorce años."
  explanation:
    es: "El artículo 7.1 dice que el tratamiento de los datos de un menor «únicamente podrá fundarse en su consentimiento cuando sea mayor de catorce años». Las edades de dieciséis, doce y trece años no son las que fija la ley orgánica."
  citation: "art. 7.1 LOPDGDD"
  difficulty: 1
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2018-16673-art-9
- id: m01-l05-q0192
  prompt:
    es: "Según el artículo 9.1 de la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, para levantar la prohibición del tratamiento de datos cuya finalidad principal sea identificar la religión del afectado:"
  options:
  - id: a
    text:
      es: "Bastará el consentimiento expreso y por escrito del afectado."
  - id: b
    correct: true
    text:
      es: "No bastará el solo consentimiento del afectado."
  - id: c
    text:
      es: "Bastará el consentimiento del afectado mayor de catorce años."
  - id: d
    text:
      es: "Bastará la autorización previa de la Agencia Española de Protección de Datos."
  explanation:
    es: "El artículo 9.1 dice que, a fin de evitar situaciones discriminatorias, «el solo consentimiento del afectado no bastará para levantar la prohibición» cuando la finalidad principal sea identificar, entre otras cosas, su religión. Ni el consentimiento por escrito ni el de un mayor de catorce años bastan por sí solos. La ley no prevé una autorización de la Agencia para este caso."
  citation: "art. 9.1 LOPDGDD"
  difficulty: 3
  tags:
  - "requisito"
# anchor: celex-32016r0679-art-15
- id: m01-l05-q0194
  prompt:
    es: "Según el artículo 15.4 del Reglamento (UE) 2016/679, de 27 de abril de 2016, el derecho del interesado a obtener copia de los datos personales objeto de tratamiento:"
  options:
  - id: a
    text:
      es: "Solo podrá ejercerse una vez en cada período de seis meses."
  - id: b
    text:
      es: "Exige que el interesado acredite un interés legítimo en la copia."
  - id: c
    text:
      es: "Se limita a los datos que el propio interesado haya facilitado."
  - id: d
    correct: true
    text:
      es: "No afectará negativamente a los derechos y libertades de otros."
  explanation:
    es: "El artículo 15.4 dice que el derecho a obtener copia «no afectará negativamente a los derechos y libertades de otros». No hay un límite de una copia cada seis meses: la LOPDGDD solo permite considerar repetitivo el acceso en esos casos. El interesado no tiene que acreditar un interés legítimo. Limitarse a los datos facilitados por el interesado es propio de la portabilidad, no de la copia."
  citation: "art. 15.4 RGPD"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2018-16673-art-13
- id: m01-l05-q0195
  prompt:
    es: "De acuerdo con el artículo 13.3 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, se podrá considerar repetitivo el ejercicio del derecho de acceso:"
  options:
  - id: a
    correct: true
    text:
      es: "En más de una ocasión durante el plazo de seis meses, salvo causa legítima para ello."
  - id: b
    text:
      es: "En más de una ocasión durante el plazo de un año, salvo causa legítima para ello."
  - id: c
    text:
      es: "En más de dos ocasiones durante el plazo de seis meses, salvo causa legítima para ello."
  - id: d
    text:
      es: "En más de una ocasión durante el plazo de tres meses, aunque exista causa legítima."
  explanation:
    es: "El artículo 13.3 permite considerar repetitivo el acceso «en más de una ocasión durante el plazo de seis meses, a menos que exista causa legítima para ello». El periodo no es de un año ni de tres meses. Basta más de una ocasión, no más de dos. La causa legítima impide calificarlo de repetitivo."
  citation: "art. 13.3 LOPDGDD"
  difficulty: 2
  tags:
  - "plazo"
  - "cantidad"
# anchor: boe-a-2018-16673-art-14
- id: m01-l05-q0196
  prompt:
    es: "Según el artículo 14 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, quien ejerce el derecho de rectificación aportará la documentación justificativa de la inexactitud de los datos:"
  options:
  - id: a
    correct: true
    text:
      es: "Acompañándola a la solicitud cuando sea preciso."
  - id: b
    text:
      es: "Dentro de los diez días siguientes a la solicitud."
  - id: c
    text:
      es: "Solo cuando se lo requiera la autoridad de control."
  - id: d
    text:
      es: "Solo cuando los datos procedan de un registro público."
  explanation:
    es: "El artículo 14 dice que el afectado «deberá acompañar, cuando sea preciso, la documentación justificativa de la inexactitud o carácter incompleto de los datos». Se acompaña a la solicitud, sin un plazo posterior de diez días. No depende de un requerimiento de la autoridad de control. Tampoco de que los datos procedan de un registro público."
  citation: "art. 14 LOPDGDD"
  difficulty: 2
  tags:
  - "requisito"
# anchor: celex-32016r0679-art-20
- id: m01-l05-q0199
  prompt:
    es: "Según el artículo 20.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016, el derecho a la portabilidad existe cuando el tratamiento se efectúa por medios automatizados y está basado:"
  options:
  - id: a
    correct: true
    text:
      es: "En el consentimiento o en un contrato."
  - id: b
    text:
      es: "En una obligación legal o en un contrato."
  - id: c
    text:
      es: "En el consentimiento o en el interés público."
  - id: d
    text:
      es: "En intereses legítimos o en un contrato."
  explanation:
    es: "El artículo 20.1 exige que el tratamiento «esté basado en el consentimiento […] o en un contrato» y que se efectúe por medios automatizados. La obligación legal, el interés público y los intereses legítimos son otras bases de licitud del artículo 6.1 que no dan derecho a la portabilidad."
  citation: "art. 20.1 RGPD"
  difficulty: 2
  tags:
  - "requisito"
# anchor: celex-32016r0679-art-22
- id: m01-l05-q0202
  prompt:
    es: "¿Cuál de los siguientes supuestos permite, según el Reglamento (UE) 2016/679, que el interesado sea objeto de una decisión basada únicamente en el tratamiento automatizado que produzca efectos jurídicos en él?"
  options:
  - id: a
    text:
      es: "Que la decisión se base en los intereses legítimos del responsable."
  - id: b
    text:
      es: "Que la decisión se haya notificado al interesado con un mes de antelación."
  - id: c
    text:
      es: "Que la decisión cuente con el informe previo del delegado de protección de datos."
  - id: d
    correct: true
    text:
      es: "Que la decisión se base en el consentimiento explícito del interesado."
  explanation:
    es: "El artículo 22.2 excluye el derecho del apartado 1 cuando la decisión es necesaria para un contrato, está autorizada por el Derecho de la Unión o de los Estados miembros o «se basa en el consentimiento explícito del interesado». Los intereses legítimos del responsable no están entre esos casos. Un preaviso de un mes o un informe del delegado tampoco."
  citation: "art. 22.2 RGPD"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2018-16673-art-4
- id: m01-l05-q0204
  prompt:
    es: "Según el artículo 4.2 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, el responsable con todas las medidas razonables de corrección queda exento si obtuvo los datos inexactos:"
  options:
  - id: a
    text:
      es: "De una red social."
  - id: b
    text:
      es: "De un tercero que no actúa como intermediario del sector."
  - id: c
    correct: true
    text:
      es: "De un registro público."
  - id: d
    text:
      es: "De un tratamiento anterior del propio responsable."
  explanation:
    es: "La letra d) del artículo 4.2 libera al responsable de la inexactitud de los datos obtenidos de un registro público, siempre que haya tomado todas las medidas razonables para suprimirlos o rectificarlos sin dilación. Una fuente de acceso público en internet, un tercero que no sea un intermediario del sector y sus propios tratamientos anteriores no figuran entre los supuestos."
  citation: "art. 4.2 LOPDGDD"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2018-16673-art-6
- id: m01-l05-q0211
  prompt:
    es: "Señale las notas que caracterizan la manifestación de voluntad en que consiste el consentimiento del afectado, según el artículo 6.1 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales:"
  options:
  - id: a
    correct: true
    text:
      es: "Libre, específica, informada e inequívoca."
  - id: b
    text:
      es: "Libre, expresa, informada y escrita."
  - id: c
    text:
      es: "Voluntaria, específica, previa y documentada."
  - id: d
    text:
      es: "Libre, tácita, informada e inequívoca."
  explanation:
    es: "El artículo 6.1 exige una manifestación de voluntad libre, específica, informada e inequívoca. Cada una de las otras series cambia alguna nota: expresa y escrita, previa y documentada o tácita no son las que fija el artículo."
  citation: "art. 6.1 LOPDGDD"
  difficulty: 2
  tags:
  - "concepto"
# anchor: celex-32016r0679-art-17
- id: m01-l05-q0215
  prompt:
    es: "¿Cuál de los siguientes supuestos obliga al responsable a suprimir sin dilación indebida los datos personales, según el artículo 17.1 del Reglamento (UE) 2016/679, de 27 de abril de 2016?"
  options:
  - id: a
    text:
      es: "Que los datos se traten con fines estadísticos."
  - id: b
    correct: true
    text:
      es: "Que los datos hayan sido tratados ilícitamente."
  - id: c
    text:
      es: "Que los datos se hayan obtenido del propio interesado."
  - id: d
    text:
      es: "Que los datos se comuniquen a un encargado del tratamiento."
  explanation:
    es: "La letra d) del artículo 17.1 obliga a suprimir los datos tratados ilícitamente. Tratarlos con fines estadísticos o comunicarlos a un encargado no genera esa obligación, y obtenerlos del propio interesado es la forma normal de recogerlos."
  citation: "art. 17.1 RGPD"
  difficulty: 2
  tags:
  - "requisito"
# anchor: celex-32016r0679-art-18
- id: m01-l05-q0217
  prompt:
    es: "Según el artículo 18.1.a) del Reglamento (UE) 2016/679, de 27 de abril de 2016, el interesado puede pedir la limitación del tratamiento si impugna la exactitud de los datos, durante un plazo que permita al responsable:"
  options:
  - id: a
    text:
      es: "Suprimir los datos inexactos."
  - id: b
    correct: true
    text:
      es: "Verificar la exactitud de los mismos."
  - id: c
    text:
      es: "Notificar la rectificación a los destinatarios."
  - id: d
    text:
      es: "Comunicar la impugnación a la autoridad de control."
  explanation:
    es: "La letra a) del artículo 18.1 da la limitación mientras el responsable verifica la exactitud de los datos impugnados. Suprimir los datos, notificar la rectificación a los destinatarios o avisar a la autoridad de control no son lo que ese plazo permite."
  citation: "art. 18.1.a) RGPD"
  difficulty: 3
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-2015-10566-art-40
- id: m01-l05-q0225
  prompt:
    es: "Según el artículo 40.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las Administraciones podrán identificarse mediante un sello electrónico basado en un certificado reconocido o cualificado que reúna los requisitos exigidos por:"
  options:
  - id: a
    text:
      es: "El Esquema Nacional de Seguridad."
  - id: b
    correct: true
    text:
      es: "La legislación de firma electrónica."
  - id: c
    text:
      es: "La legislación de protección de datos personales."
  - id: d
    text:
      es: "La legislación de contratos del sector público."
  explanation:
    es: "El artículo 40.1 exige un certificado que reúna «los requisitos exigidos por la legislación de firma electrónica». El precepto no remite al Esquema Nacional de Seguridad, a la legislación de protección de datos ni a la de contratos del sector público."
  citation: "art. 40.1 LRJSP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2021-5032-anexo
- id: m01-l05-q0226
  prompt:
    es: "De acuerdo con el anexo de definiciones del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, el certificado electrónico es el documento emitido y firmado por la Autoridad de Certificación que:"
  options:
  - id: a
    text:
      es: "Identifica una clave privada con el prestador que la custodia."
  - id: b
    text:
      es: "Vincula un sello electrónico con el órgano que lo utiliza."
  - id: c
    correct: true
    text:
      es: "Identifica una clave pública con su propietario."
  - id: d
    text:
      es: "Acredita la integridad de un documento mediante un código."
  explanation:
    es: "El anexo define el certificado electrónico como el «documento emitido y firmado por la Autoridad de Certificación que identifica una clave pública con su propietario». La clave que identifica es la pública, no la privada, y la vincula con su propietario, no con un prestador. Vincular un sello con un órgano o acreditar la integridad de un documento no es lo que dice la definición."
  citation: "anexo RD 203/2021"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-12
- id: m01-l05-q0228
  prompt:
    es: "Según el artículo 12.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si un interesado no obligado carece de los medios electrónicos necesarios, ¿quién puede realizar válidamente su identificación o firma electrónica?"
  options:
  - id: a
    correct: true
    text:
      es: "Un funcionario público, mediante el sistema de firma electrónica del que esté dotado."
  - id: b
    text:
      es: "Un funcionario público, mediante un certificado electrónico expedido a nombre del interesado."
  - id: c
    text:
      es: "Un empleado de la oficina de registro, con el certificado electrónico de su departamento."
  - id: d
    text:
      es: "Un notario, mediante una diligencia de identificación del interesado ante él."
  explanation:
    es: "El artículo 12.2 dice que la identificación o firma «podrá ser válidamente realizada por un funcionario público mediante el uso del sistema de firma electrónica del que esté dotado para ello». El funcionario usa su propio sistema, no un certificado a nombre del interesado ni el certificado del departamento. El precepto no atribuye esta actuación a un notario."
  citation: "art. 12.2 LPAC"
  difficulty: 2
  tags:
  - "competencia"
# anchor: fuente-sede-pag-portada-html
- id: m01-l05-q0242
  prompt:
    es: "Entre los servicios electrónicos destacados de la sede del Punto de Acceso General, ¿cuál permite verificar la integridad y autenticidad de documentos electrónicos mediante su código?"
  options:
  - id: a
    text:
      es: "La validación de certificados de las sedes asociadas."
  - id: b
    text:
      es: "El registro electrónico de apoderamientos de los interesados."
  - id: c
    correct: true
    text:
      es: "El cotejo de documentos por código seguro de verificación."
  - id: d
    text:
      es: "El registro de funcionarios habilitados para firmar por los interesados."
  explanation:
    es: "La portada de la sede destaca el cotejo de documentos por CSV, que verifica integridad y autenticidad de los documentos emitidos con código seguro de verificación. Los registros de funcionarios y de apoderamientos tienen otra función."
  citation: "fuente: `sede-pag-portada.html`; «Portada de la sede»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-38
- id: m01-l05-q0254
  prompt:
    es: "De acuerdo con el artículo 38.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, el establecimiento de una sede electrónica conlleva la responsabilidad del titular respecto de:"
  options:
  - id: a
    text:
      es: "La integridad y veracidad de la información publicada en ella, pero no de su actualización periódica."
  - id: b
    correct: true
    text:
      es: "La integridad, veracidad y actualización de la información y los servicios accesibles a través de ella."
  - id: c
    text:
      es: "La veracidad de la información publicada en ella, pero no de los servicios que se presten a través de ella."
  - id: d
    text:
      es: "La disponibilidad continua de la sede y de sus servicios, pero no de la información que publique en ella."
  explanation:
    es: "El artículo 38.2 hace responsable al titular «respecto de la integridad, veracidad y actualización de la información y los servicios a los que pueda accederse a través de la misma». La responsabilidad cubre la actualización y alcanza a los servicios. El precepto no la reduce a la disponibilidad de la sede ni excluye la información."
  citation: "art. 38.2 LRJSP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: fuente-sede-pag-portada-html
- id: m01-l05-q0262
  prompt:
    es: "Desde la sede del Punto de Acceso General, ¿qué servicio destacado facilita a ciudadanos y empresas el acceso a las notificaciones y comunicaciones de las Administraciones Públicas adheridas?"
  options:
  - id: a
    correct: true
    text:
      es: "La Dirección Electrónica Habilitada Única (DEHú)."
  - id: b
    text:
      es: "El Registro Electrónico de Apoderamientos (REA)."
  - id: c
    text:
      es: "El Registro Electrónico General de la Administración General del Estado."
  - id: d
    text:
      es: "El Registro de Funcionarios Habilitados (RFH)."
  explanation:
    es: "La portada de la sede destaca la DEHú para el acceso a notificaciones y comunicaciones de las Administraciones adheridas. Los registros de apoderamientos, de funcionarios habilitados y general sirven para otras funciones."
  citation: "fuente: `sede-pag-portada.html`; «Portada de la sede»"
  difficulty: 2
  tags:
  - "concepto"
