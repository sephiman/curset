    es: "La disposición adicional cuadragésima segunda, apartado Dos, de la Ley 31/2022 fijó el interés de demora en el 4,0625 por ciento durante el mismo período, hasta el 31 de diciembre de 2023. El 3,25 por ciento es el interés legal, y los demás tipos no figuran en la disposición."
  citation: "disposición adicional cuadragésima segunda.Dos Ley 31/2022"
  difficulty: 1
  tags:
