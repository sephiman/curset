- id: m01-l01-v-pattern-switch-001
  prompt:
    en: |-
      A pattern `switch` over `Object` runs on Java 25 with guarded and unguarded labels. What does this program print, line by line?

      ```java
      public class Main {
          static String describe(Object o) {
              return switch (o) {
                  case Integer i when i > 20 -> "big " + i;
                  case Integer i -> "int " + i;
                  case String s when s.length() > 5 -> "long " + s;
                  case String s -> "text " + s;
                  default -> "other";
              };
          }

          public static void main(String[] args) {
              System.out.println(describe(18));
              System.out.println(describe(30));
              System.out.println(describe("abcdef"));
              System.out.println(describe(2.5));
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`int 18`, `big 30`, `long abcdef`, `other`'
    correct: true
  - id: b
    text:
      en: '`big 18`, `big 30`, `long abcdef`, `other`'
  - id: c
    text:
      en: '`big 18`, `int 30`, `long abcdef`, `other`'
  - id: d
    text:
      en: '`other`, `big 30`, `long abcdef`, `other`'
  explanation:
    en: 'A pattern `switch` chooses the first case label that applies to the value, and a label with a `when` guard applies
      only while its guard is true. `describe(18)` matches `Integer`, but its guard `i > 20` is false, so the second `Integer`
      label applies. `describe(30)` matches `Integer` and its guard `i > 20` is true, so the first `Integer` label applies.
      `describe("abcdef")` matches `String` and its guard `s.length() > 5` is true because the length is `6`, so the first
      `String` label applies. `describe(2.5)` passes a `Double`, which matches neither `Integer` nor `String`, so only `default`
      applies. The program prints `int 18`, `big 30`, `long abcdef`, `other`. `big 18`, `big 30`, `long abcdef`, `other` comes
      from this mistake: ignoring the `Integer` guard, so the first `Integer` label always wins. A guard refines its pattern,
      so the first `Integer` label does not apply to an `Integer` that fails `i > 20`. `big 18`, `int 30`, `long abcdef`,
      `other` comes from this mistake: reading the `Integer` guard `i > 20` as its opposite. The guard `i > 20` is true for
      values above `20` only, and a label applies only while its guard is true. `other`, `big 30`, `long abcdef`, `other`
      comes from this mistake: sending an `Integer` that fails its guard to `default`. A failed guard only skips that label,
      and the next label that applies is chosen, here the unguarded `Integer` label before `default`.'
  family: pattern-switch
  code_reading: true
  citation: jep-441#Dominance-of-case-labels; jep-441#Case-refinement
  difficulty: 2
  tags: &id001
  - pattern-matching
  - switch
