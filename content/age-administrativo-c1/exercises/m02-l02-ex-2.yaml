# anchor: boe-a-1985-12534-art-59
- id: m02-l02-q019
  prompt:
    es: "Según el artículo 59.1 de la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español, los Archivos reúnen conjuntos orgánicos de documentos al servicio de su utilización para:"
  options:
  - id: a
    text:
      es: "La educación, la investigación y la contemplación de colecciones de valor histórico."
  - id: b
    text:
      es: "La lectura en sala pública o mediante préstamo temporal."
  - id: c
    correct: true
    text:
      es: "La investigación, la cultura, la información y la gestión administrativa."
  - id: d
    text:
      es: "La gestión administrativa solamente, mientras dure la tramitación."
  explanation:
    es: "El artículo 59.1 dice que los Archivos reúnen esos conjuntos «al servicio de su utilización para la investigación, la cultura, la información y la gestión administrativa». La educación y la contemplación son fines de los Museos (artículo 59.3). La lectura en sala o en préstamo es el fin de las Bibliotecas (artículo 59.2). La gestión administrativa es uno de los fines, no el único."
  citation: "art. 59.1 Ley 16/1985"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-12534-art-59
- id: m02-l02-q020
  prompt:
    es: "¿Cuáles de las siguientes instituciones son también Archivos según la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español?"
  options:
  - id: a
    text:
      es: "Las instituciones culturales donde se conservan, catalogan y difunden colecciones de libros y manuscritos."
  - id: b
    text:
      es: "Las instituciones permanentes que adquieren, investigan y exhiben colecciones de valor histórico o artístico."
  - id: c
    correct: true
    text:
      es: "Las instituciones culturales donde se reúnen, conservan, ordenan y difunden conjuntos orgánicos de documentos."
  - id: d
    text:
      es: "Las oficinas donde se digitalizan y anotan los documentos que presentan los interesados."
  explanation:
    es: "El artículo 59.1 llama también Archivos a «las instituciones culturales donde se reúnen, conservan, ordenan y difunden» los conjuntos orgánicos de documentos. Las que conservan y catalogan libros y manuscritos son Bibliotecas (artículo 59.2). Las que adquieren y exhiben colecciones de valor histórico o artístico son Museos (artículo 59.3). Las oficinas que digitalizan y anotan documentos son oficinas de asistencia en materia de registros, no Archivos."
  citation: "art. 59.1 Ley 16/1985"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-17
- id: m02-l02-q021
  prompt:
    es: "Conforme al artículo 17.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cada Administración mantendrá un archivo electrónico único de los documentos electrónicos que correspondan a:"
  options:
  - id: a
    text:
      es: "Procedimientos en tramitación, hasta que se dicte la resolución que les ponga fin."
  - id: b
    text:
      es: "Procedimientos iniciados a solicitud del interesado, estén o no finalizados."
  - id: c
    text:
      es: "Procedimientos finalizados hace más de cinco años, a efectos de su eliminación."
  - id: d
    correct: true
    text:
      es: "Procedimientos finalizados, en los términos de la normativa reguladora aplicable."
  explanation:
    es: "El artículo 17.1 dice: «Cada Administración deberá mantener un archivo electrónico único de los documentos electrónicos que correspondan a procedimientos finalizados, en los términos establecidos en la normativa reguladora aplicable». Los procedimientos en tramitación quedan fuera. No distingue por la forma de iniciación. No fija un plazo de cinco años ni vincula el archivo a la eliminación."
  citation: "art. 17.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-55
- id: m02-l02-q022
  prompt:
    es: "Según el artículo 55.1 del Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, el archivo electrónico único de cada Administración es:"
  options:
  - id: a
    text:
      es: "El conjunto de sistemas y servicios que sustenta la tramitación de los procedimientos administrativos mientras siguen en curso."
  - id: b
    text:
      es: "El sistema que conserva durante seis meses los documentos en papel que no pueden devolverse al interesado en el momento."
  - id: c
    correct: true
    text:
      es: "El conjunto de sistemas y servicios que sustenta la gestión, custodia y recuperación de los documentos electrónicos de procedimientos finalizados."
  - id: d
    text:
      es: "El conjunto de sistemas y servicios que custodia los documentos con valor histórico de todas las Administraciones Públicas y de su sector público."
  explanation:
    es: "El artículo 55.1 lo define como «el conjunto de sistemas y servicios que sustenta la gestión, custodia y recuperación de los documentos y expedientes electrónicos» una vez finalizados los procedimientos o actuaciones. No sirve a la tramitación en curso. La conservación durante seis meses de los papeles no devueltos es otra regla, la del artículo 53.1. El archivo de cada Administración no se define por el valor histórico ni reúne los documentos de todas las Administraciones."
  citation: "art. 55.1 RD 203/2021"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q023
  prompt:
    es: "Según el artículo 16.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los asientos del registro indicarán:"
  options:
  - id: a
    text:
      es: "La fecha en que el documento llegue a la unidad que lo tramita."
  - id: b
    text:
      es: "La fecha que el interesado indique en su solicitud."
  - id: c
    text:
      es: "La fecha en que se resuelva el procedimiento al que se incorporan."
  - id: d
    correct: true
    text:
      es: "La fecha del día en que se produzcan."
  explanation:
    es: "El artículo 16.2 dice que los asientos «indicarán la fecha del día en que se produzcan». La llegada a la unidad tramitadora es posterior al asiento. La fecha que pone el interesado en su escrito no es la del asiento. La resolución del procedimiento llega mucho después y no tiene relación con el asiento."
  citation: "art. 16.2 LPAC"
  difficulty: 1
  tags:
  - "fecha"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q024
  prompt:
    es: "Un registro recibe a las 9:10 un escrito dirigido a una Comunidad Autónoma y a las 9:30 otro dirigido a un Ministerio. ¿En qué orden se anotan sus asientos?"
  options:
  - id: a
    correct: true
    text:
      es: "Primero el recibido a las 9:10, por el orden temporal de recepción."
  - id: b
    text:
      es: "Primero el dirigido al Ministerio, por ser de la Administración General del Estado."
  - id: c
    text:
      es: "En libros separados, según la Administración a la que se dirija cada uno."
  - id: d
    text:
      es: "Con un mismo número de asiento, por haberse recibido el mismo día."
  explanation:
    es: "El artículo 16.2 de la Ley 39/2015 manda anotar los asientos «respetando el orden temporal de recepción o salida de los documentos». El escrito de las 9:10 va antes. La Administración destinataria no da preferencia ni obliga a llevar libros separados. Cada asiento lleva su propio número (artículo 16.3), aunque los escritos lleguen el mismo día."
  citation: "art. 16.2 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q025
  prompt:
    es: "Según el artículo 16.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, concluido el trámite de registro, los documentos serán cursados a sus destinatarios:"
  options:
  - id: a
    text:
      es: "En el plazo de diez días, desde el registro en que hubieran sido recibidos."
  - id: b
    correct: true
    text:
      es: "Sin dilación, desde el registro en que hubieran sido recibidos."
  - id: c
    text:
      es: "Sin dilación, desde el Registro Electrónico General de la Administración destinataria."
  - id: d
    text:
      es: "En el plazo de tres días hábiles, a través de la oficina de asistencia."
  explanation:
    es: "El artículo 16.2 dice que los documentos «serán cursados sin dilación a sus destinatarios y a las unidades administrativas correspondientes desde el registro en que hubieran sido recibidas». No hay plazo de diez días ni de tres días hábiles: es «sin dilación». Se cursan desde el registro que los recibió, no desde el de la Administración destinataria."
  citation: "art. 16.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q026
  prompt:
    es: "¿Cuál de los siguientes datos NO figura entre los que deben constar en cada asiento según el artículo 16.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "La firma manuscrita del empleado público que practica el asiento."
  - id: b
    text:
      es: "Un número y un epígrafe expresivo de la naturaleza del documento."
  - id: c
    text:
      es: "La fecha y hora de presentación del documento."
  - id: d
    text:
      es: "La identificación del interesado y la persona u órgano al que se envía."
  explanation:
    es: "El artículo 16.3 enumera lo que consta en cada asiento: «un número, epígrafe expresivo de su naturaleza, fecha y hora de su presentación, identificación del interesado, órgano administrativo remitente, si procede, y persona u órgano administrativo al que se envía» y, en su caso, una referencia al contenido. El número con su epígrafe, la fecha y hora y la identificación del interesado y del destinatario están en esa lista. La firma manuscrita de quien practica el asiento no lo está."
  citation: "art. 16.3 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q027
  prompt:
    es: "Conforme al artículo 16.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el recibo que se emite automáticamente al registrar un documento consiste en:"
  options:
  - id: a
    correct: true
    text:
      es: "Una copia autenticada del documento, con la fecha y hora de presentación y el número de entrada."
  - id: b
    text:
      es: "Una copia simple del documento, con la fecha de presentación y el órgano destinatario."
  - id: c
    text:
      es: "Un justificante sin copia del documento, con la hora de presentación y el número de entrada."
  - id: d
    text:
      es: "Una copia autenticada del documento, con la fecha prevista de resolución del procedimiento."
  explanation:
    es: "El artículo 16.3 dice que se emite automáticamente «un recibo consistente en una copia autenticada del documento de que se trate, incluyendo la fecha y hora de presentación y el número de entrada de registro». No es una copia simple ni un justificante sin copia del documento. El recibo no fija la fecha de resolución del procedimiento."
  citation: "art. 16.3 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q028
  prompt:
    es: "Una vecina presenta en el registro electrónico de su Ayuntamiento un escrito dirigido a un órgano de la Administración General del Estado. ¿Es válida esa presentación?"
  options:
  - id: a
    text:
      es: "Sí, pero solo si el Ayuntamiento ha suscrito antes un convenio de colaboración con la Administración General del Estado."
  - id: b
    text:
      es: "Sí, pero solo si lo presenta en papel en la oficina de asistencia del Ayuntamiento."
  - id: c
    correct: true
    text:
      es: "Sí, porque cabe en el registro electrónico de cualquiera de los sujetos del artículo 2.1 de la Ley 39/2015."
  - id: d
    text:
      es: "No, salvo que el escrito se refiera a una competencia delegada en la Entidad Local."
  explanation:
    es: "El artículo 16.4.a) de la Ley 39/2015 permite presentar los documentos «en el registro electrónico de la Administración u Organismo al que se dirijan, así como en los restantes registros electrónicos de cualquiera de los sujetos a los que se refiere el artículo 2.1». El artículo 2.1 incluye a las Entidades que integran la Administración Local. La ley no exige convenio. No obliga a usar el papel ni la oficina de asistencia. No limita la presentación a las competencias delegadas."
  citation: "art. 16.4.a) LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q029
  prompt:
    es: "¿Cuál de los siguientes lugares de presentación de documentos recoge el artículo 16.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Las oficinas de Correos, solo para escritos dirigidos a la Administración General del Estado."
  - id: b
    correct: true
    text:
      es: "Las oficinas de Correos, en la forma que reglamentariamente se establezca."
  - id: c
    text:
      es: "Las representaciones diplomáticas u oficinas consulares de cualquier Estado de la Unión Europea."
  - id: d
    text:
      es: "Las oficinas de asistencia en materia de registros de la Administración destinataria, y ninguna otra."
  explanation:
    es: "El artículo 16.4.b) recoge «las oficinas de Correos, en la forma que reglamentariamente se establezca». No las limita a los escritos dirigidos a la Administración General del Estado. El artículo 16.4.c) se refiere a las representaciones diplomáticas u oficinas consulares «de España en el extranjero», no de otros Estados. El artículo 16.4.d) habla de las oficinas de asistencia en materia de registros sin limitarlas a las de la Administración destinataria."
  citation: "art. 16.4 LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q030
  prompt:
    es: "Conforme al artículo 16.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, quien resida fuera de España puede presentar los documentos que dirija a una Administración española:"
  options:
  - id: a
    text:
      es: "Solo en el registro electrónico, porque no hay oficinas de registro fuera de España."
  - id: b
    text:
      es: "En las oficinas de correos del país en que resida, por correo certificado internacional."
  - id: c
    text:
      es: "En las representaciones diplomáticas en España del Estado en que resida."
  - id: d
    correct: true
    text:
      es: "En las representaciones diplomáticas u oficinas consulares de España en el extranjero."
  explanation:
    es: "El artículo 16.4.c) admite la presentación «En las representaciones diplomáticas u oficinas consulares de España en el extranjero». Por eso es falso que solo quepa el registro electrónico. El artículo 16.4.b) se refiere a las oficinas de Correos, no a las de correos de otro país. Las representaciones de otro Estado en España no están en la lista."
  citation: "art. 16.4.c) LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-31
- id: m02-l02-q031
  prompt:
    es: "Un interesado quiere presentar una solicitud en el registro electrónico de un Ministerio un domingo a las 23:40. ¿Puede hacerlo?"
  options:
  - id: a
    text:
      es: "No, porque fuera del horario de las oficinas de asistencia el registro no admite documentos."
  - id: b
    text:
      es: "Sí, pero solo si es una persona obligada a relacionarse electrónicamente con la Administración."
  - id: c
    correct: true
    text:
      es: "Sí, porque el registro electrónico admite documentos todos los días del año, las veinticuatro horas."
  - id: d
    text:
      es: "No, salvo que el Ministerio haya habilitado ese día por resolución publicada en su sede."
  explanation:
    es: "El artículo 31.2.a) de la Ley 39/2015 dice que el registro electrónico «Permitirá la presentación de documentos todos los días del año durante las veinticuatro horas». El horario de las oficinas de asistencia no limita el registro electrónico. La regla vale para cualquier interesado, esté o no obligado a relacionarse electrónicamente. No hace falta habilitar el domingo."
  citation: "art. 31.2.a) LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q032
  prompt:
    es: "Según el artículo 16.8 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué documentos e información carecen del efecto de presentación en el registro?"
  options:
  - id: a
    text:
      es: "Aquellos presentados en día inhábil o fuera del horario de las oficinas."
  - id: b
    text:
      es: "Aquellos dirigidos a una Administración distinta de la titular del registro."
  - id: c
    correct: true
    text:
      es: "Aquellos cuyo régimen especial establezca otra forma de presentación."
  - id: d
    text:
      es: "Aquellos presentados en papel que no se hayan digitalizado en el acto."
  explanation:
    es: "El artículo 16.8 dice: «No se tendrán por presentados en el registro aquellos documentos e información cuyo régimen especial establezca otra forma de presentación». El registro electrónico admite documentos todos los días a todas las horas (artículo 31.2.a). Se puede presentar en un registro un escrito dirigido a otra Administración (artículo 16.4.a). La falta de digitalización inmediata no priva al papel del efecto de presentación."
  citation: "art. 16.8 LPAC"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q033
  prompt:
    es: "¿Quién debe digitalizar los documentos que un interesado presenta en papel, de manera presencial, ante una Administración Pública?"
  options:
  - id: a
    text:
      es: "La unidad administrativa que tramite el procedimiento al que se incorporen."
  - id: b
    correct: true
    text:
      es: "La oficina de asistencia en materia de registros en la que se hayan presentado."
  - id: c
    text:
      es: "El archivo de oficina o de gestión del órgano al que se dirijan."
  - id: d
    text:
      es: "El propio interesado, que además debe aportar una copia electrónica auténtica."
  explanation:
    es: "El artículo 16.5 de la Ley 39/2015 dice que esos documentos «deberán ser digitalizados» por «la oficina de asistencia en materia de registros en la que hayan sido presentados». No los digitaliza la unidad tramitadora ni el archivo de oficina. El interesado no tiene que digitalizarlos ni aportar una copia electrónica auténtica."
  citation: "art. 16.5 LPAC"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q034
  prompt:
    es: "Según el artículo 16.5 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, una vez digitalizados los documentos presentados de manera presencial, los originales:"
  options:
  - id: a
    text:
      es: "Se remiten al archivo de oficina o de gestión del órgano destinatario."
  - id: b
    text:
      es: "Se destruyen, salvo que el interesado pida su devolución dentro del plazo de un mes desde la presentación."
  - id: c
    text:
      es: "Se conservan en la oficina de asistencia hasta que finalice el procedimiento."
  - id: d
    correct: true
    text:
      es: "Se devuelven al interesado, salvo que la norma determine su custodia por la Administración."
  explanation:
    es: "El artículo 16.5 dice que se digitalizan «devolviéndose los originales al interesado, sin perjuicio de aquellos supuestos en que la norma determine la custodia por la Administración». No se envían al archivo de oficina del destinatario. No se destruyen ni hay plazo de un mes para pedirlos. La oficina no los retiene hasta que termine el procedimiento."
  citation: "art. 16.5 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q035
  prompt:
    es: "¿En cuál de los siguientes supuestos conserva la Administración los originales presentados de manera presencial, en lugar de devolverlos, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Cuando el interesado no aporte, junto con cada documento original, una copia en papel para el expediente."
  - id: b
    text:
      es: "Cuando el documento original tenga más de cuarenta años de antigüedad."
  - id: c
    text:
      es: "Cuando el procedimiento al que se incorpora el documento original aún no haya finalizado por resolución."
  - id: d
    correct: true
    text:
      es: "Cuando sea obligatorio presentar objetos o documentos en un soporte no susceptible de digitalización."
  explanation:
    es: "El artículo 16.5 exceptúa de la devolución los supuestos en que la norma determine la custodia por la Administración y aquellos en que «resulte obligatoria la presentación de objetos o de documentos en un soporte específico no susceptibles de digitalización». No aportar copias en papel no está entre las excepciones. La antigüedad del documento tampoco. Que el procedimiento siga abierto no impide devolver el original."
  citation: "art. 16.5 LPAC"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2021-5032-art-53
- id: m02-l02-q036
  prompt:
    es: "Si un documento presentado en papel no puede devolverse al interesado en el momento de su presentación, ¿durante cuánto tiempo se conserva a su disposición una vez digitalizado?"
  options:
  - id: a
    text:
      es: "Durante tres meses, salvo que reglamentariamente se establezca un plazo mayor."
  - id: b
    text:
      es: "Durante un año, sin que quepa establecer un plazo distinto."
  - id: c
    text:
      es: "Hasta que finalice el procedimiento al que se haya incorporado."
  - id: d
    correct: true
    text:
      es: "Durante seis meses, salvo que reglamentariamente se establezca un plazo mayor."
  explanation:
    es: "El artículo 53.1 del Real Decreto 203/2021 dice que esos documentos, «una vez digitalizados serán conservados a su disposición durante seis meses», salvo que reglamentariamente la Administración correspondiente establezca un plazo mayor. No son tres meses ni un año. El plazo corre con independencia del procedimiento al que se incorporen."
  citation: "art. 53.1 RD 203/2021"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2021-5032-art-53
- id: m02-l02-q037
  prompt:
    es: "El plazo de seis meses durante el que se conservan, una vez digitalizados, los documentos en papel que no pudieron devolverse al interesado puede ser mayor:"
  options:
  - id: a
    text:
      es: "Si el interesado lo solicita antes de que venza el plazo."
  - id: b
    text:
      es: "Si el procedimiento al que se incorporan sigue en tramitación."
  - id: c
    text:
      es: "Si la oficina de asistencia lo acuerda por resolución motivada."
  - id: d
    correct: true
    text:
      es: "Si reglamentariamente lo establece la Administración correspondiente."
  explanation:
    es: "El artículo 53.1 del Real Decreto 203/2021 fija los seis meses «salvo que reglamentariamente la Administración correspondiente establezca un plazo mayor». No lo amplía una petición del interesado. Tampoco que el procedimiento siga abierto: el plazo corre «independientemente del procedimiento administrativo al que se incorporen». La oficina de asistencia no puede ampliarlo por resolución."
  citation: "art. 53.1 RD 203/2021"
  difficulty: 3
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10565-art-16
- id: m02-l02-q038
  prompt:
    es: "Conforme al artículo 16.7 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las Administraciones Públicas harán pública y mantendrán actualizada una relación de las oficinas en las que se prestará:"
  options:
  - id: a
    text:
      es: "Información sobre el estado de tramitación de los procedimientos."
  - id: b
    text:
      es: "Servicio de compulsa de copias en papel de documentos originales."
  - id: c
    text:
      es: "Asistencia para la práctica de notificaciones en papel a domicilio."
  - id: d
    correct: true
    text:
      es: "Asistencia para la presentación electrónica de documentos."
  explanation:
    es: "El artículo 16.7 dice que las Administraciones «deberán hacer pública y mantener actualizada una relación de las oficinas en las que se prestará asistencia para la presentación electrónica de documentos». La relación no se refiere a la información sobre el estado de tramitación. Tampoco a la compulsa de copias en papel ni a las notificaciones a domicilio."
  citation: "art. 16.7 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-da-cuarta
- id: m02-l02-q039
  prompt:
    es: "Según la disposición adicional cuarta de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las Administraciones Públicas mantendrán permanentemente actualizado en su sede electrónica:"
  options:
  - id: a
    text:
      es: "Un registro de las solicitudes presentadas en papel en cada oficina de asistencia en materia de registros."
  - id: b
    correct: true
    text:
      es: "Un directorio geográfico que permita identificar la oficina de asistencia en materia de registros más próxima."
  - id: c
    text:
      es: "Un inventario de los documentos originales que siguen pendientes de devolución a los interesados."
  - id: d
    text:
      es: "Un calendario con los turnos de cita previa disponibles en cada oficina de asistencia."
  explanation:
    es: "La disposición adicional cuarta exige mantener en la sede electrónica «un directorio geográfico que permita al interesado identificar la oficina de asistencia en materia de registros más próxima a su domicilio». Las solicitudes en papel se asientan en el registro, no en un listado de la sede. La disposición no exige un inventario de originales pendientes ni un calendario de citas."
  citation: "disposición adicional cuarta LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2021-5032-art-40
- id: m02-l02-q040
  prompt:
    es: "¿Qué naturaleza tienen las Oficinas de asistencia en materia de registros en el ámbito de la Administración General del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Tienen naturaleza de órgano administrativo."
  - id: b
    text:
      es: "Son unidades administrativas sin naturaleza de órgano."
  - id: c
    text:
      es: "Son organismos públicos con personalidad jurídica propia."
  - id: d
    text:
      es: "Son órganos colegiados de carácter interministerial."
  explanation:
    es: "El artículo 40.1 del Real Decreto 203/2021 dice que esas Oficinas «tienen naturaleza de órgano administrativo de acuerdo con lo dispuesto en el artículo 5 de la Ley 40/2015». No son meras unidades sin naturaleza de órgano. No tienen personalidad jurídica propia como un organismo público. No son órganos colegiados."
  citation: "art. 40.1 RD 203/2021"
  difficulty: 2
  tags:
  - "concepto"
  - "órgano"
# anchor: boe-a-2021-5032-art-40
- id: m02-l02-q041
  prompt:
    es: "¿Cuál de las siguientes funciones desarrollan las Oficinas de asistencia en materia de registros de la Administración General del Estado según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021?"
  options:
  - id: a
    text:
      es: "La resolución de los procedimientos iniciados con las solicitudes que reciben."
  - id: b
    text:
      es: "La custodia de los documentos originales hasta que finalice el procedimiento."
  - id: c
    text:
      es: "La calificación de los documentos que deban transferirse a los archivos centrales."
  - id: d
    correct: true
    text:
      es: "La emisión del recibo que acredite la fecha y hora de presentación de los documentos."
  explanation:
    es: "El artículo 40.3.c) atribuye a las Oficinas «La emisión del correspondiente recibo que acredite la fecha y hora de presentación de solicitudes, comunicaciones y documentos». Resolver los procedimientos corresponde al órgano competente, no a la Oficina. Los originales se devuelven al interesado tras digitalizarlos, salvo excepciones (artículo 16.5 de la Ley 39/2015). Calificar documentos no es función de la Oficina."
  citation: "art. 40.3.c) RD 203/2021"
  difficulty: 2
  tags:
  - "competencia"
