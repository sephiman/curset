  options:
  - id: a
    text:
      en: A target that implements no interface is rejected, because a proxy needs an interface
  - id: b
    text:
      en: A forced CGLIB proxy advises `private` methods as well as the methods that interfaces declare
  - id: c
    text:
      en: A target that implements an interface always gets a runtime-generated subclass
  - id: d
