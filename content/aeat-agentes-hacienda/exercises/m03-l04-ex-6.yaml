# anchor: boe-a-2003-23186-da-sexta
- id: m03-l04-q0099
  prompt:
    es: "De acuerdo con la disposición adicional sexta.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, quienes entreguen fondos, bienes o valores en depósito a entidades de crédito, recaben de ellas créditos o préstamos o realicen cualquier otra operación financiera con una entidad de crédito deben comunicarle:"
  options:
  - id: a
    correct: true
    text:
      es: "previamente su número de identificación fiscal."
  - id: b
    text:
      es: "en el plazo de un mes desde la operación su número de identificación fiscal."
  - id: c
    text:
      es: "previamente su domicilio fiscal y su actividad económica."
  - id: d
    text:
      es: "previamente su número de identificación fiscal y el origen de los fondos."
  explanation:
    es: "La disposición adicional sexta.2 impone comunicar a la entidad de crédito el número de identificación fiscal con carácter previo a la operación, no después. No exige el domicilio fiscal ni la actividad económica, y tampoco el origen de los fondos."
  citation: "disposición adicional sexta.2 LGT"
  difficulty: 1
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-2003-23186-da-sexta
- id: m03-l04-q0101
  prompt:
    es: "De acuerdo con la disposición adicional sexta.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las entidades de crédito exigen el número de identificación fiscal en los cheques librados por personas distintas de ellas, cuando se presenten al cobro y el abono no se realice en una cuenta bancaria, por cuantía superior a:"
  options:
  - id: a
    text:
      es: "La cifra de 300 euros."
  - id: b
    text:
      es: "La cifra de 6.000 euros."
  - id: c
    correct: true
    text:
      es: "La cifra de 3.000 euros."
  - id: d
    text:
      es: "La cifra de 30.000 euros."
  explanation:
    es: "La disposición adicional sexta.3 fija 3.000 euros para los cheques librados por personas distintas de las entidades de crédito. Las otras cifras no figuran en la disposición. La de 6.010.121,04 euros es la del volumen de operaciones de las grandes empresas, que no tiene relación con esta regla."
  citation: "disposición adicional sexta.3 LGT"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2003-23186-da-sexta
- id: m03-l04-q0102
  prompt:
    es: "De acuerdo con la disposición adicional sexta.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la publicación de la revocación del número de identificación fiscal en el «Boletín Oficial del Estado» determina:"
  options:
  - id: a
    text:
      es: "la extinción de las obligaciones tributarias que estuvieran pendientes del titular del número."
  - id: b
    text:
      es: "la pérdida de validez del número solo respecto de las entidades de crédito."
  - id: c
    text:
      es: "la suspensión del número durante un año desde la publicación."
  - id: d
    correct: true
    text:
      es: "la pérdida de validez a efectos identificativos de ese número en el ámbito fiscal."
  explanation:
    es: "La disposición adicional sexta.4 liga a la publicación en el BOE la pérdida de validez del número a efectos identificativos en el ámbito fiscal. No extingue las obligaciones pendientes, que la Administración sigue pudiendo exigir, ni se limita al ámbito bancario, ni opera como suspensión de un año."
  citation: "disposición adicional sexta.4 LGT"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-da-sexta
- id: m03-l04-q0104
  prompt:
    es: "De acuerdo con la disposición adicional sexta.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando la revocación se refiere al número de una entidad y no se rehabilita, el registro público en que esté inscrita extiende una nota marginal en la que consta que, en lo sucesivo:"
  options:
  - id: a
    text:
      es: "no podrá realizarse inscripción alguna que afecte a sus socios."
  - id: b
    text:
      es: "solo podrán inscribirse actos que sean necesarios para su liquidación."
  - id: c
    correct: true
    text:
      es: "no podrá realizarse inscripción alguna que afecte a aquella."
  - id: d
    text:
      es: "podrán inscribirse actos previa autorización de la Administración tributaria."
  explanation:
    es: "Con el número de una entidad revocado, el notario se abstiene de autorizar instrumentos públicos y el registro extiende nota marginal de que no podrá realizarse inscripción alguna que afecte a la entidad (disposición adicional sexta.4), salvo rehabilitación. La norma no habla de socios, de actos de liquidación ni de autorización de la Administración."
  citation: "disposición adicional sexta.4 LGT"
  difficulty: 1
  tags:
  - "efecto"
  - "órgano"
# anchor: boe-a-2003-23186-da-sexta
- id: m03-l04-q0105
  prompt:
    es: "De acuerdo con la disposición adicional sexta.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la revocación del número de identificación fiscal:"
  options:
  - id: a
    text:
      es: "Extingue las obligaciones tributarias pendientes de su titular."
  - id: b
    text:
      es: "Impide la presentación de cualquier declaración, aunque se rehabilite el número."
  - id: c
    text:
      es: "Solo produce efectos en la entidad si la revocación se notifica a su representante."
  - id: d
    correct: true
    text:
      es: "No impide a la Administración tributaria exigir el cumplimiento de las obligaciones tributarias pendientes."
  explanation:
    es: "La revocación no libera de nada: la Administración puede seguir exigiendo las obligaciones pendientes (disposición adicional sexta.4). La admisión de declaraciones, autoliquidaciones y escritos con un número revocado queda condicionada a su rehabilitación, no se impide siempre. Y el efecto nace de la publicación en el BOE, no de una notificación al representante."
  citation: "disposición adicional sexta.4 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2007-15984-art-18
- id: m03-l04-q0106
  prompt:
    es: "¿Cuál de los siguientes documentos NO sirve para que el titular acredite su número de identificación fiscal según el artículo 18.2 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "El pasaporte."
  - id: b
    text:
      es: "El documento nacional de identidad."
  - id: c
    text:
      es: "El documento expedido para su constancia por la Administración tributaria."
  - id: d
    text:
      es: "El documento oficial en que se asigne el número de identidad de extranjero."
  explanation:
    es: "El artículo 18.2 admite el documento expedido por la Administración tributaria, el documento nacional de identidad y el documento oficial en que se asigne el número de identidad de extranjero. El pasaporte no figura entre ellos."
  citation: "art. 18.2 RGAT"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2007-15984-art-19
- id: m03-l04-q0107
  prompt:
    es: "De acuerdo con el artículo 19.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, el número de identificación fiscal de los españoles es el de su documento nacional de identidad seguido del código o carácter de verificación, que será:"
  options:
  - id: a
    text:
      es: "un dígito de control numérico."
  - id: b
    text:
      es: "una letra minúscula de verificación."
  - id: c
    correct: true
    text:
      es: "una letra mayúscula de verificación."
  - id: d
    text:
      es: "una cifra aleatoria de dos dígitos."
  explanation:
    es: "El artículo 19.1 compone el número con el del documento nacional de identidad más un código de verificación que es una letra mayúscula. Un dígito, una minúscula o una cifra de dos dígitos no son lo que dice la norma."
  citation: "art. 19.1 RGAT"
  difficulty: 1
  tags:
  - "definición"
# anchor: boe-a-2007-15984-art-3
- id: m03-l04-q0109
  prompt:
    es: "De acuerdo con el artículo 3.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, el Censo de Obligados Tributarios está formado por:"
  options:
  - id: a
    correct: true
    text:
      es: "la totalidad de las personas o entidades que deban tener un número de identificación fiscal para sus relaciones de naturaleza o con trascendencia tributaria."
  - id: b
    text:
      es: "las personas o entidades que desarrollen o vayan a desarrollar actividades empresariales o profesionales en territorio español."
  - id: c
    text:
      es: "los obligados tributarios cuyo volumen de operaciones supere 6.010.121,04 euros durante el año natural anterior."
  - id: d
    text:
      es: "los obligados tributarios que presenten declaraciones periódicas ante la Administración tributaria."
  explanation:
    es: "El Censo de Obligados Tributarios lo componen todas las personas o entidades que deban tener número de identificación fiscal en sus relaciones de naturaleza o con trascendencia tributaria (art. 3.1). Los empresarios y profesionales forman el censo del artículo 3.2, y las grandes empresas el registro del artículo 3.5. Presentar declaraciones periódicas no es el criterio."
  citation: "art. 3.1 RGAT"
  difficulty: 2
  tags:
  - "definición"
  - "sujeto"
# anchor: boe-a-2007-15984-art-3
- id: m03-l04-q0110
  prompt:
    es: "De acuerdo con el artículo 3.2 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, el Censo de Empresarios, Profesionales y Retenedores forma parte:"
  options:
  - id: a
    text:
      es: "del Registro de grandes empresas."
  - id: b
    correct: true
    text:
      es: "del Censo de Obligados Tributarios."
  - id: c
    text:
      es: "del Registro Mercantil."
  - id: d
    text:
      es: "del Censo de Obligados Tributarios solo respecto de quienes abonen rentas sujetas a retención."
  explanation:
    es: "El censo de empresarios, profesionales y retenedores forma parte del Censo de Obligados Tributarios (art. 3.2). Es el Registro de grandes empresas el que forma parte del censo de empresarios (art. 3.5), no al revés. El Registro Mercantil es un registro distinto, y el censo de empresarios no se integra solo por quienes abonan rentas sujetas a retención: también lo forman quienes desarrollan actividades empresariales o profesionales."
  citation: "art. 3.2 RGAT"
  difficulty: 1
  tags:
  - "definición"
  - "órgano"
# anchor: boe-a-2007-15984-art-11
- id: m03-l04-q0112
  prompt:
    es: "De acuerdo con el artículo 11.2 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, quienes cesen en todo tipo de actividades empresariales o profesionales deben presentar la declaración de baja en el Censo de Empresarios, Profesionales y Retenedores:"
  options:
  - id: a
    correct: true
    text:
      es: "en el plazo de un mes desde que se cumplan esas condiciones."
  - id: b
    text:
      es: "en el plazo de seis meses desde que se cumplan esas condiciones."
  - id: c
    text:
      es: "en el plazo de tres meses desde que se cumplan esas condiciones."
  - id: d
    text:
      es: "en el plazo de diez días desde que se cumplan esas condiciones."
  explanation:
    es: "El artículo 11.2 da un mes desde el cese. Seis meses es el plazo de los herederos tras el fallecimiento (art. 11.4), tres meses es el de la comunicación de domicilio de las personas físicas que no figuran en el censo (art. 17.2), y diez días es el de subsanación de la representación."
  citation: "art. 11.2 RGAT"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2007-15984-art-11
- id: m03-l04-q0113
  prompt:
    es: "Transportes Medina, S.L. se disuelve y los asientos correspondientes se cancelan efectivamente en el Registro Mercantil el 14 de marzo de 2025. Según el Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿hasta qué día puede presentar la declaración de baja en el Censo de Empresarios, Profesionales y Retenedores?"
  options:
  - id: a
    text:
      es: "Hasta el 14 de septiembre de 2025."
  - id: b
    correct: true
    text:
      es: "Hasta el 14 de abril de 2025."
  - id: c
    text:
      es: "Hasta el 14 de junio de 2025."
  - id: d
    text:
      es: "Hasta el día de la disolución de la sociedad."
  explanation:
    es: "Cuando una sociedad se disuelve, la baja se presenta en el plazo de un mes desde que se haya realizado, en su caso, la cancelación efectiva de los asientos en el Registro Mercantil (art. 11.3). Desde el 14 de marzo de 2025 el mes termina el 14 de abril. Seis meses (14 de septiembre) es el plazo de los herederos, tres (14 de junio) no es plazo de baja, y el plazo no se cuenta desde la disolución sino desde la cancelación."
  citation: "art. 11.3 RGAT"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2003-23186-art-36
- id: m03-l04-q0179
  prompt:
    es: "De acuerdo con el artículo 36.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, es sujeto pasivo el obligado tributario que, según la ley, debe cumplir la obligación tributaria principal, así como las obligaciones formales inherentes a la misma, sea como contribuyente o como:"
  options:
  - id: a
    text:
      es: "responsable del contribuyente en su lugar."
  - id: b
    text:
      es: "sucesor del contribuyente en su lugar."
  - id: c
    correct: true
    text:
      es: "sustituto del contribuyente en su lugar."
  - id: d
    text:
      es: "retenedor del contribuyente en su lugar."
  explanation:
    es: "El artículo 36.1 distingue dos clases de sujeto pasivo: el contribuyente y el sustituto. El responsable, el sucesor y el retenedor son obligados tributarios de otra naturaleza, y no son sujetos pasivos conforme a este precepto."
  citation: "art. 36.1 LGT"
  difficulty: 1
  tags:
  - "definición"
  - "sujeto"
# anchor: boe-a-2003-23186-art-36
- id: m03-l04-q0181
  prompt:
    es: "De acuerdo con el artículo 36.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el sustituto puede exigir del contribuyente el importe de las obligaciones tributarias satisfechas:"
  options:
  - id: a
    correct: true
    text:
      es: "salvo que la ley señale otra cosa."
  - id: b
    text:
      es: "en todo caso, sin excepción alguna."
  - id: c
    text:
      es: "solo si el contribuyente lo ha autorizado."
  - id: d
    text:
      es: "siempre que la Administración lo acuerde."
  explanation:
    es: "El artículo 36.3 concede al sustituto la facultad de exigir al contribuyente lo satisfecho, salvo que la ley señale otra cosa. No es absoluta, ni depende de una autorización del contribuyente ni de un acuerdo de la Administración."
  citation: "art. 36.3 LGT"
  difficulty: 1
  tags:
  - "condición"
  - "efecto"
# anchor: boe-a-2003-23186-art-36
- id: m03-l04-q0182
  prompt:
    es: "De acuerdo con el artículo 36.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre quien debe repercutir la cuota tributaria a otros obligados:"
  options:
  - id: a
    text:
      es: "Pierde la condición de sujeto pasivo, salvo que la ley de cada tributo disponga otra cosa distinta para ese tributo."
  - id: b
    correct: true
    text:
      es: "No pierde la condición de sujeto pasivo, salvo que la ley de cada tributo disponga otra cosa."
  - id: c
    text:
      es: "Pierde siempre la condición de sujeto pasivo, que corresponde al repercutido."
  - id: d
    text:
      es: "Mantiene la condición de sujeto pasivo, aunque la ley del tributo disponga otra cosa."
  explanation:
    es: "El artículo 36.1 dice que quien deba repercutir la cuota a otros obligados no pierde la condición de sujeto pasivo, salvo que la ley de cada tributo disponga otra cosa. Perderla, perderla siempre o mantenerla contra la ley del tributo no coincide con el texto."
  citation: "art. 36.1 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "sujeto"
