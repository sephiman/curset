# anchor: boe-a-2015-11719-art-14
- id: m01-l14-q007
  prompt:
    es: "¿Cuál de los siguientes derechos de carácter individual recoge el artículo 14 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "A la inamovilidad en el puesto de trabajo concreto que desempeñe en cada momento."
  - id: b
    text:
      es: "A percibir el complemento de productividad en la misma cuantía cada año."
  - id: c
    correct: true
    text:
      es: "A la desconexión digital, en los términos de la legislación de protección de datos."
  - id: d
    text:
      es: "A la elección del puesto de trabajo dentro de su Cuerpo o Escala de pertenencia."
  explanation:
    es: "La letra j bis) reconoce la desconexión digital «en los términos establecidos en la legislación vigente en materia de protección de datos personales». La inamovilidad de la letra a) es en la condición de funcionario de carrera, no en un puesto concreto. El artículo no da derecho a elegir puesto dentro del Cuerpo ni a cobrar la productividad en una cuantía fija: la letra d) habla solo de percibir las retribuciones."
  citation: "art. 14 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-14
- id: m01-l14-q010
  prompt:
    es: "Señale la respuesta correcta sobre la libre asociación profesional en el texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    text:
      es: "Solo se reconoce al personal laboral, a través de su convenio colectivo."
  - id: b
    text:
      es: "Solo se reconoce a los funcionarios de carrera, no al resto de empleados."
  - id: c
    text:
      es: "Figura entre los derechos individuales que se ejercen de forma colectiva."
  - id: d
    correct: true
    text:
      es: "Figura entre los derechos individuales de los empleados públicos."
  explanation:
    es: "La letra p) del artículo 14 la incluye entre los derechos «de carácter individual» de «los empleados públicos». La lista del artículo 15, la de los derechos que se ejercen de forma colectiva, no la recoge: allí están la libertad sindical, la negociación colectiva, la huelga, los conflictos colectivos y la reunión. El artículo 14 se refiere a todos los empleados públicos, no solo a los funcionarios de carrera ni solo al personal laboral."
  citation: "art. 14 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-15
- id: m01-l14-q011
  prompt:
    es: "Según el artículo 15 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos tienen derecho al ejercicio de la huelga:"
  options:
  - id: a
    correct: true
    text:
      es: "Con la garantía del mantenimiento de los servicios esenciales de la comunidad."
  - id: b
    text:
      es: "Solo cuando la convoque la Junta de Personal del centro de trabajo."
  - id: c
    text:
      es: "Con la garantía de los servicios mínimos que fijen los sindicatos convocantes."
  - id: d
    text:
      es: "Previa autorización del órgano competente en materia de personal."
  explanation:
    es: "La letra c) del artículo 15 dice «al ejercicio de la huelga, con la garantía del mantenimiento de los servicios esenciales de la comunidad». La garantía no la fijan los sindicatos convocantes. El artículo no exige autorización del órgano de personal ni reserva la convocatoria a la Junta de Personal."
  citation: "art. 15 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-11719-art-30
- id: m01-l14-q013
  prompt:
    es: "Según el artículo 30.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, respecto del tiempo en que un funcionario ha permanecido en huelga:"
  options:
  - id: a
    text:
      es: "Devenga las retribuciones de ese tiempo, pero no las percibe hasta recuperarlo."
  - id: b
    text:
      es: "Percibe las retribuciones de ese tiempo si la huelga se convocó legalmente."
  - id: c
    correct: true
    text:
      es: "No devenga ni percibe las retribuciones correspondientes a ese tiempo."
  - id: d
    text:
      es: "Devenga y percibe la mitad de las retribuciones correspondientes a ese tiempo."
  explanation:
    es: "El artículo 30.2 dice que quienes ejercen la huelga «no devengarán ni percibirán las retribuciones correspondientes al tiempo» de huelga. No hay devengo con cobro aplazado. Que la huelga sea legal no da derecho a cobrar ese tiempo. Tampoco se cobra la mitad."
  citation: "art. 30.2 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-46
- id: m01-l14-q014
  prompt:
    es: "De acuerdo con el artículo 46.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, están legitimados para convocar una reunión los empleados públicos de las Administraciones respectivas en número no inferior al:"
  options:
  - id: a
    text:
      es: "50 por 100 del colectivo convocado."
  - id: b
    correct: true
    text:
      es: "40 por 100 del colectivo convocado."
  - id: c
    text:
      es: "33 por 100 del colectivo convocado."
  - id: d
    text:
      es: "25 por 100 del colectivo convocado."
  explanation:
    es: "La letra d) del artículo 46.1 fija «número no inferior al 40 por 100 del colectivo convocado». El 25, el 33 y el 50 por 100 no aparecen en el artículo."
  citation: "art. 46.1 TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-48
- id: m01-l14-q016
  prompt:
    es: "De acuerdo con el artículo 48.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público, el permiso por accidente o enfermedad graves u hospitalización de un familiar alcanza a los parientes:"
  options:
  - id: a
    text:
      es: "Hasta el cuarto grado de consanguinidad o afinidad."
  - id: b
    text:
      es: "Hasta el primer grado de consanguinidad, sin incluir la afinidad."
  - id: c
    text:
      es: "Hasta el tercer grado de consanguinidad y el segundo de afinidad."
  - id: d
    correct: true
    text:
      es: "Hasta el segundo grado de consanguinidad o afinidad."
  explanation:
    es: "El artículo 48.a) da cinco días hábiles por los parientes «hasta el primer grado por consanguinidad o afinidad» y cuatro por los de «segundo grado de consanguinidad o afinidad». Más allá del segundo grado no hay permiso por parentesco, ni en el tercero ni en el cuarto. La afinidad está incluida desde el primer grado."
  citation: "art. 48.a) TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-48
- id: m01-l14-q023
  prompt:
    es: "¿Cuál de los siguientes permisos tiene, según el artículo 48 del texto refundido de la Ley del Estatuto Básico del Empleado Público, una duración de un día?"
  options:
  - id: a
    text:
      es: "El permiso por accidente grave de un familiar de segundo grado."
  - id: b
    text:
      es: "El permiso por fallecimiento de un familiar de segundo grado en la misma localidad."
  - id: c
    correct: true
    text:
      es: "El permiso por traslado de domicilio sin cambio de residencia."
  - id: d
    text:
      es: "El permiso por matrimonio o por registro de pareja de hecho."
  explanation:
    es: "La letra b) del artículo 48 da «un día» por traslado de domicilio sin cambio de residencia. El fallecimiento de un familiar de segundo grado en la misma localidad da dos días hábiles. El matrimonio o registro de pareja de hecho da quince días. El accidente grave de un familiar de segundo grado da cuatro días hábiles."
  citation: "art. 48.b) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-48
- id: m01-l14-q024
  prompt:
    es: "¿Cuál de las siguientes describe la duración del permiso para concurrir a exámenes finales y demás pruebas definitivas de aptitud del artículo 48.d) del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "El día anterior y el día de celebración de cada examen."
  - id: b
    text:
      es: "El tiempo indispensable dentro de la jornada, sin días completos."
  - id: c
    text:
      es: "Un máximo de seis días al año, sea cual sea el número de pruebas."
  - id: d
    correct: true
    text:
      es: "Los días de celebración de los exámenes o pruebas."
  explanation:
    es: "La letra d) concede el permiso «durante los días de su celebración». No añade el día anterior. El «tiempo indispensable» es la fórmula de otras letras, como la de los exámenes prenatales. No hay tope de seis días al año: seis días es el permiso por asuntos particulares."
  citation: "art. 48.d) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2026-8287-apartado-9
- id: m01-l14-q037
  prompt:
    es: "Según el apartado 9.7 de la Resolución de 14 de abril de 2026, de la Secretaría de Estado de Función Pública, sobre jornada y horarios, los días de permiso por asuntos particulares se distribuyen:"
  options:
  - id: a
    text:
      es: "A conveniencia del personal, previa autorización de la Subsecretaría del Departamento."
  - id: b
    correct: true
    text:
      es: "A conveniencia del personal, previa autorización de sus superiores y respetando las necesidades del servicio."
  - id: c
    text:
      es: "En las fechas que fije el calendario laboral de cada centro de trabajo."
  - id: d
    text:
      es: "A conveniencia del personal, con una simple comunicación previa a sus superiores, sin necesidad de autorización."
  explanation:
    es: "El apartado 9.7 dice que el personal puede distribuir los días «a su conveniencia, previa autorización de sus superiores y respetando siempre las necesidades del servicio». Una comunicación no basta: hace falta autorización. Las fechas no las fija el calendario laboral. La autorización es de los superiores, no de la Subsecretaría."
  citation: "apartado 9.7 Resolución de 14-04-2026"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-11719-da-decimotercera
- id: m01-l14-q039
  prompt:
    es: "De acuerdo con la disposición adicional decimotercera del texto refundido de la Ley del Estatuto Básico del Empleado Público, los días adicionales de permiso por asuntos particulares por antigüedad:"
  options:
  - id: a
    text:
      es: "Solo pueden establecerse para el personal laboral, por convenio colectivo."
  - id: b
    text:
      es: "Son un derecho mínimo que el Estatuto reconoce a todo funcionario."
  - id: c
    correct: true
    text:
      es: "Son una posibilidad que cada Administración Pública puede establecer."
  - id: d
    text:
      es: "Solo pueden establecerse mediante una ley de las Cortes Generales."
  explanation:
    es: "La disposición dice que las Administraciones Públicas «podrán establecer» los días adicionales. Es una facultad de cada Administración, no un mínimo que el Estatuto imponga. No exige una ley de las Cortes. Tampoco se limita al personal laboral: habla del permiso por asuntos particulares de los funcionarios."
  citation: "disposición adicional decimotercera TREBEP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2026-8287-apartado-14
- id: m01-l14-q042
  prompt:
    es: "Según el apartado 14.2 de la Resolución de 14 de abril de 2026, de la Secretaría de Estado de Función Pública, sobre jornada y horarios, los permisos cuya duración se fija en días hábiles se computan atendiendo:"
  options:
  - id: a
    text:
      es: "Al horario general de apertura al público de las oficinas de su centro."
  - id: b
    text:
      es: "Al calendario de días inhábiles para los procedimientos administrativos."
  - id: c
    text:
      es: "Al calendario de días hábiles de la localidad donde ocurra el hecho causante."
  - id: d
    correct: true
    text:
      es: "Al régimen de jornada y horario que corresponda al titular del permiso."
  explanation:
    es: "El apartado 14.2 dice que «se atenderá al régimen de jornada y horario que corresponda al titular del permiso». No cuenta el calendario del lugar del hecho causante ni el horario de apertura de las oficinas. El calendario de días inhábiles del procedimiento administrativo tampoco rige para los permisos."
  citation: "apartado 14.2 Resolución de 14-04-2026"
  difficulty: 2
  tags:
  - "cómputo"
# anchor: boe-a-2015-11719-art-48
- id: m01-l14-q043
  prompt:
    es: "¿Cuál de los siguientes es un permiso de los funcionarios previsto en el artículo 48 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "Dos días por el traslado de domicilio con cambio de localidad de residencia."
  - id: b
    correct: true
    text:
      es: "El tiempo indispensable para los actos preparatorios de la donación de órganos o tejidos."
  - id: c
    text:
      es: "Un día por obras de reforma en el domicilio habitual del funcionario."
  - id: d
    text:
      es: "Un día por la boda de un familiar de segundo grado del funcionario."
  explanation:
    es: "La letra m) da permiso «por el tiempo indispensable para la realización de los actos preparatorios de la donación de órganos o tejidos» dentro de la jornada. El artículo 48 no tiene permiso por obras en el domicilio ni por la boda de un familiar. El traslado de domicilio solo da permiso sin cambio de residencia, y es de un día."
  citation: "art. 48.m) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-49
- id: m01-l14-q044
  prompt:
    es: "De acuerdo con el artículo 49.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público, las diecinueve semanas del permiso por nacimiento de la madre biológica se distribuyen:"
  options:
  - id: a
    correct: true
    text:
      es: "Seis tras el parto, once hasta los doce meses del hijo y dos hasta que cumpla ocho años."
  - id: b
    text:
      es: "Seis tras el parto, once hasta los doce meses del hijo y dos hasta que cumpla seis años."
  - id: c
    text:
      es: "Seis tras el parto, diez hasta los doce meses del hijo y tres hasta que cumpla ocho años."
  - id: d
    text:
      es: "Cuatro tras el parto, trece hasta los doce meses del hijo y dos hasta que cumpla ocho años."
  explanation:
    es: "El artículo 49.a) reparte el permiso en seis semanas ininterrumpidas tras el parto, once hasta que el hijo cumpla doce meses y dos hasta que cumpla ocho años. Las dos últimas semanas no acaban a los seis años. El tramo intermedio es de once semanas, no de diez ni de trece. Las semanas obligatorias son seis, no cuatro."
  citation: "art. 49.a) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
  - "estructura"
# anchor: boe-a-2015-11719-art-49
- id: m01-l14-q046
  prompt:
    es: "El hijo de una funcionaria, que tiene dos progenitores, nace prematuro y permanece hospitalizado cuarenta días tras el parto. ¿Qué duración tiene el permiso por nacimiento de la madre?"
  options:
  - id: a
    correct: true
    text:
      es: "Diecinueve semanas, ampliadas en cuarenta días."
  - id: b
    text:
      es: "Diecinueve semanas, sin ampliación por la hospitalización."
  - id: c
    text:
      es: "Diecinueve semanas, ampliadas en dos semanas."
  - id: d
    text:
      es: "Diecinueve semanas, ampliadas en trece semanas."
  explanation:
    es: "En el parto prematuro el permiso «se ampliará en tantos días como el neonato se encuentre hospitalizado, con un máximo de trece semanas adicionales». Cuarenta días no llegan a trece semanas, así que se suman los cuarenta días. Las trece semanas son el tope, no una ampliación fija. La hospitalización sí amplía el permiso. Las dos semanas son la ampliación por discapacidad del hijo."
  citation: "art. 49.a) TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-11719-art-49
- id: m01-l14-q047
  prompt:
    es: "La hija de una funcionaria, que tiene dos progenitores, nace prematura y permanece hospitalizada ciento diez días tras el parto. ¿Cuánto dura el permiso por nacimiento de la madre?"
  options:
  - id: a
    text:
      es: "Diecinueve semanas más los ciento diez días que dura la hospitalización."
  - id: b
    text:
      es: "Veintiuna semanas: diecinueve más dos por la hospitalización de la hija."
  - id: c
    text:
      es: "Veintinueve semanas: diecinueve más un máximo de diez adicionales."
  - id: d
    correct: true
    text:
      es: "Treinta y dos semanas: diecinueve más el máximo de trece adicionales."
  explanation:
    es: "La hospitalización amplía el permiso en tantos días como dure, «con un máximo de trece semanas adicionales». Ciento diez días superan las trece semanas, que son noventa y un días, así que la ampliación se queda en trece: diecinueve más trece, treinta y dos semanas. No se suman los ciento diez días completos. Las dos semanas son la ampliación por discapacidad. El tope es de trece semanas, no de diez."
  citation: "art. 49.a) TREBEP"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-11719-art-49
- id: m01-l14-q048
  prompt:
    es: "Según el artículo 49.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público, en caso de monoparentalidad las treinta y dos semanas del permiso por nacimiento de la madre biológica se distribuyen:"
  options:
  - id: a
    text:
      es: "Seis obligatorias tras el parto, veinticuatro hasta los doce meses y dos hasta los ocho años."
  - id: b
    text:
      es: "Doce obligatorias tras el parto, dieciséis hasta los doce meses y cuatro hasta los ocho años."
  - id: c
    correct: true
    text:
      es: "Seis obligatorias tras el parto, veintidós hasta los doce meses y cuatro hasta los ocho años."
  - id: d
    text:
      es: "Seis obligatorias tras el parto, veintidós hasta los doce meses y cuatro hasta los doce años."
  explanation:
    es: "En la monoparentalidad el artículo 49.a) mantiene las seis semanas obligatorias tras el parto y duplica los otros tramos: «once semanas, veintidós en el caso de monoparentalidad» y «dos semanas, cuatro en el caso de monoparentalidad», estas hasta los ocho años. El último tramo no llega a los doce años. Las semanas obligatorias no se duplican a doce. El reparto de veinticuatro y dos no es el del artículo."
  citation: "art. 49.a) TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "estructura"
