# anchor: fuente-ms-word-nuevos-usuarios-html
- id: m02-l08-q220
  prompt:
    es: "En Word 365, ¿cuál de las siguientes rutas ofrece conjuntos de estilos predefinidos, como Básicos o Casuales, que cambian el aspecto de todo el documento?"
  options:
  - id: a
    text:
      es: "Inicio › Estilos"
  - id: b
    correct: true
    text:
      es: "Diseño › Formato del documento"
  - id: c
    text:
      es: "Insertar › Formato del documento"
  - id: d
    text:
      es: "Revisar › Formato del documento"
  explanation:
    es: "La página indica la pestaña Diseño y el grupo Formato del documento. «Inicio › Estilos» el grupo Estilos aplica estilos a párrafos concretos, no cambia todo el documento con un conjunto. «Insertar › Formato del documento» la pestaña Insertar no contiene ese grupo según la página. «Revisar › Formato del documento» la pestaña Revisar no contiene ese grupo según la página."
  citation: "fuente: `ms-word-nuevos-usuarios.html`; «Word para usuarios nuevos»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-nuevos-usuarios-html
- id: m02-l08-q222
  prompt:
    es: "En Word 365, ¿qué elemento de la interfaz muestra el nombre de archivo del documento y el nombre del software, con los botones Minimizar, Restaurar y Cerrar?"
  options:
  - id: a
    text:
      es: "La barra de estado"
  - id: b
    correct: true
    text:
      es: "La barra de título"
  - id: c
    text:
      es: "La barra de herramientas de acceso rápido"
  - id: d
    text:
      es: "La barra de desplazamiento"
  explanation:
    es: "La página describe la barra de título con el nombre de archivo y los botones estándar. «La barra de estado» muestra información sobre el documento que se está editando. «La barra de herramientas de acceso rápido» agrupa comandos de uso frecuente como Guardar, Deshacer y Rehacer. «La barra de desplazamiento» cambia la posición de visualización del documento."
  citation: "fuente: `ms-word-nuevos-usuarios.html`; «Word para usuarios nuevos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-nuevos-usuarios-html
- id: m02-l08-q224
  prompt:
    es: "En Word 365, ¿qué comandos se encuentran en la pestaña Archivo, que actúan en el propio documento en lugar de en su contenido, según la página para usuarios nuevos?"
  options:
  - id: a
    text:
      es: "Negrita, Cursiva, Subrayado, Fuente y Párrafo"
  - id: b
    text:
      es: "Insertar tabla, Imagen, Forma y Gráfico"
  - id: c
    correct: true
    text:
      es: "Nuevo, Abrir, Guardar como, Imprimir y Cerrar"
  - id: d
    text:
      es: "Ortografía, Comentarios y Control de cambios"
  explanation:
    es: "La página cita esos comandos en la pestaña Archivo. «Negrita, Cursiva, Subrayado, Fuente y Párrafo» son comandos de formato del contenido, no de la pestaña Archivo. «Insertar tabla, Imagen, Forma y Gráfico» son comandos de la pestaña Insertar, no de la pestaña Archivo. «Ortografía, Comentarios y Control de cambios» son comandos de la pestaña Revisar, no de la pestaña Archivo."
  citation: "fuente: `ms-word-nuevos-usuarios.html`; «Word para usuarios nuevos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-nuevos-usuarios-html
- id: m02-l08-q225
  prompt:
    es: "En Word 365, ¿en qué pestaña de la cinta se encuentra el comando Espaciado entre párrafos, según la página de Microsoft para usuarios nuevos?"
  options:
  - id: a
    text:
      es: "En la pestaña Inicio"
  - id: b
    correct: true
    text:
      es: "En la pestaña Diseño"
  - id: c
    text:
      es: "En la pestaña Referencias"
  - id: d
    text:
      es: "En la pestaña Revisar"
  explanation:
    es: "La página indica que Espaciado entre párrafos está en la pestaña Diseño. «En la pestaña Inicio» contiene el grupo Estilos, no el comando Espaciado entre párrafos según la página. «En la pestaña Referencias» sirve para tablas de contenido y notas, no para el espaciado entre párrafos. «En la pestaña Revisar» sirve para ortografía y cambios, no para el espaciado entre párrafos."
  citation: "fuente: `ms-word-nuevos-usuarios.html`; «Word para usuarios nuevos»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-listas-multinivel-html
- id: m02-l08-q226
  prompt:
    es: "En Word 365, ¿cuál de las siguientes rutas permite crear un estilo de lista nuevo con la opción Definir nuevo estilo de lista, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Inicio › Párrafo › Viñetas"
  - id: b
    text:
      es: "Inicio › Párrafo › Lista numerada"
  - id: c
    text:
      es: "Inicio › Estilos › Lista multinivel"
  - id: d
    correct: true
    text:
      es: "Inicio › Párrafo › Lista multinivel"
  explanation:
    es: "La página indica Inicio, grupo Párrafo y la flecha de Lista multinivel. «Inicio › Párrafo › Viñetas» Viñetas ofrece Definir nueva viñeta, no el estilo de lista. «Inicio › Párrafo › Lista numerada» Lista numerada ofrece Definir nuevo formato de número. «Inicio › Estilos › Lista multinivel» el grupo Estilos no contiene la lista multinivel según la página."
  citation: "fuente: `ms-word-listas-multinivel.html`; «Definir nuevas viñetas, números y listas multinivel»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-listas-multinivel-html
- id: m02-l08-q229
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de la flecha de Viñetas permite cambiar la viñeta por un símbolo o una imagen, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Definir nuevo formato de número"
  - id: b
    text:
      es: "Definir nueva lista multinivel"
  - id: c
    text:
      es: "Definir nuevo estilo de lista"
  - id: d
    correct: true
    text:
      es: "Definir nueva viñeta"
  explanation:
    es: "La página indica Definir nueva viñeta para elegir símbolo o imagen. «Definir nuevo formato de número» pertenece a Lista numerada, no a Viñetas. «Definir nueva lista multinivel» pertenece a Lista multinivel, no a Viñetas. «Definir nuevo estilo de lista» pertenece a Lista multinivel y crea un estilo, no una viñeta."
  citation: "fuente: `ms-word-listas-multinivel.html`; «Definir nuevas viñetas, números y listas multinivel»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-office-modelos-3d-html
- id: m02-l08-q236
  prompt:
    es: "En Word 365, ¿qué control permite girar o inclinar un modelo 3D en cualquier dirección haciendo clic, manteniendo pulsado y arrastrando con el mouse?"
  options:
  - id: a
    text:
      es: "Los controladores de imagen"
  - id: b
    text:
      es: "El controlador de rotación"
  - id: c
    text:
      es: "El Panel de selección"
  - id: d
    correct: true
    text:
      es: "El control 3D"
  explanation:
    es: "La página describe el control 3D para girar o inclinar el modelo. «Los controladores de imagen» se arrastran hacia dentro o hacia fuera para cambiar el tamaño. «El controlador de rotación» rota la imagen en sentido horario o antihorario, con peor resultado que el control 3D. «El Panel de selección» lista los objetos para seleccionarlos, no gira el modelo."
  citation: "fuente: `ms-office-modelos-3d.html`; «Explotar su creatividad con modelos en 3D»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-office-modelos-3d-html
- id: m02-l08-q237
  prompt:
    es: "En Word 365, ¿cuál de las siguientes herramientas de las Herramientas de modelo 3D controla cómo encaja la imagen 3D en el encuadre, con una flecha de Zoom a la derecha?"
  options:
  - id: a
    text:
      es: "Alinear"
  - id: b
    correct: true
    text:
      es: "Panorámica & zoom"
  - id: c
    text:
      es: "Vistas de modelo 3D"
  - id: d
    text:
      es: "Panel de selección"
  explanation:
    es: "La página describe Panorámica & zoom para mover y ampliar el objeto en el marco. «Alinear» ayuda a colocar la imagen en la página, por ejemplo en la parte superior o lateral. «Vistas de modelo 3D» ofrece vistas predefinidas, como la frontal o la descendente. «Panel de selección» activa la lista de objetos para elegir entre varios modelos."
  citation: "fuente: `ms-office-modelos-3d.html`; «Explotar su creatividad con modelos en 3D»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-lienzo-dibujo-html
- id: m02-l08-q238
  prompt:
    es: "En Word 365, ¿cuál de las siguientes rutas inserta un lienzo de dibujo, según la página de Microsoft sobre cómo agregar un dibujo?"
  options:
  - id: a
    text:
      es: "Inicio › Dibujo › Nuevo lienzo de dibujo"
  - id: b
    correct: true
    text:
      es: "Insertar › Formas › Nuevo lienzo de dibujo"
  - id: c
    text:
      es: "Insertar › Gráfico › Nuevo lienzo de dibujo"
  - id: d
    text:
      es: "Diseño › Formas › Nuevo lienzo de dibujo"
  explanation:
    es: "La página indica la pestaña Insertar, Formas y Nuevo lienzo de dibujo. «Inicio › Dibujo › Nuevo lienzo de dibujo» la pestaña Inicio no contiene el comando según la página. «Insertar › Gráfico › Nuevo lienzo de dibujo» el comando Gráfico inserta gráficos, no lienzos de dibujo. «Diseño › Formas › Nuevo lienzo de dibujo» la pestaña Diseño no contiene el comando según la página."
  citation: "fuente: `ms-word-lienzo-dibujo.html`; «Agregar un dibujo a un documento»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-lienzo-dibujo-html
- id: m02-l08-q240
  prompt:
    es: "En Word 365, ¿qué acción agrupa varias formas seleccionadas para que se traten como un único objeto, según la página de Microsoft sobre dibujos?"
  options:
  - id: a
    correct: true
    text:
      es: "En Formato de forma, grupo Organizar, el botón Agrupar"
  - id: b
    text:
      es: "En Formato de forma, grupo Insertar formas, el botón Agrupar"
  - id: c
    text:
      es: "En Insertar, grupo Ilustraciones, el botón Agrupar"
  - id: d
    text:
      es: "En Inicio, grupo Párrafo, el botón Agrupar"
  explanation:
    es: "La página indica el grupo Organizar de Formato de forma. «En Formato de forma, grupo Insertar formas, el botón Agrupar» el grupo Insertar formas inserta formas, no agrupa. «En Insertar, grupo Ilustraciones, el botón Agrupar» el grupo Ilustraciones inserta formas, no las agrupa. «En Inicio, grupo Párrafo, el botón Agrupar» el grupo Párrafo no contiene ese botón según la página."
  citation: "fuente: `ms-word-lienzo-dibujo.html`; «Agregar un dibujo a un documento»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-tablas-tamano-html
- id: m02-l08-q241
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de Autoajustar ajusta automáticamente el ancho de las columnas al tamaño de su contenido, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Autoajustar ventana"
  - id: b
    text:
      es: "Ancho de columna fijo"
  - id: c
    correct: true
    text:
      es: "Autoajustar contenido"
  - id: d
    text:
      es: "Distribuir columnas"
  explanation:
    es: "La página indica Autoajustar contenido para el ancho de columna. «Autoajustar ventana» ajusta el ancho de la tabla, no el de las columnas. «Ancho de columna fijo» desactiva el ajuste automático. «Distribuir columnas» iguala el ancho de las columnas seleccionadas, no lo adapta al contenido."
  citation: "fuente: `ms-word-tablas-tamano.html`; «Cambiar el tamaño de una tabla, una columna o una fila»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-tablas-tamano-html
- id: m02-l08-q242
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de Autoajustar impide que la tabla o las columnas se ajusten automáticamente de ancho, según la página de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Ancho de columna fijo"
  - id: b
    text:
      es: "Autoajustar ventana"
  - id: c
    text:
      es: "Autoajustar contenido"
  - id: d
    text:
      es: "Distribuir filas"
  explanation:
    es: "La página indica Ancho de columna fijo para desactivar Autoajustar. «Autoajustar ventana» ajusta el ancho de la tabla automáticamente, no lo desactiva. «Autoajustar contenido» ajusta el ancho de columna automáticamente, no lo desactiva. «Distribuir filas» iguala el alto de las filas seleccionadas, no desactiva el ajuste."
  citation: "fuente: `ms-word-tablas-tamano.html`; «Cambiar el tamaño de una tabla, una columna o una fila»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-tablas-tamano-html
- id: m02-l08-q245
  prompt:
    es: "En Word 365, ¿qué opciones del grupo Tamaño de celda igualan el tamaño de las columnas o filas seleccionadas, según la página de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Distribuir columnas y Distribuir filas"
  - id: b
    text:
      es: "Autoajustar contenido y Autoajustar ventana"
  - id: c
    text:
      es: "Ancho de columna y Alto de fila"
  - id: d
    text:
      es: "Combinar celdas y Dividir celdas"
  explanation:
    es: "La página indica Distribuir columnas o Distribuir filas. «Autoajustar contenido y Autoajustar ventana» adaptan el ancho al contenido o a la ventana, no igualan tamaños. «Ancho de columna y Alto de fila» fijan una medida concreta, no igualan varias a la vez. «Combinar celdas y Dividir celdas» no son opciones del grupo Tamaño de celda."
  citation: "fuente: `ms-word-tablas-tamano.html`; «Cambiar el tamaño de una tabla, una columna o una fila»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-ordenar-tabla-html
- id: m02-l08-q247
  prompt:
    es: "En Word 365, ¿hasta cuántos niveles puede repetirse el procedimiento de ordenar una tabla, según la página de Microsoft sobre cómo ordenar su contenido?"
  options:
  - id: a
    text:
      es: "Hasta dos niveles"
  - id: b
    text:
      es: "Hasta cuatro niveles"
  - id: c
    correct: true
    text:
      es: "Hasta tres niveles"
  - id: d
    text:
      es: "Hasta diez niveles"
  explanation:
    es: "La página indica repetir el procedimiento hasta tres niveles. «Hasta dos niveles» es un nivel menos de los que da la página. «Hasta cuatro niveles» es un nivel más de los que da la página. «Hasta diez niveles» supera los tres niveles que da la página."
  citation: "fuente: `ms-word-ordenar-tabla.html`; «Ordenar el contenido de una tabla»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-ms-office-modelos-3d-html
- id: m02-l08-q275
  prompt:
    es: "¿Cuál de los siguientes elementos se arrastra hacia adentro o hacia afuera para hacer más grande o más pequeña la imagen de un modelo 3D en Word 365?"
  options:
  - id: a
    text:
      es: "El control 3D"
  - id: b
    text:
      es: "El controlador de rotación"
  - id: c
    correct: true
    text:
      es: "Los controladores de imagen"
  - id: d
    text:
      es: "La galería Vistas de modelo 3D"
  explanation:
    es: "La página dice que se arrastran los controladores de imagen hacia adentro o hacia afuera para hacer la imagen más grande o más pequeña. El control 3D sirve para girar o inclinar el modelo en cualquier dirección. El controlador de rotación gira la imagen en sentido horario o antihorario. La galería Vistas de modelo 3D ofrece vistas predefinidas, como la frontal o la descendente."
  citation: "fuente: `ms-office-modelos-3d.html`; «Explotar su creatividad con modelos en 3D»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-office-modelos-3d-html
- id: m02-l08-q276
  prompt:
    es: "¿Cuál de las siguientes herramientas de modelo 3D de Word 365 ofrece una colección de vistas predefinidas, como la vista frontal o la descendente?"
  options:
  - id: a
    text:
      es: "La herramienta Alinear"
  - id: b
    correct: true
    text:
      es: "Vistas de modelo 3D"
  - id: c
    text:
      es: "El panel de selección"
  - id: d
    text:
      es: "La herramienta Panorámica & zoom"
  explanation:
    es: "La página describe la galería Vistas de modelo 3D como una colección de vistas predefinidas, con la frontal y la descendente como ejemplo. Alinear ayuda a colocar la imagen en la página o diapositiva. El panel de selección activa la lista de objetos para elegir entre varios modelos. Panorámica & zoom controla cómo encaja la imagen 3D en el encuadre."
  citation: "fuente: `ms-office-modelos-3d.html`; «Explotar su creatividad con modelos en 3D»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-word-lienzo-dibujo-html
- id: m02-l08-q277
  prompt:
    es: "Señale qué dice la nota de la página de Microsoft sobre la necesidad de insertar un lienzo de dibujo para trabajar con objetos de dibujo en Word 365:"
  options:
  - id: a
    correct: true
    text:
      es: "Ya no es necesario, pero puede seguir usándose como ayuda de la organización"
  - id: b
    text:
      es: "Es obligatorio para insertar cualquier forma u otro objeto de dibujo en el documento"
  - id: c
    text:
      es: "Es necesario solo cuando las formas llevan texto escrito en su interior"
  - id: d
    text:
      es: "Se ha eliminado de Word y ya no puede usarse en los documentos nuevos"
  explanation:
    es: "La nota dice que ya no es necesario insertar un lienzo de dibujo para trabajar con objetos de dibujo, y que puede seguir usándose como ayuda de la organización con varios objetos o para añadir conectores entre formas. Que sea obligatorio para cualquier forma contradice la nota, que dice que ya no hace falta. Que sea necesario con formas con texto contradice la nota: las formas son objetos de dibujo, y la nota dice que ya no hace falta lienzo para trabajar con ellos, lleven texto o no. Que se haya eliminado contradice la nota, que dice que puede seguir usándose."
  citation: "fuente: `ms-word-lienzo-dibujo.html`; «Agregar un dibujo a un documento»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-lienzo-dibujo-html
- id: m02-l08-q278
  prompt:
    es: "¿Cuál de los siguientes comandos del grupo Organizar de la pestaña Formato de forma de Word 365 ofrece una amplia variedad de comandos de alineación?"
  options:
  - id: a
    text:
      es: "Agrupar"
  - id: b
    text:
      es: "Editar forma"
  - id: c
    text:
      es: "Efectos de formas"
  - id: d
    correct: true
    text:
      es: "Alinear"
  explanation:
    es: "La página indica que en el grupo Organizar, el comando Alinear permite elegir entre una amplia variedad de comandos de alineación. Agrupar, del mismo grupo, hace que las formas seleccionadas se traten como un único objeto. Editar forma pertenece al grupo Insertar formas y sirve para cambiar una forma por otra. Efectos de formas pertenece al grupo Estilos de forma y añade efectos de sombra o tridimensionales."
  citation: "fuente: `ms-word-lienzo-dibujo.html`; «Agregar un dibujo a un documento»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-grafico-html
- id: m02-l08-q279
  prompt:
    es: "En Word 365, ¿qué permite hacer el botón Opciones de diseño que aparece junto a la esquina superior de un gráfico recién insertado?"
  options:
  - id: a
    text:
      es: "Cambiar rápidamente el color o el estilo del gráfico"
  - id: b
    correct: true
    text:
      es: "Organizar el gráfico y el texto en el documento"
  - id: c
    text:
      es: "Ver opciones avanzadas para mostrar u ocultar datos del gráfico"
  - id: d
    text:
      es: "Mostrar, ocultar o dar formato a títulos de eje o etiquetas de datos"
  explanation:
    es: "La página dice que el botón Opciones de diseño sirve para organizar el gráfico y el texto en el documento. Cambiar rápidamente el color o el estilo es la función del botón Estilos de gráfico. Las opciones avanzadas que muestran u ocultan datos son las del botón de filtros de gráfico. Mostrar, ocultar o dar formato a elementos como los títulos de eje o las etiquetas de datos corresponde al primero de los botones que aparecen junto al gráfico."
  citation: "fuente: `ms-word-grafico.html`; «Agregar un gráfico al documento en Word»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-word-nuevos-usuarios-html
- id: m02-l08-q280
  prompt:
    es: "¿Cuál de los siguientes botones del grupo Fuente de la pestaña Inicio de Word 365 deja el texto seleccionado solo como texto sin formato?"
  options:
  - id: a
    text:
      es: "Cambiar mayúsculas y minúsculas"
  - id: b
    text:
      es: "Efectos de texto y tipografía"
  - id: c
    correct: true
    text:
      es: "Borrar todo el formato"
  - id: d
    text:
      es: "Color de resaltado del texto"
  explanation:
    es: "La página describe Borrar todo el formato como el botón que borra todo el formato del texto seleccionado y deja solo el texto sin formato. Cambiar mayúsculas y minúsculas cambia el texto seleccionado a mayúsculas, minúsculas u otras mayúsculas comunes. Efectos de texto y tipografía aplica un efecto visual, como sombra, iluminado o reflejo. Color de resaltado del texto hace que el texto parezca marcado con un lápiz de resaltado."
  citation: "fuente: `ms-word-nuevos-usuarios.html`; «Word para usuarios nuevos»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-nuevos-usuarios-html
- id: m02-l08-q281
  prompt:
    es: "¿Cuál de los siguientes botones del grupo Fuente de Word 365 dibuja una línea por la mitad del texto seleccionado?"
  options:
  - id: a
    correct: true
    text:
      es: "Tachado"
  - id: b
    text:
      es: "Subrayado"
  - id: c
    text:
      es: "Subíndice"
  - id: d
    text:
      es: "Superíndice"
  explanation:
    es: "La página describe Tachado como el botón que dibuja una línea por la mitad del texto seleccionado. Subrayado dibuja la línea debajo del texto. Subíndice crea caracteres de subíndice. Superíndice crea caracteres de superíndice."
  citation: "fuente: `ms-word-nuevos-usuarios.html`; «Word para usuarios nuevos»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-tablas-tamano-html
- id: m02-l08-q285
  prompt:
    es: "En Word 365, ¿qué ajusta automáticamente la opción Autoajustar ventana del grupo Tamaño de celda de la pestaña Diseño de tabla?"
  options:
  - id: a
    text:
      es: "El ancho de las columnas al tamaño de su contenido"
  - id: b
    text:
      es: "Nada, porque impide que la tabla o las columnas se ajusten de ancho"
  - id: c
    text:
      es: "El tamaño de las columnas seleccionadas, que quedan iguales"
  - id: d
    correct: true
    text:
      es: "El ancho de la tabla"
  explanation:
    es: "La página dice que, para ajustar el ancho de la tabla automáticamente, se selecciona Autoajustar ventana. Ajustar el ancho de columna al contenido es lo que hace Autoajustar contenido. Impedir el ajuste automático del ancho es la función de Ancho de columna fijo. Igualar el tamaño de las columnas seleccionadas es la función de Distribuir columnas."
  citation: "fuente: `ms-word-tablas-tamano.html`; «Cambiar el tamaño de una tabla, una columna o una fila»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-word-indice-html
- id: m02-l08-q290
  prompt:
    es: "En Word 365, ¿qué enumera un índice, según la página de Microsoft sobre cómo crearlo?"
  options:
  - id: a
    correct: true
    text:
      es: "Los términos y temas del documento con las páginas en que aparecen"
  - id: b
    text:
      es: "Los títulos del documento con su número de página, como la tabla de contenido"
  - id: c
    text:
      es: "Las notas al pie y al final del documento con su número de página"
  - id: d
    text:
      es: "Los términos del documento ordenados por fecha, con su número de página"
  explanation:
    es: "La página dice que un índice enumera los términos y temas que se tratan en un documento, junto con las páginas en las que aparecen. Una lista de títulos es la tabla de contenido, que según su página se basa en los títulos del documento. Las notas al pie van en la parte inferior de la página y las notas al final al final del documento; no forman el índice. Las entradas del índice no se ordenan por fecha: la página dice que Word las ordena alfabéticamente."
  citation: "fuente: `ms-word-indice.html`; «Crear y actualizar un índice»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-subrayar-html
- id: m02-l08-q297
  prompt:
    es: "En Word 365, ¿qué recomienda la página de Microsoft para crear un subrayado en blanco en un formulario en línea, de modo que la línea se mantenga en su sitio al escribir?"
  options:
  - id: a
    text:
      es: "Aplicar el formato de subrayado a los caracteres de tabulación de la línea"
  - id: b
    text:
      es: "Pulsar varias veces seguidas Mayús+Guion en la línea en blanco"
  - id: c
    correct: true
    text:
      es: "Insertar una celda de tabla con el borde inferior activado"
  - id: d
    text:
      es: "Elegir Solo palabras en la lista Estilo de subrayado del cuadro Fuente"
  explanation:
    es: "La página recomienda, para un documento o formulario en línea, insertar una celda de tabla con el borde inferior activado, porque así la línea se mantiene en su sitio cuando alguien escribe. Subrayar caracteres de tabulación es el método que la página da para un documento impreso. Pulsar Mayús+Guion es difícil de alinear, según la página, por ejemplo en un formulario para rellenar. Solo palabras subraya las palabras pero no los espacios entre ellas, así que no crea una línea en blanco."
  citation: "fuente: `ms-word-subrayar.html`; «Subrayar texto o espacios»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-subrayar-html
- id: m02-l08-q298
  prompt:
    es: "En Word 365, con la opción Autoformato que transforma los caracteres de subrayado en líneas de borde, ¿qué ocurre al pulsar Mayús+Guion tres o más veces seguidas?"
  options:
  - id: a
    text:
      es: "Se subrayan solo tres espacios en blanco, perfectamente alineados"
  - id: b
    correct: true
    text:
      es: "Se produce una línea que amplía el ancho del párrafo"
  - id: c
    text:
      es: "Se aplica un subrayado doble al párrafo entero"
  - id: d
    text:
      es: "Se inserta una celda de tabla con el borde inferior activado"
  explanation:
    es: "La página dice que, con esa opción activada, pulsar Mayús+Guion tres o más veces seguidas produce una línea que amplía el ancho del párrafo, que puede no ser lo que se quiere. Subrayar solo tres espacios perfectamente alineados contradice esa línea de ancho completo, y la página avisa de que alinear subrayados así es difícil. El subrayado doble se obtiene con la lista Estilo de subrayado del cuadro Fuente. La celda de tabla con borde inferior es otro método, que se hace con Insertar › Tabla."
  citation: "fuente: `ms-word-subrayar.html`; «Subrayar texto o espacios»"
  difficulty: 3
  tags:
  - "comportamiento"
