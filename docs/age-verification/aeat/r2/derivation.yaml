# R2 (aeat-agentes-hacienda), common part: programme phrase → C1/C2 lesson sections copied verbatim by
# tools/derive_draft.py. C2 first (already cut to an exam of this depth), C1 where C2 lacks the section. A section
# is cut when the AEAT programme does not name it and no AEAT question (OEP 2020–2025) asked its facts. `new` items
# are what neither course has: a Sonnet writer drafts them from this course's snapshot. Selectors: see the script.

