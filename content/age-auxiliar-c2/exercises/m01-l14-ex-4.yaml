# anchor: boe-a-1986-1216-art-36
- id: m01-l14-q224
  prompt:
    es: "Un funcionario recibe la notificación del pliego de cargos el lunes, 5 de abril de 2027, sin festivos en los días siguientes. El último día del plazo para contestarlo es:"
  options:
  - id: a
    text:
      es: "El jueves, 15 de abril de 2027."
  - id: b
    text:
      es: "El viernes, 16 de abril de 2027."
  - id: c
    correct: true
    text:
      es: "El lunes, 19 de abril de 2027."
  - id: d
    text:
      es: "El lunes, 26 de abril de 2027."
  explanation:
    es: "El artículo 36 del Real Decreto 33/1986 da diez días, que son hábiles por el artículo 30.2 de la Ley 39/2015. Se cuentan desde el martes 6 de abril: del martes 6 al viernes 9 van cuatro; del lunes 12 al viernes 16, nueve; el décimo es el lunes 19 de abril de 2027. El jueves 15 sale de contar días naturales. El viernes 16 cuenta como primero el día de la notificación. El lunes 26 son quince días hábiles."
