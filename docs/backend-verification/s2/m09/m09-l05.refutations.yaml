m09-l05-q01:
  key:
    anchor: paper-oneil-lsm-tree#p4
    sentence: The operation of inserting an index entry into the memory resident C0 tree has no I/O cost.
  wrong:
  - option: Into the disk-resident C1 tree, at the cost of one page write
    anchor: paper-oneil-lsm-tree#p4
    sentence: The index entry for the History row is then inserted into the memory resident C0 tree
  - option: Into the memory-resident C0 tree, at the cost of one random disk read
    anchor: paper-oneil-lsm-tree#p4
    sentence: The operation of inserting an index entry into the memory resident C0 tree has no I/O cost.
  - option: Into the C0 and C1 trees at once, at the cost of one page write each
    anchor: paper-oneil-lsm-tree#p4
    sentence: after which it will in time migrate out to the C1 tree on disk
m09-l05-q02:
  key:
    anchor: pg-indexes-types#INDEXES-TYPES-BTREE
    sentence: The optimizer can also use a B-tree index for queries involving the pattern matching operators LIKE and ~ if the pattern is a constant and is anchored to the beginning of the string
  wrong:
  - option: '`col LIKE ''%bar''`, because the pattern ends with a constant'
    anchor: pg-indexes-types#INDEXES-TYPES-BTREE
    sentence: but not col LIKE '%bar'
  - option: '`col ILIKE ''foo%''`, because case-insensitive patterns are always supported'
    anchor: pg-indexes-types#INDEXES-TYPES-BTREE
    sentence: but only if the pattern starts with non-alphabetic characters
  - option: '`col ~ ''bar$''`, because a regular expression anchored at its end is supported'
    anchor: pg-indexes-types#INDEXES-TYPES-BTREE
    sentence: if the pattern is a constant and is anchored to the beginning of the string
m09-l05-q03:
  key:
    anchor: redis-persistence#how-durable-is-the-append-only-file
    sentence: The suggested (and default) policy is to fsync every second.
  wrong:
  - option: '`appendfsync always`, which may lose 1 second of data'
    anchor: redis-persistence#how-durable-is-the-append-only-file
    sentence: The suggested (and default) policy is to fsync every second.
    exclusive: true
  - option: '`appendfsync no`, which may lose 1 second of data'
