- id: g-bean-post-processor
  term:
    en: BeanPostProcessor
  definition:
    en: The BeanPostProcessor interface defines callback methods that you can implement to provide your own (or override the container’s default) instantiation logic, dependency resolution logic, and so forth.
  origin: m05-l01
  citation: spring-fw-beans-factory-extension#beans-factory-extension-bpp
- id: g-prototype-scope
  term:
    en: prototype scope
  definition:
    en: The non-singleton prototype scope of bean deployment results in the creation of a new bean instance every time a request for that specific bean is made.
  origin: m05-l01
  citation: spring-fw-beans-factory-scopes#beans-factory-scopes-prototype
- id: g-circular-dependency
  term:
    en: circular dependency
  definition:
    en: A circular dependency between bean A and bean B forces one of the beans to be injected into the other prior to being fully initialized itself.
  origin: m05-l01
  citation: spring-fw-beans-dependencies-factory-collaborators#beans-dependency-resolution
