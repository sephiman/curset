# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q316
  prompt:
    es: "Según la ayuda de Microsoft sobre el Explorador de archivos de Windows 11, ¿cómo se comparte un archivo?"
  options:
  - id: a
    correct: true
    text:
      es: "Seleccionándolo y eligiendo Compartir en la cinta de opciones"
  - id: b
    text:
      es: "Seleccionándolo y eligiendo Cortar en la cinta de opciones y Pegar en otra ubicación"
  - id: c
    text:
      es: "Con clic derecho y la opción Anclar a acceso rápido"
  - id: d
    text:
      es: "Eligiendo Ver en la cinta y una vista de detalles"
  explanation:
    es: "Para compartir se selecciona el archivo y se elige Compartir en la cinta de opciones. Cortar sirve para mover el elemento a otra ubicación, Anclar a acceso rápido ancla una carpeta y Ver cambia cómo aparecen los elementos."
  citation: "fuente: `ms-win-explorador.html`; «Windows 11»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q069
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué combinación de teclas crea una carpeta nueva, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    text:
      es: "Ctrl+U"
  - id: b
    correct: true
    text:
      es: "Ctrl+Mayús+N"
  - id: c
    text:
      es: "Ctrl+Mayús+E"
  - id: d
    text:
      es: "Ctrl+T"
  explanation:
    es: "La tabla del Explorador asigna a Ctrl+Mayús+N «Cree una carpeta nueva». Ctrl+U abre una nueva ventana, Ctrl+T abre una pestaña nueva y Ctrl+Mayús+E expande todas las carpetas del árbol del panel de navegación."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q070
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes teclas cambia el nombre del elemento seleccionado?"
  options:
  - id: a
    text:
      es: "F3"
  - id: b
    text:
      es: "F4"
  - id: c
    text:
      es: "F5"
  - id: d
    correct: true
    text:
      es: "F2"
  explanation:
    es: "La tabla del Explorador asigna a F2 «Cambiar el nombre del elemento seleccionado». F3 busca un archivo o carpeta, F4 selecciona la barra de direcciones para cambiar la ruta actual y F5 actualiza la ventana."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q071
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué ocurre al pulsar Mayús+Supr con un archivo seleccionado?"
  options:
  - id: a
    text:
      es: "Se elimina y se mueve a la Papelera de reciclaje del equipo"
  - id: b
    text:
      es: "Se corta para pegarlo después en otra ubicación del equipo"
  - id: c
    correct: true
    text:
      es: "Se elimina permanentemente sin moverlo a la Papelera de reciclaje"
  - id: d
    text:
      es: "Se muestra su menú contextual con todas las opciones disponibles"
  explanation:
    es: "La tabla del Explorador asigna a Mayús+Supr «Eliminar permanentemente el elemento seleccionado sin moverlo a la papelera de reciclaje». Moverlo a la Papelera es lo que hacen Supr o Ctrl+D; cortar es Ctrl+X, y el menú contextual se muestra con Mayús+F10."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q072
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes combinaciones elimina el elemento seleccionado sin moverlo a la Papelera de reciclaje?"
  options:
  - id: a
    text:
      es: "Supr"
  - id: b
    text:
      es: "Ctrl+D"
  - id: c
    correct: true
    text:
      es: "Mayús+Supr"
  - id: d
    text:
      es: "Ctrl+X"
  explanation:
    es: "La tabla del Explorador asigna a Mayús+Supr «Eliminar permanentemente el elemento seleccionado sin moverlo a la papelera de reciclaje». Supr y Ctrl+D eliminan el elemento y lo mueven a la Papelera; Ctrl+X corta el elemento seleccionado para pegarlo en otro sitio."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q073
  prompt:
    es: "En el Explorador de archivos de Windows 11, según la tabla de métodos abreviados de Microsoft, pulsar Supr con un elemento seleccionado:"
  options:
  - id: a
    text:
      es: "Elimina el elemento solo si antes se ha vaciado la Papelera."
  - id: b
    text:
      es: "Elimina el elemento permanentemente, sin pasar por la Papelera."
  - id: c
    correct: true
    text:
      es: "Elimina el elemento y lo mueve a la Papelera de reciclaje."
  - id: d
    text:
      es: "Elimina los caracteres a la derecha del cursor."
  explanation:
    es: "La tabla del Explorador asigna a Ctrl+D y a Supr «Eliminar el elemento seleccionado y moverlo a la papelera de reciclaje». Eliminarlo permanentemente sin pasar por la Papelera es otra fila de la tabla, Mayús+Supr. Que solo funcione tras vaciar la Papelera contradice la fila: Supr envía el elemento a la Papelera, no la exige vacía. Y borrar caracteres a la derecha del cursor corresponde a escribir texto; con un elemento seleccionado en el Explorador, la fila de Supr es la de eliminar el elemento."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q075
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre arrastrar un archivo con el ratón en el Explorador de archivos de Windows 11 es correcta, según Microsoft?"
  options:
  - id: a
    text:
      es: "Con Mayús pulsado, al soltarlo se crea un acceso directo al original."
  - id: b
    text:
      es: "Con Ctrl pulsado, al soltarlo se crea un acceso directo al original."
  - id: c
    correct: true
    text:
      es: "Con Alt pulsado, al soltarlo se crea un acceso directo al original."
  - id: d
    text:
      es: "Con Alt pulsado, al soltarlo se crea una copia en esa ubicación."
  explanation:
    es: "La tabla del Explorador asigna a Alt+arrastrar un archivo la creación de «un acceso directo al archivo original en esa ubicación». La copia se crea arrastrando con Ctrl, no con Alt, y arrastrar con Mayús mueve el archivo; ninguna de esas dos teclas crea un acceso directo."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q076
  prompt:
    es: "En el Explorador de archivos de Windows 11, al arrastrar un archivo con Alt pulsado, ¿dónde se crea el acceso directo al archivo original?"
  options:
  - id: a
    text:
      es: "En la sección Acceso rápido del panel de navegación"
  - id: b
    text:
      es: "En el escritorio, sea cual sea el lugar del destino"
  - id: c
    text:
      es: "En la misma carpeta en la que está el original"
  - id: d
    correct: true
    text:
      es: "En la ubicación en la que se suelta el archivo"
  explanation:
    es: "La tabla del Explorador dice: «Cuando suelte el archivo, cree un acceso directo al archivo original en esa ubicación», es decir, donde se suelta. No lo crea en el escritorio, ni junto al original, ni en Acceso rápido."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q078
  prompt:
    es: "En el Explorador de archivos de Windows 11, según la tabla de métodos abreviados de Microsoft, arrastrar un archivo con el ratón manteniendo pulsada la tecla Ctrl:"
  options:
  - id: a
    text:
      es: "Cambia el tamaño de los iconos de los archivos."
  - id: b
    text:
      es: "Mueve el archivo a la ubicación donde se suelta."
  - id: c
    correct: true
    text:
      es: "Crea una copia del archivo donde se suelta."
  - id: d
    text:
      es: "Selecciona varios archivos de la ventana a la vez."
  explanation:
    es: "La tabla asigna a Ctrl y arrastrar un archivo: «Cuando suelte el archivo, cree una copia en esa ubicación». Moverlo es arrastrar con Mayús; seleccionar varios elementos se hace con Mayús y las teclas de dirección, y el tamaño de los iconos cambia con Ctrl y la rueda del ratón, no arrastrando."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
