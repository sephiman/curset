# anchor: boe-a-1995-8730-art-9
- id: m04-l04-q128
  prompt:
    es: "Un funcionario en servicios especiales como alto cargo cesa y pierde esa condición el lunes 1 de febrero de 2027. Pide el reingreso el jueves 15 de abril de 2027. Según el Real Decreto 365/1995, de 10 de marzo, ¿desde cuándo se le declara en excedencia voluntaria por interés particular?"
  options:
  - id: a
    text:
      es: "Desde el lunes 1 de marzo de 2027."
  - id: b
    correct: true
    text:
      es: "Desde el lunes 1 de febrero de 2027."
  - id: c
    text:
      es: "Desde el martes 2 de marzo de 2027."
  - id: d
    text:
      es: "Desde el jueves 15 de abril de 2027."
  explanation:
    es: "El artículo 9.1 obliga a pedir el reingreso «en el plazo de un mes» y, si no se hace, declara la excedencia voluntaria por interés particular «con efectos desde el día en que perdieron aquella condición». La petición del jueves 15 de abril llega con más de dos meses, fuera del mes se cuente como se cuente, y los efectos van al lunes 1 de febrero de 2027. El lunes 1 y el martes 2 de marzo son fechas en torno al final del mes de plazo, y el jueves 15 de abril es el día de la solicitud: ninguna es la fecha de efectos que fija el artículo."
  citation: "art. 9.1 RD 365/1995"
  difficulty: 3
  tags:
  - "fecha"
  - "efecto"
# anchor: boe-a-1995-8730-art-9
- id: m04-l04-q129
  prompt:
    es: "Una funcionaria con reserva de puesto pierde el viernes 5 de marzo de 2027 la condición que causó sus servicios especiales y pide el reingreso el lunes 22 de marzo de 2027. ¿Desde cuándo tiene efectos económicos y administrativos el reingreso?"
  options:
  - id: a
    text:
      es: "Desde el viernes 5 de marzo de 2027."
  - id: b
    text:
      es: "Desde el lunes 5 de abril de 2027."
  - id: c
    correct: true
    text:
      es: "Desde el lunes 22 de marzo de 2027."
  - id: d
    text:
      es: "Desde el jueves 22 de abril de 2027."
  explanation:
    es: "El artículo 9.1 dice que «el reingreso tendrá efectos económicos y administrativos desde la fecha de solicitud del mismo cuando exista derecho a la reserva de puesto». La solicitud es del lunes 22 de marzo de 2027, dentro del mes. El viernes 5 de marzo es el día en que perdió la condición. El lunes 5 de abril es un mes después de esa pérdida, y el jueves 22 de abril, un mes después de la solicitud: ninguno es la fecha que fija el artículo."
  citation: "art. 9.1 RD 365/1995"
  difficulty: 3
  tags:
  - "fecha"
  - "efecto"
# anchor: boe-a-1995-8730-art-9
- id: m04-l04-q130
  prompt:
    es: "Quienes pierdan la condición por la que fueron declarados en servicios especiales deben solicitar el reingreso al servicio activo:"
  options:
  - id: a
    text:
      es: "En el plazo de veinte días hábiles."
  - id: b
    text:
      es: "En el plazo de dos meses."
  - id: c
    text:
      es: "En el plazo de tres meses."
  - id: d
    correct: true
    text:
      es: "En el plazo de un mes."
  explanation:
    es: "El artículo 9.1 dice que «deberán solicitar el reingreso al servicio activo en el plazo de un mes». Los veinte días hábiles, los dos meses y los tres meses no son el plazo del artículo."
  citation: "art. 9.1 RD 365/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-88
- id: m04-l04-q131
  prompt:
    es: "De acuerdo con el artículo 88.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, se declara en servicio en otras Administraciones Públicas al funcionario de carrera que obtiene destino en una Administración distinta:"
  options:
  - id: a
    text:
      es: "Solo en virtud de los procesos de transferencias a las comunidades autónomas."
  - id: b
    text:
      es: "Mediante una comisión de servicios por un periodo superior a seis meses."
  - id: c
    text:
      es: "Por cualquier causa, incluida su designación como personal eventual."
  - id: d
    correct: true
    text:
      es: "En virtud de los procesos de transferencias o por los procedimientos de provisión de puestos."
  explanation:
    es: "El artículo 88.1 se refiere a quienes, «en virtud de los procesos de transferencias o por los procedimientos de provisión de puestos de trabajo, obtengan destino en una Administración Pública distinta». No se limita a las transferencias. La comisión de servicios es servicio activo (artículo 3.c) del Real Decreto 365/1995), y la designación como personal eventual lleva a servicios especiales si el funcionario no opta por seguir en activo (artículo 87.1.i) TREBEP)."
  citation: "art. 88.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q132
  prompt:
    es: "Una funcionaria tomó posesión el viernes 2 de septiembre de 2022 y presta servicios sin interrupción desde entonces. ¿Desde cuándo cumple el periodo mínimo de servicios para obtener la excedencia voluntaria por interés particular?"
  options:
  - id: a
    text:
      es: "Desde el lunes 2 de septiembre de 2024."
  - id: b
    correct: true
    text:
      es: "Desde el jueves 2 de septiembre de 2027."
  - id: c
    text:
      es: "Desde el martes 2 de septiembre de 2025."
  - id: d
    text:
      es: "Desde el miércoles 2 de septiembre de 2026."
  explanation:
    es: "El artículo 89.2 exige haber prestado servicios efectivos «durante un periodo mínimo de cinco años inmediatamente anteriores». Desde el viernes 2 de septiembre de 2022, los cinco años se cumplen el jueves 2 de septiembre de 2027. El lunes 2 de septiembre de 2024 da dos años, el martes 2 de septiembre de 2025, tres, y el miércoles 2 de septiembre de 2026, cuatro."
  citation: "art. 89.2 TREBEP"
  difficulty: 1
  tags:
  - "cómputo"
  - "requisito"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q133
  prompt:
    es: "Según el artículo 89.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de los siguientes periodos de servicios permite obtener la excedencia voluntaria por interés particular?"
  options:
  - id: a
    correct: true
    text:
      es: "Cinco años de servicios efectivos en cualquier Administración Pública, inmediatamente anteriores."
  - id: b
    text:
      es: "Cinco años de servicios efectivos en cualquier Administración Pública, aunque no sean inmediatamente anteriores."
  - id: c
    text:
      es: "Cinco años de servicios efectivos en el mismo cuerpo o escala, inmediatamente anteriores."
  - id: d
    text:
      es: "Cinco años de servicios en el sector público o en el privado, inmediatamente anteriores."
  explanation:
    es: "El artículo 89.2 pide servicios efectivos «en cualquiera de las Administraciones Públicas durante un periodo mínimo de cinco años inmediatamente anteriores». Los años que no son inmediatamente anteriores no sirven. El artículo no exige que sean en el mismo cuerpo o escala, y no cuenta el trabajo en el sector privado."
  citation: "art. 89.2 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q134
  prompt:
    es: "Según el artículo 89.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿a qué queda subordinada la concesión de la excedencia voluntaria por interés particular?"
  options:
  - id: a
    text:
      es: "A la existencia de crédito presupuestario para cubrir la vacante."
  - id: b
    text:
      es: "Al informe favorable de la junta de personal del centro."
  - id: c
    correct: true
    text:
      es: "A las necesidades del servicio debidamente motivadas."
  - id: d
    text:
      es: "A la previa cobertura del puesto por un funcionario interino."
  explanation:
    es: "El artículo 89.2 dice que «la concesión de excedencia voluntaria por interés particular quedará subordinada a las necesidades del servicio debidamente motivadas». No la supedita al crédito presupuestario, al informe de la junta de personal ni a que el puesto se cubra antes con un interino."
  citation: "art. 89.2 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q135
  prompt:
    es: "Según el artículo 89.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué circunstancia impide declarar al funcionario en excedencia voluntaria por interés particular?"
  options:
  - id: a
    text:
      es: "Que esté en el primer año de desempeño de su puesto actual."
  - id: b
    correct: true
    text:
      es: "Que se le esté instruyendo un expediente disciplinario."
  - id: c
    text:
      es: "Que haya disfrutado antes de otra excedencia de la misma clase."
  - id: d
    text:
      es: "Que tenga a su cargo un hijo menor de tres años."
  explanation:
    es: "El artículo 89.2 dice que la excedencia voluntaria por interés particular «no podrá declararse cuando al funcionario público se le instruya expediente disciplinario». El artículo no la impide por llevar menos de un año en el puesto, por haber disfrutado antes otra igual ni por tener un hijo menor de tres años."
  citation: "art. 89.2 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q136
  prompt:
    es: "De acuerdo con el artículo 89.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, procede declarar de oficio la excedencia voluntaria por interés particular cuando el funcionario:"
  options:
  - id: a
    text:
      es: "Rechaza el puesto que se le ofrece en un concurso de provisión al que se ha presentado."
  - id: b
    text:
      es: "Deja de reunir alguno de los requisitos del puesto de trabajo que desempeña."
  - id: c
    text:
      es: "Permanece más de seis meses en comisión de servicios en otro departamento."
  - id: d
    correct: true
    text:
      es: "Finalizada la causa de una situación distinta del servicio activo, no pide el reingreso en plazo."
  explanation:
    es: "El artículo 89.2 dice que «procederá declarar de oficio la excedencia voluntaria por interés particular cuando finalizada la causa que determinó el pase a una situación distinta a la de servicio activo, se incumpla la obligación de solicitar el reingreso». Rechazar un puesto en un concurso, dejar de reunir los requisitos del puesto o prolongar una comisión de servicios no son causas que el artículo prevea."
  citation: "art. 89.2 TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q137
  prompt:
    es: "Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, quienes se encuentren en excedencia voluntaria por interés particular:"
  options:
  - id: a
    text:
      es: "Conservan la reserva de su puesto de trabajo durante los dos primeros años."
  - id: b
    text:
      es: "Se les computa el tiempo a efectos de trienios, pero no de ascensos."
  - id: c
    text:
      es: "Perciben las retribuciones básicas durante el primer año de la excedencia."
  - id: d
    correct: true
    text:
      es: "No devengan retribuciones ni se les computa el tiempo a efectos de trienios."
  explanation:
    es: "El artículo 89.2 TREBEP dice que «no devengarán retribuciones, ni les será computable el tiempo que permanezcan en tal situación a efectos de ascensos, trienios y derechos en el régimen de Seguridad Social». La reserva del puesto durante dos años es de la excedencia por cuidado de familiares (artículo 89.4). El tiempo no computa para trienios, y no hay retribuciones básicas en ningún momento."
  citation: "art. 89.2 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1984-17387-art-29
- id: m04-l04-q138
  prompt:
    es: "Un funcionario pasa a excedencia voluntaria por interés particular el lunes 1 de marzo de 2027. Según el artículo 29.3.c) de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, ¿hasta cuándo, como mínimo, debe permanecer en ella?"
  options:
  - id: a
    text:
      es: "Hasta el miércoles 1 de marzo de 2028."
  - id: b
    text:
      es: "Hasta el viernes 1 de marzo de 2030."
  - id: c
    correct: true
    text:
      es: "Hasta el jueves 1 de marzo de 2029."
  - id: d
    text:
      es: "Hasta el lunes 1 de marzo de 2032."
  explanation:
    es: "El artículo 29.3.c) de la Ley 30/1984 dice que en esta excedencia «no se podrá permanecer menos de dos años continuados». Desde el lunes 1 de marzo de 2027, dos años llevan al jueves 1 de marzo de 2029. El miércoles 1 de marzo de 2028 es un año, el viernes 1 de marzo de 2030, tres, y el lunes 1 de marzo de 2032, cinco, que es el periodo de servicios previos y no el de permanencia. El artículo 89.2 TREBEP no fija permanencia mínima; por eso la pregunta nombra la Ley 30/1984."
  citation: "art. 29.3.c) Ley 30/1984"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q139
  prompt:
    es: "De acuerdo con el artículo 89.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los periodos mínimos de permanencia en la excedencia voluntaria por interés particular:"
  options:
  - id: a
    text:
      es: "Son de cinco años, los mismos que el periodo mínimo de servicios previos."
  - id: b
    text:
      es: "Los fija cada Ministerio en la resolución por la que concede la excedencia."
  - id: c
    correct: true
    text:
      es: "Los determinarán las leyes de Función Pública que se dicten en desarrollo del Estatuto."
  - id: d
    text:
      es: "Son de un año, prorrogable a petición del funcionario por otro año."
  explanation:
    es: "El artículo 89.2 dice que las leyes de Función Pública que se dicten en desarrollo del Estatuto podrán reducir el periodo de servicios exigido «y se determinarán los periodos mínimos de permanencia en la misma». El artículo no fija cinco años ni un año de permanencia, y no deja la decisión a cada Ministerio."
  citation: "art. 89.2 TREBEP"
  difficulty: 3
  tags:
  - "plazo"
  - "competencia"
# anchor: boe-a-1995-8730-art-16
- id: m04-l04-q140
  prompt:
    es: "Una funcionaria acredita siete años de servicios en las Administraciones Públicas. Según el artículo 16.3 del Real Decreto 365/1995, de 10 de marzo, ¿cuál es la duración máxima de cada periodo de excedencia voluntaria por interés particular que puede obtener?"
  options:
  - id: a
    text:
      es: "Quince años, el máximo absoluto que fija el reglamento."
  - id: b
    text:
      es: "Dos años, la duración mínima de cada periodo de excedencia."
  - id: c
    text:
      es: "Cinco años, los del periodo mínimo de servicios exigido."
  - id: d
    correct: true
    text:
      es: "Siete años, los mismos que los servicios que acredita."
  explanation:
    es: "El artículo 16.3 fija cada periodo en no menos de dos años continuados «ni superior a un número de años equivalente a los que el funcionario acredite haber prestado en cualquiera de las Administraciones Públicas, con un máximo de quince». Con siete años acreditados el máximo es siete. Los quince años solo operan como tope para quien acredita más. Dos años es el mínimo, no el máximo, y cinco años es el periodo de servicios para pedirla."
  citation: "art. 16.3 RD 365/1995"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-1995-8730-art-16
- id: m04-l04-q141
  prompt:
    es: "Un funcionario con veinte años de servicios pasa a excedencia voluntaria por interés particular el viernes 2 de abril de 2027. Aplicando el Real Decreto 365/1995, de 10 de marzo, ¿cuál es la fecha más tardía en que puede terminar ese periodo?"
  options:
  - id: a
    correct: true
    text:
      es: "El miércoles 2 de abril de 2042."
  - id: b
    text:
      es: "El lunes 2 de abril de 2029."
  - id: c
    text:
      es: "El viernes 2 de abril de 2032."
  - id: d
    text:
      es: "El martes 2 de abril de 2047."
  explanation:
    es: "El artículo 16.3 limita cada periodo a los años de servicios acreditados «con un máximo de quince». Con veinte años acreditados rige el tope: desde el viernes 2 de abril de 2027, quince años llevan al miércoles 2 de abril de 2042. El lunes 2 de abril de 2029 corresponde a los dos años mínimos, el viernes 2 de abril de 2032 a cinco años y el martes 2 de abril de 2047 a veinte años, que superan el tope."
  citation: "art. 16.3 RD 365/1995"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8730-art-16
- id: m04-l04-q142
  prompt:
    es: "Según el artículo 16.4 del Real Decreto 365/1995, de 10 de marzo, la falta de petición de reingreso dentro del plazo máximo fijado en la resolución de excedencia voluntaria por interés particular comporta:"
  options:
  - id: a
    correct: true
    text:
      es: "La pérdida de la condición de funcionario."
  - id: b
    text:
      es: "La declaración de oficio en excedencia forzosa."
  - id: c
    text:
      es: "La prórroga automática de la excedencia por dos años."
  - id: d
    text:
      es: "El pase de oficio a la expectativa de destino."
  explanation:
    es: "El artículo 16.4 dice que «la falta de petición de reingreso al servicio activo dentro de dicho plazo comportará la pérdida de la condición de funcionario». No lleva a la excedencia forzosa ni a la expectativa de destino, y no hay prórroga automática. Esa causa de pérdida no está en el artículo 63 TREBEP; por eso la pregunta nombra el reglamento."
  citation: "art. 16.4 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q143
  prompt:
    es: "De acuerdo con el artículo 89.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la excedencia voluntaria por agrupación familiar puede concederse al funcionario cuyo cónyuge resida en otra localidad por desempeñar allí un puesto:"
  options:
  - id: a
    text:
      es: "Como funcionario interino o como personal laboral temporal."
  - id: b
    text:
      es: "Con carácter provisional como funcionario de carrera tras un concurso."
  - id: c
    text:
      es: "De cualquier clase, siempre que sea en la misma comunidad autónoma que el suyo."
  - id: d
    correct: true
    text:
      es: "De carácter definitivo como funcionario de carrera o como laboral fijo."
  explanation:
    es: "El artículo 89.3 exige que el cónyuge haya obtenido y desempeñe «un puesto de trabajo de carácter definitivo como funcionario de carrera o como laboral fijo» en las Administraciones Públicas y demás entidades que enumera. No sirven el interino, el laboral temporal ni el puesto provisional. Tampoco cualquier puesto, y el artículo no exige la misma comunidad autónoma."
  citation: "art. 89.3 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q144
  prompt:
    es: "¿Qué periodo previo de servicios efectivos se exige al funcionario de carrera para concederle la excedencia voluntaria por agrupación familiar?"
  options:
  - id: a
    text:
      es: "Cinco años de servicios efectivos inmediatamente anteriores."
  - id: b
    correct: true
    text:
      es: "Se concede sin exigir el periodo mínimo de servicios efectivos."
  - id: c
    text:
      es: "Dos años de servicios efectivos en cualquier Administración."
  - id: d
    text:
      es: "Un año de servicios efectivos en el puesto de trabajo que se ocupa."
  explanation:
    es: "El artículo 89.3 dice que «podrá concederse la excedencia voluntaria por agrupación familiar sin el requisito de haber prestado servicios efectivos en cualquiera de las Administraciones Públicas durante el periodo establecido». Los cinco años son el requisito de la excedencia por interés particular. Los dos años y el año en el puesto no figuran en el artículo."
  citation: "art. 89.3 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q145
  prompt:
    es: "El cónyuge de un funcionario obtiene en Bruselas un puesto definitivo como funcionario de la Unión Europea. Según el artículo 89.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿puede obtener la excedencia por agrupación familiar?"
  options:
  - id: a
    text:
      es: "No, porque el cónyuge debe estar destinado en una Administración española."
  - id: b
    text:
      es: "Sí, pero solo después de cinco años de servicios efectivos previos."
  - id: c
    correct: true
    text:
      es: "Sí, porque el artículo incluye los puestos en la Unión Europea."
  - id: d
    text:
      es: "No, porque la otra localidad debe estar en territorio español."
  explanation:
    es: "El artículo 89.3 enumera, entre los destinos del cónyuge, los de las Administraciones Públicas, los Órganos Constitucionales y del Poder Judicial, «así como en la Unión Europea o en organizaciones internacionales». No exige destino en una Administración española ni una localidad en España. La agrupación familiar se concede sin el periodo mínimo de servicios."
  citation: "art. 89.3 TREBEP"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q146
  prompt:
    es: "En la excedencia voluntaria por agrupación familiar del funcionario de carrera, el tiempo de permanencia en la situación:"
  options:
  - id: a
    text:
      es: "Computa a efectos de trienios, pero no a efectos de ascensos."
  - id: b
    text:
      es: "Computa a todos los efectos durante los dos primeros años."
  - id: c
    correct: true
    text:
      es: "No computa a efectos de ascensos, trienios ni derechos de Seguridad Social."
  - id: d
    text:
      es: "Computa a efectos de Seguridad Social, pero no de trienios."
  explanation:
    es: "El artículo 89.3 TREBEP dice que quienes estén en esta excedencia «no devengarán retribuciones, ni les será computable el tiempo que permanezcan en tal situación a efectos de ascensos, trienios y derechos en el régimen de Seguridad Social». No computa para trienios ni para Seguridad Social, y no hay dos primeros años con cómputo pleno. El artículo 19 del Real Decreto 365/1995 tampoco computa el tiempo de las excedencias voluntarias para trienios."
  citation: "art. 89.3 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-17
- id: m04-l04-q147
  prompt:
    es: "Según el artículo 17 del Real Decreto 365/1995, de 10 de marzo, la excedencia voluntaria por agrupación familiar puede concederse con una duración:"
  options:
  - id: a
    text:
      es: "Mínima de dos años y máxima de cinco."
  - id: b
    correct: true
    text:
      es: "Mínima de dos años y máxima de quince."
  - id: c
    text:
      es: "Mínima de un año y máxima de quince."
  - id: d
    text:
      es: "Sin mínimo y con una máxima de tres años."
  explanation:
    es: "El artículo 17.1 dice que podrá concederse «con una duración mínima de dos años y máxima de quince». Cinco años de máximo, un año de mínimo y la ausencia de mínimo con tres años de máximo no son las cifras del artículo. El artículo 89.3 TREBEP no fija duración; por eso la pregunta nombra el reglamento."
  citation: "art. 17 RD 365/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1995-8730-art-17
- id: m04-l04-q148
  prompt:
    es: "Un funcionario pasa a excedencia voluntaria por agrupación familiar el viernes 2 de julio de 2027. Según el Real Decreto 365/1995, de 10 de marzo, ¿antes de qué fecha debe pedir el reingreso para que no se le declare de oficio en excedencia por interés particular?"
  options:
  - id: a
    text:
      es: "Antes del lunes 2 de julio de 2029."
  - id: b
    text:
      es: "Antes del martes 2 de julio de 2030."
  - id: c
    text:
      es: "Antes del viernes 2 de julio de 2032."
  - id: d
    correct: true
    text:
      es: "Antes del miércoles 2 de julio de 2042."
  explanation:
    es: "El artículo 17.2 dice que «antes de finalizar el período de quince años de duración de esta situación deberá solicitarse el reingreso al servicio activo, declarándose, de no hacerlo, de oficio la situación de excedencia voluntaria por interés particular». Desde el viernes 2 de julio de 2027, quince años llevan al miércoles 2 de julio de 2042. El lunes 2 de julio de 2029 corresponde a la duración mínima de dos años, y el martes 2 de julio de 2030 y el viernes 2 de julio de 2032, a tres y cinco años, que el artículo no fija."
  citation: "art. 17 RD 365/1995"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q149
  prompt:
    es: "Según el artículo 89.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿en cuál de los siguientes casos puede concederse la excedencia voluntaria por agrupación familiar?"
  options:
  - id: a
    correct: true
    text:
      es: "Su cónyuge es laboral fijo, con destino definitivo, en un organismo público de otra localidad."
  - id: b
    text:
      es: "Su cónyuge trabaja con contrato indefinido en una empresa privada de otra localidad."
  - id: c
    text:
      es: "Su cónyuge ejerce la abogacía por cuenta propia en un despacho de otra localidad."
  - id: d
    text:
      es: "Su cónyuge es funcionario interino en un ayuntamiento de otra localidad."
  explanation:
    es: "El artículo 89.3 exige que el cónyuge desempeñe un puesto definitivo «como funcionario de carrera o como laboral fijo en cualquiera de las Administraciones Públicas, organismos públicos y entidades de derecho público dependientes o vinculados a ellas», o en los demás órganos que enumera. Una empresa privada y el ejercicio por cuenta propia no están en la lista. El funcionario interino no es funcionario de carrera ni laboral fijo."
  citation: "art. 89.3 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q150
  prompt:
    es: "Una funcionaria tiene un hijo el jueves 10 de junio de 2027 y pide la excedencia para su cuidado. ¿Hasta qué fecha puede durar como máximo esa excedencia?"
  options:
  - id: a
    text:
      es: "Hasta el 10 de junio de 2028."
  - id: b
    text:
      es: "Hasta el 10 de junio de 2029."
  - id: c
    text:
      es: "Hasta el 10 de junio de 2031."
  - id: d
    correct: true
    text:
      es: "Hasta el 10 de junio de 2030."
  explanation:
    es: "El artículo 89.4 da derecho a una excedencia «de duración no superior a tres años para atender al cuidado de cada hijo», a contar «desde la fecha de nacimiento». Desde el 10 de junio de 2027, tres años llevan al 10 de junio de 2030. Las fechas de 2028 y 2029 dan uno y dos años, y la de 2031 cuatro años, más que el máximo."
  citation: "art. 89.4 TREBEP"
  difficulty: 1
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-11719-art-89
- id: m04-l04-q151
  prompt:
    es: "Un funcionario adopta a un niño nacido en 2024; la resolución judicial de adopción es del lunes 2 de febrero de 2026. Según el artículo 89.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿hasta qué fecha puede durar como máximo la excedencia para su cuidado?"
  options:
  - id: a
    text:
      es: "Hasta el 2 de febrero de 2027."
  - id: b
    text:
      es: "Hasta el 2 de febrero de 2028."
  - id: c
    text:
      es: "Hasta el 2 de febrero de 2030."
  - id: d
    correct: true
    text:
      es: "Hasta el 2 de febrero de 2029."
  explanation:
    es: "En la adopción, los tres años del artículo 89.4 se cuentan desde «la resolución judicial o administrativa». Desde el lunes 2 de febrero de 2026, tres años llevan al 2 de febrero de 2029. Las fechas de 2027 y 2028 dan uno y dos años, y la de 2030 cuatro años, más que el máximo."
  citation: "art. 89.4 TREBEP"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-11719-art-89
