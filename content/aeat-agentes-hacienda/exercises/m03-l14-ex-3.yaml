# anchor: boe-a-2003-23186-art-218
- id: m03-l14-q0027
  prompt:
    es: "Según el artículo 218.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, fuera de los casos de los artículos 217 y 220, la Administración tributaria no puede anular sus propios actos y resoluciones:"
  options:
  - id: a
    text:
      es: "Una vez transcurrido el plazo de prescripción."
  - id: b
    text:
      es: "En beneficio de los interesados."
  - id: c
    correct: true
    text:
      es: "En perjuicio de los interesados."
  - id: d
    text:
      es: "Sin dictamen del Consejo de Estado."
  explanation:
    es: "La prohibición del artículo 218.1 se refiere a anular en perjuicio de los interesados. En beneficio de ellos la Administración sí puede revocar (art. 219). El dictamen del Consejo de Estado es propio de la nulidad, y la prescripción limita la revocación y la rectificación, no esta regla."
  citation: "art. 218.1 LGT"
  difficulty: 1
  tags:
  - "lesividad"
# anchor: boe-a-2003-23186-art-218
- id: m03-l14-q0028
  prompt:
    es: "Respecto a la declaración de lesividad regulada en el artículo 218.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    correct: true
    text:
      es: "La Administración puede declarar lesivos para el interés público sus actos favorables a los interesados para impugnarlos después ante la jurisdicción contencioso-administrativa."
  - id: b
    text:
      es: "La Administración puede declarar lesivos solo los actos nulos de pleno derecho que hayan puesto fin a la vía administrativa."
  - id: c
    text:
      es: "La Administración puede declarar lesivos sus actos desfavorables a los interesados para anularlos directamente en vía administrativa."
  - id: d
    text:
      es: "La Administración puede declarar lesivos sus actos favorables para anularlos por sí misma, sin acudir a la vía contencioso-administrativa."
  explanation:
    es: "La lesividad recae sobre actos favorables a los interesados que infringen el ordenamiento y su finalidad es impugnarlos después en vía contencioso-administrativa. No sirve para actos desfavorables, y la Administración no los anula por sí misma. Y los actos nulos de pleno derecho se tratan por el procedimiento del artículo 217."
  citation: "art. 218.1 LGT"
  difficulty: 3
  tags:
  - "lesividad"
# anchor: boe-a-2003-23186-art-218
- id: m03-l14-q0029
  prompt:
    es: "De acuerdo con el artículo 218.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la declaración de lesividad no puede adoptarse una vez transcurridos cuatro años desde que:"
  options:
  - id: a
    text:
      es: "Se inició el procedimiento de declaración de lesividad."
  - id: b
    text:
      es: "Se dictó el acto administrativo, aunque no se haya notificado."
  - id: c
    correct: true
    text:
      es: "Se notificó el acto administrativo."
  - id: d
    text:
      es: "Se interpuso el recurso contencioso-administrativo."
  explanation:
    es: "El plazo de cuatro años del artículo 218.2 se cuenta desde la notificación del acto. No se cuenta desde que se dictó sin notificarlo, ni desde el inicio del procedimiento, que tiene su propio plazo de caducidad de tres meses. El recurso contencioso es posterior a la declaración."
  citation: "art. 218.2 LGT"
  difficulty: 2
  tags:
  - "lesividad"
  - "plazo"
# anchor: boe-a-2003-23186-art-218
- id: m03-l14-q0030
  prompt:
    es: "Una resolución favorable a Hugo Prieto Nava se le notificó el 3 de noviembre de 2021. La Administración tributaria adopta el 15 de diciembre de 2025 una declaración de lesividad de ese acto. Según el artículo 218.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede adoptarla en esa fecha?"
  options:
  - id: a
    text:
      es: "Sí, porque el plazo se cuenta desde la fecha en que se adopta el acuerdo de inicio."
  - id: b
    text:
      es: "Sí, porque el plazo de cuatro años solo rige para los actos desfavorables."
  - id: c
    text:
      es: "No, porque la declaración de lesividad exige que haya transcurrido el plazo de prescripción."
  - id: d
    correct: true
    text:
      es: "No, porque han transcurrido más de cuatro años desde que se notificó el acto."
  explanation:
    es: "Cuatro años desde la notificación del 3 de noviembre de 2021 llevan hasta el 3 de noviembre de 2025. El 15 de diciembre de 2025 es posterior, así que la declaración ya no puede adoptarse (art. 218.2). El plazo no se cuenta desde el inicio del procedimiento ni se limita a actos desfavorables, y la lesividad recae sobre actos favorables. Y la prescripción no es requisito de la lesividad."
  citation: "art. 218.2 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "lesividad"
  - "cómputo"
# anchor: boe-a-2003-23186-art-218
- id: m03-l14-q0031
  prompt:
    es: "Conforme al artículo 218.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la declaración de lesividad exige la previa audiencia de:"
  options:
  - id: a
    text:
      es: "El Consejo de Estado y el interesado principal."
  - id: b
    text:
      es: "Los vocales del tribunal económico-administrativo competente."
  - id: c
    correct: true
    text:
      es: "Cuantos aparezcan como interesados en el procedimiento."
  - id: d
    text:
      es: "Únicamente el obligado tributario destinatario del acto."
  explanation:
    es: "El artículo 218.2 exige la audiencia previa de todos los que aparezcan como interesados, no solo del destinatario. El Consejo de Estado dictamina la nulidad, no la lesividad, y los tribunales económico-administrativos no intervienen en este trámite."
  citation: "art. 218.2 LGT"
  difficulty: 2
  tags:
  - "lesividad"
  - "audiencia"
# anchor: boe-a-2003-23186-art-218
- id: m03-l14-q0033
  prompt:
    es: "La Administración tributaria inicia el 20 de enero de 2026 un procedimiento de declaración de lesividad de un acto favorable a una sociedad. A 21 de abril de 2026 no se ha declarado la lesividad. El plazo se cuenta de fecha a fecha, sin festivos que lo alteren. Conforme al artículo 218.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento:"
  options:
  - id: a
    text:
      es: "Ha caducado, pero solo si el interesado lo solicita por escrito antes del 21 de abril."
  - id: b
    text:
      es: "Sigue vivo, porque el plazo de seis meses termina el 20 de julio de 2026."
  - id: c
    correct: true
    text:
      es: "Ha caducado, porque el plazo de tres meses terminó el 20 de abril de 2026."
  - id: d
    text:
      es: "Sigue vivo, porque el plazo de un año termina el 20 de enero de 2027."
  explanation:
    es: "El artículo 218.3 fija tres meses desde la iniciación. Contados desde el 21 de enero de 2026, terminan el lunes 20 de abril de 2026, de modo que el 21 de abril el procedimiento ha caducado. Los seis meses son el plazo de la revocación y la rectificación, y el año es el de la nulidad. La caducidad se produce por el transcurso del plazo, sin necesidad de solicitud."
  citation: "art. 218.3 LGT"
  difficulty: 3
  tags:
  - "supuesto"
  - "lesividad"
  - "cómputo"
# anchor: boe-a-2003-23186-art-218
- id: m03-l14-q0034
  prompt:
    es: "Según el artículo 218.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿a quién corresponde la declaración de lesividad en el ámbito de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Al Director General de la Agencia Estatal de Administración Tributaria."
  - id: b
    text:
      es: "Al presidente del Tribunal Económico-Administrativo Central."
  - id: c
    correct: true
    text:
      es: "Al Ministro de Hacienda."
  - id: d
    text:
      es: "Al Consejo de Ministros."
  explanation:
    es: "El artículo 218.4 atribuye la declaración de lesividad al Ministro de Hacienda en el ámbito de la Administración General del Estado. El Consejo de Ministros, el Director General de la Agencia y el presidente del Tribunal Económico-Administrativo Central no tienen esa competencia en el precepto."
  citation: "art. 218.4 LGT"
  difficulty: 1
  tags:
  - "lesividad"
  - "órgano"
# anchor: boe-a-2003-23186-art-219
- id: m03-l14-q0035
  prompt:
    es: "En relación con los supuestos de revocación del artículo 219.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    correct: true
    text:
      es: "La Administración puede revocar sus actos en beneficio de los interesados cuando en la tramitación del procedimiento se haya producido indefensión."
  - id: b
    text:
      es: "La Administración puede revocar sus actos cuando lo solicite el interesado, aunque no concurra ninguna de las causas legales."
  - id: c
    text:
      es: "La Administración puede revocar sus actos en perjuicio de los interesados cuando infrinjan manifiestamente la ley."
  - id: d
    text:
      es: "La Administración puede revocar sus actos cuando hayan pasado más de cuatro años desde su notificación."
  explanation:
    es: "El artículo 219.1 permite revocar en beneficio de los interesados, entre otros casos por indefensión en la tramitación. Revocar en perjuicio es la anulación que el artículo 218.1 prohíbe. La revocación exige una de las tres causas legales, no basta la solicitud. Y los cuatro años no son requisito, la revocación se limita por la prescripción."
  citation: "art. 219.1 LGT"
  difficulty: 3
  tags:
  - "revocación"
  - "supuestos"
# anchor: boe-a-2003-23186-art-219
- id: m03-l14-q0036
  prompt:
    es: "De acuerdo con el artículo 219.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración tributaria puede revocar sus actos en beneficio de los interesados cuando se estime que infringen:"
  options:
  - id: a
    text:
      es: "Levemente las normas de procedimiento aplicables."
  - id: b
    text:
      es: "Un criterio administrativo interno de la Administración."
  - id: c
    text:
      es: "Cualquier norma reglamentaria de desarrollo."
  - id: d
    correct: true
    text:
      es: "Manifiestamente la ley, sin necesidad de otra circunstancia."
  explanation:
    es: "La primera causa de revocación es la infracción manifiesta de la ley. Una infracción leve del procedimiento, de una norma reglamentaria o de un criterio interno no cumple la exigencia de manifiesta infracción de la ley."
  citation: "art. 219.1 LGT"
  difficulty: 1
  tags:
  - "revocación"
  - "causas"
# anchor: boe-a-2003-23186-art-219
- id: m03-l14-q0037
  prompt:
    es: "Según el artículo 219.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué prohíbe ese precepto que constituya la revocación en cualquier circunstancia?"
  options:
  - id: a
    text:
      es: "Una modificación del tipo de gravamen aplicable al obligado."
  - id: b
    correct: true
    text:
      es: "Una dispensa o exención no permitida por las normas tributarias."
  - id: c
    text:
      es: "Una suspensión de la ejecución del acto revocado."
  - id: d
    text:
      es: "Una anulación de un acto favorable al interesado."
  explanation:
    es: "El artículo 219.1 prohíbe que la revocación sea dispensa o exención no permitida por las normas tributarias, ni contraria a la igualdad, al interés público o al ordenamiento. El texto no menciona la modificación del tipo, la anulación de actos favorables ni la suspensión."
  citation: "art. 219.1 LGT"
  difficulty: 2
  tags:
  - "revocación"
  - "límites"
# anchor: boe-a-2003-23186-art-219
- id: m03-l14-q0038
  prompt:
    es: "Conforme al artículo 219.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la revocación solo es posible mientras:"
  options:
  - id: a
    text:
      es: "No haya transcurrido el plazo de seis meses desde el acto."
  - id: b
    text:
      es: "No haya adquirido firmeza el acto que se revoca."
  - id: c
    text:
      es: "No se haya interpuesto recurso contra el acto."
  - id: d
    correct: true
    text:
      es: "No haya transcurrido el plazo de prescripción."
  explanation:
    es: "El límite temporal de la revocación es la prescripción (art. 219.2). El plazo de seis meses es el que tiene la Administración para notificar la resolución, no un límite para revocar. La firmeza no impide revocar, y la interposición de un recurso tampoco lo dice el artículo."
  citation: "art. 219.2 LGT"
  difficulty: 1
  tags:
  - "revocación"
  - "prescripción"
# anchor: boe-a-2003-23186-art-219
- id: m03-l14-q0039
  prompt:
    es: "Según el artículo 219.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria y los artículos 217 a 221, ¿cuál de los siguientes procedimientos especiales de revisión se inicia siempre de oficio?"
  options:
  - id: a
    text:
      es: "La devolución de ingresos indebidos."
  - id: b
    text:
      es: "La declaración de nulidad de pleno derecho."
  - id: c
    correct: true
    text:
      es: "La revocación."
  - id: d
    text:
      es: "La rectificación de errores."
  explanation:
    es: "La revocación se inicia siempre de oficio (art. 219.3). La nulidad puede iniciarse de oficio o a instancia del interesado (art. 217.2), igual que la rectificación de errores (art. 220.1) y la devolución de ingresos indebidos (art. 221.1)."
  citation: "art. 219.3 LGT"
  difficulty: 2
  tags:
  - "revocación"
  - "inicio"
# anchor: boe-a-2003-23186-art-219
- id: m03-l14-q0040
  prompt:
    es: "De acuerdo con el artículo 219.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, es competente para declarar la revocación el órgano que se determine reglamentariamente, que debe ser:"
  options:
  - id: a
    text:
      es: "El Tribunal Económico-Administrativo Central."
  - id: b
    correct: true
    text:
      es: "Distinto del órgano que dictó el acto."
  - id: c
    text:
      es: "El superior jerárquico del que dictó el acto."
  - id: d
    text:
      es: "El mismo órgano que dictó el acto."
  explanation:
    es: "El artículo 219.3 exige que el órgano competente sea distinto del que dictó el acto. Ni coincide con el autor del acto ni se atribuye por ley al superior jerárquico o al tribunal central: lo determina el reglamento."
  citation: "art. 219.3 LGT"
  difficulty: 2
  tags:
  - "revocación"
  - "órgano"
# anchor: boe-a-2003-23186-art-219
- id: m03-l14-q0041
  prompt:
    es: "Según el artículo 219.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué debe incluirse en el expediente de revocación, además de la audiencia a los interesados?"
  options:
  - id: a
    text:
      es: "Un informe de la inspección sobre el importe de la deuda afectada."
  - id: b
    text:
      es: "Una propuesta motivada del Tribunal Económico-Administrativo Central."
  - id: c
    correct: true
    text:
      es: "Un informe del órgano con funciones de asesoramiento jurídico sobre la procedencia de la revocación."
  - id: d
    text:
      es: "Un dictamen favorable del Consejo de Estado u órgano autonómico equivalente sobre la procedencia de la revocación del acto."
  explanation:
    es: "El expediente de revocación incluye audiencia a los interesados e informe del órgano con funciones de asesoramiento jurídico. El dictamen del Consejo de Estado se exige para declarar la nulidad (art. 217.4). Ni el tribunal central ni la inspección intervienen según el artículo."
  citation: "art. 219.3 LGT"
  difficulty: 3
  tags:
  - "revocación"
  - "informe"
# anchor: boe-a-2003-23186-art-219
- id: m03-l14-q0042
  prompt:
    es: "Se notifica el 20 de enero de 2026 a una sociedad el acuerdo de iniciación de un procedimiento de revocación. El plazo se cuenta de fecha a fecha, sin festivos que lo alteren. Según el artículo 219.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración puede notificar resolución expresa hasta el:"
  options:
  - id: a
    text:
      es: "20 de enero de 2027."
  - id: b
    correct: true
    text:
      es: "20 de julio de 2026."
  - id: c
    text:
      es: "20 de abril de 2026."
  - id: d
    text:
      es: "20 de octubre de 2026."
  explanation:
    es: "El plazo es de seis meses desde la notificación del acuerdo de iniciación (art. 219.4). Contado desde el 21 de enero de 2026, termina el lunes 20 de julio de 2026. El 20 de abril sería a tres meses, el 20 de octubre a nueve y el 20 de enero de 2027 a un año, el plazo de la nulidad."
  citation: "art. 219.4 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "revocación"
  - "cómputo"
# anchor: boe-a-2003-23186-art-219
- id: m03-l14-q0043
  prompt:
    es: "En relación con el plazo del procedimiento de revocación del artículo 219.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    correct: true
    text:
      es: "Transcurridos seis meses desde la notificación del acuerdo de iniciación sin resolución expresa, se produce la caducidad del procedimiento."
  - id: b
    text:
      es: "Transcurridos tres meses desde la notificación del acuerdo de iniciación sin resolución expresa, se produce la caducidad del procedimiento."
  - id: c
    text:
      es: "Transcurridos seis meses desde la notificación del acuerdo de iniciación sin resolución expresa, se produce la desestimación por silencio administrativo."
  - id: d
    text:
      es: "Transcurrido un año desde la notificación del acuerdo de iniciación sin resolución expresa, se produce la caducidad del procedimiento."
  explanation:
    es: "En la revocación el plazo es de seis meses y el efecto es la caducidad. No hay silencio desestimatorio porque el procedimiento se inicia siempre de oficio y no hay solicitud que desestimar. Un año es el plazo de la nulidad y tres meses el de la lesividad."
  citation: "art. 219.4 LGT"
  difficulty: 3
  tags:
  - "revocación"
  - "caducidad"
# anchor: boe-a-2003-23186-art-219
- id: m03-l14-q0044
  prompt:
    es: "Conforme al artículo 219.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria y a los artículos 220.3 y 222, ¿en cuál de los siguientes casos las resoluciones que se dictan ponen fin a la vía administrativa?"
  options:
  - id: a
    text:
      es: "En el recurso de reposición."
  - id: b
    text:
      es: "En el procedimiento de rectificación de errores."
  - id: c
    correct: true
    text:
      es: "En el procedimiento de revocación de los actos de aplicación de los tributos."
  - id: d
    text:
      es: "En el procedimiento de devolución de ingresos indebidos, cuando el ingreso proviene de un acto firme."
  explanation:
    es: "El artículo 219.5 dice que las resoluciones de la revocación ponen fin a la vía administrativa. Las de rectificación de errores y devolución de ingresos indebidos son susceptibles de reposición y de reclamación económico-administrativa (arts. 220.3 y 221.6). Y la reposición es previa a la reclamación económico-administrativa."
  citation: "art. 219.5 LGT"
  difficulty: 2
  tags:
  - "revocación"
  - "vía administrativa"
