# anchor: boe-a-2003-23186-art-212
- id: m03-l13-q0214
  prompt:
    es: "Según el artículo 212.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la suspensión de las sanciones tributarias objeto de derivación de responsabilidad:"
  options:
  - id: a
    text:
      es: "Se aplica también a la deuda tributaria objeto de derivación, que queda suspendida automáticamente."
  - id: b
    correct: true
    text:
      es: "Se aplica tanto si la sanción es recurrida por el sujeto infractor como si lo es por el responsable en ejercicio del artículo 174.5."
  - id: c
    text:
      es: "Se aplica solo si la sanción es recurrida por el responsable, y no si lo es por el sujeto infractor."
  - id: d
    text:
      es: "Se aplica solo si la sanción es recurrida por el sujeto infractor, y no si lo es por el responsable."
  explanation:
    es: "El artículo 212.3 LGT aplica la suspensión a las sanciones derivadas con independencia de quién las recurra, el infractor o el responsable que ejerce el artículo 174.5. No alcanza a la deuda tributaria derivada: en ningún caso es objeto de suspensión automática por ese precepto."
  citation: "art. 212.3 LGT"
  difficulty: 3
  tags:
  - "responsabilidad"
  - "suspensión"
# anchor: boe-a-2003-23186-art-212
- id: m03-l13-q0215
  prompt:
    es: "De acuerdo con el artículo 212.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la suspensión automática de las sanciones por la interposición de un recurso o reclamación no se aplica, en ningún caso:"
  options:
  - id: a
    text:
      es: "A las sanciones recurridas por el responsable en ejercicio de lo previsto en el artículo 174.5."
  - id: b
    text:
      es: "A las sanciones pecuniarias cuya cuantía exceda de 30.000 euros, que exigen garantía."
  - id: c
    correct: true
    text:
      es: "A la deuda tributaria objeto de derivación ni a las responsabilidades por el pago de deudas previstas en el artículo 42.2."
  - id: d
    text:
      es: "A las sanciones que hayan sido reducidas por conformidad o por el pronto pago del artículo 188."
  explanation:
    es: "El artículo 212.3 LGT excluye de la suspensión automática la deuda tributaria objeto de derivación y las responsabilidades del artículo 42.2. Las sanciones reducidas siguen suspendidas, y también las recurridas por el responsable del artículo 174.5. No hay un límite de 30.000 euros."
  citation: "art. 212.3 LGT"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2004-18398-art-22
- id: m03-l13-q0251
  prompt:
    es: "De acuerdo con el artículo 22.1 del Real Decreto 2063/2004, de 15 de octubre, por el que se aprueba el Reglamento general del régimen sancionador tributario, el acuerdo de iniciación del procedimiento sancionador contendrá necesariamente, entre otras menciones, la del:"
  options:
  - id: a
    text:
      es: "Importe definitivo de la sanción que se impondrá, con las reducciones que procedan."
  - id: b
    text:
      es: "Órgano de recaudación competente para exigir el pago de la sanción impuesta."
  - id: c
    correct: true
    text:
      es: "Órgano competente para la resolución del procedimiento y la identificación del instructor."
  - id: d
    text:
      es: "Plazo de prescripción del derecho de la Administración a imponer la sanción."
  explanation:
    es: "El acuerdo de iniciación contiene necesariamente la identificación de la persona o entidad presuntamente responsable, la conducta que motiva la incoación con su posible calificación y las sanciones que pudieran corresponder, el órgano competente para la resolución y la identificación del instructor, y la indicación del derecho a formular alegaciones y a la audiencia (art. 22.1 RGRST). El importe definitivo de la sanción con sus reducciones no puede figurar todavía, porque solo se indican las sanciones que pudieran corresponder. El plazo de prescripción y el órgano de recaudación competente para el cobro no están entre las menciones del apartado."
  citation: "art. 22.1 RGRST"
  difficulty: 1
  tags:
  - "procedimiento sancionador"
  - "acuerdo de iniciación"
# anchor: boe-a-2004-18398-art-23
- id: m03-l13-q0252
  prompt:
    es: "Según el artículo 23.4 del Real Decreto 2063/2004, de 15 de octubre, por el que se aprueba el Reglamento general del régimen sancionador tributario, los interesados podrán formular alegaciones y aportar los documentos, justificaciones y pruebas que estimen convenientes en cualquier momento anterior a:"
  options:
  - id: a
    correct: true
    text:
      es: "La propuesta de resolución del procedimiento sancionador."
  - id: b
    text:
      es: "La resolución que ponga fin al procedimiento sancionador."
  - id: c
    text:
      es: "La notificación de la liquidación de la que deriva la sanción."
  - id: d
    text:
      es: "La notificación del acuerdo de iniciación del procedimiento sancionador."
  explanation:
    es: "Los interesados pueden alegar y aportar documentos, justificaciones y pruebas en cualquier momento anterior a la propuesta de resolución (art. 23.4 RGRST). No se limita al momento anterior a la liquidación, que es un acto de otro procedimiento. Tampoco llega hasta la resolución final, porque después de la propuesta solo queda el trámite de alegaciones que esta abre. Y no se cierra con la notificación del acuerdo de iniciación, que es el comienzo del procedimiento y no su límite."
  citation: "art. 23.4 RGRST"
  difficulty: 2
  tags:
  - "procedimiento sancionador"
  - "instrucción"
# anchor: boe-a-2004-18398-art-24
- id: m03-l13-q0253
  prompt:
    es: "De acuerdo con el artículo 24.2 del Real Decreto 2063/2004, de 15 de octubre, por el que se aprueba el Reglamento general del régimen sancionador tributario, cuando el órgano competente rectifique la propuesta de resolución porque cambie la calificación de una infracción de leve a grave, el interesado podrá formular alegaciones en el plazo de:"
  options:
  - id: a
    text:
      es: "5 días contados desde el siguiente a la notificación de la rectificación."
  - id: b
    text:
      es: "15 días contados desde el siguiente a la notificación de la rectificación."
  - id: c
    text:
      es: "Un mes contado desde el siguiente a la notificación de la rectificación."
  - id: d
    correct: true
    text:
      es: "10 días contados desde el siguiente a la notificación de la rectificación."
  explanation:
    es: "Si el órgano competente rectifica la propuesta de resolución porque se cambie la calificación de una infracción de leve a grave o muy grave, o de grave a muy grave, la rectificación se notifica al interesado, que puede formular alegaciones en el plazo de 10 días contados desde el siguiente a la notificación (art. 24.2 RGRST). Los 15 días son el plazo de alegaciones tras la propuesta de resolución inicial (art. 210.4 LGT y art. 23.5 RGRST), no el de la rectificación. El mes y los 5 días no figuran en el precepto."
  citation: "art. 24.2 RGRST"
  difficulty: 1
  tags:
  - "procedimiento sancionador"
  - "propuesta de resolución"
  - "plazos"
# anchor: boe-a-2004-18398-art-29
- id: m03-l13-q0254
  prompt:
    es: "Conforme al artículo 29.2 del Real Decreto 2063/2004, de 15 de octubre, por el que se aprueba el Reglamento general del régimen sancionador tributario, una vez la sanción sea firme en vía administrativa, los órganos de recaudación no iniciarán las actuaciones del procedimiento de apremio mientras no concluya el plazo para:"
  options:
  - id: a
    text:
      es: "Solicitar el aplazamiento o fraccionamiento de la sanción."
  - id: b
    correct: true
    text:
      es: "Interponer el recurso contencioso-administrativo contra la sanción."
  - id: c
    text:
      es: "Formular alegaciones frente a la propuesta de resolución."
  - id: d
    text:
      es: "Interponer el recurso de reposición contra la sanción."
  explanation:
    es: "Una vez firme la sanción en vía administrativa, no se inicia el apremio mientras no concluya el plazo para interponer el recurso contencioso-administrativo, y si durante él se comunica su interposición con petición de suspensión, esta se mantiene hasta que decida el órgano judicial (art. 29.2 RGRST). El recurso de reposición es un recurso administrativo, que ya no cabe contra una sanción firme en esa vía. El aplazamiento o fraccionamiento no es el plazo que fija la norma. Y las alegaciones frente a la propuesta de resolución son una fase anterior, de la instrucción del procedimiento sancionador."
  citation: "art. 29.2 RGRST"
  difficulty: 2
  tags:
  - "sanciones"
  - "suspensión de la ejecución"
# anchor: boe-a-2004-18398-art-20
- id: m03-l13-q0255
  prompt:
    es: "Según el artículo 20.1 del Real Decreto 2063/2004, de 15 de octubre, por el que se aprueba el Reglamento general del régimen sancionador tributario, salvo que una disposición establezca expresamente otra cosa, la atribución de competencias en el procedimiento sancionador será:"
  options:
  - id: a
    text:
      es: "La que corresponda al órgano de recaudación de la Agencia Estatal de Administración Tributaria."
  - id: b
    text:
      es: "La que determine el órgano jurisdiccional competente en cada caso concreto."
  - id: c
    correct: true
    text:
      es: "La misma que la del procedimiento de aplicación de los tributos del que derive."
  - id: d
    text:
      es: "La propia de un órgano distinto del que tramitó el procedimiento de aplicación de los tributos."
  explanation:
    es: "Salvo disposición expresa en contrario, la atribución de competencias en el procedimiento sancionador es la misma que la del procedimiento de aplicación de los tributos del que deriva (art. 20.1 RGRST). No corresponde en todo caso al órgano de recaudación. Tampoco la fija un órgano jurisdiccional. Y la norma no exige un órgano distinto del que tramitó el procedimiento de aplicación de los tributos, sino que mantiene la misma atribución."
  citation: "art. 20.1 RGRST"
  difficulty: 2
  tags:
  - "procedimiento sancionador"
  - "competencia"
