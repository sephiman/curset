# anchor: boe-a-2023-25758-art-114
- id: m04-l04-q020
  prompt:
    es: "El nombramiento de una funcionaria de carrera se publica en el «Boletín Oficial del Estado» el miércoles 3 de febrero de 2027 y supone cambio de localidad de residencia. No hay festivos en el periodo. ¿Cuál es el último día para tomar posesión?"
  options:
  - id: a
    text:
      es: "El viernes 5 de marzo de 2027."
  - id: b
    text:
      es: "El jueves 18 de febrero de 2027."
  - id: c
    text:
      es: "El miércoles 24 de febrero de 2027."
  - id: d
    correct: true
    text:
      es: "El miércoles 3 de marzo de 2027."
  explanation:
    es: "El artículo 114.12 del Real Decreto-ley 6/2023 no dice si cuenta el día de la publicación; con el artículo 30 LPAC, el cómputo empieza el día siguiente. El plazo es de un mes y, por el artículo 30.4 LPAC, se cuenta de fecha a fecha: termina el miércoles 3 de marzo de 2027, aunque febrero solo tenga 28 días. El viernes 5 de marzo de 2027 sale de tratar el mes como treinta días naturales. El jueves 18 de febrero de 2027 son los quince días naturales del nombramiento sin cambio de localidad. El miércoles 24 de febrero de 2027 sale de contar quince días hábiles."
