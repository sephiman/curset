    text:
      es: "el miércoles, 10 de marzo de 2027."
  - id: d
    text:
      es: "el viernes, 26 de febrero de 2027."
  explanation:
    es: "Las actuaciones complementarias se practican en un plazo no superior a quince días (art. 87 LPAC), hábiles según el art. 30.2 LPAC. Desde el día siguiente al miércoles 17 de febrero, el decimoquinto día hábil es el miércoles, 10 de marzo de 2027. La fecha del jueves, 4 de marzo de 2027, cuenta quince días naturales. La del martes, 9 de marzo de 2027, cuenta como primer día el de la notificación. La del viernes, 26 de febrero de 2027, corresponde a los siete días con que cuentan los interesados para alegar, no al plazo de las actuaciones."
  citation: "art. 87 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-124
- id: q22
  lesson: m03-l03
  prompt:
    es: "Conforme al artículo 124.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué fecha debe resolverse y notificarse el recurso que interpone Doña Aurora?"
  options:
  - id: a
    text:
      es: "El jueves, 22 de abril de 2027."
  - id: b
    correct: true
    text:
      es: "El viernes, 30 de abril de 2027."
  - id: c
    text:
      es: "El sábado, 1 de mayo de 2027."
  - id: d
    text:
      es: "El miércoles, 30 de junio de 2027."
  explanation:
    es: "El plazo máximo para dictar y notificar la resolución del recurso de reposición es de un mes (art. 124.2 LPAC). Se cuenta desde el día siguiente a la interposición, el miércoles 31 de marzo de 2027, y como abril no tiene día 31, termina el último día del mes (art. 30.4 LPAC): el viernes, 30 de abril de 2027, día hábil. La fecha del sábado 1 de mayo es el día siguiente, desde el que el recurso se entiende desestimado. La del jueves 22 de abril cuenta el mes desde la notificación de la resolución. La del miércoles 30 de junio aplica los tres meses de la alzada."
  citation: "art. 124.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-81
