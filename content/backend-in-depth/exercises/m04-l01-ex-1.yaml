- id: m04-l01-q08
  prompt:
    en: Among the `JSpecify` annotations that Kotlin supports, which one reverses the effect of `@NullMarked` and
      makes all types within its scope platform types?
  options:
  - id: a
    text:
      en: '`@Nullable`'
  - id: b
    text:
      en: '`@NonNull`'
  - id: c
    correct: true
    text:
      en: '`@NullUnmarked`'
  - id: d
    text:
      en: '`@NullMarked`'
  explanation:
    en: '`@NullUnmarked` reverses `@NullMarked` and makes the types in its scope platform types. `@Nullable` is
      wrong because it only marks a type as nullable. `@NonNull` is wrong because it only marks a type as non-nullable.
      `@NullMarked` is wrong because it marks all types within a scope as non-nullable by default, which is the
      effect being reversed.'
  citation: kotlin-docs-java-interop#jspecify-support
  extract:
    en: '@NullUnmarked reverses the effect of @NullMarked, making all types within the scope as platform types.'
