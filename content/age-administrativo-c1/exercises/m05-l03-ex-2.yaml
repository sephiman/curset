# anchor: boe-a-2017-12902-art-100
- id: m05-l03-q049
  prompt:
    es: "¿Qué órgano puede comprometer el gasto hasta el límite máximo que supone el presupuesto base de licitación, según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "El servicio gestor del crédito."
  - id: b
    text:
      es: "La Intervención Delegada."
  - id: c
    text:
      es: "El Ordenador general de pagos del Estado."
  - id: d
    correct: true
    text:
      es: "El órgano de contratación."
  explanation:
    es: "El artículo 100.1 habla del límite máximo de gasto que puede comprometer el órgano de contratación. El servicio gestor expide los documentos contables, pero no compromete el gasto con ese límite. La Intervención Delegada controla. El Ordenador general de pagos ordena pagos."
  citation: "art. 100.1 LCSP"
  difficulty: 1
  tags:
