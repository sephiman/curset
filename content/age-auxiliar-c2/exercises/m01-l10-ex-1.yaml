# anchor: celex-12016m-txt-art-13
- id: m01-l10-q001
  prompt:
    es: "¿Cuál de los siguientes órganos figura entre las instituciones de la Unión que enumera el Tratado de la Unión Europea?"
  options:
  - id: a
    text:
      es: "El Comité Económico y Social."
  - id: b
    text:
      es: "El Comité de las Regiones."
  - id: c
    text:
      es: "El Banco Europeo de Inversiones."
  - id: d
    correct: true
    text:
      es: "El Tribunal de Cuentas."
  explanation:
    es: "El artículo 13.1 TUE enumera siete instituciones y la última es «El Tribunal de Cuentas». El Comité Económico y Social y el Comité de las Regiones son órganos consultivos que asisten al Parlamento, al Consejo y a la Comisión (art. 13.4 TUE), no instituciones. El Banco Europeo de Inversiones tampoco está en la lista; el banco que sí es institución es el Banco Central Europeo."
  citation: "art. 13.1 TUE"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: celex-12016m-txt-art-13
- id: m01-l10-q046
  prompt:
    es: "De acuerdo con el artículo 13 del Tratado de la Unión Europea, el Parlamento Europeo, el Consejo y la Comisión estarán asistidos por:"
  options:
  - id: a
    text:
      es: "Un Comité Económico y Social y un Comité de las Regiones, que ejercerán funciones legislativas compartidas."
  - id: b
    text:
      es: "Un Comité Económico y Social y el Tribunal de Cuentas, que ejercerán funciones consultivas."
  - id: c
    correct: true
    text:
      es: "Un Comité Económico y Social y un Comité de las Regiones, que ejercerán funciones consultivas."
  - id: d
    text:
      es: "Un Comité de Representantes Permanentes y un Comité de las Regiones, que ejercerán funciones consultivas."
  explanation:
    es: "La opción correcta es la del Comité Económico y Social y el Comité de las Regiones con funciones consultivas: el artículo 13.4 TUE dice que esas tres instituciones «estarán asistidos por un Comité Económico y Social y por un Comité de las Regiones que ejercerán funciones consultivas». Los dos comités no ejercen funciones legislativas. El Tribunal de Cuentas es una institución (art. 13.1 TUE), no un comité consultivo. El Comité de Representantes Permanentes prepara los trabajos del Consejo (art. 16.7 TUE)."
  citation: "art. 13.4 TUE"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: celex-12016m-txt-art-1
- id: m01-l10-q055
  prompt:
    es: "Conforme al artículo 1 del Tratado de la Unión Europea, la Unión se fundamenta en el Tratado de la Unión Europea y en el Tratado de Funcionamiento de la Unión Europea, que tienen:"
  options:
  - id: a
    correct: true
    text:
      es: "El mismo valor jurídico."
  - id: b
    text:
      es: "Un valor jurídico superior el primero al segundo."
  - id: c
    text:
      es: "Un valor jurídico distinto según la institución que los aplique."
  - id: d
    text:
      es: "Un valor jurídico que depende de su ratificación periódica."
  explanation:
    es: "El artículo 1 declara que ambos Tratados tienen el mismo valor jurídico. Ninguno prevalece sobre el otro, su valor no cambia con la institución que los aplica y no depende de ninguna ratificación periódica."
  citation: "art. 1 TUE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: celex-12016m-txt-art-1
- id: m01-l10-q056
  prompt:
    es: "De acuerdo con el artículo 1 del Tratado de la Unión Europea, la Unión Europea sustituye y sucede, tal como establece el propio Tratado, a:"
  options:
  - id: a
    text:
      es: "El Consejo de Europa."
  - id: b
    text:
      es: "El Espacio Económico Europeo."
  - id: c
    text:
      es: "La Asociación Europea de Libre Comercio."
  - id: d
    correct: true
    text:
      es: "La Comunidad Europea."
  explanation:
    es: "El artículo 1 dice que la Unión sustituirá y sucederá a la Comunidad Europea. El Consejo de Europa, el Espacio Económico Europeo y la Asociación Europea de Libre Comercio son organizaciones o espacios distintos que la Unión no sustituye."
  citation: "art. 1 TUE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ue-consejo-html
- id: m01-l10-q057
  prompt:
    es: "A fecha de 16 de octubre de 2026, según la página del Consejo de la Unión Europea en el portal oficial de la Unión, el número de miembros actuales de la Unión Europea es de:"
  options:
  - id: a
    text:
      es: "Veintiocho Estados."
  - id: b
    text:
      es: "Veinticinco Estados."
  - id: c
    correct: true
    text:
      es: "Veintisiete Estados."
  - id: d
    text:
      es: "Treinta Estados."
  explanation:
    es: "La página oficial habla de los 27 miembros actuales. Veintiocho eran los Estados cuando se contaba al Reino Unido, que las versiones consolidadas de 2016 todavía incluyen. Veinticinco y treinta no coinciden con ninguna fecha de la lección."
  citation: "fuente: `ue-consejo.html`"
  difficulty: 1
  tags:
  - "cantidad"
