# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q250
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes teclas se desplaza hasta la parte inferior de la ventana activa, según la tabla de métodos abreviados?"
  options:
