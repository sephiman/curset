# anchor: fuente-ms-outlook-responder-reenviar-html
- id: m06-l07-q229
  prompt:
    es: "En Outlook 365 clásico, ¿a quién envía el nuevo mensaje el botón Responder y qué ocurre con los datos adjuntos?"
  options:
  - id: a
    text:
      es: "Al remitente y a todos los de Para y Cc, sin los datos adjuntos"
  - id: b
    correct: true
    text:
      es: "Solo al remitente original, sin los datos adjuntos del mensaje"
  - id: c
    text:
      es: "A un conjunto nuevo de destinatarios, con los datos adjuntos"
  - id: d
    text:
      es: "Solo al remitente original, con los datos adjuntos incluidos"
  explanation:
    es: "Responder solo envía el nuevo mensaje al remitente original y no incluye los datos adjuntos. Enviar a los de Para y Cc es Responder a todos. Incluir los datos adjuntos al responder contradice que no estén incluidos. Escribir un conjunto nuevo de destinatarios con adjuntos es Reenviar."
  citation: "fuente: `ms-outlook-responder-reenviar.html`; «Responder o reenviar un mensaje»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-responder-reenviar-html
- id: m06-l07-q230
  prompt:
    es: "En Outlook 365 clásico, ¿a quién envía el nuevo mensaje el botón Responder a todos?"
  options:
  - id: a
    correct: true
    text:
      es: "Al remitente y a todos los demás destinatarios de Para y Cc"
  - id: b
    text:
      es: "Al remitente original y solo a los destinatarios de la línea Cc"
  - id: c
    text:
      es: "Solo al remitente original, sin más destinatarios"
  - id: d
    text:
      es: "A un conjunto completamente nuevo de destinatarios elegidos"
  explanation:
    es: "Responder a todos envía el mensaje al remitente original y a todos los demás destinatarios de las líneas Para y Cc. Responder solo envía al remitente. Enviar solo a los de la línea Cc contradice que se envíe a los de las líneas Para y Cc. Escribir un conjunto completamente nuevo de destinatarios es lo que permite Reenviar."
  citation: "fuente: `ms-outlook-responder-reenviar.html`; «Responder o reenviar un mensaje»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-responder-reenviar-html
- id: m06-l07-q231
  prompt:
    es: "En Outlook 365 clásico, ¿qué permite hacer Reenviar con los destinatarios y con los datos adjuntos del mensaje original?"
  options:
  - id: a
    text:
      es: "Responder solo al remitente, sin incluir los adjuntos del original"
  - id: b
    text:
      es: "Responder al remitente y a Para y Cc, sin incluir los adjuntos"
  - id: c
    correct: true
    text:
      es: "Destinatarios nuevos, con los adjuntos incluidos de forma automática"
  - id: d
    text:
      es: "Escribir destinatarios nuevos, pero los adjuntos hay que añadirlos a mano"
  explanation:
    es: "Reenviar permite escribir un conjunto completamente nuevo de destinatarios e incluye automáticamente los adjuntos del mensaje original. Responder solo envía al remitente y no incluye adjuntos. Responder a todos envía a Para y Cc sin adjuntos. Añadir a mano los adjuntos al reenviar contradice que se incluyan automáticamente."
  citation: "fuente: `ms-outlook-responder-reenviar.html`; «Responder o reenviar un mensaje»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-responder-reenviar-html
- id: m06-l07-q232
  prompt:
    es: "En Outlook 365 clásico, ¿qué ocurre con los datos adjuntos del mensaje original al usar Responder, y puede cambiarse ese comportamiento?"
  options:
  - id: a
    text:
      es: "Se incluyen solo si se usa Responder a todos"
  - id: b
    text:
      es: "No se incluyen, pero se puede cambiar en Archivo › Opciones › Correo"
  - id: c
    text:
      es: "Se incluyen siempre, aunque se pueden quitar a mano"
  - id: d
    correct: true
    text:
      es: "No se incluyen, y no hay manera de cambiar este comportamiento"
  explanation:
    es: "Al responder, los datos adjuntos no se incluyen porque se enviaría el mismo archivo a quien lo envió, y no hay ninguna manera de cambiar este comportamiento. Cambiarlo en Archivo › Opciones › Correo contradice esa última frase. Incluirlos siempre contradice que no estén incluidos. Incluirlos con Responder a todos contradice que Responder a todos tampoco los incluya."
  citation: "fuente: `ms-outlook-responder-reenviar.html`; «¿Por qué no se incluyen datos adjuntos al responder a un mensaje?»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-responder-reenviar-html
- id: m06-l07-q233
  prompt:
    es: "En Outlook 365 clásico, ¿qué aparece delante del asunto original en un mensaje de respuesta y en un mensaje reenviado?"
  options:
  - id: a
    text:
      es: "FW: en la respuesta y RE: en el mensaje reenviado"
  - id: b
    correct: true
    text:
      es: "RE: en la respuesta y FW: en el mensaje reenviado"
  - id: c
    text:
      es: "FW: tanto en la respuesta como en el mensaje reenviado"
  - id: d
    text:
      es: "RE: tanto en la respuesta como en el mensaje reenviado"
  explanation:
    es: "El asunto de una respuesta muestra RE: delante del asunto original y los mensajes reenviados llevan FW:. Intercambiar los dos prefijos invierte la frase. Usar RE: en ambos o FW: en ambos contradice que cada acción tenga el suyo."
  citation: "fuente: `ms-outlook-responder-reenviar.html`; «Responder o reenviar un mensaje»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-responder-reenviar-html
- id: m06-l07-q235
  prompt:
    es: "En Outlook 365 clásico, ¿cómo se logra que todas las respuestas y reenvíos se abran automáticamente en una ventana nueva y no en el panel de lectura?"
  options:
  - id: a
    text:
      es: "Seleccionando el botón Emergente en cada respuesta o reenvío que se abre"
  - id: b
    text:
      es: "Archivo › Opciones › Buscar › Resultados › Buzón actual, como ámbito"
  - id: c
    text:
      es: "Archivo › Opciones › Correo › Limpieza de conversación › Examinar"
  - id: d
    correct: true
    text:
      es: "Archivo › Opciones › Correo › Abrir respuestas y reenvíos en una nueva ventana"
  explanation:
    es: "Para abrir todas las respuestas en ventana nueva se activa, en Archivo › Opciones › Correo, Respuestas y reenvíos, la casilla Abrir respuestas y reenvíos en una nueva ventana. El botón Emergente abre solo la respuesta en curso. Archivo › Opciones › Buscar fija el ámbito de búsqueda predeterminado. Limpieza de conversación fija el destino de los mensajes redundantes."
  citation: "fuente: `ms-outlook-responder-reenviar.html`; «¿Puedo tener todas las respuestas y reenvíos abiertos en una ventana nueva?»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-atajos-html
- id: m06-l07-q239
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de los siguientes métodos abreviados de teclado reenvía un mensaje con la secuencia de teclas de la cinta?"
  options:
  - id: a
    correct: true
    text:
      es: "Alt+H, F, W"
  - id: b
    text:
      es: "Alt+H, M, V"
  - id: c
    text:
      es: "Alt+H, R, A"
  - id: d
    text:
      es: "Alt+J, S"
  explanation:
    es: "Alt+H, F, W reenvía un mensaje, igual que Ctrl+F. Alt+H, R, A selecciona Responder a todos. Alt+H, M, V mueve un elemento a una carpeta de la lista. Alt, J, S lleva a la pestaña Enviar y recibir."
  citation: "fuente: `ms-outlook-atajos.html`; «Reenviar un mensaje. — Alt+H, F, W o Ctrl+F»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-recuperar-html
- id: m06-l07-q240
  prompt:
    es: "En Outlook 365, ¿qué requisitos debe cumplir un mensaje enviado para poder recuperarlo, según la ayuda de Microsoft sobre recuperar un correo?"
  options:
  - id: a
    text:
      es: "Mensaje protegido con Azure Information Protection, enviado a un destinatario de la misma organización"
  - id: b
    text:
      es: "Remitente y destinatario con cuenta de Microsoft 365 en organizaciones distintas, y mensaje sin abrir"
  - id: c
    correct: true
    text:
      es: "Cuenta profesional o educativa de Microsoft 365 de ambos en la misma organización y mensaje sin abrir"
  - id: d
    text:
      es: "Remitente y destinatario con cuenta personal de Gmail, Hotmail u Outlook.com, y mensaje sin abrir"
  explanation:
    es: "Solo se puede recuperar si el remitente y el destinatario tienen cuenta profesional o educativa de Microsoft 365 en la misma organización y el destinatario no ha abierto el mensaje. Las cuentas personales de Gmail, Hotmail y Outlook.com no pueden usar la recuperación. Organizaciones distintas contradice la misma organización. Un mensaje protegido con Azure Information Protection no se puede recuperar."
  citation: "fuente: `ms-outlook-recuperar.html`; «Resumen»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-recuperar-html
- id: m06-l07-q241
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué característica pueden usar las cuentas personales, que no admiten recuperar mensajes, para poder deshacer un envío?"
  options:
  - id: a
    correct: true
    text:
      es: "La característica de retraso Deshacer envío"
  - id: b
    text:
      es: "El comando Recuperar este mensaje de Elementos enviados"
  - id: c
    text:
      es: "La limpieza de la conversación en Elementos enviados"
  - id: d
    text:
      es: "El comando Reenviar como datos adjuntos"
  explanation:
    es: "Las cuentas personales no pueden usar la recuperación de mensajes, y para ellas la ayuda recomienda la característica de retraso Deshacer envío en el nuevo Outlook o en Outlook.com. Recuperar este mensaje es la recuperación que las cuentas personales no pueden usar. Reenviar como datos adjuntos envía el correo a otros destinatarios. La limpieza de la conversación elimina mensajes redundantes de una carpeta."
  citation: "fuente: `ms-outlook-recuperar.html`; «Resumen»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-recuperar-html
- id: m06-l07-q242
  prompt:
    es: "En Outlook 365 clásico, con la cinta clásica, ¿cuál de las siguientes rutas lleva al comando Recuperar este mensaje desde un mensaje abierto de Elementos enviados?"
  options:
  - id: a
    text:
      es: "Mensaje › Etiquetas › Más acciones de movimiento › Recuperar este mensaje"
  - id: b
    correct: true
    text:
      es: "Mensaje › Mover › Más acciones de movimiento › Recuperar este mensaje"
  - id: c
    text:
      es: "Inicio › Mover › Más acciones de movimiento › Recuperar este mensaje"
  - id: d
    text:
      es: "Mensaje › Mover › Más acciones de respuesta › Recuperar este mensaje"
  explanation:
    es: "Con la cinta clásica, el comando está en la pestaña Mensaje, grupo Mover, Más acciones de movimiento. El grupo Etiquetas contiene Categorizar y Opciones de mensaje. La pestaña Inicio contradice que se abra el mensaje y se use la pestaña Mensaje. Más acciones de respuesta es el menú de Reenviar como datos adjuntos."
  citation: "fuente: `ms-outlook-recuperar.html`; «Recuperar y reemplazar un mensaje en Outlook clásico»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-recuperar-html
- id: m06-l07-q243
  prompt:
    es: "En Outlook 365 clásico, ¿cómo debe abrirse desde Elementos enviados el mensaje enviado que se quiere recuperar?"
  options:
  - id: a
    text:
      es: "Seleccionándolo en Elementos enviados, de modo que aparezca en el panel de lectura"
  - id: b
    text:
      es: "Con doble clic desde la carpeta Bandeja de salida, donde espera la entrega"
  - id: c
    correct: true
    text:
      es: "Con doble clic en Elementos enviados; no basta con verlo en el panel de lectura"
  - id: d
    text:
      es: "Con doble clic desde la carpeta Elementos eliminados"
  explanation:
    es: "Se elige la carpeta Elementos enviados y se abre el mensaje con doble clic, porque no basta con seleccionarlo para que aparezca en el panel de lectura. Verlo solo en el panel de lectura contradice esa frase. La Bandeja de salida es la carpeta donde espera un mensaje con entrega retrasada, y no la de recuperación. Elementos eliminados contradice que se elija la carpeta Elementos enviados."
  citation: "fuente: `ms-outlook-recuperar.html`; «Recuperar y reemplazar un mensaje en Outlook clásico»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-recuperar-html
- id: m06-l07-q244
  prompt:
    es: "En Outlook 365 clásico, ¿qué hace la opción Eliminar las copias no leídas y reemplácelas con un mensaje nuevo al recuperar un mensaje?"
  options:
  - id: a
    text:
      es: "Elimina todas las copias, también las que el destinatario ya ha leído"
  - id: b
    text:
      es: "Solo reemplaza el mensaje guardado en Elementos enviados"
  - id: c
    text:
      es: "Envía el mensaje de nuevo a todos los destinatarios sin redactarlo"
  - id: d
    correct: true
    text:
      es: "Elimina las copias no leídas y permite redactar el reemplazo"
  explanation:
    es: "La opción elimina las copias no leídas y, si se envía un mensaje de reemplazo, se redacta y se selecciona Enviar. Eliminar también las leídas contradice que solo se eliminen las copias no leídas. Reemplazar solo el de Elementos enviados contradice que se actúe en los buzones de los destinatarios. Reenviarlo sin redactarlo contradice el paso de redactar el mensaje de reemplazo."
  citation: "fuente: `ms-outlook-recuperar.html`; «Recuperar y reemplazar un mensaje en Outlook clásico»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-recuperar-html
- id: m06-l07-q245
  prompt:
    es: "En Outlook 365 clásico, si una solicitud de recuperación no puede ejecutarse de inmediato, ¿durante cuánto tiempo sigue reintentándolo antes de marcar la recuperación como errónea?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta 24 horas"
  - id: b
    text:
      es: "Hasta 5 minutos"
  - id: c
    text:
      es: "Hasta 30 minutos"
  - id: d
    text:
      es: "Hasta 30 segundos"
  explanation:
    es: "Si la solicitud no puede ejecutarse de inmediato, Outlook sigue reintentándolo durante un máximo de 24 horas. Treinta segundos es lo normal para recibir la notificación del informe. Cinco minutos es lo que pueden tardar las actualizaciones de estado con unos cientos de destinatarios. Treinta minutos es el máximo para recuperar el estado con decenas de miles de destinatarios."
  citation: "fuente: `ms-outlook-recuperar.html`; «Para comprobar los recuerdos en Outlook clásico»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-outlook-recuperar-html
- id: m06-l07-q246
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué se hace en Elementos enviados para recuperar un mensaje que ya se ha enviado?"
  options:
  - id: a
    text:
      es: "Abrirlo con doble clic y elegir Cancelar envío en la cinta"
  - id: b
    text:
      es: "Seleccionarlo en la lista y elegir Reenviar en la cinta de opciones"
  - id: c
    correct: true
    text:
      es: "Abrirlo con doble clic en ventana independiente y elegir Recuperar mensaje"
  - id: d
    text:
      es: "Seleccionarlo y pulsar Retroceso para archivarlo en Archivo"
  explanation:
    es: "En el nuevo Outlook se selecciona Elementos enviados, se abre el mensaje con doble clic en una ventana independiente y se elige Recuperar mensaje en la cinta. Reenviar crea un mensaje nuevo para otros destinatarios. Cancelar envío es la opción de un mensaje programado en Borrador. Retroceso archiva el mensaje y no lo recupera."
  citation: "fuente: `ms-outlook-recuperar.html`; «Recuperar y reemplazar un mensaje en el nuevo Outlook»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-programar-envio-html
- id: m06-l07-q247
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de las siguientes afirmaciones sobre la característica Programar envío es correcta?"
  options:
  - id: a
    text:
      es: "Solo está disponible para cuentas IMAP o POP"
  - id: b
    correct: true
    text:
      es: "No está disponible para cuentas IMAP o POP en el nuevo Outlook"
  - id: c
    text:
      es: "Se activa con la casilla No entregar antes de Opciones de entrega"
  - id: d
    text:
      es: "El mensaje programado espera en la Bandeja de salida hasta la hora"
  explanation:
    es: "La nota dice que Programar envío no está disponible para cuentas IMAP o POP. Que solo esté disponible para ellas invierte esa frase. Que el mensaje espere en la Bandeja de salida contradice que permanezca en la carpeta Borrador. La casilla No entregar antes de Opciones de entrega es el procedimiento de Outlook clásico, y en el nuevo se usa el menú junto a Enviar."
  citation: "fuente: `ms-outlook-programar-envio.html`; «Programar un mensaje para más tarde en el nuevo Outlook»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-programar-envio-html
- id: m06-l07-q248
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cómo se programa un mensaje para que se envíe más tarde mientras se redacta?"
  options:
  - id: a
    text:
      es: "Opciones de mensaje › Opciones de entrega › No entregar antes"
  - id: b
    text:
      es: "Opciones › Importancia › Programar envío"
  - id: c
    text:
      es: "Archivo › Administrar reglas y alertas › Nueva regla"
  - id: d
    correct: true
    text:
      es: "Menú desplegable junto a Enviar › Programar envío"
  explanation:
    es: "En el nuevo Outlook se selecciona el menú desplegable junto a Enviar y Programar envío. Opciones de mensaje, Opciones de entrega y No entregar antes es el camino de Outlook clásico. Opciones › Importancia sirve para marcar un mensaje como importante. Administrar reglas y alertas permite retrasar la entrega de todos los mensajes con una regla."
  citation: "fuente: `ms-outlook-programar-envio.html`; «Programar un mensaje para más tarde en el nuevo Outlook»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-programar-envio-html
- id: m06-l07-q249
  prompt:
    es: "En el nuevo Outlook para Windows, un mensaje programado permanece hasta la hora de entrega en la carpeta:"
  options:
  - id: a
    text:
      es: "Bandeja de salida"
  - id: b
    text:
      es: "Elementos eliminados"
  - id: c
    correct: true
    text:
      es: "Borrador"
  - id: d
    text:
      es: "Elementos enviados"
  explanation:
    es: "En el nuevo Outlook, tras seleccionar Enviar, el mensaje permanece en la carpeta Borrador hasta la hora de entrega. La Bandeja de salida es donde permanece en Outlook clásico. Elementos enviados y Elementos eliminados contradicen que permanezca en Borrador."
  citation: "fuente: `ms-outlook-programar-envio.html`; «Programar un mensaje para más tarde en el nuevo Outlook»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-programar-envio-html
- id: m06-l07-q250
  prompt:
    es: "En Outlook 365 clásico, un mensaje con entrega retrasada permanece hasta la hora de entrega en la carpeta:"
  options:
  - id: a
    correct: true
    text:
      es: "Bandeja de salida"
  - id: b
    text:
      es: "Correo no deseado"
  - id: c
    text:
      es: "Elementos enviados"
  - id: d
    text:
      es: "Borrador"
  explanation:
    es: "En Outlook clásico, el mensaje permanece en la carpeta Bandeja de salida hasta el tiempo de entrega. Borrador es donde espera en el nuevo Outlook. Elementos enviados y Correo no deseado contradicen que permanezca en la Bandeja de salida."
  citation: "fuente: `ms-outlook-programar-envio.html`; «Programar un mensaje para más tarde en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-programar-envio-html
- id: m06-l07-q251
  prompt:
    es: "En Outlook 365 clásico, ¿qué condición debe cumplir Outlook para que funcione la entrega retrasada de un mensaje?"
  options:
  - id: a
    text:
      es: "Outlook debe estar en línea, aunque no esté conectado al servidor"
  - id: b
    text:
      es: "Outlook puede estar sin conexión, porque el servidor lo envía"
  - id: c
    text:
      es: "Outlook debe estar cerrado cuando llegue la hora"
  - id: d
    correct: true
    text:
      es: "Outlook debe estar en línea y conectado"
  explanation:
    es: "La nota dice que Outlook debe estar en línea y conectado para que la característica funcione. Que esté cerrado o sin conexión contradice esa frase. Estar en línea sin estar conectado al servidor también la contradice, porque exige las dos cosas."
  citation: "fuente: `ms-outlook-programar-envio.html`; «Programar un mensaje para más tarde en Outlook clásico para Windows»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-programar-envio-html
- id: m06-l07-q252
  prompt:
    es: "En Outlook 365 clásico, ¿qué casilla de Opciones de entrega hay que activar para retrasar el envío de un mensaje hasta una fecha y hora?"
  options:
  - id: a
    text:
      es: "Cancelar envío"
  - id: b
    correct: true
    text:
      es: "No entregar antes"
  - id: c
    text:
      es: "Programar envío"
  - id: d
    text:
      es: "Deshacer envío"
  explanation:
    es: "En Opciones de entrega se activa la casilla No entregar antes y se elige la fecha y hora. Cancelar envío es la opción del nuevo Outlook para enviar de inmediato un mensaje programado. Deshacer envío es la característica de retraso para cuentas personales. Programar envío es el comando del nuevo Outlook."
  citation: "fuente: `ms-outlook-programar-envio.html`; «Programar un mensaje para más tarde en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-programar-envio-html
- id: m06-l07-q253
  prompt:
    es: "Señale el grupo de la cinta de opciones de Outlook 365 clásico en el que está la flecha Opciones de mensaje, que se usa para retrasar la entrega:"
  options:
  - id: a
    text:
      es: "Mover"
  - id: b
    text:
      es: "Nuevo"
  - id: c
    correct: true
    text:
      es: "Etiquetas"
  - id: d
    text:
      es: "Eliminar"
  explanation:
    es: "La flecha Opciones de mensaje está en el grupo Etiquetas de la cinta. El grupo Mover contiene Más acciones de movimiento. El grupo Eliminar contiene Archivar, Limpiar y Bloquear. El grupo Nuevo de la pestaña Carpeta contiene Nueva carpeta de búsqueda."
  citation: "fuente: `ms-outlook-programar-envio.html`; «Programar un mensaje para más tarde en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-programar-envio-html
- id: m06-l07-q254
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cómo se envía de inmediato un mensaje que se había programado para más tarde?"
  options:
  - id: a
    text:
      es: "Abriéndolo en Elementos enviados y seleccionando Recuperar mensaje"
  - id: b
    correct: true
    text:
      es: "Abriéndolo en la carpeta Borrador, con Cancelar envío y luego Enviar"
  - id: c
    text:
      es: "Abriéndolo en la carpeta Borrador y seleccionando Limpiar conversación"
  - id: d
    text:
      es: "Abriéndolo en la Bandeja de salida y desactivando No entregar antes"
  explanation:
    es: "En el nuevo Outlook se cambia a la carpeta Borrador, se abre el mensaje programado, se elige Cancelar envío y luego Enviar. La Bandeja de salida y No entregar antes son del procedimiento de Outlook clásico. Recuperar mensaje retira un mensaje ya enviado. Limpiar conversación elimina mensajes redundantes."
  citation: "fuente: `ms-outlook-programar-envio.html`; «Enviar el mensaje inmediatamente en el nuevo Outlook»"
  difficulty: 2
  tags:
  - "comportamiento"
