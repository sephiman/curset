# Generated by docs/backend-verification/s2/tools/build_quiz.py from m10-l02.questions.json.
type: quiz
variants:
- id: m10-l02-q01
  prompt:
    en: In a Kubernetes namespace that has no `NetworkPolicy` at all, which traffic is allowed to and from the pods
      of that namespace by default?
  options:
  - id: a
    text:
      en: Only egress traffic
  - id: b
    correct: true
    text:
      en: All ingress and egress traffic
  - id: c
    text:
      en: Only ingress traffic
  - id: d
    text:
      en: No traffic until a policy allows it
  explanation:
    en: All ingress and egress traffic is allowed by default. Egress only, ingress only and no traffic at all are
      all excluded, because with no policies in a namespace all ingress and egress traffic is allowed to and from
      its pods.
  citation: k8s-network-policies#default-policies
  extract:
    en: By default, if no policies exist in a namespace, then all ingress and egress traffic is allowed to and from
      pods in that namespace.
- id: m10-l02-q04
  prompt:
    en: In TLS 1.3, as described by RFC 8446, which side of the secure channel between two communicating peers is
      always authenticated, whatever the mode?
  options:
  - id: a
    text:
      en: The client side
  - id: b
    text:
      en: Both sides
  - id: c
    correct: true
    text:
      en: The server side
  - id: d
    text:
      en: Neither side, until a post-handshake exchange
  explanation:
    en: The server side is always authenticated. The client side, both sides and neither side are all excluded,
      because the server side is always authenticated and the client side is only optionally authenticated.
  citation: rfc8446#section-1
  extract:
    en: 'Authentication: The server side of the channel is always authenticated; the client side is optionally authenticated.'
- id: m10-l02-q06
  prompt:
    en: When Kubernetes mounts a Secret into a Pod, where does the kubelet store a copy of the data so that it is
      not written to durable storage?
  options:
  - id: a
    text:
      en: In an encrypted file on the node's local disk
  - id: b
    text:
      en: In the writable layer of the container image
  - id: c
    text:
      en: In a persistent volume claim of the Pod
  - id: d
    correct: true
    text:
      en: In a `tmpfs`
  explanation:
    en: The kubelet stores the copy in a `tmpfs`. An encrypted file on the local disk, the writable layer of the
      container image and a persistent volume claim are all excluded, because the `tmpfs` is what keeps the confidential
      data out of durable storage.
  citation: k8s-secrets#information-security-for-secrets
  extract:
    en: For mounting Secrets into Pods, the kubelet stores a copy of the data into a tmpfs so that the confidential
      data is not written to durable storage.
- id: m10-l02-q07
  prompt:
    en: Which grant types does RFC 6749 define in its own text, besides the extensibility mechanism that allows
      defining additional grant types?
  options:
  - id: a
    correct: true
    text:
      en: Authorization code, implicit, resource owner password credentials, and client credentials
  - id: b
    text:
      en: Authorization code, implicit and client credentials
  - id: c
    text:
      en: Authorization code, device code, refresh token and client credentials
  - id: d
    text:
      en: Authorization code, implicit, resource owner password credentials, client credentials and token exchange
  explanation:
    en: RFC 6749 defines authorization code, implicit, resource owner password credentials and client credentials.
      The three-type list, the list with device code and refresh token, and the list that adds token exchange are
      all excluded, because the specification defines exactly those four grant types.
  citation: rfc6749#section-1.3
  extract:
    en: This specification defines four grant types -- authorization code, implicit, resource owner password credentials,
      and client credentials -- as well as an extensibility mechanism for defining additional types.
- id: m10-l02-q08
  prompt:
    en: According to RFC 6749, which kind of client may use the client credentials grant type?
  options:
  - id: a
    correct: true
    text:
      en: Only confidential clients
  - id: b
    text:
      en: Only public clients
  - id: c
    text:
      en: Public and confidential clients alike
  - id: d
    text:
      en: Only native apps
  explanation:
    en: Only confidential clients may use it. Only public clients, public and confidential clients alike, and only
      native apps are all excluded, because the client credentials grant type must only be used by confidential
      clients.
  citation: rfc6749#section-4.4
  extract:
    en: The client credentials grant type MUST only be used by confidential clients.
- id: m10-l02-q09
  prompt:
    en: RFC 9700 tells clients to use a PKCE code challenge method that does not expose the PKCE verifier in the
      authorization request. Which method is currently the only one that qualifies?
  options:
  - id: a
    correct: true
    text:
      en: '`S256`'
  - id: b
    text:
      en: '`plain`'
  - id: c
    text:
      en: '`S512`'
  - id: d
    text:
      en: '`SHA-1`'
  explanation:
    en: '`S256` is currently the only such method. The methods `plain`, `S512` and `SHA-1` are all excluded, because
      RFC 9700 names `S256` as the only method that does not expose the PKCE verifier.'
  citation: rfc9700#section-2.1.1
  extract:
    en: Currently, S256 is the only such method.
- id: m10-l02-q10
  prompt:
    en: How must an authorization server compare a client redirection URI against the pre-registered URIs, according
      to RFC 9700?
  options:
  - id: a
    correct: true
    text:
      en: By exact string matching, except for port numbers in localhost redirection URIs of native apps
  - id: b
    text:
      en: By prefix matching on the registered path
  - id: c
    text:
      en: By matching only the host name of the registered URI
  - id: d
    text:
      en: By pattern matching with wildcards in the registered path
  explanation:
    en: Authorization servers must use exact string matching, except for port numbers in localhost redirection URIs
      of native apps. Prefix matching, host-name matching and wildcard matching are all excluded, because the comparison
      must be an exact string match.
  citation: rfc9700#section-2.1
  extract:
    en: When comparing client redirection URIs against pre-registered URIs, authorization servers MUST utilize exact
      string matching except for port numbers in localhost redirection URIs of native apps (see Section 4.1.3).
- id: m10-l02-q11
  prompt:
    en: In which format does OpenID Connect Core represent the ID Token that carries Claims about the authentication
      of an End-User by an Authorization Server?
  options:
  - id: a
    correct: true
    text:
      en: As a JSON Web Token (JWT)
  - id: b
    text:
      en: As a SAML 2.0 assertion
  - id: c
    text:
      en: As an opaque random string
  - id: d
    text:
      en: As a Kerberos ticket
  explanation:
    en: The ID Token is represented as a JSON Web Token. A SAML 2.0 assertion, an opaque random string and a Kerberos
      ticket are all excluded, because OpenID Connect Core defines the ID Token as a JWT.
  citation: oidc-core#rfc.section.2
- id: m10-l02-q13
  prompt:
    en: In the OpenID Connect Authorization Code Flow, which returns an Authorization Code to the Client, from which
      endpoint are all tokens returned?
  options:
  - id: a
    text:
      en: The Authorization Endpoint
  - id: b
    text:
      en: The Introspection Endpoint
  - id: c
    text:
      en: The Discovery Endpoint
  - id: d
    correct: true
    text:
      en: The Token Endpoint
  explanation:
    en: All tokens are returned from the Token Endpoint. The Authorization Endpoint, the Introspection Endpoint
      and the Discovery Endpoint are all excluded, because with the Authorization Code Flow all tokens come from
      the Token Endpoint.
  citation: oidc-core#rfc.section.3.1
- id: m10-l02-q14
  prompt:
    en: When validating a JWT according to RFC 7519, what must happen if any of the listed validation steps fails?
  options:
  - id: a
    text:
      en: The JWT is accepted but marked as untrusted
  - id: b
    text:
      en: The JWT is accepted if the application recognises its issuer
  - id: c
    text:
      en: Only the claim that failed validation is ignored
  - id: d
    correct: true
    text:
      en: The JWT must be rejected, as an invalid input
  explanation:
    en: The JWT must be rejected and treated as an invalid input. Acceptance as untrusted, acceptance because the
      issuer is recognised, and ignoring only the failed claim are all excluded, because a failed step means the
      JWT must be rejected.
  citation: rfc7519#section-7.2
  extract:
    en: If any of the listed steps fail, then the JWT MUST be rejected -- that is, treated by the application as
      an invalid input.
- id: m10-l02-q15
  prompt:
    en: A JWT passes every validation step of RFC 7519, but the algorithms it uses are not acceptable to the application.
      What should the application do?
  options:
  - id: a
    correct: true
    text:
      en: Reject the JWT
  - id: b
    text:
      en: Accept it, because validation succeeded
  - id: c
    text:
      en: Accept it and log a warning
  - id: d
    text:
      en: Accept it with a shorter lifetime
  explanation:
    en: The application should reject the JWT. Accepting it because validation succeeded, accepting it with a warning
      and accepting it with a shorter lifetime are all excluded, because a JWT whose algorithms are not acceptable
      to the application should be rejected even after successful validation.
  citation: rfc7519#section-7.2
  extract:
    en: Even if a JWT can be successfully validated, unless the algorithms used in the JWT are acceptable to the
      application, it SHOULD reject the JWT.
- id: m10-l02-q17
  prompt:
    en: In Spring Security 7, what clock skew does the Resource Server configure by default when it verifies the
      validity window of a JWT?
  options:
  - id: a
    text:
      en: 30 seconds
  - id: b
    correct: true
    text:
      en: 60 seconds
  - id: c
    text:
      en: 5 minutes
  - id: d
    text:
      en: 0 seconds
  explanation:
    en: The default clock skew is 60 seconds. A skew of 30 seconds, of 5 minutes and of 0 seconds are all excluded,
      because Resource Server configures 60 seconds by default.
  citation: spring-security-servlet-oauth2-resource-server-jwt#oauth2resourceserver-jwt-validation-clockskew
- id: m10-l02-q18
  prompt:
    en: Which statement about supplying `jwk-set-uri` to a Spring Security Resource Server together with `issuer-uri`
      is correct?
  options:
  - id: a
    text:
      en: The Resource Server pings the authorization server at startup to discover its configuration
  - id: b
    text:
      en: The authorization server must expose configuration endpoints
  - id: c
    text:
      en: The property can only be supplied through a properties file, never through the DSL
  - id: d
    correct: true
    text:
      en: The Resource Server still validates the `iss` claim on incoming JWTs
  explanation:
    en: The Resource Server still validates the `iss` claim because `issuer-uri` is still specified. Pinging the
      authorization server at startup is wrong because with `jwk-set-uri` the Resource Server will not ping it at
      startup. Requiring configuration endpoints is wrong because `jwk-set-uri` can be supplied when the authorization
      server supports none. Properties-file-only is wrong because the property can also be supplied directly on
      the DSL.
  citation: spring-security-servlet-oauth2-resource-server-jwt#oauth2resourceserver-jwt-jwkseturi
- id: m10-l02-q19
  prompt:
    en: In Spring Security's resource server support, which component decodes, verifies and validates the `Jwt`
      by using a `JwtDecoder`?
  options:
  - id: a
    text:
      en: '`JwtAuthenticationConverter`'
  - id: b
    correct: true
    text:
      en: '`JwtAuthenticationProvider`'
  - id: c
    text:
      en: '`ProviderManager`'
  - id: d
    text:
      en: '`BearerTokenAuthenticationToken`'
  explanation:
    en: '`JwtAuthenticationProvider` decodes, verifies and validates the `Jwt`. The `JwtAuthenticationConverter`
      is wrong because it converts the `Jwt` into a collection of granted authorities. The `ProviderManager` is
      wrong because it is only configured to use a `JwtAuthenticationProvider`. The `BearerTokenAuthenticationToken`
      is wrong because the authentication filter passes it to the `AuthenticationManager`.'
  citation: spring-security-servlet-oauth2-resource-server-jwt#oauth2resourceserver-jwt-architecture
- id: m10-l02-q20
  prompt:
    en: In Kubernetes RBAC, where a `Role` or `ClusterRole` contains rules that represent a set of permissions,
      which statement about deny rules is correct?
  options:
  - id: a
    text:
      en: Deny rules take precedence over allow rules
  - id: b
    text:
      en: Deny rules are supported only in a `ClusterRole`
  - id: c
    correct: true
    text:
      en: There are no deny rules, because permissions are purely additive
  - id: d
    text:
      en: Deny rules can be added to a `Role` for a single namespace
  explanation:
    en: There are no deny rules, because permissions are purely additive. Precedence of deny rules, deny rules in
      a `ClusterRole` only and deny rules in a `Role` are all excluded, because Kubernetes RBAC has no deny rules.
  citation: k8s-rbac#role-and-clusterrole
  extract:
    en: Permissions are purely additive (there are no "deny" rules).
- id: m10-l02-q21
  prompt:
    en: Which principle of GDPR Article 5(1) requires personal data to be adequate, relevant and limited to what
      is necessary in relation to the purposes for which they are processed?
  options:
  - id: a
    text:
      en: Purpose limitation
  - id: b
    text:
      en: Storage limitation
  - id: c
    text:
      en: Accuracy
  - id: d
    correct: true
    text:
      en: Data minimisation
  explanation:
    en: Data minimisation requires personal data to be adequate, relevant and limited to what is necessary. Purpose
      limitation is wrong because it requires collection for specified, explicit and legitimate purposes. Storage
      limitation is wrong because it limits how long data subjects can be identified. Accuracy is wrong because
      it requires data to be accurate and kept up to date.
  citation: gdpr-eurlex#art_5
  extract:
    en: adequate, relevant and limited to what is necessary in relation to the purposes for which they are processed
- id: m10-l02-q23
  prompt:
    en: Under GDPR Article 30(5), the record-keeping obligations do not apply to an organisation employing fewer
      than how many persons, when the processing is occasional, low-risk and free of special categories of data?
  options:
  - id: a
    text:
      en: '50'
  - id: b
    correct: true
    text:
      en: '250'
  - id: c
    text:
      en: '100'
  - id: d
    text:
      en: '500'
  explanation:
    en: The threshold is 250 persons. The thresholds 50, 100 and 500 are all excluded, because Article 30(5) names
      fewer than 250 persons.
  citation: gdpr-eurlex#art_30
  extract:
    en: The obligations referred to in paragraphs 1 and 2 shall not apply to an enterprise or an organisation employing
      fewer than 250 persons unless the processing it carries out is likely to result in a risk to the rights and
      freedoms of data subjects, the processing is not occasional, or the processing includes special categories
      of data as referred to in Article 9(1)
- id: m10-l02-q24
  prompt:
    en: In a Kubernetes `EncryptionConfiguration`, which provider of the `providers` array is used to encrypt resources
      written into storage?
  options:
  - id: a
    text:
      en: The last provider in the list
  - id: b
    text:
      en: Every provider in turn
  - id: c
    correct: true
    text:
      en: The first provider in the list
  - id: d
    text:
      en: The provider that holds the most keys
  explanation:
    en: The first provider in the list encrypts. The last provider, every provider in turn and the provider with
      the most keys are all excluded, because the first provider in the list is the one used to encrypt.
  citation: k8s-encrypt-data#understanding-the-encryption-at-rest-configuration
  extract:
    en: The first provider in the list is used to encrypt resources written into the storage.
- id: m10-l02-q25
  prompt:
    en: In a Kubernetes `EncryptionConfiguration`, what happens when no provider can read the stored data because
      of a mismatch in format or secret key?
  options:
  - id: a
    text:
      en: The resource is returned as plain text
  - id: b
    correct: true
    text:
      en: An error is returned, which prevents clients from accessing that resource
  - id: c
    text:
      en: The resource is skipped and treated as missing
  - id: d
    text:
      en: The API server falls back to the `identity` provider
  explanation:
    en: An error is returned that prevents clients from accessing the resource. Plain text, treating the resource
      as missing and falling back to `identity` are all excluded, because the documented outcome is an error that
      blocks access.
  citation: k8s-encrypt-data#understanding-the-encryption-at-rest-configuration
  extract:
    en: If no provider can read the stored data due to a mismatch in format or secret key, an error is returned
      which prevents clients from accessing that resource.
- id: m10-l02-q26
  prompt:
    en: In Kubernetes 1.26 or newer, you add custom resources to an `EncryptionConfiguration`. When are custom resources
      that already existed in etcd encrypted?
  options:
  - id: a
    text:
      en: Immediately, when the API server reloads the configuration
  - id: b
    text:
      en: When the key of the first provider is next rotated
  - id: c
    correct: true
    text:
      en: They stay unencrypted until they are next written to storage
  - id: d
    text:
      en: Never, because only newly created custom resources can be encrypted
  explanation:
    en: They stay unencrypted until they are next written to storage. Immediate encryption, encryption on key rotation
      and never being encrypted are all excluded, because existing custom resources are encrypted only once they
      are written to storage again.
  citation: k8s-encrypt-data#understanding-the-encryption-at-rest-configuration
  extract:
    en: Any custom resources that existed in etcd prior to that version and configuration will be unencrypted until
      they are next written to storage.
- id: m10-l02-q27
  prompt:
    en: Which property of the TLS secure channel means that data sent over the channel after establishment is only
      visible to the endpoints?
  options:
  - id: a
    text:
      en: Integrity
  - id: b
    correct: true
    text:
      en: Confidentiality
  - id: c
    text:
      en: Authentication
  - id: d
    text:
      en: Length hiding
  explanation:
    en: Confidentiality means data is only visible to the endpoints. Integrity is wrong because it means data cannot
      be modified without detection. Authentication is wrong because it concerns the server side always and the
      client side optionally being authenticated. Length hiding is wrong because TLS does not hide the length of
      the data it transmits.
  citation: rfc8446#section-1
  extract:
    en: 'Confidentiality: Data sent over the channel after establishment is only visible to the endpoints.'
- id: m10-l02-q28
  prompt:
    en: For log data at rest, OWASP advises to store or copy it, as soon as possible, to which kind of medium?
  options:
  - id: a
    text:
      en: A writable network share restricted to administrators
  - id: b
    text:
      en: The database that holds the application's own data
  - id: c
    correct: true
    text:
      en: Read-only media
  - id: d
    text:
      en: The same disk as the application, in a hidden folder
  explanation:
    en: Log data should be copied to read-only media as soon as possible. A writable share, the application's own
      database and the application's disk are all excluded, because the advice names read-only media.
  citation: owasp-cs-logging#protection
  extract:
    en: Store or copy log data to read-only media as soon as possible
