  explanation:
    en: If an entire queue expires, the messages in the queue are not dead-lettered. A rejection with `basic.nack`
      and `requeue` set to false is wrong because it is listed as an event that dead-letters a message. Expiry due
      to per-message TTL is wrong because it is listed as an event that dead-letters a message. A drop because the
      queue exceeded a length limit is wrong because it is listed as an event that dead-letters a message.
  citation: rabbitmq-dlx#overview
