- id: m02-l04-q01
  prompt:
    en: An undirected graph on vertices 0 to 6 has edges 0-1, 0-2, 1-3, 2-3, 3-4 and 5-6, listed in that order.
      From vertex 0 the program prints a breadth-first order, a depth-first order and the component count. What
      is printed?
  options:
  - id: a
    correct: true
    text:
      en: 'bfs [0, 1, 2, 3, 4]

        dfs [0, 1, 3, 2, 4]

        components 2'
  - id: b
    text:
      en: 'bfs [0, 1, 3, 2, 4]

        dfs [0, 1, 2, 3, 4]

        components 2'
  - id: c
    text:
      en: 'bfs [0, 1, 2, 3, 4]

        dfs [0, 1, 3, 2, 4]

        components 3'
  - id: d
    text:
      en: 'bfs [0, 1, 2, 3, 4]

        dfs [0, 2, 3, 4, 1]

        components 2'
  explanation:
    en: The queue gives `bfs [0, 1, 2, 3, 4]`, because vertices 1 and 2 are at distance 1 and vertex 3 is at distance
      2. The recursive search goes deep through the first neighbour of each vertex, which gives `dfs [0, 1, 3, 2,
      4]`, and the repeated searches find two components. The order `bfs [0, 1, 3, 2, 4]` swaps the two traversals,
      but a queue visits both distance-1 vertices before vertex 3. The count `components 3` splits the pair 5-6,
      but its two vertices are joined by an edge. The order `dfs [0, 2, 3, 4, 1]` is what an explicit stack gives
      when it pushes every neighbour, but the recursive search visits the first neighbour 1 before 2.
