# anchor: fuente-ms-word-cinta-html
- id: m02-l08-q147
  prompt:
    es: "En la ventana Personalizar la cinta de opciones de Word 365, ¿cuál de las siguientes opciones se selecciona para crear una pestaña propia?"
  options:
  - id: a
    correct: true
    text:
      es: "Nueva pestaña"
  - id: b
    text:
      es: "Nuevo grupo"
  - id: c
    text:
      es: "Cambiar nombre"
  - id: d
    text:
      es: "Restablecer"
  explanation:
    es: "La página dice: «En la ventana Personalizar la cinta de opciones, seleccione Nueva pestaña». Nuevo grupo agrega un grupo personalizado a una pestaña. Cambiar nombre sirve para dar otro nombre a una pestaña, grupo o comando. Restablecer devuelve la cinta a su configuración predeterminada."
  citation: "fuente: `ms-word-cinta.html`; «Agregar o quitar pestañas o grupos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-cinta-html
- id: m02-l08-q148
  prompt:
    es: "En Word 365, ¿qué elementos de la cinta de opciones se pueden renombrar al personalizar la cinta?"
  options:
  - id: a
    text:
      es: "Solo las pestañas y los grupos personalizados"
  - id: b
    text:
      es: "Todos los comandos, también los predeterminados"
  - id: c
    correct: true
    text:
      es: "Pestañas y grupos, y comandos de grupos personalizados"
  - id: d
    text:
      es: "Solo los comandos, no las pestañas ni los grupos"
  explanation:
    es: "La página dice: «Puede cambiar el nombre de una pestaña o grupo predeterminado o personalizado. Solo puede cambiar el nombre de los comandos que haya agregado a un grupo personalizado». La página dice que también se puede cambiar el nombre de una pestaña o grupo predeterminado. No es posible cambiar el nombre de los comandos predeterminados. La página dice que se puede cambiar el nombre de una pestaña o grupo."
  citation: "fuente: `ms-word-cinta.html`; «Cambiar el nombre de una pestaña, un grupo o un comando»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-cinta-html
- id: m02-l08-q149
  prompt:
    es: "¿Cuál de las siguientes rutas de la ventana Personalizar la cinta de opciones de Word 365 guarda las personalizaciones en un archivo?"
  options:
  - id: a
    text:
      es: "Importar o exportar › Importar archivo de personalización"
  - id: b
    text:
      es: "Restablecer › Restablecer todas las personalizaciones de la cinta"
  - id: c
    text:
      es: "Nuevo grupo › Exportar todas las personalizaciones"
  - id: d
    correct: true
    text:
      es: "Importar o exportar › Exportar todas las personalizaciones"
  explanation:
    es: "La página dice: «seleccione Importar o exportar. Seleccione Exportar todas las personalizaciones». Importar archivo de personalización carga un archivo de personalización. Restablecer devuelve la cinta a su configuración predeterminada. La página usa Importar o exportar, no Nuevo grupo."
  citation: "fuente: `ms-word-cinta.html`; «En la ventana Personalizar la cinta de opciones, seleccione Importar o exportar.»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m02-l08-q150
  prompt:
    es: "En Word 365, ¿cuál de las siguientes descripciones corresponde a la opción Guardar archivos en este formato de las Opciones de Word (Guardar)?"
  options:
  - id: a
    text:
      es: "La ubicación de archivo predeterminada al abrir documentos"
  - id: b
    text:
      es: "El intervalo de guardado de la Autorrecuperación"
  - id: c
    text:
      es: "La ubicación de las plantillas personales"
  - id: d
    correct: true
    text:
      es: "El formato de archivo predeterminado al guardar"
  explanation:
    es: "La página dice: «Guardar archivos en este formato: Esta opción establece el formato de archivo predeterminado que se usa al guardar documentos». La ubicación predeterminada es otra opción: Ubicación de archivo predeterminada. El intervalo se especifica en el cuadro de minutos de Autorrecuperación. La ubicación de plantillas personales es otra opción."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Opciones de Word (Guardar)»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m02-l08-q151
  prompt:
    es: "En Word 365, ¿cuál de las siguientes descripciones corresponde a la opción Ubicación de archivo predeterminada de las Opciones de Word (Guardar)?"
  options:
  - id: a
    text:
      es: "El nombre del formato con el que Word guarda cada documento"
  - id: b
    correct: true
    text:
      es: "La ruta que Word usa como ubicación al usar Abrir o Guardar por primera vez"
  - id: c
    text:
      es: "El intervalo en minutos con el que Word guarda el archivo de recuperación"
  - id: d
    text:
      es: "La ruta de la carpeta donde Word guarda las plantillas personales"
  explanation:
    es: "La página dice: «Escriba la ruta de acceso que desea que Word use como la ubicación» al usar por primera vez los comandos Abrir, Guardar o Guardar una copia al iniciar Word. El formato se elige en Guardar archivos en este formato. El intervalo se especifica en el cuadro de minutos de Autorrecuperación. La ruta de las plantillas personales es otra opción: Ubicación predeterminada de plantillas personales."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Opciones de Word (Guardar)»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-word-opciones-mostrar-html
- id: m02-l08-q152
  prompt:
    es: "Según las Opciones de Word (Mostrar), la marca de formato Espacios de Word 365 muestra los espacios entre palabras:"
  options:
  - id: a
    text:
      es: "Como flechas"
  - id: b
    text:
      es: "Como el símbolo de párrafo"
  - id: c
    correct: true
    text:
      es: "Como puntos"
  - id: d
    text:
      es: "Como guiones"
  explanation:
    es: "La página dice: «Espacios: Seleccione esta opción para mostrar los espacios entre palabras como puntos». Las flechas son de los caracteres de tabulación. El símbolo de párrafo marca los extremos de párrafo. Los guiones opcionales indican dónde dividir una palabra al final de una línea."
  citation: "fuente: `ms-word-opciones-mostrar.html`; «Mostrar siempre estas marcas de formato en la pantalla»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-word-opciones-mostrar-html
- id: m02-l08-q153
  prompt:
    es: "En Word 365, ¿cuál de las siguientes descripciones corresponde a la marca de formato Texto oculto de las Opciones de Word (Mostrar)?"
  options:
  - id: a
    text:
      es: "Una flecha junto al texto que tiene formato de oculto"
  - id: b
    text:
      es: "Un punto entre las palabras del texto con formato de oculto"
  - id: c
    text:
      es: "El símbolo de párrafo al final del texto oculto"
  - id: d
    correct: true
    text:
      es: "Una línea de puntos debajo del texto con formato de oculto"
  explanation:
    es: "La página dice: «Texto oculto: Seleccione esta opción para mostrar una línea de puntos debajo del texto que tiene formato de oculto». Las flechas son de los caracteres de tabulación. Los puntos son de la opción Espacios. El símbolo de párrafo es de la opción Marcas de párrafo."
  citation: "fuente: `ms-word-opciones-mostrar.html`; «Mostrar siempre estas marcas de formato en la pantalla»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-word-opciones-mostrar-html
- id: m02-l08-q154
  prompt:
    es: "Según las Opciones de Word (Mostrar), ¿cuál de las siguientes marcas de formato muestra los extremos de párrafo con el símbolo de párrafo en Word 365?"
  options:
  - id: a
    correct: true
    text:
      es: "Marcas de párrafo"
  - id: b
    text:
      es: "Anclajes de objeto"
  - id: c
    text:
      es: "Guiones opcionales"
  - id: d
    text:
      es: "Espacios"
  explanation:
    es: "La página dice: «Marcas de párrafo: Seleccione esta opción para mostrar los extremos de párrafos con el símbolo de párrafo». Anclajes de objeto muestra los anclajes de los objetos asociados a un párrafo. Guiones opcionales muestra dónde dividir una palabra al final de una línea. Espacios muestra los espacios entre palabras como puntos."
  citation: "fuente: `ms-word-opciones-mostrar.html`; «Mostrar siempre estas marcas de formato en la pantalla»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m02-l08-q251
  prompt:
    es: "En Word 365, ¿puede mostrarse la barra de herramientas de acceso rápido en varias líneas, según la nota de la página de Microsoft sobre cómo personalizarla?"
  options:
  - id: a
    text:
      es: "Sí, activando la opción Varias líneas en Opciones de Word"
  - id: b
    correct: true
    text:
      es: "No, no se puede mostrar en varias líneas"
  - id: c
    text:
      es: "Sí, pero solo debajo de la cinta de opciones"
  - id: d
    text:
      es: "Sí, si se reduce la resolución de la pantalla"
  explanation:
    es: "La página indica que no puede mostrarse en varias líneas. «Sí, activando la opción Varias líneas en Opciones de Word» contradice la página, que no ofrece esa opción. «Sí, pero solo debajo de la cinta de opciones» contradice la página, que no la admite en ninguna posición. «Sí, si se reduce la resolución de la pantalla» contradice la página, que solo menciona la resolución para ampliar los botones."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Personalizar la barra de herramientas de acceso rápido»"
  difficulty: 2
  tags:
  - "comportamiento"
