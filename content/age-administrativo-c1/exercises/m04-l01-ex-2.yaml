# anchor: boe-a-2015-11719-art-2
- id: m04-l01-q021
  prompt:
    es: "Según el artículo 2.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, este se aplica al personal funcionario y, en lo que proceda, al personal laboral al servicio de, entre otros:"
  options:
  - id: a
    text:
      es: "Las Cortes Generales y las asambleas legislativas de las comunidades autónomas."
  - id: b
    text:
      es: "Los órganos constitucionales del Estado y los órganos estatutarios de las comunidades autónomas."
  - id: c
    correct: true
    text:
      es: "Los organismos públicos, agencias y entidades de derecho público vinculados o dependientes de las Administraciones."
  - id: d
    text:
      es: "Las sociedades mercantiles estatales y las fundaciones del sector público."
  explanation:
    es: "El artículo 2.1.d) incluye a «los organismos públicos, agencias y demás entidades de derecho público con personalidad jurídica propia, vinculadas o dependientes de cualquiera de las Administraciones Públicas». El personal de las Cortes Generales, de las asambleas legislativas y de los órganos constitucionales y estatutarios no está en esa lista: el Estatuto sólo se le aplica cuando lo disponga su legislación específica (art. 4). Las sociedades mercantiles y las fundaciones no son Administraciones Públicas de la lista del artículo 2.1."
  citation: "art. 2.1 TREBEP"
  difficulty: 3
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2015-11719-art-2
- id: m04-l01-q022
  prompt:
    es: "Según el artículo 2.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿a qué personal de las Administraciones Públicas que enumera se aplica el Estatuto?"
  options:
  - id: a
    text:
      es: "Al personal funcionario y al personal laboral, en los mismos términos."
  - id: b
    text:
      es: "Al personal laboral y, en lo que proceda, al personal funcionario."
  - id: c
    correct: true
    text:
      es: "Al personal funcionario y, en lo que proceda, al personal laboral."
  - id: d
    text:
      es: "Al personal funcionario y al eventual, pero no al personal laboral."
  explanation:
    es: "El artículo 2.1 dice: «Este Estatuto se aplica al personal funcionario y en lo que proceda al personal laboral». No se aplica igual a ambos: al laboral, sólo en lo que proceda. La opción que invierte los términos altera el texto. Excluir al personal laboral contradice el mismo apartado, que lo incluye en lo que proceda."
  citation: "art. 2.1 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-2
- id: m04-l01-q023
  prompt:
    es: "¿Qué carácter tiene el Estatuto Básico del Empleado Público para el personal de las Administraciones Públicas no incluido en su ámbito de aplicación?"
  options:
  - id: a
    text:
      es: "Carácter básico y de aplicación directa a todo ese personal no incluido."
  - id: b
    text:
      es: "Carácter orientativo, sin fuerza obligatoria para ese personal."
  - id: c
    correct: true
    text:
      es: "Carácter supletorio para todo el personal no incluido en su ámbito."
  - id: d
    text:
      es: "Carácter supletorio sólo para el personal funcionario."
  explanation:
    es: "El artículo 2.5 del texto refundido dice: «El presente Estatuto tiene carácter supletorio para todo el personal de las Administraciones Públicas no incluido en su ámbito de aplicación». No se aplica de forma directa a ese personal, porque está fuera de su ámbito. Tampoco es un texto orientativo: es supletorio, es decir, rige en lo que no regule su norma propia. Y es supletorio para todo ese personal, no sólo para el funcionario."
  citation: "art. 2.5 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-7
- id: m04-l01-q024
  prompt:
    es: "En materia de permisos de nacimiento, adopción, del progenitor diferente de la madre biológica, de lactancia y parental, el personal laboral de las Administraciones públicas:"
  options:
  - id: a
    text:
      es: "Se rige por el Estatuto de los Trabajadores, y el Estatuto Básico sólo se le aplica con carácter supletorio."
  - id: b
    text:
      es: "Se rige por el convenio colectivo aplicable, que puede apartarse de lo previsto en ambos Estatutos."
  - id: c
    correct: true
    text:
      es: "Se rige por el Estatuto Básico del Empleado Público, sin que se le apliquen las suspensiones del contrato del Estatuto de los Trabajadores."
  - id: d
    text:
      es: "Puede optar entre el régimen del Estatuto Básico y la suspensión del contrato del Estatuto de los Trabajadores."
  explanation:
    es: "El artículo 7 del texto refundido del Estatuto Básico del Empleado Público dice que en esas materias el personal laboral «se regirá por lo previsto en el presente Estatuto», sin que le sean de aplicación las previsiones del Estatuto de los Trabajadores sobre las suspensiones de los contratos por los mismos supuestos. No se rige por el Estatuto de los Trabajadores, ni por el convenio colectivo en lugar del Estatuto. Tampoco hay opción: el artículo excluye la suspensión del contrato."
  citation: "art. 7 TREBEP"
  difficulty: 3
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2015-11719-dd-unica
- id: m04-l01-q025
  prompt:
    es: "Según la disposición derogatoria única del texto refundido de la Ley del Estatuto Básico del Empleado Público, las disposiciones que enumera quedan derogadas:"
  options:
  - id: a
    text:
      es: "Desde la entrada en vigor del texto refundido, sin excepción alguna."
  - id: b
    correct: true
    text:
      es: "Con el alcance establecido en el apartado 2 de la disposición final cuarta."
  - id: c
    text:
      es: "A los seis meses de la publicación del texto refundido en el Boletín Oficial del Estado."
  - id: d
    text:
      es: "Con el alcance que fije cada Administración Pública en sus normas reglamentarias."
  explanation:
    es: "La disposición derogatoria única dice: «Quedan derogadas con el alcance establecido en el apartado 2 de la disposición final cuarta, las siguientes disposiciones». Ese apartado mantiene en vigor las normas sobre ordenación, planificación y gestión de recursos humanos en tanto no se opongan al Estatuto, hasta que se dicten las leyes de Función Pública. Por eso la derogación no es inmediata y sin excepción. El texto no fija un plazo de seis meses ni deja el alcance a cada Administración."
  citation: "disposición derogatoria única TREBEP"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-dd-unica
- id: m04-l01-q026
  prompt:
    es: "¿Cuál de los siguientes preceptos de la Ley 30/1984, de 2 de agosto, figura en la lista de la disposición derogatoria única b) del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "El que establece la dependencia orgánica de todo el personal al servicio de la Administración del Estado."
  - id: b
    correct: true
    text:
      es: "El que atribuye el nombramiento y el cese del personal eventual a los Ministros y Secretarios de Estado."
  - id: c
    text:
      es: "El que atribuye al Gobierno la dirección de la política de personal y la potestad reglamentaria."
  - id: d
    text:
      es: "El que crea el Registro Central en el que se inscribe a todo el personal de la Administración del Estado."
  explanation:
    es: "La lista de la disposición derogatoria única b) incluye el artículo 20.2 de la Ley 30/1984, que atribuye el nombramiento y el cese del personal eventual a los Ministros y Secretarios de Estado. Quedan fuera de la lista los artículos 2 (dependencia orgánica), 3.1 (el Gobierno dirige la política de personal y ejerce la potestad reglamentaria) y 13.1 (Registro Central de Personal)."
  citation: "disposición derogatoria única b) TREBEP"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-2015-11719-df-cuarta
- id: m04-l01-q027
  prompt:
    es: "Según la disposición final cuarta.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los capítulos II y III de su título III, salvo el artículo 25.2, y el capítulo III del título V producirán efectos:"
  options:
  - id: a
    text:
      es: "Desde el día siguiente al de la publicación del texto refundido en el Boletín Oficial del Estado."
  - id: b
    text:
      es: "A partir de la aprobación por el Gobierno de las normas reglamentarias de desarrollo del Estatuto."
  - id: c
    text:
      es: "Al año de la entrada en vigor del texto refundido, salvo que una ley disponga otra cosa."
  - id: d
    correct: true
    text:
      es: "A partir de la entrada en vigor de las leyes de Función Pública que se dicten en desarrollo del Estatuto."
  explanation:
    es: "La disposición final cuarta.1 dice que lo establecido en esos capítulos «producirá efectos a partir de la entrada en vigor de las leyes de Función Pública que se dicten en desarrollo de este Estatuto». No produce efectos desde la publicación del texto refundido. Tampoco basta un reglamento del Gobierno: hace falta la ley de Función Pública. El texto no fija un plazo de un año."
  citation: "disposición final cuarta.1 TREBEP"
  difficulty: 3
  tags:
  - "efecto"
  - "fecha"
# anchor: boe-a-2015-11719-df-cuarta
- id: m04-l01-q028
  prompt:
    es: "De acuerdo con la disposición final cuarta.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, hasta que se dicten las leyes de Función Pública y sus normas reglamentarias, las normas vigentes de gestión de recursos humanos:"
  options:
  - id: a
    text:
      es: "Se mantendrán en vigor en cada Administración Pública aunque se opongan al Estatuto."
  - id: b
    text:
      es: "Quedarán derogadas, salvo las que cada Administración declare expresamente vigentes."
  - id: c
    text:
      es: "Se mantendrán en vigor durante un año como máximo desde la entrada en vigor del Estatuto."
  - id: d
    correct: true
    text:
      es: "Se mantendrán en vigor en cada Administración Pública en tanto no se opongan al Estatuto."
  explanation:
    es: "La disposición final cuarta.2 dice que las normas vigentes sobre ordenación, planificación y gestión de recursos humanos «se mantendrán en vigor en cada Administración Pública» «en tanto no se opongan a lo establecido en este Estatuto». No se mantienen si se oponen al Estatuto. No quedan derogadas a falta de una declaración de vigencia. Y no hay plazo máximo de un año: rigen hasta que se dicten las leyes y normas de desarrollo."
  citation: "disposición final cuarta.2 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-df-cuarta
- id: m04-l01-q029
  prompt:
    es: "¿Hasta cuándo se mantienen en vigor en cada Administración Pública las normas sobre ordenación, planificación y gestión de recursos humanos que no se opongan al Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "Hasta que el Gobierno apruebe un nuevo texto refundido de las normas de función pública."
  - id: b
    text:
      es: "Hasta que la Conferencia Sectorial de Administración Pública acuerde su derogación."
  - id: c
    correct: true
    text:
      es: "Hasta que se dicten las leyes de Función Pública y las normas reglamentarias de desarrollo."
  - id: d
    text:
      es: "Hasta que se cumplan cinco años de la entrada en vigor del texto refundido."
  explanation:
    es: "La disposición final cuarta.2 del texto refundido mantiene esas normas en vigor «hasta que se dicten las leyes de Función Pública y las normas reglamentarias de desarrollo». Un nuevo texto refundido no es el límite que fija la disposición. La Conferencia Sectorial no tiene esa función. Y el texto no fija un plazo de cinco años."
  citation: "disposición final cuarta.2 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "fecha"
# anchor: boe-a-1995-8729-art-1
- id: m04-l01-q030
  prompt:
    es: "Según el artículo 1.1 del Real Decreto 364/1995, de 10 de marzo, su Reglamento General se aplica al ingreso del personal de la Administración General del Estado y sus Organismos autónomos y, respecto de sus funcionarios, a:"
  options:
  - id: a
    text:
      es: "Las situaciones administrativas, la provisión de puestos de trabajo y la promoción interna."
  - id: b
    text:
      es: "El régimen disciplinario, la provisión de puestos de trabajo y la carrera profesional."
  - id: c
    text:
      es: "Las incompatibilidades, la promoción interna y la carrera profesional."
  - id: d
    correct: true
    text:
      es: "La provisión de puestos de trabajo, la promoción interna y la carrera profesional."
  explanation:
    es: "El artículo 1.1 aplica el Reglamento a los procedimientos de ingreso y «a la provisión de puestos de trabajo, la promoción interna y la carrera profesional de los funcionarios». Las situaciones administrativas las regula el Real Decreto 365/1995. El régimen disciplinario, el Real Decreto 33/1986. Las incompatibilidades, la Ley 53/1984."
  citation: "art. 1.1 RD 364/1995"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-1995-8730-art-1
- id: m04-l01-q031
  prompt:
    es: "¿Qué norma aprueba el Reglamento de situaciones administrativas que se aplica a los funcionarios de la Administración general del Estado y sus Organismos autónomos comprendidos en la Ley 30/1984?"
  options:
  - id: a
    text:
      es: "El Real Decreto 364/1995, de 10 de marzo."
  - id: b
    text:
      es: "El Real Decreto 33/1986, de 10 de enero."
  - id: c
    text:
      es: "El Real Decreto 2073/1999, de 30 de diciembre."
  - id: d
    correct: true
    text:
      es: "El Real Decreto 365/1995, de 10 de marzo."
  explanation:
    es: "El Real Decreto 365/1995 aprueba el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, y su artículo 1 fija ese ámbito. El Real Decreto 364/1995, del mismo día, regula el ingreso, la provisión y la promoción. El Real Decreto 33/1986 regula el régimen disciplinario. El Real Decreto 2073/1999 contiene el Reglamento del Registro Central de Personal."
  citation: "art. 1 RD 365/1995"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1995-8730-art-1
- id: m04-l01-q032
  prompt:
    es: "Según el artículo 1 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, aprobado por el Real Decreto 365/1995, de 10 de marzo, este se aplica a:"
  options:
  - id: a
    correct: true
    text:
      es: "Los funcionarios de la Administración general del Estado y sus Organismos autónomos comprendidos en la Ley 30/1984."
  - id: b
    text:
      es: "Todo el personal, funcionario y laboral, de la Administración general del Estado y sus Organismos autónomos."
  - id: c
    text:
      es: "Los funcionarios de todas las Administraciones Públicas, con carácter básico y de aplicación directa."
  - id: d
    text:
      es: "Los funcionarios de la Administración general del Estado, con exclusión de los de sus Organismos autónomos."
  explanation:
    es: "El artículo 1 aplica el Reglamento «a los funcionarios de la Administración general del Estado y sus Organismos autónomos comprendidos en el ámbito de aplicación de la Ley 30/1984». No incluye al personal laboral. No es una norma básica para todas las Administraciones. Y no excluye a los funcionarios de los Organismos autónomos: los nombra."
  citation: "art. 1 RD 365/1995"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-1
- id: m04-l01-q033
  prompt:
    es: "Según su artículo 1, el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, aprobado por el Real Decreto 33/1986, de 10 de enero, se aplica:"
  options:
  - id: a
    text:
      es: "A todo el personal, funcionario y laboral, comprendido en el artículo 1.1 de la Ley 30/1984."
  - id: b
    correct: true
    text:
      es: "Al personal funcionario comprendido en el artículo 1.1 de la Ley 30/1984, de 2 de agosto."
  - id: c
    text:
      es: "Al personal funcionario de todas las Administraciones Públicas, con carácter básico."
  - id: d
    text:
      es: "Al personal funcionario y eventual de la Administración del Estado y de las entidades locales."
  explanation:
    es: "El artículo 1 dice que el Reglamento «será de aplicación al personal funcionario comprendido en el artículo 1, 1, de la Ley 30/1984». No incluye al personal laboral. No es una norma básica para todas las Administraciones: para los funcionarios no incluidos es sólo supletorio (art. 3). Y no se extiende a las entidades locales."
  citation: "art. 1 RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-151-art-2
- id: m04-l01-q034
  prompt:
    es: "De acuerdo con el artículo 2.1.a) de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, esta ley se aplica al personal:"
  options:
  - id: a
    text:
      es: "Civil al servicio de la Administración del Estado, con exclusión del personal militar."
  - id: b
    text:
      es: "Funcionario de la Administración del Estado, con exclusión del personal laboral."
  - id: c
    text:
      es: "Civil y militar de la Administración del Estado, con exclusión de sus Organismos Públicos."
  - id: d
    correct: true
    text:
      es: "Civil y militar al servicio de la Administración del Estado y de sus Organismos Públicos."
  explanation:
    es: "El artículo 2.1.a) incluye al «personal civil y militar al servicio de la Administración del Estado y de sus Organismos Públicos». No excluye al personal militar ni a los Organismos Públicos, que nombra expresamente. Tampoco excluye al personal laboral: habla de «personal civil», sin distinguir funcionarios y laborales."
  citation: "art. 2.1.a) Ley 53/1984"
  difficulty: 2
  tags:
  - "concepto"
