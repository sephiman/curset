m03-l04-q10:
  key:
    anchor: hdrhistogram-readme#untitled
    sentence: A Histogram's memory footprint is constant, with no allocation operations involved in recording data values or in iterating through them.
  wrong:
  - option: The memory footprint grows with the number of samples recorded
    anchor: hdrhistogram-readme#untitled
    sentence: The memory footprint is fixed regardless of the number of data value samples recorded, and depends solely on the dynamic range and precision chosen.
  - option: Recording a value searches the stored values, so its cost grows with the sample count
    anchor: hdrhistogram-readme#untitled
    sentence: The amount of work involved in recording a sample is constant, and directly computes storage index locations such that no iteration or searching is ever involved in recording data values.
  - option: Value precision is expressed as the number of decimal places of the largest value
    anchor: hdrhistogram-readme#untitled
    sentence: Value precision is expressed as the number of significant digits in the value recording, and provides control over value quantization behavior across the value range and the subsequent value resolution at any given level.
