# anchor: boe-a-2003-23186-art-1
- id: m03-l03-q0001
  prompt:
    es: "De acuerdo con el artículo 1.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, lo establecido en esta ley se entenderá sin perjuicio de lo dispuesto en:"
  options:
  - id: a
    text:
      es: "las leyes que aprueban los Estatutos de Autonomía de las comunidades autónomas con competencias tributarias cedidas por el Estado."
  - id: b
    text:
      es: "las leyes orgánicas que regulan la financiación de las comunidades autónomas y de las ciudades con estatuto."
  - id: c
    text:
      es: "las leyes de presupuestos generales del Estado de cada ejercicio, que prevalecen sobre esta ley."
  - id: d
    correct: true
    text:
      es: "las leyes que aprueban el Convenio y el Concierto Económico en vigor, respectivamente, en Navarra y en el País Vasco."
  explanation:
    es: "El artículo 1.1 reserva solo las leyes que aprueban el Convenio con Navarra y el Concierto Económico con los Territorios Históricos del País Vasco. Los Estatutos de Autonomía y las leyes orgánicas de financiación autonómica no aparecen en esa salvedad. Las leyes de presupuestos tampoco prevalecen sobre la ley general: el precepto no les da esa prioridad."
  citation: "art. 1.1 LGT"
  difficulty: 1
  tags:
  - "definición"
  - "condición"
# anchor: boe-a-2003-23186-art-1
- id: m03-l03-q0002
  prompt:
    es: "¿A qué Administraciones tributarias es de aplicación la Ley 58/2003, de 17 de diciembre, General Tributaria, según su artículo 1.1, en virtud y con el alcance que se deriva de los títulos competenciales de la Constitución?"
  options:
  - id: a
    correct: true
    text:
      es: "A todas las Administraciones tributarias, tanto la estatal como las autonómicas y las locales."
  - id: b
    text:
      es: "Solo a la Administración tributaria del Estado, que la aplica por medio de la Agencia Tributaria."
  - id: c
    text:
      es: "Solo a las Administraciones del Estado y de las comunidades autónomas, no a las entidades locales."
  - id: d
    text:
      es: "A todas las Administraciones tributarias, incluidas las de Navarra y el País Vasco sin excepción alguna."
  explanation:
    es: "El artículo 1.1 dice que la ley es de aplicación a todas las Administraciones tributarias, con el alcance que se deriva de la Constitución. Limitarla a la Administración del Estado o excluir a las entidades locales contradice ese alcance general. Aplicarla a Navarra y al País Vasco sin excepción tampoco es correcto: el mismo apartado la entiende sin perjuicio del Convenio y del Concierto Económico."
  citation: "art. 1.1 LGT"
  difficulty: 1
  tags:
  - "sujeto"
  - "definición"
# anchor: boe-a-2003-23186-art-3
- id: m03-l03-q0004
  prompt:
    es: "De acuerdo con el artículo 3.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la aplicación del sistema tributario:"
  options:
  - id: a
    text:
      es: "Se basa en los principios de justicia, generalidad, igualdad, progresividad y no confiscatoriedad, entre otros."
  - id: b
    correct: true
    text:
      es: "Se basa en los principios de proporcionalidad, eficacia y limitación de costes indirectos derivados del cumplimiento de obligaciones formales."
  - id: c
    text:
      es: "Se basa en los principios de proporcionalidad, eficacia y generalidad, con limitación de los costes directos del cumplimiento."
  - id: d
    text:
      es: "Se basa en la capacidad económica de los obligados, y asegura los derechos de estos solo en el procedimiento sancionador."
  explanation:
    es: "Según el artículo 3.2, la aplicación del sistema se basa en la proporcionalidad, la eficacia y la limitación de costes indirectos derivados de las obligaciones formales, y asegura los derechos y garantías de los obligados. Los principios de justicia, generalidad, igualdad, progresividad y no confiscatoriedad corresponden a la ordenación del sistema, no a su aplicación. Hablar de generalidad o de costes directos altera el texto. La capacidad económica es la base de la ordenación, y el respeto de los derechos no se limita al procedimiento sancionador."
  citation: "art. 3.2 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "requisito"
# anchor: boe-a-2003-23186-art-4
- id: m03-l03-q0006
  prompt:
    es: "Conforme al artículo 4.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las comunidades autónomas y las entidades locales podrán establecer y exigir tributos, de acuerdo con:"
  options:
  - id: a
    correct: true
    text:
      es: "la Constitución y las leyes."
  - id: b
    text:
      es: "las leyes del Estado y los reglamentos que las desarrollen."
  - id: c
    text:
      es: "la Constitución y los convenios que suscriban con el Estado."
  - id: d
    text:
      es: "las leyes de cada comunidad autónoma y las ordenanzas fiscales."
  explanation:
    es: "El artículo 4.2 somete a las comunidades autónomas y a las entidades locales a la Constitución y a las leyes. Limitarlas a las leyes estatales y a sus reglamentos, o condicionarlas a convenios con el Estado, no es lo que dice el precepto. Las leyes autonómicas y las ordenanzas fiscales tampoco sustituyen a la Constitución como límite, y el apartado no las menciona."
  citation: "art. 4.2 LGT"
  difficulty: 1
  tags:
  - "condición"
  - "sujeto"
# anchor: boe-a-2003-23186-art-4
- id: m03-l03-q0007
  prompt:
    es: "De acuerdo con el artículo 4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las entidades de derecho público distintas del Estado, las comunidades autónomas y las entidades locales:"
  options:
  - id: a
    text:
      es: "Pueden establecer tributos propios sin que ninguna ley lo determine."
  - id: b
    text:
      es: "Pueden exigir tributos cuando lo disponga una orden ministerial del Ministro de Hacienda."
  - id: c
    correct: true
    text:
      es: "Pueden exigir tributos cuando una ley así lo determine."
  - id: d
    text:
      es: "Solo pueden exigir tributos cuando lo autorice cada comunidad autónoma en su territorio."
  explanation:
    es: "El artículo 4.3 permite que las demás entidades de derecho público exijan tributos cuando una ley así lo determine. No pueden establecerlos por su cuenta, porque la potestad originaria es del Estado mediante ley. Una orden ministerial no es la ley que exige el precepto, y la autorización de una comunidad autónoma tampoco sustituye a esa ley."
  citation: "art. 4.3 LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "condición"
# anchor: boe-a-2003-23186-art-3
- id: m03-l03-q0008
  prompt:
    es: "¿Cuál de los siguientes principios figura entre los de la ordenación del sistema tributario del artículo 3.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "El de limitación de costes indirectos derivados del cumplimiento de obligaciones formales."
  - id: b
    text:
      es: "El de proporcionalidad en la aplicación de los tributos a cada obligado."
  - id: c
    text:
      es: "El de eficacia en la gestión de los procedimientos de aplicación de los tributos."
  - id: d
    correct: true
    text:
      es: "El de no confiscatoriedad, junto con la equitativa distribución de la carga tributaria."
  explanation:
    es: "La no confiscatoriedad y la equitativa distribución de la carga tributaria son principios de la ordenación del sistema, del artículo 3.1. La limitación de costes indirectos, la proporcionalidad y la eficacia son principios de la aplicación del sistema, del artículo 3.2."
  citation: "art. 3.1 LGT"
  difficulty: 2
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-7
- id: m03-l03-q0010
  prompt:
    es: "Según el artículo 7.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las disposiciones de desarrollo en materia tributaria que dicta el Ministro de Hacienda en el ámbito de competencias del Estado revestirán la forma de:"
  options:
  - id: a
    text:
      es: "real decreto, cuando así lo disponga expresamente la ley o reglamento objeto de desarrollo."
  - id: b
    correct: true
    text:
      es: "orden ministerial, cuando así lo disponga expresamente la ley o reglamento objeto de desarrollo."
  - id: c
    text:
      es: "orden ministerial, en todo caso y con independencia de lo que disponga la ley o el reglamento."
  - id: d
    text:
      es: "resolución de la Dirección General de Tributos, cuando así lo disponga el reglamento objeto de desarrollo."
  explanation:
    es: "El Ministro de Hacienda dicta disposiciones de desarrollo con forma de orden ministerial, y solo cuando la ley o el reglamento que desarrollan lo disponen expresamente. El real decreto es una forma del Gobierno, no del Ministro. Que la orden valga en todo caso suprime la condición expresa del precepto. Y la resolución de la Dirección General de Tributos no es la forma que el artículo asigna a estas disposiciones."
  citation: "art. 7.1 LGT"
  difficulty: 2
  tags:
  - "órgano"
  - "condición"
# anchor: boe-a-2003-23186-art-7
- id: m03-l03-q0011
  prompt:
    es: "¿Qué carácter tienen las disposiciones generales del derecho administrativo y los preceptos del derecho común en materia tributaria, según el artículo 7.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Tienen carácter preferente respecto de las leyes reguladoras de cada tributo."
  - id: b
    text:
      es: "Tienen carácter complementario, y solo se aplican a los tributos locales."
  - id: c
    text:
      es: "Tienen carácter interpretativo, vinculante para toda la Administración tributaria."
  - id: d
    correct: true
    text:
      es: "Tienen carácter supletorio respecto de las normas tributarias."
  explanation:
    es: "El artículo 7.2 les da carácter supletorio: se aplican a falta de norma tributaria. No son preferentes sobre las leyes de cada tributo ni se limitan a los tributos locales. El carácter interpretativo vinculante lo tienen las disposiciones que dictan el Ministro y los órganos de la Administración tributaria del artículo 12.3, no el derecho común."
  citation: "art. 7.2 LGT"
  difficulty: 1
  tags:
  - "definición"
  - "efecto"
# anchor: boe-a-2003-23186-art-7
- id: m03-l03-q0012
  prompt:
    es: "¿Cuál de las siguientes normas rige los tributos, según el artículo 7.1.e) de la Ley 58/2003, de 17 de diciembre, General Tributaria, en el ámbito tributario local, junto con las disposiciones reglamentarias dictadas en desarrollo de las normas anteriores?"
  options:
  - id: a
    correct: true
    text:
      es: "Las correspondientes ordenanzas fiscales de la entidad local."
  - id: b
    text:
      es: "Las instrucciones interpretativas de la Dirección General de Tributos."
  - id: c
    text:
      es: "Los convenios de colaboración entre las entidades locales y el Estado."
  - id: d
    text:
      es: "Los reglamentos orgánicos de cada entidad local."
  explanation:
    es: "El artículo 7.1.e) añade, específicamente en el ámbito tributario local, las ordenanzas fiscales. Las instrucciones de la Dirección General de Tributos son disposiciones interpretativas, no una fuente de los tributos locales. Los convenios de colaboración entre administraciones no figuran en la lista de fuentes, y los reglamentos orgánicos de la entidad regulan su organización, no sus tributos."
  citation: "art. 7.1 LGT"
  difficulty: 1
  tags:
  - "definición"
  - "órgano"
# anchor: boe-a-2003-23186-art-7
- id: m03-l03-q0013
  prompt:
    es: "Según el artículo 7.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los tributos se rigen por varias fuentes. Señale la que NO figura entre ellas:"
  options:
  - id: a
    text:
      es: "Los tratados internacionales que contengan cláusulas de naturaleza tributaria."
  - id: b
    text:
      es: "Las leyes reguladoras de cada tributo y las demás leyes con disposiciones tributarias."
  - id: c
    text:
      es: "Las disposiciones reglamentarias dictadas en desarrollo de las normas anteriores."
  - id: d
    correct: true
    text:
      es: "Los usos y costumbres del tráfico mercantil entre particulares."
  explanation:
    es: "El artículo 7.1 no cita los usos y costumbres mercantiles entre las fuentes de los tributos. Sí enumera los tratados o convenios con cláusulas tributarias, la propia ley, las leyes de cada tributo y las demás leyes con disposiciones en esta materia, y los reglamentos de desarrollo."
  citation: "art. 7.1 LGT"
  difficulty: 2
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-8
- id: m03-l03-q0016
  prompt:
    es: "Según el artículo 8 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué se regula en todo caso por ley en relación con las obligaciones tributarias de realizar pagos a cuenta?"
  options:
  - id: a
    text:
      es: "Los supuestos que dan lugar a su nacimiento, pero no su importe máximo."
  - id: b
    text:
      es: "Solo su importe máximo, no los supuestos que dan lugar a su nacimiento."
  - id: c
    correct: true
    text:
      es: "Los supuestos que dan lugar a su nacimiento y su importe máximo."
  - id: d
    text:
      es: "El procedimiento de ingreso y los modelos oficiales de declaración."
  explanation:
    es: "El artículo 8.b) reserva a la ley dos cosas a la vez: los supuestos de nacimiento de los pagos a cuenta y su importe máximo. Quedarse con una sola recorta la reserva. El procedimiento de ingreso y los modelos de declaración no figuran en ese apartado."
  citation: "art. 8 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "cantidad"
# anchor: boe-a-2003-23186-art-8
- id: m03-l03-q0017
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la reserva de ley del artículo 8 de la Ley 58/2003, de 17 de diciembre, General Tributaria es CORRECTA?"
  options:
  - id: a
    text:
      es: "La determinación de los obligados tributarios del apartado 2 del artículo 35 se regula por ley, pero la de los responsables puede hacerse por reglamento."
  - id: b
    text:
      es: "La determinación de los responsables se regula por ley, pero la de los obligados tributarios puede hacerse por reglamento."
  - id: c
    correct: true
    text:
      es: "La determinación de los obligados tributarios del apartado 2 del artículo 35 y de los responsables se regula en todo caso por ley."
  - id: d
    text:
      es: "La determinación de los obligados tributarios y de los responsables se regula por orden ministerial."
  explanation:
    es: "El artículo 8.c) somete a ley la determinación de los obligados tributarios del apartado 2 del artículo 35 y la de los responsables. Dejar a una de las dos categorías al reglamento, o a una orden ministerial, rompe la reserva, que cubre ambas."
  citation: "art. 8 LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "condición"
# anchor: boe-a-2003-23186-art-8
- id: m03-l03-q0023
  prompt:
    es: "Según el artículo 8 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cómo se regula la determinación de los actos susceptibles de reclamación en vía económico-administrativa?"
  options:
  - id: a
    text:
      es: "Por reglamento, con arreglo a lo que disponga la ley."
  - id: b
    correct: true
    text:
      es: "En todo caso por ley."
  - id: c
    text:
      es: "Por orden ministerial del Ministro de Hacienda."
  - id: d
    text:
      es: "Por acuerdo del Tribunal Económico-Administrativo Central."
  explanation:
    es: "El artículo 8.l) reserva a la ley la determinación de los actos susceptibles de reclamación en vía económico-administrativa. No cabe fijarlos por reglamento, por orden ministerial ni por acuerdo del Tribunal Económico-Administrativo Central, que resuelve reclamaciones y no define qué actos son reclamables."
  citation: "art. 8 LGT"
  difficulty: 1
  tags:
  - "órgano"
  - "definición"
# anchor: boe-a-2003-23186-art-8
- id: m03-l03-q0024
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las intervenciones tributarias de carácter permanente es CORRECTA, según el artículo 8 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Los supuestos en que proceda establecerlas se regulan por reglamento, previo informe del Consejo de Estado."
  - id: b
    text:
      es: "Los supuestos en que proceda establecerlas los fija la Administración tributaria en cada caso concreto."
  - id: c
    text:
      es: "Solo pueden establecerse en los supuestos que fije una orden ministerial del Ministro de Hacienda."
  - id: d
    correct: true
    text:
      es: "Los supuestos en que proceda establecerlas se regulan en todo caso por ley."
  explanation:
    es: "El artículo 8.m) incluye en la reserva de ley los supuestos en que proceda establecer intervenciones tributarias de carácter permanente. No los fija un reglamento, ni la Administración caso a caso, ni una orden ministerial."
  citation: "art. 8 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "definición"
# anchor: boe-a-2003-23186-art-10
- id: m03-l03-q0025
  prompt:
    es: "Según el artículo 10.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si en ellas no se dispone otra cosa, ¿cuándo entran en vigor las normas tributarias respecto de su completa publicación en el boletín oficial que corresponda?"
  options:
  - id: a
    text:
      es: "A los treinta días naturales de su completa publicación."
  - id: b
    correct: true
    text:
      es: "A los veinte días naturales de su completa publicación."
  - id: c
    text:
      es: "A los quince días naturales de su completa publicación."
  - id: d
    text:
      es: "A los tres meses de su completa publicación."
  explanation:
    es: "El artículo 10.1 fija veinte días naturales desde la completa publicación, salvo que la propia norma disponga otra cosa. Treinta días, quince días y tres meses no son el plazo de ese apartado."
  citation: "art. 10.1 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "fecha"
# anchor: boe-a-2003-23186-art-10
- id: m03-l03-q0026
  prompt:
    es: "Conforme al artículo 10.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, una vez en vigor, las normas tributarias se aplicarán:"
  options:
  - id: a
    text:
      es: "durante un máximo de cuatro años, salvo que se prorroguen expresamente."
  - id: b
    text:
      es: "por plazo indefinido, sin que la propia norma pueda fijar un plazo determinado."
  - id: c
    text:
      es: "hasta el final del ejercicio en que se publican, salvo que se prorroguen."
  - id: d
    correct: true
    text:
      es: "por plazo indefinido, salvo que se fije un plazo determinado."
  explanation:
    es: "El artículo 10.1 manda aplicar las normas tributarias por plazo indefinido, salvo que se fije un plazo determinado. Un máximo de cuatro años o la vigencia limitada al ejercicio de publicación no son reglas del precepto. Tampoco se prohíbe que la norma fije su plazo: el apartado lo admite expresamente."
  citation: "art. 10.1 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "condición"
# anchor: boe-a-2003-23186-art-10
- id: m03-l03-q0027
  prompt:
    es: "De acuerdo con el artículo 10.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el efecto retroactivo de las normas tributarias:"
  options:
  - id: a
    correct: true
    text:
      es: "Las normas que regulan el régimen de infracciones y sanciones y el de los recargos tienen efectos retroactivos respecto de los actos no firmes cuando su aplicación resulte más favorable para el interesado."
  - id: b
    text:
      es: "Las normas que regulan el régimen de infracciones y sanciones y el de los recargos tienen efectos retroactivos respecto de los actos firmes cuando su aplicación resulte más favorable."
  - id: c
    text:
      es: "Las normas que regulan el régimen de infracciones y sanciones y el de los recargos tienen efectos retroactivos en todo caso, aunque resulte más desfavorable para el interesado."
  - id: d
    text:
      es: "Las normas que regulan el régimen de infracciones y sanciones tienen efectos retroactivos respecto de los actos no firmes, pero no las que regulan los recargos."
  explanation:
    es: "Las normas sobre infracciones, sanciones y recargos son la excepción a la irretroactividad: operan sobre actos que no son firmes y solo si su aplicación resulta más favorable al interesado. Un acto firme queda fuera. Y la retroactividad no vale cuando perjudica. El apartado cubre a la vez el régimen de sanciones y el de recargos, de modo que no cabe excluir a estos últimos."
  citation: "art. 10.2 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "efecto"
# anchor: boe-a-2003-23186-art-10
- id: m03-l03-q0028
  prompt:
    es: "Hugo Lara recurrió en 2025 una sanción tributaria que se le impuso en 2024. El recurso sigue pendiente, de modo que el acto no es firme. En 2026 entra en vigor una ley que reduce la sanción prevista para esa infracción. Según el artículo 10.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué ocurre con la nueva ley?"
  options:
  - id: a
    text:
      es: "No se le aplica, porque las normas tributarias no tienen efecto retroactivo en ningún caso."
  - id: b
    text:
      es: "Se le aplica solo si la nueva ley dispone expresamente que tiene efecto retroactivo."
  - id: c
    correct: true
    text:
      es: "Se le aplica con efecto retroactivo, porque el acto no es firme y la nueva ley le resulta más favorable."
  - id: d
    text:
      es: "No se le aplica, porque la sanción se impuso antes de la entrada en vigor de la nueva ley."
  explanation:
    es: "Las normas sobre infracciones y sanciones tienen efecto retroactivo respecto de los actos no firmes cuando resultan más favorables, y aquí el acto está recurrido y la nueva sanción es menor. La irretroactividad general admite esta excepción por ley, así que no rige sin matices. No hace falta que la nueva ley lo diga expresamente, y que la sanción sea anterior a la entrada en vigor es justo el supuesto que el precepto cubre."
  citation: "art. 10.2 LGT"
  difficulty: 2
  tags:
  - "efecto"
  - "condición"
# anchor: boe-a-2003-23186-art-11
- id: m03-l03-q0030
  prompt:
    es: "¿Qué criterios de sujeción establece la ley en cada caso para aplicar los tributos, según el artículo 11 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Los de nacionalidad o domicilio que elija el obligado tributario en cada caso."
  - id: b
    text:
      es: "Los de residencia o territorialidad que determine la Administración tributaria en cada caso."
  - id: c
    text:
      es: "Solo el de territorialidad, tanto para los tributos personales como para los reales."
  - id: d
    correct: true
    text:
      es: "Los de residencia o territorialidad que establezca la ley en cada caso."
  explanation:
    es: "El artículo 11 remite a los criterios de residencia o territorialidad que fije la ley de cada tributo. No los elige el obligado ni la Administración, y la territorialidad no es el único criterio: los tributos personales siguen, en defecto de ley, el de residencia."
  citation: "art. 11 LGT"
  difficulty: 1
  tags:
  - "definición"
  - "sujeto"
# anchor: boe-a-2003-23186-art-12
- id: m03-l03-q0031
  prompt:
    es: "Según el artículo 12.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿con arreglo a qué norma se interpretan las normas tributarias?"
  options:
  - id: a
    text:
      es: "Con arreglo a lo dispuesto en la Ley de Enjuiciamiento Civil sobre interpretación de los contratos."
  - id: b
    correct: true
    text:
      es: "Con arreglo a lo dispuesto en el Código Civil sobre interpretación de las normas."
  - id: c
    text:
      es: "Con arreglo a lo dispuesto en la Ley del Procedimiento Administrativo Común sobre actos administrativos."
  - id: d
    text:
      es: "Con arreglo a lo dispuesto en la Constitución sobre interpretación de los derechos fundamentales."
  explanation:
    es: "El artículo 12.1 remite al apartado 1 del artículo 3 del Código Civil para interpretar las normas tributarias. La Ley de Enjuiciamiento Civil, la ley del procedimiento administrativo y la Constitución no son la remisión que hace el precepto."
  citation: "art. 12.1 LGT"
  difficulty: 1
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-12
- id: m03-l03-q0032
  prompt:
    es: "Conforme al artículo 12.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre los términos empleados en las normas tributarias que la normativa tributaria no define:"
  options:
  - id: a
    correct: true
    text:
      es: "Se entienden conforme a su sentido jurídico, técnico o usual, según proceda."
  - id: b
    text:
      es: "Se entienden conforme a su sentido jurídico, y nunca conforme a su sentido usual."
  - id: c
    text:
      es: "Se entienden conforme a la definición del derecho civil, aunque la normativa tributaria los defina."
  - id: d
    text:
      es: "Se entienden conforme a la interpretación que de ellos haga la Administración tributaria en cada caso."
  explanation:
    es: "Mientras la normativa tributaria no los defina, los términos se entienden en su sentido jurídico, técnico o usual, según proceda. Excluir el sentido usual lo recorta, y la definición civil solo valdría a falta de definición tributaria, no frente a ella. La interpretación de la Administración en cada caso no es el criterio del apartado."
  citation: "art. 12.2 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "definición"
# anchor: boe-a-2003-23186-art-13
- id: m03-l03-q0033
  prompt:
    es: "De acuerdo con el artículo 13 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las obligaciones tributarias se exigirán con arreglo a:"
  options:
  - id: a
    text:
      es: "la forma y la denominación que los interesados hayan dado al hecho, acto o negocio realizado."
  - id: b
    text:
      es: "la naturaleza jurídica del hecho, acto o negocio realizado, y solo si no adolece de defectos que afecten a su validez."
  - id: c
    text:
      es: "la voluntad declarada por las partes en el contrato, aunque difiera de la naturaleza jurídica del negocio."
  - id: d
    correct: true
    text:
      es: "la naturaleza jurídica del hecho, acto o negocio realizado, cualquiera que sea la forma o denominación que los interesados le hubieran dado."
  explanation:
    es: "El artículo 13 manda atender a la naturaleza jurídica del hecho, acto o negocio, con independencia de la forma o denominación que le den los interesados, y prescindiendo de los defectos que afecten a su validez. Por eso no valen ni la denominación de las partes, ni la voluntad declarada, ni la exigencia de que el negocio sea válido."
  citation: "art. 13 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "condición"
# anchor: boe-a-2003-23186-art-13
- id: m03-l03-q0034
  prompt:
    es: "Iván Cerezo y Marta Soto firman un documento titulado «cesión gratuita» de un local, pero Iván paga cada mes una cantidad por usarlo, lo que jurídicamente es un arrendamiento. Además, el documento adolece de un defecto de forma que afecta a su validez. Conforme al artículo 13 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿con arreglo a qué se exigirá la obligación tributaria?"
  options:
  - id: a
    text:
      es: "Al título que las partes dieron al documento, cesión gratuita, porque prevalece lo que ellas acordaron."
  - id: b
    correct: true
    text:
      es: "A la naturaleza jurídica del hecho realizado, el arrendamiento, aunque el documento se titule cesión gratuita y tenga un defecto de validez."
  - id: c
    text:
      es: "A la naturaleza jurídica del arrendamiento, pero solo si el documento no tiene defectos que afecten a su validez."
  - id: d
    text:
      es: "A la forma documental utilizada, salvo que la Administración tributaria pruebe lo contrario en el procedimiento."
  explanation:
    es: "El hecho se califica por su naturaleza jurídica, no por la denominación que le dan las partes, y los defectos de validez no impiden exigir la obligación. Aquí lo realizado es un arrendamiento. El título de cesión gratuita no obliga a la Administración, y condicionar la calificación a que el documento sea válido contradice el final del artículo 13. La forma documental no fija el hecho, aunque la Administración pueda probar otra cosa."
  citation: "art. 13 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "efecto"
# anchor: boe-a-2003-23186-art-14
- id: m03-l03-q0036
  prompt:
    es: "Conforme al artículo 14 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede aplicarse por analogía a las ventas de libros en formato electrónico la exención que una ley tributaria concede a las ventas de libros en papel?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque no se admite la analogía para extender el ámbito de las exenciones más allá de sus términos estrictos."
  - id: b
    text:
      es: "Sí, porque la analogía es admisible cuando la finalidad de la exención lo justifica."
  - id: c
    text:
      es: "Sí, si la Administración tributaria lo autoriza expresamente en una consulta vinculante."
  - id: d
    text:
      es: "No, porque las exenciones solo pueden aplicarse a quienes ejercen la actividad en nombre propio."
  explanation:
    es: "El artículo 14 prohíbe la analogía para extender el ámbito de las exenciones más allá de sus términos estrictos. La exención cubre los libros en papel y no puede ampliarse a los electrónicos por equivalencia, ni siquiera si su finalidad lo justificase. Tampoco una autorización de la Administración sustituye a la ley. El motivo de la negativa es la prohibición de la analogía, no una condición sobre quién ejerce la actividad."
  citation: "art. 14 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "efecto"
# anchor: boe-a-2003-23186-art-15
- id: m03-l03-q0041
  prompt:
    es: "Hilados del Sur, S.L., realiza una reorganización societaria que solo busca ahorrar impuestos, sin otros efectos jurídicos o económicos relevantes, mediante negocios notoriamente artificiosos. La operación es real y no hay ningún negocio aparente. ¿Qué figura describe el artículo 15 de la Ley 58/2003, de 17 de diciembre, General Tributaria y cómo la declara la Administración?"
  options:
  - id: a
    text:
      es: "Simulación, que declara en el acto de liquidación sin informe previo de la Comisión consultiva."
  - id: b
    correct: true
    text:
      es: "Conflicto en la aplicación de la norma tributaria, que declara con el previo informe favorable de la Comisión consultiva."
  - id: c
    text:
      es: "Simulación, que declara previo informe favorable de la Comisión consultiva."
  - id: d
    text:
      es: "Conflicto en la aplicación de la norma tributaria, que declara en el acto de liquidación sin informe previo."
  explanation:
    es: "Una operación real con negocios notoriamente artificiosos y sin otro efecto que el ahorro fiscal es un conflicto en la aplicación de la norma, no una simulación, que exige un negocio aparente. Para declararlo hace falta el informe favorable de la Comisión consultiva, y la simulación, en cambio, se declara en el acto de liquidación sin ese informe. Calificarla de simulación confunde la figura, y declarar el conflicto en el acto de liquidación sin informe omite el trámite que exige la ley."
  citation: "art. 15.2 LGT"
  difficulty: 3
  tags:
  - "definición"
  - "requisito"
