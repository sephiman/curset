# anchor: boe-a-2006-20764-art-14
- id: m03-l15-q0062
  prompt:
    es: "Conforme al artículo 14.1.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, los rendimientos de actividades económicas se imputan al período impositivo conforme a lo dispuesto en la normativa reguladora del:"
  options:
  - id: a
    text:
      es: "Código de Comercio, sin perjuicio de las especialidades que reglamentariamente puedan establecerse."
  - id: b
    text:
      es: "Impuesto sobre el Patrimonio, sin perjuicio de las especialidades que reglamentariamente puedan establecerse."
  - id: c
    correct: true
    text:
      es: "Impuesto sobre Sociedades, sin perjuicio de las especialidades que reglamentariamente puedan establecerse."
  - id: d
    text:
      es: "Impuesto sobre el Valor Añadido, sin perjuicio de las especialidades que reglamentariamente puedan establecerse."
  explanation:
    es: "La imputación de los rendimientos de actividades económicas sigue las normas del Impuesto sobre Sociedades (art. 14.1.b) LIRPF). El Impuesto sobre el Valor Añadido, el Código de Comercio y el Impuesto sobre el Patrimonio no son la norma de remisión que fija el precepto."
  citation: "art. 14.1 LIRPF"
  difficulty: 2
  tags:
  - "imputación temporal"
# anchor: boe-a-2006-20764-art-14
- id: m03-l15-q0063
  prompt:
    es: "Carlos Vega reclama judicialmente un salario de 2023 que su empresa no le abonó. La sentencia que le reconoce el derecho se dicta el 20 de diciembre de 2025 y adquiere firmeza el 15 de febrero de 2026. Según el artículo 14.2.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿a qué período impositivo se imputan los importes no satisfechos?"
  options:
  - id: a
    text:
      es: "Al de 2024, que es el período siguiente a aquel en que debió abonarse."
  - id: b
    correct: true
    text:
      es: "Al de 2026, que es el período en que la resolución adquiere firmeza."
  - id: c
    text:
      es: "Al de 2025, que es el período en que se dicta la resolución."
  - id: d
    text:
      es: "Al de 2023, que es el período en que el salario fue exigible."
  explanation:
    es: "Cuando la renta no se ha satisfecho por estar pendiente de resolución judicial, se imputa al período en que la resolución adquiere firmeza: 2026 (art. 14.2.a) LIRPF). Importa la firmeza, no la fecha de la sentencia, de modo que 2025 es incorrecto. Tampoco se retrotrae a 2023, cuando fue exigible, ni existe un período intermedio como 2024."
  citation: "art. 14.2.a) LIRPF"
  difficulty: 2
  tags:
  - "supuesto"
  - "imputación temporal"
# anchor: boe-a-2006-20764-art-14
- id: m03-l15-q0065
  prompt:
    es: "Señale la respuesta CORRECTA sobre la opción de imputar proporcionalmente las rentas de las operaciones a plazos o con precio aplazado a medida que se hagan exigibles los cobros, según el artículo 14.2.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Procede cuando el período transcurrido entre la entrega o la puesta a disposición y el vencimiento del último plazo es superior al año."
  - id: b
    text:
      es: "Procede cuando el período transcurrido entre la entrega o la puesta a disposición y el vencimiento del último plazo es igual o superior a dos años."
  - id: c
    text:
      es: "Procede cuando el período transcurrido entre la entrega o la puesta a disposición y el vencimiento del último plazo es superior a tres años."
  - id: d
    text:
      es: "Procede cuando el período transcurrido entre la entrega o la puesta a disposición y el vencimiento del último plazo es superior a seis meses."
  explanation:
    es: "El período entre la entrega y el último plazo debe ser superior al año (art. 14.2.d) LIRPF). Dos años, seis meses y tres años son umbrales cercanos que el precepto no recoge."
  citation: "art. 14.2.d) LIRPF"
  difficulty: 1
  tags:
  - "imputación temporal"
  - "plazo"
# anchor: boe-a-2006-20764-art-14
- id: m03-l15-q0066
  prompt:
    es: "Daniel Cano vende un terreno el 1 de marzo de 2026 por 60.000 euros: cobra 20.000 euros ese día, 20.000 euros el 1 de septiembre de 2026 y 20.000 euros el 1 de diciembre de 2026. Según el artículo 14.2.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿puede optar por imputar la renta a medida que se cobra?"
  options:
  - id: a
    text:
      es: "Sí, porque el precio se cobra en tres pagos sucesivos."
  - id: b
    correct: true
    text:
      es: "No, porque entre la entrega y el vencimiento del último plazo transcurren nueve meses, menos de un año."
  - id: c
    text:
      es: "Sí, porque entre la entrega y el último plazo transcurren más de seis meses."
  - id: d
    text:
      es: "No, porque la opción solo existe cuando el pago se instrumenta mediante efectos cambiarios transmitidos en firme."
  explanation:
    es: "Del 1 de marzo al 1 de diciembre de 2026 pasan nueve meses, y el artículo 14.2.d) LIRPF exige un período superior al año. Los pagos sucesivos no bastan. Seis meses no es el umbral, y los efectos cambiarios son otro supuesto del mismo apartado, no una condición de la opción."
  citation: "art. 14.2.d) LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "supuesto"
  - "plazo"
# anchor: boe-a-2006-20764-art-14
- id: m03-l15-q0068
  prompt:
    es: "De acuerdo con el artículo 14.2.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, cuando el pago de una operación a plazos se hubiese instrumentado mediante efectos cambiarios y estos fuesen transmitidos en firme antes de su vencimiento, la renta se imputa:"
  options:
  - id: a
    correct: true
    text:
      es: "al período impositivo de su transmisión."
  - id: b
    text:
      es: "al período impositivo en que se emitió el efecto cambiario."
  - id: c
    text:
      es: "al período impositivo en que se entregó el bien o derecho."
  - id: d
    text:
      es: "al período impositivo en que venza el efecto cambiario."
  explanation:
    es: "Si los efectos se transmiten en firme antes del vencimiento, la renta se imputa al período de la transmisión (art. 14.2.d) LIRPF). Ni el vencimiento, ni la emisión, ni la entrega del bien son el momento que establece la regla."
  citation: "art. 14.2.d) LIRPF"
  difficulty: 2
  tags:
  - "imputación temporal"
# anchor: boe-a-2006-20764-art-14
- id: m03-l15-q0069
  prompt:
    es: "Señale la respuesta CORRECTA respecto de la imputación en operaciones a plazos o con precio aplazado, según el artículo 14.2.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Tienen siempre ese tratamiento las operaciones derivadas de contratos de rentas vitalicias o temporales."
  - id: b
    text:
      es: "No tienen ese tratamiento las compraventas cuyo precio se cobre mediante pagos sucesivos durante más de un año."
  - id: c
    text:
      es: "No tienen ese tratamiento las compraventas cuyo precio se cobre en parte mediante efectos cambiarios."
  - id: d
    correct: true
    text:
      es: "En ningún caso tienen ese tratamiento, para el transmitente, las operaciones derivadas de contratos de rentas vitalicias o temporales."
  explanation:
    es: "Las rentas vitalicias y temporales quedan fuera de la imputación proporcional para el transmitente (art. 14.2.d) LIRPF). Las compraventas con pagos sucesivos de más de un año sí la admiten, y el pago parcial con efectos cambiarios tampoco la excluye: solo cambia el momento si se transmiten en firme."
  citation: "art. 14.2.d) LIRPF"
  difficulty: 3
  tags:
  - "imputación temporal"
# anchor: boe-a-2006-20764-art-14
- id: m03-l15-q0070
  prompt:
    es: "Conforme al artículo 14.4 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en el caso de fallecimiento del contribuyente todas las rentas pendientes de imputación se integran en la base imponible del:"
  options:
  - id: a
    text:
      es: "período impositivo en que se acepte la herencia."
  - id: b
    text:
      es: "período impositivo siguiente al del fallecimiento."
  - id: c
    correct: true
    text:
      es: "último período impositivo que deba declararse."
  - id: d
    text:
      es: "período impositivo en que los herederos cobren las rentas."
  explanation:
    es: "Las rentas pendientes de imputación se integran en el último período que deba declararse, el del fallecimiento (art. 14.4 LIRPF). El período siguiente, la aceptación de la herencia y el cobro por los herederos no son el criterio de la regla."
  citation: "art. 14.4 LIRPF"
  difficulty: 2
  tags:
  - "imputación temporal"
  - "fallecimiento"
# anchor: boe-a-2006-20764-art-6
- id: m03-l15-q0130
  prompt:
    es: "Según el artículo 6.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, constituye el hecho imponible del impuesto:"
  options:
  - id: a
    text:
      es: "la percepción de rentas dinerarias o en especie sujetas a retención o ingreso a cuenta."
  - id: b
    correct: true
    text:
      es: "la obtención de renta por el contribuyente."
  - id: c
    text:
      es: "la obtención de rendimientos del trabajo y del capital por el contribuyente."
  - id: d
    text:
      es: "la obtención de renta por el contribuyente durante más de 183 días del año natural."
  explanation:
    es: "El hecho imponible es la obtención de renta por el contribuyente (art. 6.1 LIRPF), sin más condiciones. Limitarlo a los rendimientos del trabajo y del capital deja fuera componentes de la renta. Los 183 días son un criterio de residencia, y la sujeción a retención no define el hecho imponible."
  citation: "art. 6.1 LIRPF"
  difficulty: 1
  tags:
  - "hecho imponible"
# anchor: boe-a-2006-20764-art-13
- id: m03-l15-q0131
  prompt:
    es: "De conformidad con el artículo 13.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el período impositivo es inferior al año natural cuando se produce el fallecimiento del contribuyente:"
  options:
  - id: a
    text:
      es: "antes del 30 de junio del año natural."
  - id: b
    text:
      es: "en cualquier día del año natural, incluido el 31 de diciembre."
  - id: c
    correct: true
    text:
      es: "en un día distinto al 31 de diciembre."
  - id: d
    text:
      es: "durante el último trimestre del año natural."
  explanation:
    es: "El período es inferior al año natural si el fallecimiento ocurre en un día distinto al 31 de diciembre (art. 13.1 LIRPF). Si ocurre el 31 de diciembre el período es completo, y la ley no usa fechas intermedias como el 30 de junio ni trimestres."
  citation: "art. 13 LIRPF"
  difficulty: 1
  tags:
  - "período impositivo"
# anchor: boe-a-2006-20764-art-10
- id: m03-l15-q0132
  prompt:
    es: "Conforme al artículo 10.1.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, se consideran contribuyentes los titulares de cargo o empleo oficial del Estado español, residentes en el extranjero, que sean miembros de delegaciones y representaciones permanentes acreditadas ante:"
  options:
  - id: a
    text:
      es: "tribunales internacionales de arbitraje, aunque no formen parte de misiones de observadores."
  - id: b
    text:
      es: "otros Estados, o que formen parte de delegaciones comerciales de las Comunidades Autónomas."
  - id: c
    text:
      es: "las instituciones de la Unión Europea, con exclusión de otros organismos internacionales."
  - id: d
    correct: true
    text:
      es: "organismos internacionales, o que formen parte de delegaciones o misiones de observadores en el extranjero."
  explanation:
    es: "La letra c) alcanza a los titulares de cargo o empleo oficial en delegaciones y representaciones permanentes ante organismos internacionales y a quienes formen parte de delegaciones o misiones de observadores (art. 10.1.c) LIRPF). Las delegaciones ante otros Estados son misiones diplomáticas, de la letra a). Y las instituciones europeas y los tribunales de arbitraje no son una lista cerrada que el precepto reproduzca."
  citation: "art. 10.1 LIRPF"
  difficulty: 3
  tags:
  - "residencia en el extranjero"
  - "contribuyentes"
# anchor: boe-a-2006-20764-art-10
- id: m03-l15-q0133
  prompt:
    es: "¿Cuál de las siguientes personas NO se considera contribuyente por residir en el extranjero en virtud del artículo 10.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Un vicecónsul honorario de una oficina consular española."
  - id: b
    text:
      es: "Un miembro del personal diplomático de una misión diplomática española."
  - id: c
    text:
      es: "Un titular de cargo oficial en una delegación permanente ante un organismo internacional."
  - id: d
    text:
      es: "Un funcionario en activo con cargo oficial sin carácter diplomático ni consular."
  explanation:
    es: "Los vicecónsules honorarios y los agentes consulares honorarios están excluidos de la letra b) del artículo 10.1 LIRPF, igual que su personal dependiente. Los miembros de misiones diplomáticas (letra a), los funcionarios en activo con cargo oficial (letra d) y los titulares de cargo en delegaciones permanentes (letra c) sí se consideran contribuyentes."
  citation: "art. 10.1 LIRPF"
  difficulty: 2
  tags:
  - "contribuyentes"
  - "negativa"
# anchor: boe-a-2006-20764-art-14
- id: m03-l15-q0134
  prompt:
    es: "El salario de diciembre de 2026 de Pedro Aranda era exigible el 31 de diciembre de 2026, pero su empresa se lo abona el 10 de enero de 2027. Según el artículo 14.1.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿a qué período impositivo se imputa ese rendimiento?"
  options:
  - id: a
    text:
      es: "Al de 2027, porque se imputan al período en que el pagador los contabiliza como gasto."
  - id: b
    text:
      es: "A ambos períodos, por mitades, porque el abono se produce en dos años distintos."
  - id: c
    correct: true
    text:
      es: "Al de 2026, porque los rendimientos del trabajo se imputan al período en que sean exigibles por su perceptor."
  - id: d
    text:
      es: "Al de 2027, porque se imputan al período en que el perceptor los cobra."
  explanation:
    es: "Lo que cuenta es la exigibilidad para el perceptor, que se da el 31 de diciembre de 2026, no el cobro del 10 de enero de 2027 (art. 14.1.a) LIRPF). La contabilización del pagador no es el criterio, y la ley no reparte el rendimiento entre dos períodos por el desfase del pago."
  citation: "art. 14.1 LIRPF"
  difficulty: 2
  tags:
  - "supuesto"
  - "imputación temporal"
# anchor: boe-a-2006-20764-art-14
- id: m03-l15-q0135
  prompt:
    es: "Lucía Martín transmite un piso mediante escritura otorgada el 20 de diciembre de 2026 y cobra el precio íntegro el 10 de febrero de 2027. Conforme al artículo 14.1.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿a qué período impositivo se imputa la ganancia o pérdida patrimonial?"
  options:
  - id: a
    text:
      es: "Al de 2027, porque se imputa al período en que sea exigible el precio por su perceptor."
  - id: b
    text:
      es: "Al de 2026 y al de 2027, por mitades, porque la transmisión y el cobro ocurren en años distintos."
  - id: c
    text:
      es: "Al de 2027, porque se imputa al período en que se cobra el precio."
  - id: d
    correct: true
    text:
      es: "Al de 2026, porque la alteración patrimonial tiene lugar en 2026."
  explanation:
    es: "La ganancia se imputa al período en que tiene lugar la alteración patrimonial, la transmisión de diciembre de 2026 (art. 14.1.c) LIRPF). El cobro posterior no cambia el período, y la regla de la exigibilidad es la de los rendimientos del trabajo y del capital. No hay reparto por mitades."
  citation: "art. 14.1 LIRPF"
  difficulty: 2
  tags:
  - "supuesto"
  - "imputación temporal"
# anchor: boe-a-2007-6820-art-2
- id: m03-l15-q0136
  prompt:
    es: "Marcos Díaz recibe en 2026 una beca pública para cursar un ciclo formativo de grado superior, estudio reglado del sistema educativo. La concesión se ajusta a los principios de mérito y capacidad, generalidad y no discriminación en las condiciones de acceso y publicidad de la convocatoria. Según el artículo 7.j) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas y el artículo 2.1 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, ¿está exenta?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque es una beca pública para estudios reglados concedida conforme a esos principios."
  - id: b
    text:
      es: "No, porque las becas tributan siempre como rendimientos del trabajo."
  - id: c
    text:
      es: "No, porque solo están exentas las becas para estudios universitarios."
  - id: d
    text:
      es: "Sí, pero solo hasta el importe de la matrícula, sin ningún otro concepto."
  explanation:
    es: "La beca pública para estudios reglados, concedida conforme a esos principios, está exenta (art. 2.1 RIRPF y art. 7.j) LIRPF). La exención abarca todos los niveles del sistema educativo, no solo el universitario. Las becas sí son rendimientos del trabajo, según el artículo 17.2.h), pero sin perjuicio del artículo 7. Y el texto no limita la exención al importe de la matrícula."
  citation: "art. 2.1 RIRPF"
  difficulty: 2
  tags:
  - "supuesto"
  - "beca"
# anchor: boe-a-2006-20764-art-8
- id: m03-l15-q0138
  prompt:
    es: "Ana y Luis Soto son comuneros al 50 por ciento de una comunidad de bienes que obtiene en 2026 rendimientos del capital inmobiliario. Según el artículo 8.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿quién tiene la condición de contribuyente por esas rentas?"
  options:
  - id: a
    text:
      es: "Solo el comunero que administra la comunidad, que declara la totalidad de las rentas."
  - id: b
    correct: true
    text:
      es: "Ana y Luis, a quienes se atribuyen las rentas de la comunidad de bienes, que no es contribuyente."
  - id: c
    text:
      es: "La comunidad de bienes, que tributa por las rentas como contribuyente."
  - id: d
    text:
      es: "La comunidad de bienes, que las atribuye después a los comuneros como renta exenta."
  explanation:
    es: "Las comunidades de bienes no son contribuyentes, y sus rentas se atribuyen a los comuneros, que son quienes tributan por ellas (art. 8.3 LIRPF). La comunidad no tributa por sí misma, la atribución no convierte la renta en exenta, y la ley no la concentra en el administrador."
  citation: "art. 8.3 LIRPF"
  difficulty: 2
  tags:
  - "supuesto"
  - "atribución de rentas"
# anchor: boe-a-2006-20764-art-11
- id: m03-l15-q0139
  prompt:
    es: "De conformidad con el artículo 11.5 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las ganancias y pérdidas patrimoniales se atribuyen a los contribuyentes que sean:"
  options:
  - id: a
    text:
      es: "adquirentes de los bienes, derechos y demás elementos patrimoniales de que provengan."
  - id: b
    text:
      es: "residentes en España en la fecha de la alteración del patrimonio de que provengan."
  - id: c
    text:
      es: "perceptores del precio de la transmisión de los bienes y derechos de que provengan."
  - id: d
    correct: true
    text:
      es: "titulares de los bienes, derechos y demás elementos patrimoniales de que provengan."
  explanation:
    es: "Las ganancias y pérdidas se atribuyen a los titulares de los bienes, derechos y demás elementos patrimoniales de que provienen (art. 11.5 LIRPF). El cobro del precio o la condición de adquirente no son el criterio, ni la residencia en la fecha de la alteración."
  citation: "art. 11.5 LIRPF"
  difficulty: 1
  tags:
  - "individualización"
# anchor: boe-a-2006-20764-art-11
- id: m03-l15-q0140
  prompt:
    es: "Según el artículo 11.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, los rendimientos del capital se atribuyen a los contribuyentes titulares de los bienes o derechos de que provengan, según las normas sobre titularidad jurídica y en función de:"
  options:
  - id: a
    text:
      es: "la inscripción de los bienes en el Registro Mercantil."
  - id: b
    text:
      es: "los pactos privados entre cónyuges sobre el reparto de los rendimientos."
  - id: c
    text:
      es: "la declaración del pagador de las rentas en sus declaraciones informativas anuales ante la Administración."
  - id: d
    correct: true
    text:
      es: "las pruebas aportadas por aquellos o de las descubiertas por la Administración."
  explanation:
    es: "La atribución se hace según las normas de titularidad jurídica y las pruebas aportadas por los contribuyentes o las descubiertas por la Administración (art. 11.3 LIRPF). El Registro Mercantil, las declaraciones del pagador y los pactos entre cónyuges no son el criterio del precepto."
  citation: "art. 11.3 LIRPF"
  difficulty: 2
  tags:
  - "individualización"
# anchor: boe-a-2006-20764-art-12
- id: m03-l15-q0141
  prompt:
    es: "¿Cuál es el período impositivo del Impuesto sobre la Renta de las Personas Físicas, de acuerdo con el artículo 12 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, cuando el contribuyente no fallece durante el año?"
  options:
  - id: a
    correct: true
    text:
      es: "El año natural."
  - id: b
    text:
      es: "El año que va del 1 de octubre al 30 de septiembre siguiente."
  - id: c
    text:
      es: "El semestre natural, con dos liquidaciones por año."
  - id: d
    text:
      es: "El ejercicio económico que elija el contribuyente."
  explanation:
    es: "El período impositivo es el año natural (art. 12.1 LIRPF), sin excepción salvo el fallecimiento. El contribuyente no elige un ejercicio económico distinto, ni el impuesto se fracciona en semestres."
  citation: "art. 12 LIRPF"
  difficulty: 1
  tags:
  - "período impositivo"
# anchor: boe-a-2006-20764-art-10
- id: m03-l15-q0143
  prompt:
    es: "Javier Torres, de nacionalidad española, es miembro del personal diplomático de la misión de España en Londres y reside allí desde 2025. Según el artículo 10.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿tiene la consideración de contribuyente?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque los miembros de misiones diplomáticas españolas que residen en el extranjero se consideran contribuyentes."
  - id: b
    text:
      es: "Sí, pero solo durante el período del cambio de residencia y los cuatro períodos impositivos siguientes."
  - id: c
    text:
      es: "No, porque reside habitualmente en el extranjero y no permanece más de 183 días en España."
  - id: d
    text:
      es: "No, porque solo se consideran contribuyentes los funcionarios sin carácter diplomático o consular."
  explanation:
    es: "Los miembros de misiones diplomáticas españolas se consideran contribuyentes aunque residan en el extranjero (art. 10.1.a) LIRPF). Los 183 días son el criterio de la residencia en España del artículo 9, que aquí no se aplica. La letra d) añade a los funcionarios sin carácter diplomático, no excluye a los diplomáticos. Y los cuatro períodos son la regla de los paraísos fiscales del artículo 8.2."
  citation: "art. 10.1 LIRPF"
  difficulty: 2
  tags:
  - "supuesto"
  - "residencia en el extranjero"
# anchor: boe-a-2006-20764-art-14
- id: m03-l15-q0145
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la imputación temporal es CORRECTA, según el artículo 14.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Los rendimientos del trabajo se imputan al período impositivo en que el perceptor los cobra efectivamente."
  - id: b
    text:
      es: "Los rendimientos del capital se imputan al período impositivo en que el pagador los devenga."
  - id: c
    correct: true
    text:
      es: "Las ganancias y pérdidas patrimoniales se imputan al período impositivo en que tenga lugar la alteración patrimonial."
  - id: d
    text:
      es: "Los rendimientos de actividades económicas se imputan al período impositivo en que se cobran las facturas."
  explanation:
    es: "Para las ganancias y pérdidas el criterio es la alteración patrimonial (art. 14.1.c) LIRPF). Los rendimientos del trabajo y del capital se imputan por la exigibilidad para el perceptor, no por el cobro ni por el devengo del pagador. Y los de actividades económicas siguen las normas del Impuesto sobre Sociedades."
  citation: "art. 14.1 LIRPF"
  difficulty: 2
  tags:
  - "imputación temporal"
# anchor: boe-a-2006-20764-art-6
- id: m03-l15-q0146
  prompt:
    es: "Según el artículo 6.4 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿está sujeta al Impuesto sobre la Renta de las Personas Físicas la adquisición por herencia de un depósito de 50.000 euros recibido de su padre?"
  options:
  - id: a
    text:
      es: "No, porque está exenta, aunque está sujeta al Impuesto sobre la Renta de las Personas Físicas."
  - id: b
    text:
      es: "Sí, como ganancia patrimonial, sin perjuicio de su tributación en el Impuesto sobre Sucesiones y Donaciones del causante."
  - id: c
    correct: true
    text:
      es: "No, porque la renta que se encuentra sujeta al Impuesto sobre Sucesiones y Donaciones no está sujeta a este impuesto."
  - id: d
    text:
      es: "Sí, como rendimiento del capital mobiliario, con deducción en la cuota por la doble imposición."
  explanation:
    es: "La adquisición por herencia está sujeta al Impuesto sobre Sucesiones y Donaciones y, por eso, no sujeta al IRPF (art. 6.4 LIRPF). No cabe la doble tributación como ganancia o como rendimiento. Tampoco es una exención: la no sujeción y la exención son figuras distintas."
  citation: "art. 6.4 LIRPF"
  difficulty: 2
  tags:
  - "no sujeción"
# anchor: boe-a-2006-20764-art-9
- id: m03-l15-q0149
  prompt:
    es: "Teresa Mora permaneció en 2026 exactamente 183 días en España y estuvo ausente 182 días, durante los cuales acredita residencia fiscal en Portugal. No tiene en España su núcleo de intereses ni familiares a cargo. Según el artículo 9.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿tiene su residencia habitual en España?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque 183 días no son más de 183 y las ausencias no se computan al acreditar su residencia fiscal en otro país."
  - id: b
    text:
      es: "No, porque solo se es residente si se permanece más de 183 días y se tiene a la familia en España."
  - id: c
    text:
      es: "Sí, porque permaneció 183 días y las ausencias esporádicas se computan."
  - id: d
    text:
      es: "Sí, porque 183 días de permanencia son suficientes para ser residente."
  explanation:
    es: "La permanencia debe ser de más de 183 días y 183 exactos no lo son. Las ausencias esporádicas se computarían salvo que se acredite la residencia fiscal en otro país, y Teresa la acredita en Portugal (art. 9.1.a) LIRPF). Tampoco concurre el criterio del núcleo de intereses ni la presunción familiar, así que no es residente. La familia no es requisito del criterio de permanencia."
  citation: "art. 9.1 LIRPF"
  difficulty: 3
  tags:
  - "cómputo"
  - "supuesto"
  - "residencia"
# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0150
  prompt:
    es: "¿Cuál de las siguientes rentas está exenta del impuesto, de acuerdo con el artículo 7 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Las pensiones de jubilación percibidas de los regímenes públicos de la Seguridad Social."
  - id: b
    text:
      es: "Las ayudas para el estudio concedidas por un Ente Público a sus propios trabajadores."
  - id: c
    text:
      es: "Las prestaciones por desempleo percibidas mensualmente de la entidad gestora."
  - id: d
    correct: true
    text:
      es: "Las prestaciones percibidas por entierro o sepelio, con el límite del importe total de los gastos incurridos."
  explanation:
    es: "Las prestaciones por entierro o sepelio están exentas hasta el importe de los gastos incurridos (art. 7.r) LIRPF). El desempleo mensual no entra en la letra n), que solo cubre el pago único. Las ayudas de un Ente Público a sus trabajadores se excluyen en el artículo 2.1 RIRPF, y las pensiones de jubilación son rendimientos del trabajo (art. 17.2.a))."
  citation: "art. 7.r) LIRPF"
  difficulty: 2
  tags:
  - "exención"
  - "lista"
# anchor: boe-a-2006-20764-art-8
- id: m03-l15-q0243
  prompt:
    es: "¿Quién tributa en el Impuesto sobre la Renta de las Personas Físicas por las rentas de una herencia yacente, de acuerdo con la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "El albacea, que declara las rentas en nombre del causante."
  - id: b
    text:
      es: "La propia herencia yacente, que es contribuyente por sus rentas."
  - id: c
    text:
      es: "Nadie, porque las rentas de la herencia yacente están sujetas al Impuesto sobre Sucesiones y Donaciones."
  - id: d
    correct: true
    text:
      es: "Los herederos, a quienes se atribuyen las rentas, porque la herencia yacente no es contribuyente."
  explanation:
    es: "La herencia yacente no es contribuyente, y sus rentas se atribuyen a los herederos (art. 8.3 LIRPF). El albacea no es el obligado. Y las rentas que genera la herencia no son la adquisición sujeta al Impuesto sobre Sucesiones y Donaciones del artículo 6.4: esas rentas sí tributan en el IRPF."
  citation: "art. 8.3 LIRPF"
  difficulty: 3
  tags:
  - "contribuyentes"
  - "atribución de rentas"
# anchor: boe-a-2006-20764-art-8
- id: m03-l15-q0247
  prompt:
    es: "De acuerdo con el artículo 8.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿a qué personas se refiere la regla que mantiene la condición de contribuyente tras el cambio de residencia a un paraíso fiscal?"
  options:
  - id: a
    correct: true
    text:
      es: "A las personas físicas de nacionalidad española que acrediten su nueva residencia fiscal en un país o territorio considerado paraíso fiscal."
  - id: b
    text:
      es: "A las personas físicas de cualquier nacionalidad que acrediten su nueva residencia fiscal en un paraíso fiscal."
  - id: c
    text:
      es: "A las personas jurídicas españolas que trasladen su domicilio fiscal a un paraíso fiscal."
  - id: d
    text:
      es: "A las personas físicas de nacionalidad española que trasladen su residencia a cualquier otro Estado."
  explanation:
    es: "La regla del artículo 8.2 LIRPF alcanza a las personas físicas de nacionalidad española que acreditan una nueva residencia fiscal en un paraíso fiscal. No se aplica a otras nacionalidades, ni a cualquier traslado ajeno a esos territorios, ni a las personas jurídicas."
  citation: "art. 8.2 LIRPF"
  difficulty: 2
  tags:
  - "contribuyentes"
  - "paraíso fiscal"
