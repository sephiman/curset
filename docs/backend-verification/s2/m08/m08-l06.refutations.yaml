m08-l06-q01:
  key:
    anchor: axon-snapshotting#_snapshot_lifecycle
    sentence: Any events that occurred after the snapshot’s position are then applied to bring the entity up to date.
  wrong:
  - option: It replays every event from the first one and uses the snapshot only to verify the result
    anchor: axon-snapshotting#_snapshot_lifecycle
    sentence: If a snapshot is available and can be used, the entity is initialized from that snapshot.
  - option: It deletes the events that precede the snapshot from the event store
    anchor: axon-event-sourced-entity#cmdk-launch
    sentence: This makes the event log the single source of truth, giving you a complete and immutable audit trail of everything that ever happened to the entity.
  - option: It applies only the events that occurred before the snapshot's position
    anchor: axon-snapshotting#_why_use_snapshots
    sentence: the system can restore the entity directly from that snapshot and only apply the events that occurred afterwards
m08-l06-q02:
  key:
    anchor: axon-event-processors-subscribing#cmdk-launch
    sentence: a failing handler propagates its failure back to the publisher, failing the event publication.
  wrong:
  - option: The processor resumes from its last token after a restart and retries the event
    anchor: axon-event-processors-subscribing#cmdk-launch
    sentence: When using a simple bus solution like the EventBus as the event source, the Subscribing Processor will only receive current events.
  - option: The publication completes at once, because the handler runs on a separate thread
    anchor: axon-event-processors-subscribing#cmdk-launch
    sentence: Furthermore, when the EventBus is used as the event source, the event publishing thread is the same one that handles the event in the Subscribing Processor.
  - option: The publication is rolled back only for that handler, and the other handlers still receive the event
    anchor: axon-event-processors-subscribing#cmdk-launch
    sentence: As a result, publication through the EventBus completes only after every subscribed handler has finished
m08-l06-q03:
  key:
    anchor: axon-event-processors-streaming#tracking_tokens
    sentence: Replaying events by adjusting the token position of that processor.
  wrong:
  - option: By rewriting the stored events in the event store with corrected payloads
    anchor: axon-event-sourced-entity#cmdk-launch
    sentence: This makes the event log the single source of truth, giving you a complete and immutable audit trail of everything that ever happened to the entity.
  - option: By clearing the token store, so that the processor handles the stream from the start as a replay
    anchor: axon-event-processors-streaming#initial_token
    sentence: These events are handled as regular events, not as a replay.
  - option: By starting a Subscribing Processor on the `EventBus`, which re-delivers old events
    anchor: axon-event-processors-subscribing#cmdk-launch
    sentence: Operations like replaying are, therefore, not an option for any Subscribing Processor.
