# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q062
  prompt:
    es: "El registro electrónico propio de que pueden disponer los Organismos públicos vinculados o dependientes de una Administración ha de ser:"
  options:
  - id: a
    text:
      es: "Parte del Registro Electrónico General, sin numeración ni asientos propios del Organismo."
  - id: b
    text:
      es: "Independiente del Registro Electrónico General, con su propio calendario de días hábiles."
  - id: c
    text:
      es: "Accesible solo desde la sede del Organismo, sin conexión con otras Administraciones."
  - id: d
    correct: true
    text:
      es: "Plenamente interoperable e interconectado con el Registro Electrónico General de su Administración."
  explanation:
    es: "El artículo 16.1 de la Ley 39/2015 permite a esos Organismos «disponer de su propio registro electrónico plenamente interoperable e interconectado con el Registro Electrónico General de la Administración de la que depende». Es un registro propio, así que no carece de asientos propios. No es independiente del Registro General, y el calendario de días inhábiles lo fija la sede de cada registro según el artículo 31.3. Tampoco queda aislado: la interconexión es la condición que pone la ley."
  citation: "art. 16.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q077
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cada Administración dispondrá de un Registro Electrónico General, en el que se hará el asiento de todo documento presentado o recibido en cualquier:"
  options:
  - id: a
    text:
      es: "Oficina de Correos o representación diplomática u oficina consular de España en el extranjero."
  - id: b
    text:
      es: "Archivo central o intermedio de la Administración correspondiente, una vez finalizado el trámite."
  - id: c
    correct: true
    text:
      es: "Órgano administrativo, Organismo público o Entidad vinculado o dependiente de ellos."
  - id: d
    text:
      es: "Sede electrónica asociada de un Ministerio, con exclusión de sus Organismos públicos vinculados."
  explanation:
    es: "El Registro Electrónico General recoge los documentos presentados o recibidos en cualquier órgano, Organismo público o Entidad vinculado o dependiente. Correos y las representaciones diplomáticas son lugares de presentación, no sujetos del asiento. Los archivos custodian documentos ya tramitados. Excluir a los Organismos contradice el texto."
  citation: "art. 16.1 LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q078
  prompt:
    es: "¿Qué puede anotarse también en el Registro Electrónico General de cada Administración, además de los documentos que se presentan o se reciben?"
  options:
  - id: a
    text:
      es: "Las resoluciones de eliminación de documentos de los archivos centrales y del intermedio."
  - id: b
    text:
      es: "Los documentos electrónicos de procedimientos ya finalizados en esa Administración."
  - id: c
    correct: true
    text:
      es: "La salida de los documentos oficiales dirigidos a otros órganos o particulares."
  - id: d
    text:
      es: "Las copias auténticas expedidas por los funcionarios habilitados de las oficinas."
  explanation:
    es: "El precepto permite anotar la salida de los documentos oficiales dirigidos a otros órganos o particulares. Las eliminaciones y los documentos de procedimientos finalizados pertenecen al ámbito del archivo. Las copias auténticas se expiden por funcionarios habilitados y no son un asiento del registro."
  citation: "art. 16.1 LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2021-20477-art-1
- id: m02-l03-q080
  prompt:
    es: "Según la Orden PCM/1382/2021, de 9 de diciembre, por la que se regula el Registro Electrónico General en el ámbito de la Administración General del Estado, el REG-AGE es el conjunto agregado de los asientos de las unidades registrales, las anotaciones de aplicaciones de procedimientos específicos y las del servicio electrónico accesible desde:"
  options:
  - id: a
    text:
      es: "La sede electrónica de cada Ministerio, de forma exclusiva y sin otro acceso general."
  - id: b
    correct: true
    text:
      es: "La sede electrónica del Punto de Acceso General de la Administración General del Estado."
  - id: c
    text:
      es: "El portal de cada registro electrónico de los Organismos públicos que tienen registro propio."
  - id: d
    text:
      es: "La sede electrónica del Ministerio de Cultura, como órgano coordinador del Sistema de Archivos."
  explanation:
    es: "La orden sitúa el servicio electrónico del REG-AGE en la sede del Punto de Acceso General. Las sedes de los Ministerios sirven a sus propios procedimientos, pero no son la sede del servicio general. Los portales de los Organismos corresponden a registros propios, que quedan fuera del ámbito del REG-AGE. El Ministerio de Cultura no interviene en este registro."
  citation: "art. 1.2 Orden PCM/1382/2021"
  difficulty: 3
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2021-20477-art-1
- id: m02-l03-q081
  prompt:
    es: "Según la Orden PCM/1382/2021, de 9 de diciembre, por la que se regula el Registro Electrónico General en el ámbito de la Administración General del Estado, el ámbito del REG-AGE es la Administración General del Estado y sus Organismos públicos y Entidades de derecho público vinculados o dependientes que:"
  options:
  - id: a
    text:
      es: "Hayan sido creados por una Comunidad Autónoma."
  - id: b
    text:
      es: "Cumplan las medidas del Esquema Nacional de Seguridad."
  - id: c
    correct: true
    text:
      es: "No dispongan de su propio registro."
  - id: d
    text:
      es: "Presten asistencia en las oficinas de Correos."
  explanation:
    es: "El REG-AGE cubre a los Organismos y Entidades de derecho público de la Administración General del Estado que no tienen registro propio. Los creados por una Comunidad Autónoma no pertenecen a esa Administración. Prestar asistencia en Correos o cumplir el Esquema Nacional de Seguridad no delimita el ámbito."
  citation: "art. 1.3 Orden PCM/1382/2021"
  difficulty: 2
  tags:
  - "concepto"
  - "competencia"
# anchor: boe-a-2021-5032-art-38
- id: m02-l03-q144
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, las anotaciones en el Registro General de la Administración General del Estado tendrán plena eficacia y validez:"
  options:
  - id: a
    text:
      es: "Solo para la Administración General del Estado."
  - id: b
    text:
      es: "Solo para los organismos públicos vinculados."
  - id: c
    correct: true
    text:
      es: "Para todas las Administraciones Públicas."
  - id: d
    text:
      es: "Para la Administración General del Estado y las Comunidades Autónomas."
  explanation:
    es: "El apartado reconoce a esas anotaciones plena eficacia y validez «para todas las Administraciones Públicas». Limitarlas a la Administración General del Estado, a sus organismos o a ella y las Comunidades Autónomas recorta el alcance que fija el texto."
  citation: "art. 38.2 RD 203/2021"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q171
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los Organismos públicos vinculados o dependientes de cada Administración podrán disponer de su propio registro electrónico plenamente:"
  options:
  - id: a
    text:
      es: "Gestionado por la sede electrónica del Punto de Acceso General."
  - id: b
    text:
      es: "Autónomo, sin conexión alguna con el Registro Electrónico General de la Administración de la que depende."
  - id: c
    text:
      es: "Interoperable con los registros de las demás Administraciones públicas, pero no con el de su propia Administración."
  - id: d
    correct: true
    text:
      es: "Interoperable e interconectado con el Registro Electrónico General de la Administración de la que depende."
  explanation:
    es: "Los organismos pueden tener registro propio, que ha de ser plenamente interoperable e interconectado con el Registro Electrónico General de su Administración. Un registro autónomo y sin conexión contradice esa exigencia. Interoperar con otras Administraciones pero no con la propia invierte el texto, y la gestión por el Punto de Acceso General no aparece."
  citation: "art. 16.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q173
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en el Registro Electrónico General de cada Administración, además del asiento de todo documento presentado o recibido, también se podrán anotar:"
  options:
  - id: a
    correct: true
    text:
      es: "La salida de los documentos oficiales dirigidos a otros órganos o particulares."
  - id: b
    text:
      es: "Las resoluciones de los recursos que se interpongan contra los asientos."
  - id: c
    text:
      es: "Las copias auténticas de los documentos emitidos por otras Administraciones Públicas en el ejercicio de sus competencias."
  - id: d
    text:
      es: "Los acuerdos de creación de los registros de los organismos públicos vinculados o dependientes."
  explanation:
    es: "El apartado permite anotar en el Registro Electrónico General, además de la entrada, la salida de los documentos oficiales dirigidos a otros órganos o particulares. Las resoluciones de recursos, las copias auténticas de otras Administraciones y los acuerdos de creación de registros no se mencionan como anotaciones posibles."
  citation: "art. 16.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-16
- id: m02-l03-q174
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las disposiciones de creación de los registros electrónicos especificarán el órgano o unidad responsable de su gestión, así como la fecha y hora oficial y:"
  options:
  - id: a
    text:
      es: "Los trámites que pueden iniciarse en el registro."
  - id: b
    text:
      es: "El calendario de conservación de sus asientos."
  - id: c
    text:
      es: "El horario de atención presencial de las oficinas de asistencia."
  - id: d
    correct: true
    text:
      es: "Los días declarados como inhábiles."
  explanation:
    es: "Las disposiciones de creación especifican el órgano responsable, la fecha y hora oficial y los días declarados inhábiles. La relación de trámites que pueden iniciarse figura en la sede electrónica de acceso al registro, no en la disposición de creación. El horario presencial y el calendario de conservación no aparecen."
  citation: "art. 16.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1985-12534-art-59
- id: m02-l03-q018
  prompt:
    es: "¿Cuáles de las siguientes instituciones son también Archivos según la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español?"
  options:
  - id: a
    text:
      es: "Las instituciones culturales donde se conservan, catalogan y difunden colecciones de libros y manuscritos."
  - id: b
    text:
      es: "Las instituciones permanentes que adquieren, investigan y exhiben colecciones de valor histórico o artístico."
  - id: c
    correct: true
    text:
      es: "Las instituciones culturales donde se reúnen, conservan, ordenan y difunden conjuntos orgánicos de documentos."
  - id: d
    text:
      es: "Las oficinas donde se digitalizan y anotan los documentos que presentan los interesados."
  explanation:
    es: "El artículo 59.1 llama también Archivos a «las instituciones culturales donde se reúnen, conservan, ordenan y difunden» los conjuntos orgánicos de documentos. Las que conservan y catalogan libros y manuscritos son Bibliotecas (artículo 59.2). Las que adquieren y exhiben colecciones de valor histórico o artístico son Museos (artículo 59.3). Las oficinas que digitalizan y anotan documentos son oficinas de asistencia en materia de registros, no Archivos."
  citation: "art. 59.1 Ley 16/1985"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-12534-art-59
- id: m02-l03-q145
  prompt:
    es: "Según la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español, los Archivos son los conjuntos orgánicos de documentos, o la reunión de varios de ellos, reunidos por las personas jurídicas públicas o privadas en el ejercicio de sus actividades, al servicio de su utilización para:"
  options:
  - id: a
    text:
      es: "La conservación, la tutela jurídica y la difusión comercial."
  - id: b
    text:
      es: "La docencia, la cultura, la información y la gestión administrativa."
  - id: c
    correct: true
    text:
      es: "La investigación, la cultura, la información y la gestión administrativa."
  - id: d
    text:
      es: "La investigación, la lectura pública y el préstamo temporal."
  explanation:
    es: "La finalidad que fija la ley es la investigación, la cultura, la información y la gestión administrativa. La opción de la docencia cambia la investigación por la enseñanza. La lectura pública y el préstamo temporal describen a las Bibliotecas, que el mismo artículo define aparte. La difusión comercial no figura."
  citation: "art. 59.1 Ley 16/1985"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1985-12534-art-59
- id: m02-l03-q146
  prompt:
    es: "Según la Ley 16/1985, de 25 de junio, del Patrimonio Histórico Español, se entienden también por Archivos las instituciones culturales donde se:"
  options:
  - id: a
    correct: true
    text:
      es: "Reúnen, conservan, ordenan y difunden los conjuntos orgánicos de documentos."
  - id: b
    text:
      es: "Conservan, reúnen, seleccionan, inventarían y catalogan colecciones de libros."
  - id: c
    text:
      es: "Tramitan y resuelven los procedimientos que los documentos documentan."
  - id: d
    text:
      es: "Custodian únicamente los documentos con valor histórico."
  explanation:
    es: "La ley llama también Archivos a las instituciones culturales donde se reúnen, conservan, ordenan y difunden esos conjuntos orgánicos. Reunir, seleccionar, inventariar y catalogar colecciones de libros es la función de las Bibliotecas, definidas en el apartado siguiente. Tramitar procedimientos no es función de la institución cultural. La custodia exclusiva de documentos históricos restringe la definición."
  citation: "art. 59.1 Ley 16/1985"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-17
- id: m02-l03-q147
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cada Administración deberá mantener un archivo electrónico único de los documentos electrónicos que correspondan a procedimientos finalizados, en los términos establecidos en:"
  options:
  - id: a
    text:
      es: "Los calendarios de conservación de cada Ministerio."
  - id: b
    text:
      es: "Las instrucciones de la Comisión de Archivos."
  - id: c
    correct: true
    text:
      es: "La normativa reguladora aplicable."
  - id: d
    text:
      es: "El Esquema Nacional de Seguridad."
  explanation:
    es: "El archivo electrónico único se rige por «la normativa reguladora aplicable». El Esquema Nacional de Seguridad aparece en el apartado de las medidas de seguridad de los soportes, no aquí. Los calendarios y las instrucciones de la Comisión de Archivos no se mencionan en este apartado."
  citation: "art. 17.1 LPAC"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2015-10565-art-17
- id: m02-l03-q148
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cada Administración deberá mantener un archivo electrónico:"
  options:
  - id: a
    text:
      es: "Por cada Departamento, de los documentos electrónicos con valor histórico."
  - id: b
    correct: true
    text:
      es: "Único de los documentos electrónicos que correspondan a procedimientos finalizados."
  - id: c
    text:
      es: "Por cada órgano, de los documentos electrónicos de los procedimientos en tramitación."
  - id: d
    text:
      es: "Único de los expedientes electrónicos que se encuentren en fase de recurso."
  explanation:
    es: "Cada Administración mantiene un archivo electrónico único y recoge en él los documentos electrónicos de procedimientos finalizados. Un archivo por órgano contradice lo de único. Los procedimientos en tramitación se gestionan en los archivos de oficina. El valor histórico y la fase de recurso no son el criterio del artículo."
  citation: "art. 17.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-55
- id: m02-l03-q149
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, el archivo electrónico único de cada Administración es el conjunto de sistemas y servicios que sustenta la gestión, custodia y recuperación de:"
  options:
  - id: a
    text:
      es: "Las comunicaciones electrónicas dirigidas a los interesados."
  - id: b
    text:
      es: "Los documentos y expedientes electrónicos mientras se tramitan los procedimientos."
  - id: c
    text:
      es: "Los documentos en papel digitalizados por las oficinas de asistencia."
  - id: d
    correct: true
    text:
      es: "Los documentos y expedientes electrónicos una vez finalizados los procedimientos o actuaciones correspondientes."
  explanation:
    es: "El archivo electrónico único sustenta la gestión, custodia y recuperación de documentos y expedientes «una vez finalizados los procedimientos». Los procedimientos en tramitación no están en él. La digitalización de documentos en papel es una función de las oficinas de asistencia y no define el archivo. Las comunicaciones a los interesados tampoco."
  citation: "art. 55.1 RD 203/2021"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-55
- id: m02-l03-q150
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, en el archivo electrónico único de la Administración General del Estado serán accesibles todos los documentos y expedientes del sector público estatal, finalizados los procedimientos, en los plazos determinados por:"
  options:
  - id: a
    text:
      es: "La Comisión de Archivos de la Administración General del Estado."
  - id: b
    correct: true
    text:
      es: "La Comisión Superior Calificadora de Documentos Administrativos."
  - id: c
    text:
      es: "La persona titular de cada Subsecretaría."
  - id: d
    text:
      es: "El Archivo General de la Administración."
  explanation:
    es: "Los plazos los determina la Comisión Superior Calificadora de Documentos Administrativos, de acuerdo con lo que se desarrolle reglamentariamente. La Comisión de Archivos elabora instrucciones y criterios, pero no fija estos plazos. El Archivo General de la Administración y las Subsecretarías no aparecen en el apartado."
  citation: "art. 55.1 RD 203/2021"
  difficulty: 3
  tags:
  - "órgano"
  - "plazo"
