    sentence: It can read the messages, process the messages, and finally save its position. In this case there is a possibility that the consumer process crashes after processing messages but before saving its position. In this case when the new process takes over the first few messages it receives will already have been processed. This corresponds to the “at-least-once” semantics in the case of consumer failure.
  wrong:
  - option: At-most-once, because the position is saved after the work
    anchor: kafka-design#message-delivery-semantics
    sentence: It can read the messages, then save its position in the log, and finally process the messages. In this case there is a possibility that the consumer process crashes after saving its position but before saving the output of its message processing. In this case the process that took over processing would start at the saved position even though a few messages prior to that position had not been processed. This corresponds to “at-most-once” semantics as in the case of a consumer failure messages may not be processed.
  - option: Exactly-once, because Kafka makes every consumer idempotent
    anchor: kafka-design#message-delivery-semantics
    sentence: Exactly-once delivery for other destination systems generally requires cooperation with such systems
