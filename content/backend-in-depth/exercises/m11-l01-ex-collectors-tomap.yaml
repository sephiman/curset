- id: m11-l01-v-collectors-tomap-001
  prompt:
    en: |-
      What does this program print? The result map is a `TreeMap`, so the order of the entries is fixed.

      ```java
      import java.util.List;
      import java.util.TreeMap;
      import java.util.stream.Collectors;

      public class Main {
          public static void main(String[] args) {
              List<String> words = List.of("apple", "avocado", "fig", "banana", "kiwi", "fig");
              var lengths = words.stream().collect(
                      Collectors.toMap(w -> w.charAt(0), String::length, Integer::sum, TreeMap::new));
              System.out.println(lengths);
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`{a=12, b=6, f=6, k=4}`'
    correct: true
  - id: b
    text:
      en: '`{a=7, b=6, f=3, k=4}`'
  - id: c
    text:
      en: '`{a=5, b=6, f=3, k=4}`'
  - id: d
    text:
      en: '`{a=6, e=5, g=6, i=4, o=7}`'
  explanation:
    en: 'Each word is keyed by `w.charAt(0)` and mapped to its length. When two words give the same key, `toMap` applies the
      merge function `Integer::sum` to the value already stored and the new one, so equal keys never throw. The `TreeMap`
      factory orders the entries by key. The program prints `{a=12, b=6, f=6, k=4}`. `{a=7, b=6, f=3, k=4}` comes from this
      mistake: merging with `max` instead of the merge function written. `{a=5, b=6, f=3, k=4}` comes from this mistake: merging
      with `min` instead of the merge function written. `{a=6, e=5, g=6, i=4, o=7}` comes from this mistake: keying by the
      last letter instead of the first.'
  family: collectors-tomap
  code_reading: true
  citation: javadoc-collectors#toMap(java.util.function.Function,java.util.function.Function,java.util.function.BinaryOperator)
  difficulty: 3
