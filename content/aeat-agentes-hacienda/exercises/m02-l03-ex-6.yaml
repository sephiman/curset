# anchor: boe-a-2015-10565-art-30
- id: m02-l03-q0148
  prompt:
    es: "A don Hugo se le notifica el viernes 6 de marzo de 2026 un requerimiento de subsanación con el plazo de diez días del artículo 68.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas. No hay festivos en marzo. Según los artículos 30.2 y 30.3, ¿cuándo vence el plazo?"
  options:
  - id: a
    text:
      es: "El lunes 16 de marzo de 2026."
  - id: b
    text:
      es: "El jueves 19 de marzo de 2026."
  - id: c
    text:
      es: "El lunes 23 de marzo de 2026."
  - id: d
    correct: true
    text:
      es: "El viernes 20 de marzo de 2026."
  explanation:
    es: "Los días son hábiles y se cuentan desde el día siguiente a la notificación: del lunes 9 al viernes 13 son cinco y del lunes 16 al viernes 20 otros cinco, luego vence el viernes 20. El lunes 16 sale de contar diez días naturales. El jueves 19 resulta de contar el día de la notificación como primero. Y el lunes 23 es un día más que los diez que fija la norma."
  citation: "art. 30.3 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
  - "días hábiles"
# anchor: boe-a-2015-10565-art-30
- id: m02-l03-q0150
  prompt:
    es: "A una empresa se le notifica el viernes 30 de enero de 2026 un acto expreso contra el que cabe recurso de alzada en el plazo de un mes (artículo 122.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas). No hay festivos en febrero ni en marzo. Según el artículo 30, apartados 4 y 5, ¿cuándo vence el plazo?"
  options:
  - id: a
    text:
      es: "El sábado 28 de febrero de 2026."
  - id: b
    correct: true
    text:
      es: "El lunes 2 de marzo de 2026."
  - id: c
    text:
      es: "El viernes 27 de febrero de 2026."
  - id: d
    text:
      es: "El domingo 1 de marzo de 2026."
  explanation:
    es: "El plazo en meses concluye el mismo día del mes de vencimiento y, si en febrero no existe el día 30, expira el último día del mes (artículo 30.4): el sábado 28 de febrero. Como es inhábil, se prorroga al primer día hábil siguiente (artículo 30.5), el lunes 2 de marzo. El sábado 28 olvida la prórroga, el viernes 27 adelanta indebidamente el plazo y el domingo 1 de marzo sale de contar treinta días naturales."
  citation: "art. 30.4 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
  - "meses"
# anchor: boe-a-2015-10565-art-30
- id: m02-l03-q0151
  prompt:
    es: "Conforme al artículo 30.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el plazo se fija en meses y en el mes de vencimiento no hay día equivalente a aquel en que comienza el cómputo, el plazo expira:"
  options:
  - id: a
    text:
      es: "el primer día del mes siguiente."
  - id: b
    correct: true
    text:
      es: "el último día del mes."
  - id: c
    text:
      es: "el último día hábil de ese mes."
  - id: d
    text:
      es: "el día equivalente del mes siguiente."
  explanation:
    es: "El artículo 30.4 dice que expira el último día del mes. No pasa al primer día del mes siguiente ni a su día equivalente, y no se restringe al último día hábil, porque la prórroga por inhábil se rige por el apartado 5."
  citation: "art. 30.4 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "meses"
# anchor: boe-a-2015-10565-art-30
- id: m02-l03-q0152
  prompt:
    es: "Para un interesado que reside en Sevilla, un día es festivo en su localidad pero hábil en Madrid, donde tiene su sede el órgano administrativo ante el que tramita el procedimiento. Según el artículo 30.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cómo se considera ese día para el cómputo de los plazos?"
  options:
  - id: a
    correct: true
    text:
      es: "Inhábil en todo caso."
  - id: b
    text:
      es: "Hábil, porque prevalece el calendario de la sede del órgano."
  - id: c
    text:
      es: "Hábil o inhábil según lo decida el órgano instructor."
  - id: d
    text:
      es: "Hábil, salvo que el interesado pida que se tenga por inhábil."
  explanation:
    es: "El artículo 30.6 considera inhábil en todo caso el día que lo sea en el lugar de residencia del interesado o en la sede del órgano, aunque en el otro sea hábil. No prevalece el calendario de la sede, ni decide el instructor, ni depende de que lo pida el interesado."
  citation: "art. 30.6 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "día inhábil"
  - "supuesto"
# anchor: boe-a-2015-10565-art-30
- id: m02-l03-q0153
  prompt:
    es: "Según el artículo 30.7 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el calendario de días inhábiles a efectos del cómputo de plazos debe publicarse:"
  options:
  - id: a
    text:
      es: "dentro del primer mes de cada año, solo en la sede electrónica de la Administración que lo apruebe."
  - id: b
    text:
      es: "una vez aprobado, sin plazo, en el tablón de anuncios de cada órgano que tramite procedimientos."
  - id: c
    text:
      es: "antes del 30 de noviembre de cada año, exclusivamente en el Boletín Oficial del Estado."
  - id: d
    correct: true
    text:
      es: "antes del comienzo de cada año en el diario oficial que corresponda, así como en otros medios que garanticen su conocimiento generalizado."
  explanation:
    es: "El artículo 30.7 exige publicar el calendario antes del comienzo de cada año en el diario oficial que corresponda y en otros medios que garanticen su conocimiento generalizado. No puede publicarse una vez iniciado el año, ni solo en una sede electrónica, ni solo en tablones, ni con una fecha límite y un diario únicos que la ley no fija."
  citation: "art. 30.7 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "calendario"
# anchor: boe-a-2015-10565-art-30
- id: m02-l03-q0154
  prompt:
    es: "¿Qué calendario de días inhábiles se aplica a las Entidades Locales de una Comunidad Autónoma, conforme al artículo 30.7 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El que apruebe cada Entidad Local mediante su propia ordenanza, para sus procedimientos."
  - id: b
    text:
      es: "El que apruebe la Administración General del Estado, para todas las Administraciones Públicas."
  - id: c
    correct: true
    text:
      es: "El aprobado por la Comunidad Autónoma, que comprende los días inhábiles de las Entidades Locales de su ámbito territorial."
  - id: d
    text:
      es: "El de cada municipio, que fija su alcalde antes del comienzo de cada año."
  explanation:
    es: "El artículo 30.7 dispone que el calendario aprobado por las Comunidades Autónomas comprende los días inhábiles de las Entidades Locales de su ámbito y les es de aplicación. No lo aprueba cada Entidad Local, ni el Estado para todas las Administraciones, ni el alcalde."
  citation: "art. 30.7 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "calendario"
# anchor: boe-a-2015-10565-art-31
- id: m02-l03-q0156
  prompt:
    es: "Según el artículo 31.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el registro electrónico de cada Administración u Organismo se rige, a efectos del cómputo de los plazos, por:"
  options:
  - id: a
    text:
      es: "la fecha y hora del servidor del órgano que tramite el procedimiento."
  - id: b
    correct: true
    text:
      es: "la fecha y hora oficial de la sede electrónica de acceso."
  - id: c
    text:
      es: "la fecha y hora del dispositivo desde el que el interesado envía el documento."
  - id: d
    text:
      es: "la fecha y hora en que la unidad competente abre el documento recibido."
  explanation:
    es: "El artículo 31.2 se refiere a la fecha y hora oficial de la sede electrónica de acceso, que debe contar con medidas de seguridad que garanticen su integridad. No cuenta la hora del servidor del órgano tramitador, ni la del dispositivo del interesado, ni el momento de apertura por la unidad competente."
  citation: "art. 31.2 LPAC"
  difficulty: 3
  tags:
  - "registro electrónico"
  - "cómputo"
# anchor: boe-a-2015-10565-art-31
- id: m02-l03-q0157
  prompt:
    es: "Conforme al artículo 31.2.a) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el registro electrónico permite la presentación de documentos:"
  options:
  - id: a
    correct: true
    text:
      es: "todos los días del año durante las veinticuatro horas."
  - id: b
    text:
      es: "los días hábiles durante las veinticuatro horas."
  - id: c
    text:
      es: "todos los días del año, en el horario de apertura de las oficinas de asistencia."
  - id: d
    text:
      es: "los días hábiles, en el horario que fije la sede electrónica de cada Administración."
  explanation:
    es: "El artículo 31.2.a) abre el registro electrónico todos los días del año durante las veinticuatro horas. No se limita a los días hábiles ni se vincula al horario de las oficinas de asistencia ni al que fije la sede."
  citation: "art. 31.2.a) LPAC"
  difficulty: 2
  tags:
  - "registro electrónico"
  - "horario"
# anchor: boe-a-2015-10565-art-31
- id: m02-l03-q0159
  prompt:
    es: "Según el artículo 31.2.b) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué excepción admite la regla de que la presentación en día inhábil se entiende realizada en la primera hora del primer día hábil siguiente?"
  options:
  - id: a
    text:
      es: "Que el interesado presente el documento fuera del horario de apertura de las oficinas."
  - id: b
    text:
      es: "Que el interesado sea una persona jurídica obligada a relacionarse electrónicamente."
  - id: c
    text:
      es: "Que el documento se presente durante las primeras horas del día inhábil."
  - id: d
    correct: true
    text:
      es: "Que una norma permita expresamente la recepción en día inhábil."
  explanation:
    es: "La única salvedad del artículo 31.2.b) es que una norma permita expresamente la recepción en día inhábil. No influyen el horario de las oficinas, ser persona jurídica obligada a relacionarse electrónicamente, ni la hora del día inhábil en que se presente."
  citation: "art. 31.2.b) LPAC"
  difficulty: 2
  tags:
  - "registro electrónico"
  - "excepción"
# anchor: boe-a-2015-10565-art-31
- id: m02-l03-q0160
  prompt:
    es: "Conforme al artículo 31.2.b) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre los documentos presentados en el registro electrónico en un día inhábil:"
  options:
  - id: a
    text:
      es: "Se reputan posteriores a los presentados el primer día hábil posterior, y entre sí por el orden de hora efectiva en que lo fueron."
  - id: b
    text:
      es: "Se consideran presentados por el orden de hora efectiva del primer día hábil posterior, junto con los que se presenten ese día."
  - id: c
    correct: true
    text:
      es: "Se reputan anteriores a los presentados el primer día hábil posterior, y entre sí por el orden de hora efectiva en que lo fueron."
  - id: d
    text:
      es: "Se reputan presentados todos a la vez en la primera hora del primer día hábil posterior, sin distinguir su hora efectiva."
  explanation:
    es: "El artículo 31.2.b) los considera presentados por el orden de hora efectiva en que lo fueron en el día inhábil y los reputa anteriores, según ese orden, a los presentados el primer día hábil posterior. No son posteriores, ni se mezclan con los del día hábil, ni se tratan como simultáneos."
  citation: "art. 31.2.b) LPAC"
  difficulty: 3
  tags:
  - "registro electrónico"
  - "orden"
# anchor: boe-a-2015-10565-art-31
- id: m02-l03-q0161
  prompt:
    es: "De acuerdo con el artículo 31.2.b) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la regla de presentación en día inhábil opera a los efectos del cómputo de los plazos:"
  options:
  - id: a
    text:
      es: "fijados en días naturales, y en lo que se refiere al cumplimiento de plazos por las Administraciones."
  - id: b
    correct: true
    text:
      es: "fijados en días hábiles, y en lo que se refiere al cumplimiento de plazos por los interesados."
  - id: c
    text:
      es: "fijados en días hábiles, y en lo que se refiere al cumplimiento de plazos por las Administraciones."
  - id: d
    text:
      es: "fijados en horas, y en lo que se refiere al cumplimiento de plazos por los interesados."
  explanation:
    es: "El artículo 31.2.b) se aplica a plazos fijados en días hábiles y al cumplimiento de plazos por los interesados. No alcanza a los plazos en días naturales, ni a los que han de cumplir las Administraciones, que se rigen por la letra c), ni a los plazos por horas."
  citation: "art. 31.2.b) LPAC"
  difficulty: 2
  tags:
  - "registro electrónico"
  - "ámbito"
# anchor: boe-a-2015-10565-art-31
- id: m02-l03-q0162
  prompt:
    es: "Según el artículo 31.2.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el inicio del cómputo de los plazos que han de cumplir las Administraciones Públicas viene determinado por la fecha y hora de:"
  options:
  - id: a
    correct: true
    text:
      es: "presentación en el registro electrónico de cada Administración u Organismo."
  - id: b
    text:
      es: "remisión del documento al órgano competente para su tramitación."
  - id: c
    text:
      es: "admisión a trámite del escrito por el órgano instructor."
  - id: d
    text:
      es: "emisión del acuse de recibo al interesado por la oficina de asistencia en materia de registros."
  explanation:
    es: "El artículo 31.2.c) fija como inicio la fecha y hora de presentación en el registro electrónico de cada Administración u Organismo. No es la remisión al órgano competente, ni la admisión a trámite, ni el acuse de recibo de una oficina."
  citation: "art. 31.2.c) LPAC"
  difficulty: 3
  tags:
  - "registro electrónico"
  - "cómputo"
# anchor: boe-a-2015-10565-art-31
- id: m02-l03-q0163
  prompt:
    es: "Una sociedad presenta una solicitud en el registro electrónico de un organismo que debe resolver en un plazo máximo. Según el artículo 31.2.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué debe comunicarle el organismo sobre el cómputo de ese plazo?"
  options:
  - id: a
    correct: true
    text:
      es: "La fecha y hora efectiva de inicio del cómputo del plazo, en todo caso."
  - id: b
    text:
      es: "La fecha de inicio del cómputo, y únicamente si la sociedad la solicita."
  - id: c
    text:
      es: "La fecha y hora en que la sociedad firmó el documento presentado."
  - id: d
    text:
      es: "El número de registro de entrada, sin referencia al inicio del cómputo."
  explanation:
    es: "El artículo 31.2.c) obliga a comunicar en todo caso a quien presentó el documento la fecha y hora efectiva de inicio del cómputo del plazo. No se hace solo a petición, ni se trata de la hora de firma del documento, ni basta el número de registro."
  citation: "art. 31.2.c) LPAC"
  difficulty: 2
  tags:
  - "registro electrónico"
  - "supuesto"
# anchor: boe-a-2015-10565-art-32
- id: m02-l03-q0164
  prompt:
    es: "El plazo de diez días hábiles de una empresa para atender un requerimiento vence el viernes 20 de marzo de 2026. Antes de esa fecha pide una ampliación y la Administración le concede la máxima que permite el artículo 32.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, sin perjudicar a terceros. No hay festivos. ¿Cuándo vence el plazo ampliado?"
  options:
  - id: a
    text:
      es: "El miércoles 25 de marzo de 2026."
  - id: b
    text:
      es: "El lunes 30 de marzo de 2026."
  - id: c
    text:
      es: "El viernes 3 de abril de 2026."
  - id: d
    correct: true
    text:
      es: "El viernes 27 de marzo de 2026."
  explanation:
    es: "La ampliación no puede exceder de la mitad del plazo, es decir, cinco días de los diez, y los días son hábiles: del lunes 23 al viernes 27 de marzo. El miércoles 25 resulta de sumar cinco días naturales. El lunes 30 supone conceder seis días, más de la mitad. Y el viernes 3 de abril equivale a duplicar el plazo, diez días más."
  citation: "art. 32.1 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "ampliación"
  - "plazo"
# anchor: boe-a-2015-10565-art-32
- id: m02-l03-q0165
  prompt:
    es: "El plazo de alegaciones de una asociación venció el lunes 9 de marzo de 2026. El martes 10 de marzo pide que se le amplíe. Según el artículo 32.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿puede la Administración concederle la ampliación?"
  options:
  - id: a
    text:
      es: "Sí, porque la Administración puede ampliar de oficio o a petición cualquier plazo."
  - id: b
    text:
      es: "Sí, siempre que la ampliación no exceda de la mitad del plazo original."
  - id: c
    correct: true
    text:
      es: "No, porque en ningún caso puede ser objeto de ampliación un plazo ya vencido."
  - id: d
    text:
      es: "Sí, si la petición se presenta antes de que se notifique el trámite siguiente."
  explanation:
    es: "El artículo 32.3 dice que en ningún caso puede ampliarse un plazo ya vencido, y el de la asociación venció el día 9. No es cierto que pueda ampliarse cualquier plazo, ni que baste respetar el límite de la mitad, ni que sirva pedirlo antes del trámite siguiente: la petición y la decisión deben producirse antes del vencimiento."
  citation: "art. 32.3 LPAC"
  difficulty: 2
  tags:
  - "ampliación"
  - "plazo vencido"
  - "supuesto"
# anchor: boe-a-2015-10565-art-32
- id: m02-l03-q0166
  prompt:
    es: "Conforme al artículo 32.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, tanto la petición de los interesados como la decisión sobre la ampliación de un plazo deben producirse, en todo caso:"
  options:
  - id: a
    text:
      es: "antes de que haya transcurrido la mitad del plazo de que se trate."
  - id: b
    correct: true
    text:
      es: "antes del vencimiento del plazo de que se trate."
  - id: c
    text:
      es: "dentro de los tres primeros días del plazo de que se trate."
  - id: d
    text:
      es: "antes de que se notifique el trámite siguiente del procedimiento."
  explanation:
    es: "El artículo 32.3 fija como límite el vencimiento del plazo de que se trate, para la petición y para la decisión. No exige hacerlo antes de la mitad del plazo ni en los tres primeros días, ni se refiere a la notificación del trámite siguiente."
  citation: "art. 32.3 LPAC"
  difficulty: 2
  tags:
  - "ampliación"
  - "plazo"
# anchor: boe-a-2015-10565-art-32
- id: m02-l03-q0167
  prompt:
    es: "De acuerdo con el artículo 32.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ante una incidencia técnica que haya imposibilitado el funcionamiento ordinario del sistema o aplicación, la Administración podrá determinar una ampliación de los plazos:"
  options:
  - id: a
    text:
      es: "vencidos y no vencidos, durante el tiempo que dure la incidencia."
  - id: b
    correct: true
    text:
      es: "no vencidos, hasta que se solucione el problema."
  - id: c
    text:
      es: "no vencidos, por un máximo de la mitad de su duración."
  - id: d
    text:
      es: "vencidos durante la incidencia, siempre que el interesado lo solicite."
  explanation:
    es: "El artículo 32.4 permite ampliar los plazos no vencidos hasta que se solucione el problema, y no impone el límite de la mitad del artículo 32.1. No alcanza a los vencidos, ni siquiera a petición del interesado."
  citation: "art. 32.4 LPAC"
  difficulty: 1
  tags:
  - "ampliación"
  - "incidencia técnica"
# anchor: boe-a-2015-10565-art-33
- id: m02-l03-q0168
  prompt:
    es: "Según el artículo 33.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, puede acordarse la tramitación de urgencia de oficio o a petición del interesado cuando lo aconsejen:"
  options:
  - id: a
    correct: true
    text:
      es: "razones de interés público."
  - id: b
    text:
      es: "razones de interés general apreciadas previa audiencia a los interesados."
  - id: c
    text:
      es: "la gravedad de los daños que puedan derivarse de la demora."
  - id: d
    text:
      es: "la complejidad técnica del procedimiento y el número de afectados."
  explanation:
    es: "El artículo 33.1 admite la tramitación de urgencia cuando razones de interés público lo aconsejen, de oficio o a petición del interesado. No exige audiencia previa, ni se refiere a la gravedad de los daños, ni a la complejidad del procedimiento, que más bien lleva a la tramitación simplificada cuando falta."
  citation: "art. 33 LPAC"
  difficulty: 1
  tags:
  - "urgencia"
  - "condición"
# anchor: boe-a-2015-10565-art-33
- id: m02-l03-q0169
  prompt:
    es: "A un procedimiento se le aplica la tramitación de urgencia. Para un trámite de instrucción su plazo ordinario es de diez días, y el plazo ordinario para interponer el recurso de alzada contra su resolución es de un mes. Según el artículo 33 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué plazos rigen?"
  options:
  - id: a
    text:
      es: "Cinco días para el trámite de instrucción y quince días para interponer el recurso de alzada."
  - id: b
    text:
      es: "Diez días para el trámite de instrucción y quince días para interponer el recurso de alzada."
  - id: c
    text:
      es: "Diez días para el trámite de instrucción y un mes para interponer el recurso de alzada."
  - id: d
    correct: true
    text:
      es: "Cinco días para el trámite de instrucción y un mes para interponer el recurso de alzada."
  explanation:
    es: "La tramitación de urgencia reduce a la mitad los plazos del procedimiento ordinario, salvo los de presentación de solicitudes y recursos (artículo 33.1): el trámite pasa de diez a cinco días, y el plazo de alzada sigue siendo de un mes. Reducir también este último a quince días contradice la excepción, y no reducir el trámite desconoce la regla."
  citation: "art. 33 LPAC"
  difficulty: 2
  tags:
  - "urgencia"
  - "plazo"
  - "supuesto"
# anchor: boe-a-2015-10565-art-68
- id: m02-l03-q0177
  prompt:
    es: "Si la solicitud de iniciación no reúne los requisitos del artículo 66, ¿en qué plazo debe requerirse al interesado que subsane la falta, con indicación de que si no lo hace se le tendrá por desistido de su petición, según el artículo 68.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "En un plazo de cinco días."
  - id: b
    correct: true
    text:
      es: "En un plazo de diez días."
  - id: c
    text:
      es: "En un plazo de quince días."
  - id: d
    text:
      es: "En un plazo de un mes."
  explanation:
    es: "El artículo 68.1 concede diez días para subsanar la falta o acompañar los documentos preceptivos. Cinco días es el máximo de la ampliación del artículo 68.2, y ni quince días ni un mes son el plazo fijado."
  citation: "art. 68.1 LPAC"
  difficulty: 1
  tags:
  - "subsanación"
  - "plazo"
# anchor: boe-a-2015-10565-art-122
- id: m02-l03-q0179
  prompt:
    es: "Conforme al artículo 122.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el acto no es expreso, el solicitante y otros posibles interesados podrán interponer recurso de alzada en cualquier momento a partir del día siguiente a aquel en que, de acuerdo con su normativa específica:"
  options:
  - id: a
    correct: true
    text:
      es: "se produzcan los efectos del silencio administrativo."
  - id: b
    text:
      es: "venza el plazo de tres meses para dictar y notificar la resolución."
  - id: c
    text:
      es: "se les notifique la certificación del silencio producido."
  - id: d
    text:
      es: "se publique en el diario oficial la desestimación presunta."
  explanation:
    es: "El artículo 122.1 permite recurrir en cualquier momento desde el día siguiente a que se produzcan los efectos del silencio según su normativa específica. No se cuenta desde el plazo de tres meses, que es el de resolución del recurso, ni desde el certificado, ni desde una publicación."
  citation: "art. 122.1 LPAC"
  difficulty: 1
  tags:
  - "alzada"
  - "silencio"
  - "plazo"
# anchor: boe-a-2015-10565-art-122
- id: m02-l03-q0180
  prompt:
    es: "De acuerdo con el artículo 122.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si contra un acto expreso transcurre el plazo de un mes para interponer el recurso de alzada sin que se haya interpuesto, la resolución:"
  options:
  - id: a
    text:
      es: "podrá recurrirse en alzada en cualquier momento, como un acto presunto."
  - id: b
    text:
      es: "será firme solo en vía administrativa, y podrá recurrirse en reposición."
  - id: c
    text:
      es: "será firme salvo para los interesados que no hubieran sido notificados."
  - id: d
    correct: true
    text:
      es: "será firme a todos los efectos."
  explanation:
    es: "Transcurrido el plazo de un mes sin interponer el recurso, el artículo 122.1 declara firme la resolución a todos los efectos. No pasa a recurrible en cualquier momento, que es la regla de los actos no expresos, ni queda solo firme en vía administrativa, ni se exceptúa a los no notificados."
  citation: "art. 122.1 LPAC"
  difficulty: 1
  tags:
  - "alzada"
  - "firmeza"
# anchor: boe-a-2015-10565-art-30
- id: m02-l03-q0190
  prompt:
    es: "Conforme al artículo 30.7 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre el calendario de días inhábiles a efectos del cómputo de plazos:"
  options:
  - id: a
    text:
      es: "Cada Administración Pública, incluidas las Entidades Locales, lo fija en su ámbito sin sujeción al calendario laboral oficial."
  - id: b
    text:
      es: "Las Comunidades Autónomas lo fijan sin sujeción al calendario laboral, y el de la Administración General del Estado se aplica en su defecto."
  - id: c
    text:
      es: "La Administración General del Estado lo fija con sujeción al calendario laboral oficial y es el único aplicable a las Comunidades Autónomas y a las Entidades Locales."
  - id: d
    correct: true
    text:
      es: "La Administración General del Estado y las Comunidades Autónomas lo fijan, cada una en su ámbito, con sujeción al calendario laboral oficial."
  explanation:
    es: "El artículo 30.7 atribuye la fijación a la Administración General del Estado y a las Comunidades Autónomas, cada una en su ámbito y con sujeción al calendario laboral oficial. Las Entidades Locales aplican el de su Comunidad Autónoma, no fijan el suyo, y el calendario estatal no se aplica a las Comunidades Autónomas como único ni como supletorio."
  citation: "art. 30.7 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "calendario"
# anchor: boe-a-2015-10565-art-32
- id: m02-l03-q0191
  prompt:
    es: "¿Qué debe hacerse con el acuerdo por el que la Administración concede una ampliación de plazos, según el artículo 32.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Publicarlo en el diario oficial correspondiente."
  - id: b
    text:
      es: "Comunicarlo solo al interesado que pidió la ampliación."
  - id: c
    text:
      es: "Inscribirlo en el registro electrónico de la Administración."
  - id: d
    correct: true
    text:
      es: "Notificarlo a los interesados."
  explanation:
    es: "El artículo 32.1 dispone que el acuerdo de ampliación deberá ser notificado a los interesados. No se publica en el diario oficial, ni se comunica solo a quien lo pidió, porque puede concederse de oficio, ni se inscribe en el registro."
  citation: "art. 32.1 LPAC"
  difficulty: 1
  tags:
  - "ampliación"
  - "notificación"
