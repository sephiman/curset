# anchor: boe-a-1978-31229-art-103
- id: m01-l08-q063
  prompt:
    es: "Conforme al artículo 103.1 de la Constitución Española de 1978, la Administración Pública, que actúa con sometimiento pleno a la ley y al Derecho, sirve con objetividad:"
  options:
  - id: a
    correct: true
    text:
      es: "Los intereses generales."
  - id: b
    text:
      es: "Los intereses del Gobierno."
  - id: c
    text:
      es: "Los intereses de los Departamentos ministeriales."
  - id: d
    text:
      es: "Los intereses de las Cortes Generales."
  explanation:
    es: "El artículo 103.1 dice que la Administración Pública sirve con objetividad los intereses generales. No sirve los intereses del Gobierno de turno, ni los de cada Departamento ministerial, ni los de las Cortes Generales."
  citation: "art. 103.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-103
- id: m01-l08-q064
  prompt:
    es: "¿Cuál de los siguientes principios enumera el artículo 103.1 de la Constitución Española de 1978 entre los que rigen la actuación de la Administración Pública?"
  options:
  - id: a
    text:
      es: "Concentración."
  - id: b
    correct: true
    text:
      es: "Desconcentración."
  - id: c
    text:
      es: "Centralización."
  - id: d
    text:
      es: "Tutela."
  explanation:
    es: "El artículo 103.1 enumera la eficacia, la jerarquía, la descentralización, la desconcentración y la coordinación. La concentración y la centralización son lo contrario de la desconcentración y la descentralización. La tutela no figura entre los principios del artículo."
  citation: "art. 103.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-3
- id: m01-l08-q065
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las Administraciones Públicas sirven con objetividad los intereses generales y actúan con sometimiento pleno:"
  options:
  - id: a
    text:
      es: "A la Constitución y a la jurisprudencia del Tribunal Supremo."
  - id: b
    text:
      es: "A la Ley y a los reglamentos del Gobierno."
  - id: c
    correct: true
    text:
      es: "A la Constitución, a la Ley y al Derecho."
  - id: d
    text:
      es: "A los tratados internacionales y a la Ley."
  explanation:
    es: "El artículo 3.1 dice que actúan con sometimiento pleno a la Constitución, a la Ley y al Derecho. Las otras opciones sustituyen el Derecho por la jurisprudencia del Tribunal Supremo, por los reglamentos del Gobierno o por los tratados internacionales, y dejan fuera uno de los tres términos."
  citation: "art. 3.1 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-3
- id: m01-l08-q066
  prompt:
    es: "De acuerdo con el artículo 3.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las Administraciones Públicas actúan de acuerdo con los principios de:"
  options:
  - id: a
    text:
      es: "Eficacia, jerarquía, centralización, concentración y coordinación."
  - id: b
    text:
      es: "Eficacia, jerarquía, descentralización, desconcentración y subsidiariedad."
  - id: c
    text:
      es: "Eficacia, legalidad, descentralización, desconcentración y coordinación."
  - id: d
    correct: true
    text:
      es: "Eficacia, jerarquía, descentralización, desconcentración y coordinación."
  explanation:
    es: "El artículo 3.1 enumera cinco principios: eficacia, jerarquía, descentralización, desconcentración y coordinación. Un listado cambia dos principios por sus contrarios, centralización y concentración. Otro pone la subsidiariedad en lugar de la coordinación. El último pone la legalidad en lugar de la jerarquía."
  citation: "art. 3.1 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-54
- id: m01-l08-q067
  prompt:
    es: "Según el artículo 54.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, además de los principios del artículo 3, la Administración General del Estado se organiza de acuerdo con el de desconcentración:"
  options:
  - id: a
    text:
      es: "Únicamente territorial."
  - id: b
    correct: true
    text:
      es: "Funcional y territorial."
  - id: c
    text:
      es: "Orgánica y presupuestaria."
  - id: d
    text:
      es: "Territorial y local."
  explanation:
    es: "El artículo 54.1 añade la descentralización funcional y la desconcentración funcional y territorial. La desconcentración no es solo territorial. Tampoco es orgánica y presupuestaria, ni territorial y local: el artículo habla de la vertiente funcional y de la territorial."
  citation: "art. 54.1 LRJSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-54
- id: m01-l08-q068
  prompt:
    es: "¿Cuál de las siguientes materias figura entre las competencias de organización que el artículo 54.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público reserva, si ninguna ley las atribuye a otro órgano?"
  options:
  - id: a
    correct: true
    text:
      es: "El régimen de personal."
  - id: b
    text:
      es: "La política exterior."
  - id: c
    text:
      es: "La seguridad ciudadana."
  - id: d
    text:
      es: "La gestión del Patrimonio del Estado."
  explanation:
    es: "El artículo 54.2 enumera la organización administrativa, el régimen de personal, los procedimientos y la inspección de servicios. La política exterior, la seguridad ciudadana y la gestión del Patrimonio del Estado no figuran en esa lista."
  citation: "art. 54.2 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q069
  prompt:
    es: "Conforme al artículo 55.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la existencia de una Delegación del Gobierno en cada Comunidad Autónoma responde al principio de:"
  options:
  - id: a
    text:
      es: "División funcional."
  - id: b
    text:
      es: "Desconcentración funcional."
  - id: c
    correct: true
    text:
      es: "Gestión territorial integrada."
  - id: d
    text:
      es: "Descentralización funcional."
  explanation:
    es: "El artículo 55.1 liga las Delegaciones del Gobierno en las Comunidades Autónomas a la gestión territorial integrada. La división funcional es el principio de los Departamentos ministeriales. La desconcentración y la descentralización funcionales son principios del artículo 54.1, no el que se expresa en las Delegaciones."
  citation: "art. 55.1 LRJSP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q070
  prompt:
    es: "Según el artículo 55.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las excepciones a la división funcional en Departamentos y a la gestión territorial integrada son las previstas por:"
  options:
  - id: a
    text:
      es: "El Real Decreto de estructura de cada Departamento."
  - id: b
    text:
      es: "El Estatuto de Autonomía de cada Comunidad."
  - id: c
    text:
      es: "Un acuerdo del Consejo de Ministros."
  - id: d
    correct: true
    text:
      es: "La propia Ley 40/2015."
  explanation:
    es: "El artículo 55.1 remite las excepciones a «esta Ley», es decir, a la propia Ley 40/2015. No las fija el Real Decreto de estructura de un Departamento, ni un Estatuto de Autonomía, ni un acuerdo del Consejo de Ministros."
  citation: "art. 55.1 LRJSP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q071
  prompt:
    es: "De acuerdo con la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la Organización Central de la Administración General del Estado integra:"
  options:
  - id: a
    correct: true
    text:
      es: "Los Ministerios y los servicios comunes."
  - id: b
    text:
      es: "Los Ministerios y los Organismos públicos."
  - id: c
    text:
      es: "Las Delegaciones del Gobierno y los servicios comunes."
  - id: d
    text:
      es: "Los Departamentos ministeriales y las Delegaciones del Gobierno."
  explanation:
    es: "El artículo 55.2.a dice que la Organización Central integra los Ministerios y los servicios comunes. Los Organismos públicos no figuran en ese apartado. Las Delegaciones del Gobierno pertenecen a la Organización Territorial."
  citation: "art. 55.2 LRJSP"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q072
  prompt:
    es: "Señale cuál de los siguientes NO es un órgano directivo de la organización central, conforme al artículo 55.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    text:
      es: "Los Subdirectores generales."
  - id: b
    text:
      es: "Los Secretarios generales técnicos."
