# anchor: boe-a-2003-21614-art-35
- id: m05-l01-q047
  prompt:
    es: "Según el artículo 35.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los programas presupuestarios, de carácter plurianual, están bajo la responsabilidad:"
  options:
  - id: a
    correct: true
    text:
      es: "Del titular del centro gestor del gasto."
  - id: b
    text:
      es: "Del Ministro del departamento correspondiente."
  - id: c
    text:
      es: "De la Dirección General de Presupuestos."
  - id: d
    text:
      es: "De la Intervención delegada del departamento."
  explanation:
    es: "El artículo 35.2 pone los programas bajo la responsabilidad del titular del centro gestor del gasto. El Ministro está por encima del centro gestor, la Dirección General de Presupuestos coordina el proceso desde Hacienda y la Intervención delegada controla, pero no gestiona los programas."
  citation: "art. 35.2 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-35
- id: m05-l01-q048
  prompt:
    es: "De acuerdo con el artículo 35.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los objetivos preestablecidos de los programas presupuestarios pueden tener por finalidad:"
  options:
  - id: a
    text:
      es: "La producción de bienes y servicios, la recaudación de ingresos o la realización de las demás actividades de los centros gestores."
  - id: b
    correct: true
    text:
      es: "La producción de bienes y servicios, el cumplimiento de obligaciones específicas o la realización de las demás actividades de los centros gestores."
  - id: c
    text:
      es: "La producción de bienes y servicios, el cumplimiento de obligaciones específicas o la ejecución de inversiones reales y financieras."
  - id: d
    text:
      es: "La asignación de recursos, el cumplimiento de obligaciones específicas o la realización de las demás actividades de los centros gestores."
  explanation:
    es: "El artículo 35.2 enumera tres finalidades: la producción de bienes y servicios, el cumplimiento de obligaciones específicas y la realización de las demás actividades encomendadas a los centros gestores. La opción de la recaudación de ingresos sustituye la segunda por una finalidad de ingresos, ajena a los programas de gasto. La de las inversiones reales y financieras cambia la tercera por un contenido de los programas plurianuales (art. 29.6). La de la asignación de recursos cambia la primera."
  citation: "art. 35.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2003-21614-art-35
- id: m05-l01-q049
  prompt:
    es: "Según el artículo 35.4 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, cuando los resultados de un programa no sean mensurables, la efectividad del programa se hará:"
  options:
  - id: a
    text:
      es: "Mediante una auditoría externa de los resultados."
  - id: b
    text:
      es: "Mediante el balance de resultados de la Intervención."
  - id: c
    correct: true
    text:
      es: "Mediante indicadores que permitan su medición indirecta."
  - id: d
    text:
      es: "Mediante la comparación con los créditos iniciales."
  explanation:
    es: "Cuando los resultados no son mensurables, el artículo 35.4 acude a indicadores que permitan la medición indirecta de la efectividad. La auditoría externa y la comparación con los créditos iniciales no figuran en el artículo. El balance de resultados lo formulan los titulares de los centros gestores (art. 71), no la Intervención General."
  citation: "art. 35.4 LGP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2003-21614-art-35
- id: m05-l01-q050
  prompt:
    es: "¿En qué caso se comprueba el grado de cumplimiento de un programa presupuestario en función de los resultados, según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Cuando el programa tenga carácter plurianual."
  - id: b
    correct: true
    text:
      es: "Cuando los resultados sean mensurables e identificables."
  - id: c
    text:
      es: "Cuando el centro gestor del gasto lo solicite."
  - id: d
    text:
      es: "Cuando los resultados no sean mensurables ni identificables."
  explanation:
    es: "El grado de cumplimiento se comprueba por los resultados cuando éstos sean mensurables e identificables (art. 35.4). Que el programa sea plurianual o que lo pida el gestor no es el criterio. Si los resultados no son mensurables, el artículo acude a indicadores de medición indirecta y no a los resultados."
  citation: "art. 35.4 LGP"
  difficulty: 3
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-35
- id: m05-l01-q051
  prompt:
    es: "Según el artículo 35.4 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, un programa de gasto del presupuesto anual es el conjunto de créditos que, para el logro de los objetivos anuales, se ponen a disposición:"
  options:
  - id: a
    text:
      es: "Del Ministerio de Hacienda, para su ejecución centralizada."
  - id: b
    correct: true
    text:
      es: "Del gestor responsable de su ejecución."
  - id: c
    text:
      es: "De la Intervención General, para su control previo."
  - id: d
    text:
      es: "De las Cortes Generales, para su seguimiento."
  explanation:
    es: "El programa de gasto del presupuesto anual es el conjunto de créditos que se ponen a disposición del gestor responsable de su ejecución (art. 35.4). Ni el Ministerio de Hacienda, ni la Intervención General, ni las Cortes Generales ejecutan el programa."
  citation: "art. 35.4 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "órgano"
# anchor: boe-a-2026-12037-anexo-i
- id: m05-l01-q055
  prompt:
    es: "Según el anexo I de la Orden HAC/557/2026, de 3 de junio, de elaboración de los Presupuestos Generales del Estado para 2027, ¿qué letras del cuarto carácter identifican a los programas finalistas, como el 456C?"
  options:
  - id: a
    correct: true
    text:
      es: "Las letras comprendidas entre la «A» y la «L»."
  - id: b
    text:
      es: "Las letras comprendidas entre la «M» y la «Z»."
  - id: c
    text:
      es: "Las letras comprendidas entre la «A» y la «F»."
  - id: d
    text:
      es: "Las letras comprendidas entre la «G» y la «Z»."
  explanation:
    es: "En el anexo I, las letras «A» a «L» del cuarto carácter identifican a los programas finalistas, y la «C» de 456C está en ese tramo. El tramo de la «M» a la «Z» corresponde a los instrumentales y de gestión. Los otros dos tramos no son ninguno de los dos que el anexo fija."
  citation: "anexo I Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "estructura"
  - "concepto"
# anchor: boe-a-2026-12037-anexo-i
- id: m05-l01-q056
  prompt:
    es: "Según el anexo I de la Orden HAC/557/2026, de 3 de junio, de elaboración de los Presupuestos Generales del Estado para 2027, ¿qué letras del cuarto carácter identifican a los programas instrumentales y de gestión, como el 423N?"
  options:
  - id: a
    text:
      es: "Las letras comprendidas entre la «A» y la «L»."
  - id: b
    text:
      es: "Las letras comprendidas entre la «N» y la «Z»."
  - id: c
    correct: true
    text:
      es: "Las letras comprendidas entre la «M» y la «Z»."
  - id: d
    text:
      es: "Las letras comprendidas entre la «A» y la «M»."
  explanation:
    es: "En el anexo I, las letras «M» a «Z» identifican a los programas instrumentales y de gestión, y la «N» de 423N está en ese tramo. El tramo de la «A» a la «L» es el de los finalistas. Los otros dos tramos no son ninguno de los dos que el anexo fija."
  citation: "anexo I Orden HAC/557/2026"
  difficulty: 3
  tags:
  - "estructura"
  - "concepto"
# anchor: boe-a-2003-21614-art-71
- id: m05-l01-q057
  prompt:
    es: "Según el artículo 71 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿quiénes formulan un balance de resultados y un informe de gestión sobre el cumplimiento de los objetivos del ejercicio?"
  options:
  - id: a
    text:
      es: "Los Ministros de los departamentos de los que dependan los programas."
  - id: b
    correct: true
    text:
      es: "Los titulares de los centros gestores del gasto responsables de los programas."
  - id: c
    text:
      es: "Los titulares de las Intervenciones delegadas de cada departamento."
  - id: d
    text:
      es: "Los titulares de las oficinas presupuestarias de los ministerios."
  explanation:
    es: "El artículo 71 encarga ambos documentos a los titulares de los centros gestores del gasto responsables de los programas. Los Ministros, las Intervenciones delegadas y las oficinas presupuestarias no los formulan."
  citation: "art. 71 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-71
- id: m05-l01-q058
  prompt:
    es: "De acuerdo con el artículo 71 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el balance de resultados y el informe de gestión de los centros gestores se incorporan:"
  options:
  - id: a
    text:
      es: "Al informe económico y financiero del proyecto."
  - id: b
    text:
      es: "A la memoria de beneficios fiscales."
  - id: c
    text:
      es: "Al programa plurianual del ministerio."
  - id: d
    correct: true
    text:
      es: "A la memoria de las correspondientes cuentas anuales."
  explanation:
    es: "El artículo 71 incorpora el balance de resultados y el informe de gestión a la memoria de las cuentas anuales. El informe económico y financiero y la memoria de beneficios fiscales acompañan al proyecto de ley (art. 37.2). El programa plurianual fija objetivos antes del ejercicio, no recoge sus resultados."
  citation: "art. 71 LGP"
  difficulty: 3
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2003-21614-art-72
- id: m05-l01-q059
  prompt:
    es: "Según el artículo 72 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el Ministerio de Hacienda, en colaboración con los centros gestores de gastos, impulsará y coordinará:"
  options:
  - id: a
    correct: true
    text:
      es: "La evaluación continuada de las políticas de gasto público."
  - id: b
    text:
      es: "El control financiero permanente de los organismos autónomos."
  - id: c
    text:
      es: "La auditoría de las cuentas anuales de las entidades públicas."
  - id: d
    text:
      es: "La ejecución material de los pagos del Tesoro Público."
  explanation:
    es: "El artículo 72 encarga al Ministerio de Hacienda, con los centros gestores, impulsar y coordinar la evaluación continuada de las políticas de gasto, para asegurar que alcancen sus objetivos estratégicos. El control financiero permanente y la auditoría son funciones de la Intervención General, y el pago material pertenece a la fase final de ejecución del gasto."
  citation: "art. 72 LGP"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-35
- id: m05-l01-q060
  prompt:
    es: "Según el artículo 35.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, son créditos presupuestarios cada una de:"
  options:
  - id: a
    text:
      es: "Las asignaciones globales de gasto puestas a disposición de los ministerios para cubrir las necesidades de todo su departamento."
  - id: b
    text:
      es: "Las previsiones individualizadas de ingreso puestas a disposición de la Tesorería para cubrir las necesidades de caja."
  - id: c
    text:
      es: "Las obligaciones de gasto ya reconocidas por los centros gestores frente a terceros durante el ejercicio."
  - id: d
    correct: true
    text:
      es: "Las asignaciones individualizadas de gasto puestas a disposición de los centros gestores para cubrir las necesidades para las que hayan sido aprobados."
  explanation:
    es: "El artículo 35.1 define el crédito presupuestario como cada asignación individualizada de gasto puesta a disposición de los centros gestores para las necesidades para las que haya sido aprobada. Una asignación global a los ministerios no es individualizada. Las previsiones de ingreso no son gasto. Las obligaciones reconocidas son una fase posterior de la ejecución, no el crédito que la habilita."
  citation: "art. 35.1 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-38
- id: m05-l01-q061
  prompt:
    es: "Según el artículo 38 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, señale la afirmación INCORRECTA sobre los presupuestos prorrogados:"
  options:
  - id: a
    correct: true
    text:
      es: "La prórroga alcanza a los créditos para obligaciones que se extingan en el ejercicio cuyos presupuestos se prorrogan."
  - id: b
    text:
      es: "Se prorrogan los presupuestos iniciales del ejercicio anterior hasta la aprobación y publicación de los nuevos."
  - id: c
    text:
      es: "La prórroga no afecta a los créditos de programas o actuaciones que terminen en el ejercicio prorrogado."
  - id: d
    text:
      es: "La estructura orgánica se adapta a la organización vigente sin alterar la cuantía total."
  explanation:
    es: "La afirmación incorrecta es la que dice que la prórroga alcanza a los créditos de obligaciones que se extinguen en el ejercicio prorrogado: el artículo 38.2 los deja fuera. Son correctas la prórroga de los presupuestos iniciales hasta la publicación de los nuevos (art. 38.1), la exclusión de los programas que terminan en el ejercicio (art. 38.2) y la adaptación de la estructura orgánica sin alterar la cuantía total (art. 38.3)."
  citation: "art. 38.2 LGP"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2003-21614-art-73
- id: m05-l01-q062
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué fase de la gestión del presupuesto de gastos sigue inmediatamente al compromiso de gasto?"
  options:
  - id: a
    text:
      es: "La aprobación del gasto."
  - id: b
    text:
      es: "La ordenación del pago."
  - id: c
    correct: true
    text:
      es: "El reconocimiento de la obligación."
  - id: d
    text:
      es: "El pago material."
  explanation:
    es: "El artículo 73.1 ordena las fases así: aprobación del gasto, compromiso de gasto, reconocimiento de la obligación, ordenación del pago y pago material. Tras el compromiso viene el reconocimiento de la obligación. La aprobación del gasto lo precede, y la ordenación del pago y el pago material vienen después de ese reconocimiento."
  citation: "art. 73.1 LGP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "estructura"
# anchor: boe-a-2003-21614-art-131
- id: m05-l01-q064
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿a qué órgano remite el Gobierno la Cuenta General del Estado formada por la Intervención General de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "Al Consejo de Estado."
  - id: b
    text:
      es: "Al Defensor del Pueblo."
  - id: c
    text:
      es: "A la Dirección General de Presupuestos."
  - id: d
    correct: true
    text:
      es: "Al Tribunal de Cuentas."
  explanation:
    es: "La Cuenta General se eleva al Gobierno para su remisión al Tribunal de Cuentas (art. 131.1). El Consejo de Estado, el Defensor del Pueblo y la Dirección General de Presupuestos no son destinatarios de la remisión."
  citation: "art. 131.1 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-29
- id: m05-l01-q074
  prompt:
    es: "De acuerdo con el artículo 29.6 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los indicadores de ejecución que establecen los programas plurianuales irán asociados:"
  options:
  - id: a
    text:
      es: "A cada uno de los créditos que se ponen a disposición del gestor."
  - id: b
    text:
      es: "A cada una de las inversiones reales y financieras a realizar."
  - id: c
    correct: true
    text:
      es: "A cada uno de los objetivos que fija el propio programa."
  - id: d
    text:
      es: "A cada uno de los centros gestores que dependen del ministerio."
  explanation:
    es: "El artículo 29.6 incluye en el contenido de los programas plurianuales «los indicadores de ejecución asociados a cada uno de los objetivos». Los créditos que se proponen poner a disposición de los centros gestores y las inversiones reales y financieras son otros extremos del mismo apartado, no aquello a lo que se asocian los indicadores. El artículo tampoco asocia los indicadores a cada centro gestor."
  citation: "art. 29.6 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2003-21614-art-73
- id: m05-l01-q075
  prompt:
    es: "Según el artículo 73.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cuál es la última de las fases a través de las que se realiza la gestión del presupuesto de gastos del Estado?"
  options:
  - id: a
    text:
      es: "La ordenación del pago."
  - id: b
    correct: true
    text:
      es: "El pago material."
  - id: c
    text:
      es: "La liquidación del presupuesto."
  - id: d
    text:
      es: "El reconocimiento de la obligación."
  explanation:
    es: "El artículo 73.1 enumera las fases en este orden: aprobación del gasto, compromiso de gasto, reconocimiento de la obligación, ordenación del pago y pago material. El reconocimiento de la obligación y la ordenación del pago preceden al pago material. La liquidación del presupuesto no figura entre las fases del artículo."
  citation: "art. 73.1 LGP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "estructura"
# anchor: boe-a-2026-12037-art-7
- id: m05-l01-q076
  prompt:
    es: "De acuerdo con el artículo 7.1 de la Orden HAC/557/2026, de 3 de junio, por la que se dictan las normas para la elaboración de los Presupuestos Generales del Estado para 2027, los centros gestores remitirán sus propuestas:"
  options:
  - id: a
    text:
      es: "Antes del 29 de julio de 2026."
  - id: b
    text:
      es: "Antes del 15 de septiembre de 2026."
  - id: c
    text:
      es: "Antes del 1 de octubre de 2026."
  - id: d
    correct: true
    text:
      es: "Antes del 29 de junio de 2026."
  explanation:
    es: "El artículo 7.1 dice que «las propuestas de los centros gestores se remitirán a la Dirección General de Presupuestos antes del 29 de junio de 2026». El 1 de octubre de 2026 es el límite para remitir el proyecto de Ley de Presupuestos a las Cortes Generales (art. 37.1 LGP), un paso posterior. La orden no fija para las propuestas ni el 29 de julio ni el 15 de septiembre."
  citation: "art. 7.1 Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "plazo"
  - "fecha"
# anchor: boe-a-2026-12037-art-7
- id: m05-l01-q077
  prompt:
    es: "Según el artículo 7.1 de la Orden HAC/557/2026, de 3 de junio, por la que se dictan las normas para la elaboración de los Presupuestos Generales del Estado para 2027, ¿a qué órgano remiten los centros gestores sus propuestas?"
  options:
  - id: a
    correct: true
    text:
      es: "A la Dirección General de Presupuestos."
  - id: b
    text:
      es: "A la Intervención General de la Administración del Estado."
  - id: c
    text:
      es: "A la Comisión de Políticas de Gasto."
  - id: d
    text:
      es: "A la Dirección General del Tesoro y Política Financiera."
  explanation:
    es: "Las propuestas de los centros gestores «se remitirán a la Dirección General de Presupuestos antes del 29 de junio de 2026» (art. 7.1), a través de las oficinas presupuestarias. La orden no dirige esas propuestas a la Intervención General de la Administración del Estado ni a la Dirección General del Tesoro y Política Financiera. La Comisión de Políticas de Gasto se constituye para que la persona titular del Ministerio de Hacienda determine las directrices de distribución del gasto (art. 4.1), no para recibir las propuestas."
  citation: "art. 7.1 Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2026-12037-art-4
- id: m05-l01-q078
  prompt:
    es: "Según el artículo 4.2 de la Orden HAC/557/2026, de 3 de junio, ¿quién preside las Comisiones de Análisis de Programas en ausencia de la persona titular de la Secretaría de Estado de Presupuestos y Gastos?"
  options:
  - id: a
    text:
      es: "La persona titular del Ministerio de Hacienda."
  - id: b
    text:
      es: "La persona titular de la Subdirección General de Política Presupuestaria."
  - id: c
    correct: true
    text:
      es: "La persona titular de la Dirección General de Presupuestos."
  - id: d
    text:
      es: "La persona titular de la Subsecretaría del departamento ministerial."
  explanation:
    es: "Preside las Comisiones de Análisis de Programas la persona titular de la Secretaría de Estado de Presupuestos y Gastos «y, en su ausencia, la persona titular de la Dirección General de Presupuestos» (art. 4.2). La persona titular de la Subsecretaría del departamento ministerial es miembro de cada Comisión, no su presidente. La persona titular del Ministerio de Hacienda preside la Comisión de Políticas de Gasto (art. 4.1), y la de la Subdirección General de Política Presupuestaria actúa en esa Comisión como secretario no miembro (art. 4.1)."
  citation: "art. 4.2 Orden HAC/557/2026"
  difficulty: 3
  tags:
  - "órgano"
  - "composición"
# anchor: boe-a-2026-12037-art-5
- id: m05-l01-q080
  prompt:
    es: "De acuerdo con el artículo 5 de la Orden HAC/557/2026, de 3 de junio, la persona titular del Ministerio de Hacienda someterá al acuerdo del Gobierno:"
  options:
  - id: a
    text:
      es: "Las propuestas de presupuesto remitidas por los centros gestores."
  - id: b
    text:
      es: "Las conclusiones de las Comisiones de Análisis de Programas."
  - id: c
    text:
      es: "Las previsiones de los grandes epígrafes de gasto para 2028 y 2029."
  - id: d
    correct: true
    text:
      es: "El anteproyecto de Ley de Presupuestos Generales del Estado para 2027."
  explanation:
    es: "Una vez elaborados los estados de gastos e ingresos, se elevan a la persona titular del Ministerio de Hacienda, «quien someterá al acuerdo del Gobierno el anteproyecto de Ley de Presupuestos Generales del Estado para 2027» (art. 5). Las propuestas de los centros gestores y las conclusiones de las Comisiones de Análisis de Programas son elementos que la Dirección General de Presupuestos tiene en cuenta al elaborar los estados de gastos (art. 5). Las previsiones de los grandes epígrafes de gasto para 2028 y 2029 las remiten los centros gestores a la Dirección General de Presupuestos (art. 7.1)."
  citation: "art. 5 Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-2026-12037-art-4
- id: m05-l01-q081
  prompt:
    es: "Según el artículo 4.2 de la Orden HAC/557/2026, de 3 de junio, por la que se dictan las normas para la elaboración de los Presupuestos Generales del Estado para 2027, ¿qué tarea corresponde a las Comisiones de Análisis de Programas?"
  options:
  - id: a
    text:
      es: "La determinación de las directrices para la distribución del gasto entre los departamentos."
  - id: b
    text:
      es: "La elevación al acuerdo del Gobierno del anteproyecto de Presupuestos Generales del Estado."
  - id: c
    text:
      es: "La remisión a las Cortes Generales del proyecto de Presupuestos Generales del Estado."
  - id: d
    correct: true
    text:
      es: "El estudio de la adecuación y validez de los programas de gasto."
  explanation:
    es: "En las Comisiones de Análisis de Programas «tiene lugar el estudio de la adecuación y validez de los programas de gasto respecto de los objetivos perseguidos por los mismos» (art. 4.2). Las directrices para la distribución del gasto las determina la persona titular del Ministerio de Hacienda, que para ello constituye la Comisión de Políticas de Gasto (art. 4.1). La elevación del anteproyecto al acuerdo del Gobierno corresponde a la persona titular del Ministerio de Hacienda (art. 5). La remisión del proyecto a las Cortes Generales es del Gobierno (art. 37.1 LGP; art. 134.3 CE)."
  citation: "art. 4.2 Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-2026-12037-art-6
- id: m05-l01-q082
  prompt:
    es: "¿Cuál de los siguientes rasgos define a los programas finalistas según la Orden HAC/557/2026, de 3 de junio, por la que se dictan las normas para la elaboración de los Presupuestos Generales del Estado para 2027?"
  options:
  - id: a
    text:
      es: "Que sus créditos se consignan en el capítulo de inversiones reales."
  - id: b
    correct: true
    text:
      es: "Que se les puede asignar objetivos cuantificables e indicadores de ejecución mensurables."
  - id: c
    text:
      es: "Que su ejecución corresponde a un organismo autónomo y no a un ministerio."
  - id: d
    text:
      es: "Que sus créditos tienen la condición de ampliables durante el ejercicio."
  explanation:
    es: "La Orden define los programas finalistas como «aquellos a los que se puede asignar objetivos cuantificables e indicadores de ejecución mensurables» (art. 6, apartado 1.1). El presupuesto de gastos se estructura teniendo en cuenta tres criterios distintos, las finalidades u objetivos, la organización de los entes y la naturaleza económica de los gastos (art. 6.1), y la clase de programa sale del primero. Por eso la opción de las inversiones reales, que es un criterio económico, y la del organismo autónomo, que es un criterio orgánico, no definen la clase de programa. La opción de los créditos ampliables tampoco: la Orden no clasifica los programas por el régimen de sus créditos."
  citation: "art. 6, apartado 1.1, Orden HAC/557/2026"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2026-12037-art-6
- id: m05-l01-q083
  prompt:
    es: "En la estructura de programas de gasto de los Presupuestos Generales del Estado, los programas a los que se puede asignar objetivos cuantificables e indicadores de ejecución mensurables son los programas:"
  options:
  - id: a
    text:
      es: "De transferencias y libramientos internos."
  - id: b
    text:
      es: "De dirección y servicios generales."
  - id: c
    correct: true
    text:
      es: "De gasto de carácter finalista."
  - id: d
    text:
      es: "De inversiones y operaciones de capital."
  explanation:
    es: "La estructura de programas «diferenciará los programas de gasto de carácter finalista de los programas instrumentales y de gestión», y los finalistas son aquellos a los que se puede asignar objetivos cuantificables e indicadores de ejecución mensurables (art. 6, apartado 1.1, Orden HAC/557/2026). «Transferencias y libramientos internos» es el nombre de un programa concreto, el 000X, en el que se consignan dotaciones para financiar transferencias (art. 6, apartado 1.1), no una clase de programas. Los programas de dirección y servicios generales llevan en el anexo I una letra de la «M» a la «Z» en el cuarto carácter, la de los instrumentales y de gestión. Las inversiones y operaciones de capital pertenecen a la clasificación económica del gasto, no a la de programas."
  citation: "art. 6, apartado 1.1, Orden HAC/557/2026"
  difficulty: 1
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2026-12037-art-6
- id: m05-l01-q084
  prompt:
    es: "Según la Orden HAC/557/2026, de 3 de junio, por la que se dictan las normas para la elaboración de los Presupuestos Generales del Estado para 2027, ¿qué clase de objetivos se puede asignar a los programas finalistas?"
  options:
  - id: a
    correct: true
    text:
      es: "Objetivos cuantificables, con indicadores de ejecución mensurables."
  - id: b
    text:
      es: "Objetivos de una actividad que se perfecciona por su propia realización."
  - id: c
    text:
      es: "Objetivos de administración de recursos para la ordenación y la regulación."
  - id: d
    text:
      es: "Objetivos que no admiten ninguna cuantificación material."
  explanation:
    es: "A los programas finalistas «se puede asignar objetivos cuantificables e indicadores de ejecución mensurables» (art. 6, apartado 1.1). Las otras tres opciones toman rasgos que la misma Orden da a los programas instrumentales y de gestión, la clase opuesta: la ejecución de una actividad que se perfecciona por su propia realización, la administración de los recursos necesarios para actividades generales de ordenación, regulación y planificación, y la imposibilidad de proceder a una cuantificación material de sus objetivos."
  citation: "art. 6, apartado 1.1, Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "concepto"
