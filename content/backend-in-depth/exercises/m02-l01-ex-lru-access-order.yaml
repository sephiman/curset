- id: m02-l01-v-lru-access-order-001
  prompt:
    en: |-
      What does this program print? The map drops its eldest entry after any insertion that leaves more than four entries.

      ```java
      import java.util.LinkedHashMap;
      import java.util.Map;

      public class Main {
          public static void main(String[] args) {
              Map<String, Integer> m = new LinkedHashMap<>(16, 0.75f, true) {
                  @Override
                  protected boolean removeEldestEntry(Map.Entry<String, Integer> eldest) {
                      return size() > 4;
                  }
              };
              m.put("a", 1);
              m.put("b", 2);
              m.put("c", 3);
              m.put("d", 4);
              m.get("a");
              m.get("b");
              m.get("d");
              m.put("e", 5);
              System.out.println(m.keySet());
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`[a, b, d, e]`'
    correct: true
  - id: b
    text:
      en: '`[b, c, d, e]`'
  - id: c
    text:
      en: '`[b, d, e]`'
  - id: d
    text:
      en: '`[c, b, d, e]`'
  explanation:
    en: 'The map was created in access order, so each of `get`, `getOrDefault`, `putIfAbsent` and `put` on a present key moves
      that entry to the most recently used end, and the first key is the least recently used. After the four inserts the order
      is `a`, `b`, `c`, `d`, and `m.get("a")`, `m.get("b")` and `m.get("d")` each move one key to the end in turn. Then `put("e",
      5)` adds `e` at the end and `removeEldestEntry` drops the first key, because the size is then 5 and exceeds 4. The program
      prints `[a, b, d, e]`. `[b, c, d, e]` comes from this mistake: assuming the map is insertion-ordered. The map is access-ordered,
      so reading or updating an entry moves it to the most recently used end. `[b, d, e]` comes from this mistake: assuming
      the eviction threshold is inclusive. `removeEldestEntry` returns `true` only when the size exceeds 4, so the entry is
      dropped after the fifth insertion and not earlier. `[c, b, d, e]` comes from this mistake: assuming the first call leaves
      its entry where it was. `m.get("a")` is an access to its entry, which moves that entry to the most recently used end.'
  family: lru-access-order
  code_reading: true
  citation: javadoc-linkedhashmap#class-linkedhashmap-k-v
  difficulty: 3
  tags: &id001
