# anchor: fuente-ms-excel-funcion-diasem-html
- id: m02-l09-q235
  prompt:
    es: "Con Microsoft Excel 365 abierto en un equipo con Windows 11, A1 contiene un miércoles. ¿Qué devuelve =DIASEM(A1;3)?"
  options:
  - id: a
    text:
      es: "3"
  - id: b
    correct: true
    text:
      es: "2"
  - id: c
    text:
      es: "1"
  - id: d
    text:
      es: "4"
  explanation:
    es: "Con el tipo 3, la página numera del 0 (lunes) al 6 (domingo): lunes 0, martes 1 y miércoles 2. «3»: con el tipo 2 el miércoles es 3; con el tipo 3 es 2. «4»: con el tipo 1 el miércoles es 4. «1»: con el tipo 3 el martes es 1, y el miércoles es 2."
  citation: "fuente: `ms-excel-funcion-diasem.html`; «Sintaxis»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
