# anchor: boe-a-2015-10566-art-38
- id: m02-l04-q181
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, el establecimiento de una sede electrónica conlleva la responsabilidad del titular respecto de:"
  options:
  - id: a
    correct: true
    text:
      es: "La integridad, veracidad y actualización de la información y los servicios a los que pueda accederse a través de ella."
  - id: b
    text:
      es: "La traducción a todas las lenguas cooficiales de los contenidos y servicios de la sede."
  - id: c
    text:
      es: "La gestión de los registros electrónicos de los organismos públicos vinculados o dependientes."
  - id: d
    text:
      es: "La seguridad física y la disponibilidad permanente de los equipos que alojan la sede electrónica."
  explanation:
    es: "La responsabilidad del titular alcanza a la integridad, veracidad y actualización de la información y de los servicios de la sede. La seguridad física de los equipos, la traducción a otras lenguas y la gestión de registros ajenos no son la responsabilidad que fija el apartado."
