# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m02-l09-q050
  prompt:
    es: "En Excel 365, ¿qué carácter actúa como operador de intersección entre dos referencias de una fórmula?"
  options:
  - id: a
    text:
      es: "Los dos puntos (:)"
  - id: b
    text:
      es: "El punto y coma (;)"
  - id: c
    text:
      es: "El signo de exclamación (!)"
  - id: d
    correct: true
    text:
      es: "Un espacio"
  explanation:
    es: "La tabla de operadores de referencia da «(espacio) u operador de intersección». Los dos puntos son el operador de rango, el punto y coma el operador de unión, y el signo de exclamación separa el nombre de la hoja del rango."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «Operadores de referencia»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-excel-formulas-html
- id: m02-l09-q161
  prompt:
    es: "¿Cuántas filas tiene una hoja de cálculo de Excel 365, con el estilo de referencia A1?"
  options:
  - id: a
    correct: true
    text:
      es: "1 048 576"
  - id: b
    text:
      es: "16 384"
  - id: c
    text:
      es: "1 000 000"
  - id: d
    text:
      es: "65 536"
  explanation:
    es: "La página numera las filas del 1 al 1 048 576. «65 536»: la página numera las filas del 1 al 1 048 576; 65 536 no es el límite. «1 000 000»: la página da 1 048 576 filas, no un millón exacto. «16 384»: 16 384 es el número de columnas, no de filas."
  citation: "fuente: `ms-excel-formulas.html`; «Estilo de referencia A1»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-ms-excel-formulas-html
- id: m02-l09-q162
  prompt:
    es: "En Excel 365 se necesita una referencia a todas las celdas de la columna H. ¿Cuál de las siguientes se usa con el estilo A1?"
  options:
  - id: a
    text:
      es: "5:5"
  - id: b
    text:
      es: "H:J"
  - id: c
    correct: true
    text:
      es: "H:H"
  - id: d
    text:
      es: "H1:H1"
  explanation:
    es: "La página da H:H para todas las celdas de la columna H. «H1:H1»: es la referencia de una sola celda, no de la columna entera. «H:J»: abarca las columnas H, I y J, no solo la H. «5:5»: es la referencia de toda la fila 5."
  citation: "fuente: `ms-excel-formulas.html`; «Estilo de referencia A1»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-formulas-html
- id: m02-l09-q163
  prompt:
    es: "En Excel 365, ¿qué celdas abarca la referencia A10:E20 con el estilo de referencia A1?"
  options:
  - id: a
    text:
      es: "Las de la columna A y de las filas 10 a 20 de toda la hoja"
  - id: b
    text:
      es: "Las de las filas 5 a 10 de toda la hoja"
  - id: c
    correct: true
    text:
      es: "Las de las columnas A a E y de las filas 10 a 20"
  - id: d
    text:
      es: "Las de la fila 15 y de las columnas B a E"
  explanation:
    es: "La página da A10:E20 para el rango de las columnas A a E y de las filas 10 a 20. «Las de la columna A y de las filas 10 a 20 de toda la hoja»: esa descripción corresponde a A10:A20, no a A10:E20. «Las de la fila 15 y de las columnas B a E»: esa descripción corresponde a B15:E15. «Las de las filas 5 a 10 de toda la hoja»: esas filas se escriben 5:10, sin columnas."
  citation: "fuente: `ms-excel-formulas.html`; «El rango de celdas de las columnas A a E y de las filas 10 a 20 — A10:E20»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-insertar-hoja-html
- id: m02-l09-q175
  prompt:
    es: "En Excel 365 configurado en español, ¿cuál de las siguientes rutas de la cinta de opciones elimina la hoja de cálculo seleccionada?"
  options:
  - id: a
    text:
      es: "Revisar › Eliminar › Eliminar hoja"
  - id: b
    text:
      es: "Vista › Eliminar › Eliminar hoja"
  - id: c
    correct: true
    text:
      es: "Inicio › Eliminar › Eliminar hoja"
  - id: d
    text:
      es: "Inicio › Insertar › Eliminar hoja"
  explanation:
    es: "La página da «Inicio > Eliminar > Eliminar hoja» como ruta de la cinta para eliminar una hoja. «Inicio › Insertar › Eliminar hoja»: Insertar es el comando de la ruta que añade hojas; la de eliminar cuelga de Eliminar. «Vista › Eliminar › Eliminar hoja»: Vista contiene Inmovilizar paneles, no los comandos de hojas. «Revisar › Eliminar › Eliminar hoja»: Revisar protege hojas y libros; no elimina."
  citation: "fuente: `ms-excel-insertar-hoja.html`; «Eliminar una hoja de cálculo»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-insertar-hoja-html
- id: m02-l09-q176
  prompt:
    es: "En Excel 365, ¿qué icono situado en la parte inferior del libro inserta una hoja de cálculo nueva?"
  options:
  - id: a
    text:
      es: "El icono de Nuevo libro"
  - id: b
    text:
      es: "El icono de Eliminar hoja"
  - id: c
    correct: true
    text:
      es: "El icono de Nueva hoja"
  - id: d
    text:
      es: "El icono de Mostrar hoja"
  explanation:
    es: "La página indica que se inserta una hoja con el icono de Nueva hoja de la parte inferior del libro. «El icono de Nuevo libro»: un libro nuevo es otro archivo; la hoja se añade con el icono de Nueva hoja. «El icono de Eliminar hoja»: Eliminar hoja quita la hoja, con Inicio › Eliminar, y la página inserta con el icono de Nueva hoja. «El icono de Mostrar hoja»: Mostrar sirve para volver a ver hojas ocultas, no para crear hojas."
  citation: "fuente: `ms-excel-insertar-hoja.html`; «Insertar una hoja de cálculo»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-insertar-hoja-html
- id: m02-l09-q177
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones describe cómo se cambia el nombre de una hoja desde el menú contextual de su pestaña?"
  options:
  - id: a
    text:
      es: "Arrastrar la pestaña hasta otro punto"
  - id: b
    text:
      es: "Clic derecho en la pestaña y Eliminar"
  - id: c
    text:
      es: "Clic derecho en la pestaña, Reordenar y escribir el nombre nuevo"
  - id: d
    correct: true
    text:
      es: "Clic derecho en la pestaña, Cambiar nombre y escribir el nombre nuevo"
  explanation:
    es: "La página dice que se puede hacer clic con el botón derecho en la pestaña, seleccionar Cambiar nombre y escribir el nuevo nombre. «Clic derecho en la pestaña, Reordenar y escribir el nombre nuevo»: la página usa Reordenar para mover la pestaña, no para renombrarla. «Clic derecho en la pestaña y Eliminar»: la página usa Eliminar para quitar la hoja del libro. «Arrastrar la pestaña hasta otro punto»: la página dice que arrastrar la pestaña mueve la hoja."
  citation: "fuente: `ms-excel-insertar-hoja.html`; «Cambiar el nombre de una hoja de cálculo»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-proteger-libro-html
- id: m02-l09-q180
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones describe cómo se puede saber que la estructura de un libro está protegida?"
  options:
  - id: a
    correct: true
    text:
      es: "En la pestaña Revisar, el icono Proteger libro aparece resaltado"
  - id: b
    text:
      es: "En la pestaña Vista, el icono Inmovilizar paneles aparece resaltado"
  - id: c
    text:
      es: "En la pestaña Revisar, el icono Proteger libro cambia a Desproteger hoja"
  - id: d
    text:
      es: "En la pestaña Revisar, el icono Proteger hoja aparece resaltado"
  explanation:
    es: "La página dice que, si el icono Proteger libro de la pestaña Revisar está resaltado, el libro está protegido. «En la pestaña Revisar, el icono Proteger libro cambia a Desproteger hoja»: Desproteger hoja es el cambio de nombre que indica que una hoja está protegida. «En la pestaña Revisar, el icono Proteger hoja aparece resaltado»: ese icono señala la protección de una hoja, y la página usa el icono Proteger libro para la estructura. «En la pestaña Vista, el icono Inmovilizar paneles aparece resaltado»: Inmovilizar paneles no tiene relación con la protección del libro."
  citation: "fuente: `ms-excel-proteger-libro.html`; «¿Cómo saber si un libro está protegido?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-recuperar-version-html
- id: m02-l09-q182
  prompt:
    es: "En Excel 365 con Autorrecuperación activada, un libro guardado se cerró sin guardar los últimos cambios. ¿Qué archivo se elige en Administrar libro para recuperarlos?"
  options:
  - id: a
    text:
      es: "El que lleva la etiqueta «(versión original)»"
  - id: b
    correct: true
    text:
      es: "El que lleva la etiqueta «(cuando cerré sin guardar)»"
  - id: c
    text:
      es: "El que lleva la etiqueta «(copia de seguridad)»"
  - id: d
    text:
      es: "El que lleva la etiqueta «(autoguardado antes de cerrar)»"
  explanation:
    es: "La página dice que en Administrar libro se selecciona el archivo etiquetado «(cuando cerré sin guardar)». «El que lleva la etiqueta «(autoguardado antes de cerrar)»»: la etiqueta que da la página es «(cuando cerré sin guardar)». «El que lleva la etiqueta «(copia de seguridad)»»: la etiqueta que da la página es «(cuando cerré sin guardar)». «El que lleva la etiqueta «(versión original)»»: la etiqueta que da la página es «(cuando cerré sin guardar)»."
  citation: "fuente: `ms-office-recuperar-version.html`; «Si ha guardado el archivo»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-recuperar-version-html
- id: m02-l09-q183
  prompt:
    es: "En Excel 365, un libro guardado se reabre y se elige la versión «(cuando cerré sin guardar)». ¿Qué hace el botón Restaurar de la barra superior?"
  options:
  - id: a
    correct: true
    text:
      es: "Sobrescribe las versiones guardadas anteriormente"
  - id: b
    text:
      es: "Abre la versión en una ventana nueva sin tocar el archivo"
  - id: c
    text:
      es: "Elimina todas las versiones anteriores del historial"
  - id: d
    text:
      es: "Compara las versiones, como en Word"
  explanation:
    es: "La página indica que Restaurar sobrescribe las versiones guardadas anteriormente. «Compara las versiones, como en Word»: la página dice que comparar versiones es posible en Word, con el botón Comparar. «Abre la versión en una ventana nueva sin tocar el archivo»: la página dice que Restaurar sobrescribe las versiones guardadas. «Elimina todas las versiones anteriores del historial»: la página dice que sobrescribe versiones guardadas, no que borre el historial."
  citation: "fuente: `ms-office-recuperar-version.html`; «Si ha guardado el archivo»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-recuperar-version-html
- id: m02-l09-q184
  prompt:
    es: "En Excel 365 se cerró un libro que nunca se guardó. ¿Qué opción de Archivo › Información permite recuperarlo?"
  options:
  - id: a
    text:
      es: "Proteger libro › Recuperar libros"
  - id: b
    correct: true
    text:
      es: "Administrar documentos › Recuperar libros no guardados"
  - id: c
    text:
      es: "Inspeccionar libro › Recuperar libros no guardados"
  - id: d
    text:
      es: "Administrar libro › Recuperar versión guardada del archivo"
  explanation:
    es: "La página da «Información > Administrar documentos > Recuperar libros no guardados» para el libro que nunca se guardó. «Administrar libro › Recuperar versión guardada del archivo»: esa vía recupera libros que sí se guardaron, el archivo «(cuando cerré sin guardar)». «Proteger libro › Recuperar libros»: Proteger libro sirve para proteger la estructura, no para recuperar. «Inspeccionar libro › Recuperar libros no guardados»: la página sitúa esa opción en Administrar documentos."
  citation: "fuente: `ms-office-recuperar-version.html`; «Si no ha guardado el archivo»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-fondo-hoja-html
- id: m02-l09-q185
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes rutas de la cinta de opciones pone una imagen de fondo en una hoja?"
  options:
  - id: a
    text:
      es: "Insertar › Ilustraciones › Imágenes › Fondo de hoja"
  - id: b
    text:
      es: "Vista › Mostrar › Fondo"
  - id: c
    correct: true
    text:
      es: "Diseño de página › Configurar página › Fondo"
  - id: d
    text:
      es: "Inicio › Fuente › Fondo"
  explanation:
    es: "La página da «Diseño de página > Configurar página > Fondo». «Insertar › Ilustraciones › Imágenes › Fondo de hoja»: Insertar sirve para añadir objetos, no tiene el comando Fondo de hoja. «Vista › Mostrar › Fondo»: Vista controla líneas de cuadrícula y títulos; el fondo está en Diseño de página. «Inicio › Fuente › Fondo»: Inicio › Fuente aplica color de relleno a las celdas, no un fondo de hoja."
  citation: "fuente: `ms-excel-fondo-hoja.html`; «Agregar un fondo de hoja»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-fondo-hoja-html
- id: m02-l09-q186
  prompt:
    es: "En Excel 365, ¿qué ocurre con una imagen usada como fondo de hoja al imprimir la hoja?"
  options:
  - id: a
    text:
      es: "Se imprime solo en la página inicial"
  - id: b
    text:
      es: "Se imprime en cada página como marca de agua"
  - id: c
    text:
      es: "Se imprime solo si se ocultan las líneas de cuadrícula"
  - id: d
    correct: true
    text:
      es: "No se imprime"
  explanation:
    es: "La página dice que el fondo de una hoja no se imprime. «Se imprime en cada página como marca de agua»: la página dice que, al no imprimirse, el fondo no sirve como marca de agua. «Se imprime solo si se ocultan las líneas de cuadrícula»: la página recomienda ocultarlas para mejorar la legibilidad en pantalla, y dice que el fondo no se imprime. «Se imprime solo en la página inicial»: el fondo de una hoja no se imprime en ninguna página."
  citation: "fuente: `ms-excel-fondo-hoja.html`; «Agregar o quitar un fondo de hoja»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-fondo-hoja-html
- id: m02-l09-q187
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones describe cómo se puede imitar una marca de agua que sí se imprime, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Con un gráfico en un cuadro de texto fuera del área de impresión"
  - id: b
    correct: true
    text:
      es: "Insertando una imagen en un encabezado o pie de página"
  - id: c
    text:
      es: "Con el comando Marca de agua de Diseño de página"
  - id: d
    text:
      es: "Con un fondo de hoja"
  explanation:
    es: "La página explica que se imita con una imagen en el encabezado o pie, o con WordArt sobre los datos. «Con el comando Marca de agua de Diseño de página»: la página dice que Excel no tiene una función de marca de agua integrada. «Con un fondo de hoja»: el fondo de hoja no se imprime. «Con un gráfico en un cuadro de texto fuera del área de impresión»: la página usa una imagen en el encabezado o pie de página, que se imprime con cada hoja."
  citation: "fuente: `ms-excel-fondo-hoja.html`; «Imitar una marca de agua en Excel»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-fondo-hoja-html
- id: m02-l09-q188
  prompt:
    es: "Al preparar un libro en Microsoft Excel 365 con las etiquetas en español, ¿qué se debe tener seleccionado al agregar un fondo de hoja?"
  options:
  - id: a
    correct: true
    text:
      es: "Solo una hoja de cálculo"
  - id: b
    text:
      es: "El rango de celdas que llevará el fondo"
  - id: c
    text:
      es: "Todas las hojas del libro"
  - id: d
    text:
      es: "Una celda de la hoja"
  explanation:
    es: "La página dice que se seleccione solo una hoja de cálculo. «Todas las hojas del libro»: la página pide seleccionar solo una hoja de cálculo. «El rango de celdas que llevará el fondo»: el fondo se aplica a la hoja, no a un rango. «Una celda de la hoja»: el fondo se aplica a la hoja entera, y la página pide seleccionar solo una hoja de cálculo."
  citation: "fuente: `ms-excel-fondo-hoja.html`; «Agregar un fondo de hoja»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-excel-fondo-hoja-html
- id: m02-l09-q189
  prompt:
    es: "En Excel 365, una hoja tiene un fondo de imagen. ¿Qué comando de Configurar página lo quita?"
  options:
  - id: a
    text:
      es: "Ocultar fondo"
  - id: b
    correct: true
    text:
      es: "Eliminar fondo"
  - id: c
    text:
      es: "Quitar imagen"
  - id: d
    text:
      es: "Borrar fondo de página"
  explanation:
    es: "La página dice que Eliminar fondo, en Configurar página, solo está disponible cuando la hoja tiene un fondo. «Borrar fondo de página»: la página llama al comando Eliminar fondo. «Quitar imagen»: el comando de Configurar página que da la página es Eliminar fondo. «Ocultar fondo»: el comando de Configurar página que da la página es Eliminar fondo."
  citation: "fuente: `ms-excel-fondo-hoja.html`; «Quitar el fondo de una hoja»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-fondo-hoja-html
- id: m02-l09-q190
  prompt:
    es: "En Excel 365 se quiere un color sólido como fondo de hoja. ¿Qué indica la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Insertar un encabezado con el color elegido"
  - id: b
    text:
      es: "Elegir un color sólido en Diseño de página › Configurar página › Fondo"
  - id: c
    text:
      es: "Ocultar las líneas de cuadrícula"
  - id: d
    correct: true
    text:
      es: "Aplicar sombreado de celdas a todas las celdas de la hoja"
  explanation:
    es: "La página dice que para un color sólido se aplica sombreado de celdas a todas las celdas de la hoja. «Elegir un color sólido en Diseño de página › Configurar página › Fondo»: Fondo inserta una imagen, y para un color sólido la página aplica sombreado a las celdas. «Insertar un encabezado con el color elegido»: los encabezados sirven para imitar una marca de agua con una imagen. «Ocultar las líneas de cuadrícula»: la página lo recomienda para mejorar la legibilidad con una imagen de fondo, no para crear un color sólido."
  citation: "fuente: `ms-excel-fondo-hoja.html`; «Para usar un color sólido como fondo de hoja, aplique sombreado de celdas a todas las celdas de la hoja de cálculo.»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-formatos-numero-html
- id: m02-l09-q191
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes categorías de la pestaña Número de Formato de celdas es el formato predeterminado al escribir un número?"
  options:
  - id: a
    text:
      es: "Número"
  - id: b
    correct: true
    text:
      es: "General"
  - id: c
    text:
      es: "Personalizado"
  - id: d
    text:
      es: "Texto"
  explanation:
    es: "La página llama General al formato de número predeterminado que Excel aplica al escribir un número. «Número»: la página dice que el formato predeterminado al escribir un número es General. «Texto»: Texto trata el contenido como texto aunque se escriban números, y no es el predeterminado. «Personalizado»: Personalizado permite modificar una copia de un código existente, no es el predeterminado."
  citation: "fuente: `ms-excel-formatos-numero.html`; «Formatos de número»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-formatos-numero-html
- id: m02-l09-q192
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes categorías muestra un número como código postal, número de teléfono o número de la seguridad social?"
  options:
  - id: a
    text:
      es: "Fracción"
  - id: b
    correct: true
    text:
      es: "Especial"
  - id: c
    text:
      es: "Contabilidad"
  - id: d
    text:
      es: "Científico"
  explanation:
    es: "La página dice que Especial muestra un número como código postal, teléfono o número de seguridad social. «Fracción»: Fracción muestra el número como fracción. «Científico»: Científico usa notación exponencial. «Contabilidad»: Contabilidad alinea símbolos de moneda y comas decimales en una columna."
  citation: "fuente: `ms-excel-formatos-numero.html`; «Formatos de número»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-formatos-numero-html
- id: m02-l09-q193
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes categorías de formato alinea los símbolos de moneda y las comas decimales de una columna?"
  options:
  - id: a
    text:
      es: "Especial"
  - id: b
    correct: true
    text:
      es: "Contabilidad"
  - id: c
    text:
      es: "Moneda"
  - id: d
    text:
      es: "Personalizado"
  explanation:
    es: "La página dice que Contabilidad se usa también para valores monetarios, pero alinea símbolos de moneda y comas decimales. «Moneda»: Moneda muestra el símbolo de moneda junto al número, sin alinear la columna. «Personalizado»: Personalizado permite modificar una copia de un código de formato existente. «Especial»: Especial muestra códigos postales, teléfonos o números de la seguridad social."
  citation: "fuente: `ms-excel-formatos-numero.html`; «Formatos de número»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-formatos-numero-html
- id: m02-l09-q194
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes categorías de formato trata el contenido de la celda como texto aunque se escriban números?"
  options:
  - id: a
    correct: true
    text:
      es: "Texto"
  - id: b
    text:
      es: "General"
  - id: c
    text:
      es: "Especial"
  - id: d
    text:
      es: "Fracción"
  explanation:
    es: "La página dice que Texto trata el contenido como texto y lo muestra tal como se escribe. «General»: General aplica el formato predeterminado a los números escritos. «Especial»: Especial da formato de código postal, teléfono o seguridad social. «Fracción»: Fracción muestra el número como una fracción."
  citation: "fuente: `ms-excel-formatos-numero.html`; «Formatos de número»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-formatos-numero-html
- id: m02-l09-q195
  prompt:
    es: "En Excel 365, un formato Científico de 2 decimales se aplica al número 12345678901. ¿Qué se muestra en la celda?"
  options:
  - id: a
    text:
      es: "1,23E+11"
  - id: b
    correct: true
    text:
      es: "1,23E+10"
  - id: c
    text:
      es: "1,2E+10"
  - id: d
    text:
      es: "12,35E+09"
  explanation:
    es: "La página da este ejemplo: 12345678901 con formato Científico de 2 decimales se muestra como 1,23E+10. «1,23E+11»: el exponente es 10, porque 1,23 se multiplica por 10 elevado a la décima potencia. «12,35E+09»: la notación científica de la página deja un solo dígito entero antes de la coma. «1,2E+10»: con 2 decimales se muestran 1,23, no 1,2."
  citation: "fuente: `ms-excel-formatos-numero.html`; «Formatos de número»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-formatos-numero-html
- id: m02-l09-q196
  prompt:
    es: "En Excel 365, ¿a partir de cuántos dígitos aplica el formato General la notación científica a un número grande?"
  options:
  - id: a
    text:
      es: "8 o más dígitos"
  - id: b
    text:
      es: "15 o más dígitos"
  - id: c
    text:
      es: "10 o más dígitos"
  - id: d
    correct: true
    text:
      es: "12 o más dígitos"
  explanation:
    es: "La página dice que el formato General usa notación científica para números grandes de 12 o más dígitos. «8 o más dígitos»: la página fija el umbral en 12 dígitos. «10 o más dígitos»: la página da 12 o más, no 10. «15 o más dígitos»: la página da 12 o más, no 15."
  citation: "fuente: `ms-excel-formatos-numero.html`; «Formatos de número»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-excel-formatos-numero-html
- id: m02-l09-q197
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes categorías de formato permite modificar una copia de un código de formato de número existente?"
  options:
  - id: a
    text:
      es: "Texto"
  - id: b
    correct: true
    text:
      es: "Personalizado"
  - id: c
    text:
      es: "General"
  - id: d
    text:
      es: "Especial"
  explanation:
    es: "La página dice que Personalizado permite modificar una copia de un código de formato existente y crear formatos nuevos. «Especial»: Especial muestra un número como código postal, teléfono o seguridad social, sin editar códigos. «General»: General es el formato predeterminado y no se edita. «Texto»: Texto muestra el contenido tal como se escribe."
  citation: "fuente: `ms-excel-formatos-numero.html`; «Formatos de número»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-formatos-numero-html
- id: m02-l09-q198
  prompt:
    es: "¿Cuál de las siguientes categorías NO aparece en la pestaña Número del cuadro Formato de celdas de Excel 365?"
  options:
  - id: a
    text:
      es: "Científico"
  - id: b
    text:
      es: "Contabilidad"
  - id: c
    text:
      es: "Tiempo"
  - id: d
    correct: true
    text:
      es: "Hipervínculo"
  explanation:
    es: "La lista de la página tiene General, Número, Moneda, Contabilidad, Fecha, Tiempo, Porcentaje, Fracción, Científico, Texto, Especial y Personalizado; Hipervínculo no figura. «Tiempo»: Tiempo aparece en la lista y muestra números de serie como horas. «Contabilidad»: Contabilidad es una categoría de la lista, y alinea los símbolos de moneda y las comas decimales. «Científico»: Científico es una categoría de la lista."
  citation: "fuente: `ms-excel-formatos-numero.html`; «Formatos de número»"
  difficulty: 1
  tags:
  - "concepto"
