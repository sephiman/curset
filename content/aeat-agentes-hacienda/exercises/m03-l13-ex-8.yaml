# anchor: boe-a-2003-23186-art-194
- id: m03-l13-q0135
  prompt:
    es: "Según el artículo 194.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la infracción de solicitar indebidamente devoluciones mediante la omisión de datos relevantes o la inclusión de datos falsos sin que las devoluciones se hayan obtenido:"
  options:
  - id: a
    correct: true
    text:
      es: "La base de la sanción es la cantidad indebidamente solicitada."
  - id: b
    text:
      es: "La base de la sanción es la cantidad que se hubiera devuelto si la solicitud hubiera sido correcta."
  - id: c
    text:
      es: "La infracción será leve, y la base de la sanción es la diferencia entre lo solicitado y lo debido."
  - id: d
    text:
      es: "La base de la sanción es la cantidad devuelta indebidamente, aunque se haya devuelto después."
  explanation:
    es: "El artículo 194.1 LGT toma como base la cantidad indebidamente solicitada, no la devuelta, que es el caso de la infracción del artículo 193. La infracción es grave, no leve, y la sanción es una multa proporcional del 15 por ciento."
  citation: "art. 194.1 LGT"
  difficulty: 2
  tags:
  - "base"
