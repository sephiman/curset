# anchor: boe-a-1978-31229-art-153
- id: m01-l09-q051
  prompt:
    es: "De acuerdo con el artículo 153 de la Constitución Española de 1978, el control del ejercicio de funciones delegadas en las Comunidades Autónomas por ley orgánica del Estado se ejercerá:"
  options:
  - id: a
    text:
      es: "Por el Tribunal Constitucional, previo requerimiento del Gobierno."
  - id: b
    text:
      es: "Por el Tribunal de Cuentas, previo informe de las Cortes Generales."
  - id: c
    text:
      es: "Por la jurisdicción contencioso-administrativa, a instancia del Gobierno."
  - id: d
    correct: true
    text:
      es: "Por el Gobierno, previo dictamen del Consejo de Estado."
  explanation:
    es: "El artículo 153.b) atribuye «al Gobierno, previo dictamen del Consejo de Estado», el control «del ejercicio de funciones delegadas a que se refiere el apartado 2 del artículo 150». El Tribunal Constitucional controla las normas con fuerza de ley. El Tribunal de Cuentas, lo económico y presupuestario. La jurisdicción contencioso-administrativa, la administración autónoma y sus reglamentos."
  citation: "art. 153.b) CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-153
- id: m01-l09-q052
  prompt:
    es: "Señale la respuesta correcta sobre el control que ejerce el Tribunal Constitucional sobre la actividad de los órganos de las Comunidades Autónomas, según la Constitución Española de 1978:"
  options:
  - id: a
    correct: true
    text:
      es: "Controla la constitucionalidad de sus disposiciones normativas con fuerza de ley."
  - id: b
    text:
      es: "Controla la administración autónoma y sus normas reglamentarias."
  - id: c
    text:
      es: "Controla la actividad económica y presupuestaria de la Comunidad Autónoma."
  - id: d
    text:
      es: "Controla el ejercicio de las funciones delegadas por el Estado."
  explanation:
    es: "El artículo 153.a) atribuye al Tribunal Constitucional el control «relativo a la constitucionalidad de sus disposiciones normativas con fuerza de ley». La administración autónoma y sus reglamentos los controla la jurisdicción contencioso-administrativa. Lo económico y presupuestario, el Tribunal de Cuentas. Las funciones delegadas, el Gobierno previo dictamen del Consejo de Estado."
  citation: "art. 153.a) CE"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1978-31229-art-161
- id: m01-l09-q053
  prompt:
    es: "Cuando el Gobierno impugna ante el Tribunal Constitucional una disposición o resolución de una Comunidad Autónoma, ¿qué efecto produce la impugnación?"
  options:
  - id: a
    text:
      es: "La suspensión de la disposición o resolución, que el Tribunal debe ratificar o levantar en un plazo no superior a tres meses."
  - id: b
    text:
      es: "La suspensión de la disposición o resolución, que se mantiene en todo caso hasta que se dicte sentencia."
  - id: c
    text:
      es: "Ningún efecto suspensivo, salvo que el Tribunal lo acuerde a petición del Gobierno."
  - id: d
    correct: true
    text:
      es: "La suspensión de la disposición o resolución, que el Tribunal debe ratificar o levantar en un plazo no superior a cinco meses."
  explanation:
    es: "El artículo 161.2 dice: «La impugnación producirá la suspensión de la disposición o resolución recurrida, pero el Tribunal, en su caso, deberá ratificarla o levantarla en un plazo no superior a cinco meses». Tres meses no es el plazo. La suspensión no dura hasta la sentencia: el Tribunal la ratifica o la levanta. La suspensión se produce con la impugnación, sin necesidad de que el Tribunal la acuerde."
  citation: "art. 161.2 CE"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-1978-31229-art-161
- id: m01-l09-q054
  prompt:
    es: "Los conflictos de competencia entre el Estado y las Comunidades Autónomas, o de estas entre sí, son competencia:"
  options:
  - id: a
    correct: true
    text:
      es: "Del Tribunal Constitucional, que tiene jurisdicción en todo el territorio español."
  - id: b
    text:
      es: "Del Tribunal Supremo, a través de su Sala de lo Contencioso-administrativo, en única instancia."
  - id: c
    text:
      es: "Del Senado, como Cámara de representación territorial."
  - id: d
    text:
      es: "Del Gobierno, previo dictamen del Consejo de Estado."
  explanation:
    es: "El artículo 161.1 dice que el Tribunal Constitucional «tiene jurisdicción en todo el territorio español y es competente para conocer», en su letra c), «de los conflictos de competencia entre el Estado y las Comunidades Autónomas o de los de éstas entre sí». No los resuelve el Tribunal Supremo, el Senado ni el Gobierno."
  citation: "art. 161.1.c) CE"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1978-31229-art-154
- id: m01-l09-q055
  prompt:
    es: "De acuerdo con el artículo 154 de la Constitución Española de 1978, un Delegado nombrado por el Gobierno:"
  options:
  - id: a
    text:
      es: "Ostentará la representación ordinaria del Estado en la Comunidad Autónoma y la suprema representación de esta."
  - id: b
    text:
      es: "Dirigirá la Administración del Estado en la Comunidad y controlará la legalidad de los actos de la administración autonómica."
  - id: c
    correct: true
    text:
      es: "Dirigirá la Administración del Estado en el territorio de la Comunidad Autónoma y la coordinará, cuando proceda, con la administración propia de la Comunidad."
  - id: d
    text:
      es: "Dirigirá la administración propia de la Comunidad Autónoma y la coordinará con la Administración del Estado."
  explanation:
    es: "El artículo 154 dice que el Delegado «dirigirá la Administración del Estado en el territorio de la Comunidad Autónoma y la coordinará, cuando proceda, con la administración propia de la Comunidad». La representación ordinaria del Estado y la suprema de la Comunidad corresponden al Presidente de la Comunidad (art. 152.1). El control de la administración autónoma es de la jurisdicción contencioso-administrativa (art. 153.c). La administración propia de la Comunidad no la dirige el Delegado."
  citation: "art. 154 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-155
- id: m01-l09-q056
  prompt:
    es: "De acuerdo con el artículo 155.1 de la Constitución Española de 1978, antes de adoptar las medidas necesarias para obligar a una Comunidad Autónoma al cumplimiento forzoso de sus obligaciones, el Gobierno dirige un requerimiento:"
  options:
  - id: a
    text:
      es: "A la Asamblea Legislativa de la Comunidad Autónoma."
  - id: b
    correct: true
    text:
      es: "Al Presidente de la Comunidad Autónoma."
  - id: c
    text:
      es: "Al Consejo de Gobierno de la Comunidad Autónoma."
  - id: d
    text:
      es: "Al Tribunal Superior de Justicia de la Comunidad Autónoma."
  explanation:
    es: "El artículo 155.1 exige «previo requerimiento al Presidente de la Comunidad Autónoma». El requerimiento no se dirige a la Asamblea, al Consejo de Gobierno ni al Tribunal Superior de Justicia."
  citation: "art. 155.1 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-155
- id: m01-l09-q057
  prompt:
    es: "Si el Presidente de la Comunidad Autónoma no atiende el requerimiento del Gobierno, ¿quién debe aprobar las medidas para obligarla al cumplimiento forzoso de sus obligaciones?"
  options:
  - id: a
    text:
      es: "El Congreso de los Diputados, por mayoría absoluta."
  - id: b
    text:
      es: "El Senado, por mayoría de dos tercios."
  - id: c
    text:
      es: "Las Cortes Generales, en sesión conjunta, por mayoría simple."
  - id: d
    correct: true
    text:
      es: "El Senado, por mayoría absoluta."
  explanation:
    es: "El artículo 155.1 exige, si el requerimiento no es atendido, «la aprobación por mayoría absoluta del Senado». No aprueba el Congreso ni las Cortes en sesión conjunta. La mayoría es absoluta, no de dos tercios."
  citation: "art. 155.1 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "mayoría"
# anchor: boe-a-1978-31229-art-157
- id: m01-l09-q058
  prompt:
    es: "¿Cuál de los siguientes forma parte de los recursos de las Comunidades Autónomas según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "La participación en los tributos de las Corporaciones locales de su territorio."
  - id: b
    text:
      es: "Los impuestos sobre bienes situados fuera de su territorio."
  - id: c
    correct: true
    text:
      es: "Los rendimientos procedentes de su patrimonio e ingresos de derecho privado."
  - id: d
    text:
      es: "Los recargos sobre impuestos propios de otras Comunidades Autónomas."
  explanation:
    es: "El artículo 157.1.d) incluye los «rendimientos procedentes de su patrimonio e ingresos de derecho privado». La participación que prevé el artículo es en los ingresos del Estado, no en los tributos locales. Las medidas tributarias sobre bienes situados fuera de su territorio están prohibidas (art. 157.2). Los recargos que permite el artículo son sobre impuestos estatales."
  citation: "art. 157.1 CE"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-1978-31229-art-157
- id: m01-l09-q059
  prompt:
    es: "De acuerdo con el artículo 157.2 de la Constitución Española de 1978, las Comunidades Autónomas no podrán en ningún caso adoptar medidas tributarias:"
  options:
  - id: a
    correct: true
    text:
      es: "Sobre bienes situados fuera de su territorio o que supongan obstáculo para la libre circulación de mercancías o servicios."
  - id: b
    text:
      es: "Sobre bienes situados en su territorio que pertenezcan a personas residentes en otra Comunidad."
  - id: c
    text:
      es: "Sobre bienes situados fuera de su territorio, salvo autorización de las Cortes Generales."
  - id: d
    text:
      es: "Que consistan en recargos sobre impuestos estatales."
  explanation:
    es: "El artículo 157.2 prohíbe medidas tributarias «sobre bienes situados fuera de su territorio o que supongan obstáculo para la libre circulación de mercancías o servicios». Los bienes situados en su territorio sí pueden gravarse, sea quien sea su titular. La prohibición es «en ningún caso», sin autorización posible. Los recargos sobre impuestos estatales son un recurso de las Comunidades (art. 157.1.a)."
  citation: "art. 157.2 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-1978-31229-art-158
- id: m01-l09-q060
  prompt:
    es: "¿Con qué fin se constituye, según la Constitución Española de 1978, un Fondo de Compensación con destino a gastos de inversión?"
  options:
  - id: a
    text:
      es: "Para garantizar un nivel mínimo en la prestación de los servicios públicos fundamentales en todo el territorio."
  - id: b
    correct: true
    text:
      es: "Para corregir desequilibrios económicos interterritoriales y hacer efectivo el principio de solidaridad."
  - id: c
    text:
      es: "Para financiar los servicios y actividades estatales que hayan asumido las Comunidades Autónomas."
  - id: d
    text:
      es: "Para compensar a las Comunidades Autónomas por los impuestos cedidos total o parcialmente por el Estado."
  explanation:
    es: "El artículo 158.2 constituye el Fondo «con el fin de corregir desequilibrios económicos interterritoriales y hacer efectivo el principio de solidaridad». La garantía de un nivel mínimo en los servicios públicos fundamentales y el volumen de los servicios estatales asumidos son los criterios de la asignación del artículo 158.1, no el fin del Fondo. Los impuestos cedidos son un recurso del artículo 157.1.a), no algo que el Fondo compense."
  citation: "art. 158.2 CE"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-158
- id: m01-l09-q061
  prompt:
    es: "Según el artículo 158.1 de la Constitución Española de 1978, ¿en función de qué podrá establecerse en los Presupuestos Generales del Estado una asignación a las Comunidades Autónomas?"
  options:
  - id: a
    text:
      es: "De la población y la superficie de cada Comunidad Autónoma y de las circunstancias del hecho insular."
  - id: b
    text:
      es: "De la corrección de desequilibrios económicos interterritoriales, con destino exclusivo a gastos de inversión."
  - id: c
    text:
      es: "Del esfuerzo fiscal de cada Comunidad Autónoma en la recaudación de sus propios impuestos."
  - id: d
    correct: true
    text:
      es: "Del volumen de los servicios y actividades estatales asumidos y de la garantía de un nivel mínimo en los servicios públicos fundamentales."
  explanation:
    es: "El artículo 158.1 prevé una asignación «en función del volumen de los servicios y actividades estatales que hayan asumido y de la garantía de un nivel mínimo en la prestación de los servicios públicos fundamentales en todo el territorio español». La población, la superficie y el esfuerzo fiscal no son criterios del artículo. La corrección de desequilibrios con destino a inversión es el fin del Fondo de Compensación del 158.2."
  citation: "art. 158.1 CE"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-147
- id: m01-l09-q062
  prompt:
    es: "Según el artículo 147.3 de la Constitución Española de 1978, ¿qué exige en todo caso la reforma de un Estatuto de autonomía, sea cual sea el procedimiento que el propio Estatuto establezca?"
  options:
  - id: a
    text:
      es: "La aprobación por el Gobierno, mediante real decreto acordado en Consejo de Ministros."
  - id: b
    text:
      es: "La aprobación por el Senado, mediante acuerdo adoptado por su Pleno."
  - id: c
    correct: true
    text:
      es: "La aprobación por las Cortes Generales, mediante ley orgánica."
  - id: d
    text:
      es: "La aprobación por las Cortes Generales, mediante una ley marco."
  explanation:
    es: "El artículo 147.3 dice que la reforma de los Estatutos «requerirá, en todo caso, la aprobación por las Cortes Generales, mediante ley orgánica». No basta un real decreto del Gobierno: los Estatutos se aprueban y se reforman por ley orgánica (art. 81.1). El Senado solo no aprueba la reforma; la aprueban las Cortes Generales. La ley marco es la técnica del artículo 150.1 para atribuir a las Comunidades facultades legislativas, no el instrumento de reforma de un Estatuto."
  citation: "art. 147.3 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-152
- id: m01-l09-q063
  prompt:
    es: "De acuerdo con el artículo 152.1 de la Constitución Española de 1978, en los Estatutos aprobados por el procedimiento del artículo 151, el Presidente y los miembros del Consejo de Gobierno serán políticamente responsables:"
  options:
  - id: a
    text:
      es: "Ante el Senado, a través de la Comisión General de las Comunidades Autónomas."
  - id: b
    correct: true
    text:
      es: "Ante la Asamblea Legislativa de la Comunidad."
  - id: c
    text:
      es: "Ante las Cortes Generales, mediante la cuestión de confianza y la moción de censura."
  - id: d
    text:
      es: "Ante el Gobierno de la Nación, a través del Delegado del Gobierno en la Comunidad."
  explanation:
    es: "El artículo 152.1 dice: «El Presidente y los miembros del Consejo de Gobierno serán políticamente responsables ante la Asamblea». La Constitución no los hace responder ante el Senado ni ante su Comisión General de las Comunidades Autónomas. La cuestión de confianza y la moción de censura ante las Cortes son los instrumentos con que el Congreso exige la responsabilidad del Gobierno de la Nación, no la de un Consejo de Gobierno autonómico. El Delegado del Gobierno dirige la Administración del Estado en la Comunidad (art. 154) y no recibe esa responsabilidad."
  citation: "art. 152.1 CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-150
- id: m01-l09-q064
  prompt:
    es: "De acuerdo con el artículo 150.3 de la Constitución Española de 1978, apreciar si el interés general exige dictar leyes que armonicen las disposiciones normativas de las Comunidades Autónomas corresponde:"
  options:
  - id: a
    text:
      es: "Al Gobierno, previo dictamen del Consejo de Estado y audiencia de las Comunidades Autónomas afectadas."
  - id: b
    text:
      es: "Al Congreso de los Diputados, por mayoría absoluta, en una votación final sobre el conjunto del proyecto."
  - id: c
    text:
      es: "Al Tribunal Constitucional, a instancia del Gobierno, de cincuenta Diputados o de cincuenta Senadores."
  - id: d
    correct: true
    text:
      es: "A las Cortes Generales, por mayoría absoluta de cada Cámara."
  explanation:
    es: "El artículo 150.3 dice: «Corresponde a las Cortes Generales, por mayoría absoluta de cada Cámara, la apreciación de esta necesidad». No la aprecia el Gobierno, con o sin dictamen del Consejo de Estado. La mayoría absoluta del Congreso en una votación final sobre el conjunto es la regla de las leyes orgánicas (art. 81.2): aquí votan las dos Cámaras. El Tribunal Constitucional controla la constitucionalidad de las leyes, pero no aprecia la necesidad de armonizar."
  citation: "art. 150.3 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "mayoría"
# anchor: boe-a-1978-31229-art-155
- id: m01-l09-q065
  prompt:
    es: "Para ejecutar las medidas aprobadas frente a una Comunidad Autónoma que incumple sus obligaciones constitucionales, ¿a quién podrá dar instrucciones el Gobierno de la Nación?"
  options:
  - id: a
    correct: true
    text:
      es: "A todas las autoridades de las Comunidades Autónomas."
  - id: b
    text:
      es: "Solo al Presidente de la Comunidad Autónoma, que es quien recibió el requerimiento previo."
  - id: c
    text:
      es: "A las autoridades autonómicas que designe el Tribunal Constitucional a petición del Senado."
  - id: d
    text:
      es: "A los Delegados del Gobierno, que las trasladarán a las autoridades autonómicas tras oír al Consejo de Estado."
  explanation:
    es: "El artículo 155.2 dice: «Para la ejecución de las medidas previstas en el apartado anterior, el Gobierno podrá dar instrucciones a todas las autoridades de las Comunidades Autónomas». El requerimiento previo va al Presidente (art. 155.1), pero las instrucciones no se limitan a él. El Tribunal Constitucional no designa a sus destinatarios. El artículo no las hace pasar por los Delegados del Gobierno ni exige oír al Consejo de Estado."
  citation: "art. 155.2 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-147
- id: m01-l09-q066
  prompt:
    es: "¿Cuál de los siguientes criterios fija la Constitución Española de 1978 para la denominación de la Comunidad que deben contener los Estatutos de autonomía?"
  options:
  - id: a
    text:
      es: "La que acuerden las Diputaciones provinciales y las dos terceras partes de los municipios interesados."
  - id: b
    text:
      es: "La que apruebe el cuerpo electoral de las provincias afectadas en el referéndum de ratificación."
  - id: c
    correct: true
    text:
      es: "La que mejor corresponda a su identidad histórica."
  - id: d
    text:
      es: "La que fijen las Cortes Generales en la ley orgánica de autorización por motivos de interés nacional."
  explanation:
    es: "El artículo 147.2.a) exige en los Estatutos «la denominación de la Comunidad que mejor corresponda a su identidad histórica». El acuerdo de las Diputaciones y de dos tercios de los municipios es la iniciativa del proceso autonómico (art. 143.2), no un criterio para el nombre. El referéndum de ratificación del artículo 151.1 versa sobre la iniciativa. Las leyes orgánicas del artículo 144 autorizan o acuerdan, pero la Constitución no les encarga fijar la denominación."
  citation: "art. 147.2 CE"
  difficulty: 2
  tags:
  - "requisito"
