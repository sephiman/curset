# anchor: boe-a-2003-23186-art-39
- id: m03-l04-q0190
  prompt:
    es: "De acuerdo con el artículo 39.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, a la muerte del responsable no se transmite su obligación, salvo que se hubiera notificado antes del fallecimiento:"
  options:
  - id: a
    text:
      es: "el acuerdo de inicio del procedimiento de declaración de responsabilidad."
  - id: b
    text:
      es: "la providencia de apremio al responsable."
  - id: c
    text:
      es: "la propuesta de liquidación de la deuda principal."
  - id: d
    correct: true
    text:
      es: "el acuerdo de derivación de responsabilidad."
  explanation:
    es: "La obligación del responsable no se transmite, salvo que antes del fallecimiento se hubiera notificado el acuerdo de derivación de responsabilidad (art. 39.1). El inicio del procedimiento, la providencia de apremio o la propuesta de liquidación de la deuda principal no cumplen esa condición."
  citation: "art. 39.1 LGT"
  difficulty: 1
  tags:
  - "condición"
  - "efecto"
# anchor: boe-a-2003-23186-art-39
- id: m03-l04-q0192
  prompt:
    es: "De acuerdo con el artículo 39.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, mientras la herencia se encuentre yacente, el cumplimiento de las obligaciones tributarias del causante corresponde:"
  options:
  - id: a
    text:
      es: "a los herederos que hayan aceptado la herencia."
  - id: b
    text:
      es: "al albacea que designe el juez del último domicilio del causante."
  - id: c
    correct: true
    text:
      es: "al representante de la herencia yacente."
  - id: d
    text:
      es: "a la Administración tributaria, que las ejecuta sobre los bienes de la herencia."
  explanation:
    es: "El artículo 39.3 atribuye el cumplimiento al representante de la herencia yacente mientras dure esa situación. No es de los herederos que hayan aceptado, porque aún no hay herederos conocidos o aceptantes. Tampoco se menciona un albacea judicial, y la Administración no sustituye al representante."
  citation: "art. 39.3 LGT"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-39
- id: m03-l04-q0193
  prompt:
    es: "Según el artículo 39.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si al término del procedimiento no se conocieran los herederos, ¿a nombre de quién se realizan las liquidaciones?"
  options:
  - id: a
    text:
      es: "De los hijos del causante, como herederos legales."
  - id: b
    text:
      es: "Del último representante que actuó en el procedimiento."
  - id: c
    text:
      es: "De la Administración tributaria, hasta que aparezcan los herederos."
  - id: d
    correct: true
    text:
      es: "De la herencia yacente."
  explanation:
    es: "El artículo 39.3 dice que, si al terminar el procedimiento no se conocen los herederos, las liquidaciones se realizan a nombre de la herencia yacente. No se emiten a nombre de los hijos presuntos, ni del representante a título personal, ni de la Administración."
  citation: "art. 39.3 LGT"
  difficulty: 1
  tags:
  - "sujeto"
  - "efecto"
# anchor: boe-a-2003-23186-art-40
- id: m03-l04-q0194
  prompt:
    es: "De acuerdo con el artículo 40.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las obligaciones pendientes de las sociedades disueltas y liquidadas en las que la ley limita la responsabilidad de los socios se transmiten a estos hasta el límite del valor de la cuota de liquidación y de las demás percepciones patrimoniales recibidas en:"
  options:
  - id: a
    correct: true
    text:
      es: "los dos años anteriores a la fecha de disolución."
  - id: b
    text:
      es: "los cuatro años anteriores a la fecha de disolución."
  - id: c
    text:
      es: "los dos años posteriores a la fecha de disolución."
  - id: d
    text:
      es: "el año anterior a la fecha de disolución."
  explanation:
    es: "El artículo 40.1 limita la transmisión al valor de la cuota de liquidación y de las demás percepciones recibidas en los dos años anteriores a la disolución que minoren el patrimonio social. Cuatro años es el plazo general de prescripción, los dos años posteriores y el año anterior no son el período del precepto."
  citation: "art. 40.1 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "condición"
# anchor: boe-a-2003-23186-art-41
- id: m03-l04-q0198
  prompt:
    es: "De acuerdo con el artículo 41.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la ley puede configurar como responsables solidarios o subsidiarios de la deuda tributaria, junto a los deudores principales, a otras personas o entidades, y se consideran deudores principales:"
  options:
  - id: a
    correct: true
    text:
      es: "los obligados tributarios del apartado 2 del artículo 35."
  - id: b
    text:
      es: "los obligados tributarios que sean sujetos pasivos del tributo."
  - id: c
    text:
      es: "los obligados tributarios que hayan sido declarados responsables."
  - id: d
    text:
      es: "los obligados tributarios del apartado 4 del artículo 35."
  explanation:
    es: "El artículo 41.1 define como deudores principales los obligados del artículo 35.2: contribuyentes, sustitutos, retenedores y los demás de esa lista. No se reducen a los sujetos pasivos, los responsables no son deudores principales, y el apartado 4 del artículo 35 se refiere a las entidades sin personalidad."
  citation: "art. 41.1 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "sujeto"
# anchor: boe-a-2003-23186-art-41
- id: m03-l04-q0199
  prompt:
    es: "De acuerdo con el artículo 41.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, salvo precepto legal expreso en contrario, la responsabilidad será siempre:"
  options:
  - id: a
    text:
      es: "solidaria respecto del deudor principal."
  - id: b
    correct: true
    text:
      es: "subsidiaria respecto del deudor principal."
  - id: c
    text:
      es: "mancomunada respecto del deudor principal."
  - id: d
    text:
      es: "directa y solidaria si el responsable es administrador."
  explanation:
    es: "El artículo 41.2 fija la regla general: la responsabilidad es subsidiaria salvo que un precepto legal diga expresamente otra cosa. La solidaridad exige previsión legal expresa, la mancomunidad no es una modalidad del precepto, y la condición de administrador no cambia la regla general."
  citation: "art. 41.2 LGT"
  difficulty: 1
  tags:
  - "definición"
  - "condición"
# anchor: boe-a-2003-23186-art-41
- id: m03-l04-q0202
  prompt:
    es: "De acuerdo con el artículo 41.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, salvo que una norma con rango de ley disponga otra cosa, la derivación a los responsables requiere un acto administrativo en el que, previa audiencia al interesado:"
  options:
  - id: a
    text:
      es: "se notifique la liquidación al deudor principal y se inicie el apremio."
  - id: b
    correct: true
    text:
      es: "se declare la responsabilidad y se determine su alcance y extensión."
  - id: c
    text:
      es: "se declare fallido al deudor principal y se embarguen sus bienes."
  - id: d
    text:
      es: "se solicite la conformidad del responsable y se fije la sanción."
  explanation:
    es: "El artículo 41.5 exige un acto administrativo que, previa audiencia al interesado, declare la responsabilidad y determine su alcance y extensión. La liquidación al deudor principal y el apremio, la declaración de fallido y el embargo, o la conformidad y la sanción no definen ese acto."
  citation: "art. 41.5 LGT"
  difficulty: 2
  tags:
  - "requisito"
  - "condición"
# anchor: boe-a-2003-23186-art-41
- id: m03-l04-q0203
  prompt:
    es: "De acuerdo con el artículo 41.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la derivación de la acción administrativa a los responsables subsidiarios:"
  options:
  - id: a
    text:
      es: "Requiere únicamente la previa declaración de fallido del deudor principal."
  - id: b
    text:
      es: "Requiere la previa declaración de fallido de los responsables solidarios, pero no la del deudor principal."
  - id: c
    correct: true
    text:
      es: "Requiere la previa declaración de fallido del deudor principal y de los responsables solidarios."
  - id: d
    text:
      es: "No requiere declaración de fallido previa, pero sí audiencia a los responsables solidarios."
  explanation:
    es: "La derivación a responsables subsidiarios exige la previa declaración de fallido del deudor principal y de los responsables solidarios (art. 41.5). No basta con la del deudor principal, ni con la de los solidarios, y no se puede prescindir de la declaración."
  citation: "art. 41.5 LGT"
  difficulty: 2
  tags:
  - "requisito"
  - "condición"
# anchor: boe-a-2003-23186-art-41
- id: m03-l04-q0204
  prompt:
    es: "¿Qué derecho tienen los responsables frente al deudor principal, en los términos que prevé el artículo 41.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Un derecho de subrogación en la posición del deudor principal, en los términos del procedimiento tributario."
  - id: b
    text:
      es: "Un derecho de compensación con las deudas que la Administración tributaria tenga con el deudor principal."
  - id: c
    text:
      es: "Un derecho de reducción de la deuda proporcional a su grado de culpa."
  - id: d
    correct: true
    text:
      es: "Un derecho de reembolso, en los términos previstos en la legislación civil."
  explanation:
    es: "El artículo 41.6 concede a los responsables un derecho de reembolso frente al deudor principal, con el régimen de la legislación civil. No se trata de subrogación procedimental, de compensación con créditos del deudor ni de una reducción por culpa."
  citation: "art. 41.6 LGT"
  difficulty: 2
  tags:
  - "efecto"
  - "sujeto"
# anchor: boe-a-2003-23186-art-42
- id: m03-l04-q0208
  prompt:
    es: "De acuerdo con el artículo 42.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los responsables solidarios de ese apartado responden del pago de la deuda pendiente y, en su caso, de las sanciones tributarias, hasta el importe:"
  options:
  - id: a
    correct: true
    text:
      es: "del valor de los bienes o derechos que se hubieran podido embargar o enajenar por la Administración tributaria."
  - id: b
    text:
      es: "de la deuda tributaria exigida en período voluntario, sin incluir sanciones."
  - id: c
    text:
      es: "del valor de los bienes o derechos que el responsable haya adquirido del deudor."
  - id: d
    text:
      es: "de las cantidades que hubiera percibido el responsable por su colaboración."
  explanation:
    es: "El artículo 42.2 limita la responsabilidad al valor de los bienes o derechos que se hubieran podido embargar o enajenar por la Administración, e incluye las sanciones, el recargo y el interés de demora del período ejecutivo cuando procedan. No es la deuda voluntaria sin sanciones, ni lo adquirido del deudor, ni lo percibido por colaborar."
  citation: "art. 42.2 LGT"
  difficulty: 3
  tags:
  - "efecto"
  - "cantidad"
# anchor: boe-a-2003-23186-art-42
- id: m03-l04-q0209
  prompt:
    es: "¿Quiénes son responsables solidarios del pago de la deuda pendiente según el artículo 42.2.b) de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Las personas o entidades que, por dolo o negligencia grave, incumplan las órdenes de embargo."
  - id: b
    correct: true
    text:
      es: "Las personas o entidades que, por culpa o negligencia, incumplan las órdenes de embargo."
  - id: c
    text:
      es: "Las personas o entidades que, por culpa o negligencia, incumplan las obligaciones tributarias formales."
  - id: d
    text:
      es: "Las personas o entidades que, por culpa o negligencia, no presenten las autoliquidaciones del deudor."
  explanation:
    es: "El artículo 42.2.b) hace responsables solidarios a quienes, por culpa o negligencia, incumplan las órdenes de embargo. No exige dolo o negligencia grave, ni se refiere a obligaciones formales o autoliquidaciones del deudor."
  citation: "art. 42.2 LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "condición"
# anchor: boe-a-2003-23186-art-42
- id: m03-l04-q0210
  prompt:
    es: "¿Cuándo son responsables solidarios las personas o entidades depositarias de los bienes del deudor conforme al artículo 42.2.d) de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Cuando, antes de recibir la notificación del embargo, hayan entregado los bienes al deudor."
  - id: b
    text:
      es: "Cuando se nieguen a facilitar a la Administración tributaria el inventario de los bienes depositados tras recibir la notificación del embargo."
  - id: c
    text:
      es: "Cuando, una vez recibida la notificación del embargo, no comuniquen su existencia al deudor."
  - id: d
    correct: true
    text:
      es: "Cuando, una vez recibida la notificación del embargo, colaboren o consientan en el levantamiento de los bienes."
  explanation:
    es: "El artículo 42.2.d) alcanza a los depositarios que, una vez recibida la notificación del embargo, colaboren o consientan en el levantamiento de los bienes. Lo anterior a la notificación, la negativa a facilitar el inventario y el deber de avisar al deudor no son los supuestos del precepto."
  citation: "art. 42.2 LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "condición"
# anchor: boe-a-2003-23186-art-43
- id: m03-l04-q0212
  prompt:
    es: "¿Quiénes son responsables subsidiarios de la deuda tributaria según el artículo 43.1.a) de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Los administradores de hecho o de derecho de las personas jurídicas que hubiesen cometido infracciones tributarias, en los casos que señala el precepto, y su responsabilidad se extiende a las sanciones."
  - id: b
    text:
      es: "Los administradores de las personas jurídicas que hubiesen cometido infracciones tributarias, con responsabilidad solidaria que se extiende a las sanciones."
  - id: c
    text:
      es: "Los administradores de hecho o de derecho de las personas jurídicas que hubiesen cometido infracciones tributarias, sin que su responsabilidad se extienda a las sanciones."
  - id: d
    text:
      es: "Los socios de las personas jurídicas que hubiesen cometido infracciones tributarias, con responsabilidad que se extiende a las sanciones."
  explanation:
    es: "El artículo 43.1.a) hace responsables subsidiarios a los administradores de hecho o de derecho de las personas jurídicas que cometieron infracciones, cuando no hicieron lo necesario para cumplir, consintieron el incumplimiento o adoptaron acuerdos que lo posibilitaron, y su responsabilidad se extiende a las sanciones. No son solidarios, no se excluyen las sanciones y no se trata de los socios."
  citation: "art. 43.1 LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "efecto"
# anchor: boe-a-2003-23186-art-43
- id: m03-l04-q0218
  prompt:
    es: "De acuerdo con el artículo 43.1.f) de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración tributaria emite o deniega el certificado de estar al corriente de las obligaciones tributarias del contratista o subcontratista en el plazo de:"
  options:
  - id: a
    text:
      es: "diez días desde su solicitud."
  - id: b
    text:
      es: "un mes desde su solicitud."
  - id: c
    text:
      es: "veinte días desde su solicitud."
  - id: d
    correct: true
    text:
      es: "tres días desde su solicitud."
  explanation:
    es: "El artículo 43.1.f) da a la Administración tres días desde la solicitud para emitir o denegar el certificado. Diez días es el plazo de subsanación de la falta de poder, un mes es el plazo de otras actuaciones del reglamento y veinte días es otro plazo de certificación de otra norma."
  citation: "art. 43.1 LGT"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2003-23186-art-43
- id: m03-l04-q0219
  prompt:
    es: "De acuerdo con el artículo 43.1.g) de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la responsabilidad subsidiaria de quienes tienen el control efectivo o una voluntad rectora común con las personas jurídicas creadas o utilizadas de forma abusiva o fraudulenta:"
  options:
  - id: a
    correct: true
    text:
      es: "La responsabilidad se extiende a las obligaciones tributarias y a las sanciones de dichas personas jurídicas."
  - id: b
    text:
      es: "La responsabilidad se extiende a las obligaciones tributarias de dichas personas jurídicas, pero no a las sanciones."
  - id: c
    text:
      es: "La responsabilidad se extiende a las sanciones de dichas personas jurídicas, pero no a sus obligaciones tributarias."
  - id: d
    text:
      es: "La responsabilidad es solidaria y se extiende a las obligaciones tributarias y a las sanciones."
  explanation:
    es: "En la letra g) del artículo 43.1 la responsabilidad se extiende a las obligaciones tributarias y a las sanciones de las personas jurídicas creadas o utilizadas de forma abusiva o fraudulenta. No se limita a una de las dos cosas y es subsidiaria, no solidaria."
  citation: "art. 43.1 LGT"
  difficulty: 3
  tags:
  - "efecto"
  - "sujeto"
# anchor: boe-a-2003-23186-art-43
- id: m03-l04-q0224
  prompt:
    es: "De acuerdo con el artículo 43.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las leyes podrán establecer otros supuestos de responsabilidad subsidiaria:"
  options:
  - id: a
    text:
      es: "solo cuando afecten a los administradores de las personas jurídicas."
  - id: b
    text:
      es: "con el carácter de responsabilidad solidaria."
  - id: c
    text:
      es: "siempre que lo autorice la Administración tributaria."
  - id: d
    correct: true
    text:
      es: "distintos de los previstos en los apartados anteriores."
  explanation:
    es: "El artículo 43.3 faculta a las leyes para establecer otros supuestos de responsabilidad subsidiaria distintos de los de los apartados anteriores. No se limitan a administradores, no se cambia su carácter a solidaria y no se requiere autorización de la Administración."
  citation: "art. 43.3 LGT"
  difficulty: 1
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-43
- id: m03-l04-q0225
  prompt:
    es: "Obras Marcos, S.A. subcontrata a Excavaciones Prado la ejecución de unas obras correspondientes a su actividad económica principal. El 1 de febrero de 2025 la Administración emite a Excavaciones Prado un certificado específico de estar al corriente de sus obligaciones tributarias. Obras Marcos paga la factura el 10 de enero de 2026, tras recibir una copia de ese certificado. Conforme a la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿es exigible a Obras Marcos la responsabilidad subsidiaria del artículo 43.1.f)?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque el certificado fue emitido durante los 12 meses anteriores al pago de la factura."
  - id: b
    text:
      es: "Sí, porque el certificado se emitió en un ejercicio distinto al del pago de la factura."
  - id: c
    text:
      es: "Sí, porque el certificado debió emitirse durante los 3 meses anteriores al pago."
  - id: d
    text:
      es: "No, porque el contratista es una sociedad y la responsabilidad solo alcanza a empresarios individuales."
  explanation:
    es: "El certificado se emitió el 1 de febrero de 2025 y el pago fue el 10 de enero de 2026, menos de doce meses después. El artículo 43.1.f) no exige la responsabilidad cuando el contratista aporta un certificado emitido durante los 12 meses anteriores al pago de cada factura. No cuenta el ejercicio ni un plazo de tres meses, y la naturaleza societaria del contratista no excluye la responsabilidad."
  citation: "art. 43.1 LGT"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
