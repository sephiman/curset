  options:
  - id: a
    correct: true
    text:
      es: "Extraer y copiar el texto del recorte mediante OCR"
  - id: b
    text:
      es: "Escribir o dibujar sobre el recorte con el lápiz o el resaltador"
  - id: c
    text:
