- id: m03-l03-q19
  prompt:
    en: In Java 24 and later, `synchronized` no longer pins virtual threads. Which recommendation does JEP 491 give
      for choosing between `synchronized` and `ReentrantLock` in new code?
  options:
  - id: a
    text:
      en: Migrate `synchronized` code to `ReentrantLock` before running it on virtual threads
  - id: b
    text:
      en: Convert every `ReentrantLock` back to `synchronized` in code that was already migrated
  - id: c
    correct: true
    text:
      en: Use `synchronized` where practical and `ReentrantLock` when more flexibility is required
  - id: d
    text:
      en: 'Choose by thread type alone: `ReentrantLock` for virtual threads and `synchronized` for platform threads'
  explanation:
    en: For new code JEP 491 says to use `synchronized` where practical and `ReentrantLock` and the other `java.util.concurrent.locks`
      APIs when more flexibility is required. Migrating before running is wrong because such migration is no longer
      necessary once `synchronized` no longer pins. Converting back is wrong because migrated code need not be reverted.
      Choosing by thread type is wrong because the choice is based solely upon which best solves the problem at
      hand.
  citation: jep-491#Choosing-between-synchronized-and-java-util-concurrent-locks
