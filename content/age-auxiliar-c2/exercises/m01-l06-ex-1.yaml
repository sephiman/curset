# anchor: fuente-transparencia-iv-plan-pdf
- id: m01-l06-q070
  prompt:
    es: "Señale la respuesta correcta sobre el número de compromisos y de ejes del IV Plan de Gobierno Abierto de España 2020-2024, aprobado por el pleno del Foro de Gobierno Abierto en 2020:"
  options:
  - id: a
    text:
      es: "Recoge cinco compromisos y se articula en diez ejes."
  - id: b
    text:
      es: "Recoge nueve compromisos y se articula en cuatro ejes."
  - id: c
    correct: true
    text:
      es: "Recoge diez compromisos y se articula en cinco ejes."
  - id: d
    text:
      es: "Recoge diez compromisos y se articula en tres ejes."
  explanation:
    es: "El IV Plan contiene diez compromisos: los nueve primeros se agrupan en cuatro ejes y el quinto eje reúne las iniciativas autonómicas y de la FEMP en el compromiso diez, de modo que son cinco ejes. La opción que invierte las cifras confunde compromisos con ejes. La de nueve compromisos olvida el décimo. La de tres ejes se queda corta."
  citation: "fuente: `transparencia-iv-plan.pdf`"
  difficulty: 1
  tags:
  - "estructura"
  - "cantidad"
# anchor: fuente-transparencia-iv-plan-pdf
- id: m01-l06-q071
  prompt:
    es: "Señale la posición que ocupa la integridad entre los ejes del IV Plan de Gobierno Abierto de España 2020-2024, contando desde el primero de ellos:"
  options:
  - id: a
    text:
      es: "Primer eje."
  - id: b
    text:
      es: "Segundo eje."
  - id: c
    text:
      es: "Cuarto eje."
  - id: d
    correct: true
    text:
