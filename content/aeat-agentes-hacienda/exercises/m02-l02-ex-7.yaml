# anchor: boe-a-2015-10565-art-24
- id: m02-l02-q0077
  prompt:
    es: "Según el artículo 24.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué sentido tiene el silencio en los procedimientos relativos al ejercicio del derecho de petición?"
  options:
  - id: a
    correct: true
    text:
      es: "Desestimatorio, como en los procedimientos de responsabilidad patrimonial."
  - id: b
    text:
      es: "Estimatorio, como en la generalidad de los procedimientos iniciados a solicitud."
  - id: c
    text:
      es: "Estimatorio, salvo que la petición se dirija a la Administración General del Estado."
  - id: d
    text:
      es: "Ninguno: el vencimiento del plazo produce la caducidad del procedimiento."
  explanation:
    es: "El artículo 24.1 dice que «el silencio tendrá efecto desestimatorio en los procedimientos relativos al ejercicio del derecho de petición», y también en los de responsabilidad patrimonial. El derecho de petición no sigue la regla general del silencio estimatorio. La ley no distingue según la Administración destinataria. La caducidad es el efecto de ciertos procedimientos de oficio, no de este."
  citation: "art. 24.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-10565-art-24
- id: m02-l02-q0078
  prompt:
    es: "Según el artículo 24.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué efecto tiene no resolver en plazo la alzada contra la desestimación por silencio de una solicitud?"
  options:
  - id: a
    text:
      es: "La alzada se entenderá desestimada, como en todos los procedimientos de impugnación de actos."
  - id: b
    correct: true
    text:
      es: "La alzada se entenderá estimada, salvo en las materias en que el artículo 24.1 hace desestimatorio el silencio."
  - id: c
    text:
      es: "La alzada se entenderá estimada en todo caso, cualquiera que sea la materia de la solicitud."
  - id: d
    text:
      es: "La alzada se entenderá caducada, y el interesado podrá presentar una nueva solicitud."
  explanation:
    es: "El artículo 24.1 dice que, cuando la alzada se interpuso contra la desestimación por silencio de una solicitud, «se entenderá estimado el mismo» si no se dicta y notifica resolución en plazo, «siempre que no se refiera a las materias enumeradas en el párrafo anterior». No rige aquí la regla general de la impugnación, que es desestimatoria. La estimación tampoco opera en todo caso: no alcanza al derecho de petición ni a la responsabilidad patrimonial, entre otras materias. La ley no prevé caducidad."
  citation: "art. 24.1 LPAC"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-10565-art-24
- id: m02-l02-q0079
  prompt:
    es: "De acuerdo con el artículo 24.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los casos de estimación por silencio administrativo, la resolución expresa posterior a la producción del acto:"
  options:
  - id: a
    text:
      es: "Se adoptará sin vinculación alguna al sentido del silencio."
  - id: b
    text:
      es: "Solo podrá dictarse previa declaración de lesividad del acto presunto."
  - id: c
    correct: true
    text:
      es: "Solo podrá dictarse de ser confirmatoria del mismo."
  - id: d
    text:
      es: "No podrá dictarse, porque el silencio ya puso fin al procedimiento."
  explanation:
    es: "El artículo 24.3.a) dice que, tras la estimación por silencio, la resolución expresa posterior «sólo podrá dictarse de ser confirmatoria del mismo». La resolución sin vinculación al sentido del silencio corresponde a la desestimación (art. 24.3.b). La lesividad no es el cauce para dictarla. La obligación de resolver subsiste (art. 21.1), así que la resolución sí puede dictarse, siempre confirmatoria."
  citation: "art. 24.3.a) LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-24
- id: m02-l02-q0080
  prompt:
    es: "Según el artículo 24.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿quién expide el certificado acreditativo del silencio producido y en qué plazo?"
  options:
  - id: a
    correct: true
    text:
      es: "El órgano competente para resolver, de oficio, en quince días desde que expire el plazo máximo para resolver."
  - id: b
    text:
      es: "El órgano competente para resolver, solo a petición del interesado, en diez días desde que la reciba."
  - id: c
    text:
      es: "El superior jerárquico del órgano competente, de oficio, en quince días desde que expire el plazo máximo."
  - id: d
    text:
      es: "La oficina de asistencia en materia de registros, de oficio, en un mes desde que expire el plazo máximo."
  explanation:
    es: "El artículo 24.4 dice que el certificado «se expedirá de oficio por el órgano competente para resolver en el plazo de quince días desde que expire el plazo máximo para resolver». No hace falta petición, aunque el interesado puede pedirlo en cualquier momento. No lo expide el superior jerárquico ni la oficina de registro, y el plazo no es de diez días ni de un mes."
  citation: "art. 24.4 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-2015-10565-art-24
- id: m02-l02-q0081
  prompt:
    es: "¿En cuál de los siguientes casos permite el vencimiento del plazo sin resolución expresa entender desestimada la pretensión del interesado, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "En una solicitud del interesado cuando ninguna norma con rango de ley, europea o internacional dispone otra cosa."
  - id: b
    correct: true
    text:
      es: "En un recurso de alzada interpuesto contra la resolución expresa que deniega una solicitud."
  - id: c
    text:
      es: "En una alzada contra la desestimación por silencio de una solicitud sobre materia no excluida por el artículo 24.1."
  - id: d
    text:
      es: "En un procedimiento sancionador iniciado de oficio por el órgano competente."
  explanation:
    es: "El artículo 24.1 dice que el silencio será desestimatorio «en los procedimientos de impugnación de actos y disposiciones», y la alzada contra una denegación expresa lo es. La solicitud sin norma que disponga otra cosa sigue la regla general: silencio estimatorio. La alzada contra la desestimación por silencio de una solicitud se entiende estimada si no versa sobre las materias del párrafo segundo del artículo 24.1. En el procedimiento sancionador de oficio el vencimiento produce la caducidad (art. 25.1.b)."
  citation: "art. 24.1 LPAC"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-10565-art-109
- id: m02-l02-q0092
  prompt:
    es: "Señale la respuesta correcta sobre la revocación de los actos de gravamen o desfavorables, según el artículo 109.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Solo alcanza a los actos favorables para los interesados, previa declaración de su lesividad."
  - id: b
    text:
      es: "Exige el dictamen favorable previo del Consejo de Estado u órgano consultivo equivalente."
  - id: c
    correct: true
    text:
      es: "No puede constituir dispensa o exención no permitida por las leyes ni ser contraria a la igualdad."
  - id: d
    text:
      es: "Puede acordarse aunque sea contraria al interés público, siempre que beneficie al interesado."
  explanation:
    es: "El artículo 109.1 condiciona la revocación a que «no constituya dispensa o exención no permitida por las leyes, ni sea contraria al principio de igualdad, al interés público o al ordenamiento jurídico». La revocación recae sobre actos de gravamen o desfavorables; los actos favorables anulables siguen la vía de la lesividad (art. 107). El dictamen del Consejo de Estado es propio de la nulidad de oficio. La revocación contraria al interés público está prohibida aunque beneficie al interesado."
  citation: "art. 109.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2015-10565-art-109
- id: m02-l02-q0093
  prompt:
    es: "Según el artículo 109.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las Administraciones Públicas podrán rectificar los errores materiales, de hecho o aritméticos de sus actos:"
  options:
  - id: a
    text:
      es: "Dentro de los cuatro años siguientes a la fecha en que se dictó el acto."
  - id: b
    text:
      es: "Mientras no haya transcurrido el plazo de prescripción de la acción."
  - id: c
    correct: true
    text:
      es: "En cualquier momento, sin que la ley establezca un plazo máximo para hacerlo."
  - id: d
    text:
      es: "Dentro del mes siguiente a la notificación del acto que contiene el error."
  explanation:
    es: "El artículo 109.2 dice que las Administraciones pueden rectificar los errores materiales, de hecho o aritméticos «en cualquier momento, de oficio o a instancia de los interesados». Los cuatro años son el límite de la declaración de lesividad del artículo 107.2. El plazo de prescripción es el límite de la revocación de los actos de gravamen, en el artículo 109.1, y no el de la rectificación. Un mes desde la notificación contradice «en cualquier momento»."
  citation: "art. 109.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-114
- id: m02-l02-q0097
  prompt:
    es: "Según el artículo 114.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿agota la vía administrativa la desestimación de una reclamación de responsabilidad patrimonial por una Dirección General con superior?"
  options:
  - id: a
    text:
      es: "No, salvo que la dicte un Ministro o un Secretario de Estado en ejercicio de sus competencias."
  - id: b
    text:
      es: "No, salvo que el Consejo de Estado haya emitido dictamen en el procedimiento de reclamación."
  - id: c
    text:
      es: "Sí, pero solo cuando la resolución estime total o parcialmente la reclamación presentada."
  - id: d
    correct: true
    text:
      es: "Sí, pone fin a la vía administrativa aunque la dicte un órgano con superior jerárquico."
  explanation:
    es: "El artículo 114.1.e) de la Ley 39/2015 incluye entre los actos que ponen fin a la vía administrativa «la resolución administrativa de los procedimientos de responsabilidad patrimonial». No distingue por el órgano que la dicta ni por su sentido, estimatorio o desestimatorio. Contra ella cabe reposición potestativa o recurso contencioso-administrativo directo (art. 123.1), no alzada. El dictamen del Consejo de Estado no influye en que la resolución agote la vía."
  citation: "art. 114.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "concepto"
# anchor: boe-a-2015-10565-art-114
- id: m02-l02-q0098
  prompt:
    es: "Según el artículo 114.2.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué nivel mínimo debe tener un órgano directivo estatal para que sus actos de personal agoten la vía administrativa?"
  options:
  - id: a
    text:
      es: "El nivel de Subdirector general o superior."
  - id: b
    text:
      es: "El nivel de Subsecretario o superior."
  - id: c
    correct: true
    text:
      es: "El nivel de Director general o superior."
  - id: d
    text:
      es: "El nivel de Secretario de Estado o superior."
  explanation:
    es: "El artículo 114.2.c) se refiere a los actos «emanados de los órganos directivos con nivel de Director general o superior, en relación con las competencias que tengan atribuidas en materia de personal». El Subdirector general está por debajo de ese nivel: sus actos de personal no agotan la vía y admiten alzada. Subsecretario y Secretario de Estado están por encima, de modo que no son el nivel mínimo."
  citation: "art. 114.2.c) LPAC"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10565-art-114
- id: m02-l02-q0101
  prompt:
    es: "¿Cuál de los siguientes actos pone fin a la vía administrativa en el ámbito estatal, según el artículo 114.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Los actos de los Subdirectores generales en materia de contratación."
  - id: b
    text:
      es: "Los actos de trámite simples dictados por los Directores generales."
  - id: c
    text:
      es: "Los actos de los Jefes de Servicio sin competencia delegada."
  - id: d
    correct: true
    text:
      es: "Los actos administrativos de los miembros y órganos del Gobierno."
  explanation:
    es: "El artículo 114.2.a) incluye «los actos administrativos de los miembros y órganos del Gobierno». Los Subdirectores generales y los Jefes de Servicio están por debajo del nivel que fija el artículo 114.2.c), que además se limita a la materia de personal. Un acto de trámite simple no pone fin al procedimiento, sea cual sea el órgano que lo dicta."
  citation: "art. 114.2 LPAC"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10565-art-48
- id: m02-l02-q0102
  prompt:
    es: "Conforme al artículo 48.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la realización de actuaciones administrativas fuera del tiempo establecido para ellas solo implicará la anulabilidad del acto cuando:"
  options:
  - id: a
    text:
      es: "El interesado lo alegue en el plazo de diez días."
  - id: b
    correct: true
    text:
      es: "Así lo imponga la naturaleza del término o plazo."
  - id: c
    text:
      es: "El acto resulte desfavorable para el interesado."
  - id: d
    text:
      es: "Lo disponga la resolución que ponga fin al procedimiento."
  explanation:
    es: "El artículo 48.3 limita la anulabilidad por actuar fuera de plazo a los casos en que lo imponga la naturaleza del término o plazo. La alegación del interesado, el carácter desfavorable del acto y lo que diga la resolución final no son criterios de ese apartado."
  citation: "art. 48.3 LPAC"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-114
- id: m02-l02-q0107
  prompt:
    es: "¿Cuál de las siguientes resoluciones pone fin a la vía administrativa, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Los acuerdos de iniciación de los procedimientos de oficio."
  - id: b
    text:
      es: "Los acuerdos de ampliación de los plazos."
  - id: c
    text:
      es: "Las notificaciones de las resoluciones dictadas."
  - id: d
    correct: true
    text:
      es: "Las resoluciones de los recursos de alzada."
  explanation:
    es: "Según el artículo 114.1.a), las resoluciones de los recursos de alzada ponen fin a la vía administrativa. Los acuerdos de iniciación y de ampliación de plazos son actos de trámite, y la notificación solo da a conocer una resolución ya dictada: ninguno figura en el apartado."
  citation: "art. 114.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-114
- id: m02-l02-q0108
  prompt:
    es: "Conforme al artículo 114.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ponen fin a la vía administrativa las resoluciones de los órganos administrativos que carezcan de superior jerárquico, salvo que:"
  options:
  - id: a
    text:
      es: "Lo disponga una orden."
  - id: b
    correct: true
    text:
      es: "Una Ley establezca lo contrario."
  - id: c
    text:
      es: "El interesado haya interpuesto recurso de reposición."
  - id: d
    text:
      es: "El órgano pertenezca a la Administración local."
  explanation:
    es: "El artículo 114.1.c) pone fin a la vía administrativa con las resoluciones de los órganos sin superior jerárquico, salvo que una Ley establezca lo contrario. Una orden ministerial no tiene rango para excepcionarlo, el recurso de reposición no cambia la regla y la ley no distingue por Administración."
  citation: "art. 114.1 LPAC"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-42
- id: m02-l02-q0110
  prompt:
    es: "Señale quién puede hacerse cargo de la notificación en papel si el interesado está ausente de su domicilio, según el artículo 42.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Cualquier persona mayor de catorce años que se encuentre en el domicilio y haga constar su identidad."
  - id: b
    text:
      es: "Cualquier persona que se encuentre en el domicilio y sea pariente del interesado."
  - id: c
    text:
      es: "Cualquier persona que se encuentre en el domicilio y esté autorizada por escrito por el interesado."
  - id: d
    text:
      es: "Únicamente quien conviva con el interesado y pueda acreditar su identidad con un documento oficial."
  explanation:
    es: "El artículo 42.2 permite que reciba la notificación cualquier persona mayor de catorce años que se encuentre en el domicilio y haga constar su identidad. La ley no exige parentesco, ni una autorización escrita, ni convivencia con el interesado."
  citation: "art. 42.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-114
- id: m02-l02-q0113
  prompt:
    es: "Según el artículo 114.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué efecto tiene la resolución del procedimiento complementario en materia sancionadora del artículo 90.4?"
  options:
  - id: a
    text:
      es: "No pone fin a la vía y es recurrible en alzada."
  - id: b
    correct: true
    text:
      es: "Pone fin a la vía administrativa por sí misma."
  - id: c
    text:
      es: "Solo pone fin a la vía si la dicta un Ministro."
  - id: d
    text:
      es: "Es un acto de trámite sin recurso propio."
  explanation:
    es: "El artículo 114.1.f) incluye entre los actos que ponen fin a la vía administrativa «la resolución de los procedimientos complementarios en materia sancionadora a los que se refiere el artículo 90.4». No necesita que la dicte un Ministro, y como agota la vía no cabe alzada contra ella. Tampoco es un acto de trámite: resuelve el procedimiento complementario."
  citation: "art. 114.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "concepto"
# anchor: boe-a-2015-10565-art-30
- id: m02-l02-q0116
  prompt:
    es: "De acuerdo con el artículo 30.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en defecto de otro cómputo legal o europeo, los plazos señalados por horas:"
  options:
  - id: a
    correct: true
    text:
      es: "Se entienden hábiles, y son hábiles todas las horas del día que formen parte de un día hábil."
  - id: b
    text:
      es: "Se entienden naturales, y se cuentan todas las horas del día, sea este hábil o inhábil."
  - id: c
    text:
      es: "Se entienden hábiles, y solo lo son las horas en que abren las oficinas de registro."
  - id: d
    text:
      es: "Se entienden hábiles, y solo lo son las horas de la jornada ordinaria de un día hábil."
  explanation:
    es: "El artículo 30.1 dice que las horas «son hábiles» y que «son hábiles todas las horas del día que formen parte de un día hábil». No se cuentan como naturales: las horas de un sábado, un domingo o un festivo no corren. Tampoco se limitan a las horas de apertura de las oficinas ni a la jornada ordinaria: cuenta el día hábil entero, de las 0:00 a las 24:00."
  citation: "art. 30.1 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m02-l02-q0117
  prompt:
    es: "Según el artículo 30.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué duración máxima pueden tener los plazos expresados por horas?"
  options:
  - id: a
    text:
      es: "Cuarenta y ocho horas; si fuera mayor, el plazo se expresará en días."
  - id: b
    text:
      es: "Setenta y dos horas; si fuera mayor, el plazo se expresará en días."
  - id: c
    text:
      es: "Doce horas; si fuera mayor, el plazo se expresará en días hábiles."
  - id: d
    correct: true
    text:
      es: "Veinticuatro horas; si fuera mayor, el plazo se expresará en días."
  explanation:
    es: "Los plazos por horas «no podrán tener una duración superior a veinticuatro horas, en cuyo caso se expresarán en días». Un plazo de cuarenta y ocho o de setenta y dos horas no cabe: se fija en días. El límite tampoco es de doce horas."
  citation: "art. 30.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-30
- id: m02-l02-q0119
  prompt:
    es: "De acuerdo con el artículo 30.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando una ley o el Derecho de la Unión Europea señalen un plazo por días naturales:"
  options:
  - id: a
    text:
      es: "Esta circunstancia se hará constar en el calendario anual de días inhábiles."
  - id: b
    text:
      es: "Esta circunstancia se hará constar en el acuerdo de iniciación, no en las notificaciones."
  - id: c
    correct: true
    text:
      es: "Esta circunstancia se hará constar en las correspondientes notificaciones."
  - id: d
    text:
      es: "Esta circunstancia solo se hará constar si el plazo es superior a quince días."
  explanation:
    es: "El artículo 30.2 dice que, cuando los plazos se señalen por días naturales, «se hará constar esta circunstancia en las correspondientes notificaciones». El lugar es la notificación, no el calendario de días inhábiles ni solo el acuerdo de iniciación. La ley no limita el deber a los plazos de más de quince días."
  citation: "art. 30.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "requisito"
# anchor: boe-a-2015-10565-art-30
- id: m02-l02-q0121
  prompt:
    es: "De acuerdo con el artículo 30.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si un plazo en meses vence en un mes sin día equivalente al de inicio del cómputo:"
  options:
  - id: a
    correct: true
    text:
      es: "Se entenderá que el plazo expira el último día del mes."
  - id: b
    text:
      es: "Se entenderá que el plazo expira el primer día del mes siguiente."
  - id: c
    text:
      es: "Se entenderá que el plazo expira el primer día hábil del mes siguiente."
  - id: d
    text:
      es: "Se contará el plazo por días naturales, a razón de treinta días por mes."
  explanation:
    es: "El artículo 30.4 dice que, si en el mes de vencimiento no hay día equivalente, «se entenderá que el plazo expira el último día del mes». El plazo no pasa al mes siguiente, ni a su primer día ni a su primer día hábil. Los meses se cuentan de fecha a fecha, no como treinta días naturales."
  citation: "art. 30.4 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m02-l02-q0123
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué ocurre cuando el último día de un plazo es inhábil?"
  options:
  - id: a
    text:
      es: "Se entiende vencido el último día hábil anterior."
  - id: b
    text:
      es: "Se entiende prorrogado al segundo día hábil siguiente."
  - id: c
    text:
      es: "Se entiende ampliado en la mitad del plazo inicial."
  - id: d
    correct: true
    text:
      es: "Se entiende prorrogado al primer día hábil siguiente."
  explanation:
    es: "El artículo 30.5 dice que, cuando el último día del plazo sea inhábil, «se entenderá prorrogado al primer día hábil siguiente». El plazo no se adelanta al hábil anterior ni salta al segundo hábil. La ampliación en la mitad del plazo es otra figura, la del artículo 32.1, que la Administración acuerda y que no opera sola."
  citation: "art. 30.5 LPAC"
  difficulty: 1
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m02-l02-q0124
  prompt:
    es: "Según el artículo 30.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cómo se considera un día hábil donde reside el interesado e inhábil en la sede del órgano?"
  options:
  - id: a
    correct: true
    text:
      es: "Inhábil en todo caso, tanto para el interesado como para la Administración."
  - id: b
    text:
      es: "Hábil en todo caso, porque prevalece el calendario del interesado."
  - id: c
    text:
      es: "Hábil para el interesado e inhábil para la Administración."
  - id: d
    text:
      es: "Hábil o inhábil según lo que decida el órgano en cada procedimiento."
  explanation:
    es: "El artículo 30.6 dice que un día hábil en el municipio o Comunidad Autónoma del interesado e inhábil en la sede del órgano, o a la inversa, «se considerará inhábil en todo caso». No prevalece el calendario del interesado, no hay un régimen distinto para cada parte y el órgano no decide en cada caso."
  citation: "art. 30.6 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
# anchor: boe-a-2015-10565-art-30
- id: m02-l02-q0126
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la declaración de un día como hábil o inhábil a efectos de plazos es correcta, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "No determina por sí sola el funcionamiento de los centros de trabajo de las Administraciones Públicas."
  - id: b
    text:
      es: "Determina por sí sola la apertura o el cierre de los centros de trabajo de las Administraciones Públicas."
  - id: c
    text:
      es: "Obliga a cerrar las oficinas de asistencia en materia de registros en los días declarados inhábiles."
  - id: d
    text:
      es: "Fija el régimen de jornada y horarios del personal de las Administraciones Públicas en esos días."
  explanation:
    es: "El artículo 30.8 dice que la declaración de un día como hábil o inhábil «no determina por sí sola el funcionamiento de los centros de trabajo», ni la organización del tiempo de trabajo ni el régimen de jornada y horarios. No abre ni cierra oficinas por sí misma, tampoco las de asistencia en materia de registros, y no fija la jornada del personal."
  citation: "art. 30.8 LPAC"
  difficulty: 2
  tags:
  - "efecto"
