variants:
- id: m06-l03-qa01
  prompt:
    en: According to the PostgreSQL 18 documentation in 11.3. Multicolumn Indexes, which statement does it make
      about indexes that are defined on more than one column of a table?
  options:
  - id: a
    text:
      en: A single-column index is rarely sufficient, so most queries should be served by multicolumn indexes
  - id: b
    text:
      en: Every index type supports several key columns, so the choice of index type makes no difference
  - id: c
    correct: true
    text:
      en: Indexes with more than three columns are unlikely to help unless table usage is extremely stylized
  - id: d
    text:
      en: An index is limited to eight columns, and that limit cannot be changed in any build
  explanation:
    en: The documentation states that indexes with more than three columns are unlikely to be helpful unless the
      usage of the table is extremely stylized. It rules out the claim that a single-column index is rarely sufficient,
      because it says that in most situations an index on a single column is sufficient and saves space and time.
      It rules out the claim that every index type supports several key columns, because it says that currently
      only the B-tree, GiST, GIN, and BRIN index types support multiple-key-column indexes. It rules out the eight-column
      limit, because it says indexes can have up to 32 columns, including `INCLUDE` columns.
  citation: pg-indexes-multicolumn#INDEXES-MULTICOLUMN
  extract:
    en: Indexes with more than three columns are unlikely to be helpful unless the usage of the table is extremely
      stylized.
- id: m06-l03-qa02
  prompt:
    en: According to the PostgreSQL 18 documentation in 11.9. Index-Only Scans and Covering Indexes, under which
      condition is there some point in including payload columns in an index with an `INCLUDE` clause?
  options:
  - id: a
    text:
      en: When the payload columns are wide, because wide columns keep the index small and quick
  - id: b
    correct: true
    text:
      en: When the table changes slowly enough that an index-only scan is likely to avoid the heap
  - id: c
    text:
      en: When the index is a hash index, because only hash indexes support included columns
  - id: d
    text:
      en: When the table changes quickly, so that most heap pages have their all-visible bits cleared
  explanation:
    en: The documentation states that there is little point in including payload columns in an index unless the
      table changes slowly enough that an index-only scan is likely to not need to access the heap. It rules out
      wide payload columns, because it says it is wise to be conservative about adding non-key payload columns,
      especially wide columns. It rules out hash indexes, because it says that only B-tree, GiST and SP-GiST indexes
      currently support included columns. It rules out a quickly changing table, because it says an index-only scan
      will be a win only if a significant fraction of the table's heap pages have their all-visible map bits set.
  citation: pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS
  extract:
    en: there is little point in including payload columns in an index unless the table changes slowly enough that
      an index-only scan is likely to not need to access the heap
- id: m06-l03-qa05
  prompt:
    en: According to the Hibernate ORM 7.4 User Guide in 12.8. Batch fetching, what does it say is most of the time
      a much better alternative to the `@BatchSize` annotation?
  options:
  - id: a
    correct: true
    text:
      en: A DTO projection or a `JOIN FETCH`, which fetches everything needed in one query
  - id: b
    text:
      en: '`FetchType.EAGER` on every association, so that no proxy is ever left uninitialized'
  - id: c
    text:
      en: A loop that initializes each uninitialized proxy with a query of its own
  - id: d
    text:
      en: One `JOIN FETCH` that loads several collections at once, which avoids a Cartesian product
  explanation:
    en: The guide states that, although `@BatchSize` is better than running into an N + 1 query issue, most of the
      time a DTO projection or a `JOIN FETCH` is a much better alternative since it fetches all the required data
      with a single query. It rules out `FetchType.EAGER` on every association, because it says EAGER fetching is
      almost always a bad choice. It rules out a loop that initializes each proxy with its own query, because it
      says that without `@BatchSize` you would run into an N + 1 query issue with 10 queries instead of 2. It rules
      out one `JOIN FETCH` over several collections, because it says that to avoid a Cartesian Product you should
      use secondary queries when you need to fetch multiple collections.
  citation: hibernate-user-guide#fetching-batch; hibernate-user-guide#best-practices-fetching-associations; hibernate-user-guide#best-practices-fetching-associations
