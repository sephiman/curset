    es: "Un funcionario del Subgrupo A2 con grado 20 consolidado toma posesión el lunes 5 de abril de 2027 de un puesto de nivel 26 obtenido por concurso. Si lo desempeña sin interrupción, ¿en qué fecha completa el tiempo para consolidar el grado 22?"
  options:
