# anchor: boe-a-2023-25758-art-114
- id: m01-l13-q154
  prompt:
    es: "¿Cuál de las siguientes reglas sobre la fase de concurso del concurso-oposición establece el Real Decreto-ley 6/2023, de 19 de diciembre?"
  options:
  - id: a
    text:
      es: "Su valoración no puede superar en ningún caso el diez por ciento de la puntuación total"
  - id: b
    text:
      es: "Su puntuación determina por sí sola el resultado cuando hay empate en la oposición"
  - id: c
    correct: true
    text:
      es: "Su valoración es proporcionada y su puntuación no determina por sí sola el resultado"
  - id: d
    text:
      es: "Su valoración la fija libremente el órgano de selección tras conocer los resultados"
  explanation:
    es: "El artículo 114.7 dice: «La valoración de la fase de concurso será proporcionada y, en ningún caso, su puntuación determinará por sí sola el resultado del proceso selectivo». El artículo no fija un tope del diez por ciento. Tampoco prevé que la fase de concurso decida sola en caso de empate: eso es justo lo que excluye «en ningún caso». Y no deja la valoración a la libre decisión del órgano de selección después de conocer los resultados."
  citation: "art. 114.7 RDL 6/2023"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2023-25758-art-114
- id: m01-l13-q155
  prompt:
    es: "¿Qué condición tiene la persona aspirante durante la fase de curso selectivo de un proceso de selección de personal funcionario de carrera según el Real Decreto-ley 6/2023, de 19 de diciembre?"
  options:
  - id: a
    text:
      es: "Personal funcionario interino"
  - id: b
    correct: true
    text:
      es: "Personal funcionario en prácticas"
  - id: c
    text:
      es: "Personal funcionario de carrera"
  - id: d
    text:
      es: "Aspirante sin vinculación con la Administración"
  explanation:
    es: "El artículo 114.8 dice que durante esta fase «la persona aspirante tendrá la condición de personal funcionario en prácticas». No es personal funcionario interino, que se nombra por necesidad y urgencia para desempeñar un puesto. Tampoco es todavía funcionario de carrera. Y sí tiene una vinculación con la Administración: la de funcionario en prácticas."
  citation: "art. 114.8 RDL 6/2023"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2023-25758-art-114
- id: m01-l13-q156
  prompt:
    es: "¿Cuál de las siguientes describe el curso selectivo que pueden incorporar los sistemas de selección de personal funcionario de carrera según el Real Decreto-ley 6/2023, de 19 de diciembre?"
  options:
  - id: a
    correct: true
    text:
      es: "Un periodo formativo o de prácticas evaluable, de contenido distinto de lo valorado en las fases previas"
  - id: b
    text:
      es: "Un periodo formativo no evaluable, que solo condiciona la adjudicación del primer destino"
  - id: c
    text:
      es: "Un periodo de prácticas evaluable que repite las materias valoradas en la fase de oposición"
  - id: d
    text:
      es: "Una prueba final de conocimientos que sustituye a la fase de concurso"
  explanation:
    es: "El artículo 114.8 describe el curso selectivo como «la realización de un periodo formativo o de prácticas evaluable, cuyo contenido y desarrollo diferirá de lo valorado en las fases previas». Por eso es evaluable y no repite lo valorado antes. Tampoco es una prueba final que sustituya a la fase de concurso: es una fase más del sistema de selección."
  citation: "art. 114.8 RDL 6/2023"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-22
- id: m01-l13-q157
  prompt:
    es: "Según el artículo 22.3 del Real Decreto 364/1995, de 10 de marzo, ¿en qué caso el número de aprobados en las pruebas selectivas puede ser superior al de plazas convocadas?"
  options:
  - id: a
    text:
      es: "Cuando el proceso selectivo comprende, además de las pruebas, un período de prácticas"
  - id: b
    text:
      es: "Cuando el tribunal lo acuerda por empate de puntuación en la última plaza"
  - id: c
    text:
      es: "Cuando las plazas convocadas están reservadas a personas con discapacidad"
  - id: d
    correct: true
    text:
      es: "Cuando el proceso selectivo comprende, además de las pruebas, un curso selectivo"
  explanation:
    es: "El artículo 22.3 dice que el proceso selectivo puede comprender un curso selectivo o un período de prácticas y que «sólo en el primer caso el número de aprobados en las pruebas selectivas podrá ser superior al de plazas convocadas». El período de prácticas, por tanto, no lo permite. El artículo no da esa facultad al tribunal en caso de empate ni la vincula a las plazas reservadas a personas con discapacidad."
  citation: "art. 22.3 RD 364/1995"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1995-8729-art-24
- id: m01-l13-q158
  prompt:
    es: "Según el artículo 24.1 del Real Decreto 364/1995, de 10 de marzo, si la convocatoria establece un período de prácticas o un curso selectivo, nombra funcionarios en prácticas a los aspirantes propuestos:"
  options:
  - id: a
    text:
      es: "El tribunal o la comisión permanente de selección"
  - id: b
    correct: true
    text:
      es: "La autoridad que haya efectuado la convocatoria"
  - id: c
    text:
      es: "El órgano responsable de la evaluación del curso selectivo"
  - id: d
    text:
      es: "El Delegado del Gobierno en la comunidad autónoma de destino"
  explanation:
    es: "El artículo 24.1 dice que, en ese caso, «la autoridad que la haya efectuado nombrará funcionarios en prácticas a los aspirantes propuestos». El tribunal o la comisión permanente de selección proponen a los aspirantes, no los nombran. El órgano responsable de la evaluación del curso selectivo solo propone la pérdida del derecho al nombramiento de quien no lo supera. El Delegado del Gobierno no interviene."
  citation: "art. 24.1 RD 364/1995"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-11719-art-61
- id: m01-l13-q159
  prompt:
    es: "Según el artículo 61.8 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los órganos de selección no podrán proponer más aprobados que plazas convocadas:"
  options:
  - id: a
    text:
      es: "Excepto cuando lo autorice el órgano convocante al terminar el proceso"
  - id: b
    text:
      es: "Excepto cuando haya empate de puntuación en la última plaza"
  - id: c
    text:
      es: "Excepto cuando los aspirantes superen el triple de las plazas"
  - id: d
    correct: true
    text:
      es: "Excepto cuando así lo prevea la propia convocatoria"
  explanation:
    es: "El primer párrafo del artículo 61.8 fija esa prohibición «excepto cuando así lo prevea la propia convocatoria». La excepción está en la convocatoria, no en una autorización posterior del órgano convocante. El artículo no hace excepción por empate en la última plaza ni por el número de aspirantes."
  citation: "art. 61.8 TREBEP"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-1995-8729-art-25
- id: m01-l13-q161
  prompt:
    es: "Según el artículo 25.1 del Real Decreto 364/1995, de 10 de marzo, ¿qué corresponde, concluido el proceso selectivo, a quien el artículo llama «Secretario de Estado para la Administración Pública», hoy titular de la Secretaría de Estado de Función Pública?"
  options:
  - id: a
    text:
      es: "Publicar en sus locales la relación de aprobados por orden de puntuación"
  - id: b
    correct: true
    text:
      es: "Nombrar funcionarios de carrera a los aspirantes que hayan superado el proceso"
  - id: c
    text:
      es: "Proponer al Ministro del Departamento de adscripción el nombramiento de los aprobados"
  - id: d
    text:
      es: "Elevar al Consejo de Ministros la propuesta de nombramiento de los aprobados"
  explanation:
    es: "El artículo 25.1 dice que los aspirantes que superen el proceso selectivo «serán nombrados funcionarios de carrera por el Secretario de Estado para la Administración Pública», cuyo órgano es hoy la Secretaría de Estado de Función Pública. La publicación de la relación de aprobados en los locales de la última prueba corresponde a los tribunales o comisiones permanentes de selección (artículo 22.1). El Secretario de Estado no propone el nombramiento al Ministro ni lo eleva al Consejo de Ministros: nombra él."
  citation: "art. 25.1 RD 364/1995"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1995-8729-art-25
- id: m01-l13-q162
  prompt:
    es: "Según el artículo 25.1 del Reglamento General de Ingreso del Personal al servicio de la Administración General del Estado, aprobado por el Real Decreto 364/1995, la resolución que nombre funcionarios de carrera a más aspirantes que plazas convocadas:"
  options:
  - id: a
    text:
      es: "Será anulable a instancia de parte"
  - id: b
    text:
      es: "Será válida si se amplían las plazas"
  - id: c
    correct: true
    text:
      es: "Será nula de pleno derecho en todo caso"
  - id: d
    text:
      es: "Será válida, pero los excedentes quedarán sin destino"
  explanation:
    es: "El artículo 25.1 dice que el número de nombrados «no podrá exceder en ningún caso al de plazas convocadas» y que «cualquier resolución que contravenga lo anteriormente establecido será nula de pleno derecho». No es un acto anulable a instancia de parte. Tampoco se convalida ampliando después las plazas ni queda válida dejando sin destino a los excedentes."
  citation: "art. 25.1 RD 364/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8729-art-25
- id: m01-l13-q163
  prompt:
    es: "¿Dónde deben publicarse los nombramientos de funcionarios de carrera según el Reglamento General de Ingreso del Personal al servicio de la Administración General del Estado, aprobado por el Real Decreto 364/1995?"
  options:
  - id: a
    correct: true
    text:
      es: "En el «Boletín Oficial del Estado»"
  - id: b
    text:
      es: "En el tablón del departamento de adscripción del cuerpo"
  - id: c
    text:
      es: "En el boletín oficial de la provincia del primer destino"
  - id: d
    text:
      es: "Solo en la notificación personal a cada aspirante nombrado"
  explanation:
    es: "El artículo 25.2 dice: «Los nombramientos deberán publicarse en el \"Boletín Oficial del Estado\"». El tablón del departamento y el boletín de la provincia del destino no son el medio que fija el reglamento. Una notificación personal no sustituye la publicación en el diario oficial."
  citation: "art. 25.2 RD 364/1995"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2023-23537-art-22
- id: m01-l13-q164
  prompt:
    es: "¿Cuál de las siguientes describe la Secretaría de Estado de Función Pública según el Real Decreto 829/2023, de 20 de noviembre, por el que se reestructuran los departamentos ministeriales?"
  options:
  - id: a
    text:
      es: "Un órgano superior del Ministerio de Hacienda, junto a la Secretaría de Estado de Presupuestos y Gastos"
  - id: b
    correct: true
    text:
      es: "Un órgano superior del Ministerio para la Transformación Digital y de la Función Pública"
  - id: c
    text:
      es: "Un órgano directivo de la Subsecretaría para la Transformación Digital y de la Función Pública"
  - id: d
    text:
      es: "Un órgano superior del Ministerio de la Presidencia, Justicia y Relaciones con las Cortes"
  explanation:
    es: "El artículo 22.3 del Real Decreto 829/2023 dice que el Ministerio para la Transformación Digital y de la Función Pública se estructura en tres órganos superiores, y la letra c) es «la Secretaría de Estado de Función Pública». No está en el Ministerio de Hacienda ni en el de la Presidencia, Justicia y Relaciones con las Cortes. Tampoco es un órgano directivo dependiente de la Subsecretaría: es un órgano superior del ministerio."
  citation: "art. 22.3.c) RD 829/2023"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-2015-11719-df-cuarta
- id: m01-l13-q165
  prompt:
    es: "Según la disposición final cuarta.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, hasta que se dicten las leyes de Función Pública y sus normas reglamentarias, las normas vigentes sobre gestión de recursos humanos:"
  options:
  - id: a
    correct: true
    text:
      es: "Se mantienen en vigor en cada Administración en tanto no se opongan al Estatuto"
  - id: b
    text:
      es: "Quedan derogadas en todas las Administraciones desde la entrada en vigor del Estatuto"
  - id: c
    text:
      es: "Se mantienen solo en la Administración General del Estado"
  - id: d
    text:
      es: "Se mantienen en vigor durante un plazo máximo de dos años"
  explanation:
    es: "La disposición final cuarta.2 dice: «Hasta que se dicten las leyes de Función Pública y las normas reglamentarias de desarrollo se mantendrán en vigor en cada Administración Pública las normas vigentes sobre ordenación, planificación y gestión de recursos humanos en tanto no se opongan a lo establecido en este Estatuto». No quedan derogadas en bloque. Se mantienen en cada Administración Pública, no solo en la del Estado, y con el límite de no oponerse al Estatuto. La disposición no fija un plazo de dos años."
  citation: "disposición final cuarta.2 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2023-25758-dd-unica
- id: m01-l13-q167
  prompt:
    es: "Según su disposición derogatoria única, el Real Decreto-ley 6/2023, de 19 de diciembre, deroga, junto a la ley que menciona expresamente:"
  options:
  - id: a
    text:
      es: "Todas las normas reglamentarias anteriores sobre selección de personal funcionario"
  - id: b
    text:
      es: "El Reglamento General de Ingreso aprobado por el Real Decreto 364/1995, en su integridad"
  - id: c
    correct: true
    text:
      es: "Todas las normas de igual o inferior rango en lo que contradigan o se opongan a él"
  - id: d
    text:
      es: "Solo las normas de rango legal que contradigan o se opongan a él"
  explanation:
    es: "La disposición derogatoria única del Real Decreto-ley 6/2023 deroga una ley que nombra «así como todas las normas de igual o inferior rango en lo que contradigan o se opongan a lo dispuesto en el presente real decreto-ley». No deroga en bloque los reglamentos anteriores de selección ni el Real Decreto 364/1995 en su integridad, y no se limita a las normas con rango de ley."
  citation: "disposición derogatoria única RDL 6/2023"
  difficulty: 3
  tags:
  - "efecto"
