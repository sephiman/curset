m09-case-b-q05:
  key:
    anchor: pg-transaction-iso#XACT-SERIALIZABLE
    sentence: This monitoring does not introduce any blocking beyond that present in repeatable read
  wrong:
  - option: Its predicate locks block other transactions and can cause deadlocks
    anchor: pg-transaction-iso#XACT-SERIALIZABLE
    sentence: In PostgreSQL these locks do not cause any blocking and therefore can not play any part in causing a deadlock.
  - option: It needs no retries, because conflicts are resolved by waiting
    anchor: pg-transaction-iso#XACT-SERIALIZABLE
    sentence: applications using this level must be prepared to retry transactions due to serialization failures
  - option: It enforces serializability by locking every row the transaction reads
    anchor: pg-transaction-iso#XACT-SERIALIZABLE
    sentence: To guarantee true serializability PostgreSQL uses predicate locking
