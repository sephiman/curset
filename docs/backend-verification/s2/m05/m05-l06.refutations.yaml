m05-l06-q01:
  key:
    anchor: spring-security-servlet-architecture#servlet-securityfilterchain
    sentence: Only the first SecurityFilterChain that matches is invoked.
  wrong:
  - option: Every matching one, in the order they were declared
    anchor: spring-security-servlet-architecture#servlet-securityfilterchain
    sentence: If a URL of /api/messages/ is requested, it first matches on the SecurityFilterChain0 pattern of /api/**, so only SecurityFilterChain0 is invoked, even though it also matches on SecurityFilterChainn.
  - option: None of them, because the Servlet container selects the chain by URL alone
    anchor: spring-security-servlet-architecture#servlet-securityfilterchain
    sentence: However, FilterChainProxy can determine invocation based upon anything in the HttpServletRequest by using the RequestMatcher interface.
  - option: All of them, merged into one list of security filters
    anchor: spring-security-servlet-architecture#servlet-securityfilterchain
    sentence: In fact, a SecurityFilterChain might have zero security Filter instances if the application wants Spring Security to ignore certain requests.
m05-l06-q02:
  key:
    anchor: spring-security-servlet-architecture#servlet-securityfilterchain
    sentence: The Security Filters in SecurityFilterChain are typically Beans, but they are registered with FilterChainProxy instead of DelegatingFilterProxy.
  wrong:
  - option: Directly with the Servlet container, one registration per security filter
    anchor: spring-security-servlet-architecture#servlet-securityfilterchain
    sentence: FilterChainProxy provides a number of advantages to registering directly with the Servlet container or DelegatingFilterProxy.
    exclusive: true
  - option: With `DelegatingFilterProxy`, which holds one proxy per security filter
    anchor: spring-security-servlet-architecture#servlet-securityfilterchain
    sentence: FilterChainProxy provides a number of advantages to registering directly with the Servlet container or DelegatingFilterProxy.
    exclusive: true
  - option: With no registration, because `HttpSecurity` invokes the filters directly
    anchor: spring-security-servlet-architecture#servlet-security-filters
    sentence: The Security Filters are inserted into the FilterChainProxy with the SecurityFilterChain API.
m05-l06-q03:
  key:
    anchor: spring-security-servlet-authentication-architecture#servlet-authentication-providermanager
    sentence: By default, ProviderManager tries to clear any sensitive credentials information from the Authentication object that is returned by a successful authentication request.
  wrong:
  - option: '`ProviderManager` keeps the password so that it can be stored in the `HttpSession`'
    anchor: spring-security-servlet-authentication-architecture#servlet-authentication-providermanager
    sentence: This prevents information, such as passwords, being retained longer than necessary in the HttpSession.
  - option: '`ProviderManager` leaves any `UserDetails` object held in a user cache untouched'
    anchor: spring-security-servlet-authentication-architecture#servlet-authentication-providermanager
    sentence: If the Authentication contains a reference to an object in the cache (such as a UserDetails instance) and this has its credentials removed, it is no longer possible to authenticate against the cached value.
  - option: '`ProviderManager` sets the returned `Authentication` on the `SecurityContextHolder` itself'
    anchor: spring-security-servlet-authentication-architecture#servlet-authentication-authenticationmanager
    sentence: The Authentication that is returned is then set on the SecurityContextHolder by the controller (that is, by Spring Security’s Filters instances) that invoked the AuthenticationManager.
