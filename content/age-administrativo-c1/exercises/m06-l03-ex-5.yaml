# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m06-l03-q145
  prompt:
    es: "En Windows 11, cuando se usa Windows Search para buscar en la web o para obtener sugerencias de búsqueda, ¿con qué tecnología se obtienen los resultados?"
  options:
  - id: a
    text:
      es: "Con la tecnología de SharePoint"
  - id: b
    text:
      es: "Con la tecnología de OneDrive"
  - id: c
    text:
      es: "Con la tecnología de Outlook"
  - id: d
    correct: true
    text:
      es: "Con la tecnología de Bing"
  explanation:
    es: "La página dice que, si se usa Windows Search para buscar en la web o para obtener sugerencias de búsqueda, los resultados se obtienen con la tecnología de Bing. OneDrive, Outlook y SharePoint son servicios cuyos elementos Windows Search puede mostrar desde la cuenta personal o la profesional, pero no son el motor de la búsqueda web."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «Búsqueda y privacidad de Windows»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m06-l03-q146
  prompt:
    es: "En Windows 11, para conectar Windows Search con una cuenta de Microsoft o una cuenta profesional, ¿en cuál de las siguientes secciones de Configuración se agrega la cuenta?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuentas usadas por otras aplicaciones"
  - id: b
    text:
      es: "Cuentas conectadas"
  - id: c
    text:
      es: "Opciones de inicio de sesión"
  - id: d
    text:
      es: "Encontrar mis archivos"
  explanation:
    es: "La página indica que, para conectar Windows Search con las cuentas, en «Cuentas usadas por otras aplicaciones» se elige «Agregar una cuenta de Microsoft» o «Agregar una cuenta profesional o educativa». «Cuentas conectadas» es donde se ve, desde Opciones del panel de búsqueda, qué cuentas están conectadas. «Opciones de inicio de sesión» son las formas de iniciar sesión. «Encontrar mis archivos» elige el modo de indexación."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «Búsqueda de contenido en la nube»"
