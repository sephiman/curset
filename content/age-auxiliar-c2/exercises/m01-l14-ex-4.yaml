# anchor: boe-a-2015-11719-art-98
- id: m01-l14-q196
  prompt:
    es: "De acuerdo con el artículo 98.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la sanción por faltas muy graves o graves solo puede imponerse:"
  options:
  - id: a
    text:
      es: "Mediante procedimiento sumario con audiencia al interesado."
  - id: b
    correct: true
    text:
      es: "Mediante el procedimiento previamente establecido."
  - id: c
    text:
      es: "Mediante resolución motivada del órgano que ordenó la incoación."
  - id: d
    text:
      es: "Mediante el procedimiento que acuerde en cada caso el Instructor."
  explanation:
    es: "El artículo 98.1 dice que no podrá imponerse sanción por faltas muy graves o graves «sino mediante el procedimiento previamente establecido». El procedimiento sumario con audiencia al interesado es el de las faltas leves. Una resolución motivada del órgano que ordenó la incoación, sin más, se salta ese procedimiento. El Instructor tampoco elige el procedimiento: viene fijado de antemano."
  citation: "art. 98.1 TREBEP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-11719-art-98
- id: m01-l14-q197
  prompt:
    es: "Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cómo se lleva a cabo la imposición de sanciones por faltas leves?"
  options:
  - id: a
    text:
      es: "Por procedimiento ordinario, con las mismas fases que en las faltas graves."
  - id: b
    text:
      es: "Por procedimiento sumario, sin trámite de audiencia al interesado."
  - id: c
    text:
      es: "Por decisión directa del superior jerárquico, sin procedimiento alguno."
  - id: d
    correct: true
    text:
      es: "Por procedimiento sumario con audiencia al interesado."
  explanation:
    es: "El artículo 98.1 dispone que «la imposición de sanciones por faltas leves se llevará a cabo por procedimiento sumario con audiencia al interesado». El procedimiento previamente establecido, con todas sus fases, lo exige para las faltas muy graves o graves. El procedimiento sumario sin audiencia suprime la garantía que el artículo pide. La decisión directa del superior jerárquico, sin procedimiento, contradice el mismo texto."
  citation: "art. 98.1 TREBEP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1986-1216-art-29
- id: m01-l14-q200
  prompt:
    es: "Según el artículo 29.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, es competente para ordenar la incoación del expediente disciplinario, en todo caso:"
  options:
  - id: a
    correct: true
    text:
      es: "El Subsecretario del Departamento en que esté destinado el funcionario."
  - id: b
    text:
      es: "El Ministro del Departamento en que esté destinado el funcionario."
  - id: c
    text:
      es: "El Secretario de Estado del que dependa el puesto del funcionario."
  - id: d
    text:
      es: "El Jefe del centro o dependencia donde preste servicio el funcionario."
  explanation:
    es: "El artículo 29.1 atribuye la incoación «en todo caso» al «Subsecretario del Departamento en que esté destinado el funcionario». Ni el Ministro ni el Secretario de Estado figuran en ese artículo. El Jefe del centro o dependencia solo puede proponer la incoación (artículo 29.2); no la ordena."
  citation: "art. 29.1 RD 33/1986"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1986-1216-art-29
- id: m01-l14-q201
  prompt:
    es: "Según el artículo 29.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, además del Subsecretario, pueden acordar la incoación del expediente disciplinario:"
  options:
  - id: a
    text:
      es: "Los Subdirectores generales, respecto del personal de su Subdirección General."
  - id: b
    correct: true
    text:
      es: "Los Directores generales, respecto del personal dependiente de su Dirección General."
  - id: c
    text:
      es: "Los Secretarios generales técnicos, respecto de todo el personal del Departamento."
  - id: d
    text:
      es: "Los Jefes de Servicio, respecto de los funcionarios que tengan a su cargo."
  explanation:
    es: "El artículo 29.1 permite acordar la incoación a «los Directores generales respecto del personal dependiente de su Dirección General», y también a los Delegados del Gobierno en su ámbito territorial. Los Subdirectores generales, los Secretarios generales técnicos y los Jefes de Servicio no aparecen en el artículo."
  citation: "art. 29.1 RD 33/1986"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1986-1216-art-29
- id: m01-l14-q202
  prompt:
    es: "En la Administración del Estado, ¿respecto de qué funcionarios pueden los Delegados del Gobierno acordar la incoación de un expediente disciplinario?"
  options:
  - id: a
    text:
      es: "De cualquier funcionario del Estado, sea cual sea su destino."
  - id: b
    text:
      es: "Solo de los destinados en los servicios centrales de los Ministerios."
  - id: c
    correct: true
    text:
      es: "De los destinados en su correspondiente ámbito territorial."
  - id: d
    text:
      es: "Solo de los adscritos al Ministerio de Política Territorial y Memoria Democrática."
  explanation:
    es: "El artículo 29.1 del Real Decreto 33/1986 permite a los Delegados del Gobierno acordar la incoación «respecto de los funcionarios destinados en su correspondiente ámbito territorial». No alcanza a cualquier funcionario del Estado. Tampoco se limita a los servicios centrales, que quedan fuera de ese ámbito, ni a los funcionarios de un Ministerio concreto."
  citation: "art. 29.1 RD 33/1986"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-11719-dt-tercera
- id: m01-l14-q204
  prompt:
    es: "Según la disposición transitoria tercera.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el antiguo Grupo B de clasificación, existente a la entrada en vigor de la Ley 7/2007, se integra en:"
  options:
  - id: a
    text:
      es: "El Subgrupo A1."
  - id: b
    text:
      es: "El Subgrupo C1."
  - id: c
    correct: true
    text:
      es: "El Subgrupo A2."
  - id: d
    text:
      es: "El Subgrupo C2."
  explanation:
    es: "La disposición transitoria tercera.2 da las equivalencias: «Grupo A: Subgrupo A1. Grupo B: Subgrupo A2.», y sigue con el Grupo C en el C1 y el Grupo D en el C2. El Subgrupo A1 corresponde al antiguo Grupo A, el C1 al Grupo C y el C2 al Grupo D. Con esta tabla se lee hoy el «grupo» del artículo 30 del Real Decreto 33/1986 al elegir Instructor."
  citation: "disposición transitoria tercera.2 TREBEP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1986-1216-art-30
- id: m01-l14-q205
  prompt:
    es: "Según el artículo 30 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, cuando el Instructor designado depende de otro Departamento, se requiere:"
  options:
  - id: a
    correct: true
    text:
      es: "La previa autorización del Subsecretario de ese otro Departamento."
  - id: b
    text:
      es: "La previa autorización del Ministro de ese otro Departamento."
  - id: c
    text:
      es: "La conformidad expresa del funcionario designado como Instructor."
  - id: d
    text:
      es: "La comunicación posterior al Subsecretario del otro Departamento."
  explanation:
    es: "El artículo 30 RD 33/1986 dice que, si el Instructor depende de otro Departamento, «se requerirá la previa autorización del Subsecretario de éste». La autorización no la da el Ministro: el artículo nombra al Subsecretario. La comunicación posterior contradice «previa autorización». La conformidad del propio funcionario designado no es un requisito del artículo: el trámite que fija es la autorización del Subsecretario del Departamento del que depende."
  citation: "art. 30 RD 33/1986"
  difficulty: 2
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-1986-1216-art-30
- id: m01-l14-q206
  prompt:
    es: "Señale la respuesta correcta sobre el Secretario del expediente disciplinario, según el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado:"
  options:
  - id: a
    correct: true
    text:
      es: "Se nombra cuando la complejidad o trascendencia de los hechos lo exija, y debe ser funcionario."
  - id: b
    text:
      es: "Se nombra en todo expediente, y debe ser de igual o superior grupo que el inculpado."
  - id: c
    text:
      es: "Se nombra cuando lo solicite el inculpado, y puede ser personal laboral del Departamento."
  - id: d
    text:
      es: "Se nombra cuando la falta investigada sea muy grave, y puede ser personal laboral."
  explanation:
    es: "El artículo 30 manda nombrar Secretario «cuando la complejidad o trascendencia de los hechos a investigar así lo exija», y el Secretario «en todo caso deberá tener la condición de funcionario». No se nombra en todo expediente, ni a petición del inculpado, ni por ser muy grave la falta. El requisito de grupo es del Instructor, no del Secretario. El personal laboral queda excluido."
  citation: "art. 30 RD 33/1986"
  difficulty: 2
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-1986-1216-art-33
- id: m01-l14-q207
  prompt:
    es: "Según el artículo 33.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, iniciado el procedimiento, pueden adoptar las medidas provisionales que se estimen oportunas:"
  options:
  - id: a
    text:
      es: "El Instructor, de oficio o a petición del Secretario."
  - id: b
    correct: true
    text:
      es: "La autoridad que acordó la incoación del procedimiento."
  - id: c
    text:
      es: "El Secretario del expediente, a propuesta del Instructor."
  - id: d
    text:
      es: "El órgano competente para imponer la sanción definitiva."
  explanation:
    es: "El artículo 33.1 dice: «Iniciado el procedimiento, la Autoridad que acordó la incoación podrá adoptar las medidas provisionales que estime oportunas». El Instructor y el Secretario no tienen esa facultad. El órgano que impone la sanción solo entra al final, para resolver."
  citation: "art. 33.1 RD 33/1986"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1986-1216-art-33
- id: m01-l14-q208
  prompt:
    es: "Según el artículo 33.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿desde qué momento pueden adoptarse medidas provisionales en el expediente disciplinario?"
  options:
  - id: a
    correct: true
    text:
      es: "Una vez iniciado el procedimiento."
  - id: b
    text:
      es: "Solo una vez formulado el pliego de cargos."
  - id: c
    text:
      es: "Solo una vez contestado el pliego de cargos."
  - id: d
    text:
      es: "Solo una vez notificada la propuesta de resolución."
  explanation:
    es: "El artículo 33.1 empieza: «Iniciado el procedimiento, la Autoridad que acordó la incoación podrá adoptar las medidas provisionales». No hay que esperar al pliego de cargos, a su contestación ni a la propuesta de resolución."
  citation: "art. 33.1 RD 33/1986"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1986-1216-art-33
- id: m01-l14-q209
  prompt:
    es: "Las medidas provisionales que se adoptan en el procedimiento disciplinario de un funcionario de la Administración del Estado tienen por objeto:"
  options:
  - id: a
    text:
      es: "Anticipar la sanción que corresponde a la falta presuntamente cometida."
  - id: b
    text:
      es: "Resarcir a la Administración del daño causado por la presunta falta."
  - id: c
    text:
      es: "Sustituir a la sanción cuando la falta ya haya prescrito."
  - id: d
    correct: true
    text:
      es: "Asegurar la eficacia de la resolución que pudiera recaer."
  explanation:
    es: "El artículo 33.1 del Real Decreto 33/1986 las admite «para asegurar la eficacia de la resolución que pudiera recaer», y el artículo 98.3 del texto refundido dice lo mismo. No son una sanción anticipada ni una indemnización. Una falta prescrita no se puede sancionar, ni con medidas provisionales ni de ningún otro modo."
  citation: "art. 33.1 RD 33/1986"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-33
- id: m01-l14-q210
  prompt:
    es: "De acuerdo con el artículo 33.3 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, quedan prohibidas en el procedimiento disciplinario las medidas provisionales que:"
  options:
  - id: a
    text:
      es: "Supongan la suspensión provisional de funciones del inculpado."
  - id: b
    correct: true
    text:
      es: "Puedan causar perjuicios irreparables o impliquen violación de derechos amparados por las Leyes."
  - id: c
    text:
      es: "Se acuerden antes de que el Instructor formule el pliego de cargos."
  - id: d
    text:
      es: "Afecten a las retribuciones del inculpado mientras dure el expediente."
  explanation:
    es: "El artículo 33.3 dice: «No se podrán dictar medidas provisionales que puedan causar perjuicios irreparables o impliquen violación de derechos amparados por las Leyes». La suspensión provisional es una medida admitida (artículo 98.3 del texto refundido). Las medidas caben desde que se inicia el procedimiento, antes del pliego. La suspensión provisional, por su parte, reduce las retribuciones del suspenso."
  citation: "art. 33.3 RD 33/1986"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2015-11719-art-98
- id: m01-l14-q211
  prompt:
    es: "Según el artículo 98.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la suspensión provisional como medida cautelar en un expediente disciplinario podrá superar su duración máxima:"
  options:
  - id: a
    text:
      es: "En caso de paralización del procedimiento imputable a la Administración."
  - id: b
    text:
      es: "Cuando la falta investigada esté tipificada como muy grave."
  - id: c
    correct: true
    text:
      es: "En caso de paralización del procedimiento imputable al interesado."
  - id: d
    text:
      es: "Cuando el Instructor pida la ampliación del plazo por causas justificadas."
  explanation:
    es: "El artículo 98.3 limita la suspensión provisional a 6 meses, «salvo en caso de paralización del procedimiento imputable al interesado». Una paralización que causa la Administración no alarga el límite. La gravedad de la falta no cambia la duración máxima. La ampliación por causas justificadas es la del plazo del pliego de cargos (artículo 35.1 del Real Decreto 33/1986), no la de la suspensión."
  citation: "art. 98.3 TREBEP"
  difficulty: 1
  tags:
  - "excepción"
  - "plazo"
# anchor: boe-a-2015-11719-art-98
- id: m01-l14-q212
  prompt:
    es: "De acuerdo con el artículo 98.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el funcionario suspenso provisional tiene derecho a percibir durante la suspensión:"
  options:
  - id: a
    text:
      es: "Las retribuciones básicas y complementarias, sin las prestaciones familiares por hijo a cargo."
  - id: b
    correct: true
    text:
      es: "Las retribuciones básicas y, en su caso, las prestaciones familiares por hijo a cargo."
  - id: c
    text:
      es: "La mitad de las retribuciones básicas y, en su caso, las prestaciones familiares por hijo a cargo."
  - id: d
    text:
      es: "Solo las prestaciones familiares por hijo a cargo, sin retribución alguna."
  explanation:
    es: "El artículo 98.3 reconoce al suspenso provisional «las retribuciones básicas y, en su caso, las prestaciones familiares por hijo a cargo». No incluye las complementarias, y sí las prestaciones por hijo. Tampoco reduce las básicas a la mitad ni las suprime."
  citation: "art. 98.3 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
  - "cantidad"
# anchor: boe-a-1995-8730-art-21
- id: m01-l14-q213
  prompt:
    es: "Según el artículo 21.4 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, el suspenso provisional tiene derecho a percibir:"
  options:
  - id: a
    correct: true
    text:
      es: "El 75 por 100 de su sueldo, trienios y pagas extraordinarias, y toda la prestación económica por hijo a cargo."
  - id: b
    text:
      es: "El 50 por 100 de su sueldo, trienios y pagas extraordinarias, y la mitad de la prestación económica por hijo a cargo."
  - id: c
    text:
      es: "El 75 por 100 de sus retribuciones básicas y complementarias, sin la prestación económica por hijo a cargo."
  - id: d
    text:
      es: "Todo su sueldo y sus trienios, sin pagas extraordinarias ni prestación económica por hijo a cargo."
  explanation:
    es: "El artículo 21.4 da al suspenso provisional «el 75 por 100 de su sueldo, trienios y pagas extraordinarias, así como la totalidad de la prestación económica por hijo a cargo». El porcentaje no es el 50 por 100, no alcanza a las complementarias y la prestación por hijo se cobra entera. Tampoco se cobra el sueldo íntegro."
  citation: "art. 21.4 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
  - "cantidad"
# anchor: boe-a-1995-8730-art-21
- id: m01-l14-q215
  prompt:
    es: "Un suspenso provisional cobraba 1.400 euros de sueldo y 120 euros de trienios al mes. Según el artículo 21.4 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, ¿cuánto percibe por ambos conceptos?"
  options:
  - id: a
    text:
      es: "760 euros."
  - id: b
    text:
      es: "1.050 euros."
  - id: c
    correct: true
    text:
      es: "1.140 euros."
  - id: d
    text:
      es: "1.170 euros."
  explanation:
    es: "El artículo 21.4 le reconoce «el 75 por 100 de su sueldo, trienios y pagas extraordinarias». Sueldo y trienios suman 1.520 euros, y el 75 por 100 de 1.520 es 1.140 euros. La cifra de 1.050 euros aplica el 75 por 100 solo al sueldo y olvida los trienios. La de 1.170 euros suma los trienios enteros a ese 75 por 100 del sueldo. La de 760 euros aplica un 50 por 100."
  citation: "art. 21.4 RD 365/1995"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: boe-a-1986-1216-art-35
- id: m01-l14-q217
  prompt:
    es: "De acuerdo con el artículo 35.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, el Instructor formulará el pliego de cargos en un plazo:"
  options:
  - id: a
    text:
      es: "No superior a dos meses, contados a partir de la incoación del procedimiento."
  - id: b
    text:
      es: "No superior a tres meses, contados a partir de la incoación del procedimiento."
  - id: c
    text:
      es: "No superior a un mes, contado desde la primera declaración del inculpado."
  - id: d
    correct: true
    text:
      es: "No superior a un mes, contado a partir de la incoación del procedimiento."
  explanation:
    es: "El artículo 35.1 fija «un plazo no superior a un mes, contados a partir de la incoación del procedimiento». Dos o tres meses es más de lo que el artículo concede. El plazo corre desde la incoación, no desde la primera declaración del inculpado."
  citation: "art. 35.1 RD 33/1986"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1986-1216-art-35
- id: m01-l14-q219
  prompt:
    es: "Un expediente disciplinario se incoa el miércoles, 31 de marzo de 2027. Sin ampliación del plazo, el último día para que el Instructor formule el pliego de cargos es:"
  options:
  - id: a
    text:
      es: "El miércoles, 14 de abril de 2027."
  - id: b
    correct: true
    text:
      es: "El viernes, 30 de abril de 2027."
  - id: c
    text:
      es: "El lunes, 3 de mayo de 2027."
  - id: d
    text:
      es: "El lunes, 31 de mayo de 2027."
  explanation:
    es: "El artículo 35.1 da un mes desde la incoación. Un mes desde el 31 de marzo vence en abril, que no tiene día 31. Si en el mes de vencimiento no hay día equivalente, el plazo expira el último día del mes (artículo 30.4 de la Ley 39/2015): el viernes 30 de abril de 2027. El lunes 3 de mayo pasa el vencimiento a mayo, cuando la regla lo deja en el último día de abril. El 14 de abril son diez días hábiles y el 31 de mayo, dos meses."
  citation: "art. 35.1 RD 33/1986"
  difficulty: 3
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-1986-1216-art-36
- id: m01-l14-q220
  prompt:
    es: "Notificado el pliego de cargos, el funcionario inculpado de la Administración del Estado dispone para contestarlo de un plazo de:"
  options:
  - id: a
    correct: true
    text:
      es: "Diez días, en los que puede además solicitar la práctica de pruebas."
  - id: b
    text:
      es: "Quince días, en los que puede además solicitar la práctica de pruebas."
  - id: c
    text:
      es: "Diez días, sin que en ese trámite pueda solicitar pruebas."
  - id: d
    text:
      es: "Un mes, en el que puede además solicitar la práctica de pruebas."
  explanation:
    es: "El artículo 36 del Real Decreto 33/1986 concede «un plazo de diez días» para contestar el pliego, y añade que «en este trámite deberá solicitar, si lo estima conveniente, la práctica de las pruebas». Quince días y un mes no son el plazo de este trámite. La opción que impide pedir pruebas contradice el artículo."
  citation: "art. 36 RD 33/1986"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1986-1216-art-36
- id: m01-l14-q221
  prompt:
    es: "Según el artículo 36 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, el inculpado debe solicitar la práctica de las pruebas que crea necesarias para su defensa:"
  options:
  - id: a
    correct: true
    text:
      es: "En la contestación al pliego de cargos."
  - id: b
    text:
      es: "En las alegaciones a la propuesta de resolución."
  - id: c
    text:
      es: "En su primera declaración ante el Instructor."
  - id: d
    text:
      es: "En el trámite de vista del expediente completo."
  explanation:
    es: "El artículo 36, que regula la contestación al pliego, dice: «En este trámite deberá solicitar, si lo estima conveniente, la práctica de las pruebas». La vista del expediente y las alegaciones a la propuesta llegan cuando las pruebas ya se han practicado. La primera declaración ante el Instructor es anterior al pliego."
  citation: "art. 36 RD 33/1986"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1986-1216-art-36
- id: m01-l14-q222
  prompt:
    es: "El pliego de cargos se notifica al funcionario inculpado el viernes, 12 de febrero de 2027, sin festivos en esas fechas. ¿Hasta qué día puede contestarlo y solicitar la práctica de pruebas?"
  options:
  - id: a
    text:
      es: "Hasta el viernes, 12 de marzo de 2027."
  - id: b
    correct: true
    text:
      es: "Hasta el viernes, 26 de febrero de 2027."
  - id: c
    text:
      es: "Hasta el jueves, 25 de febrero de 2027."
  - id: d
    text:
      es: "Hasta el lunes, 22 de febrero de 2027."
  explanation:
    es: "El artículo 36 da diez días y no dice si son hábiles o naturales; por el artículo 30.2 de la Ley 39/2015 son hábiles, sin sábados, domingos ni festivos. El plazo empieza el día siguiente a la notificación (artículo 30.3), el sábado 13, pero el primer día hábil es el lunes 15 de febrero. Del lunes 15 al viernes 19 van cinco días y del lunes 22 al viernes 26, otros cinco: el décimo es el viernes 26 de febrero de 2027. El lunes 22 sale de contar días naturales. El jueves 25 cuenta como primero el propio día de la notificación. El 12 de marzo es un mes, que no es el plazo de este trámite."
