  citation: "anexo IV RD 462/2002"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-22
- id: m01-l14-q380
  prompt:
    es: "Conforme al artículo 22.1 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cómo se clasifican las retribuciones de los funcionarios de carrera?"
  options:
  - id: a
    text:
      es: "Se clasifican en retribuciones fijas y retribuciones variables, según su periodicidad."
  - id: b
    text:
      es: "Se clasifican en retribuciones personales y retribuciones de puesto, según su devengo."
  - id: c
    text:
      es: "Se clasifican en retribuciones salariales y retribuciones no salariales, según su naturaleza."
  - id: d
    correct: true
    text:
      es: "Se clasifican en retribuciones básicas y retribuciones complementarias."
  explanation:
    es: "El artículo 22.1 dice que las retribuciones de los funcionarios de carrera «se clasifican en básicas y complementarias». Fijas y variables, personales y de puesto, y salariales y no salariales son clasificaciones que el artículo no establece, y la distinción entre salariales y no salariales es propia del personal laboral."
  citation: "art. 22.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2023-16462-art-1
- id: m01-l14-q389
  prompt:
    es: "Conforme a la Orden HFP/793/2023, de 12 de julio, ¿qué importe le corresponde a Don Raúl por usar su automóvil propio en un recorrido total de 396 kilómetros?"
  options:
  - id: a
    correct: true
    text:
      es: "Una indemnización total de 102,96 euros."
  - id: b
    text:
      es: "Una indemnización total de 51,48 euros."
  - id: c
    text:
      es: "Una indemnización total de 41,98 euros."
  - id: d
    text:
      es: "Una indemnización total de 20,99 euros."
  explanation:
    es: "La indemnización por usar el automóvil particular en comisión es de 0,26 euros por kilómetro (art. 1 Orden HFP/793/2023): 396 × 0,26 = 102,96 euros. La cifra de 51,48 euros paga solo un trayecto. La de 41,98 euros aplica la tarifa de la motocicleta, 0,106 euros por kilómetro. La de 20,99 euros suma los dos errores."
  citation: "art. 1 Orden HFP/793/2023"
  difficulty: 1
  tags:
