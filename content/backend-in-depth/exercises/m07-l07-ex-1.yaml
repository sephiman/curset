# Generated by docs/backend-verification/s2/tools/build_quiz.py from m07-l07.questions.json.
type: quiz
variants:
- id: m07-l07-q01
  prompt:
    en: A team changes a proto3 field from `int32` to `int64` and later writes a value larger than `INT32_MAX`.
      What does a client that still reads the field as `int32` get?
  options:
  - id: a
    text:
      en: A parse failure for the whole message
  - id: b
    text:
      en: A value saturated at `INT32_MAX`
  - id: c
    correct: true
    text:
      en: A value whose high order bits were discarded
  - id: d
    text:
      en: A value converted to `sint32` through zigzag decoding
  explanation:
    en: A client that reads the value as an `int32` discards the high order bits of the number. The claim that the
      parse fails is wrong, because wire-compatible means the same data can be parsed both before and after the
      change. The claim that the value saturates is wrong, because a 64-bit number read as an `int32` is truncated
      to 32 bits, as if cast in C++. The claim that zigzag decoding applies is wrong, because `sint32` and `sint64`
      are not compatible with the other integer types such as `int32`.
  citation: protobuf-proto3#conditionally-safe-changes
- id: m07-l07-q02
  prompt:
    en: When should a team generally avoid wire-compatible changes in Protocol Buffers, because it cannot manage
      when the different range of values becomes safe to use?
  options:
  - id: a
    text:
      en: Whenever a client still runs the old schema
  - id: b
    text:
      en: Always, because compatible changes can never be made safely
  - id: c
    text:
      en: When the change widens `int32` to `int64`, because wider integers are never compatible
  - id: d
    correct: true
    text:
      en: When the schema is published outside of the organization
  explanation:
    en: If the schema is published outside of the organization, wire-compatible changes should generally not be
      made, as the deployment cannot be managed. The claim that any old client rules the change out is wrong, because
      a team may change `int32` to `int64` and keep writing only legal `int32` values until the new schema is deployed
      to all endpoints. The claim that compatible changes are never safe is wrong, because they can be made if the
      roll out to the system is managed carefully. The claim that widening is never compatible is wrong, because
      `int32`, `uint32`, `int64`, `uint64` and `bool` are all compatible.
  citation: protobuf-proto3#conditionally-safe-changes
- id: m07-l07-q03
  prompt:
    en: What does the Protocol Buffers best-practices guide say about changing the type of an existing field in
      a message that is already in use?
  options:
  - id: a
    correct: true
    text:
      en: Almost never change it, because it messes up deserialization
  - id: b
    text:
      en: Change it freely whenever the new schema can parse the old data
  - id: c
    text:
      en: Change it if the field also takes a new tag number that was used before
  - id: d
    text:
      en: Change it between `sint32` and `int32`, which are compatible
  explanation:
    en: The guide says to almost never change the type of a field, because it messes up deserialization, the same
      as re-using a tag number. The claim that parsing old data makes a change free is wrong, because changing a
      field's type can be difficult to roll out safely even when the new schema parses old data. The claim that
      a used tag number can be taken is wrong, because a tag number is never re-used, as it messes up deserialization.
      The claim that `sint32` and `int32` are compatible is wrong, because `sint32` and `sint64` are compatible
      only with each other and not with the other integer types.
  citation: protobuf-proto-best-practices#change-type
- id: m07-l07-q04
  prompt:
    en: In Spring Framework 7, a controller method is mapped with `@GetMapping(version = "1.2+")`. Which request
      versions does that mapping match?
  options:
  - id: a
    text:
      en: Only version 1.2
  - id: b
    text:
      en: Any version, but a more specific mapping supersedes it
  - id: c
    correct: true
    text:
      en: Version 1.2 and the supported versions above it
  - id: d
    text:
      en: Version 1.2 and every version below it
  explanation:
    en: A baseline version such as `"1.2+"` matches the given version and the supported versions above. The claim
      that only version 1.2 matches describes a fixed version, which matches the given version only. The claim that
      any version matches describes a mapping with no value, which matches any version but is superseded by a more
      specific version match. The claim that lower versions match is wrong, because in the example the `1.2+` method
      matches request version 1.3 as it matches 1.2 and above.
  citation: spring-fw-webmvc-controller-ann-requestmapping#mvc-ann-requestmapping-version
  extract:
    en: Baseline version ("1.2+") — matches the given and supported versions above
- id: m07-l07-q05
  prompt:
    en: In Spring Framework 7, a controller has methods mapped to no version, to `1.1`, to `1.2+` and to `1.5`.
      What happens to a request with version `1.6`?
  options:
  - id: a
    text:
      en: The `1.2+` method handles it, as the highest baseline mapping
  - id: b
    correct: true
    text:
      en: No mapping matches the request version
  - id: c
    text:
      en: The unversioned method handles it, as the fallback for every version
  - id: d
    text:
      en: A `404` response results, because no handler exists for the path
  explanation:
    en: A request with version 1.6 does not have a match among those mappings. The claim that the `1.2+` method
      handles it is wrong, because the unversioned and `1.2+` methods match but are superseded by the `1.5` method,
      which allows only a strict match. The claim that the unversioned method handles it is wrong, because an unversioned
      method gets the lowest priority and any alternative method with a version supersedes it. The claim that a
      `404` results is wrong, because a `NotAcceptableApiVersionException` results in a `400` response.
  citation: spring-fw-webmvc-controller-ann-requestmapping#mvc-ann-requestmapping-version
  extract:
    en: A request with version "1.6" does not have a match.
- id: m07-l07-q06
  prompt:
    en: In Spring Boot 4, how does a `RestClient` get an API versioning strategy so that it sends the version with
      each remote call?
  options:
  - id: a
    text:
      en: It is auto-configured from the server-side versioning of the same application
  - id: b
    correct: true
    text:
      en: It is configured with methods on `RestClient.Builder`
  - id: c
    text:
      en: It can send the version only as an HTTP header, never as a query parameter
  - id: d
    text:
      en: Only `WebClient` supports versioned calls, and `RestClient` does not
  explanation:
    en: API versioning is configured with methods on `WebClient.Builder` or `RestClient.Builder`. The claim that
      the client is auto-configured from the server side is wrong, because the server-side API versioning configuration
      is not taken into account to auto-configure the client. The claim that only a header works is wrong, because
      versioned calls commonly send an HTTP header, a query parameter or a URL path segment. The claim that `RestClient`
      has no support is wrong, because both `WebClient` and `RestClient` support making versioned remote HTTP calls.
  citation: spring-boot-io-rest-client#io.rest-client.apiversioning
- id: m07-l07-q07
  prompt:
    en: According to RFC 9413, which interpretation of the robustness principle is no longer considered best practice
      in all scenarios?
  options:
  - id: a
    correct: true
    text:
      en: Tolerating unexpected input and silently discarding it
  - id: b
    text:
      en: Following specifications precisely when sending to the network
  - id: c
    text:
      en: Recovering gracefully from software defects without aborting unrelated processing
  - id: d
    text:
      en: Being resilient to input that is intentionally crafted to cause unexpected consequences
  explanation:
    en: An interpretation that advocates tolerating unexpected inputs is no longer considered best practice in all
      scenarios. Following specifications precisely when sending is wrong, because implementations must follow specifications
      precisely when sending to the network. Graceful recovery from defects is wrong, because it is critical for
      software to gracefully recover from these issues without aborting unrelated processing. Resilience to crafted
      input is wrong, because networking software needs to be resilient to input that is intentionally crafted to
      cause unexpected consequences.
  citation: rfc9413#section-2
  extract:
    en: However, an interpretation that advocates for tolerating unexpected inputs is no longer considered best
      practice in all scenarios.
- id: m07-l07-q08
  prompt:
    en: According to RFC 9413, what happens over time when implementations of a protocol silently accept faulty
      input from their peers?
  options:
  - id: a
    correct: true
    text:
      en: Negative consequences to interoperability accumulate
  - id: b
    text:
      en: Flaws stay isolated in the implementation that tolerates them
  - id: c
    text:
      en: Implementations drop the logic that permitted the variations
  - id: d
    text:
      en: The cost of interoperability problems falls, because the effort is deferred
  explanation:
    en: Negative consequences to interoperability accumulate over time if implementations silently accept faulty
      input. The claim that flaws stay isolated is wrong, because a flaw can become entrenched as a de facto standard
      that other implementations must replicate. The claim that implementations drop that logic is wrong, because
      implementations progressively add logic to constrain how data is transmitted or to permit variations in what
      is received. The claim that the cost falls is wrong, because the deferral can amplify the ultimate cost of
      handling interoperability problems.
  citation: rfc9413#section-2
  extract:
    en: Time and experience show that negative consequences to interoperability accumulate over time if implementations
      silently accept faulty input.
- id: m07-l07-q09
  prompt:
    en: A provider wants to tell clients the point in time when an HTTP resource is expected to become unresponsive.
      Which response header field is defined for that?
  options:
  - id: a
    text:
      en: '`Deprecation`'
  - id: b
    text:
      en: '`Retry-After`'
  - id: c
    text:
      en: '`Link`'
  - id: d
    correct: true
    text:
      en: '`Sunset`'
  explanation:
    en: The `Sunset` header field communicates that a resource is expected to become unresponsive at a specific
      point in time. `Deprecation` is wrong, because it communicates that the resource will be or has been deprecated.
      `Retry-After` is wrong, because it indicates how long the user agent ought to wait before making a follow-up
      request. `Link` is wrong, because it serialises one or more links into HTTP headers.
  citation: rfc8594#section-3
  extract:
    en: The Sunset HTTP response header field allows a server to communicate the fact that a resource is expected
      to become unresponsive at a specific point in time.
- id: m07-l07-q11
  prompt:
    en: According to RFC 8594, which kind of value does the `Sunset` header field carry when a server announces
      that a resource will become unresponsive?
  options:
  - id: a
    text:
      en: A number of seconds until the resource becomes unresponsive
  - id: b
    correct: true
    text:
      en: An HTTP-date timestamp that SHOULD be in the future
  - id: c
    text:
      en: A list of dates, one for each affected resource
  - id: d
    text:
      en: A past date that tells clients the resource was already removed
  explanation:
    en: The `Sunset` value is an HTTP-date timestamp that SHOULD be a timestamp in the future. The claim that the
      value is a number of seconds is wrong, because the grammar is `Sunset = HTTP-date`. The claim that the value
      is a list of dates is wrong, because the `Sunset` header field contains a single timestamp. The claim that
      a past date means removal is wrong, because a timestamp in the past is safest read as the present time, meaning
      the resource is expected to become unavailable at any time.
  citation: rfc8594#section-3
  extract:
    en: The Sunset value is an HTTP-date timestamp, as defined in Section 7.1.1.1 of [RFC7231], and SHOULD be a
      timestamp in the future.
- id: m07-l07-q12
  prompt:
    en: In RFC 9745, what does a server communicate by using links with the `deprecation` link relation type?
  options:
  - id: a
    text:
      en: The date on which the resource becomes unresponsive
  - id: b
    text:
      en: A deprecation policy that must be machine-readable
  - id: c
    correct: true
    text:
      en: Where the client application developer can find more information about the deprecation
  - id: d
    text:
      en: A notice that can only be sent after the resource is already deprecated
  explanation:
    en: Links with the `deprecation` relation tell the client application developer where to find more information
      about the deprecation. The claim that the link carries the date is wrong, because the `Sunset` header field
      carries a single timestamp for the point in time when the resource is expected to become unresponsive. The
      claim that the policy must be machine-readable is wrong, because the policy may be human-readable documentation
      or a machine-readable description. The claim that the link only follows deprecation is wrong, because it can
      be sent before the actual deprecation to make a deprecation policy discoverable.
  citation: rfc9745#section-3
  extract:
    en: the server can use links with the deprecation link relation type to communicate to the client application
      developer where to find more information about deprecation of the context.
