# anchor: boe-a-2015-10566-art-67
- id: m01-l08-q044
  prompt:
    es: "De acuerdo con el artículo 67.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Subdirectores generales son nombrados, respetando los principios de igualdad, mérito y capacidad, y cesados por:"
  options:
  - id: a
    text:
      es: "Real Decreto del Consejo de Ministros, a propuesta del titular del Departamento."
  - id: b
    text:
      es: "El Director general del que dependan, previa autorización del Subsecretario."
  - id: c
    text:
      es: "El Subsecretario del Departamento en todo caso, cualquiera que sea su dependencia."
  - id: d
    correct: true
    text:
      es: "El Ministro, Secretario de Estado o Subsecretario del que dependan."
  explanation:
    es: "El artículo 67.2 dice que los Subdirectores generales son nombrados y cesados «por el Ministro, Secretario de Estado o Subsecretario del que dependan». El Real Decreto del Consejo de Ministros es para los órganos directivos de nivel superior (arts. 63.3, 65.3 y 66.2). El Director general no nombra Subdirectores. El Subsecretario solo nombra a los que dependen de la Subsecretaría (art. 63.1.l)."
  citation: "art. 67.2 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-67
- id: m01-l08-q045
  prompt:
    es: "Según el artículo 67.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué principios han de respetarse en el nombramiento de los Subdirectores generales?"
  options:
  - id: a
    correct: true
    text:
      es: "Los principios de igualdad, mérito y capacidad."
  - id: b
    text:
      es: "Los principios de publicidad, mérito y capacidad."
  - id: c
    text:
      es: "Los principios de igualdad, objetividad y libre concurrencia."
  - id: d
    text:
      es: "Los principios de mérito, capacidad y antigüedad en el servicio."
  explanation:
    es: "El artículo 67.2 dice que los Subdirectores generales serán nombrados «respetando los principios de igualdad, mérito y capacidad». La publicidad, la objetividad, la libre concurrencia y la antigüedad no están en ese artículo."
  citation: "art. 67.2 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-67
- id: m01-l08-q046
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿entre qué funcionarios de carrera han de efectuarse los nombramientos de Subdirectores generales?"
  options:
  - id: a
    text:
      es: "Entre los del Estado del Subgrupo A1, sin que quepa nombrar a funcionarios de otras Administraciones."
  - id: b
    correct: true
    text:
      es: "Entre los del Estado, o de otras Administraciones cuando lo prevean las normas, del Subgrupo A1."
  - id: c
    text:
      es: "Entre los del Estado pertenecientes a los Subgrupos A1 o A2, con cualquier antigüedad."
  - id: d
    text:
      es: "Entre los de cualquier Administración pertenecientes al grupo A, con diez años de antigüedad."
  explanation:
    es: "El artículo 67.2 manda nombrarlos «entre funcionarios de carrera del Estado, o de otras Administraciones, cuando así lo prevean las normas de aplicación, pertenecientes al Subgrupo A1». El Subgrupo A2 no basta y la ley no pide antigüedad. Los funcionarios de otras Administraciones pueden ser nombrados cuando las normas lo prevean."
  citation: "art. 67.2 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q047
  prompt:
    es: "Señale la respuesta INCORRECTA sobre los Subdirectores generales de la Administración General del Estado, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    correct: true
    text:
      es: "Tienen la condición de alto cargo, igual que los Directores generales."
  - id: b
    text:
      es: "Son órganos directivos de la organización central de la Administración General del Estado."
  - id: c
    text:
      es: "Se nombran entre funcionarios de carrera pertenecientes al Subgrupo A1."
  - id: d
    text:
      es: "Los cesa el Ministro, Secretario de Estado o Subsecretario del que dependan."
  explanation:
    es: "El artículo 55.6 da la condición de alto cargo a los órganos superiores y directivos «excepto los Subdirectores generales y asimilados», así que la afirmación de que «tienen la condición de alto cargo» es la incorrecta. Las otras tres son ciertas: los Subdirectores generales son órganos directivos (art. 55.3.b), se nombran entre funcionarios de carrera del Subgrupo A1 y los cesa el Ministro, Secretario de Estado o Subsecretario del que dependan (art. 67.2)."
  citation: "art. 55.6 LRJSP"
  difficulty: 2
  tags:
  - "excepción"
  - "órgano"
# anchor: boe-a-2015-10566-art-64
- id: m01-l08-q048
  prompt:
    es: "¿Cuál de los siguientes órganos directivos puede nombrarse, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, entre personas con experiencia en puestos de responsabilidad en la gestión privada?"
  options:
  - id: a
    correct: true
    text:
      es: "Los Secretarios generales de los Ministerios."
  - id: b
    text:
      es: "Los Subsecretarios de los Ministerios."
  - id: c
    text:
      es: "Los Secretarios generales técnicos de los Ministerios."
  - id: d
    text:
      es: "Los Subdirectores generales de los Ministerios."
  explanation:
    es: "El artículo 64.3 permite nombrar a los Secretarios generales «entre personas con cualificación y experiencia en el desempeño de puestos de responsabilidad en la gestión pública o privada». Los Subsecretarios, los Secretarios generales técnicos y los Subdirectores generales deben ser funcionarios de carrera del Subgrupo A1 (arts. 63.3, 65.3 y 67.2); en el caso de los Subsecretarios caben también quienes perdieron esa condición por jubilación."
  citation: "art. 64.3 LRJSP"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-69
- id: m01-l08-q049
  prompt:
    es: "Según el artículo 69.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las Delegaciones del Gobierno tienen su sede, sin perjuicio de lo que disponga el Estatuto de Autonomía:"
  options:
  - id: a
    text:
      es: "En la capital de la provincia más poblada de la Comunidad Autónoma, en todo caso."
  - id: b
    text:
      es: "En la localidad que determine el Presidente de la Comunidad Autónoma, oído el Consejo de Ministros."
  - id: c
    correct: true
    text:
      es: "En la localidad donde radique el Consejo de Gobierno de la Comunidad Autónoma, salvo que el Consejo de Ministros acuerde otra."
  - id: d
    text:
      es: "En la localidad donde radique la Asamblea Legislativa de la Comunidad Autónoma, salvo que el Ministro competente acuerde otra."
  explanation:
    es: "El artículo 69.2 sitúa la sede «en la localidad donde radique el Consejo de Gobierno de la Comunidad Autónoma, salvo que el Consejo de Ministros acuerde ubicarla en otra distinta». El criterio es el Consejo de Gobierno, no la Asamblea Legislativa ni la población, y quien puede cambiarla es el Consejo de Ministros, no un Ministro ni el Presidente autonómico."
  citation: "art. 69.2 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-69
- id: m01-l08-q050
  prompt:
    es: "Según el artículo 69.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué órgano existe en cada una de las provincias de las Comunidades Autónomas pluriprovinciales?"
  options:
  - id: a
    text:
      es: "Un Delegado provincial del Gobierno, bajo la dependencia del Ministerio del Interior."
  - id: b
    text:
      es: "Un Director Insular, bajo la dependencia jerárquica del Delegado del Gobierno."
  - id: c
    correct: true
    text:
      es: "Un Subdelegado del Gobierno, bajo la inmediata dependencia del Delegado del Gobierno."
  - id: d
    text:
      es: "Un Subdelegado del Gobierno, bajo la inmediata dependencia del Presidente del Gobierno."
  explanation:
    es: "El artículo 69.4 dice que en cada provincia de las Comunidades pluriprovinciales «existirá un Subdelegado del Gobierno, que estará bajo la inmediata dependencia del Delegado del Gobierno». Del Presidente del Gobierno depende orgánicamente el Delegado, no el Subdelegado (art. 72.3). La ley no crea Delegados provinciales. Los Directores Insulares existen en las islas que fije un reglamento (art. 70)."
  citation: "art. 69.4 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-72
- id: m01-l08-q051
  prompt:
    es: "De acuerdo con el artículo 72.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Delegados del Gobierno son órganos directivos con rango de Subsecretario que dependen:"
  options:
  - id: a
    text:
      es: "Orgánicamente del Ministerio competente por razón de la materia y funcionalmente del Presidente del Gobierno."
  - id: b
    text:
      es: "Orgánicamente del Ministerio del Interior y funcionalmente del Presidente del Gobierno."
  - id: c
    text:
      es: "Orgánica y funcionalmente del Presidente del Gobierno en todas las materias."
  - id: d
    correct: true
    text:
      es: "Orgánicamente del Presidente del Gobierno y funcionalmente del Ministerio competente por razón de la materia."
  explanation:
    es: "El artículo 72.3 dice que los Delegados del Gobierno «dependen orgánicamente del Presidente del Gobierno y funcionalmente del Ministerio competente por razón de la materia». Una opción invierte las dos dependencias. Otra pone el Ministerio del Interior, que solo aparece como dependencia funcional en seguridad ciudadana (art. 73.3). Otra suprime la dependencia funcional del Ministerio competente."
  citation: "art. 72.3 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-72
- id: m01-l08-q052
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los Delegados del Gobierno en las Comunidades Autónomas es correcta, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Son órganos superiores con rango de Secretario de Estado."
  - id: b
    text:
      es: "Son órganos directivos con rango de Director general."
  - id: c
    text:
      es: "Son órganos superiores con rango de Subsecretario."
  - id: d
    correct: true
    text:
      es: "Son órganos directivos con rango de Subsecretario."
  explanation:
    es: "El artículo 72.3 dice: «Los Delegados del Gobierno son órganos directivos con rango de Subsecretario». No son órganos superiores, que en la organización central son solo los Ministros y los Secretarios de Estado (art. 55.3). Su rango no es el de Secretario de Estado ni el de Director general."
  citation: "art. 72.3 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-72
- id: m01-l08-q053
  prompt:
    es: "Según el artículo 72.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿a quién representan los Delegados del Gobierno en el territorio de la respectiva Comunidad Autónoma?"
  options:
  - id: a
    text:
      es: "A la Comunidad Autónoma ante los órganos de la Administración General del Estado."
  - id: b
    correct: true
    text:
      es: "Al Gobierno de la Nación, sin perjuicio de la representación ordinaria del Estado a través de los Presidentes autonómicos."
  - id: c
    text:
      es: "Al Estado, cuya representación ordinaria en la Comunidad Autónoma les corresponde en exclusiva."
  - id: d
    text:
      es: "Al Rey y al Gobierno de la Nación, ostentando además la representación ordinaria del Estado ante los órganos de la Comunidad Autónoma."
  explanation:
    es: "El artículo 72.1 dice que los Delegados «representan al Gobierno de la Nación en el territorio de la respectiva Comunidad Autónoma, sin perjuicio de la representación ordinaria del Estado en las mismas a través de sus respectivos Presidentes». La representación ordinaria del Estado corresponde al Presidente autonómico, no al Delegado. El Delegado no representa al Rey ni a la Comunidad Autónoma."
  citation: "art. 72.1 LRJSP"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-72
- id: m01-l08-q054
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿cómo se nombra y se separa a los Delegados del Gobierno en las Comunidades Autónomas?"
  options:
  - id: a
    text:
      es: "Por orden del Ministro de Política Territorial y Memoria Democrática."
  - id: b
    correct: true
    text:
      es: "Por Real Decreto del Consejo de Ministros, a propuesta del Presidente del Gobierno."
  - id: c
    text:
      es: "Por Real Decreto del Consejo de Ministros, a propuesta del Ministro del Interior."
  - id: d
    text:
      es: "Por el Presidente del Gobierno, oído el Presidente de la Comunidad Autónoma."
  explanation:
    es: "El artículo 72.4 dice que los Delegados del Gobierno «serán nombrados y separados por Real Decreto del Consejo de Ministros, a propuesta del Presidente del Gobierno». La propuesta no es del Ministro del Interior. El Presidente del Gobierno propone, pero no nombra, y la ley no prevé oír al Presidente autonómico. No basta una orden ministerial."
  citation: "art. 72.4 LRJSP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-73
- id: m01-l08-q055
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿a quién corresponde la jefatura de las Fuerzas y Cuerpos de Seguridad del Estado en el territorio de la Comunidad Autónoma?"
  options:
  - id: a
    text:
      es: "Al Delegado del Gobierno, bajo la dependencia orgánica del Ministerio de Defensa."
  - id: b
    correct: true
    text:
      es: "Al Delegado del Gobierno, bajo la dependencia funcional del Ministerio del Interior."
  - id: c
    text:
      es: "Al Subdelegado del Gobierno de la provincia de la sede, bajo la dependencia del Delegado."
  - id: d
    text:
      es: "Al Presidente de la Comunidad Autónoma, en coordinación con el Ministerio del Interior."
  explanation:
    es: "El artículo 73.3 dice que la jefatura de las Fuerzas y Cuerpos de Seguridad del Estado «corresponderá al Delegado del Gobierno, quien ejercerá las competencias del Estado en esta materia bajo la dependencia funcional del Ministerio del Interior». El Subdelegado dirige esas fuerzas en su provincia (art. 75.b), no en toda la Comunidad. El Presidente autonómico no es órgano del Estado. La dependencia es funcional y del Ministerio del Interior, no orgánica de Defensa."
  citation: "art. 73.3 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2015-10566-art-73
- id: m01-l08-q056
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿quién resuelve las reclamaciones de responsabilidad patrimonial por actos de la Delegación del Gobierno en la Comunidad Autónoma?"
  options:
  - id: a
    correct: true
    text:
      es: "El titular del Ministerio competente por razón de la materia."
  - id: b
    text:
      es: "El Delegado del Gobierno, previo informe del Ministerio competente por razón de la materia."
  - id: c
    text:
      es: "El Consejo de Ministros, a propuesta del Delegado del Gobierno."
  - id: d
    text:
      es: "El Secretario General de la Delegación del Gobierno."
  explanation:
    es: "El artículo 73.1.d dice que estas reclamaciones «se tramitarán por el Ministerio competente por razón de la materia y se resolverán por el titular de dicho Departamento». La resolución con informe previo del Ministerio es la de los recursos contra actos de los órganos de la Delegación, no la de la responsabilidad patrimonial. El Consejo de Ministros y el Secretario General no aparecen en esta regla."
  citation: "art. 73.1.d LRJSP"
  difficulty: 3
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10566-art-74
- id: m01-l08-q057
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el nombramiento de los Subdelegados del Gobierno en las provincias es correcta, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Los nombra el Delegado del Gobierno, por concurso de méritos, entre funcionarios de carrera del Subgrupo A1."
  - id: b
    text:
      es: "Los nombra el Consejo de Ministros, a propuesta del Delegado del Gobierno, entre funcionarios del Subgrupo A1."
  - id: c
    text:
      es: "Los nombra el Delegado del Gobierno, por libre designación, entre personas con experiencia en la gestión pública o privada."
  - id: d
    correct: true
    text:
      es: "Los nombra el Delegado del Gobierno, por libre designación, entre funcionarios de carrera del Subgrupo A1."
  explanation:
    es: "El artículo 74 dice que el Subdelegado «será nombrado por aquél [el Delegado] mediante el procedimiento de libre designación entre funcionarios de carrera» de Cuerpos o Escalas del Subgrupo A1. El procedimiento no es el concurso. No lo nombra el Consejo de Ministros. La experiencia en la gestión pública o privada no sustituye la condición de funcionario."
  citation: "art. 74 LRJSP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2015-10566-art-71
- id: m01-l08-q058
  prompt:
    es: "Según el artículo 71.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los servicios territoriales de la Administración General del Estado no integrados en las Delegaciones del Gobierno dependen:"
  options:
  - id: a
    text:
      es: "Del Secretario General de la Delegación del Gobierno, como órgano de gestión de los servicios comunes."
  - id: b
    text:
      es: "De la Comisión territorial de asistencia al Delegado del Gobierno en la Comunidad Autónoma."
  - id: c
    correct: true
    text:
      es: "Del órgano central competente sobre el sector de actividad en el que operen."
  - id: d
    text:
      es: "Del Delegado o, en su caso, del Subdelegado del Gobierno, a través de la Secretaría General."
  explanation:
    es: "El artículo 71.3 dice que los servicios no integrados «dependerán del órgano central competente sobre el sector de actividad en el que aquéllos operen». La dependencia del Delegado o Subdelegado a través de la Secretaría General es la de los servicios integrados (art. 71.4). La Secretaría General gestiona los servicios comunes de la Delegación (art. 76.1). La Comisión territorial asiste al Delegado y no dirige servicios."
  citation: "art. 71.3 LRJSP"
  difficulty: 3
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-2014-3248-art-41
- id: m01-l08-q059
  prompt:
    es: "De acuerdo con el artículo 41.1 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, el Servicio Exterior del Estado actúa bajo la dependencia:"
  options:
  - id: a
    text:
      es: "Jerárquica del Cónsul General y orgánica y funcional de los respectivos Departamentos ministeriales."
  - id: b
    correct: true
    text:
      es: "Jerárquica del Embajador y orgánica y funcional de los respectivos Departamentos ministeriales."
  - id: c
    text:
      es: "Orgánica y funcional del Embajador y jerárquica de los respectivos Departamentos ministeriales."
  - id: d
    text:
      es: "Jerárquica, orgánica y funcional del Ministerio de Asuntos Exteriores, Unión Europea y Cooperación."
  explanation:
    es: "El artículo 41.1 dice que el Servicio Exterior actúa «bajo la dependencia jerárquica del Embajador y orgánica y funcional de los respectivos Departamentos ministeriales». Una opción invierte las dependencias. Otra concentra todo en un solo Ministerio. Otra cambia al Embajador por el Cónsul General."
  citation: "art. 41.1 Ley 2/2014"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2014-3248-art-42
- id: m01-l08-q060
  prompt:
    es: "Según el artículo 42.2 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, ¿qué carácter tienen las Representaciones Permanentes cuando España no es parte de la organización ante la que se acreditan?"
  options:
  - id: a
    correct: true
    text:
      es: "El carácter de Representaciones de Observación."
  - id: b
    text:
      es: "El carácter de Misiones Diplomáticas Especiales."
  - id: c
    text:
      es: "El carácter de Delegaciones ante la organización internacional."
  - id: d
    text:
      es: "El carácter de Oficinas Consulares honorarias."
  explanation:
    es: "El artículo 42.2 dice que las Representaciones Permanentes «tendrán el carácter de Representaciones de Observación cuando España no fuera parte de la organización ante la que se acreditan». Las Misiones Diplomáticas Especiales y las delegaciones son figuras temporales o puntuales distintas (art. 46). Las Oficinas Consulares honorarias ejercen funciones consulares (art. 48.1)."
  citation: "art. 42.2 Ley 2/2014"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2014-3248-art-42
- id: m01-l08-q061
  prompt:
    es: "Según la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, ¿ante quién representan con carácter permanente a España las Representaciones Permanentes?"
  options:
  - id: a
    text:
      es: "Ante uno o varios Estados con los que España tiene establecidas relaciones diplomáticas."
  - id: b
    text:
      es: "Ante los Estados miembros de la Unión Europea, en régimen de acreditación múltiple."
  - id: c
    text:
      es: "Ante una Conferencia de Estados convocada bajo los auspicios de una organización internacional."
  - id: d
    correct: true
    text:
      es: "Ante la Unión Europea o una Organización Internacional."
  explanation:
    es: "El artículo 42.2 dice: «Las Representaciones Permanentes representan con este carácter a España ante la Unión Europea o una Organización Internacional». La representación ante uno o varios Estados, con acreditación múltiple si son varios, es la de las Misiones Diplomáticas Permanentes (art. 42.1). La representación en una conferencia de Estados corresponde a las delegaciones (art. 46.2)."
  citation: "art. 42.2 Ley 2/2014"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2014-3248-art-42
- id: m01-l08-q062
  prompt:
    es: "Según el artículo 42.5 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, ¿cómo se realiza la creación y supresión de las Misiones Diplomáticas Permanentes y de las Representaciones Permanentes?"
  options:
  - id: a
    text:
      es: "Mediante acuerdo del Consejo de Política Exterior, a propuesta del Presidente del Gobierno."
  - id: b
    correct: true
    text:
      es: "Mediante real decreto del Consejo de Ministros, previo informe del Consejo Ejecutivo de Política Exterior."
  - id: c
    text:
      es: "Mediante orden del Ministro de Asuntos Exteriores, Unión Europea y Cooperación, del que dependen orgánicamente."
  - id: d
    text:
      es: "Mediante real decreto del Consejo de Ministros, previo informe de la Comisión de Asuntos Exteriores del Congreso."
  explanation:
    es: "El artículo 42.5 dice que se realiza «mediante real decreto del Consejo de Ministros», a iniciativa del Ministerio de Asuntos Exteriores (hoy, Asuntos Exteriores, Unión Europea y Cooperación), «previo informe del Consejo Ejecutivo de Política Exterior». No basta una orden ministerial. El informe no es de la Comisión de Asuntos Exteriores del Congreso, y el Consejo de Política Exterior no crea Misiones."
  citation: "art. 42.5 Ley 2/2014"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2014-3248-art-44
- id: m01-l08-q063
  prompt:
    es: "Según la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, ¿cómo son designados y cesados los Embajadores?"
  options:
  - id: a
    text:
      es: "Por el Rey, a propuesta del Presidente del Gobierno, oído el Consejo de Política Exterior."
  - id: b
    text:
      es: "Por real decreto del Presidente del Gobierno, previo informe de la Comisión de Asuntos Exteriores del Congreso."
  - id: c
    correct: true
    text:
      es: "Por real decreto acordado en Consejo de Ministros, a propuesta del Ministro de Asuntos Exteriores, Unión Europea y Cooperación."
  - id: d
    text:
      es: "Por Orden del Ministro de Asuntos Exteriores, Unión Europea y Cooperación, entre funcionarios de la Carrera Diplomática."
  explanation:
    es: "El artículo 44.4 dice que los Embajadores «serán designados y cesarán por real decreto acordado en Consejo de Ministros a propuesta del Ministro de Asuntos Exteriores y de Cooperación» (hoy, de Asuntos Exteriores, Unión Europea y Cooperación). La Orden ministerial es la forma de designar a los Encargados de Negocios con cartas de gabinete. El Rey acredita a los Jefes de Misión con cartas credenciales, pero no los designa (art. 44.1). La Comisión del Congreso solo recibe la comunicación de la designación (art. 44.7)."
  citation: "art. 44.4 Ley 2/2014"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2014-3248-art-47
- id: m01-l08-q064
  prompt:
    es: "Según el artículo 47.2 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, las Oficinas Consulares de Carrera y las agencias consulares dependen orgánica y funcionalmente:"
  options:
  - id: a
    text:
      es: "Del Consejo Ejecutivo de Política Exterior."
  - id: b
    text:
      es: "Del Ministerio del Interior, en lo relativo a la protección de los españoles."
  - id: c
    text:
      es: "Del Ministerio de la Presidencia, Justicia y Relaciones con las Cortes."
  - id: d
    correct: true
    text:
      es: "Del Ministerio de Asuntos Exteriores, Unión Europea y Cooperación."
  explanation:
    es: "El artículo 47.2 dice que se crean a iniciativa del Ministerio de Asuntos Exteriores y de Cooperación, «del que dependen orgánica y funcionalmente»; hoy es el Ministerio de Asuntos Exteriores, Unión Europea y Cooperación. El Consejo Ejecutivo de Política Exterior solo informa su creación. Ni el Ministerio del Interior ni el de la Presidencia aparecen en el artículo."
  citation: "art. 47.2 Ley 2/2014"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2014-3248-art-47
- id: m01-l08-q065
  prompt:
    es: "Según la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, ¿mediante qué instrumento se realiza la creación y supresión de las Oficinas Consulares de Carrera?"
  options:
  - id: a
    text:
      es: "Mediante real decreto del Consejo de Ministros, previo informe del Consejo de Política Exterior."
  - id: b
    text:
      es: "Mediante real decreto del Presidente del Gobierno, previo informe de la Comisión de Asuntos Exteriores del Congreso."
  - id: c
    correct: true
    text:
      es: "Mediante real decreto del Consejo de Ministros, previo informe del Consejo Ejecutivo de Política Exterior."
  - id: d
    text:
      es: "Mediante orden del Ministro de Asuntos Exteriores, Unión Europea y Cooperación, como las Oficinas Consulares honorarias."
  explanation:
    es: "El artículo 47.2 dice que la creación y supresión de las Oficinas Consulares de Carrera «se realizará mediante real decreto del Consejo de Ministros», «previo informe del Consejo Ejecutivo de Política Exterior». La orden ministerial sirve para las Oficinas Consulares honorarias (art. 48.1). El informe es del Consejo Ejecutivo de Política Exterior, no del Consejo de Política Exterior. El real decreto no es del Presidente del Gobierno."
  citation: "art. 47.2 Ley 2/2014"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-59
- id: m01-l08-q066
  prompt:
    es: "Según el artículo 59.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la creación, modificación y supresión de los órganos de nivel inferior a Subdirección General se realiza:"
  options:
  - id: a
    text:
      es: "Por Real Decreto del Consejo de Ministros, a iniciativa del Ministro respectivo y a propuesta del Ministro para la Transformación Digital y de la Función Pública."
  - id: b
    text:
      es: "Por Real Decreto del Presidente del Gobierno, a propuesta del Ministro respectivo."
  - id: c
    text:
      es: "A través de las relaciones de puestos de trabajo del Ministerio respectivo."
  - id: d
    correct: true
    text:
      es: "Por orden del Ministro respectivo, previa autorización del Ministro para la Transformación Digital y de la Función Pública."
  explanation:
    es: "El artículo 59.2 dice que estos órganos «se crean, modifican y suprimen por orden del Ministro respectivo, previa autorización del Ministro de Hacienda y Administraciones Públicas», hoy el Ministro para la Transformación Digital y de la Función Pública, competente en administración pública (art. 22.2 RD 829/2023). La opción del «Real Decreto del Consejo de Ministros» es la regla del artículo 59.1, que se aplica a «Las Subsecretarías, las Secretarías Generales, las Secretarías Generales Técnicas, las Direcciones Generales, las Subdirecciones Generales, y órganos similares a los anteriores», no a los órganos de nivel inferior. Otra usa el Real Decreto del Presidente del Gobierno, que según el artículo 57.3 fija «el número, la denominación y el ámbito de competencia respectivo de los Ministerios y las Secretarías de Estado», no crea órganos inferiores a Subdirección General. La de las «relaciones de puestos de trabajo» es la vía del artículo 59.3, reservada a «Las unidades que no tengan la consideración de órganos»."
  citation: "art. 59.2 LRJSP"
  difficulty: 1
  tags:
  - "procedimiento"
