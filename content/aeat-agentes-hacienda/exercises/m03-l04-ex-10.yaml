    es: "De acuerdo con el artículo 4.2 del Real Decreto 1619/2012, de 30 de noviembre, por el que se aprueba el Reglamento por el que se regulan las obligaciones de facturación, los empresarios o profesionales pueden expedir factura simplificada cuando su importe no exceda de 3.000 euros, IVA incluido, en los servicios prestados por:"
