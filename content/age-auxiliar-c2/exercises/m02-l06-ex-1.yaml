# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q001
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes métodos abreviados de teclado abre directamente la aplicación Configuración?"
  options:
  - id: a
    text:
      es: "Windows+A"
  - id: b
    text:
      es: "Windows+N"
  - id: c
    correct: true
    text:
      es: "Windows+I"
  - id: d
    text:
      es: "Windows+W"
  explanation:
    es: "La tabla de Microsoft asigna a Windows+I «Abrir configuración». Windows+A abre lo que esa misma tabla llama el Centro de actividades de Windows 11, Windows+N abre el centro de notificaciones y el calendario, y Windows+W abre los widgets."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q003
  prompt:
    es: "En la aplicación Configuración de Windows 11, ¿qué hace la tecla Retroceso cuando se navega por ella con el teclado?"
  options:
  - id: a
    text:
      es: "Avanza a través de las regiones de la página actual."
  - id: b
    text:
      es: "Retrocede por las regiones de la página actual."
  - id: c
    text:
      es: "Selecciona el elemento que tiene el foco en ese momento."
  - id: d
    correct: true
    text:
      es: "Navega hacia atrás dentro de la aplicación Configuración."
  explanation:
    es: "En la tabla de la aplicación Configuración, Retroceso sirve para «Navegar hacia atrás». Avanzar por las regiones corresponde a Tab, retroceder por ellas a Mayús+Tab, y seleccionar el elemento con el foco a Entrar o Barra espaciadora."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de la configuración»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-version-html
- id: m02-l06-q006
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes acciones permite ver los detalles de la versión del dispositivo, según la documentación de Microsoft?"
  options:
  - id: a
    text:
      es: "Pulsar Windows+U y entrar en la sección Accesibilidad."
  - id: b
    text:
      es: "Pulsar Windows+N y abrir el centro de notificaciones."
  - id: c
    correct: true
    text:
      es: "Escribir winver en la barra de búsqueda y presionar Entrar."
  - id: d
    text:
      es: "Pulsar Windows+Tab y abrir la Vista de tareas."
  explanation:
    es: "La página dice que se puede escribir «winver» en la barra de búsqueda y presionar Entrar para ver los detalles de la versión del dispositivo. Windows+U abre Configuración en Accesibilidad, Windows+N el centro de notificaciones y Windows+Tab la Vista de tareas; ninguno muestra la versión."
  citation: "fuente: `ms-win-version.html`; «Uso de la búsqueda de palabras clave»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-version-html
- id: m02-l06-q007
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes herramientas se abre al escribir msinfo32 en la barra de búsqueda y presionar Entrar?"
  options:
  - id: a
    text:
      es: "Editor del Registro"
  - id: b
    correct: true
    text:
      es: "Información del sistema"
  - id: c
    text:
      es: "Visor de eventos"
  - id: d
    text:
      es: "Administrador de tareas"
  explanation:
    es: "La página dice que «msinfo» o «msinfo32» abre Información del sistema. El Editor del Registro, el Visor de eventos y el Administrador de tareas son otras herramientas de Windows que ese comando no abre."
  citation: "fuente: `ms-win-version.html`; «Uso de la búsqueda de palabras clave»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-version-html
- id: m02-l06-q008
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes comandos, escrito en PowerShell o en el símbolo del sistema, muestra la información detallada sobre la licencia?"
  options:
  - id: a
    text:
      es: "winver"
  - id: b
    correct: true
    text:
      es: "slmgr /dlv"
  - id: c
    text:
      es: "msinfo32"
  - id: d
    text:
      es: "systeminfo"
  explanation:
    es: "La página dice que «el comando /dlv muestra la información detallada sobre la licencia» al escribir slmgr /dlv. winver y msinfo32 muestran los detalles de la versión e Información del sistema, y systeminfo, filtrado con findstr, da el nombre y la versión del sistema operativo."
  citation: "fuente: `ms-win-version.html`; «Usar un símbolo del sistema o PowerShell»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q160
  prompt:
    es: "En Windows 11, ¿qué método abreviado de teclado cambia a la pantalla de seguridad, desde la que se puede cerrar sesión o cambiar de usuario?"
  options:
  - id: a
    text:
      es: "Alt+Esc"
  - id: b
    text:
      es: "Windows+L"
  - id: c
    text:
      es: "Ctrl+Mayús+Esc"
  - id: d
    correct: true
    text:
      es: "Ctrl+Alt+Supr"
  explanation:
    es: "Ctrl+Alt+Supr cambia a la pantalla de seguridad. Ctrl+Mayús+Esc abre directamente el Administrador de tareas, sin pasar por esa pantalla; Windows+L bloquea el equipo; Alt+Esc recorre las ventanas en el orden en que se abrieron."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de Windows en general y para escritorio»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q161
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes acciones se puede hacer desde la pantalla de seguridad a la que se llega con Ctrl+Alt+Supr?"
  options:
  - id: a
    text:
      es: "Abrir el panel de widgets"
  - id: b
    text:
      es: "Abrir el cuadro de diálogo Ejecutar"
  - id: c
    correct: true
    text:
      es: "Cambiar una contraseña de la cuenta"
  - id: d
    text:
      es: "Capturar solo la ventana activa"
  explanation:
    es: "La pantalla de seguridad permite bloquear el escritorio, cambiar de usuario, cerrar sesión, cambiar una contraseña y abrir el Administrador de tareas. El cuadro Ejecutar lo abre Windows+R, la captura de la ventana activa es Alt+Impr Pant y el panel de widgets se abre con Windows+W."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de Windows en general y para escritorio»"
  difficulty: 2
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-win-pantalla-bloqueo-html
- id: m02-l06-q180
  prompt:
    es: "En Windows 11, en la configuración de la pantalla de bloqueo, ¿qué muestra la opción Contenido destacado de Windows?"
  options:
  - id: a
    text:
      es: "Una presentación con las imágenes de una carpeta del dispositivo"
  - id: b
    text:
      es: "Los widgets con el tiempo y otra información en tiempo real"
  - id: c
    text:
      es: "Una única imagen elegida entre las predeterminadas o buscada en el dispositivo"
  - id: d
    correct: true
    text:
      es: "Un conjunto giratorio de imágenes de Microsoft, junto con sugerencias, trucos y notificaciones"
  explanation:
    es: "Contenido destacado de Windows muestra un conjunto giratorio de imágenes de Microsoft con sugerencias, trucos y notificaciones. Una sola imagen es la opción Imagen, la presentación de una carpeta del dispositivo es Presentación de diapositivas, y los widgets de la pantalla de bloqueo son una sección aparte."
  citation: "fuente: `ms-win-pantalla-bloqueo.html`; «Personalizar la imagen de fondo»"
  difficulty: 1
  tags:
  - "configuración"
  - "concepto"
# anchor: fuente-ms-win-pantalla-bloqueo-html
- id: m02-l06-q181
  prompt:
    es: "¿En qué ruta de Configuración de Windows 11 se elige entre Contenido destacado de Windows, Imagen y Presentación de diapositivas?"
  options:
  - id: a
    text:
      es: "Personalización › Temas › Configuración del icono de escritorio"
  - id: b
    text:
      es: "Sistema › Multitarea › Escritorios"
  - id: c
    text:
      es: "Personalización › Colores › Elegir el modo"
  - id: d
    correct: true
    text:
      es: "Personalización › Pantalla de bloqueo"
  explanation:
    es: "Las tres opciones están en Personalización › Pantalla de bloqueo. Temas es donde se abre la Configuración del icono de escritorio, Colores reúne el modo de color y los efectos de transparencia, y Multitarea contiene los escritorios y Ajustar ventanas."
  citation: "fuente: `ms-win-pantalla-bloqueo.html`; «Personalizar la imagen de fondo»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-pantalla-bloqueo-html
- id: m02-l06-q182
  prompt:
    es: "En la pantalla de bloqueo de Windows 11, ¿cuál de las siguientes opciones utiliza una presentación de imágenes de una carpeta del dispositivo?"
  options:
  - id: a
    text:
      es: "Widgets de la pantalla de bloqueo"
  - id: b
    correct: true
    text:
      es: "Presentación de diapositivas"
  - id: c
    text:
      es: "Contenido destacado de Windows"
  - id: d
    text:
      es: "Imagen"
  explanation:
    es: "Presentación de diapositivas usa las imágenes de una carpeta del dispositivo, y se pueden añadir varias carpetas. Contenido destacado de Windows rota imágenes de Microsoft, Imagen es una sola imagen fija, y los widgets muestran información como el tiempo, no un fondo."
  citation: "fuente: `ms-win-pantalla-bloqueo.html`; «Personalizar la imagen de fondo»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-pantalla-bloqueo-html
- id: m02-l06-q183
  prompt:
    es: "En Windows 11, ¿qué requiere la pantalla de bloqueo, como capa de seguridad, para dar acceso al escritorio?"
  options:
  - id: a
    text:
      es: "Una clave de seguridad de red y la dirección MAC del equipo"
  - id: b
    text:
      es: "Solo la contraseña de la cuenta de Microsoft, nunca un PIN"
  - id: c
    text:
      es: "Un código QR escaneado con la cámara del dispositivo"
  - id: d
    correct: true
    text:
      es: "Un gesto biométrico, un PIN o una contraseña"
  explanation:
    es: "La pantalla de bloqueo pide un gesto biométrico, un PIN o una contraseña. El código QR sirve en la página de Wi-Fi para conectarse a una red, la clave de seguridad de red es la contraseña de una red inalámbrica, y el PIN sí es una de las formas admitidas."
  citation: "fuente: `ms-win-pantalla-bloqueo.html`; «Resumen»"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: fuente-ms-win-info-dispositivo-html
- id: m02-l06-q184
  prompt:
    es: "En Windows 11, en Configuración › Sistema › Acerca de, ¿qué dato aparece justo debajo del nombre del dispositivo?"
  options:
  - id: a
    correct: true
    text:
      es: "El nombre del modelo del dispositivo"
  - id: b
    text:
      es: "El tipo de procesador que tiene el equipo"
  - id: c
    text:
      es: "La cantidad de memoria RAM instalada en el equipo"
  - id: d
    text:
      es: "La edición de Windows que tiene instalada el equipo"
  explanation:
    es: "La página sitúa el nombre del modelo justo debajo del nombre del dispositivo. La edición de Windows está en Especificaciones de Windows, y la RAM instalada y el tipo de procesador en Especificaciones del dispositivo."
  citation: "fuente: `ms-win-info-dispositivo.html`; «¿Cuál es el nombre y el modelo de mi dispositivo?»"
  difficulty: 1
  tags:
  - "ofimática-menú"
  - "concepto"
# anchor: fuente-ms-win-info-dispositivo-html
- id: m02-l06-q185
  prompt:
    es: "En la página Acerca de de Windows 11, ¿en qué sección se comprueba la edición y la versión de Windows que utiliza el dispositivo?"
  options:
  - id: a
    text:
      es: "Configuración avanzada de almacenamiento"
  - id: b
    correct: true
    text:
      es: "Especificaciones de Windows"
  - id: c
    text:
      es: "Nombre y modelo del dispositivo"
  - id: d
    text:
      es: "Especificaciones del dispositivo"
  explanation:
    es: "La edición y la versión se comprueban en Especificaciones de Windows. Especificaciones del dispositivo recoge procesador, RAM y si Windows es de 32 o 64 bits; el almacenamiento está en otra página de Configuración, y el nombre y el modelo van arriba, junto al nombre del equipo."
  citation: "fuente: `ms-win-info-dispositivo.html`; «¿Qué versión de Windows tengo?»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-info-dispositivo-html
- id: m02-l06-q186
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes datos figura en la sección Especificaciones del dispositivo de la página Acerca de, además del procesador?"
  options:
  - id: a
    text:
      es: "El almacenamiento disponible en cada unidad"
  - id: b
    text:
      es: "El nombre del modelo del dispositivo"
  - id: c
    text:
      es: "La edición de Windows junto a la versión"
  - id: d
    correct: true
    text:
      es: "Si Windows es de 32 o de 64 bits"
  explanation:
    es: "Especificaciones del dispositivo incluye el tipo de procesador, la RAM instalada y si Windows es de 32 o de 64 bits. La edición y la versión están en Especificaciones de Windows, el modelo se muestra bajo el nombre del dispositivo, y el almacenamiento se consulta en la página Almacenamiento."
  citation: "fuente: `ms-win-info-dispositivo.html`; «¿Cuáles son las especificaciones de mi dispositivo?»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-enlace-movil-html
- id: m02-l06-q187
  prompt:
    es: "Según Microsoft, ¿qué condición de red deben cumplir un teléfono Android y un PC con Windows 11 para usar Enlace Móvil?"
  options:
  - id: a
    correct: true
    text:
      es: "Los dos deben estar conectados a la misma red Wi-Fi"
  - id: b
    text:
      es: "El PC debe estar conectado por Ethernet y el teléfono por datos móviles"
  - id: c
    text:
      es: "El teléfono debe estar conectado al PC mediante un cable USB"
  - id: d
    text:
      es: "El teléfono debe compartir su conexión con el PC como zona con cobertura inalámbrica móvil"
  explanation:
    es: "Con Android, el teléfono y el PC deben estar conectados a la misma red Wi-Fi. El cable USB no interviene, Ethernet en el PC y datos móviles en el teléfono son redes distintas, y compartir la conexión del teléfono no es el requisito que da la página."
  citation: "fuente: `ms-win-enlace-movil.html`; «Requisitos del sistema»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-win-enlace-movil-html
- id: m02-l06-q190
  prompt:
    es: "Según la pestaña «iOS» de la página de Microsoft, ¿cómo se inicia el emparejamiento de un iPhone con Enlace Móvil en un PC con Windows 11?"
  options:
  - id: a
    correct: true
    text:
      es: "Por Bluetooth, escaneando con la cámara del iPhone el código QR que muestra el PC"
  - id: b
    text:
      es: "Por la misma red Wi-Fi, sin Bluetooth, tras instalar Enlace a Windows en el iPhone"
  - id: c
    text:
      es: "Con un cable USB entre el iPhone y el PC, sin ningún código QR"
  - id: d
    text:
      es: "Con un código que se escribe en el PC desde una aplicación de la App Store que es obligatoria"
  explanation:
    es: "Con iPhone, se escanea con su cámara el código QR del PC y eso inicia el emparejamiento por Bluetooth. La exigencia de la misma red Wi-Fi es la de Android; el vínculo se inicia con el código QR y no por cable; y descargar Enlace a Windows de la App Store es posible pero no obligatorio."
  citation: "fuente: `ms-win-enlace-movil.html`; «iOS»"
  difficulty: 3
  tags:
  - "requisito"
  - "comportamiento"
# anchor: fuente-ms-win-wifi-html
- id: m02-l06-q191
  prompt:
    es: "En Windows 11, en la configuración rápida de Wi-Fi, ¿qué opción se selecciona para elegir la red a la que conectarse?"
  options:
  - id: a
    text:
      es: "Administrar redes conocidas"
  - id: b
    correct: true
    text:
      es: "Administrar conexiones Wi-Fi"
  - id: c
    text:
      es: "Direcciones de hardware aleatorias"
  - id: d
    text:
      es: "Actualizar lista de redes"
  explanation:
    es: "En la configuración rápida, Administrar conexiones Wi-Fi lleva a la lista de redes, donde se elige una y se selecciona Conectar. Administrar redes conocidas está en Configuración › Red & Internet › Wi-Fi, Actualizar lista de redes inicia un nuevo examen, y las direcciones de hardware aleatorias son un interruptor de privacidad."
  citation: "fuente: `ms-win-wifi.html`; «Conectarse a una red wifi»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-wifi-html
- id: m02-l06-q192
  prompt:
    es: "En Windows 11, si no aparece la red Wi-Fi esperada, ¿cuál de los siguientes botones inicia manualmente un nuevo examen de redes?"
  options:
  - id: a
    correct: true
    text:
      es: "Actualizar lista de redes, abajo a la derecha"
  - id: b
    text:
      es: "Siguiente, que se selecciona tras escribir la contraseña de red"
  - id: c
    text:
      es: "Mostrar, junto a la contraseña de una red guardada"
  - id: d
    text:
      es: "Conectar, que se selecciona tras elegir la red de la lista"
  explanation:
    es: "Actualizar lista de redes, abajo a la derecha, inicia manualmente un nuevo examen. Conectar se usa tras elegir la red, Siguiente tras escribir la contraseña de red, y Mostrar enseña la contraseña de una red guardada."
  citation: "fuente: `ms-win-wifi.html`; «Conectarse a una red wifi»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-wifi-html
- id: m02-l06-q193
  prompt:
    es: "En Windows 11, ¿cómo se consulta la contraseña de una red Wi-Fi guardada desde la página Administrar redes conocidas?"
  options:
  - id: a
    correct: true
    text:
      es: "Seleccionando la red y, después, Mostrar junto a la contraseña de la red Wi-Fi"
  - id: b
    text:
      es: "Escribiendo winver en la barra de búsqueda y pulsando Entrar para abrir la ventana de versión"
  - id: c
    text:
      es: "Seleccionando la red y activando Direcciones de hardware aleatorias"
  - id: d
    text:
      es: "Seleccionando la red y, después, Conectar para que Windows escriba la clave en pantalla"
  explanation:
    es: "En Administrar redes conocidas se selecciona una red y después Mostrar, junto a la contraseña. Conectar se usa para conectarse, no para ver la clave; las direcciones de hardware aleatorias son otra opción de la misma página, y winver abre la ventana con la versión de Windows."
  citation: "fuente: `ms-win-wifi.html`; «Encontrar la contraseña de la red Wi-Fi en Windows»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-wifi-html
- id: m02-l06-q194
  prompt:
    es: "En un dispositivo con Windows 11 que tiene cámara, ¿cómo se conecta rápidamente a una red Wi-Fi sin escribir a mano los datos de la red?"
  options:
  - id: a
    text:
      es: "Activando Direcciones de hardware aleatorias para que el dispositivo se conecte solo a la red más cercana"
  - id: b
    correct: true
    text:
      es: "Escaneando con la aplicación Cámara, en modo de código de barras, el código QR de la red"
  - id: c
    text:
      es: "Escaneando el código QR con la aplicación Enlace Móvil del equipo en lugar de con la aplicación Cámara"
  - id: d
    text:
      es: "Seleccionando el icono Desconectado, que conecta de inmediato con la última red usada por el equipo"
  explanation:
    es: "La aplicación Cámara, en modo de código de barras, escanea el código QR que contiene los datos de la red y abre Configuración para confirmar. El icono Desconectado solo indica que no hay conexión, las direcciones aleatorias protegen la privacidad, y Enlace Móvil conecta teléfonos con el PC, no sirve para unirse a una red Wi-Fi."
  citation: "fuente: `ms-win-wifi.html`; «Conectarse a una red Wi-Fi con un código QR»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-configuracion-red-html
- id: m02-l06-q195
  prompt:
    es: "Según Microsoft, ¿cuál de las siguientes opciones recoge lo que administra la sección Red e Internet de la aplicación Configuración de Windows 11?"
  options:
  - id: a
    text:
      es: "Solo Wi-Fi y Ethernet, sin zonas con cobertura inalámbrica ni conexiones de acceso telefónico"
  - id: b
    text:
      es: "Wi-Fi, Ethernet y zonas con cobertura inalámbrica móvil, pero no el modo avión"
  - id: c
    text:
      es: "Solo el modo avión y las zonas con cobertura inalámbrica móvil"
  - id: d
    correct: true
    text:
      es: "Wi-Fi, Ethernet, zonas con cobertura inalámbrica móvil, modo avión y acceso telefónico"
  explanation:
    es: "La sección administra la conectividad: Wi-Fi, Ethernet, zonas con cobertura inalámbrica móvil y modo avión, e incluye las conexiones de acceso telefónico. Cada una de las otras listas deja fuera algo que la página nombra: el acceso telefónico, el modo avión, o Wi-Fi y Ethernet."
  citation: "fuente: `ms-win-configuracion-red.html`; «Red e Internet»"
  difficulty: 2
  tags:
  - "concepto"
  - "configuración"
# anchor: fuente-ms-office-autoguardado-html
- id: m02-l06-q197
  prompt:
    es: "Según Microsoft, ¿en cuál de las siguientes aplicaciones está disponible Autoguardado para los suscriptores de Microsoft 365?"
  options:
  - id: a
    correct: true
    text:
      es: "Excel, Word y PowerPoint"
  - id: b
    text:
      es: "Excel, PowerPoint y OneNote"
  - id: c
    text:
      es: "Word, PowerPoint y Outlook"
  - id: d
    text:
      es: "Excel, Word y Access"
  explanation:
    es: "Autoguardado está disponible en Excel, Word y PowerPoint para suscriptores de Microsoft 365. Las otras tres combinaciones cambian una aplicación de esa lista por Access, Outlook u OneNote, y la página cita solo Excel, Word y PowerPoint."
