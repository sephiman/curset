# anchor: boe-a-2017-12902-art-158
- id: m03-l04-q117
  prompt:
    es: "En un procedimiento abierto con varios criterios, las proposiciones se abren en un solo acto el jueves 15 de octubre de 2026; el pliego no fija plazo y no hay ofertas anormalmente bajas. Computado de fecha a fecha, ¿hasta qué día puede adjudicarse?"
  options:
  - id: a
    text:
      es: "Hasta el viernes 30 de octubre de 2026."
  - id: b
    text:
      es: "Hasta el lunes 14 de diciembre de 2026."
  - id: c
    correct: true
    text:
      es: "Hasta el martes 15 de diciembre de 2026."
  - id: d
    text:
      es: "Hasta el viernes 15 de enero de 2027."
  explanation:
    es: "Con varios criterios, el plazo máximo de adjudicación es de dos meses desde la apertura, salvo que el pliego fije otro (artículo 158.2). De fecha a fecha, dos meses desde el jueves 15 de octubre llevan al martes 15 de diciembre, que es hábil. El lunes 14 de diciembre sale de contar sesenta días en lugar de dos meses. El viernes 30 de octubre aplica los quince días del único criterio del precio. El viernes 15 de enero de 2027 cuenta tres meses."
  citation: "art. 158.2 LCSP"
  difficulty: 3
