# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q109
  prompt:
    es: "En el modelo SaaS de distribución de software, ¿quién es generalmente el tercero en cuyos servidores se alojan el software y sus datos?"
  options:
  - id: a
    text:
      es: "El cliente que usa el software."
  - id: b
    text:
      es: "El proveedor de acceso a Internet."
  - id: c
    text:
      es: "La autoridad de certificación del cliente."
  - id: d
    correct: true
    text:
      es: "El fabricante del propio software."
  explanation:
    es: "Según el glosario del INCIBE, en SaaS el software y sus datos se alojan en servidores de un tercero, «generalmente el fabricante del software». El cliente no es un tercero: accede vía Internet. El proveedor de acceso da acceso a las redes de telecomunicaciones, y la autoridad de certificación genera certificados digitales; ninguno de los dos es el tercero que nombra la definición."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «SaaS»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q110
  prompt:
    es: "¿Cuál de las siguientes afirmaciones describe la infraestructura de escritorio virtual (VDI), según la documentación de Microsoft Azure?"
  options:
  - id: a
    text:
      es: "Vincula cada escritorio al equipo físico del empleado, que solo puede trabajar desde ese equipo."
  - id: b
    correct: true
    text:
      es: "Permite acceder a escritorios virtuales hospedados en servidores centralizados desde casi cualquier dispositivo."
  - id: c
    text:
      es: "Permite acceder a escritorios hospedados en servidores centralizados, pero solo desde los equipos de la propia oficina."
  - id: d
    text:
      es: "Instala en cada dispositivo una copia local completa del sistema operativo, las aplicaciones y los datos."
  explanation:
    es: "Microsoft define la VDI como una infraestructura de TI que permite a los empleados acceder a escritorios virtuales hospedados en servidores centralizados desde casi cualquier dispositivo. La página la opone a los escritorios vinculados a máquinas físicas, no la limita a los equipos de la oficina y sitúa el sistema operativo y los datos en un almacenamiento central, no en cada dispositivo."
  citation: "fuente: `azure-vdi.html`; «¿Qué es Infraestructura de escritorio virtual (VDI)?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q111
  prompt:
    es: "En una infraestructura de escritorio virtual (VDI), ¿qué componente de software administra las máquinas virtuales y les asigna recursos como CPU, memoria y almacenamiento?"
  options:
  - id: a
    text:
      es: "El agente de conexión"
  - id: b
    text:
      es: "El dispositivo cliente"
  - id: c
    correct: true
    text:
      es: "El hipervisor"
  - id: d
    text:
      es: "La administración de perfiles de usuario"
  explanation:
    es: "La página dice que la virtualización se logra mediante un hipervisor, un componente de software que administra máquinas virtuales y asigna recursos como CPU, memoria y almacenamiento. El agente de conexión autentica a los usuarios y los dirige a su máquina virtual; el dispositivo cliente es el equipo en el que trabaja el empleado; los perfiles de usuario guardan su configuración y sus preferencias."
  citation: "fuente: `azure-vdi.html`; «Seis componentes clave de VDI»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q112
  prompt:
    es: "En una infraestructura de escritorio virtual (VDI), ¿qué componente autentica a los usuarios y los dirige a la máquina virtual correcta según sus permisos de acceso?"
  options:
  - id: a
    correct: true
    text:
      es: "El agente de conexión"
  - id: b
    text:
      es: "El hipervisor"
  - id: c
    text:
      es: "El dispositivo cliente"
  - id: d
    text:
      es: "La administración de perfiles de usuario"
  explanation:
    es: "El agente de conexión es la puerta de enlace entre el empleado y su escritorio virtual: autentica a los usuarios y los dirige a la máquina virtual correcta en función de sus permisos de acceso. El hipervisor asigna recursos a las máquinas virtuales, el dispositivo cliente es el equipo del empleado y los perfiles de usuario guardan configuración y preferencias."
  citation: "fuente: `azure-vdi.html`; «Seis componentes clave de VDI»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q113
  prompt:
    es: "Señale la afirmación correcta sobre el dispositivo cliente en el que trabaja el empleado dentro de una infraestructura de escritorio virtual (VDI):"
  options:
  - id: a
    text:
      es: "Necesita una potencia de procesamiento alta, pero no una conexión a Internet."
  - id: b
    text:
      es: "Debe ser un equipo de escritorio con gran potencia, y no un portátil, una tableta o un smartphone."
  - id: c
    text:
      es: "Guarda en local el sistema operativo, las aplicaciones y los datos del usuario."
  - id: d
    correct: true
    text:
      es: "No necesita una potencia de procesamiento significativa, pero sí una conexión a Internet."
  explanation:
    es: "La página dice que el dispositivo cliente puede ser un portátil, un equipo de escritorio, una tableta o un smartphone, y que no necesita una potencia de procesamiento significativa, pero sí una conexión a Internet. El sistema operativo, las aplicaciones y los datos de usuario están en el almacenamiento central, no en el dispositivo."
  citation: "fuente: `azure-vdi.html`; «Seis componentes clave de VDI»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q114
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las máquinas virtuales de una infraestructura de escritorio virtual (VDI) es correcta?"
  options:
  - id: a
    correct: true
    text:
      es: "Cada una es un entorno aislado, con su propio sistema operativo, aplicaciones y configuración."
  - id: b
    text:
      es: "Todas comparten un único sistema operativo, las mismas aplicaciones y la misma configuración."
  - id: c
    text:
      es: "Cada una necesita su propia máquina física, porque un servidor solo ejecuta un escritorio."
  - id: d
    text:
      es: "Se ejecutan en el dispositivo cliente del empleado y no en un servidor centralizado."
  explanation:
    es: "Según la página, cada máquina virtual es un entorno aislado que funciona como un escritorio, con su propio sistema operativo, aplicaciones y configuración. La virtualización permite que una sola máquina física ejecute varios escritorios virtuales, y estos se hospedan en servidores centralizados o en la nube, no en el dispositivo cliente."
  citation: "fuente: `azure-vdi.html`; «Seis componentes clave de VDI»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q115
  prompt:
    es: "En una infraestructura de escritorio virtual (VDI), ¿dónde se encuentra normalmente el almacenamiento central con los sistemas operativos, las aplicaciones y los datos de usuario?"
  options:
  - id: a
    text:
      es: "En el disco del dispositivo cliente de cada empleado."
  - id: b
    text:
      es: "En la memoria RAM del dispositivo cliente del empleado."
  - id: c
    correct: true
    text:
      es: "En un centro de datos o en la nube."
  - id: d
    text:
      es: "En una unidad externa conectada al dispositivo cliente."
  explanation:
    es: "La página dice que la VDI requiere un almacenamiento central con los sistemas operativos, las aplicaciones y los datos de usuario, que se encuentra normalmente en un centro de datos o en la nube. En la VDI los datos confidenciales no permanecen en los dispositivos locales, así que ni el disco, ni la RAM, ni una unidad conectada al dispositivo cliente son ese almacenamiento."
  citation: "fuente: `azure-vdi.html`; «Seis componentes clave de VDI»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q116
  prompt:
    es: "¿Cuál de las siguientes ventajas da la infraestructura de escritorio virtual (VDI) cuando los empleados trabajan con sus dispositivos personales (BYOD)?"
  options:
  - id: a
    text:
      es: "El dispositivo personal guarda una copia cifrada de los datos de la empresa."
  - id: b
    correct: true
    text:
      es: "No se almacena nada confidencial en el propio dispositivo del empleado."
  - id: c
    text:
      es: "Los datos confidenciales quedan en el dispositivo y no en la nube."
  - id: d
    text:
      es: "El empleado necesita un dispositivo personal de alto rendimiento."
  explanation:
    es: "En el caso BYOD, la página dice que, como los escritorios se ejecutan en la nube, no se almacena nada confidencial en el propio dispositivo del empleado. Por eso no hay copia de los datos en el dispositivo personal, ni cifrada ni sin cifrar. La página añade que con VDI se puede trabajar incluso con dispositivos más antiguos o de bajo consumo."
  citation: "fuente: `azure-vdi.html`; «Bring Your Own Device (BYOD)»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q117
  prompt:
    es: "¿Qué diferencia hay, según Microsoft, entre la infraestructura de escritorio virtual (VDI) y Windows Virtual Desktop Access (VDA)?"
  options:
  - id: a
    text:
      es: "VDI es un modelo de licencia para acceder a escritorios; VDA es la tecnología que los ofrece."
  - id: b
    text:
      es: "VDI y VDA son dos nombres de la misma tecnología que ofrece escritorios virtuales."
  - id: c
    correct: true
    text:
      es: "VDI es una tecnología que ofrece escritorios virtuales; VDA es un modelo de licencia para acceder a ellos."
  - id: d
    text:
      es: "VDA es el hipervisor que administra las máquinas virtuales de una VDI y les asigna CPU, memoria y almacenamiento."
  explanation:
    es: "La página dice que la VDI es una tecnología que ofrece escritorios virtuales desde servidores centralizados o la nube, y que VDA es un modelo de licencia que concede derechos para acceder a esos escritorios desde dispositivos no cubiertos por Software Assurance. Invertir los papeles o tratarlos como sinónimos es falso, y el componente que administra las máquinas virtuales es el hipervisor, no VDA."
  citation: "fuente: `azure-vdi.html`; «¿Qué es Infraestructura de escritorio virtual (VDI)?»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q118
  prompt:
    es: "¿Cuál de las siguientes posibilidades da la virtualización en la que se basa la infraestructura de escritorio virtual (VDI)?"
  options:
  - id: a
    correct: true
    text:
      es: "Que una sola máquina física ejecute varios escritorios virtuales."
  - id: b
    text:
      es: "Que un solo escritorio virtual se reparta entre varias máquinas físicas."
  - id: c
    text:
      es: "Que cada escritorio virtual se ejecute en el dispositivo cliente."
  - id: d
    text:
      es: "Que el dispositivo cliente funcione sin conexión a Internet."
  explanation:
    es: "La página dice que la VDI se basa en la virtualización, que permite que una sola máquina física ejecute varios escritorios virtuales. Los escritorios se hospedan en servidores centralizados o en la nube, no en el dispositivo cliente, y ese dispositivo necesita una conexión a Internet para acceder a ellos."
  citation: "fuente: `azure-vdi.html`; «La tecnología principal detrás de VDI»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q119
  prompt:
    es: "¿Cuál de los siguientes servicios cita Microsoft como ejemplo de infraestructura de escritorio virtual (VDI)?"
  options:
  - id: a
    text:
      es: "Azure Database for MySQL"
  - id: b
    correct: true
    text:
      es: "Azure Virtual Desktop"
  - id: c
    text:
      es: "Azure Kubernetes Service (AKS)"
  - id: d
    text:
      es: "Microsoft SQL Server"
  explanation:
    es: "La página da como ejemplo de VDI Azure Virtual Desktop, un servicio en la nube que ofrece experiencias de escritorio remoto y aplicaciones. Azure Database for MySQL es un servicio de base de datos relacional; Azure Kubernetes Service es un servicio administrado para implementar y escalar clústeres de Kubernetes; SQL Server es un sistema de administración de bases de datos relacionales."
  citation: "fuente: `azure-vdi.html`; «¿Qué es Infraestructura de escritorio virtual (VDI)?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q120
  prompt:
    es: "En una infraestructura de escritorio virtual (VDI), ¿qué guardan los perfiles de usuario, que se administran de forma centralizada?"
  options:
  - id: a
    text:
      es: "Los sistemas operativos de las máquinas virtuales."
  - id: b
    text:
      es: "Los recursos de CPU y memoria de cada máquina virtual."
  - id: c
    text:
      es: "Las aplicaciones instaladas en el dispositivo cliente."
  - id: d
    correct: true
    text:
      es: "La configuración y las preferencias de cada usuario del escritorio."
  explanation:
    es: "Según la página, los perfiles de usuario almacenan la configuración y las preferencias, y se administran de forma centralizada. Los sistemas operativos están en el almacenamiento central; la CPU y la memoria las asigna el hipervisor a cada máquina virtual; las aplicaciones forman parte de cada máquina virtual y del almacenamiento central, no del dispositivo cliente."
  citation: "fuente: `azure-vdi.html`; «Seis componentes clave de VDI»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q121
  prompt:
    es: "Con una infraestructura de escritorio virtual (VDI), ¿qué pueden hacer las empresas para los contratistas o los empleados estacionales?"
  options:
  - id: a
    text:
      es: "Entregarles un equipo físico ya configurado para cada contrato temporal y recogerlo al terminar."
  - id: b
    correct: true
    text:
      es: "Configurarles escritorios temporales sin enviarles hardware ni administrar máquinas locales."
  - id: c
    text:
      es: "Darles acceso al escritorio solo desde los equipos de la oficina central."
  - id: d
    text:
      es: "Instalarles en su dispositivo una copia local del escritorio de la empresa."
  explanation:
    es: "La página dice que con VDI las empresas pueden configurar escritorios temporales para contratistas o empleados estacionales sin necesidad de enviar hardware ni administrar máquinas locales. Entregar un equipo físico es lo que la VDI evita; el acceso es desde casi cualquier dispositivo y lugar, y el escritorio se ejecuta en servidores centralizados, no en una copia local."
  citation: "fuente: `azure-vdi.html`; «Trabajadores temporales o de contrato»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q122
  prompt:
    es: "¿Cuál de las siguientes ventajas da la infraestructura de escritorio virtual (VDI) a los equipos de TI que administran los escritorios?"
  options:
  - id: a
    text:
      es: "Instalar las actualizaciones en cada dispositivo cliente por separado, sin una consola común."
  - id: b
    text:
      es: "Delegar en cada empleado la seguridad, las actualizaciones y la configuración de su escritorio."
  - id: c
    text:
      es: "Actualizar cada escritorio solo cuando el empleado lleva su dispositivo a la oficina central."
  - id: d
    correct: true
    text:
      es: "Administrar actualizaciones, revisiones y directivas de todos los escritorios desde una sola ubicación."
  explanation:
    es: "La página dice que con VDI los equipos de TI pueden administrar actualizaciones, revisiones y directivas en todos los escritorios virtuales desde una sola ubicación. Instalar en cada dispositivo, delegar en cada empleado o esperar a que lleve el equipo a la oficina es lo contrario de esa administración centralizada."
  citation: "fuente: `azure-vdi.html`; «Simplifique la administración de escritorios.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-sql-server-html
- id: m06-l01-q123
  prompt:
    es: "¿Qué es Microsoft SQL Server, producto que puede instalarse en equipos que ejecutan Windows o Linux?"
  options:
  - id: a
    correct: true
    text:
      es: "Un sistema de administración de bases de datos relacionales (RDBMS)."
  - id: b
    text:
      es: "Un sistema operativo para servidores y equipos de escritorio."
  - id: c
    text:
      es: "Una infraestructura de escritorios virtuales en servidores."
  - id: d
    text:
      es: "Un sistema de archivos con permisos por listas de control de acceso."
  explanation:
    es: "Microsoft define SQL Server como un sistema de administración de bases de datos relacionales (RDBMS). Windows y Linux son los sistemas operativos en los que se instala, no lo que es. Los escritorios virtuales hospedados en servidores son la VDI, y el sistema de archivos con listas de control de acceso es NTFS."
  citation: "fuente: `ms-sql-server.html`; «¿Qué es SQL Server?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-sql-server-html
- id: m06-l01-q124
  prompt:
    es: "¿Mediante qué lenguaje se comunican las aplicaciones y las herramientas que se conectan a una instancia o base de datos de SQL Server?"
  options:
  - id: a
    text:
      es: "Mediante el lenguaje de marcado HTML."
  - id: b
    text:
      es: "Mediante el protocolo de correo SMTP."
  - id: c
    correct: true
    text:
      es: "Mediante Transact-SQL (T-SQL)."
  - id: d
    text:
      es: "Mediante el lenguaje JavaScript."
  explanation:
    es: "La página dice que las aplicaciones y herramientas se conectan a una instancia o base de datos de SQL Server y se comunican mediante Transact-SQL (T-SQL). HTML es un lenguaje de marcado de páginas web, SMTP es un protocolo de envío de correo y JavaScript es un lenguaje de scripts de las páginas web; ninguno es el lenguaje de SQL Server."
  citation: "fuente: `ms-sql-server.html`; «¿Qué es SQL Server?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-sql-server-html
- id: m06-l01-q125
  prompt:
    es: "¿Cuál de los siguientes componentes de SQL Server es el servicio principal para almacenar, procesar y proteger datos?"
  options:
  - id: a
    text:
      es: "Integration Services (SSIS)"
  - id: b
    text:
      es: "Reporting Services (SSRS)"
  - id: c
    text:
      es: "Replicación de SQL Server"
  - id: d
    correct: true
    text:
      es: "Motor de base de datos"
  explanation:
    es: "La página dice que el Motor de base de datos es el servicio principal para almacenar, procesar y proteger datos. Integration Services genera soluciones de integración de datos con procesamiento ETL; Reporting Services ofrece informes habilitados para web; la Replicación copia y distribuye datos entre bases de datos y las sincroniza."
  citation: "fuente: `ms-sql-server.html`; «Componentes y tecnologías de SQL Server»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-sql-server-html
- id: m06-l01-q126
  prompt:
    es: "¿Cuál de los siguientes componentes de SQL Server proporciona procesamiento de extracción, transformación y carga (ETL) para almacenamiento de datos?"
  options:
  - id: a
    text:
      es: "Motor de base de datos"
  - id: b
    correct: true
    text:
      es: "Integration Services (SSIS)"
  - id: c
    text:
      es: "Reporting Services (SSRS)"
  - id: d
    text:
      es: "Replicación de SQL Server"
  explanation:
    es: "Según la página, SQL Server Integration Services es una plataforma para generar soluciones de integración de datos, con paquetes que proporcionan procesamiento ETL para almacenamiento de datos. El Motor de base de datos almacena, procesa y protege datos; Reporting Services crea y publica informes; la Replicación copia y sincroniza datos entre bases de datos."
  citation: "fuente: `ms-sql-server.html`; «Componentes y tecnologías de SQL Server»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-sql-server-html
- id: m06-l01-q127
  prompt:
    es: "¿Qué hace SQL Server Replication, una de las tecnologías clave que la documentación de Microsoft describe en SQL Server?"
  options:
  - id: a
    text:
      es: "Extrae, transforma y carga datos para el almacenamiento de datos."
  - id: b
    text:
      es: "Crea informes a partir de diversos orígenes y los publica en la web."
  - id: c
    correct: true
    text:
      es: "Copia y distribuye datos entre bases de datos y las sincroniza."
  - id: d
    text:
      es: "Integra el aprendizaje automático con los lenguajes R y Python en la base de datos."
  explanation:
    es: "La página dice que SQL Server Replication es un conjunto de tecnologías para copiar y distribuir datos y objetos de una base de datos a otra y sincronizarlas para mantener la coherencia. La extracción, transformación y carga es Integration Services; los informes son Reporting Services; el aprendizaje automático con R y Python es Machine Learning Services."
  citation: "fuente: `ms-sql-server.html`; «Componentes y tecnologías de SQL Server»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-sql-server-html
- id: m06-l01-q128
  prompt:
    es: "¿Cuál de las siguientes opciones de implementación de SQL Server recoge la documentación de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Instalarlo en Windows o Linux, en un contenedor Linux o en Azure Virtual Machines."
  - id: b
    text:
      es: "Instalarlo solo en Windows, porque es un producto de Microsoft para Windows."
  - id: c
    text:
      es: "Usarlo solo como servicio en la nube de Azure, sin instalarlo en equipos."
  - id: d
    text:
      es: "Instalarlo en Windows o en macOS, pero no en Linux ni en contenedores Linux."
  explanation:
    es: "La página dice que SQL Server puede instalarse en Windows o Linux, implementarse en un contenedor Linux o en Azure Virtual Machines u otra plataforma de máquina virtual. «Solo Windows» contradice la mención de Linux y del contenedor Linux. «Solo en la nube» contradice que la misma frase empiece por instalarlo en equipos con Windows o Linux. Y la serie «Windows o macOS, pero no Linux» deja fuera dos de las opciones que la página cita, Linux y el contenedor Linux, y añade macOS, que no está entre ellas."
  citation: "fuente: `ms-sql-server.html`; «Opciones de implementación»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-azure-mysql-html
- id: m06-l01-q130
  prompt:
    es: "¿Qué es MySQL, cuya Community Edition sirve de base al servicio Azure Database for MySQL servidor flexible de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Un motor de base de datos."
  - id: b
    text:
      es: "Un sistema operativo de servidor."
  - id: c
    text:
      es: "Un hipervisor de máquinas virtuales."
  - id: d
    text:
      es: "Un sistema de archivos de Windows."
  explanation:
    es: "La página dice que el servicio se basa en el motor de base de datos MySQL Community Edition y que MySQL es un motor de base de datos popular para aplicaciones web y móviles. No es un sistema operativo ni un sistema de archivos, y el hipervisor es el software que administra máquinas virtuales."
  citation: "fuente: `ms-azure-mysql.html`; «¿Qué es el servidor flexible de Azure Database for MySQL?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-azure-mysql-html
- id: m06-l01-q131
  prompt:
    es: "El servicio Azure Database for MySQL servidor flexible se basa en el motor de base de datos MySQL Community Edition, disponible con la licencia:"
  options:
  - id: a
    text:
      es: "Licencia Pública de la Unión Europea (EUPL)"
  - id: b
    text:
      es: "Windows Virtual Desktop Access (VDA)"
  - id: c
    correct: true
    text:
      es: "GPLv2"
  - id: d
    text:
      es: "Software Assurance de Microsoft"
  explanation:
    es: "La página dice que el servicio se basa en el motor MySQL Community Edition, «disponible en la licencia GPLv2». La EUPL es la licencia de la Comisión Europea para poner en común aplicaciones del sector público; VDA es un modelo de licencia para acceder a escritorios virtuales; Software Assurance es el programa cuyos dispositivos no necesitan VDA."
  citation: "fuente: `ms-azure-mysql.html`; «¿Qué es el servidor flexible de Azure Database for MySQL?»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-azure-mysql-html
- id: m06-l01-q132
  prompt:
    es: "¿Cuál de los siguientes usos atribuye Microsoft a MySQL, que describe como un motor de base de datos popular?"
  options:
  - id: a
    text:
      es: "Administrar las máquinas virtuales de un escritorio virtual."
  - id: b
    correct: true
    text:
      es: "Ejecutar aplicaciones web y móviles a escala de Internet."
  - id: c
    text:
      es: "Cifrar las unidades de disco con el módulo de plataforma segura."
  - id: d
    text:
      es: "Autenticar a los usuarios y dirigirlos a su máquina virtual."
  explanation:
    es: "La página dice que MySQL es un motor de base de datos popular para ejecutar aplicaciones web y móviles a escala de Internet. Administrar máquinas virtuales es tarea del hipervisor; cifrar unidades con el TPM es BitLocker; autenticar a los usuarios y dirigirlos a su máquina virtual es el agente de conexión de la VDI."
  citation: "fuente: `ms-azure-mysql.html`; «Capacidad de escalar de forma horizontal la carga de trabajo de lectura con réplicas de lectura»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-azure-mysql-html
- id: m06-l01-q133
  prompt:
    es: "¿Qué tipo de servicio es Azure Database for MySQL servidor flexible, según la documentación de Microsoft en español?"
  options:
  - id: a
    text:
      es: "Un servicio de escritorios virtuales hospedados en Microsoft Cloud."
  - id: b
    text:
      es: "Un servicio de copias de seguridad de Windows en Microsoft Cloud."
  - id: c
    correct: true
    text:
      es: "Un servicio de base de datos relacional totalmente administrado."
  - id: d
    text:
      es: "Un servicio de base de datos no relacional que administra el propio cliente."
  explanation:
    es: "La página lo define como un servicio de base de datos relacional totalmente administrado y listo para producción en Microsoft Cloud. Los escritorios virtuales hospedados son la VDI (Azure Virtual Desktop). Aunque el servicio ofrece copias de seguridad automáticas de sus datos, no es el servicio Copias de seguridad de Windows. No es no relacional ni lo administra el cliente: está totalmente administrado."
  citation: "fuente: `ms-azure-mysql.html`; «¿Qué es el servidor flexible de Azure Database for MySQL?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-mineria-datos-html
- id: m06-l01-q134
  prompt:
    es: "¿Qué usa la minería de datos, el proceso de detectar información accionable en grandes conjuntos de datos, para derivar patrones y tendencias?"
  options:
  - id: a
    correct: true
    text:
      es: "Análisis matemáticos de los datos."
  - id: b
    text:
      es: "Cifrado de los datos con claves de 256 bits."
  - id: c
    text:
      es: "Replicación de los datos en varias bases."
  - id: d
    text:
      es: "Compresión de los datos en el sistema de archivos."
  explanation:
    es: "La página dice que la minería de datos usa análisis matemáticos para derivar patrones y tendencias que existen en los datos. El cifrado protege los datos, la replicación los copia y sincroniza entre bases de datos y la compresión del sistema de archivos sirve para almacenar más datos en un volumen; ninguno deriva patrones."
  citation: "fuente: `ms-mineria-datos.html`; «Conceptos de minería de datos»"
  difficulty: 1
  tags:
  - "concepto"
