# anchor: fuente-ms-excel-prioridad-operadores-html
- id: m02-l09-q240
  prompt:
    es: "En una hoja de cálculo de Microsoft Excel 365 para Windows, ¿cuál de los siguientes valores muestra una celda con la fórmula =5+2*3?"
  options:
  - id: a
    text:
      es: "13"
  - id: b
    correct: true
    text:
      es: "11"
  - id: c
    text:
      es: "10"
  - id: d
    text:
      es: "21"
  explanation:
    es: "Excel multiplica antes de sumar: 2 por 3 son 6, y 5 más 6 son 11. «21»: ese resultado sale con paréntesis, =(5+2)*3. «13»: resultaría de multiplicar 5 por 2 y sumar 3, y la fórmula multiplica 2 por 3 primero. «10»: resultaría de sumar 5, 2 y 3 sin multiplicar, y el operador * tiene más prioridad que +."
  citation: "fuente: `ms-excel-prioridad-operadores.html`; «Uso de paréntesis»"
  difficulty: 1
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-prioridad-operadores-html
- id: m02-l09-q242
  prompt:
    es: "Al preparar un libro en Microsoft Excel 365 con las etiquetas en español, ¿cuál de los siguientes valores muestra una celda con la fórmula =8/2*4?"
  options:
  - id: a
    correct: true
    text:
      es: "16"
  - id: b
    text:
      es: "1"
  - id: c
    text:
      es: "8"
  - id: d
    text:
      es: "4"
  explanation:
    es: "La multiplicación y la división tienen la misma prioridad; Excel las evalúa de izquierda a derecha: 8 entre 2 son 4, y 4 por 4 son 16. «1»: dividiría 8 entre el producto de 2 y 4, que es evaluar de derecha a izquierda. «8»: multiplicaría 2 por 4 y no dividiría en ese orden. «4»: solo dividiría 8 entre 2 y se olvidaría del producto."
  citation: "fuente: `ms-excel-prioridad-operadores.html`; «Prioridad de operadores»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-prioridad-operadores-html
- id: m02-l09-q243
  prompt:
    es: "En el programa de hojas de cálculo Microsoft Excel 365, ¿cuál de los siguientes valores muestra una celda con la fórmula =2+3^2?"
  options:
  - id: a
    correct: true
    text:
      es: "11"
  - id: b
    text:
      es: "8"
  - id: c
    text:
      es: "25"
  - id: d
    text:
      es: "13"
  explanation:
    es: "En la tabla de prioridad, la exponenciación (^) va antes que la suma: 3 al cuadrado son 9, y 2 más 9 son 11. «25»: sumaría antes de elevar a la potencia, y la página da más prioridad a ^. «8»: multiplicaría 3 por 2 en vez de elevar al cuadrado. «13»: elevaría 3 a 2 y sumaría 2 dos veces."
  citation: "fuente: `ms-excel-prioridad-operadores.html`; «Prioridad de operadores»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-prioridad-operadores-html
- id: m02-l09-q244
  prompt:
    es: "Al trabajar con una hoja de cálculo de Microsoft Excel 365, ¿cuál de las siguientes fórmulas da como resultado 21?"
  options:
  - id: a
    text:
      es: "=5+2*3"
  - id: b
    text:
      es: "=5+(2*3)"
  - id: c
    correct: true
    text:
      es: "=(5+2)*3"
  - id: d
    text:
      es: "=5*2+3"
  explanation:
    es: "La página explica que con paréntesis Excel suma 5 y 2 y multiplica el resultado por 3, y obtiene 21. «=5+2*3»: multiplica antes de sumar y da 11. «=5+(2*3)»: los paréntesis se calculan primero y dan 11. «=5*2+3»: multiplica 5 por 2 y suma 3, y da 13."
  citation: "fuente: `ms-excel-prioridad-operadores.html`; «Uso de paréntesis»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-prioridad-operadores-html
- id: m02-l09-q245
  prompt:
    es: "En Excel 365, ¿cuántos tipos de operadores de cálculo describe la ayuda de operadores y prioridad?"
  options:
  - id: a
    text:
      es: "Tres: aritmético, de comparación y de concatenación de texto, sin operadores de referencia"
  - id: b
    text:
      es: "Cinco: aritmético, comparación, texto, referencia y lógico"
  - id: c
    text:
      es: "Dos: aritmético y lógico"
  - id: d
    correct: true
    text:
      es: "Cuatro: aritmético, de comparación, de concatenación de texto y de referencia"
  explanation:
    es: "La página dice que existen cuatro tipos de operadores de cálculo: aritmético, comparación, concatenación de texto y referencia. «Tres: aritmético, de comparación y de concatenación de texto, sin operadores de referencia»: la página añade el operador de referencia, hasta cuatro. «Dos: aritmético y lógico»: la página enumera cuatro tipos: aritmético, comparación, concatenación de texto y referencia. «Cinco: aritmético, comparación, texto, referencia y lógico»: la página da cuatro tipos, sin un quinto lógico."
  citation: "fuente: `ms-excel-prioridad-operadores.html`; «Tipos de operadores»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-prioridad-operadores-html
- id: m02-l09-q246
  prompt:
    es: "En una hoja de cálculo de Microsoft Excel 365 para Windows, ¿cuál de los siguientes operadores se usa para unir o concatenar cadenas de texto?"
  options:
  - id: a
    correct: true
    text:
      es: "La Y comercial (&)"
  - id: b
    text:
      es: "El acento circunflejo (^)"
  - id: c
    text:
      es: "Los dos puntos (:)"
  - id: d
    text:
      es: "El signo más (+)"
  explanation:
    es: "La página dice que la Y comercial (&) conecta o concatena dos valores para generar un texto continuo. «El signo más (+)»: el signo más es un operador aritmético de suma. «El acento circunflejo (^)»: el acento circunflejo eleva a una potencia. «Los dos puntos (:)»: los dos puntos forman rangos de celdas."
  citation: "fuente: `ms-excel-prioridad-operadores.html`; «Operador de concatenación de texto»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-si-anidadas-html
- id: m02-l09-q248
  prompt:
    es: "Al preparar un libro en Microsoft Excel 365 con las etiquetas en español, D2 contiene 75. ¿Qué devuelve =SI(D2>89;\"A\";SI(D2>79;\"B\";SI(D2>69;\"C\";SI(D2>59;\"D\";\"F\"))))?"
  options:
  - id: a
    text:
      es: "B"
  - id: b
    correct: true
    text:
      es: "C"
  - id: c
    text:
      es: "F"
  - id: d
    text:
      es: "D"
  explanation:
    es: "La función evalúa las condiciones en orden: 75 no supera 89 ni 79, pero sí 69, así que devuelve C. «B»: 75 no es mayor que 79. «D»: 75 ya cumple la condición mayor que 69, que se evalúa antes. «F»: F solo se devuelve si el valor no supera 59."
  citation: "fuente: `ms-excel-si-anidadas.html`; «Ejemplos»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-si-anidadas-html
- id: m02-l09-q249
  prompt:
    es: "En el programa de hojas de cálculo Microsoft Excel 365, D2 contiene 89. ¿Qué devuelve =SI(D2>89;\"A\";SI(D2>79;\"B\";SI(D2>69;\"C\";SI(D2>59;\"D\";\"F\"))))?"
  options:
  - id: a
    text:
      es: "F"
  - id: b
    text:
      es: "A"
  - id: c
    correct: true
    text:
      es: "B"
  - id: d
    text:
      es: "C"
  explanation:
    es: "La condición D2>89 es falsa para 89, y la siguiente, D2>79, es verdadera, así que devuelve B. «A»: 89 no es mayor que 89, porque la condición es estrictamente mayor. «C»: 89 ya cumple la condición mayor que 79, que se evalúa antes. «F»: F solo se devuelve si el valor no supera 59."
  citation: "fuente: `ms-excel-si-anidadas.html`; «Ejemplos»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
