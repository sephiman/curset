type: quiz
variants:
- id: m05-l07-q02
  prompt:
    en: In the Jakarta Persistence specification, which lifecycle state describes an entity instance that has a
      persistent identity but is no longer associated with a persistence context?
  options:
  - id: a
    text:
      en: Managed
  - id: b
    correct: true
    text:
      en: Detached
  - id: c
    text:
      en: Removed
  - id: d
    text:
      en: New
  explanation:
    en: A detached entity instance has a persistent identity and is not, or no longer, associated with a persistence
      context. Managed is not the state, because a managed instance is currently associated with a persistence context.
      Removed is not the state, because a removed instance is still associated with a persistence context until
      it is removed on commit. New is not the state, because a new instance has no persistent identity.
  citation: jakarta-persistence-spec#a1929
  extract:
    en: A detached entity instance is an instance with a persistent identity that is not (or no longer) associated
      with a persistence context.
- id: m05-l07-q03
  prompt:
    en: By default, how does Spring Data JPA decide that an entity is new when the entity has a `@Version` property
      of a non-primitive type?
  options:
  - id: a
    correct: true
    text:
      en: The entity is new if the value of the version property is `null`
  - id: b
    text:
      en: The entity is new if its identifier property is `null`, ignoring the version property
  - id: c
    text:
      en: The entity is new if its version property is `0`
  - id: d
    text:
      en: The entity is always treated as new, so `save` always calls `persist()`
  explanation:
    en: The entity is considered new if the value of its non-primitive version property is `null`. The identifier
      is not inspected first, because Spring Data JPA first inspects whether there is a version property of non-primitive
      type. A version of `0` does not mark a new entity, because JPA considers zero the first inserted version of
      an entity. Not every entity is new, because Spring Data repositories know whether to call `EntityManager.persist()`
      or `merge()` from the new-state detection.
  citation: spring-data-jpa-entity-persistence#jpa.entity-persistence.saving-entities.strategies
  extract:
    en: If there is, the entity is considered new if the value of that property is null.
- id: m05-l07-q04
  prompt:
    en: In Hibernate, what is the effect of setting `hibernate.jdbc.batch_size` to zero or to a negative number?
  options:
  - id: a
    text:
      en: Hibernate batches every statement of the transaction with no maximum
  - id: b
    text:
      en: Hibernate orders SQL updates by entity type and primary key
  - id: c
    correct: true
    text:
      en: JDBC batching is disabled
  - id: d
    text:
      en: Hibernate orders inserts so that more batching can be used
  explanation:
    en: A `hibernate.jdbc.batch_size` of zero or a negative number disables the batching feature. There is no unlimited
      batch, because the setting controls the maximum number of statements batched before the driver executes the
      batch. Ordering updates belongs to `hibernate.order_updates`, which forces Hibernate to order SQL updates
      by entity type and primary key value. Ordering inserts belongs to `hibernate.order_inserts`, which forces
      Hibernate to order inserts to allow for more batching.
  citation: hibernate-user-guide#batch-jdbcbatch
