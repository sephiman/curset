# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q320
  prompt:
    es: "En Windows 11, ¿qué indica Microsoft sobre el Panel de control en comparación con la aplicación Configuración, según la página sobre las herramientas del sistema?"
  options:
  - id: a
    text:
      es: "Ha sido sustituido por completo por la aplicación Configuración y ya no se puede abrir desde ningún sitio"
  - id: b
    text:
      es: "Se abre con el método abreviado Windows+I"
  - id: c
    text:
      es: "Se abre escribiendo MSConfig en el cuadro Ejecutar"
  - id: d
    correct: true
    text:
      es: "Sigue existiendo por compatibilidad, pero se recomienda usar Configuración siempre que sea posible"
  explanation:
    es: "El Panel de control sigue existiendo por compatibilidad y para configuraciones aún no migradas, y Microsoft recomienda Configuración siempre que sea posible. Windows+I abre Configuración, no el Panel de control, y MSConfig abre Configuración del sistema; el Panel de control se abre escribiendo control."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Panel de control»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q322
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes descripciones corresponde a la utilidad Información del sistema, según la página de Microsoft sobre las herramientas del sistema?"
  options:
  - id: a
    text:
      es: "Una ubicación centralizada para administrar discos, servicios, dispositivos y usuarios del equipo"
  - id: b
    correct: true
    text:
      es: "Una vista completa del hardware, los componentes del sistema y el software"
  - id: c
    text:
      es: "Opciones para solucionar problemas de inicio de Windows"
  - id: d
    text:
      es: "Un registro detallado de los eventos del sistema y de la seguridad"
  explanation:
    es: "Información del sistema da una vista completa del hardware, los componentes del sistema y el entorno de software. Administrar discos, servicios y usuarios es de Administración de equipos, solucionar problemas de inicio es de Configuración del sistema y el registro de eventos es del Visor de eventos."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Información del sistema»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-herramientas-sistema-html
- id: m02-l07-q323
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes herramientas es la aplicación principal para personalizar y administrar la configuración de Windows, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Panel de control"
  - id: b
    text:
      es: "Configuración del sistema"
  - id: c
    text:
      es: "Configuración avanzada del sistema"
  - id: d
    correct: true
    text:
      es: "Configuración"
  explanation:
    es: "Configuración es la aplicación principal y el Panel de control se conserva por compatibilidad. Configuración del sistema ayuda a solucionar problemas de inicio y la Configuración avanzada del sistema ajusta propiedades, variables de entorno y rendimiento."
  citation: "fuente: `ms-win-herramientas-sistema.html`; «Configuración»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-update-html
- id: m02-l07-q324
  prompt:
    es: "En Windows 11, cuando una actualización necesita reiniciar el dispositivo para terminar de instalarse, ¿qué intenta hacer Windows, según las preguntas frecuentes de Windows Update?"
  options:
  - id: a
    correct: true
    text:
      es: "Reiniciar el dispositivo cuando no lo estés usando"
  - id: b
    text:
      es: "Reiniciar de inmediato, aunque el dispositivo esté en uso"
  - id: c
    text:
      es: "Pedir siempre que programes el reinicio antes de instalar"
  - id: d
    text:
      es: "Esperar a que se alcance el límite de pausa"
  explanation:
    es: "Windows intenta reiniciar el dispositivo cuando no lo usas y solo si no lo consigue pide programar el reinicio. No reinicia de inmediato con el equipo en uso, no pide programarlo siempre y el límite de pausa solo limita cuánto se pueden detener las actualizaciones."
  citation: "fuente: `ms-win-update.html`; «¿Cómo puedo asegurarme de que mi dispositivo se reiniciará para instalar actualizaciones en un momento conveniente?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-update-html
- id: m02-l07-q325
  prompt:
    es: "En el historial de actualizaciones de Windows 11, tras elegir la actualización que se quiere quitar, ¿qué botón se selecciona, según las preguntas frecuentes de Windows Update?"
  options:
  - id: a
    text:
      es: "Pausar actualizaciones"
  - id: b
    text:
      es: "Programar el reinicio"
  - id: c
    correct: true
    text:
      es: "Desinstalar"
  - id: d
    text:
      es: "Buscar actualizaciones"
  explanation:
    es: "Tras elegir la actualización se selecciona Desinstalar. Pausar actualizaciones detiene temporalmente la descarga y la instalación, Programar el reinicio fija el momento del reinicio y Buscar actualizaciones comprueba las disponibles."
  citation: "fuente: `ms-win-update.html`; «¿Cómo puedo quitar una actualización instalada?»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-update-html
- id: m02-l07-q326
  prompt:
    es: "En Windows 11, ¿qué hay que hacer al alcanzar el límite de pausa de las actualizaciones para poder volver a pausarlas, según las preguntas frecuentes de Windows Update?"
  options:
  - id: a
    text:
      es: "Programar el reinicio del dispositivo"
  - id: b
    text:
      es: "Elegir otra duración junto a Pausar actualizaciones"
  - id: c
    correct: true
    text:
      es: "Instalar las últimas actualizaciones"
  - id: d
    text:
      es: "Cambiar las horas activas"
  explanation:
    es: "Al alcanzar el límite de pausa hay que instalar las últimas actualizaciones para poder pausar de nuevo. Programar el reinicio y las horas activas solo fijan cuándo se reinicia el dispositivo, y elegir otra duración no basta mientras no se instalen esas actualizaciones."
  citation: "fuente: `ms-win-update.html`; «¿Cómo puedo hacer que las actualizaciones dejen de descargarse e instalarse?»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-cmd-html
- id: m02-l07-q327
  prompt:
    es: "En Windows 11, ¿qué hace el parámetro /c del comando cmd, según la referencia de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Lleva a cabo el comando indicado y sale del procesador de comandos"
  - id: b
    text:
      es: "Lleva a cabo el comando indicado y mantiene el procesador en ejecución"
  - id: c
    text:
      es: "Desactiva el eco"
  - id: d
    text:
      es: "Da formato a la salida del comando como Unicode"
  explanation:
    es: "/c ejecuta el comando y sale del procesador de comandos. Mantenerlo en ejecución es /k, desactivar el eco es /q y dar formato Unicode a la salida es /u."
  citation: "fuente: `ms-win-cmd.html`; «cmd»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-cmd-html
- id: m02-l07-q328
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes parámetros de cmd da formato Unicode a la salida del comando, según la referencia de Microsoft?"
  options:
  - id: a
    text:
      es: "/a"
  - id: b
    text:
      es: "/q"
  - id: c
    text:
      es: "/d"
  - id: d
    correct: true
    text:
      es: "/u"
  explanation:
    es: "/u da formato Unicode a la salida. /a lo da en ANSI, /q desactiva el eco y /d deshabilita los comandos AutoRun."
  citation: "fuente: `ms-win-cmd.html`; «cmd»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-certmgr-html
- id: m02-l07-q329
  prompt:
    es: "En Windows 11, ¿cuál de los almacenes de certificados que se examinan con la consola MMC es local para el dispositivo y global para todos sus usuarios?"
  options:
  - id: a
    text:
      es: "Usuario actual"
  - id: b
    correct: true
    text:
      es: "Ordenador local"
  - id: c
    text:
      es: "Cuenta de servicio"
  - id: d
    text:
      es: "Raíz de consola"
  explanation:
    es: "El almacén de Ordenador local es local para el dispositivo y global para todos sus usuarios. Usuario actual es local para esa cuenta, Cuenta de servicio es local para un servicio y Raíz de consola es el nodo del panel izquierdo desde el que se expanden los certificados, no un tipo de almacén."
  citation: "fuente: `ms-win-certmgr.html`; «Hay tres tipos diferentes de almacenes de certificados»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-liberar-espacio-html
- id: m02-l07-q333
  prompt:
    es: "Si no se quiere usar el Sensor de almacenamiento en Windows 11, ¿qué ayuda a identificar y limpiar archivos temporales y archivos del sistema, según la ayuda para liberar espacio?"
  options:
  - id: a
    text:
      es: "Archivos a petición de OneDrive"
  - id: b
    text:
      es: "El Historial de archivos"
  - id: c
    correct: true
    text:
      es: "Las recomendaciones de limpieza"
  - id: d
    text:
      es: "Seguridad de Windows"
  explanation:
    es: "Las recomendaciones de limpieza ayudan a identificar y limpiar archivos temporales y archivos del sistema. Archivos a petición de OneDrive guarda un marcador de posición más pequeño, el Historial de archivos hace copias de seguridad y Seguridad de Windows analiza el equipo en busca de virus."
  citation: "fuente: `ms-win-liberar-espacio.html`; «Liberar espacio con las recomendaciones de limpieza»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-liberar-espacio-html
- id: m02-l07-q334
  prompt:
    es: "En Windows 11, ¿qué muestra Windows al sugerir archivos en las recomendaciones de limpieza, según la ayuda de Microsoft para liberar espacio?"
  options:
  - id: a
    text:
      es: "Si el equipo puede estar infectado por malware y conviene analizarlo"
  - id: b
    text:
      es: "El tamaño del marcador de posición de OneDrive"
  - id: c
    correct: true
    text:
      es: "La cantidad de espacio que se guardará al quitar esos elementos"
  - id: d
    text:
      es: "La unidad externa donde guardar los archivos"
  explanation:
    es: "Windows sugiere archivos y muestra el espacio que se guardará al quitarlos. La búsqueda de malware es un paso aparte con un antivirus, el marcador de posición es la función Archivos a petición de OneDrive y la unidad externa es la que se conecta al mover archivos a mano."
  citation: "fuente: `ms-win-liberar-espacio.html`; «Liberar espacio con las recomendaciones de limpieza»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-liberar-espacio-html
- id: m02-l07-q336
  prompt:
    es: "Según la ayuda de Microsoft para liberar espacio en Windows 11, ¿cómo se mueven a un dispositivo de almacenamiento externo los archivos que se quieren conservar?"
  options:
  - id: a
    text:
      es: "Arrastrándolos con Ctrl pulsado hasta el dispositivo de almacenamiento externo"
  - id: b
    text:
      es: "Arrastrándolos con Alt pulsado hasta el dispositivo de almacenamiento externo"
  - id: c
    text:
      es: "Seleccionándolos y pulsando Mayús+Supr"
  - id: d
    correct: true
    text:
      es: "Seleccionándolos, eligiendo Cortar y pegándolos en el dispositivo externo"
  explanation:
    es: "Se seleccionan los archivos, se elige Cortar en la cinta de opciones y se pega en el dispositivo externo. Arrastrar con Ctrl pulsado copia y deja los originales ocupando espacio, arrastrar con Alt crea un acceso directo y Mayús+Supr elimina de forma permanente en lugar de mover."
  citation: "fuente: `ms-win-liberar-espacio.html`; «Eliminar archivos personales o moverlos a un dispositivo de almacenamiento externo»"
  difficulty: 2
  tags:
  - "ofimática-menú"
