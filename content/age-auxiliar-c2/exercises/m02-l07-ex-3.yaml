      es: "Ctrl+Tab"
  - id: b
    text:
      es: "Ctrl+Mayús+Número (1-9)"
  - id: c
    correct: true
    text:
      es: "Ctrl+Mayús+Tab"
  - id: d
    text:
      es: "Ctrl+Mayús+E"
  explanation:
