# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0224
  prompt:
    es: "De acuerdo con el artículo 104.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el vencimiento del plazo máximo sin resolución expresa en un procedimiento iniciado a instancia de parte, en defecto de regulación específica:"
  options:
  - id: a
    text:
      es: "Los interesados pueden entender desestimadas sus solicitudes por silencio, salvo en la impugnación de actos y disposiciones, donde es estimatorio."
  - id: b
    text:
      es: "Los interesados pueden entender estimadas sus solicitudes por silencio en todos los casos, incluidos los de impugnación de actos."
  - id: c
    text:
      es: "Los interesados pueden entender estimadas sus solicitudes por silencio, salvo en los procedimientos de devolución, donde es desestimatorio."
  - id: d
    correct: true
    text:
      es: "Los interesados pueden entender estimadas sus solicitudes por silencio, salvo en el derecho de petición y en la impugnación de actos y disposiciones, donde el silencio es desestimatorio."
  explanation:
    es: "En defecto de regulación específica, el silencio es estimatorio en los procedimientos a instancia de parte, salvo el derecho de petición del artículo 29 de la Constitución y la impugnación de actos y disposiciones, en que es desestimatorio. Entender desestimadas las solicitudes con excepción de la impugnación, extender el silencio estimatorio a la impugnación de actos o inventar una excepción para las devoluciones contradice el precepto."
  citation: "art. 104.3 LGT"
  difficulty: 2
  tags:
  - "efectos de la falta de resolución"
  - "silencio"
# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0225
  prompt:
    es: "Según el artículo 104.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué efecto tiene el silencio cuando vence el plazo máximo sin notificar resolución del recurso con que un obligado impugna un acto tributario?"
  options:
  - id: a
    correct: true
    text:
      es: "Desestimatorio, porque en los procedimientos de impugnación de actos y disposiciones el silencio tiene efecto desestimatorio."
  - id: b
    text:
      es: "Estimatorio, porque en los procedimientos a instancia de parte el silencio es siempre estimatorio."
  - id: c
    text:
      es: "Ninguno, hasta que la Administración notifique la resolución con el plazo que fije el obligado."
  - id: d
    text:
      es: "Se produce la caducidad del procedimiento y el obligado debe interponer de nuevo el recurso."
  explanation:
    es: "En la impugnación de actos y disposiciones el silencio tiene efecto desestimatorio, excepción a la regla general estimatoria del artículo 104.3. El silencio sí produce efecto, no lo fija el obligado y la caducidad es el efecto de los procedimientos de oficio desfavorables, no de los recursos."
  citation: "art. 104.3 LGT"
  difficulty: 2
  tags:
  - "efectos de la falta de resolución"
  - "silencio"
# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0226
  prompt:
    es: "Conforme al artículo 104.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en los procedimientos iniciados a instancia de parte, el vencimiento del plazo máximo sin haberse notificado resolución expresa produce:"
  options:
  - id: a
    correct: true
    text:
      es: "los efectos que establezca su normativa reguladora."
  - id: b
    text:
      es: "la caducidad del procedimiento en todo caso."
  - id: c
    text:
      es: "la estimación automática de lo solicitado en todo caso."
  - id: d
    text:
      es: "la desestimación de lo solicitado en todo caso."
  explanation:
    es: "El artículo 104.3 remite primero a la normativa reguladora del procedimiento. Solo en su defecto opera el silencio estimatorio general. No produce en todo caso caducidad, estimación o desestimación."
  citation: "art. 104.3 LGT"
  difficulty: 1
  tags:
  - "efectos de la falta de resolución"
  - "silencio"
# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0227
  prompt:
    es: "Según el artículo 104.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando se produzca la paralización del procedimiento por causa imputable al obligado tributario, la Administración le advertirá que, transcurridos:"
  options:
  - id: a
    text:
      es: "un mes, podrá declarar la caducidad del mismo."
  - id: b
    text:
      es: "seis meses, podrá declarar la caducidad del mismo."
  - id: c
    correct: true
    text:
      es: "tres meses, podrá declarar la caducidad del mismo."
  - id: d
    text:
      es: "tres meses, el procedimiento se entenderá desistido automáticamente."
  explanation:
    es: "La advertencia es de que, pasados tres meses, la Administración podrá declarar la caducidad. No son uno ni seis meses y la ley no habla de desistimiento automático."
  citation: "art. 104.3 LGT"
  difficulty: 1
  tags:
  - "efectos de la falta de resolución"
  - "caducidad"
# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0228
  prompt:
    es: "La Administración inicia de oficio un procedimiento susceptible de producir efectos desfavorables o de gravamen para un obligado. Vence el plazo máximo sin notificar resolución y la normativa reguladora no prevé el efecto. Conforme al artículo 104.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué ocurre?"
  options:
  - id: a
    text:
      es: "El obligado puede entender estimadas sus alegaciones por silencio administrativo."
  - id: b
    text:
      es: "El procedimiento queda suspendido hasta que la Administración dicte resolución."
  - id: c
    text:
      es: "El plazo se prorroga automáticamente por otros seis meses."
  - id: d
    correct: true
    text:
      es: "Se produce la caducidad del procedimiento."
  explanation:
    es: "En ausencia de regulación expresa, los procedimientos de oficio susceptibles de producir efectos desfavorables o de gravamen caducan (art. 104.4.b). No se estiman alegaciones por silencio, no se suspenden y no se prorrogan."
  citation: "art. 104.4 LGT"
  difficulty: 2
  tags:
  - "efectos de la falta de resolución"
  - "caducidad"
# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0230
  prompt:
    es: "Conforme al artículo 104.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, producida la caducidad de un procedimiento tributario, esta:"
  options:
  - id: a
    text:
      es: "será declarada solo a instancia del interesado, con archivo de las actuaciones tras un año."
  - id: b
    correct: true
    text:
      es: "será declarada, de oficio o a instancia del interesado, ordenándose el archivo de las actuaciones."
  - id: c
    text:
      es: "será declarada de oficio sin posibilidad de instancia del interesado, con archivo inmediato."
  - id: d
    text:
      es: "será declarada por el tribunal económico-administrativo competente, a petición del interesado, con archivo."
  explanation:
    es: "La caducidad se declara de oficio o a instancia del interesado y se ordena el archivo de las actuaciones. No es solo a instancia, no excluye la instancia del interesado y no la declara un tribunal económico-administrativo."
  citation: "art. 104.5 LGT"
  difficulty: 1
  tags:
  - "efectos de la falta de resolución"
  - "caducidad"
# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0233
  prompt:
    es: "El miércoles 11 de febrero de 2026 se notifica a Industrias Pardo, S.A., el acuerdo de inicio de un procedimiento de oficio, sin plazo propio. El plazo de alegaciones acaba el lunes 30 de marzo de 2026 y la empresa aporta nuevos documentos el jueves 9 de abril de 2026. Según los artículos 104.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria y 104.b) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿cuándo vence el plazo máximo de resolución?"
  options:
  - id: a
    correct: true
    text:
      es: "El viernes 21 de agosto de 2026."
  - id: b
    text:
      es: "El martes 11 de agosto de 2026."
  - id: c
    text:
      es: "El jueves 20 de agosto de 2026."
  - id: d
    text:
      es: "El lunes 31 de agosto de 2026."
  explanation:
    es: "El plazo de seis meses desde el 11 de febrero vence el 11 de agosto de 2026 (art. 104.1.a y art. 30.4 de la Ley 39/2015). La aportación tras las alegaciones es dilación del 31 de marzo al 9 de abril, ambos incluidos: 10 días naturales (art. 104.b y art. 102.5). El plazo se desplaza 10 días: el 21 de agosto de 2026. Las otras fechas ignoran la dilación, restan un día o suman 20. En el examen 2025 (pregunta 20) la plantilla oficial dio otra respuesta; esta pregunta sigue el texto del artículo."
  citation: "art. 104.1 LGT"
  difficulty: 3
  tags:
  - "plazo de resolución"
  - "cómputo"
  - "dilaciones"
# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0234
  prompt:
    es: "El lunes 13 de abril de 2026 entra en el registro del órgano competente una solicitud de un obligado. La normativa no fija plazo y el obligado cumple con 14 días naturales de retraso un requerimiento, que constituyen dilación por causa no imputable a la Administración. Conforme a los artículos 104.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria y 104.a) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿cuándo vence el plazo máximo de resolución?"
  options:
  - id: a
    text:
      es: "El martes 13 de octubre de 2026."
  - id: b
    correct: true
    text:
      es: "El martes 27 de octubre de 2026."
  - id: c
    text:
      es: "El martes 10 de noviembre de 2026."
  - id: d
    text:
      es: "El lunes 26 de octubre de 2026."
  explanation:
    es: "El plazo de seis meses desde la entrada en el registro vence el 13 de octubre de 2026 (art. 104.1.b y art. 30.4 de la Ley 39/2015). Las dilaciones por días naturales no se incluyen (art. 102.5 RGAT), de modo que se suman 14 días: el 27 de octubre de 2026. El 13 de octubre no suma la dilación, el 10 de noviembre suma 28 días y el 26 de octubre resta uno. En el examen 2025 (pregunta 20) la plantilla oficial dio otra respuesta; esta pregunta sigue el texto del artículo."
  citation: "art. 104.1 LGT"
  difficulty: 3
  tags:
  - "plazo de resolución"
  - "cómputo"
  - "dilaciones"
# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0267
  prompt:
    es: "De acuerdo con el artículo 104.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el inicio del cómputo del plazo máximo de resolución:"
  options:
  - id: a
    correct: true
    text:
      es: "En los procedimientos de oficio se cuenta desde la notificación del acuerdo de inicio y en los iniciados a instancia desde la entrada del documento en el registro del órgano competente."
  - id: b
    text:
      es: "En los procedimientos de oficio se cuenta desde la entrada del documento en el registro del órgano competente y en los iniciados a instancia desde la notificación del acuerdo de inicio."
  - id: c
    text:
      es: "En los procedimientos de oficio se cuenta desde la primera actuación del órgano tramitador y en los iniciados a instancia desde la entrada del documento en el registro competente."
  - id: d
    text:
      es: "En ambos tipos de procedimientos se cuenta desde la fecha de la primera notificación practicada al obligado tributario."
  explanation:
    es: "En los procedimientos de oficio el plazo parte de la notificación del acuerdo de inicio y en los de instancia de la entrada en el registro del órgano competente (art. 104.1). Las otras redacciones invierten los criterios, sustituyen el acuerdo de inicio por la primera actuación o unifican ambos casos. En el examen 2025 (pregunta 20) la plantilla oficial dio otra respuesta; esta pregunta sigue el texto del artículo."
  citation: "art. 104.1 LGT"
  difficulty: 2
  tags:
  - "plazo de resolución"
  - "cómputo"
# anchor: boe-a-2003-23186-art-104
- id: m03-l05-q0272
  prompt:
    es: "Conforme al artículo 104.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el vencimiento del plazo máximo sin resolución expresa en los procedimientos iniciados de oficio:"
  options:
  - id: a
    text:
      es: "Produce siempre la caducidad del procedimiento, con independencia de lo que prevea su normativa reguladora."
  - id: b
    correct: true
    text:
      es: "Produce los efectos previstos en la normativa reguladora de cada procedimiento y, en ausencia de regulación expresa, los que fija el propio artículo 104.4."
  - id: c
    text:
      es: "Produce siempre la desestimación presunta de lo solicitado, con independencia de lo que prevea su normativa reguladora."
  - id: d
    text:
      es: "Produce la estimación por silencio de los posibles efectos favorables del procedimiento a falta de regulación expresa."
  explanation:
    es: "El vencimiento sin resolución produce los efectos de la normativa del procedimiento y, a falta de ella, los del artículo 104.4: silencio desestimatorio de los posibles efectos favorables y caducidad si el procedimiento puede producir efectos desfavorables. No siempre caduca, no siempre se desestima y el silencio de los efectos favorables es desestimatorio."
  citation: "art. 104.4 LGT"
  difficulty: 2
  tags:
  - "efectos de la falta de resolución"
  - "silencio"
# anchor: boe-a-2003-23186-art-105
- id: m03-l05-q0235
  prompt:
    es: "De acuerdo con el artículo 105.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en los procedimientos de aplicación de los tributos quien haga valer su derecho deberá probar:"
  options:
  - id: a
    text:
      es: "los hechos extintivos o impeditivos del derecho que invoque."
  - id: b
    text:
      es: "los hechos negados por la Administración tributaria actuante."
  - id: c
    text:
      es: "los hechos que la Administración no haya podido comprobar."
  - id: d
    correct: true
    text:
      es: "los hechos constitutivos del mismo."
  explanation:
    es: "Quien hace valer su derecho prueba los hechos constitutivos del mismo (art. 105.1). No le corresponden los hechos extintivos o impeditivos, ni los negados por la Administración ni los que esta no haya podido comprobar."
  citation: "art. 105.1 LGT"
  difficulty: 1
  tags:
  - "carga de la prueba"
  - "regla"
# anchor: boe-a-2003-23186-art-105
- id: m03-l05-q0237
  prompt:
    es: "Un contribuyente reclama una deducción en un procedimiento de aplicación de los tributos y discute con la Administración si se dieron los hechos que la justifican. Según el artículo 105.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿a quién corresponde probar los hechos constitutivos de ese derecho?"
  options:
  - id: a
    text:
      es: "A la Administración tributaria, porque es quien debe resolver el procedimiento."
  - id: b
    correct: true
    text:
      es: "Al propio contribuyente, que es quien hace valer el derecho."
  - id: c
    text:
      es: "A ambos por mitades, porque la prueba se reparte entre las partes del procedimiento."
  - id: d
    text:
      es: "Al órgano que revise el procedimiento, de oficio, antes de dictar la resolución."
  explanation:
    es: "La carga de la prueba recae en quien hace valer su derecho, aquí el contribuyente (art. 105.1). La Administración no prueba los hechos constitutivos de un derecho ajeno, la prueba no se reparte por mitades y no corresponde al órgano revisor."
  citation: "art. 105.1 LGT"
  difficulty: 2
  tags:
  - "carga de la prueba"
  - "regla"
# anchor: boe-a-2003-23186-art-105
- id: m03-l05-q0271
  prompt:
    es: "De acuerdo con el artículo 105 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la carga de la prueba en los procedimientos de aplicación de los tributos:"
  options:
  - id: a
    text:
      es: "Quien haga valer su derecho debe probar los hechos constitutivos del mismo, y siempre debe aportar copia de los elementos que obren en poder de la Administración."
  - id: b
    text:
      es: "La Administración debe probar los hechos constitutivos del derecho que haga valer el obligado, que solo debe designar los elementos de prueba."
  - id: c
    correct: true
    text:
      es: "Quien haga valer su derecho debe probar los hechos constitutivos del mismo, y se cumple el deber de probar designando de modo concreto los elementos de prueba en poder de la Administración."
  - id: d
    text:
      es: "Quien haga valer su derecho debe probar los hechos impeditivos del mismo, designando de modo concreto los elementos de prueba."
  explanation:
    es: "Quien hace valer su derecho prueba los hechos constitutivos del mismo y cumple su deber si designa de modo concreto los elementos de prueba en poder de la Administración (art. 105). No debe aportar siempre copia, la carga no recae en la Administración y no se refiere a los hechos impeditivos."
  citation: "art. 105 LGT"
  difficulty: 2
  tags:
  - "carga de la prueba"
  - "regla"
