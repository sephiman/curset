# anchor: boe-a-2004-21760-art-1
- id: m03-l07-q026
  prompt:
    es: "Según el artículo 1.1 de la Ley Orgánica 1/2004, de 28 de diciembre, de Medidas de Protección Integral contra la Violencia de Género, la ley incluye la violencia de las parejas o exparejas afectivas de la mujer:"
  options:
  - id: a
    text:
      es: "Siempre que haya existido convivencia"
  - id: b
    text:
      es: "Si la relación duró al menos un año"
  - id: c
    text:
      es: "Si la relación consta en un registro público"
  - id: d
    correct: true
    text:
      es: "Aun cuando no haya existido convivencia"
  explanation:
    es: "El artículo 1.1 incluye a quienes estén o hayan estado ligados a la mujer por relaciones similares de afectividad «aun sin convivencia». Por eso la ley no exige que haya existido convivencia. Tampoco pide una duración mínima de la relación ni su inscripción en un registro."
  citation: "art. 1.1 LO 1/2004"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2004-21760-art-1
- id: m03-l07-q027
  prompt:
    es: "Señale la respuesta correcta sobre la violencia contra la que actúa la Ley Orgánica 1/2004, de 28 de diciembre, de Medidas de Protección Integral contra la Violencia de Género, según su artículo 1.1:"
  options:
  - id: a
    text:
      es: "La que se ejerce entre cualesquiera miembros de una misma unidad familiar conviviente"
  - id: b
    correct: true
    text:
      es: "La que se ejerce sobre las mujeres por quienes sean o hayan sido sus cónyuges o parejas"
  - id: c
    text:
      es: "La que se ejerce sobre las mujeres por cualquier persona en el ámbito del trabajo"
  - id: d
    text:
      es: "La que se ejerce sobre cualquier persona por razón de su orientación o identidad sexual"
  explanation:
    es: "El artículo 1.1 se refiere a la violencia que se ejerce sobre las mujeres por quienes «sean o hayan sido sus cónyuges» o estén o hayan estado ligados a ellas por relaciones similares de afectividad. No abarca la violencia entre cualesquiera miembros de la familia. Tampoco la que ejerce cualquier persona en el trabajo. La violencia por orientación o identidad sexual no es el objeto de esta ley."
  citation: "art. 1.1 LO 1/2004"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2004-21760-art-24
- id: m03-l07-q028
  prompt:
    es: "¿Cuál de los siguientes enunciados recoge los derechos que la Ley Orgánica 1/2004, de 28 de diciembre, de Medidas de Protección Integral contra la Violencia de Género reconoce a la funcionaria víctima de violencia de género?"
  options:
  - id: a
    correct: true
    text:
      es: "La reducción o reordenación de su tiempo de trabajo, la movilidad geográfica de centro y la excedencia"
  - id: b
    text:
      es: "La reducción de su tiempo de trabajo y la excedencia, pero no la movilidad geográfica de centro de trabajo"
  - id: c
    text:
      es: "La movilidad geográfica de centro y la excedencia, pero no la reordenación de su tiempo de trabajo"
  - id: d
    text:
      es: "La reordenación de su tiempo de trabajo y la movilidad geográfica de centro, pero no la excedencia"
  explanation:
    es: "El artículo 24 reconoce los tres derechos: «la reducción o a la reordenación de su tiempo de trabajo, a la movilidad geográfica de centro de trabajo y a la excedencia». Cada una de las otras opciones deja fuera uno de ellos: la movilidad geográfica, la reordenación del tiempo de trabajo o la excedencia."
  citation: "art. 24 LO 1/2004"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2004-21760-art-24
- id: m03-l07-q029
  prompt:
    es: "Según el artículo 24 de la Ley Orgánica 1/2004, de 28 de diciembre, de Medidas de Protección Integral contra la Violencia de Género, ¿en qué términos tiene la funcionaria víctima de violencia de género derecho a la excedencia?"
  options:
  - id: a
    text:
      es: "En los términos que fije el plan de igualdad de su departamento"
  - id: b
    text:
      es: "En los términos que acuerde la Delegación del Gobierno competente"
  - id: c
    correct: true
    text:
      es: "En los términos que se determinen en su legislación específica"
  - id: d
    text:
      es: "En los términos que establezca la orden de protección del juez"
  explanation:
    es: "El artículo 24 remite a los términos «que se determinen en su legislación específica», es decir, la de la función pública. El plan de igualdad del departamento no regula estos derechos. La Delegación del Gobierno contra la Violencia de Género formula políticas públicas (art. 29.1), no fija los términos de cada derecho. La orden de protección tampoco es la norma a la que remite el artículo."
  citation: "art. 24 LO 1/2004"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2004-21760-art-29
- id: m03-l07-q030
  prompt:
    es: "¿Qué órgano elabora la Macroencuesta de Violencia contra las Mujeres, según la Ley Orgánica 1/2004, de 28 de diciembre, de Medidas de Protección Integral contra la Violencia de Género?"
  options:
  - id: a
    text:
      es: "El Observatorio Estatal de Violencia sobre la Mujer"
  - id: b
    correct: true
    text:
      es: "La Delegación del Gobierno contra la Violencia de Género"
  - id: c
    text:
      es: "La Comisión Interministerial de Igualdad entre mujeres y hombres"
  - id: d
    text:
      es: "La Autoridad Independiente para la Igualdad de Trato"
  explanation:
    es: "El artículo 29.1 dice que la Delegación del Gobierno contra la Violencia de Género «elaborará la Macroencuesta de Violencia contra las Mujeres». El Observatorio Estatal asesora, evalúa y elabora informes y estudios (art. 30.1), pero no la Macroencuesta. La Comisión Interministerial de Igualdad es un órgano de la Ley Orgánica 3/2007 (art. 76). La Autoridad Independiente para la Igualdad de Trato es una entidad de la Ley 15/2022."
  citation: "art. 29.1 LO 1/2004"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2004-21760-art-29
- id: m03-l07-q031
  prompt:
    es: "Según el artículo 29.1 de la Ley Orgánica 1/2004, de 28 de diciembre, de Medidas de Protección Integral contra la Violencia de Género, la Delegación del Gobierno contra la Violencia de Género está adscrita:"
  options:
  - id: a
    text:
      es: "Al Ministerio del Interior o al departamento con competencias en seguridad"
  - id: b
    text:
      es: "Al Ministerio de Inclusión, Seguridad Social y Migraciones"
  - id: c
    text:
      es: "A la Presidencia del Gobierno, con rango de Secretaría de Estado"
  - id: d
    correct: true
    text:
      es: "Al Ministerio de Igualdad o al departamento con competencias en la materia"
  explanation:
    es: "El artículo 29.1 la adscribe «al Ministerio de Igualdad o al departamento con competencias en la materia». El Ministerio del Interior y el de Inclusión, Seguridad Social y Migraciones no son el departamento que nombra la ley. La ley tampoco la sitúa en la Presidencia del Gobierno."
  citation: "art. 29.1 LO 1/2004"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2004-21760-art-29
- id: m03-l07-q032
  prompt:
    es: "¿Cuál de las siguientes funciones atribuye la Ley Orgánica 1/2004, de 28 de diciembre, de Medidas de Protección Integral contra la Violencia de Género a la Delegación del Gobierno contra la Violencia de Género?"
  options:
  - id: a
    text:
      es: "Coordinar las políticas de igualdad que adoptan los distintos departamentos ministeriales"
  - id: b
    text:
      es: "Dictar las órdenes de protección de las víctimas de violencia de género"
  - id: c
    text:
      es: "Velar por la igualdad de trato en el acceso al empleo y en las condiciones de trabajo"
  - id: d
    correct: true
    text:
      es: "Formular las políticas públicas sobre violencia de género que ha de desarrollar el Gobierno"
  explanation:
    es: "El artículo 29.1 dice que la Delegación «formulará las políticas públicas en relación con la violencia de género a desarrollar por el Gobierno». Coordinar las políticas de igualdad de los departamentos es función de la Comisión Interministerial de Igualdad (art. 76 de la Ley Orgánica 3/2007). Las órdenes de protección las dictan los jueces. Velar por la igualdad de trato en el empleo es tarea de la Inspección de Trabajo y Seguridad Social (art. 9.4 de la Ley 15/2022)."
  citation: "art. 29.1 LO 1/2004"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2004-21760-art-30
- id: m03-l07-q033
  prompt:
    es: "¿Qué naturaleza tiene el Observatorio Estatal de Violencia sobre la Mujer, según la Ley Orgánica 1/2004, de 28 de diciembre, de Medidas de Protección Integral contra la Violencia de Género?"
  options:
  - id: a
    text:
      es: "Es un organismo autónomo con personalidad jurídica propia"
  - id: b
    correct: true
    text:
      es: "Es un órgano colegiado adscrito a un departamento ministerial"
  - id: c
    text:
      es: "Es una entidad de derecho público independiente del Gobierno"
  - id: d
    text:
      es: "Es un órgano unipersonal con rango de dirección general"
  explanation:
    es: "El artículo 30.1 constituye el Observatorio «como órgano colegiado adscrito» a un Ministerio (la ley nombra el de Trabajo y Asuntos Sociales; hoy, el de Igualdad). No es un organismo autónomo ni tiene personalidad jurídica propia. La entidad de derecho público independiente es la Autoridad para la Igualdad de Trato de la Ley 15/2022. Tampoco es un órgano unipersonal."
  citation: "art. 30.1 LO 1/2004"
  difficulty: 2
  tags:
  - "órgano"
  - "concepto"
# anchor: boe-a-2004-21760-art-30
- id: m03-l07-q034
  prompt:
    es: "En materia de violencia de género, al Observatorio Estatal de Violencia sobre la Mujer le corresponde:"
  options:
  - id: a
    correct: true
    text:
      es: "El asesoramiento, la evaluación, la elaboración de informes y estudios y las propuestas de actuación"
  - id: b
    text:
      es: "La formulación de las políticas públicas sobre violencia de género y la elaboración de la Macroencuesta"
  - id: c
    text:
      es: "La coordinación de las políticas y medidas de igualdad adoptadas por los departamentos ministeriales"
  - id: d
    text:
      es: "La concesión de las ayudas sociales de pago único a las víctimas de violencia de género"
  explanation:
    es: "El artículo 30.1 de la Ley Orgánica 1/2004 le atribuye «el asesoramiento, evaluación, colaboración institucional, elaboración de informes y estudios, y propuestas de actuación en materia de violencia de género». Formular las políticas públicas y elaborar la Macroencuesta corresponde a la Delegación del Gobierno (art. 29.1). Coordinar las políticas de igualdad de los departamentos es de la Comisión Interministerial de Igualdad. Las ayudas sociales (art. 27) no las concede el Observatorio."
  citation: "art. 30.1 LO 1/2004"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2022-11589-art-2
- id: m03-l07-q035
  prompt:
    es: "Según el artículo 2.1 de la Ley 15/2022, de 12 de julio, integral para la igualdad de trato y la no discriminación, además de causas como el sexo, la edad o la discapacidad, nadie podrá ser discriminado por razón de:"
  options:
  - id: a
    text:
      es: "Cualquier otra condición que determine el Gobierno por real decreto"
  - id: b
    text:
      es: "Cualquier otra circunstancia que recojan los convenios colectivos"
  - id: c
    correct: true
    text:
      es: "Cualquier otra condición o circunstancia personal o social"
  - id: d
    text:
      es: "Cualquier otra condición que declare la Autoridad Independiente"
  explanation:
    es: "El artículo 2.1 cierra la lista con «cualquier otra condición o circunstancia personal o social». La lista queda abierta por la propia ley. No depende de que el Gobierno la amplíe por real decreto, de lo que digan los convenios colectivos ni de una declaración de la Autoridad Independiente."
  citation: "art. 2.1 Ley 15/2022"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2022-11589-art-9
- id: m03-l07-q036
  prompt:
    es: "Según el artículo 9.4 de la Ley 15/2022, de 12 de julio, integral para la igualdad de trato y la no discriminación, la Inspección de Trabajo y Seguridad Social deberá velar particularmente por la igualdad de trato:"
  options:
  - id: a
    text:
      es: "En el acceso a los bienes y servicios a disposición del público"
  - id: b
    text:
      es: "En la afiliación a organizaciones sindicales y empresariales"
  - id: c
    correct: true
    text:
      es: "En el acceso al empleo y en las condiciones de trabajo"
  - id: d
    text:
      es: "En la educación y en la formación profesional reglada"
  explanation:
    es: "El artículo 9.4 encarga a la Inspección velar particularmente por ese derecho «en el acceso al empleo y en las condiciones de trabajo». El acceso a bienes y servicios es otro ámbito de la ley que no se confía a la Inspección. La afiliación sindical y la educación tampoco son los ámbitos que nombra este apartado."
  citation: "art. 9.4 Ley 15/2022"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2022-11589-art-9
- id: m03-l07-q037
  prompt:
    es: "Según el artículo 9.4 de la Ley 15/2022, de 12 de julio, integral para la igualdad de trato y la no discriminación, ¿quién vela por la igualdad de trato y no discriminación en el ámbito del empleo público?"
  options:
  - id: a
    correct: true
    text:
      es: "La inspección general de servicios y los órganos equivalentes de las comunidades autónomas"
  - id: b
    text:
      es: "Los organismos competentes del Ministerio de Defensa y los de las comunidades autónomas"
  - id: c
    text:
      es: "Los servicios públicos de empleo, sus entidades colaboradoras y las agencias de colocación"
  - id: d
    text:
      es: "La Inspección de Trabajo y Seguridad Social, mediante sus planes específicos de igualdad"
  explanation:
    es: "El artículo 9.4 dice que «en el ámbito del empleo público, la misma se llevará a cabo por la inspección general de servicios y los órganos equivalentes de las comunidades autónomas». Los organismos del Ministerio de Defensa actúan en los centros y establecimientos militares. Los servicios públicos de empleo y las agencias de colocación tienen su propio deber en el artículo 9.3. La Inspección de Trabajo y Seguridad Social vela con carácter general, pero no en el empleo público."
  citation: "art. 9.4 Ley 15/2022"
  difficulty: 3
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2022-11589-art-41
- id: m03-l07-q039
  prompt:
    es: "¿Cuánto dura, según la Ley 15/2022, de 12 de julio, integral para la igualdad de trato y la no discriminación, el mandato de quien preside la Autoridad Independiente para la Igualdad de Trato y la No Discriminación?"
  options:
  - id: a
    text:
      es: "Cinco años, renovable una sola vez por otros cinco"
  - id: b
    correct: true
    text:
      es: "Cinco años, sin posibilidad de renovación"
  - id: c
    text:
      es: "Seis años, sin posibilidad de renovación"
  - id: d
    text:
      es: "Cuatro años, renovable por una sola vez"
  explanation:
    es: "El artículo 41.4 dice: «Su mandato será de cinco años sin posibilidad de renovación». El mandato de cinco años no admite renovación. Seis y cuatro años no son la duración que fija la ley."
  citation: "art. 41.4 Ley 15/2022"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2023-5366-art-1
- id: m03-l07-q040
  prompt:
    es: "Según el artículo 1.1 de la Ley 4/2023, de 28 de febrero, para la igualdad real y efectiva de las personas trans y para la garantía de los derechos de las personas LGTBI, la ley protege la igualdad de:"
  options:
  - id: a
    correct: true
    text:
      es: "Las personas lesbianas, gais, trans, bisexuales e intersexuales y sus familias"
  - id: b
    text:
      es: "Las personas trans, con exclusión de las demás personas LGTBI"
  - id: c
    text:
      es: "Las personas LGTBI de nacionalidad española mayores de dieciséis años"
  - id: d
    text:
      es: "Las personas LGTBI, con exclusión de sus familias"
  explanation:
    es: "El artículo 1.1 fija la finalidad de garantizar y promover la igualdad real y efectiva de las personas «lesbianas, gais, trans, bisexuales e intersexuales (en adelante, LGTBI), así como de sus familias». No se limita a las personas trans. La nacionalidad y la edad de dieciséis años son requisitos para pedir la rectificación registral (art. 43.1), no límites de la finalidad de la ley. Las familias están incluidas."
  citation: "art. 1.1 Ley 4/2023"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2023-5366-art-1
- id: m03-l07-q041
  prompt:
    es: "Conforme al artículo 1.3 de la Ley 4/2023, de 28 de febrero, para la igualdad real y efectiva de las personas trans y para la garantía de los derechos de las personas LGTBI, la ley regula además:"
  options:
  - id: a
    text:
      es: "El procedimiento para el reconocimiento de la condición de víctima de violencia de género"
  - id: b
    text:
      es: "El procedimiento y requisitos para adquirir la nacionalidad española por residencia"
  - id: c
    correct: true
    text:
      es: "El procedimiento y requisitos para la rectificación registral relativa al sexo y, en su caso, nombre"
  - id: d
    text:
      es: "El procedimiento para el cambio de apellidos de las personas inscritas en el Registro Civil"
  explanation:
    es: "El artículo 1.3 dice que la ley «regula el procedimiento y requisitos para la rectificación registral relativa al sexo y, en su caso, nombre de las personas, así como sus efectos». La condición de víctima de violencia de género se acredita según la Ley Orgánica 1/2004. La nacionalidad por residencia y el cambio de apellidos no son materias de esta ley."
  citation: "art. 1.3 Ley 4/2023"
  difficulty: 1
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-2023-5366-art-3
- id: m03-l07-q042
  prompt:
    es: "¿Cómo define la Ley 4/2023, de 28 de febrero, para la igualdad real y efectiva de las personas trans y para la garantía de los derechos de las personas LGTBI a la persona trans?"
  options:
  - id: a
    text:
      es: "Persona que ha obtenido la rectificación registral de la mención relativa al sexo"
  - id: b
    correct: true
    text:
      es: "Persona cuya identidad sexual no se corresponde con el sexo asignado al nacer"
  - id: c
    text:
      es: "Persona cuya expresión de género no coincide con los roles sociales de su sexo"
  - id: d
    text:
      es: "Persona nacida con características sexuales que no encajan en las nociones binarias"
  explanation:
    es: "El artículo 3.k) define a la persona trans como aquella «cuya identidad sexual no se corresponde con el sexo asignado al nacer». La ley no exige haber rectificado la mención registral para ser persona trans. La expresión de género es la manifestación que cada persona hace de su identidad sexual (art. 3.j). Las características sexuales que no encajan en las nociones de cuerpo masculino o femenino describen la intersexualidad (art. 3.g)."
  citation: "art. 3.k) Ley 4/2023"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2023-5366-art-5
- id: m03-l07-q043
  prompt:
    es: "Según el artículo 5.1 de la Ley 4/2023, de 28 de febrero, para la igualdad real y efectiva de las personas trans y para la garantía de los derechos de las personas LGTBI, los poderes públicos pondrán en valor:"
  options:
  - id: a
    text:
      es: "La diversidad en orientación sexual e identidad sexual de las personas mayores de edad, sin incluir la diversidad familiar"
  - id: b
    text:
      es: "La diversidad en expresión de género y características sexuales en el ámbito educativo, con exclusión de los demás ámbitos"
  - id: c
    text:
      es: "Los modelos de familia reconocidos en el Código Civil y la diversidad en orientación sexual de sus miembros"
  - id: d
    correct: true
    text:
      es: "La diversidad en orientación sexual, identidad sexual, expresión de género y características sexuales, y la diversidad familiar"
  explanation:
    es: "El artículo 5.1 pide poner en valor «la diversidad en materia de orientación sexual, identidad sexual, expresión de género y características sexuales y la diversidad familiar». La ley no limita esa diversidad a las personas mayores de edad ni deja fuera la diversidad familiar. Tampoco la reduce al ámbito educativo: habla de todos los ámbitos de la vida. No se refiere a los modelos de familia del Código Civil."
  citation: "art. 5.1 Ley 4/2023"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2023-5366-art-5
- id: m03-l07-q044
  prompt:
    es: "Según el artículo 5.2 de la Ley 4/2023, de 28 de febrero, para la igualdad real y efectiva de las personas trans y para la garantía de los derechos de las personas LGTBI, ¿qué fomentarán los poderes públicos?"
  options:
  - id: a
    text:
      es: "La elaboración de un censo oficial de las personas LGTBI residentes en territorio español, con su consentimiento expreso"
  - id: b
    text:
      es: "La declaración de un día festivo de ámbito nacional dedicado a la lucha por la igualdad de las personas LGTBI"
  - id: c
    text:
      es: "La reserva de un cupo de plazas para personas LGTBI en las ofertas de empleo público de todas las Administraciones"
  - id: d
    correct: true
    text:
      es: "El reconocimiento institucional y la participación en los actos conmemorativos de la lucha por la igualdad de las personas LGTBI"
  explanation:
    es: "El artículo 5.2 dice que los poderes públicos «fomentarán el reconocimiento institucional y la participación en los actos conmemorativos de la lucha por la igualdad real y efectiva de las personas LGTBI». La ley no prevé un censo de personas LGTBI. Tampoco la declaración de un día festivo nacional. La reserva de un cupo en las ofertas de empleo público existe para las personas con discapacidad (art. 42.2 del texto refundido), no para las personas LGTBI."
  citation: "art. 5.2 Ley 4/2023"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2023-5366-art-43
- id: m03-l07-q046
  prompt:
    es: "Las personas menores de dieciséis años y mayores de catorce pueden presentar la solicitud de rectificación de la mención registral del sexo:"
  options:
  - id: a
    text:
      es: "Por sí mismas, sin necesidad de asistencia de sus representantes legales"
  - id: b
    correct: true
    text:
      es: "Por sí mismas, asistidas en el procedimiento por sus representantes legales"
  - id: c
    text:
      es: "Solo por medio de sus representantes legales, que actúan en su nombre"
  - id: d
    text:
      es: "Solo mediante un expediente de autorización judicial de jurisdicción voluntaria"
  explanation:
    es: "El artículo 43.2 de la Ley 4/2023 dice que estas personas «podrán presentar la solicitud por sí mismas, asistidas en el procedimiento por sus representantes legales». Actuar sin asistencia corresponde a los mayores de dieciséis años (art. 43.1). La ley no exige que los representantes actúen en su nombre. La autorización judicial es la vía de los mayores de doce y menores de catorce años (art. 43.4)."
  citation: "art. 43.2 Ley 4/2023"
  difficulty: 3
