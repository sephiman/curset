# anchor: fuente-ms-edge-consola-javascript-html
- id: m02-l12-q264
  prompt:
    es: "En la Consola de DevTools de Microsoft Edge, ¿qué hay que escribir para poder pegar código tras la advertencia que aparece al intentarlo por primera vez?"
  options:
  - id: a
    text:
      es: "2+2, sin pulsar Entrar"
  - id: b
    correct: true
    text:
      es: "permitir pegar, y pulsar Entrar"
  - id: c
    text:
      es: "document. y pulsar Tab"
  - id: d
    text:
      es: "$_ y pulsar Entrar"
  explanation:
    es: "Para pegar código hay que escribir primero permitir pegar en la consola y pulsar Entrar. «2+2, sin pulsar Entrar» es el ejemplo con el que la consola muestra el resultado 4 mientras se escribe. «$_ y pulsar Entrar»: $_ contiene el resultado de la última expresión ejecutada. «document. y pulsar Tab» es el ejemplo con el que se prueba el autocompletado de expresiones de varias partes."
  citation: "fuente: `ms-edge-consola-javascript.html`; «Ejecución de JavaScript en la consola»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-edge-consola-javascript-html
- id: m02-l12-q265
  prompt:
    es: "¿Cuál de los siguientes tipos de ataques ayuda a evitar la advertencia que aparece al pegar contenido en la Consola de DevTools de Microsoft Edge?"
  options:
  - id: a
    text:
      es: "Los ataques de denegación de servicio (DoS) contra servidores web"
  - id: b
    text:
      es: "El envenenamiento del DNS (DNS spoofing)"
  - id: c
    correct: true
    text:
      es: "Los de scripting entre sitios (auto-XSS) contra usuarios"
  - id: d
    text:
      es: "El correo de suplantación (phishing)"
  explanation:
    es: "La advertencia ayuda a evitar los ataques de scripting entre sitios (auto-XSS) dirigidos a los usuarios finales. «El envenenamiento del DNS (DNS spoofing)» es el envenenamiento del DNS, que según INCIBE falsea la resolución de nombres y no tiene que ver con pegar código. «Los ataques de denegación de servicio (DoS) contra servidores web»: los ataques de denegación de servicio saturan servicios; la advertencia no los trata. «El correo de suplantación (phishing)»: el correo de suplantación se hace por mensajes que fingen ser legítimos; la advertencia trata del código pegado por el usuario."
  citation: "fuente: `ms-edge-consola-javascript.html`; «Ejecución de JavaScript en la consola»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-edge-consola-javascript-html
- id: m02-l12-q266
  prompt:
    es: "¿Qué característica de la Consola de DevTools de Microsoft Edge muestra el resultado de 2+2 antes de pulsar Entrar?"
  options:
  - id: a
    text:
      es: "La utilidad $_, que guarda el resultado de la expresión anterior"
  - id: b
    text:
      es: "El autocompletado de expresiones de varias partes"
  - id: c
    text:
      es: "El historial de comandos que se muestra con Flecha arriba"
  - id: d
    correct: true
    text:
      es: "La evaluación anticipada (Eager evaluation)"
  explanation:
    es: "La consola muestra el resultado mientras se escribe gracias a la evaluación anticipada, aunque el JavaScript no sea correcto. «El autocompletado de expresiones de varias partes» propone métodos y propiedades al escribir, pero no calcula el resultado. «El historial de comandos que se muestra con Flecha arriba» recupera los comandos escritos antes para reutilizarlos. «La utilidad $_, que guarda el resultado de la expresión anterior» guarda el resultado de la expresión anterior, ya ejecutada con Entrar."
  citation: "fuente: `ms-edge-consola-javascript.html`; «Ejecución de JavaScript en la consola»"
  difficulty: 2
  tags:
  - "concepto"
