m03-l03-q09:
  key:
    anchor: jep-506#Inheriting-scoped-values
    sentence: Code in a child thread can use bindings established for a scoped value in the parent thread with minimal overhead.
  wrong:
  - option: The binding is copied into the child thread when the child is created
    anchor: jep-506#Inheriting-scoped-values
    sentence: Unlike with thread-local variables, there is no copying of a parent thread's scoped value bindings to the child thread.
  - option: It cannot read the binding, because scoped values are not visible outside the thread that bound them
    anchor: jep-506#Inheriting-scoped-values
    sentence: Scoped values in the parent thread are automatically inherited by child threads created with StructuredTaskScope.
  - option: Only if the child runs in a `ForkJoinPool`, which supports scoped value inheritance
    anchor: jep-506#Inheriting-scoped-values
    sentence: Legacy thread management classes such as ForkJoinPool do not support inheritance of scoped values because they cannot guarantee that a child thread forked from some parent thread scope will exit before the parent leaves that scope.
m03-l03-q10:
  key:
    anchor: jep-506#Problems-with-thread-local-variables
    sentence: In particular, if a thread pool is used, the value of a thread-local variable set in one task could, if not properly cleared, accidentally leak into an unrelated task, potentially leading to dangerous security vulnerabilities.
  wrong:
  - option: The value is cleared automatically as soon as task A finishes
    anchor: jep-506#Problems-with-thread-local-variables
    sentence: Unbounded lifetime — Once a thread's copy of a thread-local variable is set via the set method, the value to which it was set is retained for the lifetime of the thread, or until code in the thread calls the remove method.
  - option: The value is garbage-collected once no code references the `ThreadLocal` object
    anchor: jep-506#Problems-with-thread-local-variables
    sentence: In addition, for programs that rely on the unconstrained mutability of thread-local variables, there may be no clear point at which it is safe for a thread to call remove; this can cause a long-term memory leak, since per-thread data will not be garbage-collected until the thread exits.
  - option: The value stays visible only to task A, because each task has its own copy
    anchor: javadoc-threadlocal#class-threadlocal-t
    sentence: These variables differ from their normal counterparts in that each thread that accesses one (via its get or set method) has its own, independently initialized copy of the variable.
