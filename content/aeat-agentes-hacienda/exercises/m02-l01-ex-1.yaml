# anchor: boe-a-1978-31229-art-97
- id: m02-l01-q0081
  prompt:
    es: "Señale la respuesta CORRECTA sobre el ejercicio de la función ejecutiva y de la potestad reglamentaria por el Gobierno, de acuerdo con el artículo 97 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "El Gobierno las ejerce de acuerdo con la Constitución y las instrucciones de las Cortes Generales."
  - id: b
    text:
      es: "El Gobierno las ejerce de acuerdo con las leyes y los reglamentos aprobados por las Comunidades Autónomas."
  - id: c
    correct: true
    text:
      es: "El Gobierno las ejerce de acuerdo con la Constitución y las leyes."
  - id: d
    text:
      es: "El Gobierno las ejerce de acuerdo con la Constitución, sin sujeción a las leyes ordinarias."
  explanation:
    es: "El artículo 97 somete la función ejecutiva y la potestad reglamentaria del Gobierno a la Constitución y a las leyes. Las Cortes Generales legislan, pero no dan instrucciones al Gobierno en ese ejercicio, los reglamentos autonómicos no son el límite, y las leyes ordinarias vinculan al Gobierno."
  citation: "art. 97 CE"
  difficulty: 1
  tags:
  - "potestad reglamentaria"
# anchor: boe-a-1889-4763-art-1
- id: m02-l01-q0085
  prompt:
    es: "De acuerdo con el artículo 1.1 del Real Decreto de 24 de julio de 1889 por el que se publica el Código Civil, las fuentes del ordenamiento jurídico español son:"
  options:
  - id: a
    text:
      es: "La ley, la costumbre y la jurisprudencia."
  - id: b
    text:
      es: "La ley, la jurisprudencia y los principios generales del derecho."
  - id: c
    correct: true
    text:
      es: "La ley, la costumbre y los principios generales del derecho."
  - id: d
    text:
      es: "La ley, los tratados internacionales y los principios generales del derecho."
  explanation:
    es: "El artículo 1.1 enumera tres fuentes: la ley, la costumbre y los principios generales del derecho. La jurisprudencia no es fuente, sino que complementa el ordenamiento (art. 1.6), y los tratados internacionales solo se aplican directamente cuando se publican en el Boletín Oficial del Estado (art. 1.5)."
  citation: "art. 1.1 Código Civil"
  difficulty: 1
  tags:
  - "fuentes"
# anchor: boe-a-2015-10565-art-128
- id: m02-l01-q0006
  prompt:
    es: "De acuerdo con el artículo 128.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las disposiciones administrativas:"
  options:
  - id: a
    text:
      es: "Se ajustarán al orden de jerarquía que fije el Consejo de Ministros."
  - id: b
    text:
      es: "Se ajustarán al orden que fije cada Ministerio."
  - id: c
    correct: true
    text:
      es: "Se ajustarán al orden de jerarquía que establezcan las leyes."
  - id: d
    text:
      es: "Se ajustarán al orden de jerarquía que establezcan sus propios preámbulos."
  explanation:
    es: "El artículo 128.3 dice que las disposiciones administrativas «se ajustarán al orden de jerarquía que establezcan las leyes». El orden no lo fija el Consejo de Ministros ni cada Administración Pública, y menos el preámbulo de cada disposición: lo fijan las leyes, como hace el artículo 24.2 de la Ley 50/1997 para los reglamentos del Estado."
  citation: "art. 128.3 LPAC"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1997-25336-art-24
- id: m02-l01-q0007
  prompt:
    es: "Según el artículo 24.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, los reglamentos se ordenarán según la siguiente jerarquía:"
  options:
  - id: a
    correct: true
    text:
      es: "1.º Real Decreto del Presidente del Gobierno o acordado en Consejo de Ministros; 2.º Orden Ministerial."
  - id: b
    text:
      es: "1.º Orden Ministerial; 2.º Real Decreto del Presidente del Gobierno o acordado en Consejo de Ministros."
  - id: c
    text:
      es: "1.º Real Decreto del Presidente del Gobierno; 2.º Real Decreto acordado en Consejo de Ministros; 3.º Orden."
  - id: d
    text:
      es: "1.º Real Decreto acordado en Consejo de Ministros; 2.º Real Decreto del Presidente; 3.º Orden Ministerial."
  explanation:
    es: "El artículo 24.2 tiene dos escalones: «1.º Disposiciones aprobadas por Real Decreto del Presidente del Gobierno o acordado en el Consejo de Ministros. 2.º Disposiciones aprobadas por Orden Ministerial». La opción que pone primero la Orden Ministerial invierte el orden. Las dos opciones de tres escalones separan los dos tipos de Real Decreto, que el artículo sitúa en el mismo rango."
  citation: "art. 24.2 Ley 50/1997"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2015-10565-art-128
- id: m02-l01-q0031
  prompt:
    es: "De acuerdo con el artículo 128.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el ejercicio de la potestad reglamentaria corresponde:"
  options:
  - id: a
    text:
      es: "Solo al Gobierno de la Nación y a los órganos de Gobierno de las Comunidades Autónomas."
  - id: b
    correct: true
    text:
      es: "Al Gobierno de la Nación, a los órganos de Gobierno autonómicos y a los órganos de gobierno locales."
  - id: c
    text:
      es: "Al Gobierno de la Nación, a las Cortes Generales y a las Asambleas Legislativas autonómicas."
  - id: d
    text:
      es: "Al Gobierno de la Nación y a los órganos de gobierno locales, pero no a las Comunidades Autónomas."
  explanation:
    es: "El artículo 128.1 atribuye la potestad reglamentaria «al Gobierno de la Nación, a los órganos de Gobierno de las Comunidades Autónomas […] y a los órganos de gobierno locales». La opción que la limita al Estado y a las Comunidades Autónomas deja fuera a los entes locales; la que excluye a las Comunidades Autónomas deja fuera a sus Gobiernos. Las Cortes y las Asambleas Legislativas ejercen la potestad legislativa, no la reglamentaria."
  citation: "art. 128.1 LPAC"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10565-art-128
- id: m02-l01-q0032
  prompt:
    es: "¿De conformidad con qué ejercen la potestad reglamentaria los órganos de Gobierno de las Comunidades Autónomas, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "De conformidad con la Ley 7/1985, reguladora de las Bases del Régimen Local."
  - id: b
    text:
      es: "De conformidad con lo que disponga el Gobierno de la Nación."
  - id: c
    text:
      es: "De conformidad con las leyes de bases que aprueben las Cortes Generales."
  - id: d
    correct: true
    text:
      es: "De conformidad con lo establecido en sus respectivos Estatutos."
  explanation:
    es: "El artículo 128.1 dice que la potestad reglamentaria corresponde a los órganos de Gobierno de las Comunidades Autónomas «de conformidad con lo establecido en sus respectivos Estatutos». La Ley 7/1985 es la referencia de los órganos de gobierno locales. El Gobierno de la Nación no fija el marco de la potestad autonómica, y las leyes de bases son leyes de delegación en el Gobierno de la Nación."
  citation: "art. 128.1 LPAC"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-24
- id: m02-l01-q0036
  prompt:
    es: "Según el artículo 24.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿qué forma revisten los acuerdos de una Comisión Delegada del Gobierno cuando la competencia corresponde a distintos Ministros?"
  options:
  - id: a
    text:
      es: "Real Decreto acordado en Consejo de Ministros, a propuesta de los Ministros interesados."
  - id: b
    text:
      es: "Orden conjunta de todos los Ministros competentes por razón de la materia."
  - id: c
    text:
      es: "Acuerdo de la Comisión Delegada, firmado por el Presidente del Gobierno."
  - id: d
    correct: true
    text:
      es: "Orden del Ministro de la Presidencia, Justicia y Relaciones con las Cortes."
  explanation:
    es: "El artículo 24.1.e) dice que esos acuerdos revisten «la forma de Orden del Ministro competente o del Ministro de la Presidencia, cuando la competencia corresponda a distintos Ministros». Hoy ese Ministro es el de la Presidencia, Justicia y Relaciones con las Cortes (art. 3.1 RD 829/2023). La ley no prevé una orden conjunta de varios Ministros, ni la forma de Real Decreto, ni un acuerdo firmado por el Presidente."
  citation: "art. 24.1.e) Ley 50/1997"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2015-10565-art-128
- id: m02-l01-q0039
  prompt:
    es: "Según el artículo 128.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los reglamentos y disposiciones administrativas no podrán:"
  options:
  - id: a
    text:
      es: "Desarrollar las leyes que les sirven de habilitación."
  - id: b
    correct: true
    text:
      es: "Establecer tributos, exacciones parafiscales u otras prestaciones patrimoniales de carácter público."
  - id: c
    text:
      es: "Colaborar con la ley en la regulación de una materia."
  - id: d
    text:
      es: "Regular aspectos parciales de una materia ya regulada por ley."
  explanation:
    es: "El artículo 128.2 dice que los reglamentos no podrán «establecer penas o sanciones, así como tributos, exacciones parafiscales u otras cargas o prestaciones personales o patrimoniales de carácter público». El mismo apartado salva «su función de desarrollo o colaboración con respecto a la ley», así que desarrollar la ley, colaborar con ella y regular aspectos parciales dentro de ese marco son tareas propias del reglamento."
  citation: "art. 128.2 LPAC"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-128
- id: m02-l01-q0040
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los límites de los reglamentos es correcta según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Pueden establecer sanciones cuando la ley que desarrollan no las prevea."
  - id: b
    text:
      es: "Pueden tipificar infracciones administrativas si se aprueban por Real Decreto."
  - id: c
    text:
      es: "Pueden establecer tributos si lo autoriza una Orden Ministerial."
  - id: d
    correct: true
    text:
      es: "No pueden tipificar delitos, faltas o infracciones administrativas."
  explanation:
    es: "El artículo 128.2 dice que los reglamentos «no podrán tipificar delitos, faltas o infracciones administrativas, establecer penas o sanciones, así como tributos». La prohibición no depende del rango: tampoco un Real Decreto puede tipificar infracciones. Que la ley no prevea sanciones no habilita al reglamento para crearlas, y una Orden Ministerial no puede autorizar tributos."
  citation: "art. 128.2 LPAC"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-128
- id: m02-l01-q0041
  prompt:
    es: "Según el artículo 128.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué materias quedan fuera del alcance de los reglamentos?"
  options:
  - id: a
    text:
      es: "Las que no hayan sido objeto de consulta pública previa."
  - id: b
    text:
      es: "Las que regulen solo aspectos parciales de una materia."
  - id: c
    correct: true
    text:
      es: "Las que la Constitución o los Estatutos reconocen de la competencia de los Parlamentos."
  - id: d
    text:
      es: "Las que no figuren en el Plan Anual Normativo del año en curso."
  explanation:
    es: "El artículo 128.2 dice que los reglamentos no podrán «regular aquellas materias que la Constitución o los Estatutos de Autonomía reconocen de la competencia de las Cortes Generales o de las Asambleas Legislativas de las Comunidades Autónomas». La consulta pública puede omitirse en ciertos casos (art. 26.2 Ley 50/1997) y su falta no saca una materia del alcance del reglamento. Regular aspectos parciales de una materia solo permite omitir la consulta pública (art. 26.2.e Ley 50/1997). El Plan Anual Normativo no delimita qué puede regular un reglamento."
  citation: "art. 128.2 LPAC"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m02-l01-q0082
  prompt:
    es: "Según el artículo 149.3 de la Constitución Española de 1978, las normas del Estado prevalecerán, en caso de conflicto, sobre las de las Comunidades Autónomas en todo lo que:"
  options:
  - id: a
    correct: true
    text:
      es: "No esté atribuido a la exclusiva competencia de estas."
  - id: b
    text:
      es: "No esté atribuido a la competencia compartida del Estado y de estas."
  - id: c
    text:
      es: "Esté atribuido a la exclusiva competencia de estas."
  - id: d
    text:
      es: "No haya sido asumido por los Estatutos de Autonomía en materia de legislación básica."
  explanation:
    es: "El artículo 149.3 hace prevalecer las normas estatales sobre las autonómicas en todo lo que no esté atribuido a la exclusiva competencia de las Comunidades Autónomas. Lo atribuido a su competencia exclusiva queda fuera de esa regla, y el precepto no se refiere ni a la competencia compartida ni a la legislación básica."
  citation: "art. 149.3 CE"
  difficulty: 2
  tags:
  - "conflicto de normas"
  - "Estado y Comunidades Autónomas"
# anchor: boe-a-1978-31229-art-149
- id: m02-l01-q0083
  prompt:
    es: "De acuerdo con el artículo 149.3 de la Constitución Española de 1978, el derecho estatal, en relación con el derecho de las Comunidades Autónomas, será en todo caso:"
  options:
  - id: a
    text:
      es: "Prevalente sobre el derecho de las Comunidades Autónomas, sin excepción."
  - id: b
    text:
      es: "Supletorio solo cuando el Estatuto de Autonomía lo disponga."
  - id: c
    text:
      es: "Supletorio únicamente en las materias de competencia exclusiva del Estado."
  - id: d
    correct: true
    text:
      es: "Supletorio del derecho de las Comunidades Autónomas."
  explanation:
    es: "El artículo 149.3 declara el derecho estatal supletorio del autonómico en todo caso, es decir, sin condicionarlo a lo que diga el Estatuto ni limitarlo a las materias exclusivas del Estado. La prevalencia sin excepción contradice la reserva de la competencia exclusiva de las Comunidades Autónomas."
  citation: "art. 149.3 CE"
  difficulty: 2
  tags:
  - "conflicto de normas"
  - "supletoriedad"
# anchor: boe-a-1889-4763-art-1
- id: m02-l01-q0086
  prompt:
    es: "Señale la respuesta CORRECTA sobre la validez de las disposiciones que contradicen otras, de acuerdo con el artículo 1.2 del Real Decreto de 24 de julio de 1889 por el que se publica el Código Civil:"
  options:
  - id: a
    text:
      es: "Carecerán de validez las disposiciones que contradigan otra de rango inferior."
  - id: b
    correct: true
    text:
      es: "Carecerán de validez las disposiciones que contradigan otra de rango superior."
  - id: c
    text:
      es: "Carecerán de validez las disposiciones que contradigan otra posterior, aunque sea de igual rango."
  - id: d
    text:
      es: "Carecerán de validez las disposiciones que no hayan sido publicadas íntegramente en el diario oficial."
  explanation:
    es: "El artículo 1.2 priva de validez a las disposiciones que contradigan otra de rango superior. Contradecir una de rango inferior no tiene ese efecto. La contradicción con una posterior de igual rango se resuelve por la regla de la derogación de las leyes posteriores (art. 2.2), no por falta de validez, y la publicación es requisito de eficacia, no de validez en este precepto."
  citation: "art. 1.2 Código Civil"
  difficulty: 1
  tags:
  - "jerarquía normativa"
