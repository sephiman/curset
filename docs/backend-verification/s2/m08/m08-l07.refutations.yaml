    exclusive: true
  - option: '11:00'
    anchor: kafka-streams-dsl-api#window-final-results
    sentence: the 09:00 to 10:00 window will accept out-of-order records until 10:10, at which point, the window is closed.
    exclusive: true
m08-l07-q04:
  key:
    anchor: flink-time#event-time-and-watermarks
    sentence: A Watermark(t) declares that event time has reached time t in that stream, meaning that there should be no more elements from the stream with a timestamp t’ <= t
  wrong:
  - option: The wall clock of the machine has reached t, so processing of earlier elements has finished
    anchor: flink-time#event-time-and-watermarks
    sentence: Event time can progress independently of processing time (measured by wall clocks).
  - option: No element with a timestamp at or below t can ever arrive again, and Flink guarantees it
    anchor: flink-time#lateness
    sentence: It is possible that certain elements will violate the watermark condition
  - option: The operator has received exactly t elements since the previous watermark
    anchor: flink-time#event-time-and-watermarks
    sentence: In general a watermark is a declaration that by that point in the stream, all events up to a certain timestamp should have arrived.
m08-l07-q05:
  key:
    anchor: flink-time#watermarks-in-parallel-streams
    sentence: Such an operator’s current event time is the minimum of its input streams’ event times.
  wrong:
  - option: The maximum of its input streams' event times
    anchor: flink-time#watermarks-in-parallel-streams
    sentence: Such an operator’s current event time is the minimum of its input streams’ event times.
    exclusive: true
  - option: The average of its input streams' event times
    anchor: flink-time#watermarks-in-parallel-streams
    sentence: Such an operator’s current event time is the minimum of its input streams’ event times.
    exclusive: true
  - option: The event time of the input stream that delivered a watermark last
    anchor: flink-time#watermarks-in-parallel-streams
    sentence: Such an operator’s current event time is the minimum of its input streams’ event times.
    exclusive: true
m08-l07-q06:
  key:
    anchor: kafka-streams-dsl-api#kstream
    sentence: If your stream processing application were to sum the values per user, it would return 4 for alice.
  wrong:
  - option: '3'
    anchor: kafka-streams-dsl-api#kstream
    sentence: Why? Because the second data record would not be considered an update of the previous record.
  - option: '1'
    anchor: kafka-streams-dsl-api#kstream
    sentence: If your stream processing application were to sum the values per user, it would return 4 for alice.
    exclusive: true
  - option: '7'
    anchor: kafka-streams-dsl-api#kstream
    sentence: If your stream processing application were to sum the values per user, it would return 4 for alice.
    exclusive: true
m08-l07-q07:
  key:
    anchor: kafka-streams-dsl-api#join-co-partitioning-requirements
    sentence: The input topics of the join (left side and right side) must have the same number of partitions.
  wrong:
  - option: Kafka Streams verifies at runtime that the partitioning strategy of both sides matches
    anchor: kafka-streams-dsl-api#join-co-partitioning-requirements
    sentence: Note that Kafka Streams cannot verify whether the partitioning strategy matches between the input streams/tables of a join
  - option: A `KTable`-`KTable` foreign-key join needs co-partitioned inputs like any other join
    anchor: kafka-streams-dsl-api#join-co-partitioning-requirements
    sentence: KTable-KTable Foreign-Key joins also do not require co-partitioning.
  - option: A `KStream`-`GlobalKTable` join needs co-partitioning, because each instance holds only some partitions
    anchor: kafka-streams-dsl-api#join-co-partitioning-requirements
    sentence: That is, each instance has a full copy of the changelog stream.
m08-l07-q08:
  key:
    anchor: kafka-streams-architecture#stream-partitions-and-tasks
    sentence: the “excess” app instances will launch but remain idle
  wrong:
  - option: They share the partitions with the others by reading parts of each partition
    anchor: kafka-streams-architecture#stream-partitions-and-tasks
    sentence: The assignment of partitions to tasks never changes so that each task is a fixed unit of parallelism of the application.
  - option: Kafka Streams refuses to start them and throws an exception
    anchor: kafka-streams-architecture#stream-partitions-and-tasks
    sentence: the “excess” app instances will launch but remain idle
  - option: Kafka Streams adds partitions to the input topic so that they have work
    anchor: kafka-streams-architecture#stream-partitions-and-tasks
    sentence: Kafka Streams creates a fixed number of tasks based on the input stream partitions for the application
