# anchor: fuente-ms-excel-formato-fecha-html
- id: m06-l05-q111
  prompt:
    es: "En una hoja de Excel 365 en idioma español, se escribe 2/2 en una celda sin formato. ¿Cuál de las siguientes opciones describe cómo la trata Excel?"
  options:
  - id: a
    correct: true
    text:
      es: "Asume que es una fecha y le aplica el formato de fecha predeterminado del Panel de control"
  - id: b
    text:
      es: "Asume que es una fracción y la muestra como número decimal en la celda"
  - id: c
    text:
      es: "La deja como texto, sin aplicar ningún formato de fecha ni de número"
  - id: d
    text:
      es: "Asume que es una fecha y le aplica el formato elegido en Archivo › Opciones › Avanzadas"
  explanation:
    es: "La página dice que, al escribir 2/2, Excel asume que es una fecha y le aplica el formato según la configuración de fecha predeterminada del Panel de control. Por eso no es una fracción ni texto, y el formato no sale de Opciones avanzadas."
  citation: "fuente: `ms-excel-formato-fecha.html`; «Aplicar formato a una fecha como quiera en Excel»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-formato-fecha-html
- id: m06-l05-q112
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones indica lo que significa un asterisco (*) al comienzo de un formato de fecha de la lista Tipo?"
  options:
  - id: a
    text:
      es: "Que el formato no cambia aunque se modifique la configuración regional del sistema"
  - id: b
    text:
      es: "Que es un formato personalizado creado por el usuario en Personalizado"
  - id: c
    text:
      es: "Que el formato incluye también valores de hora además de la fecha"
  - id: d
    correct: true
    text:
      es: "Que el formato cambia si cambia la configuración regional del Panel de control"
  explanation:
    es: "Los formatos con asterisco cambian si cambia la configuración regional de fecha y hora del Panel de control, y los que no lo llevan no cambian. Los formatos de la lista son los integrados, y los personalizados se crean en la categoría Personalizado."
  citation: "fuente: `ms-excel-formato-fecha.html`; «Elegir en una lista de formatos de fecha»"
  difficulty: 2
  tags:
  - "concepto"
  - "configuración"
# anchor: fuente-ms-excel-formato-fecha-html
- id: m06-l05-q113
  prompt:
    es: "En Excel 365, tras seleccionar las celdas y pulsar Ctrl+1, ¿cuál de las siguientes secuencias elige un formato de fecha de la lista?"
  options:
  - id: a
    text:
      es: "Pestaña Número, categoría Fecha y, en Muestra, el formato deseado"
  - id: b
    text:
      es: "Pestaña Protección, categoría Fecha y, en Tipo, el formato deseado"
  - id: c
    correct: true
    text:
      es: "Pestaña Número, categoría Fecha y, en Tipo, el formato deseado"
  - id: d
    text:
      es: "Pestaña Alineación, categoría Fecha y, en Tipo, el formato deseado"
  explanation:
    es: "En Formato de celdas se elige la pestaña Número, la categoría Fecha y, en Tipo, un formato de fecha. El cuadro Muestra solo enseña la vista previa con una fecha de los datos, y la pestaña Número es la que contiene las categorías de formato."
  citation: "fuente: `ms-excel-formato-fecha.html`; «En Tipo, elija un formato de fecha. Se verá una vista previa de su formato en el cuadro Muestra, con la primera fecha de sus datos.»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-funcion-dia-html
- id: m06-l05-q114
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones describe cómo almacena Excel internamente las fechas para poder usarlas en cálculos?"
  options:
  - id: a
    correct: true
    text:
      es: "Como números de serie secuenciales"
  - id: b
    text:
      es: "Como texto con el formato día-mes-año"
  - id: c
    text:
      es: "Como tres números independientes: día, mes y año"
  - id: d
    text:
      es: "Como el número de días transcurridos desde el 1 de enero de 2000"
  explanation:
    es: "Excel almacena las fechas como números de serie secuenciales; por defecto el 1 de enero de 1900 es el número de serie 1, no el año 2000. La página incluso advierte de que escribir las fechas como texto puede dar problemas."
  citation: "fuente: `ms-excel-funcion-dia.html`; «Observaciones»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-funcion-dia-html
- id: m06-l05-q115
  prompt:
    es: "En Excel 365, el número de serie que corresponde por defecto a la fecha 1 de enero de 1900 es:"
  options:
  - id: a
    text:
      es: "0"
  - id: b
