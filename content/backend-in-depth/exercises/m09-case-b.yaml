# Generated by docs/backend-verification/s2/tools/build_case.py from m09-case-b.questions.json.
type: case
title:
  en: Booking and inventory under high contention
scenario:
  en: 'A ticketing company sells seats for a stadium concert. When sales open, tens of thousands of users compete
    for the same few thousand seats within minutes. The seats and bookings live in a PostgreSQL database, and the
    same seat must never be sold twice.


    Users first hold a seat for a few minutes and then pay. The hold runs in a short transaction that selects the
    seat row and marks it taken. Several teams argue about how to write that transaction:


    - Use explicit row-level locks with `SELECT … FOR UPDATE`, with or without `NOWAIT` or `SKIP LOCKED`, so competing
    holds do not wait for each other for long.

    - Run the transactions at `REPEATABLE READ` or `SERIALIZABLE` and retry on failure, instead of locking by hand.

    - Guard a room or a whole event with a Redis distributed lock where a database lock is not enough.


    Mobile clients time out and retry, so the booking endpoints must be safe to repeat. The API accepts an `Idempotency-Key`
    header on `POST /bookings`, and the team needs to decide which HTTP status codes answer a repeated, a conflicting
    and an incomplete request.'
questions:
- id: m09-case-b-q01
  lesson: m09-l04
  prompt:
    en: A seat-hold query runs `SELECT … FOR UPDATE` in PostgreSQL, and a selected seat row is already locked by
      another transaction. Which clause makes the statement report an error rather than wait for that row?
  options:
  - id: a
    text:
      en: '`SKIP LOCKED`'
  - id: b
    correct: true
    text:
      en: '`NOWAIT`'
  - id: c
    text:
      en: '`FOR SHARE`'
  - id: d
    text:
      en: '`FOR KEY SHARE`'
  explanation:
    en: With `NOWAIT`, the statement reports an error rather than waiting if a selected row cannot be locked immediately.
      `SKIP LOCKED` is wrong, because it skips the rows that cannot be locked immediately instead of reporting an
      error. `FOR SHARE` is wrong, because a shared lock blocks other transactions from `UPDATE`, `DELETE` and `SELECT
      FOR UPDATE` on those rows. `FOR KEY SHARE` is wrong, because it is only a weaker lock under which `SELECT
      FOR UPDATE` is blocked.
  citation: pg-sql-select#SQL-FOR-UPDATE-SHARE
- id: m09-case-b-q03
  lesson: m09-l04
  prompt:
    en: A PostgreSQL booking transaction takes row-level locks with `SELECT … FOR UPDATE` and later rolls back to
      a savepoint it created before taking them. According to the documentation, when are row-level locks released?
  options:
  - id: a
    correct: true
    text:
      en: At transaction end or during savepoint rollback
  - id: b
    text:
      en: When the `SELECT` statement that took them finishes
  - id: c
    text:
      en: Only when the database connection is closed
  - id: d
    text:
      en: After a lock timeout that the application configures
  explanation:
    en: Row-level locks are released at transaction end or during savepoint rollback, just like table-level locks.
      Release at statement end is wrong, because row-level locks are released at transaction end or during savepoint
      rollback. Release on connection close is wrong, because row-level locks are released at transaction end or
      during savepoint rollback. Release after a timeout is wrong, because row-level locks are released at transaction
      end or during savepoint rollback.
  citation: pg-explicit-locking#LOCKING-ROWS
- id: m09-case-b-q05
  lesson: m09-l04
  prompt:
    en: A reservation service runs its transactions at `SERIALIZABLE` in PostgreSQL to prevent double booking. Which
      statement about the blocking behaviour of `SERIALIZABLE` in the documentation is correct?
  options:
  - id: a
    correct: true
    text:
      en: Its monitoring adds no blocking beyond what repeatable read already has
  - id: b
    text:
      en: Its predicate locks block other transactions and can cause deadlocks
  - id: c
    text:
      en: It needs no retries, because conflicts are resolved by waiting
  - id: d
    text:
      en: It enforces serializability by locking every row the transaction reads
  explanation:
    en: The monitoring done by `SERIALIZABLE` does not introduce any blocking beyond that present in repeatable
      read. Blocking predicate locks are wrong, because in PostgreSQL predicate locks do not cause any blocking
      and cannot cause a deadlock. Resolving conflicts by waiting is wrong, because applications using `SERIALIZABLE`
      must be prepared to retry transactions after serialization failures. Locking every row read is wrong, because
      PostgreSQL guarantees true serializability with predicate locking.
  citation: pg-transaction-iso#XACT-SERIALIZABLE
- id: m09-case-b-q06
  lesson: m09-l04
  prompt:
    en: A booking API exposes `POST /bookings`, `PATCH /bookings/{id}`, `PUT /bookings/{id}` and `DELETE /bookings/{id}`.
      Per RFC 9110, as cited by the IETF idempotency-key draft, which methods are NOT idempotent?
  options:
  - id: a
    correct: true
    text:
      en: '`POST` and `PATCH`'
  - id: b
    text:
      en: '`PUT` and `DELETE`'
  - id: c
    text:
      en: '`GET` and `HEAD`'
  - id: d
    text:
      en: '`OPTIONS` and `DELETE`'
  explanation:
    en: RFC 9110 makes `POST` and `PATCH` the non-idempotent methods. `PUT` and `DELETE` are wrong, because RFC
      9110 lists `PUT` and `DELETE` among the idempotent methods. `GET` and `HEAD` are wrong, because RFC 9110 lists
      them among the idempotent methods. `OPTIONS` and `DELETE` are wrong, because RFC 9110 lists both among the
      idempotent methods.
  citation: ietf-httpapi-idempotency-key#content
- id: m09-case-b-q07
  lesson: m09-l04
  prompt:
    en: A client retries `POST /bookings` with the same `Idempotency-Key` while the first request with that key
      is still being processed. Which HTTP status code SHOULD the resource reply with, according to the IETF draft?
  options:
  - id: a
    text:
      en: '`400`'
  - id: b
    text:
      en: '`422`'
  - id: c
    correct: true
    text:
      en: '`409`'
  - id: d
    text:
      en: '`503`'
  explanation:
    en: The resource SHOULD reply with `409` when a request is retried while the original is still being processed.
      `400` is wrong, because that code is for an `Idempotency-Key` header missing on an operation that requires
      it. `422` is wrong, because that code is for reusing an idempotency key with a different request payload.
      `503` is wrong, because the draft says the resource SHOULD reply with `409` to such a retry.
  citation: ietf-httpapi-idempotency-key#content
- id: m09-case-b-q10
  lesson: m09-l04
  prompt:
    en: A booking query uses `SELECT … FOR UPDATE NOWAIT` in PostgreSQL. Besides the row-level locks, which lock
      is still taken in the ordinary way, waiting when necessary?
  options:
  - id: a
    text:
      en: The row-level lock on each selected row
  - id: b
    correct: true
    text:
      en: The `ROW SHARE` table-level lock
  - id: c
    text:
      en: An `ACCESS EXCLUSIVE` table-level lock
  - id: d
    text:
      en: A `SHARE` table-level lock
  explanation:
    en: '`NOWAIT` and `SKIP LOCKED` apply only to the row-level locks, so the required `ROW SHARE` table-level lock
      is still taken in the ordinary way. The row-level lock is wrong, because with `NOWAIT` the statement reports
      an error instead of waiting for a row it cannot lock. `ACCESS EXCLUSIVE` is wrong, because the required table-level
      lock is `ROW SHARE`. `SHARE` is wrong, because the required table-level lock is `ROW SHARE`.'
  citation: pg-sql-select#SQL-FOR-UPDATE-SHARE
- id: m09-case-b-q11
  lesson: m09-l04
  prompt:
    en: A booking transaction running at `READ COMMITTED` in PostgreSQL must keep a whole table consistent against
      concurrent changes. According to the documentation, what may such a transaction need to take out?
  options:
  - id: a
    text:
      en: A predicate lock that blocks the conflicting writers
  - id: b
    text:
      en: A row-level lock released at the end of each statement
  - id: c
    correct: true
    text:
      en: A lock on the entire table
  - id: d
    text:
      en: A shared lock that lets other transactions update the rows
  explanation:
    en: A `READ COMMITTED` or `REPEATABLE READ` transaction that wants to ensure data consistency may need to take
      out a lock on an entire table. A blocking predicate lock is wrong, because in PostgreSQL predicate locks do
      not cause any blocking. Statement-scoped row locks are wrong, because row-level locks are released at transaction
      end or during savepoint rollback. A shared lock allowing updates is wrong, because a shared lock blocks other
      transactions from `UPDATE` and `DELETE` on those rows.
  citation: pg-transaction-iso#XACT-SERIALIZABLE
- id: m09-case-b-q13
  lesson: m09-l04
  prompt:
    en: A seat-hold query runs `SELECT … FOR UPDATE LIMIT 2` with no `OFFSET` in PostgreSQL, and 10 rows match the
      condition. According to the documentation, how many rows does the query lock?
  options:
  - id: a
    text:
      en: '10'
  - id: b
    correct: true
    text:
      en: '2'
  - id: c
    text:
      en: '5'
  - id: d
    text:
      en: '1'
  explanation:
    en: If a `LIMIT` is used, locking stops once enough rows have been returned to satisfy the limit, so 2 rows
      are locked. Locking 10 rows is wrong, because locking stops once enough rows have been returned. Locking 5
      rows is wrong for the same reason, since the limit of 2 rows has been satisfied by then. Locking only 1 row
      is wrong, because locking continues until enough rows have been returned to satisfy the limit.
  citation: pg-sql-select#SQL-FOR-UPDATE-SHARE
- id: m09-case-b-q14
  lesson: m09-l04
  prompt:
    en: In PostgreSQL, a team tries several seat queries with a locking clause. Which of these queries cannot use
      `FOR UPDATE`, because the returned rows cannot be identified with individual table rows?
  options:
  - id: a
    text:
      en: '`SELECT * FROM seats WHERE id = 7 FOR UPDATE`'
  - id: b
    text:
      en: '`SELECT * FROM seats FOR UPDATE SKIP LOCKED LIMIT 1`'
  - id: c
    text:
      en: '`SELECT * FROM seats FOR UPDATE NOWAIT`'
  - id: d
    correct: true
    text:
      en: '`SELECT count(*) FROM seats FOR UPDATE`'
  explanation:
    en: The locking clauses cannot be used where returned rows cannot be clearly identified with individual table
      rows, for example with aggregation. The query on one seat is wrong, because `FOR UPDATE` locks the rows retrieved
      by the `SELECT` statement. The `SKIP LOCKED` query is wrong, because with `SKIP LOCKED` rows that cannot be
      locked immediately are skipped and the rest are locked. The `NOWAIT` query is wrong, because with `NOWAIT`
      the statement reports an error if a selected row cannot be locked immediately.
  citation: pg-sql-select#SQL-FOR-UPDATE-SHARE
- id: m09-case-b-q15
  lesson: m09-l04
  prompt:
    en: A PostgreSQL booking transaction replaces `FOR NO KEY UPDATE` with `FOR SHARE` on the rows it retrieves.
      What does `FOR SHARE` change about the lock on each retrieved row?
  options:
  - id: a
    text:
      en: It lets another transaction run `SELECT FOR UPDATE` on those rows
  - id: b
    text:
      en: It releases the lock at the end of the statement
  - id: c
    text:
      en: It blocks plain `SELECT` queries on those rows
  - id: d
    correct: true
    text:
      en: It acquires a shared lock rather than an exclusive lock
  explanation:
    en: '`FOR SHARE` behaves like `FOR NO KEY UPDATE`, except that it acquires a shared lock rather than an exclusive
      lock on each retrieved row. Letting `SELECT FOR UPDATE` run is wrong, because a shared lock blocks other transactions
      from `SELECT FOR UPDATE` on these rows. Release at statement end is wrong, because row-level locks are released
      at transaction end or during savepoint rollback. Blocking plain queries is wrong, because row-level locks
      block only writers and lockers to the same row.'
  citation: pg-explicit-locking#LOCKING-ROWS
