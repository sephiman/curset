# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q140
  prompt:
    es: "Conforme al artículo 149.3 de la Constitución Española de 1978, la competencia sobre las materias que no se hayan asumido por los Estatutos de Autonomía corresponde:"
  options:
  - id: a
    text:
      es: "A las Comunidades Autónomas, cuyas normas prevalecen, en caso de conflicto, sobre las del Estado en todo lo que no esté atribuido a la exclusiva competencia de éste."
  - id: b
    correct: true
    text:
      es: "Al Estado, cuyas normas prevalecen, en caso de conflicto, sobre las de las Comunidades Autónomas en todo lo que no esté atribuido a la exclusiva competencia de éstas."
  - id: c
    text:
      es: "A las Cortes Generales, que podrán atribuirla a las Comunidades Autónomas mediante una ley marco."
  - id: d
    text:
      es: "A las Comunidades Autónomas, salvo que el Gobierno de la Nación decida asumirla por Real Decreto."
  explanation:
    es: "Lo que los Estatutos no asumen corresponde al Estado, y sus normas prevalecen sobre las autonómicas en lo que no sea competencia exclusiva de las Comunidades. La opción que invierte los papeles da la prevalencia a las normas autonómicas. La ley marco es una técnica del artículo 150.1 que atribuye la facultad de legislar, no el título de competencia residual. La opción que deja la materia a las Comunidades salvo decisión del Gobierno invierte la regla."
  citation: "art. 149.3 CE"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
