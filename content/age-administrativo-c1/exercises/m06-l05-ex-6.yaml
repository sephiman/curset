# anchor: fuente-ms-excel-funciones-categoria-html
- id: m06-l05-q221
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe correctamente lo que hace la función BUSCARV?"
  options:
  - id: a
    text:
      es: "Busca en la fila superior de una matriz y devuelve el valor de la celda que se indique"
  - id: b
    text:
      es: "Devuelve el número de filas de una referencia y las cuenta por columnas"
  - id: c
    text:
      es: "Devuelve la fórmula de la referencia dada como texto en la celda"
  - id: d
    correct: true
    text:
      es: "Busca en la primera columna de una matriz y devuelve el valor de una celda de esa fila"
  explanation:
    es: "BUSCARV busca en la columna 1 de una matriz y se mueve en horizontal por la fila para devolver el valor de una celda. Buscar en la fila superior es BUSCARH, contar filas es FILAS y devolver la fórmula como texto es FORMULATEXTO."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones de búsqueda y referencia»"
  difficulty: 2
  tags:
  - "función"
  - "concepto"
# anchor: fuente-ms-excel-funciones-categoria-html
- id: m06-l05-q222
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe correctamente lo que hace la función FILAS?"
  options:
  - id: a
    text:
      es: "Devuelve la cantidad de hojas en una referencia"
  - id: b
    correct: true
    text:
      es: "Devuelve el número de filas de una referencia"
  - id: c
    text:
