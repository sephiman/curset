# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m06-l04-q384
  prompt:
    es: "En Word 365, ¿cuál de las siguientes descripciones corresponde al contenido de la barra de herramientas de acceso rápido?"
  options:
  - id: a
    correct: true
    text:
      es: "Un conjunto de comandos independientes de la pestaña mostrada"
  - id: b
    text:
      es: "Las pestañas y los grupos de comandos de la cinta de opciones"
  - id: c
    text:
      es: "Los estilos individuales de la galería de estilos de la cinta"
  - id: d
    text:
      es: "Las listas de valores de sangría y espaciado"
  explanation:
    es: "La página dice: la barra «contiene un conjunto de comandos que son independientes de la pestaña que se muestra actualmente en la cinta de opciones». «Las pestañas y los grupos de comandos de la cinta de opciones» describe la propia cinta, no la barra, que contiene comandos. «Los estilos individuales de la galería de estilos de la cinta» y «las listas de valores de sangría y espaciado» no pueden agregarse: «Solo se pueden agregar comandos a la barra de herramientas de acceso rápido»."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Personalizar la barra de herramientas de acceso rápido»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m06-l04-q386
  prompt:
    es: "En Word 365, ¿cómo se quita un comando de la barra de herramientas de acceso rápido?"
  options:
  - id: a
    text:
      es: "Con clic derecho en el comando y Ocultar etiquetas de comando de la barra"
  - id: b
    text:
      es: "Con clic derecho en la cinta y Ocultar barra de herramientas de acceso rápido"
  - id: c
    text:
      es: "Con Restablecer solo la barra de herramientas de acceso rápido"
  - id: d
    correct: true
    text:
      es: "Con clic derecho en el comando y Quitar de la barra de herramientas de acceso rápido"
  explanation:
    es: "La página dice: «Haga clic con el botón derecho en el comando que desea quitar de la barra de herramientas de acceso rápido. Seleccione Quitar de la barra de herramientas de acceso rápido en el menú contextual». «Ocultar etiquetas de comando de la barra» solo cambia las etiquetas de texto de los botones. «Ocultar barra de herramientas de acceso rápido» oculta toda la barra, no un comando. «Restablecer solo la barra de herramientas de acceso rápido» devuelve la barra a su configuración predeterminada, no quita un comando concreto."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Quitar un comando de la barra de herramientas de acceso rápido»"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m06-l04-q387
  prompt:
    es: "Según la página de Microsoft, ¿cómo se aumenta en Word 365 el tamaño de los botones de la barra de herramientas de acceso rápido?"
  options:
  - id: a
    text:
      es: "Con una opción de Archivo › Opciones"
  - id: b
    text:
      es: "Con clic derecho en la barra y Ampliar botones"
  - id: c
    correct: true
    text:
      es: "Solo bajando la resolución de pantalla"
  - id: d
    text:
      es: "Mostrando la barra en varias líneas"
  explanation:
    es: "La página dice: «No se puede aumentar el tamaño de los botones que representan los comandos con una opción en Microsoft Office. La única forma de aumentar el tamaño de los botones es bajar la resolución de pantalla». Por eso «con una opción de Archivo › Opciones» y «con clic derecho en la barra y Ampliar botones» no existen como vías. «Mostrando la barra en varias líneas» tampoco: la página dice «No puede mostrar la barra de herramientas de acceso rápido en varias líneas»."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Personalizar la barra de herramientas de acceso rápido»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m06-l04-q388
  prompt:
    es: "Según la página de Microsoft, ¿cuál de los siguientes elementos se puede agregar a la barra de herramientas de acceso rápido de Word 365?"
  options:
  - id: a
    text:
      es: "Estilos individuales de la cinta de opciones"
  - id: b
    correct: true
    text:
      es: "Comandos"
  - id: c
    text:
      es: "Listas con valores de sangría y espaciado"
  - id: d
    text:
      es: "Documentos completos de la lista de recientes"
  explanation:
    es: "La página dice: «Solo se pueden agregar comandos a la barra de herramientas de acceso rápido». Los «estilos individuales de la cinta de opciones» y las «listas con valores de sangría y espaciado» se citan expresamente como elementos que «no se pueden agregar a esta barra de herramientas». «Documentos completos de la lista de recientes» tampoco: no es un comando, y la página admite comandos y nada más."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Personalizar la barra de herramientas de acceso rápido»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m06-l04-q389
  prompt:
    es: "En Word 365, ¿qué ocurre al importar un archivo de personalización de la cinta de opciones?"
  options:
  - id: a
    text:
      es: "Se suman a las personalizaciones anteriores de la cinta y de la barra"
  - id: b
    text:
      es: "Se aplican solo a la barra de herramientas de acceso rápido de Word"
  - id: c
    text:
      es: "Se guardan las anteriores en un archivo de copia automático de Word"
  - id: d
    correct: true
    text:
      es: "Se pierden las personalizaciones anteriores de la cinta y de la barra"
  explanation:
    es: "La página dice: «Al importar un archivo de personalización de la cinta de opciones, perderá todas las personalizaciones anteriores de la cinta y de la barra de herramientas de acceso rápido». Por eso «se suman a las personalizaciones anteriores» es lo contrario; «se aplican solo a la barra de herramientas de acceso rápido de Word» es falso, porque afectan también a la cinta; y «se guardan las anteriores en un archivo de copia automático de Word» tampoco consta: la página dice que se pierden."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Importar una barra de herramientas de acceso rápido personalizada»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-cinta-html
- id: m06-l04-q392
  prompt:
    es: "En Word 365, ¿cuál de las siguientes pestañas de la cinta de opciones no se puede ocultar al personalizarla?"
  options:
  - id: a
    text:
      es: "Inicio"
  - id: b
    correct: true
    text:
      es: "Archivo"
  - id: c
    text:
      es: "Insertar"
  - id: d
    text:
      es: "Revisar"
  explanation:
    es: "La página dice: «Puede ocultar las pestañas personalizadas y predeterminadas. No puede ocultar la pestaña Archivo». Por eso Inicio, Insertar y Revisar, que son pestañas predeterminadas, sí se pueden ocultar; la única excepción es Archivo."
  citation: "fuente: `ms-word-cinta.html`; «Ocultar una pestaña predeterminada o personalizada»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-word-cinta-html
- id: m06-l04-q393
  prompt:
    es: "Señale qué ocurre en Word 365 si se intenta quitar una pestaña predeterminada de la cinta, según la página de Microsoft:"
  options:
  - id: a
    text:
      es: "Se puede quitar con Eliminar, igual que una personalizada"
  - id: b
    text:
      es: "Se puede quitar solo si se exporta antes la personalización"
  - id: c
    text:
      es: "Se puede quitar solo la pestaña Archivo, no las demás"
  - id: d
    correct: true
    text:
      es: "No se puede quitar, solo ocultar; una personalizada sí"
  explanation:
    es: "La página dice: «No puede quitar una pestaña predeterminada, pero puede quitar una pestaña personalizada». Quitarla con Eliminar es lo que la página permite solo con las personalizadas. Exportar antes la personalización es una función distinta que la página cita aparte, junto a importar una cinta personalizada, y no condiciona la eliminación. Y quitar solo Archivo invierte la página: de Archivo dice que ni siquiera se puede ocultar, mientras que las demás predeterminadas se pueden ocultar con la casilla."
  citation: "fuente: `ms-word-cinta.html`; «Quitar una pestaña personalizada»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-cinta-html
- id: m06-l04-q394
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones indica en qué grupos de la cinta se pueden agregar, mover o quitar comandos?"
  options:
  - id: a
    text:
      es: "En cualquier grupo, también los predeterminados"
  - id: b
    correct: true
    text:
      es: "Solo en los grupos personalizados"
  - id: c
    text:
      es: "Solo en los grupos predeterminados"
  - id: d
    text:
      es: "Solo en la pestaña Archivo"
  explanation:
    es: "La página dice: «Solo puede agregar, mover o quitar comandos en grupos personalizados». Por eso «en cualquier grupo, también los predeterminados» y «solo en los grupos predeterminados» contradicen la frase: las predeterminadas son justo donde no se puede. «Solo en la pestaña Archivo» tampoco: la página solo menciona Archivo para decir que esa pestaña no se puede ocultar."
  citation: "fuente: `ms-word-cinta.html`; «Agregar, mover o quitar comandos de grupos personalizados»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-word-cinta-html
- id: m06-l04-q395
  prompt:
    es: "En Word 365, ¿qué se restablece también al restablecer todas las pestañas de la cinta de opciones?"
  options:
  - id: a
    correct: true
    text:
      es: "La barra de herramientas de acceso rápido"
  - id: b
    text:
      es: "Los idiomas de revisión del documento"
  - id: c
    text:
      es: "El formato de archivo predeterminado al guardar"
  - id: d
    text:
      es: "Los métodos abreviados de las macros grabadas"
  explanation:
    es: "La página dice: «Cuando se restablecen todas las pestañas de la cinta de opciones, también se restablece la barra de herramientas de acceso rápido para mostrar solo los comandos predeterminados». «Los idiomas de revisión del documento», «el formato de archivo predeterminado al guardar» y «los métodos abreviados de las macros grabadas» no los cita la página como afectados por ese restablecimiento: el único que añade es la barra de acceso rápido."
  citation: "fuente: `ms-word-cinta.html`; «Restablecer la cinta de opciones a la configuración predeterminada»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m06-l04-q396
  prompt:
    es: "Según la página de Opciones de Word (Guardar), para aplicar una nueva ubicación de archivo predeterminada a un servidor de red en Word 365 hay que:"
  options:
  - id: a
    text:
      es: "Cerrar la sesión de Windows"
  - id: b
    text:
      es: "Volver a guardar todos los documentos abiertos"
  - id: c
    correct: true
    text:
      es: "Reiniciar Word"
  - id: d
    text:
      es: "Activar el Autoguardado de los archivos de OneDrive"
  explanation:
    es: "La página dice: «Debe reiniciar Word para aplicar la nueva ubicación de archivo predeterminada a un servidor de red». Por eso «cerrar la sesión de Windows» es más de lo que pide, pues basta con reiniciar Word; «volver a guardar todos los documentos abiertos» no aplica la ubicación; y «activar el Autoguardado de los archivos de OneDrive» es otra función: el Autoguardado guarda el archivo cada pocos segundos y no aplica ninguna ubicación."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Opciones de Word (Guardar)»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m06-l04-q397
  prompt:
    es: "Con la ubicación de archivo predeterminada configurada en Word 365, ¿puede el usuario guardar un documento en otra ubicación o con otro formato?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí: siempre que guarde, puede elegir otra ubicación o formato"
  - id: b
    text:
      es: "No: Word guarda siempre en la ubicación y el formato predeterminados"
  - id: c
    text:
      es: "Sí, pero solo en otro formato; la ubicación no se puede cambiar"
  - id: d
    text:
      es: "Sí, pero solo si antes se desactiva Autorrecuperación"
  explanation:
    es: "La página dice: «Siempre que guarde un documento, puede invalidar esta configuración seleccionando una ubicación o formato diferente en el cuadro de diálogo Abrir, Guardar o Guardar como». Guardar siempre en la ubicación y el formato predeterminados contradice «siempre que guarde» y «invalidar». Poder cambiar solo el formato contradice «una ubicación o formato diferente». Y la dependencia de desactivar Autorrecuperación no existe: Autorrecuperación es otra opción de la misma página, con su propio intervalo, que no interviene en la elección de la ubicación al guardar."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Opciones de Word (Guardar)»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-opciones-mostrar-html
- id: m06-l04-q398
  prompt:
    es: "En Word 365, ¿cuál de las siguientes descripciones corresponde a la marca de formato Caracteres de tabulación de las Opciones de Word (Mostrar)?"
  options:
  - id: a
    text:
      es: "Los espacios entre palabras como puntos"
  - id: b
    correct: true
    text:
      es: "Los caracteres de tabulación como flechas"
  - id: c
    text:
      es: "Los extremos de párrafo con el símbolo de párrafo"
  - id: d
    text:
      es: "El texto con formato oculto con una línea de puntos"
  explanation:
    es: "La página dice de Caracteres de tabulación: «Seleccione esta opción para mostrar los caracteres de tabulación como flechas». «Los espacios entre palabras como puntos» es la marca Espacios; «los extremos de párrafo con el símbolo de párrafo» es Marcas de párrafo; «el texto con formato oculto con una línea de puntos» es Texto oculto: «mostrar una línea de puntos debajo del texto que tiene formato de oculto»."
  citation: "fuente: `ms-word-opciones-mostrar.html`; «Mostrar siempre estas marcas de formato en la pantalla»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-word-notas-html
- id: m06-l04-q401
  prompt:
    es: "En Word 365, las notas al pie que se insertan desde la pestaña Referencias aparecen:"
  options:
  - id: a
    correct: true
    text:
      es: "en la parte inferior de la página."
  - id: b
    text:
      es: "al final del documento y no en cada página."
  - id: c
    text:
      es: "en la parte superior de la página."
  - id: d
    text:
      es: "en un panel lateral junto al texto."
  explanation:
    es: "La página dice: «Las notas al pie aparecen en la parte inferior de la página». «Al final del documento» es donde se muestran las notas al final, que según la misma frase son otra cosa. «En la parte superior de la página» cambia la posición que fija la página. La página no sitúa ninguna nota en un panel lateral: solo habla de la parte inferior de la página y del final del documento."
  citation: "fuente: `ms-word-notas.html`; «Las notas al pie aparecen en la parte inferior de la página y las notas al final se muestran al final del documento.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q402
  prompt:
    es: "En Word 365, ¿cuál de los siguientes métodos abreviados de teclado pasa a la celda anterior de la fila de una tabla y selecciona su contenido?"
  options:
  - id: a
    text:
      es: "Tab"
  - id: b
    text:
      es: "Alt+Fin"
  - id: c
    correct: true
    text:
      es: "Mayús+Tab"
  - id: d
    text:
      es: "Alt+Inicio"
  explanation:
    es: "La tabla de desplazamiento dice: «Ir a la celda anterior de la fila y seleccionar su contenido. Mayús+TAB». Tab pasa a la celda siguiente de la fila y selecciona su contenido. Alt+Fin va a la última celda de la fila. Alt+Inicio va a la primera celda de la fila."
  citation: "fuente: `ms-word-atajos.html`; «Ir a la celda anterior de la fila y seleccionar su contenido.»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-word-salto-seccion-html
- id: m06-l04-q403
  prompt:
    es: "Señale qué hace en Word 365 un salto de sección de tipo Página impar al insertarlo en el documento:"
  options:
  - id: a
    text:
      es: "Inicia la nueva sección en la misma página."
  - id: b
    text:
      es: "Inicia la nueva sección en la siguiente página par."
  - id: c
    text:
      es: "Inicia la nueva sección en la página siguiente."
  - id: d
    correct: true
    text:
      es: "Inicia la nueva sección en la siguiente página impar."
  explanation:
    es: "La página dice del salto Página impar: «inicia una nueva sección en la siguiente página impar». Continuo es el que inicia la nueva sección en la misma página. Página par la inicia en la siguiente página par. Página siguiente la inicia en la página siguiente."
  citation: "fuente: `ms-word-salto-seccion.html`; «El salto de sección inicia una nueva sección en la siguiente página impar.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-indice-html
- id: m06-l04-q404
  prompt:
    es: "Según la página de Microsoft sobre cómo crear y actualizar un índice, ¿qué enumera un índice de Word 365?"
  options:
  - id: a
    text:
      es: "Los títulos con estilo de título del documento, con su número de página."
  - id: b
    text:
      es: "Los comentarios y las revisiones del documento, con su autor y su fecha."
  - id: c
    correct: true
    text:
      es: "Los términos y temas que se tratan, junto con las páginas en las que aparecen."
  - id: d
    text:
      es: "Las notas al pie y las notas al final del documento, con su página."
  explanation:
    es: "La página dice: «Un índice enumera los términos y temas que se tratan en un documento, junto con las páginas en las que aparecen». Los títulos con estilo de título son la base de la tabla de contenido: «Una tabla de contenido en Word se basa en los títulos del documento». Los comentarios con sus revisiones y las notas al pie y al final no figuran en la definición: la página solo habla de términos y temas con sus páginas."
  citation: "fuente: `ms-word-indice.html`; «Un índice enumera los términos y temas que se tratan en un documento, junto con las páginas en las que aparecen.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-espaciado-caracteres-html
- id: m06-l04-q405
  prompt:
    es: "Según la página de Microsoft, ¿qué diferencia hay en Word 365 entre Expandido o Condensado e Interletraje?"
  options:
  - id: a
    text:
      es: "Expandido o Condensado cambian el espaciado entre pares de letras concretos; Interletraje, el de todas por igual."
  - id: b
    correct: true
    text:
      es: "Expandido o Condensado cambian el espaciado entre todas las letras por igual; Interletraje, el de pares de letras concretos."
  - id: c
    text:
      es: "Expandido o Condensado cambian el tamaño de las letras; Interletraje, el espaciado entre ellas."
  - id: d
    text:
      es: "Expandido o Condensado cambian el espaciado entre líneas; Interletraje, el espaciado entre letras."
  explanation:
    es: "La página dice: «Al seleccionar Expandido o Condensado, se modifica el espaciado entre todas las letras seleccionadas en la misma cantidad. Interletraje modifica el espaciado entre pares de letras concretos». La opción que las invierte cambia ese reparto. Expandido y Condensado no cambian el tamaño de las letras: cambian su espaciado. Tampoco cambian el espaciado entre líneas: para ese interlineado la página recomienda modificar el estilo del párrafo."
  citation: "fuente: `ms-word-espaciado-caracteres.html`; «Cambiar el espaciado entre caracteres»"
  difficulty: 3
  tags:
  - "concepto"
  - "comportamiento"
# anchor: fuente-ms-word-salto-seccion-html
- id: m06-l04-q406
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones indica dónde inicia la nueva sección un salto de sección de tipo Página siguiente?"
  options:
  - id: a
    text:
      es: "En la misma página que el salto."
  - id: b
    text:
      es: "En la siguiente página impar."
  - id: c
    text:
      es: "En la siguiente página par."
  - id: d
    correct: true
    text:
      es: "En la página siguiente al salto."
  explanation:
    es: "La página dice del salto Página siguiente: «inicia la nueva sección en la página siguiente». Continuo la inicia en la misma página. Página impar la inicia en la siguiente página impar y Página par, en la siguiente página par."
  citation: "fuente: `ms-word-salto-seccion.html`; «El salto de sección inicia la nueva sección en la página siguiente.»"
  difficulty: 1
  tags:
  - "concepto"
