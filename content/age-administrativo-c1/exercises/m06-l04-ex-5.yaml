  prompt:
    es: "Tras hacer cambios que afectan a la tabla de contenido de Word 365, ¿cómo se actualiza esta?"
  options:
  - id: a
    text:
      es: "Con Ctrl+F9, con el cursor en la tabla de contenido"
  - id: b
    text:
      es: "Con Mayús+F9, con el cursor en la tabla de contenido"
  - id: c
    correct: true
    text:
      es: "Con clic derecho en la tabla y Actualizar campo"
  - id: d
    text:
