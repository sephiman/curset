# anchor: celex-12016m-txt-art-16
- id: m01-l10-q090
  prompt:
    es: "Conforme al artículo 16.4 del Tratado de la Unión Europea, a partir del 1 de noviembre de 2014 la mayoría cualificada del Consejo es un mínimo del 55 % de sus miembros que incluya al menos a:"
  options:
  - id: a
    text:
      es: "Doce de ellos y represente a Estados que reúnan como mínimo el 65 % de la población de la Unión."
  - id: b
    correct: true
    text:
      es: "Quince de ellos y represente a Estados que reúnan como mínimo el 65 % de la población de la Unión."
  - id: c
    text:
      es: "Quince de ellos y represente a Estados que reúnan como mínimo el 60 % de la población de la Unión."
  - id: d
    text:
      es: "Veinte de ellos y represente a Estados que reúnan como mínimo el 72 % de la población de la Unión."
  explanation:
    es: "La mayoría cualificada exige el 55 % de los miembros, al menos quince, y el 65 % de la población de la Unión. Doce miembros es un mínimo menor que el del artículo. El 60 % de la población no es la cifra del artículo. Veinte miembros y el 72 % mezclan cifras que no corresponden a la regla general."
  citation: "art. 16.4 TUE"
  difficulty: 3
  tags:
  - "mayoría"
  - "cantidad"
# anchor: celex-12016m-txt-art-16
- id: m01-l10-q091
  prompt:
    es: "Según el artículo 16.4 del Tratado de la Unión Europea, una minoría de bloqueo en el Consejo estará compuesta por al menos:"
  options:
  - id: a
    correct: true
    text:
      es: "Cuatro miembros del Consejo."
  - id: b
    text:
      es: "Tres miembros del Consejo."
  - id: c
    text:
      es: "Cinco miembros del Consejo."
  - id: d
    text:
      es: "Siete miembros del Consejo."
  explanation:
    es: "La minoría de bloqueo exige al menos cuatro miembros del Consejo. Sin ella, la mayoría cualificada se considera alcanzada. Tres miembros son pocos para bloquear, y cinco o siete no son la cifra del artículo."
  citation: "art. 16.4 TUE"
  difficulty: 3
  tags:
  - "mayoría"
  - "cantidad"
# anchor: celex-12016e-txt-art-238
- id: m01-l10-q092
  prompt:
    es: "Según el artículo 238.3 del Tratado de Funcionamiento de la Unión Europea, si no participan todos los miembros del Consejo, la mayoría cualificada exige el 55 % de los miembros, que representen a Estados participantes que reúnan como mínimo:"
  options:
  - id: a
    text:
