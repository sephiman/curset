# anchor: boe-a-2014-12328-art-1
- id: m03-l17-q0001
  prompt:
    es: "De acuerdo con el artículo 1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, el Impuesto sobre Sociedades es un tributo:"
  options:
  - id: a
    text:
      es: "de carácter indirecto y naturaleza real que grava el patrimonio de las sociedades y demás entidades jurídicas."
  - id: b
    text:
      es: "de carácter directo y naturaleza real que grava los beneficios distribuidos por las sociedades y demás entidades jurídicas."
  - id: c
    correct: true
    text:
      es: "de carácter directo y naturaleza personal que grava la renta de las sociedades y demás entidades jurídicas."
  - id: d
    text:
      es: "de carácter indirecto y naturaleza personal que grava el consumo de las sociedades y demás entidades jurídicas."
  explanation:
    es: "El artículo 1 define el impuesto como directo y personal, y dice que grava la renta. Un tributo indirecto que grava el patrimonio no encaja: el impuesto no recae sobre el patrimonio ni se define como indirecto. La naturaleza real tampoco: el artículo lo califica de personal, y lo que grava es la renta obtenida, no el beneficio distribuido. Y un impuesto sobre el consumo es indirecto, cosa que el artículo no dice de este."
  citation: "art. 1 LIS"
  difficulty: 1
  tags:
  - "naturaleza"
# anchor: boe-a-2014-12328-art-2
- id: m03-l17-q0002
  prompt:
    es: "¿En qué ámbito territorial se aplica el impuesto, de acuerdo con el artículo 2.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades?"
  options:
  - id: a
    correct: true
    text:
      es: "En todo el territorio español, que incluye las zonas adyacentes a las aguas territoriales sobre las que España pueda ejercer derechos referentes al suelo y subsuelo marino."
  - id: b
    text:
      es: "En el territorio español peninsular e insular, con exclusión de las zonas adyacentes a las aguas territoriales."
  - id: c
    text:
      es: "En todo el territorio español, con exclusión de Canarias, Ceuta y Melilla, que cuentan con regímenes propios."
  - id: d
    text:
      es: "En el territorio español y en el de los Estados miembros de la Unión Europea en los que la entidad opere, según los convenios que España haya firmado."
  explanation:
    es: "El artículo 2.1 aplica el impuesto en todo el territorio español y precisa que este comprende también las zonas adyacentes a las aguas territoriales sobre las que España ejerza derechos sobre el suelo y subsuelo marino. Excluir esas zonas contradice el segundo párrafo. Excluir Canarias, Ceuta y Melilla contradice la regla de todo el territorio, y la ley las trata dentro del impuesto: una sociedad con domicilio fiscal en Canarias es contribuyente y las rentas de Ceuta y Melilla tienen bonificación. La extensión al territorio de otros Estados no figura en el artículo, que se limita al territorio español."
  citation: "art. 2.1 LIS"
  difficulty: 2
  tags:
  - "ámbito"
# anchor: boe-a-2014-12328-art-2
- id: m03-l17-q0003
  prompt:
    es: "De acuerdo con el artículo 2.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre los regímenes tributarios forales:"
  options:
  - id: a
    text:
      es: "El impuesto se aplica sin perjuicio de los regímenes de concierto y convenio económico, en vigor respectivamente en Navarra y en el País Vasco."
  - id: b
    text:
      es: "El impuesto sustituye a los regímenes de concierto y convenio económico, que quedan sin efecto para las sociedades."
  - id: c
    text:
      es: "El impuesto se aplica sin perjuicio de los regímenes de concierto y convenio económico, en vigor respectivamente en Canarias y en Navarra."
  - id: d
    correct: true
    text:
      es: "El impuesto se aplica sin perjuicio de los regímenes de concierto y convenio económico, en vigor respectivamente en el País Vasco y en Navarra."
  explanation:
    es: "El artículo 2.2 salva los regímenes de concierto y convenio económico, y los reparte así: concierto en los Territorios Históricos del País Vasco y convenio en la Comunidad Foral de Navarra. Invertir el orden atribuye cada régimen al territorio que no le corresponde. Decir que el impuesto los sustituye es lo contrario de la cláusula «sin perjuicio». Y Canarias no tiene concierto ni convenio económico: su régimen propio es otro, y el artículo nombra solo el País Vasco y Navarra."
  citation: "art. 2.2 LIS"
  difficulty: 2
  tags:
  - "foral"
  - "territorio"
# anchor: boe-a-2014-12328-art-3
- id: m03-l17-q0004
  prompt:
    es: "Según el artículo 3 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, lo establecido en la ley se entiende sin perjuicio de lo dispuesto en:"
  options:
  - id: a
    text:
      es: "los tratados y convenios internacionales firmados por España, aunque no formen parte del ordenamiento interno."
  - id: b
    correct: true
    text:
      es: "los tratados y convenios internacionales que hayan pasado a formar parte del ordenamiento interno."
  - id: c
    text:
      es: "los tratados internacionales, pero no los convenios para evitar la doble imposición, que quedan sujetos a la ley."
  - id: d
    text:
      es: "las resoluciones de los organismos internacionales en materia tributaria que España haya aceptado."
  explanation:
    es: "El artículo 3 respeta los tratados y convenios internacionales que hayan pasado a formar parte del ordenamiento interno, de conformidad con el artículo 96 de la Constitución. La firma no basta: hace falta que el tratado forme parte del ordenamiento interno. El artículo habla de tratados y convenios sin separar los convenios para evitar la doble imposición, de modo que excluirlos no tiene apoyo. Y las resoluciones de organismos internacionales no figuran en la regla, que es una cláusula cerrada sobre tratados y convenios."
  citation: "art. 3 LIS"
  difficulty: 1
  tags:
  - "tratados"
# anchor: boe-a-2014-12328-art-4
- id: m03-l17-q0005
  prompt:
    es: "De acuerdo con el artículo 4.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, constituye el hecho imponible del impuesto:"
  options:
  - id: a
    text:
      es: "la obtención de renta por el contribuyente, siempre que proceda de una actividad económica."
  - id: b
    text:
      es: "la titularidad por el contribuyente de bienes y derechos, con independencia de la renta que produzcan."
  - id: c
    text:
      es: "el reparto de dividendos o de beneficios por el contribuyente a sus socios durante el período impositivo."
  - id: d
    correct: true
    text:
      es: "la obtención de renta por el contribuyente, cualquiera que fuese su fuente u origen."
  explanation:
    es: "El hecho imponible es la obtención de renta, sin importar su fuente u origen. Limitarlo a la renta de actividades económicas añade una condición que el artículo no pone: también hay renta sin actividad económica. La titularidad de bienes es el hecho imponible de otros impuestos sobre el patrimonio, no de este. El reparto de dividendos a los socios es una decisión posterior sobre una renta ya obtenida, no el hecho que genera el impuesto."
  citation: "art. 4.1 LIS"
  difficulty: 1
  tags:
  - "hecho imponible"
# anchor: boe-a-2014-12328-art-4
- id: m03-l17-q0006
  prompt:
    es: "Conforme al artículo 4.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre la obtención de renta en el régimen especial de agrupaciones de interés económico y de uniones temporales de empresas:"
  options:
  - id: a
    text:
      es: "Se entiende por obtención de renta la percepción por el contribuyente de los beneficios que la agrupación o la unión distribuya a sus miembros en el período impositivo."
  - id: b
    correct: true
    text:
      es: "Se entiende por obtención de renta la imputación al contribuyente de las bases imponibles, gastos o demás partidas de las entidades sometidas a dicho régimen."
  - id: c
    text:
      es: "Se entiende por obtención de renta la imputación a la agrupación o a la unión de las rentas de sus miembros, que tributan por separado."
  - id: d
    text:
      es: "Se entiende por obtención de renta la imputación en la base imponible de las rentas positivas obtenidas por una entidad no residente."
  explanation:
    es: "En ese régimen especial la renta se obtiene por imputación al contribuyente de las bases imponibles, gastos y demás partidas de la agrupación o unión. Percibir beneficios distribuidos es un criterio de caja que el artículo no usa. Imputar a la agrupación las rentas de sus miembros invierte el sentido de la imputación, que va de la entidad al contribuyente. La imputación de rentas positivas de una entidad no residente es el criterio del régimen de transparencia fiscal internacional, el otro supuesto del mismo apartado, y no el de agrupaciones y uniones."
  citation: "art. 4.2 LIS"
  difficulty: 2
  tags:
  - "hecho imponible"
  - "regímenes"
# anchor: boe-a-2014-12328-art-5
- id: m03-l17-q0007
  prompt:
    es: "Conforme al artículo 5.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, se entiende por actividad económica:"
  options:
  - id: a
    correct: true
    text:
      es: "la ordenación por cuenta propia de los medios de producción y de recursos humanos, o de uno de ambos, con la finalidad de intervenir en la producción o distribución de bienes o servicios."
  - id: b
    text:
      es: "la ordenación por cuenta ajena de los medios de producción y de recursos humanos, o de uno de ambos, con la finalidad de intervenir en la producción o distribución de bienes o servicios propios."
  - id: c
    text:
      es: "la ordenación por cuenta propia de los medios de producción, con la finalidad de obtener rentas del capital mobiliario en el mercado de valores."
  - id: d
    text:
      es: "la realización habitual de operaciones mercantiles con ánimo de lucro, con independencia de los medios de producción y de recursos humanos empleados."
  explanation:
    es: "La definición exige ordenar por cuenta propia medios de producción y recursos humanos, o uno de ellos, para intervenir en la producción o distribución de bienes o servicios. La ordenación por cuenta ajena cambia el titular de la ordenación y no es la que el artículo describe. Obtener rentas del capital mobiliario es la situación típica de la entidad patrimonial, que por definición no realiza actividad económica. Y el artículo no se apoya en la habitualidad ni en el ánimo de lucro, sino en la ordenación de medios."
  citation: "art. 5.1 LIS"
  difficulty: 1
  tags:
  - "actividad económica"
# anchor: boe-a-2014-12328-art-5
- id: m03-l17-q0008
  prompt:
    es: "¿Cuándo existe actividad económica en el caso de arrendamiento de inmuebles, según el artículo 5.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades?"
  options:
  - id: a
    text:
      es: "Siempre que el arrendador sea una sociedad mercantil, con independencia de los medios que emplee para ordenar el arrendamiento."
  - id: b
    text:
      es: "Únicamente cuando para su ordenación se utilicen, al menos, dos personas empleadas con contrato laboral y jornada completa."
  - id: c
    correct: true
    text:
      es: "Únicamente cuando para su ordenación se utilice, al menos, una persona empleada con contrato laboral y jornada completa."
  - id: d
    text:
      es: "Cuando para su ordenación se utilice, al menos, una persona empleada con contrato laboral, aunque sea a tiempo parcial."
  explanation:
    es: "En el arrendamiento de inmuebles el artículo 5.1 exige, como mínimo, una persona empleada con contrato laboral y jornada completa. La forma mercantil del arrendador no basta: la regla mira a los medios con que se ordena el arrendamiento. Pedir dos personas eleva el mínimo que fija el artículo. Y una persona a tiempo parcial no cumple, porque el texto pide jornada completa."
  citation: "art. 5.1 LIS"
  difficulty: 2
  tags:
  - "actividad económica"
  - "arrendamiento"
# anchor: boe-a-2014-12328-art-5
- id: m03-l17-q0009
  prompt:
    es: "¿Cuál de las siguientes entidades es una entidad patrimonial según el artículo 5.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades?"
  options:
  - id: a
    correct: true
    text:
      es: "Aquella en la que más de la mitad de su activo está constituido por valores o no está afecto a una actividad económica."
  - id: b
    text:
      es: "Aquella en la que al menos un tercio de su activo está constituido por valores o no está afecto a una actividad económica."
  - id: c
    text:
      es: "Aquella en la que más de la mitad de sus ingresos del ejercicio proceden de dividendos y de intereses."
  - id: d
    text:
      es: "Aquella cuyo activo está constituido en su totalidad por valores o por inmuebles dados en arrendamiento."
  explanation:
    es: "La entidad patrimonial es la que tiene más de la mitad de su activo en valores o sin afectar a una actividad económica, y por eso no realiza actividad económica. Un tercio del activo queda por debajo del umbral. El umbral se mide sobre el activo y no sobre los ingresos, de modo que el peso de dividendos e intereses en la cuenta de resultados no decide. Y no hace falta que todo el activo sea valores o inmuebles arrendados: basta más de la mitad en las condiciones del artículo."
  citation: "art. 5.2 LIS"
  difficulty: 2
  tags:
  - "entidad patrimonial"
# anchor: boe-a-2014-12328-art-6
- id: m03-l17-q0010
  prompt:
    es: "Según el artículo 6.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, las rentas correspondientes a las comunidades de bienes y demás entidades del artículo 35.4 de la Ley General Tributaria se atribuyen:"
  options:
  - id: a
    text:
      es: "a la propia entidad, que las integra en su base imponible como contribuyente del impuesto."
  - id: b
    text:
      es: "a los comuneros o partícipes, de acuerdo con las normas de imputación del propio Impuesto sobre Sociedades."
  - id: c
    correct: true
    text:
      es: "a los comuneros o partícipes, de acuerdo con la sección 2.ª del título X de la ley del Impuesto sobre la Renta de las Personas Físicas."
  - id: d
    text:
      es: "únicamente a los comuneros que sean personas jurídicas, y las de los demás se gravan en la entidad."
  explanation:
    es: "El artículo 6.1 atribuye esas rentas a los socios, herederos, comuneros o partícipes según la sección 2.ª del título X de la ley del IRPF. Gravarlas en la propia entidad contradice el régimen: las entidades en atribución no tributan por este impuesto. Aplicar las normas de imputación del Impuesto sobre Sociedades cambia la ley remitida, que es la del IRPF. Y el texto no reparte las rentas entre comuneros personas jurídicas y los demás: las atribuye a todos los comuneros o partícipes."
  citation: "art. 6.1 LIS"
  difficulty: 1
  tags:
  - "atribución de rentas"
# anchor: boe-a-2014-12328-art-6
- id: m03-l17-q0011
  prompt:
    es: "Conforme al artículo 6.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre las entidades en régimen de atribución de rentas:"
  options:
  - id: a
    text:
      es: "No tributan por el Impuesto sobre Sociedades, sin excepción alguna, y sus rentas pasan siempre a los socios."
  - id: b
    correct: true
    text:
      es: "No tributan por el Impuesto sobre Sociedades, a excepción de lo dispuesto en el apartado 12 del artículo 15 bis de la ley."
  - id: c
    text:
      es: "Tributan por el Impuesto sobre Sociedades al tipo general, y sus socios integran después en su base la renta ya gravada en la entidad."
  - id: d
    text:
      es: "Tributan por el Impuesto sobre Sociedades solo por las rentas que no hayan atribuido a sus socios."
  explanation:
    es: "Las entidades en régimen de atribución de rentas no tributan por el impuesto, con la excepción del apartado 12 del artículo 15 bis. Decir que no tributan sin excepción alguna ignora esa salvedad. Tributar al tipo general convierte a la entidad en contribuyente, lo contrario de lo que dice el artículo. Y tributar solo por las rentas no atribuidas inventa un reparto de la renta que la ley no prevé: la regla es la no tributación, con una excepción concreta."
  citation: "art. 6.2 LIS"
  difficulty: 2
  tags:
  - "atribución de rentas"
# anchor: boe-a-2014-12328-art-6
- id: m03-l17-q0012
  prompt:
    es: "¿Cuál es el tratamiento de una sociedad civil que no tiene objeto mercantil según los artículos 6.1 y 7.1.a) de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades?"
  options:
  - id: a
    text:
      es: "Es contribuyente por ser persona jurídica, aunque no tenga objeto mercantil, y sus socios no tributan por sus rentas."
  - id: b
    text:
      es: "Es contribuyente solo si tiene más de dos socios, y en otro caso sus rentas se atribuyen a estos."
  - id: c
    text:
      es: "No es contribuyente, y sus rentas tributan en la propia sociedad por el Impuesto sobre la Renta de las Personas Físicas, no por el de sus socios."
  - id: d
    correct: true
    text:
      es: "No es contribuyente, por quedar excluida de las personas jurídicas del artículo 7.1.a), y sus rentas se atribuyen a los socios."
  explanation:
    es: "El artículo 7.1.a) incluye entre los contribuyentes a las personas jurídicas, pero excluye las sociedades civiles sin objeto mercantil, y el artículo 6.1 atribuye sus rentas a los socios. Decir que es contribuyente por ser persona jurídica pasa por alto la exclusión. El número de socios no figura como criterio en ninguno de los dos artículos. Y las rentas no se gravan en la sociedad por el IRPF: se atribuyen a los socios, que tributan según su propio impuesto."
  citation: "arts. 6.1 y 7.1.a) LIS"
  difficulty: 2
  tags:
  - "contribuyente"
  - "atribución de rentas"
# anchor: boe-a-2014-12328-art-7
- id: m03-l17-q0013
  prompt:
    es: "De acuerdo con el artículo 7.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, serán contribuyentes del impuesto, cuando tengan su residencia en territorio español:"
  options:
  - id: a
    text:
      es: "las personas jurídicas, incluidas las sociedades civiles aunque no tengan objeto mercantil."
  - id: b
    correct: true
    text:
      es: "las personas jurídicas, excluidas las sociedades civiles que no tengan objeto mercantil."
  - id: c
    text:
      es: "las personas jurídicas y las comunidades de bienes, con independencia de su objeto."
  - id: d
    text:
      es: "las personas físicas que ejerzan una actividad económica y las personas jurídicas."
  explanation:
    es: "La letra a) del artículo 7.1 incluye a las personas jurídicas residentes y excluye las sociedades civiles sin objeto mercantil. Incluir esas sociedades civiles contradice la exclusión. Las comunidades de bienes no son contribuyentes: sus rentas se atribuyen a los comuneros. Y las personas físicas que ejercen una actividad económica tributan por su propio impuesto, no por este."
  citation: "art. 7.1 LIS"
  difficulty: 1
  tags:
  - "contribuyente"
# anchor: boe-a-2014-12328-art-7
- id: m03-l17-q0014
  prompt:
    es: "¿Cuál de las siguientes entidades residentes en territorio español es contribuyente del impuesto según el artículo 7.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades?"
  options:
  - id: a
    text:
      es: "Una herencia yacente cuyo causante residía en territorio español."
  - id: b
    text:
      es: "Una comunidad de bienes formada por tres personas físicas."
  - id: c
    text:
      es: "Un empresario individual que ejerce una actividad económica."
  - id: d
    correct: true
    text:
      es: "Un fondo de pensiones."
  explanation:
    es: "Los fondos de pensiones figuran en la letra f) del artículo 7.1. La herencia yacente y la comunidad de bienes son entidades en régimen de atribución de rentas, que se atribuyen a herederos y comuneros y no tributan por este impuesto. El empresario individual es una persona física, y el artículo 7.1 enumera personas jurídicas y fondos, no personas físicas."
  citation: "art. 7.1 LIS"
  difficulty: 2
  tags:
  - "contribuyente"
# anchor: boe-a-2014-12328-art-8
- id: m03-l17-q0015
  prompt:
    es: "¿Es residente en territorio español, según el artículo 8.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, una entidad constituida conforme a leyes extranjeras y con domicilio social en el extranjero, cuya dirección y control del conjunto de sus actividades radican en España?"
  options:
  - id: a
    text:
      es: "No, porque se constituyó conforme a leyes extranjeras y tiene su domicilio social fuera de España."
  - id: b
    text:
      es: "No, porque el artículo exige que concurran a la vez la constitución conforme a leyes españolas y el domicilio social en España."
  - id: c
    correct: true
    text:
      es: "Sí, porque tiene su sede de dirección efectiva en territorio español, y basta con que concurra uno de los tres requisitos."
  - id: d
    text:
      es: "Sí, pero solo si además mantiene su domicilio social en territorio español."
  explanation:
    es: "El artículo 8.1 enumera tres requisitos de residencia: constitución conforme a leyes españolas, domicilio social en España o sede de dirección efectiva en España. Basta uno, y la sede de dirección efectiva está donde radican la dirección y el control del conjunto de las actividades. Por eso la entidad es residente aunque se haya constituido en el extranjero. Negar la residencia por esa constitución o por el domicilio social extranjero ignora la tercera letra. Exigir que concurran dos requisitos a la vez, o el domicilio social además de la sede, convierte una lista alternativa en una acumulativa."
  citation: "art. 8.1 LIS"
  difficulty: 2
  tags:
  - "residencia"
# anchor: boe-a-2014-12328-art-8
- id: m03-l17-q0016
  prompt:
    es: "Según el artículo 8.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, se entiende que una entidad tiene su sede de dirección efectiva en territorio español cuando:"
  options:
  - id: a
    correct: true
    text:
      es: "en él radique la dirección y control del conjunto de sus actividades."
  - id: b
    text:
      es: "en él se encuentre la mayor parte del valor de su inmovilizado."
  - id: c
    text:
      es: "en él se celebre la junta general de socios al menos una vez al año."
  - id: d
    text:
      es: "en él tenga su domicilio social, con independencia de dónde se dirija su actividad."
  explanation:
    es: "La sede de dirección efectiva está en España cuando allí radica la dirección y el control del conjunto de las actividades. El mayor valor del inmovilizado es el criterio subsidiario del domicilio fiscal, no de la sede. Celebrar la junta general no figura en el artículo. Y el domicilio social es otro requisito de residencia, distinto de la sede de dirección efectiva."
  citation: "art. 8.1 LIS"
  difficulty: 1
  tags:
  - "residencia"
# anchor: boe-a-2014-12328-art-8
- id: m03-l17-q0017
  prompt:
    es: "Según el artículo 8.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, ¿cuál es el domicilio fiscal de los contribuyentes residentes en territorio español?"
  options:
  - id: a
    text:
      es: "El de su domicilio social en todo caso, con independencia del lugar donde se gestione el negocio."
  - id: b
    text:
      es: "El lugar donde radique el mayor valor del inmovilizado, que es el criterio general."
  - id: c
    correct: true
    text:
      es: "El de su domicilio social, siempre que en él esté efectivamente centralizada la gestión administrativa y la dirección de sus negocios."
  - id: d
    text:
      es: "El del lugar donde se hubiera constituido la entidad conforme a las leyes españolas."
  explanation:
    es: "El domicilio fiscal es el domicilio social, pero solo si en él está centralizada la gestión administrativa y la dirección de los negocios; en otro caso se atiende al lugar donde se realiza esa gestión. Decir que lo es en todo caso suprime la condición. El mayor valor del inmovilizado solo prevalece cuando no puede establecerse el domicilio por los criterios anteriores, así que no es el criterio general. Y el lugar de constitución es un requisito de residencia, no un criterio para el domicilio fiscal."
  citation: "art. 8.2 LIS"
  difficulty: 2
  tags:
  - "domicilio fiscal"
# anchor: boe-a-2014-12328-art-8
- id: m03-l17-q0018
  prompt:
    es: "De acuerdo con el artículo 8.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre el domicilio fiscal cuando es imposible fijar el lugar por el domicilio social o por el lugar de la gestión y dirección:"
  options:
  - id: a
    correct: true
    text:
      es: "Prevalece aquel donde radique el mayor valor del inmovilizado."
  - id: b
    text:
      es: "Prevalece aquel donde la entidad realice la mayor parte de sus ventas durante el ejercicio."
  - id: c
    text:
      es: "Prevalece el domicilio de la persona que ostente la representación legal de la entidad."
  - id: d
    text:
      es: "La entidad carece de domicilio fiscal hasta que lo comunique expresamente a la Administración tributaria."
  explanation:
    es: "Cuando fallan los dos criterios anteriores, el artículo 8.2 da una regla única: prevalece el lugar donde radique el mayor valor del inmovilizado. Las ventas del ejercicio y el domicilio del representante legal no son criterios del artículo. Y la ley no deja a la entidad sin domicilio fiscal a la espera de una comunicación: ofrece ese tercer criterio precisamente para que siempre exista uno."
  citation: "art. 8.2 LIS"
  difficulty: 2
  tags:
  - "domicilio fiscal"
# anchor: boe-a-2014-12328-art-7
- id: m03-l17-q0019
  prompt:
    es: "¿Cómo se gravan, conforme al artículo 7.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, las rentas que obtiene un contribuyente residente en territorio español por una sucursal que tiene en Marruecos y por dividendos que le paga una entidad portuguesa?"
  options:
  - id: a
    text:
      es: "Solo por las rentas producidas en territorio español, aunque el pagador resida fuera."
  - id: b
    text:
      es: "Por la totalidad de la renta, pero únicamente cuando el pagador sea residente en territorio español."
  - id: c
    text:
      es: "Solo por las rentas cuyo pagador resida en España, salvo las de sucursales, que se gravan en su país de origen."
  - id: d
    correct: true
    text:
      es: "Por la totalidad de la renta que obtenga, con independencia del lugar donde se hubiere producido y cualquiera que sea la residencia del pagador."
  explanation:
    es: "El contribuyente residente tributa por la totalidad de su renta, la haya producido donde la haya producido y resida donde resida el pagador. Por eso entran la sucursal en Marruecos y los dividendos portugueses. Limitar el gravamen a lo producido en España excluye las dos rentas del caso. Condicionarlo a la residencia del pagador convierte en requisito lo que el artículo declara irrelevante. Y remitir las sucursales a su país de origen no tiene respaldo en el artículo."
  citation: "art. 7.2 LIS"
  difficulty: 2
  tags:
  - "contribuyente"
  - "renta mundial"
# anchor: boe-a-2014-12328-art-9
- id: m03-l17-q0020
  prompt:
    es: "De acuerdo con el artículo 9.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, están totalmente exentos del impuesto:"
  options:
  - id: a
    text:
      es: "los colegios profesionales, las asociaciones empresariales y las cámaras oficiales."
  - id: b
    correct: true
    text:
      es: "el Banco de España, el Fondo de Garantía de Depósitos de Entidades de Crédito y los Fondos de garantía de inversiones."
  - id: c
    text:
      es: "los sindicatos de trabajadores y las uniones, federaciones y confederaciones de cooperativas."
  - id: d
    text:
      es: "los partidos políticos y las Mutuas Colaboradoras de la Seguridad Social."
  explanation:
    es: "La letra c) del artículo 9.1 declara totalmente exentos al Banco de España, al Fondo de Garantía de Depósitos de Entidades de Crédito y a los Fondos de garantía de inversiones. Los colegios profesionales, las asociaciones empresariales, las cámaras oficiales, los sindicatos, las uniones de cooperativas y las mutuas están parcialmente exentos, en los términos del capítulo XIV del título VII. Los partidos políticos también lo están parcialmente, según su propia ley."
  citation: "art. 9.1 LIS"
  difficulty: 1
  tags:
  - "exenciones"
# anchor: boe-a-2014-12328-art-9
- id: m03-l17-q0021
  prompt:
    es: "Conforme al artículo 9.3 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre las entidades parcialmente exentas en los términos del capítulo XIV del título VII:"
  options:
  - id: a
    text:
      es: "Están parcialmente exentos el Instituto de España y las Reales Academias oficiales integradas en aquél."
  - id: b
    text:
      es: "Están parcialmente exentos los organismos autónomos del Estado y las entidades de derecho público de análogo carácter de las comunidades autónomas."
  - id: c
    text:
      es: "Están parcialmente exentos las Entidades Gestoras y los Servicios Comunes de la Seguridad Social."
  - id: d
    correct: true
    text:
      es: "Están parcialmente exentos los colegios profesionales, las asociaciones empresariales, las cámaras oficiales y los sindicatos de trabajadores."
  explanation:
    es: "La letra c) del artículo 9.3 incluye entre las entidades parcialmente exentas a los colegios profesionales, las asociaciones empresariales, las cámaras oficiales y los sindicatos de trabajadores. El Instituto de España con las Reales Academias, los organismos autónomos y las Entidades Gestoras y Servicios Comunes de la Seguridad Social figuran en el artículo 9.1, que los declara totalmente exentos, no en el 9.3."
  citation: "art. 9.3 LIS"
  difficulty: 2
  tags:
  - "exenciones"
# anchor: boe-a-2014-12328-art-9
- id: m03-l17-q0022
  prompt:
    es: "Según el artículo 9.4 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, están parcialmente exentos del impuesto los partidos políticos:"
  options:
  - id: a
    text:
      es: "en los términos previstos en el título II de la ley de régimen fiscal de las entidades sin fines lucrativos."
  - id: b
    correct: true
    text:
      es: "en los términos establecidos en la ley orgánica sobre financiación de los partidos políticos."
  - id: c
    text:
      es: "en los términos previstos en el capítulo XIV del título VII de la propia Ley del Impuesto sobre Sociedades."
  - id: d
    text:
      es: "por la totalidad de sus rentas, sin necesidad de remitirse a otra ley para su régimen."
  explanation:
    es: "El artículo 9.4 remite a la ley orgánica sobre financiación de los partidos políticos para los términos de su exención parcial. El título II de la ley de entidades sin fines lucrativos es la remisión del apartado 2 para otras entidades. El capítulo XIV del título VII es la remisión del apartado 3. Y los partidos no están totalmente exentos: el apartado 4 habla de exención parcial."
  citation: "art. 9.4 LIS"
  difficulty: 2
  tags:
  - "exenciones"
# anchor: boe-a-2014-12328-art-9
- id: m03-l17-q0023
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las entidades e instituciones sin ánimo de lucro es correcta según el artículo 9 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades?"
  options:
  - id: a
    correct: true
    text:
      es: "Si no les es de aplicación el título II de la ley de entidades sin fines lucrativos, están parcialmente exentas en los términos del capítulo XIV del título VII."
  - id: b
    text:
      es: "Si no les es de aplicación el título II de la ley de entidades sin fines lucrativos, están totalmente exentas del impuesto."
  - id: c
    text:
      es: "Si no les es de aplicación el título II de la ley de entidades sin fines lucrativos, no son contribuyentes del impuesto."
  - id: d
    text:
      es: "Si les es de aplicación el título II de la ley de entidades sin fines lucrativos, están parcialmente exentas en los términos del capítulo XIV del título VII de la propia ley."
  explanation:
    es: "Las entidades sin ánimo de lucro a las que se aplica el título II de la ley de entidades sin fines lucrativos están parcialmente exentas en los términos de ese título (artículo 9.2). Las que no están incluidas en ese apartado están parcialmente exentas en los términos del capítulo XIV del título VII (artículo 9.3.a). Decir que están totalmente exentas o que no son contribuyentes contradice que la exención sea parcial. Y atribuir el capítulo XIV a las entidades del título II confunde los dos apartados."
  citation: "arts. 9.2 y 9.3 LIS"
  difficulty: 2
  tags:
  - "exenciones"
# anchor: boe-a-2014-12328-art-110
- id: m03-l17-q0024
  prompt:
    es: "De acuerdo con el artículo 110.1.a) de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, en las entidades parcialmente exentas están exentas las cuotas satisfechas por los asociados, colaboradores o benefactores, siempre que:"
  options:
  - id: a
    text:
      es: "superen el importe que la asamblea de asociados haya fijado para el ejercicio, con comunicación previa a la Administración tributaria."
  - id: b
    text:
      es: "se destinen íntegramente a nuevas inversiones en elementos del inmovilizado de la entidad."
  - id: c
    correct: true
    text:
      es: "no se correspondan con el derecho a percibir una prestación derivada de una actividad económica."
  - id: d
    text:
      es: "sean satisfechas por personas físicas con residencia en territorio español."
  explanation:
    es: "Las cuotas de asociados, colaboradores o benefactores están exentas si no dan derecho a una prestación derivada de una actividad económica. El importe fijado por la asamblea y la residencia de quien paga no figuran como condiciones. Destinar el producto a nuevas inversiones es la condición de la letra c), que se refiere a las rentas de la transmisión onerosa de bienes afectos al objeto, no a las cuotas."
  citation: "art. 110.1.a) LIS"
  difficulty: 2
  tags:
  - "exenciones"
  - "entidades parcialmente exentas"
# anchor: boe-a-2014-12328-art-110
- id: m03-l17-q0026
  prompt:
    es: "Según el artículo 110.1.c) de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, las nuevas inversiones con que se reinvierte el producto de la transmisión onerosa de bienes afectos al objeto deben realizarse entre el año anterior a la entrega del elemento y los 3 años posteriores, y mantenerse en el patrimonio de la entidad:"
  options:
  - id: a
    text:
      es: "durante 5 años, excepto que su vida útil conforme al método de amortización que se aplique fuere inferior."
  - id: b
    text:
      es: "durante 10 años, sin excepción por razón de la vida útil del elemento."
  - id: c
    correct: true
    text:
      es: "durante 7 años, excepto que su vida útil conforme al método de amortización que se aplique fuere inferior."
  - id: d
    text:
      es: "durante 3 años, que es el mismo plazo en el que deben realizarse las inversiones."
  explanation:
    es: "La reinversión debe mantenerse siete años en el patrimonio, salvo que la vida útil según el método de amortización sea inferior. Cinco años queda por debajo del plazo legal y diez lo supera. Los tres años son el plazo posterior para realizar la inversión, no el de mantenimiento. Y el mantenimiento sí tiene la salvedad de la vida útil, de modo que excluirla altera la regla."
  citation: "art. 110.1.c) LIS"
  difficulty: 2
  tags:
  - "exenciones"
  - "plazo"
