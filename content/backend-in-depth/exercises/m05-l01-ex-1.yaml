type: quiz
variants:
- id: m05-l01-q01
  prompt:
    en: A bean is defined in `prototype` scope and the container creates an instance of it. Which lifecycle callbacks
      does the Spring container call on that instance?
  options:
  - id: a
    text:
      en: Both initialization and destruction callbacks are called, as for singleton beans
  - id: b
    text:
      en: Neither kind of callback is called, because the container keeps no record of the instance
  - id: c
    text:
      en: Only destruction callbacks are called, when the container is closed
  - id: d
    correct: true
    text:
      en: Initialization callbacks are called, but configured destruction callbacks are not
  explanation:
    en: Initialization callbacks are called on all objects regardless of scope, and for prototypes configured destruction
      callbacks are not called. The claim that destruction callbacks are called as for singletons is wrong, because
      the client code must clean up prototype-scoped objects and release the resources that they hold. The claim
      that neither kind of callback is called is wrong, because initialization callbacks are called on all objects
      regardless of scope. The claim that only destruction callbacks are called when the container closes is wrong,
      because configured destruction callbacks are not called for prototypes.
  citation: spring-fw-beans-factory-scopes#beans-factory-scopes-prototype
  extract:
    en: although initialization lifecycle callback methods are called on all objects regardless of scope, in the
      case of prototypes, configured destruction lifecycle callbacks are not called.
- id: m05-l01-q02
  prompt:
    en: Class A requires an instance of class B through constructor injection, and class B requires an instance
      of class A the same way. What does the Spring container do?
  options:
  - id: a
    text:
      en: It switches one of the two beans to setter injection automatically and starts both
  - id: b
    text:
      en: It creates both beans, because constructor injection resolves circular dependencies
  - id: c
    correct: true
    text:
      en: It detects the circular reference at runtime and throws a `BeanCurrentlyInCreationException`
  - id: d
    text:
      en: It starts without the second bean and skips the reference
  explanation:
    en: The container detects the circular reference at runtime and throws a `BeanCurrentlyInCreationException`.
      The claim that Spring switches one bean to setter injection automatically is wrong, because the fix is to
      edit the source code of some classes to be configured by setters rather than constructors. The claim that
      constructor injection resolves circular dependencies is wrong, because predominantly constructor injection
      can create an unresolvable circular dependency scenario. The claim that Spring starts without the second bean
      is wrong, because Spring detects circular dependencies at container load-time.
  citation: spring-fw-beans-dependencies-factory-collaborators#beans-dependency-resolution
  extract:
    en: the Spring IoC container detects this circular reference at runtime, and throws a BeanCurrentlyInCreationException.
- id: m05-l01-q03
  prompt:
    en: A bean has a `@PostConstruct` method, implements `InitializingBean`, and has a custom `init()` method, each
      configured with a different method name. In which order does Spring call them?
  options:
  - id: a
    text:
      en: The `afterPropertiesSet()` method, then the `@PostConstruct` method, then the custom `init()` method
  - id: b
    text:
      en: The custom `init()` method, then the `@PostConstruct` method, then `afterPropertiesSet()`
  - id: c
    text:
      en: All three in the order in which they are declared in the class
  - id: d
    correct: true
    text:
      en: The `@PostConstruct` method, then `afterPropertiesSet()`, then the custom `init()` method
  explanation:
    en: The `@PostConstruct` method runs first, then `afterPropertiesSet()` as defined by `InitializingBean`, then
      the custom configured `init()` method. The orders that put `afterPropertiesSet()` or the custom `init()` method
      before the `@PostConstruct` method are wrong, because the documented order starts with the methods annotated
      with `@PostConstruct`. The claim that declaration order decides is wrong, because each configured method is
      run in the order listed in the documentation.
  citation: spring-fw-beans-factory-nature#beans-factory-lifecycle-combined-effects
  extract:
    en: Methods annotated with @PostConstruct afterPropertiesSet() as defined by the InitializingBean callback interface
      A custom configured init() method
- id: m05-l01-q04
  prompt:
    en: One `BeanPostProcessor` is added programmatically with `addBeanPostProcessor` and another is registered
      through auto-detection. How does Spring order them when the auto-detected one has an explicit order?
  options:
  - id: a
    text:
      en: Both run by the value of their `order` property, whichever way they were registered
  - id: b
    text:
      en: The auto-detected one is processed first, because it has an explicit order
  - id: c
    correct: true
    text:
      en: The programmatic one is processed first, regardless of any explicit ordering
  - id: d
    text:
      en: They run in the alphabetical order of their class names
  explanation:
    en: Programmatically registered instances are always processed before auto-detected ones, regardless of any
      explicit ordering. The claim that both run by their `order` value is wrong, because programmatically added
      instances do not respect the `Ordered` interface. The claim that the auto-detected one runs first is wrong,
      because programmatically registered instances are always processed before the auto-detected ones. The claim
      that class names decide is wrong, because the order of registration dictates the order of execution for programmatic
      registration.
  citation: spring-fw-beans-factory-extension#beans-factory-extension-bpp
  extract:
    en: BeanPostProcessor instances registered programmatically are always processed before those registered through
      auto-detection, regardless of any explicit ordering.
- id: m05-l01-q05
  prompt:
    en: An application creates only a plain `DefaultListableBeanFactory`, populates it with bean definitions, and
      some of those beans implement `BeanPostProcessor`. What happens to those post-processors?
  options:
  - id: a
    text:
      en: They are detected by bean name or type, as in any `ApplicationContext`
  - id: b
    correct: true
    text:
      en: They do not get detected and activated by default
  - id: c
    text:
      en: They are registered automatically, because every `BeanFactory` supports automatic registration
  - id: d
    text:
      en: The factory fails to start with an exception, because the post-processors cannot be resolved
  explanation:
    en: Such post-processors do not get detected and activated by default. The claim that they are detected by name
      or type is wrong, because a plain `DefaultListableBeanFactory` is agnostic about any special beans. The claim
      that automatic registration applies is wrong, because the feature matrix lists automatic `BeanPostProcessor`
      registration as No for `BeanFactory`. The claim that the factory fails to start is wrong, because nothing
      is actually wrong with the bean configuration and the container only needs additional setup.
  citation: spring-fw-beans-beanfactory#context-introduction-ctx-vs-beanfactory
  extract:
    en: such post-processors do not get detected and activated by default.
- id: m05-l01-q06
  prompt:
    en: Several beans of the same type are candidates for a single-valued `@Autowired` dependency, and exactly one
      of them is annotated `@Primary`. Which bean does Spring inject?
  options:
  - id: a
    correct: true
    text:
      en: The `@Primary` bean becomes the autowired value
  - id: b
    text:
      en: The bean whose name matches the injection point name, ignoring `@Primary`
  - id: c
    text:
      en: None of them, because Spring throws an exception whenever several candidates exist
  - id: d
    text:
      en: The candidate that was registered first, because registration order decides
  explanation:
    en: If exactly one primary bean exists among the candidates, it becomes the autowired value. The claim that
      the injection point name overrides `@Primary` is wrong, because name matching applies only when there is no
      other resolution indicator such as a primary marker. The claim that Spring throws an exception is wrong, because
      `@Primary` gives a bean preference when multiple beans are candidates for a single-valued dependency. The
      claim that registration order decides is wrong, because `@Primary` is the way to use autowiring by type with
      several instances when one primary candidate can be determined.
  citation: spring-fw-beans-annotation-config-autowired-primary#page-title; spring-fw-beans-annotation-config-autowired-qualifiers#page-title
  extract:
    en: If exactly one primary bean exists among the candidates, it becomes the autowired value.
- id: m05-l01-q07
  prompt:
    en: Several `MovieCatalog` beans share the qualifier value `action`, and a `Set<MovieCatalog>` injection point
      is annotated `@Qualifier("action")`. Which beans does Spring inject?
  options:
  - id: a
    text:
      en: Only the first bean registered, because qualifier values must be unique
  - id: b
    correct: true
    text:
      en: All matching beans, because qualifiers are filtering criteria and need not be unique
  - id: c
    text:
      en: None, because a qualifier value must select exactly one bean
  - id: d
    text:
      en: Only the bean whose name is `action`, because the qualifier is a bean id
  explanation:
    en: All matching beans, according to the declared qualifiers, are injected as a collection. The claim that qualifier
      values must be unique is wrong, because qualifiers do not have to be unique. The claim that a qualifier must
      select exactly one bean is wrong, because qualifiers constitute filtering criteria. The claim that the qualifier
      is a bean id is wrong, because qualifier values do not semantically express a reference to a unique bean id.
  citation: spring-fw-beans-annotation-config-autowired-qualifiers#page-title
  extract:
    en: In this case, all matching beans, according to the declared qualifiers, are injected as a collection.
- id: m05-l01-q09
  prompt:
    en: A `@Bean` method in a class without `@Configuration` calls another `@Bean` method of the same class directly
      in Java. What does the Spring reference say about that call?
  options:
  - id: a
    correct: true
    text:
      en: The container does not intercept it, and it creates a new instance every time
  - id: b
    text:
      en: The container intercepts it and returns the existing singleton instance
  - id: c
    text:
      en: The call fails with an exception, because lite mode forbids calls between `@Bean` methods
  - id: d
    text:
      en: The call returns a CGLIB proxy of the bean, created on demand
  explanation:
    en: A custom Java call to such a method is not intercepted by the container, so it creates a new instance every
      time. The claim that the container intercepts the call is wrong, because in lite mode `@Bean` methods are
      a general-purpose factory method mechanism without special runtime processing. The claim that the call fails
      with an exception is wrong, because the call behaves just like a regular method call. The claim that a CGLIB
      proxy is returned is wrong, because lite mode needs no CGLIB subclassing at runtime.
  citation: spring-fw-beans-java-basic-concepts#page-title
  extract:
    en: A custom Java call to such a method will not get intercepted by the container and therefore behaves just
      like a regular method call, creating a new instance every time rather than reusing an existing singleton (or
      scoped) instance for the given bean.
- id: m05-l01-q11
  prompt:
    en: A `BeanPostProcessor` is registered with the container. For each bean instance that the container creates,
      at which points does the post-processor get a callback?
  options:
  - id: a
    correct: true
    text:
      en: Both before the initialization methods are called and after any bean initialization callbacks
  - id: b
    text:
      en: Only after the bean has been fully initialized
  - id: c
    text:
      en: Only before the container instantiates the bean
  - id: d
    text:
      en: Only once, when the bean definition is registered
  explanation:
    en: The post-processor gets a callback both before the initialization methods are called and after any bean
      initialization callbacks. The claim that it is called only after initialization is wrong, because the callback
      also comes before the container initialization methods are called. The claim that it is called before instantiation
      is wrong, because the container instantiates a bean instance and then the post-processors do their work. The
      claim that it is called once at registration is wrong, because the callback happens for each bean instance
      that is created by the container.
  citation: spring-fw-beans-factory-extension#beans-factory-extension-bpp
  extract:
    en: the post-processor gets a callback from the container both before container initialization methods (such
      as InitializingBean.afterPropertiesSet() or any declared init method) are called, and after any bean initialization
      callbacks.
