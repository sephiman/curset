template: |
  public class Main {
      static boolean identical(Integer p, Integer q) {
          return p == q;
      }

      static boolean equal(Integer p, Integer q) {
          return p.equals(q);
      }

      public static void main(String[] args) {
          Integer a = Integer.valueOf(@@x1@@);
          Integer b = Integer.valueOf(@@y1@@);
          Integer c = Integer.valueOf(@@x2@@);
          Integer d = Integer.valueOf(@@y2@@);
          System.out.println(identical(a, b));
          System.out.println(equal(a, b));
          System.out.println(identical(c, d));
          System.out.println(equal(c, d));
      }
  }
explanation: '`identical` uses `==`, which compares references, and `equal` uses `equals`, which compares the `int` values. @@why@@ The program prints @@key@@.'
mistakes:
- name: treating `==` on `Integer` as a comparison of the `int` values
  replace:
  - return p == q;
  - return p.intValue() == q.intValue();
  why: '`==` on two `Integer` references is `true` only when both refer to the same object, and `valueOf` is guaranteed to return shared objects only for -128 to 127.'
- name: taking `equals` to compare references
  replace:
  - return p.equals(q);
  - return p == q;
  why: '`Integer.equals` is `true` if and only if the argument is an `Integer` holding the same `int` value.'
- name: assuming `valueOf` never shares objects
  replace:
