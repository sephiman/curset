# anchor: boe-a-2014-12328-art-33
- id: m03-l17-q0086
  prompt:
    es: "De acuerdo con el artículo 33.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, tiene una bonificación del 60 por ciento la parte de cuota íntegra que corresponda a las rentas obtenidas en Ceuta o Melilla por entidades que:"
  options:
  - id: a
    text:
      es: "tengan su domicilio fiscal en dichos territorios, con independencia del lugar donde operen o de dónde obtengan sus rentas."
  - id: b
    correct: true
    text:
      es: "operen efectiva y materialmente en dichos territorios, aunque estén domiciliadas fuera de ellos si operan mediante establecimiento o sucursal."
  - id: c
    text:
      es: "realicen operaciones aisladas de extracción, fabricación o compra de géneros en dichos territorios."
  - id: d
    text:
      es: "sean entidades extranjeras no residentes que operen en dichos territorios sin establecimiento permanente."
  explanation:
    es: "La bonificación exige operar efectiva y materialmente en Ceuta o Melilla: lo hacen las entidades españolas domiciliadas allí, las domiciliadas fuera que operan con establecimiento o sucursal, y las extranjeras con establecimiento permanente. El domicilio solo no basta. Las operaciones aisladas de extracción, fabricación o compra no determinan por sí solas rentas obtenidas en esos territorios. Y las entidades extranjeras necesitan establecimiento permanente."
  citation: "art. 33.1 LIS"
  difficulty: 1
  tags:
  - "bonificaciones"
  - "Ceuta y Melilla"
# anchor: boe-a-2014-12328-art-33
- id: m03-l17-q0087
  prompt:
    es: "Conforme al artículo 33.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre las rentas obtenidas en Ceuta o Melilla a efectos de la bonificación:"
  options:
  - id: a
    correct: true
    text:
      es: "Son las que corresponden a actividades que determinen en dichos territorios el cierre de un ciclo mercantil con resultados económicos."
  - id: b
    text:
      es: "Son las que derivan de operaciones aisladas de extracción, fabricación, compra o transporte en dichos territorios."
  - id: c
    text:
      es: "Son las obtenidas por cualquier entidad domiciliada en dichos territorios, aunque la actividad se desarrolle fuera de ellos o sin ciclo mercantil."
  - id: d
    text:
      es: "No se considera cumplido el requisito en el arrendamiento de inmuebles situados en dichos territorios."
  explanation:
    es: "Las rentas son las de actividades que cierran en Ceuta o Melilla un ciclo mercantil con resultados económicos. Las operaciones aisladas de extracción, fabricación, compra o transporte no cuentan, salvo que determinen por sí solas rentas. El domicilio por sí solo no basta: la actividad debe cerrar el ciclo allí. Y el arrendamiento de inmuebles situados en esos territorios sí se considera que cumple el requisito."
  citation: "art. 33.2 LIS"
  difficulty: 2
  tags:
  - "bonificaciones"
  - "Ceuta y Melilla"
# anchor: boe-a-2014-12328-art-33
- id: m03-l17-q0088
  prompt:
    es: "Conservas del Estrecho SL, que no forma parte de ningún grupo, tiene un lugar fijo de negocios en Ceuta desde 2020 y 5 personas empleadas con contrato laboral y jornada completa que ejercen allí sus funciones. Conforme al artículo 33.3 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, ¿hasta qué importe se presumen obtenidas en Ceuta sus rentas, sin necesidad de acreditar el cierre de un ciclo mercantil?"
  options:
  - id: a
    text:
      es: "Hasta 600.000 euros, a razón de 120.000 euros por persona empleada, importe que solo rige en los dos primeros períodos tras establecer el lugar fijo."
  - id: b
    text:
      es: "Hasta 1.200.000 euros, el límite máximo total, con independencia del número de personas empleadas."
  - id: c
    correct: true
    text:
      es: "Hasta 300.000 euros, a razón de 60.000 euros por persona empleada, por debajo del límite máximo total de 1.200.000 euros."
  - id: d
    text:
      es: "Hasta 60.000 euros, importe que se presume por el lugar fijo de negocios con independencia del número de empleados."
  explanation:
    es: "Con un lugar fijo de negocios, la presunción llega a 60.000 euros por persona empleada con contrato laboral y jornada completa, con un máximo total de 1.200.000 euros. Con 5 empleados: 5 x 60.000 = 300.000 euros, por debajo del máximo. Los 120.000 euros por persona rigen solo los dos primeros períodos desde el establecimiento del lugar fijo, y aquí pasaron años. El máximo total es un tope, no un importe automático. Y los 60.000 euros se multiplican por el número de empleados."
  citation: "art. 33.3 LIS"
  difficulty: 3
  tags:
  - "bonificaciones"
  - "Ceuta y Melilla"
  - "cómputo"
# anchor: boe-a-2014-12328-art-33
- id: m03-l17-q0089
  prompt:
    es: "Según el artículo 33.3 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, durante los dos primeros períodos impositivos que se inicien a partir del establecimiento del lugar fijo de negocios en Ceuta o Melilla, las rentas se presumen obtenidas allí hasta un importe de:"
  options:
  - id: a
    correct: true
    text:
      es: "120.000 euros por persona empleada con contrato laboral y jornada completa, con un límite máximo total de 2.400.000 euros."
  - id: b
    text:
      es: "60.000 euros por persona empleada con contrato laboral y jornada completa, con un límite máximo total de 1.200.000 euros."
  - id: c
    text:
      es: "120.000 euros por persona empleada con contrato laboral y jornada completa, con un límite máximo total de 1.200.000 euros."
  - id: d
    text:
      es: "90.000 euros por persona empleada con contrato laboral y jornada completa, con un límite máximo total de 2.400.000 euros."
  explanation:
    es: "En los dos primeros períodos el importe sube a 120.000 euros por empleado, con un máximo de 2.400.000 euros. Los 60.000 euros y 1.200.000 euros son las cifras generales, que rigen después. Combinar 120.000 con el máximo general mezcla los dos regímenes. Y 90.000 euros no es una cifra del artículo."
  citation: "art. 33.3 LIS"
  difficulty: 2
  tags:
  - "bonificaciones"
  - "Ceuta y Melilla"
# anchor: boe-a-2014-12328-art-34
- id: m03-l17-q0090
  prompt:
    es: "Según el artículo 34 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, ¿qué bonificación tiene la parte de cuota íntegra que corresponda a las rentas derivadas de la prestación de servicios públicos locales de competencia de las entidades locales?"
  options:
  - id: a
    text:
      es: "Una bonificación del 60 por ciento."
  - id: b
    text:
      es: "Una bonificación del 75 por ciento."
  - id: c
    correct: true
    text:
      es: "Una bonificación del 99 por ciento."
  - id: d
    text:
      es: "Una bonificación del 50 por ciento."
  explanation:
    es: "La bonificación por prestación de servicios públicos locales es del 99 por ciento de la parte de cuota íntegra correspondiente a esas rentas. El 60 por ciento es la bonificación por rentas obtenidas en Ceuta o Melilla. Los porcentajes del 75 y del 50 no son los del artículo."
  citation: "art. 34 LIS"
  difficulty: 2
  tags:
  - "bonificaciones"
  - "servicios públicos locales"
# anchor: boe-a-2014-12328-art-34
- id: m03-l17-q0091
  prompt:
    es: "De acuerdo con el artículo 34 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, tiene una bonificación del 99 por ciento la parte de cuota íntegra de las rentas derivadas de la prestación de servicios de competencia de las entidades locales, excepto cuando se exploten:"
  options:
  - id: a
    text:
      es: "por entidades íntegramente dependientes del Estado o de las comunidades autónomas."
  - id: b
    correct: true
    text:
      es: "por el sistema de empresa mixta o de capital íntegramente privado."
  - id: c
    text:
      es: "por la propia entidad local territorial, municipal o provincial."
  - id: d
    text:
      es: "por el sistema de concesión a una empresa de capital íntegramente público."
  explanation:
    es: "La bonificación no alcanza a los servicios explotados por el sistema de empresa mixta o de capital íntegramente privado. Los prestados por entidades íntegramente dependientes del Estado o de las comunidades autónomas sí la tienen, según el segundo párrafo. La explotación por la propia entidad local es el supuesto natural del artículo. Y una empresa de capital íntegramente público no es empresa mixta ni de capital privado, así que queda fuera de la excepción."
  citation: "art. 34 LIS"
  difficulty: 1
  tags:
  - "bonificaciones"
  - "servicios públicos locales"
# anchor: boe-a-2014-12328-art-40
- id: m03-l17-q0092
  prompt:
    es: "Construcciones del Sur SA tiene un período impositivo que va del 1 de julio de 2026 al 30 de junio de 2027 y no está entre las entidades dispensadas del pago fraccionado. Conforme al artículo 40.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, ¿a cuenta de qué período debe efectuar el pago fraccionado de octubre de 2026 y hasta qué día puede ingresarlo?"
  options:
  - id: a
    text:
      es: "A cuenta del período concluido el 30 de junio de 2026, y hasta el 20 de octubre de 2026."
  - id: b
    text:
      es: "A cuenta del período del 1 de julio de 2026 al 30 de junio de 2027, que está en curso el 1 de octubre, y hasta el 30 de octubre de 2026."
  - id: c
    text:
      es: "A cuenta del período del 1 de julio de 2026 al 30 de junio de 2027, que está en curso el 1 de octubre, y hasta el 20 de noviembre de 2026."
  - id: d
    correct: true
    text:
      es: "A cuenta del período del 1 de julio de 2026 al 30 de junio de 2027, que está en curso el 1 de octubre, y hasta el 20 de octubre de 2026."
  explanation:
    es: "El pago fraccionado se ingresa en los primeros 20 días naturales de octubre, a cuenta de la liquidación del período que esté en curso el día 1 de ese mes. El 1 de octubre de 2026 está en curso el período iniciado el 1 de julio de 2026. Los 20 primeros días naturales terminan el 20 de octubre de 2026, que es martes. El período ya concluido el 30 de junio no es el que está en curso el día 1. El 30 de octubre supone 30 días, y el 20 de noviembre cae en un mes en que no se paga: los pagos son de abril, octubre y diciembre."
  citation: "art. 40.1 LIS"
  difficulty: 3
  tags:
  - "pago fraccionado"
  - "plazo"
  - "cómputo"
# anchor: boe-a-2014-12328-art-40
- id: m03-l17-q0093
  prompt:
    es: "¿Qué entidades quedan dispensadas de efectuar el pago fraccionado y de presentar la correspondiente declaración, según el artículo 40.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades?"
  options:
  - id: a
    text:
      es: "Las entidades que tributan al tipo del 10 por ciento por la ley de entidades sin fines lucrativos y las que tributan al 1 por ciento."
  - id: b
    correct: true
    text:
      es: "Las entidades que tributan al tipo del 1 por ciento o al tipo del cero por ciento."
  - id: c
    text:
      es: "Las entidades de crédito y las que tributan al tipo del cero por ciento."
  - id: d
    text:
      es: "Las entidades de nueva creación durante sus dos primeros períodos impositivos con base positiva."
  explanation:
    es: "Quedan dispensadas las entidades de los apartados 4 y 5 del artículo 29: las que tributan al 1 por ciento y los fondos de pensiones, al cero por ciento. Las acogidas a la ley de entidades sin fines lucrativos, que tributan al 10 por ciento, no están dispensadas. Tampoco lo están las entidades de crédito, que tributan al 30 por ciento. Y las de nueva creación no figuran en la excepción, aunque tributen al 15 por ciento."
  citation: "art. 40.1 LIS"
  difficulty: 2
  tags:
  - "pago fraccionado"
# anchor: boe-a-2014-12328-art-124
- id: m03-l17-q0094
  prompt:
    es: "De acuerdo con el artículo 124.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, la declaración por el impuesto se presenta en el plazo de:"
  options:
  - id: a
    text:
      es: "los 20 días naturales siguientes a los 6 meses posteriores a la conclusión del período impositivo."
  - id: b
    text:
      es: "los 25 días naturales siguientes a los 3 meses posteriores a la conclusión del período impositivo."
  - id: c
    text:
      es: "los 30 días naturales siguientes a los 6 meses posteriores a la conclusión del período impositivo."
  - id: d
    correct: true
    text:
      es: "los 25 días naturales siguientes a los 6 meses posteriores a la conclusión del período impositivo."
  explanation:
    es: "La declaración se presenta en los 25 días naturales siguientes a los 6 meses posteriores a la conclusión del período. Veinte días es el plazo de los pagos fraccionados. Tres meses acorta el plazo de espera. Y treinta días alarga el plazo de presentación."
  citation: "art. 124.1 LIS"
  difficulty: 1
  tags:
  - "declaración"
  - "plazo"
# anchor: boe-a-2014-12328-art-124
- id: m03-l17-q0095
  prompt:
    es: "Distribuciones Levante SL tiene un ejercicio económico que va del 1 de abril de 2026 al 31 de marzo de 2027. Conforme al artículo 124.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, y sin considerar los supuestos en que no esté determinada la forma de presentación, ¿hasta qué día puede presentar la declaración por el impuesto de ese período?"
  options:
  - id: a
    text:
      es: "Hasta el 25 de septiembre de 2027, porque son los 25 días naturales siguientes a los 5 meses posteriores al 31 de marzo de 2027."
  - id: b
    text:
      es: "Hasta el 25 de abril de 2027, porque son los 25 días naturales siguientes al 31 de marzo de 2027."
  - id: c
    correct: true
    text:
      es: "Hasta el 25 de octubre de 2027, porque son los 25 días naturales siguientes a los 6 meses posteriores al 31 de marzo de 2027."
  - id: d
    text:
      es: "Hasta el 25 de julio de 2027, porque son los 25 días naturales siguientes a los 3 meses posteriores al 31 de marzo de 2027."
  explanation:
    es: "El período concluye el 31 de marzo de 2027. Seis meses después, el 30 de septiembre de 2027, termina la espera, y los 25 días naturales siguientes van del 1 al 25 de octubre de 2027, que es lunes. Contar cinco meses lleva al 25 de septiembre. Contar 25 días desde el cierre, sin los seis meses, lleva al 25 de abril. Y contar tres meses lleva al 25 de julio. Ninguna de esas fechas respeta los 6 meses que exige el artículo."
  citation: "art. 124.1 LIS"
  difficulty: 3
  tags:
  - "declaración"
  - "plazo"
  - "cómputo"
# anchor: boe-a-2014-12328-art-124
- id: m03-l17-q0097
  prompt:
    es: "Según el artículo 124.3 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, los contribuyentes parcialmente exentos del impuesto están obligados a declarar:"
  options:
  - id: a
    text:
      es: "únicamente las rentas no exentas, aunque tengan otras exentas."
  - id: b
    text:
      es: "únicamente las rentas exentas, a efectos informativos de la Administración."
  - id: c
    correct: true
    text:
      es: "la totalidad de sus rentas, exentas y no exentas."
  - id: d
    text:
      es: "la totalidad de sus rentas, salvo las que procedan de transmisiones a título lucrativo."
  explanation:
    es: "Los contribuyentes parcialmente exentos declaran la totalidad de sus rentas, exentas y no exentas. Limitar la declaración a las rentas no exentas o a las exentas deja fuera parte de ellas. Y la excepción de las transmisiones a título lucrativo no existe: el artículo no excluye ninguna renta."
  citation: "art. 124.3 LIS"
  difficulty: 1
  tags:
  - "declaración"
  - "exenciones"
# anchor: boe-a-2014-12328-art-126
- id: m03-l17-q0107
  prompt:
    es: "Según el artículo 126 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, los órganos de gestión tributaria pueden girar la liquidación provisional que proceda, sin perjuicio de la posterior comprobación e investigación que pueda realizar:"
  options:
  - id: a
    text:
      es: "la Dirección General de Tributos, mediante la contestación a consultas vinculantes."
  - id: b
    correct: true
    text:
      es: "la Inspección de los Tributos, en el ejercicio de sus funciones de comprobación e investigación."
  - id: c
    text:
      es: "los Tribunales Económico-Administrativos, de oficio, al revisar la liquidación."
  - id: d
    text:
      es: "el Tribunal de Cuentas, como órgano de fiscalización de las cuentas del sector público estatal y local."
  explanation:
    es: "El artículo 126 reserva la posterior comprobación e investigación a la Inspección de los Tributos. La Dirección General de Tributos contesta consultas, no comprueba al contribuyente. Los Tribunales Económico-Administrativos resuelven reclamaciones, no inician comprobaciones de oficio. Y el Tribunal de Cuentas fiscaliza al sector público, no a los contribuyentes del impuesto."
  citation: "art. 126 LIS"
  difficulty: 1
  tags:
  - "liquidación provisional"
# anchor: boe-a-2014-12328-art-127
- id: m03-l17-q0100
  prompt:
    es: "De acuerdo con el artículo 127.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, cuando la suma de las retenciones, ingresos a cuenta y pagos fraccionados sea superior a la cuota resultante de la autoliquidación, la Administración tributaria practica, si procede, liquidación provisional dentro de:"
  options:
  - id: a
    text:
      es: "los 3 meses siguientes al término del plazo establecido para la presentación de la declaración."
  - id: b
    correct: true
    text:
      es: "los 6 meses siguientes al término del plazo establecido para la presentación de la declaración."
  - id: c
    text:
      es: "los 12 meses siguientes al término del plazo establecido para la presentación de la declaración."
  - id: d
    text:
      es: "los 6 meses siguientes a la presentación de la declaración, aunque esta se haya presentado en plazo."
  explanation:
    es: "La liquidación provisional se practica dentro de los 6 meses siguientes al término del plazo de presentación. Tres y doce meses no son el plazo del artículo. Y contar desde la presentación solo vale cuando la declaración se presentó fuera de plazo: si se presentó en plazo, el cómputo parte del término del plazo."
  citation: "art. 127.1 LIS"
  difficulty: 1
  tags:
  - "devolución"
  - "plazo"
# anchor: boe-a-2014-12328-art-127
- id: m03-l17-q0101
  prompt:
    es: "Dunas del Sur SA presenta fuera de plazo, el 10 de noviembre de 2027, su declaración del período de 2026. La suma de retenciones, ingresos a cuenta y pagos fraccionados es superior a la cuota autoliquidada. Conforme al artículo 127.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, ¿hasta qué fecha puede la Administración tributaria practicar la liquidación provisional del plazo de ese apartado?"
  options:
  - id: a
    text:
      es: "Hasta finales de enero de 2028, porque los 6 meses se computan desde el término del plazo de declaración de ese período impositivo."
  - id: b
    text:
      es: "Hasta el 10 de febrero de 2028, porque son 3 meses desde la fecha de presentación."
  - id: c
    text:
      es: "Hasta el 10 de noviembre de 2028, porque son 12 meses desde la fecha de presentación."
  - id: d
    correct: true
    text:
      es: "Hasta el 10 de mayo de 2028, porque al presentarse fuera de plazo los 6 meses se computan desde la fecha de presentación."
  explanation:
    es: "Cuando la declaración se presenta fuera de plazo, los 6 meses se computan desde la fecha de su presentación. Desde el 10 de noviembre de 2027, seis meses terminan el 10 de mayo de 2028, que es miércoles. Computar desde el término del plazo de declaración es la regla de las declaraciones presentadas en plazo, y aquí no se aplica. Tres meses y doce meses no son el plazo del artículo."
  citation: "art. 127.1 LIS"
  difficulty: 3
  tags:
  - "devolución"
  - "plazo"
  - "cómputo"
# anchor: boe-a-2014-12328-art-127
- id: m03-l17-q0102
  prompt:
    es: "Según el artículo 127.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, cuando la cuota resultante de la autoliquidación sea inferior a la suma de las cantidades retenidas, los ingresos a cuenta y los pagos fraccionados realizados, la Administración tributaria procede:"
  options:
  - id: a
    text:
      es: "a devolver el exceso solo previa solicitud del contribuyente, sin perjuicio de las ulteriores liquidaciones, provisionales o definitivas, que procedan después."
  - id: b
    correct: true
    text:
      es: "a devolver de oficio el exceso sobre la citada cuota, sin perjuicio de las ulteriores liquidaciones, provisionales o definitivas, que procedan."
  - id: c
    text:
      es: "a compensar el exceso con las cuotas de los períodos siguientes, sin que quepa devolución alguna."
  - id: d
    text:
      es: "a devolver de oficio el exceso con carácter definitivo, sin que puedan practicarse ulteriores liquidaciones."
  explanation:
    es: "La Administración devuelve de oficio el exceso, y lo hace sin perjuicio de liquidaciones posteriores, provisionales o definitivas. Exigir solicitud elimina el carácter de oficio. La compensación con cuotas futuras sin devolución no figura en el artículo. Y la devolución no cierra el procedimiento: las ulteriores liquidaciones siguen siendo posibles."
  citation: "art. 127.2 LIS"
  difficulty: 1
  tags:
  - "devolución"
# anchor: boe-a-2014-12328-art-127
- id: m03-l17-q0103
  prompt:
    es: "Conforme al artículo 127.3 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre el supuesto en que se hubiera dejado de practicar la liquidación provisional en el plazo del apartado 1:"
  options:
  - id: a
    correct: true
    text:
      es: "La Administración tributaria procede a devolver de oficio el exceso sobre la cuota autoliquidada, sin perjuicio de las liquidaciones provisionales o definitivas ulteriores que procedan."
  - id: b
    text:
      es: "La Administración tributaria devuelve el exceso solo si el contribuyente lo solicita, y archiva el expediente en otro caso, sin practicar liquidación alguna."
  - id: c
    text:
      es: "La Administración tributaria no procede a devolver nada hasta que se practique la liquidación provisional."
  - id: d
    text:
      es: "La Administración tributaria devuelve de oficio el exceso sobre la cuota resultante de la liquidación provisional, practicada fuera de plazo."
  explanation:
    es: "Si la liquidación provisional no se practica en plazo, la Administración devuelve de oficio el exceso sobre la cuota autoliquidada, con la reserva de las liquidaciones posteriores. No hace falta solicitud. Condicionar la devolución a la liquidación provisional la deja sin plazo, que es lo que el apartado 3 evita. Y la devolución se calcula sobre la cuota autoliquidada, porque no hay liquidación provisional."
  citation: "art. 127.3 LIS"
  difficulty: 2
  tags:
  - "devolución"
