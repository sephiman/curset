m03-l02-q01:
  key:
    anchor: javadoc-concurrent-package#MemoryVisibility
    sentence: Writes and reads of volatile fields have similar memory consistency effects as entering and exiting monitors, but do not entail mutual exclusion locking.
  wrong:
  - option: A volatile write excludes other threads from running any code between the write and the next read by holding a lock
    anchor: javadoc-concurrent-package#MemoryVisibility
    sentence: Writes and reads of volatile fields have similar memory consistency effects as entering and exiting monitors, but do not entail mutual exclusion locking.
  - option: A volatile write is visible to a read in another thread only if both threads also use `synchronized` blocks on the same lock
    anchor: jls-17#jls-17.4.5
    sentence: A write to a volatile field (§8.3.1.4) happens-before every subsequent read of that field.
  - option: A volatile field makes compound updates such as an increment atomic without any other synchronization
    anchor: jls-17#jls-17.4.3
    sentence: Sequential consistency and/or freedom from data races still allows errors arising from groups of operations that need to be perceived atomically and are not.
m03-l02-q02:
  key:
    anchor: jls-17#jls-17.7
    sentence: 'For the purposes of the Java programming language memory model, a single write to a non-volatile long or double value is treated as two separate writes: one to each 32-bit half.'
  wrong:
  - option: Only the complete old value or the complete new value, because every write is atomic
    anchor: jls-17#jls-17.7
    sentence: 'For the purposes of the Java programming language memory model, a single write to a non-volatile long or double value is treated as two separate writes: one to each 32-bit half.'
  - option: Always a split value, because every JVM must write 64-bit values in two parts
    anchor: jls-17#jls-17.7
    sentence: an implementation of the Java Virtual Machine is free to perform writes to long and double values atomically or in two parts.
  - option: A split value that can also occur when the field is declared `volatile`
    anchor: jls-17#jls-17.7
    sentence: Writes and reads of volatile long and double values are always atomic.
m03-l02-q03:
  key:
    anchor: javadoc-atomic-package#package-java-util-concurrent-atomic
    sentence: The AtomicStampedReference class associates an integer value with a reference.
  wrong:
