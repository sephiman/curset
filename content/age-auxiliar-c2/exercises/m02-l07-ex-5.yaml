# anchor: fuente-ms-win-indexacion-html
- id: m02-l07-q114
  prompt:
    es: "En la configuración de búsqueda de Windows 11, ¿cuál de las siguientes afirmaciones describe el modo de indexación Mejorado de «Encontrar mis archivos»?"
  options:
  - id: a
    text:
      es: "Indexa Documentos, Imágenes y Música y usa menos recursos"
  - id: b
    correct: true
    text:
      es: "Indexa todo el equipo y puede usar más recursos del sistema"
  - id: c
    text:
      es: "Indexa todo el equipo y usa menos recursos que el Clásico"
  - id: d
    text:
      es: "Indexa solo las carpetas que se añaden con el botón Modificar"
  explanation:
    es: "La página dice que el modo Mejorado indexa todo el equipo, incluidas todas las carpetas y archivos de usuario, y que da resultados más completos pero puede usar más recursos del sistema. Documentos, Imágenes y Música son las carpetas del modo Clásico. La opción que dice que usa menos recursos invierte la advertencia. Añadir carpetas con «Modificar» es cómo se amplía el modo Clásico."
  citation: "fuente: `ms-win-indexacion.html`; «Elige dónde buscará los archivos tu PC»"
