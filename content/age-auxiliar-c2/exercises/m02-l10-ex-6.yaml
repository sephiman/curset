# anchor: fuente-ms-access-combinaciones-html
- id: m02-l10-q261
  prompt:
    es: "En una consulta de Access 365, ¿cuál de las siguientes opciones describe los registros que incluye una combinación externa izquierda?"
  options:
  - id: a
    text:
      es: "Todos los registros de la segunda tabla y los de la otra con valores comunes"
  - id: b
    correct: true
    text:
      es: "Todos los registros de la primera tabla y los de la otra con valores comunes"
  - id: c
    text:
      es: "Solo los registros que tienen correspondencia en las dos tablas"
  - id: d
    text:
      es: "Todas las combinaciones posibles de registros de las dos tablas"
  explanation:
    es: "La combinación externa izquierda incluye todos los registros de la tabla izquierda, la que figura antes en la cláusula FROM, y solo las filas de la otra tabla con valores comunes. Todos los de la tabla derecha es la combinación externa derecha. Solo los que se corresponden en las dos es la combinación interna. Todas las combinaciones posibles de registros es la combinación cruzada."
  citation: "fuente: `ms-access-combinaciones.html`; «Combinaciones externas: todos los datos relacionados combinados correctamente, más todos los registros restantes de una tabla»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-access-combinaciones-html
- id: m02-l10-q262
  prompt:
    es: "En una consulta de Access 365, ¿cuál de las siguientes afirmaciones sobre la combinación externa completa es correcta?"
  options:
  - id: a
    text:
      es: "Se elige como opción 4 en las propiedades de la combinación."
  - id: b
    text:
      es: "Es otro nombre de la combinación externa derecha."
  - id: c
    text:
      es: "Access la crea automáticamente entre tablas relacionadas."
  - id: d
    correct: true
    text:
      es: "Access no la admite explícitamente."
  explanation:
    es: "La página dice que, en algunos sistemas, la combinación externa completa incluye todas las filas de ambas tablas, pero que Access no la admite explícitamente. La que Access crea automáticamente entre tablas relacionadas es la combinación interna. En Propiedades de la combinación solo hay tres opciones: interna, externa izquierda y externa derecha. La externa derecha incluye todos los registros de la tabla derecha, no los de ambas."
  citation: "fuente: `ms-access-combinaciones.html`; «Combinaciones externas completas: todos los datos, combinados cuando sea posible»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q180
  prompt:
    es: "Con una tabla seleccionada en Access 365, ¿cuál de las siguientes opciones describe lo que hace el comando Formulario del grupo Formularios?"
  options:
  - id: a
    text:
      es: "Coloca solo los campos de la clave principal y lo abre en la vista Diseño"
  - id: b
    text:
      es: "Abre un asistente que pregunta qué campos se incluyen en el formulario"
  - id: c
    text:
      es: "Abre un formulario vacío con el panel Lista de campos a la vista"
  - id: d
    correct: true
    text:
      es: "Coloca todos los campos de la tabla y abre el formulario en la vista Presentación"
  explanation:
    es: "La ayuda dice que la herramienta Formulario «coloca todos los campos del origen de datos subyacente en el formulario» y lo muestra en la vista Presentación. Colocar solo los campos de la clave principal y abrir la vista Diseño contradice las dos mitades. Preguntar qué campos se incluyen es el Asistente para formularios, que la página trata en otra sección. Y abrir un formulario vacío con la Lista de campos es la herramienta Formulario en blanco, también en otra sección."
  citation: "fuente: `ms-access-formularios.html`; «Access crea el formulario y lo muestra en la vista Presentación.»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q181
  prompt:
    es: "¿Cuál de las siguientes herramientas de Access 365 permite definir cómo se agrupan y ordenan los datos del formulario y usar campos de más de una tabla o consulta?"
  options:
  - id: a
    text:
      es: "La herramienta Formulario"
  - id: b
    correct: true
    text:
      es: "El Asistente para formularios"
  - id: c
    text:
      es: "La herramienta Varios elementos"
  - id: d
    text:
      es: "La herramienta Formulario dividido"
  explanation:
    es: "La ayuda dice que con el Asistente para formularios «también puede definir cómo se agrupan y ordenan los datos, y puede usar campos de más de una tabla o consulta». La herramienta Formulario coloca todos los campos de un origen, Varios elementos muestra varios registros a la vez y Formulario dividido muestra a la vez las vistas Formulario y Hoja de datos."
  citation: "fuente: `ms-access-formularios.html`; «Crear un formulario mediante el Asistente para formularios»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q182
  prompt:
    es: "¿Cuál de las siguientes herramientas de Access 365 crea un formulario con una vista Formulario y una vista Hoja de datos conectadas al mismo origen y sincronizadas?"
  options:
  - id: a
    text:
      es: "Varios elementos"
  - id: b
    text:
      es: "Formulario en blanco"
  - id: c
    correct: true
    text:
      es: "Formulario dividido"
  - id: d
    text:
      es: "Asistente para formularios"
  explanation:
    es: "La ayuda dice que un formulario dividido «proporciona dos vistas de los datos al mismo tiempo: una vista Formulario y una vista Hoja de datos», conectadas al mismo origen y sincronizadas. Varios elementos muestra varios registros en filas y columnas, Formulario en blanco abre un formulario vacío y el Asistente para formularios guía la elección de campos."
  citation: "fuente: `ms-access-formularios.html`; «Crear un formulario dividido mediante la herramienta Formulario dividido»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q183
  prompt:
    es: "¿Cuál de las siguientes herramientas de Access 365 crea un formulario que muestra varios registros a la vez y es más personalizable que una hoja de datos?"
  options:
  - id: a
    text:
      es: "Formulario"
  - id: b
    text:
      es: "Formulario en blanco"
  - id: c
    text:
      es: "Asistente para formularios"
  - id: d
    correct: true
    text:
      es: "Varios elementos"
  explanation:
    es: "La ayuda dice que la herramienta Varios elementos crea un formulario similar a una hoja de datos, con «más opciones de personalización». La herramienta Formulario muestra un único registro a la vez, Formulario en blanco empieza vacío y el Asistente para formularios sirve para elegir campos, agrupar y ordenar."
  citation: "fuente: `ms-access-formularios.html`; «Crear un formulario que muestre varios registros mediante la herramienta Varios elementos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q184
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas de la cinta lleva a la herramienta Formulario dividido?"
  options:
  - id: a
    correct: true
    text:
      es: "Crear › Formularios › Más formularios › Formulario dividido"
  - id: b
    text:
      es: "Crear › Formularios › Formulario dividido"
  - id: c
    text:
      es: "Crear › Formularios › Asistente para formularios › Formulario dividido"
  - id: d
    text:
      es: "Inicio › Vistas › Más formularios › Formulario dividido"
  explanation:
    es: "La ayuda indica: «En la pestaña Crear, en el grupo Formularios, haga clic en Más formularios y, después, haga clic en Formulario dividido». El botón Formulario del grupo crea el formulario simple, el Asistente para formularios es otro comando del grupo, y Inicio › Vistas contiene Ver, no esta herramienta."
  citation: "fuente: `ms-access-formularios.html`; «Crear un formulario dividido mediante la herramienta Formulario dividido»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q185
  prompt:
    es: "Señale qué muestra Access 365 al usar la herramienta Formulario en blanco para crear un formulario:"
  options:
  - id: a
    text:
      es: "Un formulario vacío en la vista Diseño y la hoja de propiedades"
  - id: b
    correct: true
    text:
      es: "Un formulario vacío en vista Presentación y la Lista de campos"
  - id: c
    text:
      es: "Un formulario con todos los campos de la primera tabla de la lista"
  - id: d
    text:
      es: "Un asistente de varias páginas para elegir los campos"
  explanation:
    es: "La ayuda dice: «Access abre un formulario en blanco en la vista Presentación y muestra el panel Lista de campos». No abre la vista Diseño con la hoja de propiedades, no coloca todos los campos de una tabla, que es lo que hace la herramienta Formulario, ni lanza un asistente, que es el Asistente para formularios."
  citation: "fuente: `ms-access-formularios.html`; «Crear un formulario mediante la herramienta Formulario en blanco»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q186
  prompt:
    es: "Según la ayuda de Access 365 sobre formularios, ¿qué es un formulario dependiente en una base de datos?"
  options:
  - id: a
    text:
      es: "Un formulario insertado dentro de otro formulario principal"
  - id: b
    text:
      es: "Un formulario que no está vinculado directamente a ningún origen de datos"
  - id: c
    text:
      es: "Un formulario que solo muestra los campos de la clave principal"
  - id: d
    correct: true
    text:
      es: "Un formulario conectado directamente a un origen de datos, como una tabla"
  explanation:
    es: "La ayuda dice: «Un formulario dependiente está conectado directamente a un origen de datos, como una tabla o consulta». El formulario insertado dentro de otro es el subformulario, que la página cita al compararlo con el formulario dividido. El formulario sin vínculo directo con un origen es el independiente, que la página nombra en la misma frase como el otro tipo. Y que solo muestre los campos de la clave principal no define al dependiente: la página dice que permite controlar qué campos o filas aparecen, pero lo que lo define es la conexión con el origen."
  citation: "fuente: `ms-access-formularios.html`; «Introducción a formularios»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q188
  prompt:
    es: "En Access 365, ¿cuál de las siguientes combinaciones de teclas muestra el panel Lista de campos al ajustar un formulario?"
  options:
  - id: a
    text:
      es: "Ctrl+G"
  - id: b
    correct: true
    text:
      es: "Alt+F8"
  - id: c
    text:
      es: "F4"
  - id: d
    text:
      es: "Alt+F4"
  explanation:
    es: "La ayuda dice: «haga clic en Agregar campos existentes o presione Alt+F8». Ctrl+G es la combinación que las páginas de consultas dan para guardar la consulta. F4 es, según la propia página de formularios, la tecla que muestra la hoja de propiedades. Y Alt+F4 es en Windows la combinación para cerrar la ventana activa, según la tabla de atajos del sistema."
  citation: "fuente: `ms-access-formularios.html`; «Ajustar el formulario en la vista Presentación»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q189
  prompt:
    es: "¿En cuál de las siguientes vistas de un formulario de Access 365 se ven los datos mientras se cambia el diseño?"
  options:
  - id: a
    text:
      es: "Vista Diseño"
  - id: b
    text:
      es: "Vista Hoja de datos"
  - id: c
    correct: true
    text:
      es: "Vista Presentación"
  - id: d
    text:
      es: "Vista Formulario"
  explanation:
    es: "La ayuda dice que en la vista Presentación «el formulario se encuentra en ejecución» y que «como puede ver los datos mientras está modificando el formulario», es útil para ajustar controles. En la vista Diseño «no puede ver los datos subyacentes»; la Hoja de datos y la vista Formulario sirven para ver o introducir información, no para cambiar el diseño."
  citation: "fuente: `ms-access-formularios.html`; «Comprender la vista Presentación y la vista Diseño»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q190
  prompt:
    es: "¿Cuál de las siguientes vistas de un formulario de Access 365 muestra las secciones de encabezado, detalle y pie de página?"
  options:
  - id: a
    text:
      es: "Vista Presentación"
  - id: b
    text:
      es: "Vista Hoja de datos"
  - id: c
    text:
      es: "Vista Formulario"
  - id: d
    correct: true
    text:
      es: "Vista Diseño"
  explanation:
    es: "La ayuda dice que la vista Diseño «le ofrece una visión más detallada de la estructura de un formulario» y permite ver «las secciones de encabezado, detalle y pie de página del formulario». La vista Presentación muestra el formulario en ejecución con sus datos, y Hoja de datos y Formulario sirven para ver o introducir información."
  citation: "fuente: `ms-access-formularios.html`; «Comprender la vista Presentación y la vista Diseño»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q191
  prompt:
    es: "Según la ayuda de Access 365 sobre subformularios, ¿para qué sirve la vista Formulario de un formulario?"
  options:
  - id: a
    correct: true
    text:
      es: "Para ver o introducir información"
  - id: b
    text:
      es: "Para modificar el diseño del formulario"
  - id: c
    text:
      es: "Para agregar saltos de página y gráficos"
  - id: d
    text:
      es: "Para ajustar el tamaño de los controles con los datos a la vista"
  explanation:
    es: "La ayuda dice que el formulario se abre «en la vista Formulario, para que pueda ver o introducir información, o en la vista Diseño, para modificar su diseño». Modificar el diseño es de la vista Diseño, agregar saltos de página y gráficos también lo es, y ajustar controles con los datos a la vista es lo propio de la vista Presentación."
  citation: "fuente: `ms-access-subformulario.html`; «Crear un formulario que contiene un subformulario (formulario de uno a varios)»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q192
  prompt:
    es: "Cuando un formulario de Access 365 se muestra en la vista Diseño, según la ayuda de Microsoft:"
  options:
  - id: a
    text:
      es: "se encuentra en ejecución y los datos aparecen como cuando el formulario está en uso."
  - id: b
    correct: true
    text:
      es: "no se encuentra en ejecución y no se ven los datos subyacentes."
  - id: c
    text:
      es: "solo sirve para ver o introducir información."
  - id: d
    text:
      es: "los datos se organizan en filas y columnas, como en una hoja de datos."
  explanation:
    es: "La ayuda dice de la vista Diseño: «El formulario no se encuentra en ejecución [...]. No puede ver los datos subyacentes». Estar en ejecución con los datos a la vista es la vista Presentación, ver o introducir información es la vista Formulario, y las filas y columnas como en una hoja de datos corresponden a la herramienta Varios elementos."
  citation: "fuente: `ms-access-formularios.html`; «Comprender la vista Presentación y la vista Diseño»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q193
  prompt:
    es: "En Access 365, ¿qué tarea se puede hacer con mayor facilidad en la vista Diseño que en la vista Presentación de un formulario?"
  options:
  - id: a
    text:
      es: "Ajustar el tamaño de los cuadros de texto para que quepan los datos"
  - id: b
    text:
      es: "Ver los datos del formulario mientras se reorganizan los controles"
  - id: c
    correct: true
    text:
      es: "Agregar controles como marcos de objeto dependientes o saltos de página"
  - id: d
    text:
      es: "Introducir información nueva en los registros del formulario"
  explanation:
    es: "La ayuda dice que en la vista Diseño se puede «agregar una mayor variedad de controles al formulario, como marcos de objeto dependientes, saltos de página y gráficos». Ajustar cuadros de texto con los datos a la vista y reorganizar controles viéndolos es lo que se hace en la vista Presentación, e introducir información es la función de la vista Formulario."
  citation: "fuente: `ms-access-formularios.html`; «Agregar una mayor variedad de controles al formulario, como marcos de objeto dependientes, saltos de página y gráficos.»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q194
  prompt:
    es: "Según la ayuda de Microsoft sobre formularios, un formulario independiente de Access 365 es el que:"
  options:
  - id: a
    correct: true
    text:
      es: "no está vinculado a un origen de datos, pero puede contener botones de comando y etiquetas."
  - id: b
    text:
      es: "está conectado directamente a una tabla o consulta para editar y mostrar sus datos."
  - id: c
    text:
      es: "se inserta dentro de otro formulario para mostrar los registros relacionados."
  - id: d
    text:
      es: "muestra los datos en la vista Hoja de datos y en la vista Formulario a la vez."
  explanation:
    es: "La ayuda dice que un formulario independiente es el que «no esté vinculado directamente a un origen de datos, pero que aún contenga botones de comando, etiquetas u otros controles». Estar conectado a una tabla o consulta es lo propio del formulario dependiente, insertarse en otro es el subformulario y mostrar a la vez las vistas Formulario y Hoja de datos es el formulario dividido."
  citation: "fuente: `ms-access-formularios.html`; «Introducción a formularios»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q195
  prompt:
    es: "En Access 365, ¿en qué se diferencia un formulario dividido de una combinación de formulario y subformulario?"
  options:
  - id: a
    text:
      es: "En que sus dos vistas usan orígenes de datos distintos y se sincronizan al guardar"
  - id: b
    correct: true
    text:
      es: "En que sus dos vistas están conectadas al mismo origen y sincronizadas siempre"
  - id: c
    text:
      es: "En que solo permite ver los datos, sin agregar ni editar registros"
  - id: d
    text:
      es: "En que muestra un único registro a la vez en las dos vistas"
  explanation:
    es: "La ayuda dice que se diferencia «en que las dos vistas están conectadas al mismo origen de datos y están sincronizadas entre ellas en todo momento». Por eso no usan orígenes distintos ni se sincronizan al guardar; además permite «agregar, editar o eliminar datos de cualquier parte», y una de sus vistas es una hoja de datos, que muestra varios registros."
  citation: "fuente: `ms-access-formularios.html`; «Crear un formulario dividido mediante la herramienta Formulario dividido»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q196
  prompt:
    es: "Señale cómo se agregan varios campos a la vez desde el panel Lista de campos al formulario de Access 365:"
  options:
  - id: a
    text:
      es: "Presionando F4 y marcando los campos en la hoja de propiedades"
  - id: b
    text:
      es: "Escribiendo los nombres de los campos en la propiedad Indexado"
  - id: c
    correct: true
    text:
      es: "Manteniendo presionada la tecla Ctrl, seleccionando los campos y arrastrándolos"
  - id: d
    text:
      es: "Haciendo clic en Ejecutar, del grupo Resultados, tras elegir los campos"
  explanation:
    es: "La ayuda dice: «Para agregar varios campos a la vez, mantenga presionada la tecla Ctrl y haga clic en los campos que desea agregar. A continuación, arrastre los campos seleccionados al formulario». F4 abre la hoja de propiedades, Indexado es una propiedad de campo de tabla y Ejecutar, del grupo Resultados, lanza una consulta."
  citation: "fuente: `ms-access-formularios.html`; «Ajustar el formulario en la vista Presentación»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-access-formularios-html
- id: m02-l10-q197
  prompt:
    es: "En Access 365, ¿qué permite cambiar la hoja de propiedades de un formulario en la vista Presentación o en la vista Diseño?"
  options:
  - id: a
    text:
      es: "Solo las propiedades de los campos de la tabla de origen"
  - id: b
    text:
      es: "Solo el orden de las tablas en el panel Lista de campos"
  - id: c
    text:
      es: "Únicamente el tamaño del formulario en la vista Presentación"
  - id: d
    correct: true
    text:
      es: "Las propiedades del formulario, sus controles y sus secciones"
  explanation:
    es: "La ayuda dice: «Use la hoja de propiedades para cambiar las propiedades del formulario, sus controles y sus secciones». No se limita a los campos de la tabla de origen, ni al orden de las tablas del panel Lista de campos, ni al tamaño del formulario."
  citation: "fuente: `ms-access-formularios.html`; «Ajustar el formulario en la vista Presentación»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q200
  prompt:
    es: "En Access 365, ¿cuál de las siguientes descripciones corresponde a un subformulario, según la ayuda de Microsoft sobre cómo crear un formulario que contiene un subformulario?"
  options:
  - id: a
    correct: true
    text:
      es: "Un formulario que se inserta en otro formulario"
  - id: b
    text:
      es: "Una tabla que se muestra dentro de un informe"
  - id: c
    text:
      es: "Un formulario que sustituye al principal al abrirlo"
  - id: d
    text:
      es: "Un informe que se imprime con los datos del formulario"
  explanation:
    es: "La ayuda dice: «Un subformulario es un formulario que se inserta en otro formulario». «Una tabla que se muestra dentro de un informe» no lo es: el subformulario es un formulario, no una tabla. «Un formulario que sustituye al principal al abrirlo» tampoco: el subformulario se inserta en el principal, que sigue mostrándose. «Un informe que se imprime con los datos del formulario» describe otro objeto, el informe, y no un subformulario."
  citation: "fuente: `ms-access-subformulario.html`; «Información sobre subformularios»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q203
  prompt:
    es: "En Access 365, ¿qué propiedad del control de subformulario determina el objeto que se muestra en el control?"
  options:
  - id: a
    text:
      es: "Vincular campos principales"
  - id: b
    text:
      es: "Vincular campos secundarios"
  - id: c
    text:
      es: "Vista predeterminada"
  - id: d
    correct: true
    text:
      es: "Objeto origen"
  explanation:
    es: "La ayuda define la «Propiedad Objeto origen» como la «Propiedad del control de subformulario que determina el objeto que se muestra en el control». «Vincular campos principales» y «Vincular campos secundarios» especifican los campos que vinculan el subformulario con el formulario principal, no el objeto mostrado. «Vista predeterminada» determina cómo se muestra el subformulario (la propiedad Default View), no cuál es el objeto."
  citation: "fuente: `ms-access-subformulario.html`; «Información sobre subformularios»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q204
  prompt:
    es: "En Access 365, ¿qué propiedad del control de subformulario especifica qué campos del formulario principal lo vinculan al subformulario?"
  options:
  - id: a
    correct: true
    text:
      es: "Vincular campos principales"
  - id: b
    text:
      es: "Vincular campos secundarios"
  - id: c
    text:
      es: "Objeto origen"
  - id: d
    text:
      es: "Vista predeterminada"
  explanation:
    es: "La ayuda define la «Propiedad Vincular campos principales» como «La propiedad del control de subformulario que especifica qué campo o campos del formulario principal lo vinculan al subformulario». «Vincular campos secundarios» especifica los campos del subformulario, no los del principal: «qué campo o campos del subformulario lo vinculan al formulario principal». «Objeto origen» determina el objeto que se muestra. «Vista predeterminada» fija cómo se muestra el subformulario."
  citation: "fuente: `ms-access-subformulario.html`; «Información sobre subformularios»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q205
  prompt:
    es: "El control de subformulario de Access 365 muestra una hoja de datos cuando su objeto de origen es:"
  options:
  - id: a
    text:
      es: "una macro o un módulo"
  - id: b
    correct: true
    text:
      es: "una tabla o una consulta"
  - id: c
    text:
      es: "un informe de varias páginas"
  - id: d
    text:
      es: "una expresión de control calculado"
  explanation:
    es: "La ayuda dice: «El control de subformulario muestra una hoja de datos cuando su objeto de origen es una tabla o consulta, o cuando su objeto de origen es un formulario cuya Default View propiedad está establecida en Datasheet». «Una macro o un módulo», «un informe de varias páginas» y «una expresión de control calculado» no son objetos de origen que la ayuda cite para el control de subformulario: solo cita otro formulario, una tabla o una consulta."
  citation: "fuente: `ms-access-subformulario.html`; «Información sobre subformularios»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q206
  prompt:
    es: "En Access 365, ¿qué ventaja ofrece basar un subformulario en un objeto de formulario y no en una tabla o consulta?"
  options:
  - id: a
    text:
      es: "Se pueden omitir las relaciones entre tablas"
  - id: b
    text:
      es: "Se muestra siempre como una hoja de datos"
  - id: c
    correct: true
    text:
      es: "Se pueden agregar campos calculados al subformulario"
  - id: d
    text:
      es: "Se vincula solo con el último registro del principal"
  explanation:
    es: "La ayuda dice: «Una ventaja de basar un subformulario en un objeto de formulario es que puede agregar campos calculados al subformulario, como [Quantity] * [Unit price]». «Se pueden omitir las relaciones entre tablas» es falso: la nota recomienda «establezca relaciones entre tablas antes de seguir los procedimientos» para que Access cree los vínculos. «Se muestra siempre como una hoja de datos» también: puede verse como un único formulario, un formulario continuo o una hoja de datos. «Se vincula solo con el último registro del principal» no consta: el subformulario muestra los registros relacionados con el registro actual."
  citation: "fuente: `ms-access-subformulario.html`; «Información sobre subformularios»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-subformulario-html
- id: m02-l10-q207
  prompt:
    es: "Según la ayuda de Access 365, ¿cuál de los siguientes procedimientos sirve para que Access cree un formulario principal y un subformulario y los vincule?"
  options:
  - id: a
    text:
      es: "Arrastrar un formulario hasta otro formulario"
  - id: b
    text:
      es: "Usar el Asistente para subformularios en un formulario existente"
  - id: c
    text:
      es: "Abrir el subformulario en una ventana nueva"
  - id: d
    correct: true
    text:
      es: "Crear el formulario con el Asistente para formularios"
  explanation:
    es: "La ayuda lo recomienda para quien «desea que Access cree un formulario principal y un subformulario, y que vincule el subformulario al formulario principal»: crear el formulario con el Asistente para formularios. «Arrastrar un formulario hasta otro formulario» es el procedimiento para usar formularios ya existentes como principal y subformulario. «Usar el Asistente para subformularios en un formulario existente» sirve cuando ya hay un formulario principal y Access solo crea el subformulario. «Abrir el subformulario en una ventana nueva» sirve para cambiar su diseño desde la vista Diseño."
  citation: "fuente: `ms-access-subformulario.html`; «Crear o agregar un subformulario»"
  difficulty: 2
  tags:
  - "concepto"
