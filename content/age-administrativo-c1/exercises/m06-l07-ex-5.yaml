- id: m06-l07-q133
  prompt:
    es: "En Outlook 365, según la ayuda de Microsoft, para que Outlook funcione correctamente una búsqueda devuelve como máximo:"
  options:
  - id: a
    text:
      es: "Los primeros 100 resultados"
  - id: b
    text:
      es: "Los primeros 10 000 resultados"
  - id: c
    correct: true
    text:
      es: "Los primeros 1000 resultados"
  - id: d
    text:
      es: "Los primeros 500 resultados"
  explanation:
    es: "La ayuda dice que solo se devuelven los primeros 1000 resultados y aconseja una búsqueda más específica si la lista no contiene lo buscado. Los primeros 100, los primeros 500 y los primeros 10 000 contradicen esa cifra."
  citation: "fuente: `ms-outlook-buscar.html`; «Conceptos básicos de búsqueda en Outlook»"
  difficulty: 1
  tags:
