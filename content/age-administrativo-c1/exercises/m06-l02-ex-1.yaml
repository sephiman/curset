# anchor: fuente-ms-win-lupa-html
- id: m06-l02-q026
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes afirmaciones sobre la activación y desactivación de la Lupa con el teclado es correcta?"
  options:
  - id: a
    text:
      es: "Windows+Esc la activa y Windows+signo más (+) la desactiva."
  - id: b
    text:
      es: "Windows+signo más (+) la activa y Windows+signo menos (-) la desactiva."
  - id: c
    text:
      es: "Windows+Ctrl+M la activa y Windows+Esc la desactiva."
  - id: d
    correct: true
    text:
      es: "Windows+signo más (+) la activa y Windows+Esc la desactiva."
  explanation:
    es: "La página dice que la Lupa se activa con la tecla Windows y el signo más (+) y se desactiva con Windows+Esc. Invertir esas teclas es falso; Windows+signo menos (-) aleja la imagen con la Lupa, según la tabla de métodos abreviados, y Windows+Ctrl+M abre la vista de configuración de la Lupa."
  citation: "fuente: `ms-win-lupa.html`; «Activar la Lupa»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-lupa-html
- id: m06-l02-q027
  prompt:
    es: "En Windows 11, si se prefiere usar el ratón, ¿qué ruta de la aplicación Configuración lleva al interruptor que activa la Lupa?"
  options:
  - id: a
    text:
      es: "Configuración › Personalización › Lupa"
  - id: b
    correct: true
    text:
      es: "Configuración › Accesibilidad › Lupa"
  - id: c
    text:
      es: "Configuración › Sistema › Lupa"
  - id: d
    text:
      es: "Configuración › Hora & idioma › Lupa"
  explanation:
    es: "Según la página, se va a Inicio, se selecciona Configuración, se elige Accesibilidad y luego Lupa, donde está el interruptor. Personalización, Sistema y Hora & idioma son apartados reales de Configuración, pero la Lupa no está en ninguno de ellos."
  citation: "fuente: `ms-win-lupa.html`; «Activar la Lupa»"
  difficulty: 1
  tags:
  - "ofimática-menú"
  - "configuración"
