# anchor: boe-a-1978-31229-art-69
- id: m01-l03-q020
  prompt:
    es: "¿Cuántos Senadores se eligen en cada provincia por sufragio universal, libre, igual, directo y secreto, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Tres Senadores en cada provincia."
  - id: b
    text:
      es: "Dos Senadores en cada provincia."
  - id: c
    correct: true
    text:
      es: "Cuatro Senadores en cada provincia."
  - id: d
    text:
      es: "Cinco Senadores en cada provincia."
  explanation:
    es: "El artículo 69.2 dice: «En cada provincia se elegirán cuatro Senadores». Tres Senadores corresponden a cada una de las islas mayores (art. 69.3). Dos son los de Ceuta y de Melilla (art. 69.4). La cifra de cinco no aparece."
  citation: "art. 69.2 CE"
  difficulty: 1
  tags:
  - "cantidad"
  - "composición"
# anchor: boe-a-1978-31229-art-69
- id: m01-l03-q021
  prompt:
    es: "De acuerdo con el artículo 69 de la Constitución Española de 1978, en las provincias insulares corresponden tres Senadores a cada una de las siguientes islas:"
  options:
  - id: a
    text:
      es: "Gran Canaria, Mallorca e Ibiza."
  - id: b
    text:
      es: "Tenerife, Mallorca y La Palma."
  - id: c
    correct: true
    text:
      es: "Gran Canaria, Mallorca y Tenerife."
  - id: d
    text:
      es: "Gran Canaria, Tenerife y Menorca."
  explanation:
    es: "El artículo 69.3 da tres Senadores a cada una de «las islas mayores −Gran Canaria, Mallorca y Tenerife−». Ibiza, La Palma y Menorca están en la lista de islas que eligen un Senador cada una."
  citation: "art. 69.3 CE"
  difficulty: 2
  tags:
  - "cantidad"
  - "composición"
# anchor: boe-a-1978-31229-art-69
- id: m01-l03-q022
  prompt:
    es: "¿Cuántos Senadores corresponden a la isla de Formentera según la Constitución Española de 1978, tras la reforma constitucional de 19 de mayo de 2026?"
  options:
  - id: a
    text:
      es: "Un Senador compartido con la isla de Ibiza."
  - id: b
    text:
      es: "Tres Senadores, como las islas mayores."
  - id: c
    correct: true
    text:
      es: "Un Senador, en circunscripción propia."
  - id: d
    text:
      es: "Dos Senadores, como Ceuta y Melilla."
  explanation:
    es: "Tras la reforma de 19 de mayo de 2026, el artículo 69.3 incluye a Formentera entre las islas que eligen «uno» y la hace circunscripción propia: cada isla con Cabildo o Consejo Insular constituye una circunscripción. La disposición transitoria única de la reforma solo pospone la eficacia de las circunscripciones de Ibiza y Formentera hasta la convocatoria de las primeras elecciones al Senado tras su entrada en vigor. El Senador compartido con Ibiza es la regla anterior a la reforma. Tres Senadores son los de las islas mayores, y dos los de Ceuta y de Melilla (art. 69.4)."
  citation: "art. 69.3 CE"
  difficulty: 3
  tags:
  - "cantidad"
  - "composición"
# anchor: boe-a-1978-31229-art-70
- id: m01-l03-q025
  prompt:
    es: "¿Cuál de las siguientes causas de inelegibilidad e incompatibilidad de Diputados y Senadores comprende en todo caso, según la Constitución Española de 1978, la ley electoral?"
  options:
  - id: a
    text:
      es: "La de los miembros del Gobierno de la Nación."
  - id: b
    text:
      es: "La de los Magistrados, Jueces y Fiscales jubilados."
  - id: c
    correct: true
    text:
      es: "La de los Magistrados, Jueces y Fiscales en activo."
  - id: d
    text:
      es: "La de los militares profesionales en situación de retiro."
  explanation:
    es: "El artículo 70.1.d) incluye «a los Magistrados, Jueces y Fiscales en activo». Los miembros del Gobierno son precisamente la excepción a la causa de los altos cargos (art. 70.1.b). La Constitución exige que jueces, fiscales y militares profesionales estén «en activo», así que los jubilados y los retirados no entran."
  citation: "art. 70.1 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1982-5196-art-10
- id: m01-l03-q027
  prompt:
    es: "Según el artículo 10 del Reglamento del Congreso de 10 de febrero de 1982, ¿hasta cuándo gozan de inviolabilidad las diputadas y diputados por las opiniones manifestadas en el ejercicio de sus funciones?"
  options:
  - id: a
    correct: true
    text:
      es: "Aun después de haber cesado en su mandato."
  - id: b
    text:
      es: "Solo durante el período de su mandato."
  - id: c
    text:
      es: "Hasta la disolución de la Cámara que los eligió."
  - id: d
    text:
      es: "Hasta la constitución de las nuevas Cortes Generales."
  explanation:
    es: "El artículo 10 del Reglamento dice que gozan de inviolabilidad «aun después de haber cesado en su mandato». La limitación al período del mandato es la de la inmunidad (art. 71.2 CE). La inviolabilidad no termina con la disolución ni con la constitución de las nuevas Cortes Generales."
  citation: "art. 10 Reglamento del Congreso"
  difficulty: 3
  tags:
  - "plazo"
  - "concepto"
# anchor: boe-a-1978-31229-art-71
- id: m01-l03-q028
  prompt:
    es: "De acuerdo con el artículo 71 de la Constitución Española de 1978, durante el período de su mandato los Diputados y Senadores:"
  options:
  - id: a
    correct: true
    text:
      es: "Solo podrán ser detenidos en caso de flagrante delito."
  - id: b
    text:
      es: "No podrán ser detenidos en ningún caso sin autorización de la Cámara."
  - id: c
    text:
      es: "Solo podrán ser detenidos con autorización de la Mesa de la Cámara."
  - id: d
    text:
      es: "Solo podrán ser detenidos por orden de la Sala de lo Penal del Tribunal Supremo."
  explanation:
    es: "El artículo 71.2 dice que gozan de inmunidad «y sólo podrán ser detenidos en caso de flagrante delito». La detención en flagrante delito no necesita autorización, así que no es cierto que nunca puedan ser detenidos sin ella. La autorización previa de la Cámara se exige para inculparlos o procesarlos, no a la Mesa. La Sala de lo Penal del Tribunal Supremo es el órgano competente en sus causas (art. 71.3), no una vía de detención."
  citation: "art. 71.2 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1982-5196-art-14
- id: m01-l03-q029
  prompt:
    es: "En el Congreso de los Diputados, el suplicatorio se entiende denegado si la Cámara no se ha pronunciado sobre él:"
  options:
  - id: a
    text:
      es: "En el plazo de treinta días naturales, computados durante el período de sesiones."
  - id: b
    correct: true
    text:
      es: "En el plazo de sesenta días naturales, computados durante el período de sesiones."
  - id: c
    text:
      es: "En el plazo de sesenta días hábiles, computados desde la presentación de la querella."
  - id: d
    text:
      es: "En el plazo de sesenta días naturales, computados también fuera del período de sesiones."
  explanation:
    es: "El artículo 14.2 del Reglamento del Congreso dice que el suplicatorio se entiende denegado si la Cámara no se pronuncia «en el plazo de sesenta días naturales, computados durante el período de sesiones a partir del día siguiente al del recibo del suplicatorio». El plazo no es de treinta días. Son días naturales, no hábiles, y se cuentan desde el recibo del suplicatorio, no desde la querella. Fuera del período de sesiones el plazo no corre."
  citation: "art. 14.2 Reglamento del Congreso"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-74
- id: m01-l03-q033
  prompt:
    es: "De acuerdo con el artículo 74 de la Constitución Española de 1978, en la autorización de los acuerdos de cooperación entre Comunidades Autónomas, el procedimiento se iniciará por:"
  options:
  - id: a
    text:
      es: "El Congreso, y la decisión se adopta por mayoría de cada una de las Cámaras."
  - id: b
    correct: true
    text:
      es: "El Senado, y la decisión se adopta por mayoría de cada una de las Cámaras."
  - id: c
    text:
      es: "El Senado, y la decisión se adopta por mayoría absoluta del Senado."
  - id: d
    text:
      es: "El Congreso, y la decisión se adopta por mayoría absoluta del Congreso."
  explanation:
    es: "El artículo 74.2 dice que las decisiones de los artículos 94.1, 145.2 y 158.2 «se adoptarán por mayoría de cada una de las Cámaras» y que el procedimiento se inicia por el Congreso en el primer caso y «en los otros dos, por el Senado». Los acuerdos de cooperación son el caso del artículo 145.2, así que empieza el Senado. La decisión no la adopta una sola Cámara. La mayoría absoluta del Congreso solo decide si no se aprueba el texto de la Comisión Mixta."
  citation: "art. 74.2 CE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "mayoría"
# anchor: boe-a-1978-31229-art-74
- id: m01-l03-q034
  prompt:
    es: "¿Cuál es el órgano que intenta obtener el acuerdo cuando Senado y Congreso discrepan sobre la distribución de los recursos del Fondo de Compensación, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Una Comisión Mixta compuesta en proporción al número de miembros de cada Cámara."
  - id: b
    text:
      es: "La Comisión General de las Comunidades Autónomas del Senado."
  - id: c
    text:
      es: "La Junta de Portavoces del Congreso de los Diputados."
  - id: d
    correct: true
    text:
      es: "Una Comisión Mixta compuesta de igual número de Diputados y Senadores."
  explanation:
    es: "El artículo 74.2 dice que, si no hay acuerdo entre Senado y Congreso, «se intentará obtener por una Comisión Mixta compuesta de igual número de Diputados y Senadores». La composición es paritaria, no proporcional al tamaño de cada Cámara. La Comisión General de las Comunidades Autónomas y la Junta de Portavoces son órganos de una sola Cámara."
  citation: "art. 74.2 CE"
  difficulty: 3
  tags:
  - "órgano"
  - "composición"
# anchor: boe-a-1978-31229-art-75
- id: m01-l03-q036
  prompt:
    es: "De acuerdo con el artículo 75 de la Constitución Española de 1978, queda exceptuada de la delegación en las Comisiones Legislativas Permanentes:"
  options:
  - id: a
    text:
      es: "La aprobación de las leyes ordinarias en materia laboral."
  - id: b
    text:
      es: "La aprobación de las leyes que modifiquen otras leyes vigentes."
  - id: c
    text:
      es: "La aprobación de las leyes en materia de régimen local."
  - id: d
    correct: true
    text:
      es: "La aprobación de los Presupuestos Generales del Estado."
  explanation:
    es: "El artículo 75.3 exceptúa de la delegación «la reforma constitucional, las cuestiones internacionales, las leyes orgánicas y de bases y los Presupuestos Generales del Estado». Las leyes ordinarias laborales, las que modifican otras leyes y las de régimen local no están en esa lista."
  citation: "art. 75.3 CE"
  difficulty: 1
  tags:
  - "excepción"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-75
- id: m01-l03-q037
  prompt:
    es: "¿Cuál de los siguientes pares reúne solo materias que la Constitución Española de 1978 excluye de la delegación en las Comisiones Legislativas Permanentes?"
  options:
  - id: a
    text:
      es: "Las leyes de bases y las leyes de régimen local."
  - id: b
    text:
      es: "Las leyes orgánicas y las leyes tributarias."
  - id: c
    text:
      es: "Las leyes de régimen local y las leyes tributarias."
  - id: d
    correct: true
    text:
      es: "Las leyes orgánicas y las leyes de bases."
  explanation:
    es: "El artículo 75.3 exceptúa «las leyes orgánicas y de bases», junto a la reforma constitucional, las cuestiones internacionales y los Presupuestos Generales del Estado. Las leyes de régimen local y las tributarias no están en la lista, así que cualquier par que las incluya no reúne solo materias excluidas."
  citation: "art. 75.3 CE"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-78
- id: m01-l03-q039
  prompt:
    es: "¿Qué ocurre con las Diputaciones Permanentes cuando expira el mandato de las Cortes Generales o estas son disueltas, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Cesan en sus funciones el mismo día de la expiración del mandato o de la disolución."
  - id: b
    text:
      es: "Siguen ejerciendo sus funciones hasta la proclamación de los Diputados y Senadores electos."
  - id: c
    correct: true
    text:
      es: "Siguen ejerciendo sus funciones hasta la constitución de las nuevas Cortes Generales."
  - id: d
    text:
      es: "Se integran en una Diputación Permanente única de las Cortes Generales."
  explanation:
    es: "El artículo 78.3 dice que, expirado el mandato o en caso de disolución, las Diputaciones Permanentes «seguirán ejerciendo sus funciones hasta la constitución de las nuevas Cortes Generales». No cesan con la expiración o la disolución. Su función no termina con la proclamación de los electos. Hay una Diputación Permanente en cada Cámara (art. 78.1), no una única."
  citation: "art. 78.3 CE"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-1978-31229-art-78
- id: m01-l03-q040
  prompt:
    es: "¿Quién preside la Diputación Permanente de cada una de las Cámaras de las Cortes Generales, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "El Presidente de la Cámara respectiva."
  - id: b
    text:
      es: "El miembro de la Diputación Permanente de mayor edad."
  - id: c
    text:
      es: "El portavoz del grupo parlamentario con más miembros."
  - id: d
    text:
      es: "El Vicepresidente primero de la Cámara respectiva."
  explanation:
    es: "El artículo 78.2 dice que las Diputaciones Permanentes «estarán presididas por el Presidente de la Cámara respectiva». La Constitución no da la presidencia al miembro de más edad, a un portavoz ni a un Vicepresidente."
  citation: "art. 78.2 CE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1982-5196-art-57
- id: m01-l03-q041
  prompt:
    es: "Según el artículo 57 del Reglamento del Congreso de 10 de febrero de 1982, en los casos de disolución o expiración del mandato del Congreso, ¿qué facultades asume la Diputación Permanente?"
  options:
  - id: a
    text:
      es: "Las relativas a los Decretos-leyes y a la moción de censura."
  - id: b
    correct: true
    text:
      es: "Las relativas a los Decretos-leyes y a los estados de alarma, excepción y sitio."
  - id: c
    text:
      es: "Las relativas a los estados de alarma, excepción y sitio y a la investidura."
  - id: d
    text:
      es: "Las relativas a los Decretos-leyes y a las leyes orgánicas declaradas urgentes."
  explanation:
    es: "El artículo 57 del Reglamento le atribuye las facultades que el artículo 86 de la Constitución da al Congreso sobre los Decretos-leyes y las competencias del artículo 116 «respecto de los estados de alarma, excepción y sitio». La moción de censura, la investidura y las leyes orgánicas no están entre ellas."
  citation: "art. 57 Reglamento del Congreso"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-79
- id: m01-l03-q042
  prompt:
    es: "De acuerdo con el artículo 79 de la Constitución Española de 1978, para adoptar acuerdos, las Cámaras deben estar reunidas reglamentariamente y con asistencia de:"
  options:
  - id: a
    text:
      es: "Un tercio de sus miembros."
  - id: b
    text:
      es: "Las tres quintas partes de sus miembros."
  - id: c
    correct: true
    text:
      es: "La mayoría de sus miembros."
  - id: d
    text:
      es: "La cuarta parte de sus miembros."
  explanation:
    es: "El artículo 79.1 exige que las Cámaras estén reunidas reglamentariamente «y con asistencia de la mayoría de sus miembros». Un tercio y la cuarta parte no alcanzan ese quórum. Las tres quintas partes no son lo que pide el precepto."
  citation: "art. 79.1 CE"
  difficulty: 2
  tags:
  - "mayoría"
  - "requisito"
# anchor: boe-a-1978-31229-art-79
- id: m01-l03-q043
  prompt:
    es: "¿Qué mayoría exige la Constitución Española de 1978, como regla general, para que los acuerdos de las Cámaras sean válidos?"
  options:
  - id: a
    text:
      es: "La mayoría absoluta de los miembros de la Cámara."
  - id: b
    correct: true
    text:
      es: "La mayoría de los miembros presentes."
  - id: c
    text:
      es: "La mayoría de tres quintos de los miembros presentes."
  - id: d
    text:
      es: "La mayoría de dos tercios de los miembros presentes."
  explanation:
    es: "El artículo 79.2 dice que los acuerdos, «para ser válidos, deberán ser aprobados por la mayoría de los miembros presentes». La mayoría absoluta y las mayorías de tres quintos o dos tercios son mayorías especiales, que solo rigen cuando la Constitución, las leyes orgánicas o los Reglamentos las establecen."
  citation: "art. 79.2 CE"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-80
- id: m01-l03-q045
  prompt:
    es: "De acuerdo con el artículo 80 de la Constitución Española de 1978, las sesiones plenarias de las Cámaras serán públicas:"
  options:
  - id: a
    text:
      es: "Salvo acuerdo en contrario de cada Cámara, adoptado por mayoría de tres quintos."
  - id: b
    correct: true
    text:
      es: "Salvo acuerdo en contrario de cada Cámara, adoptado por mayoría absoluta o con arreglo al Reglamento."
  - id: c
    text:
      es: "En todo caso, sin excepción alguna."
  - id: d
    text:
      es: "Salvo acuerdo en contrario de la Mesa, adoptado con arreglo al Reglamento."
  explanation:
    es: "El artículo 80 dice que las sesiones plenarias serán públicas, «salvo acuerdo en contrario de cada Cámara, adoptado por mayoría absoluta o con arreglo al Reglamento». La mayoría no es de tres quintos. Sí hay excepción, y el acuerdo es de la Cámara, no de la Mesa."
  citation: "art. 80 CE"
  difficulty: 2
  tags:
  - "excepción"
  - "mayoría"
# anchor: boe-a-1994-10830-art-93
- id: m01-l03-q046
  prompt:
    es: "De acuerdo con el artículo 93 del texto refundido del Reglamento del Senado de 3 de mayo de 1994, salvo las mayorías especiales, los acuerdos se adoptarán por:"
  options:
  - id: a
    text:
      es: "La mayoría absoluta de Senadores, siempre que esté presente la mitad más uno de los miembros del órgano."
  - id: b
    correct: true
    text:
      es: "La mayoría simple de Senadores presentes, siempre que lo esté la mitad más uno de los miembros del órgano."
  - id: c
    text:
      es: "La mayoría simple de Senadores presentes, siempre que lo esté un tercio de los miembros del órgano."
  - id: d
    text:
      es: "La mayoría simple de Senadores presentes, sin exigencia de quórum de asistencia."
  explanation:
    es: "El artículo 93.1 del Reglamento del Senado dice que los acuerdos se adoptan «por la mayoría simple de Senadores presentes, siempre que lo esté la mitad más uno de los miembros del órgano de que se trate». La regla general no es la mayoría absoluta. El quórum es la mitad más uno, no un tercio, y sí se exige."
  citation: "art. 93.1 Reglamento del Senado"
  difficulty: 3
  tags:
  - "mayoría"
  - "requisito"
# anchor: boe-a-1978-31229-art-82
- id: m01-l03-q059
  prompt:
    es: "De acuerdo con el artículo 82 de la Constitución Española de 1978, las Cortes Generales podrán delegar en el Gobierno la potestad de dictar normas con rango de ley:"
  options:
  - id: a
    text:
      es: "Sobre cualquier materia, incluidas las reservadas a ley orgánica."
  - id: b
    correct: true
    text:
      es: "Sobre materias determinadas que no estén reservadas a ley orgánica."
  - id: c
    text:
      es: "Sobre materias reservadas a ley orgánica, previa autorización del Congreso."
  - id: d
    text:
      es: "Sobre materias determinadas, incluido el régimen electoral general."
  explanation:
    es: "El artículo 82.1 permite delegar «sobre materias determinadas no incluidas en el artículo anterior», que es el de las leyes orgánicas. Por eso no cabe delegar materias reservadas a ley orgánica, ni siquiera con autorización del Congreso. El régimen electoral general es materia de ley orgánica (art. 81.1)."
  citation: "art. 82.1 CE"
  difficulty: 2
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1978-31229-art-66
- id: m01-l03-q069
  prompt:
    es: "¿Cuál de los siguientes tratados o convenios requiere la previa autorización de las Cortes Generales, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Los que tengan por objeto la cooperación cultural entre Estados."
  - id: b
    text:
      es: "Los que tengan por objeto la cooperación científica y técnica."
  - id: c
    correct: true
    text:
      es: "Los que impliquen obligaciones financieras para la Hacienda Pública."
  - id: d
    text:
      es: "Los que se refieran al intercambio de información administrativa."
  explanation:
    es: "El artículo 94.1.d) exige la previa autorización de las Cortes Generales para los tratados o convenios «que impliquen obligaciones financieras para la Hacienda Pública». La cooperación cultural, la científica y técnica y el intercambio de información no están en la lista del artículo 94.1. De la conclusión de esos tratados el Congreso y el Senado solo son informados (art. 94.2)."
  citation: "art. 94.1 CE"
  difficulty: 1
  tags:
  - "requisito"
