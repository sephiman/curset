  explanation:
    es: "La página dice que Acciones de texto extrae y copia el texto deseado del recorte, activando el reconocimiento óptico de caracteres (OCR). Escribir o dibujar es de Lápiz y Resaltador, las formas y los emojis son de Formas y recortar la imagen es del botón Recorte de imagen."
