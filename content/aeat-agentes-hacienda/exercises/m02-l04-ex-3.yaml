# anchor: boe-a-2015-10565-art-84
- id: m02-l04-q0015
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge los modos de poner fin al procedimiento del artículo 84.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La resolución, el desistimiento, la renuncia al derecho no prohibida por el ordenamiento y la prescripción."
  - id: b
    correct: true
    text:
      es: "La resolución, el desistimiento, la renuncia al derecho no prohibida por el ordenamiento y la declaración de caducidad."
  - id: c
    text:
      es: "La resolución, el desistimiento y la declaración de caducidad, sin que quepa en ningún caso la renuncia al derecho."
  - id: d
    text:
      es: "La resolución, la suspensión del procedimiento, la renuncia al derecho no prohibida y la declaración de caducidad."
  explanation:
    es: "El artículo 84.1 dice: «Pondrán fin al procedimiento la resolución, el desistimiento, la renuncia al derecho en que se funde la solicitud, cuando tal renuncia no esté prohibida por el ordenamiento jurídico, y la declaración de caducidad». La prescripción no está en la lista. La renuncia sí, cuando no esté prohibida. La suspensión no pone fin al procedimiento."
  citation: "art. 84.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-85
- id: m02-l04-q0016
  prompt:
    es: "De acuerdo con el artículo 85.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, iniciado un procedimiento sancionador, si el infractor reconoce su responsabilidad:"
  options:
  - id: a
    text:
      es: "Deberá archivarse el procedimiento sin imponer sanción alguna."
  - id: b
    text:
      es: "Deberá abrirse en todo caso un período de prueba sobre los hechos."
  - id: c
    text:
      es: "Se suspenderá el procedimiento hasta que el infractor abone la sanción."
  - id: d
    correct: true
    text:
      es: "Podrá resolverse el procedimiento imponiendo la sanción que proceda."
  explanation:
    es: "El artículo 85.1 dice que, si el infractor reconoce su responsabilidad, «se podrá resolver el procedimiento con la imposición de la sanción que proceda». El reconocimiento no lleva al archivo sin sanción, no obliga a abrir prueba y no suspende el procedimiento."
  citation: "art. 85.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-85
- id: m02-l04-q0017
  prompt:
    es: "Según el artículo 85.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo implica la terminación del procedimiento sancionador el pago voluntario por el presunto responsable?"
  options:
  - id: a
    correct: true
    text:
      es: "Si la sanción es solo pecuniaria, o se justificó la improcedencia de la otra, y se paga antes de resolver."
  - id: b
    text:
      es: "Si la sanción es pecuniaria o no pecuniaria, siempre que se pague antes de la propuesta de resolución."
  - id: c
    text:
      es: "Si la sanción es solo pecuniaria y se paga dentro de los diez días siguientes a la notificación de la iniciación."
  - id: d
    text:
      es: "Si la sanción es solo pecuniaria y se paga una vez notificada la resolución sancionadora, en periodo voluntario."
  explanation:
    es: "El artículo 85.2 exige que la sanción tenga «únicamente carácter pecuniario» o que, pudiendo imponerse otra no pecuniaria, «se ha justificado la improcedencia de la segunda», y que el pago se haga «en cualquier momento anterior a la resolución». No vale para cualquier sanción no pecuniaria. El límite es la resolución, no la propuesta ni diez días desde la iniciación. Pagar después de la resolución no termina un procedimiento que ya terminó."
  citation: "art. 85.2 LPAC"
  difficulty: 3
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-2015-10565-art-85
- id: m02-l04-q0018
  prompt:
    es: "De acuerdo con el artículo 85.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si la sanción es solo pecuniaria y el infractor reconoce su responsabilidad o paga voluntariamente, se aplicarán reducciones:"
  options:
  - id: a
    text:
      es: "De, al menos, el 20 % sobre el importe de la sanción propuesta, no acumulables entre sí."
  - id: b
    correct: true
    text:
      es: "De, al menos, el 20 % sobre el importe de la sanción propuesta, acumulables entre sí."
  - id: c
    text:
      es: "De, al menos, el 30 % sobre el importe de la sanción propuesta, acumulables entre sí."
  - id: d
    text:
      es: "De, como máximo, el 20 % sobre el importe de la sanción propuesta, acumulables entre sí."
  explanation:
    es: "El artículo 85.3 dice que se aplicarán «reducciones de, al menos, el 20 % sobre el importe de la sanción propuesta, siendo éstos acumulables entre sí». El 20 % es un mínimo, no un máximo, y el porcentaje legal no es el 30 %. Las dos reducciones, por reconocimiento y por pago, sí se acumulan."
  citation: "art. 85.3 LPAC"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-10565-art-85
- id: m02-l04-q0019
  prompt:
    es: "Según el artículo 85.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿a qué está condicionada la efectividad de las reducciones sobre el importe de la sanción propuesta?"
  options:
  - id: a
    text:
      es: "Al desistimiento o renuncia de cualquier recurso contencioso-administrativo contra la sanción."
  - id: b
    text:
      es: "A que el infractor no haya sido sancionado en el año anterior por una infracción de la misma naturaleza."
  - id: c
    text:
      es: "A que el pago se realice dentro de los diez días siguientes a la notificación de la resolución."
  - id: d
    correct: true
    text:
      es: "Al desistimiento o renuncia de cualquier acción o recurso en vía administrativa contra la sanción."
  explanation:
    es: "El artículo 85.3 dice que la efectividad de las reducciones «estará condicionada al desistimiento o renuncia de cualquier acción o recurso en vía administrativa contra la sanción». La renuncia se refiere a la vía administrativa, no a la contencioso-administrativa. La ley no exige falta de sanciones previas ni un pago en diez días tras la resolución."
  citation: "art. 85.3 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-85
- id: m02-l04-q0020
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las reducciones de la sanción pecuniaria por reconocimiento o pago voluntario es correcta, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Deben figurar en la propuesta de resolución, y su porcentaje podrá incrementarse reglamentariamente."
  - id: b
    text:
      es: "Deben figurar en la notificación de iniciación, y su porcentaje solo podrá incrementarse por ley."
  - id: c
    text:
      es: "Las acuerda el instructor a petición del interesado, y su porcentaje es fijo e invariable."
  - id: d
    correct: true
    text:
      es: "Deben figurar en la notificación de iniciación, y su porcentaje podrá incrementarse reglamentariamente."
  explanation:
    es: "El artículo 85.3 dice que las reducciones «deberán estar determinadas en la notificación de iniciación del procedimiento» y que el porcentaje «podrá ser incrementado reglamentariamente». No se fijan en la propuesta de resolución. Un reglamento basta para subir el porcentaje. Las aplica el órgano competente para resolver, no el instructor, y el porcentaje no es invariable."
  citation: "art. 85.3 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-94
- id: m02-l04-q0022
  prompt:
    es: "Según el artículo 94.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si la solicitud la formularon varios interesados y uno desiste, ¿a quién afecta el desistimiento?"
  options:
  - id: a
    text:
      es: "A todos los que formularon el escrito."
  - id: b
    correct: true
    text:
      es: "Solo a aquel que lo haya formulado."
  - id: c
    text:
      es: "A todos, salvo que los demás ratifiquen la solicitud."
  - id: d
    text:
      es: "Solo a quien lo formuló, si los demás lo aceptan."
  explanation:
    es: "El artículo 94.2 dice que, si el escrito se formuló por dos o más interesados, «el desistimiento o la renuncia sólo afectará a aquellos que la hubiesen formulado». No alcanza a los demás, que no tienen que ratificar nada ni aceptar el desistimiento."
  citation: "art. 94.2 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-94
- id: m02-l04-q0023
  prompt:
    es: "De acuerdo con el artículo 94.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la Administración aceptará de plano el desistimiento o la renuncia y declarará concluso el procedimiento, salvo que:"
  options:
  - id: a
    correct: true
    text:
      es: "Terceros interesados personados insten su continuación en diez días desde que se les notificó."
  - id: b
    text:
      es: "Terceros interesados personados insten su continuación en quince días desde que se les notificó."
  - id: c
    text:
      es: "El órgano instructor proponga su continuación en diez días desde que recibió el escrito."
  - id: d
    text:
      es: "Cualquier persona, aunque no esté personada, inste su continuación en diez días."
  explanation:
    es: "El artículo 94.4 exceptúa el caso de que, «habiéndose personado en el mismo terceros interesados, instasen éstos su continuación en el plazo de diez días desde que fueron notificados». El plazo no es de quince días. Pueden instarla los terceros personados, no cualquier persona ni el instructor."
  citation: "art. 94.4 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10565-art-95
- id: m02-l04-q0027
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los procedimientos caducados y el plazo de prescripción es correcta, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "No interrumpen el plazo de prescripción de las acciones."
  - id: b
    text:
      es: "Interrumpen el plazo de prescripción, que vuelve a correr desde el archivo."
  - id: c
    text:
      es: "Suspenden el plazo de prescripción mientras estuvieron en tramitación."
  - id: d
    text:
      es: "Producen por sí solos la prescripción de las acciones del particular."
  explanation:
    es: "El artículo 95.3 dice que «los procedimientos caducados no interrumpirán el plazo de prescripción». No lo interrumpen ni lo suspenden. La caducidad tampoco «producirá por sí sola la prescripción de las acciones del particular o de la Administración»."
  citation: "art. 95.3 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-96
- id: m02-l04-q0028
  prompt:
    es: "De acuerdo con el artículo 96.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los procedimientos simplificados se resolverán en treinta días desde el siguiente a la notificación del acuerdo:"
  options:
  - id: a
    text:
      es: "Salvo que reste más para su tramitación ordinaria."
  - id: b
    text:
      es: "Salvo que el órgano acuerde ampliarlo hasta sesenta días."
  - id: c
    correct: true
    text:
      es: "Salvo que reste menos para su tramitación ordinaria."
  - id: d
    text:
      es: "Salvo que se trate de un procedimiento sancionador."
  explanation:
    es: "El artículo 96.6 fija los treinta días «salvo que reste menos para su tramitación ordinaria». Si resta más, rigen los treinta días. La ley no prevé una ampliación a sesenta días. Los procedimientos sancionadores pueden tramitarse de forma simplificada (art. 96.5) y también se rigen por los treinta días."
  citation: "art. 96.6 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10565-art-87
- id: m02-l04-q0030
  prompt:
    es: "El órgano competente para resolver acuerda actuaciones complementarias indispensables y fija dieciocho días para practicarlas. ¿Se ajusta ese plazo a la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Sí, porque deben practicarse en un plazo no superior a un mes."
  - id: b
    text:
      es: "Sí, porque la ley solo limita el plazo de alegaciones posterior, no el de su práctica."
  - id: c
    text:
      es: "Sí, porque el plazo de práctica lo fija libremente el acuerdo que las ordena."
  - id: d
    correct: true
    text:
      es: "No, porque deben practicarse en un plazo no superior a quince días."
  explanation:
    es: "El artículo 87 dice que las actuaciones complementarias «deberán practicarse en un plazo no superior a quince días». Dieciocho días lo superan. El límite no es de un mes. La ley fija a la vez el plazo de práctica y el de alegaciones posterior, de siete días, y el acuerdo no puede fijar libremente un plazo mayor."
  citation: "art. 87 LPAC"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-88
- id: m02-l04-q0033
  prompt:
    es: "Según el artículo 88.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué pueden hacer los interesados cuando se les pone de manifiesto una cuestión conexa no planteada?"
  options:
  - id: a
    text:
      es: "Solo formular alegaciones, sin aportar ningún medio de prueba sobre la cuestión."
  - id: b
    text:
      es: "Interponer recurso de alzada contra el acuerdo que les pone de manifiesto la cuestión."
  - id: c
    correct: true
    text:
      es: "Formular las alegaciones que estimen pertinentes y aportar, en su caso, los medios de prueba."
  - id: d
    text:
      es: "Pedir que la cuestión se tramite en otro procedimiento, lo que suspende el plazo para resolver."
  explanation:
    es: "El artículo 88.1 permite al órgano pronunciarse sobre cuestiones conexas no planteadas poniéndolo antes de manifiesto a los interesados, «para que formulen las alegaciones que estimen pertinentes y aporten, en su caso, los medios de prueba». Las alegaciones no excluyen la prueba. La ley no prevé un recurso de alzada contra ese trámite ni una petición de procedimiento separado que suspenda el plazo para resolver."
  citation: "art. 88.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-95
- id: m02-l04-q0047
  prompt:
    es: "Según el artículo 95.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si tras la caducidad cabe iniciar un nuevo procedimiento por no haber prescrito, podrán incorporarse a él:"
  options:
  - id: a
    correct: true
    text:
      es: "los actos y trámites cuyo contenido se hubiera mantenido igual de no haberse producido la caducidad."
  - id: b
    text:
      es: "todos los actos y trámites del procedimiento caducado, sin excepción alguna."
  - id: c
    text:
      es: "solo los actos de iniciación y los informes preceptivos que ya se hubieran emitido en aquel."
  - id: d
    text:
      es: "los actos y trámites que el interesado acepte expresamente conservar en el nuevo procedimiento."
  explanation:
    es: "El artículo 95.3 permite incorporar al nuevo procedimiento «los actos y trámites cuyo contenido se hubiera mantenido igual de no haberse producido la caducidad». No se incorporan todos sin excepción, ni solo los de iniciación y los informes. La aceptación del interesado no es condición del artículo."
  citation: "art. 95.3 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2015-10565-art-96
- id: m02-l04-q0049
  prompt:
    es: "Según el artículo 96.5 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los procedimientos sancionadores cabe la tramitación simplificada si hay elementos suficientes para calificar la infracción como:"
  options:
  - id: a
    text:
      es: "leve, siempre que el interesado consienta expresamente."
  - id: b
    text:
      es: "grave, sin que quepa la oposición expresa del interesado."
  - id: c
    text:
      es: "leve o grave, salvo que el interesado se oponga a ella."
  - id: d
    correct: true
    text:
      es: "leve, sin que quepa la oposición expresa del interesado."
  explanation:
    es: "El artículo 96.5 permite la tramitación simplificada en los procedimientos sancionadores cuando haya elementos para calificar la infracción «como leve, sin que quepa la oposición expresa por parte del interesado». No se exige su consentimiento, no vale para infracciones graves y la oposición expresa del apartado 2 no se aplica aquí."
  citation: "art. 96.5 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2015-10565-art-96
- id: m02-l04-q0050
  prompt:
    es: "Según el artículo 96.5 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en un procedimiento sancionador, ¿quién valora si la infracción es leve para adoptar la tramitación simplificada?"
  options:
  - id: a
    text:
      es: "El instructor, tras la notificación del acuerdo de iniciación."
  - id: b
    correct: true
    text:
      es: "El órgano competente para iniciar el procedimiento."
  - id: c
    text:
      es: "El órgano competente para resolver."
  - id: d
    text:
      es: "El interesado, mediante solicitud dirigida al órgano instructor."
  explanation:
    es: "El artículo 96.5 atribuye esa valoración al «órgano competente para iniciar el procedimiento». El instructor y el órgano que resuelve no figuran en el apartado. El interesado puede solicitar la tramitación simplificada en el procedimiento común (art. 96.3), pero no es quien aprecia la calificación de la infracción como leve."
  citation: "art. 96.5 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-85
- id: m02-l04-q0094
  prompt:
    es: "En un procedimiento sancionador, la sanción propuesta es solo pecuniaria, de 3.000 euros. El infractor reconoce su responsabilidad, paga voluntariamente antes de la resolución y desiste de todo recurso en vía administrativa. La notificación de iniciación recogía las reducciones mínimas del artículo 85.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas. ¿Qué importe debe pagar?"
  options:
  - id: a
    text:
      es: "Un importe de 2.400 euros."
  - id: b
    correct: true
    text:
      es: "Un importe de 1.800 euros."
  - id: c
    text:
      es: "Un importe de 1.920 euros."
  - id: d
    text:
      es: "Un importe de 1.200 euros."
  explanation:
    es: "Las reducciones son de, al menos, el 20 % cada una sobre el importe de la sanción propuesta y acumulables entre sí: por el reconocimiento y por el pago voluntario suman el 40 %, es decir 1.200 euros de reducción sobre 3.000, y quedan 1.800 euros. Los 2.400 euros aplican una sola reducción. Los 1.920 euros aplican la segunda sobre el importe ya reducido, y no sobre el propuesto. Y los 1.200 euros toman la reducción como si fuera el importe a pagar."
  citation: "art. 85.3 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "sanción"
  - "reducción"
# anchor: boe-a-2015-10565-art-87
- id: m02-l04-q0095
  prompt:
    es: "De acuerdo con el artículo 87 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, tras la finalización de las actuaciones complementarias, los interesados tienen un plazo para formular las alegaciones que consideren pertinentes de:"
  options:
  - id: a
    correct: true
    text:
      es: "siete días desde su finalización."
  - id: b
    text:
      es: "cinco días desde su finalización."
  - id: c
    text:
      es: "diez días desde su finalización."
  - id: d
    text:
      es: "quince días desde su finalización."
  explanation:
    es: "El artículo 87 concede siete días para alegar tras la finalización de las actuaciones complementarias. Cinco y diez días son plazos de otros trámites (subsanación, informes) y quince días es el máximo para practicarlas, no el plazo de alegaciones."
  citation: "art. 87 LPAC"
  difficulty: 1
  tags:
  - "finalización"
  - "actuaciones complementarias"
  - "plazo"
# anchor: boe-a-2015-10565-art-87
- id: m02-l04-q0097
  prompt:
    es: "Según el artículo 87 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el acuerdo del órgano competente para resolver de realizar actuaciones complementarias indispensables:"
  options:
  - id: a
    text:
      es: "se adopta sin necesidad de motivación y se comunica solo a quienes hayan alegado."
  - id: b
    text:
      es: "se adopta previa propuesta del instructor y se publica en el diario oficial."
  - id: c
    text:
      es: "se adopta mediante acuerdo motivado, sin notificación a los interesados hasta la resolución."
  - id: d
    correct: true
    text:
      es: "se adopta mediante acuerdo motivado y se notifica a los interesados."
  explanation:
    es: "El artículo 87 exige que el órgano competente decida mediante acuerdo motivado y que se notifique a los interesados, a quienes concede siete días para alegar tras su finalización. No puede prescindir de la motivación, ni limitar la comunicación a quienes alegaron, ni publicarse en diario oficial, ni diferirse la notificación a la resolución."
  citation: "art. 87 LPAC"
  difficulty: 2
  tags:
  - "finalización"
  - "actuaciones complementarias"
# anchor: boe-a-2015-10565-art-88
- id: m02-l04-q0098
  prompt:
    es: "De acuerdo con el artículo 88.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la resolución que ponga fin al procedimiento decidirá todas las cuestiones planteadas por los interesados y:"
  options:
  - id: a
    text:
      es: "solo las que el instructor haya incluido en la propuesta de resolución."
  - id: b
    text:
      es: "las que el órgano estime convenientes, aunque no deriven del procedimiento."
  - id: c
    correct: true
    text:
      es: "aquellas otras derivadas del mismo."
  - id: d
    text:
      es: "las ya resueltas por actos de trámite, para confirmarlas."
  explanation:
    es: "El artículo 88.1 obliga a decidir todas las cuestiones planteadas por los interesados y las derivadas del procedimiento. No se limita a la propuesta del instructor, ni alcanza a cuestiones ajenas al procedimiento, ni se reduce a confirmar actos de trámite."
  citation: "art. 88.1 LPAC"
  difficulty: 2
  tags:
  - "finalización"
  - "resolución"
# anchor: boe-a-2015-10565-art-95
- id: m02-l04-q0099
  prompt:
    es: "Conforme al artículo 95.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, contra la resolución que declare la caducidad del procedimiento:"
  options:
  - id: a
    text:
      es: "no cabrá recurso alguno, por ser una resolución de archivo."
  - id: b
    correct: true
    text:
      es: "procederán los recursos pertinentes."
  - id: c
    text:
      es: "solo cabrá el recurso contencioso-administrativo."
  - id: d
    text:
      es: "solo cabrá el recurso de alzada en el plazo de un mes."
  explanation:
    es: "El artículo 95.1 dice que contra la resolución que declare la caducidad procederán los recursos pertinentes. No es irrecurrible, ni se reduce a la vía judicial, ni se limita a la alzada."
  citation: "art. 95.1 LPAC"
  difficulty: 1
  tags:
  - "caducidad"
  - "recursos"
# anchor: boe-a-2015-10565-art-95
- id: m02-l04-q0100
  prompt:
    es: "Según el artículo 95.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si tras la caducidad se inicia un nuevo procedimiento por no haberse producido la prescripción, en él deberán cumplimentarse en todo caso los trámites de:"
  options:
  - id: a
    correct: true
    text:
      es: "alegaciones, proposición de prueba y audiencia al interesado."
  - id: b
    text:
      es: "información pública y audiencia a los terceros afectados."
  - id: c
    text:
      es: "subsanación de la solicitud y actuaciones complementarias."
  - id: d
    text:
      es: "informes preceptivos y dictamen del órgano consultivo."
  explanation:
    es: "El artículo 95.3 exige cumplimentar en todo caso alegaciones, proposición de prueba y audiencia al interesado, aunque se incorporen actos y trámites del procedimiento caducado. No impone la información pública, la subsanación, las actuaciones complementarias ni los informes y dictámenes."
  citation: "art. 95.3 LPAC"
  difficulty: 1
  tags:
  - "caducidad"
  - "nuevo procedimiento"
# anchor: boe-a-2015-10565-art-96
- id: m02-l04-q0101
  prompt:
    es: "De acuerdo con el artículo 96.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en cualquier momento del procedimiento anterior a su resolución, el órgano competente para su tramitación podrá acordar continuar con arreglo a:"
  options:
  - id: a
    correct: true
    text:
      es: "la tramitación ordinaria."
  - id: b
    text:
      es: "la tramitación de urgencia, con reducción a la mitad de los plazos."
  - id: c
    text:
      es: "la terminación convencional, previo acuerdo con los interesados."
  - id: d
    text:
      es: "la suspensión del procedimiento hasta que lo solicite el interesado."
  explanation:
    es: "El artículo 96.1 permite acordar la continuación con arreglo a la tramitación ordinaria en cualquier momento anterior a la resolución. No prevé pasar a la tramitación de urgencia, ni a la terminación convencional, ni suspender el procedimiento a petición del interesado."
  citation: "art. 96.1 LPAC"
  difficulty: 2
  tags:
  - "tramitación simplificada"
  - "órgano"
# anchor: boe-a-2015-10565-art-96
- id: m02-l04-q0102
  prompt:
    es: "Si la Administración acuerda de oficio la tramitación simplificada de un procedimiento que no es sancionador y alguno de los interesados manifiesta su oposición expresa, ¿cómo debe continuar, según el artículo 96.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Seguir la tramitación simplificada, porque la oposición de un interesado no la vincula."
  - id: b
    text:
      es: "Seguir la simplificada con los demás y la ordinaria solo con el interesado que se opone."
  - id: c
    text:
      es: "Suspender el procedimiento hasta que se pronuncie el superior jerárquico."
  - id: d
    correct: true
    text:
      es: "Seguir la tramitación ordinaria."
  explanation:
    es: "El artículo 96.2 obliga a seguir la tramitación ordinaria si alguno de los interesados manifiesta su oposición expresa. No puede mantenerse la simplificada pese a la oposición, ni dividirse el procedimiento, ni suspenderse a la espera del superior."
  citation: "art. 96.2 LPAC"
  difficulty: 2
  tags:
  - "tramitación simplificada"
  - "oposición"
# anchor: boe-a-2015-10565-art-96
- id: m02-l04-q0104
  prompt:
    es: "Conforme al artículo 96.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el órgano competente no resuelve sobre la solicitud de tramitación simplificada una vez transcurrido el plazo de cinco días desde su presentación:"
  options:
  - id: a
    text:
      es: "se entiende estimada la solicitud, por silencio administrativo."
  - id: b
    correct: true
    text:
      es: "se entiende desestimada la solicitud."
  - id: c
    text:
      es: "se acuerda de oficio la tramitación simplificada del procedimiento."
  - id: d
    text:
      es: "se suspende el procedimiento hasta que el órgano se pronuncie."
  explanation:
    es: "El artículo 96.3 dice que transcurrido el plazo de cinco días se entiende desestimada la solicitud. No se estima por silencio, ni se acuerda de oficio la simplificada, ni se suspende el procedimiento."
  citation: "art. 96.3 LPAC"
  difficulty: 1
  tags:
  - "tramitación simplificada"
  - "silencio"
# anchor: boe-a-2015-10565-art-96
- id: m02-l04-q0105
  prompt:
    es: "El lunes 1 de junio de 2026 un interesado presenta la solicitud de tramitación simplificada de su procedimiento. No hay festivos en junio. Según el artículo 96.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta cuándo puede el órgano desestimarla, apreciando que no concurren las razones previstas?"
  options:
  - id: a
    text:
      es: "Hasta el sábado 6 de junio de 2026."
  - id: b
    correct: true
    text:
      es: "Hasta el lunes 8 de junio de 2026."
  - id: c
    text:
      es: "Hasta el viernes 5 de junio de 2026."
  - id: d
    text:
      es: "Hasta el martes 9 de junio de 2026."
  explanation:
    es: "Son cinco días hábiles desde el día siguiente a la presentación: del martes 2 al viernes 5 son cuatro y el lunes 8 el quinto. El sábado 6 sale de contar cinco días naturales. El viernes 5 resulta de contar el día de presentación como primero. Y el martes 9 es el sexto día."
  citation: "art. 96.3 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
  - "tramitación simplificada"
