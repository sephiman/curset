# anchor: boe-a-1985-5392-art-3
- id: m01-l09-q066
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge las Entidades Locales territoriales según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local?"
  options:
  - id: a
    text:
      es: "El Municipio, la Provincia y la Comarca en todas las Comunidades Autónomas."
  - id: b
    text:
      es: "El Municipio, la Provincia y las Áreas Metropolitanas de las grandes ciudades."
  - id: c
    text:
      es: "El Municipio, la Mancomunidad de Municipios y la Isla en los archipiélagos."
  - id: d
    correct: true
    text:
      es: "El Municipio, la Provincia y la Isla en los archipiélagos balear y canario."
  explanation:
    es: "El artículo 3.1 LBRL dice que son Entidades Locales territoriales «el Municipio», «la Provincia» y «la Isla en los archipiélagos balear y canario». Las Comarcas, las Áreas Metropolitanas y las Mancomunidades de Municipios son entidades locales, pero el artículo 3.2 las pone en el otro grupo, el de las no territoriales."
  citation: "art. 3.1 LBRL"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1985-5392-art-3
- id: m01-l09-q067
  prompt:
    es: "¿Cuál de las siguientes goza de la condición de Entidad Local sin ser Entidad Local territorial, según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local?"
  options:
  - id: a
    correct: true
    text:
      es: "Las Áreas Metropolitanas de grandes aglomeraciones urbanas."
  - id: b
    text:
      es: "Las Diputaciones Provinciales de régimen común."
  - id: c
    text:
      es: "Las Delegaciones del Gobierno en las Comunidades Autónomas."
  - id: d
    text:
      es: "Las Islas de los archipiélagos balear y canario."
  explanation:
    es: "El artículo 3.2 LBRL da la condición de Entidades Locales a las Comarcas, a «las Áreas Metropolitanas» y a las Mancomunidades de Municipios. La Diputación no es una entidad: es el órgano de gobierno de la Provincia, que es entidad territorial. Las Delegaciones del Gobierno son órganos de la Administración General del Estado. La Isla es entidad local territorial según el artículo 3.1."
  citation: "art. 3.2 LBRL"
  difficulty: 2
  tags:
  - "estructura"
  - "concepto"
# anchor: boe-a-1985-5392-art-11
- id: m01-l09-q068
  prompt:
    es: "De acuerdo con el artículo 11.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, el Municipio:"
  options:
  - id: a
    text:
      es: "Es la entidad local intermedia entre la Provincia y la Comunidad Autónoma."
  - id: b
    text:
      es: "Es la entidad territorial básica de la organización de las Comunidades Autónomas."
  - id: c
    correct: true
    text:
      es: "Es la entidad local básica de la organización territorial del Estado."
  - id: d
    text:
      es: "Es una entidad local sin personalidad jurídica propia, distinta del Ayuntamiento."
  explanation:
    es: "El artículo 11.1 LBRL dice que «el Municipio es la entidad local básica de la organización territorial del Estado». No es una entidad intermedia: la Provincia es la que agrupa municipios. El artículo habla de la organización territorial del Estado, no de la de las Comunidades Autónomas. El mismo apartado le reconoce personalidad jurídica y plena capacidad."
  citation: "art. 11.1 LBRL"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-13
- id: m01-l09-q071
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la alteración de términos municipales es correcta según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local?"
  options:
  - id: a
    correct: true
    text:
      es: "Se regula por la legislación autonómica sobre régimen local y no puede suponer modificación de los límites provinciales."
  - id: b
    text:
      es: "Se regula por ley orgánica de las Cortes Generales, igual que la alteración de los límites provinciales."
  - id: c
    text:
      es: "Se regula por la legislación autonómica y puede modificar los límites provinciales con informe del Estado."
  - id: d
    text:
      es: "Se regula por la legislación estatal y requiere la aprobación del Consejo de Ministros."
  explanation:
    es: "El artículo 13.1 LBRL remite la alteración de términos municipales a «la legislación de las Comunidades Autónomas sobre régimen local», sin que pueda suponer, «en ningún caso, modificación de los límites provinciales». La ley orgánica de las Cortes es la que exige el artículo 141.1 CE para los límites provinciales, no para los términos municipales. Ningún informe permite tocar los límites provinciales por esta vía. La ley no atribuye la decisión al Estado ni al Consejo de Ministros."
  citation: "art. 13.1 LBRL"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1985-5392-art-13
- id: m01-l09-q072
  prompt:
    es: "De acuerdo con el artículo 13.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, la creación de nuevos municipios solo podrá realizarse sobre la base de núcleos de población territorialmente diferenciados:"
  options:
  - id: a
    text:
      es: "De al menos 2.000 habitantes."
  - id: b
    correct: true
    text:
      es: "De al menos 4.000 habitantes."
  - id: c
    text:
      es: "De al menos 5.000 habitantes."
  - id: d
    text:
      es: "De al menos 1.000 habitantes."
  explanation:
    es: "El artículo 13.2 LBRL exige núcleos de población territorialmente diferenciados «de al menos 4.000 habitantes». Las cifras de 1.000 y 5.000 habitantes aparecen en la LBRL para otras reglas: los servicios de secretaría e intervención que garantiza la Diputación y la Junta de Gobierno Local. La de 2.000 no está en el artículo."
  citation: "art. 13.2 LBRL"
  difficulty: 1
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1985-5392-art-16
- id: m01-l09-q075
  prompt:
    es: "De acuerdo con el artículo 16.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, las certificaciones que se expidan de los datos del Padrón municipal:"
  options:
  - id: a
    text:
      es: "Tendrán carácter de documento privado, salvo que las expida el Instituto Nacional de Estadística."
  - id: b
    text:
      es: "Tendrán carácter de documento público solo a efectos electorales y tributarios."
  - id: c
    correct: true
    text:
      es: "Tendrán carácter de documento público y fehaciente para todos los efectos administrativos."
  - id: d
    text:
      es: "Constituirán prueba de la nacionalidad y del estado civil de los vecinos."
  explanation:
    es: "El artículo 16.1 LBRL dice que esas certificaciones «tendrán carácter de documento público y fehaciente para todos los efectos administrativos». Son documento público aunque las expida el ayuntamiento. Su eficacia no se limita a efectos electorales o tributarios. Los datos del Padrón prueban la residencia y el domicilio habitual, no la nacionalidad ni el estado civil."
  citation: "art. 16.1 LBRL"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1985-5392-art-19
- id: m01-l09-q076
  prompt:
    es: "De acuerdo con el artículo 19.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, en los términos que establezca la legislación electoral general:"
  options:
  - id: a
    correct: true
    text:
      es: "Los Concejales son elegidos mediante sufragio universal, igual, libre, directo y secreto, y el Alcalde por los Concejales o por los vecinos."
  - id: b
    text:
      es: "Los Concejales son elegidos mediante sufragio universal indirecto, y el Alcalde por los Concejales o por los vecinos."
  - id: c
    text:
      es: "Los Concejales son elegidos mediante sufragio universal, igual, libre, directo y secreto, y el Alcalde por el Pleno de la Diputación."
  - id: d
    text:
      es: "Los Concejales son designados por el Alcalde, y el Alcalde es elegido por los vecinos mediante sufragio universal directo."
  explanation:
    es: "El artículo 19.2 LBRL dice: «Los Concejales son elegidos mediante sufragio universal, igual, libre, directo y secreto, y el Alcalde es elegido por los Concejales o por los vecinos». El sufragio de los Concejales es directo, no indirecto. La Diputación no interviene en la elección del Alcalde. El Alcalde no designa a los Concejales."
  citation: "art. 19.2 LBRL"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1985-5392-art-19
- id: m01-l09-q077
  prompt:
    es: "Según el artículo 19.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿a quién corresponden el gobierno y la administración municipal, salvo en los municipios que funcionen en Concejo Abierto?"
  options:
  - id: a
    text:
      es: "Al Pleno, integrado por todos los Concejales y presidido por el Alcalde."
  - id: b
    correct: true
    text:
      es: "Al ayuntamiento, integrado por el Alcalde y los Concejales."
  - id: c
    text:
      es: "A la Junta de Gobierno Local, presidida por el Alcalde."
  - id: d
    text:
      es: "A la asamblea vecinal, de la que forman parte todos los electores."
  explanation:
    es: "El artículo 19.1 LBRL atribuye el gobierno y la administración municipal «al ayuntamiento, integrado por el Alcalde y los Concejales». El Pleno y la Junta de Gobierno Local son órganos del ayuntamiento. La asamblea vecinal es propia del Concejo Abierto, que es justo la excepción del artículo (art. 29.3)."
  citation: "art. 19.1 LBRL"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1985-5392-art-20
- id: m01-l09-q078
  prompt:
    es: "Según el artículo 20.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿qué órganos existen en todos los ayuntamientos?"
  options:
  - id: a
    text:
      es: "El Alcalde, la Junta de Gobierno Local y el Pleno."
  - id: b
    text:
      es: "El Alcalde, los Tenientes de Alcalde y la Junta de Gobierno Local."
  - id: c
    correct: true
    text:
      es: "El Alcalde, los Tenientes de Alcalde y el Pleno."
  - id: d
    text:
      es: "El Alcalde, el Pleno y la Comisión Especial de Sugerencias y Reclamaciones."
  explanation:
    es: "El artículo 20.1.a) LBRL dice: «El Alcalde, los Tenientes de Alcalde y el Pleno existen en todos los ayuntamientos». La Junta de Gobierno Local solo es obligatoria en los municipios de más de 5.000 habitantes (art. 20.1.b). La Comisión Especial de Sugerencias y Reclamaciones existe en los municipios de gran población y en los que lo acuerde el Pleno o lo disponga el Reglamento orgánico (art. 20.1.d)."
  citation: "art. 20.1.a LBRL"
  difficulty: 1
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1985-5392-art-20
- id: m01-l09-q079
  prompt:
    es: "De acuerdo con el artículo 20.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, la Junta de Gobierno Local existe:"
  options:
  - id: a
    correct: true
    text:
      es: "En todos los municipios con población superior a 5.000 habitantes y en los de menos si lo dispone su reglamento orgánico o lo acuerda el Pleno."
  - id: b
    text:
      es: "En todos los municipios con población superior a 20.000 habitantes y en los de menos si lo acuerda el Pleno por mayoría absoluta."
  - id: c
    text:
      es: "En todos los municipios con población superior a 5.000 habitantes, sin que pueda existir en los de menos."
  - id: d
    text:
      es: "En todos los ayuntamientos, con independencia de su población, igual que el Pleno."
  explanation:
    es: "El artículo 20.1.b) LBRL dice que la Junta de Gobierno Local existe «en todos los municipios con población superior a 5.000 habitantes y en los de menos, cuando así lo disponga su reglamento orgánico o así lo acuerde el Pleno de su ayuntamiento». El umbral es 5.000, no 20.000, y la ley no exige mayoría absoluta. Los municipios más pequeños pueden tenerla. No existe en todos los ayuntamientos: eso solo vale para el Alcalde, los Tenientes de Alcalde y el Pleno."
  citation: "art. 20.1.b LBRL"
  difficulty: 1
  tags:
  - "órgano"
  - "cantidad"
# anchor: boe-a-1985-5392-art-20
- id: m01-l09-q080
  prompt:
    es: "En un municipio de 3.000 habitantes, ¿cuándo existe la Junta de Gobierno Local según la legislación básica estatal de régimen local?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando lo disponga su reglamento orgánico o lo acuerde el Pleno de su ayuntamiento."
  - id: b
    text:
      es: "Cuando lo autorice la Comunidad Autónoma, a petición del Alcalde."
  - id: c
    text:
      es: "Nunca, porque solo existe en los municipios de más de 5.000 habitantes."
  - id: d
    text:
      es: "Siempre, porque existe en todos los ayuntamientos junto con el Pleno."
  explanation:
    es: "El artículo 20.1.b) LBRL prevé la Junta de Gobierno Local en los municipios de 5.000 habitantes o menos «cuando así lo disponga su reglamento orgánico o así lo acuerde el Pleno de su ayuntamiento». La ley no pide autorización autonómica. Un municipio de 3.000 habitantes puede tenerla, así que «nunca» es falso. Tampoco existe siempre: solo el Alcalde, los Tenientes de Alcalde y el Pleno existen en todos los ayuntamientos."
  citation: "art. 20.1.b LBRL"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-1985-5392-art-20
- id: m01-l09-q081
  prompt:
    es: "Según el artículo 20.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿en qué municipios existe la Comisión Especial de Sugerencias y Reclamaciones?"
  options:
  - id: a
    text:
      es: "En todos los municipios, con la estructura prevista para la Comisión Especial de Cuentas."
  - id: b
    correct: true
    text:
      es: "En los de gran población y en los demás si el Pleno lo acuerda por mayoría absoluta del número legal o lo dispone el Reglamento orgánico."
  - id: c
    text:
      es: "En los de más de 5.000 habitantes y en los de menos si lo acuerda el Pleno por mayoría simple."
  - id: d
    text:
      es: "Solo en los municipios de gran población, sin que el Pleno pueda acordarla en los demás."
  explanation:
    es: "El artículo 20.1.d) LBRL dice que esta Comisión existe en los municipios del título X, los de gran población, «y en aquellos otros en que el Pleno así lo acuerde, por el voto favorable de la mayoría absoluta del número legal de sus miembros, o así lo disponga su Reglamento orgánico». La que existe en todos los municipios es la Comisión Especial de Cuentas (art. 20.1.e). El umbral de 5.000 habitantes y la mayoría simple no están en esta letra. El Pleno sí puede acordarla fuera de los municipios de gran población."
  citation: "art. 20.1.d LBRL"
  difficulty: 3
  tags:
  - "órgano"
  - "mayoría"
# anchor: boe-a-1985-5392-art-21
- id: m01-l09-q082
  prompt:
    es: "De acuerdo con el artículo 21.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, el Alcalde es el Presidente de la Corporación y, entre otras atribuciones, le corresponde:"
  options:
  - id: a
    text:
      es: "Aprobar el reglamento orgánico y las ordenanzas del municipio."
  - id: b
    text:
      es: "Aprobar la plantilla de personal y la relación de puestos de trabajo."
  - id: c
    text:
      es: "Declarar la lesividad de los actos del Ayuntamiento."
  - id: d
    correct: true
    text:
      es: "Ejercer la jefatura de la Policía Municipal."
  explanation:
    es: "El artículo 21.1.i) LBRL atribuye al Alcalde «ejercer la jefatura de la Policía Municipal». Las otras tres son atribuciones del Pleno: la aprobación del reglamento orgánico y de las ordenanzas (art. 22.2.d), la de la plantilla y la relación de puestos de trabajo (art. 22.2.i) y la declaración de lesividad (art. 22.2.k)."
  citation: "art. 21.1 LBRL"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1985-5392-art-21
- id: m01-l09-q083
  prompt:
    es: "Según el artículo 21.3 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿cuál de las siguientes atribuciones del Alcalde es indelegable?"
  options:
  - id: a
    text:
      es: "Ejercer la jefatura de la Policía Municipal."
  - id: b
    text:
      es: "Dirigir, inspeccionar e impulsar los servicios y obras municipales."
  - id: c
    correct: true
    text:
      es: "Decidir los empates con el voto de calidad."
  - id: d
    text:
      es: "Otorgar las licencias que las leyes sectoriales no atribuyan a otro órgano."
  explanation:
    es: "El artículo 21.3 LBRL permite al Alcalde delegar sus atribuciones «salvo las de convocar y presidir las sesiones del Pleno y de la Junta de Gobierno Local, decidir los empates con el voto de calidad», entre otras. La jefatura de la Policía Municipal (letra i), la dirección de servicios y obras (letra d) y el otorgamiento de licencias (letra q) no están en esa lista, así que son delegables."
  citation: "art. 21.3 LBRL"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1985-5392-art-23
- id: m01-l09-q084
  prompt:
    es: "Según el artículo 23.3 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, los Tenientes de Alcalde son libremente designados y removidos por el Alcalde:"
  options:
  - id: a
    text:
      es: "De entre los Concejales, previa votación del Pleno por mayoría absoluta."
  - id: b
    text:
      es: "De entre los miembros de la Junta de Gobierno Local, sin excepción alguna."
  - id: c
    correct: true
    text:
      es: "De entre los miembros de la Junta de Gobierno Local y, donde esta no exista, de entre los Concejales."
  - id: d
    text:
      es: "De entre los vecinos inscritos en el Padrón, sean o no Concejales."
  explanation:
    es: "El artículo 23.3 LBRL dice que los Tenientes de Alcalde son «libremente designados y removidos por éste de entre los miembros de la Junta de Gobierno Local y, donde ésta no exista, de entre los Concejales». La designación es libre, sin votación del Pleno. La regla sí tiene excepción: los municipios sin Junta de Gobierno Local. Deben ser Concejales, no cualquier vecino."
  citation: "art. 23.3 LBRL"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1985-5392-art-22
- id: m01-l09-q085
  prompt:
    es: "De acuerdo con el artículo 22.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, corresponde al Pleno la concertación de las operaciones de crédito cuya cuantía acumulada en el ejercicio exceda:"
  options:
  - id: a
    text:
      es: "Del 15 por ciento de los recursos ordinarios del Presupuesto."
  - id: b
    correct: true
    text:
      es: "Del 10 por ciento de los recursos ordinarios del Presupuesto."
  - id: c
    text:
      es: "Del 5 por ciento de los recursos ordinarios del Presupuesto."
  - id: d
    text:
      es: "Del 20 por ciento de los recursos ordinarios del Presupuesto."
  explanation:
    es: "El artículo 22.2.m) LBRL atribuye al Pleno las operaciones de crédito cuya cuantía acumulada «exceda del 10 por ciento de los recursos ordinarios del Presupuesto». El 15 por ciento es otra regla del mismo apartado: se aplica a las operaciones de tesorería y se calcula sobre los ingresos corrientes liquidados en el ejercicio anterior. El 5 y el 20 por ciento no aparecen en el artículo."
  citation: "art. 22.2 LBRL"
  difficulty: 3
  tags:
  - "cantidad"
  - "competencia"
# anchor: boe-a-1985-5392-art-22
- id: m01-l09-q086
  prompt:
    es: "Según el artículo 22.3 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, las votaciones del Pleno sobre la moción de censura al Alcalde y sobre la cuestión de confianza planteada por este:"
  options:
  - id: a
    text:
      es: "Serán secretas y se realizarán mediante papeleta en todo caso."
  - id: b
    text:
      es: "Serán públicas, salvo que la mayoría absoluta del Pleno acuerde que sean secretas."
  - id: c
    text:
      es: "Serán públicas y se realizarán a mano alzada, salvo petición de un grupo político."
  - id: d
    correct: true
    text:
      es: "Serán públicas y se realizarán mediante llamamiento nominal en todo caso."
  explanation:
    es: "El artículo 22.3 LBRL dice que estas votaciones «serán públicas y se realizarán mediante llamamiento nominal en todo caso». No son secretas, y el Pleno no puede acordar que lo sean. El sistema es el llamamiento nominal, no la mano alzada."
  citation: "art. 22.3 LBRL"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1985-5392-art-23
- id: m01-l09-q087
  prompt:
    es: "De acuerdo con el artículo 23.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, la Junta de Gobierno Local se integra por el Alcalde y un número de Concejales:"
  options:
  - id: a
    text:
      es: "No superior a la mitad del número legal de los mismos."
  - id: b
    text:
      es: "No inferior al tercio del número legal de los mismos."
  - id: c
    text:
      es: "No superior a la cuarta parte del número legal de los mismos."
  - id: d
    correct: true
    text:
      es: "No superior al tercio del número legal de los mismos."
  explanation:
    es: "El artículo 23.1 LBRL dice que la Junta de Gobierno Local se integra por el Alcalde y un número de Concejales «no superior al tercio del número legal de los mismos». El tercio es un máximo, no un mínimo. La mitad y la cuarta parte no aparecen en el artículo."
  citation: "art. 23.1 LBRL"
  difficulty: 1
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-1985-5392-art-23
- id: m01-l09-q088
  prompt:
    es: "¿Quién nombra y separa a los Concejales que forman la Junta de Gobierno Local, según la legislación básica estatal de régimen local?"
  options:
  - id: a
    text:
      es: "El Pleno, por mayoría absoluta del número legal de sus miembros."
  - id: b
    correct: true
    text:
      es: "El Alcalde, libremente, dando cuenta al Pleno."
  - id: c
    text:
      es: "El Alcalde, a propuesta de los grupos políticos y previo acuerdo del Pleno."
  - id: d
    text:
      es: "El Pleno, a propuesta del Alcalde y por mayoría simple."
  explanation:
    es: "El artículo 23.1 LBRL dice que los Concejales de la Junta de Gobierno Local son «nombrados y separados libremente por aquél», el Alcalde, «dando cuenta al Pleno». El Pleno solo recibe esa información: no vota el nombramiento ni lo propone. La ley no pide propuesta de los grupos políticos."
  citation: "art. 23.1 LBRL"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1985-5392-art-23
- id: m01-l09-q089
  prompt:
    es: "¿Cuál de las siguientes atribuciones corresponde a la Junta de Gobierno Local según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local?"
  options:
  - id: a
    text:
      es: "El control y la fiscalización de los órganos de gobierno municipales."
  - id: b
    text:
      es: "La aprobación y modificación de los presupuestos municipales."
  - id: c
    correct: true
    text:
      es: "La asistencia al Alcalde en el ejercicio de sus atribuciones."
  - id: d
    text:
      es: "La votación sobre la moción de censura al Alcalde."
  explanation:
    es: "El artículo 23.2.a) LBRL atribuye a la Junta de Gobierno Local «la asistencia al Alcalde en el ejercicio de sus atribuciones». El control y la fiscalización de los órganos de gobierno, la aprobación de los presupuestos y la votación de la moción de censura corresponden al Pleno (art. 22.2.a y e, y art. 22.3)."
  citation: "art. 23.2 LBRL"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1985-5392-art-25
- id: m01-l09-q091
  prompt:
    es: "De acuerdo con el artículo 25.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, en la redacción de la Ley 4/2026, de 1 de octubre, el Municipio ejerce como competencia propia:"
  options:
  - id: a
    correct: true
    text:
      es: "La promoción de actuaciones en materia de igualdad de oportunidades, no discriminación y accesibilidad universal de las personas con discapacidad."
  - id: b
    text:
      es: "La prestación de servicios sociales especializados y de atención a la dependencia de las personas con discapacidad."
  - id: c
    text:
      es: "La evaluación del grado de discapacidad y el reconocimiento de prestaciones a las personas con discapacidad."
  - id: d
    text:
      es: "La inspección de la accesibilidad universal de los edificios de titularidad estatal situados en su término."
  explanation:
    es: "La Ley 4/2026, de 1 de octubre, añade al artículo 25.2 LBRL la letra q): «Promoción de actuaciones en materia de igualdad de oportunidades, no discriminación y accesibilidad universal de las personas con discapacidad». La letra habla de promoción, no de prestar servicios especializados, evaluar la discapacidad o inspeccionar edificios del Estado. Ninguna de esas tres materias figura en el artículo 25.2."
  citation: "art. 25.2.q LBRL"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-1985-5392-art-26
- id: m01-l09-q092
  prompt:
    es: "Según el artículo 26.1 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, los Municipios con población superior a 5.000 habitantes deben prestar, además de los servicios exigidos en todos:"
  options:
  - id: a
    text:
      es: "Protección civil, prevención y extinción de incendios e instalaciones deportivas de uso público."
  - id: b
    text:
      es: "Transporte colectivo urbano de viajeros y medio ambiente urbano."
  - id: c
    text:
      es: "Parque público, biblioteca pública e instalaciones deportivas de uso público."
  - id: d
    correct: true
    text:
      es: "Parque público, biblioteca pública y tratamiento de residuos."
  explanation:
    es: "El artículo 26.1.b) LBRL dice: «En los Municipios con población superior a 5.000 habitantes, además: parque público, biblioteca pública y tratamiento de residuos». Protección civil, incendios e instalaciones deportivas son el tramo de más de 20.000 habitantes (letra c). Transporte colectivo urbano y medio ambiente urbano son el de más de 50.000 (letra d). La opción que mezcla parque y biblioteca con instalaciones deportivas cambia el tercer servicio."
  citation: "art. 26.1.b LBRL"
  difficulty: 1
  tags:
  - "cantidad"
  - "competencia"
# anchor: boe-a-1985-5392-art-27
- id: m01-l09-q094
  prompt:
    es: "¿Qué duración debe tener la delegación en un Municipio del ejercicio de competencias del Estado o de una Comunidad Autónoma?"
  options:
  - id: a
    text:
      es: "No puede ser inferior a cuatro años."
  - id: b
    text:
      es: "No puede ser superior a cinco años."
  - id: c
    text:
      es: "No puede ser inferior a diez años."
  - id: d
    correct: true
    text:
      es: "No puede ser inferior a cinco años."
  explanation:
    es: "El artículo 27.1 LBRL dice que la delegación debe determinar su duración, «que no podrá ser inferior a cinco años». Cinco años es un mínimo, no un máximo. Cuatro y diez años no son la cifra de la ley."
  citation: "art. 27.1 LBRL"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1985-5392-art-29
- id: m01-l09-q095
  prompt:
    es: "Según el artículo 29.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿qué decisión del Ayuntamiento exige la constitución en concejo abierto de un municipio por su localización geográfica?"
  options:
  - id: a
    text:
      es: "Decisión favorable por mayoría absoluta de los miembros del Ayuntamiento."
  - id: b
    correct: true
    text:
      es: "Decisión favorable por mayoría de dos tercios de los miembros del Ayuntamiento."
  - id: c
    text:
      es: "Decisión favorable por mayoría de tres quintos de los miembros del Ayuntamiento."
  - id: d
    text:
      es: "Decisión favorable por mayoría simple de los miembros presentes del Ayuntamiento."
  explanation:
    es: "El artículo 29.2 LBRL exige, para los municipios del artículo 29.1.b), «petición de la mayoría de los vecinos, decisión favorable por mayoría de dos tercios de los miembros del Ayuntamiento y aprobación por la Comunidad Autónoma». La mayoría absoluta, la de tres quintos y la simple no son la que fija el artículo."
  citation: "art. 29.2 LBRL"
  difficulty: 3
  tags:
  - "mayoría"
  - "procedimiento"
# anchor: boe-a-1985-5392-art-11
- id: m01-l09-q107
  prompt:
    es: "Según el artículo 11.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, son elementos del Municipio:"
  options:
  - id: a
    correct: true
    text:
      es: "El territorio, la población y la organización."
  - id: b
    text:
      es: "El territorio, la población y la hacienda."
  - id: c
    text:
      es: "El territorio, la población y la capitalidad."
  - id: d
    text:
      es: "El territorio, la población y el patrimonio."
  explanation:
    es: "El artículo 11.2 enumera tres elementos: el territorio, la población y la organización. La hacienda, la capitalidad y el patrimonio son aspectos de la vida municipal que la ley trata en otros lugares, pero el artículo 11.2 no los cuenta como elementos: el tercero es la organización."
  citation: "art. 11.2 LBRL"
  difficulty: 1
  tags:
  - "estructura"
