# anchor: boe-a-2024-519-art-1
- id: m01-l06-q094
  prompt:
    es: "De conformidad con el artículo 1.1 del Real Decreto 1/2024, de 9 de enero, por el que se establecen las Comisiones Delegadas del Gobierno, uno de los órganos colegiados del Gobierno con categoría de Comisión Delegada es la:"
  options:
  - id: a
    text:
      es: "Comisión Sectorial de Gobierno Abierto."
  - id: b
    text:
      es: "Comisión Permanente del Foro de Gobierno Abierto."
  - id: c
    text:
      es: "Comisión General de Secretarios de Estado y Subsecretarios."
  - id: d
    correct: true
    text:
      es: "Comisión Delegada del Gobierno para la Agenda 2030."
  explanation:
    es: "El artículo 1.1 incluye entre las Comisiones Delegadas del Gobierno la de la Agenda 2030, en su letra e). La Comisión Sectorial de Gobierno Abierto y la Comisión Permanente del Foro son órganos de Gobierno Abierto y la Comisión General de Secretarios de Estado y Subsecretarios es otro órgano distinto: ninguno de los tres figura en la lista del artículo."
  citation: "art. 1.1.e) RD 1/2024"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2024-519-art-6
- id: m01-l06-q095
  prompt:
    es: "Según el artículo 6.4.a) del Real Decreto 1/2024, de 9 de enero, por el que se establecen las Comisiones Delegadas del Gobierno, la Comisión Delegada para la Agenda 2030 estudia las actuaciones de:"
  options:
  - id: a
    text:
      es: "Las Comunidades Autónomas y las entidades locales."
  - id: b
    correct: true
    text:
      es: "Los órganos competentes de la Administración General del Estado."
  - id: c
    text:
      es: "Las organizaciones de la sociedad civil del Foro de Gobierno Abierto."
  - id: d
    text:
      es: "Los órganos constitucionales del Estado."
  explanation:
    es: "La función a) de la Comisión Delegada es estudiar las actuaciones de los órganos competentes de la Administración General del Estado para el cumplimiento de los objetivos de desarrollo sostenible y la Agenda 2030. No estudia las de las Comunidades Autónomas ni de las entidades locales, ni las de las organizaciones de la sociedad civil del Foro, ni las de los órganos constitucionales."
  citation: "art. 6.4.a) RD 1/2024"
  difficulty: 2
  tags:
  - "competencia"
# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q115
  prompt:
    es: "Según el preámbulo de la Resolución 70/1 de la Asamblea General de las Naciones Unidas, ¿cuál de las siguientes es una de las esferas de importancia crítica en las que los Objetivos y las metas estimularán la acción?"
  options:
  - id: a
    text:
      es: "La justicia."
  - id: b
    text:
      es: "La cultura."
  - id: c
    text:
      es: "La energía."
  - id: d
    correct: true
    text:
      es: "La prosperidad."
  explanation:
    es: "Las cinco esferas son las personas, el planeta, la prosperidad, la paz y las alianzas. La justicia, la cultura y la energía no son esferas del preámbulo, aunque la justicia aparezca en el Objetivo 16 y la energía en el Objetivo 7."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 2
  tags:
  - "concepto"
