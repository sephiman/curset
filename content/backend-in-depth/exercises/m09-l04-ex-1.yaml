      number of milliseconds is wrong because sub-second precision is not supported. An integer number of minutes
      is wrong because the window is an Integer value expressing an interval in seconds. A UNIX timestamp is wrong
      because the draft uses delay-seconds, which aligns with `Retry-After`.
  citation: ietf-httpapi-ratelimit-headers#content
  extract:
    en: The time window MUST be a non-negative, non-zero, Integer value expressing an interval in seconds
- id: m09-l04-q06
  prompt:
    en: In PostgreSQL, a query uses `SELECT … FOR UPDATE NOWAIT`. What happens when one of the selected rows cannot
      be locked immediately because another transaction holds a conflicting lock?
  options:
  - id: a
    text:
      en: The row is skipped and the statement returns the remaining rows
  - id: b
    text:
      en: The statement waits until the other transaction commits and then locks the row
  - id: c
    text:
      en: The statement takes a table-level lock to get past the row lock
  - id: d
    correct: true
    text:
      en: The statement reports an error instead of waiting for the lock
  explanation:
    en: With `NOWAIT`, the statement reports an error, rather than waiting, if a selected row cannot be locked immediately.
      Skipping the row is wrong because that is the behavior of `SKIP LOCKED`. Waiting for the other transaction
      is wrong because `NOWAIT` is the option used to prevent the operation from waiting for other transactions
      to commit. A table-level lock is wrong because `NOWAIT` and `SKIP LOCKED` apply only to the row-level lock(s).
  citation: pg-sql-select#SQL-FOR-UPDATE-SHARE
  extract:
    en: With NOWAIT, the statement reports an error, rather than waiting, if a selected row cannot be locked immediately.
- id: m09-l04-q07
  prompt:
    en: Which drawback does the PostgreSQL documentation give for `SKIP LOCKED`, even though it can reduce lock
      contention among consumers of a queue-like table?
  options:
  - id: a
    text:
      en: It also skips the table-level lock, so concurrent schema changes can run
  - id: b
    text:
      en: It cannot be combined with a `LIMIT` clause
  - id: c
    correct: true
    text:
      en: It provides an inconsistent view of the data, so it is not suitable for general purpose work
  - id: d
    text:
      en: It locks every row the query scans before it skips any
  explanation:
    en: Skipping locked rows provides an inconsistent view of the data, so it is not suitable for general purpose
      work. Skipping the table-level lock is wrong because the required `ROW SHARE` table-level lock is still taken
      in the ordinary way. Incompatibility with `LIMIT` is wrong because, if a `LIMIT` is used, locking stops once
      enough rows have been returned. Locking every scanned row is wrong because the rows that are locked are exactly
      those that are returned by the query.
  citation: pg-sql-select#SQL-FOR-UPDATE-SHARE
  extract:
    en: Skipping locked rows provides an inconsistent view of the data, so this is not suitable for general purpose
      work, but can be used to avoid lock contention with multiple consumers accessing a queue-like table.
- id: m09-l04-q08
  prompt:
    en: An application relies on `SERIALIZABLE` transactions in PostgreSQL to prevent anomalies. Which practice
      does the documentation require of the application?
  options:
  - id: a
    text:
      en: It must lock the entire table before each read, as `READ COMMITTED` transactions do
  - id: b
    correct: true
    text:
      en: It must be prepared to retry transactions that fail with a serialization failure
  - id: c
    text:
      en: It may rely on data read in a transaction that later aborted
  - id: d
    text:
      en: It must expect predicate locks to block other transactions and cause deadlocks
  explanation:
    en: Applications using this level must be prepared to retry transactions due to serialization failures. Locking
      the entire table before each read is wrong because only a `READ COMMITTED` or `REPEATABLE READ` transaction
      may need to take out a lock on an entire table. Relying on data from an aborted transaction is wrong because
      applications must not depend on results read during a transaction that later aborted. Blocking predicate locks
      are wrong because in PostgreSQL these locks do not cause any blocking and cannot cause a deadlock.
  citation: pg-transaction-iso#XACT-SERIALIZABLE
  extract:
    en: applications using this level must be prepared to retry transactions due to serialization failures
- id: m09-l04-q10
  prompt:
    en: A Kafka application uses default producer and consumer settings and writes processed data to an external
      database. Which delivery guarantee does Kafka itself provide by default?
  options:
  - id: a
    correct: true
    text:
      en: At-least-once delivery
  - id: b
    text:
      en: At-most-once delivery, because the producer disables retries by default
  - id: c
    text:
      en: Exactly-once delivery to the external database without its cooperation
  - id: d
    text:
      en: No guarantee, because a committed message can be lost even while a broker replicating its partition is
        alive
  explanation:
    en: Kafka guarantees at-least-once delivery by default. At-most-once delivery is wrong because the user has
      to implement it by disabling retries on the producer and committing offsets in the consumer prior to processing
      a batch. Exactly-once delivery to the external database is wrong because exactly-once delivery for other destination
      systems generally requires cooperation with such systems. Having no guarantee is wrong because once a published
      message is committed, it will not be lost as long as one broker that replicates the partition remains alive.
  citation: kafka-design#message-delivery-semantics
  extract:
    en: Kafka guarantees at-least-once delivery by default, and allows the user to implement at-most-once delivery
      by disabling retries on the producer and committing offsets in the consumer prior to processing a batch of
      messages.
- id: m09-l04-q11
  prompt:
    en: A Kafka consumer reads messages, saves its position in the log, and only then processes them. It crashes
      after saving the position but before processing. Which semantics does this ordering give?
  options:
  - id: a
    text:
      en: At-least-once, because the new process re-reads messages that were already processed
  - id: b
    text:
      en: Exactly-once, because the position and the processing result are saved together
  - id: c
    correct: true
    text:
      en: At-most-once, because messages before the saved position may never be processed
  - id: d
    text:
      en: No guarantee, because the new process restarts from the beginning of the partition
  explanation:
    en: This ordering corresponds to at-most-once semantics, because on a consumer failure messages may not be processed.
      At-least-once is wrong because it comes from reading the messages, processing them, and finally saving the
      position. Exactly-once is wrong because the position is saved before the processing result, so messages may
      not be processed. Restarting from the beginning of the partition is wrong because the process that took over
      would start at the saved position.
  citation: kafka-design#message-delivery-semantics
  extract:
    en: It can read the messages, then save its position in the log, and finally process the messages. In this case
      there is a possibility that the consumer process crashes after saving its position but before saving the output
      of its message processing. In this case the process that took over processing would start at the saved position
      even though a few messages prior to that position had not been processed. This corresponds to “at-most-once”
      semantics as in the case of a consumer failure messages may not be processed.
- id: m09-l04-q12
  prompt:
    en: In RabbitMQ, a queue has a dead letter exchange configured. Which of these events does NOT cause its messages
      to be dead-lettered?
  options:
  - id: a
    correct: true
    text:
      en: The whole queue expires
  - id: b
    text:
      en: A consumer rejects a message with `basic.nack` and `requeue` set to false
  - id: c
    text:
