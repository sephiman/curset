        de tribunales de excepción, la existencia del Consejo General del Poder Judicial como órgano de autogobierno
        y la subordinación de los jueces únicamente a la Constitución y la ley.
    correct: true
  - id: c
    text:
      es: La independencia judicial se garantiza permitiendo que el Gobierno designe directamente a los magistrados
