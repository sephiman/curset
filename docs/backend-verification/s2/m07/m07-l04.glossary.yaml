- id: g-safe-method
  term: {en: safe method}
  definition: {en: "A request method whose defined semantics are essentially read-only, so that the client does not request, and does not expect, any state change on the origin server as a result of applying it to a target resource."}
  origin: m07-l04
  citation: "rfc9110#section-9.2.1"
- id: g-idempotent-method
  term: {en: idempotent method}
  definition: {en: "A request method for which the intended effect on the server of multiple identical requests is the same as the effect for a single such request."}
  origin: m07-l04
  citation: "rfc9110#section-9.2.2"
- id: g-entity-tag
  term: {en: entity tag}
  definition: {en: "An opaque validator for differentiating between multiple representations of the same resource, consisting of an opaque quoted string possibly prefixed by a weakness indicator."}
  origin: m07-l04
  citation: "rfc9110#section-8.8.3"
- id: g-strong-validator
  term: {en: strong validator}
  definition: {en: "Representation metadata that changes value whenever a change occurs to the representation data that would be observable in the content of a 200 (OK) response to GET."}
  origin: m07-l04
  citation: "rfc9110#section-8.8.1"
- id: g-weak-validator
  term: {en: weak validator}
  definition: {en: "Representation metadata that might not change for every change to the representation data."}
  origin: m07-l04
  citation: "rfc9110#section-8.8.1"
- id: g-conditional-request
  term: {en: conditional request}
  definition: {en: "An HTTP request with one or more request header fields that indicate a precondition to be tested before applying the request method to the target resource."}
  origin: m07-l04
  citation: "rfc9110#section-13"
- id: g-proactive-negotiation
  term: {en: proactive negotiation}
  definition: {en: "Content negotiation in which preferences are sent by the user agent in a request to encourage an algorithm located at the server to select the preferred representation; also called server-driven negotiation."}
  origin: m07-l04
  citation: "rfc9110#section-12.1"
