  prompt:
    es: "Según el artículo 127.4 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, transcurrido el plazo del apartado 1 sin que se haya ordenado el pago de la devolución por causa no imputable al contribuyente, ¿qué se aplica a la cantidad pendiente de devolución?"
  options:
  - id: a
    text:
      es: "El interés legal del dinero, en la cuantía que fije cada año la ley de presupuestos."
  - id: b
    text:
      es: "Un recargo del 5 por ciento sobre la cantidad pendiente de devolución."
  - id: c
