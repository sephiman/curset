# anchor: boe-a-2015-11719-art-52
- id: m04-l05-q203
  prompt:
    es: "Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué inspiran los principios de objetividad, integridad, neutralidad e imparcialidad con arreglo a los cuales actúan los empleados públicos?"
  options:
  - id: a
    text:
      es: "Las cartas de servicios de los órganos administrativos."
  - id: b
    text:
      es: "Los criterios de valoración de los concursos de provisión."
  - id: c
    text:
      es: "Los planes de igualdad de cada Departamento ministerial."
  - id: d
    correct: true
    text:
      es: "El Código de Conducta de los empleados públicos."
  explanation:
    es: "Según el artículo 52, esos principios «inspiran el Código de Conducta de los empleados públicos», configurado por los principios éticos y de conducta de los artículos 53 y 54. El precepto no los vincula a las cartas de servicios, a los criterios de valoración de los concursos ni a los planes de igualdad."
  citation: "art. 52 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-53
- id: m04-l05-q204
  prompt:
    es: "De acuerdo con el artículo 53.7 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos no aceptarán ningún trato de favor o situación que implique privilegio o ventaja injustificada por parte de:"
  options:
  - id: a
    text:
      es: "Solo las entidades privadas que contraten con su Administración."
  - id: b
    text:
      es: "Solo las personas físicas interesadas en un procedimiento a su cargo."
  - id: c
    correct: true
    text:
      es: "Las personas físicas o las entidades privadas."
  - id: d
    text:
      es: "Solo otras Administraciones Públicas y sus entidades dependientes."
  explanation:
    es: "El artículo 53.7 dice: «No aceptarán ningún trato de favor o situación que implique privilegio o ventaja injustificada, por parte de personas físicas o entidades privadas». La regla alcanza a cualquier persona física o entidad privada. Limitarla a los contratistas o a los interesados en un procedimiento la recorta. Las Administraciones Públicas no son personas físicas ni entidades privadas."
  citation: "art. 53.7 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-54
- id: m04-l05-q205
  prompt:
    es: "De acuerdo con el artículo 54.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el desempeño de las tareas correspondientes al puesto de trabajo se realizará:"
  options:
  - id: a
    correct: true
    text:
      es: "De forma diligente y cumpliendo la jornada y el horario establecidos."
  - id: b
    text:
      es: "De forma diligente y cumpliendo los objetivos anuales fijados para la unidad."
  - id: c
    text:
      es: "De forma diligente, con la jornada y el horario que se acuerden con el superior."
  - id: d
    text:
      es: "Con plena dedicación, sin sujeción a una jornada ni a un horario determinados."
  explanation:
    es: "El artículo 54.2 dice que el desempeño se realizará «de forma diligente y cumpliendo la jornada y el horario establecidos». El precepto habla de la jornada y el horario establecidos, no de objetivos anuales de la unidad ni de un horario pactado con el superior. La dedicación sin jornada ni horario contradice el texto."
  citation: "art. 54.2 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-54
- id: m04-l05-q206
  prompt:
    es: "De acuerdo con el artículo 54.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos obedecerán las instrucciones y órdenes profesionales de los superiores:"
  options:
  - id: a
    text:
      es: "Salvo que las consideren contrarias a su criterio técnico o profesional debidamente fundado."
  - id: b
    correct: true
    text:
      es: "Salvo que constituyan una infracción manifiesta del ordenamiento jurídico."
  - id: c
    text:
      es: "Salvo que no se les comuniquen por escrito y de forma motivada."
  - id: d
    text:
      es: "Salvo que constituyan una infracción leve del ordenamiento jurídico."
  explanation:
    es: "El artículo 54.3 dice: «Obedecerán las instrucciones y órdenes profesionales de los superiores, salvo que constituyan una infracción manifiesta del ordenamiento jurídico». La única excepción es la infracción manifiesta. El desacuerdo técnico y la falta de forma escrita no eximen de obedecer. La infracción «leve» cambia el criterio del precepto, que atiende a que la infracción sea manifiesta."
  citation: "art. 54.3 TREBEP"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2015-11719-art-54
- id: m04-l05-q208
  prompt:
    es: "Un funcionario recibe de su superior una orden profesional que constituye una infracción manifiesta del ordenamiento jurídico. Según el Código de Conducta de los empleados públicos, ¿cómo debe actuar?"
  options:
  - id: a
    correct: true
    text:
      es: "No la obedece y la pone inmediatamente en conocimiento de los órganos de inspección procedentes."
  - id: b
    text:
      es: "La cumple y después la pone en conocimiento de los órganos de inspección procedentes."
  - id: c
    text:
      es: "No la obedece y lo comunica a los órganos de inspección en el plazo de diez días."
  - id: d
    text:
      es: "La cumple, salvo que el superior no se la confirme por escrito y de forma motivada."
  explanation:
    es: "El deber de obediencia del artículo 54.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público cede «salvo que constituyan una infracción manifiesta del ordenamiento jurídico, en cuyo caso las pondrán inmediatamente en conocimiento de los órganos de inspección procedentes». Esa orden no se cumple, ni antes ni después de comunicarla. La comunicación es inmediata, no en diez días. La confirmación escrita del superior no la hace obligatoria."
  citation: "art. 54.3 TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-11719-art-54
- id: m04-l05-q209
  prompt:
    es: "De acuerdo con el artículo 54.5 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos administrarán los recursos y bienes públicos:"
  options:
  - id: a
    text:
      es: "Con eficiencia, y podrán usarlos en provecho propio si lo autoriza su superior."
  - id: b
    text:
      es: "Con austeridad, y solo los usarán en provecho propio fuera de la jornada de trabajo."
  - id: c
    correct: true
    text:
      es: "Con austeridad, y no los utilizarán en provecho propio o de personas allegadas."
  - id: d
    text:
      es: "Con economía, y podrán cederlos a personas allegadas sin coste para la Administración."
  explanation:
    es: "El artículo 54.5 dice: «Administrarán los recursos y bienes públicos con austeridad, y no utilizarán los mismos en provecho propio o de personas allegadas». La prohibición del provecho propio no admite autorización del superior ni excepción fuera de la jornada. La cesión a personas allegadas es justo lo que el precepto prohíbe."
  citation: "art. 54.5 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-54
- id: m04-l05-q210
  prompt:
    es: "Según el artículo 54.5 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué deber tienen asimismo los empleados públicos respecto de los recursos y bienes públicos que administran?"
  options:
  - id: a
    text:
      es: "El deber de inventariarlos cada año natural."
  - id: b
    correct: true
    text:
      es: "El deber de velar por su conservación."
  - id: c
    text:
      es: "El deber de asegurarlos frente a daños a terceros."
  - id: d
    text:
      es: "El deber de justificar su uso ante la Intervención."
  explanation:
    es: "El artículo 54.5 termina: «Tendrán, asimismo, el deber de velar por su conservación». El precepto no impone al empleado inventariar los bienes cada año, asegurarlos frente a terceros ni justificar su uso ante la Intervención."
  citation: "art. 54.5 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-54
- id: m04-l05-q211
  prompt:
    es: "De acuerdo con el artículo 54.8 del texto refundido de la Ley del Estatuto Básico del Empleado Público, en cuanto a su formación, los empleados públicos:"
  options:
  - id: a
    text:
      es: "Realizarán cada año las acciones formativas que fije su Departamento."
  - id: b
    text:
      es: "Seguirán la formación que la Administración les ofrezca en horario de trabajo."
  - id: c
    correct: true
    text:
      es: "Mantendrán actualizada su formación y cualificación."
  - id: d
    text:
      es: "Mantendrán actualizada su formación cuando lo exija el puesto que desempeñen."
  explanation:
    es: "El artículo 54.8 dice: «Mantendrán actualizada su formación y cualificación». El deber es permanente y propio del empleado. No depende de que el Departamento fije acciones anuales, de que la formación se ofrezca en horario de trabajo ni de que la exija el puesto."
  citation: "art. 54.8 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-54
- id: m04-l05-q212
  prompt:
    es: "De acuerdo con el artículo 54.11 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos garantizarán la atención al ciudadano:"
  options:
  - id: a
    text:
      es: "En castellano, salvo que el ciudadano pida otra lengua y el empleado la conozca."
  - id: b
    text:
      es: "En la lengua que lo solicite, sea o no oficial en el territorio."
  - id: c
    correct: true
    text:
      es: "En la lengua que lo solicite siempre que sea oficial en el territorio."
  - id: d
    text:
      es: "En la lengua oficial de la Comunidad Autónoma donde resida el ciudadano."
  explanation:
    es: "El artículo 54.11 dice: «Garantizarán la atención al ciudadano en la lengua que lo solicite siempre que sea oficial en el territorio». Decide la lengua que pide el ciudadano, con un único límite: que sea oficial en el territorio. No depende de que el empleado la conozca, no alcanza a lenguas no oficiales y no atiende a la residencia del ciudadano."
  citation: "art. 54.11 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2023-25758-art-122
- id: m04-l05-q213
  prompt:
    es: "De acuerdo con el artículo 122.1 del Real Decreto-ley 6/2023, de 19 de diciembre, la carrera horizontal consiste en el reconocimiento del desarrollo profesional del personal funcionario de carrera:"
  options:
  - id: a
    correct: true
    text:
      es: "Mediante su progresión en un sistema de tramos, sin necesidad de cambiar de puesto de trabajo."
  - id: b
    text:
      es: "Mediante su ascenso en la estructura de puestos de trabajo por los procedimientos de provisión previstos."
  - id: c
    text:
      es: "Mediante su acceso a Cuerpos o Escalas de un Subgrupo superior por promoción interna."
  - id: d
    text:
      es: "Mediante su progresión en un sistema de tramos, que exige ocupar un puesto de nivel superior."
  explanation:
    es: "El artículo 122.1 define la carrera horizontal como el reconocimiento del desarrollo profesional «mediante su progresión a través del ascenso en un sistema de tramos […] sin necesidad de cambiar de puesto de trabajo». El ascenso por los procedimientos de provisión y el acceso a un Subgrupo superior por promoción interna son otras figuras. Exigir un puesto de nivel superior contradice el «sin necesidad de cambiar de puesto»."
  citation: "art. 122.1 RDL 6/2023"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2023-25758-art-122
- id: m04-l05-q214
  prompt:
    es: "¿Cuántos tramos de carrera horizontal existen en cada grupo o subgrupo de personal funcionario de la Administración del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "4 tramos en cada grupo o subgrupo."
  - id: b
    text:
      es: "3 tramos en cada grupo o subgrupo."
  - id: c
    text:
      es: "6 tramos en cada grupo o subgrupo."
  - id: d
    text:
      es: "2 tramos en cada grupo o subgrupo."
  explanation:
    es: "El artículo 122.2.a) del Real Decreto-ley 6/2023 dice: «En cada grupo o subgrupo de personal funcionario existirán 4 tramos». Dos, tres o seis tramos no corresponden a ningún grupo o subgrupo: el número es el mismo para todos."
  citation: "art. 122.2 RDL 6/2023"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2023-25758-art-122
- id: m04-l05-q215
  prompt:
    es: "¿Qué carácter tiene la carrera profesional horizontal del personal funcionario de carrera en la Administración del Estado?"
  options:
  - id: a
    text:
      es: "Automático, por el mero transcurso de cada trienio."
  - id: b
    correct: true
    text:
      es: "Voluntario, y se ordena en un sistema de tramos."
  - id: c
    text:
      es: "Reservado a quien tenga consolidado el grado personal."
  - id: d
    text:
      es: "Limitado al personal de los subgrupos A1 y A2."
  explanation:
    es: "El artículo 122.2 del Real Decreto-ley 6/2023 dice: «La carrera profesional horizontal tendrá carácter voluntario», y el apartado 1 la ordena en un sistema de tramos. No avanza por el transcurso de trienios sino por ascensos de tramo. No exige grado consolidado. Hay tramos «en cada grupo o subgrupo», no solo en A1 y A2."
  citation: "art. 122.2 RDL 6/2023"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q216
  prompt:
    es: "¿En cuántos niveles se clasifican los puestos de trabajo de los funcionarios de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Los puestos se clasifican en 28 niveles."
  - id: b
    correct: true
    text:
      es: "Los puestos se clasifican en 30 niveles."
  - id: c
    text:
      es: "Los puestos se clasifican en 26 niveles."
  - id: d
    text:
      es: "Los puestos se clasifican en 32 niveles."
  explanation:
    es: "El artículo 70.1 dice: «Los puestos de trabajo se clasifican en 30 niveles». El artículo 21.1.a) de la Ley 30/1984 da la misma cifra. Veintiséis, veintiocho y treinta y dos no aparecen en ninguno de los dos textos."
  citation: "art. 70.1 RD 364/1995"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q217
  prompt:
    es: "De acuerdo con el artículo 70.2 del Real Decreto 364/1995, de 10 de marzo, los funcionarios de carrera adquieren un grado personal por el desempeño de uno o más puestos del nivel correspondiente durante:"
  options:
  - id: a
    text:
      es: "Tres años continuados o cuatro con interrupción."
  - id: b
    text:
      es: "Dos años, sean continuados o con interrupción."
  - id: c
    text:
      es: "Un año continuado o dos con interrupción."
  - id: d
    correct: true
    text:
      es: "Dos años continuados o tres con interrupción."
  explanation:
    es: "El artículo 70.2 dice que el grado se adquiere «por el desempeño de uno o más puestos del nivel correspondiente durante dos años continuados o tres con interrupción». Con interrupción hacen falta tres años, no dos. Las parejas de tres y cuatro años o de uno y dos años no están en el precepto."
  citation: "art. 70.2 RD 364/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1984-17387-art-21
- id: m04-l05-q218
  prompt:
    es: "Según el artículo 21.1.d) de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, ¿cómo se adquiere el grado personal por el desempeño de puestos?"
  options:
  - id: a
    text:
      es: "Tomando posesión de un puesto del nivel correspondiente, sin exigir un tiempo mínimo de desempeño."
  - id: b
    text:
      es: "Prestando dos años de servicio activo en el Cuerpo o Escala, cualquiera que sea el nivel del puesto."
  - id: c
    text:
      es: "Desempeñando un único puesto del nivel correspondiente durante dos años continuados, sin cambiar de puesto."
  - id: d
    correct: true
    text:
      es: "Desempeñando uno o más puestos del nivel correspondiente durante dos años continuados o tres con interrupción."
  explanation:
    es: "El artículo 21.1.d) dice: «El grado personal se adquiere por el desempeño de uno o más puestos de nivel correspondiente durante dos años continuados o tres con interrupción». La toma de posesión sola no basta: hace falta tiempo de desempeño. Cuenta el nivel de los puestos, no el mero servicio en el Cuerpo. Pueden ser varios puestos del mismo nivel, no uno solo."
  citation: "art. 21.1.d) Ley 30/1984"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q219
  prompt:
    es: "Una funcionaria con grado 18 consolidado desempeña un año un puesto de nivel 20 y, sin interrupción, otro año un segundo puesto de nivel 20 en otra unidad. ¿Consolida el grado 20 al cumplir esos dos años?"
  options:
  - id: a
    text:
      es: "No, porque los dos años deben cumplirse en un único puesto de trabajo."
  - id: b
    text:
      es: "No, porque al cambiar de puesto el cómputo vuelve a empezar desde cero."
  - id: c
    correct: true
    text:
      es: "Sí, porque el grado se adquiere desempeñando uno o más puestos del mismo nivel."
  - id: d
    text:
      es: "Sí, pero solo si el segundo puesto lo obtuvo por libre designación."
  explanation:
    es: "El artículo 70.2 del Real Decreto 364/1995 exige el desempeño «de uno o más puestos del nivel correspondiente durante dos años continuados», «cualquiera que fuera el sistema de provisión». Dos puestos de nivel 20 seguidos suman los dos años. El precepto no exige un único puesto ni reinicia el cómputo al cambiar de puesto, y el sistema de provisión del segundo puesto no importa."
  citation: "art. 70.2 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q220
  prompt:
    es: "Una funcionaria con grado 16 consolidado toma posesión el lunes 1 de marzo de 2027 de un puesto de nivel 18 y lo desempeña sin interrupción. ¿En qué fecha completa el tiempo para consolidar el grado 18?"
  options:
  - id: a
    text:
      es: "El miércoles 1 de marzo de 2028."
  - id: b
    text:
      es: "El viernes 1 de marzo de 2030."
  - id: c
    correct: true
    text:
      es: "El jueves 1 de marzo de 2029."
  - id: d
    text:
      es: "El viernes 1 de septiembre de 2028."
  explanation:
    es: "El puesto supera el grado en dos niveles, no en más de dos, así que rige la regla general del artículo 70.2: «dos años continuados». Contados de fecha a fecha desde el lunes 1 de marzo de 2027, los dos años se cumplen el jueves 1 de marzo de 2029. El miércoles 1 de marzo de 2028 es un año. El viernes 1 de septiembre de 2028 son dieciocho meses. El viernes 1 de marzo de 2030 son tres años, el tiempo exigido solo cuando hay interrupción."
  citation: "art. 70.2 RD 364/1995"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q222
  prompt:
    es: "Una funcionaria desempeñó un puesto de nivel 20 del 2 de febrero al 1 de agosto de 2026, cuando pasó a excedencia voluntaria por interés particular. El lunes 7 de junio de 2027 reingresa en un puesto de nivel 20. ¿Cuándo completa el tiempo para consolidar el grado 20?"
  options:
  - id: a
    text:
      es: "El viernes 7 de diciembre de 2029."
  - id: b
    text:
      es: "El viernes 7 de junio de 2030."
  - id: c
    text:
      es: "El jueves 7 de diciembre de 2028."
  - id: d
    correct: true
    text:
      es: "El jueves 7 de junio de 2029."
  explanation:
    es: "El artículo 70.2 del Real Decreto 364/1995 admite «dos años continuados o tres con interrupción», y vale el primero que se cumpla. Antes de la excedencia acumuló seis meses. Para tres años con interrupción le faltarían treinta meses, hasta el viernes 7 de diciembre de 2029. Dos años continuados desde el reingreso del lunes 7 de junio de 2027 se cumplen antes, el jueves 7 de junio de 2029. El viernes 7 de junio de 2030 son tres años desde el reingreso. El jueves 7 de diciembre de 2028 son dieciocho meses, que no alcanzan ninguno de los dos tiempos."
  citation: "art. 70.2 RD 364/1995"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q223
  prompt:
    es: "De acuerdo con el artículo 70.2 del Real Decreto 364/1995, de 10 de marzo, los funcionarios que obtengan un puesto de trabajo superior en más de dos niveles al correspondiente a su grado personal:"
  options:
  - id: a
    correct: true
    text:
      es: "Consolidarán cada dos años de servicios continuados el grado superior en dos niveles al que poseyesen."
  - id: b
    text:
      es: "Consolidarán a los dos años de servicios continuados el grado correspondiente al nivel del puesto."
  - id: c
    text:
      es: "Consolidarán cada año de servicios continuados el grado superior en un nivel al que poseyesen."
  - id: d
    text:
      es: "Consolidarán cada tres años de servicios, continuados o no, el grado superior en dos niveles."
  explanation:
    es: "El segundo párrafo del artículo 70.2 dice que esos funcionarios «consolidarán cada dos años de servicios continuados el grado superior en dos niveles al que poseyesen». No consolidan de una vez el nivel del puesto. El ritmo no es de un nivel por año. Esta regla exige servicios continuados, no tres años con o sin interrupción."
  citation: "art. 70.2 RD 364/1995"
  difficulty: 2
  tags:
  - "cómputo"
# anchor: boe-a-1995-8729-art-70
- id: m04-l05-q224
  prompt:
    es: "¿En qué caso un funcionario de la Administración General del Estado consolida el grado personal de dos en dos niveles por cada dos años de servicios continuados?"
  options:
  - id: a
    text:
      es: "Cuando obtiene un puesto superior en uno o dos niveles a su grado personal."
  - id: b
    correct: true
    text:
      es: "Cuando obtiene un puesto superior en más de dos niveles a su grado personal."
  - id: c
    text:
