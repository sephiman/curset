# anchor: boe-a-2009-19438-art-4
- id: m03-l04-q0304
  prompt:
    es: "De acuerdo con el artículo 4.1.a) del Real Decreto 1676/2009, de 13 de noviembre, por el que se regula el Consejo para la Defensa del Contribuyente, los vocales representantes de los sectores profesionales y académicos son nombrados por un período de:"
  options:
  - id: a
    text:
      es: "tres años no renovables, a propuesta del Secretario de Estado de Hacienda."
  - id: b
    correct: true
    text:
      es: "cinco años renovables, a propuesta del Secretario de Estado de Hacienda."
  - id: c
    text:
      es: "cinco años renovables, a propuesta del Director General de Tributos."
  - id: d
    text:
      es: "dos años renovables, a propuesta del Presidente del Consejo para la Defensa del Contribuyente."
  explanation:
    es: "Según el artículo 4.1.a), el nombramiento es por cinco años renovables a propuesta del Secretario de Estado de Hacienda. Los tres años no renovables y los dos años renovables no son el período del artículo, y la propuesta no corresponde al Director General de Tributos ni al Presidente del Consejo."
  citation: "art. 4.1 RD 1676/2009"
  difficulty: 1
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-2003-23186-art-35
- id: m03-l04-q0171
  prompt:
    es: "De acuerdo con el artículo 35.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, son obligados tributarios las personas físicas o jurídicas y las entidades a las que:"
  options:
  - id: a
    correct: true
    text:
      es: "la normativa tributaria impone el cumplimiento de obligaciones tributarias."
  - id: b
    text:
      es: "la Administración tributaria notifica una liquidación o un requerimiento."
  - id: c
    text:
      es: "la normativa tributaria atribuye personalidad jurídica a efectos fiscales."
  - id: d
    text:
      es: "la normativa tributaria impone únicamente el pago de la obligación tributaria principal."
  explanation:
    es: "El artículo 35.1 define a los obligados tributarios como las personas y entidades a las que la normativa tributaria impone el cumplimiento de obligaciones tributarias, sean principales o no. No depende de que reciban una notificación ni de una personalidad atribuida, y no se limita al pago de la obligación principal."
  citation: "art. 35.1 LGT"
  difficulty: 1
  tags:
  - "definición"
  - "sujeto"
# anchor: boe-a-2003-23186-art-35
- id: m03-l04-q0172
  prompt:
    es: "¿Cuál de los siguientes es obligado tributario según el artículo 35.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Los terceros que faciliten información tributaria a la Administración sin estar obligados por ley."
  - id: b
    correct: true
    text:
      es: "Los beneficiarios de supuestos de exención, devolución o bonificaciones tributarias, cuando no tengan la condición de sujetos pasivos."
  - id: c
    text:
      es: "Los funcionarios que tramitan los procedimientos tributarios que afectan al contribuyente."
  - id: d
    text:
      es: "Los herederos del contribuyente que hayan renunciado a la herencia."
  explanation:
    es: "El artículo 35.2.k) incluye entre los obligados tributarios a los beneficiarios de exenciones, devoluciones o bonificaciones que no sean sujetos pasivos. Quien informa voluntariamente, el personal que tramita los procedimientos y quien renuncia a la herencia no figuran en el listado."
  citation: "art. 35.2 LGT"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-35
- id: m03-l04-q0173
  prompt:
    es: "De acuerdo con el artículo 35.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la condición de obligado tributario:"
  options:
  - id: a
    text:
      es: "Solo tienen el carácter de obligados tributarios quienes deban cumplir obligaciones tributarias materiales."
  - id: b
    text:
      es: "No tienen el carácter de obligados tributarios quienes solo cumplan obligaciones formales sin ser deudores."
  - id: c
    correct: true
    text:
      es: "También tienen el carácter de obligados tributarios aquellos a quienes la normativa tributaria impone el cumplimiento de obligaciones tributarias formales."
  - id: d
    text:
      es: "Tienen el carácter de obligados tributarios quienes cumplan obligaciones formales, solo si son además contribuyentes."
  explanation:
    es: "El artículo 35.3 extiende la condición de obligado tributario a quienes deban cumplir obligaciones formales, sean o no deudores. Limitarla a las materiales, negarla a quien solo cumple obligaciones formales o exigir que sea contribuyente contradice el texto."
  citation: "art. 35.3 LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "condición"
# anchor: boe-a-2003-23186-art-35
- id: m03-l04-q0174
  prompt:
    es: "De acuerdo con el artículo 35.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, tienen la consideración de obligados tributarios las herencias yacentes, comunidades de bienes y demás entidades que, carentes de personalidad jurídica, constituyan una unidad económica o un patrimonio separado susceptibles de imposición:"
  options:
  - id: a
    text:
      es: "en todo caso, sin necesidad de previsión legal."
  - id: b
    text:
      es: "cuando lo acuerde la Administración tributaria."
  - id: c
    text:
      es: "solo cuando ejerzan actividades empresariales."
  - id: d
    correct: true
    text:
      es: "en las leyes en que así se establezca."
  explanation:
    es: "El artículo 35.4 condiciona esa consideración a que las leyes así lo establezcan. No opera en todo caso, no depende de un acuerdo de la Administración y no se reserva a las entidades con actividad empresarial."
  citation: "art. 35.4 LGT"
  difficulty: 1
  tags:
  - "condición"
  - "sujeto"
# anchor: boe-a-2003-23186-art-35
- id: m03-l04-q0175
  prompt:
    es: "Según el artículo 35.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué carácter tienen los responsables a los que se refiere el artículo 41?"
  options:
  - id: a
    text:
      es: "No tienen el carácter de obligados tributarios, sino de deudores principales."
  - id: b
    correct: true
    text:
      es: "Tienen asimismo el carácter de obligados tributarios."
  - id: c
    text:
      es: "Tienen el carácter de sujetos pasivos, como los contribuyentes."
  - id: d
    text:
      es: "Tienen el carácter de obligados tributarios solo cuando se les derive la deuda."
  explanation:
    es: "El artículo 35.5 atribuye a los responsables del artículo 41 el carácter de obligados tributarios, pero no el de deudores principales, que son los obligados del artículo 35.2 (art. 41.1). Tampoco son sujetos pasivos, que son el contribuyente y el sustituto, y su condición no depende de que se les derive la deuda."
  citation: "art. 35.5 LGT"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-35
- id: m03-l04-q0177
  prompt:
    es: "De acuerdo con el artículo 35.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la concurrencia de varios obligados tributarios en un mismo presupuesto de una obligación determina que queden obligados frente a la Administración tributaria al cumplimiento de todas las prestaciones:"
  options:
  - id: a
    text:
      es: "mancomunadamente, salvo que por ley se disponga expresamente otra cosa."
  - id: b
    text:
      es: "solidariamente, salvo que la Administración disponga expresamente otra cosa."
  - id: c
    text:
      es: "subsidiariamente, salvo que por ley se disponga expresamente otra cosa."
  - id: d
    correct: true
    text:
      es: "solidariamente, salvo que por ley se disponga expresamente otra cosa."
  explanation:
    es: "La regla del artículo 35.7 es la solidaridad, salvo que una ley disponga expresamente otra cosa. La mancomunidad y la subsidiariedad no son la regla, y la excepción no queda en manos de la Administración, sino de la ley."
  citation: "art. 35.7 LGT"
  difficulty: 2
  tags:
  - "efecto"
  - "condición"
# anchor: boe-a-2003-23186-art-35
- id: m03-l04-q0307
  prompt:
    es: "De acuerdo con el artículo 35.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando la Administración solo conozca la identidad de un titular, practica y notifica las liquidaciones tributarias a su nombre, y este viene obligado a satisfacerlas si:"
  options:
  - id: a
    text:
      es: "no designa un representante ante la Administración tributaria."
  - id: b
    correct: true
    text:
      es: "no solicita la división de la liquidación."
  - id: c
    text:
      es: "no aporta copia de la escritura de transmisión del bien."
  - id: d
    text:
      es: "no presenta alegaciones en el trámite de audiencia."
  explanation:
    es: "Según el artículo 35.7, el titular conocido queda obligado a satisfacer las liquidaciones notificadas a su nombre si no solicita su división. Designar representante, aportar la escritura y presentar alegaciones no son condiciones que el precepto mencione para eso."
  citation: "art. 35.7 LGT"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-44
- id: m03-l04-q0056
  prompt:
    es: "De acuerdo con el artículo 44 de la Ley 58/2003, de 17 de diciembre, General Tributaria, tienen capacidad de obrar en el orden tributario los menores de edad y los incapacitados en las relaciones derivadas de las actividades cuyo ejercicio les esté permitido por el ordenamiento jurídico sin la asistencia de:"
  options:
  - id: a
    correct: true
    text:
      es: "la persona que ejerza la patria potestad, tutela, curatela o defensa judicial."
  - id: b
    text:
      es: "un asesor fiscal designado por la Administración tributaria."
  - id: c
    text:
      es: "el Ministerio Fiscal, que debe autorizar cada actuación tributaria."
  - id: d
    text:
      es: "la persona que ejerza la patria potestad, tutela o curatela, con autorización judicial previa."
  explanation:
    es: "El artículo 44 reconoce esa capacidad en las actividades que el ordenamiento permite al menor o al incapacitado sin asistencia de quien ejerza la patria potestad, tutela, curatela o defensa judicial. No interviene un asesor designado por la Administración ni el Ministerio Fiscal, y no se exige autorización judicial previa para esas actividades."
  citation: "art. 44 LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "condición"
# anchor: boe-a-2003-23186-art-44
- id: m03-l04-q0057
  prompt:
    es: "Señale la respuesta CORRECTA sobre la capacidad de obrar en el orden tributario según el artículo 44 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "Los menores de edad carecen de capacidad de obrar en cualquier relación tributaria."
  - id: b
    correct: true
    text:
      es: "Se exceptúa el supuesto de los menores incapacitados cuando la extensión de la incapacitación afecte al ejercicio y defensa de los derechos de que se trate."
  - id: c
    text:
      es: "Los incapacitados tienen capacidad de obrar en todas las relaciones tributarias, con independencia de la extensión de su incapacitación."
  - id: d
    text:
      es: "Se exceptúa el supuesto de los menores de edad cuando la actividad se desarrolla sin la asistencia de su representante legal."
  explanation:
    es: "El artículo 44 excluye a los menores incapacitados cuando la extensión de la incapacitación afecte al ejercicio y defensa de los derechos de que se trate. No es cierto que los menores nunca tengan capacidad, ni que los incapacitados la tengan sin límite. La excepción tampoco se formula para los menores en general por actuar sin asistencia, que es justamente el supuesto en que la ley les reconoce capacidad."
  citation: "art. 44 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "sujeto"
# anchor: boe-a-2007-15984-art-111
- id: m03-l04-q0035
  prompt:
    es: "De acuerdo con el artículo 111.5 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, la revocación de la representación no supone la nulidad de las actuaciones practicadas con el representante antes de que:"
  options:
  - id: a
    correct: true
    text:
      es: "se haya acreditado esta circunstancia al órgano actuante."
  - id: b
    text:
      es: "se haya notificado la revocación al propio representante."
  - id: c
    text:
      es: "se haya inscrito la revocación en el registro público correspondiente."
  - id: d
    text:
      es: "se haya otorgado un nuevo poder ante notario."
  explanation:
    es: "El artículo 111.5 protege las actuaciones hechas con el representante hasta que se acredite la revocación ante el órgano actuante. Notificársela al representante, inscribirla o apoderar a otro no son los hechos que fija la norma. Desde la acreditación, además, se considera que el obligado no comparece ni atiende requerimientos hasta que nombre un nuevo representante o los atienda personalmente."
  citation: "art. 111.5 RGAT"
  difficulty: 1
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-2007-15984-art-113
- id: m03-l04-q0028
  prompt:
    es: "De acuerdo con el artículo 113 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, señale la respuesta CORRECTA sobre cuándo se puede considerar que las personas físicas desarrollan principalmente actividades económicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando más de la mitad de la base imponible general del IRPF del año anterior proceda de rendimientos netos de actividades económicas."
  - id: b
    text:
      es: "Cuando la mitad o más de la base imponible general del IRPF del año anterior proceda de rendimientos netos de actividades económicas."
  - id: c
    text:
      es: "Cuando más de la mitad de los ingresos íntegros del año anterior proceda de la venta de bienes o la prestación de servicios."
  - id: d
    text:
      es: "Cuando más de dos tercios de la base imponible general del IRPF del año anterior procedan de rendimientos netos de actividades económicas."
  explanation:
    es: "El artículo 113 exige más de la mitad de la base imponible general del IRPF del año anterior procedente de rendimientos netos de actividades económicas, o haberlo alcanzado en cada uno de los tres años anteriores si el año anterior no llegó. «La mitad o más» rebaja el umbral, pues exactamente la mitad no basta. Los ingresos íntegros no son la magnitud de la norma, y los dos tercios elevan el umbral."
  citation: "art. 113 RGAT"
  difficulty: 2
  tags:
  - "condición"
  - "porcentaje"
# anchor: boe-a-2007-15984-art-11
- id: m03-l04-q0031
  prompt:
    es: "Ernesto Vidal, empresario individual, fallece el 14 de febrero de 2025. Sus herederos deben presentar la declaración de baja en el Censo de Empresarios, Profesionales y Retenedores. Según el Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿hasta qué día pueden presentarla?"
  options:
  - id: a
    text:
      es: "Hasta el 14 de marzo de 2025."
  - id: b
    text:
      es: "Hasta el 14 de mayo de 2025."
  - id: c
    text:
      es: "Hasta el 14 de febrero de 2026."
  - id: d
    correct: true
    text:
      es: "Hasta el 14 de agosto de 2025."
  explanation:
    es: "El artículo 11.4 da a los herederos seis meses desde el fallecimiento. Contados de fecha a fecha desde el 14 de febrero de 2025, el plazo termina el 14 de agosto de 2025. El 14 de marzo es el plazo de un mes del cese (art. 11.2), el 14 de mayo resulta de aplicar tres meses, y el 14 de febrero de 2026 equivale a un año, que la norma no concede."
  citation: "art. 11.4 RGAT"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2007-15984-art-11
- id: m03-l04-q0032
  prompt:
    es: "De acuerdo con el artículo 11.4 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, en caso de fallecimiento del obligado tributario, los herederos comunican en el mismo plazo de la declaración de baja:"
  options:
  - id: a
    text:
      es: "el nombre del albacea designado por el causante para el cumplimiento de sus obligaciones tributarias."
  - id: b
    correct: true
    text:
      es: "la modificación de la titularidad de los derechos y obligaciones con trascendencia tributaria que permanecieran vigentes con terceros."
  - id: c
    text:
      es: "la renuncia a la herencia, si no se aceptara a beneficio de inventario."
  - id: d
    text:
      es: "el cambio del domicilio fiscal de los herederos, que debe constar en el censo."
  explanation:
    es: "Según el artículo 11.4, dentro de los seis meses los herederos presentan la baja, comunican la modificación de la titularidad de los derechos y obligaciones con trascendencia tributaria que siguieran vigentes con terceros y presentan, en su caso, las altas que procedan. El albacea, la renuncia a la herencia y el domicilio de los herederos no son comunicaciones que prevea este apartado."
  citation: "art. 11.4 RGAT"
  difficulty: 2
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-2003-23186-art-48
- id: m03-l04-q0071
  prompt:
    es: "De acuerdo con el artículo 48.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el domicilio fiscal es:"
  options:
  - id: a
    correct: true
    text:
      es: "el lugar de localización del obligado tributario en sus relaciones con la Administración tributaria."
  - id: b
    text:
      es: "el lugar donde el obligado tributario tiene su residencia habitual o su domicilio social."
  - id: c
    text:
      es: "el lugar que el obligado tributario elige libremente para recibir las notificaciones de la Administración."
  - id: d
    text:
      es: "el lugar donde el obligado tributario desarrolla la actividad que genera el hecho imponible."
  explanation:
    es: "El artículo 48.1 define el domicilio fiscal como el lugar de localización del obligado en sus relaciones con la Administración. Residencia habitual y domicilio social son los criterios para fijarlo según se trate de personas físicas o jurídicas (art. 48.2), no la definición. Tampoco es una elección libre para notificaciones ni el lugar de realización del hecho imponible."
  citation: "art. 48.1 LGT"
  difficulty: 1
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-48
- id: m03-l04-q0072
  prompt:
    es: "Según el artículo 48.2.a) de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál es, con carácter general, el domicilio fiscal de las personas físicas?"
  options:
  - id: a
    text:
      es: "El lugar donde radique el mayor valor del inmovilizado en el que realicen sus actividades."
  - id: b
    correct: true
    text:
      es: "El lugar donde tengan su residencia habitual."
  - id: c
    text:
      es: "El lugar donde esté centralizada la gestión administrativa de sus actividades."
  - id: d
    text:
      es: "El domicilio que figure en su documento nacional de identidad."
  explanation:
    es: "Para las personas físicas la regla general es la residencia habitual (art. 48.2.a). El lugar de gestión centralizada y el del mayor valor del inmovilizado solo entran para quienes desarrollan principalmente actividades económicas, el segundo de forma subsidiaria. El domicilio del documento de identidad no es criterio legal."
  citation: "art. 48.2 LGT"
  difficulty: 1
  tags:
  - "definición"
  - "sujeto"
# anchor: boe-a-2003-23186-art-48
- id: m03-l04-q0073
  prompt:
    es: "Teodoro Aguirre, residente en Toledo, obtiene más de la mitad de su renta de una actividad de transporte. No puede determinarse dónde está centralizada la gestión administrativa y la dirección de su actividad. Según la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué lugar prevalece como domicilio fiscal?"
  options:
  - id: a
    text:
      es: "Su residencia habitual en Toledo, que prevalece sobre cualquier otro criterio."
  - id: b
    text:
      es: "El lugar donde se encuentre la mayor parte de sus clientes."
  - id: c
    correct: true
    text:
      es: "Aquel donde radique el mayor valor del inmovilizado en el que se realicen las actividades económicas."
  - id: d
    text:
      es: "El domicilio de su representante ante la Administración tributaria."
  explanation:
    es: "Para las personas físicas que desarrollan principalmente actividades económicas, la Administración puede considerar domicilio fiscal el lugar de gestión centralizada. Si no puede establecerse, prevalece donde radique el mayor valor del inmovilizado en el que se realicen las actividades (art. 48.2.a). La residencia habitual es la regla general, no la subsidiaria de este supuesto. La clientela y el representante no son criterios del precepto."
  citation: "art. 48.2 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "sujeto"
# anchor: boe-a-2003-23186-art-48
- id: m03-l04-q0075
  prompt:
    es: "Una sociedad extranjera sin establecimiento permanente en España, residente en Portugal, debe cumplir obligaciones tributarias en España. La normativa reguladora del tributo no regula su domicilio fiscal, y la sociedad ha designado un representante conforme al artículo 47. Según la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál es su domicilio fiscal?"
  options:
  - id: a
    text:
      es: "El de su domicilio social en Portugal."
  - id: b
    correct: true
    text:
      es: "El del representante al que se refiere el artículo 47."
  - id: c
    text:
      es: "El lugar donde radique el mayor valor de sus inmovilizados en España."
  - id: d
    text:
      es: "El de la oficina de la Agencia Estatal de Administración Tributaria que elija."
  explanation:
    es: "Para los no residentes el domicilio es el que determine la normativa de cada tributo y, en su defecto, el del representante del artículo 47 (art. 48.2.d). Solo si operan mediante establecimiento permanente se aplican los criterios de las personas físicas o jurídicas a ese establecimiento. El domicilio social extranjero y el inmovilizado en España no son criterios del precepto, y la oficina no se elige."
  citation: "art. 48.2 LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "condición"
# anchor: boe-a-2003-23186-art-48
- id: m03-l04-q0076
  prompt:
    es: "De acuerdo con el artículo 48.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el cambio de domicilio fiscal no produce efectos frente a la Administración tributaria:"
  options:
  - id: a
    text:
      es: "hasta que la Administración tributaria compruebe el nuevo domicilio."
  - id: b
    text:
      es: "hasta que transcurran tres meses desde que se produjo el cambio."
  - id: c
    correct: true
    text:
      es: "hasta que se cumpla con el deber de comunicación del cambio."
  - id: d
    text:
      es: "hasta que se inscriba el cambio en el Registro Mercantil."
  explanation:
    es: "El artículo 48.3 subordina la eficacia del cambio frente a la Administración al cumplimiento del deber de comunicarlo. No espera a que la Administración lo compruebe, ni a un plazo de tres meses, ni a una inscripción registral."
  citation: "art. 48.3 LGT"
  difficulty: 1
  tags:
  - "efecto"
  - "condición"
# anchor: boe-a-2003-23186-art-48
- id: m03-l04-q0077
  prompt:
    es: "De acuerdo con el artículo 48.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cada Administración tributaria podrá comprobar y rectificar el domicilio fiscal declarado por los obligados:"
  options:
  - id: a
    text:
      es: "en relación con todos los tributos, con independencia de quién los gestione."
  - id: b
    text:
      es: "solo cuando el obligado lo solicite expresamente."
  - id: c
    text:
      es: "únicamente en los procedimientos de inspección iniciados contra el obligado."
  - id: d
    correct: true
    text:
      es: "en relación con los tributos cuya gestión le competa."
  explanation:
    es: "El artículo 48.4 limita la comprobación y rectificación de cada Administración a los tributos cuya gestión le competa. No abarca los tributos de otras, no requiere la solicitud del obligado y no está reservada a la inspección."
  citation: "art. 48.4 LGT"
