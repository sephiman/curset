- id: m01-l02-q02
  prompt:
    en: In Java 25, how does the `Proxy` Javadoc define a proxy class, the kind of class of which `Proxy.newProxyInstance`
      returns an instance?
  options:
  - id: a
    text:
      en: A class created at build time that extends the target class and overrides its public methods
  - id: b
    correct: true
    text:
      en: A class created at runtime that implements a specified list of interfaces, known as proxy interfaces
  - id: c
    text:
      en: A class created at runtime that implements the target class's interfaces and its superclass
  - id: d
    text:
      en: A class written by hand that forwards each interface method to a field of the target type
  explanation:
    en: A proxy class is created at runtime and implements a specified list of interfaces, known as proxy interfaces.
      The build-time subclass claim is wrong because the class is created at runtime and implements interfaces.
      The claim that it implements the superclass is wrong because a proxy class implements exactly the interfaces
      specified at its creation. The hand-written claim is wrong because the class is generated at runtime.
  citation: javadoc-proxy#class-proxy; javadoc-proxy#class-proxy
- id: m01-l02-q03
  prompt:
    en: In Java 25, every proxy instance has an associated invocation handler. Which interface does the `Proxy`
      Javadoc say that handler object implements?
  options:
  - id: a
    text:
      en: '`java.lang.reflect.Proxy`'
  - id: b
    text:
      en: '`java.lang.reflect.Method`'
  - id: c
    text:
      en: '`java.lang.Runnable`'
  - id: d
    correct: true
    text:
      en: '`InvocationHandler`'
  explanation:
    en: The handler object implements the interface `InvocationHandler`. The class `java.lang.reflect.Proxy` is
      wrong because it is the class every proxy class extends, not what the handler implements. The class `java.lang.reflect.Method`
      is wrong because a `Method` object identifies the invoked method and is passed to `invoke`. The interface
      `java.lang.Runnable` is wrong because dispatching goes through the `invoke` method of `InvocationHandler`.
  citation: javadoc-proxy#class-proxy
- id: m01-l02-q04
  prompt:
    en: In Java 25, a method is invoked on a proxy instance through one of its proxy interfaces. What does the invocation
      handler's `invoke` method receive, according to the `Proxy` Javadoc?
  options:
  - id: a
    text:
      en: The target object, the name of the method as a `String`, and a `List` of arguments
  - id: b
    text:
      en: Only the array of `Object` arguments, since the handler is bound to a single method
  - id: c
    correct: true
    text:
      en: The proxy instance, a `Method` object identifying the invoked method, and an array of `Object` arguments
  - id: d
    text:
      en: The proxy interface's `Class` object and the return value of the target's method
  explanation:
    en: The `invoke` method receives the proxy instance, a `java.lang.reflect.Method` object and an array of `Object`
      containing the arguments. The target object and method name claim is wrong because the handler gets a `Method`
      object and the proxy, not the target. The arguments-only claim is wrong because one handler serves every method
      of the proxy interfaces. The return value claim is wrong because the handler produces the return value that
      is returned to the caller.
  citation: javadoc-proxy#class-proxy
- id: m01-l02-q11
  prompt:
    en: In Spring Framework 7.0, a target bean implements one interface. Which kind of proxy does Spring AOP create
      for it by default?
  options:
  - id: a
    correct: true
    text:
      en: A JDK dynamic proxy
  - id: b
    text:
      en: A CGLIB proxy, which is a runtime-generated subclass of the target type
  - id: c
    text:
      en: A CGLIB proxy, but only when the interface declares no `default` methods
  - id: d
    text:
      en: No proxy, because a bean that implements an interface is advised in place
  explanation:
    en: If the target implements at least one interface, a JDK dynamic proxy is used. The CGLIB claim is wrong because
      a CGLIB proxy is created when the target implements no interface. The `default` method claim is wrong because
      the choice depends on whether the target implements at least one interface. The no-proxy claim is wrong because
      Spring AOP uses either JDK dynamic proxies or CGLIB to create the proxy for a given target object.
  citation: spring-fw-aop-proxying#proxying-mechanisms
  extract:
    en: If the target object to be proxied implements at least one interface, a JDK dynamic proxy is used
- id: m01-l02-q19
  prompt:
    en: In Spring Framework 7.0, how does Spring AOP create the proxy for a given target object, according to the
      reference documentation?
  options:
  - id: a
    text:
      en: It uses load-time weaving, which rewrites the target class in place
  - id: b
    correct: true
    text:
      en: It uses either JDK dynamic proxies or CGLIB
  - id: c
    text:
      en: It uses only JDK dynamic proxies, and rejects targets that implement no interface
  - id: d
    text:
      en: It uses `Proxy` for classes and CGLIB for interfaces, chosen by bean name
  explanation:
    en: Spring AOP uses either JDK dynamic proxies or CGLIB to create the proxy for a given target object. The weaving
      claim is wrong because the proxy is a separate object and not a rewrite of the target class. The JDK-only
      claim is wrong because a target with no interfaces gets a CGLIB proxy. The bean name claim is wrong because
      the choice follows whether the target implements at least one interface.
  citation: spring-fw-aop-proxying#proxying-mechanisms
  extract:
    en: Spring AOP uses either JDK dynamic proxies or CGLIB to create the proxy for a given target object.
- id: m01-l02-q23
  prompt:
    en: In Java 25, which statement about a proxy class created for a list of interfaces through `java.lang.reflect.Proxy`
      is correct, according to its Javadoc?
  options:
  - id: a
    text:
      en: It is generated at compile time from the listed interfaces
  - id: b
    correct: true
    text:
      en: It is final and non-abstract
  - id: c
    text:
      en: It implements the listed interfaces plus every interface of the target object's class
  - id: d
    text:
      en: It extends `InvocationHandler`, which supplies the method dispatching
  explanation:
    en: The proxy class is final and non-abstract. The compile-time claim is wrong because a proxy class is a class
      created at runtime. The claim of extra interfaces is wrong because a proxy class implements exactly the interfaces
      specified at its creation. The claim about extending `InvocationHandler` is wrong because that is an interface
      implemented by the handler object associated with each proxy instance.
  citation: javadoc-proxy#class-proxy
- id: m01-l02-q24
  prompt:
    en: In Spring Framework 7.0, which statement about the proxies that Spring AOP creates is correct, according
      to the reference documentation?
  options:
  - id: a
    correct: true
    text:
      en: A CGLIB proxy is a runtime-generated subclass of the target type, created when the target implements no
        interface
  - id: b
    text:
      en: CGLIB is built into the JDK, while JDK dynamic proxies come from a library repackaged into `spring-core`
  - id: c
    text:
      en: A JDK dynamic proxy proxies only the first interface that the target type implements
  - id: d
    text:
      en: A forced CGLIB proxy can advise `final` methods by wrapping the call instead of overriding it
  explanation:
    en: A CGLIB proxy is a runtime-generated subclass of the target type, created when there is no interface. The
      reversed origin claim is wrong because JDK dynamic proxies are built into the JDK, whereas CGLIB is repackaged
      into `spring-core`. The first-interface claim is wrong because all of the interfaces implemented by the target
      type are proxied. The wrapping claim is wrong because `final` methods cannot be advised, since they cannot
      be overridden.
  citation: spring-fw-aop-proxying#proxying-mechanisms
  extract:
    en: a CGLIB proxy is created which is a runtime-generated subclass of the target type
- id: m01-l02-q25
  prompt:
    en: In Java 25, a method is called on a proxy instance. Which statement about that call is correct, according
      to the `Proxy` Javadoc?
  options:
  - id: a
    text:
      en: A call through a proxy interface is answered by the proxy class, and the handler only observes it
  - id: b
    text:
      en: The handler receives only the array of arguments, because it is bound to one method
  - id: c
    text:
      en: The call runs on an instance of the target's class, which the proxy class has wrapped
  - id: d
    correct: true
    text:
      en: A call to `toString` is dispatched to the invocation handler's `invoke` method like a call to an interface
        method
  explanation:
    en: A `toString` call declared in `java.lang.Object` is dispatched to `invoke` in the same manner as an interface
      method call. The claim that the handler only observes is wrong because the call is dispatched to the `invoke`
      method of the handler. The arguments-only claim is wrong because `invoke` receives the proxy instance, a `Method`
      object and the arguments. The wrapped target claim is wrong because a proxy instance is an instance of a proxy
      class.
  citation: javadoc-proxy#class-proxy
