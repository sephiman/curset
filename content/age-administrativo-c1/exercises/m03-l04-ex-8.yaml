# anchor: boe-a-2017-12902-art-102
- id: m03-l04-q229
  prompt:
    es: "Según el artículo 102.7 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cabe la revisión de precios en los contratos celebrados con precios provisionales?"
  options:
  - id: a
    text:
      es: "Sí, si así lo prevé el pliego de cláusulas administrativas particulares."
  - id: b
    correct: true
    text:
      es: "No, en esos contratos no cabe la revisión de precios."
  - id: c
    text:
      es: "Sí, una vez fijado el precio definitivo con los costes efectivos."
  - id: d
    text:
      es: "Sí, pero solo en los contratos de obras y de suministro de energía."
  explanation:
    es: "El artículo 102.7 LCSP lo dice sin excepciones: «En los contratos celebrados con precios provisionales no cabrá la revisión de precios». El pliego no puede preverla. Fijar el precio definitivo con los costes efectivos es el modo de determinar el precio en esos contratos, no una vía para revisarlo. La clase de contrato tampoco cambia la regla."
  citation: "art. 102.7 LCSP"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2017-12902-art-103
- id: m03-l04-q230
  prompt:
    es: "De acuerdo con el artículo 103.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, la revisión periódica y predeterminada de precios, en los contratos en que procede, se lleva a cabo:"
  options:
  - id: a
    text:
      es: "Previa autorización del Consejo de Ministros."
  - id: b
    text:
      es: "Previo informe de la Intervención General de la Administración del Estado."
  - id: c
    text:
      es: "Previa conformidad expresa del contratista en el momento de la licitación."
  - id: d
    correct: true
    text:
      es: "Previa justificación en el expediente."
  explanation:
    es: "El artículo 103.2 LCSP empieza así: «Previa justificación en el expediente […] la revisión periódica y predeterminada de precios sólo se podrá llevar a cabo» en los contratos que enumera. No pide autorización del Consejo de Ministros, que lo que puede aprobar son fórmulas tipo de revisión (art. 103.6 LCSP). Tampoco pide un informe de la Intervención General ni la conformidad del contratista."
  citation: "art. 103.2 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-103
- id: m03-l04-q231
  prompt:
    es: "Según el artículo 103.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, salvo en obras y ciertos suministros, la revisión periódica de precios cabe, como regla, en contratos con una recuperación de la inversión:"
  options:
  - id: a
    correct: true
    text:
      es: "Igual o superior a cinco años."
  - id: b
    text:
      es: "Igual o superior a tres años."
  - id: c
    text:
      es: "Igual o superior a diez años."
  - id: d
    text:
      es: "Igual o superior a dos años."
  explanation:
    es: "El artículo 103.2 LCSP admite la revisión en los contratos de obra, en dos clases de suministros y «en aquellos otros contratos en los que el período de recuperación de la inversión sea igual o superior a cinco años». Tres, diez y dos años no son la cifra de la Ley. Por debajo de cinco años la revisión solo cabe si las materias primas, bienes intermedios y energía superan el 20 por ciento del presupuesto base de licitación."
  citation: "art. 103.2 LCSP"
  difficulty: 1
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2017-12902-art-103
- id: m03-l04-q232
  prompt:
    es: "Según el artículo 103.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, sin atender al período de recuperación de la inversión ni a las materias primas, la revisión periódica de precios cabe en los contratos:"
  options:
  - id: a
    correct: true
    text:
      es: "De suministros de fabricación de armamento y equipamiento de las Administraciones Públicas."
  - id: b
    text:
      es: "De servicios de limpieza de los edificios de las Administraciones Públicas."
  - id: c
    text:
      es: "De suministro de mobiliario de oficina para las Administraciones Públicas."
  - id: d
    text:
      es: "De servicios de consultoría técnica para las Administraciones Públicas."
  explanation:
    es: "El artículo 103.2 LCSP admite la revisión, previa justificación en el expediente, en los contratos de obra, «en los contratos de suministros de fabricación de armamento y equipamiento de las Administraciones Públicas» y en los de suministro de energía. Los servicios de limpieza o de consultoría y el suministro de mobiliario no están en esa lista. En ellos la revisión depende de un período de recuperación de la inversión de cinco años o más, o de que las materias primas, bienes intermedios y energía superen el 20 por ciento del presupuesto base de licitación."
  citation: "art. 103.2 LCSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-103
- id: m03-l04-q233
  prompt:
    es: "Conforme al artículo 103.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en otros contratos con recuperación de la inversión inferior a cinco años, cabe revisar precios si materias primas, bienes intermedios y energía superan:"
  options:
  - id: a
    text:
      es: "El 20 por ciento del valor estimado del contrato."
  - id: b
    text:
      es: "El 50 por ciento del presupuesto base de licitación."
  - id: c
    correct: true
    text:
      es: "El 20 por ciento del presupuesto base de licitación."
  - id: d
    text:
      es: "El 10 por ciento del presupuesto base de licitación."
  explanation:
    es: "El artículo 103.2 LCSP admite en esos contratos la revisión, previa justificación en el expediente, siempre que la participación de las materias primas, bienes intermedios y energía en el presupuesto base de licitación «supere el 20 por ciento de dicho presupuesto». La opción del valor estimado cambia la base. Las del 50 y del 10 por ciento cambian la cifra."
  citation: "art. 103.2 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2017-12902-art-103
- id: m03-l04-q234
  prompt:
    es: "En un contrato de servicios con recuperación de la inversión inferior a cinco años, las materias primas, bienes intermedios y energía superan el 20 por ciento del presupuesto base de licitación. ¿Sobre qué parte del precio opera la revisión?"
  options:
  - id: a
    correct: true
    text:
      es: "Solo sobre la fracción del precio que representa esa participación."
  - id: b
    text:
      es: "Sobre la totalidad del precio del contrato, IVA excluido."
  - id: c
    text:
      es: "Sobre la totalidad del precio, excluido el beneficio industrial."
  - id: d
    text:
      es: "Solo sobre la fracción del precio que corresponde a la mano de obra."
  explanation:
    es: "El artículo 103.2 LCSP dice que en esos casos «la revisión solo podrá afectar a la fracción del precio del contrato que representa dicha participación», es decir, la de las materias primas, bienes intermedios y energía. Las dos opciones que hablan de la totalidad del precio, con o sin el beneficio industrial, van más allá de esa fracción. La mano de obra no es la parte que da derecho a esta revisión."
  citation: "art. 103.2 LCSP"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2017-12902-art-103
- id: m03-l04-q235
  prompt:
    es: "De acuerdo con el artículo 103.5 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, salvo en los contratos de suministro de energía, la revisión periódica y predeterminada de precios tiene lugar cuando el contrato:"
  options:
  - id: a
    text:
      es: "Se ha ejecutado al menos en el 20 por ciento de su importe y han transcurrido dos años desde su formalización."
  - id: b
    text:
      es: "Se ha ejecutado al menos en el 50 por ciento de su importe y ha transcurrido un año desde su adjudicación."
  - id: c
    text:
      es: "Se ha ejecutado al menos en el 10 por ciento de su importe, sin que se exija un tiempo mínimo."
  - id: d
    correct: true
    text:
      es: "Se ha ejecutado al menos en el 20 por ciento de su importe y ha transcurrido un año desde su formalización."
  explanation:
    es: "El artículo 103.5 LCSP exige que el contrato «se hubiese ejecutado, al menos, en el 20 por ciento de su importe y hubiese transcurrido un año desde su formalización». Las dos condiciones se suman. La opción de dos años cambia el tiempo. La del 50 por ciento cambia también el día de partida a la adjudicación. La del 10 por ciento sin tiempo mínimo suprime la segunda condición."
  citation: "art. 103.5 LCSP"
  difficulty: 1
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-2017-12902-art-103
- id: m03-l04-q236
  prompt:
    es: "El requisito de haber ejecutado al menos el 20 por ciento del importe para la revisión periódica y predeterminada de precios no se exige, aunque sí el año desde la formalización, en:"
  options:
  - id: a
    text:
      es: "Los contratos de suministro de energía."
  - id: b
    text:
      es: "Los contratos de obras de primer establecimiento."
  - id: c
    correct: true
    text:
      es: "Los contratos de concesión de servicios."
  - id: d
    text:
      es: "Los contratos de servicios de prestación sucesiva."
  explanation:
    es: "El artículo 103.5 LCSP dice que «la condición relativa al porcentaje de ejecución del contrato no será exigible […] en los contratos de concesión de servicios». En ellos sigue haciendo falta el año desde la formalización. El suministro de energía queda fuera de las dos condiciones, y la pregunta pide los contratos que mantienen la del año. Los contratos de obras y los de servicios de prestación sucesiva están sujetos a las dos condiciones."
  citation: "art. 103.5 LCSP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2017-12902-art-204
- id: m03-l04-q237
  prompt:
    es: "Según el artículo 204.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, los contratos de las Administraciones Públicas pueden modificarse durante su vigencia, si el pliego lo ha advertido expresamente, hasta un máximo del:"
  options:
  - id: a
    text:
      es: "Diez por ciento del precio inicial."
  - id: b
    correct: true
    text:
      es: "Veinte por ciento del precio inicial."
  - id: c
    text:
      es: "Cincuenta por ciento del precio inicial."
  - id: d
    text:
      es: "Treinta por ciento del precio inicial."
  explanation:
    es: "El artículo 204.1 LCSP permite modificar el contrato «hasta un máximo del veinte por ciento del precio inicial» cuando el pliego de cláusulas administrativas particulares lo ha advertido expresamente. El cincuenta por ciento es el límite de las modificaciones no previstas por prestaciones adicionales o por circunstancias sobrevenidas (art. 205.2 LCSP). El diez y el treinta por ciento no son el límite de la Ley."
  citation: "art. 204.1 LCSP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-205
- id: m03-l04-q238
  prompt:
    es: "Según el artículo 205.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿a qué deben limitarse las modificaciones no previstas en el pliego de cláusulas administrativas particulares?"
  options:
  - id: a
    text:
      es: "A las variaciones que no superen, aisladas o en conjunto, el diez por ciento del precio inicial del contrato."
  - id: b
    text:
      es: "A las variaciones que el contratista acepte por escrito antes de su aprobación."
  - id: c
    correct: true
    text:
      es: "A las variaciones estrictamente indispensables para responder a la causa objetiva que las haga necesarias."
  - id: d
    text:
      es: "A las variaciones que proponga la dirección facultativa en su informe técnico."
  explanation:
    es: "El artículo 205.1.b) LCSP exige que la modificación no prevista «se limite a introducir las variaciones estrictamente indispensables para responder a la causa objetiva que la haga necesaria». El límite es de contenido, no una cifra del diez por ciento. No depende de que el contratista la acepte ni de quién la proponga."
  citation: "art. 205.1 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-205
- id: m03-l04-q239
  prompt:
    es: "De acuerdo con el artículo 205.2.a) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, la modificación no prevista por prestaciones adicionales exige que la alteración de la cuantía no exceda, aislada o conjuntamente:"
  options:
  - id: a
    text:
      es: "Del 20 por ciento del precio inicial, IVA excluido."
  - id: b
    text:
      es: "Del 50 por ciento del precio inicial, IVA incluido."
  - id: c
    correct: true
    text:
      es: "Del 50 por ciento del precio inicial, IVA excluido."
  - id: d
    text:
      es: "Del 15 por ciento del precio inicial, IVA excluido."
  explanation:
    es: "El artículo 205.2.a) LCSP exige que la alteración no exceda, aislada o conjuntamente, «del 50 por ciento de su precio inicial, IVA excluido». La opción con IVA incluido cambia la base. El 20 por ciento es el límite hasta el que la modificación obliga al contratista (art. 206.1 LCSP), no el límite para acordarla. El 15 por ciento no es la cifra de esta letra."
  citation: "art. 205.2.a) LCSP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-205
- id: m03-l04-q240
  prompt:
    es: "Según el artículo 205.2.a) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué se exige, entre otros requisitos, para modificar un contrato añadiendo prestaciones adicionales no previstas en el pliego?"
  options:
  - id: a
    correct: true
    text:
      es: "Que el cambio de contratista no sea posible por razones económicas o técnicas y genere inconvenientes significativos o un aumento sustancial de costes."
  - id: b
    text:
      es: "Que el contratista lo solicite por escrito al órgano de contratación y renuncie a cualquier indemnización por la ampliación de la prestación."
  - id: c
    text:
      es: "Que las prestaciones adicionales figurasen ya en el proyecto aprobado por el órgano de contratación antes de la licitación del contrato."
  - id: d
    text:
      es: "Que la alteración de la cuantía no exceda del 20 por ciento del precio inicial, IVA incluido."
  explanation:
    es: "El artículo 205.2.a) LCSP exige que el cambio de contratista no sea posible «por razones de tipo económico o técnico» y que además genere «inconvenientes significativos o un aumento sustancial de costes para el órgano de contratación». La Ley no pide una solicitud del contratista ni su renuncia a indemnización. Si las prestaciones estuvieran ya en el proyecto no serían adicionales. El límite de cuantía de esta letra es el 50 por ciento del precio inicial, IVA excluido."
  citation: "art. 205.2.a) LCSP"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-205
- id: m03-l04-q242
  prompt:
    es: "Además de las prestaciones adicionales y de las circunstancias sobrevenidas e imprevisibles, el artículo 205.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público admite la modificación no prevista en el pliego cuando:"
  options:
  - id: a
    text:
      es: "Las modificaciones las proponga el contratista por escrito."
  - id: b
    text:
      es: "Las modificaciones alteren la naturaleza global del contrato."
  - id: c
    correct: true
    text:
      es: "Las modificaciones no sean sustanciales."
  - id: d
    text:
      es: "Las modificaciones superen el 50 por ciento del precio inicial."
  explanation:
    es: "El artículo 205.2 LCSP enumera tres supuestos de modificación no prevista: las prestaciones adicionales, las circunstancias sobrevenidas e imprevisibles y, en la letra c), «cuando las modificaciones no sean sustanciales». Que la proponga el contratista no es un supuesto. Alterar la naturaleza global del contrato y superar el 50 por ciento del precio inicial son justo lo que la letra b) prohíbe."
  citation: "art. 205.2 LCSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-206
- id: m03-l04-q243
  prompt:
    es: "Según el artículo 206.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, las modificaciones del artículo 205 obligan al contratista si no alteran la cuantía, aislada o conjuntamente, en más del 20 por ciento:"
  options:
  - id: a
    text:
      es: "Del precio inicial del contrato, IVA incluido."
  - id: b
    text:
      es: "Del valor estimado del contrato, con sus prórrogas."
  - id: c
    text:
      es: "Del presupuesto base de licitación, IVA incluido."
  - id: d
    correct: true
    text:
      es: "Del precio inicial del contrato, IVA excluido."
  explanation:
    es: "El artículo 206.1 LCSP hace obligatorias para el contratista las modificaciones del artículo 205 que no excedan «del 20 por ciento del precio inicial del contrato, IVA excluido». La base es el precio inicial sin IVA. La opción con IVA cambia ese inciso. El valor estimado y el presupuesto base de licitación son otras magnitudes que el precepto no usa."
  citation: "art. 206.1 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-206
- id: m03-l04-q244
  prompt:
    es: "Por circunstancias sobrevenidas que una Administración diligente no hubiera podido prever, se acuerda una modificación no prevista del 35 por ciento del precio inicial, IVA excluido, que cumple los demás requisitos legales. ¿Qué afirmación es correcta?"
  options:
  - id: a
    text:
      es: "Puede acordarse y es obligatoria para el contratista, porque no excede del 50 por ciento."
  - id: b
    correct: true
    text:
      es: "Puede acordarse, pero no es obligatoria para el contratista, porque excede del 20 por ciento."
  - id: c
    text:
      es: "No puede acordarse, porque excede del 20 por ciento del precio inicial del contrato."
  - id: d
    text:
      es: "No puede acordarse, porque excede del 30 por ciento del precio inicial del contrato."
  explanation:
    es: "Un 35 por ciento está dentro del límite del 50 por ciento del precio inicial, IVA excluido, que fija el artículo 205.2.b) LCSP, así que la modificación puede acordarse. Pero el artículo 206.1 LCSP solo la hace obligatoria para el contratista si no excede del 20 por ciento. La opción que la declara obligatoria confunde los dos límites. Las que impiden acordarla aplican un tope del 20 o del 30 por ciento que la letra b) no tiene."
  citation: "art. 206.1 LCSP"
  difficulty: 3
  tags:
  - "efecto"
  - "cantidad"
# anchor: boe-a-2017-12902-art-242
- id: m03-l04-q245
  prompt:
    es: "Según el artículo 242.4 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en el contrato de obras, ¿hasta qué incremento global del gasto el exceso de mediciones no tiene la consideración de modificación?"
  options:
  - id: a
    text:
      es: "Hasta el 20 por ciento del precio del contrato inicial."
  - id: b
    correct: true
    text:
      es: "Hasta el 10 por ciento del precio del contrato inicial."
  - id: c
    text:
      es: "Hasta el 3 por ciento del precio del contrato inicial."
  - id: d
    text:
      es: "Hasta el 5 por ciento del precio del contrato inicial."
  explanation:
    es: "El artículo 242.4 dice que el exceso de mediciones no es modificación «siempre que en global no representen un incremento del gasto superior al 10 por ciento del precio del contrato inicial». El 20 por ciento es el límite de las modificaciones previstas en el pliego, en el artículo 204.1. El 3 por ciento es el límite de los precios nuevos, en el punto ii del mismo apartado, que es otra figura. El 5 por ciento no es la cifra del punto i: el texto dice diez."
  citation: "art. 242.4 LCSP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-214
- id: m03-l04-q247
  prompt:
    es: "Según el artículo 214.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, la modificación subjetiva de los contratos por cesión contractual solo es posible:"
  options:
  - id: a
    text:
      es: "Cuando la autorice el órgano de contratación, aunque los pliegos no la prevean."
  - id: b
    text:
      es: "Cuando el cesionario la comunique a la Administración en el plazo de un mes."
  - id: c
    correct: true
    text:
      es: "Cuando obedezca a una opción inequívoca de los pliegos."
  - id: d
    text:
      es: "Cuando el contratista haya ejecutado ya la totalidad de la prestación."
  explanation:
    es: "El artículo 214.1 LCSP dice que la cesión contractual solo es posible «cuando obedezca a una opción inequívoca de los pliegos». Sin esa previsión no cabe, aunque el órgano de contratación quiera autorizarla. Una comunicación del cesionario no basta. El cedente debe haber ejecutado al menos un 20 por 100 del importe, no la totalidad: un contrato ya ejecutado no tiene nada que ceder."
  citation: "art. 214.1 LCSP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-214
- id: m03-l04-q248
  prompt:
    es: "Según el artículo 214.2.b) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, fuera de los casos de concurso, para ceder una concesión de obras o de servicios el concesionario debe haberla explotado durante al menos:"
  options:
  - id: a
    correct: true
    text:
      es: "Una quinta parte del plazo de duración del contrato."
  - id: b
    text:
      es: "Un tercio del plazo de duración del contrato."
  - id: c
    text:
      es: "Dos años del plazo de duración del contrato."
  - id: d
    text:
      es: "Cinco años del plazo de duración del contrato."
  explanation:
    es: "El artículo 214.2.b) LCSP exige, en las concesiones de obras o de servicios, que el cedente «haya efectuado su explotación durante al menos una quinta parte del plazo de duración del contrato». La Ley usa una fracción del plazo, no un número fijo de años. Un tercio no es la fracción del precepto."
  citation: "art. 214.2.b) LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2017-12902-art-214
- id: m03-l04-q250
  prompt:
    es: "Los pliegos de un contrato de servicios de 400.000 euros prevén la cesión. El contratista, que no está en concurso ni ha comunicado negociaciones de refinanciación al juzgado, ha ejecutado 60.000 euros y quiere ceder el contrato. ¿Puede hacerlo?"
  options:
  - id: a
    text:
      es: "Sí, porque basta con que la cesión esté prevista en los pliegos del contrato."
  - id: b
    text:
      es: "Sí, si el cesionario tiene la solvencia exigible en la fase de ejecución."
  - id: c
    text:
      es: "No, porque la cesión solo cabe en los contratos de concesión de obras o servicios."
  - id: d
    correct: true
    text:
      es: "No, porque no ha ejecutado al menos un 20 por 100 del importe del contrato."
  explanation:
    es: "El artículo 214.2.b) LCSP exige que el cedente tenga ejecutado al menos un 20 por 100 del importe del contrato. Aquí ha ejecutado 60.000 de 400.000 euros, un 15 por 100. Que los pliegos prevean la cesión es necesario (art. 214.1 LCSP), pero no suficiente. La solvencia del cesionario es otro requisito y no suple el porcentaje. La cesión cabe en cualquier contrato cuyos pliegos la prevean, sea o no una concesión."
  citation: "art. 214.2.b) LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-214
- id: m03-l04-q251
  prompt:
    es: "Según el artículo 214.2.b) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿en qué caso no se exige que el cedente haya ejecutado al menos un 20 por 100 del importe del contrato?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando la cesión se produce encontrándose el contratista en concurso."
  - id: b
    text:
      es: "Cuando el cesionario acredita una solvencia superior a la exigida al cedente."
  - id: c
    text:
      es: "Cuando la cesión se formaliza en escritura pública entre cedente y cesionario."
  - id: d
    text:
      es: "Cuando el contrato es de servicios con un valor estimado inferior a 100.000 euros."
  explanation:
    es: "El artículo 214.2.b) LCSP dice que el requisito «no será de aplicación […] si la cesión se produce encontrándose el contratista en concurso». La solvencia del cesionario y la escritura pública son otros requisitos de la cesión, no excepciones a este. El valor estimado del contrato no influye en el porcentaje."
  citation: "art. 214.2.b) LCSP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2017-12902-art-214
- id: m03-l04-q252
  prompt:
    es: "¿Cuál de las siguientes circunstancias exime al cedente del requisito de haber ejecutado al menos un 20 por 100 del importe del contrato para poder cederlo?"
  options:
  - id: a
    correct: true
    text:
      es: "Haber comunicado al juzgado competente el inicio de negociaciones para un acuerdo de refinanciación."
  - id: b
    text:
      es: "Haber obtenido la clasificación que se exigió en la licitación del contrato."
  - id: c
    text:
      es: "Haber constituido una garantía complementaria del 5 por 100 del precio del contrato."
  - id: d
    text:
      es: "Haber obtenido un informe favorable del responsable del contrato sobre la cesión."
  explanation:
    es: "El artículo 214.2.b) LCSP excluye el requisito cuando el contratista está en concurso o cuando «ha puesto en conocimiento del juzgado competente para la declaración del concurso que ha iniciado negociaciones para alcanzar un acuerdo de refinanciación». La clasificación, una garantía complementaria o el informe del responsable del contrato no aparecen en el precepto como excepciones."
  citation: "art. 214.2.b) LCSP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2017-12902-art-215
- id: m03-l04-q253
  prompt:
    es: "Según el artículo 215.4 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, los subcontratistas quedan obligados:"
  options:
  - id: a
    text:
      es: "Ante la Administración y ante el contratista principal, de forma solidaria, por la parte de la prestación que cada uno ejecute."
  - id: b
    text:
      es: "Solo ante la Administración, por la parte de la prestación que les corresponda ejecutar."
  - id: c
    correct: true
    text:
      es: "Solo ante el contratista principal, que asume la total responsabilidad de la ejecución frente a la Administración."
  - id: d
    text:
      es: "Ante el contratista principal y, de forma subsidiaria, ante la Administración contratante."
  explanation:
    es: "El artículo 215.4 LCSP dice que los subcontratistas «quedarán obligados solo ante el contratista principal que asumirá, por tanto, la total responsabilidad de la ejecución del contrato frente a la Administración». No hay vínculo de los subcontratistas con la Administración: ni solidario, ni directo, ni subsidiario."
  citation: "art. 215.4 LCSP"
  difficulty: 1
  tags:
  - "efecto"
