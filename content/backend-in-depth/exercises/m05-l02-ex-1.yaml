- id: m05-l02-q20
  prompt:
    en: The program loads the candidates of an `AutoConfiguration.imports` file with a `# first` comment line and
      two class names, one nested and written with `$`, and prints the count and two checks. What does it print?
  options:
  - id: a
    correct: true
    text:
      en: '2 candidates

        comment listed: false

        nested name kept: true'
  - id: b
    text:
      en: '3 candidates

        comment listed: true

        nested name kept: true'
  - id: c
    text:
      en: '2 candidates

        comment listed: false

        nested name kept: false'
  - id: d
    text:
      en: '1 candidates

        comment listed: false

        nested name kept: false'
  explanation:
    en: The comment line is skipped, so the file yields two candidates, and the nested class name keeps its `$`.
      Counting the comment as a candidate is wrong, because comments in the imports file start with `#`. Losing
      the `$` is wrong, because a class that is not top-level uses `$` to separate it from its containing class.
      Counting one candidate is wrong, because the file lists each configuration class on its own line.
  citation: spring-boot-features-developing-auto-configuration#features.developing-auto-configuration.locating-auto-configuration-candidates
