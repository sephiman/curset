# anchor: celex-12016m-txt-art-7
- id: m01-l11-q001
  prompt:
    es: "¿Por qué mayoría constata el Consejo Europeo la existencia de una violación grave y persistente, por parte de un Estado miembro, de los valores en que se fundamenta la Unión?"
  options:
  - id: a
    text:
      es: "Por mayoría cualificada, a propuesta de un tercio de los Estados miembros o de la Comisión."
  - id: b
    correct: true
    text:
      es: "Por unanimidad, a propuesta de un tercio de los Estados miembros o de la Comisión."
  - id: c
    text:
      es: "Por mayoría de cuatro quintos de sus miembros, a propuesta de un tercio de los Estados miembros."
  - id: d
    text:
      es: "Por consenso, a propuesta de un tercio de los Estados miembros o de la Comisión."
  explanation:
    es: "El artículo 7.2 TUE dice que el Consejo Europeo constata la violación grave y persistente «por unanimidad». La mayoría de cuatro quintos es la del Consejo para el riesgo claro de violación grave (art. 7.1 TUE). La mayoría cualificada es la que usa el Consejo para suspender derechos una vez hecha la constatación (art. 7.3 TUE). El consenso es la regla general del Consejo Europeo (art. 15.4 TUE), que el artículo 7.2 desplaza."
  citation: "art. 7.2 TUE"
  difficulty: 1
  tags:
  - "mayoría"
  - "órgano"
# anchor: celex-12016m-txt-art-7
- id: m01-l11-q002
  prompt:
    es: "De acuerdo con el artículo 7 del Tratado de la Unión Europea, la existencia de un riesgo claro de violación grave por parte de un Estado miembro de los valores de la Unión podrá constatarla:"
  options:
  - id: a
    text:
      es: "El Consejo Europeo, por unanimidad y previa aprobación del Parlamento Europeo."
  - id: b
    text:
      es: "El Consejo, por mayoría cualificada y previa consulta al Parlamento Europeo."
  - id: c
    correct: true
    text:
      es: "El Consejo, por mayoría de cuatro quintos de sus miembros y previa aprobación del Parlamento Europeo."
  - id: d
    text:
      es: "La Comisión, por mayoría de sus miembros y previa aprobación del Parlamento Europeo."
  explanation:
    es: "El artículo 7.1 TUE atribuye esta constatación al Consejo, «por mayoría de cuatro quintos de sus miembros y previa aprobación del Parlamento Europeo». El Consejo Europeo por unanimidad es el órgano y la mayoría de la violación grave y persistente (art. 7.2 TUE). La mayoría cualificada con simple consulta al Parlamento cambia la mayoría y rebaja la aprobación a consulta. La Comisión solo puede proponer la constatación."
  citation: "art. 7.1 TUE"
  difficulty: 3
  tags:
  - "órgano"
  - "mayoría"
  - "procedimiento"
# anchor: celex-12016m-txt-art-13
- id: m01-l11-q003
  prompt:
    es: "¿Cuál de los siguientes órganos figura entre las instituciones de la Unión que enumera el Tratado de la Unión Europea?"
  options:
  - id: a
    text:
      es: "El Comité Económico y Social."
  - id: b
    text:
      es: "El Comité de las Regiones."
  - id: c
    text:
      es: "El Banco Europeo de Inversiones."
  - id: d
    correct: true
    text:
      es: "El Tribunal de Cuentas."
  explanation:
    es: "El artículo 13.1 TUE enumera siete instituciones y la última es «El Tribunal de Cuentas». El Comité Económico y Social y el Comité de las Regiones son órganos consultivos que asisten al Parlamento, al Consejo y a la Comisión (art. 13.4 TUE), no instituciones. El Banco Europeo de Inversiones tampoco está en la lista; el banco que sí es institución es el Banco Central Europeo."
  citation: "art. 13.1 TUE"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: celex-12016m-txt-art-15
- id: m01-l11-q004
  prompt:
    es: "De acuerdo con el artículo 15 del Tratado de la Unión Europea, el Consejo Europeo:"
  options:
  - id: a
    correct: true
    text:
      es: "Dará a la Unión los impulsos necesarios para su desarrollo y no ejercerá función legislativa alguna."
  - id: b
    text:
      es: "Ejercerá conjuntamente con el Parlamento Europeo la función legislativa y la función presupuestaria."
  - id: c
    text:
      es: "Ejercerá la función legislativa en los ámbitos de competencia exclusiva de la Unión."
  - id: d
    text:
      es: "Adoptará los actos legislativos de la Unión a propuesta de la Comisión."
  explanation:
    es: "El artículo 15.1 TUE dice que el Consejo Europeo «dará a la Unión los impulsos necesarios para su desarrollo» y que «no ejercerá función legislativa alguna». Ejercer con el Parlamento las funciones legislativa y presupuestaria es lo que el artículo 16.1 TUE atribuye al Consejo. Las otras dos opciones le dan una función legislativa que el artículo le niega."
  citation: "art. 15.1 TUE"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: celex-12016m-txt-art-15
- id: m01-l11-q005
  prompt:
    es: "Como regla general, y excepto cuando los Tratados dispongan otra cosa, ¿cómo se pronuncia el Consejo Europeo sobre los asuntos que se le someten?"
  options:
  - id: a
    text:
      es: "Se pronuncia por mayoría cualificada de sus miembros."
  - id: b
    correct: true
    text:
      es: "Se pronuncia por consenso de sus miembros."
  - id: c
    text:
      es: "Se pronuncia por mayoría simple de sus miembros."
  - id: d
    text:
      es: "Se pronuncia por unanimidad de sus miembros."
  explanation:
    es: "El artículo 15.4 TUE dice que el Consejo Europeo «se pronunciará por consenso, excepto cuando los Tratados dispongan otra cosa». La mayoría cualificada es la regla general del Consejo (art. 16.3 TUE). La mayoría simple la usa el Consejo Europeo solo en cuestiones de procedimiento y para su reglamento interno (art. 235.3 TFUE). La unanimidad aparece en casos concretos, como el artículo 7.2 TUE."
  citation: "art. 15.4 TUE"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: celex-12016m-txt-art-15
- id: m01-l11-q006
  prompt:
    es: "¿Cuál de las siguientes describe la composición del Consejo Europeo según el Tratado de la Unión Europea?"
  options:
  - id: a
    text:
      es: "Los Jefes de Estado o de Gobierno, su Presidente y el Alto Representante como miembro con derecho de voto."
  - id: b
    text:
      es: "Un representante de cada Estado miembro, de rango ministerial, y su Presidente."
  - id: c
    correct: true
    text:
      es: "Los Jefes de Estado o de Gobierno de los Estados miembros, su Presidente y el Presidente de la Comisión."
  - id: d
    text:
      es: "Los Jefes de Estado o de Gobierno de los Estados miembros, su Presidente y el Presidente del Parlamento Europeo."
  explanation:
    es: "El artículo 15.2 TUE dice que el Consejo Europeo «estará compuesto por los Jefes de Estado o de Gobierno de los Estados miembros, así como por su Presidente y por el Presidente de la Comisión». El Alto Representante solo «participará en sus trabajos». Un representante ministerial por Estado es la composición del Consejo (art. 16.2 TUE). El Presidente del Parlamento Europeo no es miembro: el Consejo Europeo puede invitarlo a comparecer (art. 235.2 TFUE)."
  citation: "art. 15.2 TUE"
  difficulty: 1
  tags:
  - "composición"
# anchor: celex-12016e-txt-art-235
- id: m01-l11-q007
  prompt:
    es: "De acuerdo con el artículo 235 del Tratado de Funcionamiento de la Unión Europea, cuando el Consejo Europeo se pronuncie por votación:"
  options:
  - id: a
    text:
      es: "Su Presidente participará en las votaciones, pero el Presidente de la Comisión no."
  - id: b
    text:
      es: "Su Presidente y el Presidente de la Comisión votarán solo en caso de empate."
  - id: c
    text:
      es: "El Presidente de la Comisión participará en las votaciones, pero su Presidente no."
  - id: d
    correct: true
    text:
      es: "Su Presidente y el Presidente de la Comisión no participarán en las votaciones."
  explanation:
    es: "El artículo 235.1 TFUE dice que «el Presidente del Consejo Europeo y el Presidente de la Comisión no participarán en las votaciones del Consejo Europeo cuando éste se pronuncie por votación». Ninguno de los dos vota, ni siempre ni para deshacer un empate, y el artículo no distingue entre ellos."
  citation: "art. 235.1 TFUE"
  difficulty: 2
  tags:
  - "mayoría"
  - "composición"
# anchor: celex-12016m-txt-art-15
- id: m01-l11-q008
  prompt:
    es: "De acuerdo con el artículo 15 del Tratado de la Unión Europea, el Presidente del Consejo Europeo es elegido:"
  options:
  - id: a
    correct: true
    text:
      es: "Por el Consejo Europeo, por mayoría cualificada, para un mandato de dos años y medio renovable una sola vez."
  - id: b
    text:
      es: "Por el Consejo Europeo, por unanimidad, para un mandato de dos años y medio renovable una sola vez."
  - id: c
    text:
      es: "Por el Consejo Europeo, por mayoría cualificada, para un mandato de cuatro años renovable una sola vez."
  - id: d
    text:
      es: "Por el Parlamento Europeo, por mayoría de sus miembros, para un mandato de cinco años."
  explanation:
    es: "El artículo 15.5 TUE dice que «el Consejo Europeo elegirá a su Presidente por mayoría cualificada para un mandato de dos años y medio, que podrá renovarse una sola vez». La unanimidad cambia la mayoría. Cuatro años es otro mandato. El Parlamento Europeo elige a su propio Presidente (art. 14.4 TUE), no al del Consejo Europeo."
  citation: "art. 15.5 TUE"
  difficulty: 1
  tags:
  - "mayoría"
  - "plazo"
# anchor: celex-12016m-txt-art-15
- id: m01-l11-q009
  prompt:
    es: "¿Puede el Consejo Europeo poner fin al mandato de su Presidente antes de que concluya el período para el que fue elegido?"
  options:
  - id: a
    text:
      es: "Sí, en caso de impedimento o falta grave, pero solo por unanimidad."
  - id: b
    correct: true
    text:
      es: "Sí, en caso de impedimento o falta grave, por mayoría cualificada."
  - id: c
    text:
      es: "No; el mandato solo termina por expiración del plazo o por renuncia."
  - id: d
    text:
      es: "Sí, pero solo a propuesta del Parlamento Europeo por mayoría de dos tercios."
  explanation:
    es: "El artículo 15.5 TUE dice que, «en caso de impedimento o falta grave, el Consejo Europeo podrá poner fin a su mandato por el mismo procedimiento», es decir, por mayoría cualificada, la misma de la elección. No exige unanimidad ni propuesta del Parlamento, y sí permite el cese anticipado."
  citation: "art. 15.5 TUE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "mayoría"
# anchor: celex-12016m-txt-art-18
- id: m01-l11-q010
  prompt:
    es: "De acuerdo con el artículo 18 del Tratado de la Unión Europea, el Alto Representante de la Unión para Asuntos Exteriores y Política de Seguridad será nombrado:"
  options:
  - id: a
    text:
      es: "Por el Consejo Europeo, por unanimidad, con la aprobación del Presidente del Parlamento Europeo."
  - id: b
    text:
      es: "Por el Consejo, por mayoría cualificada, a propuesta del Presidente de la Comisión."
  - id: c
    correct: true
    text:
      es: "Por el Consejo Europeo, por mayoría cualificada, con la aprobación del Presidente de la Comisión."
  - id: d
    text:
      es: "Por el Presidente de la Comisión Europea, con la aprobación del Consejo Europeo por mayoría cualificada."
  explanation:
    es: "El artículo 18.1 TUE dice que «el Consejo Europeo nombrará por mayoría cualificada, con la aprobación del Presidente de la Comisión, al Alto Representante». La unanimidad y la aprobación del Presidente del Parlamento no están en el artículo. El Consejo no lo nombra. El Presidente de la Comisión aprueba el nombramiento, pero no lo hace."
  citation: "art. 18.1 TUE"
  difficulty: 2
  tags:
  - "órgano"
  - "mayoría"
  - "procedimiento"
# anchor: celex-12016m-txt-art-18
- id: m01-l11-q011
  prompt:
    es: "¿Quién preside, según lo dispuesto en el Tratado de la Unión Europea, la formación del Consejo de Asuntos Exteriores?"
  options:
  - id: a
    text:
      es: "El Presidente del Consejo Europeo."
  - id: b
    text:
      es: "El ministro de Asuntos Exteriores del Estado miembro que ejerce la Presidencia rotatoria."
  - id: c
    text:
      es: "El Presidente de la Comisión Europea."
  - id: d
    correct: true
    text:
      es: "El Alto Representante de la Unión para Asuntos Exteriores y Política de Seguridad."
  explanation:
    es: "El artículo 18.3 TUE dice que «el Alto Representante presidirá el Consejo de Asuntos Exteriores». Es la formación que queda fuera de la rotación entre Estados (art. 16.9 TUE), así que no la preside el ministro del Estado que ejerce la Presidencia. El Presidente del Consejo Europeo y el de la Comisión no presiden formaciones del Consejo."
  citation: "art. 18.3 TUE"
  difficulty: 2
  tags:
  - "órgano"
# anchor: celex-12016m-txt-art-16
- id: m01-l11-q012
  prompt:
    es: "Según el artículo 16 del Tratado de la Unión Europea, ¿con qué institución ejerce el Consejo conjuntamente la función legislativa y la función presupuestaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Con el Parlamento Europeo."
  - id: b
    text:
      es: "Con la Comisión Europea."
  - id: c
    text:
      es: "Con el Consejo Europeo."
  - id: d
    text:
      es: "Con el Tribunal de Cuentas."
  explanation:
    es: "El artículo 16.1 TUE dice que «el Consejo ejercerá conjuntamente con el Parlamento Europeo la función legislativa y la función presupuestaria». La Comisión propone los actos legislativos (art. 17.2 TUE) y ejecuta el presupuesto, pero no comparte esas funciones. El Consejo Europeo no ejerce función legislativa alguna (art. 15.1 TUE). El Tribunal de Cuentas no tiene funciones legislativas."
  citation: "art. 16.1 TUE"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: celex-12016m-txt-art-16
- id: m01-l11-q013
  prompt:
    es: "Señale la respuesta correcta sobre la composición del Consejo de la Unión Europea, conforme a lo establecido en el Tratado de la Unión Europea:"
  options:
  - id: a
    text:
      es: "Lo componen los Jefes de Estado o de Gobierno de los Estados miembros, su Presidente y el Presidente de la Comisión."
  - id: b
    correct: true
    text:
      es: "Lo compone un representante de cada Estado miembro, de rango ministerial, facultado para comprometer al Gobierno de su Estado y para ejercer el derecho de voto."
  - id: c
    text:
      es: "Lo compone un representante de cada Estado miembro, de rango ministerial o de embajador, sin derecho de voto."
  - id: d
    text:
      es: "Lo componen los representantes permanentes de los Gobiernos de los Estados miembros, con rango de embajador."
  explanation:
    es: "El artículo 16.2 TUE dice que el Consejo «estará compuesto por un representante de cada Estado miembro, de rango ministerial, facultado para comprometer al Gobierno del Estado miembro al que represente y para ejercer el derecho de voto». Los Jefes de Estado o de Gobierno forman el Consejo Europeo (art. 15.2 TUE). El representante vota, y los representantes permanentes forman el comité que prepara los trabajos del Consejo (art. 16.7 TUE), no el Consejo."
  citation: "art. 16.2 TUE"
  difficulty: 1
  tags:
  - "composición"
# anchor: celex-32009d0937-art-1
- id: m01-l11-q014
  prompt:
    es: "¿Durante cuánto tiempo ejerce la Presidencia del Consejo cada grupo predeterminado de tres Estados miembros previsto en el Reglamento interno del Consejo?"
  options:
  - id: a
    text:
      es: "Durante un período de seis meses."
  - id: b
    text:
      es: "Durante un período de doce meses."
  - id: c
    correct: true
    text:
      es: "Durante un período de dieciocho meses."
  - id: d
    text:
      es: "Durante un período de veinticuatro meses."
  explanation:
    es: "El artículo 1.4 del Reglamento interno del Consejo dice que la Presidencia «será desempeñada por grupos predeterminados de tres Estados miembros durante un período de dieciocho meses». Seis meses es el turno de cada miembro del grupo dentro de esos dieciocho. Doce y veinticuatro meses no aparecen en el artículo."
  citation: "art. 1.4 Reglamento interno del Consejo"
  difficulty: 2
  tags:
  - "plazo"
  - "composición"
# anchor: celex-32009d0937-art-1
- id: m01-l11-q015
  prompt:
    es: "De acuerdo con el artículo 1 del Reglamento interno del Consejo, aprobado por la Decisión 2009/937/UE del Consejo, de 1 de diciembre de 2009:"
  options:
  - id: a
    text:
      es: "El Consejo tendrá su sede en Luxemburgo y durante abril, junio y octubre celebrará sus sesiones en Bruselas."
  - id: b
    text:
      es: "El Consejo tendrá su sede en Bruselas y durante abril, junio y octubre celebrará sus sesiones en Estrasburgo."
  - id: c
    text:
      es: "El Consejo tendrá su sede en Estrasburgo y durante abril, junio y octubre celebrará sus sesiones en Bruselas."
  - id: d
    correct: true
    text:
      es: "El Consejo tendrá su sede en Bruselas y durante abril, junio y octubre celebrará sus sesiones en Luxemburgo."
  explanation:
    es: "El artículo 1.3 del Reglamento interno dice: «El Consejo tendrá su sede en Bruselas. Durante los meses de abril, junio y octubre, el Consejo celebrará sus sesiones en Luxemburgo». Las otras opciones invierten las ciudades o ponen Estrasburgo, que es la sede del Parlamento Europeo."
  citation: "art. 1.3 Reglamento interno del Consejo"
  difficulty: 1
  tags:
  - "fecha"
  - "estructura"
# anchor: celex-12016m-txt-art-16
- id: m01-l11-q016
  prompt:
    es: "Como regla general, y excepto cuando los Tratados dispongan otra cosa, ¿por qué mayoría se pronuncia el Consejo de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "Por mayoría cualificada."
  - id: b
    text:
      es: "Por unanimidad de sus miembros."
  - id: c
    text:
      es: "Por mayoría simple de sus miembros."
  - id: d
    text:
      es: "Por consenso de sus miembros."
  explanation:
    es: "El artículo 16.3 TUE dice que «el Consejo se pronunciará por mayoría cualificada, excepto cuando los Tratados dispongan otra cosa». La unanimidad y la mayoría simple solo se aplican cuando un artículo concreto las exige. El consenso es la regla general del Consejo Europeo (art. 15.4 TUE)."
  citation: "art. 16.3 TUE"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: celex-12016e-txt-art-238
- id: m01-l11-q018
  prompt:
    es: "De acuerdo con el artículo 238 del Tratado de Funcionamiento de la Unión Europea, cuando el Consejo no actúe a propuesta de la Comisión o del Alto Representante, la mayoría cualificada se definirá como un mínimo:"
  options:
  - id: a
    text:
      es: "Del 55 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 65 % de la población de la Unión."
  - id: b
    text:
      es: "Del 72 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 55 % de la población de la Unión."
  - id: c
    correct: true
    text:
      es: "Del 72 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 65 % de la población de la Unión."
  - id: d
    text:
      es: "Del 65 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 72 % de la población de la Unión."
  explanation:
    es: "El artículo 238.2 TFUE, «no obstante lo dispuesto en el apartado 4 del artículo 16» TUE, fija para este caso «un mínimo del 72 % de los miembros del Consejo que represente a Estados miembros que reúnan como mínimo el 65 % de la población de la Unión». El 55 % de miembros es la regla general del artículo 16.4 TUE, que aquí no se aplica. Las otras dos opciones alteran o intercambian los porcentajes."
  citation: "art. 238.2 TFUE"
  difficulty: 3
  tags:
  - "mayoría"
  - "excepción"
  - "cantidad"
# anchor: celex-12016e-txt-art-238
- id: m01-l11-q019
  prompt:
    es: "Cuando deba adoptar un acuerdo por mayoría simple, el Consejo de la Unión Europea se pronunciará por:"
  options:
  - id: a
    text:
      es: "Mayoría de los votos emitidos en la sesión."
  - id: b
    text:
      es: "Mayoría de los miembros presentes en la sesión."
  - id: c
    text:
      es: "Mayoría de los miembros presentes o representados."
  - id: d
    correct: true
    text:
      es: "Mayoría de los miembros que lo componen."
  explanation:
    es: "El artículo 238.1 TFUE dice que, cuando deba adoptar un acuerdo por mayoría simple, el Consejo «se pronunciará por mayoría de los miembros que lo componen». La mayoría de los votos emitidos es la regla del Parlamento Europeo (art. 231 TFUE). Los miembros presentes, o presentes y representados, no son la base que fija el artículo."
  citation: "art. 238.1 TFUE"
  difficulty: 2
  tags:
  - "mayoría"
