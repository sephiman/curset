# anchor: fuente-ms-word-macros-html
- id: m02-l08-q086
  prompt:
    es: "Según la página de Microsoft, si en Word 365 se da a una macro nueva el mismo nombre que a una macro integrada, ¿qué ocurre?"
  options:
  - id: a
    text:
      es: "Word rechaza el nombre y pide elegir otro distinto"
  - id: b
    correct: true
    text:
      es: "Sus acciones reemplazan a las de la macro integrada"
  - id: c
    text:
      es: "Se ejecutan las dos macros, la integrada primero"
  - id: d
    text:
      es: "La macro nueva solo se ejecuta si se guarda en Normal.dotm"
  explanation:
    es: "La página dice: «Si asigna a una nueva macro el mismo nombre que una macro integrada de Word, las nuevas acciones de macro reemplazarán a la macro integrada». Que Word rechace el nombre y pida otro contradice que acepte el nombre y la reemplace. Que se ejecuten las dos, la integrada primero, contradice que la integrada quede reemplazada. Y que la nueva solo se ejecute si se guarda en Normal.dotm mezcla dos cosas: Normal.dotm es, según la página, donde se guarda una macro para que esté en los documentos futuros, no una condición para reemplazar a la integrada."
  citation: "fuente: `ms-word-macros.html`; «Escribir una macro desde cero en Visual Basic»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-control-cambios-html
- id: m02-l08-q175
  prompt:
    es: "¿Cómo marca Microsoft Word 365 las eliminaciones y las adiciones cuando está activado el Control de cambios, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Las eliminaciones con subrayado y las adiciones con tachado"
  - id: b
    text:
      es: "Las eliminaciones y las adiciones con resaltado amarillo"
  - id: c
    correct: true
    text:
      es: "Las eliminaciones con tachado y las adiciones con subrayado"
  - id: d
    text:
      es: "Las eliminaciones con negrita y las adiciones con cursiva"
  explanation:
    es: "La página indica que las eliminaciones se marcan con tachado y las adiciones con subrayado. «Las eliminaciones con subrayado y las adiciones con tachado» invierte lo que dice la página, que tacha las eliminaciones. «Las eliminaciones y las adiciones con resaltado amarillo» contradice la página, que distingue tachado y subrayado. «Las eliminaciones con negrita y las adiciones con cursiva» contradice la página, que usa tachado y subrayado."
  citation: "fuente: `ms-word-control-cambios.html`; «Realizar un seguimiento de los cambios en Word»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-control-cambios-html
- id: m02-l08-q176
  prompt:
    es: "En Word 365, ¿cuál de las siguientes rutas de la cinta activa o desactiva el Control de cambios, según la página de Microsoft sobre el seguimiento de cambios?"
  options:
  - id: a
    text:
      es: "Inicio › Edición › Control de cambios"
  - id: b
    text:
      es: "Revisar › Comentarios › Control de cambios"
  - id: c
    text:
      es: "Referencias › Seguimiento › Control de cambios"
  - id: d
    correct: true
    text:
      es: "Revisar › Seguimiento › Control de cambios"
  explanation:
    es: "La página indica Revisar y, en Seguimiento, Control de cambios. «Inicio › Edición › Control de cambios» es la pestaña Inicio, que no contiene el comando según la página. «Revisar › Comentarios › Control de cambios» el grupo Comentarios gestiona los comentarios, no el seguimiento de cambios. «Referencias › Seguimiento › Control de cambios» es la pestaña Referencias, que sirve para tablas de contenido y notas."
  citation: "fuente: `ms-word-control-cambios.html`; «En la pestaña Revisar , seleccione Seguimiento de>cambios.»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-control-cambios-html
- id: m02-l08-q177
  prompt:
    es: "Señale en Word 365 qué ocurre con las marcas ya hechas cuando se desactiva el Control de cambios en un documento, según la página de Microsoft:"
  options:
  - id: a
    text:
      es: "Todas las marcas de revisión desaparecen del documento al instante y el seguimiento queda desactivado para siempre"
  - id: b
    text:
      es: "Las marcas se aceptan automáticamente y el documento queda limpio, sin que haga falta revisarlas una a una"
  - id: c
    correct: true
    text:
      es: "Word deja de marcar cambios, pero las marcas coloreadas ya hechas siguen en el documento"
  - id: d
    text:
      es: "Las marcas se convierten en comentarios del margen derecho"
  explanation:
    es: "La página dice que Word deja de marcar cambios pero tachados y subrayados siguen apareciendo. «Todas las marcas de revisión desaparecen del documento al instante y el seguimiento queda desactivado para siempre» contradice la página, que mantiene los subrayados y tachados coloreados. «Las marcas se aceptan automáticamente y el documento queda limpio, sin que haga falta revisarlas una a una» contradice la página: aceptar o rechazar se hace con comandos propios. «Las marcas se convierten en comentarios del margen derecho» contradice la página, que no convierte marcas en comentarios."
  citation: "fuente: `ms-word-control-cambios.html`; «Word deja de marcar cambios, pero los subrayados y tachados coloreados siguen apareciendo en el documento.»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-control-cambios-html
- id: m02-l08-q178
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones del grupo Marcado muestra el documento original sin marcas de revisión ni comentarios, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Sin marcado"
  - id: b
    correct: true
    text:
      es: "El original"
  - id: c
    text:
      es: "Revisión simple"
  - id: d
    text:
      es: "Todas las marcas"
  explanation:
    es: "La página define El original como el documento original sin marcas de revisión ni comentarios. «Sin marcado» oculta el marcado para mostrar el documento con los cambios incorporados. «Revisión simple» muestra las marcas con una línea roja en el margen. «Todas las marcas» muestra las marcas con colores de texto y líneas para cada revisor."
  citation: "fuente: `ms-word-control-cambios.html`; «El original muestra el documento original sin marcas de revisión de cambios ni comentarios.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-control-cambios-html
- id: m02-l08-q179
  prompt:
    es: "¿Qué muestra en Word 365 la opción Revisión simple del grupo Marcado, según la página de Microsoft sobre el seguimiento de cambios?"
  options:
  - id: a
    text:
      es: "Las marcas de revisión con diferentes colores para cada revisor"
  - id: b
    text:
      es: "El documento con los cambios incorporados y sin marcado"
  - id: c
    text:
      es: "El documento original sin cambios ni comentarios"
  - id: d
    correct: true
    text:
      es: "Las marcas de revisión con una línea roja en el margen"
  explanation:
    es: "La página describe Revisión simple como línea roja en el margen. «Las marcas de revisión con diferentes colores para cada revisor» es la descripción de Todas las marcas. «El documento con los cambios incorporados y sin marcado» es la descripción de Sin marcado. «El documento original sin cambios ni comentarios» es la descripción de El original."
  citation: "fuente: `ms-word-control-cambios.html`; «Revisión simple muestra las marcas de revisión con una línea roja en el margen.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-control-cambios-html
- id: m02-l08-q180
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de Seguimiento permite pedir una contraseña para que otros usuarios no puedan desactivar el Control de cambios?"
  options:
  - id: a
    text:
      es: "Solo míos"
  - id: b
    correct: true
    text:
      es: "Bloquear seguimiento"
  - id: c
    text:
      es: "Para todos"
  - id: d
    text:
      es: "Panel de revisión vertical"
  explanation:
    es: "La página indica Seguimiento › Control de cambios › Bloquear seguimiento para usar una contraseña. «Solo míos» limita el seguimiento a los cambios propios, sin contraseña. «Para todos» hace seguimiento de los cambios de todos, sin contraseña. «Panel de revisión vertical» lista los cambios del documento, no los protege con contraseña."
  citation: "fuente: `ms-word-control-cambios.html`; «Realizar un seguimiento de los cambios en Word»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-control-cambios-html
- id: m02-l08-q181
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de Seguimiento de cambios registra solo las modificaciones que hace el propio usuario, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Para todos"
  - id: b
    text:
      es: "Bloquear seguimiento"
  - id: c
    correct: true
    text:
      es: "Solo míos"
  - id: d
    text:
      es: "Aceptar y pasar al siguiente"
  explanation:
    es: "La página indica que Solo míos sigue únicamente los cambios del propio usuario. «Para todos» sigue los cambios de todos los usuarios del documento. «Bloquear seguimiento» exige contraseña para desactivar el seguimiento, no limita a los cambios propios. «Aceptar y pasar al siguiente» acepta el cambio actual y avanza al siguiente, no limita el seguimiento a los cambios propios."
  citation: "fuente: `ms-word-control-cambios.html`; «Para realizar un seguimiento solo de los cambios que realice en el documento, seleccione Solo míos.»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-control-cambios-html
- id: m02-l08-q183
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones del menú Aceptar acepta todos los cambios y deja de realizar el seguimiento, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Aceptar y pasar al siguiente"
  - id: b
    text:
      es: "Aceptar todos los cambios mostrados en la vista actual"
  - id: c
    text:
      es: "Rechazar todos los cambios y detener el seguimiento del documento"
  - id: d
    correct: true
    text:
      es: "Aceptar todos los cambios y dejar de realizar un seguimiento"
  explanation:
    es: "La página incluye esa opción en Revisar › Seguimiento › Aceptar. «Aceptar y pasar al siguiente» acepta solo el cambio actual y pasa al siguiente. «Aceptar todos los cambios mostrados en la vista actual» acepta solo los cambios visibles según el filtro, sin detener el seguimiento. «Rechazar todos los cambios y detener el seguimiento del documento» rechaza los cambios en lugar de aceptarlos."
  citation: "fuente: `ms-word-control-cambios.html`; «Acepte todos los cambios y deje de realizar el seguimiento.»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-control-cambios-html
- id: m02-l08-q185
  prompt:
    es: "En Word 365, ¿cuál de las siguientes afirmaciones sobre ocultar los cambios del Control de cambios en pantalla es correcta, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Ocultar los cambios los acepta y los quita del documento."
  - id: b
    correct: true
    text:
      es: "Ocultar los cambios no los quita del documento; hay que aceptarlos o rechazarlos."
  - id: c
    text:
      es: "Ocultar los cambios los elimina del documento cuando se vuelve a abrir el archivo en otro equipo."
  - id: d
    text:
      es: "Ocultar los cambios los convierte en comentarios del documento."
  explanation:
    es: "La página dice que ocultar no quita las marcas y que hay que usar Aceptar y Rechazar. «Ocultar los cambios los acepta y los quita del documento.» contradice la página, que exige Aceptar o Rechazar. «Ocultar los cambios los elimina del documento cuando se vuelve a abrir el archivo en otro equipo.» contradice la página, que muestra la revisión al reabrir el documento. «Ocultar los cambios los convierte en comentarios del documento.» contradice la página, que separa comentarios y control de cambios."
  citation: "fuente: `ms-word-control-cambios.html`; «Realizar un seguimiento de los cambios en Word»"
  difficulty: 3
  tags:
  - "comportamiento"
