# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q027
  prompt:
    es: "¿Qué dice la historia de Internet de la Internet Society sobre el rumor de que ARPANET se concibió como una red resistente a una guerra nuclear?"
  options:
  - id: a
    text:
      es: "Es cierto: DARPA la encargó a BBN con ese objetivo militar, al ganar el concurso de los IMP"
  - id: b
    text:
      es: "Es cierto: Roberts la planificó para resistir ataques nucleares en su plan de 1967"
  - id: c
    correct: true
    text:
      es: "Es un falso rumor: solo el estudio de RAND sobre voz segura consideró la guerra nuclear"
  - id: d
    text:
      es: "Es cierto: el estudio de RAND financió su diseño con ese objetivo"
  explanation:
    es: "La página califica ese rumor de falso: solo el estudio de RAND sobre voz segura, ajeno a ARPANET, consideró la guerra nuclear. Decir que Roberts la planificó para resistir ataques nucleares contradice que nunca fue cierto de ARPANET. Encargarla a BBN con ese objetivo contradice que ARPANET nunca tuvo relación con la guerra nuclear. El estudio de RAND era ajeno a ARPANET: trataba de voz segura en el ejército, y la página lo declara no relacionado."
  citation: "fuente: `isoc-historia-internet.html`; «Footnotes»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q028
  prompt:
    es: "¿Cuál de los siguientes resultados mostró el experimento de 1965 de Roberts y Merrill, que unió el TX-2 de Massachusetts con el Q-32 de California por línea telefónica?"
  options:
  - id: a
    text:
      es: "Que los ordenadores de tiempo compartido no podían ejecutar programas en una máquina remota"
  - id: b
    text:
      es: "Que la telefonía de circuitos bastaba para unir los ordenadores sin usar paquetes"
  - id: c
    correct: true
    text:
      es: "Que los ordenadores cooperaban bien, pero la telefonía de circuitos era inadecuada"
  - id: d
    text:
      es: "Que la conmutación de paquetes era menos eficaz que la de circuitos"
  explanation:
    es: "El experimento mostró que los ordenadores de tiempo compartido cooperaban bien, pero que la telefonía de circuitos era totalmente inadecuada. Que la telefonía de circuitos bastaba contradice la conclusión del experimento, que la juzgó totalmente inadecuada. Los ordenadores sí podían ejecutar programas y recuperar datos en la máquina remota, según el resultado. El experimento confirmó la convicción de Kleinrock sobre la necesidad de la conmutación de paquetes."
  citation: "fuente: `isoc-historia-internet.html`; «The result of this experiment was the realization that the time-shared computers could work well together, running programs and retrieving data as necessary on the remote machine, but that the circuit switched telephone system was totally inadequate for the job.»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q029
  prompt:
    es: "¿Cuál de las siguientes razones económicas motivó, según la historia de Internet, conectar las redes de radio de paquetes con los sistemas de tiempo compartido de ARPANET?"
  options:
  - id: a
    text:
      es: "Permitía que cada red cambiara su diseño interno al conectarse"
  - id: b
    correct: true
    text:
      es: "Resultaba mucho más económico que duplicar esos costosos ordenadores"
  - id: c
    text:
      es: "Resultaba más barato duplicar esos ordenadores que conectarlos"
  - id: d
    text:
      es: "Evitaba compartir recursos entre los usuarios de las redes"
  explanation:
    es: "La motivación inicial era compartir recursos: conectar las redes era mucho más económico que duplicar ordenadores muy caros. Duplicar los ordenadores era la opción más cara, según la página. Una de las reglas de Kahn era justo lo contrario: ninguna red debía necesitar cambios internos para conectarse. La compartición de recursos era la motivación inicial, no algo que se quisiera evitar."
  citation: "fuente: `isoc-historia-internet.html`; «Connecting the two together was far more economical that duplicating these very expensive computers.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q030
  prompt:
    es: "¿Cuál de las siguientes reglas fijó Kahn sobre los cambios internos que debía hacer cada red distinta para conectarse a Internet?"
  options:
  - id: a
    correct: true
    text:
      es: "Debía valerse por sí misma, sin exigir cambios internos"
  - id: b
    text:
      es: "Debía adaptar su diseño interno a la arquitectura de ARPANET"
  - id: c
    text:
      es: "Debía adoptar el protocolo NCP en su interior antes de conectarse"
  - id: d
    text:
      es: "Debía ceder su control a un centro único de operaciones"
  explanation:
    es: "Una de las reglas de Kahn decía que cada red debía valerse por sí misma, sin exigir cambios internos para conectarse a Internet. Exigir NCP en su interior contradice que no podía requerirse ningún cambio interno. Adaptar el diseño a ARPANET es un cambio interno, que la regla excluye. Otra de las reglas excluía el control global a nivel de operaciones."
  citation: "fuente: `isoc-historia-internet.html`; «Each distinct network would have to stand on its own and no internal changes could be required to any such network to connect it to the Internet.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q031
  prompt:
    es: "¿Qué ocurría, según las reglas de Kahn, con un paquete que no llegaba a su destino final?"
  options:
  - id: a
    text:
      es: "Lo retransmitía la pasarela que lo había perdido"
  - id: b
    text:
      es: "Se reenviaba por la ruta que la pasarela había guardado"
  - id: c
    correct: true
    text:
      es: "Se retransmitía poco después desde el origen"
  - id: d
    text:
      es: "Se daba por perdido y el usuario debía repetirlo"
  explanation:
    es: "La comunicación era de mejor esfuerzo: un paquete que no llegaba se retransmitía poco después desde el origen. Las pasarelas no retenían información sobre los flujos individuales de paquetes, y la retransmisión partía del origen. Guardar la ruta contradice que las pasarelas no retenían ninguna información sobre los flujos. Se retransmitía desde el origen, sin dar el paquete por perdido."
  citation: "fuente: `isoc-historia-internet.html`; «If a packet didn't make it to the final destination, it would shortly be retransmitted from the source.»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q032
  prompt:
    es: "¿Cuál de los siguientes grupos de entidades recibió de DARPA los contratos para implementar TCP/IP, según la historia de Internet de la Internet Society?"
  options:
  - id: a
    correct: true
    text:
      es: "Stanford, BBN y UCL"
  - id: b
    text:
      es: "MIT, Xerox PARC y UC Berkeley, que adaptaron TCP a sus equipos"
  - id: c
    text:
      es: "UCLA, SRI y la Universidad de Utah, los primeros nodos de ARPANET"
  - id: d
    text:
      es: "NPL, RAND y MIT, que investigaron la conmutación de paquetes"
  explanation:
    es: "DARPA contrató a Stanford (Cerf), BBN (Ray Tomlinson) y UCL (Peter Kirstein) para implementar TCP/IP. UCLA, SRI y Utah fueron nodos de ARPANET en 1969, no los contratistas de TCP/IP. MIT, Xerox PARC y Berkeley aparecen en trabajos posteriores con TCP, no en los tres contratos. NPL, RAND y MIT hicieron en paralelo la investigación de conmutación de paquetes de los años sesenta."
  citation: "fuente: `isoc-historia-internet.html`; «Proving the Ideas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q033
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde a la clase C, una de las tres clases de red (A, B y C) definidas al aumentar el número de redes?"
  options:
  - id: a
    correct: true
    text:
      es: "Redes de área local: muchas redes con relativamente pocos hosts"
  - id: b
    text:
      es: "Redes de ámbito nacional: pocas redes con muchos hosts"
  - id: c
    text:
      es: "Redes de satélite de paquetes"
  - id: d
    text:
      es: "Redes de ámbito regional, entre las nacionales y las locales"
  explanation:
    es: "La clase C representaba redes de área local: gran número de redes con relativamente pocos hosts. Las redes de ámbito nacional, pocas y con muchos hosts, eran la clase A. Las redes de ámbito regional eran la clase B. Las redes de satélite de paquetes eran una de las tres primeras redes del experimento, no una clase."
  citation: "fuente: `isoc-historia-internet.html`; «and Class C represented local area networks (large number of networks with relatively few hosts).»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q034
  prompt:
    es: "¿Quién desarrolló en 1973 en Xerox PARC la tecnología Ethernet, que es hoy probablemente la tecnología de red dominante en Internet?"
  options:
  - id: a
    text:
      es: "Ray Tomlinson, que escribió el software básico de correo"
  - id: b
    text:
      es: "David Clark, que implementó TCP para el Xerox Alto y el IBM PC"
  - id: c
    correct: true
    text:
      es: "Bob Metcalfe"
  - id: d
    text:
      es: "Vint Cerf, que dirigió el equipo de Stanford de la especificación de TCP"
  explanation:
    es: "Bob Metcalfe desarrolló Ethernet en Xerox PARC en 1973. Clark, del MIT, creó una implementación compacta de TCP para el Xerox Alto y el IBM PC. Tomlinson escribió en 1972 el software básico de correo electrónico. Cerf dirigió el equipo de Stanford que produjo la especificación de TCP."
  citation: "fuente: `isoc-historia-internet.html`; «Proving the Ideas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q035
  prompt:
    es: "¿Cuál de las siguientes decisiones críticas adoptó NSF en 1985, con Dennis Jennings al frente del programa NSFNET, según la historia de Internet?"
  options:
  - id: a
    text:
      es: "Que cada red regional usaría el protocolo que prefiriera"
  - id: b
    text:
      es: "Que NCP seguiría siendo el protocolo del programa NSFNET"
  - id: c
    correct: true
    text:
      es: "Que TCP/IP sería obligatorio en el programa NSFNET"
  - id: d
    text:
      es: "Que ARPANET se desmantelaría ese mismo año"
  explanation:
    es: "NSF decidió que TCP/IP sería obligatorio en el programa NSFNET. NCP se había sustituido por TCP/IP en ARPANET en 1983, y NSF exigió TCP/IP. ARPANET no se desmanteló hasta 1990. La decisión fue justo la contraria: TCP/IP era obligatorio, no optativo."
  citation: "fuente: `isoc-historia-internet.html`; «He worked with the community to help NSF make a critical decision – that TCP/IP would be mandatory for the NSFNET program.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q036
  prompt:
    es: "¿Quién inventó el Sistema de Nombres de Dominio (DNS), que permitió resolver de forma escalable nombres de host jerárquicos en direcciones de Internet?"
  options:
  - id: a
    text:
      es: "Vint Cerf, de la Universidad de Stanford"
  - id: b
    text:
      es: "Elizabeth Feinler, del Network Information Center del SRI"
  - id: c
    correct: true
    text:
      es: "Paul Mockapetris, de USC/ISI"
  - id: d
    text:
      es: "Jon Postel, editor de las RFC"
  explanation:
    es: "Paul Mockapetris, de USC/ISI, inventó el DNS, que resolvía nombres de host jerárquicos en direcciones de Internet. Cerf dirigió el equipo de Stanford que especificó TCP. Feinler dirigía el centro del SRI que mantenía las tablas de nombres y direcciones, antes del DNS. Postel fue editor de las RFC."
  citation: "fuente: `isoc-historia-internet.html`; «and the Domain Name System (DNS) was invented by Paul Mockapetris of USC/ISI.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q037
  prompt:
    es: "¿Cuál de los siguientes cambios llevó a sustituir la tabla única de hosts, con sus nombres y direcciones, por el DNS, según la historia de Internet?"
  options:
  - id: a
    text:
      es: "La primera demostración pública de ARPANET en 1972"
  - id: b
    correct: true
    text:
      es: "El paso a muchas redes (LAN) gestionadas de forma independiente"
  - id: c
    text:
      es: "La creación de MILNET para las necesidades operativas"
  - id: d
    text:
      es: "El paso de NCP a TCP/IP en ARPANET en 1983"
  explanation:
    es: "La historia dice que, con el crecimiento de Internet, los equipos recibieron nombres y que al principio era viable mantener una sola tabla con todos los hosts, nombres y direcciones; dejó de serlo cuando se pasó a tener «un gran número de redes (por ejemplo, LAN) gestionadas de forma independiente», y de ahí el DNS. La demostración pública de ARPANET en octubre de 1972 fue una exhibición de la nueva tecnología, no un cambio de escala. MILNET nace al dividir ARPANET en comunidades militar y civil, que la historia sitúa tras el paso a TCP/IP. Y el paso de NCP a TCP/IP el 1 de enero de 1983 es la transición del protocolo entre equipos, otro hito distinto."
  citation: "fuente: `isoc-historia-internet.html`; «The shift to having a large number of independently managed networks (e.g., LANs) meant that having a single table of hosts was no longer feasible, and the Domain Name System (DNS) was invented by Paul Mockapetris of USC/ISI.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ue-com-2023-442-web-4-0-pdf
- id: m06-l08-q038
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde a la web 4.0 según la Comunicación de la Comisión Europea de 2023 sobre la web 4.0 y los mundos virtuales?"
  options:
  - id: a
    text:
      es: "Entorno persistente e inmersivo, basado en 3D y realidad aumentada, que mezcla mundos físicos y digitales"
  - id: b
    text:
      es: "Capacidades semánticas que enlazan datos entre páginas web, aplicaciones y archivos de la tercera generación"
  - id: c
    correct: true
    text:
      es: "Cuarta generación prevista, con inteligencia artificial avanzada e internet de las cosas integrados con los entornos digitales y reales"
  - id: d
    text:
      es: "Tercera generación, abierta y descentralizada, en la que el usuario controla el valor económico de sus datos"
  explanation:
    es: "La web 4.0, generación prevista de la World Wide Web posterior a la web 3.0, integra plenamente la inteligencia artificial y ambiental avanzada, el internet de las cosas, la cadena de bloques, los mundos virtuales y los entornos digitales y reales. La descripción abierta y descentralizada con control de datos por el usuario es la de la web 3.0. El entorno persistente e inmersivo con 3D y realidad aumentada es la definición de los mundos virtuales, no de una generación de la web. Las capacidades semánticas que enlazan datos son un rasgo de la web 3.0, no de la web 4.0."
  citation: "fuente: `ue-com-2023-442-web-4-0.pdf`; «1. Introducción»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ue-com-2023-442-web-4-0-pdf
- id: m06-l08-q039
  prompt:
    es: "¿Cuál de los siguientes rasgos atribuye la Comunicación de la Comisión Europea de 2023 a la web 3.0, tercera generación de la World Wide Web?"
  options:
  - id: a
    text:
      es: "Integra plenamente objetos digitales y reales en experiencias intuitivas e inmersivas para los usuarios"
  - id: b
    text:
      es: "Usa inteligencia artificial y ambiental avanzada integrada en el entorno físico"
  - id: c
    text:
      es: "Se basa en mundos virtuales persistentes con 3D y realidad aumentada"
  - id: d
    correct: true
    text:
      es: "Es abierta y descentralizada, y los usuarios controlan el valor económico de sus datos"
  explanation:
    es: "La web 3.0 se caracteriza por ser abierta y descentralizada, con usuarios que controlan y materializan el valor económico de sus datos. La inteligencia artificial y ambiental avanzada es un rasgo que la Comunicación da a la web 4.0. La integración plena de objetos y entornos digitales y reales corresponde a la web 4.0. Los mundos virtuales con 3D y realidad aumentada son una definición aparte, no el rasgo de la web 3.0."
  citation: "fuente: `ue-com-2023-442-web-4-0.pdf`; «1. Introducción»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ue-com-2023-442-web-4-0-pdf
- id: m06-l08-q040
  prompt:
    es: "¿Cuál de las siguientes capacidades tienen los usuarios en la web 3.0, además de controlar el valor económico de sus datos, según la Comisión Europea?"
  options:
  - id: a
    text:
      es: "Ceder el valor económico de sus datos a las plataformas de la web"
  - id: b
    text:
      es: "Delegar la gestión de sus identidades en una autoridad central de la web"
  - id: c
    text:
      es: "Consultar páginas sin poder enlazar datos entre aplicaciones y archivos"
  - id: d
    correct: true
    text:
      es: "Gestionar sus identidades en línea y participar en el gobierno de la web"
  explanation:
    es: "En la web 3.0 los usuarios tienen capacidad plena para gestionar sus identidades en línea y participar en el gobierno de la web. Delegar la identidad en una autoridad central contradice la capacidad plena de los usuarios para gestionarla. Ceder el valor de los datos contradice que los usuarios puedan controlarlo y materializarlo. Las capacidades semánticas de la web 3.0 sí permiten enlazar datos entre páginas, aplicaciones y archivos."
  citation: "fuente: `ue-com-2023-442-web-4-0.pdf`; «1. Introducción»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ue-com-2023-442-web-4-0-pdf
- id: m06-l08-q041
  prompt:
    es: "¿Cuál de las siguientes funciones tienen, según la Comisión Europea, las capacidades semánticas de la web que caracterizan a la web 3.0?"
  options:
  - id: a
    text:
      es: "Permiten que los objetos y entornos digitales y reales se comuniquen entre sí"
  - id: b
    text:
      es: "Permiten mezclar mundos físicos y digitales en tiempo real con 3D y realidad aumentada"
  - id: c
    correct: true
    text:
      es: "Permiten enlazar datos entre páginas web, aplicaciones y archivos"
  - id: d
    text:
      es: "Permiten combinar sin fisuras los mundos físico y digital en experiencias inmersivas"
  explanation:
    es: "Las capacidades semánticas de la web permiten enlazar datos entre páginas web, aplicaciones y archivos. Combinar sin fisuras lo físico y lo digital es lo que logra la web 4.0 con sus tecnologías integradas. Mezclar mundos físicos y digitales en tiempo real es la definición de los mundos virtuales. Que los objetos y entornos digitales y reales se comuniquen entre sí es una característica de la web 4.0."
  citation: "fuente: `ue-com-2023-442-web-4-0.pdf`; «1. Introducción»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ue-com-2023-442-web-4-0-pdf
- id: m06-l08-q042
  prompt:
    es: "¿Cuál de las siguientes definiciones de los mundos virtuales ofrece la Comisión Europea en su Comunicación de 2023 sobre la web 4.0?"
  options:
  - id: a
    correct: true
    text:
      es: "Entornos persistentes e inmersivos, basados en 3D y realidad aumentada, que mezclan mundos físicos y digitales"
  - id: b
    text:
      es: "Cuarta generación prevista de la web, con inteligencia artificial y cadena de bloques"
  - id: c
    text:
      es: "Tercera generación de la web, abierta y descentralizada, controlada por sus usuarios"
  - id: d
    text:
      es: "Organizaciones autónomas descentralizadas que ofrecen una forma diferente de cooperación"
  explanation:
    es: "Los mundos virtuales son entornos persistentes e inmersivos, basados en tecnologías como la 3D y la realidad aumentada, que mezclan mundos físicos y digitales en tiempo real. Ser abierta y descentralizada, con usuarios que controlan sus datos, es lo que la Comisión atribuye a la web 3.0. Esa descripción, con inteligencia artificial y cadena de bloques, es la de la web 4.0. Las organizaciones autónomas descentralizadas son nuevas formas digitales de organización, no los mundos virtuales."
  citation: "fuente: `ue-com-2023-442-web-4-0.pdf`; «1. Introducción»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-introduccion-html
- id: m06-l08-q043
  prompt:
    es: "¿Dónde se alojó primero la evolución de HTML durante sus cinco primeros años, de 1990 a 1995, según la introducción del estándar HTML de WHATWG?"
  options:
  - id: a
    text:
      es: "En el IETF y, después, en el CERN"
  - id: b
    text:
      es: "En el W3C y, después, en el WHATWG"
  - id: c
    text:
      es: "En Opera Software y, después, en el W3C"
  - id: d
    correct: true
    text:
      es: "En el CERN y, después, en el IETF"
  explanation:
    es: "En sus cinco primeros años (1990-1995), HTML tuvo varias revisiones y extensiones, alojadas primero en el CERN y después en el IETF. El orden inverso, IETF y luego CERN, cambia el orden que da el estándar. El W3C se creó después de esos cinco años y el WHATWG nació tras la propuesta rechazada en 2004. Opera solo aparece en 2003-2004, con la propuesta de extensión de formularios, no en los primeros años."
  citation: "fuente: `whatwg-html-introduccion.html`; «1.6 History»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-introduccion-html
- id: m06-l08-q044
  prompt:
    es: "¿Qué especificación de HTML completó el W3C en 1997, tras el intento fallido de extender HTML en 1995 conocido como HTML 3.0?"
  options:
  - id: a
    text:
      es: "XHTML 1.0, una reformulación de HTML4 en XML"
  - id: b
    correct: true
    text:
      es: "HTML 3.2, un enfoque más pragmático"
  - id: c
    text:
      es: "DOM Level 1, la API que publicaron los fabricantes de navegadores"
  - id: d
    text:
      es: "XForms, la tecnología de formularios de nueva generación"
  explanation:
    es: "Tras el intento abortado de HTML 3.0 en 1995, el W3C completó en 1997 HTML 3.2, un enfoque más pragmático. XHTML 1.0, la reformulación de HTML4 en XML, se completó en 2000. DOM Level 1 se publicó en 1998 y es una API, no una versión de HTML. XForms se publicó en 2003 y despertó el interés por evolucionar HTML."
  citation: "fuente: `whatwg-html-introduccion.html`; «1.6 History»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-whatwg-html-introduccion-html
- id: m06-l08-q045
  prompt:
    es: "¿Qué tres empresas anunciaron conjuntamente que seguirían con la evolución de HTML bajo un nuevo foro llamado WHATWG, tras rechazar el W3C su propuesta en 2004?"
  options:
  - id: a
    text:
      es: "Mozilla, Opera y el W3C"
  - id: b
    text:
      es: "Apple, el IETF y el CERN"
  - id: c
    text:
      es: "Opera, Apple y el W3C"
  - id: d
    correct: true
    text:
      es: "Apple, Mozilla y Opera"
  explanation:
    es: "Apple, Mozilla y Opera anunciaron conjuntamente que continuarían el trabajo bajo el nuevo foro WHATWG. El W3C no es una empresa y fue quien rechazó la propuesta de Mozilla y Opera en 2004. El IETF y el CERN alojaron los primeros años de HTML, no se unieron al WHATWG. El W3C rechazó la propuesta, por lo que no anunció el WHATWG junto a Apple y Opera."
  citation: "fuente: `whatwg-html-introduccion.html`; «1.6 History»"
  difficulty: 3
  tags:
  - "concepto"
