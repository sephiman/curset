# anchor: fuente-ms-excel-separadores-html
- id: m06-l05-q103
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes acciones cambia de forma permanente los separadores decimal y de miles?"
  options:
  - id: a
    text:
      es: "Desactivar la casilla Usar separadores del sistema y escribir otros en Opciones de edición"
  - id: b
    text:
      es: "Activar la casilla Usar separadores del sistema en la pestaña Avanzadas"
  - id: c
    correct: true
    text:
      es: "Cambiar la configuración regional en el Panel de control"
  - id: d
    text:
      es: "Escribir los nuevos separadores en los cuadros de la categoría Fórmulas de Opciones"
  explanation:
    es: "Según la página, la solución permanente es cambiar la configuración regional en el Panel de control. Escribir separadores propios en Opciones de edición los reemplaza solo temporalmente, y activar la casilla Usar separadores del sistema devuelve los del sistema; la categoría Fórmulas no se menciona para este ajuste."
  citation: "fuente: `ms-excel-separadores.html`; «Cambiar el carácter usado para separar los miles o los decimales»"
  difficulty: 2
  tags:
