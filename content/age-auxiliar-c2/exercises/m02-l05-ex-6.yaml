# anchor: fuente-ms-win-ntfs-html
- id: m02-l05-q110
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes afirmaciones sobre las características avanzadas del sistema de archivos NTFS es correcta, según Microsoft?"
  options:
  - id: a
    text:
      es: "Solo admite nombres de archivo de ocho caracteres y extensión de tres letras."
  - id: b
    correct: true
    text:
      es: "Incluye descriptores de seguridad, cifrado, cuotas de disco y metadatos enriquecidos."
  - id: c
    text:
      es: "Limita el tamaño de cada archivo a 4 GiB, igual que hace el sistema FAT32."
  - id: d
    text:
      es: "Carece de cuotas de disco y de cifrado, que solo ofrece el cifrado BitLocker."
  explanation:
    es: "La página dice que NTFS proporciona características avanzadas, incluidos descriptores de seguridad, cifrado, cuotas de disco y compatibilidad con metadatos enriquecidos. NTFS admite nombres de archivo largos con un alias 8.3 para compatibilidad, y la tabla de comparación da para NTFS un tamaño de archivo máximo de 2^64–1 bytes, mientras que los 4 GiB son el límite de FAT32."
  citation: "fuente: `ms-win-ntfs.html`; «Introducción a NTFS»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-ntfs-html
- id: m02-l05-q111
  prompt:
    es: "¿Con qué se integra NTFS para permitir un almacenamiento de alta disponibilidad al que acceden a la vez varios nodos de un clúster de conmutación por error, según Microsoft?"
  options:
  - id: a
    text:
      es: "Con las listas de control de acceso (ACL)."
  - id: b
    correct: true
    text:
      es: "Con los volúmenes compartidos de clúster (CSV)."
  - id: c
    text:
      es: "Con el cifrado de unidad BitLocker."
  - id: d
    text:
      es: "Con las cuotas de disco de cada usuario."
  explanation:
    es: "La página dice que NTFS se integra con los volúmenes compartidos de clúster (CSV), lo que permite un almacenamiento de alta disponibilidad al que varios nodos de un clúster de conmutación por error pueden acceder simultáneamente. BitLocker cifra los datos, las ACL asignan permisos y las cuotas controlan el espacio por usuario."
  citation: "fuente: `ms-win-ntfs.html`; «Introducción a NTFS»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-sistemas-archivos-html
- id: m02-l05-q112
  prompt:
    es: "¿Cuál de los siguientes conjuntos recoge los cuatro sistemas de archivos principales de Windows que compara la documentación de Microsoft?"
  options:
  - id: a
    text:
      es: "NTFS, exFAT, ext4 y FAT32."
  - id: b
    text:
      es: "NTFS, HFS+, UDF y FAT32."
  - id: c
    text:
      es: "NTFS, APFS, exFAT y UDF."
  - id: d
    correct: true
    text:
      es: "NTFS, exFAT, UDF y FAT32."
  explanation:
    es: "La página compara «los cuatro sistemas de archivos principales de Windows, NTFS, exFAT, UDF y FAT32». Ext4, HFS+ y APFS no figuran en esa comparación, así que ninguna de las otras series coincide con los cuatro que da Microsoft."
  citation: "fuente: `ms-win-sistemas-archivos.html`; «Comparación de la funcionalidad del sistema de archivos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-sistemas-archivos-html
- id: m02-l05-q113
  prompt:
    es: "Según la comparación de Microsoft de los sistemas de archivos de Windows, el tamaño de archivo máximo que admite FAT32 es de:"
  options:
  - id: a
    text:
      es: "2 GiB."
  - id: b
    correct: true
    text:
      es: "4 GiB."
  - id: c
    text:
      es: "16 TB."
  - id: d
    text:
      es: "2^64–1 bytes."
  explanation:
    es: "En la tabla de límites, el tamaño de archivo máximo de FAT32 es de 4 GiB, mientras que NTFS, exFAT y UDF admiten 2^64–1 bytes. La tabla de límites da 4 GiB para FAT32, no 2 GiB. Los 16 TB son un límite de volumen de NTFS con clústeres de 4 KB, no el tamaño de archivo de FAT32. Los 2^64–1 bytes son el máximo de NTFS, exFAT y UDF, no el de FAT32."
  citation: "fuente: `ms-win-sistemas-archivos.html`; «Tamaño de archivo máximo — 2^64–1 bytes — 2^64–1 bytes — 2^64–1 bytes — 4 GiB»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-ms-win-sistemas-archivos-html
- id: m02-l05-q114
  prompt:
    es: "¿Cuántos caracteres admite como máximo el nombre de un archivo en UDF, según la comparación de Microsoft de sistemas de archivos?"
  options:
  - id: a
    text:
      es: "255 caracteres Unicode o 127 ASCII."
  - id: b
    text:
      es: "254 caracteres Unicode o 127 ASCII."
  - id: c
    text:
      es: "32 760 caracteres Unicode o 254 ASCII."
  - id: d
    correct: true
    text:
      es: "127 caracteres Unicode o 254 ASCII."
  explanation:
    es: "La tabla de límites da a UDF una longitud máxima de nombre de archivo de 127 caracteres Unicode o 254 ASCII, y 255 caracteres Unicode a NTFS, exFAT y FAT32. La opción de 255 caracteres Unicode es la de los otros tres sistemas. La de 254 caracteres Unicode invierte las cifras de UDF. Los 32 760 caracteres Unicode son el máximo del nombre de la ruta, no el del nombre del archivo."
  citation: "fuente: `ms-win-sistemas-archivos.html`; «Longitud máxima del nombre del archivo — 255 caracteres Unicode — 255 caracteres Unicode — 127 Caracteres Unicode o 254 ASCII — 255 caracteres Unicode»"
  difficulty: 2
  tags:
  - "cantidad"
