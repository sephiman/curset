# anchor: fuente-ms-win-recortes-html
- id: m06-l03-q259
  prompt:
    es: "En la herramienta Recortes de Windows 11, ¿qué se selecciona para disponer de unos segundos y abrir un menú antes de que se haga la captura?"
  options:
  - id: a
    correct: true
    text:
      es: "Retraso y, después, un tiempo, como 5 segundos"
  - id: b
    text:
      es: "Modo y, después, el tipo Forma libre"
  - id: c
    text:
      es: "Grabar y, después, Nuevo para el vídeo"
  - id: d
    text:
      es: "Acciones de texto y, después, Nuevo"
  explanation:
    es: "La página dice que se selecciona Retraso, se elige el tiempo, por ejemplo 5 segundos, y se inicia la cuenta atrás, con lo que se dispone de 5 segundos para abrir un menú o componer la imagen. Modo y Forma libre eligen el tipo de recorte, Grabar abre la grabación de vídeo y Acciones de texto extrae texto."
  citation: "fuente: `ms-win-recortes.html`; «Retrasar la captura de pantalla»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-recortes-html
- id: m06-l03-q260
  prompt:
    es: "En Windows 11, ¿cómo se coloca la herramienta Recortes en la barra de tareas, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Escribiendo herramienta recortes en el cuadro de búsqueda y seleccionando Anclar a Inicio"
  - id: b
    text:
      es: "Escribiendo herramienta recortes en el cuadro de búsqueda y seleccionando Anclar a acceso rápido"
  - id: c
    text:
      es: "Pulsando Windows+Mayús+S y seleccionando Anclar a la barra de tareas"
  - id: d
    correct: true
    text:
      es: "Escribiendo herramienta recortes en el cuadro de búsqueda y seleccionando Anclar a la barra de tareas"
  explanation:
    es: "La página dice que se escribe herramienta recortes en el cuadro de búsqueda de la barra de tareas y se selecciona Anclar a la barra de tareas. Anclar a Inicio coloca la aplicación en el menú Inicio, Anclar a acceso rápido es de las carpetas del Explorador y Windows+Mayús+S abre la superposición de captura."
  citation: "fuente: `ms-win-recortes.html`; «Colocar la herramienta Recortes en la barra de tareas»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-recortes-html
- id: m06-l03-q261
  prompt:
    es: "En Windows 11, ¿cómo se imprime un recorte de imagen que ya se ha guardado con la herramienta Recortes?"
  options:
  - id: a
    text:
      es: "Con Ver más › Compartir, desde la ventana de Recortes"
  - id: b
    text:
      es: "Con Alt+D, desde la ventana de la herramienta Recortes"
  - id: c
    text:
      es: "Con Editar › Editar con Paint, en un recorte de vídeo"
  - id: d
    correct: true
    text:
      es: "Con clic derecho en el recorte guardado y la opción Imprimir"
  explanation:
    es: "La página dice que, en la carpeta donde se haya guardado el recorte, se hace clic con el botón derecho en él y se selecciona Imprimir. Ver más › Compartir envía el recorte, Alt+D retrasa la captura y Editar con Paint se usa con una captura de imagen."
  citation: "fuente: `ms-win-recortes.html`; «Imprimir un recorte de imagen»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-recortes-html
- id: m06-l03-q262
  prompt:
    es: "En la herramienta Recortes de Windows 11, ¿cuál de las siguientes rutas lleva a Paint para cambiar el tamaño, el color o el texto de un recorte de imagen?"
  options:
  - id: a
    text:
      es: "Ver más › Configuración"
  - id: b
    text:
      es: "Ver más › Compartir"
  - id: c
    correct: true
    text:
      es: "Editar › Editar con Paint"
  - id: d
    text:
      es: "Grabar › Editar en Clipchamp"
  explanation:
    es: "La página dice que, con la captura abierta en Recortes, se selecciona Editar › Editar con Paint para usar características de tamaño, color, texto y otras mejoras. Configuración y Compartir son opciones de Ver más, y Editar en Clipchamp es la opción de un recorte de vídeo."
  citation: "fuente: `ms-win-recortes.html`; «Ampliar, girar o recortar el recorte de imagen»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-recortes-html
- id: m06-l03-q263
  prompt:
    es: "En un Copilot+ PC con Windows 11, ¿qué hace la característica Captura de pantalla perfecta de la herramienta Recortes?"
  options:
  - id: a
    text:
      es: "Captura valores de color exactos desde cualquier lugar de la pantalla elegido"
  - id: b
    correct: true
    text:
      es: "Ajusta el área de captura para encuadrar el contenido de la pantalla"
  - id: c
    text:
      es: "Extrae y copia el texto del recorte con reconocimiento óptico de caracteres"
  - id: d
    text:
      es: "Retrasa la captura entre 1 y 5 segundos, según el modo elegido"
  explanation:
    es: "La página dice que Perfect screenshot ajusta automáticamente el área de captura para encuadrar el contenido en pantalla, lo que reduce la necesidad de recortar después. Capturar valores de color es el Selector de color, extraer texto es Acciones de texto y retrasar la captura es Alt+D."
  citation: "fuente: `ms-win-recortes.html`; «Usar las características de Copilot+ PC en la herramienta Recortes»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-recortes-html
- id: m06-l03-q264
  prompt:
    es: "En un Copilot+ PC con Windows 11, ¿qué captura la característica Selector de color de la herramienta Recortes?"
  options:
  - id: a
    correct: true
    text:
      es: "Valores de color exactos de cualquier lugar de la pantalla"
  - id: b
    text:
      es: "Una forma libre dibujada alrededor de un objeto"
