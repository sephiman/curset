# Normativa del programa: Cuerpo General Administrativo de la AGE, ingreso libre.
# Fuente del programa: Resolución de 18-12-2025 (BOE-A-2025-26262), Anexo III, punto 3 (45 temas).
# Norma común 11.1: rige la legislación vigente a la fecha de cada ejercicio.
# Norma citada en los cuestionarios oficiales 2020-2025 (scratchpad/exams/*.json) e incluida si un tema de 2025 la cubre.
# Construido: 2026-10-16. Verificación: API de datos abiertos del BOE (legislacion-consolidada/id/<ID>/metadatos y /analisis)
# y la página https://www.boe.es/buscar/act.php?id=<ID>; normas de la UE en el SPARQL de la Oficina de Publicaciones.
#
# Campos:
#   short               nombre corto habitual
#   title               título exacto en boe.es (o en el diario oficial de la UE)
#   boe_id              identificador BOE; null en normas de la UE
#   celex               solo normas de la UE: identificador CELEX de EUR-Lex
#   url                 texto consolidado en boe.es (doc.php si no hay consolidado; EUR-Lex en normas de la UE)
#   consolidated_as_of  «Última actualización publicada el» que muestra boe.es el 2026-10-16; si la norma nunca se ha
#                       modificado, boe.es no muestra esa línea y el campo lleva la fecha de publicación
#                       (en la UE: fecha de la versión consolidada; null si no se pudo leer)
#   temas               temas del programa que la norma cubre, ordenados (bloque romano, número)
#   amended_2025_2026   modificaciones publicadas entre 2025-01-01 y 2026-10-16 que boe.es lista en el análisis;
#                       «PENDIENTE» = publicada pero aún no en vigor el 2026-10-16
#   note                lo que el lector debe saber
#   unverified          true si la norma no está en la colección consolidada o no se pudo comprobar
#
# Campos añadidos en la ronda R1 (2026-10-16), requisito R3.5 v1.3:
#   file                texto descargado en sources/normativa/, nombre <BOE-A-id>_<nombre-corto>_<fecha>.<pdf|html>;
#                       <fecha> es la «Última modificación» impresa en el PDF consolidado (o la fecha de publicación si
#                       nunca se modificó). Normas de la UE: CELEX-<id>_… en lugar del BOE-A, copia del DOUE en boe.es/doue.
#   tags                [cambio-pendiente] si hay una modificación publicada que entra en vigor después del 2026-10-16
#   version_vigente     la versión en vigor el 2026-10-16: consolidated_as_of (fecha del texto que la contiene) y note.
#                       Cuando boe.es ya consolidó la modificación futura, el fichero trae la redacción futura. Hay dos
#                       formas (comprobado en R2, 2026-10-16). RD 366/2007 y Reglamento del Congreso: aviso «Téngase en
#                       cuenta que esta actualización… entra en vigor…» y, debajo, la «Redacción anterior», que es la
#                       vigente hoy. Normas modificadas por Ley 4/2026 o RD 813/2026: la redacción nueva va integrada sin
#                       aviso de entrada en vigor y sin «Redacción anterior»; el texto vigente hoy no está en el fichero.
#   cambios_pendientes  modificaciones publicadas con entrada en vigor futura: norma, boe_id, precepto_modificador,
#                       publicada, en_vigor (fecha o condición), articulos (preceptos de ESTA norma que cambian), file
#                       (texto original de la norma modificadora en sources/normativa/).
# Regla de cita (R3.5): la fecha del examen de la OEP 2026 no se conoce y será en 2027. Lecciones y preguntas citan la
# versión posterior (la de cambios_pendientes); las normas con cambio-pendiente se revisan si el examen cae antes.

# ======================================================================
# Bloque I. Organización del Estado y de la Administración pública
# ======================================================================

