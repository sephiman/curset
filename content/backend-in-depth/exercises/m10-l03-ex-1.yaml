- id: m10-l03-q13
  prompt:
    en: When the event sources of a workload go quiet, down to how many running pods can KEDA scale it back?
  options:
  - id: a
    text:
      en: One
  - id: b
    text:
      en: Two
  - id: c
    correct: true
    text:
      en: Zero
  - id: d
    text:
      en: The number the workload had before the load arrived
  explanation:
    en: KEDA can scale all the way to zero. One pod, two pods and the number the workload had before the load arrived
      are all excluded, because KEDA scales back down to zero if needed.
  citation: keda-concepts#how-keda-works
  extract:
    en: When things go quiet, it scales back down, all the way to zero if needed.
- id: m10-l03-q15
  prompt:
    en: In a multi-zone Kubernetes cluster, what does Topology Aware Routing help keep the traffic of a Service
      within?
  options:
  - id: a
    text:
      en: The node it originated from
  - id: b
    correct: true
    text:
      en: The zone it originated from
  - id: c
    text:
      en: The namespace it originated from
  - id: d
    text:
      en: The region it originated from
  explanation:
    en: It helps keep traffic within the zone it originated from. The node, the namespace and the region are all
      excluded, because the mechanism keeps traffic within the zone.
  citation: k8s-topology-aware-routing#motivation
  extract:
    en: Topology Aware Routing provides a mechanism to help keep traffic within the zone it originated from.
- id: m10-l03-q16
  prompt:
    en: In Kubernetes 1.37, what does the `.spec.trafficDistribution` value `PreferSameZone` indicate when it is
      set on a Service to influence traffic routing?
  options:
  - id: a
    correct: true
    text:
      en: A preference for routing traffic to endpoints in the same zone as the client
  - id: b
    text:
      en: A strict guarantee that traffic never leaves the zone
  - id: c
    text:
      en: A preference for routing traffic to endpoints on the same node as the client
  - id: d
    text:
      en: A deprecated alias of `PreferClose`
  explanation:
    en: '`PreferSameZone` indicates a preference for endpoints in the same zone as the client. A strict guarantee
      is wrong because traffic distribution expresses preferences while traffic policies carry strict semantic guarantees.
      The same-node preference is wrong because that is what `PreferSameNode` indicates. The deprecated alias is
      wrong because `PreferClose` is the older alias for `PreferSameZone`.'
  citation: k8s-service#traffic-distribution
  extract:
    en: Indicates a preference for routing traffic to endpoints that are in the same zone as the client.
- id: m10-l03-q17
  prompt:
    en: According to the Kubernetes documentation on traffic distribution, which three goals can the `.spec.trafficDistribution`
      field of a Service help optimize?
  options:
  - id: a
    text:
      en: Latency, cost, or security
  - id: b
    correct: true
    text:
      en: Performance, cost, or reliability
  - id: c
    text:
      en: Throughput, durability, or compliance
  - id: d
    text:
      en: Performance, availability, or portability
  explanation:
    en: It can help optimize for performance, cost, or reliability. The sets with security, with compliance and
      with portability are all excluded, because the documentation names exactly performance, cost and reliability.
  citation: k8s-service#traffic-distribution
  extract:
    en: This can help optimize for performance, cost, or reliability.
- id: m10-l03-q19
  prompt:
    en: Which of these is one of the primary downsides of tail sampling that OpenTelemetry lists for sampling decisions
      on whole traces?
  options:
  - id: a
    text:
      en: It cannot sample traces based on their overall latency
  - id: b
    text:
      en: It cannot always sample the traces that contain an error
  - id: c
    text:
      en: It cannot be combined with head sampling in the same system
  - id: d
    correct: true
    text:
      en: It can be difficult to operate, because its components must be stateful systems that store a large amount
        of data
  explanation:
    en: Tail sampling can be difficult to operate because its components must be stateful systems that can accept
      and store a large amount of data. Sampling by overall latency is wrong because that is one of the listed uses
      of tail sampling. Always sampling traces that contain an error is wrong because that is another listed use.
      Combination with head sampling is wrong because tail sampling might be used in conjunction with head sampling.
  citation: otel-sampling#tail-sampling
  extract:
    en: The component(s) that implement tail sampling must be stateful systems that can accept and store a large
      amount of data.
- id: m10-l03-q20
  prompt:
    en: In Prometheus 3, what does the retention time default to when neither `--storage.tsdb.retention.time` nor
      `storage.tsdb.retention.size` is set?
  options:
  - id: a
    text:
      en: 7d
  - id: b
    text:
      en: 30d
  - id: c
    text:
      en: 90d
  - id: d
    correct: true
    text:
      en: 15d
  explanation:
    en: The retention time defaults to 15d. The values 7d, 30d and 90d are all excluded, because the documented
      default is 15d.
  citation: prom-storage#operational-aspects
  extract:
    en: If neither this flag nor storage.tsdb.retention.size is set, the retention time defaults to 15d.
- id: m10-l03-q21
  prompt:
    en: In Prometheus 3, what is the default of the `--storage.tsdb.retention.size` flag that sets the maximum number
      of bytes of storage blocks to retain?
  options:
  - id: a
    text:
      en: 10GB
  - id: b
    text:
      en: 512MB
  - id: c
    text:
      en: 80% of the disk
  - id: d
    correct: true
    text:
      en: 0, which means the size limit is disabled
  explanation:
    en: The flag defaults to 0, which means disabled. The values 10GB, 512MB and 80% of the disk are all excluded,
      because the documented default is 0 or disabled.
  citation: prom-storage#operational-aspects
  extract:
    en: The maximum number of bytes of storage blocks to retain. The oldest data will be removed first. Defaults
      to 0 or disabled.
- id: m10-l03-q22
  prompt:
    en: In Prometheus, both a time retention policy and a size retention policy are specified. Which of the two
      policies is used?
  options:
  - id: a
    text:
      en: Whichever triggers last
  - id: b
    text:
      en: The time policy only
  - id: c
    correct: true
    text:
      en: Whichever triggers first
  - id: d
    text:
      en: The size policy only
  explanation:
    en: Whichever triggers first is used. The policy that triggers last, the time policy only and the size policy
      only are all excluded, because when both are specified the first one to trigger applies.
  citation: prom-storage#operational-aspects
  extract:
    en: If both time and size retention policies are specified, whichever triggers first will be used.
- id: m10-l03-q23
  prompt:
    en: Prometheus documentation gives a rough formula for capacity planning. On average, how many bytes per sample
      does Prometheus store?
  options:
  - id: a
    correct: true
    text:
      en: 1-2 bytes
  - id: b
    text:
      en: 16 bytes
  - id: c
    text:
      en: 8 bytes
  - id: d
    text:
      en: 64 bytes
  explanation:
    en: Prometheus stores an average of 1-2 bytes per sample. The values 16, 8 and 64 bytes are all excluded, because
      the documentation gives an average of only 1-2 bytes.
  citation: prom-storage#operational-aspects
  extract:
    en: Prometheus stores an average of only 1-2 bytes per sample.
- id: m10-l03-q24
  prompt:
    en: Prometheus recommends a limit for `storage.tsdb.retention.size` relative to the disk space allocated to
      Prometheus. Which statement matches that recommendation?
  options:
  - id: a
    text:
      en: The full 100% of the allocated disk space
  - id: b
    correct: true
    text:
      en: At most 80-85% of the allocated disk space
  - id: c
    text:
      en: At least 90% of the allocated disk space
  - id: d
    text:
      en: Between 95% and 100% of the allocated disk space
  explanation:
    en: The recommendation is at most 80-85% of the allocated disk space. Using all of it, at least 90% and 95%
      to 100% are all excluded, because the remaining 15-20% buffer is reserved for in-progress compactions.
  citation: prom-storage#right-sizing-retention-size
  extract:
    en: At present, we recommend setting the retention size to, at most, 80-85% of your allocated Prometheus disk
      space.
- id: m10-l03-q25
  prompt:
    en: If no `reclaimPolicy` is specified when a Kubernetes `StorageClass` object is created, what does the `reclaimPolicy`
      default to?
  options:
  - id: a
    correct: true
    text:
      en: '`Delete`'
  - id: b
    text:
      en: '`Retain`'
  - id: c
    text:
      en: '`Recycle`'
  - id: d
    text:
      en: '`Archive`'
  explanation:
    en: The `reclaimPolicy` defaults to `Delete`. The values `Retain`, `Recycle` and `Archive` are all excluded,
      because the documented default is `Delete`.
  citation: k8s-storage-classes#reclaim-policy
  extract:
    en: If no reclaimPolicy is specified when a StorageClass object is created, it will default to Delete.
- id: m10-l03-q26
  prompt:
    en: Which reclaim policy does a `PersistentVolume` have when it is created manually and managed via a `StorageClass`?
  options:
  - id: a
    text:
      en: The reclaim policy of the `StorageClass`
  - id: b
    text:
      en: Always `Delete`
  - id: c
    text:
      en: Always `Retain`
  - id: d
    correct: true
    text:
      en: Whatever reclaim policy it was assigned at creation
  explanation:
    en: It has whatever reclaim policy it was assigned at creation. The policy of the class, always `Delete` and
      always `Retain` are all excluded, because only dynamically created `PersistentVolume` objects take the policy
      of the class.
  citation: k8s-storage-classes#reclaim-policy
  extract:
    en: PersistentVolumes that are created manually and managed via a StorageClass will have whatever reclaim policy
      they were assigned at creation.
