# anchor: boe-a-2006-20764-art-18
- id: m03-l15-q0119
  prompt:
    es: "Lidia Pardo percibe en 2026 un rendimiento íntegro del trabajo de 40.000 euros, con período de generación de cuatro años, que se imputa en un único período impositivo. No ha aplicado esta reducción en los cinco períodos anteriores. Según el artículo 18.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué importe se reduce por el porcentaje del 30 por ciento?"
  options:
  - id: a
    text:
      es: "La reducción es de 90.000 euros."
  - id: b
    correct: true
    text:
      es: "La reducción es de 12.000 euros."
  - id: c
    text:
      es: "La reducción es de 8.000 euros."
  - id: d
    text:
      es: "La reducción es de 28.000 euros."
  explanation:
    es: "Se cumplen los requisitos: período de generación superior a dos años, imputación en un único período y ninguna reducción previa en los cinco períodos anteriores. La reducción es el 30 por ciento de 40.000 euros, es decir, 12.000 euros, y el tope de 300.000 euros no interviene (art. 18.2 LIRPF). Los 8.000 euros aplican el 20 por ciento, que es el porcentaje del inicio de actividad. Los 28.000 son el importe que queda tras reducir, y 90.000 sería el 30 por ciento del tope."
  citation: "art. 18.2 LIRPF"
  difficulty: 2
  tags:
