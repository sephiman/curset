# anchor: fuente-ms-win-cuentas-usuario-html
- id: m02-l05-q232
  prompt:
    es: "En Windows 11, ¿qué sección de la aplicación Configuración se abre para agregar una cuenta de usuario con la ruta que describe la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Sistema › Otros usuarios"
  - id: b
    text:
      es: "Cuentas › Opciones de inicio de sesión"
  - id: c
    correct: true
    text:
      es: "Cuentas › Otro usuario"
  - id: d
    text:
      es: "Privacidad y seguridad › Cuentas"
  explanation:
    es: "La página indica que se entra por Configuración, Cuentas y Otro usuario. «Sistema › Otros usuarios» no es la ruta que da la página, cuya categoría es Cuentas. «Cuentas › Opciones de inicio de sesión» no es la ruta que da la página para agregar otro usuario. «Privacidad y seguridad › Cuentas» no es la ruta que da la página, que usa la categoría Cuentas. Lo que dice la fuente: «seleccione Cuentas >, Otro usuario»."
  citation: "fuente: `ms-win-cuentas-usuario.html`; «Administrar cuentas de usuario en Windows»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-cuentas-usuario-html
- id: m02-l05-q234
  prompt:
    es: "En Windows 11, ¿qué tipo de cuenta recomienda Microsoft usar al iniciar sesión, por la integración de servicios, la seguridad mejorada y la sincronización entre dispositivos?"
  options:
  - id: a
    correct: true
    text:
      es: "Una cuenta de Microsoft"
  - id: b
    text:
      es: "Una cuenta local"
  - id: c
    text:
      es: "Una cuenta de administrador compartida"
  - id: d
    text:
      es: "Una cuenta de invitado sin contraseña"
  explanation:
    es: "La página recomienda una cuenta de Microsoft en lugar de una cuenta local. «Una cuenta local» es la que la página desaconseja frente a la cuenta de Microsoft. «Una cuenta de administrador compartida» la página recomienda limitar los administradores y no la presenta como opción de inicio de sesión recomendada. «Una cuenta de invitado sin contraseña» no es una cuenta que recomiende la página. Lo que dice la fuente: «Microsoft recomienda usar una cuenta de Microsoft, no una cuenta local, al iniciar sesión en Windows»."
  citation: "fuente: `ms-win-cuentas-usuario.html`; «Administrar cuentas de usuario en Windows»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-cuentas-usuario-html
- id: m02-l05-q235
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones hay que elegir en la pantalla de alta de usuario para crear una cuenta local sin cuenta de Microsoft, según Microsoft?"
  options:
  - id: a
    text:
      es: "Registrarse para obtener una nueva dirección de correo electrónico"
  - id: b
    text:
      es: "Agregar una cuenta profesional o educativa"
  - id: c
    correct: true
    text:
      es: "Agregar un usuario sin una cuenta de Microsoft"
  - id: d
    text:
      es: "Quitar la cuenta y los datos del dispositivo"
  explanation:
    es: "La página indica esa opción para crear una cuenta local. «Registrarse para obtener una nueva dirección de correo electrónico» crea una cuenta de Microsoft nueva, no una cuenta local. «Agregar una cuenta profesional o educativa» conecta una cuenta de organización, no crea una cuenta local. «Quitar la cuenta y los datos del dispositivo» sirve para eliminar una cuenta del dispositivo, no para crear una."
  citation: "fuente: `ms-win-cuentas-usuario.html`; «Administrar cuentas de usuario en Windows»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-cuentas-usuario-html
- id: m02-l05-q237
  prompt:
    es: "En Windows 11, ¿qué opción de Configuración permite cambiar una cuenta de usuario a administrador, según la página de Microsoft sobre cuentas de usuario?"
  options:
  - id: a
    text:
      es: "Agregar una cuenta de Microsoft nueva"
  - id: b
    text:
      es: "Quitar la cuenta y sus datos"
  - id: c
    text:
      es: "Desconectar la cuenta del dispositivo"
  - id: d
    correct: true
    text:
      es: "Cambiar tipo de cuenta"
  explanation:
    es: "La página indica Cambiar tipo de cuenta, junto a Opciones de cuenta, para elegir el tipo. «Agregar una cuenta de Microsoft nueva» sirve para dar de alta otro usuario, no para cambiar su tipo. «Quitar la cuenta y sus datos» elimina la información de inicio de sesión y los datos del dispositivo, no cambia el tipo. «Desconectar la cuenta del dispositivo» es la opción para una cuenta profesional o educativa, no para cambiar el tipo."
  citation: "fuente: `ms-win-cuentas-usuario.html`; «Administrar cuentas de usuario en Windows»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-cuentas-usuario-html
- id: m02-l05-q292
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes tipos de cuenta pueden tener los niños con controles parentales para supervisar y limitar su uso, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Cuentas de administrador"
  - id: b
    correct: true
    text:
      es: "Cuentas estándar"
  - id: c
    text:
      es: "Cuentas de invitado"
  - id: d
    text:
      es: "Cuentas de servicio"
  explanation:
    es: "La página pone el ejemplo de cuentas estándar con controles parentales para los niños. «Cuentas de administrador» son las que el ejemplo da a los padres, con privilegios para administrar la configuración. «Cuentas de invitado» no es el tipo de cuenta que cita el ejemplo de la página. «Cuentas de servicio» no es el tipo de cuenta que cita el ejemplo de la página. Lo que dice la fuente: «mientras que los niños pueden tener cuentas estándar con controles parentales habilitados para supervisar y limitar su uso»."
  citation: "fuente: `ms-win-cuentas-usuario.html`; «Administrar cuentas de usuario en Windows»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-learn-powershell-html
