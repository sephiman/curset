- id: m04-l05-q227
  prompt:
    es: "Un funcionario del Subgrupo C1 con grado 18 consolidado obtiene por concurso un puesto de nivel 20 y lo desempeña dos años continuados. El grado que consolida al cabo de esos dos años es:"
  options:
  - id: a
    correct: true
    text:
      es: "El grado 20, porque el puesto no supera su grado en más de dos niveles."
  - id: b
    text:
      es: "El grado 19, porque consolida un nivel por cada año de servicios continuados."
  - id: c
    text:
      es: "El grado 18, porque necesita tres años en el nuevo puesto para cambiar de grado."
  - id: d
    text:
      es: "El grado 22, máximo del intervalo de su Subgrupo, porque el puesto es superior."
  explanation:
    es: "La regla de dos en dos niveles del artículo 70.2 solo se aplica cuando el puesto es «superior en más de dos niveles». Aquí la diferencia es de dos, así que rige la regla general: dos años continuados en un puesto de nivel 20 dan el grado 20. No existe un ritmo de un nivel por año. Tres años solo se exigen con interrupción. El grado nunca supera «el correspondiente al del puesto desempeñado», así que el 22 queda descartado."
  citation: "art. 70.2 RD 364/1995"
  difficulty: 3
