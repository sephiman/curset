- id: g-partial-index
  term: {en: partial index}
  definition: {en: "An index built over a subset of a table; the subset is defined by a conditional expression, called the predicate of the partial index. The index contains entries only for those table rows that satisfy the predicate."}
  origin: m06-l03
  citation: "pg-indexes-partial#INDEXES-PARTIAL"
- id: g-covering-index
  term: {en: covering index}
  definition: {en: "An index specifically designed to include the columns needed by a particular type of query that you run frequently, so that index-only scans can be used."}
  origin: m06-l03
  citation: "pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS"
- id: g-index-only-scan
  term: {en: index-only scan}
  definition: {en: "A scan that can answer a query from an index alone, without any heap access, by returning values directly out of each index entry instead of consulting the associated heap entry."}
  origin: m06-l03
  citation: "pg-indexes-index-only-scans#INDEXES-INDEX-ONLY-SCANS"
- id: g-partition-pruning
  term: {en: partition pruning}
  definition: {en: "A query optimization technique that improves performance for declaratively partitioned tables: when the planner can prove that a partition could not contain any rows meeting the query's WHERE clause, it excludes the partition from the query plan."}
  origin: m06-l03
  citation: "pg-ddl-partitioning#DDL-PARTITION-PRUNING"
- id: g-inverted-index
  term: {en: inverted index}
  definition: {en: "An index that contains a separate entry for each component value of a data value that holds multiple component values, such as an array, and can efficiently handle queries that test for the presence of specific component values."}
  origin: m06-l03
  citation: "pg-indexes-types#INDEXES-TYPES-GIN"
