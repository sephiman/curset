# anchor: boe-a-2003-23186-art-92
- id: m03-l05-q0060
  prompt:
    es: "De acuerdo con el artículo 92.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los interesados podrán colaborar en la aplicación de los tributos en los términos y condiciones que:"
  options:
  - id: a
    text:
      es: "se pacten libremente en cada acuerdo de colaboración suscrito."
  - id: b
    text:
      es: "fije cada Administración tributaria en sus instrucciones internas."
  - id: c
    text:
      es: "determinen los colegios y asociaciones de profesionales de la asesoría fiscal."
  - id: d
    correct: true
    text:
      es: "reglamentariamente se determinen."
  explanation:
    es: "El artículo 92.1 remite a lo que se determine reglamentariamente. No se deja a la libertad de pacto en cada acuerdo, a instrucciones internas de la Administración ni a lo que decidan los colegios de asesores."
  citation: "art. 92.1 LGT"
  difficulty: 1
  tags:
  - "colaboración social"
  - "regla"
# anchor: boe-a-2003-23186-art-92
- id: m03-l05-q0061
  prompt:
    es: "¿Con instituciones y organizaciones representativas de qué sectores o intereses puede instrumentarse la colaboración social en la aplicación de los tributos, según el artículo 92.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Sectores o intereses políticos, sindicales, empresariales o profesionales."
  - id: b
    text:
      es: "Sectores o intereses sociales y laborales, pero no empresariales ni profesionales."
  - id: c
    correct: true
    text:
      es: "Sectores o intereses sociales, laborales, empresariales o profesionales."
  - id: d
    text:
      es: "Sectores o intereses económicos, financieros, mercantiles o industriales."
  explanation:
    es: "El artículo 92.2 menciona intereses sociales, laborales, empresariales o profesionales. No habla de intereses políticos ni sindicales, no excluye los empresariales y profesionales y no emplea la lista de intereses económicos, financieros, mercantiles o industriales."
  citation: "art. 92.2 LGT"
  difficulty: 2
  tags:
  - "colaboración social"
  - "acuerdos"
# anchor: boe-a-2003-23186-art-92
- id: m03-l05-q0062
  prompt:
    es: "¿Cuál de los siguientes aspectos de la colaboración social requiere la previa autorización de los obligados tributarios, según el artículo 92.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "La solicitud y obtención de certificados tributarios."
  - id: b
    text:
      es: "Las campañas de información y difusión que organice la Administración."
  - id: c
    text:
      es: "La simplificación del cumplimiento de las obligaciones tributarias."
  - id: d
    text:
      es: "La realización de estudios o informes sobre la aplicación de las disposiciones generales."
  explanation:
    es: "Las letras e) a h) del artículo 92.3 exigen autorización previa de los obligados, y la h) es la solicitud y obtención de certificados. Las campañas, la simplificación del cumplimiento y los estudios o informes son aspectos de las letras a) a c) que no la requieren."
  citation: "art. 92.3 LGT"
  difficulty: 2
  tags:
  - "colaboración social"
  - "autorización"
# anchor: boe-a-2003-23186-art-92
- id: m03-l05-q0063
  prompt:
    es: "Conforme al artículo 92.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la colaboración social podrá referirse a la información del estado de tramitación de las devoluciones y reembolsos, previa:"
  options:
  - id: a
    text:
      es: "resolución motivada del órgano competente para tramitarlos."
  - id: b
    text:
      es: "comunicación a la Administración con diez días de antelación."
  - id: c
    text:
      es: "adhesión individual al acuerdo de colaboración suscrito."
  - id: d
    correct: true
    text:
      es: "autorización de los obligados tributarios."
  explanation:
    es: "La letra g) del artículo 92.3 condiciona esa información a la previa autorización de los obligados tributarios. La resolución motivada, el preaviso de diez días y la adhesión individual al acuerdo, que regula el artículo 79.2 del reglamento, no son los requisitos que fija la ley."
  citation: "art. 92.3 LGT"
  difficulty: 2
  tags:
  - "colaboración social"
  - "autorización"
# anchor: boe-a-2003-23186-art-92
- id: m03-l05-q0064
  prompt:
    es: "De acuerdo con el artículo 92.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale cuál de los siguientes aspectos de la colaboración social NO exige la previa autorización de los obligados tributarios:"
  options:
  - id: a
    text:
      es: "La subsanación de defectos de documentos presentados por los obligados."
  - id: b
    text:
      es: "La presentación y remisión a la Administración de autoliquidaciones, declaraciones o comunicaciones."
  - id: c
    correct: true
    text:
      es: "Las campañas de información y difusión."
  - id: d
    text:
      es: "La información del estado de tramitación de las devoluciones y reembolsos."
  explanation:
    es: "Solo los aspectos de las letras e) a h) del artículo 92.3 requieren autorización: presentar y remitir documentos, subsanar defectos, informar del estado de las devoluciones y solicitar certificados. Las campañas de información y difusión son de la letra b) y no la requieren."
  citation: "art. 92.3 LGT"
  difficulty: 3
  tags:
  - "colaboración social"
  - "autorización"
  - "negativa"
# anchor: boe-a-2003-23186-art-92
- id: m03-l05-q0065
  prompt:
    es: "¿Qué requisito debe cumplir una asociación de asesores fiscales con acuerdo de colaboración social para presentar la autoliquidación de un cliente en nombre de este, según el artículo 92.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Obtener una resolución expresa del Director General de la Agencia Estatal de Administración Tributaria."
  - id: b
    text:
      es: "Ninguno, porque el acuerdo firmado con la Administración cubre la presentación por cuenta de los clientes."
  - id: c
    text:
      es: "Que el cliente se haya adherido individualmente al acuerdo de colaboración social."
  - id: d
    correct: true
    text:
      es: "Contar con la previa autorización del obligado tributario al que se refiere la autoliquidación."
  explanation:
    es: "La presentación y remisión de autoliquidaciones es un aspecto de la colaboración social que exige previa autorización del obligado (art. 92.3.e). No hace falta resolución del Director General, el acuerdo no sustituye esa autorización y la adhesión individual del artículo 79.2 del reglamento es cosa de los colegiados y asociados, no de los clientes."
  citation: "art. 92.3 LGT"
  difficulty: 2
  tags:
  - "colaboración social"
  - "autorización"
# anchor: boe-a-2003-23186-art-92
- id: m03-l05-q0066
  prompt:
    es: "¿Mediante la utilización de qué técnicas y medios podrá la Administración tributaria señalar requisitos y condiciones para la colaboración social, según el artículo 92.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Entidades colaboradoras en la gestión recaudatoria."
  - id: b
    text:
      es: "Convenios con las comunidades autónomas y las entidades locales."
  - id: c
    correct: true
    text:
      es: "Técnicas y medios electrónicos, informáticos y telemáticos."
  - id: d
    text:
      es: "Oficinas presenciales de atención al contribuyente."
  explanation:
    es: "El artículo 92.4 permite fijar requisitos para la colaboración por medios electrónicos, informáticos y telemáticos. Las entidades colaboradoras, los convenios con otras Administraciones y las oficinas presenciales no son el objeto de ese apartado."
  citation: "art. 92.4 LGT"
  difficulty: 1
  tags:
  - "colaboración social"
  - "medios"
# anchor: boe-a-2007-15984-art-79
- id: m03-l05-q0070
  prompt:
    es: "Conforme al artículo 79.2 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, los acuerdos de colaboración social firmados con instituciones y organizaciones pueden extender sus efectos a sus colegiados, asociados o miembros que:"
  options:
  - id: a
    correct: true
    text:
      es: "suscriban un documento individualizado de adhesión al acuerdo."
  - id: b
    text:
      es: "comuniquen su voluntad a la Administración mediante una declaración censal."
  - id: c
    text:
      es: "obtengan la autorización del Director General de la Agencia Tributaria."
  - id: d
    text:
      es: "se encuentren al corriente de sus obligaciones tributarias."
  explanation:
    es: "Los colegiados o asociados quedan comprendidos cuando suscriben un documento individualizado de adhesión (art. 79.2). La declaración censal, la autorización del Director General y estar al corriente de las obligaciones no sustituyen esa adhesión."
  citation: "art. 79.2 RGAT"
  difficulty: 2
  tags:
  - "colaboración social"
  - "adhesión"
# anchor: boe-a-2007-15984-art-79
- id: m03-l05-q0071
  prompt:
    es: "Conforme al artículo 79.2 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿vincula el acuerdo de colaboración social firmado por el colegio profesional de registradores a un registrador colegiado que no ha suscrito ningún documento individual de adhesión?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque el acuerdo de las organizaciones corporativas de registradores vincula a todos los colegiados sin adhesión individualizada."
  - id: b
    text:
      es: "No, porque todo colegiado debe suscribir un documento individualizado de adhesión para quedar vinculado."
  - id: c
    text:
      es: "Sí, pero solo si el registrador se encuentra en ejercicio en el territorio de la Administración firmante."
  - id: d
    text:
      es: "No, salvo que el acuerdo se publique en el «Boletín Oficial del Estado» con su nombre."
  explanation:
    es: "Los acuerdos de las organizaciones corporativas de notarios y registradores vinculan a todos los profesionales colegiados sin adhesión individualizada (art. 79.2). La adhesión es la regla para los demás colegios y asociaciones. El territorio y la publicación nominal no condicionan el efecto."
  citation: "art. 79.2 RGAT"
  difficulty: 3
  tags:
  - "colaboración social"
  - "adhesión"
# anchor: boe-a-2007-15984-art-79
- id: m03-l05-q0074
  prompt:
    es: "Conforme al artículo 79.1.c) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos, tendrán especial consideración a efectos de la colaboración social:"
  options:
  - id: a
    text:
      es: "las entidades que tengan la condición de colaboradoras en la gestión recaudatoria."
  - id: b
    correct: true
    text:
      es: "los colegios y asociaciones de profesionales de la asesoría fiscal."
  - id: c
    text:
      es: "las organizaciones empresariales de ámbito estatal y las cámaras de comercio."
  - id: d
    text:
      es: "las personas o entidades cuya red comercial ayude a los fines de la Administración."
  explanation:
    es: "La especial consideración se reserva a los colegios y asociaciones de profesionales de la asesoría fiscal (art. 79.1.c). Las entidades colaboradoras en la recaudación y las personas con red comercial útil son otros sujetos de la lista, sin esa consideración, y las organizaciones empresariales y cámaras no la reciben."
  citation: "art. 79.1 RGAT"
  difficulty: 2
  tags:
  - "colaboración social"
  - "sujetos"
# anchor: boe-a-2007-15984-art-79
- id: m03-l05-q0136
  prompt:
    es: "Según el artículo 79.1.c) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, entre las instituciones y organizaciones representativas con las que pueden celebrarse acuerdos de colaboración social se entienden incluidas las organizaciones corporativas de:"
  options:
  - id: a
    text:
      es: "las profesiones con colegiación voluntaria y sin título oficial."
  - id: b
    correct: true
    text:
      es: "las profesiones oficiales colegiadas."
  - id: c
    text:
      es: "las profesiones técnicas exclusivamente, no las jurídicas."
  - id: d
    text:
      es: "las profesiones jurídicas exclusivamente, no las técnicas."
  explanation:
    es: "La letra c) incluye expresamente a las organizaciones corporativas de las profesiones oficiales colegiadas. No se limita a las técnicas o jurídicas ni a las de colegiación voluntaria."
  citation: "art. 79.1 RGAT"
  difficulty: 2
  tags:
  - "colaboración social"
  - "sujetos"
# anchor: boe-a-2003-23186-art-95
- id: m03-l05-q0075
  prompt:
    es: "De acuerdo con el artículo 95.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los datos, informes o antecedentes obtenidos por la Administración tributaria tienen carácter reservado y solo podrán ser utilizados para:"
  options:
  - id: a
    text:
      es: "la efectiva aplicación de los tributos y cualquier otra función que la Administración tributaria considere necesaria en su gestión y organización interna."
  - id: b
    text:
      es: "la aplicación de los tributos cuya gestión tenga encomendada, sin que puedan utilizarse para imponer sanciones."
  - id: c
    text:
      es: "la aplicación de cualquier tributo o recurso público, con independencia de la Administración que lo gestione."
  - id: d
    correct: true
    text:
      es: "la efectiva aplicación de los tributos o recursos cuya gestión tenga encomendada y para la imposición de las sanciones que procedan."
  explanation:
    es: "Los datos solo sirven para aplicar los tributos o recursos cuya gestión tiene encomendada la Administración y para imponer las sanciones que procedan. No amparan otras funciones a juicio de la Administración, tampoco excluyen las sanciones y no se extienden a tributos que gestione otra Administración."
  citation: "art. 95.1 LGT"
  difficulty: 2
  tags:
  - "carácter reservado"
  - "uso"
# anchor: boe-a-2003-23186-art-95
- id: m03-l05-q0076
  prompt:
    es: "Según el artículo 95.1.a) de la Ley 58/2003, de 17 de diciembre, General Tributaria, los datos reservados pueden cederse a los órganos jurisdiccionales y al Ministerio Fiscal para investigar delitos que no sean perseguibles únicamente a instancia de:"
  options:
  - id: a
    correct: true
    text:
      es: "persona agraviada, con independencia de su gravedad."
  - id: b
    text:
      es: "la Hacienda Pública, cuando exista una deuda tributaria superior a 120.000 euros."
  - id: c
    text:
      es: "la Agencia Estatal de Administración Tributaria, mediante querella ante el juzgado."
  - id: d
    text:
      es: "un obligado tributario, cuando este haya presentado la denuncia correspondiente."
  explanation:
    es: "La letra a) permite la cesión para delitos que no sean perseguibles únicamente a instancia de persona agraviada. La cuantía de la deuda, la querella de la Agencia y la denuncia del obligado no figuran en esa condición."
  citation: "art. 95.1 LGT"
  difficulty: 2
  tags:
  - "carácter reservado"
  - "cesión"
# anchor: boe-a-2003-23186-art-95
- id: m03-l05-q0077
  prompt:
    es: "¿A cuál de los siguientes destinatarios pueden cederse los datos con trascendencia tributaria, según la lista cerrada del artículo 95.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "A una entidad financiera que vaya a conceder un préstamo al obligado tributario."
  - id: b
    text:
      es: "A un colegio profesional que desee controlar la actividad de sus colegiados."
  - id: c
    correct: true
    text:
      es: "A las comisiones parlamentarias de investigación, en el marco legalmente establecido."
  - id: d
    text:
      es: "A los medios de comunicación, para divulgar la situación de los grandes deudores a la Hacienda."
  explanation:
    es: "La letra e) del artículo 95.1 admite la cesión a las comisiones parlamentarias de investigación en el marco legal. Las entidades financieras, los colegios profesionales y los medios de comunicación no figuran en la lista cerrada de cesiones permitidas, y la publicidad de deudores tiene su propio régimen en el artículo 95 bis."
  citation: "art. 95.1 LGT"
  difficulty: 2
  tags:
  - "carácter reservado"
  - "cesión"
# anchor: boe-a-2003-23186-art-95
- id: m03-l05-q0078
  prompt:
    es: "Conforme al artículo 95.1.b) de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración tributaria puede ceder datos reservados a otras Administraciones tributarias a efectos del cumplimiento de obligaciones fiscales:"
  options:
  - id: a
    text:
      es: "en cualquier ámbito territorial y material."
  - id: b
    correct: true
    text:
      es: "en el ámbito de sus competencias."
  - id: c
    text:
      es: "en el ámbito de las competencias del Estado exclusivamente."
  - id: d
    text:
      es: "en el ámbito de los tributos cedidos a las comunidades autónomas."
  explanation:
    es: "La cesión del artículo 95.1.b) tiene por objeto el cumplimiento de obligaciones fiscales en el ámbito de las competencias de la Administración que recibe los datos. No es ilimitada, no se reserva al Estado y no se restringe a los tributos cedidos."
  citation: "art. 95.1 LGT"
  difficulty: 1
  tags:
  - "carácter reservado"
  - "cesión"
# anchor: boe-a-2003-23186-art-95
- id: m03-l05-q0079
  prompt:
    es: "De acuerdo con el artículo 95.1.c) de la Ley 58/2003, de 17 de diciembre, General Tributaria, la cesión de datos reservados a la Inspección de Trabajo y Seguridad Social y a la Seguridad Social cubre también la determinación del nivel de aportación de cada usuario en las prestaciones:"
  options:
  - id: a
    text:
      es: "del Sistema de Dependencia y atención a la discapacidad."
  - id: b
    text:
      es: "de los servicios sociales de las comunidades autónomas."
  - id: c
    text:
      es: "del Servicio Público de Empleo Estatal por desempleo."
  - id: d
    correct: true
    text:
      es: "del Sistema Nacional de Salud."
  explanation:
    es: "El artículo 95.1.c) añade la determinación del nivel de aportación de cada usuario en las prestaciones del Sistema Nacional de Salud. Las prestaciones de dependencia, los servicios sociales autonómicos y las de desempleo no se mencionan."
  citation: "art. 95.1 LGT"
  difficulty: 2
  tags:
  - "carácter reservado"
  - "cesión"
# anchor: boe-a-2003-23186-art-95
- id: m03-l05-q0080
  prompt:
    es: "Según el artículo 95.1.d) de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración tributaria puede ceder datos reservados a otras Administraciones públicas para la prevención y lucha contra el delito fiscal y contra el fraude en la obtención de:"
  options:
  - id: a
    text:
      es: "bonificaciones o deducciones fiscales a cargo de los presupuestos del Estado."
  - id: b
    text:
      es: "prestaciones del sistema de la Seguridad Social por desempleo o incapacidad."
  - id: c
    correct: true
    text:
      es: "ayudas o subvenciones a cargo de fondos públicos o de la Unión Europea."
  - id: d
    text:
      es: "licencias o autorizaciones administrativas concedidas por las entidades locales."
  explanation:
    es: "La letra d) habla del fraude en la obtención o percepción de ayudas o subvenciones a cargo de fondos públicos o de la Unión Europea. Las deducciones fiscales, las prestaciones de Seguridad Social, que tienen su propia letra c), y las licencias locales no aparecen en ella."
  citation: "art. 95.1 LGT"
  difficulty: 1
  tags:
  - "carácter reservado"
  - "cesión"
# anchor: boe-a-2003-23186-art-95
- id: m03-l05-q0081
  prompt:
    es: "Conforme al artículo 95.1.f) de la Ley 58/2003, de 17 de diciembre, General Tributaria, los datos reservados pueden cederse para la protección de los derechos e intereses de los menores e incapacitados por:"
  options:
  - id: a
    text:
      es: "los servicios sociales de las comunidades autónomas o las entidades locales."
  - id: b
    text:
      es: "el Defensor del Pueblo o los defensores autonómicos."
  - id: c
    text:
      es: "las entidades gestoras de la Seguridad Social."
  - id: d
    correct: true
    text:
      es: "los órganos jurisdiccionales o el Ministerio Fiscal."
  explanation:
    es: "La letra f) designa a los órganos jurisdiccionales o el Ministerio Fiscal como quienes protegen los derechos e intereses de menores e incapacitados. Los servicios sociales, los defensores del pueblo y las entidades gestoras de la Seguridad Social no son destinatarios que prevea esa letra."
  citation: "art. 95.1 LGT"
  difficulty: 2
  tags:
  - "carácter reservado"
  - "cesión"
# anchor: boe-a-2003-23186-art-95
- id: m03-l05-q0082
  prompt:
    es: "De acuerdo con el artículo 95.1.g) de la Ley 58/2003, de 17 de diciembre, General Tributaria, la cesión de datos reservados al Tribunal de Cuentas se justifica por su colaboración en el ejercicio de sus funciones de fiscalización de:"
  options:
  - id: a
    text:
      es: "todos los obligados tributarios con deudas pendientes."
  - id: b
    text:
      es: "las comunidades autónomas que gestionen tributos cedidos."
  - id: c
    text:
      es: "las entidades colaboradoras en la gestión recaudatoria."
  - id: d
    correct: true
    text:
      es: "la Agencia Estatal de Administración Tributaria."
  explanation:
    es: "La letra g) vincula la cesión al Tribunal de Cuentas con la fiscalización de la propia Agencia Estatal de Administración Tributaria. No se extiende a los obligados con deudas, a las comunidades ni a las entidades colaboradoras."
  citation: "art. 95.1 LGT"
  difficulty: 1
  tags:
  - "carácter reservado"
  - "cesión"
# anchor: boe-a-2003-23186-art-95
- id: m03-l05-q0084
  prompt:
    es: "Según el artículo 95.1.i) de la Ley 58/2003, de 17 de diciembre, General Tributaria, los datos reservados pueden cederse al Servicio Ejecutivo de la Comisión de Prevención del Blanqueo de Capitales e Infracciones Monetarias y a la Comisión de Vigilancia de:"
