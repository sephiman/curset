  - id: d
    text:
      es: "Un año o dos años."
  explanation:
    es: "Para el empresario cuyo volumen de operaciones del año anterior no excedió de 6.010.121,04 euros, el plazo de la primera condición puede ser de seis meses o un año. La regla general es de un año, y los demás períodos no figuran en el precepto."
