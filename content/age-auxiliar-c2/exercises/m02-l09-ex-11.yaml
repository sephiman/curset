# anchor: fuente-ms-excel-funcion-sumar-si-conjunto-html
- id: m02-l09-q291
  prompt:
    es: "En el programa de hojas de cálculo Microsoft Excel 365, ¿cuál de las siguientes afirmaciones describe lo que hace la función SUMAR.SI.CONJUNTO?"
  options:
  - id: a
    correct: true
    text:
      es: "Suma los valores de un rango que cumplen varios criterios"
  - id: b
    text:
      es: "Suma los valores que cumplen un solo criterio"
  - id: c
    text:
      es: "Cuenta las celdas que cumplen varios criterios"
  - id: d
    text:
      es: "Calcula el promedio de las celdas que cumplen varios criterios"
  explanation:
    es: "La página dice que SUMAR.SI.CONJUNTO, una función matemática y trigonométrica, agrega los argumentos que cumplen varios criterios. «Suma los valores que cumplen un solo criterio»: esa es la tarea de SUMAR.SI. «Cuenta las celdas que cumplen varios criterios»: esa es la tarea de CONTAR.SI.CONJUNTO. «Calcula el promedio de las celdas que cumplen varios criterios»: esa es la tarea de PROMEDIO.SI.CONJUNTO."
  citation: "fuente: `ms-excel-funcion-sumar-si-conjunto.html`; «Descripción»"
  difficulty: 1
  tags:
  - "función"
# anchor: fuente-ms-excel-funcion-sumar-si-conjunto-html
- id: m02-l09-q292
  prompt:
    es: "Al trabajar con una hoja de cálculo de Microsoft Excel 365, ¿cuál de las siguientes opciones es el primer argumento de SUMAR.SI.CONJUNTO?"
  options:
  - id: a
    text:
      es: "núm_decimales"
  - id: b
    text:
      es: "rango_criterios1"
  - id: c
    text:
      es: "criterios1"
  - id: d
    correct: true
    text:
      es: "rango_suma"
  explanation:
    es: "La sintaxis de la página empieza por rango_suma, el rango de celdas que se suman. «rango_criterios1»: es el segundo argumento, el rango que se prueba con criterios1. «criterios1»: es el tercer argumento, la condición que se aplica al rango de criterios. «núm_decimales»: no es un argumento de esta función; es de TRUNCAR."
  citation: "fuente: `ms-excel-funcion-sumar-si-conjunto.html`; «Sintaxis»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-excel-funcion-sumar-si-conjunto-html
- id: m02-l09-q294
  prompt:
    es: "En una hoja de cálculo de Microsoft Excel 365 para Windows, ¿cuántos pares de rango y criterios admite como máximo SUMAR.SI.CONJUNTO?"
  options:
  - id: a
    correct: true
    text:
      es: "127"
  - id: b
    text:
      es: "30"
  - id: c
    text:
      es: "64"
  - id: d
    text:
      es: "255"
  explanation:
    es: "La página dice que se pueden introducir hasta 127 pares de rango y criterios. «255»: 255 es el máximo de argumentos de CONTARA y de condiciones de O. «64»: 64 es el máximo de SI anidadas. «30»: la página da 127 pares."
  citation: "fuente: `ms-excel-funcion-sumar-si-conjunto.html`; «Sintaxis»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-excel-funcion-sumar-si-conjunto-html
- id: m02-l09-q295
  prompt:
    es: "En Excel 365, A2:A5 contiene 5, 4, 15 y 3, B2:B5 contiene Manzanas, Manzanas, Alcachofas y Alcachofas, y C2:C5 contiene Juan, Leticia, Juan y Leticia. ¿Qué devuelve =SUMAR.SI.CONJUNTO(A2:A5;B2:B5;\"Manzanas\";C2:C5;\"Juan\")?"
  options:
  - id: a
    text:
      es: "20"
  - id: b
    correct: true
    text:
      es: "5"
  - id: c
    text:
      es: "27"
  - id: d
    text:
      es: "9"
  explanation:
    es: "Solo la fila inicial cumple los dos criterios, manzanas y Juan, así que se suma 5. «9»: sumaría todas las manzanas, sin exigir que el vendedor sea Juan. «20»: sumaría todo lo vendido por Juan, sin exigir que el producto sea manzanas. «27»: sumaría los cuatro valores, sin aplicar los criterios."
  citation: "fuente: `ms-excel-funcion-sumar-si-conjunto.html`; «Ejemplos»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-sumar-si-conjunto-html
- id: m02-l09-q296
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes caracteres comodín de los criterios de SUMAR.SI.CONJUNTO reemplaza cualquier carácter individual?"
  options:
  - id: a
    text:
      es: "La tilde (~)"
  - id: b
    text:
      es: "El signo de dólar ($), que fija una referencia"
  - id: c
    text:
      es: "El asterisco (*)"
  - id: d
    correct: true
    text:
      es: "El signo de interrogación (?)"
  explanation:
    es: "La página dice que el signo de interrogación reemplaza cualquier carácter individual, y el asterisco cualquier secuencia. «El asterisco (*)»: el asterisco reemplaza cualquier secuencia de caracteres. «La tilde (~)»: la tilde se escribe delante de ? o * para buscar el carácter real. «El signo de dólar ($), que fija una referencia»: el signo de dólar no es comodín; fija referencias absolutas."
  citation: "fuente: `ms-excel-funcion-sumar-si-conjunto.html`; «Prácticas recomendadas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-funcion-regexprueba-html
- id: m02-l09-q297
  prompt:
    es: "En Excel 365, ¿qué devuelve REGEXPRUEBA si ninguna parte del texto coincide con la expresión regular?"
  options:
  - id: a
    text:
      es: "#N/D"
  - id: b
    correct: true
    text:
      es: "FALSO"
  - id: c
    text:
      es: "VERDADERO"
  - id: d
    text:
      es: "Texto vacío"
  explanation:
    es: "La página dice que REGEXPRUEBA devuelve VERDADERO si hay una coincidencia y FALSO si no la hay. «VERDADERO»: se devuelve cuando alguna parte del texto coincide. «Texto vacío»: la función devuelve valores lógicos, no texto. «#N/D»: la función no devuelve #N/D cuando no hay coincidencia, sino FALSO."
  citation: "fuente: `ms-excel-funcion-regexprueba.html`; «Función REGEXPRUEBA»"
  difficulty: 1
  tags:
  - "función"
# anchor: fuente-ms-excel-funcion-regexprueba-html
- id: m02-l09-q298
  prompt:
    es: "Al trabajar con una hoja de cálculo de Microsoft Excel 365, A2 contiene Alfalfa. ¿Qué devuelve =REGEXPRUEBA(A2;\"[0-9]\")?"
  options:
  - id: a
    text:
      es: "0"
  - id: b
    text:
      es: "VERDADERO"
  - id: c
    text:
      es: "Alfalfa"
  - id: d
    correct: true
    text:
      es: "FALSO"
  explanation:
    es: "El patrón [0-9] busca cualquier dígito y Alfalfa no tiene ninguno. «VERDADERO»: Alfalfa no contiene ningún dígito. «0»: la función devuelve un valor lógico, no un número. «Alfalfa»: la función devuelve un valor lógico, no el texto."
  citation: "fuente: `ms-excel-funcion-regexprueba.html`; «Sintaxis»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-regexprueba-html
- id: m02-l09-q299
  prompt:
    es: "Según la ayuda de Microsoft para Microsoft Excel 365, A2 contiene Alfalfa. ¿Qué devuelve =REGEXPRUEBA(A2;\"[aeiou]\")?"
  options:
  - id: a
    text:
      es: "a"
  - id: b
    text:
      es: "FALSO"
  - id: c
    correct: true
    text:
      es: "VERDADERO"
  - id: d
    text:
      es: "4"
  explanation:
    es: "El patrón [aeiou] coincide con cualquier vocal minúscula y Alfalfa contiene varias a. «FALSO»: Alfalfa contiene la vocal a. «4»: la función devuelve un valor lógico, no un recuento. «a»: la función devuelve un valor lógico, no la letra."
  citation: "fuente: `ms-excel-funcion-regexprueba.html`; «Ejemplo 1»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-regexprueba-html
- id: m02-l09-q300
  prompt:
    es: "En una hoja de cálculo de Microsoft Excel 365 para Windows, ¿cuál de las siguientes opciones describe cómo distingue por defecto REGEXPRUEBA las mayúsculas de las minúsculas?"
  options:
  - id: a
    text:
      es: "Distingue solo las mayúsculas del patrón"
  - id: b
    text:
      es: "Depende del idioma de Excel"
  - id: c
    correct: true
    text:
      es: "La coincidencia distingue mayúsculas de minúsculas"
  - id: d
    text:
      es: "La coincidencia no distingue mayúsculas de minúsculas"
  explanation:
    es: "La página dice que, de forma predeterminada, la coincidencia distingue mayúsculas de minúsculas. «La coincidencia no distingue mayúsculas de minúsculas»: esa coincidencia se obtiene al escribir 1 en case_sensitivity. «Distingue solo las mayúsculas del patrón»: la página dice que la coincidencia distingue mayúsculas de minúsculas en todo el patrón. «Depende del idioma de Excel»: la página fija el valor predeterminado, que distingue."
  citation: "fuente: `ms-excel-funcion-regexprueba.html`; «Sintaxis»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-funcion-regexprueba-html
- id: m02-l09-q301
  prompt:
    es: "Con Microsoft Excel 365 abierto en un equipo con Windows 11, A2 contiene Alfalfa. ¿Qué devuelve =REGEXPRUEBA(A2;\"alfalfa\";1)?"
  options:
  - id: a
    text:
      es: "FALSO"
  - id: b
    text:
      es: "1"
  - id: c
    text:
      es: "#¡VALOR!"
  - id: d
    correct: true
    text:
      es: "VERDADERO"
  explanation:
    es: "Con case_sensitivity 1 no se distingue entre mayúsculas y minúsculas, así que alfalfa coincide con Alfalfa. «FALSO»: con 1 en case_sensitivity no se distinguen mayúsculas de minúsculas. «1»: la función devuelve un valor lógico, y 1 es el argumento. «#¡VALOR!»: el tercer argumento 1 es válido."
  citation: "fuente: `ms-excel-funcion-regexprueba.html`; «Sintaxis»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m02-l09-q343
  prompt:
    es: "Con Microsoft Excel 365 abierto en un equipo con Windows 11, ¿cuál de los siguientes nombres NO es válido para una tabla?"
  options:
  - id: a
    correct: true
    text:
      es: "Primer trimestre"
  - id: b
    text:
      es: "Primer.Trimestre"
  - id: c
    text:
      es: "Impuesto_Ventas"
  - id: d
    text:
      es: "DeptVentas"
  explanation:
    es: "La página dice que los nombres de tabla no pueden tener espacios y propone el punto y el subrayado como separadores. «Primer.Trimestre»: el punto es válido como separador de palabras. «DeptVentas»: es el nombre de ejemplo que usa la página. «Impuesto_Ventas»: el carácter de subrayado es válido como separador."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «¿Cómo puedo cambiar un nombre de tabla?»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m02-l09-q344
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes especificadores de elemento de una referencia estructurada hace referencia a la fila de totales de la tabla?"
  options:
  - id: a
    text:
      es: "#Encabezados"
  - id: b
    text:
      es: "#Datos"
  - id: c
    correct: true
    text:
      es: "#Totales"
  - id: d
    text:
      es: "#Todo"
  explanation:
    es: "La página da [#Totales] como el especificador de elemento de la fila Totales; [#Datos] hace referencia a los datos. «#Datos»: hace referencia a los datos de la tabla, sin encabezados ni totales. «#Encabezados»: hace referencia a la fila de encabezado de la tabla. «#Todo»: la página usa #Totales para la fila de totales."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «Reglas de sintaxis de las referencias estructuradas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m02-l09-q345
  prompt:
    es: "En Excel 365, un encabezado de columna contiene caracteres especiales, como en «Total $ Cantidad». ¿Cómo se escribe en una referencia estructurada?"
  options:
  - id: a
    correct: true
    text:
      es: "Con corchetes dobles, como =Resumen[[Total $ Cantidad]]"
  - id: b
    text:
      es: "Entre comillas, como =Resumen[\"Total $ Cantidad\"]"
  - id: c
    text:
      es: "Con un solo corchete, como =Resumen[Total $ Cantidad], sin más signos"
  - id: d
    text:
      es: "Con llaves, como =Resumen{Total $ Cantidad}"
  explanation:
    es: "La página dice que, si el encabezado tiene caracteres especiales, todo el encabezado debe ir entre corchetes, lo que obliga a corchetes dobles. «Entre comillas, como =Resumen[\"Total $ Cantidad\"]»: la página pide encerrar el encabezado entre corchetes, no entre comillas. «Con un solo corchete, como =Resumen[Total $ Cantidad], sin más signos»: con caracteres especiales la página exige corchetes dobles. «Con llaves, como =Resumen{Total $ Cantidad}»: la página usa corchetes, no llaves."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «Reglas de sintaxis de las referencias estructuradas»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-excel-atajos-html
- id: m02-l09-q351
  prompt:
    es: "En Excel 365 configurado en español, ¿cuál de los siguientes métodos abreviados calcula la hoja de cálculo activa?"
  options:
  - id: a
    text:
      es: "F9"
  - id: b
    text:
      es: "Ctrl+Alt+F9"
  - id: c
    correct: true
    text:
      es: "Mayús+F9"
  - id: d
    text:
      es: "Ctrl+F5"
  explanation:
    es: "La página da Mayús+F9 para calcular la hoja de cálculo activa. «F9»: calcula todas las hojas de todos los libros abiertos. «Ctrl+Alt+F9»: calcula todas las hojas de todos los libros, hayan cambiado o no. «Ctrl+F5»: actualiza los datos externos de la hoja de cálculo actual."
  citation: "fuente: `ms-excel-atajos.html`; «Métodos abreviados de teclado para trabajar con datos, funciones y la barra de fórmulas»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-atajos-html
- id: m02-l09-q352
  prompt:
    es: "Al trabajar con una hoja de cálculo de Microsoft Excel 365 configurado en español, ¿cuál de los siguientes métodos abreviados inserta la fórmula Suma?"
  options:
  - id: a
    text:
      es: "Alt+F8"
  - id: b
    text:
      es: "Ctrl+Mayús+signo más (+)"
  - id: c
    correct: true
    text:
      es: "Alt+signo igual (=)"
  - id: d
    text:
      es: "Mayús+F3"
  explanation:
    es: "La página da Alt+signo igual (=) para insertar la fórmula Suma. «Mayús+F3»: inserta una función. «Ctrl+Mayús+signo más (+)»: abre el cuadro de diálogo Insertar para insertar celdas en blanco. «Alt+F8»: permite crear, ejecutar, editar o eliminar una macro."
  citation: "fuente: `ms-excel-atajos.html`; «Métodos abreviados de teclado para trabajar con datos, funciones y la barra de fórmulas»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q358
  prompt:
    es: "En el programa de hojas de cálculo Microsoft Excel 365, ¿cuál de las siguientes funciones redondea un número hacia abajo, hacia el cero, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "REDONDEAR.MENOS"
  - id: b
    text:
      es: "REDONDEA.IMPAR"
  - id: c
    text:
      es: "REDONDEA.PAR"
  - id: d
    text:
      es: "REDONDEAR.MAS"
  explanation:
    es: "La lista por categoría dice que REDONDEAR.MENOS redondea un número hacia abajo, hacia el cero. REDONDEA.IMPAR lo redondea hasta el entero impar más próximo. REDONDEAR.MAS lo redondea hacia arriba, en dirección contraria a cero. REDONDEA.PAR lo redondea hasta el entero par más próximo."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones matemáticas y trigonométricas»"
  difficulty: 3
  tags:
  - "función"
# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q361
  prompt:
    es: "Señale la función de Microsoft Excel 365 que devuelve el promedio de todas las celdas de un rango que cumplen unos criterios determinados:"
  options:
  - id: a
    text:
      es: "CONTAR.SI"
  - id: b
    text:
      es: "PROMEDIO"
  - id: c
    text:
      es: "SUMAR.SI"
  - id: d
    correct: true
    text:
      es: "PROMEDIO.SI"
  explanation:
    es: "La lista por categoría describe PROMEDIO.SI como la función que devuelve el promedio de todas las celdas de un rango que cumplen unos criterios determinados. SUMAR.SI suma las celdas del rango que cumplen los criterios, no calcula su promedio. CONTAR.SI cuenta el número de celdas del rango que cumplen el criterio. PROMEDIO devuelve el promedio de sus argumentos, sin criterios."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones estadísticas»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-excel-prioridad-operadores-html
- id: m02-l09-q363
  prompt:
    es: "En la tabla de prioridad de operadores de Microsoft Excel 365, ¿cuál de los siguientes se evalúa antes que la multiplicación y la división?"
  options:
  - id: a
    text:
      es: "La suma y la resta, que se escriben con los operadores + y -"
  - id: b
    correct: true
    text:
      es: "La exponenciación, que se escribe con el operador ^ (acento circunflejo)"
  - id: c
    text:
      es: "La concatenación, que se escribe con el operador & (ampersand)"
  - id: d
    text:
      es: "La comparación, que se escribe con operadores como = o < >"
  explanation:
    es: "En la tabla de prioridad la exponenciación, con el operador ^, va antes que la multiplicación y la división. La concatenación, con &, está en una fila posterior a la suma y la resta. La suma y la resta están en la fila que sigue a la de la multiplicación y la división, así que se evalúan después. Los operadores de comparación son los últimos de la tabla."
  citation: "fuente: `ms-excel-prioridad-operadores.html`; «Prioridad de operadores»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q364
  prompt:
    es: "En el programa de hojas de cálculo Microsoft Excel 365, ¿cuál de las siguientes afirmaciones describe lo que hace la función SUMA?"
  options:
  - id: a
    text:
      es: "Cuenta cuántos números hay en la lista de argumentos"
  - id: b
    text:
      es: "Devuelve el valor máximo de una lista de argumentos"
  - id: c
    text:
      es: "Devuelve el valor mínimo de una lista de argumentos"
  - id: d
    correct: true
    text:
      es: "Agrega los valores de las celdas de una lista de argumentos"
  explanation:
    es: "La lista por categoría dice que SUMA sirve para agregar los valores de las celdas. MAX devuelve el valor máximo de una lista de argumentos. CONTAR cuenta cuántos números hay en la lista de argumentos. MIN devuelve el valor mínimo de una lista de argumentos."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones matemáticas y trigonométricas»"
  difficulty: 1
  tags:
  - "función"
# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q366
  prompt:
    es: "En Microsoft Excel 365, ¿cuál de las siguientes afirmaciones describe lo que devuelve la función AHORA?"
  options:
  - id: a
    text:
      es: "El número de serie correspondiente al día actual"
  - id: b
    text:
      es: "El número de serie correspondiente a una hora determinada"
  - id: c
    text:
      es: "El número de serie correspondiente a una fecha determinada"
  - id: d
    correct: true
    text:
      es: "El número de serie correspondiente a la fecha y hora actuales"
  explanation:
    es: "La lista por categoría dice que AHORA devuelve el número de serie correspondiente a la fecha y hora actuales. FECHA devuelve el número de serie correspondiente a una fecha determinada. HORA devuelve el de una hora determinada. HOY devuelve el correspondiente al día actual, sin la hora."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones de fecha y hora»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q369
  prompt:
    es: "Al trabajar con una hoja de cálculo de Microsoft Excel 365, ¿cuál de las siguientes afirmaciones describe lo que hace la función CONTAR.SI?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuenta el número de celdas, dentro del rango, que cumplen el criterio especificado"
  - id: b
    text:
      es: "Devuelve el promedio de las celdas de un rango que cumplen unos criterios"
  - id: c
    text:
      es: "Suma las celdas del rango que cumplen los criterios especificados"
  - id: d
    text:
      es: "Cuenta el número de celdas del rango que cumplen varios criterios"
  explanation:
