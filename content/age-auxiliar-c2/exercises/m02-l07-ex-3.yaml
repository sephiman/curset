    es: "Flecha derecha muestra la selección si está contraída o selecciona su primera subcarpeta. Contraer la selección es Flecha izquierda, expandir todo el árbol es Ctrl+Mayús+E e ir a la carpeta siguiente es Alt+Flecha derecha."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
