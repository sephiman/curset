# anchor: fuente-ms-entra-mfa-html
- id: m02-l05-q050
  prompt:
    es: "¿Cuál de las siguientes series recoge los tres tipos de factor de la autenticación multifactor de Microsoft Entra?"
  options:
  - id: a
    text:
      es: "Algo que sabes, algo que firmas y algo que eres."
  - id: b
    correct: true
    text:
      es: "Algo que sabes, algo que tienes y algo que eres."
  - id: c
    text:
      es: "Algo que sabes, algo que tienes y algo que ves."
  - id: d
    text:
      es: "Algo que usas, algo que tienes y algo que eres."
  explanation:
    es: "La página de Microsoft Entra enumera tres métodos: algo que tú sabes, normalmente una contraseña; algo que tiene, como un teléfono o una clave de hardware; y algo que eres, biometría como una huella digital o un escaneo facial. La serie con «algo que firmas» cambia el segundo método y la de «algo que ves» cambia el tercero, y ninguno aparece en la lista de la página. La serie con «algo que usas» sustituye al primero, que la página define como algo que sabes."
  citation: "fuente: `ms-entra-mfa.html`; «El funcionamiento de la autenticación multifactor de Microsoft Entra se basa en exigir uno o varios de los siguientes métodos de autenticación:»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-firewall-html
- id: m02-l05-q051
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes series recoge los tres perfiles de red que se pueden seleccionar en el Firewall de Windows?"
  options:
  - id: a
    correct: true
    text:
      es: "Red de dominio, red privada y red pública."
  - id: b
    text:
      es: "Red de dominio, red doméstica y red pública."
  - id: c
    text:
      es: "Red corporativa, red privada y red pública."
  - id: d
    text:
      es: "Red de dominio, red privada y red de invitados."
  explanation:
    es: "La página de Seguridad de Windows dice: «Selecciona un perfil de red: Red de dominio, Red privada, o Red pública». La serie con «red doméstica» cambia el perfil de red privada, que es el que la página ilustra con la red doméstica como ejemplo. La serie con «red corporativa» cambia el perfil de red de dominio, y la de «red de invitados» sustituye al perfil de red pública. Ninguno de esos tres nombres es un perfil de la página."
  citation: "fuente: `ms-win-firewall.html`; «Selecciona un perfil de red: Red de dominio, Red privada, o Red pública.»"
  difficulty: 2
  tags:
  - "concepto"
  - "configuración"
# anchor: fuente-ms-win-update-html
- id: m02-l05-q053
  prompt:
    es: "En Windows 11, ¿qué ocurre cuando se alcanza el límite de pausa de las actualizaciones de Windows Update?"
  options:
  - id: a
    text:
      es: "La pausa se renueva sola otro periodo igual sin instalar nada."
  - id: b
    correct: true
    text:
      es: "Hay que instalar las últimas actualizaciones para poder volver a pausarlas."
  - id: c
    text:
      es: "Windows Update se desactiva de forma permanente en el dispositivo."
  - id: d
    text:
      es: "Las actualizaciones pendientes se eliminan y dejan de ofrecerse."
  explanation:
    es: "La página de Windows Update dice que, una vez alcanzado el límite de pausa, hay que instalar las últimas actualizaciones para poder volver a pausarlas. La renovación automática de la pausa sin instalar nada contradice esa frase. Que Windows Update se desactive de forma permanente o que se eliminen las pendientes contradice la página, que dice que las actualizaciones no se pueden detener por completo y que finalmente será necesario descargarlas e instalarlas."
  citation: "fuente: `ms-win-update.html`; «Ten en cuenta que una vez que se alcance el límite de pausa, tendrás que instalar las últimas actualizaciones para poder volver a pausar las actualizaciones.»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-entra-mfa-html
- id: m02-l05-q054
  prompt:
    es: "¿Cuál de los siguientes ejemplos corresponde al método «algo que eres» de la autenticación multifactor de Microsoft Entra?"
  options:
  - id: a
    text:
      es: "Una contraseña elegida por el usuario."
  - id: b
    text:
      es: "Un teléfono de confianza del usuario."
  - id: c
    text:
      es: "Una clave de hardware del usuario."
  - id: d
    correct: true
    text:
      es: "Una huella digital del usuario."
  explanation:
    es: "La página define «algo que eres» como «biometría como una huella digital o un escaneo facial». La contraseña es el ejemplo de «algo que tú sabes», y el teléfono y la clave de hardware son ejemplos de «algo que tiene», un dispositivo de confianza que no se puede duplicar con facilidad."
  citation: "fuente: `ms-entra-mfa.html`; «El funcionamiento de la autenticación multifactor de Microsoft Entra se basa en exigir uno o varios de los siguientes métodos de autenticación:»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q143
  prompt:
    es: "¿Qué tipo de malware «secuestra» un dispositivo o la información que contiene, de modo que la víctima no puede acceder a ella si no paga el rescate?"
  options:
  - id: a
    text:
      es: "El spyware."
  - id: b
    correct: true
    text:
      es: "El ransomware."
  - id: c
    text:
      es: "El gusano."
  - id: d
    text:
      es: "El virus."
  explanation:
    es: "El glosario define el ransomware como «malware cuya funcionalidad es secuestrar un dispositivo o la información que contiene de forma que si la víctima no paga el rescate, no podrá acceder a ella». El spyware recopila información de un ordenador y la envía a una entidad remota, sin pedir rescate. El gusano se copia a sí mismo y se propaga automáticamente por la red. El virus infecta ficheros ejecutables o sectores de arranque de dispositivos de almacenamiento."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Ransomware»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q144
  prompt:
    es: "Señale la característica principal de un virus (malware), según el glosario de ciberseguridad del INCIBE:"
  options:
  - id: a
    text:
      es: "Se propaga automáticamente en una red independientemente de la acción humana."
  - id: b
    text:
      es: "Crea una puerta trasera en el equipo infectado para controlarlo a distancia."
  - id: c
    text:
      es: "Recopila información de un ordenador y después la envía a una entidad remota."
  - id: d
    correct: true
    text:
      es: "Infecta ficheros ejecutables o sectores de arranque de dispositivos de almacenamiento."
  explanation:
    es: "El glosario define el virus como «malware que tiene como característica principal que infecta ficheros ejecutables o sectores de arranque de dispositivos de almacenamiento». Propagarse automáticamente por la red sin la acción humana es la característica del gusano. Crear una puerta trasera es lo más común en un troyano. Recopilar información y enviarla a una entidad remota es lo que hace el spyware."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Virus»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q145
  prompt:
    es: "Señale la afirmación correcta sobre cómo se propaga un gusano (worm) de un equipo a otros, según el glosario de ciberseguridad del INCIBE:"
  options:
  - id: a
    text:
      es: "Depende de que un usuario acceda a una web maliciosa o ejecute un fichero infectado."
  - id: b
    correct: true
    text:
      es: "Realiza copias de sí mismo y se propaga automáticamente en una red, sin acción humana."
  - id: c
    text:
      es: "Infecta ficheros ejecutables o sectores de arranque de dispositivos de almacenamiento."
  - id: d
    text:
      es: "Solo mediante adjuntos de correo que el usuario debe abrir uno a uno."
  explanation:
    es: "El glosario dice que «los gusanos realizan copias de sí mismos, infectan a otros ordenadores y se propagan automáticamente en una red independientemente de la acción humana». Depender de que el usuario acceda a una web maliciosa o ejecute un fichero infectado es, según el glosario, propio de los troyanos. Infectar ficheros ejecutables o sectores de arranque es lo propio del virus. Y los gusanos se propagan sin depender de la acción humana, no solo mediante adjuntos que el usuario abra uno a uno."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Gusano»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q146
  prompt:
    es: "¿Qué diferencia a un gusano de un troyano, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    text:
      es: "El gusano infecta sectores de arranque; el troyano se propaga solo por la red."
  - id: b
    text:
      es: "El gusano depende de que el usuario ejecute un fichero; el troyano se propaga solo por la red."
  - id: c
    correct: true
    text:
      es: "El gusano se propaga solo por la red; el troyano depende de que el usuario ejecute un fichero."
  - id: d
    text:
      es: "El gusano no se considera malware, mientras que el troyano sí se considera malware."
  explanation:
    es: "El glosario dice que los troyanos dependen de que un usuario acceda a una web maliciosa o ejecute un fichero infectado, mientras que los gusanos se propagan automáticamente en una red. Infectar sectores de arranque es la característica del virus, y el troyano depende de la acción del usuario. La dependencia de la acción del usuario es la del troyano, no la del gusano. El glosario incluye los gusanos y los troyanos entre los programas maliciosos."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Gusano»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q147
  prompt:
    es: "Según el glosario de ciberseguridad del INCIBE, lo más común que crea un troyano en el equipo infectado es:"
  options:
  - id: a
    correct: true
    text:
      es: "una puerta trasera para descargar actualizaciones y funcionalidades."
  - id: b
    text:
      es: "una copia de sí mismo en cada equipo de la red a la que se conecte."
  - id: c
    text:
      es: "una firma en la base de datos del antivirus, que identifica el malware."
  - id: d
    text:
      es: "una infección del sector de arranque de los dispositivos de almacenamiento."
  explanation:
    es: "El glosario dice que, en un troyano, «lo más común es crear una puerta trasera en el equipo infectado». Hacer copias de sí mismos es lo que, según el glosario, hacen los gusanos. La firma antivirus es una entrada de la base de datos del antivirus que identifica un malware, no algo que cree un troyano. Infectar sectores de arranque es la característica principal del virus."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Troyano»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q148
  prompt:
    es: "Según el glosario de ciberseguridad del INCIBE, ¿cuál de los siguientes tipos de malware representa más del 80 % del malware actual?"
  options:
  - id: a
    text:
      es: "Los virus."
  - id: b
    text:
      es: "Los gusanos."
  - id: c
    correct: true
    text:
      es: "Los troyanos."
  - id: d
    text:
      es: "El ransomware."
  explanation:
    es: "El glosario dice que «la mayor parte del malware actual son troyanos, más del 80 %». El glosario atribuye más del 80 % a los troyanos, no a los virus. El glosario atribuye más del 80 % a los troyanos, no a los gusanos. El glosario atribuye más del 80 % a los troyanos, no al ransomware."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Troyano»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q149
  prompt:
    es: "¿Cuál de las siguientes denominaciones recibe, según el glosario de ciberseguridad del INCIBE, un grupo de bots controlados por un centro de comando y control (C&C)?"
  options:
  - id: a
    correct: true
    text:
      es: "Botnet o red zombi."
  - id: b
    text:
      es: "Intranet."
  - id: c
    text:
      es: "VLAN."
  - id: d
    text:
      es: "Sandbox."
  explanation:
    es: "El glosario dice que «un grupo de bot controlados por un C&C se denomina Botnet o Red Zombie». La intranet es una red de comunicación interna de una organización, no un grupo de bots. Una VLAN es una red lógica independiente dentro de una red física, no un grupo de bots. Un sandbox es un entorno de pruebas aislado, no un grupo de bots."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Troyano»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q150
  prompt:
    es: "¿Cuál de las siguientes parejas está formada, en ambos casos, por tipos de malware, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    text:
      es: "Antivirus y gusano."
  - id: b
    correct: true
    text:
      es: "Troyano y ransomware."
  - id: c
    text:
      es: "Antispyware y virus."
  - id: d
    text:
      es: "Parche de seguridad y spyware."
  explanation:
    es: "El glosario define el troyano y el ransomware como malware; las otras parejas incluyen un elemento de protección o corrección. El antivirus es software de protección contra el software malicioso, no malware. El antispyware es una herramienta que elimina spyware, no malware. Un parche de seguridad corrige errores de seguridad de un software, no es malware."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Troyano»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q151
  prompt:
    es: "¿Qué función cumple un antivirus en un equipo informático, según la definición del glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    text:
      es: "Diferencia si el usuario es un humano o un bot."
  - id: b
    text:
      es: "Asocia unos datos de identidad a una persona física, organismo o empresa."
  - id: c
    correct: true
    text:
      es: "Evita que se ejecute software malicioso que infecte el equipo."
  - id: d
    text:
      es: "Genera contraseñas robustas y las almacena cifradas."
  explanation:
    es: "El glosario define el antivirus como «software de protección para evitar que ejecutemos algún tipo de software malicioso en nuestro equipo que infecte al equipo». Diferenciar ordenadores de humanos es la función de la prueba CAPTCHA. Asociar datos de identidad a una persona o empresa es la función del certificado digital. Generar y almacenar cifradas las contraseñas es la función del gestor de contraseñas."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Antivirus»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q152
  prompt:
    es: "¿Qué sinónimo da el glosario de ciberseguridad del INCIBE para el término «antivirus», el software de protección?"
  options:
  - id: a
    text:
      es: "Antispyware."
  - id: b
    text:
      es: "Cortafuegos."
  - id: c
    text:
      es: "Sandbox."
  - id: d
    correct: true
    text:
      es: "Antimalware."
  explanation:
    es: "El glosario define el antivirus como software de protección contra el software malicioso y le da el sinónimo «antimalware». El glosario define el antispyware como una herramienta distinta, centrada en el spyware. El glosario define el cortafuegos como un sistema situado en los límites de una red, y le da el sinónimo firewall. El glosario define el sandbox como un entorno de pruebas aislado."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Antivirus»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q153
  prompt:
    es: "¿Qué es una firma antivirus, según la definición que da el glosario de ciberseguridad del INCIBE para ese término?"
  options:
  - id: a
    correct: true
    text:
      es: "Una entrada de la base de datos del antivirus que identifica un tipo de malware."
  - id: b
    text:
      es: "Un fichero generado por una Autoridad Certificadora que asocia datos de identidad."
  - id: c
    text:
      es: "Un conjunto de cambios que corrige errores de seguridad de un software."
  - id: d
    text:
      es: "Un entorno aislado para ejecutar aplicaciones peligrosas sin riesgo."
  explanation:
    es: "El glosario define la firma antivirus como una «entrada en la base de datos del antivirus, también conocido como diccionario, que sirve como forma de identificación de un tipo de malware en concreto». El fichero generado por una Autoridad Certificadora es el certificado digital, el conjunto de cambios que corrige errores de seguridad es el parche de seguridad, y el entorno aislado para ejecutar aplicaciones peligrosas es el sandbox."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Firma antivirus»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-antivirus-html
- id: m02-l05-q154
  prompt:
    es: "En Windows 11, ¿dónde se encuentra el antivirus de Windows, según la página de Microsoft sobre Protección contra virus y amenazas?"
  options:
  - id: a
    text:
      es: "Seguridad de Windows › Firewall y protección de red"
  - id: b
    text:
      es: "Seguridad de Windows › Control de aplicaciones y explorador"
  - id: c
    correct: true
    text:
      es: "Seguridad de Windows › Protección contra virus y amenazas"
  - id: d
    text:
      es: "Seguridad de Windows › Seguridad de dispositivos"
  explanation:
    es: "La página presenta Protección contra virus y amenazas, dentro de la aplicación Seguridad de Windows, como la página pensada para proteger el dispositivo frente a virus, malware y ransomware. Firewall y protección de red es la página del cortafuegos de Windows, y Control de aplicaciones y explorador y Seguridad de dispositivos son otras páginas de la aplicación."
  citation: "fuente: `ms-win-antivirus.html`; «Protección contra virus y amenazas»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-antivirus-html
- id: m02-l05-q155
  prompt:
    es: "El examen sin conexión del Antivirus de Microsoft Defender en Windows 11 se caracteriza porque:"
  options:
  - id: a
    text:
      es: "se ejecuta con Windows cargado, mientras se trabaja con normalidad."
  - id: b
    text:
      es: "examina solo los archivos y carpetas que el usuario selecciona."
  - id: c
    text:
      es: "examina el dispositivo sin usar las definiciones más recientes."
  - id: d
    correct: true
    text:
      es: "se ejecuta tras un reinicio, sin cargar Windows."
  explanation:
    es: "La página dice que el examen sin conexión «sucede después de un reinicio, sin cargar Windows», por lo que el malware persistente tiene más dificultades para ocultarse. No se ejecuta con Windows cargado. Examinar solo lo que el usuario selecciona es el examen personalizado. Y el examen usa las definiciones más recientes."
  citation: "fuente: `ms-win-antivirus.html`; «Opciones de examen»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-antivirus-html
- id: m02-l05-q156
  prompt:
    es: "En la aplicación Seguridad de Windows de Windows 11, ¿dónde se ven los resultados de un examen sin conexión?"
  options:
  - id: a
    correct: true
    text:
      es: "En Historial de protección."
  - id: b
    text:
      es: "En Protección contra ransomware."
  - id: c
    text:
      es: "En Actualizaciones de protección contra amenazas y virus."
  - id: d
    text:
      es: "En Amenazas permitidas."
  explanation:
    es: "La página dice que, para ver los resultados del examen sin conexión, se abre Seguridad de Windows y se selecciona «Historial de protección». Protección contra ransomware reúne configuraciones contra el ransomware, Actualizaciones de protección se dedica a las actualizaciones de inteligencia de seguridad y Amenazas permitidas lista los elementos identificados como amenazas que el usuario ha elegido permitir."
  citation: "fuente: `ms-win-antivirus.html`; «Opciones de examen»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-antivirus-html
- id: m02-l05-q157
  prompt:
    es: "Señale qué ocurre en Windows 11 si se desactiva temporalmente la protección en tiempo real de Seguridad de Windows:"
  options:
  - id: a
    text:
      es: "Permanece desactivada hasta que se active manualmente."
  - id: b
    correct: true
    text:
      es: "Se vuelve a activar automáticamente tras un breve momento."
  - id: c
    text:
      es: "Se siguen examinando los archivos que se abren o se descargan."
  - id: d
    text:
      es: "Se desactivan también los análisis programados."
  explanation:
    es: "La página dice que la protección en tiempo real «se volverá a activar automáticamente después de un breve momento para reanudar la protección del dispositivo». No permanece desactivada hasta que se active a mano. Mientras está desactivada, no se pueden examinar los archivos que se abren o se descargan. Y los análisis programados continúan ejecutándose."
  citation: "fuente: `ms-win-antivirus.html`; «Protección en tiempo real»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q158
  prompt:
    es: "¿Cuál de las siguientes definiciones corresponde a un cortafuegos, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    correct: true
    text:
      es: "Un sistema de programas o dispositivos, en los límites de una red, que permite y limita el tráfico."
  - id: b
    text:
      es: "El equipo o software que hace de intermediario en las peticiones de una red local hacia Internet."
  - id: c
    text:
      es: "Una tecnología de red que extiende de forma segura una red local sobre una red pública."
  - id: d
    text:
      es: "Una aplicación que detecta accesos no autorizados a un ordenador o a una red sin tratar de prevenirlos."
  explanation:
    es: "El glosario define el cortafuegos como un sistema de seguridad compuesto de programas o de dispositivos hardware situados en los puntos limítrofes de una red, con el objetivo de permitir y limitar el flujo de tráfico sobre la base de un conjunto de normas y otros criterios. Hacer de intermediario en las peticiones de la red local hacia Internet es la definición del proxy. Extender de forma segura una red local sobre una red pública es la definición de la red privada virtual. Detectar accesos no autorizados sin intentar prevenirlos es la definición del sistema de detección de intrusos."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Cortafuegos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q159
  prompt:
    es: "Según el glosario de ciberseguridad del INCIBE, un sinónimo del término «cortafuegos», el sistema de seguridad de redes, es:"
  options:
  - id: a
    text:
      es: "Sandbox."
  - id: b
    text:
      es: "Antivirus."
  - id: c
    text:
      es: "Puerta de enlace."
  - id: d
    correct: true
    text:
      es: "Firewall."
  explanation:
    es: "El glosario define el cortafuegos y le da el sinónimo «firewall». El glosario define el sandbox como un entorno de pruebas aislado, no como sinónimo de cortafuegos. El glosario define el antivirus como software de protección contra el software malicioso, con el sinónimo antimalware. El glosario define la puerta de enlace como un dispositivo intermediario entre redes con protocolos diferentes, con el sinónimo gateway."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Cortafuegos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q161
  prompt:
    es: "¿Cuál de las siguientes opciones indica lo que asegura la funcionalidad básica de un cortafuegos, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    correct: true
    text:
      es: "Que las comunicaciones de la red con Internet cumplan las políticas de seguridad."
  - id: b
    text:
      es: "Que todos los equipos de la red tengan instalado un antivirus actualizado."
  - id: c
    text:
      es: "Que todos los archivos de la red se guarden cifrados en los servidores de la organización."
  - id: d
    text:
      es: "Que cada usuario de la red cambie su contraseña con regularidad cada pocos meses."
  explanation:
    es: "El glosario dice que la funcionalidad básica de un cortafuego es asegurar que todas las comunicaciones entre la red e Internet se realicen conforme a las políticas de seguridad de la organización o corporación. El glosario define el antivirus como software de protección contra el software malicioso, una función distinta de la del cortafuegos. El glosario define el cifrado como la codificación de la información, una función distinta de la del cortafuegos. El glosario define la contraseña como forma de autentificación, y no le atribuye al cortafuegos que los usuarios la cambien."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Cortafuegos»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q162
  prompt:
    es: "¿Cuál de las siguientes opciones describe de qué puede estar compuesto un cortafuegos, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    text:
      es: "Solo de dispositivos hardware situados en la red."
  - id: b
    text:
      es: "Solo de programas instalados en cada equipo."
  - id: c
    correct: true
    text:
      es: "De programas (software) o de dispositivos hardware."
  - id: d
    text:
      es: "De certificados digitales emitidos por una Autoridad Certificadora."
  explanation:
    es: "El glosario define el cortafuegos como un sistema «compuesto o bien de programas (software) o de dispositivos hardware». Por eso no es solo hardware ni solo programas. Los certificados digitales no son componentes de un cortafuegos: el glosario los define como ficheros que asocian datos de identidad."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Cortafuegos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q163
  prompt:
    es: "Según el glosario de ciberseguridad del INCIBE, ¿cuál de los siguientes mecanismos de un cortafuegos controla el acceso a una red interna analizando el tráfico de paquetes entrantes y salientes?"
  options:
  - id: a
    text:
      es: "El sandbox."
  - id: b
    text:
      es: "El sistema de detección de intrusos."
  - id: c
    text:
      es: "La red privada virtual."
  - id: d
    correct: true
    text:
      es: "El filtrado de paquetes."
  explanation:
    es: "El glosario define el filtrado de paquetes como un «mecanismo de un cortafuegos que permite controlar el acceso a una red interna a través del análisis de tráfico de paquetes tanto entrantes como salientes». El glosario define el sandbox como un entorno de pruebas aislado. El glosario define el sistema de detección de intrusos como una aplicación que solo detecta accesos no autorizados. El glosario define la red privada virtual como una extensión segura de una red local sobre una red pública."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Filtrado de paquetes»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-firewall-html
- id: m02-l05-q164
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes rutas permite ver y administrar el estado del Firewall de Windows, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Seguridad de Windows › Protección contra virus y amenazas"
  - id: b
    text:
      es: "Seguridad de Windows › Control de aplicaciones y explorador"
  - id: c
    correct: true
    text:
      es: "Seguridad de Windows › Firewall y protección de red"
  - id: d
    text:
      es: "Seguridad de Windows › Seguridad de dispositivos"
  explanation:
    es: "La página dice que se puede usar la aplicación Seguridad de Windows para ver y administrar el estado de Firewall de Windows, en la página «Firewall y protección de red». Protección contra virus y amenazas es otra página de la aplicación, la del antivirus. Control de aplicaciones y explorador es otra página de la aplicación, distinta de Firewall y protección de red. Seguridad de dispositivos es otra página de la aplicación, distinta de Firewall y protección de red."
  citation: "fuente: `ms-win-firewall.html`; «Firewall y protección de red en la aplicación Seguridad de Windows»"
  difficulty: 1
  tags:
  - "ofimática-menú"
