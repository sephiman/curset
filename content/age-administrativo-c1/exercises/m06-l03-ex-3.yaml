# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q056
  prompt:
    es: "En el Explorador de archivos de Windows 11, según la tabla de métodos abreviados de Microsoft, pulsar Supr con un elemento seleccionado:"
  options:
  - id: a
    text:
      es: "Elimina el elemento solo si antes se ha vaciado la Papelera."
  - id: b
    text:
      es: "Elimina el elemento permanentemente, sin pasar por la Papelera."
  - id: c
    correct: true
    text:
      es: "Elimina el elemento y lo mueve a la Papelera de reciclaje."
  - id: d
    text:
      es: "Elimina los caracteres a la derecha del cursor."
  explanation:
    es: "La tabla del Explorador asigna a Ctrl+D y a Supr «Eliminar el elemento seleccionado y moverlo a la papelera de reciclaje». Eliminarlo permanentemente sin pasar por la Papelera es otra fila de la tabla, Mayús+Supr. Que solo funcione tras vaciar la Papelera contradice la fila: Supr envía el elemento a la Papelera, no la exige vacía. Y borrar caracteres a la derecha del cursor corresponde a escribir texto; con un elemento seleccionado en el Explorador, la fila de Supr es la de eliminar el elemento."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q057
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué tecla se mantiene pulsada al arrastrar un archivo con el ratón para que, al soltarlo, se cree un acceso directo al original?"
  options:
  - id: a
    text:
      es: "Ctrl"
  - id: b
    correct: true
    text:
      es: "Alt"
  - id: c
    text:
      es: "Tecla Windows"
  - id: d
    text:
      es: "Mayús"
  explanation:
    es: "La tabla del Explorador dice que con Alt y arrastrar un archivo, «cuando suelte el archivo, cree un acceso directo al archivo original en esa ubicación». Con Ctrl se crea una copia y con Mayús se mueve el archivo. La tabla no asigna ninguna acción a arrastrar con la tecla Windows."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q058
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre arrastrar un archivo con el ratón en el Explorador de archivos de Windows 11 es correcta, según Microsoft?"
  options:
  - id: a
    text:
      es: "Con Mayús pulsado, al soltarlo se crea un acceso directo al original."
  - id: b
    text:
      es: "Con Ctrl pulsado, al soltarlo se crea un acceso directo al original."
  - id: c
    correct: true
    text:
      es: "Con Alt pulsado, al soltarlo se crea un acceso directo al original."
  - id: d
    text:
      es: "Con Alt pulsado, al soltarlo se crea una copia en esa ubicación."
  explanation:
    es: "La tabla del Explorador asigna a Alt+arrastrar un archivo la creación de «un acceso directo al archivo original en esa ubicación». La copia se crea arrastrando con Ctrl, no con Alt, y arrastrar con Mayús mueve el archivo; ninguna de esas dos teclas crea un acceso directo."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q059
  prompt:
    es: "En el Explorador de archivos de Windows 11, al arrastrar un archivo con Alt pulsado, ¿dónde se crea el acceso directo al archivo original?"
  options:
  - id: a
    text:
      es: "En la sección Acceso rápido del panel de navegación"
  - id: b
    text:
      es: "En el escritorio, sea cual sea el lugar del destino"
  - id: c
    text:
      es: "En la misma carpeta en la que está el original"
  - id: d
    correct: true
    text:
      es: "En la ubicación en la que se suelta el archivo"
  explanation:
    es: "La tabla del Explorador dice: «Cuando suelte el archivo, cree un acceso directo al archivo original en esa ubicación», es decir, donde se suelta. No lo crea en el escritorio, ni junto al original, ni en Acceso rápido."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q060
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes teclas se mantiene pulsada al arrastrar un archivo con el ratón para moverlo a la ubicación donde se suelta?"
  options:
