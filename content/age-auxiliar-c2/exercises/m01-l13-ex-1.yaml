# anchor: boe-a-2015-11719-art-8
- id: m01-l13-q002
  prompt:
    es: "Según el artículo 8.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos se clasifican en:"
  options:
  - id: a
    text:
      es: "Funcionarios de carrera, funcionarios interinos, personal laboral y personal directivo."
  - id: b
    text:
      es: "Funcionarios de carrera, funcionarios en prácticas, personal laboral y personal eventual."
  - id: c
    text:
      es: "Funcionarios de carrera, personal laboral, personal eventual y personal directivo profesional."
  - id: d
    correct: true
    text:
      es: "Funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual."
  explanation:
    es: "El artículo 8.2 enumera cuatro clases: funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual. El personal directivo no es una clase de esa lista; el Estatuto lo regula aparte, en su artículo 13. Los funcionarios en prácticas tampoco figuran en la lista del artículo 8.2. La lista que suprime a los interinos y añade el personal directivo profesional altera dos elementos."
  citation: "art. 8.2 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2015-11719-art-11
- id: m01-l13-q007
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el personal laboral recoge el artículo 11.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    correct: true
    text:
      es: "En función de la duración del contrato, puede ser fijo, por tiempo indefinido o temporal."
  - id: b
    text:
      es: "En función de la duración del contrato, puede ser fijo o temporal, pero nunca por tiempo indefinido."
  - id: c
    text:
      es: "Presta servicios en virtud de nombramiento, con carácter fijo, por tiempo indefinido o temporal."
  - id: d
    text:
      es: "Su contrato puede formalizarse de palabra cuando su duración sea inferior a seis meses."
  explanation:
    es: "El artículo 11.1 TREBEP dice que, «en función de la duración del contrato», el personal laboral «podrá ser fijo, por tiempo indefinido o temporal». Excluir el tiempo indefinido contradice esa lista de tres. El personal laboral presta servicios «en virtud de contrato de trabajo», no de nombramiento: el nombramiento es el título de los funcionarios, según el artículo 9.1. El contrato es «formalizado por escrito» sin distinción por duración, así que un contrato de palabra de menos de seis meses contradice esa fórmula."
  citation: "art. 11.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1984-17387-art-13
- id: m01-l13-q024
  prompt:
    es: "Según el artículo 13.1 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, ¿a qué personal se inscribe en el Registro Central?"
  options:
  - id: a
    text:
      es: "Sólo al personal funcionario de carrera de la Administración del Estado."
  - id: b
    text:
      es: "A todo el personal de cualquier Administración Pública."
  - id: c
    text:
      es: "Sólo al personal que perciba sus retribuciones de los presupuestos del Estado."
  - id: d
    correct: true
    text:
      es: "A todo el personal al servicio de la Administración del Estado."
  explanation:
    es: "El artículo 13.1 dice que en el Registro Central «se inscribirá a todo el personal al servicio de la Administración del Estado». No se limita a los funcionarios de carrera. No inscribe al personal de las demás Administraciones, que constituyen sus propios Registros. Y el artículo no usa el criterio de la fuente de las retribuciones."
  citation: "art. 13.1 Ley 30/1984"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-71
- id: m01-l13-q026
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los contenidos mínimos comunes de los Registros de personal recoge el artículo 71.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Se establecen mediante convenio de Conferencia Sectorial, con respeto a la legislación de protección de datos."
  - id: b
    text:
      es: "Se establecen mediante convenio de Conferencia Sectorial, con independencia de la legislación de protección de datos."
  - id: c
    text:
      es: "Los fija cada Administración Pública en su propio Registro, sin necesidad de acuerdo con las demás."
  - id: d
    text:
      es: "Los fija el Registro Central de Personal, y las demás Administraciones deben adoptarlos."
  explanation:
    es: "El artículo 71.3 dice que los contenidos mínimos comunes se establecen «mediante convenio de Conferencia Sectorial», «con respeto a lo establecido en la legislación de protección de datos de carácter personal». La opción que prescinde de esa legislación altera el texto. Los contenidos son comunes porque se acuerdan entre Administraciones, no los fija cada una por su cuenta. Tampoco los impone el Registro Central de Personal."
  citation: "art. 71.3 TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2000-1007-art-1
- id: m01-l13-q027
  prompt:
    es: "De acuerdo con el artículo 1.1 del Reglamento del Registro Central de Personal contenido en el Real Decreto 2073/1999, de 30 de diciembre, el Registro Central de Personal es:"
  options:
  - id: a
    text:
      es: "El registro común de todas las Administraciones Públicas en el que se inscribe a todo su personal funcionario y laboral."
  - id: b
    correct: true
    text:
      es: "El registro administrativo de la Administración General del Estado en el que se inscribe el personal de su ámbito y se anotan preceptivamente los actos que afecten a su vida administrativa."
  - id: c
    text:
      es: "El archivo de la Administración General del Estado que custodia los expedientes del personal que ha perdido su condición."
  - id: d
    text:
      es: "El registro de la Administración General del Estado en el que se anotan, a solicitud del interesado, los actos que le afectan."
  explanation:
    es: "El artículo 1.1 define el Registro Central de Personal como «el registro administrativo de la Administración General del Estado en el que se inscribe el personal a que se refiere el artículo 5» y en el que se anotan preceptivamente los actos que afecten a su vida administrativa. No es un registro común de todas las Administraciones: cada una constituye el suyo. No es un archivo de expedientes cerrados. Y la anotación es preceptiva, no a solicitud del interesado."
  citation: "art. 1.1 RD 2073/1999"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2000-1007-art-11
- id: m01-l13-q030
  prompt:
    es: "Un órgano de personal comunica al Registro Central de Personal el cese de un funcionario. Una vez recibida la comunicación, el Registro practicará el asiento:"
  options:
  - id: a
    text:
      es: "En un plazo máximo de diez días desde la recepción de la comunicación."
  - id: b
    correct: true
    text:
      es: "En un plazo máximo de tres días desde la recepción de la comunicación."
  - id: c
    text:
      es: "En un plazo máximo de un mes desde la recepción de la comunicación."
  - id: d
    text:
      es: "En el plazo que fije la propia comunicación del órgano de personal."
  explanation:
    es: "El artículo 11.2 del Reglamento del Registro Central de Personal dice que los asientos se practican «en un plazo máximo de tres días desde la recepción de la comunicación». Diez días y un mes no son plazos del artículo. El plazo lo fija el Reglamento, no el órgano que comunica el acto."
  citation: "art. 11.2 RD 2073/1999"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2000-1007-art-13
- id: m01-l13-q032
  prompt:
    es: "¿Cuál de los siguientes actos se anota en el Registro Central de Personal respecto del personal eventual, según el Reglamento del Registro Central de Personal contenido en el Real Decreto 2073/1999, de 30 de diciembre?"
  options:
  - id: a
    text:
      es: "Las declaraciones de bienes y derechos patrimoniales."
  - id: b
    text:
      es: "Las propuestas de nombramiento de la autoridad."
  - id: c
    correct: true
    text:
      es: "Las autorizaciones o reconocimientos de compatibilidad."
  - id: d
    text:
      es: "Las valoraciones del desempeño de sus funciones de confianza."
  explanation:
    es: "El artículo 13.1.a) aplica su lista también al personal eventual, y en ella figuran las «autorizaciones o reconocimientos de compatibilidad». Las declaraciones de bienes no están en la lista. Se inscribe la resolución de nombramiento, no la propuesta. Las valoraciones del desempeño tampoco figuran entre los actos que se anotan."
  citation: "art. 13.1.a) RD 2073/1999"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2000-1007-art-13
- id: m01-l13-q033
  prompt:
    es: "¿Qué licencias y permisos del funcionario de carrera se anotan en el Registro Central de Personal de la Administración General del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Que tuvieran repercusión en nómina o en el cómputo del tiempo de servicio activo."
  - id: b
    text:
      es: "De cualquier clase, tengan o no repercusión en nómina o en el tiempo de servicio."
  - id: c
    text:
      es: "Que superen los quince días naturales de duración en el año natural."
  - id: d
    text:
      es: "Que haya concedido el Subsecretario del departamento de destino."
  explanation:
    es: "El artículo 13.1.a) del Reglamento del Registro Central de Personal anota las «licencias y permisos que tuvieran repercusión en nómina o en el cómputo del tiempo de servicio activo». No se anotan todos: sólo los que tienen esa repercusión. El artículo no usa un umbral de quince días ni el órgano que los concede como criterio."
  citation: "art. 13.1.a) RD 2073/1999"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2000-1007-art-13
- id: m01-l13-q036
  prompt:
    es: "¿Cuál de las siguientes resoluciones judiciales se anota en el Registro Central de Personal respecto de un funcionario de carrera?"
  options:
  - id: a
    correct: true
    text:
      es: "Las sentencias firmes relacionadas con su condición de funcionario."
  - id: b
    text:
      es: "Las sentencias, firmes o no, relacionadas con su condición de funcionario."
  - id: c
    text:
      es: "Las sentencias firmes de cualquier orden, afecten o no a su condición."
  - id: d
    text:
      es: "Los autos que admiten a trámite sus recursos."
  explanation:
    es: "El artículo 13.1.a) del Reglamento del Registro Central de Personal anota las «sentencias firmes relacionadas con su condición de funcionario». Las sentencias no firmes quedan fuera. También las firmes que no guardan relación con esa condición. Los autos de admisión de recursos no son sentencias firmes."
  citation: "art. 13.1.a) RD 2073/1999"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-18101-art-4
- id: m01-l13-q038
  prompt:
    es: "Según el artículo 4.1 del Reglamento aprobado por el Real Decreto 1405/1986, de 6 de junio, entre los actos referentes al personal funcionario que deben anotarse preceptivamente figuran:"
  options:
  - id: a
    text:
      es: "Los reingresos, el reconocimiento de antigüedad y trienios y las solicitudes de excedencia pendientes."
  - id: b
    text:
      es: "Los ceses en los puestos, las solicitudes de traslado y la autorización o reconocimiento de compatibilidades."
  - id: c
    correct: true
    text:
      es: "Los reingresos, el reconocimiento de antigüedad y trienios y la autorización o reconocimiento de compatibilidades."
  - id: d
    text:
      es: "Las jubilaciones, las peticiones de comisión de servicios y el reconocimiento de antigüedad y trienios."
  explanation:
    es: "El artículo 4.1, apartado 1.1, enumera para el personal funcionario, entre otros, los «reingresos», el «reconocimiento de antigüedad y trienios» y la «autorización o reconocimiento de compatibilidades». Las otras opciones mezclan actos de la lista con uno que no está: las solicitudes de excedencia pendientes, las solicitudes de traslado y las peticiones de comisión de servicios. La lista recoge actos y resoluciones, no solicitudes."
  citation: "art. 4.1 RD 1405/1986"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-1986-18101-art-15
- id: m01-l13-q039
  prompt:
    es: "Según el artículo 15.1 del Reglamento aprobado por el Real Decreto 1405/1986, de 6 de junio, ¿quién constituye los Registros de Personal en los que debe inscribirse el personal de cada Administración?"
  options:
  - id: a
    correct: true
    text:
      es: "Cada Administración Pública, respecto de todo su personal."
  - id: b
    text:
      es: "El Registro Central, para todas las Administraciones."
  - id: c
    text:
      es: "Las comunidades autónomas, respecto de su personal y del de sus entidades locales."
  - id: d
    text:
      es: "La Dirección General de Función Pública, mediante convenio con cada Administración."
  explanation:
    es: "El artículo 15.1 dice que las Administraciones Públicas «constituirán sus correspondientes Registros de Personal, en los que deberá inscribirse todo el personal dependiente de las mismas». Cada una constituye el suyo. El Registro Central de Personal es el de la Administración General del Estado. Las comunidades autónomas no constituyen el Registro de las entidades locales; sólo cooperan cuando estas no tienen capacidad suficiente (art. 15.2). El artículo no atribuye esa tarea a la Dirección General de Función Pública."
  citation: "art. 15.1 RD 1405/1986"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2015-11719-art-9
- id: m01-l13-q113
  prompt:
    es: "De acuerdo con el artículo 9.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el ejercicio de las funciones que impliquen la participación directa o indirecta en el ejercicio de las potestades públicas corresponde:"
  options:
  - id: a
    text:
      es: "Preferentemente a los funcionarios públicos, y al personal laboral fijo cuando lo prevea la ley de desarrollo"
  - id: b
    text:
      es: "Exclusivamente a los funcionarios públicos, en los términos que fije cada relación de puestos de trabajo"
  - id: c
    text:
      es: "A los empleados públicos de cualquier clase, en los términos que establezca la ley de desarrollo de cada Administración"
  - id: d
    correct: true
    text:
      es: "Exclusivamente a los funcionarios públicos, en los términos que establezca la ley de desarrollo de cada Administración"
  explanation:
    es: "El artículo 9.2 TREBEP reserva esas funciones «exclusivamente a los funcionarios públicos, en los términos que en la ley de desarrollo de cada Administración Pública se establezca». «Preferentemente» y la apertura al personal laboral fijo contradicen «exclusivamente». Remitir a la relación de puestos de trabajo sustituye la ley de desarrollo, que es el instrumento que nombra el apartado. «Empleados públicos de cualquier clase» contradice «exclusivamente a los funcionarios públicos»."
  citation: "art. 9.2 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-10
- id: m01-l13-q115
  prompt:
    es: "Según el artículo 10.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, son funcionarios interinos los que son nombrados como tales, con carácter temporal, para el desempeño de funciones propias de funcionarios de carrera:"
  options:
  - id: a
    correct: true
    text:
      es: "Por razones expresamente justificadas de necesidad y urgencia"
  - id: b
    text:
      es: "Por razones de oportunidad apreciadas libremente por el órgano que los nombra"
  - id: c
    text:
      es: "Por razones de confianza o asesoramiento especial del órgano que los nombra"
  - id: d
    text:
      es: "Por razones organizativas que impidan la cobertura del puesto mediante concurso"
  explanation:
    es: "El artículo 10.1 define a los funcionarios interinos como los nombrados «por razones expresamente justificadas de necesidad y urgencia». La libre apreciación de la oportunidad contradice la exigencia de una justificación expresa. La confianza o el asesoramiento especial es lo que caracteriza al personal eventual, no al interino. Las razones organizativas aparecen en el artículo 10.3, pero como causa de cese del interino, no de nombramiento."
  citation: "art. 10.1 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-11719-art-10
- id: m01-l13-q116
  prompt:
    es: "Según el artículo 10.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿en qué circunstancia puede nombrarse personal funcionario interino por plazo máximo de nueve meses, dentro de un periodo de dieciocho meses?"
  options:
  - id: a
    text:
      es: "La ejecución de programas de carácter temporal"
  - id: b
    correct: true
    text:
      es: "El exceso o acumulación de tareas"
  - id: c
    text:
      es: "La sustitución transitoria de los titulares"
  - id: d
    text:
      es: "La existencia de plazas vacantes sin cobertura posible"
  explanation:
    es: "La letra d) del artículo 10.1 permite nombrar interinos por «el exceso o acumulación de tareas por plazo máximo de nueve meses, dentro de un periodo de dieciocho meses». Los programas de carácter temporal tienen otro límite: tres años, ampliables hasta doce meses más. La sustitución transitoria de los titulares dura el tiempo estrictamente necesario. Las plazas vacantes admiten un máximo de tres años."
  citation: "art. 10.1.d) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-10
- id: m01-l13-q117
  prompt:
    es: "¿Por qué vía puede ampliarse hasta doce meses más, según el texto refundido de la Ley del Estatuto Básico del Empleado Público, la duración de los programas de carácter temporal para cuya ejecución se nombran interinos?"
  options:
  - id: a
    text:
      es: "Resolución motivada del órgano que efectuó el nombramiento del interino"
  - id: b
    text:
      es: "Real decreto del Consejo de Ministros que apruebe el programa temporal"
  - id: c
    correct: true
    text:
      es: "Las leyes de Función Pública que se dicten en desarrollo del Estatuto"
  - id: d
    text:
      es: "Acuerdo de la Mesa General de Negociación de las Administraciones Públicas"
  explanation:
    es: "La letra c) del artículo 10.1 limita los programas de carácter temporal a tres años, «ampliable hasta doce meses más por las leyes de Función Pública que se dicten en desarrollo de este Estatuto». La ampliación necesita, por tanto, una ley de función pública de desarrollo. No basta una resolución del órgano que nombró al interino, un real decreto del Consejo de Ministros ni un acuerdo de la Mesa General de Negociación."
  citation: "art. 10.1.c) TREBEP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-11719-art-10
- id: m01-l13-q122
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el nombramiento derivado de la selección del personal funcionario interino recoge el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "Da lugar a la condición de funcionario de carrera tras tres años de servicios"
  - id: b
    text:
      es: "Da lugar a la condición de funcionario de carrera si la selección fue por concurso-oposición"
  - id: c
    text:
      es: "Otorga preferencia en los procesos selectivos de acceso a la condición de funcionario de carrera"
  - id: d
    correct: true
    text:
      es: "En ningún caso da lugar al reconocimiento de la condición de funcionario de carrera"
  explanation:
    es: "El artículo 10.2 dice que ese nombramiento «en ningún caso dará lugar al reconocimiento de la condición de funcionario de carrera». Por eso no la da ni tras tres años de servicios ni cuando la selección del interino se hizo por concurso-oposición. El artículo tampoco concede al interino preferencia alguna en los procesos selectivos de funcionarios de carrera."
  citation: "art. 10.2 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1995-8729-art-27
- id: m01-l13-q123
  prompt:
    es: "Según el artículo 27.1 del Real Decreto 364/1995, de 10 de marzo, ¿quién nombra al personal funcionario interino de los Cuerpos y Escalas adscritos a un Departamento ministerial y no dependientes de la Secretaría de Estado de Función Pública?"
  options:
  - id: a
    correct: true
    text:
      es: "El Subsecretario del Departamento al que figuren adscritos"
  - id: b
    text:
      es: "El Ministro titular del Departamento al que figuren adscritos"
  - id: c
    text:
      es: "El Secretario General Técnico del Departamento de adscripción"
  - id: d
    text:
      es: "El Delegado del Gobierno en la comunidad autónoma del puesto"
  explanation:
    es: "El artículo 27.1 atribuye el nombramiento del personal funcionario interino «por el Subsecretario del Departamento al que figuren adscritos los correspondientes Cuerpos y Escalas», salvo los Cuerpos y Escalas dependientes de la Secretaría de Estado que el reglamento llama «para la Administración Pública» (hoy, Secretaría de Estado de Función Pública), cuyos interinos nombra el órgano que el artículo llama «Director general de la Función Pública». El Ministro es el órgano un nivel por encima y el Secretario General Técnico otro órgano del mismo departamento; ninguno de los dos aparece en el artículo. El Delegado del Gobierno no tiene esa competencia en el reglamento."
  citation: "art. 27.1 RD 364/1995"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1995-8729-art-27
- id: m01-l13-q124
  prompt:
    es: "Según el artículo 27.1 del Reglamento General de Ingreso del Personal al servicio de la Administración General del Estado, aprobado por el Real Decreto 364/1995, el procedimiento de selección del personal funcionario interino deberá posibilitar:"
  options:
  - id: a
    text:
      es: "La máxima participación de las organizaciones sindicales en la selección"
  - id: b
    correct: true
    text:
      es: "La máxima agilidad en la selección, en razón a la urgencia requerida"
  - id: c
    text:
      es: "La valoración preferente de los servicios previos prestados como interino"
  - id: d
    text:
      es: "La celebración de una prueba de conocimientos de carácter eliminatorio"
  explanation:
    es: "El artículo 27.1 dice que «el procedimiento deberá posibilitar la máxima agilidad en la selección, en razón a la urgencia requerida para cubrir transitoriamente los puestos de trabajo». No exige la máxima participación sindical ni la valoración preferente de servicios previos como interino. Tampoco impone una prueba de conocimientos eliminatoria: el nombramiento se hace con arreglo a los principios de mérito y capacidad."
  citation: "art. 27.1 RD 364/1995"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-11719-art-10
- id: m01-l13-q126
  prompt:
    es: "Según el artículo 10.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de las siguientes es causa de finalización de la relación de interinidad?"
  options:
  - id: a
    correct: true
    text:
      es: "La finalización del plazo autorizado expresamente recogido en su nombramiento"
  - id: b
    text:
      es: "La obtención de una evaluación del desempeño inferior a la media de la unidad"
  - id: c
    text:
      es: "El transcurso de un año sin que se haya convocado la plaza que ocupa"
  - id: d
    text:
      es: "La negativa a aceptar un cambio de puesto dentro de la misma localidad"
  explanation:
    es: "La letra c) del artículo 10.3 incluye entre las causas «la finalización del plazo autorizado expresamente recogido en su nombramiento». Las otras causas del apartado son la cobertura reglada del puesto, la supresión o amortización del puesto y la finalización de la causa del nombramiento. Una evaluación del desempeño por debajo de la media de la unidad, el transcurso de un año sin convocar la plaza y la negativa a un cambio de puesto no figuran en la lista."
  citation: "art. 10.3.c) TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-11719-art-10
- id: m01-l13-q127
  prompt:
    es: "¿Cuál de las siguientes razones organizativas es causa de finalización de la relación de interinidad según el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "Las que den lugar a la modificación del horario de los puestos asignados"
  - id: b
    text:
      es: "Las que den lugar al traslado de la unidad a otro edificio de la misma localidad"
  - id: c
    correct: true
    text:
      es: "Las que den lugar a la supresión o a la amortización de los puestos asignados"
  - id: d
    text:
      es: "Las que den lugar a la reducción del complemento específico de los puestos asignados"
  explanation:
    es: "La letra b) del artículo 10.3 pone fin a la interinidad por «razones organizativas que den lugar a la supresión o a la amortización de los puestos asignados». El cambio de horario, el traslado de la unidad a otro edificio de la localidad y la reducción del complemento específico no suprimen ni amortizan el puesto, así que no son causa de finalización."
  citation: "art. 10.3.b) TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-11719-da-decimoseptima
- id: m01-l13-q133
  prompt:
    es: "¿Qué compensación da el texto refundido de la Ley del Estatuto Básico del Empleado Público al funcionario interino afectado por el incumplimiento del plazo máximo de permanencia?"
  options:
  - id: a
    correct: true
    text:
      es: "Veinte días de sus retribuciones fijas por año de servicio, hasta un máximo de doce mensualidades"
  - id: b
    text:
      es: "Treinta y tres días de sus retribuciones fijas por año de servicio, hasta veinticuatro mensualidades"
  - id: c
    text:
      es: "Veinte días de sus retribuciones totales por año de servicio, sin límite de mensualidades"
  - id: d
    text:
      es: "Doce días de sus retribuciones fijas por año de servicio, hasta un máximo de seis mensualidades"
  explanation:
    es: "El apartado 4 fija una compensación «equivalente a veinte días de sus retribuciones fijas por año de servicio, prorrateándose por meses los períodos de tiempo inferiores a un año, hasta un máximo de doce mensualidades». Los treinta y tres días con tope de veinticuatro mensualidades, los doce días con tope de seis y las retribuciones totales sin tope no son las cifras de la disposición: el cálculo se hace sobre las retribuciones fijas y tiene un límite de doce mensualidades."
  citation: "disposición adicional decimoséptima.4 TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-da-decimoseptima
- id: m01-l13-q134
  prompt:
    es: "Un funcionario interino cesa tras dos años y seis meses en un nombramiento que incumplió el plazo máximo de permanencia. ¿Qué compensación le corresponde según el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Cincuenta días de sus retribuciones fijas"
  - id: b
    text:
      es: "Cuarenta días de sus retribuciones fijas"
  - id: c
    text:
      es: "Sesenta días de sus retribuciones fijas"
  - id: d
    text:
      es: "Cuarenta y cinco días de sus retribuciones fijas"
  explanation:
    es: "La disposición adicional decimoséptima.4 da veinte días de retribuciones fijas por año de servicio y prorratea por meses los periodos inferiores a un año. Dos años dan cuarenta días. Los seis meses restantes son medio año: diez días más. El total es de cincuenta días. Cuarenta días resultan de ignorar el prorrateo de los seis meses. Sesenta días resultan de contar los seis meses como un año entero. Cuarenta y cinco días no salen de la regla de la disposición."
  citation: "disposición adicional decimoséptima.4 TREBEP"
  difficulty: 3
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2015-11719-da-decimoseptima
- id: m01-l13-q135
  prompt:
    es: "¿Desde cuándo nace, según el texto refundido de la Ley del Estatuto Básico del Empleado Público, el derecho del funcionario interino a la compensación por incumplimiento del plazo máximo de permanencia?"
  options:
  - id: a
    text:
      es: "A partir de la fecha en que se cumple el plazo máximo de permanencia"
  - id: b
    correct: true
    text:
      es: "A partir de la fecha del cese efectivo del funcionario interino"
  - id: c
    text:
      es: "A partir de la fecha de publicación de la convocatoria de la plaza"
  - id: d
    text:
      es: "A partir de la fecha de su nombramiento"
  explanation:
    es: "El apartado 4 dice que «el derecho a esta compensación nacerá a partir de la fecha del cese efectivo». No nace al cumplirse el plazo máximo de permanencia, ni al publicarse la convocatoria de la plaza, ni en la fecha del nombramiento."
  citation: "disposición adicional decimoséptima.4 TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
