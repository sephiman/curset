# anchor: boe-a-2015-10565-art-125
- id: q05
  lesson: m03-l03
  prompt:
    es: "Conforme al artículo 125.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué fecha puede Ingeniería Tormes, S.L. interponer el recurso extraordinario de revisión por esos documentos?"
  options:
