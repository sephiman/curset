- id: m09-l02-q18
  prompt:
    en: In the PostgreSQL comparison of high availability, load balancing and replication solutions, which solution
      does the documentation say PostgreSQL does not offer?
  options:
  - id: a
    text:
      en: Write-ahead log shipping to warm and hot standby servers
  - id: b
    text:
      en: Logical replication of data changes on a per-table basis
  - id: c
    text:
      en: Synchronous replication of commits to a standby server
  - id: d
    correct: true
    text:
      en: Synchronous multimaster replication
  explanation:
    en: The documentation says PostgreSQL does not offer synchronous multimaster replication. Write-ahead log shipping
      is wrong because standby servers can be kept current by reading a stream of WAL records. Logical replication
      is wrong because it lets a server send a stream of data modifications to another server. Synchronous replication
      to a standby is wrong because it confirms that all changes of a transaction reached one or more synchronous
      standby servers.
  citation: pg-different-replication-solutions#DIFFERENT-REPLICATION-SOLUTIONS; pg-warm-standby#SYNCHRONOUS-REPLICATION
  extract:
    en: PostgreSQL does not offer this type of replication
- id: m09-l02-q19
  prompt:
    en: In Elasticsearch, which property of an index is fixed at the time that the index is created?
  options:
  - id: a
    text:
      en: The number of replica shards
  - id: b
    correct: true
    text:
      en: The number of primary shards
  - id: c
    text:
      en: The number of nodes in the cluster
  - id: d
    text:
      en: The node that holds each shard copy
  explanation:
    en: The number of primary shards of an index is fixed at index creation. The number of replica shards is wrong
      because it can be changed at any time without interrupting indexing or query operations. The number of nodes
      is wrong because servers can be added to a cluster to increase capacity. The node of each shard copy is wrong
      because shard copies are automatically balanced across nodes.
  citation: es-clusters-nodes-shards#elastic-docs-v3
