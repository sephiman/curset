type: quiz
variants:
- id: m09-l05-q01
  prompt:
    en: In a two-component LSM-tree as described by O'Neil and colleagues, where is a new index entry inserted,
      and what does that insert cost in I/O?
  options:
  - id: a
    text:
      en: Into the disk-resident C1 tree, at the cost of one page write
  - id: b
    text:
      en: Into the memory-resident C0 tree, at the cost of one random disk read
  - id: c
    correct: true
    text:
      en: Into the memory-resident C0 tree, at no I/O cost
  - id: d
    text:
      en: Into the C0 and C1 trees at once, at the cost of one page write each
  explanation:
    en: Inserting an index entry into the memory resident C0 tree has no I/O cost. Insertion into the disk-resident
      C1 tree is wrong because the index entry is inserted into the memory resident C0 tree. A random disk read
      is wrong because the insert into C0 has no I/O cost. Insertion into C0 and C1 at once is wrong because the
      entry migrates out to the C1 tree on disk only in time.
  citation: paper-oneil-lsm-tree#p4
- id: m09-l05-q03
  prompt:
    en: Which `appendfsync` policy does Redis use by default for the append-only file, and how much data can it
      lose in a disaster?
  options:
  - id: a
    text:
      en: '`appendfsync always`, which may lose 1 second of data'
  - id: b
    text:
      en: '`appendfsync no`, which may lose 1 second of data'
  - id: c
    text:
      en: '`appendfsync everysec`, which may lose 30 seconds of data'
  - id: d
    correct: true
    text:
      en: '`appendfsync everysec`, which may lose 1 second of data'
  explanation:
    en: The suggested and default policy is to fsync every second, and you may lose 1 second of data if there is
      a disaster. The default rules out `appendfsync always` and `appendfsync no`. Losing 30 seconds with `appendfsync
      everysec` is wrong because you may lose 1 second of data.
  citation: redis-persistence#how-durable-is-the-append-only-file
  extract:
    en: The suggested (and default) policy is to fsync every second.
- id: m09-l05-q04
  prompt:
    en: A Redis server is configured with `save 60 1000`. Under which condition does it automatically write a snapshot
      of the dataset to disk?
  options:
  - id: a
    text:
      en: Every 1000 seconds, if at least 60 keys changed
  - id: b
    correct: true
    text:
      en: Every 60 seconds, if at least 1000 keys changed
  - id: c
    text:
      en: Every 60 seconds, whether or not any key changed
  - id: d
    text:
      en: After 60 changes, once at least 1000 seconds have passed
  explanation:
    en: This configuration makes Redis automatically dump the dataset to disk every 60 seconds if at least 1000
      keys changed. That single rule excludes every 1000 seconds with 60 keys, every 60 seconds with no key change,
      and 60 changes after 1000 seconds.
  citation: redis-persistence#snapshotting
  extract:
    en: this configuration will make Redis automatically dump the dataset to disk every 60 seconds if at least 1000
      keys changed
- id: m09-l05-q05
  prompt:
    en: A Redis instance has reached `maxmemory` and uses the `noeviction` policy. What happens when a client runs
      a command that would cache new data?
  options:
  - id: a
    text:
      en: The server evicts the least recently used keys to make room
  - id: b
    text:
      en: The server evicts keys at random to make room
  - id: c
    correct: true
    text:
      en: The server returns an error, while commands that only read existing data keep working
  - id: d
    text:
      en: The server returns the same error for read commands as well
  explanation:
    en: With `noeviction`, keys are not evicted but the server returns an error when you try to execute commands
      that cache new data. Evicting the least recently used keys is wrong because that is what `allkeys-lru` does.
      Evicting keys at random is wrong because that is what `allkeys-random` does. An error for read commands is
      wrong because commands that only read existing data still work as normal.
  citation: redis-eviction#eviction-policies
  extract:
    en: 'noeviction: Keys are not evicted but the server will return an error when you try to execute commands that
      cache new data.'
- id: m09-l05-q06
  prompt:
    en: Redis runs with `volatile-lru` and `maxmemory` is reached, but no key has an associated expiration. How
      does the server behave?
  options:
  - id: a
    correct: true
    text:
      en: 'Like `noeviction`: no key is evicted and commands that cache new data return an error'
  - id: b
    text:
      en: 'Like `allkeys-lru`: it evicts the least recently used keys whether or not they expire'
  - id: c
    text:
      en: 'Like `volatile-ttl`: it evicts the keys with the shortest remaining TTL'
  - id: d
    text:
      en: 'Like `allkeys-random`: it evicts keys at random until memory is free'
  explanation:
    en: The `volatile-xxx` policies behave like `noeviction` if no keys have an associated expiration. Evicting
      least recently used keys regardless of expiration is wrong because `volatile-lru` evicts only keys that have
      an associated expiration. Evicting by shortest remaining TTL is wrong because `volatile-ttl` also needs keys
      with an associated expiration. Evicting random keys is wrong because that is the behavior of `allkeys-random`,
      not of a `volatile-xxx` policy.
  citation: redis-eviction#eviction-policies
  extract:
    en: The volatile-xxx policies behave like noeviction if no keys have an associated expiration.
- id: m09-l05-q07
  prompt:
    en: In Redis Cluster with default settings, a client writes to a master and receives OK, then the master crashes
      before sending the write to its replicas. What can follow?
  options:
  - id: a
    text:
      en: The replicas refuse promotion until they hold the write, so no acknowledged write is lost
  - id: b
    correct: true
    text:
      en: A replica that did not receive the write can be promoted, and the acknowledged write is lost
  - id: c
    text:
      en: The `WAIT` command makes losing the write impossible even in this case
  - id: d
    text:
      en: The master had waited for its replicas to acknowledge the write before replying OK
  explanation:
    en: If the master acknowledges a write but crashes before sending it to its replicas, a replica that did not
      receive the write can be promoted to master, losing the write forever. Refusing promotion is wrong because
      a replica that did not receive the write can still be promoted. The `WAIT` claim is wrong because Redis Cluster
      does not implement strong consistency even when synchronous replication is used. Waiting for the replicas
      is wrong because the master does not wait for an acknowledgement from its replicas before replying to the
      client.
  citation: redis-scaling#redis-cluster-consistency-guarantees
  extract:
    en: if your client writes something, B acknowledges the write, but crashes before being able to send the write
      to its replicas, one of the replicas (that did not receive the write) can be promoted to master, losing the
      write forever.
- id: m09-l05-q08
  prompt:
    en: What advantage does Redis Sentinel get from running several Sentinel processes that cooperate with each
      other?
  options:
  - id: a
    text:
      en: Failover only works while every Sentinel process is running
  - id: b
    text:
      en: Failure detection is faster because one Sentinel can declare a master unavailable alone
  - id: c
    correct: true
    text:
      en: Failure detection needs several Sentinels to agree that a master is unavailable, which lowers false positives
  - id: d
    text:
      en: One Sentinel is enough, because a failover system cannot be a single point of failure
  explanation:
    en: Failure detection is performed when multiple Sentinels agree that a given master is no longer available,
      which lowers the probability of false positives. Requiring every Sentinel is wrong because Sentinel works
      even if not all the Sentinel processes are working. Declaring a master unavailable alone is wrong because
      detection needs multiple Sentinels to agree. A single Sentinel is wrong because a failover system that is
      itself a single point of failure defeats its purpose.
  citation: redis-sentinel#sentinel-as-a-distributed-system
  extract:
    en: Failure detection is performed when multiple Sentinels agree about the fact a given master is no longer
      available. This lowers the probability of false positives.
- id: m09-l05-q09
  prompt:
    en: In the Elastic Stack, what is the default value of the dynamic index setting `index.refresh_interval`?
  options:
  - id: a
    correct: true
    text:
      en: '`1s`'
  - id: b
    text:
      en: '`5s`'
  - id: c
    text:
      en: '`30s`'
  - id: d
    text:
      en: '`-1`'
  explanation:
    en: The value of `index.refresh_interval` defaults to `1s` in the Elastic Stack. The value `5s` is wrong because
      it is the default in Serverless. The value `30s` is wrong because it is the default of `index.search.idle.after`,
      the time before a shard is considered search idle. The value `-1` is wrong because it is the setting value
      that disables periodic refresh operations.
  citation: es-index-modules#dynamic-index-settings
- id: m09-l05-q10
  prompt:
    en: An Elasticsearch node crashes after acknowledging an indexing operation but before the next Lucene commit.
      From where is the operation recovered when the shard recovers?
  options:
  - id: a
    text:
      en: From the segments in the filesystem cache, which are always flushed before the acknowledgement
  - id: b
    correct: true
    text:
      en: From the translog
  - id: c
    text:
      en: It cannot be recovered, because changes after a commit are kept only in memory
  - id: d
    text:
      en: From the last refresh, which persisted the operation to disk
  explanation:
    en: In the event of a crash, acknowledged operations that are not yet included in the last Lucene commit are
      recovered from the translog when the shard recovers. Segments in the filesystem cache are wrong because a
      new segment is written to the cache first and only later flushed to disk. Losing the operation is wrong because
      operations acknowledged but not yet committed are recovered from the translog. A refresh is wrong because
      it makes documents visible to search without performing a full commit.
  citation: es-translog#elastic-docs-v3
- id: m09-l05-q12
  prompt:
    en: An Elasticsearch index is divided into primary shards and replica shards. Which statement about the number
      of shards of each kind is correct?
  options:
  - id: a
    correct: true
    text:
      en: The number of replica shards can be changed at any time, while the number of primary shards is fixed at
        index creation
  - id: b
    text:
      en: The number of primary shards can be changed at any time with `index.number_of_shards`
  - id: c
    text:
      en: A replica shard holds a different subset of the documents than its primary shard
  - id: d
    text:
      en: Every document belongs to several primary shards, which share its storage
  explanation:
    en: The number of primary shards is fixed at index creation, while the number of replicas can be adjusted at
      any time. Changing the primary shards later is wrong because their number is fixed at index creation. A replica
      holding different documents is wrong because a replica shard is a copy of a primary shard. A document in several
      primary shards is wrong because every document belongs to exactly one primary shard.
  citation: es-index-basics#how-an-index-stores-data
- id: m09-l05-q15
  prompt:
    en: A node's JVM sees 16 processors. With no explicit setting and ignoring clamping, what is the default of
      `index.merge.scheduler.max_thread_count` for a shard?
  options:
  - id: a
    text:
      en: 16, one thread per processor
  - id: b
    text:
      en: 4, a quarter of the processors
  - id: c
    text:
      en: 32, twice the number of processors
  - id: d
    correct: true
    text:
      en: 8, half the number of processors
  explanation:
    en: The setting defaults to half the number of processors the JVM sees on the node, with a minimum of 1, so
      16 processors give 8. That single default rules out 16, 4 and 32.
  citation: es-merge-settings#merge-scheduling
