- id: g-wire-safe-change
  term:
    en: wire-safe change
  definition:
    en: Wire-safe changes are ones where it is fully safe to evolve the schema in this way without risk of data loss or new parse failures.
  origin: m07-l07
  citation: protobuf-proto3#wire-safe-changes
- id: g-robustness-principle
  term:
    en: robustness principle
  definition:
    en: Be strict when sending and tolerant when receiving. Implementations must follow specifications precisely when sending to the network, and tolerate faulty input from the network.
  origin: m07-l07
  citation: rfc9413#section-2
- id: g-sunset-header
  term:
    en: Sunset header field
  definition:
    en: The Sunset HTTP response header field allows a server to communicate the fact that a resource is expected to become unresponsive at a specific point in time.
  origin: m07-l07
  citation: rfc8594#section-3
