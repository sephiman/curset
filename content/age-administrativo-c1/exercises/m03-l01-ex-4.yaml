# anchor: boe-a-1889-4763-art-1
- id: m03-l01-q058
  prompt:
    es: "La costumbre, como fuente del ordenamiento jurídico español, solo regirá en defecto de ley aplicable, siempre que:"
  options:
  - id: a
    text:
      es: "No sea contraria a la moral o al orden público, aunque no resulte probada."
  - id: b
    text:
      es: "Haya sido reconocida por la jurisprudencia reiterada del Tribunal Supremo."
  - id: c
    correct: true
    text:
      es: "No sea contraria a la moral o al orden público, y que resulte probada."
  - id: d
    text:
      es: "Haya sido publicada en el diario oficial de la Comunidad Autónoma."
  explanation:
    es: "El artículo 1.3 exige que la costumbre «no sea contraria a la moral o al orden público, y que resulte probada». La prueba es un requisito, así que la opción «aunque no resulte probada» es falsa. El artículo no exige reconocimiento por la jurisprudencia ni publicación oficial."
  citation: "art. 1.3 Código Civil"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1889-4763-art-1
- id: m03-l01-q059
  prompt:
    es: "Según el artículo 1.4 del Código Civil, en el sistema de fuentes del ordenamiento, los principios generales del derecho:"
  options:
  - id: a
    correct: true
    text:
      es: "Se aplicarán en defecto de ley o costumbre, sin perjuicio de su carácter informador."
  - id: b
    text:
      es: "Se aplicarán con preferencia a la costumbre, por su carácter informador del ordenamiento."
  - id: c
    text:
      es: "Se aplicarán en defecto de ley, con preferencia a la costumbre que resulte probada."
  - id: d
    text:
      es: "Solo se aplicarán cuando los recoja la jurisprudencia reiterada del Tribunal Supremo."
  explanation:
    es: "El artículo 1.4 dice que los principios generales «se aplicarán en defecto de ley o costumbre, sin perjuicio de su carácter informador del ordenamiento jurídico». Van después de la costumbre, no antes, así que las dos opciones que les dan preferencia sobre ella son falsas. Su aplicación no depende de que los recoja la jurisprudencia."
  citation: "art. 1.4 Código Civil"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1889-4763-art-1
- id: m03-l01-q060
  prompt:
    es: "Según el artículo 1.6 del Código Civil, ¿qué función cumple la jurisprudencia en el ordenamiento jurídico?"
  options:
  - id: a
    text:
      es: "Es una fuente del ordenamiento al mismo nivel que la ley y la costumbre."
  - id: b
    correct: true
    text:
      es: "Lo complementa con la doctrina que, de modo reiterado, establezca el Tribunal Supremo."
  - id: c
    text:
      es: "Lo complementa con la doctrina de cualquier órgano judicial, aunque no sea reiterada."
  - id: d
    text:
      es: "Lo complementa con la doctrina que, de modo reiterado, establezca la Audiencia Nacional."
  explanation:
    es: "El artículo 1.6 dice que la jurisprudencia «complementará el ordenamiento jurídico con la doctrina que, de modo reiterado, establezca el Tribunal Supremo». No es fuente: las fuentes son la ley, la costumbre y los principios generales (art. 1.1). La doctrina ha de ser reiterada y del Tribunal Supremo, no de cualquier órgano judicial ni de la Audiencia Nacional."
  citation: "art. 1.6 Código Civil"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1889-4763-art-1
- id: m03-l01-q061
  prompt:
    es: "¿Cuándo son de aplicación directa en España las normas jurídicas de los tratados internacionales, según el Código Civil?"
  options:
  - id: a
    text:
      es: "Desde su firma por el Estado español, aunque todavía no se hayan publicado."
  - id: b
    text:
      es: "Desde la autorización de las Cortes Generales, sin necesidad de publicación."
  - id: c
    correct: true
    text:
      es: "Cuando se hayan publicado íntegramente en el «Boletín Oficial del Estado»."
  - id: d
    text:
      es: "Desde su ratificación, aunque solo se publique un extracto en el BOE."
  explanation:
    es: "El artículo 1.5 dice que no serán de aplicación directa «en tanto no hayan pasado a formar parte del ordenamiento interno mediante su publicación íntegra en el «Boletín Oficial del Estado»». La firma y la autorización de las Cortes no bastan sin publicación. Un extracto tampoco basta: la publicación ha de ser íntegra."
  citation: "art. 1.5 Código Civil"
  difficulty: 2
  tags:
  - "requisito"
