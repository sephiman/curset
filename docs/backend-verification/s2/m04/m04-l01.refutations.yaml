m04-l01-q04:
  key:
    anchor: kotlin-docs-generics#declaration-site-variance
    sentence: It makes a type parameter contravariant, meaning it can only be consumed and never produced.
  wrong:
  - option: '`out`, as in `Source<out T>`'
    anchor: kotlin-docs-generics#declaration-site-variance
    sentence: when a type parameter T of a class C is declared out, it may occur only in the out-position in the members of C
  - option: '`reified`, as in `inline fun <reified T>`'
    anchor: kotlin-docs-inline-functions#reified-type-parameters
    sentence: The code above qualifies the type parameter with the reified modifier to make it accessible inside the function, almost as if it were a normal class.
  - option: A star-projection, as in `Foo<*>`
    anchor: kotlin-docs-generics#star-projections
    sentence: For Foo<in T>, where T is a contravariant type parameter, Foo<*> is equivalent to Foo<in Nothing>.
