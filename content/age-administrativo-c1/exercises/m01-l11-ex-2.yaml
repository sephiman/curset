# anchor: celex-12016m-txt-art-14
- id: m01-l11-q020
  prompt:
    es: "De acuerdo con el artículo 14 del Tratado de la Unión Europea, el Parlamento Europeo:"
  options:
  - id: a
    correct: true
    text:
      es: "Ejercerá conjuntamente con el Consejo la función legislativa y la función presupuestaria, y elegirá al Presidente de la Comisión."
  - id: b
    text:
      es: "Ejercerá conjuntamente con la Comisión la función legislativa y la función presupuestaria, y elegirá al Presidente del Consejo Europeo."
  - id: c
    text:
      es: "Ejercerá en exclusiva la función legislativa y, conjuntamente con el Consejo, la función presupuestaria."
  - id: d
    text:
      es: "Ejercerá conjuntamente con el Consejo la función legislativa y nombrará al Alto Representante de la Unión."
  explanation:
    es: "El artículo 14.1 TUE dice que el Parlamento «ejercerá conjuntamente con el Consejo la función legislativa y la función presupuestaria» y que «elegirá al Presidente de la Comisión». La Comisión no comparte esas funciones, y al Presidente del Consejo Europeo lo elige el Consejo Europeo (art. 15.5 TUE). La función legislativa no es exclusiva del Parlamento. Al Alto Representante lo nombra el Consejo Europeo (art. 18.1 TUE)."
  citation: "art. 14.1 TUE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: celex-12016m-txt-art-14
- id: m01-l11-q021
  prompt:
    es: "El número máximo de representantes de los ciudadanos de la Unión que pueden componer el Parlamento Europeo es el siguiente:"
  options:
  - id: a
    text:
      es: "No excederá de setecientos cincuenta, incluido el Presidente."
  - id: b
    correct: true
    text:
      es: "No excederá de setecientos cincuenta, más el Presidente."
  - id: c
    text:
      es: "No excederá de setecientos veinte, más el Presidente."
  - id: d
    text:
      es: "No excederá de setecientos cincuenta y uno, más el Presidente."
  explanation:
    es: "El artículo 14.2 TUE dice que el número de diputados «no excederá de setecientos cincuenta, más el Presidente». El Presidente se suma a los 750, no se cuenta dentro. Setecientos veinte es el número de diputados que tiene la cámara a fecha de 16-10-2026, no el límite del Tratado. Setecientos cincuenta y uno es el total con el Presidente, no la cifra a la que este se añade."
  citation: "art. 14.2 TUE"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: celex-12016m-txt-art-14
- id: m01-l11-q022
  prompt:
    es: "Según el artículo 14 del Tratado de la Unión Europea, ¿cómo será la representación de los ciudadanos en el Parlamento Europeo?"
  options:
  - id: a
    text:
      es: "Estrictamente proporcional a la población de cada Estado miembro, sin un mínimo de diputados por Estado."
  - id: b
    text:
      es: "Decrecientemente proporcional, con un mínimo de cinco diputados por Estado miembro y un máximo de noventa y nueve escaños."
  - id: c
    correct: true
    text:
      es: "Decrecientemente proporcional, con un mínimo de seis diputados por Estado miembro y sin que ninguno tenga más de noventa y seis escaños."
  - id: d
    text:
      es: "Igual para todos los Estados miembros, que eligen el mismo número de diputados."
  explanation:
    es: "El artículo 14.2 TUE dice que la representación de los ciudadanos «será decrecientemente proporcional, con un mínimo de seis diputados por Estado miembro» y que «no se asignará a ningún Estado miembro más de noventa y seis escaños». «Estrictamente proporcional, sin mínimo» contradice «decrecientemente proporcional» y el mínimo de seis. «Igual para todos los Estados» también contradice «decrecientemente proporcional». Un mínimo de cinco y un máximo de noventa y nueve no coinciden con el seis y el noventa y seis del apartado."
  citation: "art. 14.2 TUE"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: fuente-ue-parlamento-europeo-html
- id: m01-l11-q023
  prompt:
    es: "A fecha de 16 de octubre de 2026, ¿cuántos diputados tiene el Parlamento Europeo según su ficha en el portal oficial de la Unión Europea?"
  options:
  - id: a
    text:
      es: "705 eurodiputados."
  - id: b
    text:
      es: "750 eurodiputados."
  - id: c
    text:
      es: "751 eurodiputados."
  - id: d
    correct: true
    text:
      es: "720 eurodiputados."
  explanation:
    es: "La ficha del Parlamento Europeo en el portal de la Unión, consultada el 16-10-2026, dice «Miembros: 720 eurodiputados». 750 más el Presidente, es decir 751, es el máximo que permite el artículo 14.2 TUE, no la cifra actual. 705 no es la cifra que da la ficha."
  citation: "fuente: `ue-parlamento-europeo.html`"
  difficulty: 1
  tags:
  - "composición"
  - "cantidad"
# anchor: celex-12016m-txt-art-14
- id: m01-l11-q024
  prompt:
    es: "¿Cómo son elegidos los diputados al Parlamento Europeo y para qué mandato, según lo dispuesto en el Tratado de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "Por sufragio universal directo, libre y secreto, para un mandato de cinco años."
  - id: b
    text:
      es: "Por sufragio indirecto, a través de los Parlamentos nacionales, para un mandato de cinco años."
  - id: c
    text:
      es: "Por sufragio universal directo, libre y secreto, para un mandato de cuatro años."
  - id: d
    text:
      es: "Por sufragio universal directo, libre y secreto, para un mandato de seis años."
  explanation:
    es: "El artículo 14.3 TUE dice que los diputados «serán elegidos por sufragio universal directo, libre y secreto, para un mandato de cinco años». El sufragio no es indirecto. Cuatro años no es la duración del Tratado, y seis años es la de los jueces del Tribunal de Justicia (art. 253 TFUE)."
  citation: "art. 14.3 TUE"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: celex-12016e-txt-art-229
- id: m01-l11-q025
  prompt:
    es: "De acuerdo con el artículo 229 del Tratado de Funcionamiento de la Unión Europea, el Parlamento Europeo celebrará cada año un período de sesiones y se reunirá sin necesidad de previa convocatoria:"
  options:
  - id: a
    text:
      es: "El primer martes de marzo."
  - id: b
    correct: true
    text:
      es: "El segundo martes de marzo."
  - id: c
    text:
      es: "El segundo martes de septiembre."
  - id: d
    text:
      es: "El segundo lunes de marzo."
  explanation:
    es: "El artículo 229 TFUE dice que el Parlamento Europeo «se reunirá sin necesidad de previa convocatoria el segundo martes de marzo». Las otras opciones cambian el ordinal, el mes o el día de la semana."
  citation: "art. 229 TFUE"
  difficulty: 1
  tags:
  - "fecha"
  - "procedimiento"
# anchor: celex-12016e-txt-art-231
- id: m01-l11-q026
  prompt:
    es: "Según el artículo 231 del Tratado de Funcionamiento de la Unión Europea, salvo disposición en contrario de los Tratados, ¿cómo decidirá el Parlamento Europeo?"
  options:
  - id: a
    text:
      es: "Por mayoría de los miembros que lo componen."
  - id: b
    text:
      es: "Por mayoría de dos tercios de los votos emitidos."
  - id: c
    correct: true
    text:
      es: "Por mayoría de los votos emitidos."
  - id: d
    text:
      es: "Por mayoría de los miembros presentes."
  explanation:
    es: "El artículo 231 TFUE dice que, «salvo disposición en contrario de los Tratados, el Parlamento Europeo decidirá por mayoría de los votos emitidos». La mayoría de los miembros que lo componen se exige en casos concretos, como la elección del Presidente de la Comisión (art. 17.7 TUE). Los dos tercios de los votos emitidos son de la moción de censura (art. 234 TFUE). Los miembros presentes no son la base del artículo."
  citation: "art. 231 TFUE"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: celex-12016e-txt-art-234
- id: m01-l11-q027
  prompt:
    es: "De acuerdo con el artículo 234 del Tratado de Funcionamiento de la Unión Europea, el Parlamento Europeo solo podrá pronunciarse sobre una moción de censura sobre la gestión de la Comisión:"
  options:
  - id: a
    text:
      es: "Transcurridas cuarenta y ocho horas como mínimo desde su presentación y en votación pública."
  - id: b
    text:
      es: "Transcurridos tres días como mínimo desde la fecha de su presentación y en votación secreta."
  - id: c
    text:
      es: "Transcurridos siete días como mínimo desde la fecha de su presentación y en votación pública."
  - id: d
    correct: true
    text:
      es: "Transcurridos tres días como mínimo desde la fecha de su presentación y en votación pública."
  explanation:
    es: "El artículo 234 TFUE dice que el Parlamento «sólo podrá pronunciarse sobre dicha moción transcurridos tres días como mínimo desde la fecha de su presentación y en votación pública». Cuarenta y ocho horas y siete días cambian el plazo. La votación es pública, no secreta."
  citation: "art. 234 TFUE"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: celex-12016e-txt-art-234
- id: m01-l11-q028
  prompt:
    es: "Según el artículo 234 del Tratado de Funcionamiento de la Unión Europea, ¿qué mayoría se requiere para aprobar una moción de censura sobre la gestión de la Comisión?"
  options:
  - id: a
    correct: true
    text:
      es: "Dos tercios de los votos emitidos que representen, a su vez, la mayoría de los diputados que componen el Parlamento Europeo."
  - id: b
    text:
      es: "Mayoría absoluta de los diputados que componen el Parlamento Europeo."
  - id: c
    text:
      es: "Tres quintos de los votos emitidos que representen, a su vez, la mayoría de los diputados que componen el Parlamento."
  - id: d
    text:
      es: "Dos tercios de los diputados que componen el Parlamento Europeo."
  explanation:
    es: "El artículo 234 TFUE exige la «mayoría de dos tercios de los votos emitidos que representen, a su vez, la mayoría de los diputados que componen el Parlamento Europeo». La mayoría absoluta sola no basta. Tres quintos cambia la fracción. Los dos tercios se calculan sobre los votos emitidos, no sobre el total de diputados."
  citation: "art. 234 TFUE"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: celex-12016e-txt-art-234
- id: m01-l11-q029
  prompt:
    es: "Señale la respuesta correcta sobre los efectos de la aprobación de una moción de censura contra la Comisión, conforme al Tratado de Funcionamiento de la Unión Europea:"
  options:
  - id: a
    text:
      es: "Solo deberá dimitir el Presidente de la Comisión, y los demás miembros seguirán en funciones hasta el fin del mandato."
  - id: b
    correct: true
    text:
      es: "Los miembros de la Comisión deberán dimitir colectivamente y el Alto Representante deberá dimitir del cargo que ejerce en la Comisión."
  - id: c
    text:
      es: "Los miembros de la Comisión deberán dimitir colectivamente y el Alto Representante deberá dejar también la presidencia del Consejo de Asuntos Exteriores."
  - id: d
    text:
      es: "Los miembros de la Comisión cesarán en el acto y no podrán despachar asunto alguno hasta su sustitución."
  explanation:
    es: "El artículo 234 TFUE dice que, aprobada la moción, «los miembros de la Comisión deberán dimitir colectivamente de sus cargos y el Alto Representante […] deberá dimitir del cargo que ejerce en la Comisión». La dimisión es colectiva, no solo del Presidente. El Alto Representante deja solo su cargo en la Comisión. Los dimisionarios siguen despachando los asuntos de administración ordinaria hasta ser sustituidos."
  citation: "art. 234 TFUE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: celex-12016m-txt-art-17
- id: m01-l11-q030
  prompt:
    es: "Según el artículo 17 del Tratado de la Unión Europea, ¿cuál de las siguientes funciones corresponde a la Comisión?"
  options:
  - id: a
    text:
      es: "Definir las orientaciones y prioridades políticas generales de la Unión."
  - id: b
    text:
      es: "Ejercer, conjuntamente con el Parlamento Europeo, la función presupuestaria."
  - id: c
    correct: true
    text:
      es: "Supervisar la aplicación del Derecho de la Unión bajo el control del Tribunal de Justicia de la Unión Europea."
  - id: d
    text:
      es: "Asumir la representación exterior de la Unión en la política exterior y de seguridad común."
  explanation:
    es: "El artículo 17.1 TUE dice que la Comisión «supervisará la aplicación del Derecho de la Unión bajo el control del Tribunal de Justicia de la Unión Europea». Definir las orientaciones y prioridades políticas generales es función del Consejo Europeo (art. 15.1 TUE). La función presupuestaria la ejerce el Consejo con el Parlamento (art. 16.1 TUE). La representación exterior de la Comisión excluye precisamente la política exterior y de seguridad común."
  citation: "art. 17.1 TUE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: celex-12016m-txt-art-17
- id: m01-l11-q032
  prompt:
    es: "¿Cuál es la duración del mandato de la Comisión Europea según lo dispuesto en el Tratado de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "Un mandato de cinco años."
  - id: b
    text:
      es: "Un mandato de cuatro años."
  - id: c
    text:
      es: "Un mandato de dos años y medio."
  - id: d
    text:
      es: "Un mandato de seis años."
  explanation:
    es: "El artículo 17.3 TUE dice: «El mandato de la Comisión será de cinco años». Dos años y medio es el mandato del Presidente del Consejo Europeo (art. 15.5 TUE). Seis años es el de los jueces del Tribunal de Justicia (art. 253 TFUE). Cuatro años no aparece en los Tratados para estos cargos."
  citation: "art. 17.3 TUE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: celex-12016m-txt-art-17
- id: m01-l11-q033
  prompt:
    es: "De acuerdo con el artículo 17 del Tratado de la Unión Europea, a partir del 1 de noviembre de 2014 la Comisión estará compuesta por un número de miembros correspondiente:"
  options:
  - id: a
    text:
      es: "A la mitad del número de Estados miembros, incluidos su Presidente y el Alto Representante, salvo que el Consejo Europeo decida por unanimidad modificarlo."
  - id: b
    correct: true
    text:
      es: "A los dos tercios del número de Estados miembros, incluidos su Presidente y el Alto Representante, salvo que el Consejo Europeo decida por unanimidad modificarlo."
  - id: c
    text:
      es: "A los dos tercios del número de Estados miembros, sin contar a su Presidente ni al Alto Representante."
  - id: d
    text:
      es: "A los dos tercios del número de Estados miembros, salvo que el Consejo decida por mayoría cualificada modificarlo."
  explanation:
    es: "El artículo 17.5 TUE dice que la Comisión estará compuesta «por un número de miembros correspondiente a los dos tercios del número de Estados miembros, que incluirá a su Presidente y al Alto Representante […], a menos que el Consejo Europeo decida por unanimidad modificar dicho número». La mitad cambia la fracción. El Presidente y el Alto Representante se cuentan dentro. Quien puede modificar el número es el Consejo Europeo por unanimidad, no el Consejo por mayoría cualificada."
  citation: "art. 17.5 TUE"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: fuente-ue-comision-europea-html
- id: m01-l11-q034
  prompt:
    es: "A fecha de 16 de octubre de 2026, según la ficha de la Comisión Europea en el portal oficial de la Unión, el liderazgo político de la Comisión lo forma un equipo de:"
  options:
  - id: a
    text:
      es: "Dieciocho comisarios, los dos tercios del número de países miembros, incluida la presidenta."
  - id: b
    text:
      es: "Veintiocho comisarios, uno de cada país miembro, más la presidenta."
  - id: c
    correct: true
    text:
      es: "Veintisiete comisarios, uno de cada país miembro, en el que se incluye a la presidenta."
  - id: d
    text:
      es: "Treinta comisarios, incluidos la presidenta y el Alto Representante."
  explanation:
    es: "La ficha de la Comisión en el portal de la Unión, consultada el 16-10-2026, dice que el liderazgo político corresponde a «un equipo de veintisiete comisarios, uno de cada país miembro, en el que se incluye a la presidenta de la Comisión». Dieciocho sería el resultado de aplicar los dos tercios del artículo 17.5 TUE, no la cifra de la ficha. La presidenta está dentro de los veintisiete, no se suma. Treinta no es la cifra de la ficha."
  citation: "fuente: `ue-comision-europea.html`"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: celex-12016m-txt-art-17
- id: m01-l11-q035
  prompt:
    es: "De acuerdo con el artículo 17 del Tratado de la Unión Europea, el candidato al cargo de Presidente de la Comisión:"
  options:
  - id: a
    text:
      es: "Lo propone el Consejo por unanimidad y lo elige el Parlamento Europeo por mayoría de los votos emitidos."
  - id: b
    text:
      es: "Lo propone el Parlamento Europeo y lo nombra el Consejo Europeo por unanimidad."
  - id: c
    text:
      es: "Lo propone el Consejo Europeo por mayoría cualificada y lo elige el Parlamento Europeo por mayoría de dos tercios."
  - id: d
    correct: true
    text:
      es: "Lo propone el Consejo Europeo por mayoría cualificada y lo elige el Parlamento Europeo por mayoría de los miembros que lo componen."
  explanation:
    es: "El artículo 17.7 TUE dice que el Consejo Europeo propondrá al Parlamento, «por mayoría cualificada, un candidato al cargo de Presidente de la Comisión», y que «el Parlamento Europeo elegirá al candidato por mayoría de los miembros que lo componen». No propone el Consejo ni el Parlamento. La mayoría de los votos emitidos y los dos tercios no son las del artículo."
  citation: "art. 17.7 TUE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "mayoría"
  - "órgano"
# anchor: celex-12016m-txt-art-17
- id: m01-l11-q036
  prompt:
    es: "Si el candidato a Presidente de la Comisión no obtiene en el Parlamento Europeo la mayoría necesaria, ¿qué prevé el Tratado de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "Que el Consejo Europeo proponga, en el plazo de un mes y por mayoría cualificada, un nuevo candidato."
  - id: b
    text:
      es: "Que el Consejo Europeo proponga, en el plazo de tres meses y por unanimidad, un nuevo candidato."
  - id: c
    text:
      es: "Que el Parlamento Europeo elija directamente a otro candidato de entre sus diputados."
  - id: d
    text:
      es: "Que el Consejo Europeo pueda nombrar al mismo candidato si lo acuerda por unanimidad."
  explanation:
    es: "El artículo 17.7 TUE dice: «Si el candidato no obtiene la mayoría necesaria, el Consejo Europeo propondrá en el plazo de un mes, por mayoría cualificada, un nuevo candidato». Tres meses y unanimidad cambian plazo y mayoría. El Parlamento no elige por su cuenta a otro candidato. El Consejo Europeo no puede imponer al candidato rechazado."
  citation: "art. 17.7 TUE"
  difficulty: 3
  tags:
  - "plazo"
  - "procedimiento"
# anchor: celex-12016m-txt-art-17
- id: m01-l11-q037
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el nombramiento de la Comisión es correcta según el Tratado de la Unión Europea?"
  options:
  - id: a
    text:
      es: "Tras el voto de aprobación colegiado del Parlamento Europeo, el Consejo nombra la Comisión por unanimidad de sus miembros."
  - id: b
    correct: true
    text:
      es: "Tras el voto de aprobación colegiado del Parlamento Europeo, el Consejo Europeo nombra la Comisión por mayoría cualificada."
  - id: c
    text:
      es: "Cada comisario se somete individualmente a un voto de investidura del Parlamento y lo nombra el Presidente de la Comisión."
  - id: d
    text:
      es: "La lista de los demás miembros de la Comisión la adopta el Parlamento Europeo, de común acuerdo con el Presidente electo."
  explanation:
    es: "El artículo 17.7 TUE dice que el Presidente, el Alto Representante y los demás miembros «se someterán colegiadamente al voto de aprobación del Parlamento Europeo» y que, sobre esa base, «la Comisión será nombrada por el Consejo Europeo, por mayoría cualificada». No la nombra el Consejo, ni por unanimidad. El voto es colegiado, no individual. La lista la adopta el Consejo de común acuerdo con el Presidente electo, no el Parlamento."
  citation: "art. 17.7 TUE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: celex-12016e-txt-art-250
- id: m01-l11-q038
  prompt:
    es: "Según el artículo 250 del Tratado de Funcionamiento de la Unión Europea, ¿por qué mayoría se adoptan los acuerdos de la Comisión?"
  options:
  - id: a
    text:
      es: "Por mayoría de los votos emitidos."
  - id: b
    text:
      es: "Por mayoría cualificada de sus miembros."
  - id: c
    correct: true
    text:
      es: "Por mayoría de sus miembros."
  - id: d
    text:
      es: "Por consenso de todos sus miembros."
  explanation:
    es: "El artículo 250 TFUE dice que «los acuerdos de la Comisión se adoptarán por mayoría de sus miembros» y que su reglamento interno fija el quórum. La mayoría de los votos emitidos es la regla del Parlamento Europeo (art. 231 TFUE). La mayoría cualificada es la del Consejo (art. 16.3 TUE) y el consenso la del Consejo Europeo (art. 15.4 TUE)."
  citation: "art. 250 TFUE"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: celex-12016e-txt-art-247
- id: m01-l11-q039
  prompt:
    es: "De acuerdo con el artículo 247 del Tratado de Funcionamiento de la Unión Europea, el miembro de la Comisión que haya cometido una falta grave podrá ser cesado:"
  options:
  - id: a
    text:
      es: "Por el Parlamento Europeo, mediante una moción de censura individual."
  - id: b
    text:
      es: "Por el Consejo Europeo, por mayoría cualificada, a propuesta del Presidente de la Comisión."
  - id: c
    text:
      es: "Por el Tribunal de Justicia, a instancia del Parlamento Europeo, por mayoría de dos tercios."
  - id: d
    correct: true
    text:
      es: "Por el Tribunal de Justicia, a instancia del Consejo, por mayoría simple, o de la Comisión."
  explanation:
    es: "El artículo 247 TFUE dice que el miembro de la Comisión que haya cometido una falta grave «podrá ser cesado por el Tribunal de Justicia, a instancia del Consejo, por mayoría simple, o de la Comisión». La moción de censura del Parlamento es colectiva y afecta a toda la Comisión (art. 234 TFUE). El Consejo Europeo no cesa comisarios. El Parlamento no está entre quienes pueden instar el cese."
  citation: "art. 247 TFUE"
  difficulty: 3
  tags:
  - "órgano"
  - "procedimiento"
