# anchor: boe-a-2003-21614-art-140
- id: m05-l03-q144
  prompt:
    es: "Según el artículo 140.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, corresponde el control externo del sector público estatal:"
  options:
  - id: a
    correct: true
    text:
      es: "al Tribunal de Cuentas, en los términos que fijan la Constitución y su ley orgánica."
  - id: b
    text:
      es: "al Defensor del Pueblo, en los términos de su ley orgánica."
  - id: c
    text:
      es: "a la Intervención General de la Administración del Estado, en los términos de esta ley."
  - id: d
    text:
      es: "al Consejo de Estado, en los términos de su ley orgánica."
  explanation:
    es: "El control externo del sector público estatal es del Tribunal de Cuentas. La IGAE ejerce el control interno, y el Consejo de Estado y el Defensor del Pueblo no tienen esa función según el artículo 140.1."
  citation: "art. 140 LGP"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-140
- id: m05-l03-q145
  prompt:
    es: "Según el artículo 140.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿quién ejerce el control interno de la gestión económica y financiera del sector público estatal?"
  options:
  - id: a
    text:
      es: "La Dirección General del Tesoro y Política Financiera."
  - id: b
    text:
      es: "La Dirección General de Presupuestos."
  - id: c
    correct: true
    text:
      es: "La Intervención General de la Administración del Estado."
  - id: d
    text:
      es: "El Tribunal de Cuentas, por delegación de las Cortes Generales."
  explanation:
    es: "El control interno lo ejerce la IGAE en los términos de la ley. El Tribunal de Cuentas ejerce el control externo, y las direcciones generales del Tesoro y de Presupuestos no tienen esa función de control."
  citation: "art. 140 LGP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2003-21614-art-140
- id: m05-l03-q146
  prompt:
    es: "Según el artículo 140.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la Intervención General de la Administración del Estado ejerce el control interno con plena autonomía respecto de:"
  options:
  - id: a
    text:
      es: "las Comunidades Autónomas y las entidades locales."
  - id: b
    text:
      es: "los órganos jurisdiccionales y el Ministerio Fiscal."
  - id: c
    correct: true
    text:
      es: "las autoridades y demás entidades cuya gestión controle."
  - id: d
    text:
      es: "las Cortes Generales y el Tribunal de Cuentas."
  explanation:
    es: "La autonomía de la IGAE se predica respecto de las autoridades y entidades cuya gestión controla. Las Cortes, el Tribunal de Cuentas, los órganos judiciales, las Comunidades Autónomas y las entidades locales no son el término de esa autonomía."
  citation: "art. 140 LGP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-140
- id: m05-l03-q147
  prompt:
    es: "Sobre el control del sector público estatal, el artículo 140 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria establece que:"
  options:
  - id: a
    text:
      es: "el control externo corresponde a la Intervención General y el control interno al Tribunal de Cuentas."
  - id: b
    text:
      es: "ambos controles corresponden al Tribunal de Cuentas, que delega el interno en la Intervención General."
  - id: c
    correct: true
    text:
      es: "el control externo corresponde al Tribunal de Cuentas y el control interno a la Intervención General."
  - id: d
    text:
      es: "ambos controles, externo e interno, corresponden a la Intervención General de la Administración del Estado."
  explanation:
    es: "El artículo 140 reparte los controles: el externo es del Tribunal de Cuentas y el interno de la IGAE. Las demás opciones invierten el reparto, concentran ambos controles en la IGAE o inventan una delegación del Tribunal de Cuentas."
  citation: "art. 140 LGP"
  difficulty: 3
  tags:
  - "órgano"
  - "concepto"
# anchor: boe-a-2003-21614-art-140
- id: m05-l03-q148
  prompt:
    es: "Según el artículo 140.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el Tribunal de Cuentas ejerce el control externo del sector público estatal en los términos establecidos en:"
  options:
  - id: a
    text:
      es: "la Constitución y esta ley, con exclusión de su ley orgánica."
  - id: b
    text:
      es: "las normas de auditoría que apruebe el Consejo de Ministros."
  - id: c
    text:
      es: "su ley orgánica y las instrucciones que dicte la Intervención General."
  - id: d
    correct: true
    text:
      es: "la Constitución, su ley orgánica y las demás leyes que regulen su competencia."
  explanation:
    es: "El artículo 140.1 remite a la Constitución, a la ley orgánica del Tribunal y a las demás leyes que regulen su competencia. Las instrucciones de la IGAE y las normas del Consejo de Ministros no son fuente de esa competencia."
  citation: "art. 140 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-142
- id: m05-l03-q149
  prompt:
    es: "Según el artículo 142.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el control interno se realiza mediante:"
  options:
  - id: a
    text:
      es: "la función interventora, la fiscalización externa y la auditoría pública."
  - id: b
    text:
      es: "la función interventora, el control de eficacia y el control financiero permanente."
  - id: c
    text:
      es: "el control financiero permanente, la auditoría privada y la rendición de cuentas."
  - id: d
    correct: true
    text:
      es: "la función interventora, el control financiero permanente y la auditoría pública."
  explanation:
    es: "El artículo 142.2 enumera tres formas de control interno: función interventora, control financiero permanente y auditoría pública. Las otras opciones sustituyen alguna por la fiscalización externa, un control de eficacia, la auditoría privada o la rendición de cuentas, que no son formas de control interno."
  citation: "art. 142.2 LGP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-142
- id: m05-l03-q150
  prompt:
    es: "Según el artículo 142.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cuál es una de las formas de ejercicio del control interno?"
  options:
  - id: a
    text:
      es: "El enjuiciamiento de la responsabilidad contable."
  - id: b
    correct: true
    text:
      es: "El control financiero permanente de las entidades."
  - id: c
    text:
      es: "La rendición de cuentas al Tribunal de Cuentas."
  - id: d
    text:
      es: "El control parlamentario del Presupuesto."
  explanation:
    es: "El control financiero permanente es una de las tres formas de control interno. El enjuiciamiento contable es función del Tribunal de Cuentas, el control parlamentario corresponde a las Cortes y la rendición de cuentas es una obligación de las entidades, no una forma de control."
  citation: "art. 142.2 LGP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-157
- id: m05-l03-q151
  prompt:
    es: "Conforme al artículo 157 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cómo se realiza la verificación en que consiste el control financiero permanente?"
  options:
  - id: a
    text:
      es: "De forma previa a cada acto, mediante la intervención formal del gasto."
  - id: b
    text:
      es: "De forma anual, por el Tribunal de Cuentas en su informe."
  - id: c
    correct: true
    text:
      es: "De forma continua, a través de la correspondiente intervención delegada."
  - id: d
    text:
      es: "De forma posterior y sistemática, mediante procedimientos de revisión selectivos."
  explanation:
    es: "El control financiero permanente verifica de forma continua, a través de la intervención delegada. La verificación posterior y sistemática es la de la auditoría pública, y ni la intervención previa de cada acto ni el informe anual del Tribunal de Cuentas lo definen."
  citation: "art. 157 LGP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-157
- id: m05-l03-q152
  prompt:
    es: "Según el artículo 157 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el control financiero permanente tiene por objeto verificar:"
  options:
  - id: a
    text:
      es: "la actividad de las entidades del sector público autonómico y local."
  - id: b
    correct: true
    text:
      es: "la situación y el funcionamiento económico-financiero de las entidades del sector público estatal."
  - id: c
    text:
      es: "la legalidad de cada acto de gasto antes de su aprobación o compromiso."
  - id: d
    text:
      es: "la regularidad contable de las cuentas ya rendidas al Tribunal de Cuentas."
  explanation:
    es: "El objeto del control financiero permanente es la situación y el funcionamiento económico-financiero de las entidades del sector público estatal. La legalidad previa de cada acto es función interventora, la revisión de cuentas rendidas es auditoría y el sector autonómico queda fuera."
  citation: "art. 157 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-157
- id: m05-l03-q153
  prompt:
    es: "Según el artículo 157 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el control financiero permanente se realiza a través de:"
  options:
  - id: a
    text:
      es: "los Servicios gestores del gasto."
  - id: b
    text:
      es: "la Oficina de Contabilidad del departamento."
  - id: c
    correct: true
    text:
      es: "la intervención delegada correspondiente a cada entidad."
  - id: d
    text:
      es: "el Pleno del Tribunal de Cuentas."
  explanation:
    es: "El control financiero permanente se ejerce a través de la intervención delegada correspondiente. Los Servicios gestores y las Oficinas de Contabilidad son objeto de control o de registro, y el Pleno del Tribunal de Cuentas ejerce el control externo."
  citation: "art. 157 LGP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2003-21614-art-162
- id: m05-l03-q154
  prompt:
    es: "Según el artículo 162 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la auditoría pública consiste en la verificación de la actividad económico-financiera del sector público estatal realizada:"
  options:
  - id: a
    text:
      es: "de forma ocasional, a petición del Tribunal de Cuentas."
  - id: b
    text:
      es: "con carácter previo a la aprobación de cada gasto."
  - id: c
    correct: true
    text:
      es: "con posterioridad y de forma sistemática."
  - id: d
    text:
      es: "de forma continua, a través de la intervención delegada."
  explanation:
    es: "La auditoría pública se efectúa con posterioridad y de forma sistemática. La verificación continua es la del control financiero permanente, la previa al gasto corresponde a la función interventora, y el artículo no la condiciona a petición del Tribunal de Cuentas."
  citation: "art. 162 LGP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-164
- id: m05-l03-q156
  prompt:
    es: "Según el artículo 164.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la auditoría pública adopta las modalidades de auditoría de:"
  options:
  - id: a
    text:
      es: "regularidad contable, operativa y de resultados."
  - id: b
    correct: true
    text:
      es: "regularidad contable, de cumplimiento y operativa."
  - id: c
    text:
      es: "regularidad contable, de gestión y financiera."
  - id: d
    text:
      es: "cumplimiento, operativa y de legalidad previa."
  explanation:
    es: "El artículo 164.1 LGP enumera tres modalidades de auditoría pública: la de regularidad contable, en la letra a), la de cumplimiento, en la letra b), y la operativa, en la letra c). La combinación con «de resultados» sustituye la de cumplimiento por una modalidad que el apartado no nombra. La que añade «de gestión y financiera» tampoco corresponde a las letras a) a c). La que incluye «de legalidad previa» es una forma de control distinta de las tres modalidades del apartado."
  citation: "art. 164.1 LGP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-164
- id: m05-l03-q157
  prompt:
    es: "¿Cuál de las siguientes es una modalidad de la auditoría pública según el artículo 164.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "La auditoría de legalidad previa del gasto."
  - id: b
    correct: true
    text:
      es: "La auditoría de cumplimiento de la normativa."
  - id: c
    text:
      es: "La auditoría de eficacia presupuestaria."
  - id: d
    text:
      es: "La auditoría fiscal de carácter tributario."
  explanation:
    es: "La auditoría de cumplimiento es una de las tres modalidades del artículo 164.1. La auditoría de legalidad previa, la de eficacia presupuestaria y la fiscal tributaria no están previstas en el precepto."
  citation: "art. 164.1 LGP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-137
- id: m05-l03-q158
  prompt:
    es: "Según el artículo 137 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, las entidades integrantes del sector público estatal rinden al Tribunal de Cuentas la información contable:"
  options:
  - id: a
    correct: true
    text:
      es: "por conducto de la Intervención General de la Administración del Estado."
  - id: b
    text:
      es: "por conducto de la Dirección General de Presupuestos del Ministerio."
  - id: c
    text:
      es: "directamente, sin intermediación de ningún otro órgano de la Administración."
  - id: d
    text:
      es: "por conducto del Consejo de Ministros, que las remite a las Cortes."
  explanation:
    es: "La información contable llega al Tribunal de Cuentas por conducto de la IGAE. No se rinde directamente ni a través de la Dirección General de Presupuestos o del Consejo de Ministros."
  citation: "art. 137 LGP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
