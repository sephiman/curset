# anchor: boe-a-2005-14803-art-34
- id: m03-l09-q0027
  prompt:
    es: "Conforme al artículo 34.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, será admisible el pago por tarjeta de crédito y débito, por transferencia bancaria y por domiciliación bancaria en aquellos casos en los que:"
  options:
  - id: a
    text:
      es: "Así lo solicite el obligado al pago en cada ingreso."
  - id: b
    text:
      es: "Así lo acuerde el órgano de recaudación con la entidad."
  - id: c
    correct: true
    text:
      es: "Así se establezca expresamente en una norma tributaria."
  - id: d
    text:
      es: "El importe de la deuda no exceda del límite fijado por orden."
  explanation:
    es: "Para la tarjeta, la transferencia y la domiciliación, el artículo 34.1 exige que una norma tributaria lo establezca expresamente. La solicitud del obligado no basta. El acuerdo del órgano con la entidad tampoco. El precepto no condiciona estos medios a un límite de importe."
  citation: "art. 34.1 RGR"
  difficulty: 1
  tags:
