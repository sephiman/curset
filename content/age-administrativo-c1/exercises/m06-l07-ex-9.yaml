# anchor: fuente-ms-outlook-programar-envio-html
- id: m06-l07-q255
  prompt:
    es: "En Outlook 365 clásico, ¿hasta cuántos minutos puede retrasarse la entrega de todos los mensajes creando una regla con la acción de diferir la entrega?"
  options:
  - id: a
    text:
      es: "Hasta 60 minutos"
  - id: b
    text:
      es: "Hasta 30 minutos"
  - id: c
    text:
      es: "Hasta 240 minutos"
  - id: d
    correct: true
    text:
      es: "Hasta 120 minutos"
  explanation:
    es: "La ayuda dice que la entrega puede retrasarse hasta 120 minutos, o dos horas, con una regla. Treinta, sesenta y doscientos cuarenta minutos contradicen ese máximo."
  citation: "fuente: `ms-outlook-programar-envio.html`; «Retrasar la entrega de todos los mensajes en Outlook clásico»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-ms-outlook-atajos-html
- id: m06-l07-q256
  prompt:
    es: "En Outlook 365 clásico, ¿qué método abreviado de teclado crea un mensaje nuevo desde cualquier vista de Outlook?"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl+Mayús+M"
  - id: b
    text:
      es: "Ctrl+Mayús+C"
  - id: c
    text:
      es: "Ctrl+N"
  - id: d
    text:
      es: "Ctrl+Mayús+A"
  explanation:
    es: "Ctrl+Mayús+M crea un mensaje desde cualquier vista de Outlook. Ctrl+N crea un mensaje solo desde la vista Correo. Ctrl+Mayús+A crea una cita. Ctrl+Mayús+C crea un contacto."
  citation: "fuente: `ms-outlook-atajos.html`; «Crear un elemento o archivo en la versión clásica de Outlook»"
  difficulty: 1
  tags:
  - "atajo"
