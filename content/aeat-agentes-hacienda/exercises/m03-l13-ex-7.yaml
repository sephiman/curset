# anchor: boe-a-2003-23186-art-189
- id: m03-l13-q0095
  prompt:
    es: "De acuerdo con el artículo 189.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la responsabilidad derivada de las infracciones tributarias se extingue por el fallecimiento del sujeto infractor y por:"
  options:
  - id: a
    text:
      es: "El pago de la sanción impuesta, que extingue también la responsabilidad del infractor."
  - id: b
    text:
      es: "La compensación o condonación de las sanciones tributarias que se hayan impuesto."
  - id: c
    text:
      es: "La caducidad del procedimiento sancionador iniciado para imponer la sanción."
  - id: d
    correct: true
    text:
      es: "El transcurso del plazo de prescripción para imponer las correspondientes sanciones."
  explanation:
    es: "El artículo 189.1 LGT recoge dos causas: el fallecimiento del infractor y la prescripción del plazo para imponer las sanciones. El pago, la compensación y la condonación extinguen la sanción, según el artículo 190.1, no la responsabilidad. La caducidad cierra el procedimiento, pero no está en la lista y no impide iniciar otro mientras no prescriba."
  citation: "art. 189.1 LGT"
  difficulty: 2
  tags:
  - "lista"
  - "extinción"
# anchor: boe-a-2003-23186-art-189
- id: m03-l13-q0096
  prompt:
    es: "Natalia Pons, contribuyente por el IRPF, ha dejado de presentar una declaración en 2024. La Administración regulariza su situación y Natalia paga íntegra la liquidación. ¿Extingue ese pago, según el artículo 189.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la responsabilidad derivada de la infracción tributaria?"
  options:
  - id: a
    text:
      es: "No, salvo que el pago se haga con la reducción del 40 por ciento por pronto pago del artículo 188.3."
  - id: b
    correct: true
    text:
      es: "No, porque la responsabilidad solo se extingue por fallecimiento del infractor o por prescripción, no por pagar la liquidación."
  - id: c
    text:
      es: "Sí, porque el pago de la liquidación extingue la deuda tributaria y con ella la responsabilidad por infracción."
  - id: d
    text:
      es: "Sí, pero solo si el pago se hace antes de que se inicie el procedimiento sancionador."
  explanation:
    es: "El artículo 189.1 LGT enumera solo dos causas de extinción de la responsabilidad por infracción: el fallecimiento del infractor y la prescripción. El pago de la liquidación no figura entre ellas, aunque cierre la deuda. Las reducciones del artículo 188 afectan al importe de la sanción, no a la existencia de responsabilidad."
  citation: "art. 189.1 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "extinción"
# anchor: boe-a-2003-23186-art-189
- id: m03-l13-q0097
  prompt:
    es: "De acuerdo con el artículo 189.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo de prescripción para imponer sanciones tributarias comienza a contarse:"
  options:
  - id: a
    text:
      es: "Desde el día siguiente a aquel en que finalice el plazo de presentación de la autoliquidación."
  - id: b
    text:
      es: "Desde la notificación del acuerdo de inicio del procedimiento sancionador al interesado."
  - id: c
    text:
      es: "Desde que la liquidación de la que deriva la sanción adquiere firmeza en vía administrativa."
  - id: d
    correct: true
    text:
      es: "Desde el momento en que se cometieron las correspondientes infracciones."
  explanation:
    es: "El artículo 189.2 LGT fija el inicio en el momento en que se cometieron las infracciones, no en el fin del plazo de presentación, ni en la notificación del acuerdo de inicio, ni en la firmeza de la liquidación. La duración es de cuatro años."
  citation: "art. 189.2 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "prescripción"
# anchor: boe-a-2003-23186-art-189
- id: m03-l13-q0098
  prompt:
    es: "De acuerdo con el artículo 189.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo de prescripción para imponer sanciones tributarias es de:"
  options:
  - id: a
    text:
      es: "Seis meses desde que se cometió la infracción."
  - id: b
    text:
      es: "Cinco años desde que se cometió la correspondiente infracción."
  - id: c
    correct: true
    text:
      es: "Cuatro años desde que se cometió la infracción."
  - id: d
    text:
      es: "Tres años desde que se cometió la infracción."
  explanation:
    es: "El plazo de prescripción para imponer sanciones es de cuatro años, según el artículo 189.2 LGT. Los seis meses son el plazo máximo del procedimiento sancionador y a la vez el de inicio tras la liquidación. Cinco y tres años no son plazos de esta prescripción."
  citation: "art. 189.2 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "prescripción"
# anchor: boe-a-2003-23186-art-189
- id: m03-l13-q0099
  prompt:
    es: "Luis Ayala comete una infracción tributaria el 15 de marzo de 2022. La Administración no realiza ninguna actuación con conocimiento formal del interesado ni se interpone recurso alguno. Según el artículo 189 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿hasta qué fecha puede imponerse la sanción?"
  options:
  - id: a
    text:
      es: "Hasta el 15 de marzo de 2027, cuando se cumplen cuatro años desde el vencimiento del año natural de la infracción."
  - id: b
    correct: true
    text:
      es: "Hasta el 15 de marzo de 2026, cuando se cumplen cuatro años desde que se cometió la infracción."
  - id: c
    text:
      es: "Hasta el 15 de marzo de 2025, cuando se cumplen tres años desde que se cometió la infracción."
  - id: d
    text:
      es: "Hasta el 15 de septiembre de 2022, cuando se cumplen seis meses desde que se cometió la infracción."
  explanation:
    es: "El plazo de cuatro años del artículo 189.2 LGT empieza en el momento de cometerse la infracción: 15 de marzo de 2022 más cuatro años llega al 15 de marzo de 2026. No se cuenta desde el final del año natural, y los seis meses y los tres años no son plazos de prescripción de la sanción."
  citation: "art. 189.2 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "prescripción"
# anchor: boe-a-2003-23186-art-189
- id: m03-l13-q0100
  prompt:
    es: "De acuerdo con el artículo 189.3.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo de prescripción para imponer sanciones tributarias se interrumpe por cualquier acción de la Administración tributaria conducente a la imposición de la sanción que se realice:"
  options:
  - id: a
    correct: true
    text:
      es: "Con conocimiento formal del interesado."
  - id: b
    text:
      es: "Sin necesidad de que llegue a conocimiento del interesado."
  - id: c
    text:
      es: "Con notificación expresa de una propuesta de resolución."
  - id: d
    text:
      es: "Con conocimiento del órgano de recaudación competente."
  explanation:
    es: "El artículo 189.3.a LGT interrumpe la prescripción por cualquier acción de la Administración conducente a imponer la sanción realizada con conocimiento formal del interesado. No basta con el conocimiento de otro órgano ni con una acción sin conocimiento del interesado, y no hace falta que sea una propuesta de resolución."
  citation: "art. 189.3 LGT"
  difficulty: 1
  tags:
  - "interrupción"
# anchor: boe-a-2003-23186-art-189
- id: m03-l13-q0101
  prompt:
    es: "De acuerdo con el artículo 189.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las acciones administrativas conducentes a la regularización de la situación tributaria del obligado interrumpen el plazo de prescripción para:"
  options:
  - id: a
    text:
      es: "Exigir el pago de las sanciones tributarias que ya se hayan impuesto al obligado."
  - id: b
    text:
      es: "Imponer cualquier sanción tributaria al obligado, aunque no derive de esa regularización."
  - id: c
    correct: true
    text:
      es: "Imponer las sanciones tributarias que puedan derivarse de dicha regularización."
  - id: d
    text:
      es: "Iniciar el procedimiento sancionador, que no puede iniciarse después de seis meses."
  explanation:
    es: "El artículo 189.3.a LGT dice que las acciones de regularización interrumpen la prescripción para imponer las sanciones que puedan derivarse de ella. No afecta al plazo para exigir el pago de sanciones ya impuestas, que es otra prescripción, ni a sanciones sin relación con esa regularización."
  citation: "art. 189.3 LGT"
  difficulty: 2
  tags:
  - "interrupción"
# anchor: boe-a-2003-23186-art-189
- id: m03-l13-q0102
  prompt:
    es: "Conforme al artículo 189.3.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las causas que interrumpen el plazo de prescripción para imponer sanciones tributarias:"
  options:
  - id: a
    text:
      es: "Lo interrumpe la presentación de alegaciones por el obligado, pero no la interposición de recursos."
  - id: b
    text:
      es: "Lo interrumpe la remisión del tanto de culpa a la jurisdicción penal, pero no los recursos del obligado."
  - id: c
    text:
      es: "Lo interrumpe solo la interposición de recursos en vía administrativa, pero no la de reclamaciones."
  - id: d
    correct: true
    text:
      es: "Lo interrumpen la interposición de reclamaciones o recursos de cualquier clase y la remisión del tanto de culpa a la jurisdicción penal."
  explanation:
    es: "El artículo 189.3.b LGT menciona la interposición de reclamaciones o recursos de cualquier clase, la remisión del tanto de culpa a la jurisdicción penal y las actuaciones del obligado conocidas formalmente en esos procedimientos. No distingue entre vía administrativa y otras, y no deja fuera a los recursos."
  citation: "art. 189.3 LGT"
  difficulty: 3
  tags:
  - "interrupción"
# anchor: boe-a-2003-23186-art-189
- id: m03-l13-q0103
  prompt:
    es: "De acuerdo con el artículo 189.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la prescripción de la potestad para imponer sanciones tributarias se aplica:"
  options:
  - id: a
    correct: true
    text:
      es: "De oficio por la Administración tributaria, sin necesidad de que la invoque el interesado."
  - id: b
    text:
      es: "A instancia del interesado, que debe invocarla en el trámite de alegaciones del procedimiento."
  - id: c
    text:
      es: "De oficio, pero solo cuando el interesado la haya invocado en vía de recurso."
  - id: d
    text:
      es: "Por el órgano jurisdiccional, y no por la Administración tributaria en vía administrativa."
  explanation:
    es: "El artículo 189.4 LGT obliga a la Administración a aplicar la prescripción de oficio, sin que el interesado la invoque. No es una excepción que deba alegarse en el trámite de alegaciones ni exige recurso ni intervención judicial."
  citation: "art. 189.4 LGT"
  difficulty: 2
  tags:
  - "prescripción"
# anchor: boe-a-2003-23186-art-190
- id: m03-l13-q0104
  prompt:
    es: "De acuerdo con el artículo 190.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las sanciones tributarias se extinguen por el pago o cumplimiento, por prescripción del derecho para exigir su pago, por compensación, por condonación y por:"
  options:
  - id: a
    text:
      es: "La caducidad del procedimiento sancionador que las haya impuesto."
  - id: b
    correct: true
    text:
      es: "El fallecimiento de todos los obligados a satisfacerlas."
  - id: c
    text:
      es: "El fallecimiento del sujeto infractor, aunque existan otros obligados al pago."
  - id: d
    text:
      es: "La declaración de insolvencia de todos los obligados a satisfacerlas."
  explanation:
    es: "El artículo 190.1 LGT exige el fallecimiento de todos los obligados al pago, no solo del infractor. Si hay varios obligados solidarios, la muerte de uno no extingue la sanción. La caducidad opera antes de imponerla y la insolvencia no es causa de extinción de la sanción en ese artículo."
  citation: "art. 190.1 LGT"
  difficulty: 1
  tags:
  - "lista"
  - "extinción"
# anchor: boe-a-2003-23186-art-190
- id: m03-l13-q0106
  prompt:
    es: "De acuerdo con el artículo 190 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las sanciones tributarias ingresadas indebidamente tienen, a efectos de la ley, la consideración de:"
  options:
  - id: a
    text:
      es: "Ingresos con derecho a compensación automática."
  - id: b
    correct: true
    text:
      es: "Ingresos indebidos."
  - id: c
    text:
      es: "Pagos a cuenta de futuras sanciones."
  - id: d
    text:
      es: "Deudas aplazadas de la Administración tributaria."
  explanation:
    es: "El artículo 190.4 LGT las trata como ingresos indebidos, con el régimen de devolución de ingresos indebidos. No son pagos a cuenta, ni deudas aplazadas de la Administración, ni se compensan de forma automática."
  citation: "art. 190 LGT"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-190
- id: m03-l13-q0107
  prompt:
    es: "Según el artículo 190.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿por qué normas se regula la recaudación de las sanciones tributarias?"
  options:
  - id: a
    correct: true
    text:
      es: "Por las incluidas en el capítulo V del título III de la propia ley."
  - id: b
    text:
      es: "Por las normas del procedimiento sancionador del artículo 207 y siguientes de la ley."
  - id: c
    text:
      es: "Por las incluidas en el capítulo IV del título II, que regula la extinción de la deuda tributaria."
  - id: d
    text:
      es: "Por las incluidas en el título IV, que solo regulan la potestad sancionadora."
  explanation:
    es: "El artículo 190.3 LGT remite al capítulo V del título III para la recaudación de las sanciones. El capítulo IV del título II es el de la extinción y prescripción de la deuda, al que remite el 190.2 para otra cuestión. El título IV regula la potestad sancionadora, no la recaudación."
  citation: "art. 190.3 LGT"
  difficulty: 2
  tags:
  - "remisión"
# anchor: boe-a-2003-23186-art-190
- id: m03-l13-q0230
  prompt:
    es: "¿Cuál de las siguientes es una forma de extinción de las sanciones tributarias según el artículo 190.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "La declaración de fallido del sujeto infractor por insolvencia."
  - id: b
    correct: true
    text:
      es: "La condonación."
  - id: c
    text:
      es: "La regularización voluntaria con recargo del artículo 27 posterior a la sanción."
  - id: d
    text:
      es: "La caducidad del procedimiento sancionador que las impuso, una vez firmes."
  explanation:
    es: "El artículo 190.1 LGT incluye el pago o cumplimiento, la prescripción del derecho a exigir el pago, la compensación, la condonación y el fallecimiento de todos los obligados. La caducidad opera antes de imponer la sanción, la regularización del artículo 27 es previa a la infracción y la declaración de fallido no extingue la sanción."
  citation: "art. 190.1 LGT"
  difficulty: 1
  tags:
  - "lista"
  - "extinción"
# anchor: boe-a-2003-23186-art-189
- id: m03-l13-q0240
  prompt:
    es: "¿Qué acciones interrumpen el plazo de prescripción para imponer sanciones tributarias, de acuerdo con el artículo 189.3.a de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Solo la notificación del acuerdo de iniciación del procedimiento sancionador al interesado."
  - id: b
    text:
      es: "Cualquier acción de la Administración conducente a la imposición de la sanción, aunque el interesado no la conozca."
  - id: c
    correct: true
    text:
      es: "Cualquier acción de la Administración conducente a la imposición de la sanción, realizada con conocimiento formal del interesado."
  - id: d
    text:
      es: "Solo las actuaciones de inspección que terminen con una liquidación notificada al obligado."
  explanation:
    es: "El artículo 189.3.a LGT interrumpe la prescripción con cualquier acción de la Administración conducente a la sanción realizada con conocimiento formal del interesado. No se limita al acuerdo de iniciación ni a una inspección, y exige ese conocimiento formal."
  citation: "art. 189.3 LGT"
  difficulty: 2
  tags:
  - "interrupción"
