# anchor: boe-a-2003-21614-art-35
- id: m01-l15-q041
  prompt:
    es: "Según el artículo 35.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los programas presupuestarios, de carácter plurianual, están bajo la responsabilidad:"
  options:
  - id: a
    correct: true
    text:
      es: "Del titular del centro gestor del gasto."
  - id: b
    text:
      es: "Del Ministro del departamento correspondiente."
  - id: c
    text:
      es: "De la Dirección General de Presupuestos."
  - id: d
    text:
      es: "De la Intervención delegada del departamento."
  explanation:
    es: "El artículo 35.2 pone los programas bajo la responsabilidad del titular del centro gestor del gasto. El Ministro está por encima del centro gestor, la Dirección General de Presupuestos coordina el proceso desde Hacienda y la Intervención delegada controla, pero no gestiona los programas."
  citation: "art. 35.2 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-35
- id: m01-l15-q042
  prompt:
    es: "De acuerdo con el artículo 35.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los objetivos preestablecidos de los programas presupuestarios pueden tener por finalidad:"
  options:
  - id: a
    text:
      es: "La producción de bienes y servicios, la recaudación de ingresos o la realización de las demás actividades de los centros gestores."
  - id: b
    correct: true
    text:
      es: "La producción de bienes y servicios, el cumplimiento de obligaciones específicas o la realización de las demás actividades de los centros gestores."
  - id: c
    text:
      es: "La producción de bienes y servicios, el cumplimiento de obligaciones específicas o la ejecución de inversiones reales y financieras."
  - id: d
    text:
      es: "La asignación de recursos, el cumplimiento de obligaciones específicas o la realización de las demás actividades de los centros gestores."
  explanation:
    es: "El artículo 35.2 enumera tres finalidades: la producción de bienes y servicios, el cumplimiento de obligaciones específicas y la realización de las demás actividades encomendadas a los centros gestores. La opción de la recaudación de ingresos sustituye la segunda por una finalidad de ingresos, ajena a los programas de gasto. La de las inversiones reales y financieras cambia la tercera por un contenido de los programas plurianuales (art. 29.6). La de la asignación de recursos cambia la primera."
  citation: "art. 35.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2003-21614-art-35
- id: m01-l15-q043
  prompt:
    es: "Según el artículo 35.4 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, cuando los resultados de un programa no sean mensurables, la efectividad del programa se hará:"
  options:
  - id: a
    text:
      es: "Mediante una auditoría externa de los resultados."
  - id: b
    text:
      es: "Mediante el balance de resultados de la Intervención."
  - id: c
    correct: true
    text:
      es: "Mediante indicadores que permitan su medición indirecta."
  - id: d
    text:
      es: "Mediante la comparación con los créditos iniciales."
  explanation:
    es: "Cuando los resultados no son mensurables, el artículo 35.4 acude a indicadores que permitan la medición indirecta de la efectividad. La auditoría externa y la comparación con los créditos iniciales no figuran en el artículo. El balance de resultados lo formulan los titulares de los centros gestores (art. 71), no la Intervención General."
  citation: "art. 35.4 LGP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2003-21614-art-35
- id: m01-l15-q044
  prompt:
    es: "¿En qué caso se comprueba el grado de cumplimiento de un programa presupuestario en función de los resultados, según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Cuando el programa tenga carácter plurianual."
  - id: b
    correct: true
    text:
      es: "Cuando los resultados sean mensurables e identificables."
  - id: c
    text:
      es: "Cuando el centro gestor del gasto lo solicite."
  - id: d
    text:
      es: "Cuando los resultados no sean mensurables ni identificables."
  explanation:
    es: "El grado de cumplimiento se comprueba por los resultados cuando éstos sean mensurables e identificables (art. 35.4). Que el programa sea plurianual o que lo pida el gestor no es el criterio. Si los resultados no son mensurables, el artículo acude a indicadores de medición indirecta y no a los resultados."
  citation: "art. 35.4 LGP"
  difficulty: 3
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-35
- id: m01-l15-q045
  prompt:
    es: "Según el artículo 35.4 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, un programa de gasto del presupuesto anual es el conjunto de créditos que, para el logro de los objetivos anuales, se ponen a disposición:"
  options:
  - id: a
    text:
      es: "Del Ministerio de Hacienda, para su ejecución centralizada."
  - id: b
    correct: true
    text:
      es: "Del gestor responsable de su ejecución."
  - id: c
    text:
      es: "De la Intervención General, para su control previo."
  - id: d
    text:
      es: "De las Cortes Generales, para su seguimiento."
  explanation:
    es: "El programa de gasto del presupuesto anual es el conjunto de créditos que se ponen a disposición del gestor responsable de su ejecución (art. 35.4). Ni el Ministerio de Hacienda, ni la Intervención General, ni las Cortes Generales ejecutan el programa."
  citation: "art. 35.4 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "órgano"
# anchor: boe-a-2003-21614-art-35
- id: m01-l15-q046
  prompt:
    es: "Según el artículo 35.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, son créditos presupuestarios cada una de:"
  options:
  - id: a
    text:
      es: "Las asignaciones globales de gasto puestas a disposición de los ministerios para cubrir las necesidades de todo su departamento."
  - id: b
    text:
      es: "Las previsiones individualizadas de ingreso puestas a disposición de la Tesorería para cubrir las necesidades de caja."
  - id: c
    text:
      es: "Las obligaciones de gasto ya reconocidas por los centros gestores frente a terceros durante el ejercicio."
  - id: d
    correct: true
    text:
      es: "Las asignaciones individualizadas de gasto puestas a disposición de los centros gestores para cubrir las necesidades para las que hayan sido aprobados."
  explanation:
    es: "El artículo 35.1 define el crédito presupuestario como cada asignación individualizada de gasto puesta a disposición de los centros gestores para las necesidades para las que haya sido aprobada. Una asignación global a los ministerios no es individualizada. Las previsiones de ingreso no son gasto. Las obligaciones reconocidas son una fase posterior de la ejecución, no el crédito que la habilita."
  citation: "art. 35.1 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-38
- id: m01-l15-q047
  prompt:
    es: "Según el artículo 38 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, señale la afirmación INCORRECTA sobre los presupuestos prorrogados:"
  options:
  - id: a
    correct: true
    text:
      es: "La prórroga alcanza a los créditos para obligaciones que se extingan en el ejercicio cuyos presupuestos se prorrogan."
  - id: b
    text:
      es: "Se prorrogan los presupuestos iniciales del ejercicio anterior hasta la aprobación y publicación de los nuevos."
  - id: c
    text:
      es: "La prórroga no afecta a los créditos de programas o actuaciones que terminen en el ejercicio prorrogado."
  - id: d
    text:
      es: "La estructura orgánica se adapta a la organización vigente sin alterar la cuantía total."
  explanation:
    es: "La afirmación incorrecta es la que dice que la prórroga alcanza a los créditos de obligaciones que se extinguen en el ejercicio prorrogado: el artículo 38.2 los deja fuera. Son correctas la prórroga de los presupuestos iniciales hasta la publicación de los nuevos (art. 38.1), la exclusión de los programas que terminan en el ejercicio (art. 38.2) y la adaptación de la estructura orgánica sin alterar la cuantía total (art. 38.3)."
  citation: "art. 38.2 LGP"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2003-21614-art-131
- id: m01-l15-q049
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿a qué órgano remite el Gobierno la Cuenta General del Estado formada por la Intervención General de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "Al Consejo de Estado."
  - id: b
    text:
      es: "Al Defensor del Pueblo."
  - id: c
    text:
      es: "A la Dirección General de Presupuestos."
  - id: d
    correct: true
    text:
      es: "Al Tribunal de Cuentas."
  explanation:
    es: "La Cuenta General se eleva al Gobierno para su remisión al Tribunal de Cuentas (art. 131.1). El Consejo de Estado, el Defensor del Pueblo y la Dirección General de Presupuestos no son destinatarios de la remisión."
  citation: "art. 131.1 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2026-12037-art-7
- id: m01-l15-q052
  prompt:
    es: "De acuerdo con el artículo 7.1 de la Orden HAC/557/2026, de 3 de junio, por la que se dictan las normas para la elaboración de los Presupuestos Generales del Estado para 2027, los centros gestores remitirán sus propuestas:"
  options:
  - id: a
    text:
      es: "Antes del 29 de julio de 2026."
  - id: b
    text:
      es: "Antes del 15 de septiembre de 2026."
  - id: c
    text:
      es: "Antes del 1 de octubre de 2026."
  - id: d
    correct: true
    text:
      es: "Antes del 29 de junio de 2026."
  explanation:
    es: "El artículo 7.1 dice que «las propuestas de los centros gestores se remitirán a la Dirección General de Presupuestos antes del 29 de junio de 2026». El 1 de octubre de 2026 es el límite para remitir el proyecto de Ley de Presupuestos a las Cortes Generales (art. 37.1 LGP), un paso posterior. La orden no fija para las propuestas ni el 29 de julio ni el 15 de septiembre."
  citation: "art. 7.1 Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "plazo"
  - "fecha"
# anchor: boe-a-2026-12037-art-7
- id: m01-l15-q053
  prompt:
    es: "Según el artículo 7.1 de la Orden HAC/557/2026, de 3 de junio, por la que se dictan las normas para la elaboración de los Presupuestos Generales del Estado para 2027, ¿a qué órgano remiten los centros gestores sus propuestas?"
  options:
  - id: a
    correct: true
    text:
      es: "A la Dirección General de Presupuestos."
  - id: b
    text:
      es: "A la Intervención General de la Administración del Estado."
  - id: c
    text:
      es: "A la Comisión de Políticas de Gasto."
  - id: d
    text:
      es: "A la Dirección General del Tesoro y Política Financiera."
  explanation:
    es: "Las propuestas de los centros gestores «se remitirán a la Dirección General de Presupuestos antes del 29 de junio de 2026» (art. 7.1), a través de las oficinas presupuestarias. La orden no dirige esas propuestas a la Intervención General de la Administración del Estado ni a la Dirección General del Tesoro y Política Financiera. La Comisión de Políticas de Gasto se constituye para que la persona titular del Ministerio de Hacienda determine las directrices de distribución del gasto (art. 4.1), no para recibir las propuestas."
  citation: "art. 7.1 Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2026-12037-art-4
- id: m01-l15-q054
  prompt:
    es: "Según el artículo 4.2 de la Orden HAC/557/2026, de 3 de junio, ¿quién preside las Comisiones de Análisis de Programas en ausencia de la persona titular de la Secretaría de Estado de Presupuestos y Gastos?"
  options:
  - id: a
    text:
      es: "La persona titular del Ministerio de Hacienda."
  - id: b
    text:
      es: "La persona titular de la Subdirección General de Política Presupuestaria."
  - id: c
    correct: true
    text:
      es: "La persona titular de la Dirección General de Presupuestos."
  - id: d
    text:
      es: "La persona titular de la Subsecretaría del departamento ministerial."
  explanation:
    es: "Preside las Comisiones de Análisis de Programas la persona titular de la Secretaría de Estado de Presupuestos y Gastos «y, en su ausencia, la persona titular de la Dirección General de Presupuestos» (art. 4.2). La persona titular de la Subsecretaría del departamento ministerial es miembro de cada Comisión, no su presidente. La persona titular del Ministerio de Hacienda preside la Comisión de Políticas de Gasto (art. 4.1), y la de la Subdirección General de Política Presupuestaria actúa en esa Comisión como secretario no miembro (art. 4.1)."
  citation: "art. 4.2 Orden HAC/557/2026"
  difficulty: 3
  tags:
  - "órgano"
  - "composición"
# anchor: boe-a-2026-12037-art-5
- id: m01-l15-q055
  prompt:
    es: "De acuerdo con el artículo 5 de la Orden HAC/557/2026, de 3 de junio, la persona titular del Ministerio de Hacienda someterá al acuerdo del Gobierno:"
  options:
  - id: a
    text:
      es: "Las propuestas de presupuesto remitidas por los centros gestores."
  - id: b
    text:
      es: "Las conclusiones de las Comisiones de Análisis de Programas."
  - id: c
    text:
      es: "Las previsiones de los grandes epígrafes de gasto para 2028 y 2029."
  - id: d
    correct: true
    text:
      es: "El anteproyecto de Ley de Presupuestos Generales del Estado para 2027."
  explanation:
    es: "Una vez elaborados los estados de gastos e ingresos, se elevan a la persona titular del Ministerio de Hacienda, «quien someterá al acuerdo del Gobierno el anteproyecto de Ley de Presupuestos Generales del Estado para 2027» (art. 5). Las propuestas de los centros gestores y las conclusiones de las Comisiones de Análisis de Programas son elementos que la Dirección General de Presupuestos tiene en cuenta al elaborar los estados de gastos (art. 5). Las previsiones de los grandes epígrafes de gasto para 2028 y 2029 las remiten los centros gestores a la Dirección General de Presupuestos (art. 7.1)."
  citation: "art. 5 Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-2026-12037-art-4
- id: m01-l15-q056
  prompt:
    es: "Según el artículo 4.2 de la Orden HAC/557/2026, de 3 de junio, por la que se dictan las normas para la elaboración de los Presupuestos Generales del Estado para 2027, ¿qué tarea corresponde a las Comisiones de Análisis de Programas?"
  options:
  - id: a
    text:
      es: "La determinación de las directrices para la distribución del gasto entre los departamentos."
  - id: b
    text:
      es: "La elevación al acuerdo del Gobierno del anteproyecto de Presupuestos Generales del Estado."
  - id: c
    text:
      es: "La remisión a las Cortes Generales del proyecto de Presupuestos Generales del Estado."
  - id: d
    correct: true
    text:
      es: "El estudio de la adecuación y validez de los programas de gasto."
  explanation:
    es: "En las Comisiones de Análisis de Programas «tiene lugar el estudio de la adecuación y validez de los programas de gasto respecto de los objetivos perseguidos por los mismos» (art. 4.2). Las directrices para la distribución del gasto las determina la persona titular del Ministerio de Hacienda, que para ello constituye la Comisión de Políticas de Gasto (art. 4.1). La elevación del anteproyecto al acuerdo del Gobierno corresponde a la persona titular del Ministerio de Hacienda (art. 5). La remisión del proyecto a las Cortes Generales es del Gobierno (art. 37.1 LGP; art. 134.3 CE)."
  citation: "art. 4.2 Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
