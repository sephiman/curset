    - id: m03-l08
      title:
        es: 'Actuaciones y procedimiento de inspección: funciones y facultades. Documentación de las actuaciones de
          inspección. La personación de la inspección en el domicilio o locales del contribuyente. El
          procedimiento de inspección: iniciación, desarrollo y terminación. Las medidas cautelares en el
          procedimiento inspector.'
      summary:
        es: 'La inspección de los tributos comprueba e investiga, con facultades de examen, entrada y requerimiento,
          y documenta sus actuaciones en comunicaciones, diligencias, informes y actas. Las actuaciones del
          procedimiento inspector deben concluir en 18 meses, o en 27 en los supuestos del artículo 150.1 de la LGT; a
          efectos de su tramitación, las actas son con acuerdo, de conformidad o de disconformidad, y la lección trata
          también la estimación indirecta, el conflicto en la aplicación de la norma tributaria y la retroacción de
          actuaciones. La adopción de las medidas cautelares se documenta mediante diligencia, el obligado puede alegar
          en cinco días y el órgano competente para liquidar las ratifica, modifica o levanta en 15 días desde su
          adopción.'
