# anchor: boe-a-2014-10908-art-4
- id: m02-l04-q145
  prompt:
    es: "Según la Orden HAP/1949/2014, de 13 de octubre, por la que se regula el Punto de Acceso General de la Administración General del Estado y se crea su sede electrónica, ¿cuántos canales de acceso a los servicios del PAG establece?"
  options:
  - id: a
    text:
      es: "Dos: Internet y el teléfono 060."
  - id: b
    text:
      es: "Cinco: Internet, presencial, telefónico, correo y redes sociales."
  - id: c
    text:
      es: "Cuatro: Internet, presencial, telefónico y correo electrónico."
  - id: d
    correct: true
    text:
      es: "Tres: Internet, la atención presencial y la atención telefónica."
  explanation:
    es: "La orden establece tres canales: Internet para el acceso electrónico, la atención presencial y la atención telefónica en el 060. Ni el correo electrónico ni las redes sociales figuran entre los canales de la orden."
  citation: "art. 4 Orden HAP/1949/2014"
  difficulty: 1
  tags:
  - "cantidad"
