- id: m11-l02-v-bigdecimal-equals-001
  prompt:
    en: |-
      The `same` method wraps `BigDecimal.equals` and the `order` method wraps `BigDecimal.compareTo`. What does this program print, line by line?

      ```java
      import java.math.BigDecimal;

      public class Main {
          static boolean same(BigDecimal p, BigDecimal q) {
              return p.equals(q);
          }

          static int order(BigDecimal p, BigDecimal q) {
              return p.compareTo(q);
          }

          public static void main(String[] args) {
              BigDecimal a = new BigDecimal("0.10");
              BigDecimal b = new BigDecimal("0.1");
              BigDecimal c = new BigDecimal("1.5");
              BigDecimal d = new BigDecimal("1.5");
              System.out.println(same(a, b));
              System.out.println(order(a, b));
              System.out.println(same(c, d));
              System.out.println(order(c, d));
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`false`, `0`, `true`, `0`'
    correct: true
  - id: b
    text:
      en: '`true`, `0`, `true`, `0`'
  - id: c
    text:
      en: '`false`, `1`, `true`, `0`'
  - id: d
    text:
      en: '`true`, `0`, `false`, `0`'
  explanation:
    en: '`same` calls `equals`, which is `true` only when two `BigDecimal` values are equal in value and in scale, and `order`
      calls `compareTo`, which compares numeric value alone and returns `-1`, `0` or `1`. `0.10` and `0.1` have the same value
      but the scales `2` and `1`, so `same` returns `false` and `order` returns `0`. `1.5` and `1.5` have the same value and
      the same scale `1`, so `same` returns `true` and `order` returns `0`. The program prints `false`, `0`, `true`, `0`.
      `true`, `0`, `true`, `0` comes from this mistake: comparing only the numeric value in `same`. `equals` is `true` only
      when value and scale are both equal, so two numbers with different scales are not equal. `false`, `1`, `true`, `0` comes
      from this mistake: making `order` return `0` only when `equals` is true and `1` otherwise. `compareTo` ignores the scale
      and returns `-1`, `0` or `1` for less, equal or greater, so it is not tied to `equals`. `true`, `0`, `false`, `0` comes
      from this mistake: negating the result of `equals` in `same`. `equals` returns `true` for a `BigDecimal` with the same
      value and scale, and `false` otherwise.'
