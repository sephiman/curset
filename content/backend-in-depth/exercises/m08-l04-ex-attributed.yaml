- id: m08-l04-qa01
  prompt:
    en: According to Marc Brooker in Exponential Backoff and Jitter, which statement about capped exponential backoff
      in the optimistic concurrency control simulation does the post make?
  options:
  - id: a
    text:
      en: Backoff alone leaves no clusters of calls, giving a constant call rate
  - id: b
    text:
      en: The right fix is to remove backoff and rely on jitter alone
  - id: c
    text:
      en: Capped exponential backoff keeps the sleep between attempts constant
  - id: d
    correct: true
    text:
      en: Backoff alone helps only a small amount and does not solve the problem
  explanation:
    en: Brooker writes that running the simulation again shows that backoff helps a small amount but does not solve
      the problem. He writes that the problem stands out because there are still clusters of calls, which contradicts
      a constant call rate. He writes that the solution is not to remove backoff but to add jitter, which contradicts
      removing it. He writes that capped exponential backoff multiplies the backoff by a constant after each attempt
      up to a maximum, which contradicts a constant sleep.
  citation: aws-exponential-backoff-jitter#adding-backoff; aws-exponential-backoff-jitter#adding-jitter
- id: m08-l04-qa02
  prompt:
    en: According to Marc Brooker in Exponential Backoff and Jitter, which statement about the jittered backoff
      approaches compared in the simulation does the post make?
  options:
  - id: a
    text:
      en: Exponential backoff without jitter is the clear winner on both work and time
  - id: b
    correct: true
    text:
      en: Equal Jitter does slightly more work than Full Jitter and takes much longer
  - id: c
    text:
      en: Decorrelated Jitter does less client work than Full Jitter does
  - id: d
    text:
      en: Jittered backoff removes the N2 growth of the total work done
  explanation:
    en: Brooker writes that Equal Jitter does slightly more work than Full Jitter and takes much longer. He writes
      that the no-jitter exponential backoff approach is the clear loser, which contradicts calling it the winner.
      He writes that the number of calls is approximately the same for Full and Equal jitter and higher for Decorrelated,
      which contradicts Decorrelated doing less work. He writes that none of these approaches fundamentally change
      the N2 nature of the work, which contradicts removing that growth.
  citation: aws-exponential-backoff-jitter#adding-jitter
- id: m08-l04-qa03
  prompt:
    en: According to Alejandro Forero Cuervo in Chapter 21 - Handling Overload, which statement about global overload
      and per-customer limits does the chapter make?
  options:
  - id: a
    text:
      en: Per-customer limits must never add up to more than the allocated CPUs
  - id: b
    text:
      en: Global overload is rare, even for internal services with many clients
  - id: c
    correct: true
    text:
      en: A service should deliver error responses only to misbehaving customers
  - id: d
    text:
      en: Capacity is provisioned on peak total demand, not negotiated customer usage
  explanation:
    en: Forero Cuervo writes that when global overload occurs it is vital that the service only delivers error responses
      to misbehaving customers while other customers remain unaffected. He writes that per-customer limits may add
      up to more than the allocated CPUs, which contradicts a ceiling at the allocation. He writes that global overload
      occurs quite frequently, especially for internal services with many clients, which contradicts calling it
      rare. He writes that service owners provision capacity based on the negotiated usage with their customers,
      which contradicts provisioning on peak total demand.
  citation: sre-book-handling-overload#per-customer-limits-K7sAuk
  extract:
    en: it's vital that the service only delivers error responses to misbehaving customers, while other customers
      remain unaffected
- id: m08-l04-qa04
  prompt:
    en: According to Alejandro Forero Cuervo in Chapter 21 - Handling Overload, which statement about client-side
      throttling and the requests a backend rejects does the chapter make?
  options:
  - id: a
    correct: true
    text:
      en: A client seeing many out-of-quota rejections caps its outgoing traffic
  - id: b
    text:
      en: Requests above the cap are queued on the network and retried later
  - id: c
    text:
      en: Each client keeps its request and accept counts for the last hour
  - id: d
    text:
      en: Rejecting a request always costs far less than serving it
  explanation:
    en: Forero Cuervo writes that a client that detects many recent out-of-quota rejections starts self-regulating
      and caps its outgoing traffic. He writes that requests above the cap fail locally without even reaching the
      network, which contradicts queuing them on the network. He writes that each client task keeps its counts for
      the last two minutes of history, which contradicts an hour. He writes that rejecting a request that needs
      a simple RAM lookup is almost as expensive as running it, which contradicts rejection always costing far less.
  citation: sre-book-handling-overload#client-side-throttling-a7sYUg
  extract:
    en: it starts self-regulating and caps the amount of outgoing traffic it generates
- id: m08-l04-qa07
  prompt:
    en: According to Mike Ulrich in Chapter 22 - Addressing Cascading Failures, what does the chapter say servers
      should do about deadlines when sending RPCs to backends?
  options:
  - id: a
    correct: true
    text:
      en: Employ deadline propagation rather than inventing a deadline for each RPC
  - id: b
    text:
      en: Send RPCs without a deadline so slow backends are never cut short
  - id: c
    text:
      en: Check the remaining deadline once, when the request first arrives
  - id: d
    text:
      en: Give each backend RPC the full original deadline, whatever time has passed
  explanation:
    en: Ulrich writes that rather than inventing a deadline when sending RPCs to backends, servers should employ
      deadline propagation. He writes that it is usually wise to set a deadline, which contradicts sending RPCs
      without one. He writes that the server should check the deadline left at each stage before doing more work,
      which contradicts checking once on arrival. He writes that in his example the RPC from A to B has a 23-second
      deadline after A spent 7 of its 30 seconds, which contradicts passing on the full original deadline.
  citation: sre-book-cascading-failures#deadline-propagation-1; sre-book-cascading-failures#picking-a-deadline;
    sre-book-cascading-failures#missing-deadlines-1
  extract:
    en: Rather than inventing a deadline when sending RPCs to backends, servers should employ deadline propagation.
