# anchor: boe-a-2022-22128-art-9
- id: m05-l02-q231
  prompt:
    es: "Según el artículo 9.Dos.1 de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, ¿quién autoriza las transferencias que minoren los créditos consignados para atender obligaciones de ejercicios anteriores?"
  options:
  - id: a
    text:
      es: "El titular del ministerio afectado, previo informe favorable de la Intervención Delegada."
  - id: b
    text:
      es: "El Presidente o Director del organismo autónomo afectado."
  - id: c
    text:
      es: "El Gobierno, a propuesta del Ministro de Hacienda."
  - id: d
    correct: true
    text:
      es: "La persona titular del Ministerio de Hacienda."
  explanation:
    es: "El artículo 9.Dos.1 atribuye a la persona titular del Ministerio de Hacienda autorizar las transferencias que minoren los créditos consignados para obligaciones de ejercicios anteriores (art. 8.Uno.1). El titular del ministerio, el director del organismo y el Gobierno no tienen esa competencia en ese artículo."
  citation: "art. 9.Dos.1 Ley 31/2022"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2022-22128-art-9
- id: m05-l02-q232
  prompt:
    es: "Un ministerio propone una transferencia dentro de un programa que afecta al capítulo 4 «Transferencias corrientes», sin cambiar la naturaleza jurídica de los perceptores. Con la Ley 31/2022 en vigor, ¿quién la autoriza?"
  options:
  - id: a
    text:
      es: "El titular del ministerio, previo informe favorable de la Intervención Delegada."
  - id: b
    text:
      es: "El Consejo de Ministros, a propuesta del Ministro de Hacienda."
  - id: c
    text:
      es: "El Director General de Presupuestos, por delegación del titular del ministerio."
  - id: d
    correct: true
    text:
      es: "La persona titular del Ministerio de Hacienda."
  explanation:
    es: "El artículo 9.Dos.8 de la Ley 31/2022 atribuye a la persona titular del Ministerio de Hacienda las variaciones o modificaciones que afecten a los capítulos 4, 7 u 8, salvo que la competencia sea del Consejo de Ministros o se requiera proyecto de ley. Aquí no concurre ninguna salvedad, y el ministerio no puede acordarla aunque sea dentro de un programa. Un director general no recibe esa competencia por delegación del titular del ministerio."
  citation: "art. 9.Dos.8 Ley 31/2022"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2022-22128-art-9
- id: m05-l02-q233
  prompt:
    es: "La directora de un organismo autónomo propone transferir créditos entre dos conceptos del capítulo 7 de un mismo programa, sin cambiar la naturaleza jurídica de los perceptores. Con la Ley 31/2022 en vigor, ¿quién la autoriza?"
  options:
  - id: a
    text:
      es: "La propia directora del organismo, y el ministro puede avocarla en todo o en parte."
  - id: b
    text:
      es: "El titular del ministerio de adscripción, previo informe favorable de la Intervención Delegada."
  - id: c
    correct: true
    text:
      es: "La persona titular del Ministerio de Hacienda, porque afecta al capítulo 7."
  - id: d
    text:
      es: "El Gobierno, a propuesta del Ministro de Hacienda y a iniciativa del ministro afectado."
  explanation:
    es: "El artículo 9.Dos.8 extiende a los organismos autónomos la reserva al Ministro de Hacienda de las modificaciones que afecten a los capítulos 4, 7 u 8. Aunque la transferencia sea de un solo programa, la directora no puede autorizarla ni el ministro avocarla, y el titular del ministerio tampoco. El Gobierno solo interviene en las transferencias entre secciones."
  citation: "art. 9.Dos.8 Ley 31/2022"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2022-22128-art-9
- id: m05-l02-q234
  prompt:
    es: "Un ministerio quiere transferir crédito entre dos créditos del capítulo 1 «Gastos de personal» de servicios distintos, sin afectar a incentivos al rendimiento ni a gastos sociales. Con la Ley 31/2022 en vigor, ¿quién la autoriza?"
  options:
  - id: a
    text:
      es: "La persona titular del Ministerio de Hacienda, porque la transferencia afecta a créditos de personal."
  - id: b
    text:
      es: "El Consejo de Ministros, a propuesta del Ministro de Hacienda y a iniciativa del titular."
  - id: c
    correct: true
    text:
      es: "El titular del ministerio, porque la Ley 31/2022 le atribuye estas transferencias del capítulo 1."
  - id: d
    text:
      es: "El Director General de la Función Pública, por delegación del titular del ministerio."
  explanation:
    es: "El artículo 9.Siete atribuye a los titulares de los departamentos ministeriales las transferencias entre créditos del capítulo 1 aunque afecten a distintos servicios o programas, con exclusión de incentivos al rendimiento y gastos sociales. Por eso no hace falta acudir al Ministro de Hacienda, que sería lo ordinario si afectase a personal, ni al Consejo de Ministros. Un director general de la Función Pública no recibe esa competencia."
  citation: "art. 9.Siete Ley 31/2022"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2022-22128-art-9
- id: m05-l02-q235
  prompt:
    es: "Un ministerio propone transferir 20.000 euros entre créditos del capítulo 1 de distintos programas: del concepto 120 al concepto 151 «Gratificaciones». Con la Ley 31/2022 en vigor, ¿quién la autoriza?"
  options:
  - id: a
    text:
      es: "El titular del ministerio, porque son créditos del capítulo 1 y la Ley 31/2022 se lo permite."
  - id: b
    text:
      es: "El titular del ministerio, previo informe favorable de la Intervención Delegada competente en él."
  - id: c
    text:
      es: "El Gobierno, a propuesta del Ministro de Hacienda y a iniciativa del ministro afectado."
  - id: d
    correct: true
    text:
      es: "El Ministro de Hacienda, porque la transferencia afecta a un crédito de incentivos al rendimiento."
  explanation:
    es: "El artículo 9.Siete permite al titular del ministerio autorizar transferencias entre créditos del capítulo 1, pero excluye los incentivos al rendimiento y los gastos sociales. El concepto 151 «Gratificaciones» pertenece al artículo 15 «Incentivos al rendimiento» y el artículo 9.Dos.1 reserva esas transferencias al Ministro de Hacienda. El informe de la Intervención Delegada no cambia el órgano competente, y el Gobierno solo autoriza transferencias entre secciones."
  citation: "art. 9.Dos.1 Ley 31/2022"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2003-21614-art-61
- id: m05-l02-q239
  prompt:
    es: "En una reorganización administrativa el Gobierno autoriza transferencias entre distintas secciones presupuestarias, a propuesta del Ministro de Hacienda. ¿A iniciativa de quién actúa, según el artículo 61 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "A iniciativa del Presidente del Gobierno."
  - id: b
    text:
      es: "A iniciativa de la Intervención General de la Administración del Estado."
  - id: c
    correct: true
    text:
      es: "A iniciativa de los ministros afectados."
  - id: d
    text:
      es: "A iniciativa de las Cortes Generales."
  explanation:
    es: "El artículo 61 dice que el Gobierno actúa a propuesta del Ministro de Hacienda y a iniciativa de los ministros afectados. El Presidente del Gobierno, la Intervención General y las Cortes Generales no aparecen en la fórmula."
  citation: "art. 61.a) LGP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2003-21614-art-63
- id: m05-l02-q242
  prompt:
    es: "Los presidentes y directores de los organismos autónomos ejercen en sus presupuestos las competencias del artículo 63 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, y según el apartado 2:"
  options:
  - id: a
    text:
      es: "el Consejo de Ministros podrá avocarlas en todo o en parte."
  - id: b
    text:
      es: "el Ministro de Hacienda debe autorizarlas previamente en todo caso."
  - id: c
    correct: true
    text:
      es: "los ministros podrán avocarlas en todo o en parte."
  - id: d
    text:
      es: "no pueden ejercerlas sin el informe favorable de la Intervención General."
  explanation:
    es: "El apartado 2 del artículo 63 dice que los ministros podrán avocar esas competencias en todo o en parte. No las avoca el Consejo de Ministros, no hace falta autorización previa del Ministro de Hacienda y el artículo no exige informe de la Intervención General."
  citation: "art. 63.2 LGP"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2003-21614-art-62
- id: m05-l02-q244
  prompt:
    es: "Según el artículo 62.1.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el Ministro de Hacienda autoriza las transferencias:"
  options:
  - id: a
    text:
      es: "entre distintas secciones presupuestarias como consecuencia de reorganizaciones administrativas de los departamentos."
  - id: b
    correct: true
    text:
      es: "no reservadas al Consejo de Ministros que, conforme al artículo 63, no puedan acordar los titulares de los departamentos."
  - id: c
    text:
      es: "entre créditos de un mismo programa, aunque puedan acordarlas directamente los titulares de los departamentos."
  - id: d
    text:
      es: "de todos los organismos autónomos, sin que estos puedan acordar ninguna de ellas por sí mismos en su presupuesto."
  explanation:
    es: "El artículo 62.1.a) es residual: el Ministro de Hacienda autoriza las transferencias no reservadas al Consejo de Ministros que los titulares de los departamentos no pueden acordar por el artículo 63. Las reorganizaciones entre secciones las autoriza el Gobierno (art. 61.a)), las de un mismo programa las acuerda el titular del ministerio y los organismos autónomos autorizan las del artículo 63.2 en su presupuesto."
  citation: "art. 62.1.a) LGP"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2022-22128-art-9
- id: m05-l02-q245
  prompt:
    es: "Según la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, corresponde al Gobierno, a propuesta del Ministro de Hacienda, autorizar las transferencias de crédito:"
  options:
  - id: a
    text:
      es: "entre créditos del capítulo 1 de distintos servicios, aunque no afecten a incentivos al rendimiento ni a gastos sociales."
  - id: b
    text:
      es: "de capital a corrientes en el presupuesto del Estado y en el de los organismos autónomos y entidades."
  - id: c
    correct: true
    text:
      es: "entre secciones para atender necesidades ineludibles, en casos distintos de los del artículo 52.2 de la Ley General Presupuestaria."
  - id: d
    text:
      es: "entre créditos de un mismo programa que afecten al capítulo 4 de un ministerio o de un organismo."
  explanation:
    es: "El artículo 9.Uno.1 atribuye al Gobierno, a propuesta del Ministro de Hacienda, las transferencias entre secciones para atender necesidades ineludibles, en casos distintos de los del artículo 52.2. Las del capítulo 1 las autoriza el titular del ministerio (art. 9.Siete), las de capital a corrientes y las que afectan al capítulo 4 el Ministro de Hacienda (arts. 9.Dos.6 y 9.Dos.8)."
  citation: "art. 9.Uno.1 Ley 31/2022"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2003-21614-art-63
- id: m05-l02-q246
  prompt:
    es: "Según el artículo 63.1.a) de la Ley General Presupuestaria y el artículo 9.Siete de la Ley 31/2022, ¿cuál de las siguientes transferencias NO puede autorizar el titular del ministerio?"
  options:
  - id: a
    text:
      es: "La que se hace entre créditos del capítulo 2 de un mismo programa, sin afectar al concepto 202."
  - id: b
    correct: true
    text:
      es: "La que se hace entre créditos del capítulo 2 de programas de distintos servicios de un mismo ministerio."
  - id: c
    text:
      es: "La que se hace entre créditos del capítulo 2 de programas de un mismo servicio, sin afectar a personal."
  - id: d
    text:
      es: "La que se hace entre créditos del capítulo 1 de servicios distintos, sin afectar a incentivos ni gastos sociales."
  explanation:
    es: "El titular del ministerio puede autorizar las transferencias dentro de un programa o entre programas de un mismo servicio (art. 63.1.a)) y las del capítulo 1 aunque afecten a servicios distintos (art. 9.Siete). Entre programas de distintos servicios, fuera del capítulo 1, la competencia es del Ministro de Hacienda (art. 62.1.a))."
  citation: "art. 63.1.a) LGP"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2003-21614-art-58
- id: m05-l02-q247
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, se podrán incorporar a los créditos de un ejercicio, en los casos que enumera:"
  options:
  - id: a
    text:
      es: "los remanentes de tesorería de cualquier ejercicio anterior, sin límite alguno."
  - id: b
    correct: true
    text:
      es: "los remanentes de crédito del ejercicio anterior."
  - id: c
    text:
      es: "los créditos de operaciones financieras no dispuestos al cierre del ejercicio."
  - id: d
    text:
      es: "los ingresos del ejercicio que superen los previstos en el presupuesto inicial."
  explanation:
    es: "El artículo 58 permite incorporar a los créditos de un ejercicio los remanentes de crédito del ejercicio anterior en cuatro casos. No se incorporan remanentes de tesorería sin límite, ni los créditos financieros no dispuestos como categoría, y los mayores ingresos del ejercicio dan lugar a generaciones de crédito, no a incorporaciones."
  citation: "art. 58 LGP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-58
- id: m05-l02-q248
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, pueden incorporarse remanentes de crédito del ejercicio anterior cuando así lo disponga:"
  options:
  - id: a
    text:
      es: "una orden del Ministro de Hacienda."
  - id: b
    text:
      es: "un acuerdo del Consejo de Ministros."
  - id: c
    text:
      es: "una resolución de la Dirección General de Presupuestos."
  - id: d
    correct: true
    text:
      es: "una norma de rango legal."
  explanation:
    es: "La letra a) del artículo 58 remite a una norma de rango legal. Una orden ministerial, un acuerdo del Consejo de Ministros o una resolución de la Dirección General de Presupuestos no tienen rango de ley."
  citation: "art. 58.a) LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-2003-21614-art-58
- id: m05-l02-q249
  prompt:
    es: "Según el artículo 58.b) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, y sin tener en cuenta las limitaciones de las leyes anuales, pueden incorporarse los remanentes procedentes de generaciones de crédito por:"
  options:
  - id: a
    text:
      es: "ventas de bienes y prestación de servicios, y por enajenaciones de inmovilizado."
  - id: b
    text:
      es: "reembolsos de préstamos y por reintegros de pagos indebidos del presupuesto corriente."
  - id: c
    correct: true
    text:
      es: "aportaciones al organismo y por ingresos legalmente afectados a actuaciones determinadas."
  - id: d
    text:
      es: "aportaciones al organismo y por reintegros de pagos indebidos realizados con cargo al presupuesto corriente."
  explanation:
    es: "La letra b) remite a las generaciones del artículo 53.2, párrafos a) y e): aportaciones del Estado o de otras personas a organismos y entidades, e ingresos legalmente afectados a actuaciones determinadas. Las ventas, las enajenaciones, los reembolsos de préstamos y los reintegros de pagos indebidos son otros supuestos del artículo 53.2 que la letra b) no incorpora. La opción que mezcla aportaciones con reintegros combina una generación que sí incorpora con otra que no."
  citation: "art. 58.b) LGP"
  difficulty: 3
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2003-21614-art-58
- id: m05-l02-q250
  prompt:
    es: "Según el artículo 58.c) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, pueden incorporarse los remanentes derivados de retenciones para financiar créditos extraordinarios o suplementos cuando, al final del ejercicio:"
  options:
  - id: a
    text:
      es: "las leyes de concesión se aprobaron en el último mes del ejercicio y el pago se había anticipado conforme a la ley."
  - id: b
    text:
      es: "el Consejo de Estado dictaminó desfavorablemente la concesión y el Gobierno decidió anticipar igualmente el pago."
  - id: c
    correct: true
    text:
      es: "se anticipó su pago conforme a la ley y las leyes de concesión quedaron pendientes de aprobación por el Parlamento al final del ejercicio."
  - id: d
    text:
      es: "el Ministro de Hacienda autorizó la retención y el Parlamento aprobó las leyes de concesión antes del cierre."
  explanation:
    es: "La letra c) exige dos cosas: que se hubiera anticipado el pago conforme a la ley y que las leyes de concesión hubieran quedado pendientes de aprobación por el Parlamento al final del ejercicio. Si las leyes se aprobaron en el último mes, el caso es el de la letra d). Un dictamen desfavorable del Consejo de Estado y una aprobación parlamentaria ya producida no figuran en la letra c)."
  citation: "art. 58.c) LGP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-58
- id: m05-l02-q251
  prompt:
    es: "Según el artículo 58.d) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, pueden incorporarse los remanentes de créditos extraordinarios y suplementos concedidos mediante norma con rango de ley:"
  options:
  - id: a
    correct: true
    text:
      es: "en el último mes del ejercicio presupuestario anterior."
  - id: b
    text:
      es: "en el último trimestre del ejercicio presupuestario anterior."
  - id: c
    text:
      es: "en los dos primeros meses del ejercicio en curso."
  - id: d
    text:
      es: "en cualquier momento del ejercicio presupuestario anterior."
  explanation:
    es: "La letra d) limita el caso a los créditos extraordinarios y suplementos concedidos por norma con rango de ley en el último mes del ejercicio anterior. El último trimestre y cualquier momento del ejercicio son plazos mayores que los de la letra. Y si la norma fuese del ejercicio en curso, el remanente no vendría del ejercicio anterior."
  citation: "art. 58.d) LGP"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2022-22128-art-10
- id: m05-l02-q254
  prompt:
    es: "Según la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, durante su vigencia no se pueden incorporar:"
  options:
  - id: a
    correct: true
    text:
      es: "los remanentes de créditos derivados de generaciones aprobadas en el ejercicio anterior."
  - id: b
    text:
      es: "los remanentes de créditos extraordinarios concedidos por norma con rango de ley en el último mes del ejercicio."
  - id: c
    text:
      es: "los remanentes de créditos cuya incorporación disponga una norma de rango legal."
  - id: d
    text:
      es: "los remanentes derivados de retenciones para créditos extraordinarios con pago anticipado."
  explanation:
    es: "El artículo 10.Seis de la Ley 31/2022 impide incorporar los remanentes derivados de generaciones aprobadas en el ejercicio anterior y deja sin efecto la letra b) del artículo 58. Los casos de las letras a), c) y d) del artículo 58 siguen vigentes: norma de rango legal, retenciones con pago anticipado y créditos extraordinarios concedidos en el último mes."
  citation: "art. 10.Seis Ley 31/2022"
  difficulty: 1
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-2022-22128-art-10
- id: m05-l02-q255
  prompt:
    es: "El artículo 10.Seis de la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023 deja sin efecto la letra del artículo 58 de la Ley General Presupuestaria sobre los remanentes:"
  options:
  - id: a
    text:
      es: "derivados de retenciones para financiar créditos extraordinarios."
  - id: b
    text:
      es: "que disponga una norma de rango legal."
  - id: c
    correct: true
    text:
      es: "procedentes de generaciones de crédito."
  - id: d
    text:
      es: "concedidos en el último mes del ejercicio anterior."
  explanation:
    es: "La letra b) del artículo 58 trata los remanentes procedentes de generaciones de crédito, y el artículo 10.Seis la deja sin efecto mientras rija la Ley 31/2022. La letra c) (retenciones), la letra a) (norma de rango legal) y la letra d) (créditos del último mes) no se ven afectadas."
  citation: "art. 10.Seis Ley 31/2022"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2022-22128-art-10
- id: m05-l02-q256
  prompt:
    es: "En 2026, con la Ley 31/2022 prorrogada, un ministerio quiere incorporar remanentes de una generación de crédito aprobada en 2025 en el servicio 50 «Mecanismo de Recuperación y Resiliencia» de su sección. ¿Puede?"
  options:
  - id: a
    text:
      es: "No, porque durante la vigencia de la ley no se pueden incorporar remanentes de ninguna generación del ejercicio anterior."
  - id: b
    correct: true
    text:
      es: "Sí, porque la restricción del artículo 10.Seis no afecta a los remanentes generados en ese servicio."
  - id: c
    text:
      es: "Sí, pero solo si la incorporación la autoriza el Consejo de Ministros a propuesta del Ministro de Hacienda."
  - id: d
    text:
      es: "No, porque los remanentes del servicio 50 solo pueden incorporarse mediante una transferencia de crédito."
  explanation:
    es: "El artículo 10.Seis prohíbe incorporar remanentes de generaciones del ejercicio anterior, pero la restricción no afecta a los remanentes generados en el servicio 50 «Mecanismo de Recuperación y Resiliencia» de cada sección. La opción que niega toda incorporación de generaciones olvida esa excepción. El artículo no atribuye la autorización al Consejo de Ministros y no sustituye la incorporación por una transferencia."
  citation: "art. 10.Seis Ley 31/2022"
  difficulty: 3
  tags:
  - "excepción"
