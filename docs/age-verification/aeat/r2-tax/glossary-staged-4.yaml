# Tax-part glossary entries, batch 4 (III.11–III.13), staged for the blind check.
- id: g-providencia-de-apremio
  es: providencia de apremio
  origin: m03-l11
  definition:
    es: Acto de la Administración que ordena la ejecución contra el patrimonio del obligado al pago (art. 70.1 RGR). Tiene
      la misma fuerza ejecutiva que la sentencia judicial para proceder contra los bienes y derechos de los obligados tributarios
      (art. 167.2 LGT).
- id: g-recargo-ejecutivo
  es: recargo ejecutivo
  origin: m03-l11
  definition:
    es: Recargo del período ejecutivo del cinco por ciento, que se aplica cuando se satisface la totalidad de la deuda no
      ingresada en período voluntario antes de la notificación de la providencia de apremio (art. 28.2 LGT).
- id: g-recargo-de-apremio-reducido
  es: recargo de apremio reducido
  origin: m03-l11
  definition:
    es: Recargo del período ejecutivo del 10 por ciento, que se aplica cuando se satisface la totalidad de la deuda no ingresada
      en período voluntario y el propio recargo antes de la finalización del plazo del artículo 62.5 para las deudas apremiadas
      (art. 28.3 LGT).
- id: g-recargo-de-apremio-ordinario
  es: recargo de apremio ordinario
  origin: m03-l11
  definition:
    es: Recargo del período ejecutivo del 20 por ciento, aplicable cuando no concurren las circunstancias del recargo ejecutivo
      ni del recargo de apremio reducido (art. 28.4 LGT).
- id: g-terceria
  es: tercería
  origin: m03-l12
  definition:
    es: Reclamación de un tercero en el procedimiento de apremio que solo puede fundarse en el dominio de los bienes embargados
      al obligado al pago o en el derecho del tercerista a ser reintegrado de su crédito con preferencia al que es objeto
      del expediente de apremio (art. 117.2 RGR).
- id: g-infraccion-tributaria
  es: infracción tributaria
  origin: m03-l13
  definition:
    es: Acción u omisión dolosa o culposa con cualquier grado de negligencia que esté tipificada y sancionada como tal en
      la LGT o en otra ley (art. 183.1 LGT).
- id: g-medios-fraudulentos
  es: medios fraudulentos
  origin: m03-l13
  definition:
    es: Las anomalías sustanciales en la contabilidad y en los libros o registros establecidos por la normativa tributaria;
      el empleo de facturas, justificantes u otros documentos falsos o falseados, siempre que la incidencia de los documentos
      o soportes falsos o falseados represente un porcentaje superior al 10 por ciento de la base de la sanción; y la utilización
      de personas o entidades interpuestas cuando el sujeto infractor, con la finalidad de ocultar su identidad, haya hecho
      figurar a nombre de un tercero, con o sin su consentimiento, la titularidad de los bienes o derechos, la obtención de
      las rentas o ganancias patrimoniales o la realización de las operaciones con trascendencia tributaria de las que se
      deriva la obligación tributaria cuyo incumplimiento constituye la infracción que se sanciona (art. 184.3 LGT).
- id: g-comision-repetida-de-infracciones-tributarias
  es: comisión repetida de infracciones tributarias
  origin: m03-l13
  definition:
    es: Criterio de graduación que concurre cuando el sujeto infractor hubiera sido sancionado por una infracción de la misma
      naturaleza, ya sea leve, grave o muy grave, en virtud de resolución firme en vía administrativa dentro de los cuatro
      años anteriores a la comisión de la infracción (art. 187.1.a) LGT).
