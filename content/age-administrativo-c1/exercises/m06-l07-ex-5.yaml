# anchor: fuente-ms-outlook-carpetas-busqueda-html
- id: m06-l07-q150
  prompt:
    es: "En Outlook 365, ¿qué es una carpeta de búsqueda, según la ayuda de Microsoft sobre carpetas de búsqueda?"
  options:
  - id: a
    text:
      es: "Una carpeta que mueve a ella los mensajes que cumplen unos criterios"
  - id: b
    text:
      es: "Una carpeta que copia en ella los mensajes que cumplen unos criterios"
  - id: c
    correct: true
    text:
      es: "Una carpeta virtual que muestra mensajes según unos criterios, sin moverlos ni duplicarlos"
  - id: d
    text:
      es: "Una carpeta que guarda resultados de varios Outlook Data Files a la vez"
  explanation:
    es: "Una carpeta de búsqueda es virtual y muestra los mensajes que coinciden con unos criterios sin mover ni duplicar los originales. La carpeta que copia los mensajes y la que los mueve contradicen la frase «sin mover ni duplicar». La que guarda resultados de varios Outlook Data Files contradice la nota: las carpetas de búsqueda no pueden contener resultados de varios archivos .pst."
  citation: "fuente: `ms-outlook-carpetas-busqueda.html`; «Usar carpetas de búsqueda para buscar mensajes u otros elementos de Outlook»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-carpetas-busqueda-html
- id: m06-l07-q151
  prompt:
    es: "En Outlook 365 clásico, ¿qué ocurre con los mensajes que muestra una carpeta de búsqueda cuando se elimina esa carpeta de búsqueda?"
  options:
  - id: a
    text:
      es: "Se eliminan los mensajes que no están en otra carpeta"
  - id: b
    text:
      es: "Los mensajes se eliminan junto con la carpeta"
  - id: c
    text:
      es: "Los mensajes pasan a la carpeta Elementos eliminados"
  - id: d
    correct: true
    text:
      es: "Los mensajes no se eliminan"
  explanation:
    es: "Si se elimina una carpeta de búsqueda, no se eliminan los mensajes que contiene. Eliminarlos junto con la carpeta, enviarlos a Elementos eliminados o borrar solo los que no están en otra carpeta contradicen esa frase. La ayuda añade que solo al eliminar una carpeta que no sea de búsqueda se eliminan la carpeta y sus mensajes."
  citation: "fuente: `ms-outlook-carpetas-busqueda.html`; «Eliminar una carpeta de búsqueda en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-carpetas-busqueda-html
- id: m06-l07-q152
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes rutas lleva al comando para crear una carpeta de búsqueda predefinida?"
  options:
  - id: a
    text:
      es: "Vista › Nuevo › Nueva carpeta de búsqueda"
  - id: b
    correct: true
    text:
      es: "Carpeta › Nuevo › Nueva carpeta de búsqueda"
  - id: c
    text:
      es: "Archivo › Nuevo › Nueva carpeta de búsqueda"
  - id: d
    text:
      es: "Inicio › Nuevo › Nueva carpeta de búsqueda"
  explanation:
    es: "La ayuda indica la pestaña Carpeta y, en el grupo Nuevo, Nueva carpeta de búsqueda. Las rutas que empiezan por Inicio, Vista o Archivo contradicen esa frase, que fija la pestaña Carpeta."
  citation: "fuente: `ms-outlook-carpetas-busqueda.html`; «Crear y usar carpetas de búsqueda predefinidas en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "ofimática-menú"
