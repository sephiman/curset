# anchor: fuente-ms-mixed-reality-cad-html
- id: m02-l05-q204
  prompt:
    es: "¿Qué herramienta recomienda la página de Microsoft sobre modelos 3D para comprobar los modelos 3D en el explorador de escenas?"
  options:
  - id: a
    text:
      es: "El visor de modelos de AutoCAD y de Autodesk Inventor"
  - id: b
    text:
      es: "El convertidor de recursos de Windows Mixed Reality"
  - id: c
    correct: true
    text:
      es: "El visor 3D Babylon.js"
  - id: d
    text:
      es: "El visor 3D Beta de HoloLens"
  explanation:
    es: "La página recomienda la herramienta de visor 3D Babylon.js para comprobar modelos. «El visor de modelos de AutoCAD y de Autodesk Inventor» es un programa CAD para crear modelos, no la herramienta de comprobación que cita la página. «El convertidor de recursos de Windows Mixed Reality» sirve para optimizar modelos glTF 2.0, no para comprobarlos. «El visor 3D Beta de HoloLens» es una aplicación solo para dispositivos HoloLens de primera generación, no la herramienta de comprobación."
  citation: "fuente: `ms-mixed-reality-cad.html`; «Para comprobar los modelos 3D, se recomienda usar la herramienta de visor 3D Babylon.js en el explorador de escenas.»"
