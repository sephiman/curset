# anchor: boe-a-1992-28740-art-101
- id: m03-l19-q0132
  prompt:
    es: "Conforme al artículo 101.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la Administración puede autorizar la aplicación de un régimen de deducción común a los sectores diferenciados determinados únicamente por:"
  options:
  - id: a
    text:
      es: "la acogida a los regímenes especiales que la ley enumera."
  - id: b
    text:
      es: "la realización de operaciones de arrendamiento financiero."
  - id: c
    correct: true
    text:
      es: "la existencia de actividades y de regímenes de deducción distintos."
  - id: d
    text:
      es: "cualquiera de las circunstancias que definen los sectores diferenciados."
  explanation:
    es: "La autorización de régimen común solo cabe para los sectores determinados únicamente por la letra a') (actividades y regímenes de deducción distintos). Los regímenes especiales, el arrendamiento financiero y los demás sectores no la admiten."
  citation: "art. 101.Dos LIVA"
  difficulty: 2
  tags:
  - "sectores diferenciados"
# anchor: boe-a-1992-28740-art-101
- id: m03-l19-q0133
  prompt:
    es: "Según el artículo 101.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿en qué porcentaje debe exceder el montante de las cuotas deducibles por el régimen común al que resultaría de aplicar el régimen con independencia en cada sector para que la autorización no surta efectos?"
  options:
  - id: a
    correct: true
    text:
      es: "Un 20 por 100 de exceso sobre el régimen independiente."
  - id: b
    text:
      es: "Un 10 por 100 de exceso sobre el régimen independiente."
  - id: c
    text:
      es: "Un 15 por 100 de exceso sobre el régimen independiente."
  - id: d
    text:
      es: "Un 50 por 100 de exceso sobre el régimen independiente."
  explanation:
    es: "El límite es el 20 por 100. El 10 por ciento es el umbral de la prorrata especial, el 15 por 100 el de la actividad accesoria y los 50 puntos el de los regímenes de deducción distintos."
  citation: "art. 101.Dos LIVA"
  difficulty: 2
  tags:
  - "sectores diferenciados"
# anchor: boe-a-1992-28740-art-101
- id: m03-l19-q0134
  prompt:
    es: "Señale la respuesta CORRECTA sobre la vigencia de la autorización de un régimen de deducción común, según el artículo 101.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    correct: true
    text:
      es: "Continúa vigente durante los años sucesivos en tanto no sea revocada o renuncie a ella el sujeto pasivo."
  - id: b
    text:
      es: "Continúa vigente aunque el sujeto pasivo renuncie a ella, salvo revocación expresa de la Administración."
  - id: c
    text:
      es: "Se extingue automáticamente al terminar el año natural para el que fue concedida por la Administración."
  - id: d
    text:
      es: "Continúa vigente durante cuatro años y solo puede renovarse mediante una nueva solicitud motivada."
  explanation:
    es: "La autorización sigue vigente mientras no se revoque o el sujeto pasivo renuncie. No se extingue cada año, no tiene vigencia de cuatro años y la renuncia del sujeto pasivo la pone fin."
  citation: "art. 101.Dos LIVA"
  difficulty: 2
  tags:
  - "sectores diferenciados"
