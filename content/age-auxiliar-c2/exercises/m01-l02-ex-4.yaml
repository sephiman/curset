# anchor: boe-a-1978-31229-art-99
- id: m01-l02-q142
  prompt:
    es: "Si el Congreso de los Diputados otorga su confianza al candidato a la Presidencia del Gobierno que ha expuesto su programa, quien le nombra Presidente es:"
  options:
  - id: a
    correct: true
    text:
      es: "El Rey."
  - id: b
    text:
      es: "El Presidente del Congreso."
  - id: c
    text:
      es: "El Presidente saliente del Gobierno."
  - id: d
    text:
      es: "El Consejo de Ministros en funciones."
  explanation:
    es: "El artículo 99.3 dice que, otorgada la confianza, «el Rey le nombrará Presidente». El Presidente del Congreso solo refrenda ese nombramiento. Ni el Presidente saliente ni el Consejo de Ministros en funciones tienen esa facultad."
  citation: "art. 99.3 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-114
- id: m01-l02-q143
  prompt:
    es: "¿Ante quién presenta su dimisión el Gobierno cuando el Congreso de los Diputados le niega su confianza, tras lo cual se procede a designar un nuevo Presidente?"
  options:
  - id: a
    text:
      es: "Al Presidente del Congreso."
  - id: b
    correct: true
    text:
      es: "Al Rey."
  - id: c
    text:
      es: "Al Tribunal Constitucional."
  - id: d
    text:
      es: "A las Cortes Generales."
  explanation:
    es: "El artículo 114.1 dice que el Gobierno «presentará su dimisión al Rey», y a continuación se designa Presidente según el artículo 99. No la presenta al Presidente del Congreso, ni al Tribunal Constitucional, ni a las Cortes Generales."
  citation: "art. 114.1 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-115
- id: m01-l02-q144
  prompt:
    es: "Según el artículo 115.1 de la Constitución Española de 1978, el decreto con el que el Rey acuerda la disolución del Congreso, del Senado o de las Cortes Generales fijará:"
  options:
  - id: a
    text:
      es: "La fecha de la investidura."
  - id: b
    text:
      es: "El número de escaños de cada circunscripción."
  - id: c
    correct: true
    text:
      es: "La fecha de las elecciones."
  - id: d
    text:
      es: "La composición de la Diputación Permanente."
  explanation:
    es: "El artículo 115.1 dice que «el decreto de disolución fijará la fecha de las elecciones». La investidura, los escaños de cada circunscripción y la Diputación Permanente no los fija ese decreto."
  citation: "art. 115.1 CE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "fecha"
