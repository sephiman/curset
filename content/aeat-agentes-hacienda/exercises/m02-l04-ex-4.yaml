# anchor: boe-a-2015-10565-art-96
- id: m02-l04-q0106
  prompt:
    es: "De acuerdo con el artículo 96.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en la tramitación simplificada el trámite de audiencia se realiza:"
  options:
  - id: a
    correct: true
    text:
      es: "únicamente cuando la resolución vaya a ser desfavorable para el interesado."
  - id: b
    text:
      es: "en todo caso, antes de dictar la resolución."
  - id: c
    text:
      es: "únicamente cuando lo solicite expresamente el interesado."
  - id: d
    text:
      es: "únicamente cuando la resolución vaya a ser favorable para el interesado."
  explanation:
    es: "El artículo 96.6.d) prevé la audiencia únicamente cuando la resolución vaya a ser desfavorable para el interesado. No se realiza siempre, ni depende de que la pida, ni se limita a las resoluciones favorables."
  citation: "art. 96.6 LPAC"
  difficulty: 2
  tags:
  - "tramitación simplificada"
  - "audiencia"
# anchor: boe-a-2015-10565-art-96
- id: m02-l04-q0107
  prompt:
    es: "Según el artículo 96.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en la tramitación simplificada las alegaciones al inicio del procedimiento se formulan durante el plazo de:"
  options:
  - id: a
    text:
      es: "tres días desde el inicio del procedimiento."
  - id: b
    text:
      es: "diez días desde el inicio del procedimiento."
  - id: c
    text:
      es: "quince días desde el inicio del procedimiento."
  - id: d
    correct: true
    text:
      es: "cinco días desde el inicio del procedimiento."
  explanation:
    es: "El artículo 96.6.c) fija cinco días para las alegaciones formuladas al inicio. Tres días no es un plazo de la ley, diez días es el de subsanación (artículo 68.1) y quince días el máximo de audiencia en la tramitación ordinaria (artículo 82.2)."
  citation: "art. 96.6 LPAC"
  difficulty: 1
  tags:
  - "tramitación simplificada"
  - "alegaciones"
  - "plazo"
# anchor: boe-a-2015-10565-art-96
- id: m02-l04-q0109
  prompt:
    es: "En un procedimiento simplificado, el dictamen del Consejo de Estado es contrario al fondo de la propuesta de resolución, por lo que el órgano competente acuerda continuar con la tramitación ordinaria. Según el artículo 96.6.g) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué ocurre con las actuaciones realizadas?"
  options:
  - id: a
    text:
      es: "Se anulan todas las actuaciones y debe reiniciarse el procedimiento."
  - id: b
    text:
      es: "Se entienden convalidadas todas las actuaciones, incluido el dictamen del Consejo de Estado."
  - id: c
    correct: true
    text:
      es: "Se entienden convalidadas todas, salvo el propio dictamen del Consejo de Estado."
  - id: d
    text:
      es: "Se convalidan solo las anteriores al trámite de audiencia a los interesados."
  explanation:
    es: "El artículo 96.6.g) dice que, si el dictamen es contrario al fondo de la propuesta, se continúa con la tramitación ordinaria y se entienden convalidadas todas las actuaciones realizadas en la simplificada, a excepción del dictamen. No se anula todo, ni se convalida el dictamen, ni se limita la convalidación a lo anterior a la audiencia."
  citation: "art. 96.6 LPAC"
  difficulty: 2
  tags:
  - "tramitación simplificada"
  - "dictamen"
  - "supuesto"
# anchor: boe-a-2015-10565-art-96
- id: m02-l04-q0110
  prompt:
    es: "¿Cuál de los siguientes trámites forma parte de los únicos que integran el procedimiento tramitado de manera simplificada, según el artículo 96.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Período de prueba por un plazo no superior a treinta días."
  - id: b
    correct: true
    text:
      es: "Informe del servicio jurídico, cuando este sea preceptivo."
  - id: c
    text:
      es: "Información pública durante un plazo no inferior a veinte días."
  - id: d
    text:
      es: "Actuaciones complementarias antes de dictar la resolución."
  explanation:
    es: "El artículo 96.6 enumera los trámites de la tramitación simplificada, entre ellos el informe del servicio jurídico cuando sea preceptivo (letra e). No figuran el período de prueba, la información pública ni las actuaciones complementarias, que son trámites del procedimiento ordinario."
  citation: "art. 96.6 LPAC"
  difficulty: 1
  tags:
  - "tramitación simplificada"
  - "trámites"
# anchor: boe-a-2015-10565-art-96
- id: m02-l04-q0111
  prompt:
    es: "El lunes 1 de junio de 2026 se notifica a un interesado el acuerdo de tramitación simplificada de su procedimiento. No hay festivos hasta el 15 de julio y no queda menos tiempo para su tramitación ordinaria. Según el artículo 96.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo vence el plazo para resolver?"
  options:
  - id: a
    correct: true
    text:
      es: "El lunes 13 de julio de 2026."
  - id: b
    text:
      es: "El miércoles 1 de julio de 2026."
  - id: c
    text:
      es: "El viernes 10 de julio de 2026."
  - id: d
    text:
      es: "El martes 14 de julio de 2026."
  explanation:
    es: "Son treinta días hábiles desde el día siguiente a la notificación: del 2 al 5 de junio son cuatro, y siguen cinco semanas completas hasta el viernes 10 de julio (veintinueve) y el lunes 13 de julio es el trigésimo. El 1 de julio sale de contar treinta días naturales. El 10 de julio resulta de contar el día de la notificación como primero. Y el 14 de julio es el día treinta y uno."
  citation: "art. 96.6 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
  - "tramitación simplificada"
# anchor: boe-a-2015-10565-art-95
- id: m02-l04-q0122
  prompt:
    es: "¿En qué procedimientos se advierte al interesado de la caducidad por paralización del procedimiento por causa imputable al mismo, según el artículo 95.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "En los procedimientos iniciados a solicitud del interesado."
  - id: b
    text:
      es: "En los procedimientos iniciados de oficio por la Administración."
  - id: c
    text:
      es: "En cualquier procedimiento, sea cual sea su forma de iniciación."
  - id: d
    text:
      es: "En los procedimientos de naturaleza sancionadora, y solo en estos."
  explanation:
    es: "El artículo 95.1 regula la caducidad por paralización imputable al interesado en los procedimientos iniciados a solicitud suya. En los iniciados de oficio con efectos desfavorables la caducidad se produce por vencimiento del plazo máximo (artículo 25.1.b), no por esa paralización. No es aplicable a cualquier procedimiento ni solo a los sancionadores."
  citation: "art. 95.1 LPAC"
  difficulty: 2
  tags:
  - "caducidad"
  - "ámbito"
# anchor: boe-a-2015-10565-art-38
- id: m02-l04-q0112
  prompt:
    es: "Conforme al artículo 38 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los actos de las Administraciones Públicas sujetos al Derecho Administrativo serán ejecutivos con arreglo a lo dispuesto en:"
  options:
  - id: a
    text:
      es: "la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público."
  - id: b
    text:
      es: "la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa."
  - id: c
    text:
      es: "la Ley 1/2000, de 7 de enero, de Enjuiciamiento Civil."
  - id: d
    correct: true
    text:
      es: "esa misma Ley del Procedimiento Administrativo Común."
  explanation:
    es: "El artículo 38 remite a la propia Ley 39/2015 para la ejecutividad de los actos. No remite a la Ley de Régimen Jurídico del Sector Público, ni a la reguladora de la Jurisdicción Contencioso-administrativa, ni a la de Enjuiciamiento Civil."
  citation: "art. 38 LPAC"
  difficulty: 2
  tags:
  - "ejecución"
  - "ejecutividad"
# anchor: boe-a-2015-10565-art-98
- id: m02-l04-q0114
  prompt:
    es: "Conforme al artículo 98.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre la ejecutividad de los actos de las Administraciones Públicas sujetos al Derecho Administrativo:"
  options:
  - id: a
    text:
      es: "Son inmediatamente ejecutivos, salvo que lo pida el interesado en su escrito de alegaciones."
  - id: b
    text:
      es: "Son inmediatamente ejecutivos, salvo que el acto afecte a derechos de terceros ajenos al procedimiento."
  - id: c
    correct: true
    text:
      es: "Son inmediatamente ejecutivos, salvo que se necesite aprobación o autorización superior."
  - id: d
    text:
      es: "Son ejecutivos desde que sean firmes en vía administrativa, salvo que una disposición disponga lo contrario."
  explanation:
    es: "El artículo 98.1 declara los actos inmediatamente ejecutivos, salvo que se suspenda su ejecución, se trate de una resolución sancionadora recurrible en vía administrativa, una disposición establezca lo contrario o se necesite aprobación o autorización superior. No es excepción pedirlo el interesado, ni afectar a terceros, y la regla no es la ejecutividad desde la firmeza."
  citation: "art. 98.1 LPAC"
  difficulty: 2
  tags:
  - "ejecución"
  - "ejecutividad"
# anchor: boe-a-2015-10565-art-99
- id: m02-l04-q0115
  prompt:
    es: "De acuerdo con el artículo 99 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre la ejecución forzosa de los actos administrativos:"
  options:
  - id: a
    text:
      es: "Las Administraciones pueden proceder a ella sin necesidad de apercibimiento previo, salvo cuando se suspenda la ejecución de acuerdo con la Ley."
  - id: b
    correct: true
    text:
      es: "Las Administraciones pueden proceder a ella, previo apercibimiento, salvo cuando se suspenda la ejecución de acuerdo con la Ley."
  - id: c
    text:
      es: "Las Administraciones pueden proceder a ella, previo apercibimiento, aunque se haya suspendido la ejecución de acuerdo con la Ley."
  - id: d
    text:
      es: "Las Administraciones pueden proceder a ella, previo apercibimiento, solo a través del órgano que dictó el acto y no de otros competentes."
  explanation:
    es: "El artículo 99 permite la ejecución forzosa previo apercibimiento y salvo que se suspenda la ejecución de acuerdo con la Ley o que la Constitución o la Ley exijan la intervención de un órgano judicial. No prescinde del apercibimiento, ni opera pese a una suspensión legal, ni se reserva al órgano que dictó el acto: actúan los órganos competentes en cada caso."
  citation: "art. 99 LPAC"
  difficulty: 3
  tags:
  - "ejecución"
  - "ejecución forzosa"
# anchor: boe-a-2015-10565-art-100
- id: m02-l04-q0117
  prompt:
    es: "De acuerdo con el artículo 100.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la ejecución forzosa por las Administraciones Públicas se efectúa, respetando siempre el principio de:"
  options:
  - id: a
    correct: true
    text:
      es: "proporcionalidad, por los medios que la propia ley enumera."
  - id: b
    text:
      es: "efectividad, por los medios que la propia ley enumera."
  - id: c
    text:
      es: "menor onerosidad, por los medios que determine el órgano competente en cada caso."
  - id: d
    text:
      es: "legalidad, por los medios que el interesado acepte expresamente."
  explanation:
    es: "El artículo 100.1 manda respetar siempre el principio de proporcionalidad y limita la ejecución forzosa a los cuatro medios que enumera. La efectividad y la menor onerosidad son principios de las medidas provisionales (artículo 56.1), la legalidad no es el que cita este precepto, y los medios no los determina el órgano ni el interesado."
  citation: "art. 100.1 LPAC"
  difficulty: 1
  tags:
  - "ejecución"
  - "ejecución forzosa"
# anchor: boe-a-2015-10565-art-99
- id: m02-l04-q0038
  prompt:
    es: "Conforme al artículo 99 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las Administraciones pueden proceder a la ejecución forzosa de los actos administrativos, salvo cuando la Constitución o la Ley exijan:"
  options:
  - id: a
    text:
      es: "El dictamen del Consejo de Estado."
  - id: b
    text:
      es: "La conformidad expresa del interesado."
  - id: c
    correct: true
    text:
      es: "La intervención de un órgano judicial."
  - id: d
    text:
      es: "La autorización del superior jerárquico."
  explanation:
    es: "El artículo 99 excluye la ejecución forzosa por la propia Administración cuando la Constitución o la Ley exijan la intervención de un órgano judicial. El dictamen del Consejo de Estado, la conformidad del interesado y la autorización del superior no figuran como límites."
  citation: "art. 99 LPAC"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-70
- id: m02-l04-q0042
  prompt:
    es: "¿Cuál de las siguientes informaciones NO forma parte del expediente administrativo, según el artículo 70.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Los informes preceptivos solicitados antes de la resolución."
  - id: b
    text:
      es: "Los informes facultativos solicitados antes de la resolución."
  - id: c
    correct: true
    text:
      es: "Las notas, los borradores y los resúmenes."
  - id: d
    text:
      es: "Las diligencias de ejecución."
  explanation:
    es: "El artículo 70.4 deja fuera del expediente la información de carácter auxiliar o de apoyo, como notas, borradores, opiniones y resúmenes. Sí forman parte de él los informes, preceptivos y facultativos, solicitados antes de la resolución, y las diligencias de ejecución del artículo 70.1."
  citation: "art. 70.4 LPAC"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-99
- id: m02-l04-q0044
  prompt:
    es: "¿Cuál de los siguientes trámites debe preceder a la ejecución forzosa de los actos administrativos por las Administraciones Públicas, conforme al artículo 99 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La declaración de lesividad del acto."
  - id: b
    text:
      es: "El dictamen favorable del Consejo de Estado."
  - id: c
    correct: true
    text:
      es: "El apercibimiento."
  - id: d
    text:
      es: "La audiencia."
  explanation:
    es: "El artículo 99 permite la ejecución forzosa previo apercibimiento. La declaración de lesividad es el paso para que la Administración impugne ante los tribunales un acto suyo favorable (artículo 107.1), el dictamen favorable del Consejo de Estado se exige para declarar la nulidad de oficio (artículo 106.1) y la audiencia se da a los interesados antes de la propuesta de resolución (artículo 82.1), no antes de ejecutar."
  citation: "art. 99 LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-100
- id: m02-l04-q0045
  prompt:
    es: "¿Cuál de las siguientes medidas es un medio de ejecución forzosa de los actos administrativos, conforme al artículo 100.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La revocación del acto."
  - id: b
    text:
      es: "La convalidación del acto."
  - id: c
    correct: true
    text:
      es: "La compulsión sobre las personas."
  - id: d
    text:
      es: "La declaración de lesividad del acto."
  explanation:
    es: "El artículo 100.1 enumera cuatro medios: apremio sobre el patrimonio, ejecución subsidiaria, multa coercitiva y compulsión sobre las personas. La revocación es la forma de retirar actos de gravamen o desfavorables (artículo 109.1), la convalidación subsana los vicios de un acto anulable (artículo 52.1) y la declaración de lesividad permite a la Administración impugnar un acto favorable (artículo 107.1); ninguna ejecuta forzosamente un acto."
  citation: "art. 100.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-100
- id: m02-l04-q0046
  prompt:
    es: "Si fueran varios los medios de ejecución forzosa admisibles, ¿cuál de las siguientes reglas fija el artículo 100.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Se elegirá el menos gravoso para el patrimonio del obligado."
  - id: b
    correct: true
    text:
      es: "Se elegirá el menos restrictivo de la libertad individual."
  - id: c
    text:
      es: "Se elegirá el que suponga menor coste para la Administración."
  - id: d
    text:
      es: "Se elegirá el de ejecución más rápida."
  explanation:
    es: "El artículo 100.2 manda elegir el medio menos restrictivo de la libertad individual. No fija como criterio el menor gravamen para el patrimonio del obligado, el menor coste para la Administración ni la rapidez de la ejecución."
  citation: "art. 100.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
