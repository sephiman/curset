  prompt:
    es: "En Outlook 365 clásico, ¿qué comando de la pestaña Buscar se selecciona para detener la búsqueda cuando ya se ha encontrado el elemento?"
  options:
  - id: a
    correct: true
    text:
      es: "Cerrar búsqueda"
  - id: b
    text:
      es: "Buzón actual"
  - id: c
    text:
      es: "Datos adjuntos"
  - id: d
    text:
      es: "De"
  explanation:
    es: "Cerrar búsqueda, en el grupo Cerrar, detiene la búsqueda. Buzón actual es un ámbito de búsqueda de la pestaña Buscar. De limita la búsqueda a los mensajes de una persona. Datos adjuntos limita la búsqueda a los mensajes con adjuntos."
  citation: "fuente: `ms-outlook-procedimientos.html`; «Encontrar ese mensaje: búsqueda eficaz»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-limpieza-buzon-html
- id: m02-l11-q106
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes rutas abre Limpieza de buzón, la herramienta para recortar el tamaño del buzón?"
  options:
  - id: a
    text:
      es: "Archivo › Configuración de la cuenta › Delegar el acceso"
  - id: b
    correct: true
    text:
      es: "Archivo › Herramientas › Limpieza de buzón"
  - id: c
    text:
      es: "Archivo › Opciones › Buscar"
  - id: d
    text:
      es: "Inicio › Eliminar › Limpiar"
  explanation:
    es: "La ayuda lleva a Limpieza de buzón desde Archivo y Herramientas. Archivo › Opciones › Buscar fija el ámbito de búsqueda predeterminado. Inicio › Eliminar › Limpiar quita mensajes redundantes de conversaciones. Archivo › Configuración de la cuenta › Delegar el acceso concede el acceso delegado."
  citation: "fuente: `ms-outlook-limpieza-buzon.html`; «En Outlook, elijaLimpieza de buzónde herramientas>de archivo>.»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-limpieza-buzon-html
- id: m02-l11-q107
  prompt:
    es: "En Outlook 365 clásico, ¿qué información muestra la herramienta Limpieza de buzón sobre el tamaño del buzón?"
  options:
  - id: a
    text:
      es: "Solo el tamaño de la carpeta Elementos eliminados"
  - id: b
    text:
      es: "El tamaño de los datos adjuntos, pero no el de las carpetas"
  - id: c
    correct: true
    text:
      es: "El tamaño total del buzón y el de las carpetas individuales que contiene"
  - id: d
    text:
      es: "Solo el tamaño total del buzón, sin el de cada carpeta"
  explanation:
    es: "Limpieza de buzón permite ver el tamaño total del buzón y de las carpetas individuales que contiene. Mostrar solo el total o solo el de Elementos eliminados contradice esa frase, que incluye cada carpeta. Mostrar el tamaño de los adjuntos y no el de las carpetas la contradice igualmente: la lista de acciones habla del tamaño de las carpetas."
  citation: "fuente: `ms-outlook-limpieza-buzon.html`; «Administrar el tamaño del buzón en Outlook»"
  difficulty: 1
  tags:
  - "comportamiento"
