# anchor: boe-a-1992-28740-art-88
- id: m03-l19-q0069
  prompt:
    es: "Conforme al artículo 88.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, los sujetos pasivos deben repercutir íntegramente el importe del impuesto sobre aquel para quien se realice la operación gravada, que queda obligado a soportarlo siempre que la repercusión se ajuste a lo dispuesto en la ley, cualesquiera que fueran:"
  options:
  - id: a
    text:
      es: "las condiciones de pago pactadas por las partes."
  - id: b
    text:
      es: "las resoluciones administrativas dictadas sobre la operación."
  - id: c
    text:
      es: "las circunstancias personales del destinatario."
  - id: d
    correct: true
    text:
      es: "las estipulaciones existentes entre ellos."
  explanation:
    es: "La obligación de soportar la repercusión no depende de lo que hayan pactado las partes. Las circunstancias personales del destinatario, las condiciones de pago o las resoluciones administrativas no son lo que dice el precepto."
  citation: "art. 88.Uno LIVA"
  difficulty: 1
  tags:
  - "repercusión"
# anchor: boe-a-1992-28740-art-88
- id: m03-l19-q0070
  prompt:
    es: "Señale la respuesta CORRECTA sobre la forma de la repercusión del impuesto, según el artículo 88.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    correct: true
    text:
      es: "La cuota repercutida se consigna separadamente de la base imponible, incluso en el caso de precios fijados administrativamente, indicando el tipo impositivo aplicado."
  - id: b
    text:
      es: "La cuota repercutida se incluye en el precio final, sin consignarla por separado, cuando los precios estén fijados administrativamente."
  - id: c
    text:
      es: "La cuota repercutida se consigna por separado de la base imponible, pero no es necesario indicar el tipo impositivo aplicado."
  - id: d
    text:
      es: "La cuota repercutida se consigna por separado solo cuando el destinatario sea un empresario o profesional con derecho a deducir."
  explanation:
    es: "La repercusión se hace mediante factura con la cuota separada de la base, incluso con precios administrativos, y con indicación del tipo. No se puede omitir el tipo ni limitar la consignación separada a destinatarios con derecho a deducir."
  citation: "art. 88.Dos LIVA"
  difficulty: 2
  tags:
  - "repercusión"
  - "factura"
# anchor: boe-a-1992-28740-art-88
- id: m03-l19-q0071
  prompt:
    es: "Según el artículo 88.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuándo debe efectuarse la repercusión del impuesto?"
  options:
  - id: a
    text:
      es: "En el momento en que el destinatario efectúe el pago de la operación."
  - id: b
    correct: true
    text:
      es: "Al tiempo de expedir y entregar la factura correspondiente."
  - id: c
    text:
      es: "Al tiempo de presentar la autoliquidación del período correspondiente."
  - id: d
    text:
      es: "En el momento en que se produzca el devengo del impuesto."
  explanation:
    es: "La repercusión se hace al expedir y entregar la factura. El devengo, la presentación de la autoliquidación y el pago del destinatario son otros momentos, y el destinatario no está obligado a soportarla antes del devengo."
  citation: "art. 88.Tres LIVA"
  difficulty: 1
  tags:
  - "repercusión"
  - "factura"
# anchor: boe-a-1992-28740-art-88
- id: m03-l19-q0072
  prompt:
    es: "De acuerdo con el artículo 88.Cuatro de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿desde cuándo se cuenta el año transcurrido el cual se pierde el derecho a la repercusión?"
  options:
  - id: a
    text:
      es: "La fecha de expedición de la factura."
  - id: b
    text:
      es: "La presentación de la autoliquidación del período."
  - id: c
    text:
      es: "El vencimiento del plazo de pago de la operación."
  - id: d
    correct: true
    text:
      es: "La fecha del devengo."
  explanation:
    es: "El año se cuenta desde la fecha del devengo. Ni la expedición de la factura, ni la presentación de la autoliquidación ni el vencimiento del pago marcan el inicio."
  citation: "art. 88.Cuatro LIVA"
  difficulty: 1
  tags:
  - "repercusión"
  - "plazos"
# anchor: boe-a-1992-28740-art-88
- id: m03-l19-q0074
  prompt:
    es: "Conforme al artículo 88.Cinco de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿antes de qué momento puede el destinatario negarse a soportar la repercusión del impuesto?"
  options:
  - id: a
    correct: true
    text:
      es: "Al momento del devengo de este."
  - id: b
    text:
      es: "Al momento de la entrega de los bienes."
  - id: c
    text:
      es: "Al momento de la expedición de la factura."
  - id: d
    text:
      es: "Al momento del pago del precio pactado."
  explanation:
    es: "El destinatario puede negarse a soportar la repercusión antes del devengo. La factura, el pago o la entrega son referencias distintas."
  citation: "art. 88.Cinco LIVA"
  difficulty: 1
  tags:
  - "repercusión"
# anchor: boe-a-1992-28740-art-88
- id: m03-l19-q0075
  prompt:
    es: "Según el artículo 88.Seis de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, las controversias sobre la repercusión del impuesto, tanto respecto a la procedencia como a la cuantía de la misma, se considerarán de naturaleza:"
  options:
  - id: a
    correct: true
    text:
      es: "tributaria a efectos de las reclamaciones en la vía económico-administrativa."
  - id: b
    text:
      es: "administrativa general, por lo que se resolverán mediante recurso de alzada ante el superior."
  - id: c
    text:
      es: "mercantil, por lo que corresponderán al juez del concurso si el deudor está en concurso."
  - id: d
    text:
      es: "civil, por lo que se resolverán ante los tribunales del orden jurisdiccional civil."
  explanation:
    es: "Las controversias sobre procedencia y cuantía de la repercusión son tributarias a efectos de la vía económico-administrativa. No se tratan como civiles, mercantiles ni como un recurso de alzada ordinario."
  citation: "art. 88.Seis LIVA"
  difficulty: 1
  tags:
  - "repercusión"
  - "reclamaciones"
# anchor: boe-a-1992-28740-art-89
- id: m03-l19-q0076
  prompt:
    es: "Señale la respuesta CORRECTA sobre la rectificación de las cuotas repercutidas según el artículo 89.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Debe efectuarse cuando se advierta la incorrecta determinación de las cuotas, siempre que no hubiese transcurrido un año a partir del momento en que se devengó el impuesto correspondiente a la operación."
  - id: b
    correct: true
    text:
      es: "Debe efectuarse cuando se advierta la incorrecta determinación de las cuotas, siempre que no hubiesen transcurrido cuatro años a partir del momento en que se devengó el impuesto."
  - id: c
    text:
      es: "Debe efectuarse en el mes siguiente a la presentación de la autoliquidación en que se incluyeron las cuotas, aunque se advierta el error después."
  - id: d
    text:
      es: "Debe efectuarse cuando se advierta la incorrecta determinación de las cuotas, sin límite de tiempo mientras el destinatario no haya deducido la cuota."
  explanation:
    es: "La rectificación se hace al advertir la causa del error, con límite de cuatro años desde el devengo. El año es el plazo para perder el derecho a repercutir (art. 88.Cuatro), no hay rectificación sin límite de tiempo y el precepto no la liga a un mes desde la autoliquidación."
  citation: "art. 89.Uno LIVA"
  difficulty: 2
  tags:
  - "repercusión"
  - "rectificación"
  - "plazos"
# anchor: boe-a-1992-28740-art-89
- id: m03-l19-q0077
  prompt:
    es: "Textil Alcor, S.A. repercute el 21 % en una operación sujeta y no exenta que se devengó el 10 de junio de 2025, pero el tipo aplicable era el 10 %. Advierte el error el 15 de marzo de 2029. Según el artículo 89.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿puede rectificar la cuota repercutida?"
  options:
  - id: a
    text:
      es: "Sí, pero solo si el destinatario no hubiese deducido la cuota repercutida en exceso."
  - id: b
    correct: true
    text:
      es: "Sí, porque no han transcurrido cuatro años desde el 10 de junio de 2025, fecha del devengo."
  - id: c
    text:
      es: "No, porque han transcurrido más de tres años desde que se expidió la factura."
  - id: d
    text:
      es: "No, porque ha transcurrido más de un año desde la fecha del devengo de la operación."
  explanation:
    es: "Los cuatro años se cuentan desde el devengo, el 10 de junio de 2025, y vencen el 10 de junio de 2029. El 15 de marzo de 2029 es anterior, y la rectificación es posible. El año del artículo 88.Cuatro rige la pérdida del derecho a repercutir, y lo que haya deducido el destinatario no condiciona la rectificación."
  citation: "art. 89.Uno LIVA"
  difficulty: 3
  tags:
  - "repercusión"
  - "rectificación"
  - "cómputo"
# anchor: boe-a-1992-28740-art-89
- id: m03-l19-q0078
  prompt:
    es: "Según el artículo 89.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la rectificación de las cuotas repercutidas se aplica también cuando, no habiéndose repercutido cuota alguna:"
  options:
  - id: a
    text:
      es: "se hubiese cobrado el precio de la operación al destinatario."
  - id: b
    correct: true
    text:
      es: "se hubiese expedido la factura correspondiente a la operación."
  - id: c
    text:
      es: "se hubiese solicitado la devolución del saldo a favor del sujeto pasivo."
  - id: d
    text:
      es: "se hubiese presentado la autoliquidación correspondiente al período."
  explanation:
    es: "La regla alcanza al caso de factura expedida sin cuota repercutida. La autoliquidación, el cobro del precio y la solicitud de devolución no son el supuesto del apartado Dos."
  citation: "art. 89.Dos LIVA"
  difficulty: 1
  tags:
  - "repercusión"
  - "rectificación"
# anchor: boe-a-1992-28740-art-89
- id: m03-l19-q0079
  prompt:
    es: "Señale la respuesta CORRECTA sobre la documentación de la rectificación de las cuotas repercutidas, según el artículo 89.Cuatro de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Se documenta mediante un escrito dirigido a la Administración tributaria que debe resolver expresamente."
  - id: b
    correct: true
    text:
      es: "Se documenta en la forma que reglamentariamente se establezca."
  - id: c
    text:
      es: "Se documenta mediante una declaración complementaria del período en que se devengó la operación."
  - id: d
    text:
      es: "Se documenta mediante una nota de abono que el destinatario debe conservar durante cuatro años."
  explanation:
    es: "La ley remite al reglamento la forma de documentar la rectificación, que es la factura rectificativa. No exige una declaración complementaria, una resolución expresa de la Administración ni una nota de abono con conservación específica."
  citation: "art. 89.Cuatro LIVA"
  difficulty: 2
  tags:
  - "repercusión"
  - "rectificación"
# anchor: boe-a-1992-28740-art-92
- id: m03-l19-q0081
  prompt:
    es: "¿Cuál de las siguientes cuotas puede deducir el sujeto pasivo de las cuotas devengadas por sus operaciones gravadas en el interior del país, conforme al artículo 92.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "Las devengadas por las importaciones de bienes."
  - id: b
    text:
      es: "Las soportadas en operaciones ajenas a su actividad empresarial o profesional."
  - id: c
    text:
      es: "Las repercutidas por quien no tenga la condición de sujeto pasivo del impuesto."
  - id: d
    text:
      es: "Las devengadas en un territorio distinto del de aplicación del impuesto."
  explanation:
    es: "Las importaciones de bienes están en la lista de operaciones que dan derecho a deducir (art. 92.Uno.2.º). Las repercutidas por quien no es sujeto pasivo, las devengadas fuera del territorio y las ajenas a la actividad no cumplen lo que exige el apartado Uno."
  citation: "art. 92.Uno LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "cuotas deducibles"
# anchor: boe-a-1992-28740-art-92
- id: m03-l19-q0082
  prompt:
    es: "De acuerdo con el artículo 92.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, el derecho a la deducción solo procede en la medida en que los bienes y servicios adquiridos se utilicen en:"
  options:
  - id: a
    text:
      es: "la realización de las operaciones sujetas al impuesto en el territorio de aplicación."
  - id: b
    text:
      es: "la realización de las operaciones exentas del artículo 20 de la Ley."
  - id: c
    text:
      es: "la realización de cualquier actividad económica, aunque no esté sujeta al impuesto."
  - id: d
    correct: true
    text:
      es: "la realización de las operaciones comprendidas en el artículo 94, apartado uno."
  explanation:
    es: "El derecho se limita a la medida en que los bienes se usen en las operaciones del artículo 94.Uno. Las actividades no sujetas, las exentas del artículo 20 y las sujetas en el territorio, sin más, no coinciden con esa lista."
  citation: "art. 92.Dos LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "cuotas deducibles"
# anchor: boe-a-1992-28740-art-93
- id: m03-l19-q0083
  prompt:
    es: "Señale la respuesta CORRECTA sobre los requisitos subjetivos de la deducción, según el artículo 93.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Pueden deducir los sujetos pasivos que tengan la condición de empresarios o profesionales, siempre que hayan realizado entregas de bienes durante dos años consecutivos."
  - id: b
    text:
      es: "Pueden deducir los sujetos pasivos que tengan la condición de empresarios o profesionales desde que presentan la declaración censal, aunque no hayan iniciado la actividad."
  - id: c
    correct: true
    text:
      es: "Pueden deducir los sujetos pasivos que tengan la condición de empresarios o profesionales y hayan iniciado la realización habitual de entregas de bienes o prestaciones de servicios de su actividad."
  - id: d
    text:
      es: "Pueden deducir los sujetos pasivos que no tengan la condición de empresarios o profesionales, si realizan entregas de bienes de forma habitual."
  explanation:
    es: "Hace falta ser empresario o profesional y haber iniciado la realización habitual de entregas o servicios de la actividad. La declaración censal por sí sola, un historial de dos años o la ausencia de la condición de empresario no son requisitos del artículo 93.Uno."
  citation: "art. 93.Uno LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "requisitos subjetivos"
# anchor: boe-a-1992-28740-art-93
- id: m03-l19-q0085
  prompt:
    es: "¿Qué sujetos pasivos pueden hacer uso del derecho a deducir, además de los empresarios o profesionales que han iniciado su actividad habitual, según el artículo 93.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "Los que realicen con carácter ocasional las entregas de los medios de transporte nuevos a que se refiere el artículo 25, apartados uno y dos."
  - id: b
    text:
      es: "Los que realicen con carácter ocasional entregas de bienes inmuebles exentas conforme al artículo 20."
  - id: c
    text:
      es: "Los que realicen con carácter ocasional entregas de bienes de inversión usados en su actividad."
  - id: d
    text:
      es: "Los que realicen con carácter habitual operaciones no sujetas conforme al artículo 7 de la Ley."
  explanation:
    es: "El artículo 93.Dos reconoce el derecho a quien entrega ocasionalmente medios de transporte nuevos del artículo 25, apartados uno y dos. Las entregas ocasionales de inmuebles exentos o de bienes de inversión usados, y las operaciones no sujetas habituales no están en ese apartado."
  citation: "art. 93.Dos LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "requisitos subjetivos"
# anchor: boe-a-1992-28740-art-93
- id: m03-l19-q0087
  prompt:
    es: "Conforme al artículo 93.Cinco de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, los sujetos pasivos que realicen conjuntamente operaciones sujetas y operaciones no sujetas por aplicación del artículo 7.8.º pueden deducir las cuotas soportadas por bienes destinados a ambas de forma simultánea:"
  options:
  - id: a
    correct: true
    text:
      es: "en función de un criterio razonable y homogéneo de imputación."
  - id: b
    text:
      es: "en función del volumen de operaciones de cada una de las actividades."
  - id: c
    text:
      es: "en la proporción fija del cincuenta por ciento de las cuotas soportadas."
  - id: d
    text:
      es: "en la proporción que determine la Administración tributaria en cada caso."
  explanation:
    es: "La ley acude a un criterio razonable y homogéneo de imputación, que debe mantenerse salvo causas razonables de modificación. No fija un porcentaje del cincuenta por ciento, ni el volumen de operaciones ni una decisión caso a caso de la Administración."
  citation: "art. 93.Cinco LIVA"
  difficulty: 1
  tags:
  - "deducciones"
  - "operaciones no sujetas"
# anchor: boe-a-1992-28740-art-93
- id: m03-l19-q0088
  prompt:
    es: "Señale la respuesta CORRECTA sobre las cuotas soportadas por bienes destinados exclusivamente a operaciones no sujetas del artículo 7.8.º, según el artículo 93.Cinco de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Son deducibles en la proporción que resulte de aplicar la prorrata general."
  - id: b
    correct: true
    text:
      es: "No son deducibles en proporción alguna."
  - id: c
    text:
      es: "Son deducibles íntegramente si el sujeto pasivo realiza también operaciones sujetas."
  - id: d
    text:
      es: "Son deducibles al cincuenta por ciento hasta que se acredite un destino distinto."
  explanation:
    es: "Lo destinado exclusivamente a las operaciones no sujetas del 7.8.º no es deducible en proporción alguna. La prorrata, la deducción íntegra por realizar además operaciones sujetas y el cincuenta por ciento provisional no se aplican a ese destino exclusivo."
  citation: "art. 93.Cinco LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "operaciones no sujetas"
# anchor: boe-a-1992-28740-art-94
- id: m03-l19-q0089
  prompt:
    es: "De acuerdo con el artículo 94.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, en ningún caso procede la deducción de las cuotas en cuantía superior a la que legalmente corresponda ni:"
  options:
  - id: a
    correct: true
    text:
      es: "antes de que se hubiesen devengado con arreglo a derecho."
  - id: b
    text:
      es: "después de que se haya presentado la autoliquidación del período."
  - id: c
    text:
      es: "después de que haya transcurrido un año desde su devengo."
  - id: d
    text:
      es: "antes de que se hubiese recibido el pago del precio."
  explanation:
    es: "La deducción no puede exceder de lo que corresponda legalmente ni adelantarse al devengo de la cuota. El año, el pago del precio y la presentación de la autoliquidación no son los límites de este apartado."
  citation: "art. 94.Tres LIVA"
  difficulty: 1
  tags:
  - "deducciones"
  - "devengo"
# anchor: boe-a-1992-28740-art-94
- id: m03-l19-q0090
  prompt:
    es: "¿Cuál de las siguientes operaciones realizadas en el ámbito espacial de aplicación del impuesto origina el derecho a la deducción, según el artículo 94.Uno.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Las operaciones no sujetas en virtud del artículo 7, apartado ocho, de la Ley, aunque se realicen en el interior."
  - id: b
    correct: true
    text:
      es: "Las operaciones exentas en virtud de los artículos 20 bis, 21, 22, 23, 24 y 25."
  - id: c
    text:
      es: "Las operaciones sujetas y exentas realizadas por entidades sin ánimo de lucro."
  - id: d
    text:
      es: "Las operaciones exentas en virtud del artículo 20, apartado uno, de la Ley."
  explanation:
    es: "Dan derecho a deducir las entregas y servicios sujetos y no exentos y las operaciones exentas de los artículos 20 bis, 21, 22, 23, 24 y 25. Las exentas del artículo 20.Uno no lo dan, y tampoco las no sujetas del 7.8.º ni las exentas por razón del tipo de entidad."
  citation: "art. 94.Uno LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "operaciones con derecho a deducir"
# anchor: boe-a-1992-28740-art-95
- id: m03-l19-q0091
  prompt:
    es: "Según el artículo 95.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, los empresarios o profesionales no pueden deducir las cuotas soportadas por las adquisiciones de bienes o servicios que no se afecten:"
  options:
  - id: a
    text:
      es: "principalmente a su actividad empresarial o profesional."
  - id: b
    correct: true
    text:
      es: "directa y exclusivamente a su actividad empresarial o profesional."
  - id: c
    text:
      es: "directa o indirectamente a su actividad empresarial o profesional."
  - id: d
    text:
      es: "exclusivamente a operaciones sujetas y no exentas del impuesto."
  explanation:
    es: "La condición es la afectación directa y exclusiva. Bastaría la indirecta o la principal solo si el texto lo dijera, y la ley no la limita a operaciones sujetas y no exentas."
  citation: "art. 95.Uno LIVA"
  difficulty: 1
  tags:
  - "deducciones"
  - "limitaciones"
# anchor: boe-a-1992-28740-art-95
- id: m03-l19-q0092
  prompt:
    es: "¿A cuál de los siguientes bienes se le niega la afectación directa y exclusiva a la actividad empresarial o profesional, según el artículo 95.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "Los bienes que no figuren en la contabilidad o registros oficiales de la actividad empresarial o profesional del sujeto pasivo."
  - id: b
    text:
      es: "Los que figuren en la contabilidad y se integren en el patrimonio empresarial del sujeto pasivo."
  - id: c
    text:
      es: "Los destinados a los servicios económicos y socio-culturales del personal al servicio de la actividad."
  - id: d
    text:
      es: "Los destinados al alojamiento gratuito en locales de la empresa del personal encargado de la vigilancia y seguridad de los mismos."
  explanation:
    es: "El bien que no figura en la contabilidad o registros oficiales no se entiende afecto. En cambio, el alojamiento del personal de vigilancia y los servicios socio-culturales son excepciones expresas del número 5.º, y lo contabilizado e integrado en el patrimonio empresarial sí es afecto."
  citation: "art. 95.Dos LIVA"
  difficulty: 2
  tags:
