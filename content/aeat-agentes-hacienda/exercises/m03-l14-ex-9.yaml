# anchor: boe-a-2003-23186-art-230
- id: m03-l14-q0151
  prompt:
    es: "Según el artículo 230.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los recursos y las reclamaciones económico-administrativas se acumulan a efectos de su tramitación y resolución cuando la reclamación se interpone contra una sanción y se hubiera presentado reclamación contra:"
  options:
  - id: a
    correct: true
    text:
      es: "La deuda tributaria de la que deriva."
  - id: b
    text:
      es: "Otra sanción impuesta al mismo obligado tributario."
  - id: c
    text:
      es: "El acto de imposición de otra sanción por el mismo ejercicio."
  - id: d
    text:
      es: "El acuerdo de inicio del procedimiento sancionador."
  explanation:
    es: "La letra d) acumula la reclamación contra la sanción con la reclamación contra la deuda tributaria de la que deriva. Otra sanción distinta, el acuerdo de inicio o una sanción del mismo ejercicio no son el supuesto."
  citation: "art. 230.1.d LGT"
  difficulty: 2
  tags:
  - "acumulación"
  - "sanciones"
# anchor: boe-a-2003-23186-art-230
- id: m03-l14-q0152
  prompt:
    es: "De acuerdo con el artículo 230.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los acuerdos sobre acumulación o por los que se deja sin efecto una acumulación tienen el carácter de actos de trámite y:"
  options:
  - id: a
    text:
      es: "Son recurribles en reposición."
  - id: b
    text:
      es: "Son recurribles en alzada ordinario."
  - id: c
    text:
      es: "Son recurribles ante la Sala Especial."
  - id: d
    correct: true
    text:
      es: "No son recurribles."
  explanation:
    es: "Los acuerdos de acumulación son actos de trámite y no son recurribles (art. 230.3). Ni cabe reposición, ni alzada ordinario, ni la Sala Especial, que conoce otro recurso."
  citation: "art. 230.3 LGT"
  difficulty: 1
  tags:
  - "acumulación"
  - "recursos"
# anchor: boe-a-2003-23186-art-232
- id: m03-l14-q0153
  prompt:
    es: "Conforme al artículo 232.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, están legitimados para promover las reclamaciones económico-administrativas los obligados tributarios, los sujetos infractores y cualquier otra persona:"
  options:
  - id: a
    text:
      es: "Que haya denunciado los hechos ante la Administración tributaria."
  - id: b
    correct: true
    text:
      es: "Cuyos intereses legítimos resulten afectados por el acto o la actuación tributaria."
  - id: c
    text:
      es: "Que sea destinataria de los fondos gestionados mediante el acto."
  - id: d
    text:
      es: "Que haya asumido las obligaciones tributarias en virtud de pacto o contrato con el obligado."
  explanation:
    es: "Está legitimada cualquier persona cuyos intereses legítimos resulten afectados (art. 232.1.b). Los denunciantes, los destinatarios de los fondos y quienes asumen obligaciones por pacto o contrato figuran en la lista de no legitimados del apartado 2."
  citation: "art. 232.1 LGT"
  difficulty: 1
  tags:
  - "legitimación"
  - "reclamación"
# anchor: boe-a-2003-23186-art-232
- id: m03-l14-q0154
  prompt:
    es: "Según el artículo 232 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál de las siguientes personas está legitimada para promover una reclamación económico-administrativa?"
  options:
  - id: a
    text:
      es: "El órgano que haya dictado el acto impugnado."
  - id: b
    correct: true
    text:
      es: "Un sujeto infractor sancionado por la Administración tributaria."
  - id: c
    text:
      es: "Un denunciante de los hechos que originaron el procedimiento tributario."
  - id: d
    text:
      es: "Un particular que obra como mandatario de la Administración."
  explanation:
    es: "Los obligados tributarios y los sujetos infractores están legitimados (art. 232.1.a). Los denunciantes, los particulares que obran por delegación o como mandatarios de la Administración y los órganos que dictaron el acto no lo están (art. 232.2)."
  citation: "art. 232.2 LGT"
  difficulty: 2
  tags:
  - "legitimación"
  - "exclusiones"
# anchor: boe-a-2003-23186-art-232
- id: m03-l14-q0156
  prompt:
    es: "De acuerdo con el artículo 232.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, entre quienes no están legitimados para promover reclamaciones económico-administrativas se encuentran los que asuman obligaciones tributarias en virtud de:"
  options:
  - id: a
    text:
      es: "Declaración de responsabilidad solidaria."
  - id: b
    text:
      es: "Sucesión mortis causa del obligado fallecido."
  - id: c
    correct: true
    text:
      es: "Pacto o contrato."
  - id: d
    text:
      es: "Resolución administrativa firme de derivación."
  explanation:
    es: "La letra d) excluye a quienes asumen obligaciones tributarias por pacto o contrato. Quien lo hace por sucesión, por resolución firme o por declaración de responsabilidad es interesado afectado y no entra en la exclusión."
  citation: "art. 232.2 LGT"
  difficulty: 2
  tags:
  - "legitimación"
  - "exclusiones"
# anchor: boe-a-2003-23186-art-232
- id: m03-l14-q0157
  prompt:
    es: "Según el artículo 232.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, no están legitimados para promover reclamaciones económico-administrativas los organismos u órganos que hayan dictado el acto impugnado, ni cualquier otra entidad por el mero hecho de ser destinataria de:"
  options:
  - id: a
    text:
      es: "Las notificaciones y comunicaciones relativas a dicho acto."
  - id: b
    correct: true
    text:
      es: "Los fondos gestionados mediante dicho acto."
  - id: c
    text:
      es: "Las sanciones vinculadas a dicho acto."
  - id: d
    text:
      es: "Los recargos derivados de dicho acto."
  explanation:
    es: "La letra e) excluye a las entidades que solo son destinatarias de los fondos gestionados mediante el acto. Las notificaciones, los recargos y las sanciones no son el criterio del texto."
  citation: "art. 232.2 LGT"
  difficulty: 1
  tags:
  - "legitimación"
  - "exclusiones"
# anchor: boe-a-2003-23186-art-233
- id: m03-l14-q0159
  prompt:
    es: "Una pequeña empresa reclama contra una liquidación y alega que embargar sus cuentas le causaría perjuicios de difícil reparación, pues no podría pagar a sus trabajadores. No puede aportar ninguna garantía. Conforme al artículo 233.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el tribunal económico-administrativo:"
  options:
  - id: a
    text:
      es: "Debe rechazar la suspensión, porque sin garantía no cabe suspender."
  - id: b
    text:
      es: "Debe suspender automáticamente la ejecución, sin examinar los perjuicios alegados."
  - id: c
    correct: true
    text:
      es: "Puede suspender la ejecución con dispensa total o parcial de garantías."
  - id: d
    text:
      es: "Puede suspender solo si el órgano que dictó el acto lo autoriza."
  explanation:
    es: "Cuando la ejecución puede causar perjuicios de difícil o imposible reparación, el tribunal puede suspender con dispensa total o parcial de garantías (art. 233.4). No debe rechazar sin más. La suspensión automática exige garantía, salvo sanciones. Y la decisión es del tribunal, sin autorización del órgano que dictó el acto."
  citation: "art. 233.4 LGT"
  difficulty: 3
  tags:
  - "supuesto"
  - "suspensión"
  - "perjuicios"
# anchor: boe-a-2003-23186-art-233
- id: m03-l14-q0160
  prompt:
    es: "En una liquidación a nombre de Marta Ibáñez Sola se advierte un error aritmético en la suma de las bases. Marta reclama ante el tribunal económico-administrativo y pide la suspensión sin aportar garantía. Según el artículo 233.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede suspenderse?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, se puede suspender la ejecución sin necesidad de aportar garantía."
  - id: b
    text:
      es: "Sí, pero solo si Marta aporta fianza personal y solidaria de otro contribuyente."
  - id: c
    text:
      es: "No, porque la suspensión sin garantía solo la concede el órgano que dictó el acto."
  - id: d
    text:
      es: "No, porque la suspensión sin garantía solo cabe si se alegan perjuicios de difícil reparación."
  explanation:
    es: "El artículo 233.5 permite suspender sin garantía cuando se aprecie que al dictar el acto se ha podido incurrir en error aritmético, material o de hecho. No es necesario alegar perjuicios, que es otra vía (art. 233.4), ni lo concede otro órgano, ni hace falta fianza."
  citation: "art. 233.5 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "suspensión"
  - "error"
# anchor: boe-a-2003-23186-art-233
- id: m03-l14-q0161
  prompt:
    es: "De acuerdo con el artículo 233.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la ejecución del acto impugnado queda suspendida automáticamente a instancia del interesado si se garantiza el importe de dicho acto, los intereses de demora que genere la suspensión y:"
  options:
  - id: a
    correct: true
    text:
      es: "Los recargos que procederían en caso de ejecución de la garantía."
  - id: b
    text:
      es: "Los gastos de tramitación de la reclamación ante el tribunal competente."
  - id: c
    text:
      es: "Las costas que pudiera imponer el tribunal por temeridad."
  - id: d
    text:
      es: "El interés legal devengado desde la notificación del acto."
  explanation:
    es: "La garantía cubre el importe del acto, los intereses de demora y los recargos que procederían si se ejecutase la garantía (art. 233.1), igual que en la reposición. No cubre gastos de tramitación, costas ni interés legal."
  citation: "art. 233.1 LGT"
  difficulty: 1
  tags:
  - "suspensión"
  - "garantías"
# anchor: boe-a-2003-23186-art-233
- id: m03-l14-q0162
  prompt:
    es: "Conforme al artículo 233.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las garantías necesarias para obtener la suspensión automática son exclusivamente las mismas tres del artículo 224.2, entre ellas la fianza personal y solidaria de otros contribuyentes:"
  options:
  - id: a
    text:
      es: "De entidades de crédito, para los supuestos que se establezcan en la normativa tributaria."
  - id: b
    text:
      es: "Con garantía hipotecaria suficiente, para los supuestos que se establezcan en la normativa tributaria."
  - id: c
    text:
      es: "De reconocida solvencia, en todos los casos y con independencia de la cuantía."
  - id: d
    correct: true
    text:
      es: "De reconocida solvencia, para los supuestos que se establezcan en la normativa tributaria."
  explanation:
    es: "La tercera garantía es la fianza personal y solidaria de otros contribuyentes de reconocida solvencia, solo para los supuestos que establezca la normativa tributaria (art. 224.2.c, al que remite el 233.2). No vale en todos los casos. No exige garantía hipotecaria. Y la fianza de entidades de crédito es la segunda garantía, con el aval."
  citation: "art. 233.2 LGT"
  difficulty: 1
  tags:
  - "suspensión"
  - "garantías"
# anchor: boe-a-2003-23186-art-233
- id: m03-l14-q0163
  prompt:
    es: "Según el artículo 233.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué debe prestar el interesado para obtener la suspensión si carece de las garantías necesarias para la suspensión automática?"
  options:
  - id: a
    text:
      es: "Una fianza fija del diez por ciento del importe."
  - id: b
    text:
      es: "Una declaración jurada de insolvencia."
  - id: c
    correct: true
    text:
      es: "Otras garantías que se estimen suficientes."
  - id: d
    text:
      es: "Un aval del Estado o de una Comunidad Autónoma."
  explanation:
    es: "El artículo 233.3 permite suspender con otras garantías que se estimen suficientes. No fija un porcentaje, no exige aval público ni basta una declaración jurada."
  citation: "art. 233.3 LGT"
  difficulty: 2
  tags:
  - "suspensión"
  - "garantías"
# anchor: boe-a-2003-23186-art-233
- id: m03-l14-q0164
  prompt:
    es: "De acuerdo con el artículo 233.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el tribunal económico-administrativo inadmite las solicitudes de suspensión de los apartados 4 y 5 cuando no pueda deducirse de la documentación la existencia de indicios de los perjuicios de difícil o imposible reparación o de:"
  options:
  - id: a
    text:
      es: "Insuficiencia de la garantía ofrecida."
  - id: b
    correct: true
    text:
      es: "Error aritmético, material o de hecho."
  - id: c
    text:
      es: "Falta de legitimación del solicitante."
  - id: d
    text:
      es: "Defectos de forma en el escrito de interposición."
  explanation:
    es: "La inadmisión del artículo 233.6 se refiere a la falta de indicios de los perjuicios o del error aritmético, material o de hecho. La legitimación, los defectos de forma y la insuficiencia de la garantía no son esa causa."
  citation: "art. 233.6 LGT"
  difficulty: 2
  tags:
  - "suspensión"
  - "admisión"
# anchor: boe-a-2003-23186-art-233
- id: m03-l14-q0165
  prompt:
    es: "Una liquidación a cargo de Víctor Arias Gómez suma 30.000 euros. Víctor reclama solo contra 12.000 euros y obtiene la suspensión. Conforme al artículo 233.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué cantidad queda obligado a ingresar?"
  options:
  - id: a
    text:
      es: "Nada, porque la suspensión cubre toda la deuda."
  - id: b
    correct: true
    text:
      es: "18.000 euros, porque la suspensión se refiere solo a la parte reclamada."
  - id: c
    text:
      es: "30.000 euros, porque la suspensión no admite parcialidad en la vía económico-administrativa."
  - id: d
    text:
      es: "12.000 euros, porque debe ingresar la parte reclamada."
  explanation:
    es: "Si la reclamación no afecta a toda la deuda, la suspensión se refiere a la parte reclamada y el reclamante debe ingresar el resto (art. 233.7): 30.000 menos 12.000, es decir, 18.000 euros. Los 12.000 son la parte suspendida. Y la suspensión parcial sí cabe."
  citation: "art. 233.7 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "suspensión"
  - "parcial"
# anchor: boe-a-2003-23186-art-233
- id: m03-l14-q0166
  prompt:
    es: "Según el artículo 233.10 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la suspensión producida en el recurso de reposición se puede mantener en la vía económico-administrativa en las condiciones que se determinen:"
  options:
  - id: a
    correct: true
    text:
      es: "Reglamentariamente."
  - id: b
    text:
      es: "Por acuerdo entre la Administración y el interesado."
  - id: c
    text:
      es: "Por el propio tribunal en cada caso."
  - id: d
    text:
      es: "Por el órgano que resolvió la reposición."
  explanation:
    es: "Las condiciones de mantenimiento de la suspensión de la reposición en la vía económico-administrativa las fija el reglamento (art. 233.10). No las determinan el tribunal caso por caso, el órgano de reposición ni un acuerdo con el interesado."
  citation: "art. 233.10 LGT"
  difficulty: 2
  tags:
  - "suspensión"
  - "reposición"
# anchor: boe-a-2003-23186-art-233
- id: m03-l14-q0167
  prompt:
    es: "Según el artículo 233.14 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede suspenderse la ejecución del acto o resolución impugnado mediante un recurso extraordinario de revisión?"
  options:
  - id: a
    text:
      es: "Sí, cuando el Tribunal Económico-Administrativo Central lo acuerde de oficio."
  - id: b
    text:
      es: "Sí, pero solo si se aprecia error aritmético, material o de hecho."
  - id: c
    correct: true
    text:
      es: "No, la ejecución no puede suspenderse en ningún caso."
  - id: d
    text:
      es: "Sí, con garantía suficiente que cubra el importe y los intereses."
  explanation:
    es: "El artículo 233.14 prohíbe en todo caso la suspensión de la ejecución del acto o resolución impugnado por el recurso extraordinario de revisión. Ni con garantía, ni por error aritmético, ni de oficio."
  citation: "art. 233.14 LGT"
  difficulty: 3
  tags:
  - "suspensión"
  - "extraordinario"
