# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q024
  prompt:
    es: "En Windows 11, si no se conoce la extensión de un archivo, ¿qué opción de su menú contextual hace que Microsoft Store muestre las aplicaciones que pueden abrirlo?"
  options:
  - id: a
    text:
      es: "Mostrar más opciones › Enviar a"
  - id: b
    text:
      es: "Abrir con › Elegir otra aplicación"
  - id: c
    correct: true
    text:
      es: "Abrir con › Buscar en Microsoft Store"
  - id: d
    text:
      es: "Mostrar más opciones › Conceder acceso a"
  explanation:
    es: "La página de extensiones indica: si no se conoce la extensión, se hace clic con el botón derecho en el archivo y se selecciona «Abrir con>Buscar en Microsoft Store», y Microsoft Store muestra las aplicaciones que pueden abrirlo. Abrir con › Elegir otra aplicación muestra las aplicaciones del equipo, no las de la tienda; Enviar a lleva a destinos como una carpeta comprimida, y Conceder acceso a sirve para compartir el archivo en la red local."
  citation: "fuente: `ms-win-extensiones.html`; «Abrir extensiones de archivo desconocidas»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q025
  prompt:
    es: "En Windows 11, al hacer clic con el botón derecho en un archivo de extensión desconocida y seleccionar Abrir con › Elegir otra aplicación:"
  options:
  - id: a
    correct: true
    text:
      es: "Se muestra una lista de aplicaciones del equipo para intentar abrirlo."
  - id: b
    text:
      es: "Microsoft Store muestra una lista de las aplicaciones que pueden abrirlo."
  - id: c
    text:
      es: "Se cambia la extensión del archivo por la de la aplicación que se elija."
  - id: d
    text:
      es: "Se abre con la aplicación predeterminada, sin poder elegir otra."
  explanation:
    es: "La página indica que Abrir con › Elegir otra aplicación muestra «una lista de aplicaciones en el equipo» para intentar abrir el archivo. La lista de Microsoft Store es la de Abrir con › Buscar en Microsoft Store. Elegir una aplicación no cambia la extensión. La guía del Explorador para lectores de pantalla dice que Abrir con permite elegir una aplicación «incluso si ya hay un programa predeterminado configurado para ese tipo de archivo»."
  citation: "fuente: `ms-win-extensiones.html`; «Abrir extensiones de archivo desconocidas»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q052
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué hace la combinación Alt+D, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    text:
      es: "Muestra u oculta el panel de detalles"
  - id: b
    text:
      es: "Va a la carpeta anterior de la ruta"
  - id: c
    correct: true
    text:
      es: "Selecciona la barra de direcciones"
  - id: d
    text:
      es: "Muestra las propiedades del elemento seleccionado"
  explanation:
    es: "La tabla del Explorador asigna a Alt+D «Seleccionar la barra de direcciones». El panel de detalles se muestra u oculta con Alt+Mayús+P; la carpeta anterior se abre con Alt+Flecha izquierda o Retroceso, y las propiedades del elemento seleccionado se ven con Alt+Entrar."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q053
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes combinaciones selecciona la barra de direcciones?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+E"
  - id: b
    text:
      es: "Alt+Flecha arriba"
  - id: c
    text:
      es: "Alt+Mayús+P"
  - id: d
    correct: true
    text:
      es: "Alt+D"
  explanation:
    es: "La tabla del Explorador asigna a Alt+D «Seleccionar la barra de direcciones». Alt+Flecha arriba sube un nivel en la ruta de la carpeta, Alt+Mayús+P muestra u oculta el panel de detalles y Ctrl+Mayús+E expande todas las carpetas del árbol del panel de navegación."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q054
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué ocurre al pulsar Alt+Entrar con un archivo seleccionado?"
  options:
  - id: a
    text:
      es: "Se muestra el menú contextual del elemento seleccionado"
  - id: b
    text:
      es: "Se muestra u oculta el panel de vista previa del elemento"
  - id: c
    correct: true
    text:
      es: "Se muestran las propiedades del elemento seleccionado"
  - id: d
    text:
      es: "Se pasa a cambiar el nombre del elemento seleccionado"
  explanation:
    es: "La tabla del Explorador asigna a Alt+Entrar «Ver las propiedades del elemento seleccionado». El menú contextual se abre con Mayús+F10, el nombre se cambia con F2 y el panel de vista previa se muestra u oculta con Alt+P."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q055
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes parejas recoge lo que hacen, respectivamente, Alt+D y Alt+Entrar?"
  options:
  - id: a
    text:
      es: "Seleccionar la barra de direcciones y mostrar el panel de detalles"
  - id: b
    text:
      es: "Ver las propiedades del elemento y seleccionar la barra de direcciones"
  - id: c
    text:
      es: "Mostrar el panel de vista previa y ver las propiedades del elemento"
  - id: d
    correct: true
    text:
      es: "Seleccionar la barra de direcciones y ver las propiedades del elemento"
  explanation:
    es: "La tabla del Explorador asigna a Alt+D «Seleccionar la barra de direcciones» y a Alt+Entrar «Ver las propiedades del elemento seleccionado». La pareja invertida cambia el orden; el panel de detalles se muestra u oculta con Alt+Mayús+P, y el panel de vista previa con Alt+P."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q056
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué hace la combinación Alt+Flecha arriba, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    text:
      es: "Se desplaza hasta la parte superior de la ventana"
  - id: b
    correct: true
    text:
      es: "Sube un nivel en la ruta de acceso de la carpeta"
  - id: c
    text:
      es: "Muestra la carpeta siguiente a la que se volvió"
  - id: d
    text:
      es: "Vuelve a la carpeta que se había abierto antes"
  explanation:
    es: "La tabla asigna a Alt+Flecha arriba «Subir un nivel en la ruta de acceso de la carpeta». Volver a la carpeta anterior es Alt+Flecha izquierda o Retroceso; ver la carpeta siguiente es Alt+Flecha derecha, y la tecla Inicio lleva a la parte superior de la ventana activa."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q058
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué ocurre al pulsar Ctrl+Mayús+E, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    text:
      es: "Se cierra la pestaña activa o la ventana si solo hay una"
  - id: b
    text:
      es: "Se cambia el estilo de vista de la carpeta a Detalles"
  - id: c
    correct: true
    text:
      es: "Se expanden todas las carpetas del panel de navegación"
  - id: d
    text:
      es: "Se crea una carpeta nueva en la ubicación que está abierta"
  explanation:
    es: "La tabla asigna a Ctrl+Mayús+E «Expande todas las carpetas del árbol en el panel de navegación». Crear una carpeta nueva es Ctrl+Mayús+N; cerrar la pestaña activa es Ctrl+W, y la vista Detalles se pone con Ctrl+Mayús+6."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q059
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes combinaciones abre una pestaña nueva y cambia a ella?"
  options:
  - id: a
    text:
      es: "Ctrl+Tab"
  - id: b
    text:
      es: "Ctrl+U"
  - id: c
    correct: true
    text:
      es: "Ctrl+T"
  - id: d
    text:
      es: "Ctrl+W"
  explanation:
    es: "La tabla asigna a Ctrl+T «Abrir una pestaña nueva y cambiar a ella». Ctrl+W cierra la pestaña activa, Ctrl+Tab pasa a la pestaña siguiente y Ctrl+U abre una nueva ventana, no una pestaña."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
