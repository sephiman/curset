- id: g-checked-exception
  term:
    en: checked exception
  definition:
    en: Throwable and any subclass of Throwable that is not also a subclass of either RuntimeException or Error are regarded as checked exceptions.
  origin: m11-l02
  citation: javadoc-throwable#class-throwable
- id: g-wrapped-exception
  term:
    en: wrapped exception
  definition:
    en: A wrapped exception is an exception containing a cause.
  origin: m11-l02
  citation: javadoc-throwable#class-throwable
