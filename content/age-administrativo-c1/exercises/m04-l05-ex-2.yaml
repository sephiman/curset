# anchor: boe-a-1995-8729-art-50
- id: m04-l05-q027
  prompt:
    es: "Según el artículo 50.5 del Real Decreto 364/1995, de 10 de marzo, a los funcionarios removidos se les atribuirá el desempeño provisional de un puesto de su Cuerpo o Escala:"
  options:
  - id: a
    text:
      es: "en cualquier municipio y no inferior en más de dos niveles al de su grado personal."
  - id: b
    text:
      es: "en el mismo municipio y no inferior en más de un nivel al de su grado personal."
  - id: c
    correct: true
    text:
      es: "en el mismo municipio y no inferior en más de dos niveles al de su grado personal."
  - id: d
    text:
      es: "en el mismo municipio y no inferior en más de tres niveles al de su grado personal."
  explanation:
    es: "El artículo 50.5 RD 364/1995 atribuye al removido «el desempeño provisional de un puesto correspondiente a su Cuerpo o Escala, en el mismo municipio, no inferior en más de dos niveles al de su grado personal». El puesto ha de estar en el mismo municipio, no en cualquiera. La diferencia máxima es de dos niveles respecto del grado personal, no de uno ni de tres."
  citation: "art. 50.5 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-1995-8729-art-50
- id: m04-l05-q028
  prompt:
    es: "Según el artículo 50.5 del Real Decreto 364/1995, de 10 de marzo, ¿desde cuándo surte efectos la atribución provisional de un puesto al funcionario removido?"
  options:
  - id: a
    text:
      es: "Desde la fecha de la propuesta de remoción."
  - id: b
    correct: true
    text:
      es: "Desde el día siguiente al de la fecha del cese."
  - id: c
    text:
      es: "Desde la publicación de la siguiente convocatoria."
  - id: d
    text:
      es: "Desde el día en que se notifica la resolución."
  explanation:
    es: "El artículo 50.5 RD 364/1995 atribuye el puesto provisional «con efectos del día siguiente al de la fecha del cese». La propuesta de remoción es un trámite previo, y la resolución que la acuerda comporta el cese, pero el efecto se fija el día siguiente a ese cese. El artículo no lo hace depender de una convocatoria posterior."
  citation: "art. 50.5 RD 364/1995"
  difficulty: 2
  tags:
  - "efecto"
  - "fecha"
# anchor: boe-a-2015-11719-art-80
- id: m04-l05-q029
  prompt:
    es: "Según el artículo 80.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la libre designación con convocatoria pública consiste en:"
  options:
  - id: a
    correct: true
    text:
      es: "la apreciación discrecional por el órgano competente de la idoneidad de los candidatos en relación con los requisitos del puesto."
  - id: b
    text:
      es: "la valoración por una comisión de los méritos de los candidatos, con arreglo al baremo fijado en la convocatoria."
  - id: c
    text:
      es: "la apreciación reglada por el órgano competente de la idoneidad de los candidatos, conforme a un baremo público."
  - id: d
    text:
      es: "la elección por el órgano competente del candidato con mayor antigüedad entre los que reúnan los requisitos."
  explanation:
    es: "El artículo 80.1 TREBEP define la libre designación con convocatoria pública como «la apreciación discrecional por el órgano competente de la idoneidad de los candidatos en relación con los requisitos exigidos para el desempeño del puesto». La valoración de méritos por una comisión con baremo es el concurso. La apreciación no es reglada sino discrecional. No se elige por antigüedad."
  citation: "art. 80.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-51
- id: m04-l05-q030
  prompt:
    es: "Según el artículo 51.2 del Real Decreto 364/1995, de 10 de marzo, ¿cuál de los siguientes puestos nombra expresamente entre los que pueden cubrirse por libre designación?"
  options:
  - id: a
    text:
      es: "El puesto de Jefe de Área."
  - id: b
    text:
      es: "El puesto de Jefe de Servicio."
  - id: c
    text:
      es: "El puesto de Consejero Técnico."
  - id: d
    correct: true
    text:
      es: "El puesto de Subdirector general."
  explanation:
    es: "El artículo 51.2 RD 364/1995 enumera «los puestos de Subdirector general, Delegados y Directores territoriales, provinciales o Comisionados […], Secretarías de Altos Cargos de la Administración», y añade los de carácter directivo o de especial responsabilidad que determinen las relaciones de puestos de trabajo. Jefe de Área, Jefe de Servicio y Consejero Técnico no están en la enumeración: solo irán por libre designación si la relación de puestos de trabajo lo determina."
  citation: "art. 51.2 RD 364/1995"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-51
- id: m04-l05-q031
  prompt:
    es: "Según el artículo 51.2 del Real Decreto 364/1995, de 10 de marzo, además de los puestos que enumera, podrán cubrirse por libre designación:"
  options:
  - id: a
    text:
      es: "los que hayan quedado desiertos en un concurso anterior, si su provisión es urgente para el servicio."
  - id: b
    text:
      es: "los que el Subsecretario de cada Departamento califique de confianza mediante una resolución motivada."
  - id: c
    correct: true
    text:
      es: "los de carácter directivo o de especial responsabilidad para los que así se determine en las relaciones de puestos de trabajo."
  - id: d
    text:
      es: "los de nivel de complemento de destino 28 o superior, cualquiera que sea el contenido concreto de sus funciones."
  explanation:
    es: "El artículo 51.2 RD 364/1995 cierra su lista con «aquellos otros de carácter directivo o de especial responsabilidad para los que así se determine en las relaciones de puestos de trabajo». El concurso desierto con provisión urgente lleva a la comisión de servicios forzosa, no a la libre designación. El artículo no deja la calificación al Subsecretario. Tampoco fija un nivel mínimo: atiende al carácter directivo o a la especial responsabilidad."
  citation: "art. 51.2 RD 364/1995"
  difficulty: 2
  tags:
  - "concepto"
  - "competencia"
# anchor: boe-a-1995-8729-art-51
- id: m04-l05-q032
  prompt:
    es: "Según el artículo 51.2 del Real Decreto 364/1995, de 10 de marzo, pueden cubrirse por libre designación los puestos de Delegados y Directores territoriales, provinciales o Comisionados:"
  options:
  - id: a
    text:
      es: "de los Departamentos ministeriales, pero no los de sus Organismos autónomos ni los de las Entidades Gestoras de la Seguridad Social."
  - id: b
    correct: true
    text:
      es: "de los Departamentos ministeriales, de sus Organismos autónomos y de las Entidades Gestoras y Servicios Comunes de la Seguridad Social."
  - id: c
    text:
      es: "de los Organismos autónomos y de las Entidades Gestoras de la Seguridad Social, pero no los de los Departamentos ministeriales."
  - id: d
    text:
      es: "de los Departamentos ministeriales y de sus Organismos autónomos, solo cuando así lo determine la convocatoria del puesto."
  explanation:
    es: "El artículo 51.2 RD 364/1995 incluye a los «Delegados y Directores territoriales, provinciales o Comisionados de los Departamentos ministeriales, de sus Organismos autónomos y de las Entidades Gestoras y Servicios Comunes de la Seguridad Social». Abarca los tres ámbitos, así que las opciones que excluyen los organismos y entidades gestoras, o los Departamentos, recortan la lista. Para esos puestos la libre designación la fija el propio artículo, no la convocatoria."
  citation: "art. 51.2 RD 364/1995"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-54
- id: m04-l05-q033
  prompt:
    es: "Según el artículo 54.1 del Real Decreto 364/1995, de 10 de marzo, si el nombramiento por libre designación va a recaer en un funcionario de otro Departamento y este deja pasar quince días naturales sin emitir su informe, el informe:"
  options:
  - id: a
    correct: true
    text:
      es: "se considerará favorable a efectos del nombramiento."
  - id: b
    text:
      es: "se considerará desfavorable a todos los efectos."
  - id: c
    text:
      es: "se reclamará de nuevo con un plazo adicional."
  - id: d
    text:
      es: "dejará de ser necesario por haber caducado el trámite."
  explanation:
    es: "El artículo 54.1 RD 364/1995 exige informe favorable del Departamento donde está destinado el funcionario y dice: «De no emitirse en el plazo de quince días naturales se considerará favorable». El silencio no se considera desfavorable. Reclamar el informe de nuevo con más plazo sustituye el efecto que fija la propia frase por otro trámite. El trámite no caduca ni deja de ser necesario: el informe se considera emitido y favorable, y el nombramiento puede seguir."
  citation: "art. 54.1 RD 364/1995"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1995-8729-art-54
- id: m04-l05-q034
  prompt:
    es: "Según el artículo 54.1 del Real Decreto 364/1995, de 10 de marzo, si el informe del Departamento donde está destinado el candidato a un puesto de libre designación es desfavorable, ¿puede efectuarse el nombramiento?"
  options:
  - id: a
    text:
      es: "Sí, previa autorización del Consejo de Ministros, a propuesta del Departamento."
  - id: b
    text:
      es: "No, porque un informe desfavorable impide en todo caso efectuar el nombramiento."
  - id: c
    text:
      es: "Sí, previa conformidad del Subsecretario del Departamento de origen del candidato."
  - id: d
    correct: true
    text:
      es: "Sí, previa autorización del titular de la Secretaría de Estado de Función Pública."
  explanation:
    es: "El artículo 54.1 RD 364/1995 dice que, si el informe fuera desfavorable, «podrá, no obstante, efectuarse el nombramiento previa autorización del Secretario de Estado para la Administración Pública», cuyas funciones tiene hoy la Secretaría de Estado de Función Pública (artículo 22.3.c) RD 829/2023). El informe desfavorable no cierra el nombramiento. La autorización no corresponde al Consejo de Ministros ni al Subsecretario del Departamento de origen, que es justo quien ha informado en contra."
  citation: "art. 54.1 RD 364/1995"
  difficulty: 2
  tags:
  - "órgano"
  - "excepción"
# anchor: boe-a-1995-8729-art-54
- id: m04-l05-q035
  prompt:
    es: "Según el artículo 54.1 del Real Decreto 364/1995, de 10 de marzo, ¿en qué caso requiere el nombramiento por libre designación el informe favorable de un Departamento distinto del que convoca?"
  options:
  - id: a
    text:
      es: "Cuando el puesto convocado está adscrito a un organismo autónomo de ese Departamento."
  - id: b
    text:
      es: "Cuando el funcionario candidato no tiene todavía grado personal consolidado."
  - id: c
    correct: true
    text:
      es: "Cuando va a recaer en un funcionario destinado en ese otro Departamento."
  - id: d
    text:
      es: "Cuando el puesto convocado es de Subdirector general o de Delegado territorial."
  explanation:
    es: "El artículo 54.1 RD 364/1995 dice: «Si fuera a recaer en un funcionario destinado en otro Departamento, se requerirá informe favorable de éste». El informe lo da el Departamento donde está destinado el candidato. Que el puesto dependa de un organismo autónomo, que el candidato no tenga grado consolidado o que el puesto sea de Subdirector general no hace necesario ese informe."
  citation: "art. 54.1 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-67
- id: m04-l05-q036
  prompt:
    es: "Según el artículo 67 del Real Decreto 364/1995, de 10 de marzo, para obtener por libre designación un destino en una Comunidad Autónoma, el funcionario de la Administración General del Estado necesita:"
  options:
  - id: a
    text:
      es: "el informe favorable del Departamento donde presta servicios, que se considera desfavorable si no se emite en quince días naturales."
  - id: b
    correct: true
    text:
      es: "el informe favorable del Departamento donde presta servicios, que se considera favorable si no se emite en quince días naturales."
  - id: c
    text:
      es: "la autorización previa de la Secretaría de Estado de Función Pública, sin que el Departamento deba informar sobre el nombramiento."
  - id: d
    text:
      es: "el informe favorable de la Comunidad Autónoma convocante, en el plazo que fije la propia convocatoria del puesto."
  explanation:
    es: "El artículo 67 RD 364/1995 exige para la libre designación «el informe favorable del Departamento donde preste servicios» y añade: «De no emitirse dicho informe en el plazo de quince días naturales, éste se considerará favorable». El silencio cuenta como favorable, no como desfavorable. El artículo no pide una autorización de la Secretaría de Estado en lugar del informe. Tampoco da el informe a la Comunidad Autónoma convocante."
  citation: "art. 67 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-1995-8729-art-56
- id: m04-l05-q037
  prompt:
    es: "Según el artículo 56.1 del Real Decreto 364/1995, de 10 de marzo, en la libre designación los nombramientos deberán efectuarse:"
  options:
  - id: a
    correct: true
    text:
      es: "en el plazo máximo de un mes desde la finalización del de presentación de solicitudes, prorrogable un mes más."
  - id: b
    text:
      es: "en el plazo máximo de dos meses contados desde la finalización del de solicitudes, salvo que la convocatoria fije otro."
  - id: c
    text:
      es: "en el plazo máximo de un mes contado desde la publicación de la convocatoria, sin posibilidad de prórroga alguna."
  - id: d
    text:
      es: "en el plazo máximo de un mes contado desde la finalización del de solicitudes, prorrogable hasta dos meses más."
  explanation:
    es: "El artículo 56.1 RD 364/1995 dice que los nombramientos «deberán efectuarse en el plazo máximo de un mes contado desde la finalización del de presentación de solicitudes. Dicho plazo podrá prorrogarse hasta un mes más». Los dos meses salvo otro de la convocatoria son el plazo para resolver el concurso (artículo 47.1). El mes no se cuenta desde la publicación de la convocatoria, y la prórroga existe y es de un mes, no de dos."
  citation: "art. 56.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-58
- id: m04-l05-q038
  prompt:
    es: "Según el artículo 58.1 del Real Decreto 364/1995, de 10 de marzo, los funcionarios nombrados para puestos de trabajo de libre designación:"
  options:
  - id: a
    text:
      es: "solo podrán ser cesados por las causas de remoción del concurso."
  - id: b
    text:
      es: "solo podrán ser cesados tras un expediente disciplinario."
  - id: c
    text:
      es: "solo podrán ser cesados a petición propia o por supresión del puesto."
  - id: d
    correct: true
    text:
      es: "podrán ser cesados con carácter discrecional."
  explanation:
    es: "El artículo 58.1 RD 364/1995 dice que estos funcionarios «podrán ser cesados con carácter discrecional», y el artículo 80.4 TREBEP dice lo mismo. Las causas sobrevenidas de remoción son las del puesto obtenido por concurso (artículo 50.1). El cese no exige expediente disciplinario ni se limita a la petición propia o a la supresión del puesto."
  citation: "art. 58.1 RD 364/1995"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1995-8729-art-58
- id: m04-l05-q039
  prompt:
    es: "Según el artículo 58.2 del Real Decreto 364/1995, de 10 de marzo, el requisito de que el puesto atribuido al funcionario cesado en libre designación esté en el mismo municipio solo se exceptúa:"
  options:
  - id: a
    text:
      es: "cuando el funcionario lo pida por razones de convivencia familiar."
  - id: b
    text:
      es: "cuando en el municipio no haya un puesto vacante de su Cuerpo o Escala."
  - id: c
    correct: true
    text:
      es: "cuando se trate del cese de funcionarios destinados en el exterior."
  - id: d
    text:
      es: "cuando el cese se deba a la supresión del puesto en la relación."
  explanation:
    es: "El artículo 58.2 RD 364/1995 dice que «la necesidad de que el nuevo puesto que se atribuye al funcionario sea en el mismo municipio no será de aplicación cuando se trate del cese de funcionarios destinados en el exterior». Es la única excepción. El artículo no la extiende a la petición por convivencia familiar, a la falta de vacantes en el municipio ni a la supresión del puesto."
  citation: "art. 58.2 RD 364/1995"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1995-8729-art-58
- id: m04-l05-q040
  prompt:
    es: "Según el Real Decreto 364/1995, de 10 de marzo, ¿cuál de las siguientes afirmaciones sobre el funcionario cesado en un puesto de libre designación es correcta?"
  options:
  - id: a
    text:
      es: "Pasa a la situación de expectativa de destino hasta que obtenga otro puesto con carácter definitivo."
  - id: b
    correct: true
    text:
      es: "Queda adscrito provisionalmente a un puesto de su Cuerpo o Escala hasta que obtenga otro con carácter definitivo."
  - id: c
    text:
      es: "Conserva el nivel y las retribuciones del puesto de libre designación durante el plazo de un año."
  - id: d
    text:
      es: "Vuelve en todo caso al puesto que ocupaba con carácter definitivo antes de su nombramiento."
  explanation:
    es: "El artículo 58.2 RD 364/1995 dice que los cesados en un puesto de libre designación «serán adscritos provisionalmente a un puesto de trabajo correspondiente a su Cuerpo o Escala […] en tanto no obtengan otro con carácter definitivo». No pasan a expectativa de destino, que es una fase de la reasignación de efectivos. El artículo no les mantiene un año el nivel y las retribuciones del puesto. Tampoco los devuelve a su puesto anterior."
  citation: "art. 58.2 RD 364/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q041
  prompt:
    es: "De acuerdo con el artículo 48.1 del Real Decreto 364/1995, de 10 de marzo, el plazo para tomar posesión del destino obtenido por concurso será de:"
  options:
  - id: a
    correct: true
    text:
      es: "tres días hábiles sin cambio de residencia, o de un mes si comporta cambio de residencia o el reingreso al servicio activo."
  - id: b
    text:
      es: "tres días hábiles sin cambio de residencia, o de un mes solo si comporta cambio de residencia, nunca en el reingreso."
  - id: c
    text:
      es: "tres días naturales sin cambio de residencia, o de quince días si comporta cambio de residencia o el reingreso al servicio."
  - id: d
    text:
      es: "un mes en todo caso, ampliable hasta veinte días hábiles más si el destino comporta cambio de residencia."
  explanation:
    es: "El artículo 48.1 RD 364/1995 dice: «El plazo para tomar posesión será de tres días hábiles si no implica cambio de residencia del funcionario, o de un mes si comporta cambio de residencia o el reingreso al servicio activo». El mes se aplica también al reingreso, así que la opción que lo excluye altera el texto. Los días son hábiles, no naturales, y no hay un plazo de quince días. El plazo no es de un mes en todo caso: sin cambio de residencia es de tres días hábiles."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q042
  prompt:
    es: "Según el artículo 48.1 del Real Decreto 364/1995, de 10 de marzo, si la resolución del concurso comporta el reingreso al servicio activo, ¿desde cuándo se computa el plazo de toma de posesión?"
  options:
  - id: a
    text:
      es: "Desde el día siguiente al del cese del funcionario en su situación administrativa anterior."
  - id: b
    text:
      es: "Desde la notificación personal de la resolución del concurso al funcionario interesado."
  - id: c
    text:
      es: "Desde el día siguiente al de la presentación de la solicitud de reingreso al servicio activo."
  - id: d
    correct: true
    text:
      es: "Desde la publicación de la resolución del concurso en el «Boletín Oficial del Estado»."
  explanation:
    es: "El artículo 48.1 RD 364/1995 dice: «Si la resolución comporta el reingreso al servicio activo, el plazo de toma de posesión deberá computarse desde dicha publicación», la de la resolución en el BOE. El día siguiente al cese es la regla general, para quien ya ocupa un puesto. El artículo no cuenta el plazo desde una notificación personal ni desde la solicitud de reingreso."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "fecha"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q043
  prompt:
    es: "Según el artículo 48.1 del Real Decreto 364/1995, de 10 de marzo, el cese del funcionario en su puesto anterior deberá efectuarse:"
  options:
  - id: a
    text:
      es: "dentro del mes siguiente a la publicación de la resolución del concurso en el «Boletín Oficial del Estado»."
  - id: b
    text:
      es: "dentro de los tres días hábiles siguientes a la notificación personal de la resolución al funcionario."
  - id: c
    correct: true
    text:
      es: "dentro de los tres días hábiles siguientes a la publicación de la resolución del concurso en el BOE."
  - id: d
    text:
      es: "el mismo día de la publicación de la resolución del concurso en el «Boletín Oficial del Estado»."
  explanation:
    es: "El artículo 48.1 RD 364/1995 dice que el plazo posesorio empieza «a partir del día siguiente al del cese, que deberá efectuarse dentro de los tres días hábiles siguientes a la publicación de la resolución del concurso en el “Boletín Oficial del Estado”». El mes es un plazo de toma de posesión, no de cese. El plazo de cese corre desde la publicación, no desde una notificación personal, y no obliga a cesar el mismo día de la publicación."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-57
- id: m04-l05-q044
  prompt:
    es: "Una funcionaria obtiene por libre designación un puesto en la misma localidad en la que reside. ¿De qué plazo dispone para tomar posesión, según el Real Decreto 364/1995, de 10 de marzo?"
  options:
  - id: a
    text:
      es: "De un mes desde el día siguiente al cese, por tratarse de libre designación."
  - id: b
    correct: true
    text:
      es: "De tres días hábiles desde el día siguiente al cese, como en el concurso."
  - id: c
    text:
      es: "Del que fije en cada caso la resolución de nombramiento del puesto."
  - id: d
    text:
      es: "De tres días naturales desde la publicación del nombramiento en el BOE."
  explanation:
    es: "El artículo 57 RD 364/1995 dice que el régimen de toma de posesión en la libre designación «será el establecido en el artículo 48», el del concurso. Sin cambio de residencia son tres días hábiles desde el día siguiente al del cese (artículo 48.1). El mes es para el cambio de residencia o el reingreso, no para la libre designación como tal. El plazo no lo fija cada resolución, y los días son hábiles y se cuentan desde el cese."
  citation: "art. 57 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q045
  prompt:
    es: "Según el artículo 48.2 del Real Decreto 364/1995, de 10 de marzo, ¿quién puede diferir el cese del funcionario por necesidades del servicio hasta veinte días hábiles?"
  options:
  - id: a
    correct: true
    text:
      es: "El Subsecretario del Departamento donde presta servicios el funcionario."
  - id: b
    text:
      es: "El Subsecretario del Departamento donde el funcionario ha obtenido destino."
  - id: c
    text:
      es: "El titular de la unidad a la que ha sido destinado el funcionario."
  - id: d
    text:
      es: "La Comisión de Valoración que propuso la adjudicación del puesto."
  explanation:
    es: "El artículo 48.2 RD 364/1995 dice: «El Subsecretario del Departamento donde preste servicios el funcionario podrá diferir el cese por necesidades del servicio hasta veinte días hábiles». Es el Subsecretario del Departamento de origen. El del Departamento de destino concede otra cosa, la prórroga de incorporación. La unidad de destino solo recibe la comunicación del diferimiento, y la Comisión de Valoración no interviene."
  citation: "art. 48.2 RD 364/1995"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q046
  prompt:
    es: "Según el artículo 48.2 del Real Decreto 364/1995, de 10 de marzo, cuando el Subsecretario difiere el cese del funcionario por necesidades del servicio, ¿a quién debe comunicarse?"
  options:
  - id: a
    text:
      es: "A la Junta de Personal del centro de origen del funcionario."
  - id: b
    text:
      es: "A la Comisión de Valoración que resolvió el concurso."
  - id: c
    text:
      es: "Al titular de la Secretaría de Estado de Función Pública."
  - id: d
    correct: true
    text:
      es: "A la unidad a la que haya sido destinado el funcionario."
  explanation:
    es: "El artículo 48.2 RD 364/1995 permite al Subsecretario diferir el cese hasta veinte días hábiles, «comunicándose a la unidad a que haya sido destinado el funcionario». La Junta de Personal y la Comisión de Valoración no son destinatarias de esa comunicación: el apartado nombra una sola, la unidad de destino. La Secretaría de Estado para la Administración Pública tampoco: el segundo párrafo le da otra función, aplazar excepcionalmente el cese hasta tres meses a propuesta del Departamento."
  citation: "art. 48.2 RD 364/1995"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q047
  prompt:
    es: "Según el artículo 48.2 del Real Decreto 364/1995, de 10 de marzo, excepcionalmente, a propuesta del Departamento y por exigencias del normal funcionamiento de los servicios, la fecha de cese podrá aplazarse hasta un máximo de:"
  options:
  - id: a
    text:
      es: "tres meses, sin computar en ellos la prórroga de veinte días hábiles."
  - id: b
    text:
      es: "dos meses, computada en ellos la prórroga de veinte días hábiles."
  - id: c
    correct: true
    text:
      es: "tres meses, computada en ellos la prórroga de veinte días hábiles."
  - id: d
    text:
      es: "cuatro meses, computada en ellos la prórroga de veinte días hábiles."
  explanation:
    es: "El artículo 48.2 RD 364/1995 permite aplazar la fecha de cese «hasta un máximo de tres meses, computada la prórroga prevista en el párrafo anterior», la de veinte días hábiles. Los veinte días están dentro de los tres meses, no se suman a ellos. El máximo no es de dos ni de cuatro meses."
  citation: "art. 48.2 RD 364/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q048
  prompt:
    es: "Según el artículo 48.2 del Real Decreto 364/1995, de 10 de marzo, el aplazamiento excepcional de la fecha de cese hasta un máximo de tres meses se acuerda:"
  options:
  - id: a
    text:
      es: "a petición del funcionario interesado, por razones personales debidamente justificadas."
  - id: b
    correct: true
    text:
      es: "a propuesta del Departamento, por exigencias del normal funcionamiento de los servicios."
  - id: c
    text:
      es: "de oficio por el órgano convocante del concurso, cuando no haya otros candidatos."
  - id: d
    text:
      es: "a propuesta de la Comisión de Valoración, por la urgencia de cubrir el puesto de origen."
  explanation:
    es: "El artículo 48.2 dice que el aplazamiento excepcional hasta tres meses se acuerda «a propuesta del Departamento, por exigencias del normal funcionamiento de los servicios». La petición del interesado por razones justificadas es el requisito de la prórroga de incorporación del tercer párrafo, que es otra figura, de hasta veinte días hábiles. Que el órgano convocante lo decida de oficio por falta de otros candidatos, o que lo proponga la Comisión de Valoración, sustituye al Departamento, que es quien propone según el apartado, y a las exigencias del normal funcionamiento de los servicios, que es el motivo que fija."
  citation: "art. 48.2 RD 364/1995"
  difficulty: 2
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q049
  prompt:
    es: "Según el artículo 48.2 del Real Decreto 364/1995, de 10 de marzo, el Subsecretario del Departamento de nuevo destino podrá conceder una prórroga de incorporación de hasta veinte días hábiles:"
  options:
  - id: a
    correct: true
    text:
      es: "si el destino implica cambio de residencia y el interesado lo solicita por razones justificadas."
  - id: b
    text:
      es: "si así lo exigen las necesidades del servicio en el Departamento donde el funcionario prestaba servicios."
  - id: c
    text:
      es: "si el funcionario está disfrutando de permisos o licencias en la fecha en que debe cesar."
  - id: d
    text:
      es: "si la resolución del concurso comporta el reingreso del funcionario al servicio activo."
  explanation:
    es: "El artículo 48.2 RD 364/1995 permite la prórroga de incorporación «si el destino implica cambio de residencia y así lo solicita el interesado por razones justificadas». Las necesidades del servicio en el Departamento de origen justifican diferir el cese, que es otra figura. Los permisos y licencias retrasan el inicio del plazo posesorio (artículo 48.3). El reingreso cambia el día desde el que se cuenta el plazo, no da una prórroga."
  citation: "art. 48.2 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q050
  prompt:
    es: "Según el Real Decreto 364/1995, de 10 de marzo, ¿cuál de las siguientes afirmaciones sobre el diferimiento del cese y la prórroga de incorporación es correcta?"
  options:
  - id: a
    text:
      es: "El cese lo difiere el Subsecretario del Departamento de destino; la incorporación la prorroga el del Departamento de origen."
  - id: b
    text:
      es: "El Subsecretario del Departamento de origen difiere el cese y prorroga la incorporación, hasta veinte días hábiles cada uno."
  - id: c
    text:
      es: "El Subsecretario del Departamento de destino difiere el cese y prorroga la incorporación, hasta veinte días hábiles cada uno."
  - id: d
    correct: true
    text:
      es: "El cese lo difiere el Subsecretario del Departamento de origen; la incorporación la prorroga el del Departamento de destino."
  explanation:
    es: "El artículo 48.2 RD 364/1995 da el diferimiento del cese al «Subsecretario del Departamento donde preste servicios el funcionario» y la prórroga de incorporación al «Subsecretario del Departamento donde haya obtenido nuevo destino». Cada órgano decide sobre su lado: el de origen sobre la salida y el de destino sobre la llegada. Las otras opciones cruzan los órganos o dan las dos decisiones a uno solo."
  citation: "art. 48.2 RD 364/1995"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1995-8729-art-48
- id: m04-l05-q051
  prompt:
    es: "Según el artículo 48.3 del Real Decreto 364/1995, de 10 de marzo, si el funcionario disfruta de permisos o licencias concedidos, el cómputo de los plazos posesorios:"
  options:
  - id: a
    text:
      es: "se iniciará el día siguiente al del cese, y los permisos o licencias quedarán interrumpidos de oficio en esa fecha."
  - id: b
    text:
      es: "se iniciará cuando estos finalicen, salvo que el Subsecretario del Departamento de destino disponga otra cosa."
  - id: c
    correct: true
    text:
      es: "se iniciará cuando estos finalicen, salvo que el órgano convocante acuerde suspender su disfrute por causas justificadas."
  - id: d
    text:
      es: "se iniciará cuando estos finalicen, pero solo si se concedieron antes de publicarse la resolución del concurso."
  explanation:
    es: "El artículo 48.3 RD 364/1995 dice: «El cómputo de los plazos posesorios se iniciará cuando finalicen los permisos o licencias que hayan sido concedidos a los interesados, salvo que por causas justificadas el órgano convocante acuerde suspender el disfrute de los mismos». Los permisos no se interrumpen de oficio con el cese. Quien puede suspender su disfrute es el órgano convocante, no el Subsecretario de destino. El artículo no distingue según la fecha en que se concedieron."
  citation: "art. 48.3 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
