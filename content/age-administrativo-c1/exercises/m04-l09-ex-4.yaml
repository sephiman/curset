# anchor: boe-a-2015-11724-art-208
- id: m04-l09-q072
  prompt:
    es: "Conforme al artículo 208.1 del texto refundido de la Ley General de la Seguridad Social, la jubilación anticipada por voluntad del interesado exige una edad inferior, como máximo, a la del artículo 205.1.a) en:"
  options:
  - id: a
    correct: true
    text:
      es: "dos años."
  - id: b
    text:
      es: "un año."
  - id: c
    text:
      es: "tres años."
  - id: d
    text:
      es: "cuatro años."
  explanation:
    es: "El artículo 208.1.a) exige «una edad que sea inferior en dos años, como máximo» a la que resulte del artículo 205.1.a). Los cuatro años son el margen de la jubilación anticipada por causa no imputable al trabajador, del artículo 207.1. Uno y tres años no figuran en el artículo."
  citation: "art. 208.1 LGSS"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2015-11724-art-208
- id: m04-l09-q073
  prompt:
    es: "Según el artículo 208.1 del texto refundido de la Ley General de la Seguridad Social, el acceso a la jubilación anticipada por voluntad del interesado exige acreditar un período mínimo de cotización efectiva de:"
  options:
  - id: a
    text:
      es: "treinta y tres años, sin contar la parte proporcional por pagas extraordinarias."
  - id: b
    text:
      es: "treinta y cinco años, contando la parte proporcional por las pagas extraordinarias."
  - id: c
    correct: true
    text:
      es: "treinta y cinco años, sin contar la parte proporcional por pagas extraordinarias."
  - id: d
    text:
      es: "treinta años, sin contar la parte proporcional por pagas extraordinarias."
  explanation:
    es: "El artículo 208.1.b) pide «un período mínimo de cotización efectiva de treinta y cinco años, sin que, a tales efectos, se tenga en cuenta la parte proporcional por pagas extraordinarias». Los treinta y tres años son la cifra de la modalidad por causa no imputable al trabajador, del artículo 207.1. Contar la parte proporcional contradice el artículo, y treinta años no figura en él."
  citation: "art. 208.1 LGSS"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2015-11724-art-208
- id: m04-l09-q074
  prompt:
    es: "De acuerdo con el artículo 208.1 del texto refundido de la Ley General de la Seguridad Social, la pensión de la jubilación anticipada por voluntad del interesado debe superar la mínima que correspondería por su situación familiar al cumplir:"
  options:
  - id: a
    text:
      es: "sesenta años."
  - id: b
    text:
      es: "sesenta y tres años."
  - id: c
    text:
      es: "sesenta y siete años."
  - id: d
    correct: true
    text:
      es: "sesenta y cinco años."
  explanation:
    es: "El artículo 208.1.c) exige que el importe de la pensión resulte superior a la pensión mínima que correspondería al interesado «por su situación familiar al cumplimiento de los sesenta y cinco años de edad». Sesenta años, sesenta y tres y sesenta y siete no son la edad de referencia del artículo, aunque sesenta y siete sea la edad de jubilación ordinaria."
  citation: "art. 208.1 LGSS"
  difficulty: 3
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2015-11724-dt-vigesimosexta
- id: m04-l09-q075
  prompt:
    es: "Según la disposición transitoria vigesimosexta del texto refundido de la Ley General de la Seguridad Social, hasta que se desarrolle reglamentariamente el artículo 194, el grado de incapacidad permanente total se denomina:"
  options:
  - id: a
    text:
      es: "incapacidad permanente total para todo trabajo."
  - id: b
    correct: true
    text:
      es: "incapacidad permanente total para la profesión habitual."
  - id: c
    text:
      es: "incapacidad permanente total para cualquier profesión u oficio."
  - id: d
    text:
      es: "incapacidad permanente total revisable por mejoría."
  explanation:
    es: "La disposición transitoria vigesimosexta da hasta entonces al artículo 194 una redacción que llama al grado b) «incapacidad permanente total para la profesión habitual». «Para todo trabajo» es el nombre del grado absoluto. «Para cualquier profesión u oficio» describe ese mismo grado absoluto, no el total. «Revisable por mejoría» no es una denominación de la disposición."
  citation: "disposición transitoria vigesimosexta LGSS"
  difficulty: 3
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2015-11724-dt-vigesimosexta
- id: m04-l09-q076
  prompt:
    es: "Conforme a la disposición transitoria vigesimosexta del texto refundido de la Ley General de la Seguridad Social, lo dispuesto en el artículo 194 solo se aplica a partir de:"
  options:
  - id: a
    text:
      es: "el 1 de enero de 2027, fecha desde la que rigen las nuevas edades de jubilación."
  - id: b
    text:
      es: "la fecha en que se apruebe el siguiente convenio único de la Administración General del Estado."
  - id: c
    correct: true
    text:
      es: "la fecha en que entren en vigor las disposiciones reglamentarias a que se refiere su apartado 3."
  - id: d
    text:
      es: "el momento en que el Instituto Nacional de la Seguridad Social unifique sus criterios de valoración."
  explanation:
    es: "La disposición dice que el artículo 194 «únicamente será de aplicación a partir de la fecha en que entren en vigor las disposiciones reglamentarias a que se refiere el apartado 3». El 1 de enero de 2027 es la fecha de las nuevas edades de jubilación, de la disposición transitoria séptima, y no tiene que ver con este artículo. Un convenio único o unos criterios del Instituto Nacional de la Seguridad Social no son condición que la disposición fije."
  citation: "disposición transitoria vigesimosexta LGSS"
  difficulty: 3
  tags:
  - "requisito"
  - "fecha"
# anchor: boe-a-2015-11724-art-173
- id: m04-l09-q077
  prompt:
    es: "De acuerdo con el artículo 173.1 del texto refundido de la Ley General de la Seguridad Social, en las situaciones especiales de incapacidad temporal del artículo 169.1.a), el subsidio se abona:"
  options:
  - id: a
    text:
      es: "Desde el mismo día de la baja, a cargo de la entidad gestora o colaboradora, sin salario alguno a cargo del empresario"
  - id: b
    text:
      es: "Desde el día siguiente al de la baja, y hasta el decimoquinto día de baja lo paga íntegramente el empresario"
  - id: c
    correct: true
    text:
      es: "Desde el día siguiente al de la baja, a cargo de la entidad gestora o colaboradora, y el empresario paga el salario íntegro del día de la baja"
  - id: d
    text:
      es: "Desde el cuarto día de baja, y del día cuarto al decimoquinto, ambos inclusive, lo paga el empresario"
  explanation:
    es: "En la redacción vigente desde el 1 de diciembre de 2026, el artículo 173.1 dispone que en las situaciones especiales del artículo 169.1.a) el subsidio se abona «a cargo de la entidad gestora o colaboradora que cubra la incapacidad temporal por contingencias comunes, desde el día siguiente al de la baja en el trabajo», y que el empresario paga «el salario íntegro correspondiente al día de la baja». El pago desde el mismo día de la baja, sin salario del empresario, no es la regla de esa redacción. El cuarto día de baja y el pago del empresario del cuarto al decimoquinto son la regla de la enfermedad común y del accidente no laboral. Que el empresario pague íntegramente hasta el decimoquinto día contradice el texto, que pone el subsidio a cargo de la entidad gestora o colaboradora."
  citation: "art. 173.1 LGSS"
  difficulty: 3
  tags:
  - "efecto"
  - "órgano"
  - "cambio-pendiente"
# anchor: boe-a-2015-11724-art-169
- id: m04-l09-q078
  prompt:
    es: "De acuerdo con el artículo 169.1.a) del texto refundido de la Ley General de la Seguridad Social, la situación especial de incapacidad temporal por trastorno menopáusico exige que la mujer:"
  options:
  - id: a
    text:
      es: "Reciba asistencia sanitaria por el Servicio Público de Salud y esté impedida para el trabajo por cualquier síntoma menopáusico, aunque no esté codificado a tal efecto"
  - id: b
    correct: true
    text:
      es: "Reciba asistencia sanitaria por el Servicio Público de Salud y esté impedida para el trabajo por una patología limitante de trastorno menopáusico secundario codificado a tal efecto"
  - id: c
    text:
      es: "Reciba asistencia sanitaria por el Servicio Público de Salud por un trastorno menopáusico secundario codificado a tal efecto, aunque pueda seguir trabajando"
  - id: d
    text:
      es: "Haya cotizado ciento ochenta días dentro de los cinco años anteriores y esté impedida para el trabajo por un trastorno menopáusico secundario codificado a tal efecto"
  explanation:
    es: "En la redacción vigente desde el 1 de diciembre de 2026, el artículo 169.1.a) incluye entre las situaciones especiales la de la mujer con «patología limitante por trastorno menopáusico secundario codificado a tal efecto», mientras reciba asistencia sanitaria por el Servicio Público de Salud y esté impedida para el trabajo como consecuencia de esa patología. La opción del síntoma sin codificar suprime la codificación que exige el texto. La que permite seguir trabajando suprime el impedimento para el trabajo. La de los ciento ochenta días de cotización es el requisito de la enfermedad común: el artículo 172 no exige períodos mínimos en esta situación especial."
  citation: "art. 169.1.a) LGSS"
  difficulty: 3
  tags:
  - "requisito"
  - "concepto"
  - "cambio-pendiente"
# anchor: boe-a-2015-11724-art-169
- id: m04-l09-q080
  prompt:
    es: "Según el artículo 169.1.a) del texto refundido de la Ley General de la Seguridad Social, en los documentos exigidos para la situación especial de la mujer con lesiones por violencia de género, ¿qué debe figurar de forma expresa?"
  options:
  - id: a
    text:
      es: "La relación de causalidad entre la lesión que dio lugar a la situación especial y las funciones del puesto de trabajo que desempeña la mujer en la empresa donde presta servicios"
  - id: b
    text:
      es: "La relación de causalidad entre la asistencia sanitaria recibida y la fecha prevista del alta médica por curación o mejoría de la mujer"
  - id: c
    correct: true
    text:
      es: "La relación de causalidad entre la lesión que dio lugar a la situación especial y el acto de violencia que determina la condena, protección o inicio de la investigación"
  - id: d
    text:
      es: "La relación de causalidad entre la lesión y la codificación de la situación especial que realiza el facultativo médico del Servicio Público de Salud"
  explanation:
    es: "En la redacción vigente desde el 1 de diciembre de 2026, el artículo 169.1.a) dispone que en esos documentos debe figurar de forma expresa «la relación de causalidad entre la lesión que dio lugar a la situación especial de incapacidad temporal y el acto de violencia que determina la condena, protección o inicio de la investigación». La causalidad no se establece con el puesto de trabajo, con la asistencia sanitaria ni con la codificación: la codificación la hace el facultativo del Servicio Público de Salud para identificar la situación, pero no es lo que los documentos han de recoger."
  citation: "art. 169.1.a) LGSS"
  difficulty: 3
  tags:
  - "requisito"
  - "concepto"
  - "cambio-pendiente"
# anchor: boe-a-2015-11724-art-172
- id: m04-l09-q082
  prompt:
    es: "Según el artículo 172 del texto refundido de la Ley General de la Seguridad Social, ¿qué períodos de cotización se exigen en la situación especial de gestación de la mujer trabajadora desde el día primero de la semana trigésima novena?"
  options:
  - id: a
    text:
      es: "Ciento ochenta días dentro de los cinco años inmediatamente anteriores al hecho causante, como se exige en la enfermedad común"
  - id: b
    text:
      es: "Ningún período previo de cotización, como ocurre en el accidente, sea o no de trabajo, y en la enfermedad profesional"
  - id: c
    text:
      es: "Los períodos mínimos del artículo 178.1 según la edad cumplida en la fecha prevista del parto, con referencia a la semana trigésima novena"
  - id: d
    correct: true
    text:
      es: "Los períodos mínimos del artículo 178.1 según la edad cumplida al inicio del descanso, con referencia a la fecha de la baja médica"
  explanation:
    es: "En la redacción vigente desde el 1 de diciembre de 2026, el artículo 172.a) exige en la situación especial 2.ª que la persona interesada acredite los períodos mínimos del artículo 178.1 «según la edad que tenga cumplida en el momento de inicio del descanso, tomando como referencia la fecha de la baja médica». Los ciento ochenta días en cinco años son el requisito de la enfermedad común y la ausencia de período previo es la regla del accidente y de la enfermedad profesional; ninguna es la de esta situación. La edad no se mide en la fecha prevista del parto, sino al inicio del descanso, con la baja médica como referencia."
  citation: "art. 172 LGSS"
  difficulty: 3
  tags:
  - "requisito"
  - "cantidad"
  - "cambio-pendiente"
# anchor: boe-a-2015-11724-art-169
- id: m04-l09-q083
  prompt:
    es: "¿Respecto de qué agresor reconoce el artículo 169.1.a) del texto refundido de la Ley General de la Seguridad Social la situación especial de la mujer con lesiones causadas por un hombre?"
  options:
  - id: a
    text:
      es: "Solo quien sea su cónyuge en el momento de las lesiones, siempre que exista convivencia acreditada entre ambos"
  - id: b
    text:
      es: "Quien sea o haya sido su cónyuge o pareja de hecho inscrita, siempre que haya existido convivencia entre ambos"
  - id: c
    correct: true
    text:
      es: "Quien sea o haya sido su cónyuge o esté o haya estado ligado a ella por relación similar de afectividad, aun sin convivencia"
  - id: d
    text:
      es: "Cualquier familiar hasta el segundo grado de consanguinidad o afinidad, convivan o no con ella en el domicilio"
  explanation:
    es: "En la redacción vigente desde el 1 de diciembre de 2026, el artículo 169.1.a) protege a la mujer con lesiones causadas por «el hombre que sea o haya sido su cónyuge o esté o haya estado ligado a ella por relación similar de afectividad, aun sin convivencia». No basta el cónyuge actual y la convivencia no es requisito. Los familiares hasta el segundo grado no figuran en el precepto."
  citation: "art. 169.1.a) LGSS"
  difficulty: 3
  tags:
  - "concepto"
  - "requisito"
  - "cambio-pendiente"
# anchor: boe-a-2015-11724-art-169
- id: m04-l09-q084
  prompt:
    es: "Una trabajadora sufre una interrupción del embarazo debida a un accidente de trabajo. ¿Qué consideración le da el artículo 169.1.a) del texto refundido de la Ley General de la Seguridad Social?"
  options:
  - id: a
    text:
      es: "Situación especial de incapacidad temporal por contingencias comunes"
  - id: b
    text:
      es: "Situación de riesgo durante el embarazo"
  - id: c
    text:
      es: "Situación de incapacidad temporal por accidente no laboral"
  - id: d
    correct: true
    text:
      es: "Situación de incapacidad temporal por contingencias profesionales"
  explanation:
    es: "En la redacción vigente desde el 1 de diciembre de 2026, el artículo 169.1.a) tiene la interrupción del embarazo como situación especial por contingencias comunes, «sin perjuicio de aquellos supuestos en que la interrupción del embarazo sea debida a accidente de trabajo o enfermedad profesional, en cuyo caso tendrá la consideración de situación de incapacidad temporal por contingencias profesionales». El riesgo durante el embarazo es otra prestación, con otros requisitos. El accidente no laboral es el que no se produce con ocasión del trabajo, y aquí el accidente sí es de trabajo."
  citation: "art. 169.1.a) LGSS"
  difficulty: 3
  tags:
  - "concepto"
  - "excepción"
  - "cambio-pendiente"
