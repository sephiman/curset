# anchor: boe-a-2014-12328-art-27
- id: m03-l17-q0064
  prompt:
    es: "De acuerdo con los apartados 1 y 3 del artículo 27 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre el período impositivo:"
  options:
  - id: a
    correct: true
    text:
      es: "Coincide con el ejercicio económico de la entidad y no excede de 12 meses."
  - id: b
    text:
      es: "Coincide con el año natural, aunque el ejercicio económico de la entidad sea distinto."
  - id: c
    text:
      es: "Coincide con el ejercicio económico de la entidad y no excede de 24 meses."
  - id: d
    text:
      es: "Coincide con el ejercicio económico de la entidad, sin limitación de duración mientras no se modifique su estatuto."
  explanation:
    es: "El período impositivo coincide con el ejercicio económico y no excede de 12 meses. Referirlo al año natural olvida que cada entidad puede tener un ejercicio distinto. Los 24 meses duplican el máximo legal. Y la ley sí limita la duración, con independencia de que se modifique el estatuto: el período concluye en los supuestos del apartado 2."
  citation: "art. 27 LIS"
  difficulty: 2
  tags:
  - "período impositivo"
# anchor: boe-a-2014-12328-art-28
- id: m03-l17-q0066
  prompt:
    es: "De acuerdo con el artículo 28 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, el impuesto se devenga:"
  options:
  - id: a
    correct: true
    text:
      es: "el último día del período impositivo."
  - id: b
    text:
      es: "el día en que finalice el plazo para presentar la declaración."
  - id: c
    text:
      es: "el primer día del período impositivo siguiente."
  - id: d
    text:
      es: "el día en que se ingrese el último pago fraccionado."
  explanation:
    es: "El devengo se produce el último día del período impositivo. El fin del plazo de declaración es posterior y fija cuándo debe presentarse la declaración. El primer día del período siguiente tampoco es el momento del devengo. Y el pago fraccionado es un ingreso a cuenta durante el período, no el hecho que devenga el impuesto."
  citation: "art. 28 LIS"
  difficulty: 1
  tags:
  - "devengo"
# anchor: boe-a-2014-12328-art-29
- id: m03-l17-q0067
  prompt:
    es: "Según el artículo 29.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, el tipo general de gravamen para los contribuyentes del impuesto es:"
  options:
  - id: a
    text:
      es: "el 30 por ciento, excepto para las entidades cuyo importe neto de la cifra de negocios del período impositivo inmediato anterior sea inferior a 1 millón de euros."
  - id: b
    text:
      es: "el 25 por ciento, excepto para las entidades cuyo importe neto de la cifra de negocios del período impositivo inmediato anterior sea inferior a 10 millones de euros."
  - id: c
    text:
      es: "el 20 por ciento, excepto para las entidades cuyo importe neto de la cifra de negocios del período impositivo inmediato anterior sea inferior a 1 millón de euros."
  - id: d
    correct: true
    text:
      es: "el 25 por ciento, excepto para las entidades cuyo importe neto de la cifra de negocios del período impositivo inmediato anterior sea inferior a 1 millón de euros."
  explanation:
    es: "El tipo general es el 25 por ciento, con una escala distinta para las entidades con cifra de negocios del período inmediato anterior inferior a 1 millón de euros. El 30 por ciento es el tipo de entidades de crédito y de hidrocarburos. El 20 por ciento no es el tipo general, sino uno que el propio artículo reserva a otros supuestos. Y el umbral de 10 millones no es el del artículo: es de 1 millón de euros."
  citation: "art. 29.1 LIS"
  difficulty: 1
  tags:
  - "tipo de gravamen"
# anchor: boe-a-2014-12328-art-29
- id: m03-l17-q0068
  prompt:
    es: "Según el artículo 29.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, ¿a qué tipo tributan las entidades de nueva creación que realicen actividades económicas?"
  options:
  - id: a
    text:
      es: "Al 15 por ciento, durante los tres primeros períodos impositivos desde su constitución, con independencia de su base imponible."
  - id: b
    correct: true
    text:
      es: "Al 15 por ciento, en el primer período impositivo en que la base imponible resulte positiva y en el siguiente, excepto si deben tributar a un tipo inferior."
  - id: c
    text:
      es: "Al 10 por ciento, en el primer período impositivo en que la base imponible resulte positiva y en el siguiente."
  - id: d
    text:
      es: "Al 15 por ciento, solo en el primer período impositivo en que la base imponible resulte positiva."
  explanation:
    es: "Las entidades de nueva creación con actividad económica tributan al 15 por ciento en el primer período con base imponible positiva y en el siguiente, salvo que les corresponda un tipo inferior. Contar tres períodos desde la constitución ignora que el tipo se vincula a la primera base positiva. El 10 por ciento es el tipo de las entidades de la ley de entidades sin fines lucrativos. Y limitarlo a un solo período recorta la regla: son dos."
  citation: "art. 29.1 LIS"
  difficulty: 3
  tags:
  - "tipo de gravamen"
  - "nueva creación"
# anchor: boe-a-2014-12328-art-29
- id: m03-l17-q0070
  prompt:
    es: "De acuerdo con el artículo 29.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, las sociedades cooperativas fiscalmente protegidas tributan a los tipos resultantes de minorar los del apartado 1:"
  options:
  - id: a
    text:
      es: "en cinco puntos porcentuales, siempre que el tipo resultante no supere el 20 por ciento, excepto por lo que se refiere a los resultados extracooperativos."
  - id: b
    correct: true
    text:
      es: "en tres puntos porcentuales, siempre que el tipo resultante no supere el 20 por ciento, excepto por lo que se refiere a los resultados extracooperativos."
  - id: c
    text:
      es: "en tres puntos porcentuales, siempre que el tipo resultante no supere el 15 por ciento, excepto por lo que se refiere a los resultados extracooperativos."
  - id: d
    text:
      es: "en tres puntos porcentuales, siempre que el tipo resultante no supere el 20 por ciento, incluidos los resultados extracooperativos."
  explanation:
    es: "Las cooperativas fiscalmente protegidas minoran en tres puntos los tipos del apartado 1, con tope del 20 por ciento, salvo en los resultados extracooperativos, que tributan a los tipos del apartado 1. Cinco puntos aumenta la minoración. Un tope del 15 por ciento no es el de la ley. E incluir los resultados extracooperativos en la minoración elimina la excepción que el artículo mantiene."
  citation: "art. 29.2 LIS"
  difficulty: 1
  tags:
  - "tipo de gravamen"
  - "cooperativas"
# anchor: boe-a-2014-12328-art-29
- id: m03-l17-q0071
  prompt:
    es: "¿Cuál de las siguientes entidades tributa al tipo del 1 por ciento según el artículo 29.4 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades?"
  options:
  - id: a
    correct: true
    text:
      es: "Las sociedades de inversión de capital variable que cumplan el número mínimo de accionistas que exige su ley."
  - id: b
    text:
      es: "Los fondos de pensiones regulados en el texto refundido de la ley de regulación de los planes y fondos de pensiones."
  - id: c
    text:
      es: "Las entidades de crédito, por todos sus resultados."
  - id: d
    text:
      es: "Las entidades acogidas al régimen fiscal de la ley de entidades sin fines lucrativos."
  explanation:
    es: "Las sociedades de inversión de capital variable que cumplan el número mínimo de accionistas tributan al 1 por ciento. Los fondos de pensiones tributan al tipo del cero por ciento, según el apartado 5. Las entidades de crédito tributan al 30 por ciento, según el apartado 6. Y las entidades de la ley de entidades sin fines lucrativos tributan al 10 por ciento, según el apartado 3."
  citation: "art. 29.4 LIS"
  difficulty: 2
  tags:
  - "tipo de gravamen"
# anchor: boe-a-2014-12328-art-29
- id: m03-l17-q0073
  prompt:
    es: "¿A qué tipo tributan los resultados extracooperativos de las cooperativas de crédito y cajas rurales, de acuerdo con el artículo 29.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades?"
  options:
  - id: a
    correct: true
    text:
      es: "Al 30 por ciento, mientras que el resto de sus resultados tributa a los tipos del apartado 1."
  - id: b
    text:
      es: "Al 25 por ciento, igual que el resto de sus resultados, que tributan a los tipos del apartado 1."
  - id: c
    text:
      es: "Al 20 por ciento, mientras que el resto de sus resultados tributa a los tipos del apartado 1."
  - id: d
    text:
      es: "Al tipo que resulte de minorar en tres puntos porcentuales los del apartado 1, igual que el resto de sus resultados."
  explanation:
    es: "Las cooperativas de crédito y cajas rurales tributan a los tipos del apartado 1, salvo por los resultados extracooperativos, que tributan al 30 por ciento. Decir que van al 25 por ciento los equipara a los demás resultados. El 20 por ciento no es el tipo que fija el artículo. Y la minoración de tres puntos es el beneficio de las cooperativas fiscalmente protegidas, no el de las cooperativas de crédito."
  citation: "art. 29.2 LIS"
  difficulty: 2
  tags:
  - "tipo de gravamen"
  - "cooperativas"
# anchor: boe-a-2014-12328-art-30
- id: m03-l17-q0075
  prompt:
    es: "De acuerdo con el artículo 30.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, se entiende por cuota íntegra:"
  options:
  - id: a
    text:
      es: "la cantidad resultante de aplicar a la cuota íntegra las bonificaciones y deducciones que procedan."
  - id: b
    correct: true
    text:
      es: "la cantidad resultante de aplicar a la base imponible el tipo de gravamen."
  - id: c
    text:
      es: "la cantidad resultante de restar de la cuota líquida los pagos fraccionados ingresados."
  - id: d
    text:
      es: "la cantidad resultante de aplicar el tipo de gravamen a la base imponible tras la compensación de las deducciones."
  explanation:
    es: "La cuota íntegra es el resultado de aplicar el tipo de gravamen a la base imponible. Aplicar a la cuota las bonificaciones y deducciones da la cuota líquida. Restar los pagos fraccionados de la cuota líquida da el resultado de la autoliquidación, no la cuota íntegra. Y las deducciones se aplican sobre la cuota, nunca sobre la base antes de aplicar el tipo."
  citation: "art. 30.1 LIS"
  difficulty: 1
  tags:
  - "cuota íntegra"
# anchor: boe-a-2014-12328-art-31
- id: m03-l17-q0077
  prompt:
    es: "De acuerdo con el artículo 31.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, cuando en la base imponible se integren rentas positivas obtenidas y gravadas en el extranjero, se deduce de la cuota íntegra la menor de las dos cantidades siguientes:"
  options:
  - id: a
    text:
      es: "el importe efectivo de lo satisfecho en el extranjero por un gravamen de naturaleza idéntica o análoga, y la cuota líquida que en España correspondería pagar por todas las rentas del contribuyente."
  - id: b
    correct: true
    text:
      es: "el importe efectivo de lo satisfecho en el extranjero por un gravamen de naturaleza idéntica o análoga, y la cuota íntegra que en España correspondería pagar por esas rentas."
  - id: c
    text:
      es: "el importe medio de lo satisfecho en el extranjero en los últimos cuatro años, y la cuota íntegra que en España correspondería pagar por esas rentas."
  - id: d
    text:
      es: "el importe de lo satisfecho en el extranjero por cualquier tributo, y la cuota íntegra que en España correspondería pagar por esas rentas."
  explanation:
    es: "La deducción es la menor de dos cantidades: lo efectivamente satisfecho en el extranjero por un gravamen idéntico o análogo, y la cuota íntegra que España cobraría por esas mismas rentas. El segundo límite se refiere a esas rentas, no a todas las del contribuyente, y es la cuota íntegra, no la líquida. Un promedio de cuatro años no figura en el artículo. Y no sirve cualquier tributo extranjero: ha de ser un gravamen de naturaleza idéntica o análoga al impuesto."
  citation: "art. 31.1 LIS"
  difficulty: 1
  tags:
  - "doble imposición"
  - "deducción"
# anchor: boe-a-2014-12328-art-31
- id: m03-l17-q0079
  prompt:
    es: "Conforme al artículo 31.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, señale la respuesta CORRECTA sobre la deducción por el impuesto satisfecho en el extranjero:"
  options:
  - id: a
    text:
      es: "Se deducen también los impuestos no pagados por una bonificación, si esta se concedió en un convenio."
  - id: b
    text:
      es: "Siendo de aplicación un convenio para evitar la doble imposición, la deducción puede exceder del impuesto que corresponda según aquel."
  - id: c
    correct: true
    text:
      es: "No se deducen los impuestos no pagados en virtud de exención, bonificación o cualquier otro beneficio fiscal."
  - id: d
    text:
      es: "Solo se deduce el impuesto extranjero de naturaleza idéntica al Impuesto sobre Sociedades, no el de naturaleza análoga."
  explanation:
    es: "El artículo 31.1.a) excluye de la deducción los impuestos no pagados por exención, bonificación o cualquier otro beneficio fiscal. Incluirlos por haberse concedido en un convenio no figura en el artículo. Con convenio, además, la deducción no puede exceder del impuesto que corresponda según él. Y la ley admite el gravamen de naturaleza idéntica o análoga, no solo el idéntico."
  citation: "art. 31.1 LIS"
  difficulty: 2
  tags:
  - "doble imposición"
  - "deducción"
# anchor: boe-a-2014-12328-art-31
- id: m03-l17-q0080
  prompt:
    es: "¿Cómo se realiza la deducción por doble imposición cuando el contribuyente haya obtenido en el período varias rentas del extranjero, conforme al artículo 31.3 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades?"
  options:
  - id: a
    correct: true
    text:
      es: "Agrupando las procedentes de un mismo país, salvo las rentas de establecimientos permanentes, que se computan aisladamente por cada uno de estos."
  - id: b
    text:
      es: "Computando aisladamente cada renta, sea cual sea el país del que procede."
  - id: c
    text:
      es: "Agrupando todas las rentas del extranjero, con independencia del país, incluidas las de establecimientos permanentes."
  - id: d
    text:
      es: "Agrupando las procedentes de un mismo país, incluidas las de establecimientos permanentes."
  explanation:
    es: "La deducción agrupa las rentas de un mismo país, con una excepción: las de establecimientos permanentes se computan aisladamente por cada uno. Computar cada renta por separado ignora la agrupación por país. Agrupar todas las rentas sin atender al país elimina el criterio de agrupación. Y meter en la agrupación los establecimientos permanentes suprime la excepción."
  citation: "art. 31.3 LIS"
  difficulty: 2
  tags:
  - "doble imposición"
  - "deducción"
# anchor: boe-a-2014-12328-art-31
- id: m03-l17-q0081
  prompt:
    es: "De acuerdo con el artículo 31.7 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, el derecho de la Administración para iniciar el procedimiento de comprobación de las deducciones por doble imposición aplicadas o pendientes de aplicar prescribe:"
  options:
  - id: a
    text:
      es: "a los 5 años, a contar desde el día siguiente a aquel en que finalice el plazo para presentar la declaración del período en que se generó el derecho a su aplicación."
  - id: b
    text:
      es: "a los 15 años, a contar desde el día siguiente a aquel en que finalice el plazo para presentar la declaración del período en que se generó el derecho a su aplicación."
  - id: c
    correct: true
    text:
      es: "a los 10 años, a contar desde el día siguiente a aquel en que finalice el plazo para presentar la declaración del período en que se generó el derecho a su aplicación."
  - id: d
    text:
      es: "a los 10 años, a contar desde el día siguiente a aquel en que se aplique la deducción en la autoliquidación."
  explanation:
    es: "El plazo es de 10 años desde el día siguiente al fin del plazo de presentación de la declaración del período en que se generó el derecho a aplicar la deducción. Cinco y quince años no son el plazo del artículo. Y contarlo desde que se aplica la deducción cambia el punto de partida, que es el período de generación del derecho. En el examen 2024 (pregunta 43) la plantilla oficial dio otra respuesta; esta pregunta sigue el texto del artículo."
  citation: "art. 31.7 LIS"
  difficulty: 2
  tags:
  - "doble imposición"
  - "prescripción"
# anchor: boe-a-2014-12328-art-32
- id: m03-l17-q0082
  prompt:
    es: "Según el artículo 32.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, ¿qué condición debe cumplir la cuantía de los dividendos pagados por una entidad no residente para que se deduzca el impuesto efectivamente pagado por esta última?"
  options:
  - id: a
    correct: true
    text:
      es: "Que dicha cuantía se incluya en la base imponible del contribuyente."
  - id: b
    text:
      es: "Que los dividendos hayan soportado una retención en el Estado de la entidad pagadora."
  - id: c
    text:
      es: "Que la entidad pagadora resida en un Estado con el que España haya firmado un convenio para evitar la doble imposición."
  - id: d
    text:
      es: "Que el contribuyente destine los dividendos a una reserva indisponible durante tres años."
  explanation:
    es: "La deducción exige que la cuantía de los dividendos se incluya en la base imponible del contribuyente. El artículo no pide que hayan soportado retención, ni que exista un convenio con el Estado de la pagadora, ni que se dote una reserva indisponible: los requisitos que enumera son el porcentaje de participación y el tiempo de tenencia, y esa condición sobre la inclusión en la base."
  citation: "art. 32.1 LIS"
  difficulty: 2
  tags:
  - "doble imposición"
  - "dividendos"
# anchor: boe-a-2014-12328-art-32
- id: m03-l17-q0083
  prompt:
    es: "Según el artículo 32.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, la deducción del impuesto pagado por la entidad no residente exige que la participación se hubiera poseído de manera ininterrumpida durante el año anterior al día en que sea exigible el beneficio que se distribuya o, en su defecto, que:"
  options:
  - id: a
    text:
      es: "se mantenga durante los tres años siguientes a la distribución del dividendo."
  - id: b
    text:
      es: "se mantenga hasta el cierre del período impositivo siguiente al de la distribución."
  - id: c
    text:
      es: "se transmita a otra entidad del mismo grupo antes de que concluya el ejercicio."
  - id: d
    correct: true
    text:
      es: "se mantenga durante el tiempo que sea necesario para completar un año."
  explanation:
    es: "Si la participación no se ha poseído durante el año anterior, basta que se mantenga el tiempo necesario para completar un año. Mantenerla tres años o hasta el cierre del período siguiente alarga el requisito. Y transmitirla a otra entidad del grupo no es una opción que el artículo ofrezca: lo que cuenta es la tenencia continuada, con el cómputo del período en que la hayan poseído otras entidades del grupo."
  citation: "art. 32.1 LIS"
  difficulty: 1
  tags:
  - "doble imposición"
  - "dividendos"
# anchor: boe-a-2014-12328-art-32
- id: m03-l17-q0085
  prompt:
    es: "Una sociedad española recibe en 2026 dividendos de 100.000 euros de una entidad no residente, con una participación que cumple los requisitos del artículo 32.1, y tributa al tipo general del 25 por ciento. No concurren las circunstancias del apartado 11 del artículo 21. Conforme al artículo 32.4 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, ¿cuál es el límite de la deducción, es decir, la cuota íntegra que correspondería pagar en España por esos dividendos?"
  options:
  - id: a
    text:
      es: "25.000 euros: el 25 por ciento de los dividendos sin reducción alguna."
  - id: b
    text:
      es: "26.250 euros: el 25 por ciento de los dividendos incrementados en un 5 por ciento."
  - id: c
    text:
      es: "22.500 euros: el 25 por ciento de los dividendos reducidos en un 10 por ciento."
  - id: d
    correct: true
    text:
      es: "23.750 euros: el 25 por ciento de los dividendos reducidos en un 5 por ciento por gastos de gestión."
  explanation:
    es: "El artículo 32.4 limita la deducción a la cuota íntegra española por esas rentas, y para calcularla los dividendos se reducen un 5 por ciento por gastos de gestión: 100.000 x 95 % = 95.000 euros. Con el tipo del 25 por ciento, la cuota es 23.750 euros. Aplicar el tipo a los 100.000 euros sin reducir ignora los gastos de gestión. Incrementar el 5 por ciento va en sentido contrario. Y la reducción del 10 por ciento no es la que fija la ley."
  citation: "art. 32.4 LIS"
  difficulty: 3
  tags:
  - "doble imposición"
  - "dividendos"
  - "cómputo"
