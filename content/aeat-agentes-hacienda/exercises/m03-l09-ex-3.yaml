# anchor: boe-a-2003-23186-art-62
- id: m03-l09-q0059
  prompt:
    es: "En relación con las deudas de notificación colectiva y periódica cuyas normas reguladoras fijan otro plazo de pago, conforme al artículo 62.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    correct: true
    text:
      es: "Rige el plazo que establecen sus normas reguladoras, y no el general de septiembre a noviembre."
  - id: b
    text:
      es: "Rige siempre el plazo general, del uno de septiembre al 20 de noviembre, aunque sus normas fijen otro."
  - id: c
    text:
      es: "Rige el plazo de las liquidaciones de la Administración, hasta el día 20 del mes posterior."
  - id: d
    text:
      es: "Rige el plazo que elija el obligado dentro de los dos meses siguientes a la notificación colectiva."
  explanation:
    es: "El plazo del uno de septiembre al 20 de noviembre rige para las deudas que no tengan establecido otro plazo en sus normas reguladoras (artículo 62.3). Si las normas lo fijan, se aplica ese plazo. El plazo general no prevalece sobre el específico. El del artículo 62.2 es el de las liquidaciones, no el de las deudas colectivas. Y el obligado no elige su plazo."
  citation: "art. 62.3 LGT"
  difficulty: 2
  tags:
  - "pago"
  - "plazos de pago"
# anchor: boe-a-2003-23186-art-62
- id: m03-l09-q0060
  prompt:
    es: "¿Cuál de las siguientes deudas tributarias se paga en período voluntario entre el día uno de septiembre y el 20 de noviembre, según el artículo 62.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, salvo que su normativa fije otro plazo?"
  options:
  - id: a
    text:
      es: "Las resultantes de liquidaciones practicadas por la Administración y notificadas entre los días 16 y último."
  - id: b
    correct: true
    text:
      es: "Las de notificación colectiva y periódica que no tengan establecido otro plazo en sus normas reguladoras."
  - id: c
    text:
      es: "Las resultantes de una autoliquidación presentada dentro del plazo del tributo."
  - id: d
    text:
      es: "Las que deban abonarse mediante efectos timbrados en el momento del hecho imponible."
  explanation:
    es: "El plazo de septiembre a noviembre es el de las deudas de notificación colectiva y periódica sin otro plazo en sus normas (artículo 62.3). Las liquidaciones de la Administración se rigen por el artículo 62.2, las autoliquidaciones por la normativa de cada tributo (artículo 62.1) y las deudas con efectos timbrados se pagan al realizarse el hecho imponible (artículo 62.4)."
  citation: "art. 62.3 LGT"
  difficulty: 1
  tags:
  - "pago"
  - "plazos de pago"
# anchor: boe-a-2003-23186-art-62
- id: m03-l09-q0061
  prompt:
    es: "Se realiza el hecho imponible de un tributo que debe abonarse mediante efectos timbrados el lunes 3 de mayo de 2027, y su normativa específica no dispone otro plazo. ¿Cuándo debe pagarse, conforme al artículo 62.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Hasta el lunes 17 de mayo de 2027, a los catorce días naturales del hecho imponible."
  - id: b
    text:
      es: "Hasta el lunes 5 de julio de 2027, día cinco del segundo mes posterior al hecho imponible."
  - id: c
    text:
      es: "Hasta el jueves 3 de junio de 2027, un mes después del hecho imponible."
  - id: d
    correct: true
    text:
      es: "El mismo 3 de mayo de 2027, en el momento de la realización del hecho imponible."
  explanation:
    es: "Las deudas con efectos timbrados se pagan en el momento de la realización del hecho imponible si su normativa específica no dispone otro plazo (artículo 62.4): el 3 de mayo. Los catorce días naturales y el plazo de un mes no figuran en el artículo. El día cinco del segundo mes posterior es el plazo de las liquidaciones notificadas entre los días 16 y último, no el de los efectos timbrados."
  citation: "art. 62.4 LGT"
  difficulty: 3
  tags:
  - "pago"
  - "plazos de pago"
  - "efectos timbrados"
# anchor: boe-a-2003-23186-art-62
- id: m03-l09-q0062
  prompt:
    es: "En relación con las deudas que deban abonarse mediante efectos timbrados, conforme al artículo 62.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    correct: true
    text:
      es: "Se pagan en el momento de la realización del hecho imponible, si su normativa específica no dispone otro plazo."
  - id: b
    text:
      es: "Se pagan en el plazo de diez días naturales siguientes a la realización del hecho imponible."
  - id: c
    text:
      es: "Se pagan en el plazo de la normativa de cada tributo, que siempre debe ser posterior al devengo."
  - id: d
    text:
      es: "Se pagan en el plazo de un mes desde la realización del hecho imponible."
  explanation:
    es: "El pago es en el momento de la realización del hecho imponible, salvo que la normativa específica fije otro plazo (artículo 62.4). Los diez días naturales y el mes no figuran en el artículo. Remitir siempre a la normativa de cada tributo es la regla de las autoliquidaciones, y exigir que sea posterior al devengo no aparece en el texto."
  citation: "art. 62.4 LGT"
  difficulty: 2
  tags:
  - "pago"
  - "plazos de pago"
  - "efectos timbrados"
# anchor: boe-a-2005-14803-art-68
- id: m03-l09-q0063
  prompt:
    es: "Conforme al artículo 68.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la recaudación en período voluntario de las deudas resultantes de liquidaciones se inicia a partir de:"
  options:
  - id: a
    text:
      es: "La fecha en que la liquidación se dicta por el órgano competente."
  - id: b
    text:
      es: "La fecha de comienzo del plazo señalado para su presentación."
  - id: c
    correct: true
    text:
      es: "La fecha de notificación de la liquidación al obligado al pago."
  - id: d
    text:
      es: "La apertura del respectivo plazo recaudatorio de la deuda."
  explanation:
    es: "En las liquidaciones, la recaudación voluntaria se inicia con la notificación al obligado (artículo 68.1.a). La fecha de la liquidación no es la señalada. El comienzo del plazo de presentación es el inicio de las autoliquidaciones, y la apertura del plazo recaudatorio es el de las deudas de notificación colectiva y periódica."
  citation: "art. 68.1 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "recaudación en período voluntario"
# anchor: boe-a-2005-14803-art-68
- id: m03-l09-q0064
  prompt:
    es: "De acuerdo con el artículo 68.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la recaudación en período voluntario de las autoliquidaciones se inicia a partir de:"
  options:
  - id: a
    text:
      es: "La fecha de presentación de la autoliquidación por el obligado."
  - id: b
    correct: true
    text:
      es: "La fecha de comienzo del plazo señalado para su presentación."
  - id: c
    text:
      es: "La fecha de notificación de la liquidación al obligado al pago."
  - id: d
    text:
      es: "La apertura del respectivo plazo recaudatorio de la deuda."
  explanation:
    es: "Para las autoliquidaciones, la recaudación voluntaria se inicia en la fecha de comienzo del plazo de presentación (artículo 68.1.c). No espera a que el obligado presente. La notificación de la liquidación es el inicio de las liquidaciones, y la apertura del plazo recaudatorio el de las deudas colectivas."
  citation: "art. 68.1 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "recaudación en período voluntario"
# anchor: boe-a-2005-14803-art-68
- id: m03-l09-q0065
  prompt:
    es: "Lucas Marín presenta el lunes 12 de abril de 2027 una autoliquidación fuera de plazo, sin realizar el ingreso y sin presentar solicitud de aplazamiento, fraccionamiento o compensación. Según el artículo 68.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cuándo concluye la recaudación en período voluntario de esa deuda?"
  options:
  - id: a
    text:
      es: "El día en que se notifique la providencia de apremio al obligado."
  - id: b
    text:
      es: "El último día del mes de abril de 2027, en que se presentó la autoliquidación."
  - id: c
    text:
      es: "Diez días hábiles después de presentar la autoliquidación sin ingreso."
  - id: d
    correct: true
    text:
      es: "El mismo lunes 12 de abril de 2027, día de presentación de la autoliquidación."
  explanation:
    es: "En una autoliquidación presentada fuera de plazo sin ingreso ni solicitud, el período voluntario concluye el mismo día de la presentación (artículo 68.2): el 12 de abril. La providencia de apremio llega después de iniciado el ejecutivo. El fin de mes y el plazo de diez días hábiles no figuran en el precepto."
  citation: "art. 68.2 RGR"
  difficulty: 3
  tags:
  - "pago"
  - "recaudación en período voluntario"
  - "cómputo"
# anchor: boe-a-2005-14803-art-68
- id: m03-l09-q0066
  prompt:
    es: "Según el artículo 68.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la recaudación en período voluntario concluye, con carácter general:"
  options:
  - id: a
    text:
      es: "El día siguiente al del vencimiento de los plazos de ingreso en período voluntario."
  - id: b
    text:
      es: "El día en que se notifique la providencia de apremio."
  - id: c
    correct: true
    text:
      es: "El día del vencimiento de los correspondientes plazos de ingreso."
  - id: d
    text:
      es: "El último día del mes en que vencen los plazos de ingreso."
  explanation:
    es: "La recaudación voluntaria concluye el día del vencimiento de los plazos de ingreso (artículo 68.2). Alargarla un día, hasta la providencia de apremio o hasta final de mes, no tiene apoyo en el texto."
  citation: "art. 68.2 RGR"
  difficulty: 1
  tags:
  - "pago"
  - "recaudación en período voluntario"
# anchor: boe-a-2003-23186-art-63
- id: m03-l09-q0067
  prompt:
    es: "¿A cuál de sus deudas tributarias puede imputar un obligado un pago de 1.000 euros, si debe a la Administración una deuda de 1.000 euros y otra de 3.000 euros, según el artículo 63.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "A la que determine la Administración tributaria, porque dirige la aplicación de los pagos."
  - id: b
    correct: true
    text:
      es: "A la que él determine libremente, porque puede imputar cada pago a la deuda que decida."
  - id: c
    text:
      es: "A las dos en proporción a su importe, porque las deudas deben pagarse de forma simultánea."
  - id: d
    text:
      es: "Al interés de demora de ambas, antes de aplicar nada a la cuantía de las deudas."
  explanation:
    es: "El obligado al pago de varias deudas puede imputar cada pago a la deuda que libremente determine (artículo 63.1). La decisión es suya, no de la Administración. La ley no obliga a repartir proporcionalmente ni a imputar primero a los intereses."
  citation: "art. 63.1 LGT"
  difficulty: 2
  tags:
  - "pago"
  - "imputación de pagos"
# anchor: boe-a-2003-23186-art-63
- id: m03-l09-q0069
  prompt:
    es: "Conforme al artículo 63.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el cobro de un débito de vencimiento posterior:"
  options:
  - id: a
    text:
      es: "Extingue el derecho de la Administración a percibir los anteriores en descubierto."
  - id: b
    text:
      es: "Suspende el derecho de la Administración a percibir los anteriores hasta que el obligado lo solicite."
  - id: c
    correct: true
    text:
      es: "No extingue el derecho de la Administración tributaria a percibir los anteriores en descubierto."
  - id: d
    text:
      es: "Permite al obligado imputar el pago a los anteriores sin necesidad de abonar sus intereses."
  explanation:
    es: "El cobro de una deuda de vencimiento posterior no extingue el derecho a cobrar las anteriores que siguen en descubierto (artículo 63.2). Extinguirlo o suspenderlo contradice el texto, y el precepto no regula ninguna exención de intereses."
  citation: "art. 63.2 LGT"
  difficulty: 2
  tags:
  - "pago"
  - "imputación de pagos"
# anchor: boe-a-2003-23186-art-63
- id: m03-l09-q0070
  prompt:
    es: "¿Qué ocurre con una deuda que venció el 20 de enero de 2027 cuando el obligado paga otra posterior, que venció el 20 de marzo de 2027, según el artículo 63.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Queda extinguida, porque el pago de la deuda de marzo cancela las anteriores del mismo obligado en descubierto."
  - id: b
    text:
      es: "Queda condonada de oficio, porque la Administración aceptó el pago de la posterior."
  - id: c
    text:
      es: "Pasa a pagarse en el plazo de la deuda de marzo, que absorbe el plazo de la anterior."
  - id: d
    correct: true
    text:
      es: "La Administración conserva su derecho a percibirla, porque el cobro de la posterior no lo extingue."
  explanation:
    es: "El cobro del débito posterior no extingue el derecho a percibir los anteriores en descubierto (artículo 63.2), de modo que la deuda de enero sigue exigible. No queda extinguida, ni condonada por aceptar otro pago. El plazo de la posterior no absorbe el de la anterior."
  citation: "art. 63.2 LGT"
  difficulty: 2
  tags:
  - "pago"
  - "imputación de pagos"
  - "cómputo"
# anchor: boe-a-2003-23186-art-63
- id: m03-l09-q0072
  prompt:
    es: "En relación con la aplicación del pago en la ejecución forzosa de varias deudas acumuladas, conforme al artículo 63.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "El obligado elige a qué deuda se aplica el pago embargado, aunque no puedan extinguirse totalmente."
  - id: b
    correct: true
    text:
      es: "Salvo lo dispuesto para las deudas a favor de entidades dependientes de la misma Administración, se aplica el pago a la deuda más antigua."
  - id: c
    text:
      es: "Se aplica el pago a la deuda de menor importe, para extinguir el mayor número de deudas posible."
  - id: d
    text:
      es: "Se aplica el pago a la deuda más reciente, porque todavía no ha generado recargos."
  explanation:
    es: "En la ejecución forzosa con varias deudas que no pueden extinguirse todas, el pago se aplica a la más antigua, salvo lo dispuesto en el apartado siguiente para las deudas a favor de la Administración y de sus entidades dependientes (artículo 63.3). La libre elección del obligado es la regla del pago voluntario del artículo 63.1. Ni la menor cuantía ni la más reciente son criterios de la ley."
  citation: "art. 63.3 LGT"
  difficulty: 3
  tags:
  - "pago"
  - "imputación de pagos"
# anchor: boe-a-2003-23186-art-63
- id: m03-l09-q0073
  prompt:
    es: "Según el artículo 63.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando se hubieran acumulado varias deudas tributarias a favor de una Administración y de otras entidades de derecho público dependientes de la misma, tendrán preferencia para su cobro:"
  options:
  - id: a
    text:
      es: "Las deudas a favor de las entidades de derecho público dependientes, es decir, las segundas."
  - id: b
    text:
      es: "Las más antiguas, con independencia de la entidad a cuyo favor estén."
  - id: c
    text:
      es: "Las de mayor importe, con independencia de la entidad a cuyo favor estén."
  - id: d
    correct: true
    text:
      es: "Las deudas a favor de la Administración, es decir, las primeras."
  explanation:
    es: "Tienen preferencia las deudas a favor de la Administración sobre las de las entidades de derecho público dependientes de ella (artículo 63.4). Invertir el orden contradice el texto. La antigüedad o la cuantía no deciden esta preferencia."
  citation: "art. 63.4 LGT"
  difficulty: 2
  tags:
  - "pago"
  - "imputación de pagos"
# anchor: boe-a-2003-23186-art-64
- id: m03-l09-q0074
  prompt:
    es: "De acuerdo con el artículo 64 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los obligados tributarios podrán consignar el importe de la deuda tributaria y, en su caso, de las costas reglamentariamente devengadas:"
  options:
  - id: a
    text:
      es: "En la caja del órgano de recaudación competente, o en cualquier entidad colaboradora."
  - id: b
    text:
      es: "En una cuenta abierta a nombre del obligado en una entidad de crédito, con retención del importe."
  - id: c
    correct: true
    text:
      es: "En la Caja General de Depósitos u órgano equivalente de las restantes Administraciones públicas, o en alguna de sus sucursales."
  - id: d
    text:
      es: "En el Tribunal Económico-Administrativo que conozca de la reclamación, o en su secretaría."
  explanation:
    es: "La consignación se hace en la Caja General de Depósitos u órgano equivalente de las demás Administraciones, o en alguna de sus sucursales (artículo 64). La caja del órgano de recaudación y las entidades colaboradoras son lugares de pago, no de consignación. Una cuenta del propio obligado no consigna nada. Un tribunal económico-administrativo no recibe consignaciones."
  citation: "art. 64 LGT"
  difficulty: 1
  tags:
  - "pago"
  - "consignación"
# anchor: boe-a-2003-23186-art-64
- id: m03-l09-q0075
  prompt:
    es: "Sobre los efectos de la consignación del pago, conforme al artículo 64 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    correct: true
    text:
      es: "Tiene los efectos liberatorios o suspensivos que las disposiciones reglamentarias determinen."
  - id: b
    text:
      es: "Tiene siempre efectos liberatorios, porque equivale al pago en efectivo de la deuda."
  - id: c
    text:
      es: "Tiene siempre efectos suspensivos, porque paraliza el procedimiento en el que se consigna la deuda."
  - id: d
    text:
      es: "Tiene los efectos que cada órgano de recaudación acuerde en el caso concreto."
  explanation:
    es: "Los efectos, liberatorios o suspensivos, son los que fijen las disposiciones reglamentarias (artículo 64). No es siempre liberatoria ni siempre suspensiva: depende del supuesto. No los decide cada órgano de recaudación."
  citation: "art. 64 LGT"
  difficulty: 2
  tags:
  - "pago"
  - "consignación"
# anchor: boe-a-2005-14803-art-43
- id: m03-l09-q0076
  prompt:
    es: "Conforme al artículo 43.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, los obligados al pago podrán consignar en efectivo el importe de la cantidad debida y de las costas en la Caja General de Depósitos cuando:"
  options:
  - id: a
    text:
      es: "Se solicite un aplazamiento o fraccionamiento de la deuda."
  - id: b
    correct: true
    text:
      es: "Se interpongan las reclamaciones o recursos procedentes."
  - id: c
    text:
      es: "Se inicie el período ejecutivo de la deuda."
  - id: d
    text:
      es: "Se presente una autoliquidación fuera de plazo."
  explanation:
    es: "Uno de los casos de consignación es la interposición de las reclamaciones o recursos procedentes (artículo 43.1.a). El otro, que la caja competente no admita el pago debiendo hacerlo o no pueda por fuerza mayor. Solicitar un aplazamiento, iniciarse el período ejecutivo o presentar fuera de plazo no son casos de consignación."
  citation: "art. 43.1 RGR"
  difficulty: 1
  tags:
  - "pago"
  - "consignación"
# anchor: boe-a-2005-14803-art-43
- id: m03-l09-q0077
  prompt:
    es: "Conforme al artículo 43.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿qué puede hacer el obligado al pago cuando una entidad colaboradora autorizada para recibir el pago se niega, sin causa, a admitir su ingreso?"
  options:
  - id: a
    correct: true
    text:
      es: "Consignar en efectivo el importe en la Caja General de Depósitos, porque la entidad no lo admitió debiendo hacerlo."
  - id: b
    text:
      es: "Esperar a que se inicie el período ejecutivo, porque la consignación solo cabe al recurrir."
  - id: c
    text:
      es: "Pagar a cualquier persona que acepte el importe, porque el pago a terceros libera igualmente."
  - id: d
    text:
      es: "Solicitar una compensación de oficio, porque la negativa de la entidad extingue la deuda."
  explanation:
    es: "Si la entidad autorizada no admite el pago, debiendo hacerlo, el obligado puede consignar en efectivo (artículo 43.1.b). Esperar al período ejecutivo no es necesario. Pagar a una persona no autorizada no libera (artículo 33.3 del mismo reglamento). La negativa de la entidad no extingue la deuda por compensación."
  citation: "art. 43.1 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "consignación"
# anchor: boe-a-2005-14803-art-43
- id: m03-l09-q0078
  prompt:
    es: "De acuerdo con el artículo 43.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en el caso de consignación por interposición de reclamaciones o recursos, esta suspenderá la ejecución del acto impugnado:"
  options:
  - id: a
    text:
      es: "Desde la fecha de la resolución del recurso, cuando esta sea desestimatoria de la pretensión."
  - id: b
    text:
      es: "Desde la fecha en que se notifique la consignación al órgano que dictó el acto."
  - id: c
    text:
      es: "Desde la fecha de la interposición, aunque la consignación no se ajuste a las normas del recurso."
  - id: d
    correct: true
    text:
      es: "Desde la fecha en que haya sido efectuada, cuando se realice de acuerdo con las normas que regulan los recursos y reclamaciones."
  explanation:
    es: "La consignación suspende la ejecución del acto desde la fecha en que se efectúa, si se realiza conforme a las normas del recurso o reclamación (artículo 43.2). No espera a la resolución. Tampoco a la notificación al órgano. No suspende si no respeta esas normas."
  citation: "art. 43.2 RGR"
  difficulty: 1
  tags:
  - "pago"
  - "consignación"
# anchor: boe-a-2005-14803-art-43
- id: m03-l09-q0079
  prompt:
    es: "Según el artículo 43.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la consignación hecha porque la caja competente no admitió el pago, debiendo hacerlo, tiene los efectos liberatorios del pago desde la fecha en que se efectúa y por el importe consignado, siempre que:"
  options:
  - id: a
    text:
      es: "Se acepte por el órgano de recaudación."
  - id: b
    text:
      es: "Se interponga una reclamación económico-administrativa."
  - id: c
    correct: true
    text:
      es: "Se comunique al órgano de recaudación."
  - id: d
    text:
      es: "Se acredite la fuerza mayor ante el Tribunal."
  explanation:
    es: "Estos efectos liberatorios exigen que la consignación se comunique al órgano de recaudación (artículo 43.2). No hace falta que el órgano la acepte ni que se interponga reclamación. El precepto no remite a ningún tribunal para acreditar la fuerza mayor."
  citation: "art. 43.2 RGR"
  difficulty: 1
  tags:
  - "pago"
  - "consignación"
# anchor: boe-a-2005-14803-art-43
- id: m03-l09-q0080
  prompt:
    es: "En relación con la consignación en efectivo prevista en el artículo 43.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Solo puede hacerse una vez notificada la providencia de apremio."
  - id: b
    correct: true
    text:
      es: "Puede hacerse cuando la caja competente no admita el pago por causa de fuerza mayor."
  - id: c
    text:
      es: "Debe hacerse en la caja del órgano de recaudación competente."
  - id: d
    text:
      es: "Solo puede hacerse cuando se hayan interpuesto reclamaciones o recursos."
  explanation:
    es: "La consignación también cabe cuando la caja no pueda admitir el pago por fuerza mayor (artículo 43.1.b). No depende de la providencia de apremio. Se hace en la Caja General de Depósitos u órgano equivalente, no en la caja del órgano de recaudación. Los recursos son solo uno de los dos casos."
  citation: "art. 43.1 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "consignación"
# anchor: boe-a-2005-14803-art-33
- id: m03-l09-q0081
  prompt:
    es: "¿Cuál de los siguientes puede recibir el pago de las deudas, según el artículo 33.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, cuando esté previsto en la normativa vigente?"
  options:
  - id: a
    text:
      es: "Cualquier entidad de crédito, aunque no preste el servicio de caja ni esté autorizada."
  - id: b
    text:
      es: "Los asesores fiscales que representen al obligado, aunque no estén autorizados para recibir pagos."
  - id: c
    correct: true
    text:
      es: "Las entidades colaboradoras y demás personas o entidades autorizadas para recibir el pago."
  - id: d
    text:
      es: "Las Delegaciones de otros Ministerios, cuando el obligado acuda a ellas por comodidad."
  explanation:
    es: "El artículo 33.2 admite el pago en las cajas de los órganos competentes, en las entidades que presten el servicio de caja, en las colaboradoras y en las demás personas o entidades autorizadas. Una entidad de crédito sin servicio de caja ni autorización, un asesor no autorizado o un órgano ajeno no reciben el pago con efecto liberatorio."
  citation: "art. 33.2 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "lugar de pago"
# anchor: boe-a-2005-14803-art-34
- id: m03-l09-q0082
  prompt:
    es: "De acuerdo con el artículo 34.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la regla de que el pago en efectivo se podrá hacer siempre en dinero de curso legal se aplica al pago de:"
  options:
  - id: a
    text:
      es: "Solo las deudas tributarias, pero no las sanciones tributarias."
  - id: b
    correct: true
    text:
      es: "Las deudas y sanciones tributarias que deba realizarse en efectivo."
  - id: c
    text:
      es: "Solo las sanciones tributarias, pero no las deudas tributarias."
  - id: d
    text:
      es: "Las deudas y sanciones tributarias, salvo cuando exceda de un importe fijado."
  explanation:
    es: "El artículo 34.1 se refiere a las deudas y sanciones tributarias que deban pagarse en efectivo. Excluir las sanciones o las deudas se aparta del texto, y el precepto no fija ningún importe a partir del cual deje de aplicarse."
  citation: "art. 34.1 RGR"
  difficulty: 2
  tags:
  - "pago"
  - "medios de pago"
# anchor: boe-a-2003-23186-art-62
- id: m03-l09-q0083
  prompt:
    es: "Según el artículo 62.2.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿hasta qué día llega el plazo de pago en período voluntario de una liquidación practicada por la Administración y notificada entre los días 16 y último de un mes?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el día cinco del segundo mes posterior o, si este no fuera hábil, hasta el inmediato hábil siguiente."
  - id: b
    text:
      es: "Hasta el día cinco del mes posterior o, si este no fuera hábil, hasta el inmediato hábil siguiente."
  - id: c
    text:
      es: "Hasta el día 20 del segundo mes posterior o, si este no fuera hábil, hasta el inmediato hábil siguiente."
  - id: d
    text:
      es: "Hasta el día cinco del segundo mes posterior o, si este no fuera hábil, hasta el inmediato hábil anterior a ese día."
  explanation:
    es: "El plazo llega hasta el día cinco del segundo mes posterior o, si no es hábil, hasta el inmediato hábil siguiente (artículo 62.2.b). Referirlo al mes posterior es el plazo de la providencia de apremio del apartado 5 y no el de la liquidación. El día 20 es el límite de las notificadas entre los días uno y 15. Y el hábil anterior contradice la prórroga al hábil siguiente."
  citation: "art. 62.2 LGT"
  difficulty: 2
  tags:
  - "pago"
  - "plazos de pago"
# anchor: boe-a-2005-14803-art-68
- id: m03-l09-q0084
  prompt:
    es: "Según el artículo 68.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la recaudación en período voluntario de las deudas de notificación colectiva y periódica se inicia a partir de:"
  options:
  - id: a
    text:
      es: "La fecha de notificación individual al obligado al pago."
  - id: b
    text:
      es: "La fecha de comienzo del plazo señalado para su presentación."
  - id: c
    text:
      es: "La fecha en que se publica el padrón en el boletín oficial."
  - id: d
    correct: true
    text:
      es: "La apertura del respectivo plazo recaudatorio."
  explanation:
    es: "En las deudas de notificación colectiva y periódica, la recaudación voluntaria se inicia con la apertura del plazo recaudatorio (artículo 68.1.b). La notificación individual es el inicio de las liquidaciones, y el comienzo del plazo de presentación el de las autoliquidaciones. La publicación en un boletín oficial no es el hecho que fija el precepto."
  citation: "art. 68.1 RGR"
  difficulty: 1
  tags:
  - "pago"
  - "recaudación en período voluntario"
# anchor: boe-a-2023-8119-art-2
- id: m03-l09-q0085
  prompt:
    es: "¿En cuál de los siguientes períodos de pago se aplica la exención de garantías en las solicitudes de aplazamiento y fraccionamiento, conforme al artículo 2 de la Orden HFP/311/2023, de 28 de marzo, por la que se eleva el límite exento de la obligación de aportar garantía en las solicitudes de aplazamiento o fraccionamiento a 50.000 euros?"
  options:
  - id: a
    text:
      es: "Solo en período voluntario de pago, sin que alcance al período ejecutivo."
  - id: b
    correct: true
    text:
      es: "Tanto en período voluntario como en período ejecutivo de pago."
  - id: c
    text:
      es: "Solo en período ejecutivo de pago, sin que alcance al período voluntario."
  - id: d
    text:
      es: "En ninguno de ellos, porque la exención solo opera con dispensa expresa."
  explanation:
    es: "La exención se aplica a deudas que se encuentren tanto en período voluntario como en período ejecutivo (artículo 2), sin perjuicio de mantener en este último las trabas existentes. Limitarla a un solo período contradice el texto. Y no necesita una dispensa expresa: opera cuando el importe en conjunto no excede del límite."
  citation: "art. 2 Orden HFP/311/2023"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "garantías"
  - "límite exento"
