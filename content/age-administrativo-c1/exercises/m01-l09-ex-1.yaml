# anchor: boe-a-1978-31229-dt-quinta
- id: m01-l09-q022
  prompt:
    es: "De acuerdo con la disposición transitoria quinta de la Constitución Española de 1978, las ciudades de Ceuta y Melilla podrán constituirse en Comunidades Autónomas si así lo deciden:"
  options:
  - id: a
    text:
      es: "Sus Ayuntamientos, por mayoría de dos tercios de sus miembros, y lo autorizan las Cortes Generales mediante una ley ordinaria."
  - id: b
    text:
      es: "Sus vecinos en referéndum, por mayoría absoluta de los electores, y lo autoriza el Gobierno mediante real decreto."
  - id: c
    correct: true
    text:
      es: "Sus Ayuntamientos, por mayoría absoluta de sus miembros, y lo autorizan las Cortes Generales mediante una ley orgánica."
  - id: d
    text:
      es: "Sus Ayuntamientos, por mayoría absoluta de sus miembros, y lo ratifica el Senado por mayoría absoluta."
  explanation:
    es: "La disposición transitoria quinta exige que lo decidan «sus respectivos Ayuntamientos, mediante acuerdo adoptado por la mayoría absoluta de sus miembros», y que lo autoricen «las Cortes Generales, mediante una ley orgánica». La mayoría no es de dos tercios y la ley no es ordinaria. No decide un referéndum vecinal ni autoriza el Gobierno. La autorización es de las Cortes por ley orgánica, no una ratificación del Senado."
  citation: "disposición transitoria quinta CE"
  difficulty: 2
  tags:
  - "requisito"
  - "mayoría"
# anchor: boe-a-1978-31229-art-145
- id: m01-l09-q023
  prompt:
    es: "¿Qué establece la Constitución Española de 1978 sobre la posibilidad de que dos o más Comunidades Autónomas se federen entre sí?"
  options:
  - id: a
    correct: true
    text:
      es: "En ningún caso se admitirá la federación de Comunidades Autónomas."
  - id: b
    text:
      es: "Se admitirá si la autorizan las Cortes Generales mediante ley orgánica."
  - id: c
    text:
      es: "Se admitirá entre Comunidades limítrofes si lo prevén sus respectivos Estatutos."
  - id: d
    text:
      es: "Se admitirá previa comunicación a las Cortes Generales y referéndum en cada Comunidad."
  explanation:
    es: "El artículo 145.1 dice: «En ningún caso se admitirá la federación de Comunidades Autónomas». La prohibición no tiene excepciones: ni ley orgánica, ni previsión estatutaria, ni referéndum la hacen posible."
  citation: "art. 145.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-145
- id: m01-l09-q024
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la cooperación entre Comunidades Autónomas es correcta según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Todos los convenios entre Comunidades Autónomas necesitan la autorización previa de las Cortes Generales."
  - id: b
    text:
      es: "Los acuerdos de cooperación entre Comunidades Autónomas necesitan la autorización del Gobierno."
  - id: c
    text:
      es: "Los convenios para la gestión de servicios propios necesitan la autorización del Senado."
  - id: d
    correct: true
    text:
      es: "Los acuerdos de cooperación distintos de los convenios previstos en los Estatutos necesitan la autorización de las Cortes Generales."
  explanation:
    es: "El artículo 145.2 deja a los Estatutos los convenios para la gestión y prestación de servicios propios, con la comunicación a las Cortes que prevean, y añade: «En los demás supuestos, los acuerdos de cooperación entre las Comunidades Autónomas necesitarán la autorización de las Cortes Generales». No todos los convenios necesitan autorización: los de servicios propios siguen lo que diga el Estatuto. La autorización es de las Cortes, no del Gobierno ni del Senado solo."
  citation: "art. 145.2 CE"
  difficulty: 3
  tags:
  - "requisito"
  - "órgano"
