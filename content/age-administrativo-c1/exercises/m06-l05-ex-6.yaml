# anchor: fuente-ms-excel-funciones-categoria-html
- id: m06-l05-q205
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes funciones devuelve el valor especificado solo si la expresión da el error #N/A y, en otro caso, el resultado de la expresión?"
  options:
  - id: a
    text:
      es: "SI.ERROR"
  - id: b
    text:
      es: "SI"
  - id: c
    text:
      es: "SI.CONJUNTO"
  - id: d
    correct: true
    text:
      es: "SI.ND"
  explanation:
    es: "SI.ND devuelve el valor especificado si la expresión se convierte en #N/A y, si no, el resultado de la expresión. SI.ERROR responde a cualquier error, SI realiza una prueba lógica y SI.CONJUNTO comprueba una o varias condiciones y devuelve el valor de la condición verdadera que se cumple antes."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones lógicas»"
  difficulty: 3
  tags:
  - "función"
# anchor: fuente-ms-excel-funcion-sierror-html
- id: m06-l05-q206
  prompt:
    es: "En Excel 365, en =SI.ERROR(A3/B3; \"Revisar\"), ¿cuál de las siguientes opciones describe lo que representa el segundo argumento, \"Revisar\"?"
  options:
  - id: a
    text:
      es: "El valor de la celda en la que se busca un error"
  - id: b
    correct: true
    text:
      es: "El valor que se devuelve si la fórmula da un error"
  - id: c
    text:
      es: "El valor que se devuelve si la fórmula no da ningún error"
  - id: d
    text:
      es: "El tipo de error concreto que se quiere detectar"
  explanation:
    es: "El segundo argumento es el valor que se devuelve si la fórmula se evalúa como un error; el primero, A3/B3, es donde se busca un error. Además, SI.ERROR evalúa varios tipos de error, no uno concreto elegido en el argumento."
  citation: "fuente: `ms-excel-funcion-sierror.html`; «Sintaxis»"
  difficulty: 2
  tags:
  - "función"
  - "concepto"
# anchor: fuente-ms-excel-funcion-sierror-html
