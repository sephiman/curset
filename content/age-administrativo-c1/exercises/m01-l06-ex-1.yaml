  explanation:
    es: "El segundo párrafo del artículo 133.4 permite omitir la consulta pública cuando la propuesta no tenga impacto significativo en la actividad económica, no imponga obligaciones relevantes o «regule aspectos parciales de una materia». Afectar a derechos e intereses legítimos es lo que obliga a la audiencia del artículo 133.2. La consulta se hace tanto para leyes como para reglamentos, y el órgano que elabora la norma no la excluye."
