# anchor: boe-a-2017-12902-art-29
- id: m03-l04-q284
  prompt:
    es: "Conforme al artículo 29.7 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, un contrato de servicios complementario de uno menor de obras puede ser menor aunque pase de un año, si no excede de:"
  options:
  - id: a
    text:
      es: "18 meses."
  - id: b
    text:
      es: "24 meses."
  - id: c
    correct: true
    text:
      es: "30 meses."
  - id: d
    text:
      es: "36 meses."
  explanation:
    es: "El artículo 29.7 permite tramitar como menor el contrato de servicios complementario de un contrato menor de obras, aunque pase del año, siempre que «su duración no exceda de 30 meses». Los 18, los 24 y los 36 meses no figuran en el artículo; los 36 meses superan además el límite que fija."
  citation: "art. 29.7 LCSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-29
- id: m03-l04-q285
  prompt:
    es: "Según el artículo 29.7 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el exceso sobre el año de duración de un contrato de servicios complementario de un contrato menor de obras debe justificarse exclusivamente por:"
  options:
  - id: a
    correct: true
    text:
      es: "el período de garantía del contrato de obras principal y los trabajos relacionados con su liquidación."
  - id: b
    text:
      es: "el período de garantía del contrato de obras principal y las prórrogas que acuerde el órgano de contratación."
  - id: c
    text:
      es: "los trabajos de liquidación del contrato de obras principal, sin contar su período de garantía."
  - id: d
    text:
      es: "la complejidad técnica de la obra principal y los trabajos de dirección facultativa de su ejecución."
  explanation:
    es: "El artículo 29.7 exige que el exceso sobre el año «venga justificado exclusivamente por la duración del período de garantía» del contrato de obras principal «y los trabajos relacionados con la liquidación» de ese contrato. Las prórrogas acordadas no son una causa del artículo. Sin la garantía queda solo una de las dos causas, y la norma pide las dos. La complejidad técnica y la dirección facultativa no figuran entre ellas."
  citation: "art. 29.7 LCSP"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2017-12902-art-193
- id: m03-l04-q288
  prompt:
    es: "Un contrato público de 250.000 euros, IVA excluido, sufre 8 días de demora imputable al contratista en el plazo total. Si se aplican las penalidades diarias legales, ¿cuánto suman?"
  options:
  - id: a
    correct: true
    text:
      es: "1.200 euros."
  - id: b
    text:
      es: "600 euros."
  - id: c
    text:
      es: "2.400 euros."
  - id: d
    text:
      es: "12.000 euros."
  explanation:
    es: "El artículo 193.3 fija penalidades diarias «en la proporción de 0,60 euros por cada 1.000 euros del precio del contrato, IVA excluido». Con 250.000 euros son 150 euros al día, y con 8 días de demora suman 1.200 euros. Los 600 euros salen de aplicar 0,30 euros por cada 1.000, la mitad de la proporción del artículo. Los 2.400 salen de 1,20 euros, el doble. Los 12.000 salen de 6 euros por cada 1.000, diez veces la proporción."
  citation: "art. 193.3 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2017-12902-art-107
- id: m03-l04-q289
  prompt:
    es: "Un licitador con la mejor oferta de un contrato de una Administración Pública constituye una garantía definitiva de 7.500 euros. ¿Qué precio final ofertó, IVA excluido?"
  options:
  - id: a
    text:
      es: "37.500 euros."
  - id: b
    text:
      es: "181.500 euros."
  - id: c
    text:
      es: "250.000 euros."
  - id: d
    correct: true
    text:
      es: "150.000 euros."
  explanation:
    es: "El artículo 107.1 fija la garantía definitiva en el 5 por 100 del precio final ofertado, excluido el IVA, así que el precio es 7.500 entre 0,05, es decir 150.000 euros. Los 37.500 euros multiplican por cinco en lugar de dividir entre el 5 por 100, los 181.500 euros suman un IVA que el artículo excluye de la base, y los 250.000 euros suponen un 3 por 100, porcentaje que no es el de la garantía definitiva."
  citation: "art. 107.1 LCSP"
  difficulty: 3
  tags:
  - "cantidad"
  - "cómputo"
