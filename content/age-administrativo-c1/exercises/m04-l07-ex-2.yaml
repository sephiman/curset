# anchor: boe-a-2000-12140-art-5
- id: m04-l07-q020
  prompt:
    es: "De acuerdo con el artículo 5.1 del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, la MUFACE es un organismo público con:"
  options:
  - id: a
    text:
      es: "Personalidad jurídica privada, patrimonio propio y tesorería integrada en la del Estado"
  - id: b
    text:
      es: "Personalidad jurídica pública diferenciada, sin patrimonio propio y sujeta a la tesorería estatal"
  - id: c
    text:
      es: "Personalidad jurídica pública diferenciada, patrimonio propio y gestión directa del Ministerio"
  - id: d
    correct: true
    text:
      es: "Personalidad jurídica pública diferenciada, patrimonio y tesorería propios y autonomía de gestión"
  explanation:
    es: "El artículo 5.1 la define como organismo público «con personalidad jurídica pública diferenciada, patrimonio y tesorería propios y autonomía de gestión». Su personalidad es pública, no privada. Tiene patrimonio y tesorería propios. Su gestión es autónoma, no la lleva directamente el Ministerio."
  citation: "art. 5.1 RDL 4/2000"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2000-12140-art-5
- id: m04-l07-q021
  prompt:
    es: "Según el artículo 5.1 del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, ¿qué naturaleza tiene la MUFACE?"
  options:
  - id: a
    correct: true
    text:
      es: "Organismo público con personalidad jurídica pública diferenciada"
  - id: b
    text:
      es: "Órgano directivo del Ministerio, con rango de Dirección General"
  - id: c
    text:
      es: "Mutualidad de previsión social de carácter privado y adscripción voluntaria"
  - id: d
    text:
      es: "Servicio común de la Seguridad Social sin personalidad jurídica propia"
  explanation:
    es: "El artículo 5.1 dice que la MUFACE «es un organismo público con personalidad jurídica pública diferenciada». No es un órgano del Ministerio, porque tiene personalidad propia. No es una mutualidad privada ni de adscripción voluntaria: la incorporación de los funcionarios es obligatoria (artículo 7.1). Tampoco es un servicio común sin personalidad."
  citation: "art. 5.1 RDL 4/2000"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2000-12140-art-4
- id: m04-l07-q022
  prompt:
    es: "¿Cuál de las siguientes describe cómo lleva a cabo la MUFACE la gestión del mutualismo administrativo de los funcionarios civiles del Estado?"
  options:
  - id: a
    text:
      es: "De forma descentralizada, a través de las Comunidades Autónomas en que presten servicio los funcionarios"
  - id: b
    text:
      es: "De forma unitaria, incluidas las obligaciones respecto a los funcionarios transferidos a las Comunidades Autónomas"
  - id: c
    text:
      es: "De forma compartida con el Instituto Nacional de la Seguridad Social en las prestaciones económicas de incapacidad"
  - id: d
    correct: true
    text:
      es: "De forma unitaria, sin perjuicio de las obligaciones autonómicas respecto a los funcionarios transferidos"
  explanation:
    es: "El artículo 4.2 dice que la gestión es «de forma unitaria», «sin perjuicio de las obligaciones que corresponden a las Comunidades Autónomas respecto a los funcionarios civiles del Estado transferidos y adscritos a su servicio». No es descentralizada. Las obligaciones de las Comunidades Autónomas con los transferidos quedan a salvo, no las asume la MUFACE. El artículo no reparte la gestión con el Instituto Nacional de la Seguridad Social."
  citation: "art. 4.2 RDL 4/2000"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2023-23537-art-22
- id: m04-l07-q024
  prompt:
    es: "¿En qué ministerio se integra hoy la Secretaría de Estado de Función Pública, a través de la cual se adscribe la MUFACE?"
  options:
  - id: a
    text:
      es: "En el Ministerio de Hacienda"
  - id: b
    text:
      es: "En el Ministerio de Inclusión, Seguridad Social y Migraciones"
  - id: c
    correct: true
    text:
      es: "En el Ministerio para la Transformación Digital y de la Función Pública"
  - id: d
    text:
      es: "En el Ministerio de la Presidencia, Justicia y Relaciones con las Cortes"
  explanation:
    es: "El artículo 22.3.c) del Real Decreto 829/2023 sitúa la Secretaría de Estado de Función Pública entre los órganos superiores del Ministerio para la Transformación Digital y de la Función Pública. Los Ministerios de Hacienda, de Inclusión, Seguridad Social y Migraciones y de la Presidencia, Justicia y Relaciones con las Cortes son otros departamentos de la misma estructura."
  citation: "art. 22.3.c) RD 829/2023"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1997-9874-art-4
- id: m04-l07-q025
  prompt:
    es: "Según el artículo 4 del Estatuto de la Mutualidad General de Funcionarias y Funcionarios Civiles del Estado, O.A., aprobado por el Real Decreto 577/1997, de 18 de abril, los órganos de gobierno de la MUFACE son:"
  options:
  - id: a
    correct: true
    text:
      es: "La Presidencia y el Consejo General"
  - id: b
    text:
      es: "La Presidencia, el Consejo General y la Dirección"
  - id: c
    text:
      es: "El Consejo General y la Asamblea General"
  - id: d
    text:
      es: "La Dirección y la Secretaría General"
  explanation:
    es: "El artículo 4.1 nombra como órganos de gobierno «a) La Presidencia» y «b) El Consejo Rector, que recibe la denominación de Consejo General». La Dirección es el órgano ejecutivo (artículo 4.2), no de gobierno. La Asamblea General y la Secretaría General no son órganos de gobierno en el Estatuto."
  citation: "art. 4.1 RD 577/1997"
  difficulty: 1
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-1997-9874-art-5
- id: m04-l07-q027
  prompt:
    es: "En la composición del Consejo General de la MUFACE que fija su Estatuto, ¿quién ocupa la Vicepresidencia primera de ese Consejo?"
  options:
  - id: a
    text:
      es: "El titular de la Secretaría de Estado de Función Pública"
  - id: b
    text:
      es: "El Secretario general de la MUFACE"
  - id: c
    correct: true
    text:
      es: "El Director General de la Mutualidad"
  - id: d
    text:
      es: "Uno de los representantes de los funcionarios, elegido por ellos"
  explanation:
    es: "El artículo 5.1.a) 2.º del Estatuto dice que el Director General de la Mutualidad «será el Vicepresidente primero». El titular de la Secretaría de Estado de Función Pública es el Presidente. El Secretario general actúa como Secretario, con voz pero sin voto. Los representantes de los funcionarios eligen entre ellos al Vicepresidente segundo, no al primero."
  citation: "art. 5.1 RD 577/1997"
  difficulty: 2
  tags:
  - "órgano"
  - "composición"
# anchor: boe-a-1997-9874-art-5
- id: m04-l07-q028
  prompt:
    es: "Conforme al artículo 5.1 del Estatuto de la Mutualidad General de Funcionarias y Funcionarios Civiles del Estado, O.A., aprobado por el Real Decreto 577/1997, de 18 de abril, por parte de los funcionarios forman parte del Consejo General:"
  options:
  - id: a
    text:
      es: "Siete representantes designados por los sindicatos presentes en la Mesa General de Negociación de la Administración General del Estado"
  - id: b
    correct: true
    text:
      es: "Nueve representantes designados por los sindicatos presentes en la Mesa General de Negociación de la Administración General del Estado"
  - id: c
    text:
      es: "Nueve representantes elegidos directamente por los mutualistas en votación convocada por la Mutualidad"
  - id: d
    text:
      es: "Nueve representantes designados por las Juntas de Personal de los departamentos ministeriales"
  explanation:
    es: "El artículo 5.1.b) da a los funcionarios «nueve representantes designados por los sindicatos presentes en la Mesa General de Negociación de la Administración General del Estado». Siete es el número de representantes de la Administración Civil del Estado. No los eligen los mutualistas en votación ni los designan las Juntas de Personal."
  citation: "art. 5.1 RD 577/1997"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-2000-12140-art-15
- id: m04-l07-q029
  prompt:
    es: "¿A quién dispensa la asistencia sanitaria el mutualismo administrativo de los funcionarios civiles del Estado?"
  options:
  - id: a
    text:
      es: "Solo a los mutualistas en servicio activo y a los beneficiarios que tengan a su cargo"
  - id: b
    text:
      es: "A los mutualistas incluidos en este Régimen especial, con exclusión de los jubilados mutualistas"
  - id: c
    text:
      es: "A los mutualistas y a los jubilados mutualistas, sin extenderse a sus beneficiarios"
  - id: d
    correct: true
    text:
      es: "A los mutualistas del Régimen especial y a los jubilados mutualistas, y a los beneficiarios de ambos"
  explanation:
    es: "El artículo 15.1 dice que la asistencia sanitaria «se dispensará a todos los mutualistas incluidos en el ámbito de aplicación de este Régimen especial y jubilados mutualistas, así como a los beneficiarios de ambos». No se limita al servicio activo. Incluye a los jubilados y a los beneficiarios."
  citation: "art. 15.1 RDL 4/2000"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2000-12140-art-17
- id: m04-l07-q030
  prompt:
    es: "¿De qué forma facilita la MUFACE la asistencia sanitaria a los mutualistas del régimen especial de los funcionarios civiles del Estado y a sus beneficiarios?"
  options:
  - id: a
    correct: true
    text:
      es: "Directamente o por concierto con otras entidades o establecimientos públicos o privados"
  - id: b
    text:
      es: "Solo por concierto con instituciones de la Seguridad Social, sin otras entidades"
  - id: c
    text:
      es: "Solo directamente, con los medios propios de la Mutualidad y sin conciertos"
  - id: d
    text:
      es: "Por concierto con entidades privadas, con exclusión de las entidades públicas"
  explanation:
    es: "El artículo 17.1 dice que la asistencia se facilita «bien directamente o por concierto con otras entidades o establecimientos públicos o privados». Las instituciones de la Seguridad Social son solo las preferidas para los conciertos, no las únicas. La Mutualidad no está limitada a sus medios propios ni a las entidades privadas."
  citation: "art. 17.1 RDL 4/2000"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2000-12140-art-19
- id: m04-l07-q031
  prompt:
    es: "¿Cuál de los siguientes es requisito, según el artículo 19.1 del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, para que un funcionario esté en situación de incapacidad temporal?"
  options:
  - id: a
    text:
      es: "Acreditar un período previo de cotización a la MUFACE de al menos seis meses"
  - id: b
    correct: true
    text:
      es: "Recibir la asistencia sanitaria de la MUFACE y haber obtenido licencia por enfermedad"
  - id: c
    text:
      es: "Llevar más de tres meses de ausencia continuada a su puesto de trabajo habitual"
  - id: d
    text:
      es: "Contar con un dictamen de las Unidades Médicas de Seguimiento de la MUFACE"
  explanation:
    es: "El artículo 19.1 exige que el funcionario reciba «la asistencia sanitaria necesaria para su recuperación facilitada por la Mutualidad» y que haya «obtenido licencia por enfermedad». Los seis meses de cotización son requisito del subsidio, no de la situación (artículo 95.1 del Reglamento). Los tres meses marcan el paso al subsidio, no el inicio de la situación. El seguimiento de las Unidades Médicas es potestativo."
  citation: "art. 19.1 RDL 4/2000"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2000-12140-art-19
- id: m04-l07-q032
  prompt:
    es: "¿A quién corresponde conceder las licencias por enfermedad, y sus posibles prórrogas, al funcionario mutualista de la MUFACE en incapacidad temporal?"
  options:
  - id: a
    text:
      es: "A la Dirección de la MUFACE, previo informe de sus propios servicios médicos"
  - id: b
    text:
      es: "A las Unidades Médicas de Seguimiento de las que disponga la propia MUFACE"
  - id: c
    correct: true
    text:
      es: "A los órganos administrativos con competencia en materias de gestión de personal"
  - id: d
    text:
      es: "Al Instituto Nacional de la Seguridad Social, a propuesta de la MUFACE"
  explanation:
    es: "El artículo 19.3 atribuye la concesión de las licencias y sus prórrogas «a los órganos administrativos con competencia en materias de gestión de personal». La MUFACE puede hacer el control y seguimiento con sus Unidades Médicas (artículo 19.4), pero no concede la licencia. El Instituto Nacional de la Seguridad Social no interviene en esa concesión."
  citation: "art. 19.3 RDL 4/2000"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2003-7527-art-90
- id: m04-l07-q033
  prompt:
    es: "Según el artículo 90.4 del Reglamento General del Mutualismo Administrativo, aprobado por el Real Decreto 375/2003, de 28 de marzo, la concesión de la licencia inicial reconoce la incapacidad temporal con efectos:"
  options:
  - id: a
    text:
      es: "Desde el cuarto día de la ausencia al puesto de trabajo"
  - id: b
    text:
      es: "Desde la fecha de la resolución que concede la licencia"
  - id: c
    correct: true
    text:
      es: "Desde el primer día de la ausencia al puesto de trabajo"
  - id: d
    text:
      es: "Desde el día siguiente al de presentación del parte de baja"
  explanation:
    es: "El artículo 90.4 dice que la licencia inicial supone el reconocimiento de la incapacidad temporal «con efectos desde el primer día de la ausencia al puesto de trabajo». No espera al cuarto día ni a la fecha de la resolución. Tampoco al día siguiente al parte de baja."
  citation: "art. 90.4 RD 375/2003"
  difficulty: 2
  tags:
  - "fecha"
  - "efecto"
# anchor: boe-a-2000-12140-art-20
- id: m04-l07-q034
  prompt:
    es: "¿Qué régimen fija la duración y la extinción de la incapacidad temporal de los funcionarios mutualistas de la MUFACE?"
  options:
  - id: a
    text:
      es: "El que fije en cada caso la licencia del órgano de personal, sin límite máximo"
  - id: b
    correct: true
    text:
      es: "El del Régimen General de la Seguridad Social, con ciertas particularidades"
  - id: c
    text:
      es: "El del Régimen de Clases Pasivas del Estado, con sus particularidades"
  - id: d
    text:
      es: "El que establezca cada año la Ley de Presupuestos Generales del Estado"
  explanation:
    es: "El artículo 20.1 del texto refundido dice que la duración y extinción «serán las previstas para el Régimen General de la Seguridad Social con las particularidades» de los apartados siguientes. No hay duración sin límite. El Régimen de Clases Pasivas da pensiones, no regula la incapacidad temporal. La Ley de Presupuestos no fija esa duración."
  citation: "art. 20.1 RDL 4/2000"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2000-12140-art-21
- id: m04-l07-q035
  prompt:
    es: "Conforme al artículo 21.1 del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, durante los tres primeros meses de incapacidad temporal el mutualista tiene derecho a percibir:"
  options:
  - id: a
    correct: true
    text:
      es: "La totalidad de sus retribuciones, a cargo de los órganos de personal correspondientes"
  - id: b
    text:
      es: "Las retribuciones básicas y un subsidio por incapacidad temporal a cargo de la MUFACE"
  - id: c
    text:
      es: "El 75 por ciento de sus retribuciones, a cargo de la MUFACE"
  - id: d
    text:
      es: "Las retribuciones básicas, a cargo de los órganos de personal, sin las complementarias"
  explanation:
    es: "El párrafo final del artículo 21.1 dice que durante los tres primeros meses el mutualista tiene derecho a «la totalidad de las retribuciones», «a cargo de los órganos de personal correspondientes». Las retribuciones básicas con subsidio de la MUFACE son lo que cobra desde el cuarto mes. El 75 por ciento es uno de los cálculos del subsidio. No pierde las complementarias en esos tres meses."
  citation: "art. 21.1 RDL 4/2000"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2000-12140-art-21
- id: m04-l07-q036
  prompt:
    es: "Según el artículo 21.1.b) del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, desde el cuarto mes de incapacidad temporal el funcionario percibe:"
  options:
  - id: a
    text:
      es: "La totalidad de sus retribuciones, a cargo de los órganos de personal correspondientes"
  - id: b
    text:
      es: "Un subsidio a cargo de la MUFACE, sin retribuciones básicas ni complementarias del órgano"
  - id: c
    text:
      es: "Las retribuciones básicas y complementarias, sin ningún subsidio a cargo de la MUFACE"
  - id: d
    correct: true
    text:
      es: "Las retribuciones básicas, la prestación por hijo a cargo, en su caso, y un subsidio a cargo de la MUFACE"
  explanation:
    es: "El artículo 21.1.b) dice que desde el cuarto mes percibe «las retribuciones básicas, la prestación por hijo a cargo, en su caso, y un subsidio por incapacidad temporal a cargo de la Mutualidad». La totalidad de las retribuciones es lo de los tres primeros meses. No pierde las básicas, que siguen. Las complementarias dejan de pagarse y entra el subsidio."
  citation: "art. 21.1.b) RDL 4/2000"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2000-12140-art-21
- id: m04-l07-q037
  prompt:
    es: "Una funcionaria mutualista de la MUFACE, con más de seis meses cotizados, lleva cinco meses en incapacidad temporal por enfermedad común. Durante ese quinto mes percibe:"
  options:
  - id: a
    text:
      es: "El 75 por ciento de sus retribuciones complementarias, sin las básicas"
  - id: b
    correct: true
    text:
      es: "Las retribuciones básicas y el subsidio por incapacidad temporal de la MUFACE"
  - id: c
    text:
      es: "Solo sus retribuciones básicas, sin ningún subsidio a cargo de la MUFACE"
  - id: d
    text:
      es: "Un subsidio de la MUFACE igual al 100 por ciento de las complementarias"
  explanation:
    es: "Está en el quinto mes, así que se aplica el artículo 21.1.b): «desde el cuarto mes percibirá las retribuciones básicas» y el subsidio a cargo de la MUFACE. El 75 por ciento de las complementarias es una de las dos cantidades para calcular el subsidio, y las básicas no se pierden. El subsidio del 100 por ciento es el de la donación de órganos y el del riesgo durante el embarazo, no el de la enfermedad común."
  citation: "art. 21.1.b) RDL 4/2000"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2000-12140-art-21
- id: m04-l07-q038
  prompt:
    es: "Según el artículo 21.1.b) del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, el 80 por ciento que sirve para calcular el subsidio por incapacidad temporal se aplica a:"
  options:
  - id: a
    text:
      es: "Las retribuciones básicas y complementarias devengadas en el tercer mes de licencia, sin paga extraordinaria"
  - id: b
    text:
      es: "Las retribuciones básicas del primer mes de licencia, sin parte de la paga extraordinaria"
  - id: c
    text:
      es: "Las retribuciones complementarias devengadas en el cuarto mes de licencia, con la sexta parte de una paga"
  - id: d
    correct: true
    text:
      es: "Las retribuciones básicas, incrementadas en la sexta parte de una paga extraordinaria, del tercer mes de licencia"
  explanation:
    es: "La primera cantidad del artículo 21.1.b) es «el 80 por ciento de las retribuciones básicas (sueldo, trienios y grado, en su caso), incrementadas en la sexta parte de una paga extraordinaria, correspondientes al tercer mes de licencia». No suma las complementarias, que tienen su propio cálculo. El mes de referencia es el tercero, no el primero ni el cuarto."
  citation: "art. 21.1.b) RDL 4/2000"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2000-12140-art-21
- id: m04-l07-q039
  prompt:
    es: "Según el artículo 21.1.b) del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, la segunda de las cantidades que sirven para fijar el subsidio por incapacidad temporal es:"
  options:
  - id: a
    text:
      es: "El 75 por ciento de las retribuciones complementarias devengadas en el primer mes de licencia"
  - id: b
    text:
      es: "El 75 por ciento de la totalidad de las retribuciones percibidas en el tercer mes de licencia"
  - id: c
    correct: true
    text:
      es: "El 75 por ciento de las retribuciones complementarias devengadas en el tercer mes de licencia"
  - id: d
    text:
      es: "El 100 por ciento de las retribuciones complementarias devengadas en el tercer mes de licencia"
  explanation:
    es: "La segunda cantidad del artículo 21.1.b) es «el 75 por ciento de las retribuciones complementarias devengadas en el tercer mes de licencia». El mes es el tercero, no el primero. Se aplica a las complementarias, no a todas las retribuciones. El 100 por ciento es el subsidio de la donación de órganos (artículo 21.1.c) y del riesgo durante el embarazo (artículo 22.4)."
  citation: "art. 21.1.b) RDL 4/2000"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2003-7527-art-95
- id: m04-l07-q040
  prompt:
    es: "Según el artículo 95.1 del Reglamento General del Mutualismo Administrativo, aprobado por el Real Decreto 375/2003, de 28 de marzo, para ser beneficiario del subsidio por incapacidad temporal el mutualista debe acreditar un período de cotización de:"
  options:
  - id: a
    correct: true
    text:
      es: "Seis meses, salvo que tenga cubierta la contingencia por otro régimen por la misma relación de servicios"
  - id: b
    text:
      es: "Tres meses, salvo que tenga cubierta la contingencia por otro régimen por la misma relación de servicios"
  - id: c
    text:
      es: "Doce meses, salvo que tenga cubierta la contingencia por otro régimen por la misma relación de servicios"
  - id: d
    text:
      es: "Seis meses en todo caso, aunque tenga cubierta la contingencia por otro régimen"
  explanation:
    es: "El artículo 95.1 exige «un período de cotización de seis meses, salvo que tengan cubierta esta contingencia por otro régimen de Seguridad Social, organismo o institución, por la misma relación de servicios». Tres y doce meses no son la cifra del artículo. La excepción existe, así que no se exige en todo caso."
  citation: "art. 95.1 RD 375/2003"
  difficulty: 3
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-2003-7527-art-95
- id: m04-l07-q041
  prompt:
    es: "¿Desde cuándo tiene derecho el funcionario mutualista de la MUFACE al subsidio por incapacidad temporal?"
  options:
  - id: a
    correct: true
    text:
      es: "A partir del día en que finaliza el plazo de tres meses desde el inicio de la incapacidad temporal"
  - id: b
    text:
      es: "A partir del día en que finaliza el plazo de un mes desde el inicio de la incapacidad temporal"
  - id: c
    text:
      es: "A partir del día en que finaliza el plazo de seis meses desde el inicio de la incapacidad temporal"
  - id: d
    text:
      es: "Desde el primer día de la ausencia al puesto de trabajo"
  explanation:
    es: "El artículo 95.2 dice que el derecho «nace a partir del día en que finalice el plazo de tres meses desde el inicio de la situación de incapacidad temporal». Un mes y seis meses no son el plazo del artículo. El primer día de ausencia es la fecha de efectos de la licencia inicial, no la del subsidio."
  citation: "art. 95.2 RD 375/2003"
  difficulty: 2
  tags:
  - "plazo"
  - "fecha"
# anchor: boe-a-2000-12140-art-21
- id: m04-l07-q042
  prompt:
    es: "Según el artículo 21.1.c) del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, en la incapacidad temporal por donación de órganos o tejidos para su trasplante, el subsidio de la MUFACE es igual al:"
  options:
  - id: a
    text:
      es: "80 por ciento de las retribuciones básicas correspondientes al tercer mes de licencia"
  - id: b
    correct: true
    text:
      es: "100 por ciento de las retribuciones complementarias devengadas desde el tercer mes de licencia"
  - id: c
    text:
      es: "75 por ciento de las retribuciones complementarias devengadas desde el tercer mes de licencia"
  - id: d
    text:
      es: "100 por ciento de las retribuciones básicas y complementarias del primer mes de licencia"
  explanation:
    es: "El artículo 21.1.c) fija para esta situación especial «una cuantía igual al 100 por ciento de las retribuciones complementarias devengadas desde el tercer mes de licencia». El 80 por ciento de las básicas y el 75 por ciento de las complementarias son las dos cantidades del subsidio general de la letra b). El artículo no toma las básicas ni el primer mes."
  citation: "art. 21.1.c) RDL 4/2000"
  difficulty: 3
  tags:
  - "cantidad"
  - "excepción"
# anchor: boe-a-2000-12140-art-22
- id: m04-l07-q043
  prompt:
    es: "¿Con cuál de las siguientes situaciones se equiparan, en el mutualismo administrativo de los funcionarios civiles del Estado, el riesgo durante el embarazo y el riesgo durante la lactancia natural?"
  options:
  - id: a
    text:
      es: "La incapacidad temporal derivada de enfermedad común"
  - id: b
    text:
      es: "La incapacidad temporal derivada de accidente no laboral o común"
  - id: c
    correct: true
    text:
      es: "La incapacidad temporal derivada de enfermedad profesional"
  - id: d
    text:
      es: "Los permisos por nacimiento, adopción o acogimiento"
  explanation:
    es: "El artículo 22.1 dice que tienen «la misma consideración que la situación de incapacidad temporal derivada de enfermedad profesional». Por eso no requieren período de carencia. No se asimilan a la enfermedad común ni al accidente no laboral. Los permisos por nacimiento, adopción o acogimiento son otra figura, que el artículo 18.2 separa de la incapacidad temporal."
  citation: "art. 22.1 RDL 4/2000"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2000-12140-art-22
- id: m04-l07-q044
  prompt:
    es: "Según el artículo 22.1 del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, ¿hasta qué edad del hijo cubre la situación de riesgo durante la lactancia natural?"
  options:
  - id: a
    text:
      es: "Hijos menores de seis meses"
  - id: b
    text:
      es: "Hijos menores de quince meses"
  - id: c
    text:
      es: "Hijos menores de dieciocho meses"
  - id: d
    correct: true
    text:
      es: "Hijos menores de nueve meses"
  explanation:
    es: "El artículo 22.1 se refiere al riesgo durante la lactancia natural «de hijos menores de 9 meses». Seis, quince y dieciocho meses no son la edad que fija el artículo."
  citation: "art. 22.1 RDL 4/2000"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2000-12140-art-22
- id: m04-l07-q045
  prompt:
    es: "Según el artículo 22.2 del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, la concesión de las licencias por riesgo durante la lactancia natural y de sus posibles prórrogas corresponde:"
  options:
  - id: a
    text:
      es: "A los servicios de prevención de riesgos laborales del propio departamento"
  - id: b
    text:
      es: "A la inspección médica del Instituto Nacional de la Seguridad Social"
  - id: c
    correct: true
    text:
      es: "A los órganos administrativos con competencia en materias de gestión de personal"
  - id: d
    text:
      es: "Al servicio de salud de la Comunidad Autónoma en que resida la funcionaria"
  explanation:
    es: "El artículo 22.2 dice que la concesión de las licencias por riesgo durante el embarazo o durante la lactancia natural y sus prórrogas «corresponderá a los órganos administrativos con competencia en materias de gestión de personal». Los servicios de prevención, la inspección médica del Instituto Nacional de la Seguridad Social y el servicio de salud autonómico no conceden esas licencias."
  citation: "art. 22.2 RDL 4/2000"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2000-12140-art-22
- id: m04-l07-q047
  prompt:
    es: "De acuerdo con el artículo 22.4 del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, en la situación de riesgo durante el embarazo el subsidio a cargo de la MUFACE es igual al:"
  options:
  - id: a
    text:
      es: "80 por ciento de las retribuciones básicas correspondientes al tercer mes de licencia"
  - id: b
    correct: true
    text:
      es: "100 por ciento de las retribuciones complementarias devengadas en el tercer mes de licencia"
  - id: c
    text:
      es: "75 por ciento de las retribuciones complementarias devengadas en el tercer mes de licencia"
  - id: d
    text:
      es: "100 por ciento de las retribuciones básicas y complementarias del primer mes de licencia"
  explanation:
    es: "El artículo 22.4 fija un subsidio «en cuantía igual al 100 por ciento de las retribuciones complementarias devengadas en el tercer mes de licencia». El 80 por ciento de las básicas y el 75 por ciento de las complementarias son las cantidades del subsidio general del artículo 21.1.b). El artículo no toma las básicas ni el primer mes."
  citation: "art. 22.4 RDL 4/2000"
  difficulty: 2
  tags:
  - "cantidad"
