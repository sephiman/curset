# anchor: boe-a-2017-12902-art-62
- id: m03-l04-q029
  prompt:
    es: "¿En cuál de los siguientes contratos ejerce el Director Facultativo las facultades del responsable del contrato, según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "En los contratos de suministro."
  - id: b
    correct: true
    text:
      es: "En los contratos de obras."
  - id: c
    text:
      es: "En los contratos de servicios."
  - id: d
    text:
      es: "En los contratos de concesión de servicios."
  explanation:
    es: "El artículo 62.2 LCSP dice: «En los contratos de obras, las facultades del responsable del contrato serán ejercidas por el Director Facultativo». En los contratos de servicios y de suministro rige la regla general del artículo 62.1: el órgano de contratación designa un responsable del contrato. En las concesiones, el artículo 62.3 prevé que la Administración designe una persona que actúe en defensa del interés general, no un Director Facultativo."
  citation: "art. 62.2 LCSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2017-12902-art-323
- id: m03-l04-q030
  prompt:
    es: "Según el artículo 323.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿quiénes son los órganos de contratación de la Administración General del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Los Ministros y los Secretarios de Estado."
  - id: b
    text:
      es: "Los Ministros y los Subsecretarios."
  - id: c
    text:
      es: "Los Secretarios de Estado y los Directores generales."
  - id: d
    text:
      es: "Los Subsecretarios y los Secretarios generales técnicos."
  explanation:
    es: "El artículo 323.1 LCSP dice: «Los Ministros y los Secretarios de Estado son los órganos de contratación de la Administración General del Estado». Los Subsecretarios, los Directores generales y los Secretarios generales técnicos no lo son por ley; solo pueden contratar si se les delega la competencia."
  citation: "art. 323.1 LCSP"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2017-12902-art-229
- id: m03-l04-q031
  prompt:
    es: "¿A qué órgano está adscrita la Junta de Contratación Centralizada, órgano de contratación del sistema estatal de contratación centralizada?"
  options:
  - id: a
    text:
      es: "A la Oficina Independiente de Regulación y Supervisión de la Contratación."
  - id: b
    correct: true
    text:
      es: "A la Dirección General de Racionalización y Centralización de la Contratación."
  - id: c
    text:
      es: "A la Dirección General del Patrimonio del Estado."
  - id: d
    text:
      es: "A la Intervención General de la Administración del Estado."
  explanation:
    es: "El artículo 229.5 LCSP dice que la Junta de Contratación Centralizada está «adscrita a la Dirección General de Racionalización y Centralización de la Contratación». Ni la Dirección General del Patrimonio del Estado ni la Intervención General de la Administración del Estado aparecen en el precepto. La Oficina Independiente de Regulación y Supervisión de la Contratación supervisa la contratación; la Junta no depende de ella."
  citation: "art. 229.5 LCSP"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2017-12902-art-65
- id: m03-l04-q032
  prompt:
    es: "¿Cuál de los siguientes es uno de los requisitos que la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público exige a quienes quieran contratar con el sector público?"
  options:
  - id: a
    correct: true
    text:
      es: "No estar incursos en alguna prohibición de contratar."
  - id: b
    text:
      es: "Haber celebrado otro contrato público en los tres últimos años."
  - id: c
    text:
      es: "Tener su domicilio social en territorio español."
  - id: d
    text:
      es: "Tener la nacionalidad española o la de otro Estado de la Unión Europea."
  explanation:
    es: "El artículo 65.1 LCSP exige plena capacidad de obrar, no estar incursas «en alguna prohibición de contratar» y acreditar la solvencia o, cuando la ley lo pida, la clasificación. No exige una nacionalidad concreta: pueden contratar personas «españolas o extranjeras». Tampoco exige domicilio en España ni haber contratado antes con el sector público."
  citation: "art. 65.1 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-66
- id: m03-l04-q034
  prompt:
    es: "Según el artículo 66.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, las personas jurídicas solo podrán ser adjudicatarias de contratos cuyas prestaciones estén comprendidas dentro de:"
  options:
  - id: a
    text:
      es: "Las actividades que hayan desarrollado de forma efectiva durante los cinco últimos años."
  - id: b
    text:
      es: "El ámbito territorial de la comunidad autónoma en la que tengan su domicilio social."
  - id: c
    text:
      es: "Los grupos y subgrupos en los que hayan obtenido la clasificación como contratistas."
  - id: d
    correct: true
    text:
      es: "Los fines, objeto o ámbito de actividad que, según sus estatutos o reglas fundacionales, les sean propios."
  explanation:
    es: "El artículo 66.1 LCSP limita a las personas jurídicas a contratos cuyas prestaciones estén dentro de «los fines, objeto o ámbito de actividad que, a tenor de sus estatutos o reglas fundacionales, les sean propios». La clasificación es un medio de acreditar la solvencia (art. 65.1), no el límite de este artículo. La experiencia de los cinco últimos años y el ámbito territorial del domicilio no figuran en el precepto."
  citation: "art. 66.1 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-88
- id: m03-l04-q035
  prompt:
    es: "Conforme al artículo 88.1.a) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, la solvencia técnica en los contratos de obras puede acreditarse con la relación de las obras ejecutadas en el curso de:"
  options:
  - id: a
    text:
      es: "Los cuatro últimos años, avalada por certificados de buena ejecución."
  - id: b
    text:
      es: "Los dos últimos años, avalada por certificados de buena ejecución."
  - id: c
    correct: true
    text:
      es: "Los cinco últimos años, avalada por certificados de buena ejecución."
  - id: d
    text:
      es: "Los tres últimos años, avalada por certificados de buena ejecución."
  explanation:
    es: "El artículo 88.1.a) LCSP habla de la «relación de las obras ejecutadas en el curso de los cinco últimos años, avalada por certificados de buena ejecución». Los periodos de dos, tres y cuatro años no figuran en el precepto, que solo prevé ampliar el periodo a diez años cuando lo exija la competencia."
  citation: "art. 88.1.a) LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2017-12902-art-88
- id: m03-l04-q036
  prompt:
    es: "Según el artículo 88.1.a) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, cuando sea necesario para garantizar un nivel adecuado de competencia, ¿qué obras pueden tenerse en cuenta para acreditar la solvencia técnica?"
  options:
  - id: a
    correct: true
    text:
      es: "Las obras pertinentes ejecutadas en los últimos diez años."
  - id: b
    text:
      es: "Las obras pertinentes ejecutadas en los últimos siete años."
  - id: c
    text:
      es: "Las obras pertinentes ejecutadas en los últimos ocho años."
  - id: d
    text:
      es: "Las obras pertinentes ejecutadas en los últimos quince años."
  explanation:
    es: "El artículo 88.1.a) LCSP permite que, «cuando sea necesario para garantizar un nivel adecuado de competencia», los poderes adjudicadores indiquen que se tendrán en cuenta «las pruebas de las obras pertinentes ejecutadas en los últimos diez años». Los periodos de siete, ocho y quince años no aparecen en el precepto."
  citation: "art. 88.1.a) LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2017-12902-art-29
- id: m03-l04-q037
  prompt:
    es: "De acuerdo con el artículo 29.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, la prórroga acordada por el órgano de contratación es obligatoria para el empresario siempre que el preaviso se produzca:"
  options:
  - id: a
    text:
      es: "Al menos con quince días de antelación a la finalización del contrato, salvo que el pliego de cláusulas fije otro mayor."
  - id: b
    text:
      es: "Al menos con dos meses de antelación a la finalización del contrato, sin que el pliego pueda fijar otro."
  - id: c
    text:
      es: "Al menos con un mes de antelación a la finalización del contrato, salvo que el pliego establezca uno mayor."
  - id: d
    correct: true
    text:
      es: "Al menos con dos meses de antelación a la finalización del contrato, salvo que el pliego establezca uno mayor."
  explanation:
    es: "El artículo 29.2 LCSP dice que la prórroga «será obligatoria para el empresario, siempre que su preaviso se produzca al menos con dos meses de antelación a la finalización del plazo de duración del contrato, salvo que en el pliego que rija el contrato se establezca uno mayor». Las opciones de un mes y de quince días acortan el plazo legal. La que impide al pliego fijar otro plazo suprime la salvedad del pliego, que puede exigir uno mayor."
  citation: "art. 29.2 LCSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-29
- id: m03-l04-q038
  prompt:
    es: "Señale la respuesta correcta sobre la prórroga de los contratos, según el artículo 29.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público:"
  options:
  - id: a
    correct: true
    text:
      es: "En ningún caso puede producirse la prórroga por el consentimiento tácito de las partes."
  - id: b
    text:
      es: "La prórroga se entiende acordada si el órgano de contratación no se pronuncia antes del vencimiento."
  - id: c
    text:
      es: "La prórroga la acuerda el contratista, que debe preavisar al órgano de contratación con dos meses."
  - id: d
    text:
      es: "La prórroga es siempre voluntaria para el empresario, aunque se le preavise dentro de plazo."
  explanation:
    es: "El artículo 29.2 LCSP dice: «En ningún caso podrá producirse la prórroga por el consentimiento tácito de las partes». Por eso la prórroga no se entiende acordada por el silencio del órgano de contratación. Quien la acuerda es el órgano de contratación, no el contratista. Y es obligatoria para el empresario si se le preavisa al menos con dos meses de antelación, salvo la demora en el pago de más de seis meses."
  citation: "art. 29.2 LCSP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2017-12902-art-29
- id: m03-l04-q039
  prompt:
    es: "Según el artículo 29.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿en qué caso deja de ser obligatoria para el contratista la prórroga acordada por el órgano de contratación?"
  options:
  - id: a
    text:
      es: "Cuando la Administración se haya demorado en el abono del precio más de cuatro meses."
  - id: b
    text:
      es: "Cuando la Administración se haya demorado en el abono del precio más de tres meses."
  - id: c
    correct: true
    text:
      es: "Cuando la Administración se haya demorado en el abono del precio más de seis meses."
  - id: d
    text:
      es: "Cuando la Administración se haya demorado en el abono del precio más de ocho meses."
  explanation:
    es: "El artículo 29.2 LCSP dice que la prórroga «no será obligatoria para el contratista» cuando se dé la causa de resolución del artículo 198.6 «por haberse demorado la Administración en el abono del precio más de seis meses». Las demoras de tres, cuatro y ocho meses no son la cifra legal."
  citation: "art. 29.2 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2017-12902-art-29
- id: m03-l04-q040
  prompt:
    es: "En la prórroga de los contratos del sector público, quedan exceptuados de la obligación de preaviso al empresario:"
  options:
  - id: a
    correct: true
    text:
      es: "Los contratos cuya duración sea inferior a dos meses."
  - id: b
    text:
      es: "Los contratos menores de duración inferior a un año."
  - id: c
    text:
      es: "Los contratos de suministro de prestación sucesiva."
  - id: d
    text:
      es: "Los contratos que se tramiten por urgencia."
  explanation:
    es: "El artículo 29.2 LCSP dice: «Quedan exceptuados de la obligación de preaviso los contratos cuya duración fuera inferior a dos meses». Los contratos menores no admiten prórroga (art. 29.8), así que no son una excepción al preaviso. Los suministros de prestación sucesiva y los contratos tramitados por urgencia siguen la regla general del preaviso."
  citation: "art. 29.2 LCSP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2017-12902-art-29
- id: m03-l04-q041
  prompt:
    es: "Un ministerio celebra un contrato de servicios de mantenimiento, de prestación sucesiva, con una duración inicial de tres años. Con carácter general, ¿cuánto tiempo de prórroga puede acordarse como máximo?"
  options:
  - id: a
    text:
      es: "Un año en total, sumadas todas las prórrogas."
  - id: b
    text:
      es: "Tres años en total, sumadas todas las prórrogas."
  - id: c
    correct: true
    text:
      es: "Dos años en total, sumadas todas las prórrogas."
  - id: d
    text:
      es: "Cinco años en total, sumadas todas las prórrogas."
  explanation:
    es: "El artículo 29.4 LCSP fija para los servicios de prestación sucesiva «un plazo máximo de duración de cinco años, incluyendo las posibles prórrogas». Con tres años iniciales, las prórrogas pueden sumar como máximo dos años. Tres años de prórroga llevarían el contrato a seis. Cinco años de prórroga confunden el máximo total con el de las prórrogas. Limitar la prórroga a un año no tiene base en el precepto."
  citation: "art. 29.4 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-29
- id: m03-l04-q043
  prompt:
    es: "De acuerdo con el artículo 29.8 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, los contratos menores definidos en el apartado primero del artículo 118:"
  options:
  - id: a
    text:
      es: "No pueden durar más de seis meses ni ser objeto de prórroga."
  - id: b
    text:
      es: "No pueden durar más de un año, pero admiten una prórroga por igual plazo."
  - id: c
    correct: true
    text:
      es: "No pueden tener una duración superior a un año ni ser objeto de prórroga."
  - id: d
    text:
      es: "No pueden durar más de dos años, incluidas las posibles prórrogas."
  explanation:
    es: "El artículo 29.8 LCSP dice que los contratos menores «no podrán tener una duración superior a un año ni ser objeto de prórroga». La opción que admite una prórroga contradice la prohibición. Los dos años y los seis meses no son el límite legal."
  citation: "art. 29.8 LCSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-29
- id: m03-l04-q044
  prompt:
    es: "Un organismo necesita un servicio de mantenimiento de jardines con un valor estimado de 10.000 euros y una duración de dos años. ¿Puede tramitarse como contrato menor?"
  options:
  - id: a
    text:
      es: "No, porque un servicio menor no puede superar los 5.000 euros."
  - id: b
    text:
      es: "Sí, porque su valor estimado es inferior a 15.000 euros."
  - id: c
    text:
      es: "Sí, siempre que se divida en dos contratos menores de un año cada uno."
  - id: d
    correct: true
    text:
      es: "No, porque un contrato menor no puede durar más de un año."
  explanation:
    es: "El valor estimado de 10.000 euros cabe en el límite del artículo 118.1 LCSP, pero el artículo 29.8 añade que los contratos menores «no podrán tener una duración superior a un año». Por eso no basta con que el valor sea inferior a 15.000 euros. Dividirlo en dos contratos de un año altera su objeto para eludir las reglas, y el informe del artículo 118.2 debe justificar justo lo contrario. Los 5.000 euros son el límite para no exigir ese informe en pagos por anticipo de caja fija (art. 118.5), no el del servicio menor."
  citation: "art. 29.8 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2017-12902-art-122
- id: m03-l04-q045
  prompt:
    es: "Según el artículo 122.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, los pliegos de cláusulas administrativas particulares deben aprobarse:"
  options:
  - id: a
    text:
      es: "Después de la autorización del gasto y siempre antes de la formalización del contrato."
  - id: b
    text:
      es: "Antes de la licitación, pero solo después del compromiso del gasto."
  - id: c
    text:
      es: "Una vez adjudicado el contrato y antes de que comience su ejecución."
  - id: d
    correct: true
    text:
      es: "Antes de la autorización del gasto o junto con ella, y siempre antes de la licitación del contrato."
  explanation:
    es: "El artículo 122.1 LCSP exige aprobar los pliegos «previamente a la autorización del gasto o conjuntamente con ella, y siempre antes de la licitación del contrato, o de no existir esta, antes de su adjudicación». Aprobarlos después de la autorización del gasto invierte el orden legal. Aprobarlos tras la adjudicación es tarde: deben estar antes de la licitación. El compromiso del gasto es posterior a la autorización, así que esperar a él también contradice el precepto."
  citation: "art. 122.1 LCSP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2017-12902-art-122
- id: m03-l04-q046
  prompt:
    es: "Según el artículo 122.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿por qué causa pueden modificarse los pliegos de cláusulas administrativas particulares después de aprobados?"
  options:
  - id: a
    text:
      es: "Por acuerdo entre el órgano de contratación y los licitadores."
  - id: b
    text:
      es: "Por cualquier causa de interés público debidamente motivada."
  - id: c
    correct: true
    text:
      es: "Solo por error material, de hecho o aritmético."
  - id: d
    text:
      es: "Por error material o por una variación de los precios de mercado."
  explanation:
    es: "El artículo 122.1 LCSP dice que los pliegos «solo podrán ser modificados con posterioridad por error material, de hecho o aritmético», y que en otro caso la modificación conlleva la retroacción de actuaciones. El interés público motivado no está entre esas causas. El acuerdo con los licitadores tampoco. La variación de precios de mercado no es un error material, de hecho o aritmético."
  citation: "art. 122.1 LCSP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2017-12902-art-100
- id: m03-l04-q048
  prompt:
    es: "En la contratación del sector público, el presupuesto base de licitación es el límite máximo de gasto que en virtud del contrato puede comprometer el órgano de contratación:"
  options:
  - id: a
    text:
      es: "Excluidos el Impuesto sobre el Valor Añadido y las eventuales prórrogas."
  - id: b
    text:
      es: "Incluido el Impuesto sobre el Valor Añadido en todo caso, sin excepción."
  - id: c
    text:
      es: "Excluido el Impuesto sobre el Valor Añadido, salvo disposición en contrario."
  - id: d
    correct: true
    text:
      es: "Incluido el Impuesto sobre el Valor Añadido, salvo disposición en contrario."
  explanation:
    es: "El artículo 100.1 LCSP define el presupuesto base de licitación como el límite máximo de gasto «incluido el Impuesto sobre el Valor Añadido, salvo disposición en contrario». Las opciones que lo excluyen confunden el presupuesto base de licitación con el valor estimado, que es el que se calcula sin IVA (art. 101.1.a). La opción «en todo caso, sin excepción» suprime la salvedad de la disposición en contrario."
  citation: "art. 100.1 LCSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-101
- id: m03-l04-q050
  prompt:
    es: "Un contrato de servicios tiene un precio anual de 20.000 euros, IVA excluido, una duración de dos años y una posible prórroga de otros dos. ¿Cuál es su valor estimado?"
  options:
  - id: a
    text:
      es: "Un valor estimado de 48.400 euros."
  - id: b
    correct: true
    text:
      es: "Un valor estimado de 80.000 euros."
  - id: c
    text:
      es: "Un valor estimado de 40.000 euros."
  - id: d
    text:
      es: "Un valor estimado de 96.800 euros."
  explanation:
    es: "El valor estimado se calcula sin IVA (art. 101.1.a LCSP) y tiene en cuenta «las eventuales prórrogas del contrato» (art. 101.2.a). Cuatro años a 20.000 euros dan 80.000 euros. Los 40.000 euros olvidan la prórroga. Los 96.800 euros suman el IVA del 21 por ciento a los 80.000. Los 48.400 euros cometen los dos errores: sin prórroga y con IVA."
  citation: "art. 101.2 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2017-12902-art-118
- id: m03-l04-q054
  prompt:
    es: "De acuerdo con el artículo 118.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, un contrato de suministro se considera contrato menor cuando su valor estimado es:"
  options:
  - id: a
    text:
      es: "Igual o inferior a 15.000 euros, IVA excluido."
  - id: b
    correct: true
    text:
      es: "Inferior a 15.000 euros, IVA excluido."
  - id: c
    text:
      es: "Inferior a 20.000 euros, IVA excluido."
  - id: d
    text:
      es: "Inferior a 40.000 euros, IVA excluido."
  explanation:
    es: "El artículo 118.1 LCSP considera menores los contratos de suministro o de servicios de valor estimado «inferior» a 15.000 euros. La opción «igual o inferior» incluye el contrato de 15.000 euros justos, que ya no es menor. Los 40.000 euros son el límite de las obras. Los 20.000 euros no figuran en el precepto."
  citation: "art. 118.1 LCSP"
  difficulty: 1
  tags:
