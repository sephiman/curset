# anchor: boe-a-2014-12328-art-40
- id: m03-l06-q0078
  prompt:
    es: "Según el artículo 40.3 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, cuando el período impositivo coincide con el año natural, ¿cuándo debe ejercerse la opción por pagar sobre la base imponible de los 3, 9 u 11 primeros meses?"
  options:
  - id: a
    text:
      es: "En la declaración del Impuesto sobre Sociedades del período impositivo anterior, dentro de su plazo."
  - id: b
    text:
      es: "En la declaración censal, durante el mes de enero del año natural a partir del cual deba surtir efectos la opción elegida."
  - id: c
    text:
      es: "En la declaración censal, durante los 2 meses siguientes al inicio del período impositivo."
  - id: d
    correct: true
    text:
      es: "En la declaración censal, durante el mes de febrero del año natural a partir del cual deba surtir efectos."
  explanation:
    es: "Si el período coincide con el año natural, la opción se ejerce en la declaración censal durante el mes de febrero del año a partir del cual deba surtir efectos (artículo 40.3). Enero no es el mes que fija la norma. La declaración del impuesto del período anterior no es el cauce de la opción. Los dos meses desde el inicio del período son el plazo del caso contrario, el de los períodos que no coinciden con el año natural."
  citation: "art. 40.3 LIS"
  difficulty: 2
  tags:
  - "pago fraccionado"
  - "opción"
  - "plazo"
# anchor: boe-a-2014-12328-art-40
- id: m03-l06-q0082
  prompt:
    es: "De acuerdo con el artículo 40.3 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, los contribuyentes cuyo período impositivo no coincida con el año natural realizan el pago fraccionado sobre la parte de la base imponible correspondiente a los días transcurridos desde el inicio del período impositivo hasta:"
  options:
  - id: a
    text:
      es: "el día en que concluye cada uno de los períodos de ingreso del pago fraccionado."
  - id: b
    text:
      es: "el último día de cada trimestre natural comprendido en el período impositivo."
  - id: c
    correct: true
    text:
      es: "el día anterior al inicio de cada uno de los períodos de ingreso del pago fraccionado."
  - id: d
    text:
      es: "el último día del mes anterior a cada uno de los períodos de ingreso del pago fraccionado."
  explanation:
    es: "Con período distinto del año natural, la base son los días transcurridos desde el inicio del período hasta el día anterior al inicio de cada período de ingreso (artículo 40.3). El último día del mes anterior y el último día de cada trimestre natural son referencias que la norma no usa. El día en que concluye el período de ingreso es posterior al corte que fija el apartado."
  citation: "art. 40.3 LIS"
  difficulty: 3
  tags:
  - "pago fraccionado"
  - "modalidad"
# anchor: boe-a-2014-12328-art-40
- id: m03-l06-q0083
  prompt:
    es: "Según el artículo 40.4 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, los porcentajes previstos para el pago fraccionado en los apartados 2 y 3 podrán ser modificados por:"
  options:
  - id: a
    text:
      es: "un acuerdo del Consejo de Ministros."
  - id: b
    text:
      es: "el Reglamento del Impuesto sobre Sociedades."
  - id: c
    correct: true
    text:
      es: "la Ley de Presupuestos Generales del Estado."
  - id: d
    text:
      es: "una orden del Ministerio de Hacienda."
  explanation:
    es: "El artículo 40.4 permite modificar los porcentajes de los apartados 2 y 3 mediante la Ley de Presupuestos Generales del Estado. Una orden ministerial, un reglamento o un acuerdo del Consejo de Ministros tienen un rango o un cauce distinto del que la norma señala."
  citation: "art. 40.4 LIS"
  difficulty: 1
  tags:
  - "pago fraccionado"
  - "porcentaje"
# anchor: boe-a-2014-12328-art-40
- id: m03-l06-q0084
  prompt:
    es: "Señale la respuesta CORRECTA sobre la naturaleza del pago fraccionado del Impuesto sobre Sociedades, de acuerdo con el artículo 40.5 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades:"
  options:
  - id: a
    text:
      es: "El pago fraccionado tiene la consideración de sanción tributaria cuando se ingresa fuera de plazo."
  - id: b
    text:
      es: "El pago fraccionado tiene la consideración de ingreso de derecho privado de la Administración."
  - id: c
    text:
      es: "El pago fraccionado tiene la consideración de obligación accesoria de la liquidación del período."
  - id: d
    correct: true
    text:
      es: "El pago fraccionado tiene la consideración de deuda tributaria."
  explanation:
    es: "El artículo 40.5 dice que el pago fraccionado tiene la consideración de deuda tributaria. No es una sanción, aunque se ingrese tarde. Tampoco una obligación accesoria de la liquidación del período, ya que el pago a cuenta es una obligación autónoma. No es un ingreso de derecho privado, porque nace de la ley tributaria."
  citation: "art. 40.5 LIS"
  difficulty: 1
  tags:
  - "pago fraccionado"
  - "deuda tributaria"
# anchor: boe-a-2014-12328-art-41
- id: m03-l06-q0085
  prompt:
    es: "De acuerdo con el artículo 41 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, cuando las retenciones a cuenta, los ingresos a cuenta y los pagos fraccionados superen el importe de la cuota líquida del impuesto, la Administración tributaria procederá a:"
  options:
  - id: a
    text:
      es: "ingresar el exceso en la cuenta del retenedor."
  - id: b
    correct: true
    text:
      es: "devolver de oficio el exceso."
  - id: c
    text:
      es: "exigir al contribuyente una solicitud previa de devolución."
  - id: d
    text:
      es: "compensar el exceso solo a solicitud del contribuyente."
  explanation:
    es: "Si los pagos a cuenta superan la cuota líquida, o la cuota líquida mínima en su caso, la Administración devuelve de oficio el exceso (artículo 41). No queda condicionado a que el contribuyente lo pida ni a una solicitud previa de devolución. El exceso se devuelve al contribuyente, no se ingresa en la cuenta del retenedor."
  citation: "art. 41 LIS"
  difficulty: 1
  tags:
  - "pagos a cuenta"
  - "devolución"
# anchor: boe-a-2014-12328-da-decimocuarta
- id: m03-l06-q0086
  prompt:
    es: "Según la disposición adicional decimocuarta.1.b) de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, los contribuyentes cuya cifra de negocios en los 12 meses anteriores sea al menos de 10 millones de euros aplican, en la modalidad del artículo 40.3, el porcentaje que resulte de multiplicar el tipo de gravamen por:"
  options:
  - id: a
    text:
      es: "diecinueve veinteavos, redondeado por defecto."
  - id: b
    text:
      es: "cinco séptimos, redondeado por exceso."
  - id: c
    correct: true
    text:
      es: "diecinueve veinteavos, redondeado por exceso."
  - id: d
    text:
      es: "cinco séptimos, redondeado por defecto."
  explanation:
    es: "Desde 10 millones de euros de cifra de negocios el porcentaje es el tipo de gravamen redondeado por exceso multiplicado por diecinueve veinteavos (disposición adicional decimocuarta.1.b). Cinco séptimos con redondeo por defecto es la regla del artículo 40.3 para quien supera 6 millones. Las otras dos combinaciones mezclan el coeficiente de un régimen con el redondeo del otro."
  citation: "disposición adicional decimocuarta.1.b) LIS"
  difficulty: 3
  tags:
  - "pago fraccionado"
  - "porcentaje"
# anchor: boe-a-2014-12328-da-decimocuarta
- id: m03-l06-q0087
  prompt:
    es: "De acuerdo con la disposición adicional decimocuarta.1.a) de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, la cantidad a ingresar no podrá ser inferior, en ningún caso, al 23 por ciento del resultado positivo de:"
  options:
  - id: a
    text:
      es: "la cuota íntegra del último período impositivo cuyo plazo de declaración estuviese vencido."
  - id: b
    text:
      es: "la base imponible del período impositivo anterior, determinada conforme a esta Ley."
  - id: c
    text:
      es: "la cifra de negocios de los 12 meses anteriores al inicio del período impositivo."
  - id: d
    correct: true
    text:
      es: "la cuenta de pérdidas y ganancias del ejercicio de los 3, 9 u 11 primeros meses de cada año natural."
  explanation:
    es: "El mínimo se calcula sobre el resultado positivo de la cuenta de pérdidas y ganancias del ejercicio de los 3, 9 u 11 primeros meses de cada año natural (disposición adicional decimocuarta.1.a). La base imponible del período anterior y la cuota íntegra del último período vencido son magnitudes de la modalidad general. La cifra de negocios es el umbral que determina quién queda sujeto al mínimo, no la magnitud sobre la que se calcula."
  citation: "disposición adicional decimocuarta.1.a) LIS"
  difficulty: 2
  tags:
  - "pago fraccionado"
  - "mínimo"
# anchor: boe-a-2014-12328-da-decimocuarta
- id: m03-l06-q0089
  prompt:
    es: "Según la disposición adicional decimocuarta.1.a) de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, para los contribuyentes a los que resulte de aplicación el tipo de gravamen del párrafo primero del apartado 6 del artículo 29, el porcentaje mínimo del resultado positivo es del:"
  options:
  - id: a
    correct: true
    text:
      es: "25 por ciento, en lugar del 23 por ciento general."
  - id: b
    text:
      es: "23 por ciento, igual que para el resto de contribuyentes."
  - id: c
    text:
      es: "19 por ciento, igual que el porcentaje de retención sobre premios."
  - id: d
    text:
      es: "30 por ciento, igual que el tipo de gravamen de esos contribuyentes."
  explanation:
    es: "Para los contribuyentes sometidos al tipo de gravamen del párrafo primero del apartado 6 del artículo 29, el porcentaje mínimo es el 25 por ciento en vez del 23 por ciento (disposición adicional decimocuarta.1.a). Mantener el 23 por ciento ignora esa regla especial. El 30 por ciento y el 19 por ciento no son porcentajes de esta disposición."
  citation: "disposición adicional decimocuarta.1.a) LIS"
  difficulty: 2
  tags:
  - "pago fraccionado"
  - "mínimo"
# anchor: boe-a-2014-12328-da-decimocuarta
- id: m03-l06-q0090
  prompt:
    es: "Según la disposición adicional decimocuarta.1.a) de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, ¿a cuál de las siguientes entidades NO resulta aplicable el mínimo del 23 por ciento del resultado positivo?"
  options:
  - id: a
    text:
      es: "A las empresas navieras con la bonificación del artículo 76 de la Ley 19/1994."
  - id: b
    correct: true
    text:
      es: "A las Sociedades Anónimas Cotizadas de Inversión en el Mercado Inmobiliario reguladas en la Ley 11/2009."
  - id: c
    text:
      es: "A las entidades parcialmente exentas del capítulo XIV del título VII de la Ley."
  - id: d
    text:
      es: "A las empresas navieras que tributan por el régimen especial en función del tonelaje."
  explanation:
    es: "El mínimo no se aplica a las entidades de los apartados 3, 4 y 5 del artículo 29, a las Sociedades Anónimas Cotizadas de Inversión en el Mercado Inmobiliario ni a las entidades de capital-riesgo (disposición adicional decimocuarta.1.a). Las navieras con bonificación y las parcialmente exentas sí lo aplican, pero tomando como resultado positivo solo el de las rentas no bonificadas o no exentas. Las navieras en el régimen del tonelaje calculan los pagos sobre la base del artículo 114.1, sin quedar excluidas."
  citation: "disposición adicional decimocuarta.1.a) LIS"
  difficulty: 3
  tags:
  - "pago fraccionado"
  - "mínimo"
  - "exclusión"
# anchor: boe-a-2006-20764-art-99
- id: m03-l06-q0092
  prompt:
    es: "Según el artículo 99.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿están obligadas a practicar retención e ingreso a cuenta las entidades en régimen de atribución de rentas que satisfagan rentas sujetas al impuesto?"
  options:
  - id: a
    text:
      es: "No, salvo que ejerzan actividades económicas a través de la entidad."
  - id: b
    text:
      es: "Sí, pero solo cuando todos sus socios sean personas jurídicas."
  - id: c
    correct: true
    text:
      es: "Sí, porque quedan incluidas expresamente entre las entidades obligadas a practicar retención e ingreso a cuenta."
  - id: d
    text:
      es: "No, porque carecen de personalidad jurídica propia y la obligación de retener recae solo sobre sus socios."
  explanation:
    es: "El artículo 99.2 incluye expresamente a las entidades en atribución de rentas entre las entidades y personas jurídicas que, al satisfacer rentas sujetas, deben retener e ingresar a cuenta. Alegar que no tienen personalidad jurídica propia contradice esa inclusión. La naturaleza de los socios no condiciona la obligación. Tampoco depende de que ejerzan actividades económicas: basta con que satisfagan rentas sujetas."
  citation: "art. 99.2 LIRPF"
  difficulty: 2
  tags:
  - "obligados"
  - "atribución de rentas"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0093
  prompt:
    es: "Señale la respuesta CORRECTA sobre la retención de los premios por la participación en juegos, concursos, rifas o combinaciones aleatorias, de acuerdo con el artículo 101.7 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "El porcentaje es del 19 por ciento, solo cuando los premios estén vinculados a la oferta, promoción o venta de bienes, productos o servicios."
  - id: b
    correct: true
    text:
      es: "El porcentaje es del 19 por ciento, estén o no vinculados los premios a la oferta, promoción o venta de bienes, productos o servicios."
  - id: c
    text:
      es: "El porcentaje es del 15 por ciento, solo cuando los premios no estén vinculados a la oferta, promoción o venta de bienes, productos o servicios."
  - id: d
    text:
      es: "El porcentaje es del 24 por ciento, estén o no vinculados los premios a la oferta, promoción o venta de bienes, productos o servicios."
  explanation:
    es: "El porcentaje es del 19 por ciento tanto si los premios están vinculados a la oferta, promoción o venta de bienes, productos o servicios como si no lo están (artículo 101.7). Limitarlo a los premios vinculados deja fuera los que no lo son. Fijarlo en el 15 por ciento para estos últimos inventa un tipo distinto. El 24 por ciento es el de la cesión del derecho de imagen."
  citation: "art. 101.7 LIRPF"
  difficulty: 2
  tags:
  - "porcentajes"
  - "premios"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0094
  prompt:
    es: "¿Qué porcentaje de retención e ingreso a cuenta corresponde, conforme al artículo 101.5.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, a los rendimientos procedentes de actividades forestales?"
  options:
  - id: a
    text:
      es: "El 19 por ciento de los rendimientos procedentes de actividades forestales."
  - id: b
    text:
      es: "El 7 por ciento de los rendimientos procedentes de actividades forestales."
  - id: c
    text:
      es: "El 15 por ciento de los rendimientos procedentes de actividades forestales."
  - id: d
    correct: true
    text:
      es: "El 2 por ciento de los rendimientos procedentes de actividades forestales."
  explanation:
    es: "Los rendimientos de actividades forestales se retienen al 2 por ciento (artículo 101.5.c). El 7 por ciento es el de ciertas actividades profesionales y de las obras literarias, el 15 por ciento el de las actividades profesionales y de los cursos, y el 19 por ciento el del capital mobiliario o el arrendamiento."
  citation: "art. 101.5.c) LIRPF"
  difficulty: 1
  tags:
  - "porcentajes"
  - "actividades forestales"
# anchor: boe-a-2007-6820-art-111
- id: m03-l06-q0096
  prompt:
    es: "Señale la respuesta CORRECTA sobre los plazos de declaración e ingreso del pago fraccionado de empresarios y profesionales, de acuerdo con el artículo 111.1 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Los cuatro trimestres se declaran e ingresan entre el día 1 y el 20 de abril, julio, octubre y enero."
  - id: b
    text:
      es: "Los tres primeros trimestres se declaran e ingresan entre el día 1 y el 20 de abril, octubre y diciembre, y el cuarto entre el día 1 y el 30 de enero."
  - id: c
    correct: true
    text:
      es: "Los tres primeros trimestres se declaran e ingresan entre el día 1 y el 20 de abril, julio y octubre, y el cuarto trimestre entre el día 1 y el 30 de enero."
  - id: d
    text:
      es: "Los tres primeros trimestres se declaran e ingresan entre el día 1 y el 30 de abril, julio y octubre, y el cuarto entre el día 1 y el 20 de enero."
  explanation:
    es: "Los tres primeros trimestres terminan el día 20 de abril, julio y octubre, y el cuarto el día 30 de enero (artículo 111.1). Unificar los cuatro trimestres en el día 20 de enero ignora que el cuarto tiene diez días más. Invertir los límites, treinta para los tres primeros y veinte para el cuarto, cambia la regla. Abril, octubre y diciembre son los meses del pago fraccionado del Impuesto sobre Sociedades, no los de empresarios y profesionales."
  citation: "art. 111.1 RIRPF"
  difficulty: 2
  tags:
  - "plazo"
  - "pagos fraccionados"
# anchor: boe-a-2014-12328-art-40
- id: m03-l06-q0097
  prompt:
    es: "Según el artículo 40.3 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, cuando el período impositivo no coincide con el año natural, el pago fraccionado sobre la base imponible acumulada es a cuenta de la liquidación correspondiente al período impositivo que esté en curso:"
  options:
  - id: a
    text:
      es: "el primer día del período impositivo al que corresponda el pago."
  - id: b
    correct: true
    text:
      es: "el día anterior al inicio de cada uno de los citados períodos de pago."
  - id: c
    text:
      es: "el último día de cada período de ingreso del pago fraccionado."
  - id: d
    text:
      es: "el día 1 de cada uno de los meses de abril, octubre y diciembre."
  explanation:
    es: "En esta modalidad, para los períodos que no coinciden con el año natural, el pago es a cuenta de la liquidación del período en curso el día anterior al inicio de cada uno de los períodos de pago (artículo 40.3). El día 1 de abril, octubre y diciembre es la referencia de la modalidad general del artículo 40.1. El último día del período de ingreso es posterior a la fecha que fija la norma. El primer día del período impositivo no es el momento al que se refiere el apartado."
  citation: "art. 40.3 LIS"
  difficulty: 3
  tags:
  - "pago fraccionado"
  - "período impositivo"
# anchor: boe-a-2014-12328-art-41
- id: m03-l06-q0098
  prompt:
    es: "Señale la respuesta CORRECTA sobre las retenciones, los ingresos a cuenta y los pagos fraccionados, de acuerdo con el artículo 41 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades:"
  options:
  - id: a
    text:
      es: "Solo son deducibles las retenciones a cuenta, y no los ingresos a cuenta ni los pagos fraccionados."
  - id: b
    text:
      es: "Son deducibles de la base imponible, antes de calcular la cuota íntegra del período."
  - id: c
    text:
      es: "Son deducibles de la cuota líquida, pero no los pagos fraccionados, que se compensan en el período siguiente."
  - id: d
    correct: true
    text:
      es: "Son deducibles de la cuota líquida o, en su caso, de la cuota líquida mínima."
  explanation:
    es: "Las retenciones a cuenta, los ingresos a cuenta y los pagos fraccionados se deducen de la cuota líquida o, en su caso, de la cuota líquida mínima (artículo 41). No se deducen de la base imponible. Los pagos fraccionados no quedan fuera ni se compensan en el período siguiente, porque el precepto los incluye junto a los otros dos conceptos. La deducción no se limita a las retenciones."
  citation: "art. 41 LIS"
  difficulty: 1
  tags:
  - "pagos a cuenta"
  - "deducción"
# anchor: boe-a-2014-12328-art-40
- id: m03-l06-q0100
  prompt:
    es: "Señale la respuesta CORRECTA sobre los umbrales de cifra de negocios que fijan las reglas del pago fraccionado sobre la base imponible de los 3, 9 u 11 primeros meses, según el artículo 40.3 y la disposición adicional decimocuarta de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades:"
  options:
  - id: a
    correct: true
    text:
      es: "Superar 6 millones de euros obliga a aplicar esa modalidad con cinco séptimos del tipo; con al menos 10 millones, se aplican diecinueve veinteavos del tipo redondeado por exceso."
  - id: b
    text:
      es: "Superar 6 millones de euros obliga a aplicar esa modalidad con diecinueve veinteavos del tipo; con al menos 10 millones, se aplican cinco séptimos."
  - id: c
    text:
      es: "Superar 6 millones de euros no obliga a aplicar esa modalidad, que es siempre opcional, y desde 10 millones solo cambia el porcentaje del mínimo."
  - id: d
    text:
      es: "Superar 10 millones de euros obliga a aplicar esa modalidad con cinco séptimos del tipo; con al menos 6 millones, se aplican diecinueve veinteavos."
  explanation:
    es: "Con más de 6 millones de euros la modalidad del artículo 40.3 es obligatoria y el porcentaje es cinco séptimos del tipo redondeado por defecto. Con al menos 10 millones se aplican diecinueve veinteavos del tipo redondeado por exceso, y además la cantidad no puede bajar del 23 por ciento del resultado contable (disposición adicional decimocuarta.1). Invertir los umbrales o los coeficientes altera la regla. La modalidad no es siempre opcional: el artículo 40.3 la impone a quien supera los 6 millones."
  citation: "art. 40.3 LIS"
  difficulty: 3
  tags:
  - "pago fraccionado"
  - "cifra de negocios"
