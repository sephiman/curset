# anchor: fuente-ms-outlook-atajos-html
- id: m06-l07-q345
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué vista es la libreta de direcciones de Outlook, donde se almacenan los contactos personales?"
  options:
  - id: a
    text:
      es: "Copilot"
  - id: b
    text:
      es: "Correo"
  - id: c
    correct: true
    text:
      es: "People"
  - id: d
    text:
      es: "Calendario"
  explanation:
    es: "La vista People es la libreta de direcciones de Outlook. Calendario es la vista de las citas y reuniones. Correo es la vista de los mensajes. Copilot es otra vista que acompaña a Correo, Calendar y People en la barra lateral."
  citation: "fuente: `ms-outlook-atajos.html`; «Métodos abreviados de teclado de Contactos (Personas)»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-atajos-html
- id: m06-l07-q346
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué contenido tiene la vista People, que funciona como libreta de direcciones?"
  options:
  - id: a
    text:
      es: "Solo los miembros de los grupos de Microsoft 365"
  - id: b
    text:
      es: "Solo los contactos personales, sin libretas de la organización"
  - id: c
    text:
      es: "Solo las libretas de direcciones configuradas para la organización"
  - id: d
    correct: true
    text:
      es: "Contactos personales y libretas de direcciones de la organización"
  explanation:
    es: "La vista People guarda los contactos personales y permite abrir cualquier libreta de direcciones configurada para la organización. Que solo tenga contactos personales o solo libretas de la organización contradice esa frase, que cita las dos. Que solo muestre miembros de grupos de Microsoft 365 contradice que almacene los contactos personales."
  citation: "fuente: `ms-outlook-atajos.html`; «Métodos abreviados de teclado de Contactos (Personas)»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-listas-contactos-html
- id: m06-l07-q347
  prompt:
    es: "En Outlook 365, ¿qué es una lista de contactos, según la ayuda de Microsoft sobre crear, editar o eliminar listas?"
  options:
  - id: a
    correct: true
    text:
      es: "Una colección de contactos y direcciones para escribir a un grupo de personas"
  - id: b
    text:
      es: "Una carpeta virtual con los mensajes que cumplen unos criterios"
  - id: c
    text:
      es: "Una bandeja de entrada y un calendario compartidos entre varias personas"
  - id: d
    text:
      es: "Una colección de cuentas y carpetas con sus opciones de envío y recepción"
  explanation:
    es: "Una lista de contactos es una colección de contactos y direcciones de correo útil para enviar mensajes a un grupo de personas. La bandeja y el calendario compartidos son de un grupo de Microsoft 365. La colección de cuentas y carpetas es un grupo de envío y recepción. La carpeta virtual con mensajes es una carpeta de búsqueda."
  citation: "fuente: `ms-outlook-listas-contactos.html`; «Crear, editar o eliminar una lista de contactos (o grupo de contactos) en Outlook»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-listas-contactos-html
- id: m06-l07-q348
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cómo se llama lo que en la versión clásica de Outlook se llama grupo de contactos?"
  options:
  - id: a
    text:
      es: "Carpeta de búsqueda"
  - id: b
    correct: true
    text:
      es: "Lista de contactos"
  - id: c
    text:
      es: "Libreta de direcciones"
  - id: d
    text:
      es: "Grupo de Microsoft 365"
  explanation:
    es: "En el nuevo Outlook, las listas de contactos son lo que en Outlook clásico se llamaba grupos de contactos. Un grupo de Microsoft 365 comparte bandeja, calendario y archivos. La libreta de direcciones es la vista People. La carpeta de búsqueda muestra mensajes que cumplen unos criterios."
  citation: "fuente: `ms-outlook-listas-contactos.html`; «Crear, editar o eliminar una lista de contactos (o grupo de contactos) en Outlook»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-listas-contactos-html
- id: m06-l07-q349
  prompt:
    es: "En Outlook 365 clásico, ¿qué se selecciona en la vista People para crear un grupo de contactos y añadirle miembros?"
  options:
  - id: a
    text:
      es: "Agregar a la lista, y luego Nueva lista de contactos"
  - id: b
    text:
      es: "Nuevo grupo de contactos, y luego Agregar o quitar miembros"
  - id: c
    text:
      es: "Todas las listas de contactos, y luego Agregar miembros"
  - id: d
    correct: true
    text:
      es: "Nuevo grupo de contactos, y luego Agregar miembros"
  explanation:
    es: "En Outlook clásico se selecciona Nuevo grupo de contactos en la cinta, se escribe el nombre y se selecciona Agregar miembros. Agregar a la lista › Nueva lista de contactos es el procedimiento del nuevo Outlook. Todas las listas de contactos también es del nuevo Outlook y sirve para editar. Agregar o quitar miembros es el comando para editar un grupo ya creado."
  citation: "fuente: `ms-outlook-listas-contactos.html`; «Seleccione Nuevo grupo de contactos en la cinta de opciones .»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-listas-contactos-html
- id: m06-l07-q350
  prompt:
    es: "En Outlook 365 clásico, ¿qué ocurre con los contactos al eliminar un grupo de contactos?"
  options:
  - id: a
    text:
      es: "Se eliminan los contactos que no están en otro grupo"
  - id: b
    correct: true
    text:
      es: "No se eliminan los contactos, solo el grupo de contactos"
  - id: c
    text:
      es: "Se mueven a la carpeta Elementos eliminados con el grupo"
  - id: d
    text:
      es: "Se eliminan el grupo y todos sus contactos"
  explanation:
    es: "La ayuda dice que los contactos no se eliminan, solo la lista de contactos. Eliminar el grupo con todos sus contactos, solo los que no estén en otro grupo o llevarlos a Elementos eliminados contradice esa frase."
  citation: "fuente: `ms-outlook-listas-contactos.html`; «Eliminar un grupo de contactos en la versión clásica de Outlook»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-listas-contactos-html
- id: m06-l07-q351
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cómo se crea una lista de contactos a partir de un contacto seleccionado en la vista People?"
  options:
  - id: a
    correct: true
    text:
      es: "Agregar a la lista › Nueva lista de contactos"
  - id: b
    text:
      es: "Nuevo grupo de contactos › Agregar miembros"
  - id: c
    text:
      es: "Nueva carpeta de búsqueda › Contactos"
  - id: d
    text:
      es: "Todas las listas de contactos › Eliminar"
  explanation:
    es: "En el nuevo Outlook se selecciona Agregar a la lista y luego Nueva lista de contactos. Nuevo grupo de contactos más Agregar miembros es el procedimiento de Outlook clásico. Todas las listas de contactos › Eliminar sirve para eliminar una lista. Nueva carpeta de búsqueda crea una carpeta virtual de mensajes."
  citation: "fuente: `ms-outlook-listas-contactos.html`; «Crear una lista de contactos en el nuevo Outlook»"
