# anchor: fuente-ms-excel-graficos-html
- id: m02-l09-q136
  prompt:
    es: "En Excel 365 para Windows, tras seleccionar los datos, ¿cuál de las siguientes rutas de la cinta de opciones abre los gráficos recomendados?"
  options:
  - id: a
    text:
      es: "Insertar › Tabla dinámica"
  - id: b
    text:
      es: "Insertar › Segmentación"
  - id: c
    text:
      es: "Datos › Ordenar y filtrar"
  - id: d
    correct: true
    text:
      es: "Insertar › Gráficos recomendados"
  explanation:
    es: "Se seleccionan los datos y se elige Insertar › Gráficos recomendados. Insertar › Tabla dinámica crea una tabla dinámica, Insertar › Segmentación añade botones de filtro y Datos › Filtro pone flechas en los encabezados."
  citation: "fuente: `ms-excel-graficos.html`; «Crear un gráfico»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-graficos-html
- id: m02-l09-q139
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe la pestaña Todos los gráficos del cuadro de gráficos recomendados?"
  options:
  - id: a
    text:
      es: "Muestra una vista previa de un gráfico recomendado para los datos"
  - id: b
    text:
      es: "Crea de inmediato un gráfico con los datos seleccionados"
  - id: c
    correct: true
    text:
      es: "Muestra todos los tipos de gráficos"
  - id: d
    text:
      es: "Agrega una línea de tendencia a un gráfico existente"
  explanation:
    es: "Si ningún gráfico recomendado gusta, la pestaña Todos los gráficos muestra todos los tipos de gráficos. La vista previa se obtiene al seleccionar un gráfico en Gráficos recomendados, el gráfico inmediato lo crea Alt+F1 y la línea de tendencia se agrega con Agregar elemento de gráfico."
  citation: "fuente: `ms-excel-graficos.html`; «Crear un gráfico»"
  difficulty: 1
  tags:
  - "concepto"
  - "ofimática-menú"
# anchor: fuente-ms-excel-graficos-html
- id: m02-l09-q141
  prompt:
    es: "En Excel 365, con un gráfico seleccionado, ¿cuál de los siguientes comandos de Agregar elemento de gráfico permite añadir una línea de tendencia?"
  options:
  - id: a
    correct: true
    text:
      es: "Línea de tendencia"
  - id: b
    text:
      es: "Título del gráfico"
  - id: c
    text:
      es: "Leyenda"
  - id: d
    text:
      es: "Líneas de cuadrícula"
  explanation:
    es: "En Agregar elemento de gráfico se elige Línea de tendencia y después el tipo de línea. Título del gráfico, Leyenda y Líneas de cuadrícula son otros elementos del gráfico que se muestran u ocultan."
  citation: "fuente: `ms-excel-graficos.html`; «Agregar una línea de tendencia»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-atajos-html
- id: m02-l09-q305
  prompt:
    es: "En Excel 365 configurado en español, ¿cuál de los siguientes métodos abreviados crea de inmediato un gráfico incrustado con los datos seleccionados?"
  options:
  - id: a
    text:
      es: "Alt+F11"
  - id: b
    correct: true
    text:
      es: "Alt+F1"
  - id: c
    text:
      es: "Alt+F8"
  - id: d
    text:
      es: "F11"
  explanation:
    es: "La página dice que Alt+F1 crea un gráfico incrustado a partir de los datos del rango actual. «F11»: crea un gráfico en una hoja de gráfico distinta. «Alt+F8»: abre el cuadro de macros. «Alt+F11»: abre el editor de Microsoft Visual Basic para Aplicaciones."
  citation: "fuente: `ms-excel-atajos.html`; «Métodos abreviados de teclado para trabajar con datos, funciones y la barra de fórmulas»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-atajos-html
- id: m02-l09-q306
  prompt:
    es: "En Excel 365 configurado en español, ¿cuál de los siguientes métodos abreviados crea un gráfico con los datos del rango actual en una hoja de gráfico distinta?"
  options:
  - id: a
    text:
      es: "Mayús+F11"
  - id: b
    text:
      es: "F9"
  - id: c
    text:
      es: "Alt+F1"
  - id: d
    correct: true
    text:
      es: "F11"
  explanation:
    es: "La página dice que F11 crea un gráfico del rango actual en una hoja de gráfico distinta. «Alt+F1»: crea un gráfico incrustado en la misma hoja. «Mayús+F11»: inserta una hoja de cálculo nueva. «F9»: calcula todas las hojas de todos los libros abiertos."
  citation: "fuente: `ms-excel-atajos.html`; «Métodos abreviados de teclado para trabajar con datos, funciones y la barra de fórmulas»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-graficos-html
- id: m02-l09-q307
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones es un tipo de línea de tendencia que ofrece Agregar elemento de gráfico?"
  options:
  - id: a
    text:
      es: "Media ponderada"
  - id: b
    text:
      es: "Dispersión lineal"
  - id: c
    correct: true
    text:
      es: "Previsión lineal"
  - id: d
    text:
      es: "Previsión circular"
  explanation:
    es: "La página da Lineal, Exponencial, Previsión lineal y Media móvil como tipos de línea de tendencia. «Previsión circular»: la página lista Lineal, Exponencial, Previsión lineal y Media móvil. «Media ponderada»: la página da Media móvil como tipo. «Dispersión lineal»: la dispersión es un tipo de gráfico, no un tipo de línea de tendencia."
  citation: "fuente: `ms-excel-graficos.html`; «Agregar una línea de tendencia»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-office-linea-tendencia-html
- id: m02-l09-q309
  prompt:
    es: "En Excel 365, ¿entre qué valores se encuentra el valor R cuadrado de una línea de tendencia?"
  options:
  - id: a
    correct: true
    text:
      es: "Entre 0 y 1"
  - id: b
    text:
      es: "Entre -1 y 1"
  - id: c
    text:
      es: "Entre 1 y 10"
  - id: d
    text:
      es: "Entre 0 y 100"
  explanation:
    es: "La página dice que el valor R cuadrado es un número que oscila entre 0 y 1. «Entre -1 y 1»: el R cuadrado oscila entre 0 y 1. «Entre 0 y 100»: el R cuadrado oscila entre 0 y 1, sin escala porcentual. «Entre 1 y 10»: el R cuadrado oscila entre 0 y 1."
  citation: "fuente: `ms-office-linea-tendencia.html`; «Línea de tendencia lineal»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-office-linea-tendencia-html
- id: m02-l09-q311
  prompt:
    es: "En Excel 365, una serie tiene 26 puntos y se agrega una línea de tendencia de media móvil con Período 4. ¿Cuántos puntos tiene la línea?"
  options:
  - id: a
    correct: true
    text:
      es: "22"
  - id: b
    text:
      es: "24"
  - id: c
    text:
      es: "26"
  - id: d
    text:
      es: "30"
  explanation:
    es: "La página dice que el número de puntos de la línea es el total de puntos de la serie menos el período: 26 menos 4 son 22. «26»: la línea tiene los puntos de la serie menos el período. «24»: sería restar 2 en lugar del período, que aquí es 4. «30»: la línea no puede tener más puntos que la serie."
  citation: "fuente: `ms-office-linea-tendencia.html`; «Línea de tendencia de media móvil»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-ordenar-html
- id: m02-l09-q142
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones indica dónde están los comandos Ordenar de la A a la Z y Ordenar de la Z a la A?"
  options:
  - id: a
    text:
      es: "Pestaña Datos, grupo Esquema"
  - id: b
    text:
      es: "Pestaña Datos, grupo Herramientas de datos"
  - id: c
    correct: true
    text:
      es: "Pestaña Datos, grupo Ordenar y filtrar"
  - id: d
    text:
      es: "Pestaña Inicio, grupo Estilos"
  explanation:
    es: "Los comandos de ordenación rápida, ascendente y descendente, están en la pestaña Datos, grupo Ordenar y filtrar. El grupo Esquema contiene Subtotal, Herramientas de datos contiene Quitar duplicados y el grupo Estilos de Inicio contiene Formato condicional."
  citation: "fuente: `ms-excel-ordenar.html`; «Ordenar texto»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-filtrar-html
- id: m02-l09-q144
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones describe lo que hace un filtro aplicado a un rango de datos?"
  options:
  - id: a
    text:
      es: "Elimina de forma permanente las filas que no cumplen los criterios indicados"
  - id: b
    text:
      es: "Reorganiza las filas en un nuevo orden según los criterios"
  - id: c
    correct: true
    text:
      es: "Muestra solo las filas que cumplen los criterios y oculta las demás"
  - id: d
    text:
      es: "Agrupa las filas y calcula un subtotal por cada grupo de valores"
  explanation:
    es: "Los datos filtrados muestran solo las filas que cumplen los criterios y ocultan las demás. Eliminar permanentemente es lo que hace Quitar duplicados, reorganizar es ordenar y los subtotales los inserta el comando Subtotal."
  citation: "fuente: `ms-excel-filtrar.html`; «Más información sobre el filtrado»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-filtrar-html
- id: m02-l09-q145
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones describe qué ocurre al aplicar un filtro adicional a otra columna de un rango ya filtrado?"
  options:
  - id: a
    correct: true
    text:
      es: "Se basa en el filtro actual y reduce aún más el subconjunto de datos"
  - id: b
    text:
      es: "Reemplaza el filtro anterior por el nuevo"
  - id: c
    text:
      es: "Se ignora el filtro anterior hasta que se borra"
  - id: d
    text:
      es: "Solo se aplica si se desactiva antes el filtro anterior"
  explanation:
    es: "Los filtros son aditivos: cada filtro adicional se basa en el filtro actual y reduce aún más el subconjunto de datos. Por tanto no sustituye al anterior ni lo ignora, y la página señala que se puede filtrar por más de una columna."
  citation: "fuente: `ms-excel-filtrar.html`; «Esto significa que cada filtro adicional se basa en el filtro actual y reduce aún más el subconjunto de datos.»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-segmentacion-html
- id: m02-l09-q146
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe qué es una segmentación de datos?"
  options:
  - id: a
    correct: true
    text:
      es: "Botones en los que se hace clic para filtrar tablas o tablas dinámicas"
  - id: b
    text:
      es: "Un cuadro de diálogo que ordena las filas de una tabla por colores"
  - id: c
    text:
      es: "Un panel que resume los datos en subtotales por grupos"
  - id: d
    text:
      es: "Una herramienta que quita las filas duplicadas de una tabla"
  explanation:
    es: "Las segmentaciones de datos proporcionan botones en los que se hace clic para filtrar tablas o tablas dinámicas. Ordenar por colores, calcular subtotales y quitar duplicados son funciones de otros comandos."
  citation: "fuente: `ms-excel-segmentacion.html`; «Segmentación de datos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-segmentacion-html
- id: m02-l09-q147
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes rutas de la cinta de opciones inserta una segmentación de datos?"
  options:
  - id: a
    text:
      es: "Datos › Filtro"
  - id: b
    correct: true
    text:
      es: "Insertar › Segmentación"
  - id: c
    text:
      es: "Insertar › Tabla dinámica"
  - id: d
    text:
      es: "Datos › Ordenar y filtrar"
  explanation:
    es: "Se hace clic en la tabla o tabla dinámica y, en la pestaña Insertar, se selecciona Segmentación. Datos › Filtro pone flechas de filtro, Insertar › Tabla dinámica crea una tabla dinámica y el grupo Ordenar y filtrar ordena y filtra con sus comandos."
  citation: "fuente: `ms-excel-segmentacion.html`; «En la pestaña Insertar , seleccione Segmentación .»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-segmentacion-html
- id: m02-l09-q148
  prompt:
    es: "En Excel 365, ¿qué botón de una segmentación de datos selecciona todos los elementos para quitar el filtro?"
  options:
  - id: a
    text:
      es: "Filtrar conexiones"
  - id: b
    text:
      es: "Conexiones de informe"
  - id: c
    correct: true
    text:
      es: "Borrar filtro"
  - id: d
    text:
      es: "Quitar el segmentador"
  explanation:
    es: "El botón Borrar filtro selecciona todos los elementos de la segmentación para quitar el filtro. Filtrar conexiones y Conexiones de informe sirven para conectar o desconectar tablas dinámicas, y Quitar elimina la segmentación."
  citation: "fuente: `ms-excel-segmentacion.html`; «Componentes de segmentación de datos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-imprimir-html
- id: m02-l09-q149
  prompt:
    es: "En Excel 365, ¿qué método abreviado abre las opciones de impresión, a las que también se llega con Archivo › Imprimir?"
  options:
  - id: a
    text:
      es: "Ctrl+1"
  - id: b
    text:
      es: "Ctrl+T"
  - id: c
    correct: true
    text:
      es: "Ctrl+P"
  - id: d
    text:
      es: "Ctrl+Mayús+F"
  explanation:
    es: "Archivo e Imprimir, o Ctrl+P, abre las opciones de impresión. Ctrl+1 abre Formato de celdas, Ctrl+T crea una tabla y Ctrl+Mayús+F da formato a fuentes en Formato de celdas."
  citation: "fuente: `ms-excel-imprimir.html`; «Seleccione Archivo e Imprimir o presione Ctrl+P.»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-excel-ordenar-html
- id: m02-l09-q152
  prompt:
    es: "En Excel 365, el número máximo de columnas por las que se puede ordenar a la vez un rango de datos es:"
  options:
  - id: a
    text:
      es: "32"
  - id: b
    correct: true
    text:
      es: "64"
  - id: c
    text:
      es: "128"
  - id: d
    text:
      es: "256"
  explanation:
    es: "La página dice: «Puede ordenar por un máximo de 64 columnas». Por eso 32 se queda corto, y 128 y 256 superan el límite que fija la página."
  citation: "fuente: `ms-excel-ordenar.html`; «Ordenar por más de una columna o fila»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-excel-ordenar-html
- id: m02-l09-q153
  prompt:
    es: "En Excel 365, en Ordenar según del cuadro de diálogo Ordenar, ¿cuál de las siguientes opciones permite ordenar por el color que tienen las celdas por formato manual o condicional?"
  options:
  - id: a
    correct: true
    text:
      es: "Color de celda"
  - id: b
    text:
      es: "Valores de celda"
  - id: c
    text:
      es: "Color de fuente"
  - id: d
    text:
      es: "Icono de celda"
  explanation:
    es: "La página dice: «Para ordenar por formato, seleccione Color de celda, Color de fuente o Icono de celda», y precisa que el formato manual o condicional se ordena «por color de celda». «Valores de celda» sirve «para ordenar por texto, número, o fecha y hora», no por formato. «Color de fuente» ordena por el color del texto, no por el de la celda. «Icono de celda» ordena por un conjunto de iconos creado con formato condicional."
  citation: "fuente: `ms-excel-ordenar.html`; «Ordenar por color de celda, color de fuente o icono»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-filtrar-html
- id: m02-l09-q154
  prompt:
    es: "Señale el comando de la pestaña Datos de Excel 365 que pone flechas de filtro en los encabezados de las columnas de un rango:"
  options:
  - id: a
    text:
      es: "Ordenar"
  - id: b
    text:
      es: "Quitar duplicados"
  - id: c
    text:
      es: "Subtotal"
  - id: d
    correct: true
    text:
      es: "Filtro"
  explanation:
    es: "La página dice: «en la pestaña Datos, seleccione Filtro». «Ordenar» reorganiza los datos en un orden, no los filtra; la página contrasta los filtros, que ocultan los datos que no interesan, con ordenar, que los reorganiza. «Quitar duplicados» elimina valores repetidos, no pone flechas. «Subtotal» inserta subtotales en una lista de datos."
  citation: "fuente: `ms-excel-filtrar.html`; «Filtrar un rango de datos»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-segmentacion-html
- id: m02-l09-q156
  prompt:
    es: "En Excel 365, ¿qué hacen las segmentaciones de datos además de filtrar con rapidez los datos de una tabla o tabla dinámica?"
  options:
  - id: a
    text:
      es: "Calculan un subtotal de cada grupo"
  - id: b
    text:
      es: "Cambian el origen de datos de la tabla dinámica"
  - id: c
    correct: true
    text:
      es: "Indican el estado de filtrado actual"
  - id: d
    text:
      es: "Convierten la tabla en un rango normal"
  explanation:
    es: "La página dice: «Además del filtrado rápido, las segmentaciones también indican el estado de filtrado actual». «Calculan un subtotal de cada grupo» no figura entre sus funciones; los subtotales se insertan con el comando Subtotal. «Cambian el origen de datos de la tabla dinámica» tampoco: la página solo dice que se conectan a tablas dinámicas que comparten origen. «Convierten la tabla en un rango normal» no es una función que la página atribuya a las segmentaciones, que filtran la tabla."
  citation: "fuente: `ms-excel-segmentacion.html`; «Segmentación de datos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-imprimir-html
- id: m02-l09-q158
  prompt:
    es: "En Excel 365, una hoja tiene un área de impresión definida y se quiere imprimir toda la hoja. ¿Qué opción hay que seleccionar?"
  options:
  - id: a
    text:
      es: "Imprimir a archivo"
  - id: b
    correct: true
    text:
      es: "Ignorar área de impresión"
  - id: c
    text:
      es: "Imprimir hojas activas"
  - id: d
    text:
      es: "Imprimir tabla seleccionada"
  explanation:
    es: "La página dice: «Si no desea imprimir solo el área de impresión definida, seleccione Ignorar área de impresión». «Imprimir a archivo» se elige en Impresora para enviar la salida a un archivo. «Imprimir hojas activas» es el botón de Configuración junto a cuya flecha se elige la opción adecuada, no la opción que ignora el área. «Imprimir tabla seleccionada» imprime una tabla, no la hoja entera."
  citation: "fuente: `ms-excel-imprimir.html`; «Imprimir toda o parte de una hoja de cálculo»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-excel-ordenar-html
- id: m02-l09-q313
  prompt:
    es: "En Excel 365, una columna contiene números guardados como números y números guardados como texto. ¿Cómo los ordena Excel si no se les da el mismo formato?"
  options:
  - id: a
    text:
      es: "Los guardados como texto van antes que los guardados como números"
  - id: b
    text:
      es: "Los intercala por su valor numérico"
  - id: c
    text:
      es: "Excel los convierte todos a número antes de ordenar"
  - id: d
    correct: true
    text:
      es: "Los guardados como números van antes que los guardados como texto"
  explanation:
    es: "La página dice que los números guardados como números se ordenarán antes que los guardados como texto. «Los guardados como texto van antes que los guardados como números»: la página dice que los números guardados como números se ordenan antes. «Los intercala por su valor numérico»: la página dice que, sin igualar el formato, los números como números van primero. «Excel los convierte todos a número antes de ordenar»: la página pide aplicar un formato igual a todos para evitar ese orden."
  citation: "fuente: `ms-excel-ordenar.html`; «Ordenar texto»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-ordenar-html
- id: m02-l09-q314
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes botones de la pestaña Datos, grupo Ordenar y filtrar, ordena de menor a mayor los números de la columna de la celda seleccionada?"
  options:
  - id: a
    correct: true
    text:
      es: "Ordenar de menor a mayor"
  - id: b
    text:
      es: "Ordenar del más antiguo al más reciente"
  - id: c
    text:
      es: "Ordenar de la Z a la A"
  - id: d
    text:
      es: "Ordenar de mayor a menor"
  explanation:
    es: "La página dice que, para ordenar números de menor a mayor, se selecciona Ordenar de menor a mayor. «Ordenar del más antiguo al más reciente»: ese botón ordena fechas y horas. «Ordenar de la Z a la A»: ese botón ordena texto en orden descendente. «Ordenar de mayor a menor»: ese botón ordena números en orden descendente."
