# anchor: boe-a-2013-12887-art-30
- id: m01-l07-q118
  prompt:
    es: "Según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, las infracciones leves del título II serán sancionadas con:"
  options:
  - id: a
    text:
      es: "La suspensión de funciones."
  - id: b
    text:
      es: "La declaración del incumplimiento y su publicación en el diario oficial."
  - id: c
    text:
      es: "La no percepción de la indemnización por cese en el cargo."
  - id: d
    correct: true
    text:
      es: "Una amonestación."
  explanation:
    es: "Las infracciones leves se sancionan con una amonestación. La declaración del incumplimiento con publicación oficial y la no percepción de la indemnización por cese son sanciones de las infracciones graves. La suspensión de funciones no figura entre las sanciones del título II."
  citation: "art. 30.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-30
- id: m01-l07-q119
  prompt:
    es: "Señale la sanción que se impone por la comisión de una infracción grave, según el artículo 30.2 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno:"
  options:
  - id: a
    correct: true
    text:
      es: "La declaración del incumplimiento y su publicación en el «Boletín Oficial del Estado» o diario oficial que corresponda."
  - id: b
    text:
      es: "La destitución del cargo que se ocupe."
  - id: c
    text:
      es: "La prohibición de ser nombrado alto cargo durante un periodo de entre cinco y diez años."
  - id: d
    text:
      es: "La amonestación escrita del superior jerárquico."
  explanation:
    es: "Para las infracciones graves, el artículo 30.2 prevé la declaración del incumplimiento y su publicación en el Boletín Oficial del Estado o diario oficial, o la no percepción de la indemnización por cese. La destitución y la prohibición de ser nombrado alto cargo son sanciones de las infracciones muy graves. La amonestación es la sanción de las leves."
  citation: "art. 30.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-30
- id: m01-l07-q120
  prompt:
    es: "De acuerdo con el artículo 30.2 de la Ley 19/2013, de 9 de diciembre, una de las sanciones por infracción grave es la no percepción, en el caso de que la llevara aparejada, de:"
  options:
  - id: a
    text:
      es: "La retribución correspondiente al mes siguiente a la notificación de la sanción."
  - id: b
    text:
      es: "La pensión de jubilación del alto cargo."
  - id: c
    text:
      es: "Las dietas por asistencia a órganos colegiados."
  - id: d
    correct: true
    text:
      es: "La correspondiente indemnización para el caso de cese en el cargo."
  explanation:
    es: "El artículo 30.2.b) prevé la no percepción de la indemnización que, en su caso, lleve aparejada el cese en el cargo. La retribución del mes siguiente, la pensión de jubilación y las dietas no son objeto de esta sanción."
  citation: "art. 30.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-30
- id: m01-l07-q121
  prompt:
    es: "Según el artículo 30.4 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, los sancionados por la comisión de una infracción muy grave serán destituidos del cargo que ocupen:"
  options:
  - id: a
    text:
      es: "Salvo que hayan recurrido la sanción en vía administrativa."
  - id: b
    correct: true
    text:
      es: "Salvo que ya hubiesen cesado."
  - id: c
    text:
      es: "Salvo que reparen los perjuicios causados."
  - id: d
    text:
      es: "Solo cuando la sanción sea firme en vía contencioso-administrativa."
  explanation:
    es: "La destitución se impone salvo que el sancionado ya hubiese cesado. Recurrir la sanción, reparar los perjuicios, que es solo un criterio de graduación del artículo 30.5, y esperar a una sentencia firme no son excepciones que prevea el apartado."
  citation: "art. 30.4 Ley 19/2013"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2013-12887-art-31
- id: m01-l07-q123
  prompt:
    es: "Conforme al artículo 31.3 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, en los procedimientos sancionadores contra altos cargos de la Administración General del Estado, la instrucción corresponde a:"
  options:
  - id: a
    text:
      es: "El Consejo de Transparencia y Buen Gobierno."
  - id: b
    text:
      es: "La Abogacía del Estado."
  - id: c
    text:
      es: "La Inspección General de Servicios del departamento."
  - id: d
    correct: true
    text:
      es: "La Oficina de Conflictos de Intereses."
  explanation:
    es: "La instrucción corresponde a la Oficina de Conflictos de Intereses. El Consejo de Transparencia y Buen Gobierno puede instar el inicio del procedimiento, pero no lo instruye. La Abogacía del Estado y la Inspección General de Servicios no tienen esa función."
  citation: "art. 31.3 Ley 19/2013"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2013-12887-art-31
- id: m01-l07-q124
  prompt:
    es: "Según el artículo 31.4 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, la competencia para imponer sanciones cuando el alto cargo tenga la condición de Secretario de Estado corresponde:"
  options:
  - id: a
    correct: true
    text:
      es: "Al Consejo de Ministros."
  - id: b
    text:
      es: "Al Presidente del Gobierno."
  - id: c
    text:
      es: "Al Consejo de Transparencia y Buen Gobierno."
  - id: d
    text:
      es: "A la Oficina de Conflictos de Intereses."
  explanation:
    es: "Cuando el alto cargo sea miembro del Gobierno o Secretario de Estado, sanciona el Consejo de Ministros. El Presidente del Gobierno no tiene atribuida esa competencia. El Consejo de Transparencia y Buen Gobierno y la Oficina de Conflictos de Intereses no sancionan: la Oficina instruye."
  citation: "art. 31.4 Ley 19/2013"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2013-12887-art-32
- id: m01-l07-q125
  prompt:
    es: "Según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, las sanciones impuestas por la comisión de infracciones muy graves prescriben:"
  options:
  - id: a
    text:
      es: "A los diez años desde su imposición."
  - id: b
    correct: true
    text:
      es: "A los cinco años."
  - id: c
    text:
      es: "A los tres años."
  - id: d
    text:
      es: "Al año."
  explanation:
    es: "Las sanciones por infracciones muy graves prescriben a los cinco años. Tres años es el plazo de las sanciones por infracciones graves y un año el de las leves. La ley no prevé diez años."
  citation: "art. 32.2 Ley 19/2013"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2024-15944-art-1
- id: m01-l07-q126
  prompt:
    es: "Según el Real Decreto 615/2024, de 2 de julio, por el que se aprueba el Estatuto del Consejo de Transparencia y Buen Gobierno, A.A.I., este Consejo es:"
  options:
  - id: a
    text:
      es: "Un organismo autónomo de ámbito estatal."
  - id: b
    text:
      es: "Una entidad pública empresarial."
  - id: c
    correct: true
    text:
      es: "Una autoridad administrativa independiente de ámbito estatal."
  - id: d
    text:
      es: "Un órgano consultivo del Gobierno de la Nación, sin personalidad jurídica."
  explanation:
    es: "El Estatuto define al Consejo como una autoridad administrativa independiente de ámbito estatal. No es un organismo autónomo, ni una entidad pública empresarial, ni un órgano consultivo del Gobierno, y su carácter independiente es incompatible con una dependencia de ese tipo."
  citation: "art. 1.1 Estatuto RD 615/2024"
  difficulty: 1
  tags:
  - "concepto"
  - "órgano"
# anchor: boe-a-2024-15944-art-1
- id: m01-l07-q127
  prompt:
    es: "De acuerdo con el Estatuto del Consejo de Transparencia y Buen Gobierno, A.A.I., aprobado por el Real Decreto 615/2024, de 2 de julio, la denominación oficial del Consejo es:"
  options:
  - id: a
    text:
      es: "«Consejo de Transparencia y Buen Gobierno, O.A.»."
  - id: b
    text:
      es: "«Consejo de Transparencia y Buen Gobierno, E.P.E.»."
  - id: c
    text:
      es: "«Consejo de Transparencia y Buen Gobierno, S.M.E.»."
  - id: d
    correct: true
    text:
      es: "«Consejo de Transparencia y Buen Gobierno, A.A.I.»."
  explanation:
    es: "El Estatuto fija la denominación oficial «Consejo de Transparencia y Buen Gobierno, A.A.I.», por autoridad administrativa independiente. Las siglas O.A., E.P.E. y S.M.E. corresponden a un organismo autónomo, una entidad pública empresarial y una sociedad mercantil estatal, que no es la naturaleza del Consejo."
  citation: "art. 1.1 Estatuto RD 615/2024"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2024-15944-art-1
- id: m01-l07-q128
  prompt:
    es: "Conforme al artículo 1.1 del Real Decreto 615/2024, de 2 de julio, el Consejo de Transparencia y Buen Gobierno se vincula a la Administración General del Estado a través del:"
  options:
  - id: a
    correct: true
    text:
      es: "Ministerio para la Transformación Digital y de la Función Pública."
  - id: b
    text:
      es: "Ministerio de Justicia."
  - id: c
    text:
      es: "Ministerio del Interior."
  - id: d
    text:
      es: "Ministerio de Política Territorial y Memoria Democrática, a través de su Secretaría de Estado."
  explanation:
    es: "El Estatuto vincula al Consejo con la Administración General del Estado a través del Ministerio para la Transformación Digital y de la Función Pública. Los Ministerios de Justicia, del Interior y de Política Territorial y Memoria Democrática no son el de vinculación."
  citation: "art. 1.1 Estatuto RD 615/2024"
  difficulty: 2
  tags:
  - "órgano"
