# anchor: boe-a-2015-11719-art-22
- id: m05-l04-q081
  prompt:
    es: "Según el artículo 22.2 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, los componentes de sueldo y trienios de las pagas extraordinarias:"
  options:
  - id: a
    text:
      es: "Están comprendidos dentro de las retribuciones complementarias."
  - id: b
    text:
      es: "Están comprendidos dentro de las retribuciones diferidas."
  - id: c
    text:
      es: "Quedan fuera tanto de las básicas como de las complementarias."
  - id: d
    correct: true
    text:
      es: "Están comprendidos dentro de las retribuciones básicas."
  explanation:
    es: "El artículo 22.2 define las retribuciones básicas y añade: «Dentro de ellas están comprendidas los componentes de sueldo y trienios de las pagas extraordinarias». Las opciones de las retribuciones complementarias y de las diferidas los llevan a otra clase de retribución, y la que los deja fuera de las básicas y de las complementarias contradice la inclusión expresa que hace el artículo."
  citation: "art. 22.2 TREBEP"
  difficulty: 2
  tags:
  - "composición"
  - "concepto"
# anchor: boe-a-1984-17387-art-23
- id: m05-l04-q082
  prompt:
    es: "Un funcionario pasó de un Cuerpo del Subgrupo C2 a uno del C1 y luego a uno del A2. Según la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, sus trienios anteriores:"
  options:
  - id: a
    text:
      es: "Se siguen percibiendo solo los devengados en C1, el grupo inmediatamente anterior."
  - id: b
    correct: true
    text:
      es: "Se siguen percibiendo, tanto los devengados en C2 como los devengados en C1."
  - id: c
    text:
      es: "Dejan de percibirse, y el cómputo de trienios empieza de nuevo en el A2."
  - id: d
    text:
      es: "Se siguen percibiendo solo hasta que complete su primer trienio en el A2."
  explanation:
    es: "El artículo 23.2.b) dispone que quien preste servicios sucesivamente en Cuerpos de distinto grupo de clasificación «tendrá derecho a seguir percibiendo los trienios devengados en los grupos anteriores», en plural y sin límite: conserva los de C2 y los de C1. La opción que solo conserva los de C1 limita la regla al grupo inmediatamente anterior. La que los da por perdidos contradice el artículo. La que los mantiene hasta el primer trienio en el A2 añade un plazo que el artículo no fija."
  citation: "art. 23.2.b) Ley 30/1984"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1987-28404-art-34
- id: m05-l04-q083
  prompt:
    es: "Según el artículo 34.a) de la Ley 33/1987, de 23 de diciembre, de Presupuestos Generales del Estado para 1988, en el mes de toma de posesión del primer destino en un Cuerpo o Escala, las retribuciones fijas y mensuales:"
  options:
  - id: a
    correct: true
    text:
      es: "Se liquidan por días, como excepción al pago por mensualidades completas."
  - id: b
    text:
      es: "Se abonan por mensualidad completa, según la situación del primer día hábil."
  - id: c
    text:
      es: "Se abonan por mensualidad completa, según la situación del último día hábil."
  - id: d
    text:
      es: "Se liquidan por quincenas, según la fecha de la toma de posesión."
  explanation:
    es: "El artículo 34 de la Ley 33/1987 manda hacer efectivas las retribuciones fijas y mensuales por mensualidades completas según la situación del primer día hábil, «salvo en los siguientes casos, en que se liquidarán por días», y la letra a) incluye el mes de toma de posesión del primer destino en un Cuerpo o Escala. La mensualidad completa según el primer día hábil es la regla general que ese caso exceptúa. La mensualidad completa según el último día hábil cambia además la fecha de referencia de la regla general, que es el primer día hábil. La liquidación por quincenas no es la de la letra a): la letra a) dice «por días»."
  citation: "art. 34.a) Ley 33/1987"
  difficulty: 1
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-1987-28404-art-33
- id: m05-l04-q084
  prompt:
    es: "Según la Ley 33/1987, de 23 de diciembre, de Presupuestos Generales del Estado para 1988, ¿qué paga extraordinaria de diciembre de 2026 corresponde a quien prestó servicios 122 días de los seis meses anteriores, si la completa es 915,00 euros?"
  options:
  - id: a
    text:
      es: "613,35 euros."
  - id: b
    text:
      es: "620,17 euros."
  - id: c
    correct: true
    text:
      es: "610,00 euros."
  - id: d
    text:
      es: "915,00 euros."
  explanation:
    es: "El artículo 33.a) reduce la paga cuando los servicios no cubren los seis meses anteriores y computa cada día por el importe de dividir la paga entre ciento ochenta y dos (ciento ochenta y tres en años bisiestos) en junio, o entre ciento ochenta y tres en diciembre. Para la paga de diciembre: 915,00 entre 183 son 5,00 euros por día, y por 122 días resultan 610,00 euros. Los 613,35 euros dividen entre 182, el divisor de la paga de junio en un año no bisiesto. Los 620,17 euros dividen entre 180. Los 915,00 euros pagan la paga completa sin la reducción proporcional."
  citation: "art. 33.a) Ley 33/1987"
  difficulty: 3
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-1987-28404-art-33
- id: m05-l04-q085
  prompt:
    es: "Según el artículo 33.d) de la Ley 33/1987, de 23 de diciembre, de Presupuestos Generales del Estado para 1988, ¿a qué fecha se refiere la situación del funcionario que cesa en el servicio activo para su última paga extraordinaria?"
  options:
  - id: a
    text:
      es: "Al primer día hábil del mes siguiente al cese."
  - id: b
    correct: true
    text:
      es: "Al día del cese en el servicio activo."
  - id: c
    text:
      es: "Al primer día hábil de junio o diciembre siguiente al cese."
  - id: d
    text:
      es: "Al primer día hábil de junio o diciembre anterior al cese."
  explanation:
    es: "El artículo 33.d) dispone que, en el cese en el servicio activo, incluido el derivado de un cambio de Cuerpo o Escala, «la última paga extraordinaria se devengará el día del cese y con referencia a la situación y derechos del funcionario en dicha fecha», en cuantía proporcional al tiempo de servicios efectivamente prestados. Las tres opciones del primer día hábil (del mes siguiente, de junio o diciembre siguiente y de junio o diciembre anterior) cambian la fecha de referencia que fija el artículo, el día del cese."
  citation: "art. 33.d) Ley 33/1987"
  difficulty: 2
  tags:
  - "fecha"
# anchor: boe-a-2002-12506-apartado-septimo
- id: m05-l04-q086
  prompt:
    es: "Según el apartado séptimo de la Orden PRE/1576/2002, de 19 de junio, ¿a favor de quién se expiden las propuestas de pago de las retribuciones del personal al servicio de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "De cada perceptor, como acreedor directo, igual que las demás propuestas de pago."
  - id: b
    text:
      es: "De cada perceptor, salvo que haya transmitido su derecho de cobro a un cesionario."
  - id: c
    text:
      es: "Del órgano que dicta el acto de reconocimiento de la obligación de pago."
  - id: d
    correct: true
    text:
      es: "De las Cajas pagadoras, Habilitaciones, Pagadurías y otros agentes mediadores en el pago."
  explanation:
    es: "El apartado séptimo.1.1 fija la regla general: las propuestas de pago «se expedirán a favor de los acreedores directos, salvo en los supuestos establecidos en el apartado séptimo.2». El apartado séptimo.2.a) incluye entre esos supuestos el pago de las retribuciones de personal de la Administración General del Estado, cuyas propuestas «se expedirán a favor de las Cajas pagadoras, Habilitaciones, Pagadurías y otros agentes mediadores en el pago». La opción del acreedor directo aplica la regla general que esa excepción desplaza. La del cesionario mezcla la regla de la transmisión de créditos, que se refiere a los acreedores directos. La del órgano que reconoce la obligación confunde a quien propone el pago con aquel a cuyo favor se expide la propuesta."
  citation: "apartado séptimo.1.1 y 2.a) Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2019-7414-art-62
- id: m05-l04-q087
  prompt:
    es: "De acuerdo con el artículo 62 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, el grupo 2 a efectos de indemnización por razón del servicio comprende los niveles profesionales:"
  options:
  - id: a
    correct: true
    text:
      es: "M3, M2 y M1."
  - id: b
    text:
      es: "E2, E1 y E0."
  - id: c
    text:
      es: "M2, M1 y E2."
  - id: d
    text:
      es: "M3, M2, M1 y E2."
  explanation:
    es: "La tabla del artículo 62, que remite al Real Decreto 462/2002 para las dietas y los gastos de locomoción, asigna al grupo 2 los niveles «M3, M2, M1» y al grupo 3 los niveles «E2, E1 y E0». La opción de los niveles E2, E1 y E0 da la composición del grupo 3. Las que añaden el nivel E2 al grupo 2, con o sin el M3, mezclan los dos grupos."
  citation: "art. 62 IV Convenio único"
  difficulty: 1
  tags:
  - "composición"
# anchor: boe-a-2002-10337-anexo-ii
- id: m05-l04-q088
  prompt:
    es: "Según el anexo II del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, ¿qué cuantía diaria por alojamiento corresponde al grupo 1 en las dietas en territorio nacional?"
  options:
  - id: a
    text:
      es: "53,34 euros."
  - id: b
    correct: true
    text:
      es: "102,56 euros."
  - id: c
    text:
      es: "65,97 euros."
  - id: d
    text:
      es: "155,90 euros."
  explanation:
    es: "El anexo II fija para el grupo 1 102,56 euros por alojamiento, 53,34 euros por manutención y 155,90 euros de dieta entera. Los 53,34 euros son la manutención del mismo grupo, los 155,90 euros su dieta entera y los 65,97 euros el alojamiento del grupo 2."
  citation: "anexo II RD 462/2002"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2002-10337-anexo-iv
- id: m05-l04-q089
  prompt:
    es: "¿Cuál de las siguientes es la cuantía por asistencia que fija el anexo IV del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, para el Presidente y el Secretario de un tribunal de categoría primera?"
  options:
  - id: a
    text:
      es: "42,83 euros."
  - id: b
    text:
      es: "39,78 euros."
  - id: c
    correct: true
    text:
      es: "45,89 euros."
  - id: d
    text:
      es: "36,72 euros."
  explanation:
    es: "El anexo IV fija en la categoría primera 45,89 euros para el Presidente y el Secretario y 42,83 euros para los vocales. Los 42,83 euros son la asistencia de los vocales de esa categoría y también la del Presidente y el Secretario de la categoría segunda. Los 39,78 euros corresponden a los vocales de la categoría segunda y al Presidente y el Secretario de la categoría tercera. Los 36,72 euros son la asistencia de los vocales de la categoría tercera."
