    text:
      es: "Ctrl"
  - id: d
    text:
      es: "Alt"
  explanation:
    es: "La tabla del Explorador dice que con Mayús y arrastrar un archivo, «cuando suelte el archivo, muévalo a esa ubicación». Con Ctrl se crea una copia y con Alt un acceso directo al original. La tabla no asigna ninguna acción a arrastrar con Tab."
