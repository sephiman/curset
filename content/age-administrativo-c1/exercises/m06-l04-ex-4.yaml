# anchor: fuente-ms-word-macros-html
- id: m06-l04-q141
  prompt:
    es: "Según la página de Microsoft sobre cómo crear o ejecutar macros en Word 365, una macro es:"
  options:
  - id: a
    correct: true
    text:
      es: "Una serie de comandos e instrucciones agrupados como un mismo comando para completar una tarea"
  - id: b
    text:
      es: "Una plantilla de documento con los estilos de título predefinidos"
  - id: c
    text:
      es: "Un campo especial que marca una entrada del índice"
  - id: d
    text:
      es: "Un origen de datos asociado al documento para personalizarlo"
  explanation:
    es: "La página dice: «Una macro es una serie de comandos e instrucciones que se agrupan de forma conjunta como un mismo comando para completar una tarea automáticamente». La plantilla Normal.dotm es donde se guardan macros para todos los documentos; no es la macro. Ese campo es el campo XE, de entrada de índice. Los orígenes de datos se asocian al documento en la combinación de correspondencia."
  citation: "fuente: `ms-word-macros.html`; «Crear o ejecutar una macro»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-macros-html
- id: m06-l04-q142
  prompt:
    es: "En Word 365, ¿en cuál de las siguientes plantillas se guarda una macro para que esté disponible en todos los documentos futuros?"
  options:
  - id: a
    text:
      es: "Normal.dotx"
  - id: b
    text:
      es: "Normal.docm"
  - id: c
    text:
      es: "Normal.docx"
  - id: d
    correct: true
    text:
      es: "Normal.dotm"
  explanation:
    es: "La página dice: «Para hacer que la macro de un documento esté disponible en todos los futuros documentos, agréguela a la plantilla Normal.dotm». Normal.dotx es, según la página de formatos de archivo, la plantilla para crear archivos de Word «que no contienen macros», así que no sirve para guardarlas. Normal.docm y Normal.docx son extensiones de documento: la página de formatos describe .docm como documento habilitado para macros y .docx como documento de Word, y la de macros pide la plantilla."
  citation: "fuente: `ms-word-macros.html`; «Hacer que las macros estén disponibles en todos los documentos»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-word-macros-html
- id: m06-l04-q143
  prompt:
    es: "¿Cuál de las siguientes formas permite ejecutar una macro en Word 365, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Solo desde la lista Macros, tras abrir el cuadro Macros"
  - id: b
    correct: true
    text:
      es: "Un botón de la barra de herramientas de acceso rápido, un método abreviado de teclado o la lista Macros"
  - id: c
    text:
      es: "Solo con un método abreviado de teclado, asignado al grabar la macro"
  - id: d
    text:
      es: "Solo con un botón de la barra de herramientas de acceso rápido"
  explanation:
    es: "La página dice: «Para ejecutar una macro, seleccione el botón de la barra de herramientas de acceso rápido, presione el método abreviado de teclado o puede ejecutar la macro desde la lista Macros». La página da tres maneras, no solo la lista Macros. La página da tres maneras, no solo el teclado. La página da tres maneras, no solo el botón."
  citation: "fuente: `ms-word-macros.html`; «Ejecutar una macro»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-macros-html
- id: m06-l04-q144
  prompt:
    es: "¿Qué ocurre en Word 365 con las selecciones de texto hechas con el ratón mientras se graba una macro?"
  options:
  - id: a
    text:
      es: "Se graban igual que cualquier otro clic del ratón"
  - id: b
    text:
      es: "Se graban solo si la macro se guarda en Normal.dotm"
  - id: c
    correct: true
    text:
      es: "No se graban; hay que seleccionar con el teclado"
  - id: d
    text:
      es: "Se graban solo si la macro se ejecuta con un botón"
  explanation:
    es: "La página dice: «Las macros no graban selecciones realizadas con el mouse», y aconseja usar el teclado para seleccionar texto. Grabarlas igual que cualquier clic contradice esa frase, aunque la misma página diga que Word graba los clics del ratón en los comandos. Que dependa de guardar la macro en Normal.dotm o de ejecutarla con un botón no cuadra con el texto: la advertencia aparece igual en el procedimiento del botón y en el del método abreviado de teclado, y en ninguno se condiciona al lugar donde se guarda la macro."
  citation: "fuente: `ms-word-macros.html`; «Grabar una macro con un botón»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-macros-html
- id: m06-l04-q145
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones del menú Macros finaliza la grabación de una macro?"
  options:
  - id: a
    correct: true
    text:
      es: "Detener grabación"
  - id: b
    text:
      es: "Ver macros"
  - id: c
    text:
      es: "Organizador"
  - id: d
    text:
      es: "Comandos de Word"
  explanation:
    es: "La página dice: «Para detener la grabación, seleccione Ver>macros>Detener grabación». Ver macros abre la lista de macros para ejecutar una. Organizador sirve para copiar una macro a Normal.dotm. Comandos de Word lista las macros integradas."
