- id: m11-l02-q02
  prompt:
    en: A method catches an `IOException` with the message `disk full` and throws an `IllegalStateException`, once
      without passing the caught exception and once passing it as the second constructor argument. What does the
      program print for each cause?
  options:
  - id: a
    text:
      en: 'swallowed: disk full

        kept: disk full'
  - id: b
    text:
      en: 'swallowed: no cause

        kept: no cause'
  - id: c
    correct: true
    text:
      en: 'swallowed: no cause

        kept: disk full'
  - id: d
    text:
      en: 'swallowed: disk full

        kept: no cause'
  explanation:
    en: 'The program prints `swallowed: no cause` and `kept: disk full`: the first exception was built without a
      cause, and the second received it through its constructor. The output that reports `disk full` for both exceptions
      is wrong because a cause is associated with a throwable only through a constructor that takes it or through
      `initCause(Throwable)`. The output that reports no cause for the second exception either is wrong because
      a constructor that takes the cause as an argument records it. The output that gives the cause to the first
      exception only is wrong because the first exception was built without a cause argument, so it has none.'
  citation: javadoc-throwable#class-throwable
  snippet: m11-l02/ExceptionCause.java
- id: m11-l02-q03
  prompt:
    en: Two threads insert one key into a `ConcurrentHashMap`, first with `containsKey` then `put`, a barrier between
      the two steps, then with `putIfAbsent`. Finally a joined thread writes 42 into an array. What does it print?
  options:
  - id: a
    text:
      en: 'check then act: 1

        atomic insert: 1

        after join: 42'
  - id: b
    correct: true
    text:
      en: 'check then act: 2

        atomic insert: 1

        after join: 42'
  - id: c
    text:
      en: 'check then act: 2

        atomic insert: 2

        after join: 42'
  - id: d
    text:
      en: 'check then act: 2

        atomic insert: 1

        after join: 0'
  explanation:
    en: 'The program prints `check then act: 2`, `atomic insert: 1` and `after join: 42`: both threads see the key
      absent before either inserts, `putIfAbsent` lets only one insert, and `join` makes the write visible. The
      line `check then act: 1` is wrong because the check and the insert are two separate steps, so both threads
      can pass the check. The line `atomic insert: 2` is wrong because `putIfAbsent` checks and inserts in one call,
      so only one thread sees the key absent. The line `after join: 0` is wrong because all actions in a thread
      happen-before any other thread successfully returns from a `join` on that thread.'
  citation: javadoc-concurrent-package#MemoryVisibility
  snippet: m11-l02/ConcurrencyChecks.java
- id: m11-l02-q04
  prompt:
    en: The program adds `0.1` and `0.2` as `double` and as `BigDecimal`, multiplies `1.10` by `2.0`, divides 1
      by 3 exactly, and splits `100.00` by 3 at scale 2 with `HALF_UP`. What does it print?
  options:
  - id: a
    correct: true
    text:
      en: '0.30000000000000004

        0.3

        2.200

        Non-terminating decimal expansion; no exact representable decimal result.

        33.33

        99.99'
  - id: b
    text:
      en: '0.3

        0.3

        2.200

        Non-terminating decimal expansion; no exact representable decimal result.

        33.33

        99.99'
  - id: c
    text:
      en: '0.30000000000000004

        0.3

        2.20

        Non-terminating decimal expansion; no exact representable decimal result.

        33.33

        99.99'
  - id: d
    text:
      en: '0.30000000000000004

        0.3

        2.200

        Non-terminating decimal expansion; no exact representable decimal result.

        33.33

        100.00'
  explanation:
    en: 'The program prints `0.30000000000000004`, `0.3`, `2.200`, the non-terminating message, `33.33` and `99.99`:
      the `double` sum is inexact, the `BigDecimal` product keeps the scales added together, and three rounded shares
      lose one cent. The first line `0.3` is wrong because `double` cannot represent `0.1` and `0.2` exactly, so
      their sum prints with extra digits. The line `2.20` is wrong because the preferred scale of a multiplication
      is `multiplier.scale() + multiplicand.scale()`, here 2 + 1. The line `100.00` is wrong because each share
      was rounded to `33.33`, and three of them add up to `99.99`.'
  citation: javadoc-bigdecimal#class-bigdecimal
  snippet: m11-l02/MoneyMath.java
- id: m11-l02-q05
  prompt:
    en: The program adds 1 to `Integer.MAX_VALUE` with `+` and with `Math.addExact` (printing the exception message),
      then multiplies 1,000,000 by 5,000 as `int` and as `long`, storing both in a `long`. What does it print?
  options:
  - id: a
    text:
      en: '2147483648

        integer overflow

        705032704

        5000000000'
  - id: b
    text:
      en: '-2147483648

        integer overflow

        5000000000

        5000000000'
  - id: c
    text:
      en: '-2147483648

        705032704

        5000000000'
  - id: d
    correct: true
    text:
      en: '-2147483648

        integer overflow

        705032704

        5000000000'
  explanation:
    en: 'The program prints `-2147483648`, `integer overflow`, `705032704` and `5000000000`: the `int` sum wraps
      around, `Math.addExact` throws, and the `int` product wraps before it is stored in the `long`. The line `2147483648`
      is wrong because the sum of two `int` values is an `int` and overflows. The second `5000000000` instead of
      `705032704` is wrong because the `int` multiplication is computed before the assignment widens it to `long`.
      The output without `integer overflow` is wrong because `Math.addExact` throws `ArithmeticException` if the
      result overflows an `int`.'
  citation: javadoc-math#addExact(int,int)
  snippet: m11-l02/OverflowCheck.java
- id: m11-l02-q08
  prompt:
    en: According to the `java.util.concurrent` package documentation and the Java Language Specification, which
      statement about happens-before relationships between two threads is correct?
  options:
  - id: a
    text:
      en: A write to a plain field happens-before any read of it by another thread, with no further synchronization
  - id: b
    correct: true
    text:
      en: A write to a `volatile` field happens-before every subsequent read of that same field
  - id: c
    text:
      en: A call to `join()` on a thread happens-before every action performed by the joined thread
  - id: d
    text:
      en: Exiting a `synchronized` block happens-before the next lock of any monitor
  explanation:
    en: A write to a `volatile` field happens-before every subsequent read of that same field. The claim about a
      plain field is wrong because writes that are in a data race with reads in another thread may appear to occur
      out of order to those reads. The claim about `join()` is wrong because it is the actions in the joined thread
      that happen-before the successful return from `join()` in the other thread. The claim about any monitor is
      wrong because an unlock happens-before only a subsequent lock of that same monitor.
  citation: javadoc-concurrent-package#MemoryVisibility; jls-17#jls-17.4.5
- id: m11-l02-q09
  prompt:
    en: Which statement about `@Transactional` is correct according to the Spring Framework reference documentation
      for annotation-driven transaction management?
  options:
  - id: a
    text:
      en: Putting the annotation on a bean is enough to start a transaction for each call
  - id: b
    text:
      en: A `@PostConstruct` method of the bean runs inside a transaction when it carries the annotation
  - id: c
    text:
      en: In proxy mode, a method that calls another `@Transactional` method of the same bean starts a transaction
        for that call
  - id: d
    correct: true
    text:
      en: The annotation is merely metadata, which runtime infrastructure consumes to configure beans with transactional
        behavior
  explanation:
    en: The `@Transactional` annotation is merely metadata that runtime infrastructure consumes to configure beans
      with transactional behavior. The claim that putting the annotation on a bean is enough is wrong because the
      mere presence of the annotation is not enough to activate the transactional behavior. The claim about a `@PostConstruct`
      method is wrong because the proxy must be fully initialized, so the feature should not be relied on in initialization
      code. The claim about a call to another method of the same bean is wrong because self-invocation does not
      lead to an actual transaction in proxy mode.
  citation: spring-fw-tx-declarative-annotations#using-transactional
- id: m11-l02-q13
  prompt:
    en: A `BigDecimal` holds `2.0` and another holds `2.00`. According to the `BigDecimal` Javadoc, what does `equals`
      report for these two numerically equal values, and why?
  options:
  - id: a
    correct: true
    text:
      en: '`false`, because `equals` requires both the numerical value and the representation to be the same'
  - id: b
    text:
      en: '`true`, because `equals` compares only the numerical value of the two numbers'
  - id: c
    text:
      en: '`true`, because the natural ordering of `BigDecimal` is consistent with `equals`'
  - id: d
    text:
      en: '`true`, because `scale()` and `unscaledValue()` return the same results for numerically equal values'
  explanation:
    en: The result is `false`, because the `equals` method requires both the numerical value and the representation
      to be the same for equality to hold. Comparing only the numerical value is ruled out by that same requirement.
      A natural ordering consistent with `equals` is ruled out because the natural ordering of `BigDecimal` is inconsistent
      with `equals`. Equal `scale()` and `unscaledValue()` results are ruled out because those results differ for
      numerically equal values with different representations.
  citation: javadoc-bigdecimal#class-bigdecimal
- id: m11-l02-q14
  prompt:
    en: In `ZonedDateTime`, a local date-time falls in the middle of an overlap, when clocks are set back. Which
      offset does the Javadoc's general strategy give the resulting zoned date-time?
  options:
  - id: a
    text:
      en: None, because an overlap has zero valid offsets for that local date-time
  - id: b
    text:
      en: The earlier offset is always used, even when a previous offset exists
  - id: c
    correct: true
    text:
      en: The previous offset is retained
  - id: d
    text:
      en: The later offset, with the local date-time shifted forwards by the length of the overlap
  explanation:
    en: The previous offset is retained, as the general strategy for overlaps says. Zero valid offsets is ruled
      out because an overlap has two valid offsets. Always using the earlier offset is ruled out because the earlier
      offset is used only when there is no previous offset or the previous one is invalid. Shifting forwards into
      the later offset is ruled out because that is the strategy for gaps, while for overlaps the previous offset
      will be retained.
  citation: javadoc-zoneddatetime#class-zoneddatetime
