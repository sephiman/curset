# anchor: boe-a-2007-15984-art-171
- id: m03-l08-q0114
  prompt:
    es: "¿Qué otros documentos pueden examinarse según el artículo 171.1.e del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, además de los enumerados en las letras anteriores?"
  options:
  - id: a
    text:
      es: "Solo los documentos, datos e informes que el obligado haya aportado voluntariamente al procedimiento."
  - id: b
    text:
      es: "Los documentos y antecedentes con trascendencia tributaria, siempre que obren en poder de la Administración."
  - id: c
    text:
      es: "Cualquier documento privado del obligado, aunque carezca de relación con la comprobación que se realiza."
  - id: d
    correct: true
    text:
      es: "Documentos, datos, informes, antecedentes y cualquier otro documento con trascendencia tributaria."
  explanation:
    es: "La letra e) añade documentos, datos, informes, antecedentes y cualquier otro documento con trascendencia tributaria. No se limita a lo aportado voluntariamente ni a lo que ya obre en la Administración, y exige trascendencia tributaria, de modo que no basta con que sea un documento privado."
  citation: "art. 171.1 RGAT"
  difficulty: 3
  tags:
  - "documentación"
# anchor: boe-a-2003-23186-art-142
- id: m03-l08-q0122
  prompt:
    es: "De acuerdo con el artículo 142.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la facultad de entrada de los funcionarios de inspección:"
  options:
  - id: a
    correct: true
    text:
      es: "Pueden entrar, en las condiciones que reglamentariamente se determinen, en los lugares en que existan bienes sujetos a tributación o alguna prueba de los hechos imponibles."
  - id: b
    text:
      es: "Pueden entrar en cualquier lugar, incluido el domicilio constitucionalmente protegido, sin acuerdo de entrada de la autoridad administrativa."
  - id: c
    text:
      es: "Pueden entrar únicamente en los locales de negocio, pero no en fincas ni en otros establecimientos del obligado."
  - id: d
    text:
      es: "Pueden entrar en los lugares en que se desarrollen actividades gravadas, siempre que exista una autorización judicial previa."
  explanation:
    es: "El artículo 142.2 permite entrar, en las condiciones que fije el reglamento, en las fincas, locales y establecimientos donde existan actividades gravadas, bienes sujetos a tributación, hechos imponibles o pruebas de ellos. El domicilio protegido exige consentimiento o autorización judicial. No se limita a los locales ni requiere autorización judicial para lugares que no son domicilio."
  citation: "art. 142.2 LGT"
  difficulty: 3
  tags:
  - "entrada"
  - "facultades"
# anchor: boe-a-2007-15984-art-171
- id: m03-l08-q0137
  prompt:
    es: "Conforme al artículo 171.1.d del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿qué facturas y justificantes pueden examinarse en las actuaciones inspectoras?"
  options:
  - id: a
    text:
      es: "Solo las facturas que el obligado haya emitido a clientes y registrado en el libro registro de facturas expedidas."
  - id: b
    correct: true
    text:
      es: "Las facturas, justificantes y documentos sustitutivos que deban emitir o conservar los obligados tributarios."
  - id: c
    text:
      es: "Las facturas y justificantes que obren en poder de terceros, previo requerimiento del órgano competente para liquidar."
  - id: d
    text:
      es: "Las facturas emitidas en el período inspeccionado, excluidos los documentos sustitutivos y los justificantes de gastos."
  explanation:
    es: "La letra d) del artículo 171.1 abarca facturas, justificantes y documentos sustitutivos que el obligado deba emitir o conservar. No se limita a las emitidas ni a las registradas, y no excluye los documentos sustitutivos."
  citation: "art. 171.1 RGAT"
  difficulty: 2
  tags:
  - "documentación"
  - "facturas"
# anchor: boe-a-2007-15984-art-172
- id: m03-l08-q0144
  prompt:
    es: "¿Qué puede acompañar al acuerdo de entrada en los casos de oposición del obligado, según el artículo 172.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "La interrupción automática del plazo de duración de las actuaciones."
  - id: b
    text:
      es: "La suspensión de la prescripción del derecho a liquidar de la Administración."
  - id: c
    text:
      es: "La remisión del expediente al Ministerio Fiscal para su investigación."
  - id: d
    correct: true
    text:
      es: "La adopción de las medidas cautelares que procedan."
  explanation:
    es: "El artículo 172.2 dice que el acuerdo de entrada se adopta sin perjuicio de la adopción de las medidas cautelares que procedan. No prevé interrupción del plazo, suspensión de la prescripción ni remisión al Ministerio Fiscal."
  citation: "art. 172.2 RGAT"
  difficulty: 1
  tags:
  - "entrada"
  - "medidas cautelares"
# anchor: boe-a-2003-23186-art-142
- id: m03-l08-q0145
  prompt:
    es: "Según el artículo 142.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿de quién debe obtener el consentimiento la inspección para acceder a los lugares sin acuerdo de entrada?"
  options:
  - id: a
    text:
      es: "Únicamente del obligado tributario, aunque los lugares estén bajo custodia de otra persona."
  - id: b
    text:
      es: "Del órgano competente para liquidar, que otorga el consentimiento en nombre del obligado."
  - id: c
    correct: true
    text:
      es: "Del obligado tributario o de la persona bajo cuya custodia se encuentren los lugares."
  - id: d
    text:
      es: "De la autoridad administrativa que reglamentariamente se determine, mediante acuerdo notificado."
  explanation:
    es: "El consentimiento puede otorgarlo el obligado o la persona bajo cuya custodia estén los lugares (art. 142.2). No se limita al obligado ni lo da el órgano que liquida, y el acuerdo de la autoridad administrativa es la alternativa al consentimiento, no una forma de prestarlo."
  citation: "art. 142.2 LGT"
  difficulty: 1
  tags:
  - "entrada"
  - "consentimiento"
# anchor: boe-a-2007-15984-art-171
- id: m03-l08-q0314
  prompt:
    es: "Conforme al artículo 171.3 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos, el lunes 9 de marzo de 2026 se notifica a Aceites Jaén, S.L. un requerimiento de datos que no deben hallarse a disposición inmediata de la Administración. Sin festivos en el período, ¿cuándo termina el plazo general para contestarlo?"
  options:
  - id: a
    text:
      es: "El jueves 19 de marzo de 2026, a los diez días naturales contados desde el día siguiente a la notificación."
  - id: b
    text:
      es: "El viernes 20 de marzo de 2026, a los diez días hábiles contados desde el mismo día de la notificación."
  - id: c
    correct: true
    text:
      es: "El lunes 23 de marzo de 2026, a los diez días hábiles contados desde el día siguiente a la notificación."
  - id: d
    text:
      es: "El jueves 9 de abril de 2026, a un mes desde el día siguiente a la notificación."
  explanation:
    es: "Para los datos, informes o antecedentes que no deban hallarse a disposición inmediata de la Administración, el plazo general es de 10 días hábiles contados desde el siguiente al de la notificación (art. 171.3). Desde el martes 10 de marzo, los diez días hábiles, sin sábados ni domingos, acaban el lunes 23 de marzo de 2026. Contar días naturales da el 19 de marzo, y la norma dice hábiles. Contar el mismo día de la notificación como primero da el 20, y la norma empieza al día siguiente. Un mes no es el plazo del requerimiento."
  citation: "art. 171.3 RGAT"
  difficulty: 2
  tags:
  - "cómputo"
  - "requerimiento"
  - "días hábiles"
# anchor: boe-a-2003-23186-art-143
- id: m03-l08-q0029
  prompt:
    es: "De acuerdo con el artículo 143.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las actuaciones de la inspección de los tributos se documentarán en:"
  options:
  - id: a
    text:
      es: "Comunicaciones, requerimientos, diligencias y resoluciones."
  - id: b
    correct: true
    text:
      es: "Comunicaciones, diligencias, informes y actas."
  - id: c
    text:
      es: "Diligencias, informes, actas y propuestas de liquidación."
  - id: d
    text:
      es: "Comunicaciones, notificaciones, informes y acuerdos de liquidación."
  explanation:
    es: "El artículo 143.1 enumera cuatro documentos: comunicaciones, diligencias, informes y actas. Los requerimientos se efectúan mediante comunicaciones, las propuestas de liquidación se recogen en las actas y las notificaciones y los acuerdos de liquidación no son documentos de este listado."
  citation: "art. 143.1 LGT"
  difficulty: 1
  tags:
  - "documentación"
  - "actas"
# anchor: boe-a-2007-15984-art-175
- id: m03-l08-q0030
  prompt:
    es: "Según el artículo 175 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, además de en comunicaciones, diligencias, informes y actas, ¿en qué otros documentos se documentan las actuaciones inspectoras?"
  options:
  - id: a
    text:
      es: "En los certificados que expidan los órganos de inspección a solicitud del obligado."
  - id: b
    text:
      es: "En los requerimientos de información que se dirijan a terceros distintos del obligado en el curso del procedimiento."
  - id: c
    correct: true
    text:
      es: "En los demás documentos en los que se incluyan actos de liquidación y otros acuerdos resolutorios."
  - id: d
    text:
      es: "En los acuerdos de entrada que dicten el delegado o el director de departamento."
  explanation:
    es: "El artículo 175 completa la lista con los demás documentos en que se incluyan actos de liquidación y otros acuerdos resolutorios. Certificados, requerimientos a terceros y acuerdos de entrada no son la categoría que el artículo añade."
  citation: "art. 175 RGAT"
  difficulty: 2
  tags:
  - "documentación"
  - "liquidación"
# anchor: boe-a-2003-23186-art-99
- id: m03-l08-q0032
  prompt:
    es: "Según el artículo 99.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las diligencias son los documentos públicos que se extienden para hacer constar:"
  options:
  - id: a
    text:
      es: "El resultado de las actuaciones de comprobación e investigación y la propuesta de regularización que proceda formulada por el actuario."
  - id: b
    text:
      es: "Los requerimientos que se efectúen a cualquier persona o entidad en el curso del procedimiento."
  - id: c
    text:
      es: "Los informes preceptivos que soliciten otros órganos de las Administraciones públicas."
  - id: d
    correct: true
    text:
      es: "Hechos, así como las manifestaciones del obligado tributario o de la persona con la que se entiendan las actuaciones."
  explanation:
    es: "Las diligencias hacen constar hechos y manifestaciones del obligado o de quien atiende las actuaciones (art. 99.7). El resultado y la propuesta de regularización van en el acta, los requerimientos en las comunicaciones y los informes preceptivos se emiten por separado."
  citation: "art. 99.7 LGT"
  difficulty: 1
  tags:
  - "diligencias"
# anchor: boe-a-2003-23186-art-99
- id: m03-l08-q0033
  prompt:
    es: "¿En qué documento se deja constancia, según el artículo 99.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, de las manifestaciones del obligado tributario durante unas actuaciones inspectoras?"
  options:
  - id: a
    text:
      es: "En una comunicación de inicio del procedimiento."
  - id: b
    text:
      es: "En un informe del actuario sobre las actuaciones."
  - id: c
    text:
      es: "En un acuerdo del órgano competente para liquidar."
  - id: d
    correct: true
    text:
      es: "En una diligencia."
  explanation:
    es: "Las manifestaciones del obligado o de la persona con quien se entienden las actuaciones se hacen constar en diligencias (art. 99.7). La comunicación notifica el inicio u otros hechos, el informe completa información, y el acuerdo del órgano que liquida resuelve sobre la propuesta."
  citation: "art. 99.7 LGT"
  difficulty: 1
  tags:
  - "diligencias"
  - "documentación"
# anchor: boe-a-2003-23186-art-99
- id: m03-l08-q0034
  prompt:
    es: "Conforme al artículo 99.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale lo que NO pueden contener las diligencias que se extienden en los procedimientos de aplicación de los tributos:"
  options:
  - id: a
    text:
      es: "Hechos con relevancia tributaria que consten en el expediente."
  - id: b
    text:
      es: "Manifestaciones del obligado tributario o de la persona con la que se entienden las actuaciones."
  - id: c
    correct: true
    text:
      es: "Propuestas de liquidaciones tributarias, en ningún caso."
  - id: d
    text:
      es: "Comunicaciones que se incorporen a su contenido."
  explanation:
    es: "El artículo 99.7 prohíbe que las diligencias contengan propuestas de liquidaciones tributarias. Sí pueden hacer constar hechos y manifestaciones del obligado, y las comunicaciones pueden incorporarse al contenido de las diligencias que se extiendan."
  citation: "art. 99.7 LGT"
  difficulty: 2
  tags:
  - "diligencias"
  - "propuesta de liquidación"
# anchor: boe-a-2007-15984-art-87
- id: m03-l08-q0038
  prompt:
    es: "Según el artículo 87.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿cuál de los siguientes contenidos incluye la comunicación de inicio de un procedimiento, cuando proceda?"
  options:
  - id: a
    correct: true
    text:
      es: "El requerimiento que, en su caso, se formula al obligado tributario y el plazo que se concede para su contestación o cumplimiento."
  - id: b
    text:
      es: "La relación de bienes del obligado tributario sobre los que podrán adoptarse medidas cautelares."
  - id: c
    text:
      es: "La propuesta de sanción que corresponda por las infracciones que se aprecien en el procedimiento."
  - id: d
    text:
      es: "El nombre del órgano competente para liquidar y la fecha prevista para el trámite de audiencia."
  explanation:
    es: "La letra c) del artículo 87.3 recoge el requerimiento y su plazo de contestación. No se incluyen en la comunicación de inicio una relación de bienes para medidas cautelares, una propuesta de sanción ni la fecha del trámite de audiencia, que se fija al abrir ese trámite."
  citation: "art. 87.3 RGAT"
  difficulty: 2
  tags:
  - "comunicación de inicio"
  - "requerimiento"
# anchor: boe-a-2007-15984-art-87
- id: m03-l08-q0039
  prompt:
    es: "Conforme al artículo 87.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, la comunicación de inicio incluirá el objeto del procedimiento, con indicación expresa de:"
  options:
  - id: a
    text:
      es: "Las obligaciones tributarias y los períodos prescritos, para que el obligado pueda alegar la prescripción."
  - id: b
    text:
      es: "Los tributos objeto de comprobación, sin referencia a períodos, que se fijan en el trámite de audiencia."
  - id: c
    text:
      es: "Las obligaciones formales y materiales del obligado, con la cuantía que se estima regularizable."
  - id: d
    correct: true
    text:
      es: "Las obligaciones tributarias o elementos de las mismas y, en su caso, los períodos impositivos o de liquidación o el ámbito temporal."
  explanation:
    es: "La letra b) del artículo 87.3 pide indicar las obligaciones tributarias o elementos de ellas y, en su caso, los períodos o el ámbito temporal. No exige citar períodos prescritos, ni omitir los períodos, ni fijar una cuantía estimada."
  citation: "art. 87.3 RGAT"
  difficulty: 2
  tags:
  - "comunicación de inicio"
  - "objeto"
# anchor: boe-a-2003-23186-art-143
- id: m03-l08-q0040
  prompt:
    es: "Según el artículo 143.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las actas son los documentos públicos que extiende la inspección de los tributos con el fin de recoger el resultado de las actuaciones inspectoras de comprobación e investigación, proponiendo:"
  options:
  - id: a
    text:
      es: "La regularización que el obligado haya estimado procedente de su situación tributaria."
  - id: b
    correct: true
    text:
      es: "La regularización que estime procedente de la situación tributaria del obligado o declarando correcta la misma."
  - id: c
    text:
      es: "La liquidación definitiva de la situación tributaria del obligado, con carácter inmediato y ejecutivo desde su formalización."
  - id: d
    text:
      es: "La sanción que corresponda a las infracciones apreciadas, o declarando que no existen."
  explanation:
    es: "El acta propone la regularización que estime procedente la inspección, o declara correcta la situación del obligado (art. 143.2). No la propone el obligado, no es una liquidación definitiva, porque la dicta el órgano que liquida, y no propone la sanción."
  citation: "art. 143.2 LGT"
  difficulty: 2
  tags:
  - "actas"
# anchor: boe-a-2003-23186-art-144
- id: m03-l08-q0041
  prompt:
    es: "De acuerdo con el artículo 144 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el valor probatorio de las actas de la inspección:"
  options:
  - id: a
    text:
      es: "Tienen naturaleza de documentos públicos y hacen prueba de los hechos que motiven su formalización, sin que quepa prueba en contrario alguna."
  - id: b
    text:
      es: "Tienen naturaleza de documentos privados y hacen prueba de los hechos solo si el obligado las suscribe."
  - id: c
    text:
      es: "Tienen naturaleza de documentos públicos y hacen prueba de los hechos y de la valoración jurídica que contienen."
  - id: d
    correct: true
    text:
      es: "Tienen naturaleza de documentos públicos y hacen prueba de los hechos que motiven su formalización, salvo que se acredite lo contrario."
  explanation:
    es: "El artículo 144.1 les da naturaleza de documentos públicos y valor de prueba de los hechos, con una salvedad: salvo que se acredite lo contrario. No es una prueba sin posibilidad de contradicción, el acta no es un documento privado y su valor no alcanza a la valoración jurídica."
  citation: "art. 144 LGT"
  difficulty: 1
  tags:
  - "actas"
  - "valor probatorio"
# anchor: boe-a-2003-23186-art-144
- id: m03-l08-q0042
  prompt:
    es: "Conforme al artículo 144.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los hechos aceptados por los obligados tributarios en las actas de inspección se presumen ciertos y solo podrán rectificarse mediante:"
  options:
  - id: a
    correct: true
    text:
      es: "Prueba de haber incurrido en error de hecho."
  - id: b
    text:
      es: "Prueba de haber incurrido en error de derecho."
  - id: c
    text:
      es: "Simple manifestación del obligado de que se arrepiente de su conformidad."
  - id: d
    text:
      es: "Resolución del órgano competente para liquidar, a petición del actuario."
  explanation:
    es: "Los hechos aceptados se presumen ciertos y solo se rectifican probando error de hecho (art. 144.2). El error de derecho no rectifica hechos, la mera manifestación del obligado no es prueba y el órgano que liquida no tiene la facultad de rectificarlos a petición del actuario."
  citation: "art. 144 LGT"
  difficulty: 2
  tags:
  - "actas"
  - "error de hecho"
# anchor: boe-a-2003-23186-art-153
- id: m03-l08-q0043
  prompt:
    es: "De acuerdo con el artículo 153 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las menciones que deben contener, al menos, las actas que documenten el resultado de las actuaciones inspectoras:"
  options:
  - id: a
    text:
      es: "La sanción que corresponda a las infracciones tributarias que el actuario aprecie en la conducta del obligado."
  - id: b
    correct: true
    text:
      es: "La existencia o inexistencia, en opinión del actuario, de indicios de la comisión de infracciones tributarias."
  - id: c
    text:
      es: "El plazo de los cinco días en que el obligado puede revocar la conformidad manifestada en el acta."
  - id: d
    text:
      es: "La fecha de la resolución del órgano competente para liquidar que ratifica las medidas cautelares."
  explanation:
    es: "La letra g) del artículo 153 exige hacer constar si existen o no indicios de infracción tributaria, en opinión del actuario, no la sanción. El obligado no puede revocar la conformidad (art. 187.4 RGAT) y las medidas cautelares se ratifican en una resolución posterior ajena al contenido del acta."
  citation: "art. 153 LGT"
  difficulty: 2
  tags:
  - "actas"
  - "contenido"
# anchor: boe-a-2003-23186-art-153
- id: m03-l08-q0044
  prompt:
    es: "Según el artículo 153 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las actas que documenten el resultado de las actuaciones inspectoras contendrán, al menos, el lugar y la fecha de su formalización y:"
  options:
  - id: a
    text:
      es: "La conformidad o disconformidad del obligado tributario solo con la propuesta de liquidación, sin referirse a la regularización."
  - id: b
    text:
      es: "La conformidad del obligado tributario, que se presume si no comparece en la fecha señalada."
  - id: c
    correct: true
    text:
      es: "La conformidad o disconformidad del obligado tributario con la regularización y con la propuesta de liquidación."
  - id: d
    text:
      es: "La disconformidad del obligado tributario, que debe razonarse por escrito en un informe independiente."
  explanation:
    es: "La letra e) pide hacer constar la conformidad o disconformidad con la regularización y con la propuesta de liquidación, ambas. La falta de comparecencia no presume conformidad, pues el acta se tramita como de disconformidad, y la disconformidad no exige un informe razonado del obligado."
  citation: "art. 153 LGT"
  difficulty: 2
  tags:
  - "actas"
  - "contenido"
# anchor: boe-a-2003-23186-art-153
- id: m03-l08-q0047
  prompt:
    es: "Según el artículo 153 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué elementos del hecho imponible deben constar en las actas de inspección?"
  options:
  - id: a
    text:
      es: "Todos los elementos del hecho imponible, sin necesidad de indicar los fundamentos de derecho en que se base la regularización."
  - id: b
    text:
      es: "Los elementos esenciales del hecho imponible, sin necesidad de indicar su atribución al obligado tributario."
  - id: c
    correct: true
    text:
      es: "Los elementos esenciales del hecho imponible o presupuesto de hecho y su atribución al obligado tributario, así como los fundamentos de derecho de la regularización."
  - id: d
    text:
      es: "Los fundamentos de derecho de la regularización, sin necesidad de referirse a los elementos del hecho imponible."
  explanation:
    es: "La letra c) exige los elementos esenciales del hecho imponible, su atribución al obligado y los fundamentos de derecho de la regularización, todo junto. Las otras opciones suprimen alguno de los tres componentes, o piden todos los elementos y no solo los esenciales."
  citation: "art. 153 LGT"
  difficulty: 2
  tags:
  - "actas"
  - "contenido"
# anchor: boe-a-2007-15984-art-176
- id: m03-l08-q0048
  prompt:
    es: "Conforme al artículo 176.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, en las actas de inspección se consignarán, además de las menciones del artículo 153 de la Ley General Tributaria, el nombre y apellidos de los funcionarios que las suscriban y:"
  options:
  - id: a
    correct: true
    text:
      es: "La fecha de inicio de las actuaciones, el plazo del procedimiento y las circunstancias que afectan a su cómputo."
  - id: b
    text:
      es: "La fecha de inicio de las actuaciones y el plazo del procedimiento, sin las circunstancias que afectan a su cómputo."
  - id: c
    text:
      es: "La fecha de la última actuación practicada y el plazo restante hasta que venza el procedimiento."
  - id: d
    text:
      es: "La fecha de ratificación de las medidas cautelares y el plazo del procedimiento sancionador."
  explanation:
    es: "La letra b) del artículo 176.1 exige fecha de inicio, plazo del procedimiento y circunstancias que afectan a su cómputo según los apartados 3, 4 y 5 del artículo 150. Omitir las circunstancias recorta la mención. La última actuación o el plazo restante no se consignan, ni tampoco las medidas cautelares o el procedimiento sancionador."
  citation: "art. 176.1 RGAT"
  difficulty: 3
  tags:
  - "actas"
  - "contenido"
# anchor: boe-a-2007-15984-art-176
- id: m03-l08-q0050
  prompt:
    es: "Según el artículo 176.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, en relación con cada obligación tributaria podrá extenderse una única acta respecto de todo el ámbito temporal objeto de la comprobación, de modo que la deuda resultante se determine:"
  options:
  - id: a
    correct: true
    text:
      es: "Mediante la suma algebraica de las liquidaciones referidas a los distintos períodos comprobados."
  - id: b
    text:
      es: "Mediante la media aritmética de las liquidaciones referidas a los distintos períodos comprobados."
  - id: c
    text:
      es: "Mediante la liquidación del último período comprobado, que absorbe a las anteriores."
  - id: d
    text:
      es: "Mediante la suma de las liquidaciones de los períodos con resultado a ingresar, sin compensar las demás."
  explanation:
    es: "El artículo 176.3 permite un acta única por obligación con la deuda como suma algebraica de las liquidaciones de cada período. Eso supone compensar los resultados positivos y negativos, no sumar solo los de ingreso. No se promedia ni se toma solo el último período."
  citation: "art. 176.3 RGAT"
  difficulty: 3
  tags:
  - "actas"
  - "acta única"
# anchor: boe-a-2007-15984-art-185
- id: m03-l08-q0051
  prompt:
    es: "Conforme al artículo 185.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, las actas de inspección no pueden ser objeto de recurso o reclamación económico-administrativa, sin perjuicio de los que procedan:"
  options:
  - id: a
    text:
      es: "Contra las propuestas de regularización que contengan, ante el órgano competente para liquidar."
  - id: b
    text:
      es: "Contra la negativa del obligado a suscribirlas, ante el Tribunal Económico-Administrativo competente."
  - id: c
    text:
      es: "Contra las diligencias que las precedan, ante el jefe del equipo de inspección."
  - id: d
    correct: true
    text:
      es: "Contra las liquidaciones tributarias resultantes de aquellas."
  explanation:
    es: "El acta no se recurre. Se recurre la liquidación que resulte de ella (art. 185.4). La propuesta de regularización no es un acto recurrible, la negativa a suscribir el acta determina su tramitación como de disconformidad y las diligencias no abren recurso ante el jefe de equipo."
  citation: "art. 185.4 RGAT"
  difficulty: 1
  tags:
  - "actas"
  - "recursos"
# anchor: boe-a-2003-23186-art-143
- id: m03-l08-q0123
  prompt:
    es: "Conforme al artículo 143.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál de las siguientes afirmaciones sobre las actas de inspección es cierta?"
  options:
  - id: a
    text:
      es: "Son documentos privados que el obligado extiende para recoger el resultado de las actuaciones de la inspección."
  - id: b
    correct: true
    text:
      es: "Son documentos públicos que recogen el resultado de las actuaciones de comprobación e investigación."
  - id: c
    text:
      es: "Son documentos públicos que recogen únicamente las manifestaciones del obligado tributario ante el actuario."
  - id: d
    text:
      es: "Son documentos públicos que contienen siempre la liquidación definitiva de la deuda tributaria del obligado."
  explanation:
    es: "El artículo 143.2 define las actas como documentos públicos que extiende la inspección para recoger el resultado de sus actuaciones de comprobación e investigación. No las extiende el obligado, no se limitan a manifestaciones, que van en diligencias, y proponen una regularización, no contienen siempre la liquidación definitiva."
  citation: "art. 143.2 LGT"
  difficulty: 1
  tags:
  - "actas"
# anchor: boe-a-2003-23186-art-153
- id: m03-l08-q0125
  prompt:
    es: "Según el artículo 153 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las actas incluirán, en su caso, la regularización de la situación tributaria del obligado y:"
  options:
  - id: a
    text:
      es: "La liquidación definitiva que proceda."
  - id: b
    correct: true
    text:
      es: "La propuesta de liquidación que proceda."
  - id: c
    text:
      es: "La propuesta de sanción que proceda."
  - id: d
    text:
      es: "La resolución del órgano competente para liquidar que proceda."
  explanation:
    es: "La letra d) del artículo 153 pide la regularización y la propuesta de liquidación que proceda. La liquidación la dicta después el órgano competente para liquidar, y la sanción se propone, en su caso, en el procedimiento sancionador, salvo en el acta con acuerdo, que añade ese contenido por su artículo 155.2."
  citation: "art. 153 LGT"
  difficulty: 1
  tags:
  - "actas"
  - "contenido"
# anchor: boe-a-2003-23186-art-153
- id: m03-l08-q0127
  prompt:
    es: "De acuerdo con el artículo 153 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las menciones de las actas de inspección:"
  options:
  - id: a
    correct: true
    text:
      es: "También deben contener las demás menciones que se establezcan reglamentariamente."
  - id: b
    text:
      es: "Deben contener únicamente las menciones que enumera el artículo, sin posibilidad de añadir otras por reglamento."
  - id: c
    text:
      es: "Deben contener las menciones que establezca la persona con la que se entienden las actuaciones."
  - id: d
    text:
      es: "Deben contener las menciones que fije cada órgano de inspección mediante instrucciones internas."
  explanation:
