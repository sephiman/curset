# anchor: boe-a-2015-10566-art-51
- id: m03-l03-q059
  prompt:
    es: "¿Cuál de las siguientes es causa de resolución de los convenios según el artículo 51.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "El acuerdo de la mayoría de los firmantes."
  - id: b
    text:
      es: "La renuncia de cualquiera de los firmantes, sin causa."
  - id: c
    correct: true
    text:
      es: "El acuerdo unánime de todos los firmantes."
  - id: d
    text:
      es: "El cambio de titular del órgano que firmó el convenio."
  explanation:
    es: "La letra b) del artículo 51.2 LRJSP recoge «el acuerdo unánime de todos los firmantes». Un acuerdo de la mayoría no basta. La renuncia sin causa de un firmante y el cambio de titular del órgano no figuran entre las causas."
  citation: "art. 51.2 LRJSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-51
- id: m03-l03-q060
  prompt:
    es: "Según el artículo 51.2.c) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, el requerimiento a la parte incumplidora de un convenio para que cumpla en un determinado plazo se comunicará:"
  options:
  - id: a
    text:
      es: "al Tribunal de Cuentas y a las demás partes firmantes, en el plazo de un mes desde su envío."
  - id: b
    text:
      es: "a la Abogacía del Estado y al responsable del mecanismo de seguimiento, vigilancia y control."
  - id: c
    text:
      es: "al Registro Electrónico estatal de Órganos e Instrumentos de Cooperación, para su inscripción."
  - id: d
    correct: true
    text:
      es: "al responsable del mecanismo de seguimiento, vigilancia y control y a las demás partes firmantes."
  explanation:
    es: "El artículo 51.2.c) LRJSP dice que el requerimiento «será comunicado al responsable del mecanismo de seguimiento, vigilancia y control de la ejecución del convenio y a las demás partes firmantes». El Tribunal de Cuentas recibe los convenios de más de 600.000 euros (artículo 53). La Abogacía del Estado no aparece. Al Registro estatal de Órganos e Instrumentos de Cooperación se comunica la prórroga, no el requerimiento."
  citation: "art. 51.2.c) LRJSP"
  difficulty: 3
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-51
- id: m03-l03-q061
  prompt:
    es: "Según el artículo 51.2.c) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué ocurre si, pasado el plazo del requerimiento, la parte incumplidora de un convenio sigue sin cumplir?"
  options:
  - id: a
    correct: true
    text:
      es: "Quien lo dirigió notifica a los firmantes la causa de resolución y el convenio se entiende resuelto."
  - id: b
    text:
      es: "Quien lo dirigió debe pedir al juez que declare resuelto el convenio por incumplimiento."
  - id: c
    text:
      es: "El convenio queda suspendido hasta que la parte incumplidora cumpla sus obligaciones."
  - id: d
    text:
      es: "La comisión de seguimiento impone a la parte incumplidora una penalidad por cada día de retraso."
  explanation:
    es: "El artículo 51.2.c) LRJSP dice que, si persiste el incumplimiento, «la parte que lo dirigió notificará a las partes firmantes la concurrencia de la causa de resolución y se entenderá resuelto el convenio». No hace falta acudir al juez; la decisión judicial es otra causa, la de nulidad. El convenio no queda suspendido. La comisión de seguimiento no impone penalidades en este artículo."
  citation: "art. 51.2.c) LRJSP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2015-10566-art-51
- id: m03-l03-q062
  prompt:
    es: "Un convenio entre dos Administraciones Públicas se resuelve porque una de ellas incumple sus compromisos. ¿Procede indemnizar a la otra por los perjuicios causados?"
  options:
  - id: a
    text:
      es: "Sí, en todo caso, por el importe de los perjuicios que se acrediten."
  - id: b
    text:
      es: "No, porque la resolución por incumplimiento excluye toda indemnización."
  - id: c
    correct: true
    text:
      es: "Sí, si así se hubiera previsto; la indemnización no es automática."
  - id: d
    text:
      es: "Sí, en la cuantía que fije el Tribunal de Cuentas al fiscalizar el convenio."
  explanation:
    es: "El artículo 51.2.c) LRJSP dice: «La resolución del convenio por esta causa podrá conllevar la indemnización de los perjuicios causados si así se hubiera previsto». La indemnización depende de lo previsto: no procede en todo caso, pero tampoco está excluida. El Tribunal de Cuentas no fija su cuantía."
  citation: "art. 51.2.c) LRJSP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10566-art-51
- id: m03-l03-q063
  prompt:
    es: "Entre las causas de resolución de los convenios que enumera la legislación de régimen jurídico del sector público figura:"
  options:
  - id: a
    text:
      es: "la resolución administrativa de un firmante que declare su nulidad."
  - id: b
    text:
      es: "el cese del titular del órgano que firmó el convenio."
  - id: c
    text:
      es: "el informe desfavorable de la Intervención General del Estado."
  - id: d
    correct: true
    text:
      es: "la decisión judicial declaratoria de la nulidad del convenio."
  explanation:
    es: "La letra d) del artículo 51.2 LRJSP recoge la «decisión judicial declaratoria de la nulidad del convenio». La nulidad la declara un juez, no un firmante por resolución administrativa. El cese del titular del órgano y el informe de la Intervención General no figuran entre las causas."
  citation: "art. 51.2 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-53
- id: m03-l03-q064
  prompt:
    es: "Deben remitirse electrónicamente al Tribunal de Cuentas, dentro de los tres meses siguientes a su suscripción, los convenios de la Administración General del Estado cuyos compromisos económicos asumidos:"
  options:
  - id: a
    text:
      es: "sean superiores a 300.000 euros."
  - id: b
    correct: true
    text:
      es: "sean superiores a 600.000 euros."
  - id: c
    text:
      es: "sean superiores a un millón de euros."
  - id: d
    text:
      es: "sean iguales o superiores a 500.000 euros."
  explanation:
    es: "El artículo 53.1 LRJSP fija el umbral en los convenios «cuyos compromisos económicos asumidos superen los 600.000 euros». Ni 300.000, ni 500.000, ni un millón de euros son la cifra de la ley."
  citation: "art. 53.1 LRJSP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-10566-art-123
- id: m03-l03-q066
  prompt:
    es: "¿Cuál de los siguientes es el instrumento por el que se crean los consorcios, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Un real decreto del Consejo de Ministros, a propuesta del Ministerio de Hacienda."
  - id: b
    text:
      es: "Una ley de las Cortes Generales, cualesquiera que sean las Administraciones participantes."
  - id: c
    correct: true
    text:
      es: "Un convenio suscrito por las Administraciones, organismos públicos o entidades participantes."
  - id: d
    text:
      es: "Una orden del Ministerio al que vaya a quedar adscrito el consorcio una vez creado."
  explanation:
    es: "El artículo 123.1 LRJSP dice que los consorcios «se crearán mediante convenio suscrito por las Administraciones, organismos públicos o entidades participantes». La ley de las Cortes solo interviene cuando participa la Administración General del Estado, según el artículo 123.2.a), y aun así el instrumento de creación sigue siendo el convenio. El real decreto no es el instrumento: el artículo 123.2.b) pide autorización previa del Consejo de Ministros para el convenio de creación. La orden ministerial tampoco: el mismo apartado atribuye la suscripción del convenio al titular del departamento ministerial participante, que firma el convenio."
  citation: "art. 123.1 LRJSP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-123
- id: m03-l03-q067
  prompt:
    es: "Un Ministerio y una comunidad autónoma quieren crear un consorcio para una actividad de interés común. ¿Qué autorización exige, por la participación del Estado, la creación del consorcio?"
  options:
  - id: a
    text:
      es: "Un real decreto del Consejo de Ministros, sin necesidad de ley."
  - id: b
    correct: true
    text:
      es: "Una ley, porque participa la Administración General del Estado."
  - id: c
    text:
      es: "Una orden del Ministerio de Hacienda, por razón del gasto."
  - id: d
    text:
      es: "Ninguna autorización propia: basta el convenio de las partes."
  explanation:
    es: "El artículo 123.2.a) LRJSP exige, en los consorcios en que participe la Administración General del Estado, «que su creación se autorice por ley». Un real decreto o una orden ministerial no bastan. La creación sí necesita una autorización distinta del convenio: la ley, y además la autorización previa del Consejo de Ministros para el convenio de creación."
  citation: "art. 123.2.a) LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-123
- id: m03-l03-q068
  prompt:
    es: "Según el artículo 123.2.b) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué precisa el convenio de creación de un consorcio en el que participe la Administración General del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "La autorización previa del Consejo de Ministros."
  - id: b
    text:
      es: "La autorización previa de las Cortes Generales."
  - id: c
    text:
      es: "La autorización previa del Ministerio de Hacienda."
  - id: d
    text:
      es: "La autorización previa del Presidente del Gobierno."
  explanation:
    es: "El artículo 123.2.b) LRJSP dice: «El convenio de creación precisará de autorización previa del Consejo de Ministros». Las Cortes Generales intervienen por otra vía, la ley que autoriza la creación. El Ministerio de Hacienda y el Presidente del Gobierno no son el órgano que autoriza el convenio."
  citation: "art. 123.2.b) LRJSP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-123
- id: m03-l03-q069
  prompt:
    es: "Un Ministerio va a participar en un consorcio con una universidad pública. ¿Puede su titular delegar la competencia para suscribir el convenio de creación?"
  options:
  - id: a
    text:
      es: "Sí, en el Subsecretario del departamento ministerial."
  - id: b
    text:
      es: "Sí, en el órgano directivo competente por la materia."
  - id: c
    text:
      es: "Sí, con la autorización previa del Consejo de Ministros."
  - id: d
    correct: true
    text:
      es: "No, esa competencia no puede ser objeto de delegación."
  explanation:
    es: "El artículo 123.2.b) LRJSP dice que la competencia para suscribir el convenio «no podrá ser objeto de delegación, y corresponderá al titular del departamento ministerial participante». No cabe delegarla en el Subsecretario ni en un órgano directivo. La autorización previa del Consejo de Ministros es para el convenio de creación, no una vía para delegar la firma."
  citation: "art. 123.2.b) LRJSP"
  difficulty: 2
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2015-10566-art-123
- id: m03-l03-q070
  prompt:
    es: "Según el artículo 123.2.b) de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en el ámbito de los organismos autónomos, la competencia para suscribir el convenio de creación de un consorcio corresponde:"
  options:
  - id: a
    text:
      es: "al titular del departamento ministerial de adscripción, que podrá delegarla en el organismo."
  - id: b
    correct: true
    text:
      es: "al titular del máximo órgano de dirección del organismo, previo informe del Ministerio de dependencia."
  - id: c
    text:
      es: "al titular del máximo órgano de dirección, previo informe vinculante de la Intervención General."
  - id: d
    text:
      es: "al órgano colegiado de gobierno del organismo, sin necesidad de informe ministerial previo."
  explanation:
    es: "El artículo 123.2.b) LRJSP atribuye esa competencia, en los organismos autónomos, «al titular del máximo órgano de dirección del organismo, previo informe del Ministerio del que dependa o al que esté vinculado». No es del Ministro, y en ningún caso puede delegarse. El informe es del Ministerio de dependencia, no de la Intervención General. No suscribe un órgano colegiado sin informe."
  citation: "art. 123.2.b) LRJSP"
  difficulty: 3
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10565-art-5
- id: m03-l03-q072
  prompt:
    es: "Según el artículo 5.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿quién concede el plazo para subsanar la falta de acreditación de la representación, y de cuántos días es como regla?"
  options:
  - id: a
    text:
      es: "La oficina de registro, que debe conceder diez días al efecto."
  - id: b
    text:
      es: "El órgano administrativo, que debe conceder un mes al efecto."
  - id: c
    text:
      es: "El superior jerárquico del instructor, que debe conceder tres días."
  - id: d
    correct: true
    text:
      es: "El órgano administrativo, que debe conceder diez días al efecto."
  explanation:
    es: "El artículo 5.6 LPAC habla del «plazo de diez días que deberá conceder al efecto el órgano administrativo». Lo concede el órgano que tramita, no la oficina de registro ni el superior jerárquico del instructor. El plazo de la regla es de diez días, no de un mes ni de tres días."
  citation: "art. 5.6 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-2015-10565-art-5
- id: m03-l03-q073
  prompt:
    es: "Un representante presenta alegaciones sin acreditar su representación. El órgano le concede plazo y la acredita dentro de él. ¿Qué valor tienen esas alegaciones?"
  options:
  - id: a
    text:
      es: "Deben presentarse de nuevo, ya con la representación debidamente acreditada."
  - id: b
    text:
      es: "Valen solo desde la fecha en que se acreditó la representación ante el órgano."
  - id: c
    text:
      es: "Solo valen si el interesado las ratifica después de forma personal."
  - id: d
    correct: true
    text:
      es: "Valen como presentadas, porque el defecto se subsanó dentro del plazo concedido."
  explanation:
    es: "El artículo 5.6 LPAC dice que la falta de acreditación «no impedirá que se tenga por realizado el acto de que se trate», siempre que se aporte o se subsane en el plazo concedido. Las alegaciones valen tal como se presentaron: no hay que repetirlas ni pedir al interesado que las ratifique. Su fecha tampoco pasa a ser la del día en que se acreditó la representación, porque el acto se tiene por realizado."
  citation: "art. 5.6 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10566-art-20
- id: m03-l03-q075
  prompt:
    es: "Según el artículo 20.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿puede ser órgano colegiado de la Administración General del Estado una comisión creada formalmente que integran exactamente tres personas?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque tres personas alcanzan el número mínimo que fija la ley."
  - id: b
    text:
      es: "No, porque la ley exige que lo integren siete personas como mínimo."
  - id: c
    text:
      es: "No, porque la ley exige que lo integren diez personas como mínimo."
  - id: d
    text:
      es: "Sí, pero solo si las tres personas son funcionarios de carrera."
  explanation:
    es: "El artículo 20.1 LRJSP considera órganos colegiados los que «se creen formalmente y estén integrados por tres o más personas». Tres personas bastan. Siete y diez no son el mínimo de la ley. El artículo no exige que los miembros sean funcionarios de carrera."
  citation: "art. 20.1 LRJSP"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-2015-10566-art-93
- id: m03-l03-q076
  prompt:
    es: "Según el artículo 93.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué órgano aprueba los estatutos de los organismos públicos, y mediante qué norma?"
  options:
  - id: a
    text:
      es: "Las Cortes Generales, mediante una ley."
  - id: b
    text:
      es: "El Presidente del Gobierno, mediante real decreto."
  - id: c
    text:
      es: "La Comisión General de Secretarios de Estado y Subsecretarios, mediante acuerdo."
  - id: d
    correct: true
    text:
      es: "El Consejo de Ministros, mediante real decreto."
  explanation:
    es: "El artículo 93.2 LRJSP dice que los estatutos «se aprobarán por Real Decreto del Consejo de Ministros». No se aprueban por ley. El real decreto es del Consejo de Ministros, no del Presidente del Gobierno. La Comisión General de Secretarios de Estado y Subsecretarios no aprueba normas."
  citation: "art. 93.2 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
