# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0033
  prompt:
    es: "Según el artículo 7.v) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué rentas están exentas en relación con los planes individuales de ahorro sistemático?"
  options:
  - id: a
    text:
      es: "Las que se pongan de manifiesto en el momento del cobro de cada mensualidad de la renta vitalicia asegurada resultante de dichos planes."
  - id: b
    correct: true
    text:
      es: "Las que se pongan de manifiesto en el momento de la constitución de rentas vitalicias aseguradas resultantes de dichos planes."
  - id: c
    text:
      es: "Las que se pongan de manifiesto en el momento de la constitución de seguros de vida de capital diferido vinculados a dichos planes."
  - id: d
    text:
      es: "Las que se pongan de manifiesto en el momento de la constitución de rentas vitalicias aseguradas resultantes de los planes de pensiones individuales."
  explanation:
    es: "La exención se refiere al momento de la constitución de la renta vitalicia asegurada, no al de cada cobro posterior, y a los planes individuales de ahorro sistemático (art. 7.v) LIRPF). Los planes de pensiones individuales son otra figura. Y el capital diferido no es una renta vitalicia asegurada."
  citation: "art. 7.v) LIRPF"
  difficulty: 3
  tags:
  - "exención"
  - "ahorro sistemático"
# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0034
  prompt:
    es: "Según el artículo 7.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, están exentas las prestaciones públicas extraordinarias por actos de terrorismo y las pensiones derivadas de medallas y condecoraciones concedidas:"
  options:
  - id: a
    text:
      es: "por servicios distinguidos a las Fuerzas y Cuerpos de Seguridad del Estado."
  - id: b
    correct: true
    text:
      es: "por actos de terrorismo."
  - id: c
    text:
      es: "por méritos en misiones internacionales de las Fuerzas Armadas."
  - id: d
    text:
      es: "al mérito civil o al mérito militar."
  explanation:
    es: "La letra a) exime las pensiones derivadas de medallas y condecoraciones concedidas por actos de terrorismo, además de las prestaciones públicas extraordinarias por esos actos (art. 7.a) LIRPF). Las demás distinciones no tienen esa conexión con el terrorismo."
  citation: "art. 7.a) LIRPF"
  difficulty: 2
  tags:
  - "exención"
# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0035
  prompt:
    es: "De acuerdo con el artículo 7.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿en qué cuantía están exentas las indemnizaciones como consecuencia de responsabilidad civil por daños personales?"
  options:
  - id: a
    correct: true
    text:
      es: "En la cuantía legal o judicialmente reconocida."
  - id: b
    text:
      es: "En la cuantía pactada libremente por las partes."
  - id: c
    text:
      es: "En la cuantía reconocida, con un máximo de 180.000 euros por perjudicado."
  - id: d
    text:
      es: "En la cuantía que fije la entidad aseguradora, con el límite de tres veces el indicador público de renta de efectos múltiples."
  explanation:
    es: "La indemnización por responsabilidad civil por daños personales está exenta en la cuantía legal o judicialmente reconocida (art. 7.d) LIRPF). La pactada libremente por las partes, la que fija la aseguradora con un tope y la limitada a 180.000 euros no son el criterio del artículo. Ese último tope pertenece a otra letra del artículo 7."
  citation: "art. 7.d) LIRPF"
  difficulty: 2
  tags:
  - "exención"
  - "indemnización"
# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0036
  prompt:
    es: "Conforme al artículo 7.j) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, están exentas las becas públicas percibidas para cursar estudios reglados, tanto en España como en el extranjero, en:"
  options:
  - id: a
    correct: true
    text:
      es: "todos los niveles y grados del sistema educativo, en los términos que reglamentariamente se establezcan."
  - id: b
    text:
      es: "todos los niveles y grados del sistema educativo, pero solo si se cursan en territorio español."
  - id: c
    text:
      es: "los niveles de enseñanza obligatoria y bachillerato, en los términos que reglamentariamente se establezcan."
  - id: d
    text:
      es: "los grados universitarios y de posgrado, en los términos que reglamentariamente se establezcan."
  explanation:
    es: "La letra j) cubre las becas para estudios reglados en España o en el extranjero y en todos los niveles y grados del sistema educativo (art. 7.j) LIRPF). Limitarlo a la enseñanza obligatoria, o a la universitaria y de posgrado, lo recorta. Y exigir que se cursen en España contradice la expresión tanto en España como en el extranjero."
  citation: "art. 7.j) LIRPF"
  difficulty: 2
  tags:
  - "beca"
  - "exención"
# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0037
  prompt:
    es: "De acuerdo con el artículo 7.j) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, están exentas las becas concedidas por las fundaciones bancarias reguladas en la Ley 26/2013 en el desarrollo de su actividad de:"
  options:
  - id: a
    text:
      es: "gestión de participaciones bancarias, percibidas para cursar estudios reglados."
  - id: b
    text:
      es: "obra benéfico-docente, percibidas para cursar estudios reglados."
  - id: c
    text:
      es: "mecenazgo, percibidas para cursar estudios reglados."
  - id: d
    correct: true
    text:
      es: "obra social, percibidas para cursar estudios reglados."
  explanation:
    es: "La exención alcanza las becas de las fundaciones bancarias en el desarrollo de su actividad de obra social (art. 7.j) LIRPF). El mecenazgo es la materia de la Ley 49/2002, que regula las entidades sin fines lucrativos. La obra benéfico-docente y la gestión de participaciones bancarias no son la actividad que nombra la letra."
  citation: "art. 7.j) LIRPF"
  difficulty: 3
  tags:
  - "beca"
  - "exención"
# anchor: boe-a-2006-20764-art-8
- id: m03-l15-q0038
  prompt:
    es: "De acuerdo con el artículo 8.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, son contribuyentes por el impuesto:"
  options:
  - id: a
    text:
      es: "las personas físicas de nacionalidad española, cualquiera que sea su residencia habitual, y las de nacionalidad extranjera con residencia en España."
  - id: b
    text:
      es: "las personas físicas que tengan su residencia habitual en territorio español y las entidades en régimen de atribución de rentas del artículo 35.4 de la Ley General Tributaria."
  - id: c
    text:
      es: "las personas físicas y jurídicas que tengan su residencia habitual en territorio español y las que la tuviesen en el extranjero por alguna de las circunstancias del artículo 10."
  - id: d
    correct: true
    text:
      es: "las personas físicas que tengan su residencia habitual en territorio español y las que tuviesen su residencia habitual en el extranjero por alguna de las circunstancias del artículo 10."
  explanation:
    es: "Los contribuyentes son las personas físicas con residencia habitual en España y las que, residiendo en el extranjero, se encuentran en alguno de los supuestos del artículo 10 (art. 8.1 LIRPF). Las personas jurídicas no son contribuyentes por este impuesto. Tampoco basta la nacionalidad, y las entidades en atribución de rentas no tienen la condición de contribuyente, según el artículo 8.3."
  citation: "art. 8.1 LIRPF"
  difficulty: 1
  tags:
  - "contribuyentes"
# anchor: boe-a-2006-20764-art-8
- id: m03-l15-q0039
  prompt:
    es: "Pedro Vidal, de nacionalidad española, acredita que durante 2026 traslada su residencia fiscal a un país considerado paraíso fiscal. Según el artículo 8.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿hasta qué período impositivo conserva la condición de contribuyente?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el de 2030, es decir, el período del cambio de residencia y los cuatro siguientes."
  - id: b
    text:
      es: "Hasta el de 2029, es decir, el período del cambio de residencia y los tres siguientes."
  - id: c
    text:
      es: "Hasta el de 2027, es decir, el período del cambio de residencia y el siguiente."
  - id: d
    text:
      es: "Hasta el de 2031, es decir, el período del cambio de residencia y los cinco períodos siguientes."
  explanation:
    es: "La regla se aplica en el período del cambio, 2026, y en los cuatro siguientes: 2027, 2028, 2029 y 2030 (art. 8.2 LIRPF). Hasta 2027 serían dos períodos en total y hasta 2029 serían cuatro. Hasta 2031 sumaría cinco períodos siguientes, uno más de los que establece el artículo."
  citation: "art. 8.2 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "supuesto"
  - "plazo"
# anchor: boe-a-2006-20764-art-8
- id: m03-l15-q0040
  prompt:
    es: "Conforme al artículo 8.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las personas físicas de nacionalidad española que acrediten su nueva residencia fiscal en un paraíso fiscal no pierden la condición de contribuyentes en el período impositivo en que se efectúe el cambio y durante:"
  options:
  - id: a
    text:
      es: "el período impositivo siguiente."
  - id: b
    text:
      es: "los cinco períodos impositivos siguientes, como máximo."
  - id: c
    correct: true
    text:
      es: "los cuatro períodos impositivos siguientes."
  - id: d
    text:
      es: "los tres períodos impositivos siguientes."
  explanation:
    es: "El plazo es el período del cambio y los cuatro siguientes (art. 8.2 LIRPF). Tres, cinco o uno son plazos cercanos que el artículo no contiene."
  citation: "art. 8.2 LIRPF"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-8
- id: m03-l15-q0041
  prompt:
    es: "¿Cuál de las siguientes entidades NO tiene la consideración de contribuyente del Impuesto sobre la Renta de las Personas Físicas, según el artículo 8.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Una persona de nacionalidad española que acredita su nueva residencia fiscal en un paraíso fiscal durante el período del cambio."
  - id: b
    text:
      es: "Un funcionario español en activo con cargo oficial no diplomático en el extranjero."
  - id: c
    text:
      es: "Una persona física residente que ejerce una actividad económica."
  - id: d
    correct: true
    text:
      es: "Una comunidad de bienes, cuyas rentas se atribuyen a los comuneros."
  explanation:
    es: "Las comunidades de bienes no son contribuyentes: sus rentas se atribuyen a los comuneros (art. 8.3 LIRPF). La persona física residente lo es por el artículo 8.1. El funcionario del artículo 10.1.d) se considera contribuyente aunque resida fuera. Y quien se traslada a un paraíso fiscal conserva la condición durante el período del cambio y los cuatro siguientes (art. 8.2)."
  citation: "art. 8.3 LIRPF"
  difficulty: 2
  tags:
  - "contribuyentes"
  - "negativa"
# anchor: boe-a-2006-20764-art-8
- id: m03-l15-q0042
  prompt:
    es: "Según el artículo 8.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las rentas correspondientes a las sociedades civiles no sujetas al Impuesto sobre Sociedades, herencias yacentes, comunidades de bienes y demás entidades del artículo 35.4 de la Ley General Tributaria se atribuyen:"
  options:
  - id: a
    text:
      es: "únicamente a los administradores o representantes de la entidad."
  - id: b
    correct: true
    text:
      es: "a los socios, herederos, comuneros o partícipes, respectivamente."
  - id: c
    text:
      es: "a las propias entidades, que tributan por este impuesto como contribuyentes."
  - id: d
    text:
      es: "a los socios, herederos, comuneros o partícipes, que tributan en todo caso por mitades."
  explanation:
    es: "Las rentas se atribuyen a los socios, herederos, comuneros o partícipes, según el caso (art. 8.3 LIRPF). Las entidades no son contribuyentes, y la ley no atribuye las rentas a sus administradores. Tampoco impone un reparto por mitades: la atribución sigue la regulación de la sección 2.ª del título X."
  citation: "art. 8.3 LIRPF"
  difficulty: 2
  tags:
  - "atribución de rentas"
# anchor: boe-a-2006-20764-art-9
- id: m03-l15-q0043
  prompt:
    es: "Según el artículo 9.1.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuántos días de permanencia durante el año natural en territorio español determinan que el contribuyente tiene en él su residencia habitual?"
  options:
  - id: a
    correct: true
    text:
      es: "Más de 183 días de permanencia en el año natural."
  - id: b
    text:
      es: "Al menos 183 días de permanencia en el año natural."
  - id: c
    text:
      es: "Más de 90 días de permanencia en el año natural."
  - id: d
    text:
      es: "Más de 180 días de permanencia en el año natural."
  explanation:
    es: "La permanencia debe superar los 183 días del año natural (art. 9.1.a) LIRPF). Exactamente 183 días no la cumple, aunque «al menos 183» lo parezca. Ciento ochenta y noventa días son umbrales que la ley no recoge."
  citation: "art. 9.1 LIRPF"
  difficulty: 1
  tags:
  - "residencia"
  - "plazo"
# anchor: boe-a-2006-20764-art-9
- id: m03-l15-q0045
  prompt:
    es: "De acuerdo con el artículo 9.1.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, para determinar el período de permanencia en territorio español se computan las ausencias esporádicas, salvo que el contribuyente:"
  options:
  - id: a
    correct: true
    text:
      es: "acredite su residencia fiscal en otro país."
  - id: b
    text:
      es: "acredite su residencia habitual en otra Comunidad Autónoma."
  - id: c
    text:
      es: "acredite que las ausencias no superaron los treinta días en el año natural."
  - id: d
    text:
      es: "acredite que las ausencias obedecieron a motivos laborales."
  explanation:
    es: "Las ausencias esporádicas cuentan como permanencia salvo prueba de la residencia fiscal en otro país (art. 9.1.a) LIRPF). El motivo laboral y el límite de treinta días no son excepciones de la ley. Y la residencia en otra Comunidad Autónoma sigue siendo residencia en territorio español."
  citation: "art. 9.1 LIRPF"
  difficulty: 2
  tags:
  - "residencia"
# anchor: boe-a-2006-20764-art-9
- id: m03-l15-q0046
  prompt:
    es: "Según el artículo 9.1.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, se entiende que el contribuyente tiene su residencia habitual en territorio español cuando radique en España el núcleo principal o la base de sus actividades o intereses económicos:"
  options:
  - id: a
    correct: true
    text:
      es: "de forma directa o indirecta."
  - id: b
    text:
      es: "de forma directa o indirecta, durante más de 183 días del año natural."
  - id: c
    text:
      es: "de forma directa, siempre que se ejerza una actividad económica."
  - id: d
    text:
      es: "de forma exclusivamente directa, sin computar la titularidad indirecta."
  explanation:
    es: "El criterio del núcleo de intereses admite la forma directa o indirecta (art. 9.1.b) LIRPF). Excluir la indirecta o exigir el ejercicio de una actividad restringe el texto. Y los 183 días son el criterio de la letra a), distinto e independiente: basta que se dé cualquiera de los dos."
  citation: "art. 9.1 LIRPF"
  difficulty: 2
  tags:
  - "residencia"
# anchor: boe-a-2006-20764-art-9
- id: m03-l15-q0047
  prompt:
    es: "Señale la respuesta CORRECTA sobre la presunción de residencia habitual en territorio español del artículo 9.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Se presume, sin admitir prueba en contrario, que el contribuyente reside en España cuando residan habitualmente allí el cónyuge no separado legalmente y los hijos menores de edad que dependan de aquel."
  - id: b
    text:
      es: "Se presume, salvo prueba en contrario, que el contribuyente reside en España cuando resida allí cualquiera de sus hijos, sean menores o mayores de edad."
  - id: c
    text:
      es: "Se presume, salvo prueba en contrario, que el contribuyente reside en España cuando resida allí su cónyuge, aunque esté separado legalmente."
  - id: d
    correct: true
    text:
      es: "Se presume, salvo prueba en contrario, que el contribuyente reside en España cuando residan habitualmente allí el cónyuge no separado legalmente y los hijos menores de edad que dependan de aquel."
  explanation:
    es: "La presunción admite prueba en contrario y exige el cónyuge no separado legalmente y los hijos menores que dependan del contribuyente (art. 9.1 LIRPF). No es absoluta. Los hijos mayores de edad no cuentan, ni el cónyuge separado legalmente."
  citation: "art. 9.1 LIRPF"
  difficulty: 2
  tags:
  - "residencia"
  - "presunción"
# anchor: boe-a-2006-20764-art-10
- id: m03-l15-q0050
  prompt:
    es: "Conforme al artículo 10.1.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, son contribuyentes los miembros de las oficinas consulares españolas que residan en el extranjero, con excepción de:"
  options:
  - id: a
    correct: true
    text:
      es: "los vicecónsules honorarios o agentes consulares honorarios y del personal dependiente de ellos."
  - id: b
    text:
      es: "los jefes de las oficinas consulares y del personal diplomático adscrito a ellas."
  - id: c
    text:
      es: "los funcionarios en activo de nacionalidad española destinados en las oficinas consulares de España en el extranjero."
  - id: d
    text:
      es: "los cónsules de carrera y del personal de servicios de las oficinas consulares."
  explanation:
    es: "La excepción del artículo 10.1.b) LIRPF afecta a los vicecónsules honorarios o agentes consulares honorarios y a su personal dependiente. Los jefes de las oficinas, los cónsules de carrera y los funcionarios de nacionalidad española en activo sí están comprendidos: el precepto cita expresamente al jefe y al funcionario o personal de servicios adscritos."
  citation: "art. 10.1 LIRPF"
  difficulty: 2
  tags:
  - "contribuyentes"
  - "excepción"
# anchor: boe-a-2006-20764-art-10
- id: m03-l15-q0051
  prompt:
    es: "Según el artículo 10.2.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuándo no se aplica la regla del artículo 10.1 a personas que no sean funcionarios públicos en activo ni titulares de cargo o empleo oficial?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando tuvieran su residencia habitual en el extranjero con anterioridad a la adquisición de cualquiera de las condiciones enumeradas."
  - id: b
    text:
      es: "Cuando tuvieran su residencia habitual en el extranjero con posterioridad a la adquisición de cualquiera de las condiciones enumeradas."
  - id: c
    text:
      es: "Cuando hubieran permanecido en el extranjero más de 183 días durante el año natural."
  - id: d
    text:
      es: "Cuando su residencia habitual en el extranjero tuviera un período inferior a cuatro períodos impositivos."
  explanation:
    es: "La regla no se aplica a quien ya tenía su residencia en el extranjero antes de adquirir la condición enumerada (art. 10.2.a) LIRPF). El momento posterior invierte la excepción. Los 183 días y los cuatro períodos son plazos de otros preceptos: el artículo 9.1.a) y el 8.2."
  citation: "art. 10.2 LIRPF"
  difficulty: 3
  tags:
  - "residencia en el extranjero"
  - "excepción"
# anchor: boe-a-2006-20764-art-10
- id: m03-l15-q0052
  prompt:
    es: "De acuerdo con el artículo 10.2.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la regla del artículo 10.1 tampoco se aplica a los cónyuges no separados legalmente o hijos menores de edad que tuvieran su residencia habitual en el extranjero:"
  options:
  - id: a
    text:
      es: "con anterioridad a que el cónyuge, el padre o la madre cumplan un año en el cargo o empleo oficial."
  - id: b
    text:
      es: "con posterioridad a la adquisición, por el cónyuge, el padre o la madre, de las condiciones enumeradas en el apartado 1."
  - id: c
    text:
      es: "durante menos de dos años anteriores a la adquisición, por el cónyuge, el padre o la madre, de dichas condiciones."
  - id: d
    correct: true
    text:
      es: "con anterioridad a la adquisición, por el cónyuge, el padre o la madre, de las condiciones enumeradas en el apartado 1."
  explanation:
    es: "El criterio es el momento de la adquisición de la condición por el cónyuge, el padre o la madre: si la residencia en el extranjero es anterior, no se aplica la regla (art. 10.2.b) LIRPF). La posterior invierte el supuesto. Los plazos de un año en el cargo o de dos años de residencia no figuran en el precepto."
  citation: "art. 10.2 LIRPF"
  difficulty: 3
  tags:
  - "residencia en el extranjero"
  - "excepción"
# anchor: boe-a-2006-20764-art-11
- id: m03-l15-q0053
  prompt:
    es: "Según el artículo 11.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la renta se entiende obtenida por los contribuyentes en función del origen o fuente de aquella, cualquiera que sea:"
  options:
  - id: a
    text:
      es: "la voluntad de los cónyuges manifestada en declaración conjunta."
  - id: b
    text:
      es: "la titularidad registral de los bienes que la producen."
  - id: c
    correct: true
    text:
      es: "en su caso, el régimen económico del matrimonio."
  - id: d
    text:
      es: "la residencia habitual del pagador de la renta."
  explanation:
    es: "La renta se individualiza por su origen o fuente con independencia del régimen económico del matrimonio (art. 11.1 LIRPF). La residencia del pagador es irrelevante para el objeto del impuesto, según el artículo 2. La declaración conjunta no determina quién obtiene la renta, y la titularidad registral solo es una prueba, no el criterio general."
  citation: "art. 11.1 LIRPF"
  difficulty: 2
  tags:
  - "individualización"
# anchor: boe-a-2006-20764-art-11
- id: m03-l15-q0054
  prompt:
    es: "Señale la respuesta CORRECTA sobre la atribución de los rendimientos del trabajo, de acuerdo con el artículo 11.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Se atribuyen a la unidad familiar, que tributa por ellos de forma conjunta."
  - id: b
    correct: true
    text:
      es: "Se atribuyen exclusivamente a quien haya generado el derecho a su percepción."
  - id: c
    text:
      es: "Se atribuyen por mitad a cada cónyuge, cualquiera que sea el régimen económico del matrimonio."
  - id: d
    text:
      es: "Se atribuyen a quien los perciba, aunque no haya generado el derecho a su percepción."
  explanation:
    es: "Los rendimientos del trabajo van a quien generó el derecho a percibirlos (art. 11.2 LIRPF). No dependen de quién cobre, ni se reparten por mitad: eso ocurre con los bienes comunes del artículo 11.3. Y el impuesto individualiza las rentas; la unidad familiar no es el sujeto que las obtiene."
  citation: "art. 11.2 LIRPF"
  difficulty: 1
  tags:
  - "individualización"
# anchor: boe-a-2006-20764-art-11
- id: m03-l15-q0055
  prompt:
    es: "Rosa Bernal cobra en 2026 una pensión de viudedad de la Seguridad Social, reconocida a su favor tras el fallecimiento de su marido, que fue quien generó el derecho. Según el artículo 11.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿a quién se atribuye la prestación?"
  options:
  - id: a
    text:
      es: "A los herederos de su marido, que fue quien generó el derecho a la pensión."
  - id: b
    text:
      es: "Al marido fallecido, en la última declaración que deba presentarse por él."
  - id: c
    text:
      es: "Por mitad a Rosa y a los herederos del marido, por haber generado él el derecho."
  - id: d
    correct: true
    text:
      es: "A Rosa, porque las prestaciones del artículo 17.2.a) se atribuyen a las personas físicas en cuyo favor estén reconocidas."
  explanation:
    es: "La regla general lleva el rendimiento a quien generó el derecho, pero las prestaciones del artículo 17.2.a) van a las personas en cuyo favor están reconocidas (art. 11.2 LIRPF). La pensión de viudedad se atribuye a Rosa. Los herederos y el fallecido no son los beneficiarios, y la ley no prevé un reparto por mitad."
  citation: "art. 11.2 LIRPF"
  difficulty: 3
  tags:
  - "supuesto"
  - "individualización"
# anchor: boe-a-2006-20764-art-11
- id: m03-l15-q0056
  prompt:
    es: "Conforme al artículo 11.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, los bienes y derechos que, según el régimen económico matrimonial, sean comunes a ambos cónyuges se atribuyen:"
  options:
  - id: a
    text:
      es: "por mitad a cada uno de ellos, sin que pueda justificarse otra cuota de participación."
  - id: b
    text:
      es: "al cónyuge que figure como titular en un registro fiscal u otro de carácter público."
  - id: c
    text:
      es: "al cónyuge que obtenga mayores ingresos en el período impositivo."
  - id: d
    correct: true
    text:
      es: "por mitad a cada uno de ellos, salvo que se justifique otra cuota de participación."
  explanation:
    es: "Los bienes comunes se atribuyen por mitad, con la salvedad de que se justifique otra cuota (art. 11.3 LIRPF). El mayor ingreso no es criterio. Y la regla del registro público es subsidiaria: se aplica solo cuando no resulta acreditada la titularidad."
  citation: "art. 11.3 LIRPF"
  difficulty: 2
  tags:
  - "individualización"
# anchor: boe-a-2006-20764-art-12
- id: m03-l15-q0058
  prompt:
    es: "De acuerdo con los apartados 1 y 2 del artículo 12 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el período impositivo es el año natural y el impuesto se devenga:"
  options:
  - id: a
    text:
      es: "el 30 de junio de cada año, sin perjuicio de lo establecido para el fallecimiento."
  - id: b
    correct: true
    text:
      es: "el 31 de diciembre de cada año, sin perjuicio de lo establecido para el fallecimiento."
  - id: c
    text:
      es: "cuando las rentas sean exigibles por su perceptor, sin perjuicio de lo establecido para el fallecimiento."
  - id: d
    text:
      es: "el 1 de enero del año siguiente, sin perjuicio de lo establecido para el fallecimiento."
  explanation:
    es: "El impuesto se devenga el 31 de diciembre de cada año (art. 12.2 LIRPF). El 1 de enero del año siguiente y el 30 de junio son fechas que la ley no recoge. La exigibilidad de las rentas es el criterio de imputación temporal del artículo 14, no el del devengo."
  citation: "art. 12 LIRPF"
  difficulty: 1
  tags:
  - "devengo"
# anchor: boe-a-2006-20764-art-13
- id: m03-l15-q0059
  prompt:
    es: "Joaquín Navarro, contribuyente del impuesto, fallece el 14 de septiembre de 2026. Según los artículos 12 y 13 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuándo termina su período impositivo y cuándo se devenga el impuesto por ese año?"
  options:
  - id: a
    text:
      es: "El período termina el 14 de septiembre de 2026 y el impuesto se devenga el 1 de enero de 2027."
  - id: b
    text:
      es: "El período termina el 31 de diciembre de 2026 y el impuesto se devenga ese día, como en cualquier otro año."
  - id: c
    text:
      es: "El período termina el 14 de septiembre de 2026 y el impuesto se devenga el 31 de diciembre de 2026."
  - id: d
    correct: true
    text:
      es: "El período termina y el impuesto se devenga el 14 de septiembre de 2026, fecha del fallecimiento."
  explanation:
    es: "Si el contribuyente fallece en un día distinto al 31 de diciembre, el período es inferior al año natural y el impuesto se devenga en la fecha del fallecimiento: 14 de septiembre de 2026 (art. 13 LIRPF). La regla general del 31 de diciembre queda desplazada, y el devengo no se aplaza al 31 de diciembre ni a 2027."
  citation: "art. 13 LIRPF"
  difficulty: 1
  tags:
  - "supuesto"
  - "devengo"
# anchor: boe-a-2006-20764-art-14
- id: m03-l15-q0060
  prompt:
    es: "Según el artículo 14.1.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, los rendimientos del trabajo y del capital se imputan al período impositivo en que sean:"
  options:
  - id: a
    text:
      es: "contabilizados como gasto por el pagador."
  - id: b
    correct: true
    text:
      es: "exigibles por su perceptor."
  - id: c
    text:
      es: "percibidos efectivamente por su perceptor."
  - id: d
    text:
      es: "devengados por el pagador de los mismos."
  explanation:
    es: "El criterio es la exigibilidad para el perceptor, no el cobro efectivo (art. 14.1.a) LIRPF). El devengo y la contabilización son hechos del pagador, que no determinan la imputación del rendimiento al perceptor."
  citation: "art. 14.1 LIRPF"
  difficulty: 1
  tags:
  - "imputación temporal"
# anchor: boe-a-2006-20764-art-14
- id: m03-l15-q0061
  prompt:
    es: "De acuerdo con el artículo 14.1.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las ganancias y pérdidas patrimoniales se imputan al período impositivo en que:"
  options:
  - id: a
    correct: true
    text:
      es: "tenga lugar la alteración patrimonial."
  - id: b
    text:
      es: "sean exigibles por su perceptor."
  - id: c
    text:
      es: "se inscriba la alteración en un registro público."
  - id: d
    text:
      es: "se cobre el precio de la transmisión."
  explanation:
    es: "Las ganancias y pérdidas se imputan al período en que se produce la alteración patrimonial (art. 14.1.c) LIRPF). La exigibilidad es el criterio de los rendimientos del trabajo y del capital, y el cobro o la inscripción no figuran en la regla."
  citation: "art. 14.1 LIRPF"
  difficulty: 1
  tags:
  - "imputación temporal"
