# anchor: boe-a-1998-16718-art-25
- id: m02-l05-q0029
  prompt:
    es: "De acuerdo con el artículo 25.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, el recurso contencioso-administrativo es admisible contra las disposiciones generales y contra los actos expresos y presuntos que:"
  options:
  - id: a
    correct: true
    text:
      es: "Pongan fin a la vía administrativa, sean definitivos o de trámite en los casos que la ley señala."
  - id: b
    text:
      es: "Sean definitivos, aunque no pongan fin a la vía administrativa, y nunca contra los de trámite."
  - id: c
    text:
      es: "Pongan fin a la vía administrativa, solo si son definitivos y nunca si son actos de trámite."
  - id: d
    text:
      es: "Hayan sido recurridos antes en reposición, sean definitivos o de trámite, en cualquier caso y materia."
  explanation:
    es: "El artículo 25.1 admite el recurso contra los actos «que pongan fin a la vía administrativa, ya sean definitivos o de trámite», estos últimos cuando deciden el fondo, impiden continuar el procedimiento o producen indefensión o perjuicio irreparable. Un acto que no agota la vía no es impugnable, aunque sea definitivo. Los actos de trámite cualificados sí lo son. La reposición previa es potestativa (art. 123.1 LPAC), no un requisito."
  citation: "art. 25.1 LJCA"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1998-16718-art-29
- id: m02-l05-q0032
  prompt:
    es: "Según el artículo 29.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, quien tenga derecho a una prestación concreta que la Administración debe realizar puede recurrir su inactividad si, tras reclamarla:"
  options:
  - id: a
    text:
      es: "En un mes desde la reclamación no la cumple ni llega a un acuerdo con los interesados."
  - id: b
    text:
      es: "En seis meses desde la reclamación no dicta una resolución expresa sobre lo pedido."
  - id: c
    text:
      es: "En diez días desde la reclamación no atiende el requerimiento que se le ha formulado."
  - id: d
    correct: true
    text:
      es: "En tres meses desde la reclamación no la cumple ni llega a un acuerdo con ellos."
  explanation:
    es: "El artículo 29.1 permite el recurso si «en el plazo de tres meses desde la fecha de la reclamación, la Administración no hubiera dado cumplimiento a lo solicitado o no hubiera llegado a un acuerdo con los interesados». Un mes es el plazo del artículo 29.2 para la falta de ejecución de actos firmes. Seis meses es el plazo del recurso contra el acto presunto (art. 46.1). Diez días es el plazo del requerimiento en la vía de hecho (art. 30)."
  citation: "art. 29.1 LJCA"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-1998-16718-art-26
- id: m02-l05-q0034
  prompt:
    es: "Conforme al artículo 26.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, además de la impugnación directa de las disposiciones generales, cabe impugnar los actos que las apliquen, fundada en que:"
  options:
  - id: a
    text:
      es: "Los actos no han sido notificados al interesado."
  - id: b
    text:
      es: "Las disposiciones no han sido publicadas en el boletín oficial."
  - id: c
    text:
      es: "Los actos carecen de motivación suficiente."
  - id: d
    correct: true
    text:
      es: "Tales disposiciones no son conformes a Derecho."
  explanation:
    es: "El artículo 26.1 admite impugnar los actos de aplicación de una disposición general con el fundamento de que la disposición no es conforme a Derecho. La falta de notificación, de publicación o de motivación no es el fundamento que contempla este apartado."
  citation: "art. 26.1 LJCA"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1998-16718-art-26
- id: m02-l05-q0035
  prompt:
    es: "¿Cuál de las siguientes afirmaciones es correcta sobre la impugnación de los actos de aplicación de una disposición general, según el artículo 26.2 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa?"
  options:
  - id: a
    correct: true
    text:
      es: "La falta de impugnación directa de la disposición general no la impide."
  - id: b
    text:
      es: "Solo cabe si antes se impugnó directamente la disposición general."
  - id: c
    text:
      es: "Solo cabe si el recurso contra la disposición general fue estimado."
  - id: d
    text:
      es: "Solo cabe respecto de actos anteriores a la aprobación de la disposición."
  explanation:
    es: "El artículo 26.2 dice que ni la falta de impugnación directa de la disposición ni la desestimación del recurso interpuesto contra ella impiden impugnar los actos de aplicación. Exigir que se impugnara antes la disposición, que el recurso se estimara o que los actos sean anteriores a ella contradice el artículo."
  citation: "art. 26.2 LJCA"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1998-16718-art-28
- id: m02-l05-q0036
  prompt:
    es: "Conforme al artículo 28 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, no es admisible el recurso contencioso-administrativo respecto de los actos que sean reproducción de otros anteriores:"
  options:
  - id: a
    correct: true
    text:
      es: "Definitivos y firmes."
  - id: b
    text:
      es: "De trámite que decidan el fondo del asunto."
  - id: c
    text:
      es: "Presuntos."
  - id: d
    text:
      es: "Confirmados por la Administración en vía de recurso."
  explanation:
    es: "El artículo 28 declara inadmisible el recurso contra los actos que reproduzcan otros anteriores definitivos y firmes. Los actos de trámite que deciden el fondo y los presuntos son recurribles según el artículo 25.1. La reproducción de actos confirmados en vía de recurso no es el supuesto del artículo."
  citation: "art. 28 LJCA"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1998-16718-art-29
- id: m02-l05-q0037
  prompt:
    es: "Conforme al artículo 29.2 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, el recurso contra la falta de ejecución de actos firmes, un mes después de pedirla, se tramita por el procedimiento:"
  options:
  - id: a
    text:
      es: "Ordinario."
  - id: b
    text:
      es: "Especial para la protección de los derechos fundamentales."
  - id: c
    text:
      es: "Especial de cuestión de ilegalidad."
  - id: d
    correct: true
    text:
      es: "Abreviado."
  explanation:
    es: "El artículo 29.2 tramita ese recurso por el procedimiento abreviado del artículo 78. No sigue el procedimiento ordinario, ni el especial para la protección de los derechos fundamentales, ni el de cuestión de ilegalidad."
  citation: "art. 29.2 LJCA"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1998-16718-art-30
- id: m02-l05-q0038
  prompt:
    es: "Conforme al artículo 30 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, en caso de vía de hecho el interesado puede recurrir directamente si el requerimiento de cesación no se atiende dentro de:"
  options:
  - id: a
    text:
      es: "Los quince días siguientes a su presentación."
  - id: b
    correct: true
    text:
      es: "Los diez días siguientes a su presentación."
  - id: c
    text:
      es: "El mes siguiente a su presentación."
  - id: d
    text:
      es: "Los tres meses siguientes a su presentación."
  explanation:
    es: "El artículo 30 abre el recurso directo si el requerimiento no se formula o no se atiende dentro de los diez días siguientes a su presentación. Quince días, un mes y tres meses son plazos de otros artículos, como el mes del 29.2 y los tres meses del 29.1."
  citation: "art. 30 LJCA"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1998-16718-art-25
- id: m02-l05-q0083
  prompt:
    es: "Según el artículo 25.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, ¿es admisible el recurso contencioso-administrativo contra un acto presunto que pone fin a la vía administrativa?"
  options:
  - id: a
    text:
      es: "No, porque solo es admisible contra los actos expresos que pongan fin a la vía administrativa."
  - id: b
    text:
      es: "No, porque solo es admisible contra las disposiciones de carácter general."
  - id: c
    text:
      es: "Sí, pero únicamente si el acto presunto es de trámite y produce indefensión o perjuicio irreparable."
  - id: d
    correct: true
    text:
      es: "Sí, porque es admisible contra los actos expresos y presuntos que pongan fin a la vía administrativa."
  explanation:
    es: "El artículo 25.1 admite el recurso contra las disposiciones de carácter general y contra los actos expresos y presuntos que pongan fin a la vía administrativa. Por eso el silencio que cierra la vía puede impugnarse. Excluirlo por ser presunto, limitar el recurso a las disposiciones o exigir que sea de trámite contradice la letra del precepto."
  citation: "art. 25.1 LJCA"
  difficulty: 2
  tags:
  - "actividad impugnable"
  - "acto presunto"
# anchor: boe-a-1998-16718-art-25
- id: m02-l05-q0085
  prompt:
    es: "Según el artículo 25.2 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, además de los supuestos del apartado anterior, el recurso contencioso-administrativo también es admisible:"
  options:
  - id: a
    text:
      es: "Contra la inactividad de la Administración, pero no contra sus actuaciones materiales."
  - id: b
    text:
      es: "Contra las actuaciones materiales que constituyan vía de hecho, pero no contra la inactividad."
  - id: c
    correct: true
    text:
      es: "Contra la inactividad de la Administración y contra sus actuaciones materiales que constituyan vía de hecho."
  - id: d
    text:
      es: "Contra cualquier actuación material de la Administración, aunque no constituya vía de hecho."
  explanation:
    es: "El artículo 25.2 admite el recurso contra la inactividad de la Administración y contra sus actuaciones materiales que constituyan vía de hecho, en los términos de la Ley. Los dos primeros distractores recortan la regla a una sola de las dos figuras, y el tercero amplía la segunda a cualquier actuación material, cuando solo cabe contra las que son vía de hecho."
  citation: "art. 25.2 LJCA"
  difficulty: 1
  tags:
  - "actividad impugnable"
  - "inactividad"
# anchor: boe-a-1998-16718-art-27
- id: m02-l05-q0086
  prompt:
    es: "Un Juzgado de lo Contencioso-administrativo dicta sentencia firme estimatoria porque considera ilegal el contenido de una disposición general aplicada en el acto impugnado, y no es competente para conocer del recurso directo contra esa disposición. Conforme al artículo 27.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, ¿qué debe hacer?"
  options:
  - id: a
    correct: true
    text:
      es: "Plantear la cuestión de ilegalidad ante el Tribunal competente para conocer del recurso directo contra la disposición."
  - id: b
    text:
      es: "Anular la disposición general en la propia sentencia, con efectos generales."
  - id: c
    text:
      es: "Plantear la cuestión de inconstitucionalidad ante el Tribunal Constitucional."
  - id: d
    text:
      es: "Remitir la sentencia al órgano que dictó la disposición para que la derogue."
  explanation:
    es: "Cuando el Juez o Tribunal dicta sentencia firme estimatoria por considerar ilegal la disposición general aplicada, el artículo 27.1 le obliga a plantear la cuestión de ilegalidad ante el Tribunal competente para el recurso directo contra la disposición. No puede anularla él mismo, porque eso solo ocurre cuando él también es competente para el recurso directo (art. 27.2), y la cuestión de inconstitucionalidad se refiere a normas con rango de ley, no a una disposición reglamentaria. Tampoco corresponde al órgano autor derogarla por esa remisión."
  citation: "art. 27.1 LJCA"
  difficulty: 3
  tags:
  - "cuestión de ilegalidad"
# anchor: boe-a-1998-16718-art-27
- id: m02-l05-q0087
  prompt:
    es: "De acuerdo con el artículo 27.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, el Juez o Tribunal de lo Contencioso-administrativo debe plantear la cuestión de ilegalidad cuando haya dictado:"
  options:
  - id: a
    text:
      es: "Sentencia firme desestimatoria por considerar legal el contenido de la disposición general aplicada."
  - id: b
    text:
      es: "Sentencia no firme estimatoria por considerar ilegal el contenido de la disposición general aplicada."
  - id: c
    text:
      es: "Sentencia firme estimatoria por considerar inconstitucional el contenido de la ley aplicada."
  - id: d
    correct: true
    text:
      es: "Sentencia firme estimatoria por considerar ilegal el contenido de la disposición general aplicada."
  explanation:
    es: "El artículo 27.1 exige que la sentencia sea firme, estimatoria y fundada en la ilegalidad del contenido de la disposición general aplicada. Una sentencia que considera legal la disposición no da lugar a la cuestión, una sentencia no firme no la activa todavía, y la inconstitucionalidad de una ley se plantea por otra vía."
  citation: "art. 27.1 LJCA"
  difficulty: 2
  tags:
  - "cuestión de ilegalidad"
# anchor: boe-a-1998-16718-art-28
- id: m02-l05-q0088
  prompt:
    es: "Un interesado no recurrió en tiempo y forma un acto administrativo, que quedó consentido. La Administración dicta después un nuevo acto que confirma el anterior, y el interesado lo recurre ante la jurisdicción contencioso-administrativa. Según el artículo 28 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, ¿es admisible el recurso?"
  options:
  - id: a
    text:
      es: "Sí, porque el acto confirmatorio abre un nuevo plazo de dos meses para recurrir."
  - id: b
    text:
      es: "Sí, siempre que el acto confirmatorio ponga fin a la vía administrativa."
  - id: c
    correct: true
    text:
      es: "No, porque no es admisible contra los actos confirmatorios de actos consentidos por no haber sido recurridos en tiempo y forma."
  - id: d
    text:
      es: "No, porque solo es inadmisible el recurso contra los actos que reproducen otros definitivos y firmes."
  explanation:
    es: "El artículo 28 declara inadmisible el recurso contra los actos que reproducen otros anteriores definitivos y firmes y contra los confirmatorios de actos consentidos por no haber sido recurridos en tiempo y forma. Este supuesto encaja en la segunda categoría, así que el nuevo acto no reabre el plazo ni lo salva que ponga fin a la vía. El último distractor omite precisamente la segunda categoría, que es la que aquí aplica."
  citation: "art. 28 LJCA"
  difficulty: 2
  tags:
  - "inadmisibilidad"
  - "actos confirmatorios"
# anchor: boe-a-1998-16718-art-29
- id: m02-l05-q0090
  prompt:
    es: "Hace dos meses, don Ricardo Salas reclamó a la Administración el pago de una prestación concreta que esta debe realizar en virtud de un convenio administrativo, y no ha recibido respuesta ni se ha llegado a ningún acuerdo. Según el artículo 29.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, ¿puede ya deducir recurso contencioso-administrativo contra la inactividad?"
  options:
  - id: a
    text:
      es: "Sí, porque basta con que la Administración no haya respondido a la reclamación."
  - id: b
    correct: true
    text:
      es: "No todavía, porque han de transcurrir tres meses desde la fecha de la reclamación."
  - id: c
    text:
      es: "No todavía, porque han de transcurrir seis meses desde la fecha de la reclamación."
  - id: d
    text:
      es: "Sí, porque el plazo para cumplir en un convenio administrativo es de un mes."
  explanation:
    es: "El artículo 29.1 da a la Administración tres meses desde la reclamación para cumplir o llegar a un acuerdo antes de que pueda recurrirse la inactividad. Han pasado dos, de modo que todavía no puede. No basta la falta de respuesta, el plazo no es de seis meses, y el convenio es una de las fuentes de la obligación, pero no cambia el plazo."
  citation: "art. 29.1 LJCA"
  difficulty: 2
  tags:
  - "inactividad"
  - "plazo"
# anchor: boe-a-1998-16718-art-30
- id: m02-l05-q0092
  prompt:
    es: "Conforme al artículo 30 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, quien sufre una vía de hecho y no ha formulado requerimiento a la Administración actuante, para impugnarla puede:"
  options:
  - id: a
    text:
      es: "Formular antes el requerimiento, porque sin él no es admisible el recurso contencioso-administrativo."
  - id: b
    text:
      es: "Esperar tres meses desde el inicio de la actuación y reclamar el cumplimiento a la Administración."
  - id: c
    text:
      es: "Recurrir en alzada ante el superior jerárquico de la Administración actuante."
  - id: d
    correct: true
    text:
      es: "Deducir directamente recurso contencioso-administrativo, porque la intimación no fue formulada."
  explanation:
    es: "En la vía de hecho, el interesado puede formular requerimiento de cesación, pero el artículo 30 permite deducir directamente el recurso si la intimación no se formuló o no se atendió en diez días. No es un requisito previo. El plazo de tres meses es el de la inactividad en una prestación (art. 29.1), y no hay acto previo que recurrir en alzada."
  citation: "art. 30 LJCA"
  difficulty: 2
  tags:
  - "vía de hecho"
# anchor: boe-a-1998-16718-art-26
- id: m02-l05-q0110
  prompt:
    es: "Según el artículo 26.2 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, ¿puede impugnarse un acto de aplicación de un reglamento por no ser este conforme a Derecho cuando ya se desestimó el recurso directo interpuesto contra el reglamento?"
  options:
  - id: a
    text:
      es: "No, porque el recurso directo ya desestimado impide impugnar los actos de aplicación con ese fundamento."
  - id: b
    text:
      es: "Sí, pero solo si la sentencia desestimatoria no ha adquirido firmeza."
  - id: c
    correct: true
    text:
      es: "Sí, porque la desestimación del recurso directo contra la disposición no impide impugnar los actos de aplicación con ese fundamento."
  - id: d
    text:
      es: "No, porque los actos de aplicación solo pueden impugnarse si antes se recurrió la disposición directamente."
  explanation:
    es: "El artículo 26.2 dispone que ni la falta de impugnación directa de la disposición ni la desestimación del recurso interpuesto contra ella impiden impugnar los actos de aplicación con fundamento en su falta de conformidad a Derecho. No se exige que la sentencia sea no firme ni que antes se hubiese recurrido la disposición."
  citation: "art. 26.2 LJCA"
  difficulty: 3
  tags:
  - "impugnación indirecta"
# anchor: boe-a-1998-16718-art-29
- id: m02-l05-q0117
  prompt:
    es: "De acuerdo con el artículo 29.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, el recurso contra la inactividad procede cuando la Administración esté obligada a realizar una prestación concreta en favor de:"
  options:
  - id: a
    text:
      es: "Cualquier persona interesada en la prestación."
  - id: b
    text:
      es: "Un colectivo indeterminado de ciudadanos."
  - id: c
    correct: true
    text:
      es: "Una o varias personas determinadas."
  - id: d
    text:
      es: "Únicamente una persona determinada."
  explanation:
    es: "El artículo 29.1 exige que la prestación concreta sea en favor de una o varias personas determinadas, de modo que no basta cualquier interesado ni un colectivo indeterminado. Tampoco se limita a una sola persona, porque el precepto prevé varias."
  citation: "art. 29.1 LJCA"
  difficulty: 2
  tags:
  - "inactividad"
