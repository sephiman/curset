- id: m03-l02-q01
  prompt:
    en: Which statement about `volatile` fields is correct, according to the Java 25 Javadoc of the `java.util.concurrent`
      package on memory consistency properties?
  options:
  - id: a
    text:
      en: A volatile write excludes other threads from running any code between the write and the next read by holding
        a lock
  - id: b
    text:
      en: A volatile write is visible to a read in another thread only if both threads also use `synchronized` blocks
        on the same lock
  - id: c
    correct: true
    text:
      en: Their reads and writes have memory consistency effects similar to monitors, without mutual exclusion locking
  - id: d
    text:
      en: A volatile field makes compound updates such as an increment atomic without any other synchronization
  explanation:
    en: Reads and writes of `volatile` fields have similar memory consistency effects as entering and exiting monitors,
      but they do not entail mutual exclusion locking. Excluding other threads between a write and a read is wrong,
      because no mutual exclusion locking is involved. Requiring `synchronized` in both threads is wrong, because
      a write to a volatile field happens-before every subsequent read of that field. Atomic compound updates are
      wrong, because groups of operations that need to be perceived atomically are still a source of errors.
  citation: javadoc-concurrent-package#MemoryVisibility
- id: m03-l02-q02
  prompt:
    en: Two threads share a non-volatile `long` field. According to chapter 17 of the Java Language Specification,
      what can a reading thread see after another thread writes it?
  options:
  - id: a
    text:
      en: Only the complete old value or the complete new value, because every write is atomic
  - id: b
    correct: true
    text:
      en: The first 32 bits from one write and the second 32 bits from another write
  - id: c
    text:
      en: Always a split value, because every JVM must write 64-bit values in two parts
  - id: d
    text:
      en: A split value that can also occur when the field is declared `volatile`
  explanation:
    en: A single write to a non-volatile `long` is treated as two separate writes, so a thread can see the first
      32 bits from one write and the second 32 bits from another. Seeing only a complete value is wrong, because
      the write is treated as two separate 32-bit writes. A mandatory split is wrong, because an implementation
      is free to perform the writes atomically or in two parts. A split value on a `volatile` field is wrong, because
      writes and reads of volatile `long` and `double` values are always atomic.
  citation: jls-17#jls-17.7
  extract:
    en: 'For the purposes of the Java programming language memory model, a single write to a non-volatile long or
      double value is treated as two separate writes: one to each 32-bit half.'
- id: m03-l02-q03
  prompt:
    en: Which class of the `java.util.concurrent.atomic` package associates an integer value with a reference, so
