    es: "De acuerdo con el artículo 188.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el importe de la sanción que deba ingresarse por la comisión de cualquier infracción, una vez aplicada en su caso la reducción por conformidad, se reduce en el 40 por ciento si se realiza el ingreso total del importe restante:"
