# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q001
  prompt:
    es: "De acuerdo con el artículo 4.b) del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la orientación e información al ciudadano:"
  options:
  - id: a
    correct: true
    text:
      es: "En ningún caso podrá entrañar una interpretación normativa ni consideración jurídica o económica."
  - id: b
    text:
      es: "Podrá entrañar una interpretación normativa, pero no una consideración jurídica o económica."
  - id: c
    text:
      es: "Podrá entrañar una consideración jurídica, siempre que no tenga contenido económico."
  - id: d
    text:
      es: "Solo podrá entrañar una interpretación normativa cuando el ciudadano la solicite expresamente por escrito."
  explanation:
    es: "El artículo 4.b) dice que esta función «en ningún caso podrá entrañar una interpretación normativa» ni «consideración jurídica o económica»; se limita a determinar conceptos, informar de opciones legales y ayudar a rellenar impresos. La opción que admite la interpretación normativa y la que admite la consideración jurídica sin contenido económico contradicen ese «en ningún caso». La que la permite si se pide por escrito añade una excepción que el artículo no tiene."
  citation: "art. 4.b) RD 208/1996"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q002
  prompt:
    es: "¿Cuál de las siguientes es una de las funciones que comprende la atención personalizada al ciudadano según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano?"
  options:
  - id: a
    text:
      es: "La resolución de los recursos de alzada interpuestos contra los actos del departamento."
  - id: b
    text:
      es: "La tramitación de las reclamaciones de responsabilidad patrimonial contra la Administración."
  - id: c
    correct: true
    text:
      es: "La recepción y acogida, para orientar al ciudadano en el momento inicial de su visita."
  - id: d
    text:
      es: "La instrucción de los expedientes disciplinarios del personal que atiende al público."
  explanation:
    es: "El artículo 4 enumera seis funciones; la primera es la de «recepción y acogida» para dar la orientación y ayuda que el ciudadano precise «en el momento inicial de su visita». Los recursos de alzada, la responsabilidad patrimonial y los expedientes disciplinarios se tramitan por sus propios procedimientos y no figuran entre las funciones de atención al ciudadano del artículo 4."
  citation: "art. 4.a) RD 208/1996"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q022
  prompt:
    es: "Un ciudadano llega a una oficina de la Administración General del Estado y pregunta en el mostrador por la ubicación del despacho de un funcionario. ¿Qué función de la atención personalizada se le presta?"
  options:
  - id: a
    text:
      es: "La de recepción de quejas y reclamaciones."
  - id: b
    text:
      es: "La de recepción de iniciativas o sugerencias."
  - id: c
    correct: true
    text:
      es: "La de recepción y acogida."
  - id: d
    text:
      es: "La de asistencia en el ejercicio del derecho de petición."
  explanation:
    es: "El artículo 4.a) asigna a la función de recepción y acogida la orientación en el momento inicial de la visita, en particular sobre la localización de dependencias y funcionarios. La recepción de quejas y reclamaciones recoge las tardanzas y desatenciones observadas, no una pregunta de ubicación. La de iniciativas o sugerencias recoge propuestas de mejora. La asistencia en el derecho de petición orienta sobre cómo y ante quién dirigir un escrito de petición."
  citation: "art. 4.a) RD 208/1996"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q023
  prompt:
    es: "Según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la recepción y acogida, la orientación e información, la gestión, las iniciativas, las quejas y la asistencia en el derecho de petición son funciones que se agrupan bajo la denominación de:"
  options:
  - id: a
    correct: true
    text:
      es: "Atención personalizada al ciudadano."
  - id: b
    text:
      es: "Atención especializada al ciudadano."
  - id: c
    text:
      es: "Atención sectorial al ciudadano."
  - id: d
    text:
      es: "Atención centralizada al ciudadano."
  explanation:
    es: "El artículo 4 dice que «la atención personalizada al ciudadano comprenderá las funciones siguientes» y enumera esas seis. Especializada y sectorial son calificativos de ciertas oficinas de información del artículo 8, no de la atención que describe el artículo 4. Centralizada tampoco califica esa atención."
  citation: "art. 4.a) RD 208/1996"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q024
  prompt:
    es: "Conforme al Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, las funciones que comprende la atención personalizada al ciudadano son, en total:"
  options:
  - id: a
    text:
      es: "Cinco funciones."
  - id: b
    correct: true
    text:
      es: "Seis funciones."
  - id: c
    text:
      es: "Siete funciones."
  - id: d
    text:
      es: "Cuatro funciones."
  explanation:
    es: "El artículo 4 enumera seis funciones, de la letra a) a la letra f): recepción y acogida, orientación e información, gestión, iniciativas o sugerencias, quejas y reclamaciones, y asistencia en el derecho de petición. Cuatro, cinco y siete cifras no coinciden con ese listado."
  citation: "art. 4 RD 208/1996"
  difficulty: 1
  tags:
  - "cantidad"
  - "estructura"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q026
  prompt:
    es: "En la función de orientación e información de la atención personalizada al ciudadano, ¿qué ayuda práctica puede prestar el personal de la oficina?"
  options:
  - id: a
    correct: true
    text:
      es: "Colaborar en la cumplimentación de impresos o solicitudes."
  - id: b
    text:
      es: "Interpretar las normas aplicables al caso concreto del ciudadano."
  - id: c
    text:
      es: "Valorar las consecuencias económicas de la solicitud que presentará."
  - id: d
    text:
      es: "Emitir un informe jurídico sobre la procedencia de su pretensión."
  explanation:
    es: "El artículo 4.b) permite una simple determinación de conceptos, información de opciones legales o colaboración en la cumplimentación de impresos o solicitudes. Interpretar normas, valorar consecuencias económicas o emitir un informe jurídico son actuaciones que el artículo veta: en ningún caso la orientación entraña interpretación normativa ni consideración jurídica o económica."
  citation: "art. 4.b) RD 208/1996"
  difficulty: 2
  tags:
  - "concepto"
  - "competencia"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q028
  prompt:
    es: "La función de gestión de la atención personalizada comprende, según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la recepción de la documentación inicial de un expediente:"
  options:
  - id: a
    text:
      es: "En todo caso, siempre que el ciudadano lo solicite."
  - id: b
    text:
      es: "Únicamente cuando lo autorice el titular del centro directivo."
  - id: c
    correct: true
    text:
      es: "Cuando así se haya dispuesto reglamentariamente."
  - id: d
    text:
      es: "Siempre que el expediente sea de tramitación urgente."
  explanation:
    es: "El artículo 4.c) condiciona la recepción de la documentación inicial a que así se haya dispuesto reglamentariamente. No opera en todo caso ni a solicitud del ciudadano, no depende de la autorización del titular del centro directivo y no se liga a la urgencia del expediente: la urgencia y la simplicidad solo se mencionan para las actuaciones de trámite y resolución inmediata."
  citation: "art. 4.c) RD 208/1996"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q030
  prompt:
    es: "Un ciudadano comunica en una oficina que su solicitud lleva meses sin tramitarse y que ha recibido un trato desatento en la ventanilla. ¿Qué función de atención personalizada ejerce la oficina al recibirlo?"
  options:
  - id: a
    text:
      es: "La de recepción de iniciativas o sugerencias."
  - id: b
    text:
      es: "La de gestión de la documentación inicial."
  - id: c
    text:
      es: "La de recepción y acogida."
  - id: d
    correct: true
    text:
      es: "La de recepción de quejas y reclamaciones."
  explanation:
    es: "Las tardanzas y las desatenciones son el objeto de la función de recepción de quejas y reclamaciones del artículo 4.e). La de iniciativas o sugerencias recoge propuestas de mejora, no incidencias ya sufridas. La de gestión se limita a la documentación inicial y a las cuestiones de respuesta inmediata. La de recepción y acogida orienta al ciudadano en el momento inicial de su visita."
  citation: "art. 4.e) RD 208/1996"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q031
  prompt:
    es: "Un empleado público propone suprimir un trámite innecesario de un procedimiento para mejorar la satisfacción de los ciudadanos. ¿Qué función de atención personalizada recoge esa propuesta?"
  options:
  - id: a
    text:
      es: "La de recepción de quejas y reclamaciones."
  - id: b
    text:
      es: "La de orientación e información."
  - id: c
    correct: true
    text:
      es: "La de recepción de iniciativas o sugerencias."
  - id: d
    text:
      es: "La de asistencia en el ejercicio del derecho de petición."
  explanation:
    es: "El artículo 4.d) incluye entre las iniciativas o sugerencias las de los propios empleados públicos para simplificar trámites o suprimir los innecesarios. La recepción de quejas se refiere a irregularidades ya observadas. La orientación e información aclara procedimientos y requisitos. La asistencia en el derecho de petición guía en la presentación de escritos de petición."
  citation: "art. 4.d) RD 208/1996"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q032
  prompt:
    es: "Una ciudadana pide ayuda en una oficina de información para formular un escrito de petición y saber a qué autoridad ha de dirigirlo. ¿Qué función de atención personalizada ejerce la oficina?"
  options:
  - id: a
    correct: true
    text:
      es: "La de asistencia en el ejercicio del derecho de petición."
  - id: b
    text:
      es: "La de recepción de iniciativas o sugerencias."
  - id: c
    text:
      es: "La de orientación e información sobre procedimientos."
  - id: d
    text:
      es: "La de recepción de quejas y reclamaciones."
  explanation:
    es: "La asistencia a los ciudadanos en el ejercicio del derecho de petición es la función del artículo 4.f). La recepción de iniciativas recoge propuestas de mejora de los servicios, la orientación e información atiende dudas sobre trámites y requisitos, y la recepción de quejas se limita a tardanzas o irregularidades observadas."
  citation: "art. 4.f) RD 208/1996"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q033
  prompt:
    es: "Según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, NO es una de las funciones que comprende la atención personalizada al ciudadano la de:"
  options:
  - id: a
    text:
      es: "Recibir las iniciativas o sugerencias."
  - id: b
    correct: true
    text:
      es: "Resolver los recursos administrativos interpuestos por los ciudadanos."
  - id: c
    text:
      es: "Recibir y acoger a los ciudadanos en su visita."
  - id: d
    text:
      es: "Asistir en el ejercicio del derecho de petición."
  explanation:
    es: "Las funciones del artículo 4 son recepción y acogida, orientación e información, gestión, iniciativas o sugerencias, quejas y reclamaciones y asistencia en el derecho de petición. La resolución de recursos administrativos no figura entre ellas. Recibir iniciativas, recibir y acoger al ciudadano y asistir en el derecho de petición sí son funciones del artículo."
  citation: "art. 4 RD 208/1996"
  difficulty: 3
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q034
  prompt:
    es: "Según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la función de recepción y acogida orienta al ciudadano en el momento inicial de su visita y, en particular, sobre:"
  options:
  - id: a
    text:
      es: "El estado de tramitación de su expediente."
  - id: b
    correct: true
    text:
      es: "La localización de dependencias y funcionarios."
  - id: c
    text:
      es: "El plazo máximo para resolver su solicitud."
  - id: d
    text:
      es: "Los requisitos de la documentación que debe aportar."
  explanation:
    es: "El artículo 4.a) concreta la orientación inicial en la localización de dependencias y funcionarios. El estado de un expediente es información particular del artículo 3. Los plazos y los requisitos de documentación corresponden a la función de orientación e información sobre procedimientos, trámites, requisitos y documentación."
  citation: "art. 4.a) RD 208/1996"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q087
  prompt:
    es: "Un ciudadano solicita en el mostrador que se resuelva en el acto una cuestión de trámite simple y de respuesta urgente. ¿Qué función de atención personalizada se ejerce?"
  options:
  - id: a
    text:
      es: "La de recepción y acogida."
  - id: b
    text:
      es: "La de recepción de iniciativas o sugerencias."
  - id: c
    correct: true
    text:
      es: "La de gestión."
  - id: d
    text:
      es: "La de asistencia en el derecho de petición."
  explanation:
    es: "El artículo 4.c) incluye en la gestión las actuaciones de trámite y resolución de cuestiones cuya urgencia y simplicidad demanden una respuesta inmediata. La recepción y acogida solo orienta en la visita inicial, las iniciativas recogen propuestas de mejora y la asistencia en el derecho de petición guía en escritos de petición."
  citation: "art. 4.c) RD 208/1996"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q088
  prompt:
    es: "Una persona pregunta en una oficina qué documentos debe aportar y qué requisitos debe cumplir para solicitar una prestación. ¿Qué función de atención personalizada se le presta?"
  options:
  - id: a
    correct: true
    text:
      es: "La de orientación e información."
  - id: b
    text:
      es: "La de gestión."
  - id: c
    text:
      es: "La de recepción de quejas y reclamaciones."
  - id: d
    text:
      es: "La de recepción de iniciativas o sugerencias."
  explanation:
    es: "La función de orientación e información del artículo 4.b) aclara trámites, requisitos y documentación. La gestión recibe la documentación inicial o resuelve cuestiones inmediatas, la de quejas recoge irregularidades observadas y la de iniciativas recoge propuestas de mejora."
  citation: "art. 4.b) RD 208/1996"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q093
  prompt:
    es: "Según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la función de orientación e información, como forma de facilitar a los ciudadanos el ejercicio de sus derechos, en ningún caso podrá entrañar una consideración jurídica o económica ni una:"
  options:
  - id: a
    correct: true
    text:
      es: "Interpretación normativa."
  - id: b
    text:
      es: "Determinación simple de conceptos."
  - id: c
    text:
      es: "Información de opciones legales."
  - id: d
    text:
      es: "Colaboración en la cumplimentación de impresos."
  explanation:
    es: "El artículo 4.b) excluye de la orientación e información la interpretación normativa y la consideración jurídica o económica. Las otras tres son lo que sí permite: una simple determinación de conceptos, la información de opciones legales y la colaboración en la cumplimentación de impresos o solicitudes. La determinación de conceptos, la información de opciones legales y la ayuda con los impresos están en la lista de lo permitido que cierra el apartado, así que ninguna de ellas puede ser lo que la norma prohíbe."
  citation: "art. 4.b) RD 208/1996"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
