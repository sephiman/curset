      es: "El Ministerio para la Transformación Digital y de la Función Pública."
  - id: b
    text:
      es: "El Ministerio de la Presidencia, Justicia y Relaciones con las Cortes."
  - id: c
    text:
      es: "El Ministerio de Industria y Turismo."
  - id: d
    text:
      es: "El Ministerio de Política Territorial y Memoria Democrática."
  explanation:
    es: "El Ministerio para la Transformación Digital y de la Función Pública tiene hoy la política de administración pública, función pública y gobernanza pública. Los otros ministerios ejercen competencias distintas, y el actual de Política Territorial no es el de función pública."
  citation: "art. 22.2 RD 829/2023"
  difficulty: 3
  tags:
  - "órgano"
