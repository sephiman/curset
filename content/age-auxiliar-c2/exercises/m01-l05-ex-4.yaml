# anchor: boe-a-1997-25336-art-11
- id: m01-l05-q026
  prompt:
    es: "¿Cuál de los siguientes es un requisito para ser miembro del Gobierno según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Ostentar la condición de Diputado o Senador en el momento del nombramiento."
  - id: b
    text:
      es: "Haber cumplido veinticinco años de edad en la fecha del nombramiento."
  - id: c
    text:
      es: "Ser funcionario de carrera de un cuerpo del subgrupo A1."
  - id: d
    correct: true
    text:
      es: "No estar inhabilitado para ejercer empleo o cargo público por sentencia judicial firme."
  explanation:
    es: "El artículo 11 exige ser español, mayor de edad, disfrutar de los derechos de sufragio activo y pasivo, «no estar inhabilitado para ejercer empleo o cargo público por sentencia judicial firme» y reunir los requisitos de idoneidad de la Ley 3/2015. No exige ser Diputado o Senador. La edad exigida es la mayoría de edad, no veinticinco años. No exige ser funcionario."
  citation: "art. 11 Ley 50/1997"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-99
- id: m01-l05-q027
  prompt:
    es: "Según el artículo 99.3 de la Constitución Española de 1978, ¿qué mayoría necesita el candidato a la Presidencia del Gobierno en la primera votación de investidura?"
  options:
  - id: a
    text:
      es: "La mayoría simple de los miembros del Congreso de los Diputados."
  - id: b
    correct: true
    text:
      es: "La mayoría absoluta de los miembros del Congreso de los Diputados."
  - id: c
    text:
      es: "La mayoría de tres quintos de los miembros del Congreso de los Diputados."
  - id: d
    text:
      es: "La mayoría absoluta de los miembros de cada una de las Cámaras."
  explanation:
    es: "El artículo 99.3 dice que el Rey nombrará Presidente al candidato si el Congreso, «por el voto de la mayoría absoluta de sus miembros», le otorga su confianza. La mayoría simple basta solo en la segunda votación, cuarenta y ocho horas después. Los tres quintos no se exigen en la investidura. El Senado no vota la investidura."
  citation: "art. 99.3 CE"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-99
- id: m01-l05-q028
  prompt:
    es: "De acuerdo con el artículo 99.3 de la Constitución Española de 1978, si el candidato no alcanza la mayoría absoluta, la misma propuesta se someterá a nueva votación:"
  options:
  - id: a
    text:
      es: "Veinticuatro horas después de la anterior, y la confianza se entenderá otorgada si obtuviere la mayoría simple."
  - id: b
    correct: true
    text:
      es: "Cuarenta y ocho horas después de la anterior, y la confianza se entenderá otorgada si obtuviere la mayoría simple."
  - id: c
    text:
      es: "Cuarenta y ocho horas después de la anterior, y la confianza exigirá de nuevo la mayoría absoluta del Congreso."
  - id: d
    text:
      es: "Cinco días después de la anterior, y la confianza se entenderá otorgada si obtuviere la mayoría simple."
  explanation:
    es: "El artículo 99.3 dice que la propuesta se someterá «a nueva votación cuarenta y ocho horas después de la anterior, y la confianza se entenderá otorgada si obtuviere la mayoría simple». El plazo no es de veinticuatro horas ni de cinco días; cinco días es el plazo de la moción de censura (art. 113.3). En la segunda votación no se exige de nuevo la mayoría absoluta."
  citation: "art. 99.3 CE"
  difficulty: 1
  tags:
  - "plazo"
  - "mayoría"
# anchor: boe-a-1978-31229-art-100
- id: m01-l05-q030
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el nombramiento de los miembros del Gobierno se ajusta a la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Los Ministros son nombrados por el Rey, a propuesta del Presidente, y separados por el Congreso de los Diputados."
  - id: b
    text:
      es: "Los Vicepresidentes son nombrados por el Rey, previa votación de investidura en el Congreso de los Diputados."
  - id: c
    correct: true
    text:
      es: "Los demás miembros del Gobierno son nombrados y separados por el Rey, a propuesta de su Presidente."
  - id: d
    text:
      es: "Los Ministros son nombrados por el Presidente del Gobierno, previa deliberación del Consejo de Ministros."
  explanation:
    es: "El artículo 100 dice: «Los demás miembros del Gobierno serán nombrados y separados por el Rey, a propuesta de su Presidente». El Congreso no separa a los Ministros; exige la responsabilidad política del Gobierno en su conjunto (art. 113.1). Solo el candidato a Presidente se somete a investidura (art. 99). Los Ministros los nombra el Rey, no el Presidente, y la ley no exige deliberación del Consejo."
  citation: "art. 100 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-11
- id: m01-l05-q086
  prompt:
    es: "De acuerdo con el artículo 11 de la Ley 50/1997, de 27 de noviembre, del Gobierno, para ser miembro del Gobierno se requiere, entre otros requisitos, disfrutar de:"
  options:
  - id: a
    text:
      es: "La condición de Diputado o de Senador."
  - id: b
    text:
      es: "La condición de funcionario de carrera del Estado."
  - id: c
    correct: true
    text:
      es: "Los derechos de sufragio activo y pasivo."
  - id: d
    text:
      es: "Diez años de residencia continuada en España."
  explanation:
    es: "El artículo 11 exige ser español, mayor de edad y disfrutar de los derechos de sufragio activo y pasivo, entre otros requisitos. No exige ser parlamentario ni funcionario de carrera, ni una residencia de diez años."
  citation: "art. 11 Ley 50/1997"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1997-25336-art-11
- id: m01-l05-q087
  prompt:
    es: "Según el artículo 11 de la Ley 50/1997, de 27 de noviembre, del Gobierno, para ser miembro del Gobierno hay que reunir, además, los requisitos de idoneidad previstos en la ley reguladora del ejercicio:"
  options:
  - id: a
    text:
      es: "De la función pública de los funcionarios de carrera."
  - id: b
    correct: true
    text:
      es: "Del alto cargo de la Administración General del Estado."
  - id: c
    text:
      es: "Del derecho de acceso a la información pública."
  - id: d
    text:
      es: "De la potestad sancionadora de las Administraciones Públicas."
  explanation:
    es: "El artículo 11 remite a la Ley 3/2015, reguladora del ejercicio del alto cargo de la Administración General del Estado. Las otras tres opciones nombran materias reales del Derecho administrativo, pero ninguna es la ley a la que remite el artículo."
  citation: "art. 11 Ley 50/1997"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1997-25336-art-12
- id: m01-l05-q088
  prompt:
    es: "Conforme al artículo 12.2 bis de la Ley 50/1997, de 27 de noviembre, del Gobierno, en el nombramiento de Vicepresidentes y Ministros cada sexo debe suponer, como mínimo:"
  options:
  - id: a
    text:
      es: "El treinta por ciento en su conjunto."
  - id: b
    text:
      es: "El cincuenta por ciento en cada Departamento."
  - id: c
    text:
      es: "El veinticinco por ciento en su conjunto."
  - id: d
    correct: true
    text:
      es: "El cuarenta por ciento en su conjunto."
  explanation:
    es: "El artículo 12.2 bis fija el cuarenta por ciento como mínimo para cada sexo en el conjunto de las Vicepresidencias y los Ministerios. El treinta y el veinticinco por ciento son porcentajes menores. El cincuenta por ciento en cada Departamento cambia la cifra y el modo de medirla."
  citation: "art. 12.2 bis Ley 50/1997"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1978-31229-art-99
- id: m01-l05-q089
  prompt:
    es: "¿Cuál de los siguientes órganos es el cauce a través del cual el Rey propone un candidato a la Presidencia del Gobierno, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El Presidente del Gobierno en funciones."
  - id: b
    correct: true
    text:
      es: "El Presidente del Congreso."
  - id: c
    text:
      es: "El Presidente del Senado."
  - id: d
    text:
      es: "El Presidente del Consejo de Estado."
  explanation:
    es: "El artículo 99.1 dice que el Rey hace la propuesta a través del Presidente del Congreso. El Presidente del Gobierno en funciones, el del Senado y el del Consejo de Estado no son el cauce."
  citation: "art. 99.1 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-99
- id: m01-l05-q091
  prompt:
    es: "De acuerdo con el artículo 99.2 de la Constitución Española de 1978, el candidato propuesto expone ante el Congreso de los Diputados el programa político del Gobierno que pretenda formar y solicita:"
  options:
  - id: a
    text:
      es: "La autorización del Rey."
  - id: b
    text:
      es: "El dictamen del Consejo de Estado."
  - id: c
    text:
      es: "La aprobación de las Cortes Generales en sesión conjunta."
  - id: d
    correct: true
    text:
      es: "La confianza de la Cámara."
  explanation:
    es: "El artículo 99.2 hace que el candidato solicite la confianza de la Cámara. No pide autorización al Rey, que le propone. No hay dictamen del Consejo de Estado. Y la votación es del Congreso, no de las Cortes reunidas en sesión conjunta."
  citation: "art. 99.2 CE"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-99
- id: m01-l05-q092
  prompt:
    es: "Conforme al artículo 99.4 de la Constitución Española de 1978, si efectuadas las votaciones de investidura no se otorga la confianza, se procede:"
  options:
  - id: a
    text:
      es: "A la disolución inmediata de ambas Cámaras."
  - id: b
    text:
      es: "A una votación en el Senado sobre el mismo candidato."
  - id: c
    correct: true
    text:
      es: "A tramitar sucesivas propuestas en la forma prevista en los apartados anteriores."
  - id: d
    text:
      es: "A una nueva propuesta del Presidente del Gobierno en funciones."
  explanation:
    es: "El artículo 99.4 prevé sucesivas propuestas con el mismo procedimiento. La disolución no es inmediata: solo llega si pasan dos meses desde la primera votación sin confianza. El Senado no vota la investidura. La propuesta no la hace el Presidente en funciones, sino el Rey."
  citation: "art. 99.4 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-99
- id: m01-l05-q093
  prompt:
    es: "Según el artículo 99.5 de la Constitución Española de 1978, si pasan dos meses desde la primera votación de investidura sin que ningún candidato obtenga la confianza, el Rey, con el refrendo del Presidente del Congreso, disuelve:"
  options:
  - id: a
    text:
      es: "Solo el Congreso de los Diputados y convoca elecciones generales."
  - id: b
    text:
      es: "Solo el Congreso de los Diputados y propone un nuevo candidato."
  - id: c
    correct: true
    text:
      es: "Ambas Cámaras y convoca nuevas elecciones."
  - id: d
    text:
      es: "Ambas Cámaras y nombra Presidente al candidato con más votos."
  explanation:
    es: "El artículo 99.5 dice que el Rey disuelve ambas Cámaras y convoca nuevas elecciones. Limitar la disolución al Congreso, o nombrar Presidente al más votado, cambia el resultado que prevé el artículo."
  citation: "art. 99.5 CE"
  difficulty: 3
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-99
- id: m01-l05-q111
  prompt:
    es: "Según el artículo 99.1 de la Constitución Española de 1978, ¿con quién consulta el Rey antes de proponer un candidato a la Presidencia del Gobierno después de cada renovación del Congreso de los Diputados?"
  options:
  - id: a
    text:
      es: "Con los Presidentes de las Comunidades Autónomas y de las Ciudades Autónomas."
  - id: b
    text:
      es: "Con los miembros del Consejo de Estado designados por el Gobierno saliente."
  - id: c
    text:
      es: "Con el Presidente del Gobierno en funciones y con los Ministros que continúan en el cargo."
  - id: d
    correct: true
    text:
      es: "Con los representantes de los Grupos políticos con representación parlamentaria."
  explanation:
    es: "El artículo 99.1 dice que el Rey propone candidato previa consulta con los representantes designados por los Grupos políticos con representación parlamentaria. Los Presidentes de las Comunidades Autónomas no intervienen en la propuesta. El Consejo de Estado es el órgano consultivo del Gobierno y el artículo no le da papel en este trámite. El Gobierno en funciones, con su Presidente y sus Ministros, tampoco es consultado. El Presidente del Congreso aparece en el artículo como cauce por el que el Rey hace la propuesta, no como persona consultada."
  citation: "art. 99.1 CE"
  difficulty: 1
  tags:
  - "procedimiento"
