    es: "Administrar reglas muestra la ventana emergente Administrador de reglas de formato condicional. Nueva regla muestra la ventana Nueva regla de formato, y Resaltar reglas de celdas y Duplicar valores forman la ruta del formato rápido."
  citation: "fuente: `ms-excel-quitar-duplicados.html`; «Formato avanzado»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-subtotales-html
- id: m06-l05-q318
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes rutas de la cinta de opciones inserta subtotales en una lista de datos?"
  options:
  - id: a
    text:
      es: "Datos › Ordenar y filtrar › Filtro"
  - id: b
    text:
      es: "Datos › Herramientas de datos › Quitar duplicados"
  - id: c
    text:
      es: "Insertar › Segmentación"
  - id: d
    correct: true
    text:
      es: "Datos › Esquema › Subtotal"
  explanation:
    es: "El comando Subtotal está en el grupo Esquema de la pestaña Datos. Filtro, Quitar duplicados y Segmentación son comandos de otras tareas."
  citation: "fuente: `ms-excel-subtotales.html`; «Insertar subtotales»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-subtotales-html
- id: m06-l05-q319
  prompt:
    es: "En Excel 365, ¿qué ocurre con el comando Subtotal si se trabaja con una tabla de Excel?"
  options:
  - id: a
    text:
      es: "Calcula los subtotales de toda la tabla"
  - id: b
    text:
      es: "Solo funciona si la tabla está ordenada"
  - id: c
    correct: true
    text:
      es: "Aparece atenuado"
  - id: d
    text:
      es: "Se sustituye por Quitar duplicados"
  explanation:
    es: "La página dice: «Los subtotales no se admiten en las tablas de Excel. El comando Subtotal aparecerá atenuado si está trabajando con una tabla de Excel». Calcular los subtotales de toda la tabla contradice «no se admiten». Funcionar solo con la tabla ordenada tampoco: ordenar la columna es un paso previo de la página para agrupar un rango, no una condición que levante el bloqueo de las tablas. Y sustituirse por Quitar duplicados no está en la página: para añadir subtotales hay que convertir antes la tabla en un rango normal."
  citation: "fuente: `ms-excel-subtotales.html`; «Cómo se calculan los subtotales»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-subtotales-html
- id: m06-l05-q320
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones sirve para obtener subtotales de datos que están en una tabla de Excel?"
  options:
  - id: a
    correct: true
    text:
      es: "Convertirla en rango normal o crear una tabla dinámica"
  - id: b
    text:
      es: "Activar la casilla Resumen debajo de los datos del rango"
  - id: c
    text:
      es: "Aplicarle un filtro avanzado a todas las columnas de la tabla"
  - id: d
    text:
      es: "Ordenarla de la A a la Z por la columna de subtotales"
  explanation:
    es: "Para agregar subtotales en una tabla hay que convertirla a un rango de datos normal y luego agregar el subtotal, o bien crear una tabla dinámica. Resumen debajo de los datos solo sitúa la fila de resumen, y ordenar o filtrar no habilita el comando."
  citation: "fuente: `ms-excel-subtotales.html`; «Cómo se calculan los subtotales»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-excel-subtotales-html
- id: m06-l05-q321
  prompt:
    es: "En el cuadro de diálogo Subtotal de Excel 365, el botón que elimina todos los subtotales de un rango es:"
  options:
  - id: a
    text:
      es: "Reemplazar subtotales actuales"
  - id: b
    text:
      es: "Salto de página entre grupos"
  - id: c
    text:
      es: "Resumen debajo de los datos"
  - id: d
    correct: true
    text:
      es: "Quitar todo"
  explanation:
    es: "Para quitar subtotales se abre el cuadro de diálogo Subtotal y se hace clic en Quitar todo. Reemplazar subtotales actuales, Salto de página entre grupos y Resumen debajo de los datos son casillas que se activan al insertarlos."
  citation: "fuente: `ms-excel-subtotales.html`; «Quitar subtotales»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-segmentacion-html
- id: m06-l05-q322
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe qué es una segmentación de datos?"
  options:
  - id: a
    correct: true
    text:
      es: "Botones en los que se hace clic para filtrar tablas o tablas dinámicas"
  - id: b
    text:
      es: "Un cuadro de diálogo que ordena las filas de una tabla por colores"
  - id: c
    text:
      es: "Un panel que resume los datos en subtotales por grupos"
  - id: d
    text:
      es: "Una herramienta que quita las filas duplicadas de una tabla"
  explanation:
    es: "Las segmentaciones de datos proporcionan botones en los que se hace clic para filtrar tablas o tablas dinámicas. Ordenar por colores, calcular subtotales y quitar duplicados son funciones de otros comandos."
  citation: "fuente: `ms-excel-segmentacion.html`; «Segmentación de datos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-segmentacion-html
- id: m06-l05-q324
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes rutas de la cinta de opciones inserta una segmentación de datos?"
  options:
  - id: a
    text:
      es: "Datos › Filtro"
  - id: b
    correct: true
    text:
      es: "Insertar › Segmentación"
  - id: c
    text:
      es: "Insertar › Tabla dinámica"
  - id: d
    text:
      es: "Datos › Ordenar y filtrar"
  explanation:
    es: "Se hace clic en la tabla o tabla dinámica y, en la pestaña Insertar, se selecciona Segmentación. Datos › Filtro pone flechas de filtro, Insertar › Tabla dinámica crea una tabla dinámica y el grupo Ordenar y filtrar ordena y filtra con sus comandos."
  citation: "fuente: `ms-excel-segmentacion.html`; «En la pestaña Insertar , seleccione Segmentación .»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-segmentacion-html
- id: m06-l05-q326
  prompt:
    es: "En Excel 365, ¿qué botón de una segmentación de datos selecciona todos los elementos para quitar el filtro?"
  options:
  - id: a
    text:
      es: "Filtrar conexiones"
  - id: b
    text:
      es: "Conexiones de informe"
  - id: c
    correct: true
    text:
      es: "Borrar filtro"
  - id: d
    text:
      es: "Quitar el segmentador"
  explanation:
    es: "El botón Borrar filtro selecciona todos los elementos de la segmentación para quitar el filtro. Filtrar conexiones y Conexiones de informe sirven para conectar o desconectar tablas dinámicas, y Quitar elimina la segmentación."
  citation: "fuente: `ms-excel-segmentacion.html`; «Componentes de segmentación de datos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-anular-dinamizacion-html
- id: m06-l05-q328
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe lo que consigue anular la dinamización de columnas en Power Query?"
  options:
  - id: a
    text:
      es: "Agrupar las filas por categoría y calcular un subtotal de cada una"
  - id: b
    correct: true
    text:
      es: "Poner los valores similares en una sola columna, aplanando los datos"
  - id: c
    text:
      es: "Dividir un texto en varias columnas mediante un delimitador"
  - id: d
    text:
      es: "Filtrar las filas de una tabla con botones interactivos que muestran el estado"
  explanation:
    es: "Anular la dinamización, que a veces se llama aplanar los datos, pone todos los valores similares en una columna. Los subtotales son del comando Subtotal, dividir texto es de DIVIDIRTEXTO y los botones interactivos son segmentaciones."
  citation: "fuente: `ms-excel-anular-dinamizacion.html`; «Anular la dinamización de columnas»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-anular-dinamizacion-html
- id: m06-l05-q329
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes rutas anula la dinamización de las columnas seleccionadas en Power Query?"
  options:
  - id: a
    correct: true
    text:
