# anchor: boe-a-2011-18541-art-3
- id: m02-l03-q113
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, este comprende el conjunto de órganos, centros, sistemas y medios que, mediante relaciones de cooperación y coordinación, desarrollan los servicios archivísticos para facilitar el acceso de los ciudadanos a:"
  options:
  - id: a
    text:
      es: "Los archivos de oficina, mediante autorización previa del Archivo Central."
  - id: b
    text:
      es: "Los archivos privados, en los términos que fije cada uno de sus titulares."
  - id: c
    text:
      es: "Los documentos clasificados, previa autorización del Ministerio de Cultura y del archivo."
  - id: d
    correct: true
    text:
      es: "Los archivos públicos, en los términos establecidos en la normativa general."
  explanation:
    es: "La finalidad es facilitar el acceso a los archivos públicos conforme a la normativa general. Los archivos privados, los documentos clasificados y los de oficina no son el objeto que la definición señala."
  citation: "art. 3.1 RD 1708/2011"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-6
- id: m02-l03-q114
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, el Sistema de Archivos de la Administración General del Estado es el conjunto de sistemas archivísticos departamentales, órganos, archivos y centros que actúan de manera coordinada con la finalidad de garantizar:"
  options:
  - id: a
    text:
      es: "La eliminación ordenada de los documentos tras su transferencia al archivo intermedio."
  - id: b
    correct: true
    text:
      es: "La correcta gestión de los fondos, colecciones, documentos y otras agrupaciones documentales."
  - id: c
    text:
      es: "La digitalización de todos los fondos de los archivos históricos estatales y provinciales."
  - id: d
    text:
      es: "La conservación permanente de todos los documentos de todas las Administraciones Públicas."
  explanation:
    es: "El Sistema busca la correcta gestión de fondos, colecciones, documentos y otras agrupaciones, y facilitar el acceso de los ciudadanos. La conservación de todo, la eliminación tras la transferencia y la digitalización universal van más allá de esa definición."
  citation: "art. 6 RD 1708/2011"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2011-18541-art-7
- id: m02-l03-q115
  prompt:
    es: "Dentro de la organización de los archivos del Estado, ¿qué órgano actúa como coordinador del Sistema de Archivos de la Administración General del Estado y de sus organismos públicos?"
  options:
  - id: a
    text:
      es: "El Archivo General de la Administración."
  - id: b
    correct: true
    text:
      es: "La Comisión de Archivos de la Administración General del Estado."
  - id: c
    text:
      es: "La Comisión Superior Calificadora de Documentos Administrativos."
  - id: d
    text:
      es: "El Consejo de Cooperación Archivística."
  explanation:
    es: "La Comisión de Archivos de la Administración General del Estado coordina el Sistema. El Consejo de Cooperación Archivística lo es entre administraciones públicas, la Comisión Superior Calificadora dictamina sobre calificación y utilización de documentos, y el Archivo General de la Administración es el archivo intermedio."
  citation: "art. 7 RD 1708/2011"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2011-18541-art-4
- id: m02-l03-q116
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, la Administración General del Estado promoverá la cooperación archivística mediante el establecimiento de planes generales y específicos, que deberán ser aprobados por:"
  options:
  - id: a
    correct: true
    text:
      es: "El Consejo de Ministros."
  - id: b
    text:
      es: "La Comisión de Archivos de la Administración General del Estado."
  - id: c
    text:
      es: "El Consejo de Cooperación Archivística."
  - id: d
    text:
      es: "El Ministerio de Cultura."
