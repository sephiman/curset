# anchor: boe-a-2015-10566-art-36
- id: m03-l06-q023
  prompt:
    es: "En el procedimiento para exigir la responsabilidad de las autoridades y personal al servicio de las Administraciones Públicas, el órgano competente resolverá, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    text:
      es: "En el plazo de diez días."
  - id: b
    text:
      es: "En el plazo de quince días."
  - id: c
    text:
      es: "En el plazo de seis meses."
  - id: d
    correct: true
    text:
      es: "En el plazo de cinco días."
  explanation:
    es: "El artículo 36.4 LRJSP fija la «resolución por el órgano competente en el plazo de cinco días». Diez días es el plazo de la audiencia y quince el de alegaciones y prueba. Seis meses es el plazo de la reclamación del particular, tras el que puede entenderse que la resolución es contraria a la indemnización (art. 91.3 LPAC)."
  citation: "art. 36.4 LRJSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-36
- id: m03-l06-q024
  prompt:
    es: "En el procedimiento seguido contra las autoridades y demás personal al servicio de las Administraciones Públicas, la resolución declaratoria de responsabilidad, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    text:
      es: "Podrá recurrirse en alzada ante el superior jerárquico."
  - id: b
    correct: true
    text:
      es: "Pondrá fin a la vía administrativa."
  - id: c
    text:
      es: "Solo podrá impugnarse ante el orden jurisdiccional civil."
  - id: d
    text:
      es: "Requerirá dictamen del Consejo de Estado para ser firme."
  explanation:
    es: "El artículo 36.5 LRJSP dice: «La resolución declaratoria de responsabilidad pondrá fin a la vía administrativa». Si pone fin a la vía administrativa, no cabe recurso de alzada. El orden civil no es el que el artículo prevé, y el apartado no exige dictamen alguno para su firmeza."
  citation: "art. 36.5 LRJSP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10566-art-37
- id: m03-l06-q025
  prompt:
    es: "Según el artículo 37.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la exigencia de responsabilidad penal del personal al servicio de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Suspenderá en todo caso los procedimientos de responsabilidad patrimonial hasta que el orden penal dicte sentencia firme."
  - id: b
    correct: true
    text:
      es: "No suspenderá los procedimientos de responsabilidad patrimonial, salvo que la determinación penal de los hechos sea necesaria para fijarla."
  - id: c
    text:
      es: "No suspenderá nunca los procedimientos de responsabilidad patrimonial, aunque los hechos se discutan en vía penal."
  - id: d
    text:
      es: "Suspenderá los procedimientos de responsabilidad patrimonial siempre que se impute al personal una actuación dolosa."
  explanation:
    es: "El artículo 37.2 LRJSP dice que la exigencia de responsabilidad penal «no suspenderá los procedimientos de reconocimiento de responsabilidad patrimonial que se instruyan, salvo que la determinación de los hechos en el orden jurisdiccional penal sea necesaria para la fijación de la responsabilidad patrimonial». Suspender en todo caso hasta la sentencia firme invierte la regla del «no suspenderá». No suspender nunca elimina la salvedad. Suspender siempre que se impute dolo cambia la causa: la salvedad del apartado es que la determinación penal de los hechos sea necesaria para fijar la responsabilidad patrimonial, no la calificación dolosa."
  citation: "art. 37.2 LRJSP"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
