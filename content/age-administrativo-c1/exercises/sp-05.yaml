  lesson: m03-l06
  prompt:
    es: "Según el artículo 81.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué fecha puede emitir el Servicio de Mantenimiento el informe que se le pide en el procedimiento de responsabilidad patrimonial?"
  options:
