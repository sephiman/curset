# anchor: boe-a-2003-23186-art-177
- id: m03-l12-q0287
  prompt:
    es: "¿Qué efecto tiene sobre el procedimiento de recaudación que el heredero alegue haber hecho uso del derecho a deliberar, según el artículo 177.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Se extingue la deuda tributaria pendiente del causante."
  - id: b
    correct: true
    text:
      es: "Se suspende hasta que transcurra el plazo concedido para deliberar."
  - id: c
    text:
      es: "Se prolonga el período voluntario de pago de la deuda un mes más."
  - id: d
    text:
      es: "Se traslada la deuda a los legatarios, que pasan a ser los obligados."
  explanation:
    es: "El procedimiento se suspende hasta que acabe el plazo de deliberación (art. 177.1 LGT). La deuda no se extingue ni se amplía el período voluntario un mes, y los legatarios no pasan a ser obligados por ese hecho."
  citation: "art. 177.1 LGT"
  difficulty: 2
  tags:
  - "efecto"
