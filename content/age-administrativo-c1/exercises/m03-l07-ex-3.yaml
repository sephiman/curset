# anchor: boe-a-2013-12632-art-2
- id: m03-l07-q048
  prompt:
    es: "¿Qué principio exige que las personas con discapacidad puedan llevar una vida en igualdad de condiciones, accediendo a los mismos lugares, ámbitos, bienes y servicios que cualquier otra persona?"
  options:
  - id: a
    text:
      es: "Es el principio de transversalidad de las políticas"
  - id: b
    text:
      es: "Es el principio de diálogo civil"
  - id: c
    correct: true
    text:
      es: "Es el principio de normalización"
  - id: d
    text:
      es: "Es el principio de igualdad de oportunidades"
  explanation:
    es: "El artículo 2.i) del texto refundido de la Ley General de derechos de las personas con discapacidad llama normalización a ese principio. La transversalidad significa que las Administraciones no se limitan a planes específicos para las personas con discapacidad, sino que las tienen en cuenta en todas sus políticas (art. 2.o). El diálogo civil es la participación de las organizaciones representativas en las políticas oficiales (art. 2.n). La igualdad de oportunidades es la ausencia de toda discriminación por razón de discapacidad (art. 2.b)."
  citation: "art. 2.i) RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-2
- id: m03-l07-q050
  prompt:
    es: "Según el artículo 2.m) del texto refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, vigente desde el 23 de octubre de 2026, no realizar un ajuste razonable supone:"
  options:
  - id: a
    correct: true
    text:
      es: "Una discriminación por razón de discapacidad"
  - id: b
    text:
      es: "Un acoso por razón de discapacidad"
  - id: c
    text:
      es: "Una mera irregularidad sin efectos discriminatorios"
  - id: d
    text:
      es: "Un incumplimiento de una medida de acción positiva"
  explanation:
    es: "El artículo 2.m) dice que «la no realización de un ajuste razonable supone una discriminación por razón de discapacidad y la violación del derecho a la no discriminación». El acoso es una conducta no deseada que atenta contra la dignidad (art. 2.f), otra figura. La ley niega que sea una irregularidad sin efectos discriminatorios. El ajuste razonable no es una medida de acción positiva, que la ley define aparte (art. 2.g)."
  citation: "art. 2.m) RDL 1/2013"
  difficulty: 3
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2013-12632-art-42
- id: m03-l07-q051
  prompt:
    es: "Según el artículo 42.1 del texto refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, en las empresas de 50 o más trabajadores deben ser trabajadores con discapacidad, al menos:"
  options:
  - id: a
    correct: true
    text:
      es: "El 2 por 100 de la plantilla total"
  - id: b
    text:
      es: "El 3 por 100 de la plantilla total"
  - id: c
    text:
      es: "El 4 por 100 de la plantilla total"
  - id: d
    text:
      es: "El 5 por 100 de la plantilla total"
  explanation:
    es: "El artículo 42.1 exige que, «al menos, el 2 por 100» de los trabajadores sean trabajadores con discapacidad, calculado sobre la plantilla total. El 3, el 4 y el 5 por 100 no son la cuota que fija este artículo."
  citation: "art. 42.1 RDL 1/2013"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2013-12632-art-42
- id: m03-l07-q052
  prompt:
    es: "¿Qué empresas están obligadas, según el texto refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, a que al menos el 2 por 100 de sus trabajadores sean trabajadores con discapacidad?"
  options:
  - id: a
    text:
      es: "Solo las empresas privadas que empleen a 50 o más trabajadores"
  - id: b
    text:
      es: "Las empresas públicas y privadas que empleen a 100 o más trabajadores"
  - id: c
    text:
      es: "Solo las empresas públicas que empleen a 250 o más trabajadores"
  - id: d
    correct: true
    text:
      es: "Las empresas públicas y privadas que empleen a 50 o más trabajadores"
  explanation:
    es: "El artículo 42.1 obliga a «las empresas públicas y privadas que empleen a un número de 50 o más trabajadores». No se limita a las privadas ni a las públicas. El umbral es de 50 trabajadores, no de 100 ni de 250."
  citation: "art. 42.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2013-12632-art-42
- id: m03-l07-q053
  prompt:
    es: "Según el artículo 42.1 del texto refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, las empresas pueden quedar exentas de la cuota de reserva para trabajadores con discapacidad:"
  options:
  - id: a
    correct: true
    text:
      es: "Excepcionalmente, por negociación colectiva sectorial o por opción voluntaria comunicada a la autoridad laboral, con medidas alternativas"
  - id: b
    text:
      es: "En todo caso, cuando el empresario lo solicite a la autoridad laboral, sin necesidad de aplicar medidas alternativas"
  - id: c
    text:
      es: "De manera excepcional, solo por acuerdo en convenio colectivo de empresa, sin comunicarlo a la autoridad laboral ni aplicar medidas alternativas"
  - id: d
    text:
      es: "De manera excepcional, por resolución del servicio público de empleo, sin necesidad de aplicar medidas alternativas"
  explanation:
    es: "El artículo 42.1 permite la exención «de manera excepcional», bien por acuerdos de la negociación colectiva sectorial, bien por opción voluntaria del empresario comunicada a la autoridad laboral, «y siempre que en ambos supuestos se apliquen las medidas alternativas». No es una exención en todo caso ni puede prescindir de las medidas alternativas. El acuerdo es de negociación colectiva sectorial, no de convenio de empresa. La ley no prevé una resolución del servicio público de empleo."
  citation: "art. 42.1 RDL 1/2013"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2013-12632-art-42
- id: m03-l07-q054
  prompt:
    es: "¿Cuál de las siguientes medidas prevé el texto refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social para las personas con discapacidad en las ofertas de empleo público?"
  options:
  - id: a
    text:
      es: "Una cuota del 2 por 100 de las plazas, igual que en las empresas privadas"
  - id: b
    text:
      es: "La exención de la fase de oposición en todos los procesos selectivos"
  - id: c
    correct: true
    text:
      es: "La reserva de un cupo, en los términos de la normativa reguladora de la materia"
  - id: d
    text:
      es: "Un turno de promoción interna reservado solo a personas con discapacidad"
  explanation:
    es: "El artículo 42.2 dice que «en las ofertas de empleo público se reservará un cupo para ser cubierto por personas con discapacidad, en los términos establecidos en la normativa reguladora de la materia». El 2 por 100 es la cuota de las empresas de 50 o más trabajadores (art. 42.1), no la del empleo público. El artículo no exime de la fase de oposición. Tampoco crea un turno de promoción interna exclusivo."
  citation: "art. 42.2 RDL 1/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2006-21990-art-1
- id: m03-l07-q055
  prompt:
    es: "Según el artículo 1.1 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, la ley regula sus condiciones básicas mediante la creación de:"
  options:
  - id: a
    text:
      es: "Una nueva entidad gestora de la Seguridad Social para la dependencia"
  - id: b
    text:
      es: "Una red estatal de centros públicos de atención a la dependencia"
  - id: c
    text:
      es: "Un fondo estatal gestionado solo por la Administración General del Estado"
  - id: d
    correct: true
    text:
      es: "Un Sistema para la Autonomía y Atención a la Dependencia"
  explanation:
    es: "El artículo 1.1 habla de «la creación de un Sistema para la Autonomía y Atención a la Dependencia», con la colaboración y participación de todas las Administraciones Públicas. La ley no crea una entidad gestora de la Seguridad Social. Tampoco una red estatal de centros públicos. No es un fondo que gestione solo la Administración General del Estado: el Sistema implica a todas las Administraciones."
  citation: "art. 1.1 Ley 39/2006"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2006-21990-art-2
- id: m03-l07-q056
  prompt:
    es: "Según el artículo 2.2 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, vigente desde el 23 de octubre de 2026, la situación de dependencia es:"
  options:
  - id: a
    text:
      es: "El estado temporal en que las personas, por una enfermedad sobrevenida, precisan cuidados y apoyos de otras personas"
  - id: b
    text:
      es: "La capacidad de controlar, afrontar y tomar, por propia iniciativa, decisiones personales acerca de cómo vivir"
  - id: c
    text:
      es: "La situación de quien, por razón de su edad avanzada, necesita la ayuda de otras personas para las tareas domésticas de la vida diaria"
  - id: d
    correct: true
    text:
      es: "El estado permanente en que las personas, por dificultades que afectan a su autonomía, precisan cuidados y apoyos de otras personas"
  explanation:
    es: "El artículo 2.2 la define como «el estado de carácter permanente en el que las personas, debido a dificultades que afectan a su autonomía, precisan de cuidados y apoyos de otra u otras personas o ayudas importantes para realizar actividades de la vida diaria». Un estado temporal no encaja en esa definición. La capacidad de decidir cómo vivir es la autonomía (art. 2.1). La ley no liga la dependencia solo a la edad: también puede asociarse a la discapacidad o la enfermedad."
  citation: "art. 2.2 Ley 39/2006"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2006-21990-art-26
- id: m03-l07-q057
  prompt:
    es: "¿Qué grado de dependencia tiene quien necesita ayuda para varias actividades de la vida diaria dos o tres veces al día, sin requerir el apoyo permanente de una persona cuidadora?"
  options:
  - id: a
    text:
      es: "El Grado I, de dependencia moderada"
  - id: b
    correct: true
    text:
      es: "El Grado II, de dependencia severa"
  - id: c
    text:
      es: "El Grado III, de gran dependencia"
  - id: d
    text:
      es: "El Grado III+, de dependencia extrema"
  explanation:
    es: "El artículo 26.1.b) de la Ley 39/2006 define el Grado II, dependencia severa, como el de quien necesita ayuda para varias actividades de la vida diaria «dos o tres veces al día, pero no requiere el apoyo permanente de una persona cuidadora». El Grado I es la ayuda al menos una vez al día. El Grado III exige ayuda varias veces al día y el apoyo indispensable y continuo de otra persona. El Grado III+ parte de tener reconocido el Grado III (disposición adicional decimoséptima)."
  citation: "art. 26.1 Ley 39/2006"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2006-21990-art-26
- id: m03-l07-q058
  prompt:
    es: "Según el artículo 26.1 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, ¿cuándo se encuentra una persona en el Grado III, gran dependencia?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando necesita ayuda varias veces al día y, por su pérdida total de autonomía, el apoyo indispensable y continuo de otra persona"
  - id: b
    text:
      es: "Cuando necesita ayuda dos o tres veces al día, pero no requiere el apoyo permanente de una persona cuidadora"
  - id: c
    text:
      es: "Cuando necesita ayuda al menos una vez al día o tiene necesidades de apoyo intermitente o limitado"
  - id: d
    text:
      es: "Cuando, teniendo reconocido el Grado III, padece esclerosis lateral amiotrófica en la fase avanzada que determina una dependencia completa"
  explanation:
    es: "El artículo 26.1.c) define la gran dependencia como la de quien necesita ayuda «varias veces al día y, por su pérdida total de autonomía física, mental, intelectual o sensorial, necesita el apoyo indispensable y continuo de otra persona». La ayuda dos o tres veces al día sin apoyo permanente es el Grado II. La ayuda al menos una vez al día es el Grado I. La esclerosis lateral amiotrófica en fase avanzada, con Grado III reconocido, da lugar al Grado III+ de la disposición adicional decimoséptima."
  citation: "art. 26.1 Ley 39/2006"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2006-21990-art-26
- id: m03-l07-q059
  prompt:
    es: "La persona que necesita ayuda para realizar varias actividades de la vida diaria al menos una vez al día se encuentra en:"
  options:
  - id: a
    text:
      es: "El Grado 0, de dependencia leve"
  - id: b
    correct: true
    text:
      es: "El Grado I, de dependencia moderada"
  - id: c
    text:
      es: "El Grado II, de dependencia severa"
  - id: d
    text:
      es: "El Grado III, de gran dependencia"
  explanation:
    es: "El artículo 26.1.a) de la Ley 39/2006 define el Grado I, dependencia moderada, como el de quien necesita ayuda para varias actividades de la vida diaria «al menos una vez al día». El Grado II supone ayuda dos o tres veces al día. El Grado III, ayuda varias veces al día y apoyo continuo de otra persona. La ley no prevé un grado de dependencia leve."
  citation: "art. 26.1 Ley 39/2006"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2006-21990-da-decimoseptima
- id: m03-l07-q060
  prompt:
    es: "Según la disposición adicional decimoséptima de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, ¿a quién incluye el Grado III+ de dependencia extrema?"
  options:
  - id: a
    text:
      es: "A todas las personas con Grado III reconocido que hayan cumplido ochenta años"
  - id: b
    text:
      es: "A personas con Grado II reconocido y diagnóstico de esclerosis lateral amiotrófica en cualquier fase de la enfermedad"
  - id: c
    correct: true
    text:
      es: "A personas con Grado III reconocido y esclerosis lateral amiotrófica en fase avanzada, entre otras"
  - id: d
    text:
      es: "A personas sin grado reconocido que padezcan una enfermedad de curso irreversible"
  explanation:
    es: "La disposición adicional decimoséptima incluye a las personas que, «teniendo reconocido el Grado III de dependencia», están diagnosticadas de esclerosis lateral amiotrófica en fase avanzada, y también a las que tienen otras enfermedades de alta complejidad y curso irreversible conforme al reglamento de la Ley 3/2024. La edad no es criterio. Hace falta el Grado III, no el II, y una fase avanzada. Sin grado reconocido no se accede al Grado III+."
  citation: "disposición adicional decimoséptima Ley 39/2006"
  difficulty: 3
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2006-21990-art-28
- id: m03-l07-q061
  prompt:
    es: "Según el artículo 28.1 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, ¿en qué plazo máximo debe resolverse el reconocimiento de la dependencia?"
  options:
  - id: a
    text:
      es: "En un plazo máximo de un mes"
  - id: b
    text:
      es: "En un plazo máximo de dos meses"
  - id: c
    correct: true
    text:
      es: "En un plazo máximo de tres meses"
  - id: d
    text:
      es: "En un plazo máximo de cuatro meses"
  explanation:
    es: "El artículo 28.1, en la redacción vigente desde el 23 de octubre de 2026, establece «un plazo máximo de 3 meses para su resolución». Uno, dos y cuatro meses no son el plazo que fija este artículo."
  citation: "art. 28.1 Ley 39/2006"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2006-21990-art-28
- id: m03-l07-q062
  prompt:
    es: "Según el artículo 28.1 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, el procedimiento de reconocimiento de la situación de dependencia se iniciará:"
  options:
  - id: a
    correct: true
    text:
      es: "A instancia de la persona que pueda estar afectada o de quien ostente su representación"
  - id: b
    text:
      es: "De oficio por los servicios sociales de la comunidad autónoma de residencia"
  - id: c
    text:
      es: "De oficio o a instancia de los servicios sociales del municipio de residencia"
  - id: d
    text:
      es: "A instancia de cualquier familiar, aunque no ostente su representación"
  explanation:
    es: "El artículo 28.1 dice que el procedimiento «se iniciará a instancia de la persona que pueda estar afectada por algún grado de dependencia o de quien ostente su representación». No se inicia de oficio, ni por la comunidad autónoma ni por el municipio. Un familiar solo puede instarlo si ostenta la representación."
  citation: "art. 28.1 Ley 39/2006"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2006-21990-art-28
- id: m03-l07-q064
  prompt:
    es: "¿Qué validez territorial tiene, según la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, la resolución de reconocimiento de la situación de dependencia?"
  options:
  - id: a
    text:
      es: "Solo en la comunidad autónoma que la expide"
  - id: b
    text:
      es: "En la comunidad que la expide y en las que tengan convenio con ella"
  - id: c
    text:
      es: "Solo en el municipio de residencia del solicitante"
  - id: d
    correct: true
    text:
      es: "En todo el territorio del Estado"
  explanation:
    es: "El artículo 28.2 dice que la resolución «tendrá validez en todo el territorio del Estado». No se limita a la comunidad autónoma que la expide. No depende de convenios entre comunidades. Tampoco se reduce al municipio de residencia. Si la persona cambia de residencia, la comunidad de destino fija los servicios que le corresponden (art. 28.4), pero el reconocimiento sigue valiendo."
  citation: "art. 28.2 Ley 39/2006"
  difficulty: 2
  tags:
  - "efecto"
