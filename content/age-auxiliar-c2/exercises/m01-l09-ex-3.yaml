# anchor: boe-a-1978-31229-art-148
- id: m01-l09-q033
  prompt:
    es: "Según el artículo 148.1 de la Constitución Española de 1978, ¿cuál de las siguientes materias relativas a los montes pueden asumir las Comunidades Autónomas?"
  options:
  - id: a
    text:
      es: "La legislación básica sobre montes y aprovechamientos forestales."
  - id: b
    text:
      es: "La legislación básica sobre vías pecuarias y aprovechamientos forestales."
  - id: c
    correct: true
    text:
      es: "Los montes y aprovechamientos forestales."
  - id: d
    text:
      es: "La legislación sobre montes, aprovechamientos forestales y vías pecuarias."
  explanation:
    es: "El artículo 148.1.8.ª incluye entre las materias que pueden asumir las Comunidades «los montes y aprovechamientos forestales». La legislación básica sobre montes, aprovechamientos forestales y vías pecuarias es competencia exclusiva del Estado (art. 149.1.23.ª). La legislación sobre montes, aprovechamientos forestales y vías pecuarias tampoco es materia de la lista del 148.1."
  citation: "art. 148.1.8.ª CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q034
  prompt:
    es: "De acuerdo con el artículo 149.1 de la Constitución Española de 1978, el Estado tiene competencia exclusiva sobre la siguiente materia:"
  options:
  - id: a
    correct: true
    text:
      es: "Tráfico y circulación de vehículos a motor; correos y telecomunicaciones."
  - id: b
    text:
      es: "Las carreteras cuyo itinerario se desarrolle íntegramente en el territorio de la Comunidad Autónoma."
  - id: c
    text:
      es: "Los puertos de refugio y los puertos y aeropuertos deportivos."
  - id: d
    text:
      es: "La coordinación y demás facultades en relación con las policías locales."
  explanation:
    es: "El artículo 149.1.21.ª atribuye al Estado en exclusiva el «tráfico y circulación de vehículos a motor; correos y telecomunicaciones». Las carreteras con itinerario íntegro en la Comunidad (art. 148.1.5.ª), los puertos de refugio y deportivos (art. 148.1.6.ª) y la coordinación de las policías locales (art. 148.1.22.ª) son materias que pueden asumir las Comunidades."
  citation: "art. 149.1.21.ª CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q035
  prompt:
    es: "¿A quién atribuye la Constitución Española de 1978 la competencia sobre el tráfico y la circulación de vehículos a motor?"
  options:
  - id: a
    text:
      es: "A las Comunidades Autónomas que la asuman en sus Estatutos."
  - id: b
    correct: true
    text:
      es: "Al Estado, como competencia exclusiva."
  - id: c
    text:
      es: "Al Estado la legislación básica y a las Comunidades Autónomas su desarrollo."
  - id: d
    text:
      es: "A las Comunidades Autónomas, dentro de su territorio, en todo caso."
  explanation:
    es: "El artículo 149.1.21.ª pone el «tráfico y circulación de vehículos a motor» entre las materias de competencia exclusiva del Estado. No está en la lista del artículo 148.1, así que no es materia que asuman las Comunidades por su Estatuto. El artículo no la divide en bases estatales y desarrollo autonómico."
  citation: "art. 149.1.21.ª CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-148
- id: m01-l09-q036
  prompt:
    es: "De acuerdo con el artículo 148.1 de la Constitución Española de 1978, en materia de medio ambiente las Comunidades Autónomas podrán asumir competencias sobre:"
  options:
  - id: a
    text:
      es: "La legislación básica sobre protección del medio ambiente."
  - id: b
    text:
      es: "La legislación básica y la gestión en materia de protección del medio ambiente."
  - id: c
    correct: true
    text:
      es: "La gestión en materia de protección del medio ambiente."
  - id: d
    text:
      es: "La legislación exclusiva sobre protección del medio ambiente en su territorio."
  explanation:
    es: "El artículo 148.1.9.ª incluye «la gestión en materia de protección del medio ambiente». La legislación básica sobre protección del medio ambiente es competencia exclusiva del Estado (art. 149.1.23.ª), así que no vale ninguna respuesta que la incluya. Las Comunidades pueden establecer normas adicionales de protección, pero no tienen una legislación exclusiva."
  citation: "art. 148.1.9.ª CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q037
  prompt:
    es: "¿Qué facultad reserva la Constitución Española de 1978 a las Comunidades Autónomas frente a la legislación básica del Estado sobre protección del medio ambiente?"
  options:
  - id: a
    text:
      es: "La de dejar sin efecto la legislación básica estatal en su territorio."
  - id: b
    text:
      es: "La de dictar la legislación básica cuando el Estado no la haya aprobado."
  - id: c
    text:
      es: "La de sustituir la legislación básica estatal por normas propias de igual protección."
  - id: d
    correct: true
    text:
      es: "La de establecer normas adicionales de protección."
  explanation:
    es: "El artículo 149.1.23.ª atribuye al Estado la «legislación básica sobre protección del medio ambiente, sin perjuicio de las facultades de las Comunidades Autónomas de establecer normas adicionales de protección». Las Comunidades añaden protección; no desplazan, suplen ni sustituyen la legislación básica, que es competencia exclusiva del Estado."
  citation: "art. 149.1.23.ª CE"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1978-31229-art-148
- id: m01-l09-q038
  prompt:
    es: "¿Cuál de las siguientes competencias en materia de ferrocarriles pueden asumir las Comunidades Autónomas según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Los ferrocarriles cuyo itinerario se desarrolle íntegramente en el territorio de la Comunidad Autónoma."
  - id: b
    text:
      es: "Los ferrocarriles que transcurran por el territorio de más de una Comunidad Autónoma."
  - id: c
    text:
      es: "Los ferrocarriles de interés general, aunque su itinerario discurra por varias Comunidades."
  - id: d
    text:
      es: "Los ferrocarriles cuyo itinerario se desarrolle mayoritariamente en el territorio de la Comunidad Autónoma."
  explanation:
    es: "El artículo 148.1.5.ª incluye «los ferrocarriles y carreteras cuyo itinerario se desarrolle íntegramente en el territorio de la Comunidad Autónoma». Los ferrocarriles que transcurren por más de una Comunidad son competencia exclusiva del Estado (art. 149.1.21.ª). El itinerario debe ser íntegro, no mayoritario."
  citation: "art. 148.1.5.ª CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q040
  prompt:
    es: "Según el artículo 149.1 de la Constitución Española de 1978, ¿cuál de las siguientes materias pertenece a la competencia exclusiva del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Legislación sobre propiedad intelectual e industrial."
  - id: b
    text:
      es: "Fomento de la cultura y de la investigación de la Comunidad Autónoma."
  - id: c
    text:
      es: "Patrimonio monumental de interés de la Comunidad Autónoma."
  - id: d
    text:
      es: "Ordenación del territorio, urbanismo y vivienda."
  explanation:
    es: "El artículo 149.1.9.ª reserva al Estado la «legislación sobre propiedad intelectual e industrial». El fomento de la cultura y de la investigación (art. 148.1.17.ª), el patrimonio monumental de interés de la Comunidad (148.1.16.ª) y la ordenación del territorio, urbanismo y vivienda (148.1.3.ª) son materias que pueden asumir las Comunidades."
  citation: "art. 149.1.9.ª CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-148
- id: m01-l09-q041
  prompt:
    es: "De acuerdo con el artículo 148.2 de la Constitución Española de 1978, las Comunidades Autónomas podrán ampliar sucesivamente sus competencias dentro del marco establecido en el artículo 149:"
  options:
  - id: a
    text:
      es: "Transcurridos tres años y mediante la reforma de sus Estatutos."
  - id: b
    correct: true
    text:
      es: "Transcurridos cinco años y mediante la reforma de sus Estatutos."
  - id: c
    text:
      es: "Transcurridos cinco años y mediante acuerdo de su Asamblea Legislativa."
  - id: d
    text:
      es: "Transcurridos diez años y mediante la reforma de sus Estatutos."
  explanation:
    es: "El artículo 148.2 dice: «Transcurridos cinco años, y mediante la reforma de sus Estatutos, las Comunidades Autónomas podrán ampliar sucesivamente sus competencias». Tres y diez años no son el plazo del artículo. Basta el paso del tiempo, pero la ampliación exige reformar el Estatuto, no un acuerdo de la Asamblea."
  citation: "art. 148.2 CE"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q042
  prompt:
    es: "Señale la respuesta correcta sobre las materias no atribuidas expresamente al Estado y las no asumidas por los Estatutos, conforme a la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Las materias no atribuidas expresamente al Estado corresponderán en todo caso a las Comunidades Autónomas."
  - id: b
    text:
      es: "La competencia sobre las materias no asumidas por los Estatutos corresponderá a las Comunidades Autónomas."
  - id: c
    text:
      es: "Las normas autonómicas prevalecerán siempre, en caso de conflicto, sobre las del Estado."
  - id: d
    correct: true
    text:
      es: "El derecho estatal será, en todo caso, supletorio del derecho de las Comunidades Autónomas."
  explanation:
    es: "El artículo 149.3 dice: «El derecho estatal será, en todo caso, supletorio del derecho de las Comunidades Autónomas». Las materias no atribuidas al Estado «podrán corresponder» a las Comunidades en virtud de sus Estatutos, no en todo caso. Las no asumidas por los Estatutos corresponden al Estado. En caso de conflicto prevalecen las normas del Estado en todo lo que no sea competencia exclusiva de las Comunidades."
  citation: "art. 149.3 CE"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-150
- id: m01-l09-q043
  prompt:
    es: "De acuerdo con el artículo 150.1 de la Constitución Española de 1978, en cada ley marco por la que las Cortes atribuyen a las Comunidades la facultad de dictar normas legislativas se establecerá:"
  options:
  - id: a
    text:
      es: "La correspondiente transferencia de medios financieros y las formas de control que se reserve el Estado."
  - id: b
    correct: true
    text:
      es: "La modalidad del control de las Cortes Generales sobre estas normas legislativas de las Comunidades Autónomas."
  - id: c
    text:
      es: "El control del Gobierno, previo dictamen del Consejo de Estado, sobre estas normas legislativas."
  - id: d
    text:
      es: "La apreciación de su necesidad por las Cortes Generales, por mayoría absoluta de cada Cámara."
  explanation:
    es: "El artículo 150.1 dice que «en cada ley marco se establecerá la modalidad del control de las Cortes Generales sobre estas normas legislativas de las Comunidades Autónomas». La transferencia de medios financieros y las formas de control del Estado son de la ley orgánica de transferencia o delegación (art. 150.2). El control del Gobierno con dictamen del Consejo de Estado se refiere a las funciones delegadas (art. 153.b). La apreciación por mayoría absoluta de cada Cámara es de las leyes de armonización (art. 150.3)."
  citation: "art. 150.1 CE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-1978-31229-art-150
- id: m01-l09-q056
  prompt:
    es: "De acuerdo con el artículo 150.3 de la Constitución Española de 1978, apreciar si el interés general exige dictar leyes que armonicen las disposiciones normativas de las Comunidades Autónomas corresponde:"
  options:
  - id: a
    text:
      es: "Al Gobierno, previo dictamen del Consejo de Estado y audiencia de las Comunidades Autónomas afectadas."
  - id: b
    text:
      es: "Al Congreso de los Diputados, por mayoría absoluta, en una votación final sobre el conjunto del proyecto."
  - id: c
    text:
      es: "Al Tribunal Constitucional, a instancia del Gobierno, de cincuenta Diputados o de cincuenta Senadores."
  - id: d
    correct: true
    text:
      es: "A las Cortes Generales, por mayoría absoluta de cada Cámara."
  explanation:
    es: "El artículo 150.3 dice: «Corresponde a las Cortes Generales, por mayoría absoluta de cada Cámara, la apreciación de esta necesidad». No la aprecia el Gobierno, con o sin dictamen del Consejo de Estado. La mayoría absoluta del Congreso en una votación final sobre el conjunto es la regla de las leyes orgánicas (art. 81.2): aquí votan las dos Cámaras. El Tribunal Constitucional controla la constitucionalidad de las leyes, pero no aprecia la necesidad de armonizar."
  citation: "art. 150.3 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "mayoría"
# anchor: boe-a-1978-31229-art-150
- id: m01-l09-q111
  prompt:
    es: "Conforme al artículo 150.2 de la Constitución Española de 1978, la ley orgánica por la que el Estado transfiere o delega facultades en las Comunidades Autónomas preverá en cada caso:"
  options:
  - id: a
    correct: true
    text:
      es: "La transferencia de medios financieros y las formas de control que se reserve el Estado."
  - id: b
    text:
      es: "La modalidad del control de las Cortes Generales sobre las normas autonómicas."
  - id: c
    text:
      es: "Los principios necesarios para armonizar las normas de las Comunidades."
  - id: d
    text:
      es: "La apreciación por las Cortes Generales de la necesidad de la transferencia."
  explanation:
    es: "El artículo 150.2 manda a la ley prever la transferencia de medios financieros y las formas de control que se reserve el Estado. La modalidad del control de las Cortes Generales es el contenido de cada ley marco del artículo 150.1. Los principios de armonización son el objeto de las leyes del artículo 150.3. La apreciación por las Cortes Generales de la necesidad corresponde a las leyes de armonización del artículo 150.3, no a la transferencia."
  citation: "art. 150.2 CE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q115
  prompt:
    es: "¿Cuál de las siguientes materias es de la competencia exclusiva del Estado, conforme al artículo 149.1.15.ª de la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Fomento y coordinación general de la investigación científica y técnica."
  - id: b
    text:
      es: "Promoción del deporte y de la adecuada utilización del ocio."
  - id: c
    text:
      es: "Museos, bibliotecas y conservatorios de música de interés para la Comunidad Autónoma."
  - id: d
    text:
      es: "El fomento de la cultura, de la investigación y de la enseñanza de la lengua de la Comunidad Autónoma."
  explanation:
    es: "El artículo 149.1.15.ª reserva al Estado el fomento y la coordinación general de la investigación científica y técnica. La promoción del deporte, los museos y bibliotecas de interés autonómico y el fomento de la cultura y de la investigación de la propia Comunidad son materias que las Comunidades pueden asumir según el artículo 148.1."
  citation: "art. 149.1.15.ª CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q116
  prompt:
    es: "¿Cuál de las siguientes materias es de la competencia exclusiva del Estado, conforme al artículo 149.1.20.ª de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Los puertos de refugio y los puertos y aeropuertos deportivos."
  - id: b
    correct: true
    text:
      es: "Iluminación de costas y señales marítimas."
  - id: c
    text:
      es: "Las ferias interiores."
  - id: d
    text:
      es: "Los ferrocarriles y carreteras cuyo itinerario se desarrolle íntegramente en el territorio de la Comunidad Autónoma."
  explanation:
    es: "La iluminación de costas y las señales marítimas figuran en la regla 20.ª del artículo 149.1, entre las materias exclusivas del Estado. Los puertos y aeropuertos deportivos, las ferias interiores y los ferrocarriles y carreteras que no salen de la Comunidad son competencias que el artículo 148.1 permite asumir a las Comunidades."
  citation: "art. 149.1.20.ª CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-148
- id: m01-l09-q117
  prompt:
    es: "Señale cuál de las siguientes materias pueden asumir las Comunidades Autónomas, conforme al artículo 148.1.14.ª de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Defensa y Fuerzas Armadas."
  - id: b
    text:
      es: "Relaciones internacionales."
  - id: c
    correct: true
    text:
      es: "La artesanía."
  - id: d
    text:
      es: "Administración de Justicia."
  explanation:
    es: "El artículo 148.1.14.ª incluye la artesanía entre las materias que las Comunidades pueden asumir. La defensa y las Fuerzas Armadas, las relaciones internacionales y la Administración de Justicia son competencias exclusivas del Estado según las reglas 4.ª, 3.ª y 5.ª del artículo 149.1."
  citation: "art. 148.1.14.ª CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-148
- id: m01-l09-q118
  prompt:
    es: "Conforme al artículo 148.1.21.ª de la Constitución Española de 1978, las Comunidades Autónomas podrán asumir competencias, entre otras, en materia de:"
  options:
  - id: a
    text:
      es: "Sanidad exterior."
  - id: b
    text:
      es: "Legislación sobre productos farmacéuticos."
  - id: c
    text:
      es: "Hacienda general y Deuda del Estado."
  - id: d
    correct: true
    text:
      es: "Sanidad e higiene."
  explanation:
    es: "La sanidad e higiene es la materia que las Comunidades pueden asumir según el artículo 148.1.21.ª. La sanidad exterior y la legislación sobre productos farmacéuticos son competencias exclusivas del Estado en el artículo 149.1.16.ª, y la Hacienda general y la Deuda del Estado lo son en la regla 14.ª."
  citation: "art. 148.1.21.ª CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q119
  prompt:
    es: "De acuerdo con el artículo 149.1.16.ª de la Constitución Española de 1978, es competencia exclusiva del Estado, junto con la sanidad exterior y la legislación sobre productos farmacéuticos:"
  options:
  - id: a
    correct: true
    text:
      es: "Las bases y la coordinación general de la sanidad."
  - id: b
    text:
      es: "La gestión de la sanidad e higiene."
  - id: c
    text:
      es: "La asistencia social."
  - id: d
    text:
      es: "La promoción del deporte y de la adecuada utilización del ocio."
  explanation:
    es: "La regla 16.ª del artículo 149.1 reserva al Estado, además de la sanidad exterior y los productos farmacéuticos, las bases y la coordinación general de la sanidad. La sanidad e higiene como materia a asumir corresponde a las Comunidades en el artículo 148.1.21.ª. La asistencia social y la promoción del deporte también son materias del artículo 148.1."
  citation: "art. 149.1.16.ª CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-148
- id: m01-l09-q135
  prompt:
    es: "¿Cuál de las siguientes materias relativas a puertos y aeropuertos pueden asumir las Comunidades Autónomas, según el artículo 148.1 de la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Los puertos y aeropuertos deportivos."
  - id: b
    text:
      es: "Los puertos de interés general."
  - id: c
    text:
      es: "Los aeropuertos de interés general."
  - id: d
    text:
      es: "El control del espacio aéreo y el tránsito aéreo."
  explanation:
    es: "Las Comunidades pueden asumir los puertos de refugio, los puertos y aeropuertos deportivos y, en general, los que no desarrollen actividades comerciales. Los puertos y aeropuertos de interés general, y el control del espacio aéreo y el tránsito aéreo, son competencias exclusivas del Estado en el artículo 149.1.20.ª."
  citation: "art. 148.1.6.ª CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-148
- id: m01-l09-q136
  prompt:
    es: "Conforme al artículo 148.1.22.ª de la Constitución Española de 1978, las Comunidades Autónomas pueden asumir la coordinación y demás facultades sobre las policías locales en los términos que establezca:"
  options:
  - id: a
    text:
      es: "Una ley marco de las Cortes Generales."
  - id: b
    correct: true
    text:
      es: "Una ley orgánica."
  - id: c
    text:
      es: "Un Real Decreto del Gobierno de la Nación."
  - id: d
    text:
      es: "Un acuerdo de la Conferencia de Presidentes."
  explanation:
    es: "La regla 22.ª remite a una ley orgánica los términos de la coordinación y demás facultades sobre las policías locales. Una ley marco atribuye a las Comunidades la facultad de dictar normas legislativas, que es otra técnica del artículo 150.1. El Real Decreto y el acuerdo de la Conferencia de Presidentes no son la norma que el artículo señala."
  citation: "art. 148.1.22.ª CE"
  difficulty: 3
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-149
- id: m01-l09-q137
  prompt:
    es: "De acuerdo con el artículo 149.1.32.ª de la Constitución Española de 1978, el Estado tiene competencia exclusiva sobre la autorización para la convocatoria de:"
  options:
  - id: a
    text:
      es: "Elecciones a las Asambleas Legislativas de las Comunidades Autónomas."
  - id: b
    text:
      es: "Elecciones municipales."
  - id: c
    correct: true
    text:
      es: "Consultas populares por vía de referéndum."
  - id: d
    text:
