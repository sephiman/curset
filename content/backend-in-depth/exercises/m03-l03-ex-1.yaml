- id: m03-l03-q09
  prompt:
    en: A parent thread has a `ScopedValue` bound, and it forks a child thread with `StructuredTaskScope.fork`.
      How does code in the child thread get the parent's binding, according to JEP 506?
  options:
  - id: a
    text:
      en: The binding is copied into the child thread when the child is created
  - id: b
    text:
      en: It cannot read the binding, because scoped values are not visible outside the thread that bound them
  - id: c
    text:
      en: Only if the child runs in a `ForkJoinPool`, which supports scoped value inheritance
  - id: d
    correct: true
    text:
      en: It reads the parent's binding directly, with minimal overhead
  explanation:
    en: Code in a child thread can use bindings established in the parent thread with minimal overhead. Copying
      is wrong because there is no copying of a parent thread's scoped value bindings to the child thread. Invisibility
      is wrong because scoped values in the parent thread are automatically inherited by child threads created with
      `StructuredTaskScope`. The `ForkJoinPool` option is wrong because legacy thread management classes such as
      `ForkJoinPool` do not support inheritance of scoped values.
  citation: jep-506#Inheriting-scoped-values
