# anchor: boe-a-2003-23186-art-141
- id: m03-l08-q0001
  prompt:
    es: "De acuerdo con el artículo 141 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la inspección tributaria consiste en el ejercicio de las funciones administrativas dirigidas, entre otras, a:"
  options:
  - id: a
    text:
      es: "La expedición y, en su caso, revocación del número de identificación fiscal."
  - id: b
    text:
      es: "La elaboración y mantenimiento de los censos tributarios."
  - id: c
    text:
      es: "La emisión de los certificados tributarios que soliciten los obligados."
  - id: d
    correct: true
    text:
      es: "La práctica de las liquidaciones tributarias resultantes de sus actuaciones de comprobación e investigación."
  explanation:
    es: "El artículo 141.g incluye entre las funciones de la inspección la práctica de las liquidaciones que resultan de sus actuaciones. La expedición y revocación del número de identificación fiscal, los censos y los certificados tributarios son funciones de la gestión tributaria que enumera el artículo 117.1, no de la inspección."
  citation: "art. 141 LGT"
  difficulty: 1
  tags:
  - "función"
  - "inspección"
# anchor: boe-a-2003-23186-art-141
- id: m03-l08-q0002
  prompt:
    es: "De acuerdo con el artículo 141 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las funciones de la inspección tributaria:"
  options:
  - id: a
    text:
      es: "Comprende la comprobación del valor de bienes y empresas solo cuando el obligado tributario así lo solicite por escrito."
  - id: b
    text:
      es: "Excluye las actuaciones de obtención de información relacionadas con la aplicación de los tributos, que son de la gestión tributaria."
  - id: c
    correct: true
    text:
      es: "Comprende la comprobación del valor de derechos, rentas, productos, bienes, patrimonios y empresas, cuando sea necesaria para determinar las obligaciones tributarias."
  - id: d
    text:
      es: "Excluye la información a los obligados sobre sus derechos y obligaciones con motivo de las actuaciones inspectoras."
  explanation:
    es: "La letra d) del artículo 141 atribuye a la inspección la comprobación del valor cuando sea necesaria para determinar las obligaciones tributarias, sin condicionarla a una petición del obligado. La letra c) incluye las actuaciones de obtención de información de los artículos 93 y 94, y la letra f) incluye la información a los obligados con motivo de las actuaciones inspectoras. Ninguna de las dos queda fuera."
  citation: "art. 141 LGT"
  difficulty: 2
  tags:
  - "función"
  - "valoración"
# anchor: boe-a-2003-23186-art-141
- id: m03-l08-q0003
  prompt:
    es: "Conforme al artículo 141 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál de las siguientes funciones corresponde a la inspección tributaria?"
  options:
  - id: a
    text:
      es: "La recepción y tramitación de declaraciones, autoliquidaciones y comunicaciones de datos con trascendencia tributaria."
  - id: b
    correct: true
    text:
      es: "La investigación de los supuestos de hecho de las obligaciones tributarias para el descubrimiento de los que sean ignorados por la Administración."
  - id: c
    text:
      es: "La realización de actuaciones de verificación de datos sobre las declaraciones presentadas."
  - id: d
    text:
      es: "La información y asistencia tributaria a los obligados en el cumplimiento de sus obligaciones."
  explanation:
    es: "La letra a) del artículo 141 define la primera función de la inspección: investigar los supuestos de hecho que la Administración ignora. Recibir y tramitar declaraciones, verificar datos y prestar información y asistencia son funciones de la gestión tributaria del artículo 117.1."
  citation: "art. 141 LGT"
  difficulty: 1
  tags:
  - "función"
  - "investigación"
# anchor: boe-a-2003-23186-art-141
- id: m03-l08-q0005
  prompt:
    es: "¿Qué función de la inspección tributaria recoge el artículo 141 de la Ley 58/2003, de 17 de diciembre, General Tributaria en relación con las intervenciones tributarias de carácter permanente o no permanente?"
  options:
  - id: a
    text:
      es: "Las realiza, y se rigen por su normativa específica y, en defecto de regulación expresa, por todas las normas del capítulo de la inspección, sin exclusión alguna, incluido el artículo 149."
  - id: b
    text:
      es: "Las realiza, y se rigen exclusivamente por las normas del capítulo de la inspección, con exclusión del artículo 150."
  - id: c
    correct: true
    text:
      es: "Las realiza, y se rigen por su normativa específica y, en defecto de regulación expresa, por las normas del capítulo de la inspección con exclusión del artículo 149."
  - id: d
    text:
      es: "Las encomienda a la gestión tributaria, que las realiza con arreglo a las normas del capítulo de la inspección."
  explanation:
    es: "La letra j) del artículo 141 incluye las intervenciones tributarias entre las funciones de la inspección. Se rigen por su normativa específica y, a falta de regulación expresa, por el capítulo de la inspección salvo el artículo 149, el de la solicitud de inspección general. Las opciones que no excluyen ese artículo, que excluyen el 150 o que pasan la función a la gestión cambian el texto."
  citation: "art. 141 LGT"
  difficulty: 3
  tags:
  - "función"
  - "intervenciones"
# anchor: boe-a-2007-15984-art-166
- id: m03-l08-q0007
  prompt:
    es: "Según el artículo 166.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿qué se entiende por órganos de inspección tributaria?"
  options:
  - id: a
    text:
      es: "Solo los órganos de la Agencia Estatal de Administración Tributaria que ejerzan funciones del artículo 141 de la Ley General Tributaria."
  - id: b
    text:
      es: "Los de carácter administrativo o judicial que ejerzan funciones de comprobación e investigación de las obligaciones tributarias."
  - id: c
    text:
      es: "Los que tengan atribuida esa condición en las normas de organización específica, con exclusión de los que ejerzan las funciones del artículo 141."
  - id: d
    correct: true
    text:
      es: "Los de carácter administrativo que ejerzan las funciones del artículo 141 de la Ley General Tributaria, y los que tengan atribuida esa condición en las normas de organización específica."
  explanation:
    es: "El artículo 166.1 suma dos grupos: los órganos administrativos que ejercen las funciones del artículo 141 y los que las normas de organización específica declaran de inspección. Limitarlo a la Agencia Tributaria o incluir órganos judiciales no está en el texto, y el segundo grupo no excluye al primero sino que se añade a él."
  citation: "art. 166.1 RGAT"
  difficulty: 2
  tags:
  - "órganos"
  - "inspección"
# anchor: boe-a-2003-23186-art-141
- id: m03-l08-q0115
  prompt:
    es: "Según el artículo 141 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál de las siguientes actuaciones constituye una función de la inspección tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "La realización de actuaciones de comprobación limitada, conforme a los artículos 136 a 140 de la Ley."
  - id: b
    text:
      es: "La realización de actuaciones de verificación de datos, conforme al procedimiento de gestión tributaria del artículo 117."
  - id: c
    text:
      es: "La emisión de certificados tributarios a solicitud de los obligados."
  - id: d
    text:
      es: "El control de los acuerdos de simplificación relativos a la obligación de facturar."
  explanation:
    es: "La letra h) del artículo 141 incluye la comprobación limitada entre las funciones de la inspección. La verificación de datos, los certificados y el control de acuerdos de simplificación sobre facturación son funciones de la gestión tributaria del artículo 117.1."
  citation: "art. 141 LGT"
  difficulty: 2
  tags:
  - "función"
  - "comprobación limitada"
# anchor: boe-a-2003-23186-art-141
- id: m03-l08-q0116
  prompt:
    es: "¿Qué función atribuye el artículo 141.i de la Ley 58/2003, de 17 de diciembre, General Tributaria a la inspección tributaria en relación con otros órganos de la Administración pública?"
  options:
  - id: a
    text:
      es: "La dirección de las actuaciones inspectoras que desarrollen esos órganos."
  - id: b
    correct: true
    text:
      es: "El asesoramiento e informe a órganos de la Administración pública."
  - id: c
    text:
      es: "La sustitución de esos órganos cuando carezcan de medios para comprobar."
  - id: d
    text:
      es: "La delegación de las liquidaciones tributarias que esos órganos deban practicar."
  explanation:
    es: "La letra i) del artículo 141 prevé el asesoramiento e informe a órganos de la Administración pública. No dirige actuaciones ajenas, no sustituye a otros órganos ni les delega liquidaciones."
  citation: "art. 141 LGT"
  difficulty: 1
  tags:
  - "función"
  - "asesoramiento"
# anchor: boe-a-2003-23186-art-141
- id: m03-l08-q0117
  prompt:
    es: "De acuerdo con el artículo 141.f de la Ley 58/2003, de 17 de diciembre, General Tributaria, entre las funciones de la inspección tributaria está la información a los obligados con motivo de las actuaciones inspectoras sobre:"
  options:
  - id: a
    text:
      es: "Sus derechos, pero no sobre la forma en que deben cumplir sus obligaciones tributarias."
  - id: b
    text:
      es: "Las infracciones que pueden cometer y las sanciones que llevan aparejadas, en su caso."
  - id: c
    correct: true
    text:
      es: "Sus derechos y obligaciones tributarias y la forma en que deben cumplir estas últimas."
  - id: d
    text:
      es: "Los criterios de selección de los obligados a quienes se inicia un procedimiento inspector."
  explanation:
    es: "La letra f) abarca los derechos y las obligaciones tributarias y la forma de cumplir estas últimas. No se limita a los derechos y no incluye los criterios de selección de obligados ni la información sobre infracciones y sanciones."
  citation: "art. 141 LGT"
  difficulty: 2
  tags:
  - "función"
  - "información"
# anchor: boe-a-2003-23186-art-141
- id: m03-l08-q0120
  prompt:
    es: "Según el artículo 141.k de la Ley 58/2003, de 17 de diciembre, General Tributaria, entre las funciones de la inspección tributaria están, además de las enumeradas en el resto de letras, las demás que:"
  options:
  - id: a
    text:
      es: "Se establezcan en el reglamento de inspección, que se aprobará por orden del ministro competente."
  - id: b
    text:
      es: "Se le encomienden por el obligado tributario en el curso de las actuaciones, con carácter potestativo."
  - id: c
    text:
      es: "Se deriven de las intervenciones tributarias, con exclusión de las que se rijan por normativa específica."
  - id: d
    correct: true
    text:
      es: "Se establezcan en otras disposiciones o se le encomienden por las autoridades competentes."
  explanation:
    es: "La letra k) cierra la lista con las demás funciones que establezcan otras disposiciones o encomienden las autoridades competentes. No las limita al reglamento, no las deja a iniciativa del obligado y no excluye intervenciones."
  citation: "art. 141 LGT"
  difficulty: 2
  tags:
  - "función"
# anchor: boe-a-2007-15984-art-166
- id: m03-l08-q0121
  prompt:
    es: "Conforme al artículo 166.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, a efectos del reglamento, se entiende por órganos de inspección tributaria los de carácter administrativo que ejerzan las funciones previstas en el artículo 141 de la Ley General Tributaria y los que:"
  options:
  - id: a
    text:
      es: "Designe el Ministro de Hacienda mediante orden publicada en el boletín oficial."
  - id: b
    text:
      es: "Ejerzan funciones de gestión tributaria en las dependencias de la Agencia Tributaria."
  - id: c
    text:
      es: "Ejerzan funciones jurisdiccionales en materia tributaria con carácter permanente."
  - id: d
    correct: true
    text:
      es: "Tengan atribuida esa condición en las normas de organización específica."
  explanation:
    es: "Junto a los órganos que ejercen las funciones del artículo 141, el artículo 166.1 incluye los que tengan atribuida la condición de inspección en normas de organización específica. No remite a una orden del Ministro, no incluye a los de gestión y no alcanza a órganos jurisdiccionales."
  citation: "art. 166.1 RGAT"
  difficulty: 2
  tags:
  - "órganos"
  - "inspección"
# anchor: boe-a-2003-23186-art-141
- id: m03-l08-q0323
  prompt:
    es: "De acuerdo con el artículo 141 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las funciones de la inspección tributaria en materia de información:"
  options:
  - id: a
    text:
      es: "Se limitan a informar a los obligados sobre sus derechos y obligaciones, sin obtener información de terceros."
  - id: b
    text:
      es: "Excluyen las actuaciones de obtención de información, que corresponden en exclusiva a la gestión tributaria."
  - id: c
    correct: true
    text:
      es: "Incluyen la realización de actuaciones de obtención de información relacionadas con la aplicación de los tributos."
  - id: d
    text:
      es: "Solo comprenden la obtención de información cuando la solicita otro órgano de la Administración pública estatal."
  explanation:
    es: "Entre las funciones de la inspección figura la realización de actuaciones de obtención de información relacionadas con la aplicación de los tributos, de acuerdo con los artículos 93 y 94 (art. 141.c). Informar a los obligados sobre sus derechos y obligaciones es otra función distinta (art. 141.f), que no agota la de obtener información. Atribuir esas actuaciones solo a la gestión las excluye de la inspección, y condicionarlas a que las pida otro órgano añade un requisito que el artículo no contiene, pues el asesoramiento a otros órganos es una función aparte (art. 141.i)."
  citation: "art. 141 LGT"
  difficulty: 1
  tags:
  - "función"
  - "obtención de información"
# anchor: boe-a-2007-15984-art-171
- id: m03-l08-q0009
  prompt:
    es: "De acuerdo con el artículo 171.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre los documentos de los obligados tributarios que se pueden examinar en las actuaciones inspectoras:"
  options:
  - id: a
    correct: true
    text:
      es: "Entre otros, la contabilidad, que comprende tanto los registros y soportes contables como las hojas previas o accesorias que justifiquen las anotaciones."
  - id: b
    text:
      es: "La contabilidad, pero solo los registros y soportes contables, sin las hojas previas o accesorias que justifiquen las anotaciones del obligado tributario."
  - id: c
    text:
      es: "Las declaraciones y autoliquidaciones, pero no las comunicaciones de datos ni las solicitudes presentadas por el obligado."
  - id: d
    text:
      es: "Los libros registro establecidos por las normas tributarias, pero no las facturas y justificantes que el obligado deba conservar."
  explanation:
    es: "El artículo 171.1.b dice que la contabilidad comprende los registros y soportes contables y también las hojas previas o accesorias que amparen o justifiquen las anotaciones. Las declaraciones, autoliquidaciones, comunicaciones de datos y solicitudes se pueden examinar todas (letra a), y lo mismo las facturas y justificantes (letra d), de modo que las otras opciones recortan la lista."
  citation: "art. 171.1 RGAT"
  difficulty: 3
  tags:
  - "documentación"
  - "contabilidad"
# anchor: boe-a-2003-23186-art-142
- id: m03-l08-q0012
  prompt:
    es: "De acuerdo con el artículo 142.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, para el acceso de los funcionarios de la inspección a las fincas y locales de negocio se precisará de un acuerdo de entrada de la autoridad administrativa que reglamentariamente se determine, salvo que:"
  options:
  - id: a
    text:
      es: "El obligado tributario haya recibido una comunicación previa de inicio de las actuaciones."
  - id: b
    text:
      es: "El lugar sea una finca en la que se desarrollen actividades sujetas a gravamen, aunque ni el obligado ni el custodio otorguen su consentimiento."
  - id: c
    text:
      es: "Los funcionarios acrediten su condición de agentes de la autoridad ante quien custodie los lugares."
  - id: d
    correct: true
    text:
      es: "El obligado tributario o la persona bajo cuya custodia se encuentren los lugares otorguen su consentimiento para ello."
  explanation:
    es: "El artículo 142.2 exige el acuerdo de entrada salvo que el obligado o quien custodie el lugar consienta. Haber recibido la comunicación de inicio, que la finca albergue actividades gravadas o que los funcionarios acrediten su condición no sustituyen al consentimiento ni al acuerdo."
  citation: "art. 142.2 LGT"
  difficulty: 1
  tags:
  - "entrada"
  - "consentimiento"
# anchor: boe-a-2007-15984-art-172
- id: m03-l08-q0013
  prompt:
    es: "Según el artículo 172.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, en el ámbito de la Agencia Estatal de Administración Tributaria, ¿quién acuerda la entrada cuando el obligado o el custodio de los lugares se oponen a ella?"
  options:
  - id: a
    correct: true
    text:
      es: "El delegado o el director de departamento del que dependa el órgano actuante."
  - id: b
    text:
      es: "El jefe del equipo o unidad de inspección que desarrolle las actuaciones."
  - id: c
    text:
      es: "El director general de la Agencia Estatal de Administración Tributaria, en todos los casos."
  - id: d
    text:
      es: "El órgano competente para liquidar, a propuesta del actuario."
  explanation:
    es: "Ante la oposición a la entrada, el artículo 172.2 atribuye el acuerdo al delegado o al director de departamento del que dependa el órgano actuante. El jefe del equipo está por debajo de esa autoridad, el director general de la Agencia por encima, y el órgano competente para liquidar no decide la entrada."
  citation: "art. 172.2 RGAT"
  difficulty: 2
  tags:
  - "entrada"
  - "órgano"
# anchor: boe-a-2007-15984-art-172
- id: m03-l08-q0015
  prompt:
    es: "Conforme al artículo 172.5 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, si el obligado tributario revoca su consentimiento para la permanencia en los lugares donde se desarrollan las actuaciones, los funcionarios de inspección, antes de la finalización de estas, podrán:"
  options:
  - id: a
    text:
      es: "Abandonar de inmediato el lugar sin posibilidad de adoptar medidas cautelares de ningún tipo."
  - id: b
    text:
      es: "Continuar las actuaciones sin límite, porque la revocación del consentimiento carece de efectos."
  - id: c
    text:
      es: "Solicitar la ratificación de la revocación al órgano competente para liquidar en el plazo de quince días."
  - id: d
    correct: true
    text:
      es: "Adoptar las medidas cautelares reguladas en el artículo 146 de la Ley General Tributaria."
  explanation:
    es: "Tras la revocación del consentimiento, el artículo 172.5 permite adoptar las medidas cautelares del artículo 146 antes de que terminen las actuaciones. No impone abandonar el lugar sin más ni declara inútil la revocación. Los quince días son el plazo de ratificación de las medidas, no de la revocación."
  citation: "art. 172.5 RGAT"
  difficulty: 2
  tags:
  - "entrada"
  - "medidas cautelares"
# anchor: boe-a-2007-15984-art-172
- id: m03-l08-q0018
  prompt:
    es: "Conforme al artículo 172.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, el acuerdo de entrada incorporado a la solicitud de autorización judicial para entrar en el domicilio constitucionalmente protegido corresponderá:"
  options:
  - id: a
    correct: true
    text:
      es: "Al delegado o al director de departamento del que dependa el órgano actuante, en el ámbito de la Agencia Tributaria."
  - id: b
    text:
      es: "Al jefe del equipo de inspección que desarrolle las actuaciones en el domicilio."
  - id: c
    text:
      es: "Al órgano judicial que conceda la autorización, antes de la solicitud."
  - id: d
    text:
      es: "Al órgano competente para liquidar, que lo dicta tras el trámite de audiencia."
  explanation:
    es: "El artículo 172.3 remite a las autoridades del artículo 172.2: el delegado o el director de departamento del que dependa el órgano actuante. El jefe de equipo queda por debajo. El juez concede o no la autorización, no firma el acuerdo que se le presenta. El órgano que liquida interviene después de las actuaciones."
  citation: "art. 172.3 RGAT"
  difficulty: 2
  tags:
  - "domicilio"
  - "órgano"
# anchor: boe-a-2007-15984-art-172
- id: m03-l08-q0020
  prompt:
    es: "De acuerdo con el artículo 172.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, una vez finalizada la entrada y reconocimiento judicialmente autorizados, se comunicará al órgano jurisdiccional que los autorizó:"
  options:
  - id: a
    text:
      es: "Únicamente el resultado económico de la regularización que se derive de las actuaciones."
  - id: b
    text:
      es: "La liquidación provisional que, en su caso, practique el órgano competente para liquidar."
  - id: c
    correct: true
    text:
      es: "Las circunstancias, incidencias y resultados de la entrada y reconocimiento."
  - id: d
    text:
      es: "El inventario de los bienes sobre los que se hayan adoptado medidas cautelares, sin más datos."
  explanation:
    es: "El artículo 172.4 ordena comunicar al juez las circunstancias, incidencias y resultados de la entrada. No pide el resultado económico ni la liquidación, que llegan después. Tampoco limita la comunicación al inventario de bienes afectados por medidas cautelares, aunque esas medidas se puedan adoptar durante la entrada."
  citation: "art. 172.4 RGAT"
  difficulty: 2
  tags:
  - "entrada"
  - "autorización judicial"
# anchor: boe-a-2003-23186-art-142
- id: m03-l08-q0022
  prompt:
    es: "Conforme al artículo 142.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la inspección podrá requerir la comparecencia personal del obligado tributario:"
  options:
  - id: a
    correct: true
    text:
      es: "Excepcionalmente y de forma motivada, cuando la naturaleza de las actuaciones a realizar así lo exija."
  - id: b
    text:
      es: "Siempre que lo considere conveniente el actuario, sin necesidad de motivación alguna."
  - id: c
    text:
      es: "Únicamente cuando el obligado sea una persona jurídica que carezca de representante."
  - id: d
    text:
      es: "Previa autorización escrita del órgano competente para liquidar, en los términos que fije el reglamento de desarrollo."
  explanation:
    es: "La comparecencia personal es excepcional y debe motivarse, y solo procede cuando la naturaleza de las actuaciones lo exige (art. 142.3). No depende de la conveniencia del actuario, de que el obligado sea persona jurídica ni de una autorización del órgano que liquida."
  citation: "art. 142.3 LGT"
  difficulty: 2
  tags:
  - "colaboración"
  - "comparecencia"
# anchor: boe-a-2003-23186-art-142
- id: m03-l08-q0023
  prompt:
    es: "Según el artículo 142.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre los funcionarios que desempeñan funciones de inspección de los tributos:"
  options:
  - id: a
    text:
      es: "Son considerados agentes de la autoridad y deben acreditar su condición en todo caso, también dentro de las oficinas públicas y ante cualquier persona."
  - id: b
    text:
      es: "Son considerados autoridad pública y no están obligados a acreditar su condición a quien se lo requiera."
  - id: c
    correct: true
    text:
      es: "Son considerados agentes de la autoridad y deben acreditar su condición, si son requeridos para ello, fuera de las oficinas públicas."
  - id: d
    text:
      es: "Son considerados agentes de la autoridad solo cuando actúan con autorización del delegado o del director de departamento."
  explanation:
    es: "El artículo 142.4 los considera agentes de la autoridad y les obliga a acreditar su condición si se les requiere fuera de las oficinas públicas. No es una acreditación permanente dentro de las oficinas, no se les llama autoridad pública exenta de acreditar y su condición no depende de una autorización del delegado."
  citation: "art. 142.4 LGT"
  difficulty: 2
  tags:
  - "funcionarios"
  - "agentes de la autoridad"
# anchor: boe-a-2003-23186-art-142
- id: m03-l08-q0024
  prompt:
    es: "De acuerdo con el artículo 142.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, para el ejercicio de las funciones de inspección, las autoridades públicas prestarán a los funcionarios:"
  options:
  - id: a
    text:
      es: "La autorización judicial previa para cualquier entrada en locales de negocio."
  - id: b
    correct: true
    text:
      es: "La protección y el auxilio necesarios."
  - id: c
    text:
      es: "El acuerdo de entrada en el domicilio fiscal del obligado tributario."
  - id: d
    text:
      es: "La información tributaria que obre en poder de otros órganos de la Administración, sin necesidad de requerimiento."
  explanation:
    es: "El artículo 142.4 solo dice que las autoridades públicas prestarán a los funcionarios de inspección la protección y el auxilio necesarios. La autorización judicial, el acuerdo de entrada y la transmisión de información entre órganos se rigen por otras normas y no son el contenido de este apartado."
  citation: "art. 142.4 LGT"
  difficulty: 1
  tags:
  - "funcionarios"
  - "auxilio"
# anchor: boe-a-2007-15984-art-173
- id: m03-l08-q0025
  prompt:
    es: "De acuerdo con el artículo 173.5 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la facultad que corresponde al personal inspector en las actuaciones de inspección:"
  options:
  - id: a
    text:
      es: "Embargar los bienes que el obligado tenga en el local para asegurar el cobro de la deuda."
  - id: b
    correct: true
    text:
      es: "Recabar información de los trabajadores o empleados sobre cuestiones relativas a las actividades en que participen."
  - id: c
    text:
      es: "Imponer sanciones por la negativa a exhibir los objetos determinantes de la exacción de un tributo."
  - id: d
    text:
      es: "Solicitar al juez la clausura de los locales cuando el obligado no atienda el primer requerimiento de la inspección."
  explanation:
    es: "El artículo 173.5.a faculta al personal inspector para recabar información de los trabajadores sobre las actividades en que participen. Embargar es una actuación de recaudación, la sanción se impone en un procedimiento sancionador separado y la clausura de locales no figura entre estas facultades."
  citation: "art. 173.5 RGAT"
  difficulty: 2
  tags:
  - "facultades"
  - "trabajadores"
# anchor: boe-a-2007-15984-art-173
- id: m03-l08-q0026
  prompt:
    es: "Conforme al artículo 173.5 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿cuál de las siguientes es una facultad del personal inspector?"
  options:
  - id: a
    correct: true
    text:
      es: "Verificar y analizar los sistemas y equipos informáticos mediante los que se lleve a cabo, total o parcialmente, la gestión de la actividad económica."
  - id: b
    text:
      es: "Modificar los sistemas de control interno de la empresa cuando considere que no garantizan la fiabilidad de la contabilidad del obligado tributario inspeccionado."
  - id: c
    text:
      es: "Conservar de forma definitiva los equipos informáticos del obligado en los que se encuentre la contabilidad."
  - id: d
    text:
      es: "Declarar la existencia de infracción tributaria cuando los equipos informáticos no sean accesibles."
  explanation:
    es: "La letra f) del artículo 173.5 permite verificar y analizar los sistemas y equipos informáticos con que se gestiona la actividad económica. La letra e) solo permite verificar los sistemas de control interno, no modificarlos. Conservar los equipos o declarar infracciones no está entre estas facultades."
  citation: "art. 173.5 RGAT"
  difficulty: 2
  tags:
  - "facultades"
  - "equipos informáticos"
# anchor: boe-a-2007-15984-art-173
- id: m03-l08-q0027
  prompt:
    es: "Según el artículo 173.5 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, el personal inspector está facultado para verificar los sistemas de control interno de la empresa:"
  options:
  - id: a
    text:
      es: "Siempre que el obligado tributario haya presentado su declaración fuera de plazo."
  - id: b
    text:
      es: "Solo cuando el obligado tributario lo autorice por escrito ante el actuario."
  - id: c
    correct: true
    text:
      es: "Cuando pueda facilitar la comprobación de la situación tributaria del obligado."
  - id: d
    text:
      es: "Cuando la Cifra Anual de Negocios sea igual o superior al importe requerido para auditar cuentas."
  explanation:
    es: "La letra e) del artículo 173.5 condiciona la verificación de los sistemas de control interno a que pueda facilitar la comprobación de la situación tributaria del obligado. No exige una declaración extemporánea, ni autorización escrita del obligado ni una cifra de negocios determinada, que es una circunstancia del plazo de 27 meses."
  citation: "art. 173.5 RGAT"
  difficulty: 2
  tags:
  - "facultades"
  - "control interno"
# anchor: boe-a-2007-15984-art-173
- id: m03-l08-q0028
  prompt:
    es: "¿Qué puede exigir el personal inspector, según el artículo 173.5 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, en relación con los objetos determinantes de la exacción de un tributo?"
  options:
  - id: a
    text:
      es: "La entrega definitiva de esos objetos a la Administración tributaria."
  - id: b
    text:
      es: "La valoración de esos objetos por un perito designado por el obligado."
  - id: c
    text:
      es: "La declaración jurada del obligado sobre la propiedad de esos objetos."
  - id: d
    correct: true
    text:
      es: "La exhibición de esos objetos."
  explanation:
    es: "La letra d) del artículo 173.5 faculta para exigir la exhibición de los objetos determinantes de la exacción de un tributo. Pedir su entrega definitiva, la tasación por un perito del obligado o una declaración jurada excede de lo que dice la letra."
  citation: "art. 173.5 RGAT"
  difficulty: 1
  tags:
  - "facultades"
  - "exhibición"
# anchor: boe-a-2007-15984-art-171
- id: m03-l08-q0113
  prompt:
    es: "De acuerdo con el artículo 171.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, para realizar las actuaciones inspectoras se podrán examinar, entre otros documentos, las declaraciones, autoliquidaciones, comunicaciones de datos o solicitudes presentadas por los obligados tributarios relativas a:"
  options:
  - id: a
    text:
      es: "Los tributos cuya aplicación corresponda a la Administración tributaria del Estado, solamente."
  - id: b
    text:
      es: "Los tributos objeto del procedimiento inspector, salvo los presentados fuera de plazo."
  - id: c
    correct: true
    text:
      es: "Cualquier tributo."
  - id: d
    text:
      es: "Los períodos no prescritos de los tributos objeto del procedimiento, en todo caso."
  explanation:
    es: "La letra a) del artículo 171.1 permite examinar los documentos presentados relativos a cualquier tributo, sin limitarlos a los del Estado, a los objeto del procedimiento o a los períodos no prescritos."
  citation: "art. 171.1 RGAT"
  difficulty: 2
  tags:
  - "documentación"
  - "declaraciones"
