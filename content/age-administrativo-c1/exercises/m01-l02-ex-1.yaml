type: quiz
variants:
# anchor: boe-a-1978-31229-art-1
- id: m01-l02-q001
  prompt:
    es: "De acuerdo con el artículo 1.3 de la Constitución Española de 1978, en relación con la forma política del Estado español:"
  options:
  - id: a
    text:
      es: "La forma política del Estado español es la Monarquía constitucional."
  - id: b
    text:
      es: "La forma política del Estado español es la Monarquía democrática."
  - id: c
    correct: true
    text:
      es: "La forma política del Estado español es la Monarquía parlamentaria."
  - id: d
    text:
      es: "La forma política del Estado español es la Monarquía parlamentaria y federal."
  explanation:
    es: "El artículo 1.3 dice: «La forma política del Estado español es la Monarquía parlamentaria». La Constitución no califica la Monarquía de «constitucional» ni de «democrática». Tampoco la llama «federal»: ese adjetivo no aparece en el texto."
  citation: "art. 1.3 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-56
- id: m01-l02-q002
  prompt:
    es: "Según el artículo 56.1 de la Constitución Española de 1978, el Rey es el Jefe del Estado y, además:"
  options:
  - id: a
    text:
      es: "Símbolo de su unidad e independencia."
  - id: b
    correct: true
    text:
      es: "Símbolo de su unidad y permanencia."
  - id: c
    text:
      es: "Símbolo de su soberanía y permanencia."
  - id: d
    text:
      es: "Símbolo de la unidad y la soberanía nacional."
  explanation:
    es: "El artículo 56.1 dice que el Rey es el Jefe del Estado, «símbolo de su unidad y permanencia». Las otras tres opciones cambian una de las dos palabras: «independencia» o «soberanía» no aparecen en esa frase. La soberanía nacional reside en el pueblo español (art. 1.2), no en el Rey."
  citation: "art. 56.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-56
- id: m01-l02-q003
  prompt:
    es: "De acuerdo con el artículo 56.1 de la Constitución Española de 1978, en relación con las instituciones del Estado, el Rey:"
  options:
  - id: a
    text:
      es: "Dirige y coordina el funcionamiento regular de las instituciones."
  - id: b
    text:
      es: "Arbitra y modera el funcionamiento regular de las Cortes Generales."
  - id: c
    text:
      es: "Garantiza y controla el funcionamiento regular de los poderes públicos."
  - id: d
    correct: true
    text:
      es: "Arbitra y modera el funcionamiento regular de las instituciones."
  explanation:
    es: "El artículo 56.1 dice que el Rey «arbitra y modera el funcionamiento regular de las instituciones». «Dirige y coordina» cambia los verbos: dirigir no es función del Rey en ese artículo. Limitar la función a las Cortes Generales también es incorrecto: el texto habla de las instituciones en general. «Garantiza y controla» cambia los verbos y el objeto."
  citation: "art. 56.1 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "competencia"
# anchor: boe-a-1978-31229-art-56
- id: m01-l02-q004
  prompt:
    es: "¿Con qué naciones asume el Rey especialmente la más alta representación del Estado español en las relaciones internacionales, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Con los Estados miembros de la Unión Europea."
  - id: b
    correct: true
    text:
      es: "Con las naciones de su comunidad histórica."
  - id: c
    text:
      es: "Con los Estados vecinos de la cuenca mediterránea."
  - id: d
    text:
      es: "Con los Estados con los que España haya celebrado tratados."
  explanation:
    es: "El artículo 56.1 dice que el Rey asume esa representación «especialmente con las naciones de su comunidad histórica». El texto no menciona la Unión Europea, los Estados mediterráneos ni los Estados con los que se han celebrado tratados."
  citation: "art. 56.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-56
- id: m01-l02-q005
  prompt:
    es: "¿Qué título corresponde al Rey en la Constitución Española de 1978, y puede utilizar otros títulos además de ese?"
  options:
  - id: a
    text:
      es: "El de Rey de España, sin que pueda utilizar ningún otro título."
  - id: b
    text:
      es: "El de Rey de los españoles, y podrá utilizar los demás que correspondan a la Corona."
  - id: c
    text:
      es: "El de Rey de España, y podrá utilizar los demás que le otorguen las Cortes Generales."
  - id: d
    correct: true
    text:
      es: "El de Rey de España, y podrá utilizar los demás que correspondan a la Corona."
  explanation:
    es: "El artículo 56.2 dice: «Su título es el de Rey de España y podrá utilizar los demás que correspondan a la Corona». El texto no le niega los demás títulos. «Rey de los españoles» no es el título que fija la Constitución. Los demás títulos no los otorgan las Cortes Generales: son los que correspondan a la Corona."
  citation: "art. 56.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-56
- id: m01-l02-q006
  prompt:
    es: "Señale la respuesta correcta sobre la persona del Rey, de acuerdo con el título II de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Es inviolable, salvo por los delitos cometidos fuera del ejercicio de sus funciones."
  - id: b
    text:
      es: "Goza de inmunidad y solo puede ser juzgada por el Tribunal Supremo."
  - id: c
    text:
      es: "Es inviolable y responde de sus actos ante las Cortes Generales."
  - id: d
    correct: true
    text:
      es: "Es inviolable y no está sujeta a responsabilidad."
  explanation:
    es: "El artículo 56.3 dice: «La persona del Rey es inviolable y no está sujeta a responsabilidad». La inviolabilidad no tiene en el texto ninguna excepción por delitos. La Constitución no habla de inmunidad ni de un fuero ante el Tribunal Supremo para el Rey. Tampoco responde ante las Cortes: de sus actos responden quienes los refrendan (art. 64.2)."
  citation: "art. 56.3 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-56
- id: m01-l02-q007
  prompt:
    es: "Según el artículo 56.3 de la Constitución Española de 1978, ¿qué consecuencia tiene que un acto del Rey no esté refrendado, salvo lo dispuesto en el artículo 65.2?"
  options:
  - id: a
    correct: true
    text:
      es: "El acto carece de validez sin dicho refrendo."
  - id: b
    text:
      es: "El acto es válido, pero el Rey asume su responsabilidad."
  - id: c
    text:
      es: "El acto es anulable a instancia del Gobierno."
  - id: d
    text:
      es: "El acto es válido si lo convalidan las Cortes Generales."
  explanation:
    es: "El artículo 56.3 dice que los actos del Rey estarán siempre refrendados, «careciendo de validez sin dicho refrendo, salvo lo dispuesto en el artículo 65, 2». El Rey no asume responsabilidad: no está sujeto a ella. El texto no prevé anulación a instancia del Gobierno ni convalidación por las Cortes."
  citation: "art. 56.3 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-64
- id: m01-l02-q009
  prompt:
    es: "¿Quién refrenda el nombramiento del Presidente del Gobierno por el Rey, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El Presidente del Gobierno en funciones."
  - id: b
    text:
      es: "El Ministro competente por razón de la materia."
  - id: c
    correct: true
    text:
      es: "El Presidente del Congreso de los Diputados."
  - id: d
    text:
      es: "El Presidente del Tribunal Constitucional."
  explanation:
    es: "El artículo 64.1 dice que «la propuesta y el nombramiento del Presidente del Gobierno, y la disolución prevista en el artículo 99, serán refrendados por el Presidente del Congreso». El Presidente del Gobierno y los Ministros refrendan los demás actos del Rey, no este. El Presidente del Tribunal Constitucional no refrenda actos del Rey."
  citation: "art. 64.1 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-64
- id: m01-l02-q011
  prompt:
    es: "¿Cuál de los siguientes actos del Rey refrenda el Presidente del Congreso, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "La propuesta de candidato a la Presidencia del Gobierno."
  - id: b
    text:
      es: "El nombramiento de los Ministros, a propuesta del Presidente del Gobierno."
  - id: c
    text:
      es: "La disolución anticipada de las Cortes Generales a propuesta del Presidente del Gobierno."
  - id: d
    text:
      es: "La convocatoria de un referéndum consultivo autorizado por el Congreso."
  explanation:
    es: "El artículo 64.1 reserva al Presidente del Congreso «la propuesta y el nombramiento del Presidente del Gobierno, y la disolución prevista en el artículo 99». El nombramiento de los Ministros, la disolución anticipada del artículo 115 y la convocatoria del referéndum siguen la regla general: los refrenda el Presidente del Gobierno y, en su caso, los Ministros competentes."
  citation: "art. 64.1 CE"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-64
- id: m01-l02-q012
  prompt:
    es: "Puesto que la persona del Rey no está sujeta a responsabilidad, de los actos del Rey responden:"
  options:
  - id: a
    text:
      es: "El Rey y quienes los refrenden, solidariamente."
  - id: b
    text:
      es: "El Gobierno en su conjunto, de forma solidaria."
  - id: c
    correct: true
    text:
      es: "Las personas que los refrenden."
  - id: d
    text:
      es: "El Presidente del Gobierno, en todo caso."
  explanation:
    es: "El artículo 64.2 dice: «De los actos del Rey serán responsables las personas que los refrenden». El Rey no responde, ni solo ni con otros (art. 56.3). El texto no habla de responsabilidad solidaria del Gobierno. El Presidente del Gobierno no responde «en todo caso»: hay actos que refrenda un Ministro o el Presidente del Congreso."
  citation: "art. 64.2 CE"
  difficulty: 1
  tags:
  - "efecto"
  - "órgano"
# anchor: boe-a-1978-31229-art-65
- id: m01-l02-q013
  prompt:
    es: "El artículo 56.3 de la Constitución Española de 1978 exime del refrendo lo dispuesto en el artículo 65.2. ¿Qué actos del Rey regula este último?"
  options:
  - id: a
    text:
      es: "La distribución de la cantidad global que recibe para su Familia y Casa."
  - id: b
    correct: true
    text:
      es: "El nombramiento y relevo de los miembros civiles y militares de su Casa."
  - id: c
    text:
      es: "La concesión de honores y distinciones con arreglo a las leyes."
  - id: d
    text:
      es: "El Alto Patronazgo de las Reales Academias."
  explanation:
    es: "El artículo 65.2 dice: «El Rey nombra y releva libremente a los miembros civiles y militares de su Casa». La distribución de la cantidad global está en el artículo 65.1, no en el 65.2. Los honores y distinciones (art. 62.f) y el Alto Patronazgo (art. 62.j) son funciones del artículo 62."
  citation: "art. 65.2 CE"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-65
- id: m01-l02-q014
  prompt:
    es: "¿Quién nombra y releva a los miembros civiles y militares de la Casa del Rey, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "El Rey, a propuesta del Presidente del Gobierno."
  - id: b
    correct: true
    text:
      es: "El Rey, que los nombra y releva libremente."
  - id: c
    text:
      es: "El Gobierno, a propuesta del Jefe de la Casa del Rey."
  - id: d
    text:
      es: "El Rey, a propuesta del Consejo de Ministros."
  explanation:
    es: "El artículo 65.2 dice: «El Rey nombra y releva libremente a los miembros civiles y militares de su Casa». No hay propuesta del Presidente del Gobierno ni del Consejo de Ministros. El Gobierno no nombra a esos miembros."
  citation: "art. 65.2 CE"
  difficulty: 1
  tags:
  - "órgano"
