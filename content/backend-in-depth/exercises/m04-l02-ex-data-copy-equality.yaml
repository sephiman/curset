type: quiz
variants:
- id: m04-l02-v-kotlin-data-copy-equality-001
  prompt:
    en: |-
      What does this program print? The `note` property of `Order` is declared in the class body, not in the primary constructor.

      ```kotlin
      data class Order(val id: Int, val item: String, val qty: Int) {
          var note: String = ""
      }

      fun main() {
          val first = Order(1, "pen", 2)
          first.note = "gift"
          val second = first.copy(qty = 4)
          println(first == second)
          println(second)
          println("[" + second.note + "]")
      }
      ```
  options:
  - id: a
    text:
      en: '`false`, `Order(id=1, item=pen, qty=4)`, `[]`'
    correct: true
  - id: b
    text:
      en: '`false`, `Order(id=1, item=pen, qty=4, note=gift)`, `[gift]`'
  - id: c
    text:
      en: '`true`, `Order(id=1, item=pen, qty=2)`, `[]`'
  - id: d
    text:
      en: '`true`, `Order(id=1, item=pen, qty=2)`, `[gift]`'
  explanation:
    en: '`first` is `Order(1, "pen", 2)` with `note` set to `gift` afterwards. `copy(qty = 4)` builds a new `Order` from the
      primary-constructor properties with that change. The generated `equals()` and `toString()` use only `id`, `item` and
      `qty`, so `==` is true exactly when the copy changed none of them, `second` prints those three, and `note`, declared
      in the body, is not copied: `second.note` is still empty. The output is `false`, `Order(id=1, item=pen, qty=4)`, `[]`.
      `false`, `Order(id=1, item=pen, qty=4, note=gift)`, `[gift]` comes from this mistake: counting the body property as
      a constructor property. The generated `equals()`, `toString()` and `copy()` use only the properties declared in the
      primary constructor, and `note` is declared in the body. `true`, `Order(id=1, item=pen, qty=2)`, `[]` comes from this
      mistake: ignoring the arguments of `copy`. `copy(qty = 4)` replaces the named properties in the new instance. `true`,
      `Order(id=1, item=pen, qty=2)`, `[gift]` comes from this mistake: treating `copy` as another name for the same instance.
      `copy()` creates a new instance, and `note` is not copied into it.'
  family: kotlin-data-copy-equality
  code_reading: true
  citation: kotlin-docs-data-classes#data-classes.md
  difficulty: 3
  tags: &id001
  - kotlin
