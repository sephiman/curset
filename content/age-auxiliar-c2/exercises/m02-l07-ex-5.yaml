# anchor: fuente-ms-win-indexacion-html
- id: m02-l07-q115
  prompt:
    es: "En Windows 11, con el modo Clásico de «Encontrar mis archivos», ¿qué se selecciona para agregar otra carpeta a las ubicaciones indexadas?"
  options:
  - id: a
    correct: true
    text:
      es: "Personalizar ubicaciones de búsqueda y, después, Modificar"
  - id: b
    text:
      es: "Opciones de indexación, Avanzadas y Tipos de archivo"
  - id: c
    text:
      es: "Mostrar más opciones y, después, Conceder acceso a"
  - id: d
    text:
      es: "Anclar a acceso rápido en el menú contextual de la carpeta"
  explanation:
    es: "La página indica que, para agregar otra ubicación, se selecciona «Personalizar ubicaciones de búsqueda» y se elige «Modificar» para ver las ubicaciones indexadas y seleccionar las carpetas. «Avanzadas › Tipos de archivo» elige cómo se indexa cada tipo de archivo, no qué carpetas. «Conceder acceso a» comparte en la red. «Anclar a acceso rápido» fija la carpeta en Acceso rápido, pero no la indexa."
  citation: "fuente: `ms-win-indexacion.html`; «Elige dónde buscará los archivos tu PC»"
