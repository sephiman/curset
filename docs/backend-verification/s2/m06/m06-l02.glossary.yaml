- id: g-nonrepeatable-read
  term: {en: nonrepeatable read}
  definition: {en: "A transaction re-reads data it has previously read and finds that data has been modified by another transaction (that committed since the initial read)."}
  origin: m06-l02
  citation: "pg-transaction-iso#TRANSACTION-ISO"
- id: g-serialization-anomaly
  term: {en: serialization anomaly}
  definition: {en: "The result of successfully committing a group of transactions is inconsistent with all possible orderings of running those transactions one at a time."}
  origin: m06-l02
  citation: "pg-transaction-iso#TRANSACTION-ISO"
- id: g-optimistic-locking
  term: {en: optimistic locking}
  definition: {en: "A system of concurrency control where each revision of an item of data is assigned a version number or timestamp."}
  origin: m06-l02
  citation: "jakarta-persistence-spec#a2056"
