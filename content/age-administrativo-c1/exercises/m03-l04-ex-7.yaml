# anchor: boe-a-2017-12902-art-193
- id: m03-l04-q201
  prompt:
    es: "De acuerdo con el artículo 193.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, las penalidades diarias por demora se calculan a razón de 0,60 euros por cada 1.000 euros:"
  options:
  - id: a
    text:
      es: "Del precio del contrato, IVA incluido."
  - id: b
    text:
      es: "Del presupuesto base de licitación, IVA incluido."
  - id: c
    correct: true
    text:
      es: "Del precio del contrato, IVA excluido."
  - id: d
    text:
      es: "Del valor estimado del contrato, incluidas las prórrogas."
  explanation:
    es: "El artículo 193.3 LCSP fija las penalidades diarias «en la proporción de 0,60 euros por cada 1.000 euros del precio del contrato, IVA excluido». La base es el precio del contrato sin IVA. La opción del precio con IVA cambia justo ese inciso. El presupuesto base de licitación y el valor estimado son otras magnitudes de la Ley, y el precepto no las usa para calcular la penalidad."
  citation: "art. 193.3 LCSP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-193
- id: m03-l04-q202
  prompt:
    es: "¿En qué proporción se fijan, con carácter general, las penalidades diarias que la Administración puede imponer al contratista que, por causas imputables a él, incurre en demora respecto al plazo total?"
  options:
  - id: a
    text:
      es: "0,60 euros por cada 100 euros del precio del contrato, IVA excluido."
  - id: b
    correct: true
    text:
      es: "0,60 euros por cada 1.000 euros del precio del contrato, IVA excluido."
  - id: c
    text:
      es: "1 euro por cada 1.000 euros del precio del contrato, IVA excluido."
  - id: d
    text:
      es: "0,60 euros por cada 10.000 euros del precio del contrato, IVA excluido."
  explanation:
    es: "El artículo 193.3 LCSP fija la proporción en «0,60 euros por cada 1.000 euros del precio del contrato, IVA excluido». Las otras tres opciones mantienen la base y cambian la cifra. La de 0,60 euros por cada 100 euros multiplica la penalidad por diez y la de 0,60 euros por cada 10.000 euros la divide por diez. La de 1 euro por cada 1.000 euros no es la proporción de la Ley. El pliego puede fijar penalidades distintas, pero solo cuando las características del contrato lo justifican en el expediente."
  citation: "art. 193.3 LCSP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-193
- id: m03-l04-q204
  prompt:
    es: "Según el artículo 193.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el órgano de contratación puede incluir en el pliego de cláusulas administrativas particulares penalidades distintas de las diarias generales por demora:"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando las especiales características del contrato lo hagan necesario y así se justifique en el expediente."
  - id: b
    text:
      es: "Cuando el contratista las acepte de forma expresa y por escrito en el documento de formalización del contrato."
  - id: c
    text:
      es: "Cuando el contrato sea de obras y su valor estimado supere los tres millones de euros."
  - id: d
    text:
      es: "Cuando lo autorice el Consejo de Ministros, a propuesta del titular del Ministerio de Hacienda."
  explanation:
    es: "El segundo párrafo del artículo 193.3 LCSP permite incluir en el pliego penalidades distintas «cuando, atendiendo a las especiales características del contrato, se considere necesario para su correcta ejecución y así se justifique en el expediente». La decisión es del órgano de contratación. No depende de que el contratista las acepte al formalizar, ni de la clase o el valor del contrato, ni de una autorización del Consejo de Ministros."
  citation: "art. 193.3 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-196
- id: m03-l04-q206
  prompt:
    es: "La obligación de indemnizar los daños y perjuicios que se causen a terceros como consecuencia de las operaciones que requiera la ejecución de un contrato administrativo corresponde, como regla general:"
  options:
  - id: a
    correct: true
    text:
      es: "Al contratista, que debe indemnizar todos esos daños y perjuicios."
  - id: b
    text:
      es: "Al órgano de contratación, que puede repetir después contra el contratista."
  - id: c
    text:
      es: "A la Administración y al contratista, por partes iguales entre ambos."
  - id: d
    text:
      es: "A la Administración, salvo que el contratista haya actuado con dolo."
  explanation:
    es: "El artículo 196.1 LCSP dice: «Será obligación del contratista indemnizar todos los daños y perjuicios que se causen a terceros como consecuencia de las operaciones que requiera la ejecución del contrato». La Administración solo responde en los casos del apartado 2: la orden suya inmediata y directa y los vicios del proyecto. La Ley no reparte el daño por mitades. Tampoco pone la regla general en la Administración, con o sin dolo del contratista, ni en el órgano de contratación con derecho a repetir."
  citation: "art. 196.1 LCSP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2017-12902-art-196
- id: m03-l04-q207
  prompt:
    es: "De acuerdo con el artículo 196.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, cuando los daños a terceros sean consecuencia inmediata y directa de una orden de la Administración:"
  options:
  - id: a
    correct: true
    text:
      es: "Será responsable la Administración, dentro de los límites señalados en las leyes."
  - id: b
    text:
      es: "Será responsable el contratista, que podrá repetir después contra la Administración."
  - id: c
    text:
      es: "Responderán el contratista y la Administración de forma solidaria frente al tercero."
  - id: d
    text:
      es: "Será responsable el contratista, salvo que hubiera advertido por escrito del riesgo."
  explanation:
    es: "El artículo 196.2 LCSP dice que, en ese caso, «será esta responsable dentro de los límites señalados en las leyes»: responde la Administración. La regla del apartado 1, que pone la indemnización a cargo del contratista, cede cuando el daño viene de una orden inmediata y directa de la Administración. El precepto no prevé una responsabilidad solidaria, ni deja el daño al contratista con derecho a repetir, ni hace depender nada de que el contratista advirtiera del riesgo."
  citation: "art. 196.2 LCSP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2017-12902-art-196
- id: m03-l04-q208
  prompt:
    es: "¿Cuál de las siguientes afirmaciones es correcta sobre los daños causados a terceros como consecuencia de los vicios del proyecto en el contrato de obras?"
  options:
  - id: a
    correct: true
    text:
      es: "Responde la Administración, sin perjuicio de que pueda repetir contra el redactor del proyecto."
  - id: b
    text:
      es: "Responde el contratista, sin perjuicio de que pueda repetir contra el redactor del proyecto."
  - id: c
    text:
      es: "Responde solo el redactor del proyecto, y la Administración queda exonerada."
  - id: d
    text:
      es: "Responde el contratista, salvo que una oficina de supervisión haya informado el proyecto."
  explanation:
    es: "El artículo 196.2 LCSP hace responsable a la Administración de los daños causados a terceros por los vicios del proyecto en el contrato de obras, «sin perjuicio de la posibilidad de repetir contra el redactor del proyecto». La opción que pone la responsabilidad en el contratista cambia el sujeto. La que la pone solo en el redactor confunde la repetición con la responsabilidad frente al tercero. El informe de supervisión no traslada la responsabilidad al contratista."
  citation: "art. 196.2 LCSP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2017-12902-art-198
- id: m03-l04-q209
  prompt:
    es: "Según el artículo 198.4 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, si la Administración se demora en el pago, debe al contratista los intereses de demora y la indemnización por costes de cobro:"
  options:
  - id: a
    text:
      es: "A partir del día en que el contratista reclame el pago por escrito a la Administración."
  - id: b
    text:
      es: "Solo cuando la demora en el pago supere seis meses desde la aprobación de las certificaciones o documentos de conformidad."
  - id: c
    text:
      es: "A partir del cumplimiento del plazo de treinta días desde la formalización del contrato."
  - id: d
    correct: true
    text:
      es: "A partir del cumplimiento del plazo de treinta días desde la aprobación de las certificaciones o de la conformidad."
  explanation:
    es: "El artículo 198.4 LCSP obliga a pagar dentro de los treinta días siguientes a la aprobación de las certificaciones de obra o de los documentos de conformidad. Si la Administración se demora, debe abonar «a partir del cumplimiento de dicho plazo de treinta días los intereses de demora y la indemnización por los costes de cobro». No hace falta una reclamación escrita del contratista. Los seis meses son la demora que permite al contratista resolver el contrato (art. 211.1 LCSP), no el inicio de los intereses. La formalización del contrato no es el día de partida."
  citation: "art. 198.4 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2017-12902-art-198
- id: m03-l04-q210
  prompt:
    es: "¿Dentro de qué plazo debe la Administración General del Estado abonar el precio de un contrato, a contar desde la fecha de aprobación de las certificaciones de obra o de los documentos que acrediten la conformidad?"
  options:
  - id: a
    correct: true
    text:
      es: "Dentro de los treinta días siguientes a esa aprobación."
  - id: b
    text:
      es: "Dentro de los quince días siguientes a esa aprobación."
  - id: c
    text:
      es: "Dentro de los cuarenta y cinco días siguientes a esa aprobación."
  - id: d
    text:
      es: "Dentro de los diez días siguientes a esa aprobación."
  explanation:
    es: "El artículo 198.4 LCSP obliga a la Administración a «abonar el precio dentro de los treinta días siguientes a la fecha de aprobación de las certificaciones de obra o de los documentos que acrediten la conformidad». Quince, cuarenta y cinco y diez días no son el plazo de la Ley. Las comunidades autónomas pueden reducir ese plazo (art. 198.8 LCSP), y por eso la pregunta se refiere a la Administración General del Estado."
  citation: "art. 198.4 LCSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-198
- id: m03-l04-q211
  prompt:
    es: "Un órgano de la Administración General del Estado aprueba el lunes 2 de febrero de 2026 la certificación de obra de un contrato. ¿Cuál es el último día para abonar el precio sin que se devenguen intereses de demora?"
  options:
  - id: a
    text:
      es: "El lunes 2 de marzo de 2026."
  - id: b
    correct: true
    text:
      es: "El miércoles 4 de marzo de 2026."
  - id: c
    text:
      es: "El martes 3 de marzo de 2026."
  - id: d
    text:
      es: "El lunes 16 de marzo de 2026."
  explanation:
    es: "El artículo 198.4 LCSP da treinta días desde la aprobación, y la disposición adicional duodécima LCSP los cuenta como naturales porque el precepto no dice hábiles. El plazo empieza el día siguiente, martes 3 de febrero de 2026. Febrero de 2026 tiene 28 días: el 28 de febrero es el día 26 del plazo y el miércoles 4 de marzo es el día 30, que es hábil. El lunes 2 de marzo cuenta un mes de fecha a fecha, y el plazo es de días. El martes 3 de marzo cuenta como primer día el de la aprobación. El lunes 16 de marzo cuenta treinta días hábiles, sin sábados ni domingos."
  citation: "art. 198.4 LCSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2017-12902-art-198
- id: m03-l04-q212
  prompt:
    es: "Según el artículo 198.4 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, para que empiece a contar el plazo de devengo de intereses, el contratista debe haber presentado la factura en el registro:"
  options:
  - id: a
    text:
      es: "En el plazo de quince días desde la fecha de entrega efectiva de las mercancías o la prestación del servicio."
  - id: b
    text:
      es: "En el plazo de treinta días desde la aprobación de las certificaciones o de los documentos de conformidad."
  - id: c
    text:
      es: "En el plazo de tres meses desde la fecha de entrega efectiva de las mercancías o la prestación del servicio."
  - id: d
    correct: true
    text:
      es: "En el plazo de treinta días desde la fecha de entrega efectiva de las mercancías o la prestación del servicio."
  explanation:
    es: "El artículo 198.4 LCSP exige presentar la factura «en el plazo de treinta días desde la fecha de entrega efectiva de las mercancías o la prestación del servicio». Las opciones de quince días y de tres meses cambian la cifra. La que cuenta desde la aprobación de las certificaciones confunde el plazo del contratista para facturar con el de la Administración para pagar."
  citation: "art. 198.4 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2017-12902-art-198
- id: m03-l04-q213
  prompt:
    es: "Un contratista presta el servicio contratado el viernes 6 de febrero de 2026. Según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿hasta qué día puede presentar la factura en plazo a efectos del devengo de intereses?"
  options:
  - id: a
    text:
      es: "Hasta el domingo 8 de marzo de 2026."
  - id: b
    correct: true
    text:
      es: "Hasta el lunes 9 de marzo de 2026."
  - id: c
    text:
      es: "Hasta el viernes 6 de marzo de 2026."
  - id: d
    text:
      es: "Hasta el sábado 7 de marzo de 2026."
  explanation:
    es: "El artículo 198.4 LCSP da treinta días desde la prestación del servicio, y la disposición adicional duodécima LCSP los cuenta como naturales. El plazo empieza el sábado 7 de febrero de 2026 y el día 30 es el domingo 8 de marzo. Ese día es inhábil, y la misma disposición prorroga el plazo al primer día hábil siguiente, el lunes 9 de marzo. El domingo 8 de marzo olvida esa prórroga. El viernes 6 de marzo cuenta un mes de fecha a fecha. El sábado 7 de marzo cuenta como primer día el de la prestación."
  citation: "art. 198.4 LCSP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2017-12902-art-198
- id: m03-l04-q214
  prompt:
    es: "Según el artículo 198.4 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué ocurre si el contratista incumple el plazo de treinta días para presentar la factura en el registro administrativo correspondiente?"
  options:
  - id: a
    text:
      es: "El devengo de intereses empieza en la fecha de entrega efectiva de las mercancías o de la prestación del servicio, como si no hubiera retraso."
  - id: b
    text:
      es: "El devengo de intereses empieza treinta días después de la entrega, cualquiera que sea la fecha de la factura."
  - id: c
    text:
      es: "El devengo de intereses empieza el mismo día en que la factura se presenta en el registro, aunque sea tarde."
  - id: d
    correct: true
    text:
      es: "El devengo de intereses no empieza hasta pasados treinta días desde la correcta presentación de la factura sin aprobación ni pago."
  explanation:
    es: "El artículo 198.4 LCSP dice que, si el contratista incumple ese plazo, «el devengo de intereses no se iniciará hasta transcurridos treinta días desde la fecha de la correcta presentación de la factura, sin que la Administración haya aprobado la conformidad, si procede, y efectuado el correspondiente abono». La cuenta parte de la factura presentada. No parte de la entrega ni de la prestación, y la presentación tardía no hace correr los intereses desde ese mismo día."
  citation: "art. 198.4 LCSP"
  difficulty: 3
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-2017-12902-art-210
- id: m03-l04-q215
  prompt:
    es: "De acuerdo con el artículo 210.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, la constatación del cumplimiento del contrato exige un acto formal y positivo de recepción o conformidad de la Administración:"
  options:
  - id: a
    text:
      es: "Dentro de los quince días siguientes a la entrega, sin que el pliego pueda fijar un plazo distinto."
  - id: b
    text:
      es: "Dentro de los tres meses siguientes a la entrega o realización del objeto del contrato."
  - id: c
    correct: true
    text:
      es: "Dentro del mes siguiente a la entrega o realización del objeto, o en el plazo que fije el pliego."
  - id: d
    text:
      es: "Dentro del año siguiente a la entrega, al terminar el plazo de garantía."
  explanation:
    es: "El artículo 210.2 LCSP exige el acto formal y positivo de recepción o conformidad «dentro del mes siguiente a la entrega o realización del objeto del contrato, o en el plazo que se determine en el pliego de cláusulas administrativas particulares». La opción de quince días cambia el plazo y además niega al pliego la posibilidad de fijar otro. Tres meses es el plazo para aprobar la certificación final de las obras (art. 243.1 LCSP), no el de la recepción. El plazo de garantía empieza con la recepción; no la sustituye."
  citation: "art. 210.2 LCSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-210
- id: m03-l04-q216
  prompt:
    es: "Según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, la constatación de que el contratista ha cumplido el contrato exige por parte de la Administración:"
  options:
  - id: a
    text:
      es: "Una declaración responsable del contratista sobre la prestación realizada."
  - id: b
    correct: true
    text:
      es: "Un acto formal y positivo de recepción o conformidad."
  - id: c
    text:
      es: "El transcurso del plazo de garantía sin reclamaciones de terceros."
  - id: d
    text:
      es: "Un informe favorable de la Intervención General de la Administración del Estado."
  explanation:
    es: "El artículo 210.2 LCSP dice que la constatación del cumplimiento «exigirá por parte de la Administración un acto formal y positivo de recepción o conformidad». Lo hace la Administración, no el contratista con una declaración responsable. El plazo de garantía se cuenta desde la recepción, así que no puede sustituirla. La Intervención puede asistir al acto cuando sea preceptivo, pero su informe no es la constatación."
  citation: "art. 210.2 LCSP"
  difficulty: 1
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2017-12902-art-235
- id: m03-l04-q217
  prompt:
    es: "Según el artículo 235 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el informe de supervisión del proyecto es preceptivo cuando el presupuesto base de licitación del contrato de obras es:"
  options:
  - id: a
    text:
      es: "Igual o superior a 500.000 euros, IVA incluido."
  - id: b
    correct: true
    text:
      es: "Igual o superior a 500.000 euros, IVA excluido."
  - id: c
    text:
      es: "Igual o superior a 350.000 euros, IVA excluido."
  - id: d
    text:
      es: "Superior a 1.000.000 de euros, IVA excluido."
  explanation:
    es: "El artículo 235 LCSP exige el informe de supervisión «cuando el presupuesto base de licitación del contrato de obras sea igual o superior a 500.000 euros, IVA excluido». La opción con IVA incluido cambia la base. Las de 350.000 euros y de más de un millón cambian la cifra. Por debajo de 500.000 euros el informe es facultativo, salvo que las obras afecten a la estabilidad, seguridad o estanqueidad."
  citation: "art. 235 LCSP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-238
- id: m03-l04-q219
  prompt:
    es: "Según el artículo 238.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el contratista de obras es responsable de todos los defectos que en la construcción puedan advertirse:"
  options:
  - id: a
    correct: true
    text:
      es: "Durante el desarrollo de las obras y hasta que se cumpla el plazo de garantía."
  - id: b
    text:
      es: "Durante el desarrollo de las obras y hasta el acto formal de recepción."
  - id: c
    text:
      es: "Durante el desarrollo de las obras y hasta la aprobación de la certificación final."
  - id: d
    text:
      es: "Durante el desarrollo de las obras y hasta un mes después de la recepción."
  explanation:
    es: "El artículo 238.3 LCSP dice: «Durante el desarrollo de las obras y hasta que se cumpla el plazo de garantía el contratista es responsable de todos los defectos que en la construcción puedan advertirse». La recepción no cierra esa responsabilidad, porque el plazo de garantía empieza precisamente con ella. La aprobación de la certificación final y el mes posterior a la recepción son momentos anteriores al fin del plazo de garantía, que no puede ser inferior a un año salvo casos especiales."
  citation: "art. 238.3 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2017-12902-art-243
- id: m03-l04-q220
  prompt:
    es: "De acuerdo con el artículo 243.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el plazo de garantía del contrato de obras se establece en el pliego de cláusulas administrativas particulares y:"
  options:
  - id: a
    text:
      es: "No puede ser inferior a seis meses, salvo casos especiales."
  - id: b
    text:
      es: "No puede ser inferior a dos años, salvo casos especiales."
  - id: c
    correct: true
    text:
      es: "No puede ser inferior a un año, salvo casos especiales."
  - id: d
    text:
      es: "No puede ser superior a un año, salvo casos especiales."
  explanation:
    es: "El artículo 243.3 LCSP dice que el plazo de garantía «no podrá ser inferior a un año salvo casos especiales». El precepto fija un mínimo, no un máximo, y la opción que habla de un plazo no superior a un año invierte el sentido. Seis meses y dos años cambian la cifra."
  citation: "art. 243.3 LCSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-244
- id: m03-l04-q221
  prompt:
    es: "Según el artículo 244.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, si la obra se arruina tras el plazo de garantía por vicios ocultos debidos a incumplimiento del contrato, ¿durante qué plazo responde?"
  options:
  - id: a
    text:
      es: "Durante quince años a contar desde la expiración del plazo de garantía."
  - id: b
    text:
      es: "Durante quince años a contar desde la aprobación de la certificación final."
  - id: c
    correct: true
    text:
      es: "Durante quince años a contar desde la recepción."
  - id: d
    text:
      es: "Durante quince años a contar desde la formalización del contrato."
  explanation:
    es: "El artículo 244.1 LCSP hace responder al contratista de los daños y perjuicios que se produzcan o se manifiesten «durante un plazo de quince años a contar desde la recepción». Las cuatro opciones dan quince años. Solo cambia el día de inicio, y la Ley lo fija en la recepción, no en el fin del plazo de garantía, en la certificación final ni en la formalización."
  citation: "art. 244.1 LCSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-244
- id: m03-l04-q222
  prompt:
    es: "¿En cuál de los siguientes casos responde el contratista de obras, según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, de los daños durante quince años desde la recepción?"
  options:
  - id: a
    correct: true
    text:
      es: "La obra se arruina, expirado el plazo de garantía, por vicios ocultos debidos a incumplimiento del contrato."
  - id: b
    text:
      es: "La obra sufre deterioros durante el plazo de garantía por el uso ordinario de lo construido."
  - id: c
    text:
      es: "La obra se arruina, expirado el plazo de garantía, por un terremoto de efectos catastróficos."
  - id: d
    text:
      es: "La obra presenta defectos visibles que la dirección facultativa advierte durante la ejecución, antes de la recepción."
  explanation:
    es: "El artículo 244.1 LCSP prevé esa responsabilidad cuando la obra «se arruina o sufre deterioros graves incompatibles con su función con posterioridad a la expiración del plazo de garantía por vicios ocultos de la construcción, debido a incumplimiento del contrato por parte del contratista». Los deterioros por el uso de lo construido no vienen de vicios ocultos. Un terremoto no es un vicio de la construcción. Los defectos que se advierten antes de la recepción caen en la responsabilidad del artículo 238.3, que dura hasta el fin del plazo de garantía."
  citation: "art. 244.1 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-244
- id: m03-l04-q223
  prompt:
    es: "De acuerdo con el artículo 244.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, transcurrido el plazo de quince años desde la recepción de la obra sin que se haya manifestado ningún daño o perjuicio:"
  options:
  - id: a
    text:
      es: "Se abre un nuevo plazo de garantía de un año a cargo del contratista."
  - id: b
    correct: true
    text:
      es: "Queda totalmente extinguida cualquier responsabilidad del contratista."
  - id: c
    text:
      es: "La responsabilidad del contratista pasa al redactor del proyecto de la obra."
  - id: d
    text:
      es: "El contratista sigue respondiendo solo de los defectos de la cimentación."
  explanation:
    es: "El artículo 244.3 LCSP dice que, pasado ese plazo sin daño manifestado, «quedará totalmente extinguida cualquier responsabilidad del contratista». No se abre otro plazo de garantía, la responsabilidad no pasa al redactor del proyecto y no queda ninguna responsabilidad residual por la cimentación: el adverbio «totalmente» lo excluye."
  citation: "art. 244.3 LCSP"
  difficulty: 2
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-2017-12902-art-211
- id: m03-l04-q224
  prompt:
    es: "Según el artículo 211.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en un contrato de la Administración General del Estado, ¿qué demora en el pago por parte de la Administración es causa de resolución?"
  options:
  - id: a
    text:
      es: "Una demora en el pago superior a cuatro meses."
  - id: b
    text:
      es: "Una demora en el pago superior a treinta días."
  - id: c
    correct: true
    text:
      es: "Una demora en el pago superior a seis meses."
  - id: d
    text:
      es: "Una demora en el pago superior a un año."
  explanation:
    es: "El artículo 211.1.e) señala como causa de resolución la demora en el pago por plazo superior al del artículo 198.6, que es de seis meses, o al inferior que se fije al amparo del apartado 8. Cuatro meses es la demora que permite al contratista suspender el cumplimiento del contrato, según el artículo 198.5, no resolverlo. Treinta días es el plazo a partir del cual la Administración debe intereses de demora, no la causa de resolución. Un año duplica el plazo del artículo 198.6."
  citation: "art. 211.1 LCSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2017-12902-art-211
- id: m03-l04-q225
  prompt:
    es: "Según el artículo 211.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cuál de las siguientes NO es una causa de resolución del contrato?"
  options:
  - id: a
    text:
      es: "El mutuo acuerdo entre la Administración y el contratista."
  - id: b
    correct: true
    text:
      es: "La modificación prevista en el pliego que no excede del veinte por ciento del precio inicial."
  - id: c
    text:
      es: "La demora en el cumplimiento de los plazos por parte del contratista."
  - id: d
    text:
      es: "El incumplimiento de la obligación principal del contrato."
  explanation:
    es: "El artículo 211.1 LCSP enumera, entre otras causas de resolución, el mutuo acuerdo entre la Administración y el contratista, la demora del contratista en el cumplimiento de los plazos y el incumplimiento de la obligación principal del contrato. La modificación prevista en el pliego hasta el veinte por ciento del precio inicial es una modificación válida del artículo 204.1 LCSP. El contrato sigue vigente con ella."
  citation: "art. 211.1 LCSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-211
- id: m03-l04-q226
  prompt:
    es: "¿Cuál de las siguientes circunstancias es una causa de resolución de un contrato administrativo celebrado por la Administración?"
  options:
  - id: a
    text:
      es: "La sustitución del responsable del contrato por el órgano de contratación."
  - id: b
    text:
      es: "La cesión del contrato autorizada conforme a lo previsto en los pliegos."
  - id: c
    correct: true
    text:
      es: "El incumplimiento de la obligación principal del contrato."
  - id: d
    text:
      es: "La subcontratación parcial de la prestación con sujeción a los pliegos."
  explanation:
    es: "El artículo 211.1.f) LCSP incluye entre las causas de resolución «el incumplimiento de la obligación principal del contrato». Cambiar al responsable del contrato no afecta al contratista. La cesión prevista en los pliegos y la subcontratación con sujeción a ellos son formas de ejecutar el contrato que la Ley permite (arts. 214 y 215 LCSP), no causas para extinguirlo."
  citation: "art. 211.1 LCSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-213
- id: m03-l04-q227
  prompt:
    es: "En un contrato administrativo, ¿qué ocurre con la garantía cuando el contrato se resuelve por incumplimiento culpable del contratista?"
  options:
  - id: a
    correct: true
    text:
      es: "Se incauta la garantía constituida por el contratista."
  - id: b
    text:
      es: "Se devuelve la garantía al contratista una vez liquidado el contrato."
  - id: c
    text:
      es: "Se devuelve la garantía, una vez deducidas las penalidades por demora."
  - id: d
    text:
      es: "Se retiene la garantía hasta que termine el plazo de garantía y luego se devuelve."
  explanation:
    es: "El artículo 213.3 LCSP dice que, cuando el contrato se resuelve por incumplimiento culpable del contratista, «le será incautada la garantía». Las opciones que la devuelven, entera, después de la liquidación o del plazo de garantía, o con las penalidades deducidas, contradicen esa regla."
  citation: "art. 213.3 LCSP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2017-12902-art-243
- id: m03-l04-q228
  prompt:
    es: "Señale la respuesta correcta sobre la ejecución y el cumplimiento del contrato de obras según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público:"
  options:
  - id: a
    text:
      es: "El contratista responde de los vicios ocultos durante veinte años desde la recepción."
  - id: b
    text:
      es: "El informe de supervisión del proyecto es siempre facultativo por debajo de 500.000 euros."
  - id: c
    correct: true
    text:
      es: "El plazo de garantía no puede ser inferior a un año, salvo casos especiales."
  - id: d
    text:
      es: "Las penalidades diarias por demora se calculan sobre el precio del contrato, IVA incluido."
  explanation:
    es: "El artículo 243.3 LCSP dice que el plazo de garantía «no podrá ser inferior a un año salvo casos especiales». La responsabilidad por vicios ocultos dura quince años desde la recepción, no veinte (art. 244.1 LCSP). Por debajo de 500.000 euros el informe de supervisión es preceptivo si las obras afectan a la estabilidad, seguridad o estanqueidad (art. 235 LCSP). Las penalidades diarias se calculan sobre el precio sin IVA (art. 193.3 LCSP)."
  citation: "art. 243.3 LCSP"
  difficulty: 2
  tags:
  - "plazo"
