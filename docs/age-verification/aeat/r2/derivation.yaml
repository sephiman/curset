  # El funcionamiento electrónico del sector público.
  - new: "## El funcionamiento electrónico del sector público"
    brief: >-
      el capítulo V del título preliminar de la LRJSP (arts. 38–46 bis) en lo que los apartados copiados debajo no
      dicen: actuación administrativa automatizada (art. 41), sistemas de firma (arts. 42–43), intercambio de datos
      (art. 44), aseguramiento e interoperabilidad (art. 45), archivo electrónico de documentos (art. 46) y ubicación
      de los sistemas (art. 46 bis), que preguntó 2022X-14; y art. 38.4, que preguntó 2023-15.
