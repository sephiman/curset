# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q125
  prompt:
    es: "Conforme al artículo 63.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué órgano se responsabiliza del asesoramiento jurídico al Ministro en el desarrollo de sus funciones?"
  options:
  - id: a
    text:
      es: "El Secretario de Estado."
  - id: b
    correct: true
    text:
      es: "El Subsecretario."
  - id: c
    text:
      es: "El Director general competente."
  - id: d
    text:
      es: "El Subdirector general de mayor nivel."
  explanation:
    es: "El artículo 63.1.g encarga al Subsecretario el asesoramiento jurídico al Ministro. No lo asumen el Secretario de Estado, el Director general competente ni un Subdirector general."
  citation: "art. 63.1.g LRJSP"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q126
  prompt:
    es: "Según el artículo 63.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Subsecretarios nombran y cesan a los Subdirectores dependientes de la Subsecretaría, al personal de libre designación y al personal:"
  options:
  - id: a
    text:
      es: "Laboral del Departamento."
  - id: b
    text:
      es: "Interino de los Organismos públicos."
  - id: c
    correct: true
    text:
      es: "Eventual del Departamento."
  - id: d
    text:
      es: "Directivo de las Delegaciones del Gobierno."
  explanation:
    es: "El artículo 63.1.l añade al personal eventual del Departamento. El personal laboral no se nombra y cesa así, y los interinos de los Organismos públicos y los directivos de las Delegaciones no dependen del Subsecretario."
  citation: "art. 63.1.l LRJSP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-63
- id: m01-l08-q127
  prompt:
    es: "De acuerdo con el artículo 63.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué órgano ministerial convoca y resuelve los concursos de personal funcionario?"
  options:
  - id: a
    text:
      es: "Los Ministros."
  - id: b
    correct: true
    text:
      es: "Los Subsecretarios."
  - id: c
    text:
      es: "Los Secretarios de Estado."
  - id: d
    text:
      es: "Los Secretarios generales técnicos."
  explanation:
    es: "El artículo 63.1.n atribuye a los Subsecretarios convocar y resolver los concursos de personal funcionario. Los Ministros, los Secretarios de Estado y los Secretarios generales técnicos no los tienen entre sus funciones."
  citation: "art. 63.1.n LRJSP"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2015-10566-art-64
- id: m01-l08-q128
  prompt:
    es: "Conforme al artículo 64.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, cuando las normas de estructura de un Ministerio prevean un Secretario general, deben determinar sus competencias sobre:"
  options:
  - id: a
    text:
      es: "Los servicios comunes del Departamento."
  - id: b
    text:
      es: "El conjunto de los Organismos públicos adscritos."
  - id: c
    text:
      es: "El territorio de una Comunidad Autónoma."
  - id: d
    correct: true
    text:
      es: "Un sector de actividad administrativa determinado."
  explanation:
    es: "El artículo 64.1 exige que las normas de estructura determinen sus competencias sobre un sector de actividad administrativa determinado. Los servicios comunes corresponden a la Subsecretaría y a la Secretaría General Técnica. Un territorio autonómico es el ámbito de los Delegados del Gobierno."
  citation: "art. 64.1 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-65
- id: m01-l08-q129
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Secretarios generales técnicos están bajo la inmediata dependencia:"
  options:
  - id: a
    correct: true
    text:
      es: "Del Subsecretario."
  - id: b
    text:
      es: "Del Ministro."
  - id: c
    text:
      es: "Del Secretario de Estado."
  - id: d
    text:
      es: "Del Secretario general."
  explanation:
    es: "El artículo 65.1 los sitúa bajo la inmediata dependencia del Subsecretario. No dependen directamente del Ministro, del Secretario de Estado ni del Secretario general."
  citation: "art. 65.1 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-65
- id: m01-l08-q130
  prompt:
    es: "Conforme a la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Secretarios generales técnicos son nombrados y separados por Real Decreto del Consejo de Ministros a propuesta:"
  options:
  - id: a
    text:
      es: "Del Presidente del Gobierno."
  - id: b
    text:
      es: "Del Subsecretario del Departamento."
  - id: c
    correct: true
    text:
      es: "Del titular del Ministerio."
  - id: d
    text:
      es: "Del titular del Ministerio o del Presidente del Gobierno."
  explanation:
    es: "El artículo 65.3 prevé solo la propuesta del titular del Ministerio. La propuesta alternativa del titular o del Presidente es la de los Secretarios generales y los Directores generales. No propone el Presidente del Gobierno por sí solo, ni el Subsecretario."
  citation: "art. 65.3 LRJSP"
  difficulty: 3
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10566-art-66
- id: m01-l08-q131
  prompt:
    es: "Según el artículo 66.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Directores generales son nombrados y separados por Real Decreto del Consejo de Ministros a propuesta:"
  options:
  - id: a
    text:
      es: "Únicamente del titular del Departamento."
  - id: b
    text:
      es: "Del Subsecretario del Departamento."
  - id: c
    correct: true
    text:
      es: "Del titular del Departamento o del Presidente del Gobierno."
  - id: d
    text:
      es: "Del titular del Departamento o del Secretario de Estado."
  explanation:
    es: "El artículo 66.2 admite la propuesta del titular del Departamento o la del Presidente del Gobierno. No basta la del titular en exclusiva, ni interviene el Subsecretario, ni el Secretario de Estado."
  citation: "art. 66.2 LRJSP"
  difficulty: 3
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10566-art-67
- id: m01-l08-q132
  prompt:
    es: "Conforme al artículo 67.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Subdirectores generales son responsables inmediatos de la ejecución de los proyectos que se les asignen, bajo la supervisión:"
  options:
  - id: a
    text:
      es: "Del Ministro, en todo caso."
  - id: b
    text:
      es: "Del Delegado del Gobierno competente."
  - id: c
    text:
      es: "Del Secretario general técnico, en todo caso."
  - id: d
    correct: true
    text:
      es: "Del Director general o del titular del órgano del que dependan."
  explanation:
    es: "El artículo 67.1 pone a los Subdirectores generales bajo la supervisión del Director general o del titular del órgano del que dependan. No supervisa en todo caso el Ministro, ni el Delegado del Gobierno, ni el Secretario general técnico."
  citation: "art. 67.1 LRJSP"
  difficulty: 3
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2015-10566-art-67
- id: m01-l08-q133
  prompt:
    es: "Según el artículo 67.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Subdirectores generales responden de forma inmediata de la ejecución de los proyectos asignados y de:"
  options:
  - id: a
    text:
      es: "La dirección de la Dirección General de la que dependan."
  - id: b
    correct: true
    text:
      es: "La gestión ordinaria de la Subdirección General."
  - id: c
    text:
      es: "La gestión de los servicios comunes del Ministerio."
  - id: d
    text:
      es: "La fijación de los objetivos del Departamento."
  explanation:
    es: "El artículo 67.1 añade la gestión ordinaria de la Subdirección General. La dirección de la Dirección General es del Director general, los servicios comunes son de la Subsecretaría y los objetivos del Departamento los fija el Ministro."
  citation: "art. 67.1 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-65
- id: m01-l08-q134
  prompt:
    es: "Señale la respuesta correcta sobre los Secretarios generales técnicos, de acuerdo con el artículo 65 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    correct: true
    text:
      es: "Dependen del Subsecretario y tienen la categoría de Director general."
  - id: b
    text:
      es: "Dependen del Ministro y tienen la categoría de Subsecretario."
  - id: c
    text:
      es: "Dependen del Subsecretario y tienen la categoría de Subdirector general."
  - id: d
    text:
      es: "Dependen del Secretario de Estado y tienen la categoría de Director general."
  explanation:
    es: "Los Secretarios generales técnicos dependen del Subsecretario y tienen a todos los efectos la categoría de Director general, según los apartados 1 y 2 del artículo 65. Cada alternativa cambia uno de los dos elementos, o los dos, por otro órgano o por otra categoría."
  citation: "art. 65 LRJSP"
  difficulty: 3
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-2015-10566-art-64
- id: m01-l08-q135
  prompt:
    es: "Señale la respuesta correcta sobre los Secretarios generales de un Ministerio, conforme al artículo 64 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    text:
      es: "Tienen categoría de Director general y deben ser funcionarios del Subgrupo A1."
  - id: b
    text:
      es: "Tienen categoría de Subsecretario y deben ser funcionarios del Subgrupo A1."
  - id: c
    text:
      es: "Tienen categoría de Director general y no se exige que sean funcionarios."
  - id: d
    correct: true
    text:
      es: "Tienen categoría de Subsecretario y no se exige que sean funcionarios."
  explanation:
    es: "Según el artículo 64.3, los Secretarios generales tienen categoría de Subsecretario y se nombran entre personas con cualificación y experiencia en la gestión pública o privada, sin exigir la condición de funcionario. Las otras alternativas combinan mal la categoría o el requisito."
  citation: "art. 64.3 LRJSP"
  difficulty: 3
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-2015-10566-art-66
- id: m01-l08-q136
  prompt:
    es: "Señale la respuesta correcta sobre el nombramiento de los Directores generales, de acuerdo con el artículo 66.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    correct: true
    text:
      es: "Se hace por Real Decreto del Consejo de Ministros y, salvo excepción motivada, entre funcionarios de carrera del Subgrupo A1."
  - id: b
    text:
      es: "Se hace por orden del Ministro y entre funcionarios de carrera del Subgrupo A1."
  - id: c
    text:
      es: "Se hace por Real Decreto del Consejo de Ministros y entre personas con experiencia en la gestión pública o privada."
  - id: d
    text:
      es: "Se hace por Real Decreto del Consejo de Ministros y entre funcionarios de carrera del Subgrupo A2."
  explanation:
    es: "El artículo 66.2 manda nombrar a los Directores generales por Real Decreto del Consejo de Ministros, entre funcionarios de carrera del Subgrupo A1, con la excepción que motiva el Real Decreto de estructura. La orden del Ministro, la experiencia en la gestión pública o privada, que es el requisito de los Secretarios generales, y el Subgrupo A2 no corresponden a ese artículo."
  citation: "art. 66.2 LRJSP"
  difficulty: 3
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2015-10566-art-65
- id: m01-l08-q137
  prompt:
    es: "De acuerdo con el artículo 65.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué órganos tienen siempre las competencias de producción normativa, asistencia jurídica y publicaciones?"
  options:
  - id: a
    text:
      es: "Los Directores generales."
  - id: b
    correct: true
    text:
      es: "Los Secretarios generales técnicos."
  - id: c
    text:
      es: "Los Subdirectores generales."
  - id: d
    text:
      es: "Los Secretarios de Estado."
  explanation:
    es: "El artículo 65.1 atribuye siempre esas tres competencias a los Secretarios generales técnicos. Los Directores generales y los Subdirectores generales gestionan áreas o subáreas concretas, y los Secretarios de Estado dirigen un sector de actividad."
  citation: "art. 65.1 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
