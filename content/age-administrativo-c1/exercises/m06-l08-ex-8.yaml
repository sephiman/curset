# anchor: fuente-ms-edge-atajos-html
- id: m06-l08-q226
  prompt:
    es: "En Microsoft Edge, en Windows 11, la combinación Ctrl+9, que actúa sobre las pestañas abiertas en la ventana:"
  options:
  - id: a
    text:
      es: "Pasa a la pestaña anterior"
  - id: b
    text:
      es: "Pasa a la pestaña siguiente"
  - id: c
    correct: true
    text:
      es: "Pasa a la última pestaña"
  - id: d
    text:
      es: "Abre una pestaña nueva y cambia a ella"
  explanation:
    es: "Ctrl+9 pasa a la pestaña final. Pasar a la pestaña siguiente es la función de Ctrl+Pestaña. Pasar a la pestaña anterior es la función de Ctrl+Mayús+Pestaña. Abrir una pestaña nueva es la función de Ctrl+T."
  citation: "fuente: `ms-edge-atajos.html`; «Métodos abreviados de teclado en Microsoft Edge»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m06-l08-q228
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas abre una nueva ventana de InPrivate en Microsoft Edge, en Windows 11?"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl+Mayús+N"
  - id: b
    text:
      es: "Ctrl+Mayús+M"
  - id: c
    text:
      es: "Ctrl+N"
  - id: d
    text:
      es: "Ctrl+Mayús+T"
  explanation:
    es: "Ctrl+Mayús+N abre una nueva ventana de InPrivate. Ctrl+N abre una nueva ventana normal, no de InPrivate. Ctrl+Mayús+M inicia sesión como usuario distinto o examina como invitado. Ctrl+Mayús+T vuelve a abrir la pestaña cerrada más recientemente."
  citation: "fuente: `ms-edge-atajos.html`; «Métodos abreviados de teclado en Microsoft Edge»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-edge-inprivate-html
- id: m06-l08-q229
  prompt:
    es: "¿Cuál de las siguientes rutas de menú abre una ventana de InPrivate en Microsoft Edge, en Windows 11, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Configuración y más › Más herramientas › Nueva ventana InPrivate"
  - id: b
    text:
      es: "Configuración y más › historial › cerrados recientemente"
  - id: c
    correct: true
    text:
      es: "Configuración y más › Nueva ventana InPrivate"
  - id: d
    text:
      es: "Configuración y más › Configuración › Privacidad, búsqueda y servicios"
  explanation:
    es: "En Microsoft Edge se selecciona Configuración y más>Nueva ventana InPrivate: es la ruta que da la página, sin un paso intermedio de Más herramientas. Configuración y más>historial>cerrados recientemente es la ruta para reabrir pestañas cerradas, y la página lo cita entre lo que la exploración de InPrivate no hace: «Te permite volver a abrir las pestañas y ventanas cerradas recientemente desde Configuración y más>historial>cerrados recientemente». Y Configuración y más>Configuración>Privacidad, búsqueda y servicios es la ruta para otros ajustes: «Para administrar los permisos de ubicación, vaya a Configuración y más>Configuración>Privacidad, búsqueda y servicios»."
  citation: "fuente: `ms-edge-inprivate.html`; «¿Cómo navego en modo InPrivate en Microsoft Edge?»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-edge-inprivate-html
- id: m06-l08-q230
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿qué opción se selecciona tras hacer clic con el botón derecho en el logotipo de Edge de la barra de tareas para abrir una ventana de InPrivate?"
  options:
  - id: a
    correct: true
    text:
      es: "Nueva ventana InPrivate"
  - id: b
    text:
      es: "Abrir vínculo en la ventana InPrivate"
  - id: c
    text:
      es: "Quitar de Microsoft Edge"
  - id: d
    text:
      es: "Obtener extensiones para Microsoft Edge"
  explanation:
    es: "Con el botón derecho en el logotipo de Edge de la barra de tareas se selecciona Nueva ventana InPrivate. Abrir vínculo en la ventana InPrivate es la opción del botón derecho sobre un vínculo, no sobre el logotipo. Obtener extensiones para Microsoft Edge es la opción que se elige tras seleccionar Extensiones. Quitar de Microsoft Edge es la opción para quitar una extensión."
  citation: "fuente: `ms-edge-inprivate.html`; «¿Cómo navego en modo InPrivate en Microsoft Edge?»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-edge-inprivate-html
- id: m06-l08-q231
  prompt:
    es: "¿Cuál de las siguientes cosas elimina Microsoft Edge, en Windows 11, al cerrar todas las ventanas de InPrivate?"
  options:
  - id: a
    text:
      es: "Los favoritos y los archivos descargados durante la exploración"
  - id: b
    text:
      es: "Solo el historial de exploración, sin las cookies ni las contraseñas guardadas en el perfil de Edge"
  - id: c
    text:
      es: "Nada, hasta que se cierra la sesión de Windows del usuario o se apaga el equipo"
  - id: d
    correct: true
    text:
      es: "Historial, cookies y datos del sitio, contraseñas y datos de formulario"
  explanation:
    es: "Al cerrar todas las ventanas de InPrivate, Edge elimina el historial de exploración, las cookies y los datos del sitio, las contraseñas, las direcciones y los datos de formulario. Elimina también las cookies, los datos del sitio, las contraseñas y los datos de formulario, no solo el historial. Los favoritos y los archivos descargados se guardan, no se eliminan. La eliminación se produce al cerrar todas las ventanas de InPrivate, no al cerrar la sesión de Windows."
  citation: "fuente: `ms-edge-inprivate.html`; «¿Cómo navego en modo InPrivate en Microsoft Edge?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-edge-inprivate-html
- id: m06-l08-q232
  prompt:
    es: "¿Cuál de las siguientes cosas conserva Microsoft Edge, en Windows 11, tras una exploración en InPrivate, para acceder a ella la próxima vez?"
  options:
  - id: a
    text:
      es: "Las contraseñas y los datos de formulario de autorrelleno"
  - id: b
    text:
      es: "El historial de exploración y las cookies del sitio"
  - id: c
    text:
      es: "Los permisos de sitio y los datos de aplicaciones hospedadas"
  - id: d
    correct: true
    text:
      es: "Los favoritos y los archivos descargados"
  explanation:
    es: "La exploración de InPrivate guarda los favoritos y los archivos descargados para que se pueda acceder a ellos la próxima vez que se use Edge. El historial de exploración y las cookies se borran al cerrar todas las ventanas de InPrivate. Las contraseñas y los datos de formularios de autorrelleno se borran al cerrar las ventanas de InPrivate. Los permisos de sitio y los datos de aplicaciones hospedadas se borran al cerrar las ventanas de InPrivate."
  citation: "fuente: `ms-edge-inprivate.html`; «¿Qué hace Microsoft Edge con tus datos mientras te encuentras en InPrivate?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-edge-inprivate-html
- id: m06-l08-q234
  prompt:
    es: "¿Cuál de las siguientes cosas sí hace la exploración de InPrivate en Microsoft Edge, en Windows 11, mientras se está en ella?"
  options:
  - id: a
    correct: true
    text:
      es: "Usar automáticamente la búsqueda InPrivate con Microsoft Bing"
  - id: b
    text:
      es: "Guardar nuevas contraseñas, direcciones o información de formularios"
  - id: c
    text:
      es: "Asociar el historial de exploración con una cuenta de Microsoft"
  - id: d
    text:
      es: "Evitar que los sitios web soliciten la ubicación precisa"
  explanation:
    es: "La exploración de InPrivate usa automáticamente la búsqueda InPrivate con Microsoft Bing, por ejemplo en la barra de búsqueda de la página de aterrizaje de InPrivate. La exploración de InPrivate no guarda nuevas contraseñas, direcciones ni información rellenada en formularios en línea. La exploración de InPrivate no asocia el historial de exploración con una cuenta de Microsoft. La exploración de InPrivate no evita que los sitios web soliciten la ubicación precisa: usa los permisos de ubicación del perfil."
  citation: "fuente: `ms-edge-inprivate.html`; «¿Qué hace Microsoft Edge con tus datos mientras te encuentras en InPrivate?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-edge-inprivate-html
- id: m06-l08-q235
  prompt:
    es: "Señale qué ocurre con las extensiones durante la exploración de InPrivate en Microsoft Edge, en Windows 11:"
  options:
  - id: a
    text:
      es: "Se desactivan todas al abrir la ventana, y no pueden guardar el historial"
  - id: b
    text:
      es: "Solo se ejecutan las instaladas desde Chrome Web Store, sin permiso previo"
  - id: c
    text:
      es: "Se ejecutan las que tienen permiso concedido, pero Edge impide que guarden el historial"
  - id: d
    correct: true
    text:
      es: "Se ejecutan las de permiso concedido, y Edge no impide que guarden el historial"
  explanation:
    es: "InPrivate permite que se ejecuten las extensiones a las que se concedió permiso, y Edge no puede impedir que guarden el historial de exploración. Las extensiones con permiso concedido se ejecutan durante la exploración de InPrivate; no se desactivan todas. Edge no podrá impedir que las extensiones guarden el historial de exploración, según la página. Las extensiones que se ejecutan son las que tienen permiso concedido, con independencia del almacén del que procedan."
  citation: "fuente: `ms-edge-inprivate.html`; «¿Qué hace Microsoft Edge con tus datos mientras te encuentras en InPrivate?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-edge-inprivate-html
- id: m06-l08-q237
  prompt:
    es: "¿Cuál de las siguientes opciones figura en la lista de cosas que la exploración de InPrivate no hace en Microsoft Edge, en Windows 11?"
  options:
  - id: a
    text:
      es: "Guardar los favoritos y los archivos descargados para la próxima vez"
  - id: b
    text:
      es: "Permitir acceder a favoritos, contraseñas y datos de formulario del perfil"
  - id: c
    correct: true
    text:
      es: "Permitir reabrir las pestañas y ventanas cerradas recientemente desde el historial"
  - id: d
    text:
      es: "Permitir que se ejecuten las extensiones a las que se concedió permiso durante la exploración"
  explanation:
    es: "En la lista de lo que la exploración de InPrivate no hace figura permitir volver a abrir las pestañas y ventanas cerradas recientemente desde Configuración y más › historial › cerrados recientemente. Permitir acceder a favoritos, contraseñas y datos de relleno de formulario del perfil es algo que InPrivate sí hace. Permitir que se ejecuten las extensiones con permiso concedido es algo que InPrivate sí hace. Guardar los favoritos y los archivos descargados es algo que InPrivate sí hace."
  citation: "fuente: `ms-edge-inprivate.html`; «¿Qué hace Microsoft Edge con tus datos mientras te encuentras en InPrivate?»"
