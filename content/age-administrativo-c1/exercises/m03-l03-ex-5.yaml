# anchor: boe-a-2015-10565-art-21
- id: m03-l03-q130
  prompt:
    es: "Una solicitud entra el martes 31 de marzo de 2026 en el registro electrónico del órgano competente para tramitarla. Si su norma reguladora no fija plazo máximo, el último día para notificar la resolución es:"
  options:
  - id: a
    text:
      es: "El lunes 29 de junio de 2026."
  - id: b
    correct: true
    text:
      es: "El martes 30 de junio de 2026."
  - id: c
    text:
      es: "El miércoles 1 de julio de 2026."
  - id: d
    text:
      es: "El miércoles 30 de septiembre de 2026."
  explanation:
    es: "El plazo supletorio es de tres meses, contados desde la entrada en el registro del órgano competente (art. 21.3). Los meses van de fecha a fecha, y junio no tiene día 31: el plazo expira el último día del mes (art. 30.4), el martes 30 de junio de 2026, que es hábil. El lunes 29 de junio termina un día antes. El miércoles 1 de julio pasa al mes siguiente, que la ley no prevé. El miércoles 30 de septiembre aplica seis meses."
  citation: "art. 21.3 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-22
- id: m03-l03-q133
  prompt:
    es: "De acuerdo con el artículo 22.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si se solicitan informes preceptivos a otro órgano, el plazo máximo para resolver:"
  options:
  - id: a
    text:
      es: "Se suspenderá necesariamente entre la petición y la recepción del informe, sin límite de tiempo alguno."
  - id: b
    correct: true
    text:
      es: "Podrá suspenderse entre la petición y la recepción del informe, sin que la suspensión pueda exceder de tres meses."
  - id: c
    text:
      es: "Podrá suspenderse entre la petición y la recepción del informe, sin que la suspensión exceda de seis meses."
  - id: d
    text:
      es: "Se ampliará en un tiempo igual al que medie entre la petición del informe preceptivo y su recepción."
  explanation:
    es: "El artículo 22.1.d) dice que el plazo «se podrá suspender» por el tiempo entre la petición y la recepción del informe, y que la suspensión «no podrá exceder en ningún caso de tres meses». La suspensión no es obligatoria ni ilimitada, y su tope no es de seis meses. La ley habla de suspensión, no de ampliación del plazo."
  citation: "art. 22.1.d) LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-10565-art-22
- id: m03-l03-q135
  prompt:
    es: "De acuerdo con el artículo 22.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando los interesados promuevan la recusación, el transcurso del plazo máximo para resolver:"
  options:
  - id: a
    text:
      es: "Se suspenderá desde que se plantee hasta que la resuelva el propio recusado, previo informe."
  - id: b
    correct: true
    text:
      es: "Se suspenderá desde que se plantee hasta que la resuelva el superior jerárquico del recusado."
  - id: c
    text:
      es: "Podrá suspenderse, si el instructor lo acuerda, hasta que el recusado manifieste si concurre la causa."
  - id: d
    text:
      es: "No se suspenderá, porque las cuestiones incidentales no suspenden la tramitación."
  explanation:
    es: "El artículo 22.2.c) dice que el plazo se suspende cuando se promueve la recusación, «desde que ésta se plantee hasta que sea resuelta por el superior jerárquico del recusado». No la resuelve el recusado. La suspensión no depende del instructor. La recusación es justo la cuestión incidental que sí suspende la tramitación (art. 74)."
  citation: "art. 22.2.c) LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-2015-10565-art-23
- id: m03-l03-q136
  prompt:
    es: "De acuerdo con el artículo 23 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, agotados los medios personales y materiales disponibles, la ampliación del plazo máximo de resolución y notificación:"
  options:
  - id: a
    text:
      es: "Se acordará de manera motivada, sin superar la mitad del plazo establecido, y contra ella no cabe recurso."
  - id: b
    text:
      es: "Se acordará de manera motivada, sin superar el plazo establecido, y contra ella cabe recurso de alzada."
  - id: c
    text:
      es: "Se acordará sin necesidad de motivación, sin superar el plazo establecido, y contra ella no cabe recurso."
  - id: d
    correct: true
    text:
      es: "Se acordará de manera motivada, sin superar el plazo establecido para la tramitación, y contra ella no cabe recurso."
  explanation:
    es: "El artículo 23 permite acordar «de manera motivada» la ampliación del plazo máximo, «no pudiendo ser éste superior al establecido para la tramitación del procedimiento», y contra ese acuerdo «no cabrá recurso alguno». El límite de la mitad del plazo es el de la ampliación de plazos del artículo 32.1, otra figura. No cabe alzada y la motivación es obligatoria."
  citation: "art. 23 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2015-10565-art-24
- id: m03-l03-q137
  prompt:
    es: "De acuerdo con el artículo 24.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los procedimientos iniciados a solicitud del interesado, el vencimiento del plazo máximo sin notificación de resolución expresa:"
  options:
  - id: a
    text:
      es: "Le permite entenderla desestimada por silencio, salvo que una norma con rango de ley, europea o internacional disponga lo contrario."
  - id: b
    text:
      es: "Le permite entenderla estimada por silencio, salvo que un reglamento de la Administración competente disponga expresamente lo contrario."
  - id: c
    text:
      es: "Produce la caducidad del procedimiento iniciado, salvo que una norma con rango de ley, europea o internacional disponga lo contrario."
  - id: d
    correct: true
    text:
      es: "Le permite entenderla estimada por silencio administrativo, salvo que una norma con rango de ley, europea o internacional disponga lo contrario."
  explanation:
    es: "La regla del artículo 24.1 es el silencio estimatorio: el vencimiento del plazo legitima al interesado «para entenderla estimada por silencio administrativo», salvo que una norma con rango de ley o una norma de Derecho de la Unión Europea o de Derecho internacional aplicable en España establezca lo contrario. La regla general no es la desestimación. Un reglamento no basta para cambiar el sentido del silencio. La caducidad es el efecto en ciertos procedimientos de oficio (art. 25.1.b)."
  citation: "art. 24.1 LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-24
- id: m03-l03-q138
  prompt:
    es: "Según el artículo 24.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué sentido tiene el silencio en los procedimientos relativos al ejercicio del derecho de petición?"
  options:
  - id: a
    correct: true
    text:
      es: "Desestimatorio, como en los procedimientos de responsabilidad patrimonial."
  - id: b
    text:
      es: "Estimatorio, como en la generalidad de los procedimientos iniciados a solicitud."
  - id: c
    text:
      es: "Estimatorio, salvo que la petición se dirija a la Administración General del Estado."
  - id: d
    text:
      es: "Ninguno: el vencimiento del plazo produce la caducidad del procedimiento."
  explanation:
    es: "El artículo 24.1 dice que «el silencio tendrá efecto desestimatorio en los procedimientos relativos al ejercicio del derecho de petición», y también en los de responsabilidad patrimonial. El derecho de petición no sigue la regla general del silencio estimatorio. La ley no distingue según la Administración destinataria. La caducidad es el efecto de ciertos procedimientos de oficio, no de este."
  citation: "art. 24.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-10565-art-24
- id: m03-l03-q140
  prompt:
    es: "Según el artículo 24.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué efecto tiene no resolver en plazo la alzada contra la desestimación por silencio de una solicitud?"
  options:
  - id: a
    text:
      es: "La alzada se entenderá desestimada, como en todos los procedimientos de impugnación de actos."
  - id: b
    correct: true
    text:
      es: "La alzada se entenderá estimada, salvo en las materias en que el artículo 24.1 hace desestimatorio el silencio."
  - id: c
    text:
      es: "La alzada se entenderá estimada en todo caso, cualquiera que sea la materia de la solicitud."
  - id: d
    text:
      es: "La alzada se entenderá caducada, y el interesado podrá presentar una nueva solicitud."
  explanation:
    es: "El artículo 24.1 dice que, cuando la alzada se interpuso contra la desestimación por silencio de una solicitud, «se entenderá estimado el mismo» si no se dicta y notifica resolución en plazo, «siempre que no se refiera a las materias enumeradas en el párrafo anterior». No rige aquí la regla general de la impugnación, que es desestimatoria. La estimación tampoco opera en todo caso: no alcanza al derecho de petición ni a la responsabilidad patrimonial, entre otras materias. La ley no prevé caducidad."
  citation: "art. 24.1 LPAC"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-10565-art-24
- id: m03-l03-q142
  prompt:
    es: "De acuerdo con el artículo 24.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los casos de estimación por silencio administrativo, la resolución expresa posterior a la producción del acto:"
  options:
  - id: a
    text:
      es: "Se adoptará sin vinculación alguna al sentido del silencio."
  - id: b
    text:
      es: "Solo podrá dictarse previa declaración de lesividad del acto presunto."
  - id: c
    correct: true
    text:
      es: "Solo podrá dictarse de ser confirmatoria del mismo."
  - id: d
    text:
      es: "No podrá dictarse, porque el silencio ya puso fin al procedimiento."
  explanation:
    es: "El artículo 24.3.a) dice que, tras la estimación por silencio, la resolución expresa posterior «sólo podrá dictarse de ser confirmatoria del mismo». La resolución sin vinculación al sentido del silencio corresponde a la desestimación (art. 24.3.b). La lesividad no es el cauce para dictarla. La obligación de resolver subsiste (art. 21.1), así que la resolución sí puede dictarse, siempre confirmatoria."
  citation: "art. 24.3.a) LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-24
- id: m03-l03-q143
  prompt:
    es: "Según el artículo 24.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿quién expide el certificado acreditativo del silencio producido y en qué plazo?"
  options:
  - id: a
    correct: true
    text:
      es: "El órgano competente para resolver, de oficio, en quince días desde que expire el plazo máximo para resolver."
  - id: b
    text:
      es: "El órgano competente para resolver, solo a petición del interesado, en diez días desde que la reciba."
  - id: c
    text:
      es: "El superior jerárquico del órgano competente, de oficio, en quince días desde que expire el plazo máximo."
  - id: d
    text:
      es: "La oficina de asistencia en materia de registros, de oficio, en un mes desde que expire el plazo máximo."
  explanation:
    es: "El artículo 24.4 dice que el certificado «se expedirá de oficio por el órgano competente para resolver en el plazo de quince días desde que expire el plazo máximo para resolver». No hace falta petición, aunque el interesado puede pedirlo en cualquier momento. No lo expide el superior jerárquico ni la oficina de registro, y el plazo no es de diez días ni de un mes."
  citation: "art. 24.4 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-2015-10565-art-24
- id: m03-l03-q144
  prompt:
    es: "El plazo máximo para resolver un procedimiento iniciado a solicitud del interesado expira el lunes 19 de enero de 2026 sin resolución notificada. ¿Cuál es el último día para que el órgano competente expida de oficio el certificado acreditativo del silencio?"
  options:
  - id: a
    text:
      es: "El lunes 2 de febrero de 2026."
  - id: b
    text:
      es: "El martes 3 de febrero de 2026."
  - id: c
    correct: true
    text:
      es: "El lunes 9 de febrero de 2026."
  - id: d
    text:
      es: "El lunes 16 de febrero de 2026."
  explanation:
    es: "El certificado se expide de oficio en quince días desde que expire el plazo máximo para resolver (art. 24.4). Son días hábiles (art. 30.2) y se cuentan desde el siguiente al silencio (art. 30.3): el primero es el martes 20 de enero. Excluidos sábados y domingos, el decimoquinto día hábil es el lunes 9 de febrero de 2026. El lunes 2 de febrero es el décimo día hábil. El martes 3 de febrero sale de contar quince días naturales. El lunes 16 de febrero cuenta veinte días hábiles."
  citation: "art. 24.4 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-25
- id: m03-l03-q145
  prompt:
    es: "De acuerdo con el artículo 25.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en un procedimiento de oficio del que pudieran derivarse derechos, el vencimiento del plazo sin resolución expresa:"
  options:
  - id: a
    text:
      es: "Permite a los interesados que hubieren comparecido entender estimadas sus pretensiones por silencio."
  - id: b
    correct: true
    text:
      es: "Permite a los interesados que hubieren comparecido entender desestimadas sus pretensiones por silencio."
  - id: c
    text:
      es: "Produce la caducidad del procedimiento, y la resolución que la declare ordenará el archivo de las actuaciones."
  - id: d
    text:
      es: "Permite a cualquier persona, aunque no haya comparecido, entender estimadas sus pretensiones."
  explanation:
    es: "El artículo 25.1.a) dice que en estos procedimientos «los interesados que hubieren comparecido podrán entender desestimadas sus pretensiones por silencio administrativo». El silencio no es estimatorio, ni para los comparecidos ni para quien no compareció. La caducidad es el efecto en los procedimientos sancionadores o de intervención con efectos desfavorables (art. 25.1.b)."
  citation: "art. 25.1.a) LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-58
- id: m03-l03-q147
  prompt:
    es: "De acuerdo con el artículo 58 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los procedimientos se iniciarán de oficio por acuerdo del órgano competente:"
  options:
  - id: a
    text:
      es: "Por propia iniciativa o como consecuencia de orden superior, a petición razonada de otros órganos o a solicitud del interesado."
  - id: b
    text:
      es: "Por propia iniciativa o como consecuencia de orden superior, o por denuncia, pero nunca a petición de otros órganos."
  - id: c
    correct: true
    text:
      es: "Por propia iniciativa o como consecuencia de orden superior, a petición razonada de otros órganos o por denuncia."
  - id: d
    text:
      es: "Solo por propia iniciativa o por denuncia, que obliga en todo caso a iniciar el procedimiento."
  explanation:
    es: "El artículo 58 dice que la iniciación de oficio se acuerda «bien por propia iniciativa o como consecuencia de orden superior, a petición razonada de otros órganos o por denuncia». La solicitud del interesado abre la iniciación a solicitud, no la de oficio. La petición razonada de otros órganos sí está en la lista, y la orden superior también."
  citation: "art. 58 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-56
- id: m03-l03-q148
  prompt:
    es: "Según el artículo 56.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en qué plazo se dicta el acuerdo de iniciación que se pronuncia sobre medidas provisionales adoptadas antes del procedimiento?"
  options:
  - id: a
    correct: true
    text:
      es: "Dentro de los quince días siguientes a su adopción."
  - id: b
    text:
      es: "Dentro de los diez días siguientes a su adopción."
  - id: c
    text:
      es: "Dentro del mes siguiente a su adopción."
  - id: d
    text:
      es: "Dentro de los tres días siguientes a su adopción."
  explanation:
    es: "El artículo 56.2 dice que las medidas se confirman, modifican o levantan en el acuerdo de iniciación, «que deberá efectuarse dentro de los quince días siguientes a su adopción». El plazo no es de diez días, ni de tres, ni de un mes. Si no se inicia el procedimiento en ese plazo, las medidas quedan sin efecto."
  citation: "art. 56.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-56
- id: m03-l03-q149
  prompt:
    es: "Por urgencia inaplazable, el órgano competente adopta una medida provisional el lunes 1 de febrero de 2027, antes de iniciar el procedimiento. Sin festivos en el periodo, ¿cuál es el último día para dictar el acuerdo de iniciación?"
  options:
  - id: a
    text:
      es: "El lunes 15 de febrero de 2027."
  - id: b
    text:
      es: "El martes 16 de febrero de 2027."
  - id: c
    text:
      es: "El viernes 19 de febrero de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes 22 de febrero de 2027."
  explanation:
    es: "El acuerdo de iniciación debe efectuarse dentro de los quince días siguientes a la adopción de la medida (art. 56.2). Son días hábiles (art. 30.2) desde el martes 2 de febrero. Excluidos sábados y domingos, el decimoquinto día hábil es el lunes 22 de febrero de 2027. El lunes 15 de febrero es el décimo día hábil. El martes 16 de febrero sale de contar quince días naturales. El viernes 19 de febrero cuenta catorce días hábiles."
  citation: "art. 56.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-63
- id: m03-l03-q151
  prompt:
    es: "Según el artículo 63.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los procedimientos de naturaleza sancionadora, ¿a quién se encomiendan la fase instructora y la sancionadora?"
  options:
  - id: a
    text:
      es: "A un mismo órgano, que instruye y después resuelve el procedimiento."
  - id: b
    correct: true
    text:
      es: "A órganos distintos, con la debida separación entre ambas fases."
  - id: c
    text:
      es: "Al órgano que resuelve la instructora, y a su superior jerárquico la sancionadora."
  - id: d
    text:
      es: "A órganos distintos solo cuando la infracción imputada sea muy grave."
  explanation:
    es: "El artículo 63.1 exige «la debida separación entre la fase instructora y la sancionadora, que se encomendará a órganos distintos». Un mismo órgano no puede hacer las dos. La ley no atribuye la instrucción al órgano que resuelve, y la separación rige en todo procedimiento sancionador, no solo en las infracciones muy graves."
  citation: "art. 63.1 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-68
- id: m03-l03-q156
  prompt:
    es: "En un procedimiento que no es selectivo ni de concurrencia competitiva, un interesado recibe el martes 12 de enero de 2027 un requerimiento de subsanación. Por dificultades especiales, el plazo se amplía por el máximo legal. Sin festivos en el periodo, ¿cuándo vence?"
  options:
  - id: a
    text:
      es: "El martes 26 de enero de 2027."
  - id: b
    text:
      es: "El lunes 1 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "El martes 2 de febrero de 2027."
  - id: d
    text:
      es: "El martes 9 de febrero de 2027."
  explanation:
    es: "El plazo de subsanación es de diez días (art. 68.1) y puede ampliarse «hasta cinco días» (art. 68.2): quince días hábiles en total. Se cuentan desde el miércoles 13 de enero (art. 30.3). Excluidos sábados y domingos, el decimoquinto día hábil es el martes 2 de febrero de 2027. El martes 26 de enero es el décimo día hábil, sin ampliación. El lunes 1 de febrero cuenta el día de la notificación como primero. El martes 9 de febrero amplía diez días, el doble de lo permitido."
  citation: "art. 68.2 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-68
- id: m03-l03-q157
  prompt:
    es: "De acuerdo con el artículo 68.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el plazo de subsanación podrá ampliarse hasta cinco días si la aportación de documentos presenta dificultades especiales:"
  options:
  - id: a
    text:
      es: "Salvo en los procedimientos sancionadores o de responsabilidad patrimonial."
  - id: b
    correct: true
    text:
      es: "Salvo en los procedimientos selectivos o de concurrencia competitiva."
  - id: c
    text:
      es: "Solo en los procedimientos selectivos o de concurrencia competitiva."
  - id: d
    text:
      es: "Salvo en los procedimientos tramitados de manera simplificada o de urgencia."
  explanation:
    es: "La ampliación cabe «siempre que no se trate de procedimientos selectivos o de concurrencia competitiva» (art. 68.2). Esos procedimientos son la excepción, no el único caso en que se amplía. La ley no excluye los procedimientos sancionadores, los de responsabilidad patrimonial ni los de tramitación simplificada o de urgencia."
  citation: "art. 68.2 LPAC"
  difficulty: 2
  tags:
  - "excepción"
  - "plazo"
# anchor: boe-a-2015-10565-art-68
- id: m03-l03-q158
  prompt:
    es: "Señale la respuesta correcta sobre la ampliación del plazo de subsanación de la solicitud, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Puede ampliarse hasta cinco días, a petición del interesado o a iniciativa del órgano."
  - id: b
    text:
      es: "Puede ampliarse hasta cinco días, pero solo a petición del interesado."
  - id: c
    text:
      es: "Puede ampliarse hasta diez días, a petición del interesado o a iniciativa del órgano."
  - id: d
    text:
      es: "Puede ampliarse hasta la mitad del plazo, pero solo a iniciativa del órgano competente."
  explanation:
    es: "El artículo 68.2 permite ampliar el plazo «hasta cinco días, a petición del interesado o a iniciativa del órgano». No hace falta que lo pida el interesado: el órgano puede acordarlo por sí. La ampliación no llega a diez días. La regla de la mitad es la de la ampliación general del artículo 32.1."
  citation: "art. 68.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-2015-10565-art-74
- id: m03-l03-q159
  prompt:
    es: "¿Cuál de las siguientes cuestiones incidentales suspende la tramitación del procedimiento, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La que se refiera a la nulidad de las actuaciones del propio procedimiento."
  - id: b
    correct: true
    text:
      es: "La recusación de la autoridad o del personal que interviene en el procedimiento."
  - id: c
    text:
      es: "La que plantee la falta de acreditación de la representación del interesado."
  - id: d
    text:
      es: "La que se suscite sobre la acumulación del procedimiento con otro conexo."
  explanation:
    es: "El artículo 74 dice que las cuestiones incidentales, «incluso las que se refieran a la nulidad de actuaciones, no suspenderán la tramitación del mismo, salvo la recusación». Solo la recusación suspende. La nulidad de actuaciones está nombrada como cuestión que no suspende. La representación y la acumulación no son excepciones."
  citation: "art. 74 LPAC"
  difficulty: 1
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-10565-art-76
- id: m03-l03-q160
  prompt:
    es: "Señale la respuesta correcta sobre las alegaciones de los interesados en la instrucción del procedimiento, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Solo pueden aducirse después del trámite de audiencia y antes de la resolución."
  - id: b
    correct: true
    text:
      es: "Pueden aducirse en cualquier momento del procedimiento anterior al trámite de audiencia."
  - id: c
    text:
      es: "Solo pueden aducirse dentro de los diez días siguientes al acuerdo de iniciación."
  - id: d
    text:
      es: "Solo pueden aducirse durante el período de prueba que acuerde el instructor."
  explanation:
    es: "El artículo 76.1 dice que los interesados podrán, «en cualquier momento del procedimiento anterior al trámite de audiencia», aducir alegaciones y aportar documentos. No hay un plazo de diez días desde la iniciación ni se limita al período de prueba. Después de la audiencia no se abre un nuevo momento general de alegaciones."
  citation: "art. 76.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-77
- id: m03-l03-q162
  prompt:
    es: "El instructor abre un período de prueba por el plazo máximo legal mediante acuerdo notificado el lunes 11 de enero de 2027. Sin festivos en el periodo, ¿cuál es el último día del período de prueba?"
  options:
  - id: a
    text:
      es: "El lunes 25 de enero de 2027."
  - id: b
    text:
      es: "El miércoles 10 de febrero de 2027."
  - id: c
    text:
      es: "El jueves 11 de febrero de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes 22 de febrero de 2027."
  explanation:
    es: "El máximo del período de prueba es de treinta días (art. 77.2), hábiles (art. 30.2), desde el martes 12 de enero (art. 30.3). Excluidos sábados y domingos, el trigésimo día hábil es el lunes 22 de febrero de 2027. El lunes 25 de enero es el décimo día hábil, el mínimo legal. El miércoles 10 de febrero sale de contar treinta días naturales. El jueves 11 de febrero trata el plazo como de un mes."
  citation: "art. 77.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-80
- id: m03-l03-q163
  prompt:
    es: "De acuerdo con el artículo 80.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, salvo disposición expresa en contrario, los informes que se emitan en el procedimiento:"
  options:
  - id: a
    correct: true
    text:
      es: "Serán facultativos y no vinculantes."
  - id: b
    text:
      es: "Serán preceptivos y no vinculantes."
  - id: c
    text:
      es: "Serán facultativos y vinculantes."
  - id: d
    text:
      es: "Serán preceptivos y vinculantes."
  explanation:
    es: "El artículo 80.1 dice que, «salvo disposición expresa en contrario, los informes serán facultativos y no vinculantes». Para que un informe sea preceptivo, o vinculante, hace falta una norma que lo diga."
  citation: "art. 80.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-82
- id: m03-l03-q167
  prompt:
    es: "Se notifica a un interesado el lunes 18 de enero de 2027 la apertura del trámite de audiencia con el plazo máximo que permite la ley. Sin festivos en el periodo, ¿cuál es el último día para alegar?"
  options:
  - id: a
    text:
      es: "El lunes 1 de febrero de 2027."
  - id: b
    text:
      es: "El martes 2 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "El lunes 8 de febrero de 2027."
  - id: d
    text:
      es: "El lunes 15 de febrero de 2027."
  explanation:
    es: "El plazo de audiencia es no inferior a diez días ni superior a quince (art. 82.2); el máximo son quince días hábiles (art. 30.2), desde el martes 19 de enero (art. 30.3). Excluidos sábados y domingos, el decimoquinto día hábil es el lunes 8 de febrero de 2027. El lunes 1 de febrero es el décimo día hábil, el mínimo. El martes 2 de febrero sale de contar quince días naturales. El lunes 15 de febrero cuenta veinte días hábiles."
  citation: "art. 82.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-82
- id: m03-l03-q168
  prompt:
    es: "Se notifica a una interesada el martes 18 de noviembre de 2025 la apertura del trámite de audiencia con el plazo mínimo que permite la ley. Sin festivos en el periodo, el último día para alegar es:"
  options:
  - id: a
    text:
      es: "El martes 25 de noviembre de 2025."
  - id: b
    text:
      es: "El viernes 28 de noviembre de 2025."
  - id: c
    text:
      es: "El lunes 1 de diciembre de 2025."
  - id: d
    correct: true
    text:
      es: "El martes 2 de diciembre de 2025."
  explanation:
    es: "El plazo de audiencia es no inferior a diez días (art. 82.2 de la Ley 39/2015); el mínimo son diez días hábiles (art. 30.2), desde el miércoles 19 de noviembre (art. 30.3). Excluidos sábados y domingos, el décimo día hábil es el martes 2 de diciembre de 2025. El martes 25 de noviembre son cinco días hábiles, la mitad. El viernes 28 sale de contar diez días naturales. El lunes 1 de diciembre cuenta el día de la notificación como primero."
  citation: "art. 82.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-82
- id: m03-l03-q169
  prompt:
    es: "¿En cuál de los siguientes casos se podrá prescindir del trámite de audiencia, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando no figuren ni se tengan en cuenta otros hechos, alegaciones y pruebas que los del interesado."
  - id: b
    text:
      es: "Cuando el interesado no haya presentado alegaciones ni documentos en ningún momento anterior del procedimiento."
  - id: c
    text:
      es: "Cuando se haya abierto en el mismo procedimiento un período de información pública de veinte días."
  - id: d
    text:
      es: "Cuando el plazo máximo para resolver esté próximo a vencer y el órgano competente así lo motive."
  explanation:
    es: "El artículo 82.4 permite prescindir de la audiencia «cuando no figuren en el procedimiento ni sean tenidos en cuenta en la resolución otros hechos ni otras alegaciones y pruebas que las aducidas por el interesado». No basta que el interesado no haya alegado antes. La información pública es otro trámite y no sustituye a la audiencia. La proximidad del vencimiento no es causa."
  citation: "art. 82.4 LPAC"
  difficulty: 2
  tags:
  - "excepción"
  - "procedimiento"
