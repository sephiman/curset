# anchor: boe-a-2023-25758-art-114
- id: m04-l04-q021
  prompt:
    es: "El nombramiento de un funcionario de carrera, con cambio de localidad de residencia, se publica en el «Boletín Oficial del Estado» el lunes 15 de marzo de 2027. Solo son festivos del periodo el Jueves y el Viernes Santo. ¿Cuál es el último día para tomar posesión?"
  options:
  - id: a
    correct: true
    text:
      es: "El jueves 15 de abril de 2027."
  - id: b
    text:
      es: "El lunes 19 de abril de 2027."
  - id: c
    text:
      es: "El miércoles 14 de abril de 2027."
  - id: d
    text:
      es: "El martes 30 de marzo de 2027."
  explanation:
    es: "El artículo 114.12 del Real Decreto-ley 6/2023 no dice si cuenta el día de la publicación; con el artículo 30 LPAC, el cómputo empieza el día siguiente. El plazo es de un mes, contado de fecha a fecha (art. 30.4 LPAC): termina el jueves 15 de abril de 2027, que no es festivo. Los festivos intermedios no alargan un plazo fijado en meses. El lunes 19 de abril de 2027 sale de sumar los dos festivos, llegar al sábado 17 y pasar al lunes. El miércoles 14 de abril de 2027 trata el mes como treinta días naturales. El martes 30 de marzo de 2027 son los quince días naturales del nombramiento sin cambio de localidad."
  citation: "art. 114.12 RDL 6/2023"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-10565-art-30
- id: m04-l04-q022
  prompt:
    es: "Según el artículo 30.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si en el mes de vencimiento no hay día equivalente al del inicio del cómputo, el plazo expira:"
  options:
  - id: a
    text:
      es: "El primer día del mes siguiente al de vencimiento."
  - id: b
    correct: true
    text:
      es: "El último día del mes de vencimiento."
  - id: c
    text:
      es: "El primer día hábil del mes siguiente al de vencimiento."
  - id: d
    text:
      es: "El trigésimo día natural contado desde la publicación."
  explanation:
    es: "El artículo 30.4 LPAC dice que, si en el mes de vencimiento no hubiera día equivalente a aquel en que comienza el cómputo, «se entenderá que el plazo expira el último día del mes». Es la regla que cierra el mes de toma de posesión con cambio de localidad cuando el nombramiento se publica un día 31. Las dos opciones del mes siguiente llevan el plazo más allá del mes de vencimiento. La del trigésimo día cuenta el mes como treinta días, y el artículo cuenta de fecha a fecha."
  citation: "art. 30.4 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-11719-art-63
- id: m04-l04-q023
  prompt:
    es: "¿Cuál de las siguientes es causa de pérdida de la condición de funcionario de carrera según el artículo 63 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "La jubilación parcial del funcionario."
  - id: b
    text:
      es: "La declaración de suspensión firme de funciones."
  - id: c
    text:
      es: "El pase a excedencia voluntaria por interés particular."
  - id: d
    correct: true
    text:
      es: "La jubilación total del funcionario."
  explanation:
    es: "El artículo 63.c) incluye entre las causas de pérdida «La jubilación total del funcionario». La jubilación parcial no figura entre las causas. La suspensión firme de funciones y la excedencia voluntaria por interés particular son situaciones administrativas: el funcionario pasa por ellas sin perder su condición."
  citation: "art. 63 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-63
- id: m04-l04-q024
  prompt:
    es: "Entre las causas de pérdida de la condición de funcionario de carrera, ¿qué sanción disciplinaria produce esa pérdida?"
  options:
  - id: a
    correct: true
    text:
      es: "La separación del servicio que tuviere carácter firme."
  - id: b
    text:
      es: "La suspensión firme de funciones por más de tres años."
  - id: c
    text:
      es: "La separación del servicio, aunque todavía no sea firme."
  - id: d
    text:
      es: "El traslado forzoso con cambio de localidad de residencia."
  explanation:
    es: "El artículo 63.d) recoge «La sanción disciplinaria de separación del servicio que tuviere carácter firme». Sin firmeza no hay pérdida, y por eso falla la opción de la separación aún no firme. La suspensión firme de funciones y el traslado forzoso son otras sanciones, y ninguna figura entre las causas de pérdida."
  citation: "art. 63 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-63
- id: m04-l04-q025
  prompt:
    es: "Según el artículo 63 del texto refundido de la Ley del Estatuto Básico del Empleado Público, causa la pérdida de la condición de funcionario de carrera la pena de inhabilitación para cargo público:"
  options:
  - id: a
    text:
      es: "Absoluta, solo cuando se imponga como pena principal y sea firme."
  - id: b
    text:
      es: "Absoluta o especial, desde la sentencia dictada en primera instancia."
  - id: c
    correct: true
    text:
      es: "Absoluta o especial, principal o accesoria, que tuviere carácter firme."
  - id: d
    text:
      es: "Especial, solo cuando se imponga como pena accesoria y sea firme."
  explanation:
    es: "El artículo 63.e) recoge «La pena principal o accesoria de inhabilitación absoluta o especial para cargo público que tuviere carácter firme». Cuentan las dos clases, absoluta y especial, y las dos formas, principal y accesoria. Las opciones que dejan solo la absoluta principal o solo la especial accesoria recortan la lista. La de la sentencia de primera instancia prescinde de la firmeza."
  citation: "art. 63 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "concepto"
