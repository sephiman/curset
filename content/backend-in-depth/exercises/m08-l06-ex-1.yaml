type: quiz
variants:
- id: m08-l06-q01
  prompt:
    en: According to the Axon Framework documentation on snapshotting, how does Axon restore an event-sourced entity
      when a snapshot is available and can be used?
  options:
  - id: a
    correct: true
    text:
      en: It initializes the entity from the snapshot and applies the later events
  - id: b
    text:
      en: It replays every event from the first one and uses the snapshot only to verify the result
  - id: c
    text:
      en: It deletes the events that precede the snapshot from the event store
  - id: d
    text:
      en: It applies only the events that occurred before the snapshot's position
  explanation:
    en: Axon initializes the entity from the snapshot and applies the later events, those that occurred after the
      snapshot's position. Replaying every event is wrong, because the entity is initialized from the usable snapshot.
      Deleting the earlier events is wrong, because the event log is the single source of truth and an immutable
      audit trail. Applying only earlier events is wrong, because the system restores the entity from the snapshot
      and applies only the events that occurred afterwards.
  citation: axon-snapshotting#_snapshot_lifecycle
- id: m08-l06-q02
  prompt:
    en: In Axon Framework, a Subscribing Processor reads from the `EventBus` and one of its event handlers throws
      an exception. What happens to the event publication?
  options:
  - id: a
    text:
      en: The processor resumes from its last token after a restart and retries the event
  - id: b
    correct: true
    text:
      en: The failure propagates back to the publisher and fails the event publication
  - id: c
    text:
      en: The publication completes at once, because the handler runs on a separate thread
  - id: d
    text:
      en: The publication is rolled back only for that handler, and the other handlers still receive the event
  explanation:
    en: A failing handler propagates its failure back to the publisher, failing the event publication. Resuming
      from a last token is wrong, because with the `EventBus` as source the processor only receives current events.
      Completing at once on a separate thread is wrong, because the publishing thread is the same one that handles
      the event. A rollback for only that handler is wrong, because publication completes only after every subscribed
      handler has finished.
  citation: axon-event-processors-subscribing#cmdk-launch
- id: m08-l06-q03
  prompt:
    en: How does a streaming event processor in Axon perform a replay of events that its handlers already handled
      once?
  options:
  - id: a
    correct: true
    text:
      en: By adjusting the token position of that processor
  - id: b
    text:
      en: By rewriting the stored events in the event store with corrected payloads
  - id: c
    text:
      en: By clearing the token store, so that the processor handles the stream from the start as a replay
  - id: d
    text:
      en: By starting a Subscribing Processor on the `EventBus`, which re-delivers old events
  explanation:
    en: A streaming processor replays events by adjusting its token position. Rewriting stored events is wrong,
      because the event log is an immutable audit trail. Clearing the token store is wrong, because the initial
      token makes the processor handle the stream as regular events, not as a replay. A Subscribing Processor on
      the `EventBus` is wrong, because replaying is not an option for any Subscribing Processor.
  citation: axon-event-processors-streaming#tracking_tokens
- id: m08-l06-q04
  prompt:
    en: How many segments does a `PooledStreamingEventProcessor` use by default, before `initialSegmentCount` is
      changed on its first start?
  options:
  - id: a
    text:
      en: One
  - id: b
    text:
      en: Four
  - id: c
    text:
      en: Sixty-four
  - id: d
    correct: true
    text:
      en: Sixteen
  explanation:
    en: The default is sixteen segments. One, four and sixty-four are all excluded, because the documentation gives
      sixteen as the default number of segments.
  citation: axon-event-processors-streaming#parallel_processing
- id: m08-l06-q05
  prompt:
    en: In the token claim settings of an Axon streaming processor, what is the default value of `tokenClaimInterval`,
      the wait between attempts to claim a segment?
  options:
  - id: a
    text:
      en: 500 milliseconds
  - id: b
    correct: true
    text:
      en: 5000 milliseconds
  - id: c
    text:
      en: 30000 milliseconds
  - id: d
    text:
      en: 60000 milliseconds
  explanation:
    en: '`tokenClaimInterval` defaults to 5000 milliseconds. 500 milliseconds, 30000 milliseconds and 60000 milliseconds
      are all excluded, because the documentation states 5000 milliseconds as the default.'
  citation: axon-event-processors-streaming#token_claim_config
- id: m08-l06-q06
  prompt:
    en: In Axon Framework, what does configuring the `FullConcurrencyPolicy` as the sequencing policy tell the event
      processor about the order of events?
  options:
  - id: a
    text:
      en: It must handle all events one after another, starting each when the previous one finishes
  - id: b
    text:
      en: It must handle events of the same entity one after another, while different entities run concurrently
  - id: c
    correct: true
    text:
      en: It may handle all events concurrently, because no event depends on another
  - id: d
    text:
      en: It must handle events that share a metadata value one after another
  explanation:
    en: '`FullConcurrencyPolicy` tells Axon the processor may handle all events concurrently. Handling events one
      after another describes `SequentialPolicy`, which processes all events sequentially. Same-entity ordering
      describes `SequentialPerAggregatePolicy`, which forces events of the same aggregate or entity to be handled
      sequentially. Ordering by metadata describes `MetadataSequencingPolicy`, which needs a `metaDataKey` to be
      provided.'
  citation: axon-event-processors-streaming#sequencing_policies
- id: m08-l06-q07
  prompt:
    en: In an Axon streaming processor, an event handler keeps failing on one event. What does the default `PropagatingErrorHandler`
      do with that failure?
  options:
  - id: a
    text:
      en: It skips the event and advances the token so that the segment keeps moving
  - id: b
    text:
      en: It stops the whole processor and halts every segment
  - id: c
    text:
      en: It rolls back only the event and still commits the token update
  - id: d
    correct: true
    text:
      en: It rethrows, so the segment retries the same event indefinitely
  explanation:
    en: The default `PropagatingErrorHandler` rethrows, so the segment retries the same event indefinitely. Skipping
      the event is wrong, because silently skipping could corrupt a read model, which is why the segment stalls
      instead. Halting every segment is wrong, because only that segment stops advancing while others continue.
      Committing the token anyway is wrong, because handler work and the token update share one transaction.
  citation: axon-event-processors-streaming#stalled_segments
- id: m08-l06-q08
  prompt:
    en: Where do Axon Framework 5 workflows source their state from, in contrast to the persistent `SagaStore` blob
      that Axon Framework 4 sagas used?
  options:
  - id: a
    text:
      en: From a serialized instance kept in a `SagaStore`
  - id: b
    text:
      en: From association values stored on each event handler
  - id: c
    correct: true
    text:
      en: From dedicated workflow events in the regular event store
  - id: d
    text:
      en: From persisted saga fields updated by handlers
  explanation:
    en: Workflows source their state from dedicated workflow events in the regular event store. A serialized instance
      in a `SagaStore` is wrong, because such a running saga cannot be handed to a workflow. Association values
      on handlers are wrong, because the association value becomes the workflow's identifier. Persisted saga fields
      are wrong, because workflow state is the step history and workflow payload, with local control flow reconstructed
      during replay.
  citation: axon-migration-sagas#workflows
- id: m08-l06-q09
  prompt:
    en: Which statement about the `SimpleCommandBus`, the command bus that Axon Framework configures with the Spring
      Boot starter unless Axon Server is configured, is correct?
  options:
  - id: a
    text:
      en: It routes commands to other nodes through a `CommandBusConnector`
  - id: b
    correct: true
    text:
      en: It runs in a single JVM and cannot distribute commands across multiple instances
  - id: c
    text:
      en: Spring Boot configures it only after Axon Server has been configured in the application
  - id: d
    text:
      en: It is the bus that wraps a local segment and adds distribution
  explanation:
    en: The `SimpleCommandBus` runs in a single JVM and cannot distribute commands across multiple instances. Routing
      through a `CommandBusConnector` is wrong, because the connector belongs to the `DistributedCommandBus`. Configuration
      only with Axon Server is wrong, because Spring Boot configures it unless Axon Server is configured. Wrapping
      a local segment is wrong, because the `DistributedCommandBus` is the one that takes in a local `CommandBus`
      called the `localSegment`.
  citation: axon-command-infrastructure#_simplecommandbus
- id: m08-l06-q10
  prompt:
    en: To honour an erasure request for personal data held in an event-sourced log, what does Axon Data Protection
      delete, and where is it stored?
  options:
  - id: a
    text:
      en: The events that hold the personal data, removed from the event store
  - id: b
    text:
      en: The encrypted field values, rewritten in place inside each stored event
  - id: c
    correct: true
    text:
      en: The key that encrypted the personal fields, stored outside the event stream
  - id: d
    text:
      en: The key that encrypted the personal fields, stored inside the event stream
  explanation:
    en: Axon Data Protection deletes the key that encrypted the personal fields, which is stored outside the event
      stream. Removing the events is wrong, because all data is stored as immutable, undeletable events. Rewriting
      field values in place is wrong, because changing the immutable events suffers from significant drawbacks and
      potential operations costs. A key inside the event stream is wrong, because the key is stored outside the
      event stream so that it can be deleted.
  citation: axon-data-protection#_about
- id: m08-l06-q11
  prompt:
    en: In Axon Framework, when does a handler receive a stored event in the Java type it expects, when that type
      differs from the stored form?
  options:
  - id: a
    correct: true
    text:
      en: At handling time, when Axon converts the stored payload to the expected type
  - id: b
    text:
      en: At storing time, when the event is written once in every format a handler needs
  - id: c
    text:
      en: Only after an upcaster has rewritten the stored events
  - id: d
    text:
      en: Never, because every handler of an event must use the same Java class
  explanation:
    en: Axon converts the stored payload to the handler's expected type at handling time. Writing every format at
      storing time is wrong, because stored events retain their serialized form along with metadata about their
      `MessageType`. Requiring an upcaster is wrong, because event handling can evolve without modifying stored
      events. A single shared class is wrong, because different handlers can process the same event using different
      Java representations.
  citation: axon-event-versioning#event_versioning_at_handling_time
