- short: LGT (Ley 58/2003)
  aliases: [Ley General Tributaria, Ley 58/2003, LGT]
  boe_id: BOE-A-2003-23186
  temas: [III.1, III.3, III.4, III.5, III.6, III.7, III.8, III.9, III.10, III.11, III.12, III.13, III.14]
  slug: lgt
  src: norms
  note: >-
    Norma central del bloque III (169 preguntas de 2020–2025 la citan; «Ley 58/2023» en 2024-4, 14, 52 y 72 es errata).
    Sin modificaciones en 2025–2026: la última actualización es de 21-12-2024. Cuestión de inconstitucionalidad 1254/2025
    pendiente sobre un inciso del art. 150.7 (BOE-A-2025-12198). El art. 26.6 remite el interés de demora a la Ley de
    Presupuestos y el art. 82.2.a) el límite exento de garantías a una orden ministerial: véase cifras_anuales.
  cifras_anuales:
  - cifra: Interés de demora tributario (art. 26.6 LGT)
    valor_2026: 4,0625 %
    norma: Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para 2023 (prorrogada)
    boe_id: BOE-A-2022-22128
    precepto: disposición adicional cuadragésima segunda, apartado Dos
    desde: '2023-01-01'
    nota: >-
      La DA 42.ª lo fija «hasta el 31 de diciembre del año 2023». No hay Ley de PGE para 2024, 2025 ni 2026 (búsqueda en la
      API de legislación consolidada, 2026-11-11): rige la de 2023 prorrogada (art. 134.4 CE) y ninguna norma de 2024–2026
      fija otro tipo (análisis de la Ley 31/2022 y de la LGT en boe.es). Sin contraste con la sede de la AEAT en esta ronda.
  - cifra: Interés legal del dinero (art. 26.6, segundo párrafo, LGT; aplazamientos, fraccionamientos y suspensiones con aval solidario o seguro de caución)
    valor_2026: 3,25 %
    norma: Ley 31/2022 (prorrogada)
    boe_id: BOE-A-2022-22128
    precepto: disposición adicional cuadragésima segunda, apartado Uno
    desde: '2023-01-01'
    nota: 'Igual que el interés de demora: fijado para 2023 y aplicado por la prórroga de los PGE.'
  - cifra: Límite exento de garantía en aplazamientos y fraccionamientos (art. 82.2.a) LGT)
    valor_2026: 50.000 euros
    norma: Orden HFP/311/2023, de 28 de marzo
    boe_id: BOE-A-2023-8119
    precepto: artículo 2
    desde: '2023-04-15'
    nota: No es anual; la fija una orden ministerial y cambia cuando se dicta otra (la anterior, Orden HAP/2178/2015, 30.000 euros).

