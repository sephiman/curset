# anchor: fuente-ms-office-formatos-archivo-html
- id: m06-l04-q243
  prompt:
    es: "Según la página de Microsoft sobre los formatos de archivo, ¿en qué se diferencian las plantillas .dotx y .dotm de Word 365?"
  options:
  - id: a
    text:
      es: "La .dotx contiene macros y la .dotm no"
  - id: b
    correct: true
    text:
      es: "La .dotx no contiene macros y la .dotm sí"
  - id: c
    text:
      es: "La .dotx es de Word 97-2003 y la .dotm de versiones posteriores"
  - id: d
    text:
      es: "La .dotx guarda documentos y la .dotm guarda solo estilos"
  explanation:
    es: "La página describe la .dotm como plantilla «que contienen macros» y la .dotx como plantilla «que no contienen macros». La .dotx es la plantilla que no contiene macros. La plantilla de Word 97-2003 es la .dot, no la .dotx. Ambas son plantillas para crear nuevos archivos; la diferencia es si contienen macros."
  citation: "fuente: `ms-office-formatos-archivo.html`; «.dotm — Plantilla habilitada para macros de Word — Plantilla para crear nuevos archivos Word»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-office-formatos-archivo-html
- id: m06-l04-q245
  prompt:
    es: "¿Cuál de las siguientes extensiones corresponde en Word 365 a una plantilla de Word 97-2003?"
  options:
  - id: a
    correct: true
    text:
      es: ".dot"
  - id: b
    text:
      es: ".doc"
  - id: c
    text:
      es: ".dotx"
  - id: d
    text:
      es: ".docm"
  explanation:
    es: "La página dice: «.dot Plantilla de Word 97-2003. Plantilla para archivos de Word 97-Word 2003». .doc es el documento de Word 97-2003 en formato binario, no una plantilla. .dotx es la plantilla de las versiones posteriores, sin macros. .docm es un documento habilitado para macros, no una plantilla."
  citation: "fuente: `ms-office-formatos-archivo.html`; «Formatos de archivo que son compatibles con Word»"
  difficulty: 1
  tags:
