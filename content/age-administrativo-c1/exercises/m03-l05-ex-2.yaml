# anchor: boe-a-2015-10566-art-30
- id: m03-l05-q027
  prompt:
    es: "A falta de plazo fijado por la ley que las establezca, las infracciones administrativas calificadas como muy graves prescriben:"
  options:
  - id: a
    text:
      es: "A los cinco años, igual que las sanciones por faltas muy graves."
  - id: b
    text:
      es: "A los tres años, y las sanciones por faltas muy graves a los cinco."
  - id: c
    correct: true
    text:
      es: "A los tres años, igual que las sanciones impuestas por faltas muy graves."
  - id: d
    text:
      es: "A los dos años, y las sanciones por faltas muy graves a los tres años."
  explanation:
    es: "El artículo 30.1 de la Ley 40/2015 dice que «las infracciones muy graves prescribirán a los tres años» y que «las sanciones impuestas por faltas muy graves prescribirán a los tres años». Los dos plazos coinciden. Cinco años no es un plazo del artículo 30.1, y dos años es el de las infracciones graves."
  citation: "art. 30.1 LRJSP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-30
- id: m03-l05-q028
  prompt:
    es: "De acuerdo con el artículo 30.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las infracciones y sanciones prescribirán:"
  options:
  - id: a
    text:
      es: "En los plazos de la Ley 40/2015 en todo caso, aunque la ley sectorial que las establezca haya fijado otros plazos distintos."
  - id: b
    correct: true
    text:
      es: "Según lo dispuesto en las leyes que las establezcan y, si estas no fijan plazos, en los del propio artículo."
  - id: c
    text:
      es: "Según lo dispuesto en el reglamento que desarrolle el régimen sancionador de cada materia o sector de actividad."
  - id: d
    text:
      es: "En el plazo que fije el órgano competente para resolver en el acuerdo de iniciación del procedimiento."
  explanation:
    es: "El artículo 30.1 empieza: «Las infracciones y sanciones prescribirán según lo dispuesto en las leyes que las establezcan. Si éstas no fijan plazos de prescripción», se aplican los del propio artículo. Los plazos de la Ley 40/2015 son supletorios, no se imponen a la ley sectorial. La remisión es a la ley, no a un reglamento ni a lo que decida el órgano que resuelve."
  citation: "art. 30.1 LRJSP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-63
- id: m03-l05-q029
  prompt:
    es: "De acuerdo con el artículo 63.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los procedimientos de naturaleza sancionadora se iniciarán:"
  options:
  - id: a
    text:
      es: "De oficio o a solicitud del interesado perjudicado por la infracción."
  - id: b
    text:
      es: "Siempre de oficio, por acuerdo del órgano instructor."
  - id: c
    correct: true
    text:
      es: "Siempre de oficio, por acuerdo del órgano competente."
  - id: d
    text:
      es: "De oficio o por denuncia, que obliga por sí sola a iniciarlos."
  explanation:
    es: "El artículo 63.1 dice que «se iniciarán siempre de oficio por acuerdo del órgano competente». No caben a solicitud del interesado. La denuncia no los inicia por sí sola, porque el inicio es siempre un acuerdo de oficio. Y quien acuerda el inicio es el órgano competente, no el instructor, al que se encomienda una fase distinta."
  citation: "art. 63.1 LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-63
- id: m03-l05-q030
  prompt:
    es: "Según el artículo 63.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cómo se encomiendan la fase instructora y la fase sancionadora de los procedimientos de naturaleza sancionadora?"
  options:
  - id: a
    text:
      es: "Al mismo órgano, que instruye y resuelve el procedimiento."
  - id: b
    correct: true
    text:
      es: "A órganos distintos, con la debida separación entre ambas fases."
  - id: c
    text:
      es: "A órganos distintos solo cuando la infracción sea muy grave."
  - id: d
    text:
      es: "Al mismo órgano, salvo que el interesado solicite expresamente la separación de fases."
  explanation:
    es: "El artículo 63.1 exige «la debida separación entre la fase instructora y la sancionadora, que se encomendará a órganos distintos». La separación es la regla en todo procedimiento sancionador. No depende de la gravedad de la infracción ni de que la pida el interesado, y no permite que un mismo órgano instruya y resuelva."
  citation: "art. 63.1 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-85
- id: m03-l05-q031
  prompt:
    es: "De acuerdo con el artículo 85.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, iniciado un procedimiento sancionador, si el infractor reconoce su responsabilidad:"
  options:
  - id: a
    text:
      es: "Se archivará el procedimiento sin imponer sanción alguna al infractor."
  - id: b
    text:
      es: "Se suspenderá el procedimiento hasta que el infractor pague el importe de la sanción propuesta."
  - id: c
    text:
      es: "Se deberá continuar la instrucción hasta formular la propuesta de resolución."
  - id: d
    correct: true
    text:
      es: "Se podrá resolver el procedimiento con la imposición de la sanción que proceda."
  explanation:
    es: "El artículo 85.1 dice que «se podrá resolver el procedimiento con la imposición de la sanción que proceda». El reconocimiento no lleva al archivo sin sanción ni a una suspensión a la espera del pago. Tampoco obliga a seguir instruyendo hasta la propuesta: permite resolver ya."
  citation: "art. 85.1 LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-85
- id: m03-l05-q032
  prompt:
    es: "Según el artículo 85.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el pago voluntario antes de la resolución implica la terminación del procedimiento sancionador, salvo en lo relativo:"
  options:
  - id: a
    text:
      es: "A la publicación de la sanción impuesta y a la inscripción del infractor en el registro administrativo correspondiente."
  - id: b
    text:
      es: "A la reposición de la situación alterada, pero no a la indemnización por los daños causados."
  - id: c
    text:
      es: "A la fijación de la cuantía definitiva de la sanción y de las reducciones que procedan."
  - id: d
    correct: true
    text:
      es: "A la reposición de la situación alterada o a la indemnización por los daños y perjuicios causados."
  explanation:
    es: "El artículo 85.2 dice que el pago voluntario implica la terminación «salvo en lo relativo a la reposición de la situación alterada o a la determinación de la indemnización por los daños y perjuicios causados por la comisión de la infracción». La salvedad incluye las dos cosas, no solo la reposición. La publicación de la sanción y la inscripción en un registro no están en el artículo. Y la cuantía de la sanción no queda pendiente: el pago termina el procedimiento en ese punto."
  citation: "art. 85.2 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-85
- id: m03-l05-q033
  prompt:
    es: "¿En cuál de los siguientes casos el pago voluntario antes de la resolución implica la terminación del procedimiento sancionador, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Cuando quepa imponer una sanción pecuniaria y otra no pecuniaria, sin justificar la improcedencia de esta."
  - id: b
    correct: true
    text:
      es: "Cuando quepa imponer una sanción pecuniaria y otra no pecuniaria y se haya justificado la improcedencia de la segunda."
  - id: c
    text:
      es: "Cuando la sanción tenga carácter no pecuniario y el presunto responsable haya reconocido su responsabilidad."
  - id: d
    text:
      es: "Solo cuando la infracción esté calificada como leve y la sanción tenga únicamente carácter pecuniario."
  explanation:
    es: "El artículo 85.2 aplica la terminación por pago cuando la sanción es solo pecuniaria «o bien quepa imponer una sanción pecuniaria y otra de carácter no pecuniario pero se ha justificado la improcedencia de la segunda». Sin esa justificación no hay terminación. Una sanción solo no pecuniaria no se paga. Y el artículo no limita la terminación a las infracciones leves."
  citation: "art. 85.2 LPAC"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-85
- id: m03-l05-q034
  prompt:
    es: "¿Hasta qué momento puede el presunto responsable hacer el pago voluntario que termina el procedimiento sancionador, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "En cualquier momento anterior a la resolución."
  - id: b
    text:
      es: "Hasta la notificación de la propuesta de resolución."
  - id: c
    text:
      es: "Dentro de los quince días siguientes al acuerdo de iniciación."
  - id: d
    text:
      es: "Hasta que termine el plazo para recurrir la resolución."
  explanation:
    es: "El artículo 85.2 habla del pago voluntario «en cualquier momento anterior a la resolución». No termina con la propuesta de resolución ni en quince días desde el acuerdo de iniciación. Después de la resolución ya no termina el procedimiento, que ha terminado con ella."
  citation: "art. 85.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-85
- id: m03-l05-q035
  prompt:
    es: "De acuerdo con el artículo 85.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando la sanción sea únicamente pecuniaria, el reconocimiento de responsabilidad y el pago voluntario dan lugar a reducciones:"
  options:
  - id: a
    text:
      es: "Del 20 % exacto sobre el importe de la sanción propuesta, no acumulables entre sí."
  - id: b
    text:
      es: "De, al menos, el 30 % sobre el importe de la sanción propuesta, acumulables entre sí."
  - id: c
    text:
      es: "De, como máximo, el 20 % sobre el importe de la sanción propuesta, acumulables entre sí."
  - id: d
    correct: true
    text:
      es: "De, al menos, el 20 % sobre el importe de la sanción propuesta, acumulables entre sí."
  explanation:
    es: "El artículo 85.3 manda aplicar «reducciones de, al menos, el 20 % sobre el importe de la sanción propuesta, siendo éstos acumulables entre sí». El 20 % es un mínimo, porque el apartado dice «al menos» y añade que el porcentaje «podrá ser incrementado reglamentariamente». «Del 20 % exacto» y «como máximo el 20 %» contradicen «al menos». «No acumulables» contradice «acumulables entre sí». El 30 % sustituye la cifra del apartado, que es el 20 %."
  citation: "art. 85.3 LPAC"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-10565-art-85
- id: m03-l05-q036
  prompt:
    es: "Según el artículo 85.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿a qué está condicionada la efectividad de las reducciones por reconocimiento de responsabilidad o pago voluntario?"
  options:
  - id: a
    correct: true
    text:
      es: "Al desistimiento o renuncia de cualquier acción o recurso en vía administrativa contra la sanción."
  - id: b
    text:
      es: "A la renuncia a todo recurso, tanto administrativo como contencioso-administrativo, contra la sanción impuesta."
  - id: c
    text:
      es: "Al pago de la sanción dentro de los diez días siguientes a la notificación de la resolución."
  - id: d
    text:
      es: "A la reparación previa de los daños y perjuicios causados por la comisión de la infracción."
  explanation:
    es: "El artículo 85.3 dice que «su efectividad estará condicionada al desistimiento o renuncia de cualquier acción o recurso en vía administrativa contra la sanción». La renuncia se limita a la vía administrativa: el artículo no exige renunciar al recurso contencioso-administrativo. No hay un plazo de diez días tras la resolución. La reparación de daños queda fuera de la terminación (art. 85.2), no es la condición de la reducción."
  citation: "art. 85.3 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-85
- id: m03-l05-q037
  prompt:
    es: "¿Dónde deben estar determinadas las reducciones de la sanción por reconocimiento de responsabilidad o pago voluntario, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "En la propuesta de resolución del procedimiento."
  - id: b
    text:
      es: "En la resolución que ponga fin al procedimiento."
  - id: c
    correct: true
    text:
      es: "En la notificación de iniciación del procedimiento."
  - id: d
    text:
      es: "En la norma reglamentaria propia de cada procedimiento."
  explanation:
    es: "El artículo 85.3 dice que «las citadas reducciones, deberán estar determinadas en la notificación de iniciación del procedimiento». No basta con fijarlas en la propuesta de resolución o en la resolución, que llegan tarde para quien quiere pagar o reconocer antes. Tampoco las remite el artículo a una norma reglamentaria de cada procedimiento."
  citation: "art. 85.3 LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-85
- id: m03-l05-q038
  prompt:
    es: "¿En cuál de los siguientes casos se aplican las reducciones de, al menos, el 20 % por reconocimiento de responsabilidad o pago voluntario, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Cuando la sanción sea pecuniaria o no pecuniaria, indistintamente."
  - id: b
    correct: true
    text:
      es: "Cuando la sanción tenga únicamente carácter pecuniario."
  - id: c
    text:
      es: "Cuando solo quepa imponer una sanción de carácter no pecuniario."
  - id: d
    text:
      es: "Cuando la infracción sea leve, sea cual sea la clase de sanción."
  explanation:
    es: "El artículo 85.3 aplica las reducciones «cuando la sanción tenga únicamente carácter pecuniario». Si la sanción es no pecuniaria, o puede serlo, no hay reducción del 20 %. El artículo no atiende a la gravedad de la infracción sino a la clase de sanción."
  citation: "art. 85.3 LPAC"
  difficulty: 2
  tags:
  - "requisito"
