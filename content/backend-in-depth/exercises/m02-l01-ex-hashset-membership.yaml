- id: m02-l01-v-hashset-membership-001
  prompt:
    en: |-
      On the pinned JDK, what does this program print, line by line? `Tag` instances are stored in a `HashSet` and looked up with `contains`.

      ```java
      import java.util.HashSet;
      import java.util.Objects;
      import java.util.Set;

      public class Main {
          static class Tag {
              int code;

              Tag(int code) {
                  this.code = code;
              }

              @Override
              public boolean equals(Object other) {
                  return other instanceof Tag that && that.code == code;
              }

              @Override
              public int hashCode() {
                  return Objects.hash(code);
              }
          }

          public static void main(String[] args) {
              Set<Tag> tags = new HashSet<>();
              Tag first = new Tag(12);
              System.out.println(tags.add(first));
              System.out.println(tags.add(new Tag(12)));
              System.out.println(tags.contains(new Tag(12)));
              System.out.println(tags.size());
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`true`, `false`, `true`, `1`'
    correct: true
  - id: b
    text:
      en: '`true`, `false`, `false`, `1`'
  - id: c
    text:
      en: '`true`, `false`, `true`, `2`'
  - id: d
    text:
      en: '`true`, `true`, `true`, `1`'
  explanation:
    en: '`Tag` overrides `hashCode` consistently with `equals`. The first `add` returns `true`. The second `add` gets an equal
      `Tag(12)`, finds an equal element and returns `false`. `contains(new Tag(12))` is `true` because the set holds an equal
      element, and the set holds one element. The program prints `true`, `false`, `true`, `1`. `true`, `false`, `false`, `1`
      comes from this mistake: taking `contains` to find only the identical object. `contains` returns `true` if and only
      if the set contains an element `e` such that `Objects.equals(o, e)`, which is an equality test and not an identity test.
      `true`, `false`, `true`, `2` comes from this mistake: reading the size as the number of `add` calls. `size` returns
      the number of elements in the set, not the number of `add` calls. `true`, `true`, `true`, `1` comes from this mistake:
      taking the step line to print the opposite boolean. In this program, `add` leaves the set unchanged and returns `false`
      when an equal element is present, and `Tag(12)` equals the stored one.'
