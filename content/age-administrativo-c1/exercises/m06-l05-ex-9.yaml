# anchor: fuente-ms-excel-ordenar-html
- id: m06-l05-q357
  prompt:
    es: "En Excel 365, el número máximo de columnas por las que se puede ordenar a la vez un rango de datos es:"
  options:
  - id: a
    text:
      es: "32"
  - id: b
    correct: true
    text:
      es: "64"
  - id: c
    text:
      es: "128"
  - id: d
    text:
      es: "256"
  explanation:
    es: "La página dice: «Puede ordenar por un máximo de 64 columnas». Por eso 32 se queda corto, y 128 y 256 superan el límite que fija la página."
  citation: "fuente: `ms-excel-ordenar.html`; «Ordenar por más de una columna o fila»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-excel-ordenar-html
- id: m06-l05-q358
  prompt:
    es: "En Excel 365, en Ordenar según del cuadro de diálogo Ordenar, ¿cuál de las siguientes opciones permite ordenar por el color que tienen las celdas por formato manual o condicional?"
  options:
  - id: a
    correct: true
    text:
      es: "Color de celda"
  - id: b
    text:
      es: "Valores de celda"
  - id: c
    text:
      es: "Color de fuente"
  - id: d
    text:
      es: "Icono de celda"
  explanation:
    es: "La página dice: «Para ordenar por formato, seleccione Color de celda, Color de fuente o Icono de celda», y precisa que el formato manual o condicional se ordena «por color de celda». «Valores de celda» sirve «para ordenar por texto, número, o fecha y hora», no por formato. «Color de fuente» ordena por el color del texto, no por el de la celda. «Icono de celda» ordena por un conjunto de iconos creado con formato condicional."
  citation: "fuente: `ms-excel-ordenar.html`; «Ordenar por color de celda, color de fuente o icono»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-filtrar-html
- id: m06-l05-q359
  prompt:
    es: "Señale el comando de la pestaña Datos de Excel 365 que pone flechas de filtro en los encabezados de las columnas de un rango:"
  options:
  - id: a
    text:
      es: "Ordenar"
  - id: b
    text:
      es: "Quitar duplicados"
  - id: c
    text:
      es: "Subtotal"
  - id: d
    correct: true
    text:
      es: "Filtro"
  explanation:
    es: "La página dice: «en la pestaña Datos, seleccione Filtro». «Ordenar» reorganiza los datos en un orden, no los filtra; la página contrasta los filtros, que ocultan los datos que no interesan, con ordenar, que los reorganiza. «Quitar duplicados» elimina valores repetidos, no pone flechas. «Subtotal» inserta subtotales en una lista de datos."
  citation: "fuente: `ms-excel-filtrar.html`; «Filtrar un rango de datos»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-filtrar-html
- id: m06-l05-q360
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes combinaciones de filtros es imposible en una misma columna con Autofiltro, por ser mutuamente excluyentes?"
  options:
  - id: a
    text:
      es: "Por más de un valor de la lista a la vez"
  - id: b
    text:
      es: "Por varios criterios a la vez, como los números mayores que 5 y por debajo del promedio"
  - id: c
    text:
      es: "Por un único criterio personalizado, como Mayor que 150"
  - id: d
    correct: true
    text:
      es: "Por una lista de números y por criterios a la vez"
  explanation:
    es: "La página dice: «puede filtrar por una lista de números o por criterios, pero no por ambos». «Por más de un valor de la lista a la vez» sí es posible: la página habla de filtrar «por más de un valor». «Por varios criterios a la vez, como los números mayores que 5 y por debajo del promedio» también: es el ejemplo de la propia página. «Por un único criterio personalizado, como Mayor que 150» es un filtro por criterios, uno de los dos tipos que ofrece Autofiltro."
  citation: "fuente: `ms-excel-filtrar.html`; «Los dos tipos de filtros»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-quitar-duplicados-html
- id: m06-l05-q361
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones describe la diferencia entre filtrar valores únicos y quitar valores duplicados?"
  options:
  - id: a
    text:
      es: "Filtrar los elimina de forma permanente; quitar los oculta de forma temporal"
  - id: b
    correct: true
    text:
      es: "Filtrar los oculta temporalmente; quitar los elimina de forma permanente"
  - id: c
    text:
      es: "Ambas los eliminan de forma permanente, pero filtrar conserva el último valor"
  - id: d
    text:
      es: "Ambas solo los ocultan, pero quitar permite deshacerlo con Ctrl+Z"
  explanation:
    es: "La página dice: «cuando se filtran valores únicos, los valores duplicados solo se ocultan temporalmente. Sin embargo, quitar los valores duplicados significa que los eliminará permanentemente». «Filtrar los elimina de forma permanente; quitar los oculta de forma temporal» invierte la frase. «Ambas los eliminan de forma permanente, pero filtrar conserva el último valor» contradice que filtrar solo oculta. «Ambas solo los ocultan, pero quitar permite deshacerlo con Ctrl+Z» contradice que quitar elimina permanentemente."
  citation: "fuente: `ms-excel-quitar-duplicados.html`; «Obtenga información sobre cómo filtrar valores únicos o quitar valores duplicados»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-excel-quitar-duplicados-html
- id: m06-l05-q362
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes rutas quita los valores duplicados de un rango de celdas?"
  options:
  - id: a
    correct: true
    text:
      es: "Datos › Herramientas de datos › Quitar duplicados"
  - id: b
    text:
      es: "Datos › Ordenar y filtrar › Filtro avanzado"
  - id: c
    text:
      es: "Datos › Esquema › Subtotal › Quitar todo"
  - id: d
    text:
      es: "Inicio › Estilos › Formato condicional › Administrar reglas"
  explanation:
    es: "La página dice: «En la pestaña Datos, seleccione Quitar duplicados (en el grupo Herramientas de datos)». «Datos › Ordenar y filtrar › Filtro avanzado» sirve para filtrar valores únicos, y los duplicados solo se ocultan temporalmente, no se quitan. «Datos › Esquema › Subtotal › Quitar todo» quita subtotales, no duplicados. «Inicio › Estilos › Formato condicional › Administrar reglas» pertenece al formato condicional, que según la página sirve «para resaltar valores únicos o duplicados», no para quitarlos."
  citation: "fuente: `ms-excel-quitar-duplicados.html`; «Quitar valores duplicados»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-quitar-duplicados-html
- id: m06-l05-q363
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones del cuadro Filtro avanzado copia los resultados del filtro en otra ubicación?"
  options:
  - id: a
    text:
      es: "Filtrar la lista, local"
  - id: b
    text:
      es: "Contraer cuadro de diálogo"
  - id: c
    correct: true
    text:
      es: "Copiar a otra ubicación"
  - id: d
    text:
      es: "Expandir"
  explanation:
    es: "La página dice: «Para copiar los resultados del filtro en otra ubicación: Seleccione Copiar a otra ubicación». «Filtrar la lista, local» filtra el rango en su sitio y es la alternativa a copiar. «Contraer cuadro de diálogo» oculta temporalmente la ventana emergente para elegir una celda de la hoja. «Expandir» es el botón con el que se vuelve a mostrar la ventana tras elegir esa celda; no copia el resultado."
  citation: "fuente: `ms-excel-quitar-duplicados.html`; «Filtrar por valores únicos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-quitar-duplicados-html
- id: m06-l05-q364
  prompt:
    es: "Señale qué ocurre, al quitar duplicados en Excel 365, con las apariciones de un mismo valor en la lista:"
  options:
  - id: a
    text:
      es: "Se conserva la última aparición y se eliminan las demás"
  - id: b
    correct: true
    text:
      es: "Se conserva la primera aparición y se eliminan las idénticas"
  - id: c
    text:
      es: "Se eliminan todas las apariciones, también la primera"
  - id: d
    text:
      es: "Se ocultan temporalmente todas menos la primera"
  explanation:
    es: "La página dice: «Cuando se quitan duplicados, se conserva la primera aparición del valor en la lista, pero se eliminan otros valores idénticos». «Se conserva la última aparición y se eliminan las demás» invierte cuál se conserva. «Se eliminan todas las apariciones, también la primera» contradice que la primera se conserva. «Se ocultan temporalmente todas menos la primera» describe el filtro de valores únicos, en el que los duplicados «solo se ocultan temporalmente», no quitar duplicados, que los elimina."
  citation: "fuente: `ms-excel-quitar-duplicados.html`; «Quitar valores duplicados»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-segmentacion-html
- id: m06-l05-q365
  prompt:
    es: "En Excel 365, ¿qué hacen las segmentaciones de datos además de filtrar con rapidez los datos de una tabla o tabla dinámica?"
  options:
  - id: a
    text:
      es: "Calculan un subtotal de cada grupo"
  - id: b
    text:
      es: "Cambian el origen de datos de la tabla dinámica"
  - id: c
    correct: true
    text:
      es: "Indican el estado de filtrado actual"
  - id: d
    text:
      es: "Convierten la tabla en un rango normal"
  explanation:
    es: "La página dice: «Además del filtrado rápido, las segmentaciones también indican el estado de filtrado actual». «Calculan un subtotal de cada grupo» no figura entre sus funciones; los subtotales se insertan con el comando Subtotal. «Cambian el origen de datos de la tabla dinámica» tampoco: la página solo dice que se conectan a tablas dinámicas que comparten origen. «Convierten la tabla en un rango normal» no es una función que la página atribuya a las segmentaciones, que filtran la tabla."
  citation: "fuente: `ms-excel-segmentacion.html`; «Segmentación de datos»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-segmentacion-html
- id: m06-l05-q366
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes teclas se mantiene presionada para seleccionar más de un elemento en una segmentación de datos?"
  options:
  - id: a
    text:
      es: "Alt"
  - id: b
    text:
      es: "Inicio"
  - id: c
    text:
      es: "Esc"
  - id: d
    correct: true
    text:
      es: "Ctrl"
  explanation:
    es: "La página dice: «Para seleccionar más de un elemento, mantenga presionada la tecla CTRL». «Alt», «Inicio» y «Esc» no son teclas que la página cite para seleccionar varios elementos de una segmentación; la única que cita para ello es Ctrl."
  citation: "fuente: `ms-excel-segmentacion.html`; «Crear una segmentación de datos para filtrar datos en una tabla o tabla dinámica»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-excel-anular-dinamizacion-html
- id: m06-l05-q368
  prompt:
    es: "En Excel 365, ¿qué comando de Power Query conviene usar cuando no se conoce el número de columnas del origen y se quiere que solo las seleccionadas queden sin dinamizar tras actualizar?"
  options:
  - id: a
    text:
      es: "Anular dinamización de columnas, incluidas las nuevas tras actualizar"
  - id: b
    text:
      es: "Anular dinamización de otras columnas"
  - id: c
    text:
      es: "Editar consulta en el Editor de Power Query"
  - id: d
    correct: true
    text:
      es: "Anular dinamización de solo las columnas seleccionadas"
  explanation:
    es: "La página dice: «Use este comando cuando no conozca el número de columnas del origen de datos y desee asegurarse de que las columnas seleccionadas permanecen sin dinamizar después de una operación de actualización». «Anular dinamización de columnas, incluidas las nuevas tras actualizar» no es ningún comando de la página, que solo nombra Anular dinamización de columnas, de otras columnas y de solo las columnas seleccionadas. «Anular dinamización de otras columnas» actúa sobre las columnas no seleccionadas. «Editar consulta en el Editor de Power Query» solo abre una consulta, según la página."
  citation: "fuente: `ms-excel-anular-dinamizacion.html`; «Anular dinamización de las columnas seleccionadas únicamente»"
  difficulty: 3
  tags:
  - "función"
  - "comportamiento"
# anchor: fuente-ms-excel-lista-desplegable-html
- id: m06-l05-q369
  prompt:
    es: "En Excel 365, en la pestaña Configuración de Validación de datos, ¿qué se selecciona en el cuadro Permitir para crear una lista desplegable?"
  options:
  - id: a
    text:
      es: "Número entero"
  - id: b
    text:
      es: "Fecha"
  - id: c
    correct: true
    text:
      es: "Lista"
  - id: d
    text:
      es: "Personalizada"
  explanation:
    es: "La página dice: «En la pestaña Configuración, del cuadro Permitir, seleccione Lista». «Número entero», «Fecha» y «Personalizada» no son lo que la página indica para una lista desplegable: la página pide Lista y luego, en el cuadro Origen, el rango de los valores."
  citation: "fuente: `ms-excel-lista-desplegable.html`; «Crear una lista desplegable»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-excel-imprimir-html
- id: m06-l05-q371
  prompt:
    es: "En Excel 365, una hoja tiene un área de impresión definida y se quiere imprimir toda la hoja. ¿Qué opción hay que seleccionar?"
  options:
  - id: a
    text:
      es: "Imprimir a archivo"
  - id: b
    correct: true
    text:
      es: "Ignorar área de impresión"
  - id: c
    text:
      es: "Imprimir hojas activas"
  - id: d
    text:
      es: "Imprimir tabla seleccionada"
  explanation:
    es: "La página dice: «Si no desea imprimir solo el área de impresión definida, seleccione Ignorar área de impresión». «Imprimir a archivo» se elige en Impresora para enviar la salida a un archivo. «Imprimir hojas activas» es el botón de Configuración junto a cuya flecha se elige la opción adecuada, no la opción que ignora el área. «Imprimir tabla seleccionada» imprime una tabla, no la hoja entera."
  citation: "fuente: `ms-excel-imprimir.html`; «Imprimir toda o parte de una hoja de cálculo»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-excel-imprimir-html
- id: m06-l05-q372
  prompt:
    es: "En Excel 365, ¿qué puede ocurrir si se imprime en una impresora diferente un libro que se había impreso en un archivo?"
  options:
  - id: a
    text:
      es: "Se pierden las áreas de impresión definidas"
  - id: b
    text:
      es: "Se imprimen solo las hojas activas"
  - id: c
    text:
      es: "Se convierte el libro en una tabla"
  - id: d
    correct: true
    text:
      es: "Pueden cambiar los saltos de página y el espaciado de fuente"
  explanation:
    es: "La página dice: «Si imprime el archivo guardado en una impresora diferente, pueden cambiar los saltos de página y el espaciado de fuente». «Se pierden las áreas de impresión definidas», «se imprimen solo las hojas activas» y «se convierte el libro en una tabla» no los cita la página como efectos de cambiar de impresora: lo único que cita es el cambio de saltos de página y de espaciado de fuente."
  citation: "fuente: `ms-excel-imprimir.html`; «Imprimir un libro en un archivo»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-escalar-html
- id: m06-l05-q373
  prompt:
    es: "En Escalar para ajustar de Excel 365, ¿qué configuración hace que las columnas quepan en una página de ancho, aunque las filas ocupen más páginas?"
  options:
  - id: a
    correct: true
    text:
      es: "Ancho: 1 página y Alto: Automático"
  - id: b
    text:
      es: "Ancho: 1 página y Alto: 1 página"
  - id: c
    text:
      es: "Ancho: Automático y Alto: 1 página"
  - id: d
    text:
      es: "Ancho: Automático y Alto: Automático"
  explanation:
    es: "La página dice: «en la lista desplegable Ancho, seleccione 1 página y, en la lista desplegable Alto, seleccione Automático. Las columnas aparecerán en una página, pero puede que las filas se extiendan a más de una página». «Ancho: 1 página y Alto: 1 página» y «Ancho: Automático y Alto: 1 página» fijan el alto en 1 página, y para eso la página dice: «Para imprimir la hoja de cálculo en una sola página, seleccione 1 página en el cuadro Alto», así que las filas no se extienden. «Ancho: Automático y Alto: Automático» no limita el ancho a una página."
  citation: "fuente: `ms-excel-escalar.html`; «Escalar una hoja de cálculo»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-excel-escalar-html
- id: m06-l05-q374
  prompt:
    es: "Señale el comando del grupo Configurar página de Excel 365 que permite excluir las columnas o filas que no se necesita imprimir:"
  options:
  - id: a
    text:
      es: "Orientación"
  - id: b
    text:
      es: "Tamaño"
  - id: c
    correct: true
    text:
      es: "Área de impresión"
  - id: d
    text:
      es: "Escalar para ajustar"
  explanation:
    es: "La página dice: «Use el comando Área de impresión (grupo Configurar página) para excluir las columnas o filas que no necesite imprimir». «Orientación» cambia de vertical a horizontal la página, y «Tamaño» el tamaño del papel. «Escalar para ajustar» sirve para reducir o ampliar la hoja a un número de páginas, no para excluir columnas o filas."
  citation: "fuente: `ms-excel-escalar.html`; «Lo que debe saber sobre el escalado de una hoja de cálculo»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-escalar-html
- id: m06-l05-q375
  prompt:
    es: "En Excel 365, ¿qué método abreviado abre el cuadro de diálogo Configurar página, según la ayuda sobre escalado?"
  options:
  - id: a
    correct: true
    text:
      es: "Alt+P, S, P"
  - id: b
    text:
      es: "Alt+W, P"
  - id: c
    text:
      es: "Alt+W, L"
  - id: d
    text:
      es: "Alt+W, I"
  explanation:
    es: "La página dice: «Opcionalmente, presione Alt+P, S, P en el teclado» para abrir Configurar página. Alt+P lleva a la pestaña Diseño de página, la que contiene Configurar página. «Alt+W, P», «Alt+W, L» y «Alt+W, I» parten de Alt+W, que en la tabla de teclas de Excel lleva a la pestaña Ver, no a Configurar página."
  citation: "fuente: `ms-excel-escalar.html`; «Lo que debe saber sobre el escalado de una hoja de cálculo»"
  difficulty: 3
  tags:
  - "atajo"
