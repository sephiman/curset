# anchor: boe-a-2003-23186-art-27
- id: m03-l13-q0159
  prompt:
    es: "Textiles Núñez, S.L. presenta, sin requerimiento previo, una autoliquidación con resultado a ingresar de 8.000 euros 3 meses y 10 días después de terminar el plazo voluntario. Según el artículo 27.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué importe de recargo por declaración extemporánea debe pagar?"
  options:
  - id: a
    text:
      es: "400 euros, el 5 por ciento: un 1 por ciento más un 1 por ciento por cada mes o fracción de retraso."
  - id: b
    correct: true
    text:
      es: "320 euros, el 4 por ciento: un 1 por ciento más un 1 por ciento por cada uno de los tres meses completos de retraso."
  - id: c
    text:
      es: "240 euros, el 3 por ciento: un 1 por ciento por cada uno de los tres meses completos de retraso."
  - id: d
    text:
      es: "80 euros, el 1 por ciento: un único porcentaje fijo por no haber transcurrido un trimestre completo."
  explanation:
    es: "El artículo 27.2 LGT fija el recargo en el 1 por ciento más otro 1 por ciento por cada mes completo de retraso. Con 3 meses y 10 días, los meses completos son 3, el recargo es del 4 por ciento y supone 8.000 × 0,04 = 320 euros. Los diez días sobrantes no cuentan como mes, no se prescinde del 1 por ciento inicial y no hay un recargo único del 1 por ciento."
  citation: "art. 27.2 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0225
  prompt:
    es: "¿Cuál de las siguientes circunstancias impide que sea leve la infracción del artículo 191 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cualquiera que sea la cuantía de la base de la sanción, según el apartado 2?"
  options:
  - id: a
    text:
      es: "Que el obligado ya hubiera sido sancionado antes por infracciones de otros tributos distintos."
  - id: b
    correct: true
    text:
      es: "Que se hayan utilizado facturas, justificantes o documentos falsos o falseados, aunque ello no sea constitutivo de medio fraudulento."
  - id: c
    text:
      es: "Que se hayan utilizado facturas, justificantes o documentos que no cumplan los requisitos formales de la normativa."
  - id: d
    text:
      es: "Que la regularización practicada por la Administración suponga una cuota superior a la declarada."
  explanation:
    es: "El artículo 191.2.a LGT excluye la calificación de leve cuando se han utilizado facturas, justificantes o documentos falsos o falseados, aunque no sean medio fraudulento. Los defectos formales no lo son, una cuota mayor tras la regularización no basta y una sanción anterior solo importa para graduar la multa."
  citation: "art. 191.2 LGT"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-191
- id: m03-l13-q0226
  prompt:
    es: "Según el artículo 191.3.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la utilización de facturas, justificantes o documentos falsos o falseados que no sea constitutiva de medio fraudulento:"
  options:
  - id: a
    text:
      es: "Hace leve la infracción, siempre que la base de la sanción sea inferior a 3.000 euros."
  - id: b
    text:
      es: "Hace muy grave la infracción, cualquiera que sea la cuantía de la base de la sanción."
  - id: c
    correct: true
    text:
      es: "Hace grave la infracción, cualquiera que sea la cuantía de la base de la sanción."
  - id: d
    text:
      es: "Hace grave la infracción solo si la base de la sanción es superior a 3.000 euros."
  explanation:
    es: "El artículo 191.3.a LGT califica de grave la infracción cuando se han utilizado documentos falsos sin que constituyan medio fraudulento, sea cual sea la cuantía. No depende de los 3.000 euros, la calificación de muy grave exige medios fraudulentos (artículo 191.4) y el artículo 191.2.a impide que sea leve."
  citation: "art. 191.3 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "calificación"
