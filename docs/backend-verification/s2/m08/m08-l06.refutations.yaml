m08-l06-q06:
  key:
    anchor: axon-event-processors-streaming#sequencing_policies
    sentence: 'FullConcurrencyPolicy: This policy will tell Axon that this Event Processor may handle all events concurrently.'
  wrong:
  - option: It must handle all events one after another, starting each when the previous one finishes
    anchor: axon-event-processors-streaming#sequencing_policies
    sentence: 'SequentialPolicy: This policy tells Axon that it can process all events sequentially.'
  - option: It must handle events of the same entity one after another, while different entities run concurrently
    anchor: axon-event-processors-streaming#sequencing_policies
    sentence: 'SequentialPerAggregatePolicy: The policy that forces events raised from the same aggregate / entity to be handled sequentially.'
  - option: It must handle events that share a metadata value one after another
    anchor: axon-event-processors-streaming#sequencing_policies
    sentence: 'MetadataSequencingPolicy: When configuring this policy, the user is required to provide a metaDataKey to be used.'
m08-l06-q07:
  key:
    anchor: axon-event-processors-streaming#stalled_segments
    sentence: The default PropagatingErrorHandler rethrows, so the segment retries the same event indefinitely.
  wrong:
  - option: It skips the event and advances the token so that the segment keeps moving
    anchor: axon-event-processors-streaming#stalled_segments
    sentence: This is the intended behaviour when silently skipping the event would corrupt a read model, but it stalls the segment for as long as the cause persists.
  - option: It stops the whole processor and halts every segment
    anchor: axon-event-processors-streaming#stalled_segments
    sentence: that segment stops advancing while others continue
  - option: It rolls back only the event and still commits the token update
    anchor: axon-event-processors-streaming#stalled_segments
    sentence: Handler work and the token update share one transaction.
m08-l06-q08:
  key:
    anchor: axon-migration-sagas#workflows
    sentence: they source it from dedicated workflow events in the regular event store instead of a persistent SagaStore blob.
  wrong:
  - option: From a serialized instance kept in a `SagaStore`
    anchor: axon-migration-sagas#workflows
    sentence: A running saga holding a serialized instance in a SagaStore cannot be handed to a workflow.
  - option: From association values stored on each event handler
    anchor: axon-migration-sagas#workflows
    sentence: The association value becomes the workflow’s identifier
  - option: From persisted saga fields updated by handlers
    anchor: axon-migration-sagas-to-workflows#sagas-and-workflows
    sentence: Step history and workflow payload; local control flow reconstructed during replay.
m08-l06-q09:
  key:
    anchor: axon-command-infrastructure#_simplecommandbus
    sentence: 'Single JVM: Cannot distribute commands across multiple instances'
  wrong:
