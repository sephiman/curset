# anchor: boe-a-2003-21614-art-33
- id: m05-l02-q001
  prompt:
    es: "De acuerdo con el artículo 33.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Presupuestos Generales del Estado determinarán las obligaciones económicas que:"
  options:
  - id: a
    text:
      es: "Como mínimo, deben reconocer los sujetos que el artículo 33.1.a) incluye en los presupuestos de carácter limitativo."
  - id: b
    correct: true
    text:
      es: "Como máximo, pueden reconocer los sujetos que el artículo 33.1.a) incluye en los presupuestos de carácter limitativo."
  - id: c
    text:
      es: "Como máximo, pueden reconocer las entidades de los sectores empresarial y fundacional, de presupuesto estimativo."
  - id: d
    text:
      es: "Como máximo, pueden reconocer los consorcios y las universidades no transferidas, con presupuesto de carácter estimativo."
  explanation:
    es: "El artículo 33.2.a) habla de las obligaciones que, «como máximo», pueden reconocer los sujetos del artículo 33.1.a): el presupuesto limita, no obliga a gastar. La opción del mínimo cambia ese límite en un suelo. Las dos opciones de las entidades empresariales, fundacionales, consorcios y universidades describen a los sujetos del artículo 33.1.b), de presupuesto estimativo, que no reconocen obligaciones con ese límite."
  citation: "art. 33.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-33
- id: m05-l02-q002
  prompt:
    es: "Según el artículo 33.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Presupuestos Generales del Estado determinarán las operaciones no financieras y financieras a realizar por:"
  options:
  - id: a
    text:
      es: "Los órganos y entidades de presupuesto limitativo que enumera el artículo 33.1.a), como los organismos autónomos."
  - id: b
    correct: true
    text:
      es: "Las entidades de presupuesto estimativo que enumera el artículo 33.1.b), como los consorcios y los fondos."
  - id: c
    text:
      es: "Únicamente la Administración General del Estado y sus organismos autónomos, de presupuesto limitativo."
  - id: d
    text:
      es: "Todas las entidades del sector público estatal, sin distinción entre presupuesto limitativo y presupuesto estimativo."
  explanation:
    es: "Las operaciones no financieras y financieras son el contenido que el artículo 33.2.c) asigna a las entidades del artículo 33.1.b), las de presupuesto estimativo. Los sujetos del artículo 33.1.a), de presupuesto limitativo, aparecen en otro apartado: las obligaciones que como máximo pueden reconocer. La opción de la Administración General del Estado y sus organismos autónomos también describe sujetos del artículo 33.1.a). La opción de todas las entidades sin distinguir borra la diferencia que la ley hace entre los dos tipos de presupuesto."
  citation: "art. 33.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-33
- id: m05-l02-q003
  prompt:
    es: "Con arreglo al artículo 33.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Presupuestos Generales del Estado determinarán, para cada gestor responsable de programas:"
  options:
  - id: a
    text:
      es: "Los ingresos que debe recaudar en el ejercicio con los medios humanos y materiales que se le asignan."
  - id: b
    correct: true
    text:
      es: "Los objetivos a alcanzar en el ejercicio con los recursos que el respectivo presupuesto le asigna al efecto."
  - id: c
    text:
      es: "Los créditos que podrá transferir libremente a otros programas durante el ejercicio, sin autorización."
  - id: d
    text:
      es: "Las plazas de personal que podrá cubrir en el ejercicio con cargo a los créditos de sus programas."
  explanation:
    es: "El artículo 33.2.d) pide que el presupuesto fije los objetivos que cada gestor de programas debe alcanzar en el ejercicio con los recursos asignados. Los ingresos a recaudar, la libre transferencia de créditos y las plazas a cubrir no son contenido que el artículo atribuya al gestor de programas; la transferencia de créditos, además, exige autorización conforme a la ley."
  citation: "art. 33.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-33
- id: m05-l02-q005
  prompt:
    es: "Según el artículo 33.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los Presupuestos Generales del Estado determinarán todo lo siguiente, EXCEPTO:"
  options:
  - id: a
    correct: true
    text:
      es: "La retribución individual de cada empleado público estatal en el ejercicio."
  - id: b
    text:
      es: "Los derechos que los entes del artículo 33.1.a) reconocerán durante el correspondiente ejercicio."
  - id: c
    text:
      es: "Las obligaciones que como máximo pueden reconocer los sujetos del artículo 33.1.a)."
  - id: d
    text:
      es: "La estimación de los beneficios fiscales que afecten a los tributos del Estado."
  explanation:
    es: "El artículo 33.2 enumera cinco contenidos: las obligaciones máximas, los derechos a reconocer, las operaciones de las entidades de presupuesto estimativo, los objetivos de cada gestor y los beneficios fiscales. La retribución individual de cada empleado no figura entre ellos. Las otras tres opciones reproducen tres de esos contenidos."
  citation: "art. 33.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2003-21614-art-40
- id: m05-l02-q006
  prompt:
    es: "Según el artículo 40.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los estados de gastos de los Presupuestos Generales del Estado se estructuran de acuerdo con las clasificaciones:"
  options:
  - id: a
    text:
      es: "La orgánica, la económica y la territorial."
  - id: b
    correct: true
    text:
      es: "La orgánica, la de programas y la económica, por este orden."
  - id: c
    text:
      es: "La de programas, la económica y la temporal."
  - id: d
    text:
      es: "La orgánica, la de programas y la subjetiva."
  explanation:
    es: "El artículo 40.1 enumera tres clasificaciones: la orgánica, la de programas y la económica. Las clasificaciones territorial, temporal y subjetiva no existen en la estructura de los estados de gastos."
  citation: "art. 40.1 LGP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-40
- id: m05-l02-q007
  prompt:
    es: "Conforme al artículo 40.1.a) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, la clasificación orgánica:"
  options:
  - id: a
    text:
      es: "Agrupa por capítulos y artículos los créditos asignados a los distintos centros gestores de gasto."
  - id: b
    text:
      es: "Permite a los centros gestores agrupar sus créditos y establecer los objetivos que deben conseguir."
  - id: c
    text:
      es: "Agrupa por secciones y servicios solo los créditos asignados a la Administración General del Estado."
  - id: d
    correct: true
    text:
      es: "Agrupa por secciones y servicios los créditos asignados a los distintos centros gestores de gasto."
  explanation:
    es: "La clasificación orgánica agrupa por secciones y servicios los créditos de los centros gestores de gasto. La opción de capítulos y artículos describe la clasificación económica. La opción de agrupar créditos y fijar objetivos describe la clasificación por programas. La opción que la limita a la Administración General del Estado es falsa: el artículo incluye también a sus organismos autónomos, a las entidades de la Seguridad Social y a otras entidades."
  citation: "art. 40.1.a) LGP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-40
- id: m05-l02-q010
  prompt:
    es: "Según el artículo 40.1.c) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿en qué se desglosan los capítulos de la clasificación económica?"
  options:
  - id: a
    text:
      es: "En conceptos, que a su vez se desglosan en artículos, divisibles en subconceptos."
  - id: b
    text:
      es: "En artículos, que a su vez se desglosan en subconceptos, divisibles en conceptos."
  - id: c
    correct: true
    text:
      es: "En artículos, que a su vez se desglosan en conceptos, divisibles después en subconceptos."
  - id: d
    text:
      es: "En programas, que a su vez se desglosan en conceptos, divisibles en subconceptos."
  explanation:
    es: "Los capítulos se desglosan en artículos, estos en conceptos y los conceptos pueden dividirse en subconceptos. Las dos opciones que invierten el orden de artículos, conceptos y subconceptos cambian la jerarquía; los programas pertenecen a otra clasificación, no al desglose de los capítulos."
  citation: "art. 40.1.c) LGP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-40
- id: m05-l02-q011
  prompt:
    es: "Conforme al artículo 40.1.c) de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en los créditos para operaciones corrientes se distinguirán:"
  options:
  - id: a
    text:
      es: "Gastos de personal, inversiones reales, gastos financieros y transferencias corrientes."
  - id: b
    correct: true
    text:
      es: "Gastos de personal, gastos corrientes en bienes y servicios, gastos financieros y transferencias corrientes."
  - id: c
    text:
      es: "Gastos de personal, gastos corrientes en bienes y servicios, activos financieros y transferencias corrientes."
  - id: d
    text:
      es: "Gastos de personal, gastos corrientes en bienes y servicios, gastos financieros y transferencias de capital."
  explanation:
    es: "Las operaciones corrientes comprenden los gastos de personal, los gastos corrientes en bienes y servicios, los gastos financieros y las transferencias corrientes. Cada alternativa cambia uno de los cuatro por uno de otro bloque: las inversiones reales y las transferencias de capital son operaciones de capital, y los activos financieros son operaciones financieras."
  citation: "art. 40.1.c) LGP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2026-12037-anexo-ii
- id: m05-l02-q020
  prompt:
    es: "En la aplicación 20.302.322A.221.03, ¿a qué capítulo de la clasificación económica corresponde la parte económica?"
  options:
  - id: a
    text:
      es: "Al capítulo 3, «Gastos financieros», por el 3 de 322A."
  - id: b
    text:
      es: "Al capítulo 1, «Gastos de personal», que recoge los gastos corrientes."
  - id: c
    correct: true
    text:
      es: "Al capítulo 2, «Gastos corrientes en bienes y servicios»."
  - id: d
    text:
      es: "Al capítulo 22, «Material, suministros y otros»."
  explanation:
    es: "La parte económica 221.03 empieza por 2, el capítulo de gastos corrientes en bienes y servicios. El 3 de 322A pertenece a la parte de programa, no a la económica. La opción del capítulo 22 confunde capítulo y artículo: el 22 es un artículo, «Material, suministros y otros». El capítulo 1 no corresponde a ninguna cifra de la parte económica."
  citation: "anexo II Orden HAC/557/2026"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-40
- id: m05-l02-q025
  prompt:
    es: "En la aplicación 33.101.921O.227.06 del Instituto Nacional de Administración Pública, el código 33.101 pertenece a la clasificación:"
  options:
  - id: a
    text:
      es: "La de programas, que identifica la política de gasto."
  - id: b
    text:
      es: "La económica, que identifica la naturaleza del gasto."
  - id: c
    text:
      es: "La territorial, que identifica la provincia del gasto."
  - id: d
    correct: true
    text:
      es: "La orgánica, que identifica el organismo gestor."
  explanation:
    es: "La primera parte de la aplicación, 33.101, es la orgánica: identifica el organismo. 921O es el programa y 227.06 la clasificación económica. La clasificación territorial no existe entre las del estado de gastos."
  citation: "art. 40.1.a) LGP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2003-21614-art-27
- id: m05-l02-q029
  prompt:
    es: "Según el artículo 27.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el carácter limitativo y vinculante de los créditos presupuestarios es el correspondiente:"
  options:
  - id: a
    text:
      es: "Al nivel de la clasificación orgánica, con independencia del nivel de la económica."
  - id: b
    text:
      es: "Al nivel de capítulo en todos los casos, sin excepción alguna."
  - id: c
    text:
      es: "Al nivel que fije el centro gestor al retener el crédito."
  - id: d
    correct: true
    text:
      es: "Al nivel de especificación con que aparezcan en los presupuestos."
  explanation:
    es: "El artículo 27.2 liga el carácter limitativo y vinculante al nivel de especificación con que el crédito aparezca en los presupuestos. Ni la clasificación orgánica por sí sola, ni el capítulo en todos los casos, ni la decisión del centro gestor al retener el crédito lo determinan."
  citation: "art. 27.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-46
- id: m05-l02-q030
  prompt:
    es: "Conforme al artículo 46 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, al ser limitativos los créditos para gastos, no podrán adquirirse compromisos de gasto ni obligaciones:"
  options:
  - id: a
    text:
      es: "Por cuantía superior al importe de los créditos autorizados, salvo en caso de urgencia justificada."
  - id: b
    text:
      es: "Por cuantía superior al crédito disponible tras las modificaciones aprobadas en el trimestre."
  - id: c
    correct: true
    text:
      es: "Por cuantía superior al importe de los créditos autorizados en los estados de gastos."
  - id: d
    text:
      es: "Sin informe previo de la Intervención, aunque el crédito autorizado sea suficiente."
  explanation:
    es: "El artículo 46 LGP dice que los créditos para gastos son limitativos y que no podrán adquirirse compromisos de gasto ni obligaciones «por cuantía superior al importe de los créditos autorizados en los estados de gastos». Una excepción por urgencia contradice la consecuencia que fija el artículo: los actos que incumplan esa limitación son «nulos de pleno derecho». Medir el tope por el crédito disponible tras las modificaciones de un trimestre cambia la referencia del artículo, que es el importe de los créditos autorizados en los estados de gastos. Subordinar el compromiso a un informe previo de la Intervención cambia un límite de cuantía por un trámite."
  citation: "art. 46 LGP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-21614-art-43
- id: m05-l02-q031
  prompt:
    es: "Según el artículo 43.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en el presupuesto del Estado los créditos se especificarán:"
  options:
  - id: a
    text:
      es: "A nivel de artículo, salvo personal y bienes y servicios, a nivel de concepto, e inversiones reales, a nivel de capítulo."
  - id: b
    text:
      es: "A nivel de concepto, salvo personal e inversiones reales, a nivel de artículo, y bienes y servicios, a nivel de capítulo."
  - id: c
    correct: true
    text:
      es: "A nivel de concepto, salvo personal y bienes y servicios, a nivel de artículo, e inversiones reales, a nivel de capítulo."
  - id: d
    text:
      es: "A nivel de capítulo, salvo personal y bienes y servicios, a nivel de artículo, e inversiones reales, a nivel de concepto."
  explanation:
    es: "En el Estado la regla general es el concepto. Los gastos de personal y los gastos corrientes en bienes y servicios se especifican a nivel de artículo, y las inversiones reales a nivel de capítulo. Las otras tres opciones permutan los niveles: regla general de artículo, bienes y servicios a nivel de capítulo, o regla general de capítulo con inversiones a nivel de concepto."
  citation: "art. 43.1 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "estructura"
# anchor: boe-a-2003-21614-art-43
- id: m05-l02-q034
  prompt:
    es: "En el presupuesto del Estado, en el mismo programa, se agota el crédito del subconcepto 120.00 y queda crédito en el 130.00. ¿Puede atenderse el gasto con él sin modificación?"
  options:
  - id: a
    text:
      es: "Sí, porque los gastos de personal vinculan a nivel de capítulo y ambos son del capítulo 1."
  - id: b
    correct: true
    text:
      es: "No, porque los gastos de personal vinculan a nivel de artículo y son artículos distintos (12 y 13)."
  - id: c
    text:
      es: "Sí, porque en el Estado todos los créditos vinculan a nivel de concepto y ambos son de personal."
  - id: d
    text:
      es: "No, porque los gastos de personal vinculan a nivel de subconcepto, que es el nivel más desagregado."
  explanation:
    es: "En el Estado los gastos de personal se especifican a nivel de artículo (art. 43.1). El 120.00 es del artículo 12 y el 130.00 del 13, así que no pueden compensarse sin modificación. El nivel de capítulo es el de los organismos autónomos para el personal, no el del Estado; la regla general de concepto tiene excepción para el personal; y la vinculación a nivel de subconcepto no es la regla del Estado."
  citation: "art. 43.1 LGP"
  difficulty: 3
  tags:
  - "cómputo"
  - "requisito"
# anchor: boe-a-2003-21614-art-43
- id: m05-l02-q038
  prompt:
    es: "Según el artículo 43.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, se especificarán al nivel de su concreta clasificación económica, en el presupuesto del Estado, los créditos:"
  options:
  - id: a
    text:
      es: "Destinados a gastos de personal funcionario de los ministerios."
  - id: b
    text:
      es: "Destinados a las inversiones reales de cada programa."
  - id: c
    text:
      es: "Destinados a gastos corrientes en bienes y servicios de cualquier clase."
  - id: d
    correct: true
    text:
      es: "Destinados a arrendamientos de edificios y otras construcciones."
  explanation:
    es: "Los arrendamientos de edificios y otras construcciones figuran en el artículo 43.2.b). Los gastos de personal, las inversiones reales y los gastos corrientes en bienes y servicios tienen su regla propia en el artículo 43.1 (artículo, capítulo y artículo)."
  citation: "art. 43.2 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2003-21614-art-43
- id: m05-l02-q039
  prompt:
    es: "¿Qué crédito se especifica a su concreta clasificación económica en el presupuesto del Estado y no figura así en el de los organismos autónomos, según los artículos 43.2 y 44.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Los destinados a atenciones protocolarias y representativas."
  - id: b
    text:
      es: "Los destinados a arrendamientos de edificios y otras construcciones."
  - id: c
    text:
      es: "Los créditos extraordinarios concedidos durante el ejercicio."
  - id: d
    correct: true
    text:
      es: "Los destinados a gastos reservados de los ministerios."
  explanation:
    es: "El artículo 43.2.a) incluye los gastos reservados junto a las atenciones protocolarias y representativas; el artículo 44.2.a) solo las atenciones protocolarias y representativas. Los arrendamientos de edificios y los créditos extraordinarios están en las dos listas."
  citation: "arts. 43.2 y 44.2 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2003-21614-art-43
- id: m05-l02-q040
  prompt:
    es: "Según los artículos 43.2 y 44.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, se especifican al nivel de su concreta clasificación económica los créditos que establezcan asignaciones identificando perceptor o beneficiario, con excepción de:"
  options:
  - id: a
    text:
      es: "Los destinados a atender transferencias corrientes o de capital a las Comunidades Autónomas."
  - id: b
    correct: true
    text:
      es: "Los destinados a atender transferencias corrientes o de capital al exterior."
  - id: c
    text:
      es: "Los destinados a atender transferencias corrientes a organismos autónomos."
  - id: d
    text:
      es: "Los destinados a atender subvenciones corrientes a familias e instituciones."
  explanation:
    es: "La excepción del artículo 43.2.d) son las asignaciones destinadas a transferencias corrientes o de capital al exterior. Las transferencias a Comunidades Autónomas, a organismos autónomos o a familias, si identifican perceptor, se especifican a su nivel concreto."
  citation: "arts. 43.2 y 44.2 LGP"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2003-21614-art-43
- id: m05-l02-q041
  prompt:
    es: "Entre los créditos que los artículos 43.2 y 44.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria especifican a su concreta clasificación económica, ¿qué clase de crédito concedido durante el ejercicio figura en esa lista?"
  options:
  - id: a
    text:
      es: "Los suplementos de crédito que se concedan en el ejercicio."
  - id: b
    correct: true
    text:
      es: "Los créditos extraordinarios que se concedan en el ejercicio."
  - id: c
    text:
      es: "Los créditos generados que se concedan en el ejercicio."
  - id: d
    text:
      es: "Los créditos incorporados que se concedan en el ejercicio."
  explanation:
    es: "La letra f) de los dos artículos recoge los créditos extraordinarios que se concedan durante el ejercicio. No cita los suplementos, las generaciones, las incorporaciones ni las transferencias. Las ampliaciones solo cuentan cuando el crédito esté declarado ampliable, que es la letra c), no una concesión durante el ejercicio."
  citation: "arts. 43.2 y 44.2 LGP"
  difficulty: 2
  tags:
  - "requisito"
