# anchor: boe-a-2015-10566-art-38
- id: m02-l03-q017
  prompt:
    es: "De acuerdo con el artículo 38.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la titularidad de la sede electrónica corresponde:"
  options:
  - id: a
    text:
      es: "Exclusivamente a la Administración General del Estado, que la gestiona a través del Punto de Acceso General de cada departamento."
  - id: b
    text:
      es: "A una Administración Pública, sin que puedan ser titulares de una sede los organismos públicos ni las entidades de Derecho Público."
  - id: c
    text:
      es: "Al órgano que gestiona sus servicios, aunque no tenga competencias sobre los procedimientos que se tramitan a través de ella."
  - id: d
    correct: true
    text:
      es: "A una Administración Pública, o bien a uno o varios organismos públicos o entidades de Derecho Público en el ejercicio de sus competencias."
  explanation:
    es: "El artículo 38.1 atribuye la titularidad «a una Administración Pública, o bien a una o varios organismos públicos o entidades de Derecho Público en el ejercicio de sus competencias». No la reserva a la Administración General del Estado. Tampoco excluye a los organismos públicos ni a las entidades de Derecho Público. La titularidad se vincula al ejercicio de las propias competencias, no a la mera gestión."
  citation: "art. 38.1 LRJSP"
  difficulty: 1
  tags:
  - "concepto"
  - "competencia"
# anchor: boe-a-2015-10566-art-38
- id: m02-l03-q018
  prompt:
    es: "¿Cuál de las siguientes afirmaciones se ajusta a la definición de sede electrónica que da la legislación de régimen jurídico del sector público?"
  options:
  - id: a
    correct: true
    text:
      es: "Es una dirección electrónica disponible para los ciudadanos a través de redes de telecomunicaciones."
  - id: b
    text:
      es: "Es una dirección electrónica accesible solo desde la red interna de la Administración titular."
  - id: c
    text:
      es: "Es una dirección electrónica cuya titularidad corresponde a un prestador privado de servicios de confianza."
  - id: d
    text:
      es: "Es la dirección de correo electrónico que el interesado comunica para recibir los avisos."
  explanation:
    es: "El artículo 38.1 LRJSP define la sede como la «dirección electrónica, disponible para los ciudadanos a través de redes de telecomunicaciones». No es una dirección de uso interno de la Administración. Su titular es una Administración u organismo público, no un prestador privado. El correo electrónico para avisos es otra cosa: el artículo 41.1 LPAC lo prevé para avisos, no como sede."
  citation: "art. 38.1 LRJSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-39
- id: m02-l03-q019
  prompt:
    es: "De acuerdo con el artículo 39 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, el portal de internet es el punto de acceso electrónico que permite el acceso a través de internet:"
  options:
  - id: a
    text:
      es: "A todos los trámites que requieran la identificación o firma de los interesados."
  - id: b
    correct: true
    text:
      es: "A la información publicada y, en su caso, a la sede electrónica correspondiente."
  - id: c
    text:
      es: "A las notificaciones puestas a disposición en la Dirección Electrónica Habilitada única."
  - id: d
    text:
      es: "Al área personalizada de los interesados y a sus comunicaciones y notificaciones."
  explanation:
    es: "El artículo 39 define el portal como el punto de acceso que permite el acceso «a la información publicada y, en su caso, a la sede electrónica correspondiente». Los trámites que requieren identificación o firma se hacen en la sede (art. 9.1 RD 203/2021). Las notificaciones se ponen a disposición en la Dirección Electrónica Habilitada única. El área personalizada es la Carpeta Ciudadana."
  citation: "art. 39 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-9
- id: m02-l03-q020
  prompt:
    es: "Según la normativa estatal de actuación por medios electrónicos, ¿qué actuaciones y trámites se realizan mediante la sede electrónica de una Administración Pública?"
  options:
  - id: a
    text:
      es: "Solo los procedimientos iniciados a solicitud del interesado que requieran su firma electrónica cualificada."
  - id: b
    text:
      es: "Solo los que no requieran la identificación de la Administración ni la identificación o firma de los interesados."
  - id: c
    correct: true
    text:
      es: "Todos los que requieran la identificación de la Administración y, en su caso, la identificación o firma de los interesados."
  - id: d
    text:
      es: "Solo la publicación de la información general de la Administración titular, sin trámites que exijan identificación."
  explanation:
    es: "El artículo 9.1 del Reglamento aprobado por el Real Decreto 203/2021 dice que mediante la sede «se realizarán todas las actuaciones y trámites» que requieran la identificación de la Administración y, en su caso, la identificación o firma de los interesados. No se limita a los procedimientos a solicitud del interesado ni a la firma cualificada. Los trámites que exigen identificación son justamente los suyos. La sola publicación de información es propia del portal."
  citation: "art. 9.1 RD 203/2021"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-6
- id: m02-l03-q022
  prompt:
    es: "De acuerdo con el artículo 6.1 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, en la Administración General del Estado la creación o supresión de portales se lleva a cabo:"
  options:
  - id: a
    text:
      es: "Por real decreto acordado en Consejo de Ministros, a propuesta de la persona titular del ministerio correspondiente."
  - id: b
    text:
      es: "Por resolución de la persona titular de la Subsecretaría del ministerio correspondiente."
  - id: c
    correct: true
    text:
      es: "Por orden de la persona titular del ministerio correspondiente o por resolución de la persona titular del órgano superior."
  - id: d
    text:
      es: "Por orden de la persona titular del ministerio correspondiente, sin que quepa la resolución de un órgano superior."
  explanation:
    es: "El artículo 6.1 dice que, en la Administración General del Estado, la creación o supresión de portales se hará «por orden de la persona titular del ministerio correspondiente o por resolución de la persona titular del órgano superior». No exige real decreto. No la atribuye a la Subsecretaría. La resolución del órgano superior sí está admitida."
  citation: "art. 6.1 RD 203/2021"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2021-5032-art-6
- id: m02-l03-q023
  prompt:
    es: "En el ámbito estatal, ¿qué informe requiere la creación de un nuevo portal de internet por un ministerio o por un organismo público?"
  options:
  - id: a
    text:
      es: "El informe favorable de la Abogacía del Estado en el departamento correspondiente."
  - id: b
    text:
      es: "El informe favorable de la Agencia Española de Protección de Datos."
  - id: c
    text:
      es: "El informe favorable de la Secretaría de Estado de Seguridad del Ministerio del Interior."
  - id: d
    correct: true
    text:
      es: "El informe favorable de la Comisión Ministerial de Administración Digital respectiva."
  explanation:
    es: "El artículo 6.1 del Reglamento aprobado por el Real Decreto 203/2021 dice que la creación «requerirá informe favorable de la Comisión Ministerial de Administración Digital respectiva» y posterior comunicación a dos ministerios. El precepto no pide informe de la Abogacía del Estado ni de la Agencia Española de Protección de Datos. El informe de la Secretaría de Estado de Seguridad aparece en el artículo 9.2.c) LPAC, para los sistemas de identificación."
  citation: "art. 6.1 RD 203/2021"
  difficulty: 2
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-2021-5032-art-6
- id: m02-l03-q024
  prompt:
    es: "Según el artículo 6.1 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, ¿qué requiere la supresión de un portal de internet en el ámbito estatal?"
  options:
  - id: a
    correct: true
    text:
      es: "La previa comunicación a los dos ministerios que el precepto designa."
  - id: b
    text:
      es: "El informe favorable de la Comisión Ministerial de Administración Digital y la comunicación posterior a dos ministerios."
  - id: c
    text:
      es: "La autorización previa del Consejo de Ministros, a propuesta del departamento afectado."
  - id: d
    text:
      es: "El informe previo y favorable de la Secretaría General de Administración Digital."
  explanation:
    es: "El artículo 6.1 dice que «la supresión de portales requerirá la previa comunicación» al Ministerio de Política Territorial y Función Pública y al Ministerio de Asuntos Económicos y Transformación Digital (hoy, en los dos casos, Ministerio para la Transformación Digital y de la Función Pública). El informe favorable de la Comisión Ministerial seguido de comunicación es lo que exige la creación, no la supresión. El precepto no pide autorización del Consejo de Ministros ni informe de la Secretaría General de Administración Digital."
  citation: "art. 6.1 RD 203/2021"
  difficulty: 3
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2021-5032-art-10
- id: m02-l03-q026
  prompt:
    es: "¿Qué consideración tiene una sede electrónica asociada que se crea, por razones técnicas y organizativas, a partir de otra sede electrónica?"
  options:
  - id: a
    text:
      es: "Tiene consideración de portal de internet de la sede principal."
  - id: b
    text:
      es: "Tiene consideración de sede electrónica solo a efectos de notificaciones."
  - id: c
    correct: true
    text:
      es: "Tiene consideración de sede electrónica a todos los efectos."
  - id: d
    text:
      es: "Tiene consideración de subsede sin efectos jurídicos propios."
  explanation:
    es: "El artículo 10.1 del Reglamento aprobado por el Real Decreto 203/2021 dice que «la sede electrónica asociada tendrá consideración de sede electrónica a todos los efectos». No es un portal. Su consideración de sede no se limita a las notificaciones, y no carece de efectos jurídicos propios."
  citation: "art. 10.1 RD 203/2021"
  difficulty: 2
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2018-12699-art-7
- id: m02-l03-q029
  prompt:
    es: "¿Cuál de las siguientes circunstancias permite, con carácter excepcional, exceptuar el cumplimiento de los requisitos de accesibilidad según el Real Decreto 1112/2018, de 7 de septiembre?"
  options:
  - id: a
    text:
      es: "La falta de prioridad o de tiempo de la entidad obligada para adaptar sus contenidos."
  - id: b
    correct: true
    text:
      es: "La carga desproporcionada que el cumplimiento pueda suponer para la entidad obligada."
  - id: c
    text:
      es: "La solicitud expresa de la persona usuaria a la que se dirige el contenido."
  - id: d
    text:
      es: "La autorización previa del Consejo de Ministros para cada sitio web concreto."
  explanation:
    es: "El artículo 7.1 permite exceptuar los requisitos, con carácter excepcional, «en atención a la carga desproporcionada que el cumplimiento de los requisitos de accesibilidad pueda suponer para la entidad obligada». El artículo 7.3 niega expresamente que la falta de prioridad o de tiempo permita apreciar esa excepción. El real decreto no la hace depender de una solicitud de la persona usuaria ni de una autorización del Consejo de Ministros."
  citation: "art. 7.1 RD 1112/2018"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2018-12699-art-15
- id: m02-l03-q037
  prompt:
    es: "En los sitios web del sector público, ¿cómo se accede a la declaración de accesibilidad?"
  options:
  - id: a
    correct: true
    text:
      es: "Desde todas las páginas del sitio, con un enlace denominado «Accesibilidad»."
  - id: b
    text:
      es: "Desde la página de inicio del sitio, con un enlace denominado «Aviso legal»."
  - id: c
    text:
      es: "Desde la sede electrónica, en el apartado de sugerencias y quejas."
  - id: d
    text:
      es: "Desde todas las páginas del sitio, con un enlace denominado «Ayuda»."
  explanation:
    es: "El artículo 15.1 del Real Decreto 1112/2018 dice que la declaración estará disponible «desde todas las páginas del sitio web con un enlace denominado «Accesibilidad»» o su equivalente en el idioma de la página. No basta con la página de inicio, y el enlace no se llama «Aviso legal» ni «Ayuda». Tampoco se remite al apartado de sugerencias y quejas de la sede."
  citation: "art. 15.1 RD 1112/2018"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2018-12699-art-16
- id: m02-l03-q038
  prompt:
    es: "En la Administración General del Estado, ¿en qué ámbito se designan las Unidades responsables de accesibilidad de los sitios web y aplicaciones móviles?"
  options:
  - id: a
    text:
      es: "En el ámbito de las Secretarías Generales Técnicas de cada Departamento."
  - id: b
    correct: true
    text:
      es: "En el ámbito de las Subsecretarías de cada Departamento."
  - id: c
    text:
      es: "En el ámbito de la Secretaría General de Administración Digital."
  - id: d
    text:
      es: "En el ámbito de las Delegaciones del Gobierno en cada comunidad."
  explanation:
    es: "El artículo 16.1 del Real Decreto 1112/2018 dice que en la Administración General del Estado las Unidades responsables «se designarán en el ámbito de las Subsecretarías de cada Departamento». No en las Secretarías Generales Técnicas, que dependen de la Subsecretaría. Tampoco en la Secretaría General de Administración Digital ni en las Delegaciones del Gobierno."
  citation: "art. 16.1 RD 1112/2018"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2021-5032-art-11
- id: m02-l03-q039
  prompt:
    es: "¿Cuál de los siguientes servicios debe ofrecer, como mínimo, toda sede electrónica o sede electrónica asociada?"
  options:
  - id: a
    text:
      es: "Un servicio de cita previa para la atención presencial en las oficinas."
  - id: b
    text:
      es: "Un servicio de chat en línea atendido por empleados públicos."
  - id: c
    text:
      es: "Un servicio de traducción automática a todas las lenguas cooficiales."
  - id: d
    correct: true
    text:
      es: "Un enlace para formular sugerencias y quejas ante los órganos competentes."
  explanation:
    es: "El artículo 11.2.b) del Reglamento aprobado por el Real Decreto 203/2021 incluye entre los servicios mínimos de toda sede «un enlace para la formulación de sugerencias y quejas ante los órganos que en cada caso resulten competentes». La cita previa, el chat en línea y la traducción automática no figuran en la lista de servicios mínimos del artículo 11.2."
  citation: "art. 11.2.b) RD 203/2021"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-43
- id: m02-l03-q040
  prompt:
    es: "¿Cuál de las siguientes formas de practicar las notificaciones por medios electrónicos recoge la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El envío del acto al correo electrónico que el interesado haya comunicado."
  - id: b
    correct: true
    text:
      es: "La comparecencia en la sede, la dirección electrónica habilitada única o ambos sistemas."
  - id: c
    text:
      es: "La comparecencia en la sede, solo si no existe dirección electrónica habilitada única."
  - id: d
    text:
      es: "El envío al dispositivo móvil del interesado de un mensaje con el contenido íntegro del acto."
  explanation:
    es: "El artículo 43.1 dice que las notificaciones electrónicas se practicarán «mediante comparecencia en la sede electrónica de la Administración u Organismo actuante, a través de la dirección electrónica habilitada única o mediante ambos sistemas». El correo electrónico y el dispositivo móvil que comunica el interesado sirven para los avisos, «pero no para la práctica de notificaciones» (art. 41.1). La comparecencia en sede no está condicionada a que falte la dirección habilitada."
  citation: "art. 43.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-43
- id: m02-l03-q041
  prompt:
    es: "De acuerdo con el artículo 43.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la notificación electrónica obligatoria, o elegida expresamente por el interesado, se entenderá rechazada cuando hayan transcurrido:"
  options:
  - id: a
    text:
      es: "Diez días hábiles desde su puesta a disposición sin que se acceda a su contenido."
  - id: b
    text:
      es: "Quince días naturales desde su puesta a disposición sin que se acceda a su contenido."
  - id: c
    correct: true
    text:
      es: "Diez días naturales desde su puesta a disposición sin que se acceda a su contenido."
  - id: d
    text:
      es: "Diez días naturales desde el envío del aviso sin que se acceda a su contenido."
  explanation:
    es: "El artículo 43.2 fija el rechazo cuando «hayan transcurrido diez días naturales desde la puesta a disposición de la notificación sin que se acceda a su contenido». Los días son naturales, no hábiles, y son diez, no quince. El plazo se cuenta desde la puesta a disposición, no desde el aviso."
  citation: "art. 43.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-10565-art-43
- id: m02-l03-q042
  prompt:
    es: "Cuando una Administración practica una notificación por medios electrónicos, ¿en qué momento se entiende practicada esa notificación?"
  options:
  - id: a
    text:
      es: "En el momento de su puesta a disposición en la sede electrónica."
  - id: b
    text:
      es: "En el momento en que se envía el aviso al dispositivo del interesado."
  - id: c
    text:
      es: "Al día siguiente de su puesta a disposición en la dirección habilitada."
  - id: d
    correct: true
    text:
      es: "En el momento en que se produzca el acceso a su contenido."
  explanation:
    es: "El artículo 43.2 LPAC dice que las notificaciones electrónicas «se entenderán practicadas en el momento en que se produzca el acceso a su contenido». La puesta a disposición abre el plazo de diez días para el rechazo, pero no practica la notificación. El aviso no la practica tampoco. El precepto no fija el día siguiente a la puesta a disposición."
  citation: "art. 43.2 LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2021-5032-art-42
- id: m02-l03-q043
  prompt:
    es: "Según el artículo 42.5 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, ¿a través de qué se pone a disposición del interesado toda notificación cuyo emisor pertenezca al ámbito estatal?"
  options:
  - id: a
    correct: true
    text:
      es: "A través de la Dirección Electrónica Habilitada única."
  - id: b
    text:
      es: "A través de la sede del órgano emisor, exclusivamente."
  - id: c
    text:
      es: "A través de la Carpeta Ciudadana, exclusivamente."
  - id: d
    text:
      es: "A través del correo electrónico comunicado por el interesado."
  explanation:
    es: "El artículo 42.5 dice que toda notificación de un emisor estatal «se pondrá a disposición del interesado a través de la Dirección Electrónica Habilitada única». La sede del emisor solo puede usarse de forma complementaria, no exclusiva. La Carpeta Ciudadana da acceso a las notificaciones, pero no es el medio de puesta a disposición. El correo electrónico sirve para avisos."
  citation: "art. 42.5 RD 203/2021"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2021-5032-art-40
- id: m02-l03-q044
  prompt:
    es: "De acuerdo con el artículo 40.3 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, las oficinas de asistencia en materia de registros hacen la identificación o firma electrónica del interesado no obligado:"
  options:
  - id: a
    text:
      es: "En cualquier procedimiento administrativo, sin necesidad de habilitación previa."
  - id: b
    correct: true
    text:
      es: "En los procedimientos administrativos para los que se haya previsto habilitación."
  - id: c
    text:
      es: "Solo en los procedimientos iniciados de oficio por la propia oficina."
  - id: d
    text:
      es: "Solo cuando el interesado actúe por medio de un representante."
  explanation:
    es: "La letra f) del artículo 40.3 atribuye a las oficinas la identificación o firma del interesado no obligado «en los procedimientos administrativos para los que se haya previsto habilitación». No alcanza a cualquier procedimiento sin habilitación. No se limita a los procedimientos de oficio. No depende de que el interesado actúe por representante."
  citation: "art. 40.3.f) RD 203/2021"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2021-5032-art-40
- id: m02-l03-q045
  prompt:
    es: "Según el artículo 40.3.a) del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, ¿qué escritos en papel digitalizan las oficinas de asistencia en materia de registros?"
  options:
  - id: a
    text:
      es: "Solo los que se dirijan a órganos y organismos públicos de la Administración General del Estado."
  - id: b
    text:
      es: "Solo los que se dirijan al departamento ministerial del que dependa la propia oficina."
  - id: c
    correct: true
    text:
      es: "Los que se dirijan a cualquier órgano, organismo o entidad de cualquier Administración Pública."
  - id: d
    text:
      es: "Solo los dirigidos a la Administración General del Estado o a la de la comunidad autónoma."
  explanation:
    es: "La letra a) del artículo 40.3 encarga a las oficinas la digitalización de los escritos en papel que «se dirijan a cualquier órgano, organismo público o entidad de derecho público de cualquier Administración Pública». No se limita a la Administración General del Estado ni al departamento del que dependa la oficina. Tampoco a la Administración estatal y a la de la comunidad autónoma."
  citation: "art. 40.3.a) RD 203/2021"
  difficulty: 2
  tags:
  - "competencia"
