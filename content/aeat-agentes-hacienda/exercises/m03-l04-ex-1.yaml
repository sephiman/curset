# anchor: boe-a-2003-23186-art-29
- id: m03-l04-q0134
  prompt:
    es: "De acuerdo con el artículo 29.2.d) de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando la obligación de llevar y conservar libros y registros se cumpla con sistemas informáticos, se debe facilitar la conversión de los datos a formato legible si la lectura o interpretación no fuera posible por:"
  options:
  - id: a
    text:
      es: "haber transcurrido más de cuatro años desde su generación."
  - id: b
    text:
      es: "encontrarse almacenados fuera del territorio español."
  - id: c
    text:
      es: "haberse extraviado el soporte original que los contenía."
  - id: d
    correct: true
    text:
      es: "estar encriptados o codificados."
  explanation:
    es: "El artículo 29.2.d) exige facilitar la conversión a formato legible cuando los datos no pudieran leerse o interpretarse por estar encriptados o codificados. El paso del tiempo, el almacenamiento fuera de España y el extravío del soporte no son causas que prevea el precepto."
  citation: "art. 29.2 LGT"
  difficulty: 1
  tags:
  - "condición"
  - "requisito"
# anchor: boe-a-2003-23186-art-29
- id: m03-l04-q0137
  prompt:
    es: "Según el artículo 29.2.h) de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué obligación formal tiene quien practica retenciones o ingresos a cuenta respecto de los perceptores de las rentas?"
  options:
  - id: a
    text:
      es: "Presentar ante la Administración tributaria un resumen anual de las retenciones practicadas, sin entregar certificado."
  - id: b
    text:
      es: "Comunicarles previamente su número de identificación fiscal antes de practicar la retención."
  - id: c
    text:
      es: "Conservar los justificantes de las retenciones durante seis años desde el último asiento."
  - id: d
    correct: true
    text:
      es: "Entregarles un certificado de las retenciones o ingresos a cuenta practicados."
  explanation:
    es: "El artículo 29.2.h) obliga a entregar un certificado de las retenciones o ingresos a cuenta practicados a los obligados tributarios perceptores de las rentas. La comunicación del número fiscal a las entidades de crédito es otra obligación (disposición adicional sexta), y los seis años son el plazo mercantil de conservación de libros, sin relación con el certificado."
  citation: "art. 29.2 LGT"
  difficulty: 2
  tags:
  - "requisito"
  - "sujeto"
# anchor: boe-a-2003-23186-art-29
- id: m03-l04-q0139
  prompt:
    es: "De acuerdo con el artículo 29.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las disposiciones reglamentarias determinan en particular los casos en los que la aportación o llevanza de los libros registro se debe efectuar:"
  options:
  - id: a
    text:
      es: "de forma anual y en soporte papel."
  - id: b
    text:
      es: "a requerimiento de la Administración y ante el órgano competente de inspección."
  - id: c
    correct: true
    text:
      es: "de forma periódica y por medios telemáticos."
  - id: d
    text:
      es: "en el domicilio fiscal del obligado y en presencia de la Administración."
  explanation:
    es: "El artículo 29.3 encomienda a los reglamentos determinar los casos en que la aportación o llevanza de los libros registro deba hacerse de forma periódica y por medios telemáticos. El soporte papel, el requerimiento previo ante la inspección o la presencia de la Administración en el domicilio no son la modalidad que describe."
  citation: "art. 29.3 LGT"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-23186-art-29
- id: m03-l04-q0140
  prompt:
    es: "¿Qué obligación formal establece la Ley 58/2003, de 17 de diciembre, General Tributaria, en el artículo 29.2.g), con relación a las actuaciones de la Administración tributaria que se desarrollan frente al obligado?"
  options:
  - id: a
    text:
      es: "La de comunicar a la Administración tributaria las inspecciones que el obligado haya sufrido en otros Estados."
  - id: b
    text:
      es: "La de abonar los gastos que ocasione la práctica de inspecciones y comprobaciones administrativas."
  - id: c
    text:
      es: "La de solicitar autorización previa para el cambio de domicilio durante la inspección."
  - id: d
    correct: true
    text:
      es: "La de facilitar la práctica de inspecciones y comprobaciones administrativas."
  explanation:
    es: "El artículo 29.2.g) impone facilitar la práctica de inspecciones y comprobaciones administrativas. No exige comunicar inspecciones de otros Estados, no obliga a pagar los gastos de la actuación, y no contiene la obligación de pedir autorización para cambiar de domicilio."
  citation: "art. 29.2 LGT"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2003-23186-art-29
- id: m03-l04-q0141
  prompt:
    es: "¿Cuál de las siguientes NO es una obligación tributaria formal de las que enumera el artículo 29.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Ingresar la cuota tributaria en el plazo establecido."
  - id: b
    text:
      es: "Presentar declaraciones, autoliquidaciones y comunicaciones."
  - id: c
    text:
      es: "Expedir y entregar facturas o documentos sustitutivos."
  - id: d
    text:
      es: "Llevar y conservar libros de contabilidad y registros."
  explanation:
    es: "Ingresar la cuota es una obligación de carácter pecuniario, y el artículo 29.1 define las formales como las que no tienen carácter pecuniario. Presentar declaraciones, expedir facturas y llevar libros y registros son obligaciones formales del artículo 29.2, letras c), e) y d)."
  citation: "art. 29.2 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "requisito"
# anchor: boe-a-2003-23186-art-29
- id: m03-l04-q0142
  prompt:
    es: "¿Qué obligación formal recoge, en su artículo 29.2.c), la Ley 58/2003, de 17 de diciembre, General Tributaria, para que los obligados tributarios cumplan con la Administración tributaria sus deberes de comunicación periódica de datos?"
  options:
  - id: a
    text:
      es: "La de presentar únicamente declaraciones, con exclusión de las autoliquidaciones y comunicaciones."
  - id: b
    correct: true
    text:
      es: "La de presentar declaraciones, autoliquidaciones y comunicaciones."
  - id: c
    text:
      es: "La de presentar declaraciones cuando lo requiera expresamente la Administración tributaria."
  - id: d
    text:
      es: "La de presentar autoliquidaciones solo por medios telemáticos."
  explanation:
    es: "El artículo 29.2.c) enumera tres cosas: declaraciones, autoliquidaciones y comunicaciones. No limita la obligación a las declaraciones, no la supedita a un requerimiento expreso ni la restringe a los medios telemáticos."
  citation: "art. 29.2 LGT"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2003-23186-art-29
- id: m03-l04-q0261
  prompt:
    es: "De acuerdo con el artículo 29.2.a) de la Ley 58/2003, de 17 de diciembre, General Tributaria, los obligados tributarios deben presentar declaraciones censales cuando desarrollen o vayan a desarrollar en territorio español actividades u operaciones empresariales y profesionales o:"
  options:
  - id: a
    correct: true
    text:
      es: "satisfagan rendimientos sujetos a retención."
  - id: b
    text:
      es: "perciban rendimientos sujetos a retención o ingreso a cuenta."
  - id: c
    text:
      es: "sean titulares de bienes inmuebles sujetos al impuesto local correspondiente."
  - id: d
    text:
      es: "tengan la condición de contribuyentes del Impuesto sobre la Renta de las Personas Físicas."
  explanation:
    es: "La letra a) del artículo 29.2 impone la declaración censal a quien desarrolla o va a desarrollar actividades u operaciones empresariales y profesionales y a quien satisface rendimientos sujetos a retención, es decir, al retenedor. El perceptor de esos rendimientos no figura en la letra. Ser titular de un inmueble o contribuyente del IRPF tampoco obliga por sí solo a presentar declaraciones censales."
  citation: "art. 29.2 LGT"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-29
- id: m03-l04-q0263
  prompt:
    es: "Según el artículo 29.2.j) de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿sobre quiénes recae la obligación de que los sistemas y programas informáticos o electrónicos que soporten los procesos contables, de facturación o de gestión garanticen la integridad y demás cualidades de los registros?"
  options:
  - id: a
    text:
      es: "Solo sobre los usuarios que desarrollen actividades económicas, no sobre los productores."
  - id: b
    text:
      es: "Solo sobre los productores y comercializadores, no sobre los usuarios."
  - id: c
    correct: true
    text:
      es: "Sobre los productores, comercializadores y usuarios de esos sistemas y programas."
  - id: d
    text:
      es: "Sobre la Administración tributaria, que debe homologar cada programa antes de su uso."
  explanation:
    es: "La letra j) reparte la obligación entre productores, comercializadores y usuarios de los sistemas. Limitarla a los usuarios o dejar fuera a los usuarios contradice esa enumeración. La Administración tributaria no figura como obligada ni como órgano que homologue los programas."
  citation: "art. 29.2 LGT"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-31
- id: m03-l04-q0149
  prompt:
    es: "De acuerdo con el artículo 31.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, son devoluciones derivadas de la normativa de cada tributo las correspondientes a cantidades:"
  options:
  - id: a
    text:
      es: "ingresadas indebidamente en el Tesoro Público con ocasión del pago de sanciones tributarias."
  - id: b
    text:
      es: "abonadas para suspender la ejecución de un acto cuya anulación se solicita."
  - id: c
    text:
      es: "ingresadas en exceso por error material o aritmético de la Administración."
  - id: d
    correct: true
    text:
      es: "ingresadas o soportadas debidamente como consecuencia de la aplicación del tributo."
  explanation:
    es: "Las devoluciones del artículo 31.1 corresponden a cantidades ingresadas o soportadas debidamente por aplicar el tributo, como en el IVA o el IRPF. Los ingresos indebidos son otra figura (art. 32), el coste de las garantías también (art. 33), y el error de la Administración no define este concepto."
  citation: "art. 31.1 LGT"
  difficulty: 2
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-31
- id: m03-l04-q0301
  prompt:
    es: "De acuerdo con el artículo 31.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, transcurrido el plazo fijado en las normas de cada tributo y, en todo caso, el plazo de:"
  options:
  - id: a
    text:
      es: "tres meses sin que se hubiera ordenado el pago de la devolución por causa imputable a la Administración, esta abona el interés de demora sin necesidad de solicitud."
  - id: b
    text:
      es: "doce meses sin que se hubiera ordenado el pago de la devolución por causa imputable a la Administración, esta abona el interés de demora sin necesidad de solicitud."
  - id: c
    text:
      es: "dieciocho meses sin que se hubiera ordenado el pago de la devolución por causa imputable a la Administración, esta abona el interés de demora sin necesidad de solicitud."
  - id: d
    correct: true
    text:
      es: "seis meses sin que se hubiera ordenado el pago de la devolución por causa imputable a la Administración, esta abona el interés de demora sin necesidad de solicitud."
  explanation:
    es: "El artículo 31.2 fija como límite máximo seis meses desde el plazo de cada tributo. Pasado ese tiempo sin ordenar el pago por causa imputable a la Administración, esta abona el interés de demora del artículo 26 sin que el obligado lo pida. Tres, doce y dieciocho meses no son el plazo del artículo."
  citation: "art. 31.2 LGT"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2009-19438-art-4
- id: m03-l04-q0029
  prompt:
    es: "De acuerdo con el artículo 4.1 del Real Decreto 1676/2009, de 13 de noviembre, por el que se regula el Consejo para la Defensa del Contribuyente, el Consejo para la Defensa del Contribuyente está formado por:"
  options:
  - id: a
    text:
      es: "doce vocales, ocho de ellos representantes de los sectores profesionales y académicos relacionados con el ámbito tributario y de la sociedad en general."
  - id: b
    correct: true
    text:
      es: "dieciséis vocales, ocho de ellos representantes de los sectores profesionales y académicos relacionados con el ámbito tributario y de la sociedad en general."
  - id: c
    text:
      es: "dieciséis vocales, cuatro de ellos representantes de los sectores profesionales y académicos relacionados con el ámbito tributario y de la sociedad en general."
  - id: d
    text:
      es: "veinte vocales, ocho de ellos representantes de los sectores profesionales y académicos relacionados con el ámbito tributario y de la sociedad en general."
  explanation:
    es: "El artículo 4.1 fija dieciséis vocales, y entre ellos ocho representan a los sectores profesionales y académicos del ámbito tributario y de la sociedad en general. Doce y veinte alteran el total, y cuatro es el número de vocales que representa a la Agencia Estatal de Administración Tributaria, no a los sectores profesionales."
  citation: "art. 4.1 RD 1676/2009"
  difficulty: 2
  tags:
  - "cantidad"
  - "órgano"
# anchor: boe-a-2003-23186-art-34
- id: m03-l04-q0030
  prompt:
    es: "Según el artículo 34.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en qué ministerio está integrado el Consejo para la Defensa del Contribuyente, que vela por la efectividad de los derechos de los obligados tributarios?"
  options:
  - id: a
    text:
      es: "En el Ministerio de Justicia."
  - id: b
    text:
      es: "En el Ministerio de la Presidencia."
  - id: c
    correct: true
    text:
      es: "En el Ministerio de Hacienda."
  - id: d
    text:
      es: "En el Ministerio de Asuntos Económicos."
  explanation:
    es: "El artículo 34.2 integra el Consejo en el Ministerio de Hacienda y le encomienda velar por la efectividad de los derechos de los obligados tributarios, atender las quejas por la aplicación del sistema tributario y hacer sugerencias y propuestas. Los otros departamentos no figuran en el precepto."
  citation: "art. 34.2 LGT"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2003-23186-art-34
- id: m03-l04-q0151
  prompt:
    es: "De acuerdo con el artículo 34.1.b) de la Ley 58/2003, de 17 de diciembre, General Tributaria, los obligados tributarios tienen derecho a obtener las devoluciones que procedan, con abono del interés de demora del artículo 26:"
  options:
  - id: a
    text:
      es: "siempre que lo hayan solicitado por escrito."
  - id: b
    text:
      es: "previo requerimiento a la Administración tributaria."
  - id: c
    correct: true
    text:
      es: "sin necesidad de efectuar requerimiento al efecto."
  - id: d
    text:
      es: "siempre que acrediten el pago previo de la deuda."
  explanation:
    es: "El artículo 34.1.b) reconoce el derecho a obtener las devoluciones, con abono del interés de demora, sin necesidad de efectuar requerimiento al efecto. No exige solicitud escrita, requerimiento previo ni acreditar un pago previo de la deuda."
  citation: "art. 34.1 LGT"
  difficulty: 1
  tags:
  - "condición"
  - "efecto"
# anchor: boe-a-2003-23186-art-34
- id: m03-l04-q0154
  prompt:
    es: "De acuerdo con el artículo 34.1.g) de la Ley 58/2003, de 17 de diciembre, General Tributaria, los obligados tributarios tienen derecho a obtener copia sellada de los documentos presentados ante la Administración, siempre que:"
  options:
  - id: a
    text:
      es: "la soliciten en el plazo de diez días desde su presentación."
  - id: b
    correct: true
    text:
      es: "la aporten junto a los originales para su cotejo."
  - id: c
    text:
      es: "la Administración tributaria considere que no obrarán en el expediente."
  - id: d
    text:
      es: "abonen el coste de la reproducción de los documentos."
  explanation:
    es: "El artículo 34.1.g) condiciona la copia sellada a que el obligado aporte la copia junto con los originales para su cotejo, y reconoce además la devolución de los originales si no deben obrar en el expediente. No exige solicitarla en diez días ni pagar el coste, y la decisión sobre el expediente no depende de la apreciación de la Administración."
  citation: "art. 34.1 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "requisito"
# anchor: boe-a-2003-23186-art-34
- id: m03-l04-q0155
  prompt:
    es: "¿En qué condición reconoce el artículo 34.1.h) de la Ley 58/2003, de 17 de diciembre, General Tributaria el derecho de los obligados tributarios a no aportar documentos ya presentados por ellos mismos que estén en poder de la Administración actuante?"
  options:
  - id: a
    text:
      es: "Siempre que el obligado aporte copia sellada de su presentación."
  - id: b
    text:
      es: "Siempre que hubieran sido presentados en el mismo ejercicio."
  - id: c
    text:
      es: "Siempre que el obligado lo solicite a la Administración por escrito y con firma legitimada."
  - id: d
    correct: true
    text:
      es: "Siempre que el obligado indique el día y procedimiento en el que los presentó."
  explanation:
    es: "El derecho de la letra h) solo exige indicar el día y el procedimiento en que se presentaron los documentos. No requiere copia sellada, ni que se presentaran en el mismo ejercicio, ni una solicitud escrita."
  citation: "art. 34.1 LGT"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-34
- id: m03-l04-q0157
  prompt:
    es: "De acuerdo con el artículo 34.1.e) de la Ley 58/2003, de 17 de diciembre, General Tributaria, los obligados tributarios tienen derecho a conocer el estado de tramitación:"
  options:
  - id: a
    correct: true
    text:
      es: "de los procedimientos en los que sean parte."
  - id: b
    text:
      es: "de cualquier procedimiento tributario que afecte a sus bienes."
  - id: c
    text:
      es: "de los procedimientos en que sean parte, pero solo tras su resolución."
  - id: d
    text:
      es: "de los procedimientos de inspección en los que figuren como interesados."
  explanation:
    es: "El artículo 34.1.e) reconoce el derecho a conocer el estado de tramitación de los procedimientos en los que se sea parte. No alcanza a cualquier procedimiento que afecte a sus bienes sin ser parte, no se limita al momento posterior a la resolución y no se restringe a los de inspección."
  citation: "art. 34.1 LGT"
  difficulty: 1
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-34
- id: m03-l04-q0159
  prompt:
    es: "¿Qué trato reconoce el artículo 34.1.j) de la Ley 58/2003, de 17 de diciembre, General Tributaria, a los obligados tributarios por parte del personal al servicio de la Administración tributaria?"
  options:
  - id: a
    text:
      es: "La atención preferente en los procedimientos en los que sean parte."
  - id: b
    text:
      es: "La atención personalizada por un único funcionario durante todo el procedimiento."
  - id: c
    correct: true
    text:
      es: "El debido respeto y consideración."
  - id: d
    text:
      es: "La atención presencial en cualquier oficina de la Administración tributaria."
  explanation:
    es: "La letra j) del artículo 34.1 reconoce el derecho a ser tratado con el debido respeto y consideración por el personal de la Administración. No incluye atención preferente, funcionario único ni atención presencial en cualquier oficina."
  citation: "art. 34.1 LGT"
  difficulty: 1
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-34
- id: m03-l04-q0160
  prompt:
    es: "De acuerdo con el artículo 34.1.k) de la Ley 58/2003, de 17 de diciembre, General Tributaria, los obligados tributarios tienen derecho a que las actuaciones de la Administración que requieran su intervención se lleven a cabo en la forma que le resulte menos gravosa, siempre que ello no perjudique:"
  options:
  - id: a
    text:
      es: "el desarrollo normal del procedimiento tributario."
  - id: b
    text:
      es: "los derechos de terceros afectados por la actuación."
  - id: c
    text:
      es: "el cumplimiento de los plazos del procedimiento."
  - id: d
    correct: true
    text:
      es: "el cumplimiento de sus obligaciones tributarias."
  explanation:
    es: "El artículo 34.1.k) condiciona la forma menos gravosa a que no perjudique el cumplimiento de las obligaciones tributarias del obligado. El desarrollo del procedimiento, los terceros y los plazos no son el límite que fija la letra."
  citation: "art. 34.1 LGT"
  difficulty: 1
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-34
- id: m03-l04-q0163
  prompt:
    es: "¿Sobre qué tiene derecho a ser informado el obligado tributario, según el artículo 34.1.n) de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Sobre los valores de los bienes inmuebles que haya adquirido o transmitido en los últimos cuatro años."
  - id: b
    text:
      es: "Sobre los valores de todos los bienes y derechos que integren su patrimonio."
  - id: c
    text:
      es: "Sobre los valores de los bienes inmuebles de otros obligados tributarios que le afecten."
  - id: d
    correct: true
    text:
      es: "Sobre los valores de los bienes inmuebles que vayan a ser objeto de adquisición o transmisión."
  explanation:
    es: "La letra n) reconoce el derecho a ser informado de los valores de los bienes inmuebles que vayan a adquirirse o transmitirse. No se refiere a los adquiridos en un período anterior, a todo el patrimonio ni a bienes de otros obligados."
  citation: "art. 34.1 LGT"
  difficulty: 2
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-34
- id: m03-l04-q0165
  prompt:
    es: "¿Qué derecho reconoce a los obligados tributarios el artículo 34.1.o) de la Ley 58/2003, de 17 de diciembre, General Tributaria, en relación con los beneficios o regímenes fiscales?"
  options:
  - id: a
    text:
      es: "El derecho a optar libremente por el régimen fiscal más favorable, aunque no resulte aplicable."
  - id: b
    text:
