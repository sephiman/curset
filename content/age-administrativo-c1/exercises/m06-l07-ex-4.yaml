# anchor: fuente-ms-outlook-categorias-html
- id: m06-l07-q122
  prompt:
    es: "En Outlook 365 clásico, una categoría tiene asignada una tecla de método abreviado. ¿Qué se puede hacer con ella, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Asignar la categoría solo a todos los elementos de la carpeta a la vez"
  - id: b
    correct: true
    text:
      es: "Asignar la categoría a un elemento seleccionado o a varios a la vez"
  - id: c
    text:
      es: "Asignar la categoría solo a los mensajes que se están redactando"
  - id: d
    text:
      es: "Asignar la categoría solo a un elemento abierto, uno cada vez"
  explanation:
    es: "La tecla de método abreviado asigna la categoría al elemento seleccionado en la Bandeja de entrada u otra vista, y sirve también para varios elementos a la vez. No exige abrir el elemento, no se limita a la carpeta entera y no es solo para mensajes en redacción."
  citation: "fuente: `ms-outlook-categorias.html`; «Asignar una tecla de método abreviado a una categoría en Outlook clásico»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-categorias-html
- id: m06-l07-q123
  prompt:
    es: "En Outlook 365 clásico, ¿en qué lista del cuadro Categorías de color se elige el método abreviado de teclado de una categoría?"
  options:
  - id: a
    text:
      es: "Color"
  - id: b
    text:
      es: "Clic rápido"
  - id: c
    text:
      es: "Nombre"
  - id: d
    correct: true
    text:
      es: "Tecla de método abreviado"
  explanation:
    es: "En el cuadro Categorías de color se marca la categoría en la lista Nombre y el método abreviado se elige en la lista Tecla de método abreviado. Nombre es la lista de categorías, y sirve para cambiar el nombre. Color sirve para elegir el color de la categoría. Clic rápido es la categoría predeterminada de ciertas vistas de tabla."
  citation: "fuente: `ms-outlook-categorias.html`; «Asignar una tecla de método abreviado a una categoría en Outlook clásico»"
  difficulty: 3
  tags:
