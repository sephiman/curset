# anchor: boe-a-1998-16718-art-25
- id: m01-l11-q072
  prompt:
    es: "De acuerdo con el artículo 25.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, el recurso contencioso-administrativo es admisible contra las disposiciones generales y contra los actos expresos y presuntos que:"
  options:
  - id: a
    correct: true
    text:
      es: "Pongan fin a la vía administrativa, sean definitivos o de trámite en los casos que la ley señala."
  - id: b
    text:
      es: "Sean definitivos, aunque no pongan fin a la vía administrativa, y nunca contra los de trámite."
  - id: c
    text:
      es: "Pongan fin a la vía administrativa, solo si son definitivos y nunca si son actos de trámite."
  - id: d
    text:
      es: "Hayan sido recurridos antes en reposición, sean definitivos o de trámite, en cualquier caso y materia."
  explanation:
    es: "El artículo 25.1 admite el recurso contra los actos «que pongan fin a la vía administrativa, ya sean definitivos o de trámite», estos últimos cuando deciden el fondo, impiden continuar el procedimiento o producen indefensión o perjuicio irreparable. Un acto que no agota la vía no es impugnable, aunque sea definitivo. Los actos de trámite cualificados sí lo son. La reposición previa es potestativa (art. 123.1 LPAC), no un requisito."
  citation: "art. 25.1 LJCA"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1998-16718-art-25
- id: m01-l11-q073
  prompt:
    es: "¿Cuál de los siguientes actos de trámite, que pone fin a la vía administrativa, admite recurso contencioso-administrativo según el artículo 25.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa?"
  options:
  - id: a
    text:
      es: "El que acuerda abrir un período de prueba, sin decidir el fondo del asunto planteado."
  - id: b
    text:
      es: "El que solicita un informe preceptivo y no impide continuar con el procedimiento."
  - id: c
    text:
      es: "El que concede al interesado un trámite de audiencia de diez días."
  - id: d
    correct: true
    text:
      es: "El que produce indefensión o perjuicio irreparable a derechos o intereses legítimos."
  explanation:
    es: "El artículo 25.1 admite el recurso contra los actos de trámite que «deciden directa o indirectamente el fondo del asunto, determinan la imposibilidad de continuar el procedimiento, producen indefensión o perjuicio irreparable a derechos o intereses legítimos». Abrir un período de prueba, pedir un informe o conceder audiencia no encajan en ninguno de esos supuestos: su oposición se alega al recurrir la resolución final."
  citation: "art. 25.1 LJCA"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1998-16718-art-25
- id: m01-l11-q074
  prompt:
    es: "Además de las disposiciones generales y de los actos, ¿contra qué otras actuaciones de la Administración es admisible el recurso contencioso-administrativo?"
  options:
  - id: a
    correct: true
    text:
      es: "Contra su inactividad y contra sus actuaciones materiales que constituyan vía de hecho."
  - id: b
    text:
      es: "Contra su inactividad, pero no contra sus actuaciones materiales constitutivas de vía de hecho."
  - id: c
    text:
      es: "Contra sus actuaciones materiales constitutivas de vía de hecho, pero no contra su inactividad."
  - id: d
    text:
      es: "Contra los actos que reproducen otros anteriores definitivos y firmes."
  explanation:
    es: "El artículo 25.2 de la Ley 29/1998 dice que «también es admisible el recurso contra la inactividad de la Administración y contra sus actuaciones materiales que constituyan vía de hecho». Las dos vías caben, así que las opciones que excluyen una u otra son incorrectas. Los actos que reproducen otros definitivos y firmes no son impugnables (art. 28 LJCA)."
  citation: "art. 25.2 LJCA"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1998-16718-art-29
- id: m01-l11-q075
  prompt:
    es: "Según el artículo 29.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, quien tenga derecho a una prestación concreta que la Administración debe realizar puede recurrir su inactividad si, tras reclamarla:"
  options:
  - id: a
    text:
      es: "En un mes desde la reclamación no la cumple ni llega a un acuerdo con los interesados."
  - id: b
    text:
      es: "En seis meses desde la reclamación no dicta una resolución expresa sobre lo pedido."
  - id: c
    text:
      es: "En diez días desde la reclamación no atiende el requerimiento que se le ha formulado."
  - id: d
    correct: true
    text:
      es: "En tres meses desde la reclamación no la cumple ni llega a un acuerdo con ellos."
  explanation:
    es: "El artículo 29.1 permite el recurso si «en el plazo de tres meses desde la fecha de la reclamación, la Administración no hubiera dado cumplimiento a lo solicitado o no hubiera llegado a un acuerdo con los interesados». Un mes es el plazo del artículo 29.2 para la falta de ejecución de actos firmes. Seis meses es el plazo del recurso contra el acto presunto (art. 46.1). Diez días es el plazo del requerimiento en la vía de hecho (art. 30)."
  citation: "art. 29.1 LJCA"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-1998-16718-art-29
- id: m01-l11-q077
  prompt:
    es: "Un acto administrativo obliga a la Administración a una prestación concreta a favor de una persona determinada, que la reclama y no la recibe. ¿Qué puede hacer esa persona?"
  options:
  - id: a
    correct: true
    text:
      es: "Recurrir la inactividad si en tres meses la Administración no cumple ni llega a un acuerdo."
  - id: b
    text:
      es: "Interponer de inmediato recurso de alzada contra la inactividad ante el superior jerárquico."
  - id: c
    text:
      es: "Pedir la revisión de oficio de la inactividad, previo dictamen favorable del Consejo de Estado."
  - id: d
    text:
      es: "Esperar a que la Administración dicte un acto expreso, que es lo único que puede recurrirse."
  explanation:
    es: "El artículo 29.1 de la Ley 29/1998 permite a quien tiene derecho a la prestación reclamarla y, si en tres meses la Administración no la cumple ni llega a un acuerdo, «deducir recurso contencioso-administrativo contra la inactividad de la Administración». La inactividad no se recurre en alzada ni se somete a revisión de oficio. Tampoco hace falta un acto expreso: el artículo 25.2 admite el recurso contra la inactividad."
  citation: "art. 29.1 LJCA"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1998-16718-art-26
- id: m01-l11-q394
  prompt:
    es: "Conforme al artículo 26.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, además de la impugnación directa de las disposiciones generales, cabe impugnar los actos que las apliquen, fundada en que:"
  options:
  - id: a
    text:
      es: "Los actos no han sido notificados al interesado."
  - id: b
    text:
      es: "Las disposiciones no han sido publicadas en el boletín oficial."
  - id: c
    text:
      es: "Los actos carecen de motivación suficiente."
  - id: d
    correct: true
    text:
      es: "Tales disposiciones no son conformes a Derecho."
  explanation:
    es: "El artículo 26.1 admite impugnar los actos de aplicación de una disposición general con el fundamento de que la disposición no es conforme a Derecho. La falta de notificación, de publicación o de motivación no es el fundamento que contempla este apartado."
  citation: "art. 26.1 LJCA"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1998-16718-art-26
- id: m01-l11-q395
  prompt:
    es: "¿Cuál de las siguientes afirmaciones es correcta sobre la impugnación de los actos de aplicación de una disposición general, según el artículo 26.2 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa?"
  options:
  - id: a
    correct: true
    text:
      es: "La falta de impugnación directa de la disposición general no la impide."
  - id: b
    text:
      es: "Solo cabe si antes se impugnó directamente la disposición general."
  - id: c
    text:
      es: "Solo cabe si el recurso contra la disposición general fue estimado."
  - id: d
    text:
      es: "Solo cabe respecto de actos anteriores a la aprobación de la disposición."
  explanation:
    es: "El artículo 26.2 dice que ni la falta de impugnación directa de la disposición ni la desestimación del recurso interpuesto contra ella impiden impugnar los actos de aplicación. Exigir que se impugnara antes la disposición, que el recurso se estimara o que los actos sean anteriores a ella contradice el artículo."
  citation: "art. 26.2 LJCA"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1998-16718-art-28
- id: m01-l11-q397
  prompt:
    es: "Conforme al artículo 28 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, no es admisible el recurso contencioso-administrativo respecto de los actos que sean reproducción de otros anteriores:"
  options:
  - id: a
    correct: true
    text:
      es: "Definitivos y firmes."
  - id: b
    text:
      es: "De trámite que decidan el fondo del asunto."
  - id: c
    text:
      es: "Presuntos."
  - id: d
    text:
      es: "Confirmados por la Administración en vía de recurso."
  explanation:
    es: "El artículo 28 declara inadmisible el recurso contra los actos que reproduzcan otros anteriores definitivos y firmes. Los actos de trámite que deciden el fondo y los presuntos son recurribles según el artículo 25.1. La reproducción de actos confirmados en vía de recurso no es el supuesto del artículo."
  citation: "art. 28 LJCA"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1998-16718-art-29
- id: m01-l11-q398
  prompt:
    es: "Conforme al artículo 29.2 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, el recurso contra la falta de ejecución de actos firmes, un mes después de pedirla, se tramita por el procedimiento:"
  options:
  - id: a
    text:
      es: "Ordinario."
  - id: b
    text:
      es: "Especial para la protección de los derechos fundamentales."
  - id: c
    text:
      es: "Especial de cuestión de ilegalidad."
  - id: d
    correct: true
    text:
      es: "Abreviado."
  explanation:
    es: "El artículo 29.2 tramita ese recurso por el procedimiento abreviado del artículo 78. No sigue el procedimiento ordinario, ni el especial para la protección de los derechos fundamentales, ni el de cuestión de ilegalidad."
  citation: "art. 29.2 LJCA"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1998-16718-art-30
- id: m01-l11-q399
  prompt:
    es: "Conforme al artículo 30 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, en caso de vía de hecho el interesado puede recurrir directamente si el requerimiento de cesación no se atiende dentro de:"
  options:
  - id: a
    text:
      es: "Los quince días siguientes a su presentación."
  - id: b
    correct: true
    text:
      es: "Los diez días siguientes a su presentación."
  - id: c
    text:
      es: "El mes siguiente a su presentación."
  - id: d
    text:
      es: "Los tres meses siguientes a su presentación."
  explanation:
    es: "El artículo 30 abre el recurso directo si el requerimiento no se formula o no se atiende dentro de los diez días siguientes a su presentación. Quince días, un mes y tres meses son plazos de otros artículos, como el mes del 29.2 y los tres meses del 29.1."
  citation: "art. 30 LJCA"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1998-16718-art-18
- id: m01-l11-q078
  prompt:
    es: "Según el artículo 18 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, además de quienes la ostenten conforme a la Ley de Enjuiciamiento Civil, tienen capacidad procesal:"
  options:
  - id: a
    correct: true
    text:
      es: "Los menores, para los derechos e intereses que puedan ejercer sin asistencia."
  - id: b
    text:
      es: "Los menores en todo caso, siempre que actúen representados por un Procurador."
  - id: c
    text:
      es: "Los mayores de dieciséis años, para cualquier derecho o interés legítimo propio."
  - id: d
    text:
      es: "Los menores de edad, pero solo en los recursos sobre cuestiones de personal."
  explanation:
    es: "El artículo 18 reconoce capacidad procesal a «los menores de edad para la defensa de aquellos de sus derechos e intereses legítimos cuya actuación les esté permitida por el ordenamiento jurídico sin necesidad de asistencia» de quien ejerza la patria potestad, tutela o curatela. No es una capacidad general que dependa de tener Procurador ni de cumplir dieciséis años. Tampoco se limita a las cuestiones de personal."
  citation: "art. 18 LJCA"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1998-16718-art-19
- id: m01-l11-q079
  prompt:
    es: "Según el artículo 19.1.a) de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, ¿qué personas físicas o jurídicas están legitimadas ante el orden contencioso-administrativo?"
  options:
  - id: a
    text:
      es: "Las que hayan sido parte en el procedimiento administrativo."
  - id: b
    correct: true
    text:
      es: "Las que ostenten un derecho o interés legítimo."
  - id: c
    text:
      es: "Solo las que sean titulares de un derecho subjetivo."
  - id: d
    text:
      es: "Cualquiera, aunque no ostente un derecho ni un interés legítimo."
  explanation:
    es: "El artículo 19.1.a) legitima a «las personas físicas o jurídicas que ostenten un derecho o interés legítimo». Haber sido parte en el procedimiento no es el criterio. El interés legítimo basta, de modo que no hace falta un derecho subjetivo. La legitimación sin derecho ni interés solo existe en la acción popular, y en los casos que prevén las leyes (art. 19.1.h)."
  citation: "art. 19.1.a) LJCA"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1998-16718-art-19
- id: m01-l11-q080
  prompt:
    es: "Conforme al artículo 19.1.h) de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, cualquier ciudadano está legitimado en ejercicio de la acción popular:"
  options:
  - id: a
    text:
      es: "En todo caso, frente a cualquier acto."
  - id: b
    text:
      es: "Cuando acredite un interés legítimo en el asunto."
  - id: c
    correct: true
    text:
      es: "En los casos expresamente previstos por las Leyes."
  - id: d
    text:
      es: "Solo frente a disposiciones de carácter general."
  explanation:
    es: "El artículo 19.1.h) legitima a «cualquier ciudadano, en ejercicio de la acción popular, en los casos expresamente previstos por las Leyes». No es una legitimación general. Quien acredita un interés legítimo ya está legitimado por el artículo 19.1.a), sin acción popular. La acción popular no se limita a las disposiciones generales: depende de lo que prevea cada ley."
  citation: "art. 19.1.h) LJCA"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1998-16718-art-19
- id: m01-l11-q081
  prompt:
    es: "Según el artículo 19.1.b) de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, las corporaciones, asociaciones y sindicatos están legitimados cuando:"
  options:
  - id: a
    text:
      es: "Estén inscritos en un registro público, con independencia de que resulten o no afectados."
  - id: b
    text:
      es: "Lo autoricen de forma expresa todos sus miembros o afiliados afectados por el acto recurrido."
  - id: c
    correct: true
    text:
      es: "Resulten afectados o estén habilitados por la ley para defender intereses legítimos colectivos."
  - id: d
    text:
      es: "Actúen en ejercicio de la acción popular, sin necesidad de resultar afectados por el acto."
  explanation:
    es: "El artículo 19.1.b) legitima a las corporaciones, asociaciones y sindicatos «que resulten afectados o estén legalmente habilitados para la defensa de los derechos e intereses legítimos colectivos». La inscripción registral no es el criterio, y la ley no exige la autorización de todos los afiliados. La acción popular es otra vía (art. 19.1.h) que solo existe donde una ley la prevé."
  citation: "art. 19.1.b) LJCA"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1998-16718-art-23
- id: m01-l11-q082
  prompt:
    es: "De acuerdo con el artículo 23.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, en sus actuaciones ante órganos unipersonales, las partes:"
  options:
  - id: a
    text:
      es: "Deberán conferir su representación a un Procurador y ser asistidas, en todo caso, por Abogado."
  - id: b
    text:
      es: "Podrán conferir su representación a un Procurador y podrán ser asistidas por Abogado."
  - id: c
    text:
      es: "Deberán conferir su representación a un Procurador, sin necesidad de asistencia de Abogado."
  - id: d
    correct: true
    text:
      es: "Podrán conferir su representación a un Procurador y serán asistidas, en todo caso, por Abogado."
  explanation:
    es: "Ante órganos unipersonales, el artículo 23.1 dice que las partes «podrán conferir su representación a un Procurador y serán asistidas, en todo caso, por Abogado». El Procurador es potestativo y el Abogado, obligatorio. Procurador y Abogado obligatorios es la regla de los órganos colegiados (art. 23.2). Las otras dos opciones convierten el Abogado en potestativo o lo suprimen."
  citation: "art. 23.1 LJCA"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1998-16718-art-23
- id: m01-l11-q083
  prompt:
    es: "Según el artículo 23.2 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, ¿cómo deben actuar las partes en sus actuaciones ante órganos colegiados?"
  options:
  - id: a
    text:
      es: "Pueden conferir su representación a un Procurador y deben ser asistidas por Abogado."
  - id: b
    correct: true
    text:
      es: "Deben conferir su representación a un Procurador y ser asistidas por Abogado."
  - id: c
    text:
      es: "Deben conferir su representación a un Abogado, sin necesidad de Procurador."
  - id: d
    text:
      es: "Pueden conferir su representación a un Procurador y pueden ser asistidas por Abogado."
  explanation:
    es: "El artículo 23.2 dice que ante órganos colegiados las partes «deberán conferir su representación a un Procurador y ser asistidas por Abogado». Procurador potestativo con Abogado obligatorio es la regla de los órganos unipersonales (art. 23.1). Las opciones que suprimen el Procurador o hacen potestativos a los dos contradicen el texto."
  citation: "art. 23.2 LJCA"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1998-16718-art-18
- id: m01-l11-q381
  prompt:
    es: "Conforme al artículo 18 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, los grupos de afectados, las uniones sin personalidad y los patrimonios independientes tienen capacidad procesal en este orden jurisdiccional cuando:"
  options:
  - id: a
    text:
      es: "Lo autorice el Juez."
  - id: b
    correct: true
    text:
      es: "La Ley así lo declare expresamente."
  - id: c
    text:
      es: "Lo prevean sus estatutos y estén inscritos en un registro público."
  - id: d
    text:
      es: "Lo solicite al menos una persona jurídica integrada en ellos."
  explanation:
    es: "El artículo 18 reconoce esa capacidad procesal solo cuando la Ley lo declare expresamente. No depende del Juez o Tribunal, de los estatutos inscritos ni de la petición de una persona jurídica integrada en el grupo."
  citation: "art. 18 LJCA"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1998-16718-art-19
- id: m01-l11-q384
  prompt:
    es: "Conforme al artículo 19.1.f) de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, está legitimado ante el orden contencioso-administrativo el Ministerio Fiscal para:"
  options:
  - id: a
    text:
      es: "Impugnar de oficio cualquier acto administrativo."
  - id: b
    correct: true
    text:
      es: "Intervenir en los procesos que determine la Ley."
  - id: c
    text:
      es: "Defender los intereses de la Administración demandada."
  - id: d
    text:
      es: "Ejercer la acción popular en todos los casos."
  explanation:
    es: "La letra f) del artículo 19.1 legitima al Ministerio Fiscal para intervenir en los procesos que determine la Ley. No le permite impugnar de oficio cualquier acto, ni asumir la defensa de la Administración demandada, ni ejercer la acción popular sin más: esa acción, la de la letra h), solo cabe en los casos previstos por las Leyes."
  citation: "art. 19.1.f) LJCA"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1998-16718-art-20
- id: m01-l11-q386
  prompt:
    es: "Según el artículo 20 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, los órganos de una Administración y los miembros de sus órganos colegiados no pueden recurrir contra su actividad, salvo que:"
  options:
  - id: a
    text:
      es: "El superior lo autorice."
  - id: b
    text:
      es: "El presidente del órgano colegiado lo apruebe."
  - id: c
    text:
      es: "Actúen en defensa de un derecho propio."
  - id: d
    correct: true
    text:
      es: "Una Ley lo autorice expresamente."
  explanation:
    es: "La letra a) del artículo 20 impide recurrir a los órganos y miembros de la propia Administración salvo que una Ley lo autorice expresamente. La autorización del superior jerárquico o del presidente del órgano, o actuar en defensa de un derecho propio, no levantan la prohibición."
  citation: "art. 20 LJCA"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1998-16718-art-20
- id: m01-l11-q387
  prompt:
    es: "¿Cuál de las siguientes situaciones excluye que un particular recurra contra la actividad de una Administración pública, según el artículo 20 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa?"
  options:
  - id: a
    text:
      es: "Defender derechos o intereses legítimos propios."
  - id: b
    correct: true
    text:
      es: "Obrar por delegación o como mero agente o mandatario de ella."
  - id: c
    text:
      es: "Representar a una persona jurídica privada."
  - id: d
    text:
      es: "Ser titular de una autorización administrativa."
  explanation:
    es: "La letra b) del artículo 20 excluye a los particulares que obren por delegación o como meros agentes o mandatarios de la Administración. Quien defiende derechos o intereses legítimos propios, quien representa a una persona jurídica privada o quien es titular de una autorización puede recurrir, si está legitimado."
  citation: "art. 20 LJCA"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1998-16718-art-20
- id: m01-l11-q388
  prompt:
    es: "Según el artículo 20.c) de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, las Entidades de Derecho público dependientes del Estado no pueden recurrir la actividad de su Administración, salvo aquellas a las que:"
  options:
  - id: a
    text:
      es: "Una orden ministerial haya otorgado autonomía de gestión."
  - id: b
    text:
      es: "Se hayan atribuido competencias exclusivas por reglamento."
  - id: c
    correct: true
    text:
      es: "Por Ley se haya dotado de un estatuto específico de autonomía."
  - id: d
    text:
      es: "El Consejo de Ministros haya concedido una autorización singular."
  explanation:
    es: "La letra c) del artículo 20 exceptúa a las entidades a las que una Ley haya dotado de un estatuto específico de autonomía respecto de su Administración. Una orden ministerial, un reglamento o una autorización singular del Consejo de Ministros no tienen ese efecto."
  citation: "art. 20 LJCA"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1998-16718-art-23
- id: m01-l11-q391
  prompt:
    es: "Conforme al artículo 23.3 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, los funcionarios pueden comparecer por sí mismos en defensa de sus derechos estatutarios en cuestiones de personal que no impliquen:"
  options:
  - id: a
    correct: true
    text:
      es: "Separación de empleados públicos inamovibles."
  - id: b
    text:
      es: "Reclamación de cantidades retributivas devengadas y no abonadas."
  - id: c
    text:
      es: "Cambio de destino dentro del mismo cuerpo."
  - id: d
    text:
      es: "Concesión de permisos y licencias."
  explanation:
    es: "El artículo 23.3 permite comparecer por sí mismos a los funcionarios en cuestiones de personal que no impliquen la separación de empleados públicos inamovibles. Reclamar cantidades retributivas, cambiar de destino o pedir permisos y licencias son cuestiones de personal que no excluyen esa facultad."
  citation: "art. 23.3 LJCA"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1998-16718-art-23
- id: m01-l11-q392
  prompt:
    es: "Según el artículo 23.3 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, los funcionarios que comparezcan por sí mismos en defensa de sus derechos estatutarios están obligados al empleo de los sistemas electrónicos existentes:"
  options:
  - id: a
    text:
      es: "Solo para la recepción de notificaciones."
  - id: b
    text:
      es: "Solo para la remisión de los escritos que inicien el proceso."
  - id: c
    correct: true
    text:
      es: "Para la remisión de escritos y documentos y para la recepción de notificaciones."
  - id: d
    text:
      es: "Para la presentación de la demanda, pero no para las notificaciones."
  explanation:
    es: "El artículo 23.3 obliga a esos funcionarios a usar los sistemas electrónicos tanto para remitir escritos y documentos, iniciadores o no, como para recibir notificaciones. Las opciones que limitan la obligación a las notificaciones, a los escritos iniciales o a la demanda recortan el alcance del artículo."
  citation: "art. 23.3 LJCA"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1998-16718-art-24
- id: m01-l11-q393
  prompt:
    es: "Conforme al artículo 24 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, la representación y defensa de las Administraciones públicas se rige por la Ley Orgánica del Poder Judicial y por:"
  options:
  - id: a
    correct: true
    text:
      es: "La Ley de Asistencia Jurídica al Estado e Instituciones Públicas."
  - id: b
    text:
      es: "La Ley de Enjuiciamiento Criminal."
  - id: c
    text:
      es: "La Ley del Estatuto Básico del Empleado Público y sus normas de desarrollo."
  - id: d
    text:
      es: "La Ley Orgánica del Tribunal Constitucional."
  explanation:
    es: "El artículo 24 remite a la Ley Orgánica del Poder Judicial, a la Ley de Asistencia Jurídica al Estado e Instituciones Públicas y a las normas autonómicas dictadas en el marco de sus competencias. La Ley de Enjuiciamiento Criminal, la del Estatuto Básico del Empleado Público y la Orgánica del Tribunal Constitucional no figuran en él."
  citation: "art. 24 LJCA"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1998-16718-art-19
- id: m01-l11-q409
  prompt:
    es: "¿Cuál de las siguientes condiciones debe cumplir un acto o disposición para que la Administración de una Comunidad Autónoma esté legitimada para impugnarlo, conforme al artículo 19.1.d) de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa?"
  options:
  - id: a
    text:
      es: "Que afecte a los intereses generales de su territorio."
  - id: b
    correct: true
    text:
      es: "Que afecte al ámbito de su autonomía."
  - id: c
    text:
      es: "Que afecte a su patrimonio."
  - id: d
    text:
      es: "Que afecte a las competencias de las Entidades locales de su territorio."
  explanation:
    es: "La letra d) del artículo 19.1 legitima a la Administración autonómica para impugnar los actos y disposiciones que afecten al ámbito de su autonomía. Los intereses generales del territorio, el patrimonio de la Comunidad y las competencias de las Entidades locales de su territorio no son el criterio de esa letra; la autonomía de las Entidades locales es la base de su propia legitimación en la letra e)."
  citation: "art. 19.1 LJCA"
  difficulty: 2
  tags:
  - "requisito"
