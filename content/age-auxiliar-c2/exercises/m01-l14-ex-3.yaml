# anchor: boe-a-2015-11719-art-96
- id: m01-l14-q156
  prompt:
    es: "De acuerdo con el artículo 96.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la suspensión firme de funciones, o de empleo y sueldo en el personal laboral, dura como máximo:"
  options:
  - id: a
    text:
      es: "Tres años."
  - id: b
    text:
      es: "Cuatro años."
  - id: c
    correct: true
    text:
      es: "Seis años."
  - id: d
    text:
      es: "Diez años."
  explanation:
    es: "La letra c) del artículo 96.1 fija para la suspensión firme «una duración máxima de 6 años». Tres años es el máximo por falta grave en el Reglamento de Régimen Disciplinario de 1986, no el del Estatuto. Cuatro y diez años no figuran."
  citation: "art. 96.1.c) TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-96
- id: m01-l14-q158
  prompt:
    es: "Entre las sanciones que pueden imponerse a los empleados públicos por razón de las faltas cometidas, ¿en qué consiste el demérito?"
  options:
  - id: a
    text:
      es: "En la penalización a efectos de retribuciones complementarias y productividad."
  - id: b
    correct: true
    text:
      es: "En la penalización a efectos de carrera, promoción o movilidad voluntaria."
  - id: c
    text:
      es: "En la pérdida de días de vacaciones y de permisos retribuidos."
  - id: d
    text:
      es: "En la anotación de la falta en el expediente durante tres años."
  explanation:
    es: "La letra e) del artículo 96.1 define el demérito como «la penalización a efectos de carrera, promoción o movilidad voluntaria». No toca las retribuciones complementarias ni las vacaciones o permisos. Una anotación en el expediente no es lo que el precepto describe."
  citation: "art. 96.1.e) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-14
- id: m01-l14-q160
  prompt:
    es: "¿Cuál de las siguientes sanciones figura en el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "El demérito a efectos de carrera."
  - id: b
    text:
      es: "El despido disciplinario."
  - id: c
    text:
      es: "El traslado forzoso sin cambio de residencia."
  - id: d
    correct: true
    text:
      es: "El traslado con cambio de residencia."
  explanation:
    es: "El artículo 14 del Reglamento enumera la separación del servicio, la suspensión de funciones, el «traslado con cambio de residencia» y el apercibimiento; su apartado d) figura como derogado. El demérito y el traslado forzoso sin cambio de residencia son sanciones del artículo 96.1 del Estatuto, no del Reglamento. El despido disciplinario es del personal laboral."
  citation: "art. 14 RD 33/1986"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-16
- id: m01-l14-q161
  prompt:
    es: "De acuerdo con el artículo 16 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, la suspensión de funciones impuesta por falta muy grave dura:"
  options:
  - id: a
    correct: true
    text:
      es: "No menos de tres años ni más de seis."
  - id: b
    text:
      es: "No menos de un año ni más de tres."
  - id: c
    text:
      es: "No menos de dos años ni más de seis."
  - id: d
    text:
      es: "No menos de un año ni más de seis."
  explanation:
    es: "El artículo 16 RD 33/1986 dice que la suspensión de funciones por falta muy grave «no podrá ser superior a seis años ni inferior a tres». Un mínimo de uno o de dos años contradice «inferior a tres», y un máximo de tres años contradice «superior a seis». Cada distractor falla en el extremo que cambia: el que va de uno a tres años falla en los dos, el de dos a seis en el mínimo y el de uno a seis también en el mínimo. El mismo artículo fija para la falta grave solo un tope: «no excederá de tres años». Ese tope no da un mínimo de un año y no es la regla de la falta muy grave."
  citation: "art. 16 RD 33/1986"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-97
- id: m01-l14-q163
  prompt:
    es: "De acuerdo con el artículo 97.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, en el caso de las faltas leves y de las sanciones impuestas por ellas:"
  options:
  - id: a
    text:
      es: "Las faltas prescriben al año y las sanciones, a los seis meses."
  - id: b
    correct: true
    text:
      es: "Las faltas prescriben a los seis meses y las sanciones, al año."
  - id: c
    text:
      es: "Las faltas y las sanciones prescriben, ambas, a los seis meses."
  - id: d
    text:
      es: "Las faltas prescriben al mes y las sanciones, a los seis meses."
  explanation:
    es: "El artículo 97.1 dice que las infracciones leves prescriben «a los seis meses» y las sanciones impuestas por faltas leves «al año». Invertir los plazos o igualarlos es un error. El mes es el plazo del Reglamento de Régimen Disciplinario de 1986 para las faltas leves, no el del Estatuto."
  citation: "art. 97.1 TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-97
- id: m01-l14-q164
  prompt:
    es: "Según el artículo 97.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿en qué plazo prescriben las infracciones muy graves y las graves?"
  options:
  - id: a
    text:
      es: "Las muy graves, a los seis años, y las graves, a los dos años."
  - id: b
    text:
      es: "Las muy graves, a los tres años, y las graves, a los seis meses."
  - id: c
    correct: true
    text:
      es: "Las muy graves, a los tres años, y las graves, a los dos años."
  - id: d
    text:
      es: "Las muy graves, a los cuatro años, y las graves, a los dos años."
  explanation:
    es: "El artículo 97.1 fija «a los tres años» para las infracciones muy graves y «a los dos años» para las graves. Seis años es el plazo del Reglamento de Régimen Disciplinario de 1986 para las muy graves. Seis meses es el de las leves en el Estatuto. Cuatro años no figura."
  citation: "art. 97.1 TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1986-1216-art-20
- id: m01-l14-q165
  prompt:
    es: "De acuerdo con el artículo 20.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, las faltas muy graves, graves y leves prescriben, respectivamente:"
  options:
  - id: a
    text:
      es: "A los tres años, a los dos años y a los seis meses."
  - id: b
    text:
      es: "A los seis años, a los tres años y a los seis meses."
  - id: c
    text:
      es: "A los cinco años, a los dos años y a los tres meses."
  - id: d
    correct: true
    text:
      es: "A los seis años, a los dos años y al mes."
  explanation:
    es: "El artículo 20.1 del Reglamento dice: «Las faltas muy graves prescribirán a los seis años, las graves a los dos años y las leves al mes». Tres años, dos años y seis meses son los plazos del artículo 97.1 del Estatuto. Las otras dos series no figuran en ninguno de los dos textos."
  citation: "art. 20.1 RD 33/1986"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1986-1216-art-21
- id: m01-l14-q166
  prompt:
    es: "Según el artículo 21.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿en qué plazo prescriben las sanciones impuestas por faltas muy graves y por faltas leves?"
  options:
  - id: a
    text:
      es: "A los tres años y al año, respectivamente."
  - id: b
    text:
      es: "A los tres años y al mes, respectivamente."
  - id: c
    text:
      es: "A los seis años y a los seis meses, respectivamente."
  - id: d
    correct: true
    text:
      es: "A los seis años y al mes, respectivamente."
  explanation:
    es: "El artículo 21.1 dice que las sanciones por faltas muy graves prescriben «a los seis años» y las impuestas por faltas leves «al mes». Tres años y un año son los plazos del artículo 97.1 del Estatuto. Las otras combinaciones mezclan cifras de uno y otro texto."
  citation: "art. 21.1 RD 33/1986"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-97
- id: m01-l14-q167
  prompt:
    es: "De acuerdo con el artículo 97.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, en las faltas continuadas el plazo de prescripción empieza a contarse:"
  options:
  - id: a
    text:
      es: "Desde que se cometió el primero de los actos que forman la falta."
  - id: b
    text:
      es: "Desde que la Administración tuvo conocimiento de la falta."
  - id: c
    text:
      es: "Desde la incoación del procedimiento disciplinario."
  - id: d
    correct: true
    text:
      es: "Desde el cese de la comisión de la falta."
  explanation:
    es: "El plazo de las faltas corre desde que se cometieron, «y desde el cese de su comisión cuando se trate de faltas continuadas». No cuenta el primero de los actos. El Estatuto no hace depender el inicio de que la Administración conozca la falta. La incoación no abre el plazo de prescripción."
  citation: "art. 97.2 TREBEP"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1986-1216-art-21
- id: m01-l14-q169
  prompt:
    es: "De acuerdo con el artículo 21.2 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, la prescripción de la sanción se cuenta desde el día siguiente a su firmeza o:"
  options:
  - id: a
    text:
      es: "Desde que se notifique al funcionario la resolución que impone la sanción."
  - id: b
    correct: true
    text:
      es: "Desde que se quebrantase el cumplimiento de la sanción, si hubiere comenzado."
  - id: c
    text:
      es: "Desde que se acuerde la suspensión de la ejecución de la sanción impuesta."
  - id: d
    text:
      es: "Desde que el funcionario pida la cancelación de la anotación de la sanción impuesta."
  explanation:
    es: "El artículo 21.2 da dos puntos de partida: el día siguiente a la firmeza de la resolución, «o desde que se quebrantase el cumplimiento de la sanción si hubiere comenzado». La notificación, la suspensión de la ejecución y la petición de cancelación de la anotación no figuran en el artículo."
  citation: "art. 21.2 RD 33/1986"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1986-1216-art-20
- id: m01-l14-q171
  prompt:
    es: "De acuerdo con el artículo 20.2 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, interrumpida la prescripción, el plazo vuelve a correr si el expediente permanece paralizado:"
  options:
  - id: a
    correct: true
    text:
      es: "Más de seis meses por causa no imputable al funcionario sujeto al procedimiento."
  - id: b
    text:
      es: "Más de tres meses por causa no imputable al funcionario afectado."
  - id: c
    text:
      es: "Más de seis meses por cualquier causa, incluida la imputable al funcionario."
  - id: d
    text:
      es: "Más de un año por causa imputable al funcionario sujeto al procedimiento."
  explanation:
    es: "El plazo vuelve a correr «si el expediente permaneciere paralizado durante más de seis meses por causa no imputable al funcionario sujeto al procedimiento». Tres meses o un año no son la cifra del texto. Si la paralización es imputable al funcionario, el plazo no vuelve a correr."
  citation: "art. 20.2 RD 33/1986"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2015-11719-art-97
- id: m01-l14-q172
  prompt:
    es: "Un funcionario de un ministerio cometió una falta grave el martes, 11 de febrero de 2025. Su unidad la descubrió el lunes, 5 de mayo de 2025. ¿Qué día vence el plazo de prescripción de la falta?"
  options:
  - id: a
    text:
      es: "El miércoles, 11 de febrero de 2026."
  - id: b
    correct: true
    text:
      es: "El jueves, 11 de febrero de 2027."
  - id: c
    text:
      es: "El miércoles, 5 de mayo de 2027."
  - id: d
    text:
      es: "El viernes, 11 de febrero de 2028."
  explanation:
    es: "Las faltas graves prescriben a los dos años, y el plazo corre «desde que se hubieran cometido», no desde que se descubren (artículo 97 del Estatuto; el artículo 20.1 del Reglamento de Régimen Disciplinario de 1986 dice lo mismo). Los plazos en meses y años se cuentan de fecha a fecha: del martes, 11 de febrero de 2025 al jueves, 11 de febrero de 2027. Contar desde el descubrimiento da el miércoles, 5 de mayo de 2027. Un año no es plazo de las faltas graves. Tres años es el plazo de las faltas muy graves en el Estatuto."
  citation: "art. 97.2 TREBEP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-1986-1216-art-16
- id: m01-l14-q182
  prompt:
    es: "Según el artículo 16 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿por cuál de las siguientes faltas puede imponerse la sanción de suspensión de funciones?"
  options:
  - id: a
    text:
      es: "La falta de asistencia injustificada de un día."
  - id: b
    correct: true
    text:
      es: "El atentado grave a la dignidad de los funcionarios o de la Administración."
  - id: c
    text:
      es: "La incorrección con el público, superiores, compañeros o subordinados."
  - id: d
    text:
      es: "El incumplimiento injustificado del horario de trabajo, cuando no suponga falta grave."
  explanation:
    es: "El artículo 16 permite la suspensión de funciones por faltas graves o muy graves, y el atentado grave a la dignidad es falta grave del artículo 7.1. La falta de asistencia de un día, la incorrección y el incumplimiento del horario que no es grave son faltas leves del artículo 8, y las leves solo se corrigen con las sanciones que señala el artículo 17."
  citation: "art. 16 RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-16
- id: m01-l14-q183
  prompt:
    es: "Un funcionario es sancionado con suspensión de funciones por abuso de autoridad, falta grave. Según el artículo 16 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿cuál es la duración máxima de esa suspensión?"
  options:
  - id: a
    correct: true
    text:
      es: "Tres años."
  - id: b
    text:
      es: "Seis años."
  - id: c
    text:
      es: "Dos años."
  - id: d
    text:
      es: "Un año."
  explanation:
    es: "El artículo 16 dice que la suspensión impuesta por falta grave no excederá de tres años. Los seis años son el máximo de la suspensión por falta muy grave, que además no puede bajar de tres. Dos años y un año no figuran en el artículo."
  citation: "art. 16 RD 33/1986"
  difficulty: 2
  tags:
  - "plazo"
  - "cantidad"
# anchor: boe-a-2015-11719-art-96
- id: m01-l14-q194
  prompt:
    es: "Según el artículo 96.1.c) del texto refundido de la Ley del Estatuto Básico del Empleado Público, en el caso del personal laboral la suspensión firme es de:"
  options:
  - id: a
    text:
      es: "Funciones y puesto, con una duración máxima de seis años."
  - id: b
    text:
      es: "Contrato y antigüedad, con una duración máxima de seis años."
  - id: c
    correct: true
    text:
      es: "Empleo y sueldo, con una duración máxima de seis años."
  - id: d
    text:
      es: "Solo sueldo, sin pérdida de empleo, con una duración máxima de seis años."
  explanation:
    es: "El artículo 96.1.c) habla de suspensión firme de funciones y, en el caso del personal laboral, de empleo y sueldo. Las demás combinaciones no figuran en el artículo."
  citation: "art. 96.1.c) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-97
- id: m01-l14-q248
  prompt:
    es: "¿Cuál de los siguientes aspectos de la prescripción de las faltas regula el artículo 97 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    correct: true
    text:
      es: "El plazo de cada clase de falta y el día desde el que se cuenta."
  - id: b
    text:
      es: "Los actos que interrumpen el plazo y el momento en que se reanuda."
  - id: c
    text:
      es: "La suspensión del plazo mientras se tramita un proceso penal."
  - id: d
    text:
      es: "El registro de la incoación como requisito para interrumpir el plazo."
  explanation:
    es: "El artículo 97 fija los plazos de prescripción de faltas y sanciones (apartado 1) y el día en que empiezan a contarse: para las faltas, desde que se cometieron, y desde el cese de su comisión en las continuadas (apartado 2). No dice qué actos interrumpen el plazo ni cuándo vuelve a correr, no prevé que se suspenda durante un proceso penal y no menciona el registro de la incoación. La interrupción y el registro de la resolución de incoación están en el artículo 20.2 del Real Decreto 33/1986."
  citation: "art. 97 TREBEP"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-96
- id: m01-l14-q252
  prompt:
    es: "Un funcionario interino publica indebidamente documentación conocida por razón de su cargo. Según el artículo 96.1.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público, si se le impone la separación del servicio, esta:"
  options:
  - id: a
    text:
      es: "Comporta la inhabilitación para un nuevo nombramiento como interino."
  - id: b
    text:
      es: "Exige que la publicación se haya repetido en el último año."
  - id: c
    text:
      es: "Se sustituye por la suspensión firme de funciones durante seis años."
  - id: d
    correct: true
    text:
      es: "Comporta la revocación de su nombramiento como funcionario interino."
  explanation:
    es: "El artículo 96.1.a) regula la «separación del servicio de los funcionarios, que en el caso de los funcionarios interinos comportará la revocación de su nombramiento». La publicación indebida de documentación conocida por razón del cargo es falta muy grave (artículo 95.2.e)), y la separación sanciona faltas muy graves sin pedir que la conducta se repita. El artículo no sustituye la separación del interino por la suspensión firme de funciones, que es otra sanción de la letra c). La inhabilitación para un nuevo contrato con funciones similares es el efecto que la letra b) da al despido disciplinario del personal laboral; la letra a) no prevé inhabilitación alguna para el interino."
  citation: "art. 96.1.a) TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-10566-art-25
- id: m01-l14-q266
  prompt:
    es: "Según el artículo 25.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las disposiciones de su capítulo sobre la potestad sancionadora son extensivas al ejercicio por las Administraciones Públicas de su potestad:"
  options:
  - id: a
    text:
      es: "disciplinaria respecto de los funcionarios de carrera, con exclusión del personal laboral y del eventual."
  - id: b
    text:
      es: "sancionadora respecto de quienes estén vinculados a ellas por contratos del sector público o patrimoniales."
  - id: c
    correct: true
    text:
      es: "disciplinaria respecto del personal a su servicio, sea cual sea la naturaleza jurídica de la relación de empleo."
  - id: d
    text:
      es: "reglamentaria respecto del personal a su servicio, cualquiera que sea la naturaleza jurídica de su relación."
  explanation:
    es: "El artículo 25.3 extiende las disposiciones del capítulo a la potestad disciplinaria «respecto del personal a su servicio, cualquiera que sea la naturaleza jurídica de la relación de empleo». Por eso incluye al personal laboral y no solo a los funcionarios de carrera. La potestad sancionadora sobre quienes se vinculan por contratos del sector público está excluida por el artículo 25.4. La reglamentaria no es la potestad que el artículo menciona."
  citation: "art. 25.3 LRJSP"
  difficulty: 3
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2015-10566-art-30
- id: m01-l14-q267
  prompt:
    es: "Conforme al artículo 30.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué requisito debe cumplir la iniciación de un procedimiento sancionador para interrumpir la prescripción de las infracciones?"
  options:
  - id: a
    text:
      es: "Que se anote la iniciación en el Registro Central de Personal."
  - id: b
    correct: true
    text:
      es: "Que la iniciación se produzca con conocimiento del interesado."
  - id: c
    text:
      es: "Que el instructor haya formulado ya el pliego de cargos al funcionario."
  - id: d
    text:
      es: "Que se notifique al interesado la propuesta de resolución del instructor."
  explanation:
    es: "El artículo 30.2 dice que interrumpe la prescripción «la iniciación, con conocimiento del interesado, de un procedimiento administrativo de naturaleza sancionadora». La exigencia es el conocimiento del interesado. El artículo no pide anotarla en el Registro de personal, ni que el instructor haya formulado el pliego de cargos, ni que se notifique la propuesta de resolución."
  citation: "art. 30.2 LRJSP"
  difficulty: 3
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-2015-10566-art-30
- id: m01-l14-q268
  prompt:
    es: "De acuerdo con el artículo 30.2 de la Ley 40/2015, de 1 de octubre, el plazo de prescripción de las infracciones se reinicia si el expediente sancionador está paralizado, por causa no imputable al presunto responsable, durante más de:"
  options:
  - id: a
    text:
      es: "quince días."
  - id: b
    text:
      es: "dos meses."
  - id: c
    text:
      es: "tres meses."
  - id: d
    correct: true
    text:
      es: "un mes."
  explanation:
    es: "El artículo 30.2 reinicia el plazo de prescripción «si el expediente sancionador estuviera paralizado durante más de un mes por causa no imputable al presunto responsable». Quince días, dos meses y tres meses no son el plazo del artículo."
  citation: "art. 30.2 LRJSP"
  difficulty: 2
  tags:
  - "plazo"
