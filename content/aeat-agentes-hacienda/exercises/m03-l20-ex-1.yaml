# anchor: celex-32013r0952-art-5
- id: m03-l20-q0001
  prompt:
    es: "Conforme al artículo 5, apartado 5, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cuál de las siguientes personas es un operador económico?"
  options:
  - id: a
    text:
      es: "Un viajero que, a título particular, lleva consigo mercancías para su uso personal al entrar en el territorio aduanero de la Unión."
  - id: b
    text:
      es: "Un particular que recibe en su domicilio un paquete enviado desde un país tercero por un familiar, sin ejercer actividad profesional alguna."
  - id: c
    correct: true
    text:
      es: "Una empresa de transporte que, en el ejercicio de su actividad profesional, efectúa actividades a las que se aplica la legislación aduanera."
  - id: d
    text:
      es: "Una persona que, fuera de toda actividad profesional, actúa como representante aduanero de un amigo en una operación aislada."
  explanation:
    es: "El artículo 5.5 define al operador económico como la persona que, en el ejercicio de su actividad profesional, efectúa actividades a las que se aplica la legislación aduanera. La empresa de transporte reúne los dos rasgos. El viajero con mercancías de uso personal, el particular que recibe un paquete y quien representa a un amigo en una operación aislada actúan fuera de una actividad profesional, y falta ese rasgo."
  citation: "art. 5.5 CAU"
  difficulty: 2
  tags:
  - "definiciones"
  - "operador económico"
# anchor: celex-32013r0952-art-5
- id: m03-l20-q0002
  prompt:
    es: "De acuerdo con el artículo 5, apartado 6, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, el representante aduanero es toda persona:"
  options:
  - id: a
    text:
      es: "Designada por las autoridades aduaneras para comprobar los actos y formalidades que realicen los operadores económicos en sus relaciones con ellas y para exigirles el pago."
  - id: b
    text:
      es: "Que presenta una declaración en aduana en nombre propio o aquella en cuyo nombre se presenta dicha declaración."
  - id: c
    text:
      es: "Nombrada por un Estado miembro para responder del pago de la deuda aduanera que nazca de las mercancías de otra persona."
  - id: d
    correct: true
    text:
      es: "Nombrada por otra persona para ejecutar los actos y formalidades necesarios en virtud de la legislación aduanera en sus relaciones con las autoridades aduaneras."
  explanation:
    es: "Es representante aduanero quien ha sido nombrado por otra persona para ejecutar los actos y formalidades aduaneros ante las autoridades. No lo nombran las autoridades aduaneras, que son la contraparte, y por eso no se trata de un controlador de operadores. La persona que presenta la declaración en nombre propio, o en cuyo nombre se presenta, es el declarante. Tampoco es una figura que un Estado miembro designe para responder de una deuda: el deudor lo determinan los artículos sobre nacimiento de la deuda."
  citation: "art. 5.6 CAU"
  difficulty: 1
  tags:
  - "definiciones"
  - "representante aduanero"
# anchor: celex-32013r0952-art-5
- id: m03-l20-q0003
  prompt:
    es: "Según el artículo 5, apartado 6, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿qué condición tiene la gestora a la que una sociedad encarga ejecutar ante las autoridades aduaneras los actos y formalidades de una importación?"
  options:
  - id: a
    text:
      es: "Declarante en todo caso, por ser la persona que ejecuta los trámites ante las autoridades aduaneras, aunque actúe por encargo de otra."
  - id: b
    text:
      es: "Deudora de la deuda aduanera por haber sido encargada de ejecutar los trámites, sin que influya la clase de representación que ejerza."
  - id: c
    text:
      es: "Autoridad aduanera delegada, por actuar ante las autoridades aduaneras en nombre del Estado miembro en que esté establecida."
  - id: d
    correct: true
    text:
      es: "Representante aduanero, por ser una persona nombrada por otra para ejecutar esos actos y formalidades ante las autoridades aduaneras."
  explanation:
    es: "La gestora ha sido nombrada por otra persona para ejecutar los actos y formalidades ante las autoridades aduaneras: es representante aduanero según el artículo 5.6. No es declarante en todo caso, porque lo es quien presenta la declaración en nombre propio o aquella en cuyo nombre se presenta, y su condición depende de cómo actúe. Tampoco es deudora por el mero encargo: la deuda y sus deudores los fijan los artículos 77 y siguientes. Y no es una autoridad aduanera: actúa por encargo de una persona privada, no del Estado miembro."
  citation: "art. 5.6 CAU"
  difficulty: 1
  tags:
  - "definiciones"
  - "representante aduanero"
# anchor: celex-32013r0952-art-5
- id: m03-l20-q0004
  prompt:
    es: "Según el artículo 5, apartado 9, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, la declaración sumaria de entrada es el acto por el que una persona informa a las autoridades aduaneras, en la forma y el modo establecidos:"
  options:
  - id: a
    text:
      es: "De que determinadas mercancías han sido presentadas en aduana y están disponibles para los controles aduaneros."
  - id: b
    text:
      es: "De que desea incluir determinadas mercancías en un régimen aduanero concreto, con las disposiciones particulares aplicables."
  - id: c
    correct: true
    text:
      es: "De que determinadas mercancías van a entrar en el territorio aduanero de la Unión."
  - id: d
    text:
      es: "De que determinadas mercancías van a salir del territorio aduanero de la Unión con destino a un país tercero."
  explanation:
    es: "La declaración sumaria de entrada anuncia que determinadas mercancías van a entrar en el territorio aduanero de la Unión. Informar de que ya están en la aduana y disponibles para los controles es la presentación en aduana. Expresar la voluntad de incluirlas en un régimen es la declaración en aduana. Anunciar su salida hacia un país tercero no es el contenido de la declaración sumaria de entrada, que mira a la entrada."
  citation: "art. 5.9 CAU"
  difficulty: 1
  tags:
  - "definiciones"
  - "declaración sumaria"
# anchor: celex-32013r0952-art-5
- id: m03-l20-q0005
  prompt:
    es: "De acuerdo con el artículo 5, apartado 12, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, la declaración en aduana es el acto por el que una persona expresa, en la forma y el modo establecidos:"
  options:
  - id: a
    text:
      es: "La voluntad de reexportar las mercancías que se encuentren en depósito temporal, con mención del plazo y del lugar en que se hará la reexportación y de las condiciones aplicables."
  - id: b
    correct: true
    text:
      es: "La voluntad de incluir las mercancías en un determinado régimen aduanero, con mención, en su caso, de las disposiciones particulares que deban aplicarse."
  - id: c
    text:
      es: "La llegada de las mercancías a la aduana y su disponibilidad para los controles, con mención de las disposiciones particulares que deban aplicarse."
  - id: d
    text:
      es: "El compromiso de pagar los derechos de importación o de exportación aplicables a mercancías específicas, con mención de su importe."
  explanation:
    es: "La declaración en aduana expresa la voluntad de incluir las mercancías en un régimen aduanero, con las disposiciones particulares que correspondan. La voluntad de reexportar las mercancías en depósito temporal no es su contenido definido: la reexportación es otra salida de ese depósito. Notificar la llegada y la disponibilidad para los controles es la presentación en aduana. Comprometerse al pago de los derechos describe la deuda aduanera, no la declaración."
  citation: "art. 5.12 CAU"
  difficulty: 1
  tags:
  - "definiciones"
  - "declaración en aduana"
# anchor: celex-32013r0952-art-5
- id: m03-l20-q0006
  prompt:
    es: "Gestoría Norte presenta una declaración en aduana por encargo de Alfa Textil, S. L., y lo hace en nombre de Alfa Textil, S. L., no en el suyo propio. Conforme al artículo 5, apartado 15, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿quién es el declarante de esa declaración?"
  options:
  - id: a
    correct: true
    text:
      es: "Alfa Textil, S. L., por ser la persona en cuyo nombre se presenta la declaración en aduana."
  - id: b
    text:
      es: "Gestoría Norte, por ser la persona que presenta la declaración, aunque no la presente en nombre propio."
  - id: c
    text:
      es: "Gestoría Norte y Alfa Textil, S. L., conjuntamente, porque la condición de declarante alcanza siempre a quien presenta y a quien encarga la declaración."
  - id: d
    text:
      es: "El titular del depósito en el que se encuentren las mercancías, por ser la persona que las custodia hasta su despacho."
  explanation:
    es: "El declarante es quien presenta la declaración en nombre propio o aquella persona en cuyo nombre se presenta. Gestoría Norte no la presenta en nombre propio, y la presenta en nombre de Alfa Textil, S. L., que es por tanto la declarante. La gestoría no lo es por el solo hecho de presentarla. La condición no se reparte siempre entre quien presenta y quien encarga: el artículo distingue según el nombre en que se actúe. El titular del depósito no interviene en la declaración y custodiar las mercancías no confiere la condición de declarante."
  citation: "art. 5.15 CAU"
  difficulty: 2
  tags:
  - "definiciones"
  - "declarante"
# anchor: celex-32013r0952-art-5
- id: m03-l20-q0007
  prompt:
    es: "De acuerdo con el artículo 5, apartado 15, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre el declarante:"
  options:
  - id: a
    correct: true
    text:
      es: "Puede ser la persona que presenta una declaración sumaria de entrada en nombre propio, o la persona en cuyo nombre se presenta dicha declaración."
  - id: b
    text:
      es: "Solo es declarante la persona que presenta una declaración en aduana, no la que presenta una declaración sumaria de salida."
  - id: c
    text:
      es: "Es declarante únicamente la persona que presenta la declaración en nombre propio, y no la persona en cuyo nombre se presenta dicha declaración o notificación."
  - id: d
    text:
      es: "Es declarante quien presenta una declaración de depósito temporal, pero no quien presenta una notificación de reexportación."
  explanation:
    es: "La definición cubre la declaración en aduana, la de depósito temporal, la sumaria de entrada, la sumaria de salida, la de reexportación y la notificación de reexportación, y alcanza a quien presenta en nombre propio y a la persona en cuyo nombre se presenta. Por eso es erróneo limitarla a la declaración en aduana, excluir a la persona en cuyo nombre se presenta o dejar fuera la notificación de reexportación."
  citation: "art. 5.15 CAU"
  difficulty: 3
  tags:
  - "definiciones"
  - "declarante"
# anchor: celex-32013r0952-art-5
- id: m03-l20-q0008
  prompt:
    es: "De acuerdo con el artículo 5, apartado 16, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cuál de las siguientes enumeraciones recoge los regímenes aduaneros en los que pueden incluirse las mercancías?"
  options:
  - id: a
    text:
      es: "Despacho a libre práctica, regímenes especiales y reexportación."
  - id: b
    correct: true
    text:
      es: "Despacho a libre práctica, regímenes especiales y exportación."
  - id: c
    text:
      es: "Despacho a libre práctica, regímenes especiales e importación."
  - id: d
    text:
      es: "Despacho a libre práctica, depósito temporal y exportación."
  explanation:
    es: "El artículo 5.16 enumera tres grupos de regímenes aduaneros: el despacho a libre práctica, los regímenes especiales y la exportación. La reexportación no es régimen aduanero, sino una de las salidas de las mercancías en depósito temporal. La importación tampoco figura como régimen. El depósito temporal es una situación de las mercancías, definida aparte, no un régimen."
  citation: "art. 5.16 CAU"
  difficulty: 1
  tags:
  - "definiciones"
  - "régimen aduanero"
# anchor: celex-32013r0952-art-5
- id: m03-l20-q0009
  prompt:
    es: "De acuerdo con el artículo 5, apartado 17, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, el depósito temporal es la situación de las mercancías no pertenecientes a la Unión almacenadas bajo vigilancia aduanera entre su presentación en aduana y:"
  options:
  - id: a
    correct: true
    text:
      es: "Su inclusión en un régimen aduanero o su reexportación."
  - id: b
    text:
      es: "El levante de las mercancías o su despacho a libre práctica por las autoridades aduaneras."
  - id: c
    text:
      es: "La admisión de la declaración sumaria de entrada o su entrada en el territorio aduanero."
  - id: d
    text:
      es: "El pago de los derechos de importación o la constitución de una garantía por el declarante."
  explanation:
    es: "El período del depósito temporal va desde la presentación en aduana hasta que las mercancías se incluyen en un régimen aduanero o se reexportan. El levante es posterior a la inclusión en un régimen. La declaración sumaria y la entrada en el territorio son anteriores a la presentación. El pago de los derechos o la garantía no cierran la situación de depósito temporal."
  citation: "art. 5.17 CAU"
  difficulty: 1
  tags:
  - "definiciones"
  - "depósito temporal"
# anchor: celex-32013r0952-art-5
- id: m03-l20-q0010
  prompt:
    es: "De acuerdo con el artículo 5, apartado 18, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, la deuda aduanera es la obligación de una persona de pagar:"
  options:
  - id: a
    correct: true
    text:
      es: "El importe de los derechos de importación o de exportación aplicables a mercancías específicas con arreglo a la legislación aduanera vigente."
  - id: b
    text:
      es: "El importe de cualquier tributo interior que grave la circulación de mercancías específicas con arreglo a la legislación del Estado miembro de destino."
  - id: c
    text:
      es: "El importe de las sanciones aplicables a las infracciones aduaneras cometidas respecto de mercancías específicas."
  - id: d
    text:
      es: "El importe de los gastos de almacenamiento y manipulación de mercancías específicas bajo vigilancia aduanera."
  explanation:
    es: "La deuda aduanera consiste en pagar derechos de importación o de exportación aplicables a mercancías específicas. Los tributos interiores de un Estado miembro, las sanciones por infracciones aduaneras y los gastos de almacenamiento o manipulación son obligaciones distintas, y la definición no los recoge."
  citation: "art. 5.18 CAU"
  difficulty: 1
  tags:
  - "definiciones"
  - "deuda aduanera"
# anchor: celex-32013r0952-art-5
- id: m03-l20-q0011
  prompt:
    es: "De acuerdo con el artículo 5, apartado 19, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre el deudor:"
  options:
  - id: a
    text:
      es: "Deudor es únicamente quien introduce físicamente las mercancías en el territorio aduanero de la Unión, con independencia de quién deba pagar los derechos."
  - id: b
    correct: true
    text:
      es: "Deudor es toda persona responsable de una deuda aduanera, que es la obligación de pagar derechos de importación o de exportación."
  - id: c
    text:
      es: "Deudor es el Estado miembro en cuyo territorio nace la deuda aduanera, que responde frente a la Unión de los derechos exigibles."
  - id: d
    text:
      es: "Deudor es solo la persona que presenta la declaración en aduana, de modo que la persona por cuya cuenta se presenta no puede serlo."
  explanation:
    es: "El deudor es toda persona responsable de una deuda aduanera, sin limitarla a una sola figura. Quien introduce físicamente las mercancías puede ser deudor, pero no lo es solo por ello ni de forma exclusiva. El Estado miembro en que nace la deuda no es el deudor: es donde la deuda nace. Y el declarante no es el único deudor, porque la persona por cuya cuenta se hace la declaración también puede serlo en la representación indirecta."
  citation: "art. 5.19 CAU"
  difficulty: 2
  tags:
  - "definiciones"
  - "deudor"
# anchor: celex-32013r0952-art-5
- id: m03-l20-q0013
  prompt:
    es: "De acuerdo con el artículo 5, apartado 33, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, la presentación en aduana es la notificación a las autoridades aduaneras de la llegada de las mercancías a la aduana y de:"
  options:
  - id: a
    text:
      es: "Su inclusión en el régimen aduanero que haya elegido el declarante."
  - id: b
    text:
      es: "El pago de la garantía exigida para su inclusión en un régimen aduanero."
  - id: c
    text:
      es: "La voluntad de reexportarlas antes de que transcurran noventa días."
  - id: d
    correct: true
    text:
      es: "Su disponibilidad para los controles aduaneros."
  explanation:
    es: "La presentación en aduana notifica la llegada de las mercancías y su disponibilidad para los controles aduaneros. La inclusión en un régimen es posterior y se expresa mediante la declaración en aduana. La garantía no forma parte de la definición. La voluntad de reexportar no se notifica al presentar las mercancías: la reexportación es una de las salidas del depósito temporal."
  citation: "art. 5.33 CAU"
  difficulty: 1
  tags:
  - "definiciones"
  - "presentación en aduana"
# anchor: celex-32013r0952-art-5
- id: m03-l20-q0135
  prompt:
    es: "De acuerdo con el artículo 5 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre la declaración sumaria de entrada y la declaración en aduana:"
  options:
  - id: a
    correct: true
    text:
      es: "La declaración sumaria de entrada informa de que determinadas mercancías van a entrar en el territorio aduanero; la declaración en aduana expresa la voluntad de incluirlas en un régimen aduanero."
  - id: b
    text:
      es: "La declaración sumaria de entrada expresa la voluntad de incluir las mercancías en un régimen aduanero; la declaración en aduana informa de que van a entrar en el territorio aduanero."
  - id: c
    text:
      es: "Ambas expresan la voluntad de incluir las mercancías en un régimen aduanero, y solo se diferencian en el momento en que se presentan."
  - id: d
    text:
      es: "La declaración sumaria de entrada notifica la disponibilidad de las mercancías para los controles; la declaración en aduana notifica su llegada a la aduana de despacho."
  explanation:
    es: "La declaración sumaria de entrada informa de que las mercancías van a entrar en el territorio aduanero, y la declaración en aduana expresa la voluntad de incluirlas en un régimen. Intercambiar ambos contenidos los confunde. No es cierto que ambas expresen la voluntad de incluir las mercancías y solo difieran en el momento. Y notificar la llegada a la aduana y la disponibilidad para los controles es la presentación en aduana, que no es ninguna de las dos declaraciones."
  citation: "art. 5.12 CAU"
  difficulty: 2
  tags:
  - "definiciones"
  - "declaración sumaria"
  - "declaración en aduana"
