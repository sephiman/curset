m10-l06-q17:
  key:
    anchor: cyclonedx-spec#dependencies
    sentence: The dependency graph is capable of representing both direct and transitive relationships.
  wrong:
  - option: It inventories only third-party components, not first-party ones
    anchor: cyclonedx-spec#components
    sentence: Components describe the complete inventory of first-party and third-party components.
  - option: It describes software only, not hardware devices or machine learning models
    anchor: cyclonedx-spec#components
    sentence: The specification can represent software, hardware devices, machine learning models, source code, and configurations
  - option: Components that depend on services cannot be represented in it
    anchor: cyclonedx-spec#dependencies
    sentence: Components that depend on services can be represented in the dependency graph
m10-l06-q18:
  key:
    anchor: sigstore-cosign-signing#overview
    sentence: Keyless signing associates identities, rather than keys, with an artifact signature.
  wrong:
  - option: Fulcio issues long-lived certificates bound to a developer's permanent private key
    anchor: sigstore-cosign-signing#overview
    sentence: Fulcio issues short-lived certificates binding an ephemeral key to an OpenID Connect identity.
  - option: Signing events are recorded only on the signer's own machine
    anchor: sigstore-cosign-signing#overview
    sentence: Signing events are logged in Rekor, a signature transparency log, providing an auditable record of when a signature was created.
  - option: Verification relies on the signature alone, without comparing a log entry
    anchor: sigstore-cosign-signing#verifying-the-signed-artifact
    sentence: When a software consumer wants to verify the software’s signature, Sigstore compares a tuple of signature, key/certificate, and artifact from the timestamped object against the timestamped Rekor entry.
