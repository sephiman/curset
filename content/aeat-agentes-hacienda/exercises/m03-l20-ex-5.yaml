# anchor: celex-32013r0952-art-81
- id: m03-l20-q0071
  prompt:
    es: "De acuerdo con el artículo 81, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, una deuda aduanera de exportación nacerá al incluirse las mercancías sujetas a derechos de exportación en el régimen de exportación o en:"
  options:
  - id: a
    correct: true
    text:
      es: "El régimen de perfeccionamiento pasivo."
  - id: b
    text:
      es: "El régimen de importación temporal con exención parcial."
  - id: c
    text:
      es: "El régimen de depósito aduanero de la Unión."
  - id: d
    text:
      es: "El régimen de despacho a libre práctica."
  explanation:
    es: "La deuda de exportación nace por la inclusión en el régimen de exportación o en el de perfeccionamiento pasivo. La importación temporal con exención parcial y el despacho a libre práctica son regímenes de los que nace la deuda de importación. El depósito aduanero no figura en la lista del artículo 81.1."
  citation: "art. 81.1 CAU"
  difficulty: 1
  tags:
  - "deuda de exportación"
  - "regímenes"
# anchor: celex-32013r0952-art-81
- id: m03-l20-q0072
  prompt:
    es: "De acuerdo con el artículo 81, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿en cuál de los siguientes casos nace una deuda aduanera de exportación al incluirse las mercancías en un régimen?"
  options:
  - id: a
    text:
      es: "Mercancías no pertenecientes a la Unión sujetas a derechos de importación incluidas en el despacho a libre práctica."
  - id: b
    correct: true
    text:
      es: "Mercancías sujetas a derechos de exportación incluidas en el régimen de perfeccionamiento pasivo."
  - id: c
    text:
      es: "Mercancías no pertenecientes a la Unión incluidas en la importación temporal con exención parcial de derechos."
  - id: d
    text:
      es: "Mercancías de la Unión no sujetas a derechos de exportación incluidas en el régimen de exportación."
  explanation:
    es: "La deuda de exportación nace al incluir mercancías sujetas a derechos de exportación en el régimen de perfeccionamiento pasivo. Los otros dos primeros casos dan lugar a la deuda de importación del artículo 77. Y si las mercancías no están sujetas a derechos de exportación, no hay deuda por incluirlas en el régimen de exportación."
  citation: "art. 81.1 CAU"
  difficulty: 2
  tags:
  - "deuda de exportación"
  - "regímenes"
# anchor: celex-32013r0952-art-81
- id: m03-l20-q0073
  prompt:
    es: "De acuerdo con el artículo 81, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, la deuda aduanera de exportación nacerá en el momento de:"
  options:
  - id: a
    correct: true
    text:
      es: "La admisión de la declaración en aduana."
  - id: b
    text:
      es: "La salida efectiva de las mercancías del territorio aduanero de la Unión."
  - id: c
    text:
      es: "La presentación de la declaración en aduana ante la aduana de salida."
  - id: d
    text:
      es: "El pago de los derechos de exportación por el declarante."
  explanation:
    es: "La deuda de exportación nace con la admisión de la declaración en aduana. La salida efectiva de las mercancías es el momento de la deuda por incumplimiento del artículo 82.2.a), no de esta. Presentar la declaración no equivale a su admisión. Y el pago es posterior."
  citation: "art. 81.2 CAU"
  difficulty: 1
  tags:
  - "deuda de exportación"
  - "momento"
# anchor: celex-32013r0952-art-81
- id: m03-l20-q0074
  prompt:
    es: "Transportes Sur, S. L., presenta en su propio nombre, pero por cuenta de Beta Maquinaria, S. A., una declaración en aduana para exportar mercancías sujetas a derechos de exportación. Según el artículo 81, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿quiénes son deudores de la deuda aduanera de exportación?"
  options:
  - id: a
    correct: true
    text:
      es: "Transportes Sur, S. L., como declarante, y Beta Maquinaria, S. A., como persona por cuya cuenta se hace la declaración."
  - id: b
    text:
      es: "Solo Transportes Sur, S. L., porque el declarante es el único deudor incluso en la representación indirecta."
  - id: c
    text:
      es: "Solo Beta Maquinaria, S. A., porque la persona por cuya cuenta se declara asume la deuda del representante."
  - id: d
    text:
      es: "Transportes Sur, S. L., y Beta Maquinaria, S. A., pero solo cuando las mercancías salgan del territorio aduanero de la Unión."
  explanation:
    es: "En la representación indirecta el declarante es deudor y también lo es la persona por cuya cuenta se hace la declaración. Transportes Sur actúa en su propio nombre, y Beta Maquinaria es la persona por cuya cuenta lo hace: ambas son deudoras. No lo es solo la declarante, ni solo la representada. Y la deuda no depende de la salida efectiva: nace con la admisión de la declaración."
  citation: "art. 81.3 CAU"
  difficulty: 2
  tags:
  - "deuda de exportación"
  - "deudor"
  - "representación indirecta"
# anchor: celex-32013r0952-art-81
- id: m03-l20-q0075
  prompt:
    es: "De acuerdo con el artículo 81, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre la persona que suministra la información para la declaración en aduana de exportación:"
  options:
  - id: a
    text:
      es: "Es también deudora aunque ignorase razonablemente la falsedad de la información, si no se percibieron los derechos exigibles."
  - id: b
    correct: true
    text:
      es: "Es también deudora si sabía o debería razonablemente haber sabido que la información era falsa y llevó a no percibir parte de los derechos exigibles."
  - id: c
    text:
      es: "Solo es deudor el declarante; quien suministró la información falsa responde únicamente por las sanciones aduaneras."
  - id: d
    text:
      es: "Es también deudora, pero solo si la declaración se presentó mediante representación directa por cuenta de otra persona."
  explanation:
    es: "Es también deudora quien suministró la información requerida y sabía o debería razonablemente haber sabido que era falsa, cuando ello lleva a no percibir parte de los derechos. Quien la ignorase razonablemente no cumple el requisito. No es cierto que solo lo sea el declarante. Y el artículo no restringe la regla a la representación directa."
  citation: "art. 81.3 CAU"
  difficulty: 3
  tags:
  - "deuda de exportación"
  - "deudor"
  - "información falsa"
# anchor: celex-32013r0952-art-82
- id: m03-l20-q0076
  prompt:
    es: "De acuerdo con el artículo 82, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, respecto de las mercancías sujetas a derechos de exportación, nacerá una deuda aduanera de exportación por incumplimiento de:"
  options:
  - id: a
    text:
      es: "Una de las obligaciones establecidas en la legislación aduanera para la introducción de mercancías no pertenecientes a la Unión."
  - id: b
    text:
      es: "Una de las obligaciones relativas al destino final de las mercancías dentro del territorio aduanero de la Unión."
  - id: c
    correct: true
    text:
      es: "Una de las obligaciones establecidas en la legislación aduanera para la salida de las mercancías."
  - id: d
    text:
      es: "Una de las condiciones que regulan la inclusión de mercancías en el régimen de importación temporal."
  explanation:
    es: "La deuda de exportación por incumplimiento nace cuando se incumple una obligación para la salida de las mercancías o las condiciones con que se permitió la salida con exención. Las obligaciones de introducción, el destino final y las condiciones de la importación temporal corresponden a la deuda de importación del artículo 79."
  citation: "art. 82.1 CAU"
  difficulty: 2
  tags:
  - "deuda de exportación"
  - "incumplimiento"
# anchor: celex-32013r0952-art-82
- id: m03-l20-q0077
  prompt:
    es: "De acuerdo con el artículo 82, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, la deuda aduanera de exportación por incumplimiento nace, entre otros momentos, cuando las mercancías:"
  options:
  - id: a
    text:
      es: "Sean presentadas en la aduana de salida sin una declaración sumaria de salida."
  - id: b
    text:
      es: "Sean incluidas en el régimen de exportación sin que se hayan pagado los derechos."
  - id: c
    text:
      es: "Lleguen a un Estado miembro distinto de aquel en que se admitió la declaración en aduana."
  - id: d
    correct: true
    text:
      es: "Salgan efectivamente del territorio aduanero de la Unión sin una declaración en aduana."
  explanation:
    es: "La deuda nace cuando las mercancías salen efectivamente del territorio aduanero de la Unión sin una declaración en aduana. Presentarlas en la aduana de salida sin una declaración sumaria no es la salida efectiva. Incluirlas en el régimen de exportación sin pagar es una situación distinta, que no genera deuda por incumplimiento. Y llegar a otro Estado miembro no figura entre los momentos del artículo."
  citation: "art. 82.2 CAU"
  difficulty: 1
  tags:
  - "deuda de exportación"
  - "incumplimiento"
  - "momento"
# anchor: celex-32013r0952-art-82
- id: m03-l20-q0078
  prompt:
    es: "De acuerdo con el artículo 82, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, la deuda aduanera de exportación por incumplimiento nace, entre otros momentos, cuando las mercancías alcancen:"
  options:
  - id: a
    text:
      es: "El destino para el que fueron autorizadas a salir con exención, pero con retraso sobre el plazo previsto."
  - id: b
    text:
      es: "Un destino situado dentro del territorio aduanero de la Unión, tras haberse admitido la declaración en aduana."
  - id: c
    text:
      es: "Un destino distinto de aquel que figure en la declaración sumaria de salida, aunque no gocen de exención alguna ni se hayan incumplido condiciones."
  - id: d
    correct: true
    text:
      es: "Un destino distinto de aquel para el que fueron autorizadas a salir con exención total o parcial de los derechos de exportación."
  explanation:
    es: "La deuda nace cuando las mercancías alcanzan un destino distinto de aquel para el que se autorizó la salida con exención total o parcial. Llegar al destino autorizado con retraso no es alcanzar un destino distinto. Quedarse dentro del territorio aduanero no es salir. Y el destino distinto debe referirse a mercancías que salieron con exención, no a la declaración sumaria."
  citation: "art. 82.2 CAU"
  difficulty: 3
  tags:
  - "deuda de exportación"
  - "incumplimiento"
  - "momento"
# anchor: celex-32013r0952-art-82
- id: m03-l20-q0079
  prompt:
    es: "De acuerdo con el artículo 82, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, si no puede determinarse el momento en que las mercancías alcanzaron un destino distinto del autorizado, la deuda nace en el momento de:"
  options:
  - id: a
    text:
      es: "La salida efectiva de las mercancías del territorio aduanero de la Unión, con independencia de las pruebas."
  - id: b
    text:
      es: "La notificación al declarante del importe de los derechos de exportación correspondientes."
  - id: c
    correct: true
    text:
      es: "El vencimiento del plazo fijado para la presentación de pruebas de que se han cumplido las condiciones que permiten la exención."
  - id: d
    text:
      es: "La admisión de la declaración en aduana de exportación por las autoridades aduaneras."
  explanation:
    es: "Si no se puede fijar el momento en que alcanzaron el destino distinto, la deuda nace cuando vence el plazo para presentar las pruebas de que se cumplieron las condiciones de la exención. La salida efectiva es otro momento, el de la salida sin declaración. La notificación del importe y la admisión de la declaración no son el hecho que el artículo toma como referencia."
  citation: "art. 82.2 CAU"
  difficulty: 3
  tags:
  - "deuda de exportación"
  - "incumplimiento"
  - "momento"
# anchor: celex-32013r0952-art-82
- id: m03-l20-q0080
  prompt:
    es: "El 4 de junio de 2027 unas mercancías sujetas a derechos de exportación salen efectivamente del territorio aduanero de la Unión sin declaración en aduana. Las autoridades aduaneras lo descubren el 20 de junio de 2027. Conforme al artículo 82, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cuándo nace la deuda aduanera de exportación?"
  options:
  - id: a
    text:
      es: "El 20 de junio de 2027, cuando las autoridades aduaneras descubrieron la salida."
  - id: b
    correct: true
    text:
      es: "El 4 de junio de 2027, cuando las mercancías salieron efectivamente sin declaración en aduana."
  - id: c
    text:
      es: "El 1 de junio de 2027, al incluirse las mercancías en el régimen de exportación."
  - id: d
    text:
      es: "El 4 de julio de 2027, al vencer un mes desde la salida de las mercancías."
  explanation:
    es: "La deuda nace en el momento en que las mercancías salen efectivamente del territorio sin declaración en aduana: el 4 de junio de 2027. La fecha del descubrimiento, el 20 de junio, no cuenta. Tampoco existe una inclusión en el régimen de exportación, que presupone una declaración. Y el artículo no fija un plazo de un mes desde la salida."
  citation: "art. 82.2 CAU"
  difficulty: 2
  tags:
  - "deuda de exportación"
  - "incumplimiento"
  - "momento"
  - "cómputo"
# anchor: celex-32013r0952-art-82
- id: m03-l20-q0081
  prompt:
    es: "De acuerdo con el artículo 82, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, en los casos de la letra a) del apartado 1, el deudor será, entre otros, toda persona que:"
  options:
  - id: a
    text:
      es: "Hubiera participado en el acto que llevó al incumplimiento, aunque ignorase razonablemente que debía presentarse una declaración en aduana."
  - id: b
    text:
      es: "Hubiera adquirido las mercancías después de la salida, aunque no hubiera participado en el acto que llevó al incumplimiento."
  - id: c
    text:
      es: "Hubiera transportado las mercancías hasta la aduana de salida, con independencia de lo que supiera sobre la declaración."
  - id: d
    correct: true
    text:
      es: "Hubiera participado en el acto que llevó al incumplimiento y supiera o debiera razonablemente haber sabido que no se había presentado una declaración en aduana preceptiva."
  explanation:
    es: "Es deudor quien participó en el acto del incumplimiento y supo, o debió razonablemente haber sabido, que no se había presentado una declaración en aduana preceptiva. Participar ignorándolo razonablemente no basta. Adquirir las mercancías es un supuesto de la deuda de importación, no de este artículo. Y transportarlas sin ese conocimiento tampoco es un supuesto que el artículo recoja."
  citation: "art. 82.3 CAU"
  difficulty: 3
  tags:
  - "deuda de exportación"
  - "incumplimiento"
  - "deudor"
# anchor: celex-32013r0952-art-82
- id: m03-l20-q0082
  prompt:
    es: "Conforme al artículo 82, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿es deudora quien sabía que no se había cumplido una obligación de salida de las mercancías y actuó por cuenta de la persona obligada a cumplirla?"
  options:
  - id: a
    text:
      es: "No, porque solo es deudora la persona a la que se hubiera exigido el cumplimiento de la obligación."
  - id: b
    text:
      es: "No, porque solo es deudor quien participó en el acto que condujo al incumplimiento de la obligación."
  - id: c
    correct: true
    text:
      es: "Sí, porque supo que no se había cumplido la obligación y actuó por cuenta de la persona obligada a cumplirla."
  - id: d
    text:
      es: "Sí, pero solo si además adquirió las mercancías con posterioridad a su salida del territorio aduanero de la Unión."
  explanation:
    es: "Es deudor quien supo o debió razonablemente haber sabido que no se había cumplido la obligación y actuó por cuenta de la persona obligada, y esa persona cumple los dos rasgos. La persona a quien se exigía el cumplimiento es otra categoría de deudor, no la única. Participar en el acto es la categoría de la letra c), distinta de esta. Y adquirir las mercancías no es un requisito que añada el artículo."
  citation: "art. 82.3 CAU"
  difficulty: 2
  tags:
  - "deuda de exportación"
  - "incumplimiento"
  - "deudor"
# anchor: celex-32013r0952-art-82
- id: m03-l20-q0083
  prompt:
    es: "De acuerdo con el artículo 82, apartado 4, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, en los casos de la letra b) del apartado 1, el deudor será toda persona que esté obligada a cumplir:"
  options:
  - id: a
    text:
      es: "Las obligaciones establecidas en la legislación aduanera para la salida de las mercancías sin declaración en aduana."
  - id: b
    correct: true
    text:
      es: "Las condiciones con arreglo a las cuales se autorizó la salida de las mercancías con exención total o parcial de los derechos de exportación."
  - id: c
    text:
      es: "Las condiciones que regulan la inclusión de las mercancías en un régimen de importación con destino final."
  - id: d
    text:
      es: "Las obligaciones relativas a la introducción de las mercancías en el territorio aduanero de la Unión."
  explanation:
    es: "En los casos de la letra b), el deudor es quien debe cumplir las condiciones con las que se autorizó la salida con exención de derechos de exportación. Las obligaciones de salida sin declaración son el caso de la letra a). Las condiciones de la importación con destino final y las obligaciones de introducción pertenecen a la deuda de importación."
  citation: "art. 82.4 CAU"
  difficulty: 2
  tags:
  - "deuda de exportación"
  - "incumplimiento"
  - "deudor"
# anchor: celex-32013r0952-art-81
- id: m03-l20-q0084
  prompt:
    es: "De acuerdo con los artículos 77.2 y 81.2 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre el nacimiento de la deuda aduanera por inclusión de las mercancías en un régimen:"
  options:
  - id: a
    correct: true
    text:
      es: "Tanto la deuda de importación como la de exportación nacen en el momento de la admisión de la declaración en aduana."
  - id: b
    text:
      es: "La deuda de importación nace en el levante y la de exportación en la admisión de la declaración en aduana."
  - id: c
    text:
      es: "La deuda de exportación nace en la presentación en aduana y la de importación en la admisión de la declaración en aduana."
  - id: d
    text:
      es: "Ambas nacen en el momento en que las mercancías salen efectivamente del territorio aduanero de la Unión."
  explanation:
    es: "Las dos deudas nacen en el momento de la admisión de la declaración en aduana. No nace ninguna con el levante ni con la presentación en aduana. Y la salida efectiva solo es el momento de una de las deudas por incumplimiento."
  citation: "art. 81.2 CAU"
  difficulty: 2
  tags:
  - "deuda de exportación"
  - "deuda de importación"
  - "momento"
# anchor: celex-32013r0952-art-82
- id: m03-l20-q0132
  prompt:
    es: "De acuerdo con el artículo 82, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cuál de las siguientes circunstancias hace nacer una deuda aduanera de exportación por incumplimiento?"
  options:
  - id: a
    text:
      es: "El incumplimiento de las condiciones con arreglo a las cuales se permitió la entrada de las mercancías con exención de los derechos de importación."
  - id: b
    text:
      es: "La salida de mercancías del territorio aduanero de la Unión que no estén sujetas a derechos de exportación."
  - id: c
    correct: true
    text:
      es: "El incumplimiento de las condiciones con arreglo a las cuales se permitió la salida de las mercancías con exención total o parcial de los derechos de exportación."
  - id: d
    text:
      es: "El retraso en la presentación de la declaración sumaria de salida respecto del plazo establecido."
  explanation:
    es: "La deuda de exportación nace, entre otros supuestos, por el incumplimiento de las condiciones con que se permitió la salida con exención total o parcial de derechos de exportación. El incumplimiento de las condiciones de entrada con exención de derechos de importación origina la deuda del artículo 79. Y el artículo 82 se refiere a mercancías sujetas a derechos de exportación, y a obligaciones o condiciones de la salida, no a un retraso en una declaración sumaria."
  citation: "art. 82.1 CAU"
  difficulty: 2
  tags:
  - "deuda de exportación"
  - "incumplimiento"
