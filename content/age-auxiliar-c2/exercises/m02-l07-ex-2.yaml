# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q060
  prompt:
    es: "En el Explorador de archivos de Windows 11, si solo hay una pestaña abierta, la combinación Ctrl+W:"
  options:
  - id: a
    text:
      es: "No hace nada, porque solo cierra pestañas."
  - id: b
    text:
      es: "Abre una nueva ventana del Explorador."
  - id: c
    text:
      es: "Abre una pestaña nueva y cambia a ella."
  - id: d
    correct: true
    text:
      es: "Cierra la ventana del Explorador de archivos."
  explanation:
    es: "La tabla asigna a Ctrl+W «Cierra la pestaña activa. Cierra la ventana si solo hay una pestaña abierta». No queda sin efecto con una sola pestaña. Abrir una pestaña nueva es Ctrl+T y abrir una nueva ventana es Ctrl+U."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 3
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q061
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué hace la tecla F4, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Selecciona la barra de direcciones para cambiar la ruta"
  - id: b
    text:
      es: "Actualiza el contenido de la ventana activa"
  - id: c
    text:
      es: "Cambia el nombre del elemento que está seleccionado"
  - id: d
    text:
      es: "Busca un archivo o una carpeta en la ubicación"
  explanation:
    es: "La tabla asigna a F4 «Seleccione la barra de direcciones para cambiar la ruta de acceso actual». F3 busca un archivo o carpeta, F5 actualiza la ventana y F2 cambia el nombre del elemento seleccionado."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q062
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes teclas se desplaza por los elementos de la ventana?"
  options:
  - id: a
    correct: true
    text:
      es: "F6"
  - id: b
    text:
      es: "F5"
  - id: c
    text:
      es: "F3"
  - id: d
    text:
      es: "F11"
  explanation:
    es: "La tabla asigna a F6 «Desplazarse por los elementos de la ventana»; la guía de Microsoft para lectores de pantalla añade que F6 avanza y Mayús+F6 retrocede. F5 actualiza la ventana, F11 maximiza o minimiza la ventana activa y F3 busca un archivo o carpeta."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q063
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué hace la combinación Mayús+F10, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    text:
      es: "Maximiza o minimiza la ventana que está activa"
  - id: b
    text:
      es: "Elimina el elemento sin moverlo a la Papelera"
  - id: c
    text:
      es: "Muestra las propiedades del elemento seleccionado"
  - id: d
    correct: true
    text:
      es: "Muestra el menú contextual del elemento seleccionado"
  explanation:
    es: "La tabla asigna a Mayús+F10 «Mostrar el menú contextual del elemento seleccionado». Las propiedades se ven con Alt+Entrar, Mayús+Supr elimina sin mover a la Papelera de reciclaje y F11 maximiza o minimiza la ventana activa."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l07-q064
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes acciones muestra el menú contextual «Mostrar más opciones» del elemento seleccionado?"
  options:
  - id: a
    text:
      es: "Alt+Entrar"
  - id: b
    text:
      es: "Ctrl+Mayús+N"
  - id: c
    text:
      es: "Alt+Barra espaciadora"
  - id: d
    correct: true
    text:
      es: "Mayús+clic con el botón derecho"
  explanation:
    es: "La tabla del Explorador asigna a Mayús+clic con el botón derecho del ratón «Mostrar el menú contextual Mostrar más opciones para el elemento seleccionado». Alt+Entrar muestra las propiedades del elemento; Alt+Barra espaciadora abre el menú contextual de la ventana activa, no el del archivo, y Ctrl+Mayús+N crea una carpeta nueva."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q065
  prompt:
    es: "Señale qué comandos sitúa Microsoft en la parte superior del nuevo menú contextual de un archivo en el Explorador de archivos de Windows 11:"
  options:
  - id: a
    text:
      es: "Abrir, Copiar, Pegar, Cambiar nombre, Propiedades y Eliminar."
  - id: b
    correct: true
    text:
      es: "Cortar, Copiar, Pegar, Cambiar nombre, Compartir y Eliminar."
  - id: c
    text:
      es: "Cortar, Copiar, Pegar, Enviar a, Compartir y Eliminar."
  - id: d
    text:
      es: "Cortar, Copiar, Pegar, Cambiar nombre, Conceder acceso a y Eliminar."
  explanation:
    es: "La ayuda del Explorador dice que Cortar, Copiar, Pegar, Cambiar nombre, Compartir y Eliminar están «en la parte superior del menú contextual». Enviar a está en Mostrar más opciones, como indica la página de compresión («Mostrar más opciones>Enviar a»); Abrir y Propiedades no están en esa lista, y Conceder acceso a está también en Mostrar más opciones."
  citation: "fuente: `ms-win-explorador.html`; «Buscar acciones comunes»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q066
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué se selecciona en el menú contextual de un archivo para encontrar los comandos del menú contextual anterior de Windows 10?"
  options:
  - id: a
    text:
      es: "Compartir"
  - id: b
    text:
      es: "Abrir con"
  - id: c
    text:
      es: "Propiedades"
  - id: d
    correct: true
    text:
      es: "Mostrar más opciones"
  explanation:
    es: "La ayuda del Explorador indica que, para encontrar los comandos del menú contextual anterior de Windows 10, se hace clic con el botón derecho en el archivo o carpeta y se selecciona «Mostrar más opciones». Abrir con sirve para elegir la aplicación que abre el archivo, Propiedades muestra las del elemento y Compartir lo comparte."
  citation: "fuente: `ms-win-explorador.html`; «Buscar comandos en el menú contextual anterior de Windows 10»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q067
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las extensiones del menú contextual de Windows 10 en el Explorador de archivos de Windows 11 es correcta, según Microsoft?"
  options:
  - id: a
    text:
      es: "No están en ningún menú contextual de Windows 11, porque se han retirado."
  - id: b
    text:
      es: "Están en el menú simplificado, pero ya no aparecen en Mostrar más opciones."
  - id: c
    correct: true
    text:
      es: "No todas están en el menú simplificado, pero siempre en Mostrar más opciones."
  - id: d
    text:
      es: "Todas están en el menú simplificado, por lo que Mostrar más opciones desaparece."
  explanation:
    es: "La nota de la página dice: «No todas las extensiones de Windows 10 estarán disponibles en el menú contextual de Windows 11 simplificado, pero siempre estarán disponibles al seleccionar Mostrar más opciones». Por eso no están todas en el menú simplificado, Mostrar más opciones sigue existiendo y las extensiones no se han retirado."
  citation: "fuente: `ms-win-explorador.html`; «Buscar comandos en el menú contextual anterior de Windows 10»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-explorador-html
- id: m02-l07-q068
  prompt:
    es: "Según la ayuda del Explorador de archivos de Windows 11, para mover un archivo o una carpeta a otra ubicación se selecciona el elemento y:"
  options:
  - id: a
    text:
      es: "Cambiar nombre; después se escribe la ruta completa de la nueva ubicación."
  - id: b
    text:
      es: "Copiar; después se va a la nueva ubicación y se selecciona Pegar."
  - id: c
    text:
      es: "Compartir; después se elige la nueva ubicación como destino del envío."
  - id: d
    correct: true
    text:
      es: "Cortar; después se va a la nueva ubicación y se selecciona Pegar."
  explanation:
    es: "La página indica: «Para mover la ubicación de un archivo o carpeta, selecciónelo y, a continuación, seleccione Cortar». Después se va a la nueva ubicación y se selecciona Pegar. Copiar deja el original donde estaba; Compartir sirve para compartir el archivo, y Cambiar nombre cambia el nombre, no la ubicación."
  citation: "fuente: `ms-win-explorador.html`; «Explorador de archivos en Windows»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-explorador-lector-html
- id: m02-l07-q225
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál es el estado predeterminado del panel de detalles, según la ayuda de Microsoft para lectores de pantalla?"
  options:
  - id: a
    text:
      es: "Está activado, pero se puede ocultar con Alt+P en cualquier momento"
  - id: b
    correct: true
    text:
      es: "Está desactivado, pero se puede habilitar cuando se necesite"
  - id: c
    text:
      es: "Solo se muestra cuando el panel de contenido está en el modo de vista Detalles"
  - id: d
    text:
      es: "Está activado de forma predeterminada y no se puede ocultar"
  explanation:
    es: "El panel de detalles es opcional: está desactivado de forma predeterminada y se habilita cuando hace falta. Alt+P muestra u oculta el panel de vista previa, no el de detalles, y su estado no depende del modo de vista."
  citation: "fuente: `ms-win-explorador-lector.html`; «Recorrer los elementos principales de la pantalla»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-explorador-lector-html
- id: m02-l07-q226
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿en qué zona de la ventana se muestran las pestañas abiertas, según la ayuda para lectores de pantalla?"
  options:
  - id: a
    correct: true
    text:
      es: "En la parte superior de la ventana"
  - id: b
    text:
      es: "Junto al cuadro de búsqueda, a su derecha"
  - id: c
    text:
      es: "En la parte inferior derecha de la ventana"
  - id: d
    text:
      es: "En el lado izquierdo de la ventana"
  explanation:
    es: "Las pestañas están en la parte superior de la ventana, con una opción para agregar una nueva. La parte inferior derecha es la barra de estado, el lado izquierdo es el panel de navegación y el cuadro de búsqueda está en la barra de herramientas."
  citation: "fuente: `ms-win-explorador-lector.html`; «Recorrer los elementos principales de la pantalla»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-explorador-lector-html
- id: m02-l07-q228
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cómo se seleccionan varios archivos consecutivos con el teclado, según la ayuda para lectores de pantalla?"
  options:
  - id: a
    text:
      es: "Con Ctrl y las teclas de dirección, sin otra tecla"
  - id: b
    text:
      es: "Con la tecla F6 y la Barra espaciadora"
  - id: c
    text:
      es: "Con Alt y las teclas de dirección"
  - id: d
    correct: true
    text:
      es: "Con Mayús y las teclas de dirección"
  explanation:
    es: "Para seleccionar varios archivos se navega al primero, se mantiene pulsada Mayús y se usan las teclas de dirección. Con Ctrl y las flechas solo se mueve el foco y se necesita la Barra espaciadora para seleccionar, Alt+Flecha va a otras carpetas y F6 cambia de zona de la ventana."
  citation: "fuente: `ms-win-explorador-lector.html`; «Navegar por el panel de contenido»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-explorador-lector-html
- id: m02-l07-q229
  prompt:
    es: "En el Explorador de archivos de Windows 11, en el modo de vista Detalles, ¿para qué sirven los botones de ordenación?"
  options:
  - id: a
    text:
      es: "Para agrupar los elementos por la carpeta que los contiene en la ruta"
  - id: b
    correct: true
    text:
      es: "Para ordenar los elementos por criterios como Nombre o Fecha de modificación"
  - id: c
    text:
      es: "Para cambiar el diseño a iconos extra grandes o a iconos pequeños"
  - id: d
    text:
      es: "Para mostrar u ocultar el panel de detalles de cada elemento"
  explanation:
    es: "En vista Detalles, los botones de ordenación ordenan por criterios como Nombre o Fecha de modificación: ordenan, no agrupan. El diseño se cambia con Ver o con los botones de la barra de estado y el panel de detalles se muestra con Alt+Mayús+P."
  citation: "fuente: `ms-win-explorador-lector.html`; «Navegar por el panel de contenido»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-explorador-lector-html
- id: m02-l07-q230
  prompt:
    es: "En Windows 11, tras elegir una aplicación con Abrir con › Elegir otra aplicación, ¿qué opción hace que todos los archivos de ese tipo se abran con ella de forma predeterminada?"
  options:
  - id: a
    text:
      es: "Elegir una aplicación en tu PC"
  - id: b
    correct: true
    text:
      es: "Siempre"
  - id: c
    text:
      es: "Buscar en Microsoft Store"
  - id: d
    text:
      es: "Solo una vez"
  explanation:
    es: "Con Siempre, todos los archivos de ese tipo se abren por defecto con la aplicación elegida. Solo una vez aplica la elección a esta apertura, Buscar en Microsoft Store muestra aplicaciones de la tienda y Elegir una aplicación en tu PC busca otras instaladas."
  citation: "fuente: `ms-win-explorador-lector.html`; «Abrir los archivos con aplicaciones específicas»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q231
  prompt:
    es: "En Windows 11, ¿qué permite hacer «Elegir una aplicación en tu PC» dentro de Abrir con › Elegir otra aplicación, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Mostrar las aplicaciones de Microsoft Store que abren el archivo"
  - id: b
    correct: true
    text:
      es: "Buscar otras aplicaciones instaladas en el equipo"
  - id: c
    text:
      es: "Hacer que todos los archivos de ese tipo se abran siempre con la aplicación elegida"
  - id: d
    text:
      es: "Cambiar la extensión del nombre del archivo"
  explanation:
    es: "Esa opción sirve para buscar otras aplicaciones instaladas. Las aplicaciones de Microsoft Store se ven con Abrir con › Buscar en Microsoft Store, cambiar la extensión no convierte el archivo, y hacer que todos los archivos de ese tipo se abran con la aplicación elegida es la opción Siempre."
  citation: "fuente: `ms-win-extensiones.html`; «Abrir extensiones de archivo desconocidas»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q234
  prompt:
    es: "Según la lista de extensiones de nombre de archivo habituales de Windows, ¿qué formato indica la extensión pptx?"
  options:
  - id: a
    correct: true
    text:
      es: "Presentación de Microsoft PowerPoint"
  - id: b
    text:
      es: "Presentación de Microsoft PowerPoint anterior a PowerPoint 2007"
  - id: c
    text:
      es: "Plantilla de Microsoft PowerPoint"
  - id: d
    text:
      es: "Presentación habilitada para macros de Microsoft PowerPoint"
  explanation:
    es: "pptx es una presentación de Microsoft PowerPoint. ppt es la anterior a PowerPoint 2007, potx es la plantilla y pptm la presentación habilitada para macros."
  citation: "fuente: `ms-win-extensiones.html`; «Extensiones de nombre de archivo habituales»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q235
  prompt:
    es: "Según la lista de extensiones de nombre de archivo habituales de Windows, ¿cuál corresponde a una hoja de cálculo de Microsoft Excel habilitada para macros?"
  options:
  - id: a
    text:
      es: "xltm"
  - id: b
    text:
      es: "xls"
  - id: c
    correct: true
    text:
      es: "xlsm"
  - id: d
    text:
      es: "xlsx"
  explanation:
    es: "xlsm es la hoja de cálculo habilitada para macros. xlsx es la hoja posterior a Excel 2007 sin macros, xls la anterior a Excel 2007 y xltm una plantilla habilitada para macros."
  citation: "fuente: `ms-win-extensiones.html`; «Extensiones de nombre de archivo habituales»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q236
  prompt:
    es: "Según la lista de extensiones de nombre de archivo habituales de Windows, ¿cuál de las siguientes extensiones corresponde a un archivo de valores separados por comas?"
  options:
  - id: a
    text:
      es: "eml"
  - id: b
    correct: true
    text:
      es: "csv"
  - id: c
    text:
      es: "dif"
  - id: d
    text:
      es: "ini"
  explanation:
    es: "csv es el archivo de valores separados por comas. dif es el formato de intercambio de datos de hoja de cálculo, ini el archivo de configuración de inicialización de Windows y eml un archivo de correo electrónico."
  citation: "fuente: `ms-win-extensiones.html`; «Extensiones de nombre de archivo habituales»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-extensiones-html
- id: m02-l07-q237
  prompt:
    es: "Según la lista de extensiones de nombre de archivo habituales de Windows, ¿cuál de las siguientes extensiones corresponde a un almacén de datos de Outlook?"
  options:
