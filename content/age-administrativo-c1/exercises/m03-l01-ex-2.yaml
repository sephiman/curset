# anchor: boe-a-1978-31229-art-82
- id: m03-l01-q018
  prompt:
    es: "Según el artículo 82.1 de la Constitución Española de 1978, las Cortes Generales podrán delegar en el Gobierno la potestad de dictar normas con rango de ley:"
  options:
  - id: a
    text:
      es: "Sobre cualquier materia, incluidas las reservadas a ley orgánica."
  - id: b
    correct: true
    text:
      es: "Sobre materias determinadas no incluidas en el artículo 81 de la Constitución."
  - id: c
    text:
      es: "Sobre materias determinadas, incluido el régimen electoral general."
  - id: d
    text:
      es: "Sobre todas las materias, salvo las presupuestarias y tributarias."
  explanation:
    es: "El artículo 82.1 permite delegar «sobre materias determinadas no incluidas en el artículo anterior», que es el artículo 81, el de las leyes orgánicas. No cabe delegar en materias de ley orgánica, y el régimen electoral general es una de ellas (art. 81.1 CE). La opción de las materias presupuestarias y tributarias inventa una excepción y admite las materias del artículo 81, que el texto excluye."
  citation: "art. 82.1 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-82
- id: m03-l01-q019
  prompt:
    es: "De acuerdo con el artículo 82.2 de la Constitución Española de 1978, la delegación legislativa cuyo objeto sea la formación de textos articulados deberá otorgarse mediante:"
  options:
  - id: a
    text:
      es: "Una ley ordinaria de delegación aprobada por las Cortes Generales."
  - id: b
    text:
      es: "Una ley orgánica de delegación aprobada por el Congreso."
  - id: c
    correct: true
    text:
      es: "Una ley de bases aprobada por las Cortes Generales."
  - id: d
    text:
      es: "Un real decreto legislativo del Gobierno."
  explanation:
    es: "El artículo 82.2 exige «una ley de bases cuando su objeto sea la formación de textos articulados». La ley ordinaria es la que se usa para refundir varios textos legales en uno solo. La Constitución no pide ley orgánica para delegar. El real decreto legislativo es la forma de la norma que dicta el Gobierno en uso de la delegación, no el acto que la otorga."
  citation: "art. 82.2 CE"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-82
- id: m03-l01-q020
  prompt:
    es: "¿Mediante qué ley se otorga la delegación legislativa para refundir varios textos legales en uno solo, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Mediante una ley de bases de las Cortes Generales."
  - id: b
    text:
      es: "Mediante una ley orgánica de las Cortes Generales."
  - id: c
    text:
      es: "Mediante una ley aprobada solo por el Congreso de los Diputados."
  - id: d
    correct: true
    text:
      es: "Mediante una ley ordinaria de las Cortes Generales."
  explanation:
    es: "El artículo 82.2 dice que la delegación se otorga «por una ley ordinaria cuando se trate de refundir varios textos legales en uno solo». La ley de bases es para la formación de textos articulados. La Constitución no exige ley orgánica para delegar, y las leyes las aprueban las Cortes Generales, no el Congreso solo."
  citation: "art. 82.2 CE"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-82
- id: m03-l01-q021
  prompt:
    es: "Según el artículo 82.3 de la Constitución Española de 1978, la delegación legislativa habrá de otorgarse al Gobierno:"
  options:
  - id: a
    correct: true
    text:
      es: "De forma expresa para materia concreta y con fijación del plazo para su ejercicio."
  - id: b
    text:
      es: "De forma expresa o tácita, para materia concreta y con fijación del plazo para su ejercicio."
  - id: c
    text:
      es: "De forma expresa para materia concreta, sin que sea necesario fijar un plazo para su ejercicio."
  - id: d
    text:
      es: "De forma expresa para un conjunto indeterminado de materias y con fijación del plazo de ejercicio."
  explanation:
    es: "El artículo 82.3 exige que la delegación se otorgue «de forma expresa para materia concreta y con fijación del plazo para su ejercicio». No cabe la delegación tácita: «no podrá entenderse concedida de modo implícito». El plazo es obligatorio, porque tampoco puede concederse «por tiempo indeterminado». La materia ha de ser concreta, no un conjunto indeterminado."
  citation: "art. 82.3 CE"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-82
- id: m03-l01-q022
  prompt:
    es: "Señale la respuesta correcta sobre el otorgamiento de la delegación legislativa al Gobierno según la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Podrá entenderse concedida de modo implícito si la ley de bases así lo prevé."
  - id: b
    correct: true
    text:
      es: "No podrá entenderse concedida de modo implícito o por tiempo indeterminado."
  - id: c
    text:
      es: "Podrá concederse por tiempo indeterminado cuando se trate de refundir textos."
  - id: d
    text:
      es: "Podrá entenderse concedida de modo implícito en las leyes ordinarias."
  explanation:
    es: "El artículo 82.3 dice que la delegación «no podrá entenderse concedida de modo implícito o por tiempo indeterminado». La regla no tiene excepciones: ni la ley de bases ni la ley ordinaria pueden prever una delegación implícita, y la refundición de textos también exige plazo."
  citation: "art. 82.3 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-82
- id: m03-l01-q023
  prompt:
    es: "Según el artículo 82.3 de la Constitución Española de 1978, ¿cómo se agota la delegación legislativa otorgada al Gobierno?"
  options:
  - id: a
    text:
      es: "Por el transcurso de un año desde la entrada en vigor de la ley de delegación."
  - id: b
    text:
      es: "Por la convalidación del texto por el Congreso de los Diputados en el plazo de treinta días."
  - id: c
    correct: true
    text:
      es: "Por el uso que de ella haga el Gobierno mediante la publicación de la norma correspondiente."
  - id: d
    text:
      es: "Por la aprobación del texto en Consejo de Ministros, aunque todavía no se haya publicado."
  explanation:
    es: "El artículo 82.3 dice que la delegación «se agota por el uso que de ella haga el Gobierno mediante la publicación de la norma correspondiente». La Constitución no fija un año: el plazo lo fija cada ley de delegación. La convalidación en treinta días es la de los decretos-leyes (art. 86.2). La aprobación en Consejo de Ministros sin publicación no agota la delegación."
  citation: "art. 82.3 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-82
- id: m03-l01-q024
  prompt:
    es: "¿Puede la delegación legislativa permitir la subdelegación de la potestad recibida por el Gobierno, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Sí, en los Ministros competentes por razón de la materia delegada."
  - id: b
    text:
      es: "Sí, en las Comisiones Delegadas del Gobierno si la materia afecta a varios Ministerios."
  - id: c
    text:
      es: "Sí, en los Consejos de Gobierno autonómicos, si así lo prevé la ley de bases."
  - id: d
    correct: true
    text:
      es: "No, no podrá permitir la subdelegación a autoridades distintas del propio Gobierno."
  explanation:
    es: "El artículo 82.3 dice que la delegación «tampoco podrá permitir la subdelegación a autoridades distintas del propio Gobierno». Los Ministros, las Comisiones Delegadas y los órganos de gobierno autonómicos son autoridades distintas del Gobierno, así que ninguna subdelegación en ellos es posible, lo diga o no la ley de bases."
  citation: "art. 82.3 CE"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-85
- id: m03-l01-q027
  prompt:
    es: "¿Qué título reciben las disposiciones del Gobierno que contienen legislación delegada, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Reciben el título de Decretos Legislativos."
  - id: b
    text:
      es: "Reciben el título de Decretos-leyes del Gobierno."
  - id: c
    text:
      es: "Reciben el título de Leyes delegadas."
  - id: d
    text:
      es: "Reciben el título de Reales Decretos reglamentarios."
  explanation:
    es: "El artículo 85 dice que estas disposiciones «recibirán el título de Decretos Legislativos». Los Decretos-leyes son las disposiciones legislativas provisionales del artículo 86, dictadas sin delegación. La Constitución no llama «Leyes delegadas» a estas disposiciones. Los Reales Decretos reglamentarios no tienen rango de ley."
  citation: "art. 85 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-86
- id: m03-l01-q028
  prompt:
    es: "Según el artículo 86.1 de la Constitución Española de 1978, en cuanto a su presupuesto habilitante y a sus límites materiales, los Decretos-leyes:"
  options:
  - id: a
    text:
      es: "Pueden dictarse en caso de extraordinaria y urgente necesidad y pueden afectar al régimen de las Comunidades Autónomas."
  - id: b
    text:
      es: "Pueden dictarse en caso de extraordinaria necesidad, aunque no sea urgente, y no pueden afectar al Derecho electoral general."
  - id: c
    correct: true
    text:
      es: "Pueden dictarse en caso de extraordinaria y urgente necesidad y no pueden afectar al Derecho electoral general."
  - id: d
    text:
      es: "Pueden dictarse en caso de urgencia y pueden afectar a los deberes de los ciudadanos regulados en el Título I."
  explanation:
    es: "El artículo 86.1 permite los Decretos-leyes «en caso de extraordinaria y urgente necesidad» y dice que no podrán afectar, entre otras materias, «al Derecho electoral general». Los dos requisitos van juntos: la necesidad extraordinaria sin urgencia no basta. El régimen de las Comunidades Autónomas y los deberes del Título I están en la lista de materias vedadas, así que las opciones que los admiten son falsas."
  citation: "art. 86.1 CE"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-86
- id: m03-l01-q029
  prompt:
    es: "¿Qué naturaleza atribuye la Constitución Española de 1978 a los Decretos-leyes que dicta el Gobierno?"
  options:
  - id: a
    text:
      es: "Son disposiciones reglamentarias de ejecución de las leyes."
  - id: b
    correct: true
    text:
      es: "Son disposiciones legislativas provisionales del Gobierno."
  - id: c
    text:
      es: "Son legislación delegada en virtud de una ley de bases."
  - id: d
    text:
      es: "Son disposiciones legislativas definitivas, sin control del Congreso."
  explanation:
    es: "El artículo 86.1 dice que el Gobierno podrá dictar «disposiciones legislativas provisionales que tomarán la forma de Decretos-leyes». No son reglamentos: tienen rango de ley. La legislación delegada mediante ley de bases da lugar a Decretos Legislativos (arts. 82 y 85). No son definitivas ni escapan al Congreso, que debe convalidarlas o derogarlas (art. 86.2)."
  citation: "art. 86.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-86
- id: m03-l01-q030
  prompt:
    es: "De acuerdo con el artículo 86.2 de la Constitución Española de 1978, los Decretos-leyes deberán ser sometidos a debate y votación de totalidad al Congreso de los Diputados:"
  options:
  - id: a
    text:
      es: "En el plazo de los quince días siguientes a su promulgación."
  - id: b
    text:
      es: "En el plazo de los dos meses siguientes a su promulgación."
  - id: c
    correct: true
    text:
      es: "En el plazo de los treinta días siguientes a su promulgación."
  - id: d
    text:
      es: "En el plazo de los veinte días naturales siguientes a su promulgación."
  explanation:
    es: "El artículo 86.2 CE dice que los Decretos-leyes deberán ser sometidos a debate y votación de totalidad al Congreso «en el plazo de los treinta días siguientes a su promulgación». Quince días y veinte días naturales no coinciden con la cifra del apartado, que es treinta. Dos meses es el plazo que el artículo 90.2 da al Senado para vetar o enmendar un proyecto de ley, otro trámite."
  citation: "art. 86.2 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-86
- id: m03-l01-q031
  prompt:
    es: "¿Sobre qué ha de pronunciarse expresamente el Congreso de los Diputados respecto de los Decretos-leyes, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Sobre su convalidación, que necesita después la ratificación del Senado."
  - id: b
    text:
      es: "Sobre su convalidación o su conversión automática en ley orgánica."
  - id: c
    text:
      es: "Sobre su enmienda artículo por artículo, sin votación de totalidad."
  - id: d
    correct: true
    text:
      es: "Sobre su convalidación o derogación, en una votación de totalidad."
  explanation:
    es: "El artículo 86.2 dice que los Decretos-leyes se someten «a debate y votación de totalidad» y que el Congreso «habrá de pronunciarse expresamente dentro de dicho plazo sobre su convalidación o derogación». El Senado no ratifica la convalidación. No hay conversión en ley orgánica, y la votación es de totalidad, no por artículos. Para enmendarlos, las Cortes pueden tramitarlos como proyectos de ley (art. 86.3)."
  citation: "art. 86.2 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-86
- id: m03-l01-q032
  prompt:
    es: "Según el artículo 86.3 de la Constitución Española de 1978, ¿qué podrán hacer las Cortes con los Decretos-leyes durante el plazo de treinta días que sigue a su promulgación?"
  options:
  - id: a
    correct: true
    text:
      es: "Tramitarlos como proyectos de ley por el procedimiento de urgencia."
  - id: b
    text:
      es: "Tramitarlos como proyectos de ley por el procedimiento ordinario."
  - id: c
    text:
      es: "Tramitarlos como proposiciones de ley en lectura única ante el Senado."
  - id: d
    text:
      es: "Convertirlos en leyes de bases mediante acuerdo de ambas Cámaras."
  explanation:
    es: "El artículo 86.3 dice que, durante ese plazo, «las Cortes podrán tramitarlos como proyectos de ley por el procedimiento de urgencia». El procedimiento no es el ordinario. Se tramitan como proyectos, no como proposiciones, y no se convierten en leyes de bases, que son leyes de delegación."
  citation: "art. 86.3 CE"
  difficulty: 3
  tags:
  - "procedimiento"
