# anchor: celex-12016m-txt-art-49
- id: m01-l11-q056
  prompt:
    es: "En el procedimiento de ingreso de un nuevo Estado en la Unión, ¿por qué mayoría se pronuncia el Parlamento Europeo al dar su aprobación?"
  options:
  - id: a
    correct: true
    text:
      es: "Por mayoría de los miembros que lo componen."
  - id: b
    text:
      es: "Por mayoría de los votos emitidos."
  - id: c
    text:
      es: "Por mayoría de dos tercios de los votos emitidos."
  - id: d
    text:
      es: "Por mayoría de tres quintos de sus miembros."
  explanation:
    es: "El artículo 49 TUE dice que el Parlamento Europeo «se pronunciará por mayoría de los miembros que lo componen». La mayoría de los votos emitidos es su regla general (art. 231 TFUE), desplazada aquí. Los dos tercios de los votos emitidos son de la moción de censura (art. 234 TFUE). Los tres quintos no aparecen en el artículo."
  citation: "art. 49 TUE"
  difficulty: 3
  tags:
  - "mayoría"
  - "procedimiento"
# anchor: celex-12016m-txt-art-50
- id: m01-l11-q057
  prompt:
    es: "¿Quién celebra en nombre de la Unión el acuerdo de retirada de un Estado miembro, y con qué mayoría, según el Tratado de la Unión Europea?"
  options:
  - id: a
    text:
      es: "El Consejo Europeo, por unanimidad, previa aprobación del Parlamento Europeo."
  - id: b
    correct: true
    text:
      es: "El Consejo, por mayoría cualificada, previa aprobación del Parlamento Europeo."
  - id: c
    text:
      es: "El Consejo, por unanimidad, previa consulta al Parlamento Europeo."
  - id: d
    text:
      es: "La Comisión Europea, previa aprobación del Consejo de la Unión por mayoría cualificada."
  explanation:
    es: "El artículo 50.2 TUE dice que el acuerdo de retirada lo celebrará «el Consejo […] en nombre de la Unión por mayoría cualificada, previa aprobación del Parlamento Europeo». Al Consejo Europeo se le notifica la intención de retirarse y da las orientaciones, pero no celebra el acuerdo. No se exige unanimidad y el Parlamento aprueba, no solo es consultado. La Comisión no celebra el acuerdo."
  citation: "art. 50.2 TUE"
  difficulty: 2
  tags:
  - "órgano"
  - "mayoría"
# anchor: celex-12016m-txt-art-50
- id: m01-l11-q058
  prompt:
    es: "De acuerdo con el artículo 50 del Tratado de la Unión Europea, si no entra en vigor un acuerdo de retirada, los Tratados dejarán de aplicarse al Estado que se retira:"
  options:
  - id: a
    text:
      es: "Al año de la notificación, salvo que el Consejo Europeo, de acuerdo con ese Estado, decida por unanimidad prorrogar el plazo."
  - id: b
    text:
      es: "A los dos años de la notificación, salvo que el Consejo decida por mayoría cualificada prorrogar el plazo."
  - id: c
    correct: true
    text:
      es: "A los dos años de la notificación, salvo que el Consejo Europeo, de acuerdo con ese Estado, decida por unanimidad prorrogar el plazo."
  - id: d
    text:
      es: "A los tres años de la notificación, sin posibilidad de prórroga."
  explanation:
    es: "El artículo 50.3 TUE dice que los Tratados dejarán de aplicarse «a los dos años de la notificación […], salvo si el Consejo Europeo, de acuerdo con dicho Estado, decide por unanimidad prorrogar dicho plazo». Un año y tres años no son el plazo del artículo. La prórroga la decide el Consejo Europeo por unanimidad, no el Consejo por mayoría cualificada, y sí cabe."
  citation: "art. 50.3 TUE"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-1978-31229-art-95
- id: m01-l11-q060
  prompt:
    es: "De acuerdo con el artículo 95 de la Constitución Española de 1978, la celebración de un tratado internacional que contenga estipulaciones contrarias a la Constitución:"
  options:
  - id: a
    correct: true
    text:
      es: "Exigirá la previa revisión constitucional."
  - id: b
    text:
      es: "Requerirá la autorización de las Cortes Generales por mayoría absoluta."
  - id: c
    text:
      es: "Requerirá el dictamen previo y vinculante del Consejo de Estado."
  - id: d
    text:
      es: "Será posible si se autoriza mediante ley orgánica."
  explanation:
    es: "El artículo 95.1 CE dice que ese tratado «exigirá la previa revisión constitucional». Ni la autorización de las Cortes por mayoría absoluta ni el dictamen del Consejo de Estado sustituyen la reforma. La ley orgánica del artículo 93 CE autoriza la cesión de competencias, pero no salva una contradicción con la Constitución."
  citation: "art. 95.1 CE"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: celex-12016e-txt-art-288
- id: m01-l11-q061
  prompt:
    es: "¿Cuál de las siguientes características corresponde al reglamento de la Unión según el Tratado de Funcionamiento de la Unión Europea?"
  options:
  - id: a
    text:
      es: "Obliga al Estado destinatario en cuanto al resultado, dejando a las autoridades nacionales la elección de la forma y de los medios."
  - id: b
    correct: true
    text:
      es: "Tiene alcance general, es obligatorio en todos sus elementos y directamente aplicable en cada Estado miembro."
  - id: c
    text:
      es: "Es obligatorio en todos sus elementos, pero solo para los destinatarios que designe."
  - id: d
    text:
      es: "No es vinculante para los Estados miembros ni para los particulares."
  explanation:
    es: "El artículo 288 TFUE dice que «el reglamento tendrá un alcance general» y que «será obligatorio en todos sus elementos y directamente aplicable en cada Estado miembro». Obligar en cuanto al resultado, dejando forma y medios, es propio de la directiva. Obligar solo a los destinatarios designados es propio de la decisión. Lo que no es vinculante son las recomendaciones y los dictámenes."
  citation: "art. 288 TFUE"
  difficulty: 1
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-1978-31229-art-135
- id: m01-l11-q062
  prompt:
    es: "Según la Constitución Española de 1978, el volumen de deuda pública del conjunto de las Administraciones Públicas en relación con el producto interior bruto del Estado no podrá superar:"
  options:
  - id: a
    text:
      es: "El valor que fije cada año el Consejo de Ministros en el techo de gasto."
  - id: b
    text:
      es: "El 60 % del producto interior bruto, cifra fijada en la propia Constitución."
  - id: c
    correct: true
    text:
      es: "El valor de referencia establecido en el Tratado de Funcionamiento de la Unión Europea."
  - id: d
    text:
      es: "El límite que apruebe el Congreso de los Diputados por mayoría absoluta."
  explanation:
    es: "El artículo 135.3 CE dice que ese volumen «no podrá superar el valor de referencia establecido en el Tratado de Funcionamiento de la Unión Europea». La Constitución no fija una cifra propia, ni remite al Consejo de Ministros. La mayoría absoluta del Congreso aparece en el artículo 135.4 CE, para apreciar los casos en que se pueden superar los límites, no para fijarlos."
  citation: "art. 135.3 CE"
  difficulty: 3
  tags:
  - "cantidad"
  - "requisito"
# anchor: celex-12016m-txt-art-13
- id: m01-l11-q063
  prompt:
    es: "De acuerdo con el artículo 13 del Tratado de la Unión Europea, el Parlamento Europeo, el Consejo y la Comisión estarán asistidos por:"
  options:
  - id: a
    text:
      es: "Un Comité Económico y Social y un Comité de las Regiones, que ejercerán funciones legislativas compartidas."
  - id: b
    text:
      es: "Un Comité Económico y Social y el Tribunal de Cuentas, que ejercerán funciones consultivas."
  - id: c
    correct: true
    text:
      es: "Un Comité Económico y Social y un Comité de las Regiones, que ejercerán funciones consultivas."
  - id: d
    text:
      es: "Un Comité de Representantes Permanentes y un Comité de las Regiones, que ejercerán funciones consultivas."
  explanation:
    es: "La opción correcta es la del Comité Económico y Social y el Comité de las Regiones con funciones consultivas: el artículo 13.4 TUE dice que esas tres instituciones «estarán asistidos por un Comité Económico y Social y por un Comité de las Regiones que ejercerán funciones consultivas». Los dos comités no ejercen funciones legislativas. El Tribunal de Cuentas es una institución (art. 13.1 TUE), no un comité consultivo. El Comité de Representantes Permanentes prepara los trabajos del Consejo (art. 16.7 TUE)."
  citation: "art. 13.4 TUE"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: celex-12016m-txt-art-15
- id: m01-l11-q064
  prompt:
    es: "Según el artículo 15 del Tratado de la Unión Europea, ¿qué debe hacer el Presidente del Consejo Europeo al término de cada reunión del Consejo Europeo?"
  options:
  - id: a
    correct: true
    text:
      es: "Presentar un informe al Parlamento Europeo."
  - id: b
    text:
      es: "Presentar un informe al Consejo de Asuntos Generales."
  - id: c
    text:
      es: "Presentar un informe a los Parlamentos nacionales."
  - id: d
    text:
      es: "Comparecer ante la Comisión para dar cuenta de los acuerdos."
  explanation:
    es: "La opción correcta es presentar un informe al Parlamento Europeo: el artículo 15.6.d) TUE dice que el Presidente, «al término de cada reunión del Consejo Europeo, presentará un informe al Parlamento Europeo». Con el Consejo de Asuntos Generales se apoya para preparar los trabajos, pero el informe no va a esa formación. Los Parlamentos nacionales no lo reciben. Con el Presidente de la Comisión coopera, pero no comparece ante la Comisión."
  citation: "art. 15.6 TUE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: celex-12016e-txt-art-235
- id: m01-l11-q065
  prompt:
    es: "Según el artículo 235 del Tratado de Funcionamiento de la Unión Europea, ¿cómo se pronunciará el Consejo Europeo en las cuestiones de procedimiento y para la aprobación de su reglamento interno?"
  options:
  - id: a
    text:
      es: "Se pronunciará por consenso de sus miembros."
  - id: b
    text:
      es: "Se pronunciará por mayoría cualificada de sus miembros."
  - id: c
    text:
      es: "Se pronunciará por unanimidad de los miembros presentes."
  - id: d
    correct: true
    text:
      es: "Se pronunciará por mayoría simple."
  explanation:
    es: "La opción correcta es la mayoría simple: el artículo 235.3 TFUE dice que el Consejo Europeo «se pronunciará por mayoría simple en las cuestiones de procedimiento y para la aprobación de su reglamento interno». El consenso es su regla general (art. 15.4 TUE), que este apartado desplaza. La mayoría cualificada y la unanimidad no son las que fija el apartado."
  citation: "art. 235.3 TFUE"
  difficulty: 2
  tags:
  - "mayoría"
  - "procedimiento"
# anchor: celex-12016e-txt-art-236
- id: m01-l11-q066
  prompt:
    es: "De acuerdo con el artículo 236 del Tratado de Funcionamiento de la Unión Europea, la decisión que establece la lista de las formaciones del Consejo distintas de la de Asuntos Generales y la de Asuntos Exteriores la adopta:"
  options:
  - id: a
    text:
      es: "El Consejo Europeo, por unanimidad de sus miembros."
  - id: b
    correct: true
    text:
      es: "El Consejo Europeo, por mayoría cualificada."
  - id: c
    text:
      es: "El Consejo, por mayoría simple de sus miembros."
  - id: d
    text:
      es: "El Consejo, por mayoría cualificada, a propuesta de la Comisión."
  explanation:
    es: "La opción correcta es el Consejo Europeo por mayoría cualificada: el artículo 236 TFUE dice que «el Consejo Europeo adoptará por mayoría cualificada» la decisión con la lista de las formaciones del Consejo distintas de Asuntos Generales y Asuntos Exteriores. El artículo no exige unanimidad. La decisión no la adopta el propio Consejo, ni por mayoría simple ni a propuesta de la Comisión."
  citation: "art. 236 TFUE"
  difficulty: 3
  tags:
  - "órgano"
  - "mayoría"
# anchor: celex-12016e-txt-art-253
- id: m01-l11-q067
  prompt:
    es: "Según el artículo 253 del Tratado de Funcionamiento de la Unión Europea, ¿cómo y por cuánto tiempo se elige al Presidente del Tribunal de Justicia?"
  options:
  - id: a
    text:
      es: "Lo eligen los jueces de entre ellos por seis años, sin posibilidad de renovación."
  - id: b
    text:
      es: "Lo designan los Gobiernos de los Estados miembros de común acuerdo por tres años renovables."
  - id: c
    correct: true
    text:
      es: "Lo eligen los jueces de entre ellos por tres años, con mandato renovable."
  - id: d
    text:
      es: "Lo nombra el Consejo por unanimidad por tres años, sin posibilidad de renovación."
  explanation:
    es: "La opción correcta es la elección por los jueces para tres años renovables: el artículo 253 TFUE dice que «los jueces elegirán de entre ellos al Presidente del Tribunal de Justicia por un período de tres años» y que «su mandato será renovable». Seis años es el período de los jueces, y el mandato del Presidente sí se renueva. Los Gobiernos designan a los jueces, no al Presidente. El Consejo no interviene en esta elección."
  citation: "art. 253 TFUE"
  difficulty: 2
  tags:
  - "órgano"
  - "plazo"
# anchor: celex-12016e-txt-art-6
- id: m01-l11-q068
  prompt:
    es: "De acuerdo con el artículo 6 del Tratado de Funcionamiento de la Unión Europea, en el ámbito de la industria la Unión dispone de competencia para:"
  options:
  - id: a
    text:
      es: "Legislar en exclusiva, salvo que faculte a los Estados miembros para hacerlo."
  - id: b
    text:
      es: "Legislar junto con los Estados miembros, que ejercen su competencia si la Unión no ejerce la suya."
  - id: c
    text:
      es: "Armonizar las disposiciones legales y reglamentarias de los Estados miembros en materia de industria."
  - id: d
    correct: true
    text:
      es: "Llevar a cabo acciones de apoyo, coordinación o complemento de la acción de los Estados."
  explanation:
    es: "La opción correcta es llevar a cabo acciones de apoyo, coordinación o complemento: el artículo 6 TFUE dice que la Unión «dispondrá de competencia para llevar a cabo acciones con el fin de apoyar, coordinar o complementar la acción de los Estados miembros» y pone «la industria» entre esos ámbitos. Legislar en exclusiva, salvo que faculte a los Estados, es la regla de la competencia exclusiva (art. 2.1 TFUE). Legislar junto con los Estados, que actúan si la Unión no ha ejercido la suya, es la competencia compartida (art. 2.2 TFUE). Armonizar las normas nacionales es justo lo que los actos de estos ámbitos no pueden hacer (art. 2.5 TFUE)."
  citation: "art. 6 TFUE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: celex-12016m-txt-art-15
- id: m01-l11-q069
  prompt:
    es: "De acuerdo con el artículo 15 del Tratado de la Unión Europea, el Consejo Europeo se reunirá con carácter ordinario:"
  options:
  - id: a
    text:
      es: "Una vez por semestre, por convocatoria conjunta de su Presidente y del Presidente de la Comisión."
  - id: b
    correct: true
    text:
      es: "Dos veces por semestre, convocado por su Presidente."
  - id: c
    text:
      es: "Una vez al mes, por convocatoria de su Presidente o a petición de un tercio de sus miembros."
  - id: d
    text:
      es: "Dos veces por semestre, por convocatoria del Presidente de la Comisión y del Alto Representante."
  explanation:
    es: "La opción correcta es dos veces por semestre, convocado por su Presidente: el artículo 15.3 TUE dice que el Consejo Europeo «se reunirá dos veces por semestre por convocatoria de su Presidente». Una vez por semestre y una vez al mes cambian la frecuencia. La convocatoria es solo de su Presidente: no es conjunta con el Presidente de la Comisión, no la hacen el Presidente de la Comisión y el Alto Representante y no la pide un tercio de los miembros."
  citation: "art. 15.3 TUE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "cantidad"
# anchor: celex-12016m-txt-art-16
- id: m01-l11-q070
  prompt:
    es: "Según el artículo 16 del Tratado de la Unión Europea, ¿qué formación del Consejo prepara las reuniones del Consejo Europeo y garantiza su actuación subsiguiente?"
  options:
  - id: a
    text:
      es: "El Consejo de Asuntos Exteriores, presidido por el Alto Representante de la Unión."
  - id: b
    text:
      es: "El Consejo de Asuntos Económicos y Financieros, en contacto con el Presidente de la Comisión."
  - id: c
    correct: true
    text:
      es: "El Consejo de Asuntos Generales."
  - id: d
    text:
      es: "El Consejo de Justicia y Asuntos de Interior, en contacto con el Presidente del Consejo Europeo."
  explanation:
    es: "La opción correcta es el Consejo de Asuntos Generales: el artículo 16.6 TUE dice que esta formación «preparará las reuniones del Consejo Europeo y garantizará su actuación subsiguiente». El Consejo de Asuntos Exteriores, que preside el Alto Representante, elabora la acción exterior de la Unión. Los Consejos de Asuntos Económicos y Financieros y de Justicia y Asuntos de Interior existen, pero el artículo no les da esta función."
  citation: "art. 16.6 TUE"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: celex-12016e-txt-art-229
- id: m01-l11-q071
  prompt:
    es: "¿A petición de quién puede reunirse el Parlamento Europeo en período parcial de sesiones extraordinario, según el Tratado de Funcionamiento de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "De la mayoría de sus miembros, del Consejo o de la Comisión."
  - id: b
    text:
      es: "De un tercio de los miembros que lo componen, del Consejo Europeo o del Presidente de la Comisión."
  - id: c
    text:
      es: "De la mayoría de los miembros que lo componen o del Consejo, pero en ningún caso a petición de la Comisión."
  - id: d
    text:
      es: "De su Presidente, previo acuerdo de la Conferencia de Presidentes y de la mayoría de los Estados miembros."
  explanation:
    es: "La opción correcta es la mayoría de sus miembros, el Consejo o la Comisión: el artículo 229 TFUE dice que el Parlamento «podrá reunirse en período parcial de sesiones extraordinario a petición de la mayoría de los miembros que lo componen, del Consejo o de la Comisión». Un tercio cambia la fracción, y el Consejo Europeo y el Presidente de la Comisión no son quienes lo piden. La Comisión sí puede pedirlo. El Presidente del Parlamento, la Conferencia de Presidentes y los Estados miembros no figuran en el artículo."
  citation: "art. 229 TFUE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "órgano"
# anchor: celex-12016e-txt-art-234
- id: m01-l11-q072
  prompt:
    es: "Aprobada una moción de censura, ¿qué hacen los miembros de la Comisión obligados a dimitir hasta su sustitución, según el Tratado de Funcionamiento de la Unión Europea?"
  options:
  - id: a
    text:
      es: "Cesan de inmediato, y el Consejo asume sus funciones hasta el nombramiento de la nueva Comisión."
  - id: b
    text:
      es: "Cesan de inmediato, y el Presidente del Consejo Europeo asume la gestión de los asuntos ordinarios."
  - id: c
    text:
      es: "Siguen en sus cargos con plenas facultades, incluida la presentación de propuestas legislativas."
  - id: d
    correct: true
    text:
      es: "Siguen en sus cargos despachando la administración ordinaria."
  explanation:
    es: "La opción correcta es que siguen en sus cargos despachando la administración ordinaria: el artículo 234 TFUE dice que «permanecerán en sus cargos y continuarán despachando los asuntos de administración ordinaria hasta que sean sustituidos». No cesan de inmediato, y ni el Consejo ni el Presidente del Consejo Europeo asumen sus funciones. Tampoco conservan plenas facultades: solo despachan la administración ordinaria."
  citation: "art. 234 TFUE"
  difficulty: 3
  tags:
  - "efecto"
  - "plazo"
