  prompt:
    es: "¿En qué base se integran, según la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las ganancias patrimoniales no justificadas, salvo que el contribuyente pruebe suficientemente su titularidad desde una fecha anterior a la del período de prescripción?"
  options:
  - id: a
    text:
      es: "En la base liquidable general del período impositivo en que se adquirieron los bienes."
  - id: b
    text:
      es: "En la base liquidable del ahorro del período impositivo respecto del que se descubran."
  - id: c
    correct: true
    text:
      es: "En la base liquidable general del período impositivo respecto del que se descubran."
  - id: d
    text:
      es: "En la base liquidable del ahorro del período impositivo en que se adquirieron los bienes."
  explanation:
    es: "Las ganancias no justificadas se integran en la base liquidable general del período en que se descubren (art. 39 LIRPF). La base del ahorro y el período de adquisición no son los que fija el precepto."
  citation: "art. 39 LIRPF"
  difficulty: 2
  tags:
  - "ganancias y pérdidas"
  - "no justificadas"
# anchor: boe-a-2006-20764-art-33
- id: m03-l15-q0249
  prompt:
    es: "Según el artículo 33.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué se estima respecto de la división de la cosa común a efectos de las ganancias y pérdidas patrimoniales?"
  options:
  - id: a
    text:
      es: "Que existe una alteración en la composición del patrimonio que genera ganancia o pérdida."
  - id: b
    text:
      es: "Que no existe alteración en el patrimonio, pero se actualizan los valores de los bienes recibidos."
  - id: c
    text:
      es: "Que existe una alteración que genera ganancia solo si los cotitulares reciben bienes de valor distinto."
  - id: d
    correct: true
    text:
      es: "Que no existe alteración en la composición del patrimonio."
  explanation:
    es: "En los supuestos de división de la cosa común se estima que no existe alteración en la composición del patrimonio (art. 33.2.a) LIRPF). Por eso no hay ganancia ni pérdida. Y el apartado añade que esos supuestos no pueden dar lugar a la actualización de los valores de los bienes recibidos."
  citation: "art. 33.2 LIRPF"
  difficulty: 2
  tags:
  - "ganancias y pérdidas"
  - "no alteración"
# anchor: boe-a-2006-20764-art-33
- id: m03-l15-q0258
  prompt:
    es: "Según el artículo 33.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué se estima respecto de la disolución de la sociedad de gananciales y de la adjudicación de los bienes comunes a los cónyuges?"
  options:
  - id: a
    text:
      es: "Que no existe alteración, pero se actualizan los valores de los bienes adjudicados."
  - id: b
    text:
      es: "Que existe una alteración, pero la ganancia queda exenta por tratarse de bienes comunes."
  - id: c
    text:
      es: "Que existe una alteración en la composición del patrimonio que genera ganancia patrimonial."
  - id: d
    correct: true
    text:
      es: "Que no existe alteración en la composición del patrimonio, y por tanto no hay ganancia ni pérdida patrimonial."
  explanation:
    es: "La disolución de la sociedad de gananciales es uno de los supuestos en que se estima que no existe alteración en la composición del patrimonio (art. 33.2.b) LIRPF). No hay ganancia, ni exenta. Y el artículo añade que esos supuestos no pueden dar lugar a la actualización de los valores recibidos."
  citation: "art. 33.2 LIRPF"
  difficulty: 2
  tags:
  - "no alteración"
# anchor: boe-a-2006-20764-art-33
- id: m03-l15-q0260
  prompt:
    es: "Según el artículo 33.4.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿está exenta la ganancia patrimonial de 40.000 euros que obtiene una persona de 67 años por la venta de su vivienda habitual?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque se pone de manifiesto con ocasión de la transmisión de su vivienda habitual por una persona mayor de 65 años."
  - id: b
    text:
      es: "No, porque la exención solo alcanza a mayores de 70 años."
  - id: c
    text:
      es: "Sí, pero solo hasta el límite de 180.000 euros de ganancia."
  - id: d
    text:
      es: "No, porque la exención exige además que la persona esté en situación de dependencia severa."
  explanation:
    es: "La ganancia derivada de la transmisión de la vivienda habitual por un mayor de 65 años está exenta (art. 33.4.b) LIRPF). El umbral es de 65 años, no de 70. La dependencia es una alternativa a la edad, no un requisito añadido, y el artículo no fija un límite de 180.000 euros."
  citation: "art. 33.4 LIRPF"
  difficulty: 2
  tags:
  - "exención"
# anchor: boe-a-2006-20764-art-33
- id: m03-l15-q0267
  prompt:
    es: "De acuerdo con el artículo 33.5 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre las pérdidas patrimoniales excluidas del cómputo:"
  options:
  - id: a
    text:
      es: "No se computan las no justificadas, las debidas al consumo y las debidas a transmisiones onerosas de elementos patrimoniales."
  - id: b
    text:
      es: "No se computan las no justificadas y las debidas a transmisiones lucrativas por actos inter vivos, pero sí las debidas al consumo y a las liberalidades."
  - id: c
    text:
      es: "No se computan las debidas al consumo y las debidas a transmisiones lucrativas por causa de muerte del contribuyente."
  - id: d
    correct: true
    text:
      es: "No se computan las no justificadas, las debidas al consumo y las debidas a transmisiones lucrativas por actos inter vivos o a liberalidades."
  explanation:
    es: "El artículo 33.5 LIRPF excluye, entre otras, las pérdidas no justificadas, las debidas al consumo y las debidas a transmisiones lucrativas por actos inter vivos o a liberalidades. Las transmisiones onerosas sí generan pérdida computable. Las debidas al consumo no se computan. Y la transmisión lucrativa por causa de muerte no genera pérdida, por el artículo 33.3.b)."
  citation: "art. 33.5 LIRPF"
  difficulty: 3
  tags:
  - "ganancias y pérdidas"
  - "pérdidas no computables"
