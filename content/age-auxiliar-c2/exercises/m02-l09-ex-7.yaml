# anchor: fuente-ms-excel-funcion-o-html
- id: m02-l09-q096
  prompt:
    es: "En una hoja de Excel 365, A1 contiene 5 y B1 contiene 3. ¿Qué muestra la celda que contiene =O(A1<B1;A1=B1)?"
  options:
  - id: a
    text:
      es: "VERDADERO"
  - id: b
    text:
      es: "5"
  - id: c
    correct: true
    text:
      es: "FALSO"
  - id: d
    text:
      es: "3"
  explanation:
    es: "A1<B1 es FALSO y A1=B1 también, y O devuelve FALSO si todos sus argumentos se evalúan como FALSO. VERDADERO exigiría que alguna condición se cumpliera; 5 y 3 no son valores lógicos."
  citation: "fuente: `ms-excel-funcion-o.html`; «Detalles técnicos»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-o-html
- id: m02-l09-q097
  prompt:
    es: "En una hoja de Excel 365, A2 contiene 70. ¿Qué muestra =SI(O(A2<0;A2>50);A2;\"El valor está fuera del rango\")?"
  options:
  - id: a
    text:
      es: "El valor está fuera del rango"
  - id: b
    correct: true
    text:
      es: "70"
  - id: c
    text:
      es: "VERDADERO"
  - id: d
    text:
      es: "FALSO"
  explanation:
    es: "A2>50 es VERDADERO, así que O es VERDADERO y SI muestra el valor de A2, 70. El mensaje solo aparece si ninguna condición de O se cumple; VERDADERO y FALSO serían el resultado de O sin SI."
  citation: "fuente: `ms-excel-funcion-o.html`; «Ejemplos»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-o-html
- id: m02-l09-q098
  prompt:
    es: "En Excel 365, si un argumento de referencia de O contiene texto o celdas vacías junto a valores lógicos, ¿cuál de las siguientes opciones describe lo que hace O con ellos?"
  options:
  - id: a
    text:
      es: "Los evalúa como FALSO"
  - id: b
    correct: true
    text:
      es: "Los pasa por alto"
  - id: c
    text:
      es: "Los evalúa como VERDADERO"
  - id: d
    text:
      es: "Los convierte en 0 antes de evaluarlos"
  explanation:
    es: "Según la página, si un argumento matricial o de referencia contiene texto o celdas vacías, esos valores se pasan por alto, no se evalúan como FALSO ni como VERDADERO."
  citation: "fuente: `ms-excel-funcion-o.html`; «Observaciones»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-funcion-no-html
- id: m02-l09-q099
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe lo que hace la función SI con su prueba lógica?"
  options:
  - id: a
    text:
      es: "Invierte el valor lógico de su argumento y devuelve el resultado"
  - id: b
    text:
      es: "Devuelve VERDADERO si alguno de sus argumentos es VERDADERO"
  - id: c
    text:
      es: "Devuelve el valor que se indica si la fórmula da error"
  - id: d
    correct: true
    text:
      es: "Realiza una prueba lógica y devuelve un valor si es VERDADERA y otro si es FALSA"
  explanation:
    es: "SI realiza una prueba lógica y devuelve un valor si es VERDADERA y otro si es FALSA. Invertir el valor lógico es NO, devolver VERDADERO si alguno lo es es O y devolver un valor si la fórmula da error es SI.ERROR."
  citation: "fuente: `ms-excel-funcion-no.html`; «Detalles técnicos»"
  difficulty: 1
  tags:
  - "función"
  - "concepto"
# anchor: fuente-ms-excel-funcion-o-html
- id: m02-l09-q101
  prompt:
    es: "En Excel 365, B14 vale 120000 (ventas), B4 100000 (objetivo de ventas), C14 8 (cuentas), B5 10 (objetivo de cuentas) y B6 5 %. ¿Qué muestra =SI(O(B14>=B4;C14>=B5);B14*B6;0)?"
  options:
  - id: a
    text:
      es: "0"
  - id: b
    text:
      es: "120000"
  - id: c
    correct: true
    text:
      es: "6000"
  - id: d
    text:
      es: "VERDADERO"
  explanation:
    es: "B14>=B4 se cumple, así que O es VERDADERO y SI multiplica las ventas totales por el porcentaje de comisión: 120000 × 5 % = 6000. 0 solo aparece si no se cumple ninguna condición; 120000 omite la comisión y VERDADERO es el resultado de O."
  citation: "fuente: `ms-excel-funcion-o.html`; «Cálculo de la comisión de ventas»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-no-html
- id: m02-l09-q102
  prompt:
    es: "En Excel 365, B14 vale 80000, B7 100000, C14 12, B5 10 y B8 5 %. ¿Qué muestra =SI(Y(NO(B14<B7);NO(C14<B5));B14*B8;0)?"
  options:
  - id: a
    text:
      es: "4000"
  - id: b
    text:
      es: "80000"
  - id: c
    text:
      es: "FALSO"
  - id: d
    correct: true
    text:
      es: "0"
  explanation:
    es: "El total de ventas es inferior al objetivo, por lo que NO(B14<B7) es FALSO, Y no se cumple y se devuelve 0, el valor del caso contrario. 4000 sería la comisión si se cumpliera, 80000 el total de ventas y FALSO el resultado de Y sin SI."
  citation: "fuente: `ms-excel-funcion-no.html`; «Cálculo de la comisión de ventas»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-sierror-html
- id: m02-l09-q104
  prompt:
    es: "En Excel 365, A1 contiene 80 y B1 contiene 4. ¿Qué muestra la celda que contiene =SI.ERROR(A1/B1; \"Sin datos\")?"
  options:
  - id: a
    text:
      es: "Sin datos"
  - id: b
    text:
      es: "#¡DIV/0!"
  - id: c
    correct: true
    text:
      es: "20"
  - id: d
    text:
      es: "320"
  explanation:
    es: "La división 80/4 no da error, así que SI.ERROR devuelve el resultado de la fórmula: 20. El texto Sin datos solo se devuelve ante un error, #¡DIV/0! es el error que SI.ERROR sustituye y 320 resulta de multiplicar."
  citation: "fuente: `ms-excel-funcion-sierror.html`; «Ejemplos»"
  difficulty: 1
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-sierror-html
- id: m02-l09-q106
  prompt:
    es: "En Excel 365, A4 está vacía y B4 contiene 23. ¿Cuál de los siguientes resultados muestra la celda con =SI.ERROR(A4/B4; \"Sin cálculo\")?"
  options:
  - id: a
    correct: true
    text:
      es: "0"
  - id: b
    text:
      es: "Sin cálculo"
  - id: c
    text:
      es: "#¡DIV/0!"
  - id: d
    text:
      es: "#¡VALOR!"
  explanation:
    es: "Según el ejemplo de la página, dividir una celda vacía (\"\") entre 23 no encuentra ningún error y SI.ERROR devuelve el resultado de la fórmula, 0. El texto solo aparecería ante un error, y ni #¡DIV/0! ni #¡VALOR! se producen aquí."
  citation: "fuente: `ms-excel-funcion-sierror.html`; «Ejemplos»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q107
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes funciones devuelve el valor especificado solo si la expresión da el error #N/A y, en otro caso, el resultado de la expresión?"
  options:
  - id: a
    text:
      es: "SI.ERROR"
  - id: b
    text:
      es: "SI"
  - id: c
    text:
      es: "SI.CONJUNTO"
  - id: d
    correct: true
    text:
      es: "SI.ND"
  explanation:
    es: "SI.ND devuelve el valor especificado si la expresión se convierte en #N/A y, si no, el resultado de la expresión. SI.ERROR responde a cualquier error, SI realiza una prueba lógica y SI.CONJUNTO comprueba una o varias condiciones y devuelve el valor de la condición verdadera que se cumple antes."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones lógicas»"
  difficulty: 3
  tags:
  - "función"
# anchor: fuente-ms-excel-funcion-sierror-html
- id: m02-l09-q108
  prompt:
    es: "En Excel 365, en =SI.ERROR(A3/B3; \"Revisar\"), ¿cuál de las siguientes opciones describe lo que representa el segundo argumento, \"Revisar\"?"
  options:
  - id: a
    text:
      es: "El valor de la celda en la que se busca un error"
  - id: b
    correct: true
    text:
      es: "El valor que se devuelve si la fórmula da un error"
  - id: c
    text:
      es: "El valor que se devuelve si la fórmula no da ningún error"
  - id: d
    text:
      es: "El tipo de error concreto que se quiere detectar"
  explanation:
    es: "El segundo argumento es el valor que se devuelve si la fórmula se evalúa como un error; el primero, A3/B3, es donde se busca un error. Además, SI.ERROR evalúa varios tipos de error, no uno concreto elegido en el argumento."
  citation: "fuente: `ms-excel-funcion-sierror.html`; «Sintaxis»"
  difficulty: 2
  tags:
  - "función"
  - "concepto"
