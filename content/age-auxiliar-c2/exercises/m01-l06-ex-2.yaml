- id: m01-l06-q080
  prompt:
    es: "¿Cuál de las siguientes opciones completa el objetivo del sistema, de implantación experimental, que recoge el compromiso Huella normativa del IV Plan de Gobierno Abierto de España 2020-2024?"
  options:
  - id: a
    text:
      es: "La eficiencia del gasto público en la tramitación de normas."
  - id: b
    text:
      es: "La conservación del archivo de las normas."
  - id: c
    correct: true
    text:
      es: "La trazabilidad del proceso de elaboración normativa."
  - id: d
    text:
      es: "La coordinación entre los ministerios proponentes."
  explanation:
    es: "El sistema persigue mejorar la trazabilidad del proceso de elaboración normativa. La eficiencia del gasto, la conservación del archivo y la coordinación entre ministerios son objetivos de gestión que el compromiso no recoge."
  citation: "fuente: `transparencia-iv-plan.pdf`; IV Plan de Gobierno Abierto de España 2020-2024, compromiso 4"
  difficulty: 2
  tags:
  - "concepto"
