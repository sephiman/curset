# anchor: boe-a-2007-15984-art-19
- id: m03-l04-q0274
  prompt:
    es: "De acuerdo con el artículo 19.2 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, deben obtener un número de identificación fiscal propio los españoles con operaciones de trascendencia tributaria que no estén obligados a tener documento nacional de identidad por:"
  options:
  - id: a
    text:
      es: "residir en el extranjero o por ser mayores de 65 años."
  - id: b
    text:
      es: "carecer de domicilio fiscal en España o por ser menores de 18 años."
  - id: c
    text:
      es: "residir en el extranjero o por ser menores de 16 años."
  - id: d
    correct: true
    text:
      es: "residir en el extranjero o por ser menores de 14 años."
  explanation:
    es: "El artículo 19.2 se refiere a los españoles que no están obligados al documento nacional de identidad por residir en el extranjero o por tener menos de 14 años. Los mayores de 65, los menores de 18 o de 16 y quienes carecen de domicilio fiscal en España no quedan descritos por el texto."
  citation: "art. 19.2 RGAT"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-23186-da-sexta
- id: m03-l04-q0277
  prompt:
    es: "De acuerdo con la disposición adicional sexta.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando las entidades de crédito exigen el número de identificación fiscal por el pago de un cheque presentado al cobro, deben dejar constancia del pago del cheque y de:"
  options:
  - id: a
    correct: true
    text:
      es: "la identificación del tenedor que lo presente al cobro."
  - id: b
    text:
      es: "la identificación de la persona que libró el cheque contra su cuenta."
  - id: c
    text:
      es: "la fecha de la última operación del tenedor con la entidad."
  - id: d
    text:
      es: "el domicilio fiscal del tenedor que presente el cheque al cobro."
  explanation:
    es: "La disposición adicional sexta.3 manda dejar constancia del pago del cheque y de la identificación del tenedor que lo presente al cobro. No menciona al librador, la fecha de la última operación del tenedor ni su domicilio fiscal."
  citation: "disposición adicional sexta.3 LGT"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-23186-da-sexta
- id: m03-l04-q0278
  prompt:
    es: "De acuerdo con la disposición adicional sexta.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en el registro público que ha extendido la nota marginal por la revocación del número de identificación fiscal de una entidad se admite excepcionalmente la realización de:"
  options:
  - id: a
    correct: true
    text:
      es: "los trámites imprescindibles para la cancelación de la nota marginal."
  - id: b
    text:
      es: "las inscripciones de transmisión de los bienes de la entidad."
  - id: c
    text:
      es: "las inscripciones de modificación de los estatutos de la entidad y de aumento de su capital social."
  - id: d
    text:
      es: "los trámites necesarios para la disolución de la entidad."
  explanation:
    es: "La disposición adicional sexta.4 admite excepcionalmente los trámites imprescindibles para cancelar la nota marginal. Las inscripciones de transmisión de bienes, de modificación de estatutos y de disolución quedan comprendidas en la prohibición de inscribir."
  citation: "disposición adicional sexta.4 LGT"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2007-6820-art-68
- id: m03-l04-q0284
  prompt:
    es: "De acuerdo con el artículo 68.3 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, cuando la actividad empresarial no tenga carácter mercantil conforme al Código de Comercio, las obligaciones contables del contribuyente se limitan a los libros registro de:"
  options:
  - id: a
    text:
      es: "ingresos, de gastos, de bienes de inversión y de provisiones de fondos y suplidos."
  - id: b
    text:
      es: "facturas expedidas, de facturas recibidas y de bienes de inversión."
  - id: c
    correct: true
    text:
      es: "ventas e ingresos, de compras y gastos y de bienes de inversión."
  - id: d
    text:
      es: "ventas e ingresos y de compras y gastos, sin libro de bienes de inversión."
  explanation:
    es: "El artículo 68.3 reduce las obligaciones contables a tres libros: ventas e ingresos, compras y gastos y bienes de inversión. El libro de provisiones de fondos y suplidos es de los profesionales del artículo 68.5. Los libros de facturas expedidas y recibidas son del IVA. Quitar el de bienes de inversión deja incompleta la lista."
  citation: "art. 68.3 RIRPF"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2012-14696-art-3
- id: m03-l04-q0288
  prompt:
    es: "¿En qué régimen especial del IVA no existe obligación de expedir factura por las operaciones de los empresarios o profesionales, salvo por las entregas de inmuebles sujetas y no exentas, según el artículo 3.1.b) del Real Decreto 1619/2012, de 30 de noviembre, por el que se aprueba el Reglamento por el que se regulan las obligaciones de facturación?"
  options:
  - id: a
    correct: true
    text:
      es: "El régimen especial del recargo de equivalencia."
  - id: b
    text:
      es: "El régimen especial de las agencias de viajes."
  - id: c
    text:
      es: "El régimen especial de los bienes usados, objetos de arte, antigüedades y objetos de colección."
  - id: d
    text:
      es: "El régimen especial del criterio de caja."
  explanation:
    es: "El artículo 3.1.b) exceptúa de la obligación de expedir factura las operaciones de actividades acogidas al recargo de equivalencia, con la salvedad de las entregas de inmuebles sujetas y no exentas. Los demás regímenes citados no figuran entre las excepciones del artículo 3 y sus empresarios deben expedir factura."
  citation: "art. 3.1 RD 1619/2012"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2012-14696-art-4
- id: m03-l04-q0289
  prompt:
    es: "De acuerdo con el artículo 4.2 del Real Decreto 1619/2012, de 30 de noviembre, por el que se aprueba el Reglamento por el que se regulan las obligaciones de facturación, señale la respuesta CORRECTA sobre las operaciones en las que puede expedirse factura simplificada hasta 3.000 euros, IVA incluido:"
  options:
  - id: a
    text:
      es: "Entre ellas figuran los servicios de asesoría jurídica y fiscal prestados a particulares y a pequeñas empresas."
  - id: b
    text:
      es: "Entre ellas figuran los servicios de reparación de maquinaria industrial."
  - id: c
    text:
      es: "Entre ellas figuran las entregas de inmuebles a consumidores finales."
  - id: d
    correct: true
    text:
      es: "Entre ellas figuran los servicios de peluquería y los prestados por institutos de belleza."
  explanation:
    es: "El artículo 4.2.h) incluye los servicios de peluquería y los de institutos de belleza. La lista del artículo 4.2 no contiene la asesoría jurídica y fiscal, la reparación de maquinaria industrial ni las entregas de inmuebles, porque las ventas al por menor se refieren a bienes muebles corporales o semovientes."
  citation: "art. 4.2 RD 1619/2012"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2012-14696-art-4
- id: m03-l04-q0291
  prompt:
    es: "Lavandería Aurora presta a un cliente particular servicios de tintorería y lavandería por 3.400 euros, IVA incluido. Según el artículo 4.2 del Real Decreto 1619/2012, de 30 de noviembre, por el que se aprueba el Reglamento por el que se regulan las obligaciones de facturación, ¿puede cumplir su obligación de expedir factura con una factura simplificada?"
  options:
  - id: a
    text:
      es: "Sí, porque el límite de esos servicios es de 3.500 euros, IVA incluido."
  - id: b
    text:
      es: "Sí, porque los servicios de tintorería y lavandería no tienen límite de importe."
  - id: c
    correct: true
    text:
      es: "No, porque el importe excede de 3.000 euros, IVA incluido, límite de esos servicios."
  - id: d
    text:
      es: "No, porque esos servicios no figuran entre las operaciones del artículo 4.2 y el límite general es de 400 euros."
  explanation:
    es: "Los servicios de tintorería y lavandería del artículo 4.2.m) admiten factura simplificada hasta 3.000 euros, IVA incluido. Con 3.400 euros se supera ese límite y debe expedirse factura completa. El límite no es de 3.500 euros ni inexistente, y esos servicios sí figuran en el artículo."
  citation: "art. 4.2 RD 1619/2012"
  difficulty: 1
  tags:
  - "cómputo"
  - "cifra"
# anchor: boe-a-2012-14696-art-4
- id: m03-l04-q0294
  prompt:
    es: "¿Cuál de las siguientes operaciones permite factura simplificada hasta 3.000 euros, IVA incluido, según el artículo 4.2 del Real Decreto 1619/2012, de 30 de noviembre, por el que se aprueba el Reglamento por el que se regulan las obligaciones de facturación?"
  options:
  - id: a
    text:
      es: "La entrega de maquinaria industrial a otro empresario."
  - id: b
    text:
      es: "La prestación de servicios de consultoría a una sociedad."
  - id: c
    text:
      es: "El arrendamiento de locales de negocio a un empresario."
  - id: d
    correct: true
    text:
      es: "El aparcamiento y estacionamiento de vehículos."
  explanation:
    es: "El artículo 4.2.k) incluye el aparcamiento y estacionamiento de vehículos entre las operaciones con factura simplificada hasta 3.000 euros. La maquinaria destinada a otro empresario no es venta al por menor, y los servicios de consultoría y el arrendamiento de locales no figuran en la lista."
  citation: "art. 4.2 RD 1619/2012"
  difficulty: 1
  tags:
  - "requisito"
