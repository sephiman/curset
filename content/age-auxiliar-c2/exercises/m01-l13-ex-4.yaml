# anchor: boe-a-1995-8730-art-13
- id: m01-l13-q290
  prompt:
    es: "Conforme al artículo 13.6 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, los funcionarios en excedencia forzosa tienen derecho a percibir:"
  options:
  - id: a
    text:
      es: "Las retribuciones íntegras durante los dos primeros meses de la excedencia."
  - id: b
    correct: true
    text:
      es: "Las retribuciones básicas y, en su caso, las prestaciones familiares por hijo a cargo."
  - id: c
    text:
      es: "Las retribuciones básicas y el 50 por 100 del complemento específico del último puesto."
  - id: d
    text:
      es: "Una mensualidad de retribuciones por cada año completo de servicios efectivos."
  explanation:
    es: "El artículo 13.6 reconoce a los excedentes forzosos «las retribuciones básicas y, en su caso, las prestaciones familiares por hijo a cargo». El 50 por 100 del complemento específico forma parte de las retribuciones de la expectativa de destino (art. 12.5). Las retribuciones íntegras de los dos primeros meses son de la excedencia por violencia de género o sexual (art. 89.5 TREBEP). La mensualidad por año de servicios es de la excedencia voluntaria incentivada (art. 18.5)."
  citation: "art. 13.6 RD 365/1995"
  difficulty: 1
  tags:
  - "efecto"
  - "cantidad"
# anchor: boe-a-1995-8730-art-13
- id: m01-l13-q291
  prompt:
    es: "Según el artículo 13.6 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, ¿a qué efectos computa el tiempo pasado en excedencia forzosa?"
  options:
  - id: a
    correct: true
    text:
      es: "A efectos de derechos pasivos y de trienios."
  - id: b
    text:
      es: "A efectos de ascensos, trienios y promoción interna."
  - id: c
    text:
      es: "Solo a efectos de derechos pasivos."
  - id: d
    text:
      es: "A efectos de trienios y de consolidación del grado personal."
  explanation:
    es: "El artículo 13.6 da derecho «al cómputo del tiempo en dicha situación a efectos de derechos pasivos y de trienios». Quitar los trienios deja la regla incompleta. La consolidación del grado personal, los ascensos y la promoción interna no están en la lista del artículo."
  citation: "art. 13.6 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-13
- id: m01-l13-q292
  prompt:
    es: "¿Cuál de las siguientes situaciones da derecho a percibir las retribuciones básicas, según el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "La situación de excedencia voluntaria incentivada."
  - id: b
    text:
      es: "La situación de excedencia voluntaria por interés particular."
  - id: c
    text:
      es: "La situación de excedencia voluntaria por agrupación familiar."
  - id: d
    correct: true
    text:
      es: "La situación de excedencia forzosa."
  explanation:
    es: "El artículo 13.6 reconoce a los excedentes forzosos el derecho a «percibir las retribuciones básicas». En las excedencias voluntarias no se devengan retribuciones (art. 19). La incentivada solo da derecho a una mensualidad por año completo de servicios (art. 18.5), que no son retribuciones básicas. La de interés particular y la de agrupación familiar no dan derecho a ninguna cantidad."
  citation: "art. 13.6 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
  - "concepto"
# anchor: boe-a-1995-8730-art-13
- id: m01-l13-q293
  prompt:
    es: "Señale la respuesta correcta sobre el cómputo del tiempo de servicios según el Real Decreto 365/1995, de 10 de marzo, por el que se aprueba el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado:"
  options:
  - id: a
    correct: true
    text:
      es: "El tiempo en excedencia forzosa computa a efectos de trienios y derechos pasivos."
  - id: b
    text:
      es: "El tiempo en excedencia voluntaria por interés particular computa a efectos de trienios."
  - id: c
    text:
      es: "El tiempo en expectativa de destino no computa a efectos de trienios ni derechos pasivos."
  - id: d
    text:
      es: "El tiempo en excedencia voluntaria incentivada computa a efectos de trienios y derechos pasivos."
  explanation:
    es: "El artículo 13.6 da a los excedentes forzosos el cómputo del tiempo «a efectos de derechos pasivos y de trienios». En cambio, en las excedencias voluntarias, incentivada e interés particular incluidas, el tiempo no computa «a efectos de promoción, trienios y derechos pasivos» (art. 19). La expectativa de destino se equipara al servicio activo salvo en las retribuciones (art. 12.5), así que su tiempo sí computa."
  citation: "art. 13.6 RD 365/1995"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-18
- id: m01-l13-q294
  prompt:
    es: "De acuerdo con el artículo 18.4 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, durante la excedencia voluntaria incentivada el funcionario:"
  options:
  - id: a
    text:
      es: "Puede desempeñar puestos en el sector público si obtiene la oportuna compatibilidad."
  - id: b
    text:
      es: "No puede desempeñar puestos en la Administración General del Estado, pero sí en otras."
  - id: c
    correct: true
    text:
      es: "No puede desempeñar puestos en el sector público bajo ningún tipo de relación."
  - id: d
    text:
      es: "Puede desempeñar puestos en el sector público solo como personal laboral temporal."
  explanation:
    es: "El artículo 18.4 dice que la excedencia incentivada «impedirá desempeñar puestos de trabajo en el sector público, bajo ningún tipo de relación funcionarial o contractual, sea ésta de naturaleza laboral o administrativa». No hay excepción para el laboral temporal ni para quien obtenga compatibilidad. La prohibición alcanza a todo el sector público, no solo a la Administración General del Estado."
  citation: "art. 18.4 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-1995-8730-art-18
- id: m01-l13-q295
  prompt:
    es: "Según el artículo 18.4 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, ¿qué ocurre si, concluidos los cinco años de excedencia voluntaria incentivada, el funcionario no pide el reingreso dentro del mes siguiente?"
  options:
  - id: a
    text:
      es: "Se le declara en expectativa de destino durante un año."
  - id: b
    text:
      es: "Pierde de forma automática la condición de funcionario de carrera."
  - id: c
    correct: true
    text:
      es: "Se le declara en excedencia voluntaria por interés particular."
  - id: d
    text:
      es: "Reingresa de oficio con adscripción provisional a un puesto."
  explanation:
    es: "El artículo 18.4: si no se solicita el reingreso dentro del mes siguiente al final del período, el departamento «le declarará en excedencia voluntaria por interés particular». La expectativa de destino es la situación de quien no obtiene puesto en las dos primeras fases de una reasignación de efectivos (art. 12.1). La pérdida de la condición sigue a la falta de reingreso al final de la excedencia por interés particular (art. 16.4). El reingreso por adscripción provisional exige que el funcionario lo pida (art. 62.2 RD 364/1995)."
  citation: "art. 18.4 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-18
- id: m01-l13-q296
  prompt:
    es: "Señale la respuesta correcta sobre la excedencia voluntaria incentivada regulada en el artículo 18.4 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado:"
  options:
  - id: a
    text:
      es: "Dura como máximo quince años e impide desempeñar puestos en el sector público."
  - id: b
    correct: true
    text:
      es: "Dura cinco años e impide desempeñar puestos de trabajo en el sector público."
  - id: c
    text:
      es: "Dura cinco años y permite desempeñar puestos en el sector público como laboral."
  - id: d
    text:
      es: "Dura lo que el plan de empleo e impide desempeñar puestos en el sector público."
  explanation:
    es: "El artículo 18.4: la excedencia incentivada «tendrá una duración de cinco años e impedirá desempeñar puestos de trabajo en el sector público, bajo ningún tipo de relación funcionarial o contractual, sea ésta de naturaleza laboral o administrativa». La prohibición incluye la relación laboral. Quince años es el máximo de la excedencia por interés particular y de la de agrupación familiar (arts. 16.3 y 17). La duración no depende del plan de empleo: es fija."
  citation: "art. 18.4 RD 365/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-1995-8730-art-19
- id: m01-l13-q301
  prompt:
    es: "De acuerdo con el artículo 19 del Real Decreto 365/1995, de 10 de marzo, por el que se aprueba el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, las distintas modalidades de excedencia voluntaria:"
  options:
  - id: a
    correct: true
    text:
      es: "No producen, en ningún caso, reserva de puesto de trabajo."
  - id: b
    text:
      es: "Producen reserva de un puesto en la misma localidad y de igual retribución."
  - id: c
    text:
      es: "Producen reserva del puesto de trabajo durante los seis primeros meses."
  - id: d
    text:
      es: "Producen reserva del puesto de trabajo durante los dos primeros años."
  explanation:
    es: "El artículo 19: las modalidades de excedencia voluntaria «no producen, en ningún caso, reserva de puesto de trabajo». La reserva durante dos años y la posterior en la misma localidad y con igual retribución son de la excedencia por cuidado de familiares (art. 89.4 TREBEP). Los seis primeros meses de reserva son de la excedencia por violencia de género o sexual (art. 89.5 TREBEP). Ninguna de las dos es una excedencia voluntaria."
  citation: "art. 19 RD 365/1995"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-19
- id: m01-l13-q302
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre las excedencias voluntarias es correcta, según el Real Decreto 365/1995, de 10 de marzo, por el que se aprueba el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Ninguna da derecho a percibir cantidad alguna, tampoco la incentivada."
  - id: b
    text:
      es: "La de interés particular da derecho a una mensualidad por año completo de servicios."
  - id: c
    correct: true
    text:
      es: "Solo la incentivada da derecho a una cantidad: una mensualidad por año completo de servicios."
  - id: d
    text:
      es: "Todas dan derecho a las retribuciones básicas durante los dos primeros meses."
  explanation:
    es: "El artículo 19 dice que en las excedencias voluntarias no se devengan retribuciones, «salvo lo previsto en el apartado 5 del artículo anterior»: la mensualidad de la incentivada por cada año completo de servicios efectivos (art. 18.5). Ninguna excedencia voluntaria da retribuciones básicas. La mensualidad no corresponde a la de interés particular. Negar también la de la incentivada borra la única excepción del artículo."
  citation: "art. 19 RD 365/1995"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-11719-art-90
- id: m01-l13-q303
  prompt:
    es: "De acuerdo con el artículo 90.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el funcionario declarado en suspensión queda privado, mientras permanece en ella:"
  options:
  - id: a
    correct: true
    text:
      es: "Del ejercicio de sus funciones y de todos los derechos inherentes a la condición."
  - id: b
    text:
      es: "Del ejercicio de sus funciones, pero conserva los derechos inherentes a la condición."
  - id: c
    text:
      es: "De sus retribuciones complementarias, pero no del ejercicio de sus funciones."
  - id: d
    text:
      es: "Del ejercicio de sus funciones y de la condición de funcionario de carrera."
  explanation:
    es: "El artículo 90.1: el suspenso «quedará privado durante el tiempo de permanencia en la misma del ejercicio de sus funciones y de todos los derechos inherentes a la condición». Pierde también los derechos, así que no los conserva. Pierde el ejercicio de las funciones, no solo una parte de las retribuciones. No pierde la condición de funcionario: la suspensión es una situación administrativa del funcionario (art. 85.1 TREBEP)."
  citation: "art. 90.1 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-90
- id: m01-l13-q304
  prompt:
    es: "Según el artículo 90.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuándo determina la suspensión de funciones la pérdida del puesto de trabajo?"
  options:
  - id: a
    text:
      es: "Cuando la suspensión exceda de dos años."
  - id: b
    text:
      es: "Cuando la suspensión exceda de un año."
  - id: c
    text:
      es: "Cuando la suspensión exceda de tres meses."
  - id: d
    correct: true
    text:
      es: "Cuando la suspensión exceda de seis meses."
  explanation:
    es: "El artículo 90.1: «La suspensión determinará la pérdida del puesto de trabajo cuando exceda de seis meses». Los tres meses, el año y los dos años no son el umbral del artículo."
  citation: "art. 90.1 TREBEP"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-1995-8730-art-21
- id: m01-l13-q308
  prompt:
    es: "Según el artículo 21.1 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, ¿durante qué procedimientos puede acordarse la suspensión provisional de funciones?"
  options:
  - id: a
    text:
      es: "Durante la tramitación de un expediente de compatibilidad o disciplinario."
  - id: b
    correct: true
    text:
      es: "Durante la tramitación de un procedimiento judicial o disciplinario."
  - id: c
    text:
      es: "Solo durante la tramitación de un procedimiento penal contra el funcionario."
  - id: d
    text:
      es: "Solo durante la tramitación de un expediente disciplinario por falta muy grave."
  explanation:
    es: "El artículo 21.1: «La suspensión provisional podrá acordarse preventivamente durante la tramitación de un procedimiento judicial o disciplinario». Caben los dos procedimientos, sin limitarlos a las faltas muy graves ni a la vía penal. El expediente de compatibilidad no está entre ellos."
  citation: "art. 21.1 RD 365/1995"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1995-8730-art-21
- id: m01-l13-q309
  prompt:
    es: "De acuerdo con el artículo 21.3 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, la suspensión provisional acordada en un expediente disciplinario no puede exceder de seis meses:"
  options:
  - id: a
    correct: true
    text:
      es: "Salvo en caso de paralización del procedimiento imputable al interesado."
  - id: b
    text:
      es: "Salvo en caso de paralización del procedimiento imputable a la Administración."
  - id: c
    text:
      es: "Salvo que el expediente se tramite por la comisión de una falta muy grave."
  - id: d
    text:
      es: "Salvo prórroga por otros seis meses mediante resolución motivada."
  explanation:
    es: "El artículo 21.3 dice que la suspensión provisional no puede exceder de seis meses, «salvo en caso de paralización del procedimiento imputable al interesado». Esa es la única excepción del apartado. La paralización imputable a la Administración no alarga la suspensión, porque el apartado habla del interesado. La gravedad de la falta tampoco es excepción, ni lo es una prórroga de otros seis meses por resolución motivada: el apartado fija un tope de seis meses y una sola salvedad."
  citation: "art. 21.3 RD 365/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-1995-8730-art-22
- id: m01-l13-q311
  prompt:
    es: "Conforme al artículo 22.3 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, el funcionario que perdió su puesto de trabajo por condena o sanción debe pedir el reingreso al servicio activo:"
  options:
  - id: a
    correct: true
    text:
      es: "Con un mes de antelación a la finalización del período de suspensión."
  - id: b
    text:
      es: "Dentro de los quince días siguientes a la finalización de la suspensión."
  - id: c
    text:
      es: "Con seis meses de antelación a la finalización del período de suspensión."
  - id: d
    text:
      es: "Dentro del mes siguiente a la finalización del período de suspensión."
  explanation:
    es: "El artículo 22.3 obliga a solicitar el reingreso «con un mes de antelación a la finalización del período de duración de la suspensión». La petición se hace antes del final, no en el mes siguiente ni en los quince días siguientes. La antelación es de un mes, no de seis meses. Seis meses es el plazo que tiene la Administración para conceder el reingreso antes de que el funcionario pase a excedencia forzosa (art. 22.5)."
  citation: "art. 22.3 RD 365/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1995-8730-art-22
- id: m01-l13-q312
  prompt:
    es: "La suspensión firme de funciones que hizo perder su puesto a un funcionario de la Administración General del Estado termina el lunes, 15 de febrero de 2027. ¿Hasta qué día debe pedir el reingreso al servicio activo?"
  options:
  - id: a
    text:
      es: "Hasta el lunes, 1 de febrero de 2027."
  - id: b
    correct: true
    text:
      es: "Hasta el viernes, 15 de enero de 2027."
  - id: c
    text:
      es: "Hasta el lunes, 15 de marzo de 2027."
  - id: d
    text:
      es: "Hasta el lunes, 15 de febrero de 2027."
  explanation:
    es: "El artículo 22.3 RD 365/1995 exige pedir el reingreso «con un mes de antelación a la finalización del período de duración de la suspensión». Un mes antes del lunes 15 de febrero de 2027 es el viernes 15 de enero de 2027, último día para pedirlo. El 1 de febrero deja solo dos semanas de antelación. El 15 de febrero es el propio día en que termina la suspensión y el 15 de marzo, un mes después."
  citation: "art. 22.3 RD 365/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-91
- id: m01-l13-q318
  prompt:
    es: "De acuerdo con el artículo 91 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los plazos, procedimientos y condiciones para solicitar el reingreso al servicio activo:"
  options:
  - id: a
    correct: true
    text:
      es: "Se regulan reglamentariamente, según las situaciones administrativas de procedencia."
  - id: b
    text:
      es: "Se regulan en el propio Estatuto, iguales para todas las situaciones de procedencia."
  - id: c
    text:
      es: "Se fijan en cada convocatoria de concurso, según el puesto que se solicite."
  - id: d
    text:
      es: "Se regulan por ley de cada Administración, sin distinguir la situación de procedencia."
  explanation:
    es: "El artículo 91: «Reglamentariamente se regularán los plazos, procedimientos y condiciones, según las situaciones administrativas de procedencia, para solicitar el reingreso». El Estatuto remite al reglamento, no fija él mismo las reglas. Tampoco las deja a cada convocatoria ni a una ley. Las reglas cambian según la situación de procedencia, como muestran los plazos distintos del RD 365/1995."
  citation: "art. 91 TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1984-17387-art-29-bis
- id: m01-l13-q320
  prompt:
    es: "Conforme al artículo 29 bis.1 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, el reingreso al servicio activo de los funcionarios sin reserva de plaza y destino se efectúa:"
  options:
  - id: a
    text:
      es: "Mediante su participación en las convocatorias de concursos, nunca de libre designación."
  - id: b
    text:
      es: "Mediante su participación en un nuevo proceso selectivo de acceso al cuerpo."
  - id: c
    text:
      es: "Mediante nombramiento directo del Subsecretario del departamento de adscripción."
  - id: d
    correct: true
    text:
      es: "Mediante su participación en las convocatorias de concursos o de libre designación."
  explanation:
    es: "El artículo veintinueve bis.1 dice que el reingreso de quienes no tienen reserva de plaza y destino «se efectuará mediante su participación en las convocatorias de concursos o de libre designación para la provisión de puestos de trabajo». «Nunca de libre designación» contradice «o de libre designación». Un nuevo proceso selectivo no hace falta: el reingreso se hace por convocatorias de provisión de puestos, no de acceso al cuerpo. El nombramiento directo del Subsecretario tampoco es la vía: el apartado 2 solo prevé una adscripción provisional, y el apartado 3 manda convocar ese puesto para su provisión definitiva en el plazo máximo de un año."
  citation: "art. 29 bis.1 Ley 30/1984"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1984-17387-art-29-bis
- id: m01-l13-q322
  prompt:
    es: "Según el artículo 29 bis.2 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, el reingreso por adscripción provisional a un puesto está condicionado:"
  options:
  - id: a
    text:
      es: "A que exista informe favorable de la Secretaría de Estado de Función Pública."
  - id: b
    correct: true
    text:
      es: "A las necesidades del servicio y a que se reúnan los requisitos del puesto."
  - id: c
    text:
      es: "A que el puesto no haya sido convocado antes para su provisión por concurso."
  - id: d
    text:
      es: "A que el funcionario haya permanecido dos años en la situación de procedencia."
  explanation:
    es: "El artículo 29 bis.2 permite el reingreso por adscripción provisional «condicionado a las necesidades del servicio y siempre que se reúnan los requisitos para el desempeño del puesto». No exige una permanencia mínima en la situación de procedencia ni un informe de la Secretaría de Estado. Que el puesto no se haya convocado antes no es una condición del artículo: al contrario, el puesto se convoca después (art. 29 bis.3)."
  citation: "art. 29 bis.2 Ley 30/1984"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-62
- id: m01-l13-q324
  prompt:
    es: "Un funcionario reingresa al servicio activo de la Administración General del Estado por adscripción provisional a un puesto el martes, 2 de febrero de 2027. ¿Hasta qué fecha puede tardar la convocatoria de ese puesto para su provisión definitiva?"
  options:
  - id: a
    text:
      es: "Como máximo, hasta el 2 de agosto de 2027."
  - id: b
    text:
      es: "Como máximo, hasta el 2 de mayo de 2027."
  - id: c
    correct: true
    text:
      es: "Como máximo, hasta el 2 de febrero de 2028."
  - id: d
    text:
      es: "Como máximo, hasta el 2 de febrero de 2029."
  explanation:
    es: "El artículo 62.2 RD 364/1995 manda convocar el puesto asignado provisionalmente «para su provisión definitiva en el plazo máximo de un año», y el artículo 29 bis.3 de la Ley 30/1984 dice lo mismo. Un año desde el martes 2 de febrero de 2027 llega al 2 de febrero de 2028. El 2 de mayo de 2027 corresponde a tres meses, el 2 de agosto de 2027 a seis meses y el 2 de febrero de 2029 a dos años."
  citation: "art. 62.2 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1995-8729-art-62
- id: m01-l13-q325
  prompt:
    es: "De acuerdo con el artículo 62.2 del Real Decreto 364/1995, de 10 de marzo, cuando se convoca el puesto que ocupa el funcionario reingresado por adscripción provisional, este:"
  options:
  - id: a
    correct: true
    text:
      es: "Está obligado a participar en la convocatoria, solicitando ese puesto."
  - id: b
    text:
      es: "Puede participar en la convocatoria si lo desea, sin obligación alguna."
  - id: c
    text:
      es: "Conserva el puesto sin necesidad de participar en la convocatoria."
  - id: d
    text:
      es: "Está obligado a participar, pero no puede solicitar ese mismo puesto."
  explanation:
    es: "El artículo 62.2: el funcionario «tendrá obligación de participar en la convocatoria, solicitando el puesto que ocupa provisionalmente». Participar es una obligación, no una opción. Tiene que pedir precisamente ese puesto. No lo conserva sin concursar: la adscripción es provisional."
  citation: "art. 62.2 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-1995-8729-art-72
- id: m01-l13-q326
  prompt:
    es: "Según el Real Decreto 364/1995, de 10 de marzo, si el funcionario reingresado con destino provisional no obtiene destino definitivo en la convocatoria de su puesto, ¿qué ocurre?"
  options:
  - id: a
    text:
      es: "Pasa a excedencia forzosa con derecho a las retribuciones básicas."
  - id: b
    text:
      es: "Pasa de oficio a la excedencia voluntaria por interés particular."
  - id: c
    text:
      es: "Pasa a la situación de expectativa de destino durante un año."
  - id: d
    correct: true
    text:
      es: "Se le atribuye el desempeño provisional de un puesto de trabajo."
  explanation:
    es: "El artículo 62.2 dice que, si no obtiene destino definitivo, «se le aplicará lo dispuesto el artículo 72.1», y el artículo 72.1 dispone que «se les atribuirá el desempeño provisional de un puesto de trabajo». El funcionario sigue en servicio activo. No pasa a ninguna excedencia ni a la expectativa de destino, que nace de la reasignación de efectivos (art. 12.1 RD 365/1995)."
  citation: "art. 72.1 RD 364/1995"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1995-8729-art-48
- id: m01-l13-q327
  prompt:
    es: "Conforme al artículo 48.1 del Real Decreto 364/1995, de 10 de marzo, si la resolución de un concurso comporta el reingreso al servicio activo, el plazo de toma de posesión es:"
  options:
  - id: a
    text:
      es: "De un mes, computado desde el día siguiente al del cese en el puesto."
  - id: b
    text:
      es: "De quince días naturales, computados desde la publicación de la resolución."
  - id: c
    text:
      es: "De tres días hábiles, computados desde el día siguiente al del cese."
  - id: d
    correct: true
    text:
      es: "De un mes, computado desde la publicación de la resolución del concurso."
  explanation:
    es: "El artículo 48.1 da un mes de plazo cuando la resolución «comporta cambio de residencia o el reingreso al servicio activo», y añade: «Si la resolución comporta el reingreso al servicio activo, el plazo de toma de posesión deberá computarse desde dicha publicación». Los tres días hábiles son para quien no cambia de residencia. El cómputo desde el cese es la regla general, y el que reingresa no cesa en ningún puesto. Los quince días naturales son el plazo de la toma de posesión tras el nombramiento como funcionario de carrera (art. 114.12 RDL 6/2023)."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-48
- id: m01-l13-q328
  prompt:
    es: "La resolución de un concurso que comporta el reingreso al servicio activo de una funcionaria se publica en el «Boletín Oficial del Estado» el viernes, 15 de enero de 2027. ¿Hasta qué día puede tomar posesión?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el lunes, 15 de febrero de 2027."
  - id: b
    text:
      es: "Hasta el miércoles, 20 de enero de 2027."
  - id: c
    text:
      es: "Hasta el lunes, 15 de marzo de 2027."
  - id: d
    text:
      es: "Hasta el martes, 16 de febrero de 2027."
  explanation:
    es: "El artículo 48.1 RD 364/1995 da un mes «desde dicha publicación» cuando el concurso comporta el reingreso. Con el artículo 30.4 LPAC, el cómputo empieza el sábado 16 de enero y termina el mismo día de la publicación en el mes siguiente: el lunes 15 de febrero de 2027, día hábil. El miércoles 20 de enero es el tercer día hábil, el plazo de quien no cambia de residencia. El martes 16 de febrero añade un día de más. El 15 de marzo son dos meses."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
  - "fecha"
# anchor: boe-a-1984-17387-art-29
- id: m01-l13-q329
  prompt:
    es: "Conforme al artículo 29.3 de la Ley 30/1984, de 2 de agosto, de Medidas para la Reforma de la Función Pública, el tiempo de excedencia voluntaria se computa a efectos de trienios cuando el funcionario presta servicios en:"
  options:
  - id: a
    text:
      es: "organismos o entidades del sector público, incluidas las sociedades mercantiles de capital mayoritariamente público."
  - id: b
    correct: true
    text:
      es: "organismos o entidades del sector público, salvo las sociedades mercantiles de capital mayoritariamente público."
  - id: c
    text:
      es: "cualquier empresa, pública o privada, siempre que el puesto sea compatible con el de origen."
  - id: d
    text:
      es: "organismos internacionales, Gobiernos o entidades públicas extranjeras, por período determinado."
  explanation:
    es: "El artículo 29.3 dice que se computa a efectos de trienios «el período de prestación de servicios en organismos o entidades del sector público, con la excepción de los prestados en sociedades mercantiles» de capital mayoritariamente público. La opción que incluye esas sociedades invierte la excepción. La empresa privada no es sector público. Los organismos internacionales y Gobiernos extranjeros son un caso de servicios especiales, no de este cómputo."
  citation: "art. 29.3 Ley 30/1984"
  difficulty: 3
  tags:
  - "excepción"
  - "efecto"
# anchor: boe-a-1984-17387-art-29
- id: m01-l13-q330
  prompt:
    es: "Según el artículo 29.3 de la Ley 30/1984, de 2 de agosto, de Medidas para la Reforma de la Función Pública, en la excedencia voluntaria no se computan a efectos de trienios los servicios prestados en:"
  options:
  - id: a
    text:
      es: "organismos autónomos dependientes de la Administración General del Estado o de alguna de las Comunidades Autónomas."
  - id: b
    text:
      es: "entidades gestoras de la Seguridad Social que dependen del ministerio competente."
  - id: c
    text:
      es: "entidades públicas empresariales dependientes de la Administración General del Estado."
  - id: d
    correct: true
    text:
      es: "sociedades mercantiles con participación mayoritaria, directa o indirecta, de las Administraciones públicas."
  explanation:
    es: "El artículo 29.3 computa a efectos de trienios los servicios en organismos o entidades del sector público, «con la excepción de los prestados en sociedades mercantiles en cuyo capital sea mayoritaria la participación directa o indirecta de las Administraciones públicas». Los organismos autónomos, las entidades gestoras de la Seguridad Social y las entidades públicas empresariales son organismos o entidades del sector público, no sociedades mercantiles, y sus servicios sí cuentan."
  citation: "art. 29.3 Ley 30/1984"
  difficulty: 3
  tags:
  - "excepción"
