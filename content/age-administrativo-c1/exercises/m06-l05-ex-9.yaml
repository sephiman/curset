  explanation:
    es: "Solo se pueden agregar comandos a la barra de herramientas de acceso rápido: el contenido de la mayoría de las listas, como los valores de sangría y espaciado, y los estilos individuales, no se puede agregar."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Personalizar la barra de herramientas de acceso rápido»"
  difficulty: 2
  tags:
