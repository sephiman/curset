# anchor: boe-a-2003-23186-art-172
- id: m03-l12-q0130
  prompt:
    es: "Según el artículo 172.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿mediante qué procedimientos se realiza la enajenación de los bienes embargados, en los casos y condiciones que se fijan reglamentariamente?"
  options:
  - id: a
    text:
      es: "Mediante concurso, venta en bolsa o adjudicación directa."
  - id: b
    correct: true
    text:
      es: "Mediante subasta, concurso o adjudicación directa."
  - id: c
    text:
      es: "Mediante subasta, concurso o dación en pago al ejecutante."
  - id: d
    text:
      es: "Mediante subasta, permuta o adjudicación directa."
  explanation:
    es: "La ley prevé tres formas: subasta, concurso o adjudicación directa (art. 172.1 LGT). La permuta, la venta en bolsa y la dación en pago al ejecutante no son formas de enajenación del artículo. La adjudicación a la Hacienda pública es un cierre del apremio distinto (art. 172.2 LGT)."
  citation: "art. 172.1 LGT"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2003-23186-art-172
- id: m03-l12-q0133
  prompt:
    es: "A Talleres Navarro, S.L. se le embargan unas existencias de fruta fresca antes de que sea firme la liquidación de la deuda de 25.000 euros que se ejecuta. La fruta perderá su valor en pocos días. Según el artículo 172.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede la Administración enajenarla antes de la firmeza?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque los bienes perecederos son una de las excepciones a la regla de esperar a que la liquidación sea firme."
  - id: b
    text:
      es: "No, salvo que el órgano de recaudación obtenga antes autorización del Tribunal Económico-Administrativo."
  - id: c
    text:
      es: "Sí, pero solo si la empresa presta garantía por el importe de la deuda, que son 25.000 euros, más las costas del procedimiento."
  - id: d
    text:
      es: "No, porque la enajenación exige siempre que sea firme el acto de liquidación de la deuda ejecutada."
  explanation:
    es: "Los bienes perecederos están entre las excepciones del artículo 172.3 LGT, y no hace falta garantía ni autorización de un tribunal económico-administrativo. La regla general de esperar a la firmeza de la liquidación admite, por tanto, ese supuesto y los de fuerza mayor, pérdida inminente de valor y solicitud expresa del obligado."
  citation: "art. 172.3 LGT"
  difficulty: 2
  tags:
  - "supuesto"
# anchor: boe-a-2005-14803-art-100
- id: m03-l12-q0135
  prompt:
    es: "Según el artículo 100.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cuáles son las formas de enajenación de los bienes o derechos embargados, salvo los procedimientos específicos de realización de determinados bienes o derechos?"
  options:
  - id: a
    text:
      es: "La subasta judicial, el concurso o la adjudicación a la Hacienda pública."
  - id: b
    text:
      es: "La subasta pública, la venta en bolsa o la adjudicación directa."
  - id: c
    text:
      es: "El concurso, la permuta o la adjudicación a los acreedores."
  - id: d
    correct: true
    text:
      es: "La subasta pública, el concurso o la adjudicación directa."
  explanation:
    es: "El reglamento repite las tres formas de la ley: subasta pública, concurso y adjudicación directa (art. 100.1 RGR). La venta en bolsa o la subasta judicial no son formas de enajenación del artículo, y la adjudicación a la Hacienda pública es una vía distinta que cierra el procedimiento (art. 172.2 LGT)."
  citation: "art. 100.1 RGR"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-101
