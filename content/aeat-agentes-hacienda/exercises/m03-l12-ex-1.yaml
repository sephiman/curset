# anchor: boe-a-2003-23186-art-162
- id: m03-l12-q0049
  prompt:
    es: "De acuerdo con el artículo 162.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, para asegurar o efectuar el cobro de la deuda tributaria, los funcionarios que desarrollan funciones de recaudación pueden:"
  options:
  - id: a
    correct: true
    text:
      es: "comprobar e investigar la existencia y situación de los bienes o derechos de los obligados tributarios."
  - id: b
    text:
      es: "inspeccionar la contabilidad de los obligados tributarios para comprobar la veracidad de sus declaraciones."
  - id: c
    text:
      es: "embargar bienes de los obligados tributarios sin necesidad de dictar diligencia de embargo."
  - id: d
    text:
      es: "exigir la deuda a los responsables sin necesidad de que se dicte acto de declaración de responsabilidad."
  explanation:
    es: "El artículo 162.1 LGT les atribuye la facultad de comprobar e investigar la existencia y la situación de los bienes y derechos de los obligados. Inspeccionar la contabilidad es una actuación del procedimiento de inspección, no la facultad de recaudación de este apartado. Cada actuación de embargo se documenta en diligencia (art. 170.1 LGT), y la responsabilidad se exige con acto de declaración, salvo el caso del artículo 175.1.a LGT."
  citation: "art. 162.1 LGT"
  difficulty: 1
  tags:
  - "facultad"
# anchor: boe-a-2005-14803-art-10
- id: m03-l12-q0051
  prompt:
    es: "Conforme al artículo 10.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, los funcionarios que desempeñan funciones de recaudación son considerados:"
  options:
  - id: a
    correct: true
    text:
      es: "agentes de la autoridad."
  - id: b
    text:
      es: "depositarios de la autoridad del órgano de recaudación."
  - id: c
    text:
      es: "autoridad pública a todos los efectos."
  - id: d
    text:
      es: "agentes de la policía judicial."
  explanation:
    es: "El artículo 10.1 RGR les da la consideración de agentes de la autoridad. No son autoridad ni policía judicial, y no se les define como depositarios de la autoridad del órgano de recaudación."
  citation: "art. 10.1 RGR"
  difficulty: 1
  tags:
  - "sujeto"
# anchor: boe-a-2003-23186-art-162
- id: m03-l12-q0052
  prompt:
    es: "Según el artículo 162.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, todo obligado tributario debe poner en conocimiento de la Administración, cuando esta se lo requiera, una relación de bienes y derechos integrantes de su patrimonio:"
  options:
  - id: a
    text:
      es: "en cuantía suficiente para cubrir el importe de la deuda tributaria y las sanciones que pudieran derivarse."
  - id: b
    text:
      es: "por el valor total de su patrimonio neto."
  - id: c
    text:
      es: "únicamente cuando se haya dictado diligencia de embargo."
  - id: d
    correct: true
    text:
      es: "en cuantía suficiente para cubrir el importe de la deuda tributaria."
  explanation:
    es: "La relación debe ser de bienes y derechos en cuantía suficiente para cubrir la deuda (art. 162.1 LGT, que remite al art. 169.2 LGT). No se exige declarar todo el patrimonio, ni añadir sanciones futuras, ni esperar a que exista una diligencia de embargo, porque se pide cuando la Administración lo requiera."
  citation: "art. 162.1 LGT"
  difficulty: 2
  tags:
  - "obligación"
# anchor: boe-a-2003-23186-art-162
- id: m03-l12-q0053
  prompt:
    es: "De acuerdo con el artículo 162.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el incumplimiento por el obligado tributario de las resoluciones o requerimientos dictados en el curso del procedimiento de recaudación:"
  options:
  - id: a
    text:
      es: "Se puede imponer una multa coercitiva sucesiva hasta el cumplimiento, mediante acuerdo del órgano competente."
  - id: b
    text:
      es: "Se puede acordar, sin apercibimiento previo, la ejecución subsidiaria mediante acuerdo del órgano competente."
  - id: c
    correct: true
    text:
      es: "Se puede acordar, previo apercibimiento, la ejecución subsidiaria de esas resoluciones o requerimientos, mediante acuerdo del órgano competente."
  - id: d
    text:
      es: "Se puede acordar, previo apercibimiento, la ejecución subsidiaria mediante resolución del Tribunal Económico-Administrativo Regional competente."
  explanation:
    es: "La ejecución subsidiaria exige apercibimiento previo y acuerdo del órgano competente (art. 162.2 LGT). La falta de apercibimiento invalida la primera alternativa. La multa coercitiva no es la medida que prevé el artículo, y el tribunal económico-administrativo no acuerda la ejecución subsidiaria."
  citation: "art. 162.2 LGT"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2003-23186-art-162
- id: m03-l12-q0224
  prompt:
    es: "¿Qué deben hacer los obligados tributarios respecto de los funcionarios que desarrollan funciones de recaudación en las actuaciones materiales del procedimiento de apremio, según el artículo 162.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Designar a un representante que atienda las actuaciones materiales en su nombre."
  - id: b
    correct: true
    text:
      es: "Atenderles y prestarles la debida colaboración."
  - id: c
    text:
      es: "Facilitarles el acceso a su domicilio sin necesidad de autorización alguna."
  - id: d
    text:
      es: "Comunicarles previamente cualquier cambio en su patrimonio, en el plazo de diez días."
  explanation:
    es: "Los obligados atienden a los funcionarios y les prestan la debida colaboración (art. 162.2 LGT). El acceso al domicilio constitucionalmente protegido exige las garantías del artículo 113 LGT. El artículo no fija un plazo de diez días para comunicar cambios patrimoniales ni exige representante."
  citation: "art. 162.2 LGT"
  difficulty: 2
  tags:
  - "obligación"
# anchor: boe-a-2005-14803-art-10
- id: m03-l12-q0295
  prompt:
    es: "Conforme al artículo 10.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre los funcionarios que desempeñan funciones de recaudación:"
  options:
  - id: a
    correct: true
    text:
      es: "Son considerados agentes de la autoridad, tienen las facultades del artículo 142 de la Ley General Tributaria y pueden adoptar las medidas cautelares del artículo 146."
  - id: b
    text:
      es: "Son considerados agentes de la autoridad, tienen las facultades del artículo 146 y pueden adoptar las medidas cautelares del artículo 142."
  - id: c
    text:
      es: "Son considerados agentes de la autoridad, pero solo tienen las facultades de investigación patrimonial y no pueden adoptar medidas cautelares."
  - id: d
    text:
      es: "Son considerados autoridad pública, tienen las facultades del artículo 142 de la Ley General Tributaria y pueden adoptar las medidas cautelares del artículo 81 de esa misma ley."
  explanation:
    es: "Los funcionarios de recaudación son agentes de la autoridad, con las facultades del artículo 142 LGT y las medidas cautelares del artículo 146 (art. 10.1 RGR). No son autoridad pública, y el artículo 81 LGT no es el que cita el reglamento. No se limitan a investigar, y la inversión de los artículos 142 y 146 intercambia facultades y medidas."
  citation: "art. 10.1 RGR"
  difficulty: 2
  tags:
  - "facultad"
# anchor: boe-a-2003-23186-art-165
- id: m03-l12-q0007
  prompt:
    es: "¿Qué ocurre con el procedimiento de apremio cuando se interpone una tercería de mejor derecho, según el artículo 165.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Se suspende en lo que se refiere a los bienes controvertidos, una vez adoptadas las medidas de aseguramiento que procedan."
  - id: b
    correct: true
    text:
      es: "Prosigue hasta la realización de los bienes y el producto obtenido se consigna en depósito a resultas de la resolución de la tercería."
  - id: c
    text:
      es: "Prosigue hasta la realización de los bienes y el producto obtenido se entrega al tercerista como pago anticipado de su crédito, sin esperar a la resolución."
  - id: d
    text:
      es: "Se suspende por completo hasta que se resuelva la tercería, sin que se pueda realizar ningún bien embargado."
  explanation:
    es: "En la tercería de mejor derecho el apremio no se detiene: se realizan los bienes y lo obtenido queda consignado en depósito hasta que se resuelva (art. 165.5 LGT). La suspensión con medidas de aseguramiento es la regla de la tercería de dominio. Entregar el producto al tercerista antes de la resolución contradice la consignación en depósito."
  citation: "art. 165.5 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2005-14803-art-117
- id: m03-l12-q0041
  prompt:
    es: "Conforme al artículo 117.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la tercería solo puede fundarse en el dominio de los bienes embargados al obligado al pago o en:"
  options:
  - id: a
    text:
      es: "el derecho del obligado al pago a cobrar su crédito con preferencia a los demás acreedores y a la propia Hacienda pública."
  - id: b
    text:
      es: "la existencia de una carga posterior al embargo a favor del tercerista."
  - id: c
    text:
      es: "la posesión de los bienes embargados por el tercerista durante más de un año."
  - id: d
    correct: true
    text:
      es: "el derecho del tercerista a ser reintegrado de su crédito con preferencia al que es objeto del expediente de apremio."
  explanation:
    es: "Los dos fundamentos de la tercería son el dominio y el mejor derecho del tercerista a cobrar con preferencia (art. 117.2 RGR). La mera posesión o una carga posterior no son fundamento. El derecho a cobrar antes es del tercerista, no del obligado al pago."
  citation: "art. 117.2 RGR"
  difficulty: 2
  tags:
  - "fundamento"
# anchor: boe-a-2005-14803-art-117
- id: m03-l12-q0042
  prompt:
    es: "Señale la respuesta CORRECTA sobre la reclamación de tercería en vía administrativa, según el artículo 117 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación:"
  options:
  - id: a
    text:
      es: "La reclamación formulada por el obligado al pago es una tercería de mejor derecho."
  - id: b
    correct: true
    text:
      es: "La reclamación formulada por el obligado al pago no puede ser calificada como tercería."
  - id: c
    text:
      es: "La reclamación en vía administrativa es voluntaria y no condiciona el acceso a los tribunales civiles."
  - id: d
    text:
      es: "La tercería puede fundarse en cualquier derecho del tercerista sobre los bienes embargados."
  explanation:
    es: "El artículo 117.3 RGR excluye que la reclamación del propio obligado sea una tercería. Además, la reclamación en vía administrativa es requisito previo para acudir a los juzgados civiles (art. 117.1), y la tercería solo puede fundarse en el dominio o en el mejor derecho (art. 117.2)."
  citation: "art. 117.3 RGR"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2005-14803-art-117
- id: m03-l12-q0043
  prompt:
    es: "De acuerdo con el artículo 117.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la reclamación en vía administrativa es requisito previo para el ejercicio de la acción de tercería ante:"
  options:
  - id: a
    correct: true
    text:
      es: "los juzgados y tribunales civiles."
  - id: b
    text:
      es: "el Tribunal Económico-Administrativo Central en única instancia."
  - id: c
    text:
      es: "los tribunales económico-administrativos."
  - id: d
    text:
      es: "los juzgados y tribunales de lo contencioso-administrativo."
  explanation:
    es: "La acción de tercería se ejercita ante la jurisdicción civil y exige haber reclamado antes en vía administrativa (art. 117.1 RGR). Ni los tribunales económico-administrativos ni los contencioso-administrativos son el destino de esa acción."
  citation: "art. 117.1 RGR"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2003-23186-art-165
- id: m03-l12-q0044
  prompt:
    es: "Según el artículo 165.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando un tercero pretende el levantamiento del embargo por entender que le pertenece el dominio de los bienes embargados, formula reclamación de tercería ante:"
  options:
  - id: a
    text:
      es: "el órgano de recaudación que dictó la providencia de apremio, en todo caso."
  - id: b
    correct: true
    text:
      es: "el órgano administrativo competente."
  - id: c
    text:
      es: "el juzgado de primera instancia del lugar de los bienes."
  - id: d
    text:
      es: "el Tribunal Económico-Administrativo Regional."
  explanation:
    es: "La reclamación de tercería se presenta ante el órgano administrativo competente (art. 165.3 LGT). El juzgado civil solo interviene después, y la vía administrativa es requisito previo (art. 117.1 RGR). El tribunal económico-administrativo no es el destino de esta reclamación. El artículo no designa al órgano que dictó la providencia de apremio, sino al competente."
  citation: "art. 165.3 LGT"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2005-14803-art-119
- id: m03-l12-q0045
  prompt:
    es: "Si el escrito de reclamación de tercería no reúne los requisitos exigibles, el artículo 119.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que se requerirá al tercerista para que subsane en el plazo de:"
  options:
  - id: a
    correct: true
    text:
      es: "10 días contados a partir del día siguiente al de la notificación del requerimiento."
  - id: b
    text:
      es: "10 días contados a partir de la presentación del escrito."
  - id: c
    text:
      es: "un mes contado a partir del día siguiente al de la notificación del requerimiento."
  - id: d
    text:
      es: "15 días contados a partir del día siguiente al de la notificación del requerimiento."
  explanation:
    es: "El plazo de subsanación es de 10 días desde el día siguiente a la notificación del requerimiento (art. 119.1 RGR). Los 15 días son el plazo para dictar el acuerdo de admisión a trámite. No se cuenta desde la presentación del escrito, y no es de un mes."
  citation: "art. 119.1 RGR"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2005-14803-art-119
- id: m03-l12-q0046
  prompt:
    es: "Conforme al artículo 119.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el acuerdo de admisión a trámite de la tercería debe dictarse en el plazo de 15 días desde que se reciba la reclamación o se entiendan subsanados los defectos, y se notifica:"
  options:
  - id: a
    correct: true
    text:
      es: "al tercerista y al obligado al pago."
  - id: b
    text:
      es: "al obligado al pago y a los titulares de cargas posteriores."
  - id: c
    text:
      es: "solo al tercerista."
  - id: d
    text:
      es: "al tercerista y al ejecutante."
  explanation:
    es: "El acuerdo de admisión se notifica al tercerista y al obligado al pago (art. 119.1 RGR). No se limita al tercerista, y el artículo no habla de ejecutante ni de titulares de cargas posteriores."
  citation: "art. 119.1 RGR"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2005-14803-art-119
- id: m03-l12-q0220
  prompt:
    es: "Admitida una tercería de mejor derecho, el artículo 119.5 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que se prosigue el procedimiento de apremio hasta la realización de los bienes o derechos y que el importe obtenido:"
  options:
  - id: a
    text:
      es: "se ingresa en el Tesoro, sin esperar a que se resuelva la reclamación."
  - id: b
    correct: true
    text:
      es: "se consigna a resultas de la reclamación."
  - id: c
    text:
      es: "se retiene por el depositario hasta que transcurran seis meses desde la admisión."
  - id: d
    text:
      es: "se entrega al tercerista, que lo restituye si la reclamación se desestima."
  explanation:
    es: "En la tercería de mejor derecho se realizan los bienes y se consigna el importe a resultas de la reclamación (art. 119.5 RGR). No se entrega al tercerista, ni se ingresa en el Tesoro antes de resolver, ni se retiene por un plazo fijo de seis meses, que es el de la resolución de la tercería (art. 120.2)."
  citation: "art. 119.5 RGR"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2005-14803-art-119
- id: m03-l12-q0221
  prompt:
    es: "¿Qué advertencia se hace al tercerista cuyo escrito de reclamación no reúne los requisitos exigibles, en el requerimiento de subsanación del artículo 119.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "La de que, si no subsana, se admitirá a trámite la reclamación con el contenido que tenga."
  - id: b
    correct: true
    text:
      es: "La de que, si no subsana, se procederá al archivo de la reclamación."
  - id: c
    text:
      es: "La de que, si no subsana, se tendrá por desistido de su derecho de propiedad sobre los bienes."
  - id: d
    text:
      es: "La de que, si no subsana, se impondrá una sanción por presentación defectuosa de la reclamación."
  explanation:
    es: "El requerimiento advierte de que, si no se subsana en el plazo, se archiva la reclamación (art. 119.1 RGR). No se declara el desistimiento del derecho de propiedad, no se admite con sus defectos y no se impone sanción alguna."
  citation: "art. 119.1 RGR"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-165
- id: m03-l12-q0263
  prompt:
    es: "¿Sobre qué bienes se suspende el procedimiento de apremio cuando se interpone una tercería de dominio, según el artículo 165.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Sobre todos los bienes del obligado tributario embargados."
  - id: b
    text:
      es: "Sobre los bienes inscribibles en un registro público."
  - id: c
    correct: true
    text:
      es: "Sobre los bienes y derechos controvertidos."
  - id: d
    text:
      es: "Sobre los bienes del obligado de valor superior a la deuda."
  explanation:
    es: "La suspensión alcanza solo los bienes y derechos controvertidos (art. 165.4 LGT), y condicionada a las medidas de aseguramiento. No se extiende a todos los bienes embargados, ni a los de valor superior a la deuda, ni a los inscribibles por serlo."
  citation: "art. 165.4 LGT"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2005-14803-art-119
- id: m03-l12-q0278
  prompt:
    es: "Señale la respuesta CORRECTA sobre los plazos de la reclamación de tercería en vía administrativa, según los artículos 119 y 120 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación:"
  options:
  - id: a
    text:
      es: "El requerimiento de subsanación concede 10 días, el acuerdo de admisión debe dictarse en un mes y la resolución debe notificarse en seis meses."
  - id: b
    text:
      es: "El requerimiento de subsanación concede 15 días, el acuerdo de admisión debe dictarse en 10 días y la resolución debe notificarse en seis meses."
  - id: c
    correct: true
    text:
      es: "El requerimiento de subsanación concede 10 días, el acuerdo de admisión debe dictarse en 15 días y la resolución debe notificarse en seis meses."
  - id: d
    text:
      es: "El requerimiento de subsanación concede 10 días, el acuerdo de admisión debe dictarse en 15 días y la resolución debe notificarse en tres meses."
  explanation:
    es: "Los plazos son 10 días para subsanar (art. 119.1), 15 días para dictar el acuerdo de admisión (art. 119.1) y seis meses para notificar la resolución (art. 120.2 RGR). Las otras opciones intercambian los 10 y los 15 días, sustituyen los seis meses por tres o cambian los 15 días por un mes."
  citation: "art. 119.1 RGR"
  difficulty: 3
  tags:
  - "plazo"
