# anchor: boe-a-2001-21090-art-1
- id: m02-l02-q032
  prompt:
    es: "De acuerdo con el artículo 1.1 de la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, pueden ejercer el derecho de petición:"
  options:
  - id: a
    text:
      es: "Solo los españoles mayores de edad y las personas jurídicas españolas, de forma individual o colectiva."
  - id: b
    text:
      es: "Toda persona natural, prescindiendo de su nacionalidad, solo de forma individual."
  - id: c
    text:
      es: "Toda persona natural o jurídica de nacionalidad española o residente legal en España."
  - id: d
    correct: true
    text:
      es: "Toda persona natural o jurídica, prescindiendo de su nacionalidad, individual o colectivamente."
  explanation:
    es: "El artículo 1.1 reconoce el derecho a «toda persona natural o jurídica, prescindiendo de su nacionalidad», que puede ejercerlo «individual o colectivamente». No se limita a los españoles mayores de edad ni a los residentes legales, incluye a las personas jurídicas y admite el ejercicio colectivo."
  citation: "art. 1.1 LO 4/2001"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2001-21090-art-4
- id: m02-l02-q033
  prompt:
    es: "¿Cuál de los siguientes datos debe incluir necesariamente el escrito de petición según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición?"
  options:
  - id: a
    correct: true
    text:
      es: "La nacionalidad del solicitante, si la tuviere."
  - id: b
    text:
      es: "La firma de un abogado colegiado en ejercicio."
  - id: c
    text:
      es: "La fundamentación jurídica de lo que se pide."
  - id: d
    text:
      es: "El número de identificación fiscal del destinatario."
  explanation:
    es: "El artículo 4.1 dice que las peticiones «incluirán necesariamente la identidad del solicitante, la nacionalidad si la tuviere, el lugar o el medio elegido para la práctica de notificaciones, el objeto y el destinatario». No exige firma de abogado ni fundamentación jurídica. Del destinatario basta con identificarlo; no se pide su número de identificación fiscal."
  citation: "art. 4.1 LO 4/2001"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2001-21090-art-6
- id: m02-l02-q034
  prompt:
    es: "Según el artículo 6.2 de la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, ¿en qué plazo debe quien recibe una petición acusar recibo y comunicarlo al interesado?"
  options:
  - id: a
    text:
      es: "Dentro de los quince días siguientes a su recepción."
  - id: b
    text:
      es: "Dentro de los cuarenta y cinco días hábiles siguientes."
  - id: c
    correct: true
    text:
      es: "Dentro de los diez días siguientes a su recepción."
  - id: d
    text:
      es: "Dentro de los tres meses siguientes a su presentación."
  explanation:
    es: "El artículo 6.2 obliga a quien recibe la petición a acusar recibo y comunicarlo al interesado «dentro de los diez días siguientes a su recepción». Quince días es el plazo de subsanación (art. 7.2). Cuarenta y cinco días hábiles es el plazo para declarar la inadmisibilidad (art. 9.1). Tres meses es el plazo para contestar una petición admitida (art. 11.1)."
  citation: "art. 6.2 LO 4/2001"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2001-21090-art-7
- id: m02-l02-q035
  prompt:
    es: "Según el artículo 7.2 de la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, si el escrito incumple los requisitos del artículo 4, se requerirá al peticionario para que subsane los defectos:"
  options:
  - id: a
    text:
      es: "En diez días, con el apercibimiento de que, si no lo hiciera, se le tendrá por desistido."
  - id: b
    correct: true
    text:
      es: "En quince días, con el apercibimiento de que, si no lo hiciera, se le tendrá por desistido."
  - id: c
    text:
      es: "En quince días, con el apercibimiento de que, si no lo hiciera, se inadmitirá su petición."
  - id: d
    text:
      es: "En diez días, con el apercibimiento de que, si no lo hiciera, se resolverá con lo aportado."
  explanation:
    es: "El artículo 7.2 fija «el plazo de quince días con el apercibimiento de que, si así no lo hiciera, se le tendrá por desistido de su petición». Diez días es el plazo del acuse de recibo (art. 6.2), no el de subsanación. La consecuencia es el desistimiento y el archivo, no la inadmisión ni una resolución con lo aportado."
  citation: "art. 7.2 LO 4/2001"
  difficulty: 3
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2001-21090-art-8
- id: m02-l02-q036
  prompt:
    es: "¿En cuál de los siguientes casos se inadmitirá una petición según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición?"
  options:
  - id: a
    text:
      es: "Cuando afecte exclusivamente al peticionario y carezca de interés colectivo o general."
  - id: b
    correct: true
    text:
      es: "Cuando sobre su objeto exista un proceso judicial ya iniciado sin resolución firme."
  - id: c
    text:
      es: "Cuando la formulen varias personas de forma colectiva, sin un representante común."
  - id: d
    text:
      es: "Cuando la presente una persona de nacionalidad extranjera no residente en España."
  explanation:
    es: "El artículo 8 no admite las peticiones sobre cuyo objeto exista un procedimiento parlamentario, administrativo o «un proceso judicial ya iniciado, en tanto sobre los mismos no haya recaído acuerdo o resolución firme». El artículo 3 permite peticiones que afecten solo al peticionario. El artículo 1.1 admite el ejercicio colectivo y no exige nacionalidad ni residencia."
  citation: "art. 8 LO 4/2001"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2001-21090-art-9
- id: m02-l02-q037
  prompt:
    es: "Una petición dirigida a un Ministerio se presenta el martes 12 de enero de 2027. Si en ese periodo no hay festivos, ¿hasta qué día, según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, puede acordarse y notificarse su inadmisión?"
  options:
  - id: a
    text:
      es: "Hasta el lunes 15 de marzo de 2027."
  - id: b
    text:
      es: "Hasta el viernes 26 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "Hasta el martes 16 de marzo de 2027."
  - id: d
    text:
      es: "Hasta el lunes 12 de abril de 2027."
  explanation:
    es: "El artículo 9.1 exige acordar y notificar la inadmisibilidad «en los cuarenta y cinco días hábiles siguientes al de presentación». El cómputo empieza el miércoles 13 de enero de 2027 y excluye sábados y domingos (art. 30.2 LPAC); el enunciado descarta los festivos. El cuadragésimo quinto día hábil es el martes 16 de marzo de 2027. El lunes 15 de marzo sale de contar como primero el propio día de la presentación. El viernes 26 de febrero sale de contar 45 días naturales. El lunes 12 de abril corresponde a tres meses, el plazo para contestar una petición ya admitida (art. 11.1)."
  citation: "art. 9.1 LO 4/2001"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2001-21090-art-9
- id: m02-l02-q039
  prompt:
    es: "Según el artículo 9.2 de la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, si transcurre el plazo para acordar y notificar la inadmisibilidad sin que se haya notificado, la petición:"
  options:
  - id: a
    text:
      es: "Se entenderá estimada por silencio."
  - id: b
    text:
      es: "Se entenderá desestimada por silencio."
  - id: c
    text:
      es: "Se entenderá caducada y se archivará."
  - id: d
    correct: true
    text:
      es: "Se entenderá admitida a trámite."
  explanation:
    es: "El artículo 9.2 dice que, si no se declara la inadmisibilidad en el plazo del apartado 1, «se entenderá que la petición ha sido admitida a trámite». La admisión obliga a contestar en tres meses (art. 11.1), pero no equivale a estimarla. Tampoco se entiende desestimada ni caducada."
  citation: "art. 9.2 LO 4/2001"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2001-21090-art-9
- id: m02-l02-q040
  prompt:
    es: "Según el artículo 9.1 de la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, cuando la inadmisión se deba a que existen otros procedimientos específicos para satisfacer el objeto de la petición, la declaración:"
  options:
  - id: a
    correct: true
    text:
      es: "Indicará expresamente las disposiciones a cuyo amparo deba sustanciarse y el órgano competente para ella."
  - id: b
    text:
      es: "Remitirá de oficio la petición al órgano competente para tramitar ese procedimiento específico, sin otra indicación."
  - id: c
    text:
      es: "Podrá dictarse sin motivación alguna, porque basta con la mera referencia a la existencia de ese procedimiento."
  - id: d
    text:
      es: "Se notificará en el plazo de tres meses a contar desde la presentación de la petición."
  explanation:
    es: "El párrafo segundo del artículo 9.1 dice que, en ese caso, la declaración de inadmisión «deberá indicar expresamente las disposiciones a cuyo amparo deba sustanciarse, así como el órgano competente para ella». La remisión de oficio es la regla de la falta de competencia (art. 10.1). La declaración es «siempre motivada». Se notifica en cuarenta y cinco días hábiles, no en tres meses."
  citation: "art. 9.1 LO 4/2001"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2001-21090-art-10
- id: m02-l02-q041
  prompt:
    es: "Según el artículo 10.1 de la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, si la inadmisibilidad se basa en la falta de competencia del destinatario, ¿qué debe hacer este?"
  options:
  - id: a
    text:
      es: "Devolverla al peticionario en diez días, indicándole cuál es el órgano competente."
  - id: b
    text:
      es: "Remitirla en quince días a quien estime competente, sin comunicarlo al peticionario."
  - id: c
    text:
      es: "Archivarla y comunicar al peticionario que puede presentarla de nuevo ante otro órgano."
  - id: d
    correct: true
    text:
      es: "Remitirla en diez días a quien estime competente y comunicarlo al peticionario."
  explanation:
    es: "El artículo 10.1 dice que el destinatario «la remitirá a la institución, administración u organismo que estime competente en el plazo de diez días y lo comunicará así al peticionario». No la devuelve ni la archiva: la remite él. El plazo es de diez días, no de quince, y la comunicación al peticionario es obligatoria."
  citation: "art. 10.1 LO 4/2001"
  difficulty: 3
  tags:
  - "procedimiento"
  - "plazo"
# anchor: boe-a-2001-21090-art-11
- id: m02-l02-q042
  prompt:
    es: "Una petición presentada el miércoles 31 de marzo de 2027 ha sido admitida a trámite. Según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, ¿hasta qué día hay para contestarla y notificar la contestación?"
  options:
  - id: a
    text:
      es: "Hasta el jueves 1 de julio de 2027."
  - id: b
    correct: true
    text:
      es: "Hasta el miércoles 30 de junio de 2027."
  - id: c
    text:
      es: "Hasta el martes 29 de junio de 2027."
  - id: d
    text:
      es: "Hasta el lunes 31 de mayo de 2027."
  explanation:
    es: "El artículo 11.1 da «el plazo máximo de tres meses a contar desde la fecha de su presentación». Los meses se cuentan de fecha a fecha y, si el mes de vencimiento no tiene el día equivalente, el plazo expira el último día del mes (art. 30.4 LPAC). Junio no tiene día 31, así que el plazo acaba el miércoles 30 de junio de 2027, día hábil. El jueves 1 de julio sale de pasar al mes siguiente, que la regla no permite. El martes 29 de junio sale de cerrar el plazo un día antes del último día del mes. El lunes 31 de mayo corresponde a dos meses, no a tres."
  citation: "art. 11.1 LO 4/2001"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2001-21090-art-11
- id: m02-l02-q043
  prompt:
    es: "Según el artículo 11.1 de la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, admitida a trámite una petición, la autoridad u órgano competente deberá contestar y notificar la contestación:"
  options:
  - id: a
    text:
      es: "En el plazo máximo de tres meses a contar desde la fecha de su admisión a trámite."
  - id: b
    text:
      es: "En el plazo máximo de cuarenta y cinco días hábiles desde la fecha de su presentación."
  - id: c
    correct: true
    text:
      es: "En el plazo máximo de tres meses a contar desde la fecha de su presentación."
  - id: d
    text:
      es: "En el plazo máximo de seis meses a contar desde la fecha de su presentación."
  explanation:
    es: "El artículo 11.1 LO 4/2001 dice que, admitida a trámite la petición, la autoridad u órgano competente deberá contestar y notificar «en el plazo máximo de tres meses a contar desde la fecha de su presentación». Contar desde la admisión cambia el día inicial: el apartado dice presentación. Cuarenta y cinco días hábiles desde la presentación es el plazo del artículo 9.1 para declarar la inadmisibilidad, no el de contestar. Seis meses duplica el plazo de tres meses del apartado."
  citation: "art. 11.1 LO 4/2001"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-29
- id: m02-l02-q101
  prompt:
    es: "Según la Constitución Española de 1978, todos los españoles tendrán el derecho de petición, cuyo ejercicio se configura como un derecho:"
  options:
  - id: a
    text:
      es: "Individual, oral o escrito, en la forma y con los efectos que fije el Gobierno de la Nación."
  - id: b
    text:
      es: "Colectivo, por escrito, con los efectos que determinen los tribunales."
  - id: c
    text:
      es: "Individual y colectivo, oral, con los efectos que determine el reglamento."
  - id: d
    correct: true
    text:
      es: "Individual y colectivo, por escrito, en la forma y con los efectos que determine la ley."
  explanation:
    es: "El artículo 29.1 reconoce el derecho de petición individual y colectivo, por escrito, en la forma y con los efectos que determine la ley. No lo deja al Gobierno, a los tribunales ni al reglamento, y excluye la petición oral."
  citation: "art. 29.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1996-4997-art-4
- id: m02-l02-q102
  prompt:
    es: "Las unidades de información administrativa deben elevar a los órganos competentes, según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, las peticiones que reciban en las que:"
  options:
  - id: a
    correct: true
    text:
      es: "No figure el destinatario o conste erróneamente."
  - id: b
    text:
      es: "No se acredite la nacionalidad del solicitante."
  - id: c
    text:
      es: "No firmen todos los peticionarios de una petición colectiva."
  - id: d
    text:
      es: "No se indique con claridad el objeto de la petición."
  explanation:
    es: "El artículo 4.f) les manda elevar las peticiones sin destinatario o con destinatario erróneo. La falta de nacionalidad, de firmas o de claridad en el objeto no figura entre los supuestos de ese deber."
  citation: "art. 4.f) RD 208/1996"
  difficulty: 2
  tags:
  - "procedimiento"
  - "competencia"
# anchor: boe-a-2001-21090-art-1
- id: m02-l02-q103
  prompt:
    es: "Según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, del ejercicio del derecho de petición no puede derivarse perjuicio alguno para el peticionario, pero:"
  options:
  - id: a
    text:
      es: "Quedan exentos de responsabilidad los peticionarios de buena fe aunque incurran en delito."
  - id: b
    text:
      es: "Solo responden de los daños causados los peticionarios que actúen colectivamente."
  - id: c
    text:
      es: "No se admiten las peticiones presentadas por personas jurídicas de nacionalidad extranjera."
  - id: d
    correct: true
    text:
      es: "No quedan exentos de responsabilidad quienes, con ocasión de su ejercicio, incurran en delito o falta."
  explanation:
    es: "El artículo 1.1 deja subsistente la responsabilidad de quienes incurran en delito o falta. No exime a los peticionarios de buena fe, no limita la responsabilidad a las peticiones colectivas y no excluye a las personas jurídicas extranjeras, porque el derecho corresponde a toda persona natural o jurídica sin atender a su nacionalidad."
  citation: "art. 1.1 LO 4/2001"
  difficulty: 2
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-2001-21090-art-2
- id: m02-l02-q104
  prompt:
    es: "Según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, el derecho de petición puede ejercerse ante cualquier institución pública, administración o autoridad, respecto de:"
  options:
  - id: a
    text:
      es: "Cualquier materia de interés general."
  - id: b
    text:
      es: "Las materias que afecten exclusivamente al peticionario."
  - id: c
    correct: true
    text:
      es: "Las materias de su competencia."
  - id: d
    text:
      es: "Las materias de competencia estatal."
  explanation:
    es: "El artículo 2 limita el derecho a las materias de competencia del destinatario. No alcanza cualquier materia de interés general, no se restringe a las que afectan solo al peticionario ni a las de competencia estatal: vale cualquier ámbito territorial o funcional."
  citation: "art. 2 LO 4/2001"
  difficulty: 2
  tags:
  - "concepto"
  - "competencia"
# anchor: boe-a-2001-21090-art-3
- id: m02-l02-q105
  prompt:
    es: "Según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, no son objeto del derecho de petición las solicitudes, quejas o sugerencias para cuya satisfacción:"
  options:
  - id: a
    text:
      es: "El peticionario sea una persona jurídica que actúa colectivamente y sin acreditar su nacionalidad."
  - id: b
    correct: true
    text:
      es: "El ordenamiento jurídico establezca un procedimiento específico distinto al regulado en la ley."
  - id: c
    text:
      es: "La autoridad competente deba convocar una audiencia especial."
  - id: d
    text:
      es: "El escrito se presente por un medio de carácter electrónico."
  explanation:
    es: "El artículo 3 excluye lo que tenga un procedimiento específico distinto. Que el peticionario sea una persona jurídica o actúe colectivamente no lo excluye, según el artículo 1.1, y tampoco que el escrito sea electrónico, según el artículo 4.1; la audiencia especial no figura como causa de exclusión."
  citation: "art. 3 LO 4/2001"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2001-21090-art-4
- id: m02-l02-q106
  prompt:
    es: "Según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, las peticiones se formularán por escrito, pudiendo utilizarse cualquier medio, incluso electrónico, que permita:"
  options:
  - id: a
    correct: true
    text:
      es: "Acreditar su autenticidad."
  - id: b
    text:
      es: "Garantizar su confidencialidad."
  - id: c
    text:
      es: "Verificar la nacionalidad del solicitante."
  - id: d
    text:
      es: "Asegurar su registro inmediato."
  explanation:
    es: "El artículo 4.1 admite cualquier medio que permita acreditar la autenticidad de la petición. La confidencialidad es un derecho del peticionario que establece el artículo 4.4, no una condición del medio, y ni la nacionalidad ni el registro inmediato son el criterio."
  citation: "art. 4.1 LO 4/2001"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2001-21090-art-4
- id: m02-l02-q107
  prompt:
    es: "¿Qué debe incluir necesariamente el escrito de petición, junto a la identidad del solicitante y la nacionalidad si la tuviere, en relación con la práctica de notificaciones?"
  options:
  - id: a
    text:
      es: "El domicilio habitual del peticionario."
  - id: b
    text:
      es: "La dirección de correo electrónico del peticionario."
  - id: c
    correct: true
    text:
      es: "El lugar o el medio elegido para la práctica de notificaciones."
  - id: d
    text:
      es: "El consentimiento expreso para recibir notificaciones electrónicas."
  explanation:
    es: "El artículo 4.1 exige el lugar o el medio elegido para notificar. No impone el domicilio habitual, una dirección de correo electrónico ni un consentimiento expreso a notificaciones electrónicas."
  citation: "art. 4.1 LO 4/2001"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2001-21090-art-4
- id: m02-l02-q108
  prompt:
    es: "Según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, las peticiones incluirán necesariamente la identidad del solicitante, la nacionalidad si la tuviere, el lugar o medio de notificaciones y:"
  options:
  - id: a
    text:
      es: "El objeto y el fundamento jurídico de la petición."
  - id: b
    text:
      es: "El destinatario y la solicitud de audiencia especial."
  - id: c
    text:
      es: "El objeto y la documentación acreditativa de la identidad."
  - id: d
    correct: true
    text:
      es: "El objeto y el destinatario de la petición."
  explanation:
    es: "El artículo 4.1 cierra la lista con el objeto y el destinatario. El fundamento jurídico, la solicitud de audiencia especial y la documentación acreditativa de la identidad no son contenido necesario."
  citation: "art. 4.1 LO 4/2001"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2001-21090-art-8
- id: m02-l02-q110
  prompt:
    es: "Según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, no se admitirán las peticiones cuyo objeto sea:"
  options:
  - id: a
    text:
      es: "De interés exclusivo del peticionario."
  - id: b
    correct: true
    text:
      es: "Ajeno a las atribuciones del destinatario."
  - id: c
    text:
      es: "Dirigido a un organismo vinculado a una Administración."
  - id: d
    text:
      es: "Presentado por una persona jurídica."
  explanation:
    es: "El artículo 8 inadmite las peticiones de objeto ajeno a las atribuciones del destinatario. Que interesen solo al peticionario, que se dirijan a un organismo vinculado a una Administración (el artículo 2 lo admite) o que las presente una persona jurídica (el artículo 1.1 lo admite) no las hace inadmisibles."
  citation: "art. 8 LO 4/2001"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2001-21090-art-8
- id: m02-l02-q111
  prompt:
    es: "Sobre el objeto de una petición ya existe un procedimiento administrativo iniciado. ¿Hasta cuándo no se admitirá esa petición por esa causa?"
  options:
  - id: a
    text:
      es: "En tanto no transcurra el plazo de tres meses desde su presentación."
  - id: b
    text:
      es: "En tanto no se notifique la resolución al peticionario."
  - id: c
    correct: true
    text:
      es: "En tanto no haya recaído acuerdo o resolución firme."
  - id: d
    text:
      es: "En tanto no se archive la petición por desistimiento."
  explanation:
    es: "El artículo 8 no admite la petición mientras sobre su objeto no haya recaído acuerdo o resolución firme. El plazo de tres meses es el de contestación del artículo 11.1, la notificación al peticionario no pone fin al procedimiento ajeno y el desistimiento es una consecuencia de la falta de subsanación."
  citation: "art. 8 LO 4/2001"
  difficulty: 3
  tags:
  - "excepción"
  - "plazo"
# anchor: boe-a-2001-21090-art-9
- id: m02-l02-q112
  prompt:
    es: "Según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, la declaración de inadmisibilidad de una petición deberá acordarse y notificarse al peticionario:"
  options:
  - id: a
    text:
      es: "En los diez días siguientes a su recepción."
  - id: b
    correct: true
    text:
      es: "En los cuarenta y cinco días hábiles siguientes al de presentación del escrito."
  - id: c
    text:
      es: "En los quince días siguientes al de presentación del escrito."
  - id: d
    text:
      es: "En el plazo máximo de tres meses desde su presentación."
  explanation:
    es: "El artículo 9.1 fija cuarenta y cinco días hábiles desde la presentación. Diez días es el plazo para acusar recibo, quince el de subsanación y tres meses el de contestación de la petición admitida."
  citation: "art. 9.1 LO 4/2001"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2001-21090-art-9
- id: m02-l02-q113
  prompt:
    es: "En materia de derecho de petición, ¿qué exige el ordenamiento sobre la motivación de la declaración de inadmisibilidad de una petición presentada ante una Administración?"
  options:
  - id: a
    correct: true
    text:
      es: "Debe ser siempre motivada."
  - id: b
    text:
      es: "Puede omitir la motivación si el órgano es incompetente."
  - id: c
    text:
      es: "Debe motivarse solo cuando lo pida el peticionario."
  - id: d
    text:
      es: "Solo exige motivación si la petición es colectiva."
  explanation:
    es: "El artículo 9.1 dice que la declaración será siempre motivada. No hay excepción por incompetencia del órgano, no depende de que lo pida el peticionario y no se limita a las peticiones colectivas."
  citation: "art. 9.1 LO 4/2001"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2001-21090-art-9
- id: m02-l02-q114
  prompt:
    es: "A los cuarenta y seis días hábiles de presentada una petición, el órgano le notifica al peticionario que la inadmite. ¿Qué efecto produce esa notificación?"
  options:
  - id: a
    text:
      es: "Es válida, porque el plazo para inadmitir una petición es de tres meses desde su presentación."
  - id: b
    text:
      es: "Es válida, porque el plazo se suspende al notificar al peticionario."
  - id: c
    text:
      es: "Es nula, y la petición debe archivarse por desistimiento."
  - id: d
    correct: true
    text:
      es: "Llega fuera de plazo, por lo que la petición se entiende admitida a trámite."
  explanation:
    es: "El plazo del artículo 9.1 es de cuarenta y cinco días hábiles; pasado, el artículo 9.2 entiende admitida la petición. Los tres meses son el plazo para contestar una petición admitida, el plazo no se suspende al notificar y el desistimiento solo procede si no se subsanan los defectos de forma."
  citation: "art. 9.2 LO 4/2001"
  difficulty: 3
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2001-21090-art-1
- id: m02-l02-q118
  prompt:
    es: "Una asociación extranjera sin domicilio en España presenta una petición ante un Ministerio. Según la Ley Orgánica 4/2001, de 12 de noviembre, reguladora del Derecho de Petición, ¿puede ejercer el derecho de petición?"
  options:
  - id: a
    text:
      es: "No, porque solo los españoles tienen el derecho de petición."
  - id: b
    text:
      es: "No, porque las personas jurídicas solo pueden ejercerlo a través de sus socios."
  - id: c
    text:
      es: "Sí, pero solo si tiene domicilio en España."
  - id: d
    correct: true
    text:
      es: "Sí, porque pueden ejercerlo todas las personas naturales o jurídicas, prescindiendo de su nacionalidad."
  explanation:
    es: "El artículo 1.1 reconoce el derecho a toda persona natural o jurídica, prescindiendo de su nacionalidad. El artículo 29.1 de la Constitución habla de los españoles, pero la ley orgánica lo amplía; las personas jurídicas no necesitan actuar a través de sus socios y no se exige domicilio en España."
  citation: "art. 1.1 LO 4/2001"
  difficulty: 2
  tags:
  - "concepto"
