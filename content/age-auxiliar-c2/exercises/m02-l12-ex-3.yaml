# anchor: fuente-ms-win-ping-html
- id: m02-l12-q064
  prompt:
    es: "¿Cuál de los siguientes efectos tiene, en Windows 11, el parámetro /a del comando ping sobre la dirección IP de destino?"
  options:
  - id: a
    correct: true
    text:
      es: "Resuelve la dirección a su nombre de host y lo muestra, si la operación tiene éxito"
  - id: b
    text:
      es: "Registra la ruta tomada por la solicitud y su respuesta"
  - id: c
    text:
      es: "Resuelve el nombre del equipo de destino a su dirección IP"
  - id: d
    text:
      es: "Sigue enviando solicitudes hasta que se interrumpa el comando"
  explanation:
    es: "Con /a, ping realiza la resolución inversa de nombres en la dirección IP de destino y muestra el nombre de host si se completa con éxito. La resolución que hace /a es inversa: de dirección IP a nombre, no de nombre a dirección. Seguir enviando solicitudes hasta que se interrumpa es el parámetro /t. Registrar la ruta de la solicitud y de la respuesta es lo que hace el parámetro /r."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 2
  tags:
  - "configuración"
  - "comportamiento"
# anchor: fuente-ms-win-ping-html
- id: m02-l12-q065
  prompt:
    es: "En Windows 11, ¿entre qué valores debe estar el recuento que se indica con el parámetro /r de ping para registrar la ruta?"
  options:
  - id: a
    text:
      es: "Mínimo 0 y máximo 9"
  - id: b
    text:
      es: "Mínimo 1 y máximo 255"
  - id: c
    correct: true
    text:
      es: "Mínimo 1 y máximo 9"
  - id: d
    text:
      es: "Mínimo 1 y máximo 4"
  explanation:
    es: "El recuento de /r, que registra la ruta tomada, debe ser un mínimo de 1 y un máximo de 9. Mínimo 1 y máximo 4 es el intervalo del recuento de /s, el de las marcas de tiempo. El recuento mínimo es 1, no 0. 255 es el TTL máximo, no el máximo del recuento de /r."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-ms-win-ping-html
- id: m02-l12-q066
  prompt:
    es: "En Windows 11, ¿entre qué valores debe estar el recuento que se indica con el parámetro /s de ping para registrar la hora de llegada de cada salto?"
  options:
  - id: a
    text:
      es: "Mínimo 1 y máximo 9"
  - id: b
    correct: true
    text:
      es: "Mínimo 1 y máximo 4"
  - id: c
    text:
      es: "Mínimo 1 y máximo 32"
  - id: d
    text:
      es: "Mínimo 4 y máximo 9"
  explanation:
    es: "El recuento de /s, que usa la marca de tiempo de Internet, debe ser un mínimo de 1 y un máximo de 4. Mínimo 1 y máximo 9 es el intervalo del recuento de /r. 32 es la longitud predeterminada del campo de datos, no el máximo del recuento de /s. El mínimo del recuento es 1, no 4."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-ms-win-ping-html
- id: m02-l12-q067
  prompt:
    es: "¿Cuál de las siguientes exigencias impone, en Windows 11, la ruta de origen estricta que ping usa con el parámetro /k?"
  options:
  - id: a
    correct: true
    text:
      es: "Que el siguiente destino intermedio sea accesible directamente, como vecino en una interfaz del enrutador"
  - id: b
    text:
      es: "Que los destinos intermedios puedan estar separados por uno o varios enrutadores"
  - id: c
    text:
      es: "Que la lista de hosts tenga al menos nueve direcciones o nombres"
  - id: d
    text:
      es: "Que se registre la ruta tomada por la solicitud de eco y su respuesta"
  explanation:
    es: "Con la ruta de origen estricta, el siguiente destino intermedio debe ser accesible directamente, es decir, un vecino en una interfaz del enrutador. Que los destinos estén separados por uno o varios enrutadores es lo que permite la ruta de origen flexible (/j). Registrar la ruta es la función de /r. La lista de hosts admite como máximo nueve direcciones o nombres, no un mínimo de nueve."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 3
  tags:
  - "configuración"
  - "comportamiento"
# anchor: fuente-ms-win-ping-html
- id: m02-l12-q068
  prompt:
    es: "¿Cuál de las siguientes utilidades tiene, en Windows 11, el parámetro /f de ping, que envía las solicitudes con la marca No fragmentar establecida en 1?"
  options:
  - id: a
    text:
      es: "Para especificar el tipo de servicio (TOS) de los mensajes"
  - id: b
    correct: true
    text:
      es: "Para solucionar problemas de la unidad de transmisión máxima"
  - id: c
    text:
      es: "Para fijar el tiempo de vida (TTL) de los mensajes que se envían"
  - id: d
    text:
      es: "Para registrar la hora de llegada de cada salto de la ruta"
  explanation:
    es: "El parámetro /f, solo disponible en IPv4, impide que los enrutadores fragmenten la solicitud y es útil para solucionar problemas de PMTU. Registrar la hora de llegada de cada salto es lo que hace /s. El TTL se fija con otro parámetro, que especifica el campo Período de vida del encabezado IP. El tipo de servicio se especifica con /v."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-ping-html
- id: m02-l12-q069
  prompt:
    es: "En Windows 11, ¿cuál es el valor predeterminado del campo Tipo de servicio (TOS) que se fija con el parámetro /v de ping?"
  options:
  - id: a
    text:
      es: "4, y se especifica como un valor decimal de 1 a 9"
  - id: b
    text:
      es: "32, y se especifica como un valor decimal de 0 a 255"
  - id: c
    correct: true
    text:
      es: "0, y se especifica como un valor decimal de 0 a 255"
  - id: d
    text:
      es: "255, y se especifica como un valor decimal de 0 a 255"
  explanation:
    es: "El valor predeterminado de TOS es 0, y se especifica como un valor decimal de 0 a 255. 32 es la longitud predeterminada del campo de datos, no el valor predeterminado de TOS. 4 es el número de solicitudes por defecto y el intervalo de 1 a 9 es el del recuento de /r. 255 es el máximo del intervalo, no el valor predeterminado, que es 0."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 3
  tags:
  - "cantidad"
  - "configuración"
# anchor: fuente-ms-win-ping-html
- id: m02-l12-q070
  prompt:
    es: "¿Cuál de los siguientes pares de parámetros de ping de Windows 11 están disponibles solo para IPv6, según la documentación?"
  options:
  - id: a
    correct: true
    text:
      es: "/R y /S, el seguimiento de la ruta y la dirección de origen"
  - id: b
    text:
      es: "/n y /l, el número de solicitudes y la longitud de los datos"
  - id: c
    text:
      es: "/r y /j, el registro de ruta y la ruta de origen flexible"
  - id: d
    text:
      es: "/f y /v, la marca No fragmentar y el tipo de servicio"
  explanation:
    es: "Los parámetros /R (seguimiento de la ruta de ida y vuelta) y /S (dirección de origen) están disponibles solo para IPv6. /f y /v están disponibles solo para IPv4. /r y /j están disponibles solo para IPv4. /n y /l son parámetros generales de número y tamaño de las solicitudes, sin esa restricción a IPv6."
  citation: "fuente: `ms-win-ping.html`; «/R — Especifica que se realiza un seguimiento de la ruta de acceso de ida y vuelta (disponible solo en IPv6).»"
  difficulty: 3
  tags:
  - "configuración"
