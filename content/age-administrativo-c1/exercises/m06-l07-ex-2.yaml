# anchor: fuente-ms-outlook-compartir-carpeta-html
- id: m06-l07-q049
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de los siguientes niveles de permisos permite crear subcarpetas en la carpeta compartida?"
  options:
  - id: a
    correct: true
    text:
      es: "Editor de publicación"
  - id: b
    text:
      es: "Autor"
  - id: c
    text:
      es: "Editor"
  - id: d
    text:
      es: "Autor no editor"
  explanation:
    es: "Según la tabla, Editor de publicación crea, lee, modifica y elimina todos los elementos y, además, crea subcarpetas. Editor tiene las mismas actividades sobre los elementos, pero no crea subcarpetas. Autor y Autor no editor crean y leen elementos y gestionan los suyos, sin subcarpetas."
  citation: "fuente: `ms-outlook-compartir-carpeta.html`; «Comprender los permisos de uso compartido»"
  difficulty: 2
  tags:
