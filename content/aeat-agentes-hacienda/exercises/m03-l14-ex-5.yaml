# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0061
  prompt:
    es: "Sobre los efectos del vencimiento del plazo en los procedimientos especiales de revisión de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    correct: true
    text:
      es: "En la revocación el vencimiento sin resolución produce caducidad, y en la rectificación iniciada a instancia del interesado produce desestimación por silencio."
  - id: b
    text:
      es: "En la revocación el vencimiento sin resolución produce desestimación por silencio, y en la rectificación iniciada a instancia produce caducidad."
  - id: c
    text:
      es: "En la nulidad iniciada de oficio el vencimiento produce desestimación por silencio, y en la lesividad produce estimación presunta."
  - id: d
    text:
      es: "En la revocación y en la rectificación el vencimiento sin resolución produce siempre la estimación por silencio de lo solicitado."
  explanation:
    es: "El artículo 219.4 prevé caducidad en la revocación, que siempre se inicia de oficio, y el artículo 220.2 prevé desestimación por silencio cuando la rectificación se inició a instancia del interesado. En ninguno de los procedimientos opera el silencio estimatorio. La nulidad iniciada de oficio caduca (art. 217.6) y la lesividad también caduca (art. 218.3)."
  citation: "art. 217.6 LGT"
  difficulty: 3
  tags:
  - "plazos"
  - "efectos"
# anchor: boe-a-2003-23186-art-223
- id: m03-l14-q0069
  prompt:
    es: "De acuerdo con el artículo 223.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo para interponer el recurso de reposición es de:"
  options:
  - id: a
    correct: true
    text:
      es: "Un mes contado a partir del día siguiente al de la notificación del acto recurrible."
  - id: b
    text:
      es: "Dos meses contados desde el día siguiente al de la notificación del acto."
  - id: c
    text:
      es: "Tres meses contados desde el día siguiente al de la notificación del acto."
  - id: d
    text:
      es: "Quince días hábiles contados desde el día siguiente al de la notificación del acto."
  explanation:
    es: "La reposición se interpone en un mes desde el día siguiente al de la notificación (art. 223.1). Los quince días hábiles y los dos o tres meses no son plazos de este recurso; dos meses es el de la vía contencioso-administrativa."
  citation: "art. 223.1 LGT"
  difficulty: 1
  tags:
  - "reposición"
  - "plazo"
# anchor: boe-a-2003-23186-art-223
- id: m03-l14-q0070
  prompt:
    es: "Según el artículo 223.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, además de desde el día siguiente a la notificación, ¿desde cuándo puede contarse el plazo de un mes para interponer el recurso de reposición?"
  options:
  - id: a
    correct: true
    text:
      es: "Desde el día siguiente a aquel en que se produzcan los efectos del silencio administrativo."
  - id: b
    text:
      es: "Desde el día siguiente a aquel en que el acto adquiera firmeza."
  - id: c
    text:
      es: "Desde el día en que el interesado tenga conocimiento extraoficial del acto por cualquier medio."
  - id: d
    text:
      es: "Desde el día siguiente al de finalización del período ejecutivo de pago."
  explanation:
    es: "El plazo se cuenta también desde el día siguiente a aquel en que se producen los efectos del silencio administrativo (art. 223.1). La firmeza es posterior a la reposición, el conocimiento extraoficial no cuenta y el período ejecutivo no es el hito de las deudas periódicas."
  citation: "art. 223.1 LGT"
  difficulty: 2
  tags:
  - "reposición"
  - "silencio"
# anchor: boe-a-2003-23186-art-223
- id: m03-l14-q0071
  prompt:
    es: "Conforme al artículo 223.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, tratándose de deudas de vencimiento periódico y notificación colectiva, el plazo para interponer el recurso de reposición se computa a partir del día siguiente al de finalización:"
  options:
  - id: a
    correct: true
    text:
      es: "Del período voluntario de pago."
  - id: b
    text:
      es: "Del plazo de presentación de la autoliquidación."
  - id: c
    text:
      es: "Del plazo de exposición pública del padrón."
  - id: d
    text:
      es: "Del período ejecutivo de pago."
  explanation:
    es: "Para deudas de vencimiento periódico y notificación colectiva el plazo arranca al terminar el período voluntario de pago (art. 223.1). El período ejecutivo es posterior y los otros dos hitos no figuran en el precepto."
  citation: "art. 223.1 LGT"
  difficulty: 2
  tags:
  - "reposición"
  - "deudas periódicas"
# anchor: boe-a-2003-23186-art-223
- id: m03-l14-q0072
  prompt:
    es: "A Daniel Ortiz Vera se le notifica el martes 31 de marzo de 2026 una liquidación. El plazo en meses se cuenta según el artículo 30.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, sin festivos distintos de los que constan. Conforme al artículo 223.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuándo termina el plazo para interponer el recurso de reposición?"
  options:
  - id: a
    correct: true
    text:
      es: "El jueves 30 de abril de 2026."
  - id: b
    text:
      es: "El viernes 1 de mayo de 2026."
  - id: c
    text:
      es: "El miércoles 29 de abril de 2026."
  - id: d
    text:
      es: "El domingo 3 de mayo de 2026."
  explanation:
    es: "El plazo es de un mes desde el día siguiente a la notificación y termina el mismo día del mes de vencimiento. Abril no tiene día 31, de modo que expira el último día del mes, el jueves 30 de abril de 2026 (art. 30.4 LPAC). El 30 es hábil, así que no hay prórroga. El 29 se queda corto, y el 1 y el 3 de mayo son posteriores al vencimiento."
  citation: "art. 223.1 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "reposición"
# anchor: boe-a-2003-23186-art-223
- id: m03-l14-q0073
  prompt:
    es: "A una sociedad se le notifica el viernes 28 de noviembre de 2025 una liquidación provisional. El plazo en meses se cuenta según los apartados 4 y 5 del artículo 30 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, sin otros festivos que los fines de semana. Según el artículo 223.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo para interponer el recurso de reposición termina el:"
  options:
  - id: a
    correct: true
    text:
      es: "Lunes 29 de diciembre de 2025."
  - id: b
    text:
      es: "Domingo 28 de diciembre de 2025."
  - id: c
    text:
      es: "Miércoles 31 de diciembre de 2025."
  - id: d
    text:
      es: "Viernes 26 de diciembre de 2025."
  explanation:
    es: "El mes empieza a contar el 29 de noviembre y termina el 28 de diciembre de 2025, que es domingo. Al ser inhábil, el plazo se prorroga al primer día hábil siguiente, el lunes 29 de diciembre (art. 30.5 LPAC). El domingo es el vencimiento teórico, no el real. El 26 y el 31 no corresponden a ninguno de los dos cómputos."
  citation: "art. 223.1 LGT"
  difficulty: 3
  tags:
  - "supuesto"
  - "cómputo"
  - "reposición"
# anchor: boe-a-2003-23186-art-223
- id: m03-l14-q0074
  prompt:
    es: "Según el artículo 223.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si el recurrente precisa del expediente para formular sus alegaciones, debe comparecer para que se le ponga de manifiesto:"
  options:
  - id: a
    text:
      es: "Una vez admitido a trámite el recurso por el órgano competente."
  - id: b
    correct: true
    text:
      es: "Durante el plazo de interposición del recurso."
  - id: c
    text:
      es: "En cualquier momento anterior a la resolución del recurso."
  - id: d
    text:
      es: "Dentro de los diez días siguientes a la interposición del recurso."
  explanation:
    es: "El recurrente debe comparecer durante el plazo de interposición (art. 223.2). Los diez días tras la interposición, la admisión a trámite y la libertad de momento no son lo que dice el precepto."
  citation: "art. 223.2 LGT"
  difficulty: 2
  tags:
  - "reposición"
  - "expediente"
# anchor: boe-a-2003-23186-art-223
- id: m03-l14-q0075
  prompt:
    es: "Respecto a lo que la reposición somete a conocimiento del órgano competente, conforme al artículo 223.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Solo las cuestiones planteadas en el recurso, sin que el órgano pueda examinar otras en ningún caso."
  - id: b
    text:
      es: "Solo las cuestiones de derecho que ofrezca el expediente, hayan sido o no planteadas, quedando fuera las de hecho, y sin que pueda empeorarse la situación inicial del recurrente."
  - id: c
    correct: true
    text:
      es: "Todas las cuestiones de hecho o de derecho que ofrezca el expediente, hayan sido o no planteadas en el recurso, sin que pueda empeorarse la situación inicial del recurrente."
  - id: d
    text:
      es: "Todas las cuestiones del expediente, y el órgano puede empeorar la situación inicial del recurrente si procede."
  explanation:
    es: "El órgano que resuelve la reposición conoce de todo lo que ofrezca el expediente, esté o no planteado, pero no puede empeorar la situación inicial del recurrente (art. 223.4). Limitarlo a lo planteado, permitir empeorar o excluir las cuestiones de hecho contradice el precepto."
  citation: "art. 223.4 LGT"
  difficulty: 2
  tags:
  - "reposición"
  - "alcance"
# anchor: boe-a-2003-23186-art-223
- id: m03-l14-q0076
  prompt:
    es: "De acuerdo con el artículo 223.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si el órgano competente estima pertinente examinar y resolver cuestiones no planteadas por los interesados, debe:"
  options:
  - id: a
    correct: true
    text:
      es: "Exponerlas a los interesados para que puedan formular alegaciones."
  - id: b
    text:
      es: "Resolverlas directamente, sin trámite adicional, al ser de oficio."
  - id: c
    text:
      es: "Remitirlas al tribunal económico-administrativo para su dictamen."
  - id: d
    text:
      es: "Archivarlas, porque no pueden examinarse cuestiones no planteadas."
  explanation:
    es: "El artículo 223.4 obliga a exponer las cuestiones nuevas a los interesados para que aleguen. Resolverlas sin trámite quita ese derecho. Y el órgano sí puede examinarlas, y no hace falta dictamen del tribunal."
  citation: "art. 223.4 LGT"
  difficulty: 2
  tags:
  - "reposición"
  - "alegaciones"
# anchor: boe-a-2003-23186-art-224
- id: m03-l14-q0077
  prompt:
    es: "Según el artículo 224.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la ejecución del acto impugnado en reposición queda suspendida automáticamente a instancia del interesado si se garantiza el importe de dicho acto, los intereses de demora que genere la suspensión y:"
  options:
  - id: a
    text:
      es: "Las costas del procedimiento económico-administrativo posterior."
  - id: b
    text:
      es: "Los gastos de tramitación del recurso ante el órgano competente."
  - id: c
    correct: true
    text:
      es: "Los recargos que procederían en caso de ejecución de la garantía."
  - id: d
    text:
      es: "El interés legal del dinero devengado desde la notificación del acto."
  explanation:
    es: "La garantía debe cubrir el importe del acto, los intereses de demora de la suspensión y los recargos que procederían si se ejecutase la garantía (art. 224.1). No cubre gastos de tramitación, costas ni el interés legal desde la notificación."
  citation: "art. 224.1 LGT"
  difficulty: 2
  tags:
  - "reposición"
  - "suspensión"
# anchor: boe-a-2005-8662-art-25
- id: m03-l14-q0079
  prompt:
    es: "Según el artículo 25.1 del Real Decreto 520/2005, de 13 de mayo, por el que se aprueba el Reglamento general de desarrollo de la Ley 58/2003, de 17 de diciembre, General Tributaria, en materia de revisión en vía administrativa, ¿qué efecto tiene por sí sola la mera interposición del recurso de reposición sobre la ejecución del acto impugnado?"
  options:
  - id: a
    correct: true
    text:
      es: "Ninguno: no suspende la ejecución del acto impugnado."
  - id: b
    text:
      es: "Suspende la ejecución durante el plazo de un mes de resolución del recurso."
  - id: c
    text:
      es: "Suspende la ejecución si el acto impugnado es una sanción de cuantía elevada."
  - id: d
    text:
      es: "Suspende la ejecución solo en el período voluntario de pago."
  explanation:
    es: "La mera interposición no suspende la ejecución (art. 25.1 RGRVA). Hay que solicitar la suspensión y aportar garantía o encajar en un supuesto sin garantía. Las sanciones se suspenden por otra regla (art. 212.3 y 224.1), no por su cuantía."
  citation: "art. 25.1 RGRVA"
  difficulty: 2
  tags:
  - "reposición"
  - "suspensión"
# anchor: boe-a-2003-23186-art-224
- id: m03-l14-q0080
  prompt:
    es: "En relación con las garantías necesarias para obtener la suspensión automática del acto recurrido en reposición, conforme al artículo 224.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "La prenda sobre bienes muebles del recurrente de valor suficiente."
  - id: b
    correct: true
    text:
      es: "El aval o fianza de carácter solidario de entidad de crédito o sociedad de garantía recíproca, o el certificado de seguro de caución."
  - id: c
    text:
      es: "La fianza personal del propio recurrente, sin necesidad de otro contribuyente."
  - id: d
    text:
      es: "La hipoteca inmobiliaria o la prenda sobre bienes del propio recurrente cuando su valor cubra el importe del acto, los intereses y los recargos."
  explanation:
    es: "El aval o fianza solidaria de entidad de crédito o sociedad de garantía recíproca, o el seguro de caución, es una de las tres garantías del artículo 224.2. Las otras son el depósito de dinero o valores públicos y la fianza personal y solidaria de otros contribuyentes de reconocida solvencia. Hipoteca y prenda no están en la lista y la fianza debe ser de otros contribuyentes."
  citation: "art. 224.2 LGT"
  difficulty: 3
  tags:
  - "reposición"
  - "garantías"
# anchor: boe-a-2003-23186-art-224
- id: m03-l14-q0081
  prompt:
    es: "De acuerdo con el artículo 224.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, una de las garantías necesarias para obtener la suspensión automática es el depósito de:"
  options:
  - id: a
    correct: true
    text:
      es: "Dinero o valores públicos."
  - id: b
    text:
      es: "Mercancías o bienes inmuebles del recurrente."
  - id: c
    text:
      es: "Joyas u obras de arte de valor suficiente."
  - id: d
    text:
      es: "Dinero o acciones de sociedades cotizadas."
  explanation:
    es: "La primera garantía es el depósito de dinero o valores públicos. Las acciones cotizadas, las joyas, las obras de arte, las mercancías y los inmuebles no figuran en la lista exclusiva del artículo 224.2."
  citation: "art. 224.2 LGT"
  difficulty: 1
  tags:
  - "reposición"
  - "garantías"
# anchor: boe-a-2003-23186-art-224
- id: m03-l14-q0082
  prompt:
    es: "Conforme al artículo 224.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, puede suspenderse la ejecución del acto recurrido en reposición sin necesidad de aportar garantía cuando se aprecie que al dictarlo se ha podido incurrir en error:"
  options:
  - id: a
    text:
      es: "Material, de calificación o de procedimiento."
  - id: b
    text:
      es: "Aritmético, formal o de competencia."
  - id: c
    correct: true
    text:
      es: "Aritmético, material o de hecho."
  - id: d
    text:
      es: "De derecho, de interpretación o de hecho."
  explanation:
    es: "El artículo 224.3 cita el error aritmético, material o de hecho. Los errores de derecho, de interpretación, de calificación, de procedimiento o de competencia no permiten suspender sin garantía."
  citation: "art. 224.3 LGT"
  difficulty: 2
  tags:
  - "reposición"
  - "suspensión"
# anchor: boe-a-2003-23186-art-224
- id: m03-l14-q0083
  prompt:
    es: "Una liquidación a nombre de Paula Gil Marín asciende a 20.000 euros. Paula interpone recurso de reposición solo contra 8.000 euros y obtiene la suspensión. Conforme al artículo 224.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué cantidad queda obligada a ingresar?"
  options:
  - id: a
    text:
      es: "Nada, porque la suspensión alcanza a toda la deuda tributaria."
  - id: b
    correct: true
    text:
      es: "12.000 euros, porque la suspensión se refiere solo a la parte recurrida."
  - id: c
    text:
      es: "8.000 euros, porque debe ingresar la parte recurrida."
  - id: d
    text:
      es: "20.000 euros, porque la suspensión parcial no existe en el recurso de reposición."
  explanation:
    es: "Si el recurso no afecta a toda la deuda, la suspensión se refiere a la parte recurrida y el recurrente debe ingresar el resto: 20.000 menos 8.000, es decir, 12.000 euros (art. 224.4). Los 8.000 son la parte suspendida, no la que debe pagar. La suspensión parcial sí existe, y no cubre toda la deuda."
  citation: "art. 224.4 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "suspensión"
  - "parcial"
