- id: m09-l05-qa01
  prompt:
    en: According to Microsoft in Understand data models, which statement about key-value data stores does the article
      make?
  options:
  - id: a
    text:
      en: A value can be partly modified without overwriting the entire value
  - id: b
    text:
      en: Reading or writing a single value is usually not atomic
  - id: c
    text:
      en: Rich value-based queries are a main strength of the model
  - id: d
    correct: true
    text:
      en: Most support only simple query, insert and delete operations
  explanation:
    en: Microsoft writes that most key-value stores only support simple query, insert and delete operations. It
      writes that to modify a value partially or completely an application must overwrite the existing data for
      the entire value, which contradicts a partial modification. It writes that in most implementations reading
      or writing a single value is an atomic operation, which contradicts it usually not being atomic. It lists
      limited query expressiveness as a consideration, which contradicts rich value-based queries as a main strength.
  citation: azure-data-store-models#key-value-data-stores-
- id: m09-l05-qa02
  prompt:
    en: According to Microsoft in Understand data models, which statement about column-family data stores does the
      article make?
  options:
  - id: a
    correct: true
    text:
      en: Dynamic columns are organized into column families to support co-access
  - id: b
    text:
      en: Column orientation speeds up point lookups, not scans over selected column sets
  - id: c
    text:
      en: A column-family store needs no up-front row key or column family design
  - id: d
    text:
      en: A column-family store is a poor fit for high write throughput
  explanation:
    en: Microsoft writes that a column-family database organizes dynamic columns into column families to support
      co-access. It writes that column orientation improves scans over selected column sets, which contradicts a
      gain for point lookups only. It lists up-front row key and column family design as a consideration, which
      contradicts needing no such design. It lists high write throughput as a strength, which contradicts a poor
      fit for it.
