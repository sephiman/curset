  prompt:
    es: "Conforme al artículo 2.2.a) de la Ley 58/2003, de 17 de diciembre, General Tributaria, el hecho imponible de las tasas puede consistir en:"
  options:
  - id: a
    correct: true
    text:
      es: "la utilización privativa o el aprovechamiento especial del dominio público."
  - id: b
    text:
