# anchor: fuente-ms-win-calculadora-html
- id: m06-l03-q372
  prompt:
    es: "En la Calculadora de Windows 11, las tasas de cambio del convertidor de moneda se actualizan:"
  options:
  - id: a
    text:
      es: "manualmente, cada vez que el usuario introduce los valores de cambio"
  - id: b
    correct: true
    text:
      es: "automáticamente, cuando el equipo está conectado a Internet"
  - id: c
    text:
      es: "solo al instalar una actualización de Windows"
  - id: d
    text:
      es: "nunca: son fijas para cada moneda"
  explanation:
    es: "La página dice que las tasas de cambio se actualizan automáticamente cuando se está conectado a Internet. Introducirlas a mano, actualizarlas solo con Windows Update o mantenerlas fijas contradice esa frase."
  citation: "fuente: `ms-win-calculadora.html`; «Convertir valores»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-calculadora-html
- id: m06-l03-q373
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes combinaciones de teclas mantiene la Calculadora encima de las demás aplicaciones, en el modo Standard?"
  options:
  - id: a
    correct: true
    text:
      es: "Alt+Flecha arriba"
  - id: b
    text:
      es: "Alt+Flecha abajo"
  - id: c
    text:
      es: "Alt+Tab"
  - id: d
    text:
      es: "Ctrl+Flecha arriba"
  explanation:
    es: "La página dice que, en el modo Standard, se selecciona Mantener en la parte superior o se presiona Alt+Flecha arriba. Alt+Flecha abajo la desactiva, Alt+Tab cambia entre ventanas abiertas y Ctrl+Flecha arriba mueve el cursor al principio del párrafo anterior."
  citation: "fuente: `ms-win-calculadora.html`; «Mantener la Calculadora en la parte superior»"
  difficulty: 1
  tags:
  - "atajo"
