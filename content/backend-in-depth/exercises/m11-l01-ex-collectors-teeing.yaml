- id: m11-l01-v-collectors-teeing-001
  prompt:
    en: |-
      What does this program print? The stream is sequential and ordered, and an `Optional` prints as `Optional[value]`.

      ```java
      import java.util.Comparator;
      import java.util.List;
      import java.util.stream.Collectors;

      public class Main {
          public static void main(String[] args) {
              List<String> words = List.of("fig", "apple", "kiwi", "plum", "fig");
              String result = words.stream().collect(
                      Collectors.teeing(Collectors.counting(), Collectors.averagingInt(String::length), (x, y) -> x + " | " + y));
              System.out.println(result);
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`5 | 3.8`'
    correct: true
  - id: b
    text:
      en: '`3.8 | 5`'
  - id: c
    text:
      en: '`5`'
  - id: d
    text:
      en: '`3.8`'
  explanation:
    en: '`teeing` sends every word to both collectors, `Collectors.counting()` and `Collectors.averagingInt(String::length)`.
      The merge function then writes the first result, a bar between spaces, and the second result. The program prints `5
      | 3.8`. `3.8 | 5` comes from this mistake: merging the two results in the wrong order. `5` comes from this mistake:
      using only the first collector''s result. `3.8` comes from this mistake: using only the second collector''s result.'
  family: collectors-teeing
  code_reading: true
  citation: javadoc-collectors#teeing(java.util.stream.Collector,java.util.stream.Collector,java.util.function.BiFunction)
  difficulty: 3
  tags: &id001
  - streams
  - collectors
