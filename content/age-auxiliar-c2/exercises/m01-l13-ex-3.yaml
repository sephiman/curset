# anchor: boe-a-2015-11719-art-85
- id: m01-l13-q211
  prompt:
    es: "Señale cuál de las siguientes situaciones administrativas NO figura en la enumeración del artículo 85.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    text:
      es: "La situación de servicio en otras Administraciones Públicas."
  - id: b
    correct: true
    text:
      es: "La situación de expectativa de destino."
  - id: c
    text:
      es: "La situación de suspensión de funciones."
  - id: d
    text:
      es: "La situación de servicios especiales."
  explanation:
    es: "El artículo 85.1 enumera cinco situaciones: servicio activo, servicios especiales, servicio en otras Administraciones Públicas, excedencia y suspensión de funciones. La expectativa de destino no está en esa lista: la regula el Real Decreto 365/1995 para los afectados por una reasignación de efectivos. El servicio en otras Administraciones Públicas, la suspensión de funciones y los servicios especiales sí figuran en el artículo 85.1."
  citation: "art. 85.1 TREBEP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2015-11719-art-85
- id: m01-l13-q212
  prompt:
    es: "De acuerdo con el artículo 85.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, las leyes de Función Pública que se dicten en desarrollo del Estatuto:"
  options:
  - id: a
    text:
      es: "Podrán suprimir alguna de las situaciones administrativas que enumera el Estatuto."
  - id: b
    text:
      es: "Podrán regular otras situaciones administrativas, pero solo para el personal laboral."
  - id: c
    correct: true
    text:
      es: "Podrán regular otras situaciones administrativas de los funcionarios de carrera."
  - id: d
    text:
      es: "Deberán limitarse a desarrollar las cinco situaciones administrativas del Estatuto."
  explanation:
    es: "El artículo 85.2 dice que las leyes de Función Pública «podrán regular otras situaciones administrativas de los funcionarios de carrera». No les permite suprimir ninguna de las del apartado 1, y la habilitación se refiere a los funcionarios de carrera, no al personal laboral. Tampoco las limita a desarrollar las cinco existentes: el artículo les deja crear otras."
  citation: "art. 85.2 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-86
- id: m01-l13-q215
  prompt:
    es: "De acuerdo con el artículo 86.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, se hallan en servicio activo quienes presten servicios en su condición de funcionarios públicos:"
  options:
  - id: a
    correct: true
    text:
      es: "Cualquiera que sea la Administración u organismo en que estén destinados."
  - id: b
    text:
      es: "Solo si están destinados en la Administración a la que pertenece su cuerpo."
  - id: c
    text:
      es: "Solo si ocupan un puesto obtenido con carácter definitivo por concurso."
  - id: d
    text:
      es: "Cualquiera que sea su destino, aunque les corresponda quedar en otra situación."
  explanation:
    es: "El artículo 86.1 declara en servicio activo a quienes presten servicios como funcionarios «cualquiera que sea la Administración u organismo público o entidad en el que se encuentren destinados y no les corresponda quedar en otra situación». No exige que el destino sea en la Administración del propio cuerpo ni que el puesto se haya obtenido por concurso. La opción que admite el servicio activo aunque corresponda otra situación contradice la condición con que cierra el artículo."
  citation: "art. 86.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1995-8730-art-3
- id: m01-l13-q216
  prompt:
    es: "Según el artículo 3 del Real Decreto 365/1995, de 10 de marzo, ¿en qué situación se halla el funcionario que desempeña un puesto adscrito, en la relación de puestos de trabajo, a funcionarios del ámbito de la Ley 30/1984?"
  options:
  - id: a
    text:
      es: "En la situación de servicios especiales."
  - id: b
    text:
      es: "En la situación de servicio en otras Administraciones Públicas."
  - id: c
    correct: true
    text:
      es: "En la situación de servicio activo."
  - id: d
    text:
      es: "En la situación de expectativa de destino."
  explanation:
    es: "El artículo 3.a) del Real Decreto 365/1995 sitúa en servicio activo a quienes «desempeñen un puesto que, conforme a la correspondiente relación de puestos de trabajo, esté adscrito a los funcionarios comprendidos en el ámbito de aplicación de la Ley 30/1984». Los servicios especiales responden a los supuestos de un cargo o una misión, el servicio en otras Administraciones Públicas exige destino en otra Administración y la expectativa de destino afecta a quien queda sin puesto tras una reasignación de efectivos."
  citation: "art. 3.a) RD 365/1995"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1995-8730-art-3
- id: m01-l13-q217
  prompt:
    es: "Un funcionario de carrera de la Administración General del Estado pasa a desempeñar temporalmente otro puesto en comisión de servicios. ¿En qué situación administrativa se halla mientras dura la comisión?"
  options:
  - id: a
    text:
      es: "En la situación de servicios especiales."
  - id: b
    correct: true
    text:
      es: "En la situación de servicio activo."
  - id: c
    text:
      es: "En la situación de suspensión provisional de funciones."
  - id: d
    text:
      es: "En la situación de excedencia voluntaria por interés particular."
  explanation:
    es: "El artículo 3.c) del Real Decreto 365/1995 declara en servicio activo a los funcionarios «cuando se encuentren en comisión de servicios». La comisión no es un supuesto de servicios especiales, no priva de funciones como la suspensión y no supone dejar de prestar servicios, como la excedencia voluntaria por interés particular."
  citation: "art. 3.c) RD 365/1995"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1995-8730-art-3
- id: m01-l13-q218
  prompt:
    es: "De acuerdo con el artículo 3.i) del Real Decreto 365/1995, de 10 de marzo, se hallan en servicio activo los funcionarios que cesen en un puesto por haber obtenido otro mediante procedimientos de provisión:"
  options:
  - id: a
    correct: true
    text:
      es: "Durante el plazo posesorio que les corresponda."
  - id: b
    text:
      es: "Solo hasta que se publique la resolución del procedimiento."
  - id: c
    text:
      es: "Solo si el nuevo puesto está en la misma localidad."
  - id: d
    text:
      es: "Solo si toman posesión el mismo día del cese."
  explanation:
    es: "El artículo 3.i) declara en servicio activo a quienes «cesen en un puesto de trabajo por haber obtenido otro mediante procedimientos de provisión de puestos de trabajo, durante el plazo posesorio». La situación cubre todo el plazo posesorio: no termina con la publicación de la resolución, no depende de que el nuevo puesto esté en la misma localidad y no exige tomar posesión el mismo día del cese."
  citation: "art. 3.i) RD 365/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "concepto"
# anchor: boe-a-2015-11719-art-87
- id: m01-l13-q219
  prompt:
    es: "Según el artículo 87.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de las siguientes misiones autorizadas en la OCDE determina el pase del funcionario a servicios especiales?"
  options:
  - id: a
    text:
      es: "Una misión del 1 de septiembre al 31 de diciembre de 2027."
  - id: b
    text:
      es: "Una misión del 1 de marzo al 31 de julio de 2027."
  - id: c
    text:
      es: "Una misión del 1 de enero al 30 de junio de 2027."
  - id: d
    correct: true
    text:
      es: "Una misión del 1 de febrero al 30 de noviembre de 2027."
  explanation:
    es: "El artículo 87.1.b) exige una misión «por periodo determinado superior a seis meses» en organismos internacionales. Del 1 de febrero al 30 de noviembre de 2027 van diez meses. Del 1 de septiembre al 31 de diciembre van cuatro meses y del 1 de marzo al 31 de julio, cinco. Del 1 de enero al 30 de junio van seis meses exactos, que no son un periodo superior a seis meses."
  citation: "art. 87.1.b) TREBEP"
  difficulty: 3
  tags:
  - "requisito"
  - "cómputo"
# anchor: boe-a-2015-11719-art-87
- id: m01-l13-q220
  prompt:
    es: "Según el artículo 87.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de los siguientes funcionarios de carrera es declarado en situación de servicios especiales?"
  options:
  - id: a
    text:
      es: "El que pasa a desempeñar un puesto en comisión de servicios en otro ministerio."
  - id: b
    text:
      es: "El que obtiene por un procedimiento de provisión un puesto en otra Administración."
  - id: c
    text:
      es: "El que cesa en su puesto por obtener otro, durante el plazo posesorio."
  - id: d
    correct: true
    text:
      es: "El que es adscrito a los servicios del Tribunal Constitucional."
  explanation:
    es: "El artículo 87.1.d) declara en servicios especiales a quienes «sean adscritos a los servicios del Tribunal Constitucional o del Defensor del Pueblo». La comisión de servicios y el plazo posesorio tras obtener otro puesto son supuestos de servicio activo (artículo 3.c) e i) del Real Decreto 365/1995). Obtener por provisión un puesto en otra Administración lleva al servicio en otras Administraciones Públicas (artículo 88.1 TREBEP)."
  citation: "art. 87.1.d) TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-87
- id: m01-l13-q221
  prompt:
    es: "De acuerdo con el artículo 87.1.e) del texto refundido de la Ley del Estatuto Básico del Empleado Público, el funcionario que accede a la condición de miembro de una asamblea legislativa autonómica pasa a servicios especiales:"
  options:
  - id: a
    text:
      es: "En todo caso, perciba o no retribuciones por la realización de la función."
  - id: b
    text:
      es: "Solo si la asamblea le exige dedicación exclusiva durante todo el mandato."
  - id: c
    correct: true
    text:
      es: "Si percibe retribuciones periódicas por la realización de la función."
  - id: d
    text:
      es: "Solo si renuncia a percibir los trienios que tenga reconocidos."
  explanation:
    es: "El artículo 87.1.e) incluye a los miembros de las asambleas legislativas de las comunidades autónomas «si perciben retribuciones periódicas por la realización de la función». Sin esas retribuciones el supuesto no se da, así que no procede en todo caso. La dedicación exclusiva es la condición de los cargos electivos locales de la letra f), no de esta. Nada obliga a renunciar a los trienios: el artículo 87.2 los mantiene."
  citation: "art. 87.1.e) TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8730-art-8
- id: m01-l13-q233
  prompt:
    es: "¿Qué efecto del tiempo en servicios especiales recoge el artículo 8.2 del Real Decreto 365/1995, de 10 de marzo, y falta en la lista del artículo 87.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "El reconocimiento de los trienios del funcionario."
  - id: b
    text:
      es: "Los ascensos en la carrera del funcionario."
  - id: c
    text:
      es: "La promoción interna del funcionario de carrera a otro cuerpo."
  - id: d
    correct: true
    text:
      es: "La consolidación del grado personal del funcionario."
  explanation:
    es: "El artículo 8.2 del Real Decreto 365/1995 computa el tiempo «a efectos de ascensos, consolidación de grado personal, trienios y derechos pasivos» y del periodo mínimo para la excedencia por interés particular. El artículo 87.2 TREBEP lo computa a efectos de ascensos, trienios, promoción interna y Seguridad Social, sin mencionar el grado personal. Los trienios y los ascensos están en las dos listas. La promoción interna está en el TREBEP y no en el reglamento."
  citation: "art. 8.2 RD 365/1995"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-7
- id: m01-l13-q235
  prompt:
    es: "Según el artículo 7.1 del Real Decreto 365/1995, de 10 de marzo, al funcionario en servicios especiales procedente del servicio activo cuyo puesto anterior era de libre designación se le adjudica, al reingresar:"
  options:
  - id: a
    correct: true
    text:
      es: "Con carácter provisional, un puesto de igual nivel y similares retribuciones en el mismo municipio."
  - id: b
    text:
      es: "Con carácter definitivo, un puesto de igual nivel en el mismo Ministerio y en el mismo municipio."
  - id: c
    text:
      es: "Con carácter definitivo, el mismo puesto de libre designación que ocupaba antes de esa situación."
  - id: d
    text:
      es: "Con carácter provisional, un puesto de nivel inferior en cualquier municipio."
  explanation:
    es: "El artículo 7.1.a) dice que, si el puesto anterior se obtuvo por libre designación, «se les adjudicará, con carácter provisional, en tanto no obtengan otro con carácter definitivo, un puesto de igual nivel y similares retribuciones en el mismo municipio». La adjudicación definitiva en el mismo Ministerio y municipio es la de la letra b), para los demás casos. No se devuelve el mismo puesto de libre designación, y el nivel no es inferior ni el municipio cualquiera."
  citation: "art. 7.1 RD 365/1995"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-11719-art-88
- id: m01-l13-q239
  prompt:
    es: "De acuerdo con el artículo 88.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, se declara en servicio en otras Administraciones Públicas al funcionario de carrera que obtiene destino en una Administración distinta:"
  options:
  - id: a
    text:
      es: "Solo en virtud de los procesos de transferencias a las comunidades autónomas."
  - id: b
    text:
      es: "Mediante una comisión de servicios por un periodo superior a seis meses."
  - id: c
    text:
      es: "Por cualquier causa, incluida su designación como personal eventual."
  - id: d
    correct: true
    text:
      es: "En virtud de los procesos de transferencias o por los procedimientos de provisión de puestos."
  explanation:
    es: "El artículo 88.1 se refiere a quienes, «en virtud de los procesos de transferencias o por los procedimientos de provisión de puestos de trabajo, obtengan destino en una Administración Pública distinta». No se limita a las transferencias. La comisión de servicios es servicio activo (artículo 3.c) del Real Decreto 365/1995), y la designación como personal eventual lleva a servicios especiales si el funcionario no opta por seguir en activo (artículo 87.1.i) TREBEP)."
  citation: "art. 88.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-11719-art-89
- id: m01-l13-q240
  prompt:
    es: "Una funcionaria tomó posesión el viernes 2 de septiembre de 2022 y presta servicios sin interrupción desde entonces. ¿Desde cuándo cumple el periodo mínimo de servicios para obtener la excedencia voluntaria por interés particular?"
  options:
  - id: a
    text:
      es: "Desde el lunes 2 de septiembre de 2024."
  - id: b
    correct: true
    text:
      es: "Desde el jueves 2 de septiembre de 2027."
  - id: c
    text:
      es: "Desde el martes 2 de septiembre de 2025."
  - id: d
    text:
      es: "Desde el miércoles 2 de septiembre de 2026."
  explanation:
    es: "El artículo 89.2 exige haber prestado servicios efectivos «durante un periodo mínimo de cinco años inmediatamente anteriores». Desde el viernes 2 de septiembre de 2022, los cinco años se cumplen el jueves 2 de septiembre de 2027. El lunes 2 de septiembre de 2024 da dos años, el martes 2 de septiembre de 2025, tres, y el miércoles 2 de septiembre de 2026, cuatro."
  citation: "art. 89.2 TREBEP"
  difficulty: 1
  tags:
  - "cómputo"
  - "requisito"
# anchor: boe-a-2015-11719-art-89
- id: m01-l13-q241
  prompt:
    es: "Según el artículo 89.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de los siguientes periodos de servicios permite obtener la excedencia voluntaria por interés particular?"
  options:
  - id: a
    correct: true
    text:
      es: "Cinco años de servicios efectivos en cualquier Administración Pública, inmediatamente anteriores."
  - id: b
    text:
      es: "Cinco años de servicios efectivos en cualquier Administración Pública, aunque no sean inmediatamente anteriores."
  - id: c
    text:
      es: "Cinco años de servicios efectivos en el mismo cuerpo o escala, inmediatamente anteriores."
  - id: d
    text:
      es: "Cinco años de servicios en el sector público o en el privado, inmediatamente anteriores."
  explanation:
    es: "El artículo 89.2 pide servicios efectivos «en cualquiera de las Administraciones Públicas durante un periodo mínimo de cinco años inmediatamente anteriores». Los años que no son inmediatamente anteriores no sirven. El artículo no exige que sean en el mismo cuerpo o escala, y no cuenta el trabajo en el sector privado."
  citation: "art. 89.2 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8730-art-16
- id: m01-l13-q248
  prompt:
    es: "Una funcionaria acredita siete años de servicios en las Administraciones Públicas. Según el artículo 16.3 del Real Decreto 365/1995, de 10 de marzo, ¿cuál es la duración máxima de cada periodo de excedencia voluntaria por interés particular que puede obtener?"
  options:
  - id: a
    text:
      es: "Quince años, el máximo absoluto que fija el reglamento."
  - id: b
    text:
      es: "Dos años, la duración mínima de cada periodo de excedencia."
  - id: c
    text:
      es: "Cinco años, los del periodo mínimo de servicios exigido."
  - id: d
    correct: true
    text:
      es: "Siete años, los mismos que los servicios que acredita."
  explanation:
    es: "El artículo 16.3 fija cada periodo en no menos de dos años continuados «ni superior a un número de años equivalente a los que el funcionario acredite haber prestado en cualquiera de las Administraciones Públicas, con un máximo de quince». Con siete años acreditados el máximo es siete. Los quince años solo operan como tope para quien acredita más. Dos años es el mínimo, no el máximo, y cinco años es el periodo de servicios para pedirla."
  citation: "art. 16.3 RD 365/1995"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-1995-8730-art-16
- id: m01-l13-q250
  prompt:
    es: "Según el artículo 16.4 del Real Decreto 365/1995, de 10 de marzo, la falta de petición de reingreso dentro del plazo máximo fijado en la resolución de excedencia voluntaria por interés particular comporta:"
  options:
  - id: a
    correct: true
    text:
      es: "La pérdida de la condición de funcionario."
  - id: b
    text:
      es: "La declaración de oficio en excedencia forzosa."
  - id: c
    text:
      es: "La prórroga automática de la excedencia por dos años."
  - id: d
    text:
      es: "El pase de oficio a la expectativa de destino."
  explanation:
    es: "El artículo 16.4 dice que «la falta de petición de reingreso al servicio activo dentro de dicho plazo comportará la pérdida de la condición de funcionario». No lleva a la excedencia forzosa ni a la expectativa de destino, y no hay prórroga automática. Esa causa de pérdida no está en el artículo 63 TREBEP; por eso la pregunta nombra el reglamento."
  citation: "art. 16.4 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-11719-art-89
- id: m01-l13-q251
  prompt:
    es: "De acuerdo con el artículo 89.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la excedencia voluntaria por agrupación familiar puede concederse al funcionario cuyo cónyuge resida en otra localidad por desempeñar allí un puesto:"
  options:
  - id: a
    text:
      es: "Como funcionario interino o como personal laboral temporal."
  - id: b
    text:
      es: "Con carácter provisional como funcionario de carrera tras un concurso."
  - id: c
    text:
      es: "De cualquier clase, siempre que sea en la misma comunidad autónoma que el suyo."
  - id: d
    correct: true
    text:
      es: "De carácter definitivo como funcionario de carrera o como laboral fijo."
  explanation:
    es: "El artículo 89.3 exige que el cónyuge haya obtenido y desempeñe «un puesto de trabajo de carácter definitivo como funcionario de carrera o como laboral fijo» en las Administraciones Públicas y demás entidades que enumera. No sirven el interino, el laboral temporal ni el puesto provisional. Tampoco cualquier puesto, y el artículo no exige la misma comunidad autónoma."
  citation: "art. 89.3 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8730-art-17
- id: m01-l13-q255
  prompt:
    es: "Según el artículo 17 del Real Decreto 365/1995, de 10 de marzo, la excedencia voluntaria por agrupación familiar puede concederse con una duración:"
  options:
  - id: a
    text:
      es: "Mínima de dos años y máxima de cinco."
  - id: b
    correct: true
    text:
      es: "Mínima de dos años y máxima de quince."
  - id: c
    text:
      es: "Mínima de un año y máxima de quince."
  - id: d
    text:
      es: "Sin mínimo y con una máxima de tres años."
  explanation:
    es: "El artículo 17.1 dice que podrá concederse «con una duración mínima de dos años y máxima de quince». Cinco años de máximo, un año de mínimo y la ausencia de mínimo con tres años de máximo no son las cifras del artículo. El artículo 89.3 TREBEP no fija duración; por eso la pregunta nombra el reglamento."
  citation: "art. 17 RD 365/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1995-8730-art-14
- id: m01-l13-q268
  prompt:
    es: "Según el artículo 14.2 del Real Decreto 365/1995, de 10 de marzo, el funcionario en excedencia para el cuidado de hijos tiene derecho a la reserva del puesto de trabajo y al cómputo del tiempo a efectos de:"
  options:
  - id: a
    text:
      es: "Trienios y derechos pasivos, pero no de consolidación de grado."
  - id: b
    text:
      es: "Consolidación de grado personal, pero no de trienios."
  - id: c
    correct: true
    text:
      es: "Trienios, consolidación de grado personal y derechos pasivos."
  - id: d
    text:
      es: "Derechos pasivos, pero no de trienios ni de grado personal."
  explanation:
    es: "El artículo 14.2 reconoce «el derecho a la reserva del puesto de trabajo y a su cómputo a efectos de trienios, consolidación de grado personal, derechos pasivos y solicitud de excedencia voluntaria por interés particular». Las opciones que excluyen el grado personal, los trienios o ambos dejan fuera efectos que el artículo incluye."
  citation: "art. 14.2 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-14
- id: m01-l13-q269
  prompt:
    es: "De acuerdo con el artículo 14.3 del Real Decreto 365/1995, de 10 de marzo, si el funcionario no solicita el reingreso antes de que termine su excedencia por cuidado de hijos:"
  options:
  - id: a
    correct: true
    text:
      es: "Se le declara de oficio en excedencia voluntaria por interés particular."
  - id: b
    text:
      es: "Se le declara de oficio en la situación de excedencia forzosa."
  - id: c
    text:
      es: "Pierde la condición de funcionario de carrera de forma automática."
  - id: d
    text:
      es: "Se le prorroga la excedencia hasta que pida el reingreso al servicio activo."
  explanation:
    es: "El artículo 14.3 dice que, si no solicita el reingreso antes de la finalización del periodo, «el funcionario será declarado de oficio en la situación de excedencia voluntaria por interés particular». No pasa a la excedencia forzosa, no pierde la condición de funcionario y la excedencia no se prorroga."
  citation: "art. 14.3 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1995-8730-art-15
- id: m01-l13-q278
  prompt:
    es: "¿Cuál de los siguientes funcionarios de carrera pasa a excedencia voluntaria por prestación de servicios en el sector público, según el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "El que pasa a ocupar un puesto como funcionario interino en un ayuntamiento."
  - id: b
    text:
      es: "El que es contratado como personal laboral temporal en un organismo autónomo."
  - id: c
    text:
      es: "El que es nombrado personal eventual en el gabinete de un ministro."
  - id: d
    correct: true
    text:
      es: "El que pasa a ser laboral fijo en un organismo del sector público sin quedar en servicio activo."
  explanation:
    es: "El artículo 15.1 incluye a los funcionarios que «pasen a prestar servicios como personal laboral fijo en organismos o entidades del sector público y no les corresponda quedar en las situaciones de servicio activo o servicios especiales». El puesto de funcionario interino y el de laboral temporal están excluidos de forma expresa: «no habilitará para pasar a esta situación administrativa». El nombramiento como personal eventual no lleva a esta excedencia, sino a servicios especiales si el funcionario no opta por seguir en servicio activo (art. 87.1.i) TREBEP)."
  citation: "art. 15.1 RD 365/1995"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-1995-8730-art-15
- id: m01-l13-q279
  prompt:
    es: "Respecto de la excedencia voluntaria por prestación de servicios en el sector público, el desempeño de un puesto como funcionario interino o como personal laboral temporal:"
  options:
  - id: a
    text:
      es: "Habilita para pasar a ella solo si el puesto está en otra Administración."
  - id: b
    correct: true
    text:
      es: "No habilita para pasar a esa situación, cualquiera que sea su duración."
  - id: c
    text:
      es: "Habilita para pasar a ella si el nombramiento supera los seis meses."
  - id: d
    text:
      es: "Habilita para pasar a ella si antes se obtiene la oportuna compatibilidad."
  explanation:
    es: "El artículo 15.1 RD 365/1995 dice que «el desempeño de puestos con carácter de funcionario interino o de personal laboral temporal no habilitará para pasar a esta situación administrativa». La exclusión no tiene excepciones: ni la duración del nombramiento, ni que el puesto esté en otra Administración, ni la compatibilidad la levantan. La compatibilidad solo opera en el otro supuesto del artículo, el del funcionario en servicio activo en otro cuerpo o escala."
  citation: "art. 15.1 RD 365/1995"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1995-8730-art-15
- id: m01-l13-q280
  prompt:
    es: "Según el Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, ¿cómo se declara la excedencia voluntaria por prestación de servicios en el sector público?"
  options:
  - id: a
    text:
      es: "A instancia de parte, previo informe favorable de la Subsecretaría."
  - id: b
    correct: true
    text:
      es: "De oficio o a instancia de parte."
  - id: c
    text:
      es: "Solo de oficio, por el departamento al que esté adscrito el cuerpo."
  - id: d
    text:
      es: "Solo a instancia del funcionario interesado, nunca de oficio."
  explanation:
    es: "El artículo 15.1 empieza: «Procederá declarar, de oficio o a instancia de parte, en la situación regulada en este artículo». Las dos vías caben, así que son incorrectas la opción que la reserva a la solicitud del funcionario y la que la reserva a la actuación de oficio del departamento. El informe favorable de la Subsecretaría es un requisito que el artículo no contiene."
  citation: "art. 15.1 RD 365/1995"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1995-8730-art-12
- id: m01-l13-q285
  prompt:
    es: "De acuerdo con el artículo 12.1 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, pasan a expectativa de destino los funcionarios afectados por un procedimiento de reasignación de efectivos que:"
  options:
  - id: a
    text:
      es: "No hayan obtenido puesto en ninguna de las fases del procedimiento."
  - id: b
    correct: true
    text:
      es: "No hayan obtenido puesto en las dos primeras fases del procedimiento."
  - id: c
    text:
      es: "Hayan rechazado el puesto ofrecido en la primera fase del procedimiento."
  - id: d
    text:
      es: "No hayan obtenido puesto en la primera fase del procedimiento."
  explanation:
    es: "El artículo 12.1 lleva a la expectativa de destino a los afectados por la reasignación de efectivos «que no hayan obtenido puesto en las dos primeras fases». No basta con no obtenerlo en la primera fase. No obtenerlo en ninguna fase no es el supuesto: la situación se declara al terminar la segunda. El rechazo de un puesto ofrecido no es la causa que el artículo describe."
  citation: "art. 12.1 RD 365/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8730-art-12
- id: m01-l13-q286
  prompt:
    es: "Según el artículo 12.2 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, los funcionarios en expectativa de destino pasan a excedencia forzosa cuando han permanecido en aquella situación:"
  options:
  - id: a
    text:
      es: "Durante el período máximo de cinco años."
  - id: b
    text:
      es: "Durante el período máximo de seis meses."
  - id: c
    correct: true
    text:
      es: "Durante el período máximo de un año."
  - id: d
    text:
      es: "Durante el período máximo de dos años."
  explanation:
    es: "El artículo 12.2: «Los funcionarios permanecerán en esta situación un período máximo de un año, transcurrido el cual pasarán a la situación de excedencia forzosa». Seis meses es el límite de la suspensión provisional en un expediente disciplinario (art. 21.3). Dos años es la duración mínima de la excedencia por interés particular (art. 16.3) y cinco años la de la excedencia voluntaria incentivada (art. 18.4)."
  citation: "art. 12.2 RD 365/1995"
  difficulty: 1
  tags:
  - "plazo"
