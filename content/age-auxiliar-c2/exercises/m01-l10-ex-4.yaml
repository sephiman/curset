# anchor: celex-12016m-txt-art-14
- id: m01-l10-q018
  prompt:
    es: "El número máximo de representantes de los ciudadanos de la Unión que pueden componer el Parlamento Europeo es el siguiente:"
  options:
  - id: a
    text:
      es: "No excederá de setecientos cincuenta, incluido el Presidente."
  - id: b
    correct: true
    text:
      es: "No excederá de setecientos cincuenta, más el Presidente."
  - id: c
    text:
      es: "No excederá de setecientos veinte, más el Presidente."
  - id: d
    text:
      es: "No excederá de setecientos cincuenta y uno, más el Presidente."
  explanation:
    es: "El artículo 14.2 TUE dice que el número de diputados «no excederá de setecientos cincuenta, más el Presidente». El Presidente se suma a los 750, no se cuenta dentro. Setecientos veinte es el número de diputados que tiene la cámara a fecha de 16-10-2026, no el límite del Tratado. Setecientos cincuenta y uno es el total con el Presidente, no la cifra a la que este se añade."
  citation: "art. 14.2 TUE"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: celex-12016m-txt-art-14
- id: m01-l10-q019
  prompt:
    es: "Según el artículo 14 del Tratado de la Unión Europea, ¿cómo será la representación de los ciudadanos en el Parlamento Europeo?"
  options:
  - id: a
    text:
      es: "Estrictamente proporcional a la población de cada Estado miembro, sin un mínimo de diputados por Estado."
  - id: b
    text:
      es: "Decrecientemente proporcional, con un mínimo de cinco diputados por Estado miembro y un máximo de noventa y nueve escaños."
  - id: c
    correct: true
    text:
      es: "Decrecientemente proporcional, con un mínimo de seis diputados por Estado miembro y sin que ninguno tenga más de noventa y seis escaños."
  - id: d
    text:
      es: "Igual para todos los Estados miembros, que eligen el mismo número de diputados."
  explanation:
    es: "El artículo 14.2 TUE dice que la representación de los ciudadanos «será decrecientemente proporcional, con un mínimo de seis diputados por Estado miembro» y que «no se asignará a ningún Estado miembro más de noventa y seis escaños». «Estrictamente proporcional, sin mínimo» contradice «decrecientemente proporcional» y el mínimo de seis. «Igual para todos los Estados» también contradice «decrecientemente proporcional». Un mínimo de cinco y un máximo de noventa y nueve no coinciden con el seis y el noventa y seis del apartado."
  citation: "art. 14.2 TUE"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: fuente-ue-parlamento-europeo-html
- id: m01-l10-q020
  prompt:
    es: "A fecha de 16 de octubre de 2026, ¿cuántos diputados tiene el Parlamento Europeo según su ficha en el portal oficial de la Unión Europea?"
  options:
  - id: a
    text:
      es: "705 eurodiputados."
  - id: b
    text:
      es: "750 eurodiputados."
  - id: c
    text:
      es: "751 eurodiputados."
  - id: d
    correct: true
    text:
      es: "720 eurodiputados."
  explanation:
    es: "La ficha del Parlamento Europeo en el portal de la Unión, consultada el 16-10-2026, dice «Miembros: 720 eurodiputados». 750 más el Presidente, es decir 751, es el máximo que permite el artículo 14.2 TUE, no la cifra actual. 705 no es la cifra que da la ficha."
  citation: "fuente: `ue-parlamento-europeo.html`"
  difficulty: 1
  tags:
  - "composición"
  - "cantidad"
# anchor: celex-12016m-txt-art-14
- id: m01-l10-q021
  prompt:
    es: "¿Cómo son elegidos los diputados al Parlamento Europeo y para qué mandato, según lo dispuesto en el Tratado de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "Por sufragio universal directo, libre y secreto, para un mandato de cinco años."
  - id: b
    text:
      es: "Por sufragio indirecto, a través de los Parlamentos nacionales, para un mandato de cinco años."
  - id: c
    text:
      es: "Por sufragio universal directo, libre y secreto, para un mandato de cuatro años."
  - id: d
    text:
      es: "Por sufragio universal directo, libre y secreto, para un mandato de seis años."
  explanation:
    es: "El artículo 14.3 TUE dice que los diputados «serán elegidos por sufragio universal directo, libre y secreto, para un mandato de cinco años». El sufragio no es indirecto. Cuatro años no es la duración del Tratado, y seis años es la de los jueces del Tribunal de Justicia (art. 253 TFUE)."
  citation: "art. 14.3 TUE"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: celex-12016e-txt-art-229
- id: m01-l10-q022
  prompt:
    es: "De acuerdo con el artículo 229 del Tratado de Funcionamiento de la Unión Europea, el Parlamento Europeo celebrará cada año un período de sesiones y se reunirá sin necesidad de previa convocatoria:"
  options:
  - id: a
    text:
      es: "El primer martes de marzo."
  - id: b
    correct: true
    text:
      es: "El segundo martes de marzo."
  - id: c
    text:
      es: "El segundo martes de septiembre."
  - id: d
    text:
      es: "El segundo lunes de marzo."
  explanation:
    es: "El artículo 229 TFUE dice que el Parlamento Europeo «se reunirá sin necesidad de previa convocatoria el segundo martes de marzo». Las otras opciones cambian el ordinal, el mes o el día de la semana."
  citation: "art. 229 TFUE"
  difficulty: 1
  tags:
  - "fecha"
  - "procedimiento"
# anchor: celex-12016e-txt-art-231
- id: m01-l10-q023
  prompt:
    es: "Según el artículo 231 del Tratado de Funcionamiento de la Unión Europea, salvo disposición en contrario de los Tratados, ¿cómo decidirá el Parlamento Europeo?"
  options:
  - id: a
    text:
      es: "Por mayoría de los miembros que lo componen."
  - id: b
    text:
      es: "Por mayoría de dos tercios de los votos emitidos."
  - id: c
    correct: true
    text:
      es: "Por mayoría de los votos emitidos."
  - id: d
    text:
      es: "Por mayoría de los miembros presentes."
  explanation:
    es: "El artículo 231 TFUE dice que, «salvo disposición en contrario de los Tratados, el Parlamento Europeo decidirá por mayoría de los votos emitidos». La mayoría de los miembros que lo componen se exige en casos concretos, como la elección del Presidente de la Comisión (art. 17.7 TUE). Los dos tercios de los votos emitidos son de la moción de censura (art. 234 TFUE). Los miembros presentes no son la base del artículo."
  citation: "art. 231 TFUE"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: celex-12016e-txt-art-234
- id: m01-l10-q024
  prompt:
    es: "De acuerdo con el artículo 234 del Tratado de Funcionamiento de la Unión Europea, el Parlamento Europeo solo podrá pronunciarse sobre una moción de censura sobre la gestión de la Comisión:"
  options:
  - id: a
    text:
      es: "Transcurridas cuarenta y ocho horas como mínimo desde su presentación y en votación pública."
  - id: b
    text:
      es: "Transcurridos tres días como mínimo desde la fecha de su presentación y en votación secreta."
  - id: c
    text:
      es: "Transcurridos siete días como mínimo desde la fecha de su presentación y en votación pública."
  - id: d
    correct: true
    text:
      es: "Transcurridos tres días como mínimo desde la fecha de su presentación y en votación pública."
  explanation:
    es: "El artículo 234 TFUE dice que el Parlamento «sólo podrá pronunciarse sobre dicha moción transcurridos tres días como mínimo desde la fecha de su presentación y en votación pública». Cuarenta y ocho horas y siete días cambian el plazo. La votación es pública, no secreta."
  citation: "art. 234 TFUE"
  difficulty: 1
  tags:
  - "plazo"
  - "procedimiento"
# anchor: celex-12016e-txt-art-234
- id: m01-l10-q025
  prompt:
    es: "Según el artículo 234 del Tratado de Funcionamiento de la Unión Europea, ¿qué mayoría se requiere para aprobar una moción de censura sobre la gestión de la Comisión?"
  options:
  - id: a
    correct: true
    text:
      es: "Dos tercios de los votos emitidos que representen, a su vez, la mayoría de los diputados que componen el Parlamento Europeo."
  - id: b
    text:
      es: "Mayoría absoluta de los diputados que componen el Parlamento Europeo."
  - id: c
    text:
      es: "Tres quintos de los votos emitidos que representen, a su vez, la mayoría de los diputados que componen el Parlamento."
  - id: d
    text:
      es: "Dos tercios de los diputados que componen el Parlamento Europeo."
  explanation:
    es: "El artículo 234 TFUE exige la «mayoría de dos tercios de los votos emitidos que representen, a su vez, la mayoría de los diputados que componen el Parlamento Europeo». La mayoría absoluta sola no basta. Tres quintos cambia la fracción. Los dos tercios se calculan sobre los votos emitidos, no sobre el total de diputados."
  citation: "art. 234 TFUE"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: celex-12016e-txt-art-234
- id: m01-l10-q026
  prompt:
    es: "Señale la respuesta correcta sobre los efectos de la aprobación de una moción de censura contra la Comisión, conforme al Tratado de Funcionamiento de la Unión Europea:"
  options:
  - id: a
    text:
      es: "Solo deberá dimitir el Presidente de la Comisión, y los demás miembros seguirán en funciones hasta el fin del mandato."
  - id: b
    correct: true
    text:
      es: "Los miembros de la Comisión deberán dimitir colectivamente y el Alto Representante deberá dimitir del cargo que ejerce en la Comisión."
  - id: c
    text:
      es: "Los miembros de la Comisión deberán dimitir colectivamente y el Alto Representante deberá dejar también la presidencia del Consejo de Asuntos Exteriores."
  - id: d
    text:
      es: "Los miembros de la Comisión cesarán en el acto y no podrán despachar asunto alguno hasta su sustitución."
  explanation:
    es: "El artículo 234 TFUE dice que, aprobada la moción, «los miembros de la Comisión deberán dimitir colectivamente de sus cargos y el Alto Representante […] deberá dimitir del cargo que ejerce en la Comisión». La dimisión es colectiva, no solo del Presidente. El Alto Representante deja solo su cargo en la Comisión. Los dimisionarios siguen despachando los asuntos de administración ordinaria hasta ser sustituidos."
  citation: "art. 234 TFUE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: celex-12016e-txt-art-229
- id: m01-l10-q053
  prompt:
    es: "¿A petición de quién puede reunirse el Parlamento Europeo en período parcial de sesiones extraordinario, según el Tratado de Funcionamiento de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "De la mayoría de sus miembros, del Consejo o de la Comisión."
  - id: b
    text:
      es: "De un tercio de los miembros que lo componen, del Consejo Europeo o del Presidente de la Comisión."
  - id: c
    text:
      es: "De la mayoría de los miembros que lo componen o del Consejo, pero en ningún caso a petición de la Comisión."
  - id: d
    text:
      es: "De su Presidente, previo acuerdo de la Conferencia de Presidentes y de la mayoría de los Estados miembros."
  explanation:
    es: "La opción correcta es la mayoría de sus miembros, el Consejo o la Comisión: el artículo 229 TFUE dice que el Parlamento «podrá reunirse en período parcial de sesiones extraordinario a petición de la mayoría de los miembros que lo componen, del Consejo o de la Comisión». Un tercio cambia la fracción, y el Consejo Europeo y el Presidente de la Comisión no son quienes lo piden. La Comisión sí puede pedirlo. El Presidente del Parlamento, la Conferencia de Presidentes y los Estados miembros no figuran en el artículo."
  citation: "art. 229 TFUE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "órgano"
# anchor: celex-12016e-txt-art-234
- id: m01-l10-q054
  prompt:
    es: "Aprobada una moción de censura, ¿qué hacen los miembros de la Comisión obligados a dimitir hasta su sustitución, según el Tratado de Funcionamiento de la Unión Europea?"
  options:
  - id: a
    text:
      es: "Cesan de inmediato, y el Consejo asume sus funciones hasta el nombramiento de la nueva Comisión."
  - id: b
    text:
      es: "Cesan de inmediato, y el Presidente del Consejo Europeo asume la gestión de los asuntos ordinarios."
  - id: c
    text:
      es: "Siguen en sus cargos con plenas facultades, incluida la presentación de propuestas legislativas."
  - id: d
    correct: true
    text:
      es: "Siguen en sus cargos despachando la administración ordinaria."
  explanation:
    es: "La opción correcta es que siguen en sus cargos despachando la administración ordinaria: el artículo 234 TFUE dice que «permanecerán en sus cargos y continuarán despachando los asuntos de administración ordinaria hasta que sean sustituidos». No cesan de inmediato, y ni el Consejo ni el Presidente del Consejo Europeo asumen sus funciones. Tampoco conservan plenas facultades: solo despachan la administración ordinaria."
  citation: "art. 234 TFUE"
  difficulty: 3
  tags:
  - "efecto"
  - "plazo"
# anchor: celex-12016m-txt-art-14
- id: m01-l10-q095
  prompt:
    es: "¿Cuál de los siguientes cargos elige el Parlamento Europeo, que además ejerce con el Consejo la función legislativa y la presupuestaria, según el artículo 14.1 del Tratado de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "Presidente de la Comisión."
  - id: b
    text:
      es: "Presidente del Consejo Europeo."
  - id: c
    text:
      es: "Alto Representante de la Unión para Asuntos Exteriores y Política de Seguridad."
  - id: d
    text:
      es: "Presidente del Tribunal de Justicia."
  explanation:
    es: "El Parlamento Europeo elige al Presidente de la Comisión. El Presidente del Consejo Europeo lo elige el propio Consejo Europeo. El Alto Representante lo nombra el Consejo Europeo y el Presidente del Tribunal de Justicia lo eligen los jueces."
  citation: "art. 14.1 TUE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: celex-12016m-txt-art-14
- id: m01-l10-q096
  prompt:
    es: "Señale quién adopta la decisión por la que se fije la composición del Parlamento Europeo, de acuerdo con el artículo 14.2 del Tratado de la Unión Europea:"
  options:
  - id: a
    text:
      es: "El Consejo, por mayoría cualificada, a propuesta de la Comisión."
  - id: b
    text:
      es: "El Parlamento Europeo, por mayoría de sus miembros, con aprobación del Consejo."
  - id: c
    text:
      es: "El Consejo Europeo, por mayoría cualificada, a iniciativa de la Comisión."
  - id: d
    correct: true
    text:
      es: "El Consejo Europeo, por unanimidad, a iniciativa del Parlamento Europeo y con su aprobación."
  explanation:
    es: "La composición la fija el Consejo Europeo por unanimidad, a iniciativa del Parlamento y con su aprobación. No la fija el Consejo a propuesta de la Comisión ni el Parlamento por sí mismo con la aprobación del Consejo. La mayoría cualificada a iniciativa de la Comisión mezcla la regla de otros nombramientos con un proponente que el artículo no prevé."
  citation: "art. 14.2 TUE"
  difficulty: 3
  tags:
  - "órgano"
  - "mayoría"
# anchor: celex-12016m-txt-art-14
- id: m01-l10-q097
  prompt:
    es: "Conforme al artículo 14.4 del Tratado de la Unión Europea, el Parlamento Europeo elegirá a su Presidente y a la Mesa de entre sus:"
  options:
  - id: a
    text:
      es: "Grupos políticos."
  - id: b
    text:
      es: "Comisiones parlamentarias."
  - id: c
    correct: true
    text:
      es: "Diputados."
  - id: d
    text:
      es: "Funcionarios."
  explanation:
    es: "El Presidente y la Mesa se eligen de entre los diputados del propio Parlamento. Los grupos políticos y las comisiones parlamentarias son agrupaciones de diputados, no personas que puedan presidir, y los funcionarios no son miembros del Parlamento."
  citation: "art. 14.4 TUE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: celex-12016e-txt-art-231
- id: m01-l10-q098
  prompt:
    es: "Según el artículo 231 del Tratado de Funcionamiento de la Unión Europea, salvo disposición en contrario de los Tratados, el Parlamento Europeo decidirá por mayoría de los votos emitidos, y su reglamento interno fijará:"
  options:
  - id: a
    text:
      es: "La sede de sus períodos de sesiones."
  - id: b
    correct: true
    text:
      es: "El quórum."
  - id: c
    text:
      es: "El número de sus diputados."
  - id: d
    text:
      es: "La mayoría para aprobar una moción de censura."
  explanation:
    es: "El reglamento interno del Parlamento fija el quórum. La sede la establece el Protocolo sobre las sedes de las instituciones. El número de diputados lo fija una decisión del Consejo Europeo conforme al artículo 14.2 del Tratado de la Unión Europea. La mayoría de la moción de censura la fija el propio artículo 234."
  citation: "art. 231 TFUE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: celex-12016m-txt-art-17
- id: m01-l10-q099
  prompt:
    es: "Según el Tratado de la Unión Europea, ¿ante qué institución tendrá la Comisión una responsabilidad colegiada, que puede exigirle mediante una moción de censura?"
  options:
  - id: a
    correct: true
    text:
      es: "El Parlamento Europeo."
  - id: b
    text:
      es: "El Consejo Europeo."
  - id: c
    text:
      es: "El Consejo."
  - id: d
    text:
      es: "El Tribunal de Justicia."
  explanation:
    es: "La Comisión responde colegiadamente ante el Parlamento Europeo, que puede votar una moción de censura contra ella. No responde así ante el Consejo Europeo, ni ante el Consejo, ni ante el Tribunal de Justicia."
  citation: "art. 17.8 TUE"
  difficulty: 1
  tags:
  - "órgano"
