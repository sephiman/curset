# anchor: celex-32013r0952-art-83
- id: m03-l20-q0085
  prompt:
    es: "De acuerdo con el artículo 83, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, la deuda aduanera de importación o de exportación nacerá incluso cuando se refiera a mercancías sujetas a:"
  options:
  - id: a
    correct: true
    text:
      es: "Medidas de prohibición o restricción de importación o de exportación de cualquier tipo."
  - id: b
    text:
      es: "Medidas de prohibición de importación, pero no a medidas de restricción de importación."
  - id: c
    text:
      es: "Medidas de restricción de exportación, pero no a medidas de prohibición de exportación."
  - id: d
    text:
      es: "Medidas de prohibición o restricción impuestas únicamente por el Estado miembro de entrada."
  explanation:
    es: "La deuda nace aunque las mercancías estén sujetas a medidas de prohibición o restricción de importación o de exportación de cualquier tipo. No se excluyen las restricciones de importación, ni las prohibiciones de exportación, ni importa que la medida la imponga el Estado miembro de entrada."
  citation: "art. 83.1 CAU"
  difficulty: 1
  tags:
  - "disposiciones comunes"
  - "prohibiciones y restricciones"
# anchor: celex-32013r0952-art-83
- id: m03-l20-q0086
  prompt:
    es: "Según el artículo 83, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿nace una deuda aduanera de importación por mercancías sujetas a una prohibición de importación que se despachan a libre práctica con derechos aplicables?"
  options:
  - id: a
    text:
      es: "No, porque las mercancías prohibidas no pueden dar lugar a ninguna deuda aduanera de importación."
  - id: b
    correct: true
    text:
      es: "Sí, porque la deuda nace incluso cuando se refiere a mercancías sujetas a medidas de prohibición o restricción de cualquier tipo."
  - id: c
    text:
      es: "No, porque solo nace deuda por mercancías sujetas a restricciones, no por las sujetas a prohibiciones."
  - id: d
    text:
      es: "Sí, pero solo si el Estado miembro levanta previamente la prohibición para esa partida concreta."
  explanation:
    es: "La deuda nace aunque las mercancías estén sujetas a una medida de prohibición o restricción de cualquier tipo. Por eso no se excluyen las mercancías prohibidas. Tampoco se distingue entre restricciones y prohibiciones. Y el nacimiento no depende de que se levante antes la prohibición."
  citation: "art. 83.1 CAU"
  difficulty: 2
  tags:
  - "disposiciones comunes"
  - "prohibiciones y restricciones"
# anchor: celex-32013r0952-art-83
- id: m03-l20-q0087
  prompt:
    es: "De acuerdo con el artículo 83, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre los casos en que no nace ninguna deuda aduanera:"
  options:
  - id: a
    text:
      es: "No nace deuda aduanera por la introducción ilegal en el territorio aduanero de la Unión de cualquier mercancía falsificada."
  - id: b
    text:
      es: "No nace deuda aduanera por la introducción en el territorio aduanero de la Unión de cualquier estupefaciente."
  - id: c
    correct: true
    text:
      es: "No nace deuda aduanera por la introducción ilegal en el territorio aduanero de la Unión de moneda falsa."
  - id: d
    text:
      es: "No nace deuda aduanera por la introducción de mercancías sujetas a medidas de prohibición de importación."
  explanation:
    es: "No nace deuda por la introducción ilegal de moneda falsa. La excepción no se extiende a cualquier mercancía falsificada. Tampoco a cualquier estupefaciente: solo a los distintos de los estrictamente supervisados con fines médicos y científicos. Y las mercancías prohibidas sí dan lugar a deuda, por el apartado 1."
  citation: "art. 83.2 CAU"
  difficulty: 2
  tags:
  - "disposiciones comunes"
  - "excepciones"
# anchor: celex-32013r0952-art-83
- id: m03-l20-q0088
  prompt:
    es: "Un laboratorio introduce en el territorio aduanero de la Unión estupefacientes estrictamente supervisados por las autoridades competentes con vistas a su utilización para fines médicos y científicos, y las mercancías están sujetas a derechos de importación. Conforme al artículo 83 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿está excluido el nacimiento de la deuda aduanera?"
  options:
  - id: a
    text:
      es: "Sí, porque no nace deuda aduanera por la introducción de ningún estupefaciente en el territorio aduanero."
  - id: b
    text:
      es: "Sí, porque no nace deuda aduanera por la introducción de mercancías destinadas a fines médicos y científicos."
  - id: c
    text:
      es: "No, porque la exclusión alcanza únicamente a la introducción ilegal de moneda falsa."
  - id: d
    correct: true
    text:
      es: "No, porque la exclusión alcanza a los estupefacientes distintos de los estrictamente supervisados para fines médicos y científicos."
  explanation:
    es: "El artículo 83.2.b) excluye la deuda por los estupefacientes distintos de los estrictamente supervisados con fines médicos y científicos. Los del laboratorio sí están supervisados con esos fines, así que no están excluidos y rige la regla general del apartado 1. No es cierto que la exclusión alcance a cualquier estupefaciente ni a cualquier mercancía de uso médico. Y la moneda falsa es otra excepción, que no agota el apartado."
  citation: "art. 83.2 CAU"
  difficulty: 3
  tags:
  - "disposiciones comunes"
  - "excepciones"
# anchor: celex-32013r0952-art-84
- id: m03-l20-q0089
  prompt:
    es: "De acuerdo con el artículo 84 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, cuando varias personas sean responsables del pago del importe de los derechos correspondiente a una deuda aduanera, serán responsables del pago de dicho importe:"
  options:
  - id: a
    text:
      es: "De manera subsidiaria, una vez declarado fallido el deudor principal."
  - id: b
    correct: true
    text:
      es: "De manera conjunta y solidaria."
  - id: c
    text:
      es: "En proporción a su participación en la operación que originó la deuda."
  - id: d
    text:
      es: "Por orden cronológico, según el momento en que cada una asumió la deuda."
  explanation:
    es: "Cuando varias personas responden de la deuda, lo hacen de manera conjunta y solidaria. No es una responsabilidad subsidiaria, ni proporcional a la participación, ni escalonada por orden cronológico."
  citation: "art. 84 CAU"
  difficulty: 1
  tags:
  - "disposiciones comunes"
  - "pluralidad de deudores"
# anchor: celex-32013r0952-art-84
- id: m03-l20-q0090
  prompt:
    es: "El declarante y la persona por cuya cuenta se hizo una declaración en aduana de despacho a libre práctica son ambos deudores de una deuda aduanera de importación de 6 000 euros. Según el artículo 84 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cómo responden del pago de ese importe?"
  options:
  - id: a
    text:
      es: "De manera mancomunada, de modo que cada uno responde de 3 000 euros y no puede exigírsele más."
  - id: b
    text:
      es: "De manera subsidiaria, de modo que primero se reclama a la persona por cuya cuenta se hizo la declaración."
  - id: c
    correct: true
    text:
      es: "De manera conjunta y solidaria, de modo que la autoridad puede reclamar el importe a cualquiera de ellos."
  - id: d
    text:
      es: "De manera sucesiva, de modo que responde el declarante y solo después, en su caso, el resto."
  explanation:
    es: "Los deudores responden de manera conjunta y solidaria, así que cualquiera de ellos puede ser requerido por los 6 000 euros. Dividirlo en 3 000 euros por persona sería una responsabilidad mancomunada, que el artículo no establece. Tampoco es subsidiaria, ni sucesiva con un orden previo entre los deudores."
  citation: "art. 84 CAU"
  difficulty: 2
  tags:
  - "disposiciones comunes"
  - "pluralidad de deudores"
  - "cómputo"
# anchor: celex-32013r0952-art-85
- id: m03-l20-q0091
  prompt:
    es: "De acuerdo con el artículo 85, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, el importe de los derechos se determinará con arreglo a las reglas de cálculo aplicables a las mercancías en el momento en que:"
  options:
  - id: a
    text:
      es: "Se pague el importe de la deuda aduanera relativa a dichas mercancías."
  - id: b
    text:
      es: "Se notifique al deudor el importe de la deuda aduanera relativa a dichas mercancías."
  - id: c
    text:
      es: "Se conceda el levante de dichas mercancías por las autoridades aduaneras."
  - id: d
    correct: true
    text:
      es: "Nació la deuda aduanera relativa a dichas mercancías."
  explanation:
    es: "Se aplican las reglas de cálculo vigentes cuando nació la deuda. Ni el pago, ni la notificación del importe, ni el levante fijan el momento de referencia."
  citation: "art. 85.1 CAU"
  difficulty: 1
  tags:
  - "disposiciones comunes"
  - "cálculo de derechos"
# anchor: celex-32013r0952-art-85
- id: m03-l20-q0092
  prompt:
    es: "Una deuda aduanera de importación nace el 10 de enero de 2027, cuando el tipo de los derechos es del 5 % sobre un valor de 10 000 euros. El 1 de febrero de 2027 entra en vigor un tipo del 8 % y el deudor paga el 20 de febrero de 2027. Conforme al artículo 85, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cuál es el importe de los derechos?"
  options:
  - id: a
    text:
      es: "1 300 euros, porque se suman los dos tipos vigentes entre el nacimiento de la deuda y el pago."
  - id: b
    text:
      es: "800 euros, porque se aplica el tipo vigente el día en que el deudor paga la deuda aduanera."
  - id: c
    text:
      es: "650 euros, porque se aplica la media de los dos tipos vigentes entre el nacimiento y el pago."
  - id: d
    correct: true
    text:
      es: "500 euros, porque se aplica el tipo vigente cuando nació la deuda aduanera."
  explanation:
    es: "Rige el tipo vigente cuando nació la deuda, el 5 %: el 5 % de 10 000 euros son 500 euros. Aplicar el 8 % daría 800 euros, pero la fecha del pago no es la del nacimiento. Sumar los dos tipos daría 1 300 euros, y el artículo no prevé acumularlos. Y no prevé promediarlos, que daría 650 euros."
  citation: "art. 85.1 CAU"
  difficulty: 3
  tags:
  - "disposiciones comunes"
  - "cálculo de derechos"
  - "cómputo"
# anchor: celex-32013r0952-art-85
- id: m03-l20-q0093
  prompt:
    es: "De acuerdo con el artículo 85, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, cuando no sea posible determinar con precisión el momento en que nació la deuda aduanera, se considerará que es el momento en que:"
  options:
  - id: a
    text:
      es: "El declarante reconozca por escrito ante las autoridades que las mercancías se encuentran en una situación que ha originado una deuda aduanera."
  - id: b
    text:
      es: "Las mercancías fueron presentadas en la aduana por primera vez, con independencia de la situación en que se encuentren."
  - id: c
    correct: true
    text:
      es: "Las autoridades aduaneras determinen que las mercancías se encuentran en una situación que ha originado una deuda aduanera."
  - id: d
    text:
      es: "Se notifique al deudor la resolución por la que se liquida el importe de los derechos de importación o de exportación."
  explanation:
    es: "A falta de un momento preciso, se toma el momento en que las autoridades determinan que las mercancías están en una situación que originó la deuda. No sirve el reconocimiento escrito del declarante, ni la primera presentación en aduana, ni la notificación de la liquidación."
  citation: "art. 85.2 CAU"
  difficulty: 2
  tags:
  - "disposiciones comunes"
  - "cálculo de derechos"
# anchor: celex-32013r0952-art-86
- id: m03-l20-q0095
  prompt:
    es: "Según el artículo 86, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, los costes de almacenamiento o manipulación de mercancías en régimen aduanero no se tienen en cuenta para calcular los derechos de importación si el declarante:"
  options:
  - id: a
    correct: true
    text:
      es: "Suministra pruebas satisfactorias de dichos costes."
  - id: b
    text:
      es: "Los declara en la declaración sumaria de entrada de las mercancías."
  - id: c
    text:
      es: "Obtiene la autorización previa de la Comisión para deducirlos."
  - id: d
    text:
      es: "Los abona a las autoridades aduaneras antes del levante de las mercancías."
  explanation:
    es: "Esos costes o el incremento de valor quedan fuera del cálculo cuando el declarante suministra pruebas satisfactorias de ellos. El artículo no exige declararlos en la declaración sumaria, obtener una autorización de la Comisión ni abonarlos antes del levante."
  citation: "art. 86.1 CAU"
  difficulty: 2
  tags:
  - "disposiciones comunes"
  - "cálculo de derechos"
# anchor: celex-32013r0952-art-86
- id: m03-l20-q0096
  prompt:
    es: "De acuerdo con el artículo 86, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre los elementos que se tienen en cuenta en el cálculo de los derechos tras operaciones usuales de manipulación:"
  options:
  - id: a
    correct: true
    text:
      es: "Se tienen en cuenta el valor en aduana, la cantidad, la naturaleza y el origen de las mercancías no pertenecientes a la Unión utilizadas en las operaciones."
  - id: b
    text:
      es: "Solo se tienen en cuenta la cantidad y la naturaleza de las mercancías utilizadas, y no su valor en aduana ni su origen."
  - id: c
    text:
      es: "Se tiene en cuenta únicamente el valor de las mercancías de la Unión incorporadas durante las operaciones usuales de manipulación."
  - id: d
    text:
      es: "No se tiene en cuenta ningún elemento de las mercancías originales, porque la manipulación crea un producto nuevo."
  explanation:
    es: "Se tienen en cuenta el valor en aduana, la cantidad, la naturaleza y el origen de las mercancías no pertenecientes a la Unión utilizadas en las operaciones. No se reducen a la cantidad y la naturaleza, ni se limitan a las mercancías de la Unión. Y la manipulación usual no borra los elementos de las mercancías originales."
  citation: "art. 86.1 CAU"
  difficulty: 2
  tags:
  - "disposiciones comunes"
  - "cálculo de derechos"
# anchor: celex-32013r0952-art-87
- id: m03-l20-q0098
  prompt:
    es: "De acuerdo con el artículo 87, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, una deuda aduanera nace, con carácter general, en el lugar en que:"
  options:
  - id: a
    correct: true
    text:
      es: "Se haya presentado la declaración en aduana o la declaración de reexportación mencionadas en los artículos 77, 78 y 81."
  - id: b
    text:
      es: "Se haya concedido el levante de las mercancías en aduana, en los casos de los artículos 77, 78 y 81."
  - id: c
    text:
      es: "Se encuentre el domicilio fiscal del declarante, en los casos de los artículos 77, 78 y 81."
  - id: d
    text:
      es: "Se haya efectuado el pago de los derechos de importación o de exportación, en los casos de los artículos 77, 78 y 81 del código."
  explanation:
    es: "La deuda nace donde se presentó la declaración en aduana o la de reexportación mencionadas en los artículos 77, 78 y 81. No importa dónde se conceda el levante, ni el domicilio del declarante, ni el lugar del pago."
  citation: "art. 87.1 CAU"
  difficulty: 2
  tags:
  - "disposiciones comunes"
  - "lugar de nacimiento"
# anchor: celex-32013r0952-art-87
- id: m03-l20-q0099
  prompt:
    es: "De acuerdo con el artículo 87, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre el lugar de nacimiento de la deuda aduanera en los demás casos:"
  options:
  - id: a
    correct: true
    text:
      es: "Es el lugar en que se produzcan los hechos de los que se derive y, si no puede determinarse, aquel en que las autoridades concluyan que las mercancías están en esa situación."
  - id: b
    text:
      es: "Es el lugar de la aduana de entrada en el territorio aduanero de la Unión, aunque los hechos se produzcan en otro lugar."
  - id: c
    text:
      es: "Es siempre el lugar en que las autoridades aduaneras concluyan que las mercancías se encuentran en esa situación, aunque pueda determinarse el lugar de los hechos de que deriva la deuda."
  - id: d
    text:
      es: "Es el lugar en que tenga su sede el deudor, y solo si no tiene sede, aquel en que se produzcan los hechos."
  explanation:
    es: "En los demás casos la deuda nace en el lugar donde se producen los hechos de los que se deriva y, si no es posible determinarlo, donde las autoridades concluyan que las mercancías se encuentran en esa situación. No es la aduana de entrada sin más. Las autoridades solo deciden el lugar cuando no puede determinarse el de los hechos. Y la sede del deudor no figura como criterio."
  citation: "art. 87.1 CAU"
  difficulty: 3
  tags:
  - "disposiciones comunes"
  - "lugar de nacimiento"
# anchor: celex-32013r0952-art-87
- id: m03-l20-q0100
  prompt:
    es: "Según el artículo 87, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, si el régimen no se ultimó o el depósito temporal no terminó correctamente y no se determina el lugar, la deuda nace donde las mercancías:"
  options:
  - id: a
    text:
      es: "Fueron objeto del último control aduanero efectuado, aunque no se hubieran incluido en el régimen ni estuvieran en depósito temporal."
  - id: b
    correct: true
    text:
      es: "Fueron incluidas en el régimen, introducidas en el territorio aduanero con arreglo a dicho régimen o estuvieron en depósito temporal."
  - id: c
    text:
      es: "Se encuentren en el momento en que las autoridades aduaneras detecten que el régimen no se ultimó."
  - id: d
    text:
      es: "Fueron reexportadas por última vez, con independencia del régimen en que estuvieran incluidas."
  explanation:
    es: "Cuando no se puede determinar el lugar en el plazo fijado, la deuda nace donde las mercancías fueron incluidas en el régimen, introducidas en el territorio con arreglo a él o estuvieron en depósito temporal. No es el lugar del último control, ni el de su hallazgo, ni el de la última reexportación."
  citation: "art. 87.2 CAU"
  difficulty: 3
  tags:
  - "disposiciones comunes"
  - "lugar de nacimiento"
# anchor: celex-32013r0952-art-87
- id: m03-l20-q0102
  prompt:
    es: "Según el artículo 87, apartado 4, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, si una deuda por incumplimiento nació en otro Estado miembro y su importe es inferior a 10 000 EUR, se considera nacida en el Estado miembro:"
  options:
  - id: a
    text:
      es: "En que se encuentre el domicilio del deudor."
  - id: b
    text:
      es: "En que se admitió la declaración en aduana."
  - id: c
    text:
      es: "En que las mercancías fueron presentadas por primera vez."
  - id: d
    correct: true
    text:
      es: "En que se efectuó la verificación."
  explanation:
    es: "Si el importe es inferior a 10 000 EUR, se considera que la deuda nació en el Estado miembro en que se efectuó la verificación. No cuenta el domicilio del deudor, ni donde se admitió la declaración, ni el lugar de la primera presentación de las mercancías."
  citation: "art. 87.4 CAU"
  difficulty: 1
  tags:
  - "disposiciones comunes"
  - "lugar de nacimiento"
# anchor: celex-32013r0952-art-87
- id: m03-l20-q0103
  prompt:
    es: "Una autoridad aduanera española comprueba que una deuda aduanera por incumplimiento nació, con arreglo al artículo 79, en otro Estado miembro, y que el importe de los derechos de importación es de 9 500 EUR. Según el artículo 87, apartado 4, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿en qué Estado miembro se considera que nació?"
  options:
  - id: a
    text:
      es: "En el otro Estado miembro, porque la deuda nació allí y el importe no modifica el lugar de nacimiento."
  - id: b
    text:
      es: "En el otro Estado miembro, porque solo se traslada la competencia a quien verifica cuando el importe supera 10 000 EUR."
  - id: c
    text:
      es: "En España, porque la autoridad española es la primera que conoció la deuda, cualquiera que sea el importe."
  - id: d
    correct: true
    text:
      es: "En España, porque el importe es inferior a 10 000 EUR y es el Estado miembro en que se efectuó la verificación."
  explanation:
    es: "Con un importe de 9 500 EUR, inferior a 10 000 EUR, la deuda se considera nacida en el Estado miembro en que se efectuó la verificación, España. No rige lo contrario: el importe sí modifica el lugar. Tampoco se traslada la competencia con importes superiores. Y el criterio no es qué autoridad conoció primero la deuda, sino el importe inferior a 10 000 EUR."
  citation: "art. 87.4 CAU"
  difficulty: 2
  tags:
  - "disposiciones comunes"
  - "lugar de nacimiento"
  - "cómputo"
# anchor: celex-32013r0952-art-87
- id: m03-l20-q0104
  prompt:
    es: "Una autoridad aduanera francesa comprueba que una deuda aduanera por incumplimiento nació, con arreglo al artículo 82, en otro Estado miembro, y que el importe de los derechos de exportación es exactamente de 10 000 EUR. Conforme al artículo 87, apartado 4, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿se considera que la deuda nació en Francia?"
  options:
  - id: a
    text:
      es: "Sí, porque la regla se aplica a importes que no superan los 10 000 EUR, incluido el límite."
  - id: b
    text:
      es: "Sí, porque la regla se aplica a cualquier deuda por incumplimiento con independencia de su importe y del Estado miembro."
  - id: c
    correct: true
    text:
      es: "No, porque la regla solo se aplica a importes inferiores a 10 000 EUR y 10 000 EUR no es inferior a esa cifra."
  - id: d
    text:
      es: "No, porque la regla solo se aplica a las deudas de importación y no a las de exportación."
  explanation:
    es: "El artículo 87.4 se aplica cuando el importe es inferior a 10 000 EUR, y 10 000 EUR no lo es: la regla no juega y la deuda no se considera nacida en Francia por esta vía. No basta que el importe no supere el límite. Tampoco se aplica con independencia del importe. Y la regla alcanza a las deudas de los artículos 79 y 82, de importación y de exportación."
  citation: "art. 87.4 CAU"
  difficulty: 3
  tags:
  - "disposiciones comunes"
  - "lugar de nacimiento"
  - "cómputo"
# anchor: celex-32013r0952-art-83
- id: m03-l20-q0133
  prompt:
    es: "Según el artículo 83, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿nace una deuda aduanera por la introducción ilegal de billetes de euro falsos en el territorio aduanero de la Unión?"
  options:
  - id: a
    text:
      es: "Sí, porque la deuda nace incluso cuando se refiere a mercancías sujetas a prohibición de cualquier tipo."
  - id: b
    correct: true
    text:
      es: "No, porque no nace ninguna deuda aduanera por la introducción ilegal en el territorio aduanero de la Unión de moneda falsa."
  - id: c
    text:
      es: "Sí, pero solo si la moneda falsa se introduce mediante representación indirecta."
  - id: d
    text:
      es: "Sí, pero la deuda se limita al valor facial de los billetes falsos introducidos."
  explanation:
    es: "El artículo 83.2.a) excluye el nacimiento de deuda por la introducción ilegal de moneda falsa. La regla general del apartado 1, que hace nacer la deuda aunque haya prohibiciones, cede ante esa excepción. Tampoco depende de la representación indirecta, ni hay una deuda limitada al valor facial: el artículo no la prevé."
  citation: "art. 83.2 CAU"
  difficulty: 2
  tags:
  - "disposiciones comunes"
  - "excepciones"
