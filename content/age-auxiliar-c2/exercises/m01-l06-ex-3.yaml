# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q031
  prompt:
    es: "¿Qué órgano de las Naciones Unidas aprobó, el 25 de septiembre de 2015, la Agenda 2030 para el Desarrollo Sostenible y sus Objetivos de Desarrollo Sostenible?"
  options:
  - id: a
    correct: true
    text:
      es: "La Asamblea General de las Naciones Unidas."
  - id: b
    text:
      es: "El Consejo de Seguridad de las Naciones Unidas."
  - id: c
    text:
      es: "El Consejo Económico y Social de las Naciones Unidas."
  - id: d
    text:
      es: "La Secretaría General de las Naciones Unidas."
  explanation:
    es: "La Agenda 2030 es la Resolución 70/1, «aprobada por la Asamblea General el 25 de septiembre de 2015». El Consejo de Seguridad, el Consejo Económico y Social y la Secretaría General no la aprobaron. Los Objetivos son, por tanto, de las Naciones Unidas, no de la Unión Europea ni de la OCDE."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 1
  tags:
  - "órgano"
# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q032
  prompt:
    es: "¿En qué fecha aprobó la Asamblea General de las Naciones Unidas la Resolución 70/1, «Transformar nuestro mundo: la Agenda 2030 para el Desarrollo Sostenible»?"
  options:
  - id: a
    correct: true
    text:
      es: "El 25 de septiembre de 2015."
  - id: b
    text:
      es: "El 27 de septiembre de 2015."
  - id: c
    text:
      es: "El 21 de octubre de 2015."
  - id: d
    text:
      es: "El 14 de diciembre de 2017."
  explanation:
    es: "La Resolución se aprobó el 25 de septiembre de 2015. La cumbre siguió reunida hasta el 27, pero la aprobación es del día 25. El 21 de octubre de 2015 es la fecha de distribución del documento. El 14 de diciembre de 2017 es la de la Recomendación de la OCDE sobre Gobierno Abierto."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 1
  tags:
  - "fecha"
