  explanation:
    es: "El anexo II fija para el grupo 1 102,56 euros por alojamiento, 53,34 euros por manutención y 155,90 euros de dieta entera. Los 53,34 euros son la manutención del mismo grupo, los 155,90 euros su dieta entera y los 65,97 euros el alojamiento del grupo 2."
  citation: "anexo II RD 462/2002"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2002-10337-anexo-iv
- id: m01-l14-q378
  prompt:
    es: "¿Cuál de las siguientes es la cuantía por asistencia que fija el anexo IV del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, para el Presidente y el Secretario de un tribunal de categoría primera?"
  options:
  - id: a
    text:
      es: "42,83 euros."
  - id: b
    text:
      es: "39,78 euros."
  - id: c
    correct: true
    text:
      es: "45,89 euros."
  - id: d
    text:
      es: "36,72 euros."
  explanation:
    es: "El anexo IV fija en la categoría primera 45,89 euros para el Presidente y el Secretario y 42,83 euros para los vocales. Los 42,83 euros son la asistencia de los vocales de esa categoría y también la del Presidente y el Secretario de la categoría segunda. Los 39,78 euros corresponden a los vocales de la categoría segunda y al Presidente y el Secretario de la categoría tercera. Los 36,72 euros son la asistencia de los vocales de la categoría tercera."
  citation: "anexo IV RD 462/2002"
  difficulty: 2
  tags:
  - "cantidad"
