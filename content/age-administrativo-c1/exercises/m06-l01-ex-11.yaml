# anchor: fuente-ms-cuenta-mfa-html
- id: m06-l01-q349
  prompt:
    es: "Señale cuándo se pide por lo general el segundo factor de la autenticación multifactor, según la página de Microsoft:"
  options:
  - id: a
    correct: true
    text:
      es: "La primera vez en un dispositivo o aplicación, o tras cambiar la contraseña."
  - id: b
    text:
      es: "En cada inicio de sesión, sin ninguna excepción para el usuario del dispositivo."
  - id: c
    text:
      es: "Cada semana, aunque el usuario no cambie de dispositivo ni de contraseña."
  - id: d
    text:
      es: "Solo cuando se inicia sesión desde el trabajo o desde la escuela del usuario."
  explanation:
    es: "La página dice que por lo general el segundo factor «solo se usa la primera vez que inicia sesión en una aplicación o dispositivo, o la primera vez que inicia sesión después de cambiar la contraseña». No se pide en cada inicio de sesión ni cada semana, y la autenticación multifactor no es solo para el trabajo o la escuela."
  citation: "fuente: `ms-cuenta-mfa.html`; «¿Qué es la autenticación multifactor?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-cuenta-mfa-html
- id: m06-l01-q350
  prompt:
    es: "¿Con cuál de los siguientes nombres menciona la página de Microsoft, además de «autenticación multifactor», este mecanismo de seguridad de las cuentas?"
  options:
  - id: a
    text:
      es: "Autenticación básica."
  - id: b
    text:
      es: "Contraseña de un solo uso."
  - id: c
    correct: true
    text:
      es: "Verificación en dos pasos."
  - id: d
    text:
      es: "Firma electrónica."
  explanation:
    es: "La página dice que el mecanismo se llama «Verificación en dos pasos» o «Autenticación multifactor». El glosario del INCIBE define la autenticación básica como el esquema más simple, con nombre de usuario y contraseña, la contraseña de un solo uso como una contraseña válida para un solo uso y la firma electrónica como un conjunto de datos asociados a un documento electrónico."
  citation: "fuente: `ms-cuenta-mfa.html`; «¿Qué es la autenticación multifactor?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-cuenta-mfa-html
- id: m06-l01-q351
  prompt:
    es: "Según la página de Microsoft, ¿por qué no es una buena manera de autenticarse usar solo un nombre de usuario y una contraseña?"
  options:
  - id: a
    text:
      es: "Porque las contraseñas caducan cada 30 segundos y hay que renovarlas a mano cada vez."
  - id: b
    correct: true
    text:
      es: "Porque el nombre de usuario es fácil de descubrir y se eligen contraseñas simples o repetidas."
  - id: c
    text:
      es: "Porque el servicio no puede comprobar la contraseña que escribe el usuario al entrar."
  - id: d
    text:
      es: "Porque la contraseña se envía sin cifrar a todos los servicios en línea."
  explanation:
    es: "La página dice que «los nombres de usuario suelen ser fáciles de descubrir» y que las personas tienden a elegir contraseñas simples o la misma contraseña en muchos sitios diferentes. Los 30 segundos son los del número de Microsoft Authenticator, no los de la contraseña. Que el servicio no pueda comprobar la contraseña contradice la página, que dice que al iniciar sesión «le está demostrando al servicio que es quien dice ser». Y el envío sin cifrar a todos los servicios lo desmiente el glosario de INCIBE (incibe-glosario-ciberseguridad.pdf) sobre HTTPS: «Es utilizado por cualquier tipo de servicio que requiera el envío de datos personales o contraseñas», con el tráfico cifrado."
  citation: "fuente: `ms-cuenta-mfa.html`; «¿Qué es la autenticación multifactor?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q352
  prompt:
    es: "¿Qué objetivos tiene una actualización de seguridad en un dispositivo, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    text:
      es: "Únicamente añadir nuevas funcionalidades al software instalado en el dispositivo del usuario."
  - id: b
    text:
      es: "Solo identificar un tipo de malware en concreto mediante una base de datos."
  - id: c
    text:
      es: "Solo duplicar la información de un soporte a otro para poder recuperarla."
  - id: d
    correct: true
    text:
      es: "Corregir fallos de seguridad y de funcionamiento, y mejorar funciones y rendimiento."
  explanation:
    es: "El glosario define la actualización de seguridad como las modificaciones que se aplican en el software «con el objetivo de corregir fallos de seguridad, errores de funcionamiento o bien para dotar a los dispositivos de nuevas funcionabilidades, así como incorporar mejoras de rendimiento». Identificar tipos de malware es lo que hace la firma antivirus y duplicar información de un soporte a otro es la copia de seguridad."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Actualización de seguridad»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l01-q353
  prompt:
    es: "Según el glosario de ciberseguridad del INCIBE, un sinónimo de «actualización de seguridad», la modificación del software, es:"
  options:
  - id: a
    correct: true
    text:
      es: "Parches de seguridad."
  - id: b
    text:
      es: "Firmas antivirus."
  - id: c
    text:
      es: "Copias de seguridad."
  - id: d
    text:
      es: "Contraseñas predeterminadas."
  explanation:
    es: "El glosario da como sinónimo de la actualización de seguridad los «parches de seguridad». La firma antivirus es una entrada de la base de datos del antivirus, la copia de seguridad duplica información de un soporte a otro y las contraseñas predeterminadas son las asignadas por el fabricante."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Actualización de seguridad»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-update-html
- id: m06-l01-q354
  prompt:
    es: "¿Cómo descarga e instala Windows 11 las actualizaciones, según la página de preguntas frecuentes de Windows Update?"
  options:
  - id: a
    text:
      es: "Solo cuando el usuario las solicita desde Configuración o Windows Update."
  - id: b
    text:
      es: "Solo cuando el usuario conecta el dispositivo a una red doméstica."
  - id: c
    text:
      es: "Solo cuando el usuario reinicia el dispositivo cada día de la semana."
  - id: d
    correct: true
    text:
      es: "Automáticamente, para que el dispositivo sea seguro y esté actualizado."
  explanation:
    es: "La página dice que Windows 11 «descarga e instala actualizaciones automáticamente para asegurarse de que tu dispositivo sea seguro y esté actualizado». No espera a que el usuario las solicite, ni a una red doméstica, ni a un reinicio diario."
  citation: "fuente: `ms-win-update.html`; «Windows Update: Preguntas más frecuentes»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-update-html
- id: m06-l01-q355
  prompt:
    es: "En Windows 11, ¿qué ruta lleva a buscar actualizaciones manualmente, según la página de preguntas frecuentes de Windows Update?"
  options:
  - id: a
    text:
      es: "Inicio › Configuración › Cuentas › Windows Update"
  - id: b
    correct: true
    text:
      es: "Inicio › Configuración › Windows Update"
  - id: c
    text:
      es: "Inicio › Configuración › Sistema › Windows Update"
  - id: d
    text:
      es: "Inicio › Configuración › Seguridad de Windows › Windows Update"
  explanation:
    es: "La página dice que, para buscar actualizaciones manualmente, se selecciona Inicio, Configuración y Windows Update. Windows Update está directamente en Configuración, no dentro de Cuentas, Sistema ni Seguridad de Windows."
  citation: "fuente: `ms-win-update.html`; «Windows Update: Preguntas más frecuentes»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-update-html
- id: m06-l01-q356
  prompt:
    es: "En Windows 11, ¿qué opción de Windows Update permite detener temporalmente la descarga e instalación de las actualizaciones?"
  options:
  - id: a
    text:
      es: "Programar el reinicio."
  - id: b
    text:
      es: "Historial de actualizaciones."
  - id: c
    correct: true
    text:
      es: "Pausar actualizaciones."
  - id: d
    text:
      es: "Buscar actualizaciones."
  explanation:
    es: "La página dice que, en Windows 11, junto a «Pausar actualizaciones» se selecciona la duración de pausa que se prefiera. Programar el reinicio sirve para elegir un momento conveniente para reiniciar, no para detener la descarga. El historial de actualizaciones muestra las actualizaciones instaladas y cuándo se instalaron. Buscar actualizaciones comprueba manualmente si hay actualizaciones, no las detiene."
  citation: "fuente: `ms-win-update.html`; «Windows Update: Preguntas más frecuentes»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-update-html
- id: m06-l01-q358
  prompt:
    es: "En Windows 11, ¿qué opción de Windows Update permite elegir un momento conveniente para reiniciar el dispositivo e instalar una actualización?"
  options:
  - id: a
    text:
      es: "Pausar actualizaciones."
  - id: b
    correct: true
    text:
      es: "Programar el reinicio."
  - id: c
    text:
      es: "Desinstalar actualizaciones."
  - id: d
    text:
      es: "Ver el historial de actualizaciones."
  explanation:
    es: "La página dice que, para programar el reinicio, se selecciona «Programar el reinicio» y se elige un momento conveniente. Pausar actualizaciones detiene temporalmente la descarga e instalación, con la duración que se elija. Desinstalar actualizaciones quita una actualización ya instalada. El historial de actualizaciones muestra las actualizaciones instaladas y cuándo se instalaron."
  citation: "fuente: `ms-win-update.html`; «Windows Update: Preguntas más frecuentes»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-boe-a-2022-7191-ens-2024-11-06-pdf
- id: m06-l01-q363
  prompt:
    es: "El Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, se aplica con carácter general:"
  options:
  - id: a
    text:
      es: "solo a la Administración General del Estado."
  - id: b
    correct: true
    text:
      es: "a todo el sector público definido en la Ley 40/2015."
  - id: c
    text:
      es: "solo a las entidades del sector privado."
  - id: d
    text:
      es: "solo a los sistemas de información que tratan datos personales."
  explanation:
    es: "El Real Decreto dice que «es de aplicación a todo el sector público, en los términos en que este se define por el artículo 2 de la Ley 40/2015». No se limita a la Administración General del Estado ni a los sistemas con datos personales, y a las entidades privadas solo las alcanza cuando prestan servicios o proveen soluciones al sector público."
  citation: "fuente: `BOE-A-2022-7191_ens_2024-11-06.pdf`; «Artículo 2. Ámbito de aplicación.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2022-7191-art-26
- id: m06-l01-q364
  prompt:
    es: "Según el Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, ¿qué deben tener los sistemas para garantizar la continuidad de la actividad?"
  options:
  - id: a
    text:
      es: "Copias de seguridad, pero solo en los sistemas de categoría alta del organismo."
  - id: b
    text:
      es: "Mecanismos de continuidad de las operaciones, sin necesidad alguna de copias de seguridad."
  - id: c
    text:
      es: "Copias de seguridad, que cada usuario decide si conserva en su equipo."
  - id: d
    correct: true
    text:
      es: "Copias de seguridad y mecanismos de continuidad si se pierden los medios habituales."
  explanation:
    es: "El Real Decreto dice que «los sistemas dispondrán de copias de seguridad y se establecerán los mecanismos necesarios para garantizar la continuidad de las operaciones en caso de pérdida de los medios habituales». No limita las copias a una categoría, no las deja al criterio del usuario y las exige además de los mecanismos de continuidad."
  citation: "art. 26 ENS"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2022-7191-anexo-ii
- id: m06-l01-q365
  prompt:
    es: "Según el Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, ¿qué se requiere para que los usuarios de la organización accedan desde o a través de zonas no controladas?"
  options:
  - id: a
    correct: true
    text:
      es: "Un doble factor de autenticación, según los refuerzos R2, R3 o R4."
  - id: b
    text:
      es: "Una contraseña de complejidad mínima como único factor de autenticación."
  - id: c
    text:
      es: "Un registro de los accesos con éxito y de los fallidos del usuario."
  - id: d
    text:
      es: "Una renovación periódica de la contraseña del usuario de la organización."
  explanation:
    es: "El Real Decreto dice que, «para el acceso desde o a través de zonas no controladas se requerirá un doble factor de autenticación: R2, R3 o R4». La contraseña como único mecanismo se limita a accesos desde zonas controladas, y registrar los accesos o cambiar las credenciales con periodicidad son otros requisitos que no sustituyen al doble factor."
  citation: "anexo II, op.acc.6, ENS"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2022-7191-anexo-ii
- id: m06-l01-q367
  prompt:
    es: "Según el Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, ¿cuándo se emplea una contraseña como mecanismo de autenticación de los usuarios de la organización?"
  options:
  - id: a
    text:
      es: "Cuando el acceso se realiza desde Internet, una zona no controlada."
  - id: b
    correct: true
    text:
      es: "Cuando el acceso es desde zonas controladas y sin atravesar zonas no controladas."
  - id: c
    text:
      es: "Cuando el acceso atraviesa una zona no controlada, si el usuario es personal propio."
  - id: d
    text:
      es: "Cuando el acceso se realiza con un certificado cualificado en una tarjeta."
  explanation:
    es: "El Real Decreto dice que «se empleará una contraseña como mecanismo de autenticación cuando el acceso se realiza desde zonas controladas y sin atravesar zonas no controladas». Desde Internet, zona no controlada, y a través de zonas no controladas se requiere doble factor, y el certificado cualificado en soporte físico es otro refuerzo."
  citation: "anexo II, op.acc.6, ENS"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2022-7191-anexo-ii
- id: m06-l01-q368
  prompt:
    es: "Según el Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, ¿qué debe ocurrir cuando se supera el número de intentos de acceso permitidos?"
  options:
  - id: a
    text:
      es: "Se informa al usuario del motivo exacto del rechazo para que pueda corregirlo."
  - id: b
    text:
      es: "Se cambian automáticamente las credenciales del usuario tras el último intento."
  - id: c
    correct: true
    text:
      es: "Se bloquea el acceso y se exige una intervención específica para reactivar la cuenta."
  - id: d
    text:
      es: "El sistema permite seguir intentándolo, con una espera creciente entre cada intento del usuario."
  explanation:
    es: "El Real Decreto dice que el número de intentos será limitado, «bloqueando la oportunidad de acceso una vez superado tal número, y requiriendo una intervención específica para reactivar la cuenta». Si se rechaza, no se informa del motivo, y el cambio de credenciales sigue la periodicidad de la política de seguridad, no el exceso de intentos."
  citation: "anexo II, op.acc.6, ENS"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: boe-a-2022-7191-anexo-ii
- id: m06-l01-q369
  prompt:
    es: "Según el Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, ¿quién marca la periodicidad con la que se cambian las credenciales de los usuarios de la organización?"
  options:
  - id: a
    correct: true
    text:
      es: "La política de seguridad de la organización."
  - id: b
    text:
      es: "El propio usuario, cuando lo estime conveniente."
  - id: c
    text:
      es: "Las guías CCN-STIC, para cada sistema."
  - id: d
    text:
      es: "El fabricante del dispositivo de acceso."
  explanation:
    es: "El Real Decreto dice que «las credenciales se cambiarán con una periodicidad marcada por la política de seguridad de la organización». Las guías CCN-STIC desarrollan los mecanismos y calidades exigibles a cada tipo de factor de autenticación, no la periodicidad."
  citation: "anexo II, op.acc.6, ENS"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2022-7191-anexo-ii
- id: m06-l01-q370
  prompt:
    es: "Según el Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, ¿a qué personal se refiere la medida del mecanismo de autenticación de los usuarios de la organización?"
  options:
  - id: a
    text:
      es: "Solo al personal propio y estable del organismo, no al contratado."
  - id: b
    correct: true
    text:
      es: "Al personal del organismo, propio o contratado, estable o circunstancial."
  - id: c
    text:
      es: "Solo al personal contratado por una empresa externa al organismo."
  - id: d
    text:
      es: "A cualquier ciudadano que use los servicios electrónicos del propio organismo público."
  explanation:
    es: "El Real Decreto dice que la medida «se refiere a personal del organismo, propio o contratado, estable o circunstancial, que pueda tener acceso a información contenida en el sistema». Por eso no se limita al personal propio y estable, ni solo al contratado, ni alcanza a cualquier ciudadano."
  citation: "anexo II, op.acc.6, ENS"
  difficulty: 3
  tags:
  - "concepto"
