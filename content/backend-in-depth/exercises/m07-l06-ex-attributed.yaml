type: quiz
variants:
- id: m07-l06-qa01
  prompt:
    en: According to Microsoft in Communication in a microservice architecture, which statement about the two axes
      of communication types does the article make?
  options:
  - id: a
    text:
      en: Communication with a single receiver must be asynchronous
  - id: b
    correct: true
    text:
      en: Communication with multiple receivers must be asynchronous
  - id: c
    text:
      en: A request sent to multiple receivers must reach at least one of them
  - id: d
    text:
      en: HTTP is an asynchronous protocol when the client thread is not blocked
  explanation:
    en: Microsoft writes that communication with multiple receivers must be asynchronous. It writes that the most
      common type is single-receiver communication with a synchronous protocol such as HTTP/HTTPS, which contradicts
      the claim that single-receiver communication must be asynchronous. It writes that each request can be processed
      by zero to multiple receivers, which contradicts a guaranteed receiver. It writes that HTTP is a synchronous
      protocol whatever the client code does, which contradicts calling it asynchronous.
  citation: ms-communication-microservice-architecture#communication-types
- id: m07-l06-qa02
  prompt:
    en: According to Microsoft in Communication in a microservice architecture, what is request/response communication
      over HTTP especially well suited for in a microservice architecture?
  options:
  - id: a
    text:
      en: Delivering responses that arrive long after the request
  - id: b
    text:
      en: Communicating updates across multiple microservices
  - id: c
    text:
      en: Pushing content to connected clients as data appears
  - id: d
    correct: true
    text:
      en: Querying data for a real-time UI from client apps
  explanation:
    en: Microsoft writes that request/response communication is especially well suited for querying data for a real-time
      UI from client apps. It writes that delayed responses call for asynchronous communication based on messaging,
      which contradicts using it for responses that arrive long after the request. It writes that lightweight asynchronous
      messaging is used for communicating updates across multiple microservices, which contradicts using it for
      those updates. It writes that real-time push communication serves usually different purposes than REST, which
      contradicts using request/response for pushing content.
  citation: ms-communication-microservice-architecture#requestresponse-communication-with-http-and-rest; ms-communication-microservice-architecture#communication-in-a-microservice-architecture;
    ms-communication-microservice-architecture#push-and-real-time-communication-based-on-http
- id: m07-l06-qa03
  prompt:
    en: According to Microsoft in Communication in a microservice architecture, what does the article call the important
      point when integrating microservices?
  options:
  - id: a
    correct: true
    text:
      en: Integrating asynchronously while keeping microservices independent
  - id: b
    text:
      en: The asynchronous nature of the client thread's execution
  - id: c
    text:
      en: Choosing asynchronous messaging rather than synchronous HTTP
  - id: d
    text:
      en: Letting each microservice query the others synchronously for fresh data
  explanation:
    en: Microsoft writes that what is important is being able to integrate microservices asynchronously while maintaining
      their independence. It writes that neither the asynchronous nature of client thread execution nor of the selected
      protocol is the important point, which contradicts the client thread's execution. It writes that the rule
      does not mean using a specific protocol, which contradicts choosing messaging over HTTP. It writes that one
      should never depend on synchronous communication between microservices, not even for queries, which contradicts
      synchronous queries for fresh data.
  citation: ms-communication-microservice-architecture#communication-types; ms-communication-microservice-architecture#asynchronous-microservice-integration-enforces-microservices-autonomy
- id: m07-l06-qa04
  prompt:
    en: According to Microsoft in Communication in a microservice architecture, which statement about REST and the
      formats and styles used between microservices does the article make?
  options:
  - id: a
    correct: true
    text:
      en: REST is based on HTTP and embraces verbs like `GET`, `POST` and `PUT`
  - id: b
    text:
      en: Microservices are usually choreographed with WS-* protocols rather than REST
  - id: c
    text:
      en: A non-standard binary format is a sound choice for public services
  - id: d
    text:
      en: Swagger metadata stops tools from generating client stubs for a service
  explanation:
    en: Microsoft writes that REST is based on, and tightly coupled to, HTTP and embraces verbs like `GET`, `POST`
      and `PUT`. It writes that microservices are usually choreographed with REST rather than complex protocols
      such as WS-*, which contradicts WS-* as the usual choice. It writes that a non-standard binary format is probably
      not a good idea for publicly published services, which contradicts it as a sound public choice. It writes
      that Swagger metadata lets tools generate client stubs that discover and consume the service, which contradicts
      blocking such tools.
  citation: ms-communication-microservice-architecture#requestresponse-communication-with-http-and-rest; ms-communication-microservice-architecture#communication-in-a-microservice-architecture;
    ms-communication-microservice-architecture#communication-styles
- id: m07-l06-qa06
  prompt:
    en: According to James Lewis and Martin Fowler in Microservices, which statement about a number of synchronous
      calls between services and the platforms they cite does the article make?
  options:
  - id: a
    text:
      en: The Guardian's new platform allows several synchronous calls per user request
  - id: b
    text:
      en: Netflix's platform API redesign kept calls synchronous and managed the downtime
  - id: c
    correct: true
    text:
      en: Many synchronous calls make system downtime the product of component downtimes
  - id: d
    text:
      en: A monolith cannot be built to be as transparent as a microservice
  explanation:
    en: Lewis and Fowler write that with a number of synchronous calls the downtime of the system becomes the product
      of the downtimes of the individual components. They write that the Guardian's rule on its new platform is
      one synchronous call per user request, which contradicts several calls per request. They write that Netflix's
      platform API redesign has built asynchronicity into the API fabric, which contradicts keeping calls synchronous.
      They write that monoliths can be built to be as transparent as a microservice, which contradicts the claim
      that they cannot.
  citation: fowler-microservices#SynchronousCallsConsideredHarmful
