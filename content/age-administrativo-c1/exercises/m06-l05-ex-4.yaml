# anchor: fuente-ms-excel-formato-fecha-html
- id: m06-l05-q127
  prompt:
    es: "En Excel 365, ¿qué ocurre si se modifica en Personalizado el código de un formato de fecha integrado?"
  options:
  - id: a
    text:
      es: "El formato integrado queda modificado para todas las celdas del libro"
  - id: b
    correct: true
    text:
      es: "Los cambios solo se aplican al formato personalizado; el integrado no cambia"
  - id: c
    text:
      es: "Excel no permite ver el código de un formato integrado en Personalizado"
