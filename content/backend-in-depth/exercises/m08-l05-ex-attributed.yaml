type: quiz
variants:
- id: m08-l05-qa01
  prompt:
    en: According to Martin Kleppmann in How to do distributed locking, which statement about fencing tokens does
      the article make?
  options:
  - id: a
    text:
      en: A random unique value chosen by the client when it acquires the lock
  - id: b
    text:
      en: A counter kept on a single Redis node, which is enough on its own
  - id: c
    text:
      en: A value the lock service checks on every write to the storage service
  - id: d
    correct: true
    text:
      en: A number that increases every time a client acquires the lock
  explanation:
    en: Kleppmann writes that a fencing token is simply a number that increases every time a client acquires the
      lock. He writes that the unique random value Redlock uses does not provide the required monotonicity, which
      contradicts a random value chosen by the client. He writes that keeping a counter on one Redis node would
      not be sufficient because that node may fail, which contradicts a single-node counter being enough. He writes
      that the storage server must take an active role in checking tokens, which contradicts the lock service checking
      them.
  citation: kleppmann-distributed-locking#making-the-lock-safe-with-fencing
- id: m08-l05-qa02
  prompt:
    en: According to Martin Kleppmann in How to do distributed locking, which statement about Redlock and fencing
      tokens does the article make?
  options:
  - id: a
    correct: true
    text:
      en: Redlock has no facility for generating fencing tokens
  - id: b
    text:
      en: Counters kept on several Redis nodes would stay in sync
  - id: c
    text:
      en: Redlock would be safe to use were it otherwise perfect
  - id: d
    text:
      en: Redlock produces a number guaranteed to increase on each acquisition
  explanation:
    en: Kleppmann writes that Redlock does not have any facility for generating fencing tokens. He writes that keeping
      counters on several nodes would mean they go out of sync, which contradicts counters that stay in sync. He
      writes that even if the algorithm were otherwise perfect it would not be safe to use, which contradicts it
      being safe were it otherwise perfect. He writes that the algorithm does not produce any number guaranteed
      to increase every time a client acquires a lock, which contradicts producing one.
  citation: kleppmann-distributed-locking#making-the-lock-safe-with-fencing
- id: m08-l05-qa03
  prompt:
    en: According to Martin Kleppmann in How to do distributed locking, what does the article say about using locks
      merely for efficiency purposes and about the lock failing?
  options:
  - id: a
    text:
      en: A failed efficiency lock typically corrupts files or causes data loss
  - id: b
    text:
      en: Redlock is suitable when locking is important for correctness
  - id: c
    correct: true
    text:
      en: Redlock's cost and complexity are unnecessary for efficiency locks
  - id: d
    text:
      en: A single Redis instance makes it clear that locks are exact
  explanation:
    en: Kleppmann writes that for locks used merely for efficiency it is unnecessary to incur the cost and complexity
      of Redlock. He writes that if an efficiency lock fails and two nodes do the same work the result is a minor
      increase in cost, which contradicts corrupted files or data loss. He writes that he will argue Redlock is
      not suitable for locks that matter for correctness, which contradicts its suitability there. He writes that
      with a single Redis instance it is clear to everyone that the locks are approximate, which contradicts locks
      being exact.
  citation: kleppmann-distributed-locking#what-are-you-using-that-lock-for
- id: m08-l05-qa04
  prompt:
    en: According to Martin Kleppmann in Distributed Systems, which statement about the two-phase commit protocol
      does the lecture text make?
  options:
  - id: a
    text:
      en: A replica commits as soon as it replies ok to the prepare message
  - id: b
    correct: true
    text:
      en: The coordinator decides to commit if all nodes reply ok
  - id: c
    text:
      en: After a coordinator crash no transaction can remain in doubt
  - id: d
    text:
      en: An in-doubt transaction can decide on its own to commit or abort
  explanation:
    en: Kleppmann writes that if all nodes reply ok, the coordinator decides to commit. He writes that the replicas
      do not actually commit the transaction yet when they reply to the prepare message, which contradicts committing
      at that point. He writes that even with the decision written to stable storage there may be transactions prepared
      but not yet committed or aborted when the coordinator crashes, which contradicts none remaining in doubt.
      He writes that in-doubt transactions cannot unilaterally decide to commit or abort, which contradicts deciding
      on their own.
  citation: cam-concdissys-notes#p68
- id: m08-l05-qa05
  prompt:
    en: According to Martin Kleppmann in Distributed Systems, which statement about the coordinator's single point
      of failure in two-phase commit and about its alternatives does the lecture text make?
  options:
  - id: a
    correct: true
    text:
      en: A consensus algorithm can remove the coordinator as a single point of failure
  - id: b
    text:
      en: Two-phase commit is what ensures serializable isolation between transactions
  - id: c
    text:
      en: Three-phase commit is a practical fix because it assumes a realistic system model
  - id: d
    text:
      en: Paxos Commit counts every vote delivered, including repeats from the same replica
  explanation:
    en: Kleppmann writes that it is possible to avoid the single point of failure of the coordinator by using a
      consensus algorithm or a total order broadcast protocol. He writes that two-phase locking ensures serializable
      isolation while two-phase commit ensures atomic commitment, which contradicts two-phase commit providing isolation.
      He writes that three-phase commit assumes the unrealistic synchronous system model, which contradicts calling
      its model realistic. He writes that the fault-tolerant algorithm counts only the first vote from any given
      replica, which contradicts counting repeats.
  citation: cam-concdissys-notes#p68; cam-concdissys-notes#p67
