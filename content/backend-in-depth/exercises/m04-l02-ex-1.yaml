- id: m04-l02-q02
  prompt:
    en: In Kotlin, more than one instance of a data object can exist at runtime, for example when a library creates
      one by reflection. How should you compare data objects?
  options:
  - id: a
    correct: true
    text:
      en: Structurally with `==`, and never by reference with `===`
  - id: b
    text:
      en: By reference with `===`, because a data object is a singleton
  - id: c
    text:
      en: With a custom `equals` implementation that compares an identifier
  - id: d
    text:
      en: By comparing `hashCode()` values, which differ for each instance
  explanation:
    en: Data objects are compared only structurally with `==`, and never by reference with `===`. Reference comparison
      is wrong because the documentation says to compare data objects never by reference. A custom `equals` is wrong
      because you cannot provide a custom `equals` or `hashCode` implementation for a data object. Different hash
      codes are wrong because the generated `hashCode()` is consistent with `equals()`, so all runtime instances
      have the same hash code.
  citation: kotlin-docs-object-declarations#data-objects
  extract:
    en: Make sure that you only compare data objects structurally (using the == operator) and never by reference
      (using the === operator).
- id: m04-l02-q03
  prompt:
    en: Which statement about an inline class, declared with the `value` modifier in Kotlin, is correct?
  options:
  - id: a
    correct: true
    text:
      en: It has no identity and can only hold values
  - id: b
    text:
      en: It has an identity, so two wrappers of the same value are different objects
  - id: c
    text:
      en: It is represented at runtime by an instance with a field for each property
  - id: d
    text:
      en: It can hold any number of properties initialized in the primary constructor
  explanation:
    en: Inline classes do not have an identity and can only hold values. Having an identity is wrong because inline
      classes do not have an identity. A full instance is wrong because at runtime the instances are represented
      using the single property. Any number of properties is wrong because an inline class must have a single property
      initialized in the primary constructor.
  citation: kotlin-docs-inline-classes#inline-classes.md
  extract:
    en: They don't have an identity and can only hold values.
- id: m04-l02-q04
  prompt:
    en: In Kotlin, a `when` that uses guard conditions has no `else` branch. What does the compiler require when
      this `when` is an expression and not a statement?
  options:
  - id: a
    text:
      en: It requires nothing, because when no condition matches, no code is run
  - id: b
    correct: true
    text:
      en: It requires that every possible case is handled
  - id: c
    text:
      en: It requires the conditions of each branch to be separated by commas
  - id: d
    text:
      en: It requires the `when` to have no subject
  explanation:
    en: Unlike statements, `when` expressions must cover all cases. Running no code is wrong because it describes
      `when` statements, which do not need to cover all cases. Comma-separated conditions are wrong because you
      cannot use guard conditions when you have multiple conditions separated by a comma. Having no subject is wrong
      because you can use guard conditions with `when` as long as it has a subject.
  citation: kotlin-docs-control-flow#guard-conditions-in-when-expressions
  extract:
    en: Unlike statements, when expressions must cover all cases.
- id: m04-l02-q06
  prompt:
    en: Which Kotlin scope function makes the context object available as an argument (`it`) and returns the context
      object itself, not the lambda result?
  options:
  - id: a
    text:
      en: '`let`'
  - id: b
    text:
      en: '`run`'
  - id: c
    text:
      en: '`apply`'
  - id: d
    correct: true
    text:
      en: '`also`'
  explanation:
    en: '`also` has the context object as `it` and returns the object itself. `let` is wrong because its return
      value is the lambda result. `run` is wrong because its context object is available as a receiver (`this`)
      and its return value is the lambda result. `apply` is wrong because its context object is available as a receiver
      (`this`), not as an argument.'
  citation: kotlin-docs-scope-functions#also
  extract:
    en: The return value is the object itself.
- id: m04-l02-q08
  prompt:
    en: By default, how does a Kotlin `lazy` property compute its value when several threads read it for the first
      time at the same time?
  options:
  - id: a
    text:
      en: It is computed once in each thread, so each thread keeps its own value
  - id: b
    correct: true
    text:
      en: It is computed in only one thread, and all threads see the same value
  - id: c
    text:
      en: It is computed without thread-safety guarantees, as with `LazyThreadSafetyMode.NONE`
  - id: d
    text:
      en: It may be computed by several threads at once, as with `LazyThreadSafetyMode.PUBLICATION`
  explanation:
    en: By default, the evaluation of lazy properties is synchronized, so the value is computed in only one thread.
      Computing it per thread is wrong because the evaluation is synchronized and all threads will see the same
      value. No guarantees is wrong because `LazyThreadSafetyMode.NONE` is a mode you choose when initialization
      always happens in the same thread, not the default. Simultaneous execution is wrong because `LazyThreadSafetyMode.PUBLICATION`
      has to be passed to `lazy()` to allow multiple threads to execute the initializer.
  citation: kotlin-docs-delegated-properties#lazy-properties
  extract:
    en: 'By default, the evaluation of lazy properties is synchronized: the value is computed only in one thread,
      but all threads will see the same value.'
- id: m04-l02-q09
  prompt:
    en: Which Java feature, added by a JEP, restricts which other classes or interfaces may extend or implement
      a class or interface?
  options:
  - id: a
    text:
      en: Records
  - id: b
    text:
      en: Record patterns
  - id: c
    correct: true
    text:
      en: Sealed classes and interfaces
  - id: d
    text:
      en: Pattern matching for `switch`
  explanation:
    en: Sealed classes and interfaces restrict which other classes or interfaces may extend or implement them. Records
      are wrong because they are classes that act as transparent carriers for immutable data. Record patterns are
      wrong because they deconstruct record values. Pattern matching for `switch` is wrong because it allows an
      expression to be tested against a number of patterns, each with a specific action.
  citation: jep-409#Summary
- id: m04-l02-q10
