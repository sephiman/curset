# Generated by docs/backend-verification/s2/tools/build_quiz.py from m10-l04.questions.json.
type: quiz
variants:
- id: m10-l04-q03
  prompt:
    en: A team plans the authorization of several MCP servers that use different transports. Which statement about
      authorization in the MCP authorization specification is correct for these implementations?
  options:
  - id: a
    text:
      en: Authorization is mandatory for every MCP implementation, whatever its transport
  - id: b
    correct: true
    text:
      en: Authorization is optional for MCP implementations
  - id: c
    text:
      en: An implementation with an STDIO transport should follow the specification instead of reading credentials
        from the environment
  - id: d
    text:
      en: An implementation with an alternative transport may skip established security practices for its protocol
  explanation:
    en: Authorization is optional for MCP implementations. A mandatory requirement for every implementation is ruled
      out because the specification marks authorization as OPTIONAL. Following the specification over STDIO is ruled
      out because an STDIO implementation should not follow it and should retrieve credentials from the environment.
      Skipping security practices on an alternative transport is ruled out because such implementations MUST follow
      established security best practices for their protocol.
  citation: mcp-authorization#protocol-requirements
  extract:
    en: Authorization is OPTIONAL for MCP implementations.
- id: m10-l04-q05
  prompt:
    en: An MCP proxy server connects clients to a third-party API through OAuth. Which behaviour does the MCP security
      best practices guidance require of the proxy server?
  options:
  - id: a
    text:
      en: It compares `redirect_uri` with the registered URI using wildcard patterns that allow subdomains
  - id: b
    text:
      en: It sets the consent cookie before showing the consent screen so the callback can be validated
  - id: c
    text:
      en: It keeps one `state` value and reuses it across authorization requests for a day
  - id: d
    correct: true
    text:
      en: It checks its registry of approved `client_id` values before starting the third-party authorization flow
  explanation:
    en: The proxy checks its registry of approved `client_id` values before initiating the third-party authorization
      flow. Wildcard matching of `redirect_uri` is ruled out because the comparison uses exact string matching,
      not pattern matching or wildcards. Setting the consent cookie before the consent screen is ruled out because
      the cookie or session with the `state` value MUST NOT be set until the user has approved consent. Reusing
      one `state` value for a day is ruled out because `state` values are single-use and have a short expiration
      time.
  citation: mcp-security-best-practices#required-protections
  extract:
    en: Check this registry before initiating the third-party authorization flow
- id: m10-l04-q06
  prompt:
    en: An MCP proxy server tracks consent decisions with a cookie. Which statement about that consent cookie and
      consent page is correct under the MCP security best practices?
  options:
  - id: a
    correct: true
    text:
      en: The cookie name uses the `__Host-` prefix
  - id: b
    text:
      en: The cookie binds to the user only, without naming the specific `client_id`
  - id: c
    text:
      en: The cookie is marked `SameSite=None` so that other sites can read it
  - id: d
    text:
      en: The consent page may be framed by any origin to support embedded flows
  explanation:
    en: 'The cookie name uses the `__Host-` prefix. Binding to the user only is ruled out because the cookie must
      bind to the specific `client_id`, not just to “user has consented”. A `SameSite=None` cookie is ruled out
      because the cookie must set the `Secure`, `HttpOnly` and `SameSite=Lax` attributes. Framing by any origin
      is ruled out because the consent page must prevent iframing through `frame-ancestors` or `X-Frame-Options:
      DENY`.'
  citation: mcp-security-best-practices#required-protections
  extract:
    en: Use __Host- prefix for cookie names
- id: m10-l04-q07
  prompt:
    en: The MCP tools specification lists security considerations for servers and for clients. Which statement about
      those duties is correct for an MCP server that exposes tools?
  options:
  - id: a
    text:
      en: The server may leave the validation of tool inputs to the client
  - id: b
    correct: true
    text:
      en: The server must rate limit tool invocations
  - id: c
    text:
      en: The server returns tool outputs to the client without sanitizing them
  - id: d
    text:
      en: The server skips access controls when the client is trusted
  explanation:
    en: The server must rate limit tool invocations. Leaving input validation to the client is ruled out because
      servers MUST validate all tool inputs. Returning outputs unsanitized is ruled out because servers MUST sanitize
      tool outputs. Skipping access controls for a trusted client is ruled out because servers MUST implement proper
      access controls.
  citation: mcp-tools#security-considerations
  extract:
    en: Rate limit tool invocations
- id: m10-l04-q08
  prompt:
    en: OWASP guidance for LLM02:2025 Sensitive Information Disclosure describes how an LLM application can reduce
      the exposure of sensitive data. Which statement about that guidance is correct?
  options:
  - id: a
    correct: true
    text:
      en: Access to sensitive data is limited by the principle of least privilege
  - id: b
    text:
      en: System prompt restrictions on returned data types are always honored by the model
  - id: c
    text:
      en: Sensitive information in an LLM application is limited to personal identifiable information
  - id: d
    text:
      en: Users cannot be offered a way to opt out of having their data used for training
  explanation:
    en: Access to sensitive data is limited by the principle of least privilege. Always-honored system prompt restrictions
      are ruled out because such restrictions may not always be honored and could be bypassed via prompt injection.
      A scope limited to personal identifiable information is ruled out because sensitive information also includes
      financial details, health records, confidential business data, security credentials and legal documents. Denying
      users an opt-out is ruled out because application owners should provide Terms of Use policies that allow users
      to opt out of training.
  citation: owasp-llm-sensitive-disclosure#1-enforce-strict-access-controls; owasp-llm-sensitive-disclosure#main
  extract:
    en: Limit access to sensitive data based on the principle of least privilege.
- id: m10-l04-q09
  prompt:
    en: OWASP describes indirect prompt injection in its LLM Top 10. Which statement about indirect prompt injection
      and its prevention is correct?
  options:
  - id: a
    text:
      en: Its impact depends only on the model, not on the business context or the agency given to it
  - id: b
    text:
      en: It affects text only, because other modalities cannot carry instructions to the model
  - id: c
    text:
      en: Input filtering is a fool-proof method of prevention that removes the risk
  - id: d
    correct: true
    text:
      en: It occurs when an LLM accepts input from external sources such as websites or files
  explanation:
    en: Indirect prompt injection occurs when an LLM accepts input from external sources such as websites or files.
      An impact that depends only on the model is ruled out because it is largely dependent on both the business
      context and the agency with which the model is architected. A text-only risk is ruled out because malicious
      actors could hide instructions in images that accompany benign text. A fool-proof input filter is ruled out
      because it is unclear whether fool-proof methods of prevention exist.
  citation: owasp-llm-top10-prompt-injection#indirect-prompt-injections
  extract:
    en: Indirect prompt injections occur when an LLM accepts input from external sources, such as websites or files.
- id: m10-l04-q10
  prompt:
    en: An LLM application handles sensitive customer data. Which practice follows the OWASP guidance on prompt
      injection and sensitive information disclosure for such an application?
  options:
  - id: a
    text:
      en: Relying on system prompt restrictions as the control that stops disclosure
  - id: b
    text:
      en: Giving the model broad read access so that it can answer any question
  - id: c
    correct: true
    text:
      en: Running penetration tests that treat the model as an untrusted user
  - id: d
    text:
      en: Skipping data sanitization because user data never reaches the training model
  explanation:
    en: Running penetration tests that treat the model as an untrusted user tests trust boundaries and access controls.
      Relying on system prompt restrictions is ruled out because such restrictions could be bypassed via prompt
      injection or other methods. Broad read access is ruled out because only data necessary for the specific user
      or process should be granted. Skipping data sanitization is ruled out because LLM applications should perform
      adequate data sanitization to prevent user data from entering the training model.
  citation: owasp-llm-top10-prompt-injection#7-conduct-adversarial-testing-and-attack-simulations
  extract:
    en: Perform regular penetration testing and breach simulations, treating the model as an untrusted user to test
      the effectiveness of trust boundaries and access controls.
- id: m10-l04-q11
  prompt:
    en: Which statement about the `scopes_supported` field of the Protected Resource Metadata in the MCP authorization
      specification is correct?
  options:
  - id: a
    text:
      en: Servers must list every dynamically issued scope in it
  - id: b
    correct: true
    text:
      en: It represents the minimal set of scopes necessary for basic functionality
  - id: c
    text:
      en: Clients may assume that the challenged scopes are always a subset of it
  - id: d
    text:
      en: Clients prefer it over the `scope` parameter of the `401` challenge
  explanation:
    en: The `scopes_supported` field is intended to represent the minimal set of scopes necessary for basic functionality.
      Listing every dynamically issued scope is ruled out because servers are not required to surface every dynamically
      issued scope through `scopes_supported`. Assuming a subset is ruled out because clients MUST NOT assume any
      particular set relationship between the challenged scope set and `scopes_supported`. Preferring it to the
      challenge is ruled out because the first source of scopes is the `scope` parameter from the initial `WWW-Authenticate`
      header in the `401` response.
  citation: mcp-authorization#scope-selection-strategy
  extract:
    en: The scopes_supported field is intended to represent the minimal set of scopes necessary for basic functionality
- id: m10-l04-q13
  prompt:
    en: Which duty does the MCP tools specification give to clients that call the tools of an MCP server?
  options:
  - id: a
    text:
      en: Hiding tool inputs from the user to avoid confirmation fatigue
  - id: b
    text:
      en: Calling tools without timeouts so that long operations finish
  - id: c
    correct: true
    text:
      en: Validating tool results before passing them to the LLM
  - id: d
    text:
      en: Asking for user confirmation only on non-sensitive operations
  explanation:
    en: Clients validate tool results before passing them to the LLM. Hiding tool inputs is ruled out because clients
      should show tool inputs to the user before calling the server. Calling without timeouts is ruled out because
      clients should implement timeouts for tool calls. Confirming only non-sensitive operations is ruled out because
      clients should prompt for user confirmation on sensitive operations.
  citation: mcp-tools#security-considerations
  extract:
    en: Validate tool results before passing to LLM
- id: m10-l04-q14
  prompt:
    en: In a multi-tenant environment, several groups of users share one vector database behind an LLM application.
      Which measure does OWASP LLM08 give against one group's embeddings being retrieved for another group's queries?
  options:
  - id: a
    correct: true
    text:
      en: Implement a permission-aware vector database that restricts access so that only authorized groups reach
        their own information
  - id: b
    text:
      en: Keep the embeddings of every group in one shared dataset without partitioning, so retrieval covers all
        groups
  - id: c
    text:
      en: Apply only coarse access controls to the application and leave the vector store itself open to every group
  - id: d
    text:
      en: Let queries from any group retrieve other groups' embeddings, since the LLM only uses the retrieved text
        as context
  explanation:
    en: OWASP gives a permission-aware vector database that restricts access so that only authorized groups can
      access their specific information. Keeping every group in one unpartitioned dataset is ruled out because the
      datasets need strict logical and access partitioning between different groups of users. Coarse controls with
      an open vector store are ruled out because OWASP asks for fine-grained access controls and permission-aware
      vector and embedding stores. Open retrieval across groups is ruled out because embeddings retrieved for another
      group's queries are potentially leaking sensitive business information.
  citation: owasp-llm08-vector-embedding#scenario-2-access-control--data-leakage-risk-by-combining-data-with-different-access-restrictions;
    owasp-llm08-vector-embedding#1-permission-and-access-control
