# anchor: boe-a-2005-14803-art-46
- id: m03-l09-q0119
  prompt:
    es: "Si el solicitante no atiende el requerimiento de subsanación en el plazo señalado, conforme al artículo 46.6 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre el efecto en su solicitud de aplazamiento o fraccionamiento:"
  options:
  - id: a
    correct: true
    text:
      es: "Se tendrá por no presentada la solicitud y se archivará sin más trámite."
  - id: b
    text:
      es: "Se denegará la solicitud mediante resolución motivada del órgano competente."
  - id: c
    text:
      es: "Se inadmitirá la solicitud, y contra el acuerdo cabrá reclamación económico-administrativa."
  - id: d
    text:
      es: "Se concederá el aplazamiento, pero con la garantía máxima que exija el reglamento."
  explanation:
    es: "Si no se atiende el requerimiento, la solicitud se tiene por no presentada y se archiva sin más trámite (artículo 46.6). La denegación motivada supone una solicitud admitida a trámite. La inadmisión se funda en causas distintas, las del artículo 47. No se concede el aplazamiento por la falta de respuesta."
  citation: "art. 46.6 RGR"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "subsanación"
# anchor: boe-a-2005-14803-art-47
- id: m03-l09-q0120
  prompt:
    es: "Según el artículo 47.1.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, serán inadmitidas las solicitudes de aplazamiento y fraccionamiento cuando la deuda deba ser declarada mediante autoliquidación y esta última:"
  options:
  - id: a
    text:
      es: "No haya sido objeto de ingreso con anterioridad a la presentación de la solicitud."
  - id: b
    text:
      es: "Haya sido objeto de presentación fuera del plazo del tributo, aunque sea conjuntamente."
  - id: c
    correct: true
    text:
      es: "No haya sido objeto de presentación con anterioridad o conjuntamente con la solicitud."
  - id: d
    text:
      es: "No haya sido objeto de aceptación expresa por la Administración antes de resolver."
  explanation:
    es: "La solicitud se inadmite cuando la autoliquidación no se ha presentado antes de la solicitud o con ella (artículo 47.1.a). No hace falta haber ingresado antes. Presentar la autoliquidación fuera de plazo no es causa de inadmisión si va con la solicitud. Tampoco se exige una aceptación expresa de la Administración."
  citation: "art. 47.1 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "inadmisión"
# anchor: boe-a-2005-14803-art-47
- id: m03-l09-q0121
  prompt:
    es: "De acuerdo con el artículo 47.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la presentación de solicitudes reiterativas de otras anteriores que hayan sido objeto de denegación previa implicará su inadmisión cuando:"
  options:
  - id: a
    text:
      es: "Se presenten transcurridos más de seis meses desde la denegación de la anterior."
  - id: b
    correct: true
    text:
      es: "No contengan modificación sustancial respecto de la solicitud previamente denegada."
  - id: c
    text:
      es: "Las presente un representante distinto del que presentó la solicitud denegada."
  - id: d
    text:
      es: "Ofrezcan una garantía de naturaleza distinta de la que ofreció la solicitud denegada."
  explanation:
    es: "La solicitud reiterativa se inadmite cuando no contiene modificación sustancial respecto de la denegada, y en particular cuando su finalidad es dilatar, dificultar o impedir la gestión recaudatoria (artículo 47.2). El plazo de seis meses y el cambio de representante no figuran en el artículo. Ofrecer otra garantía sí puede ser una modificación sustancial."
  citation: "art. 47.2 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "inadmisión"
# anchor: boe-a-2005-14803-art-47
- id: m03-l09-q0122
  prompt:
    es: "Conforme al artículo 47.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, la inadmisión de una solicitud de aplazamiento o fraccionamiento implicará que:"
  options:
  - id: a
    correct: true
    text:
      es: "La solicitud se tenga por no presentada a todos los efectos."
  - id: b
    text:
      es: "La solicitud se tenga por no presentada solo a efectos de intereses."
  - id: c
    text:
      es: "La solicitud se tenga por denegada, con apertura de plazo de ingreso."
  - id: d
    text:
      es: "La solicitud se tenga por desistida, y la Administración archive el expediente."
  explanation:
    es: "La inadmisión implica que la solicitud se tenga por no presentada a todos los efectos (artículo 47.3). Limitarlo a los intereses, equipararla a una denegación o a un desistimiento no coincide con el texto."
  citation: "art. 47.3 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "inadmisión"
# anchor: boe-a-2003-23186-art-65
- id: m03-l09-q0126
  prompt:
    es: "De acuerdo con el artículo 65.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las solicitudes de aplazamiento o fraccionamiento en período ejecutivo podrán presentarse:"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el momento en que se notifique al obligado el acuerdo de enajenación de los bienes embargados."
  - id: b
    text:
      es: "Hasta el momento en que se notifique al obligado la providencia de apremio."
  - id: c
    text:
      es: "Hasta el momento en que se practique el embargo de los bienes del obligado."
  - id: d
    text:
      es: "Hasta el momento en que se dicte la diligencia de embargo de cuentas bancarias."
  explanation:
    es: "En período ejecutivo la solicitud puede presentarse hasta la notificación del acuerdo de enajenación de los bienes embargados (artículo 65.5). Ni la providencia de apremio, ni el embargo, ni la diligencia sobre cuentas marcan ese límite."
  citation: "art. 65.5 LGT"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "efectos de la solicitud"
# anchor: boe-a-2003-23186-art-65
- id: m03-l09-q0127
  prompt:
    es: "Durante la tramitación de un aplazamiento o fraccionamiento solicitado en período ejecutivo, conforme al artículo 65.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "La Administración debe suspender todo el procedimiento de apremio hasta que se resuelva la solicitud."
  - id: b
    text:
      es: "La Administración puede enajenar los bienes embargados, sin esperar a la resolución."
  - id: c
    text:
      es: "La Administración no puede iniciar el procedimiento de apremio, aunque pueda continuar el ya iniciado."
  - id: d
    correct: true
    text:
      es: "La Administración puede iniciar o continuar el procedimiento de apremio, pero debe suspender la enajenación de los bienes embargados."
  explanation:
    es: "La Administración puede iniciar o continuar el apremio durante la tramitación, pero debe suspender las actuaciones de enajenación de los bienes embargados hasta la notificación de la resolución denegatoria (artículo 65.5). No hay suspensión total del apremio. La enajenación sí queda suspendida. El inicio del apremio no está vedado."
  citation: "art. 65.5 LGT"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "efectos de la solicitud"
# anchor: boe-a-2003-23186-art-65
- id: m03-l09-q0128
  prompt:
    es: "Conforme al artículo 65.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las deudas aplazadas o fraccionadas deberán garantizarse:"
  options:
  - id: a
    text:
      es: "En todo caso, mediante aval solidario de una entidad de crédito."
  - id: b
    correct: true
    text:
      es: "En los términos previstos en el artículo 82 de la Ley y en la normativa recaudatoria."
  - id: c
    text:
      es: "Solo cuando su importe supere el límite exento fijado por orden ministerial."
  - id: d
    text:
      es: "Mediante la anotación preventiva de embargo sobre los bienes del obligado."
  explanation:
    es: "Las deudas aplazadas o fraccionadas se garantizan en los términos del artículo 82 de la Ley y de la normativa recaudatoria (artículo 65.3). El aval no es la única garantía posible. El límite exento es una dispensa, no la regla general. La anotación preventiva de embargo no es la garantía que prevé el precepto."
  citation: "art. 65.3 LGT"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "garantías"
# anchor: boe-a-2003-23186-art-82
- id: m03-l09-q0129
  prompt:
    es: "De acuerdo con el artículo 82.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, para garantizar los aplazamientos o fraccionamientos la Administración tributaria podrá exigir que se constituya a su favor:"
  options:
  - id: a
    text:
      es: "Hipoteca sobre bienes inmuebles del obligado o prenda sobre sus bienes muebles."
  - id: b
    text:
      es: "Fianza personal y solidaria de dos personas con solvencia suficiente."
  - id: c
    text:
      es: "Depósito en efectivo en la Caja General de Depósitos por el importe de la deuda."
  - id: d
    correct: true
    text:
      es: "Aval solidario de entidad de crédito o sociedad de garantía recíproca o certificado de seguro de caución."
  explanation:
    es: "La garantía que puede exigirse en primer lugar es el aval solidario de entidad de crédito o sociedad de garantía recíproca, o el certificado de seguro de caución (artículo 82.1). La hipoteca, la prenda y la fianza son subsidiarias, solo si se justifica que no es posible obtener aquel aval o certificado o que su aportación compromete gravemente la viabilidad de la actividad. El depósito en efectivo no figura en el artículo."
  citation: "art. 82.1 LGT"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "garantías"
# anchor: boe-a-2003-23186-art-82
- id: m03-l09-q0130
  prompt:
    es: "Según el artículo 82.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué garantías puede admitir la Administración si se justifica que es imposible obtener aval o certificado de seguro de caución, o que aportarlos compromete gravemente la viabilidad de la actividad económica?"
  options:
  - id: a
    text:
      es: "Ninguna, porque en ese caso debe dispensar la garantía por completo."
  - id: b
    correct: true
    text:
      es: "Hipoteca, prenda, fianza personal y solidaria u otra que se estime suficiente."
  - id: c
    text:
      es: "Solo el depósito del importe de la deuda en la Caja General de Depósitos."
  - id: d
    text:
      es: "Solo la hipoteca de un inmueble libre de cargas por el doble de la deuda aplazada."
  explanation:
    es: "Cuando se justifica que no es posible obtener el aval o que su aportación compromete gravemente la viabilidad de la actividad, la Administración puede admitir hipoteca, prenda, fianza personal y solidaria u otra garantía que estime suficiente (artículo 82.1). No debe dispensar sin más la garantía. La lista no se limita al depósito ni a una hipoteca por el doble de la deuda."
  citation: "art. 82.1 LGT"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "garantías"
# anchor: boe-a-2003-23186-art-82
- id: m03-l09-q0131
  prompt:
    es: "Según el artículo 82.2.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, podrá dispensarse total o parcialmente al obligado tributario de la constitución de garantías cuando las deudas tributarias sean:"
  options:
  - id: a
    correct: true
    text:
      es: "De cuantía inferior a la que se fije en la normativa tributaria."
  - id: b
    text:
      es: "De cuantía inferior a 1.000 euros, sin que la normativa pueda fijar otra."
  - id: c
    text:
      es: "De cuantía inferior a la mitad de los ingresos anuales del obligado."
  - id: d
    text:
      es: "De cuantía superior a la que se fije en la normativa tributaria."
  explanation:
    es: "La dispensa de garantías procede, entre otros casos, cuando la deuda es de cuantía inferior a la que fije la normativa tributaria (artículo 82.2.a). La ley no fija una cifra de 1.000 euros, ni la vincula a los ingresos del obligado. Una cuantía superior no justifica la dispensa."
  citation: "art. 82.2 LGT"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "garantías"
  - "dispensa"
# anchor: boe-a-2023-8119-art-2
- id: m03-l09-q0132
  prompt:
    es: "Sobre la exención de garantías, conforme al artículo 2 de la Orden HFP/311/2023, de 28 de marzo, por la que se eleva el límite exento de la obligación de aportar garantía en las solicitudes de aplazamiento o fraccionamiento a 50.000 euros, señale la respuesta CORRECTA:"
  options:
  - id: a
    text:
      es: "Para determinar el importe de la deuda solo se computa la deuda a la que se refiere la solicitud, con independencia de otras."
  - id: b
    text:
      es: "La exención solo se aplica a las deudas en período voluntario, y las del período ejecutivo siempre exigen garantía."
  - id: c
    correct: true
    text:
      es: "Para determinar el importe de la deuda se acumulan, en el momento de la solicitud, las deudas de la propia solicitud y otras del mismo deudor pendientes de resolver."
  - id: d
    text:
      es: "El importe se calcula al acabar la tramitación de la solicitud, sumando todas las deudas que el obligado tenga con la Administración."
  explanation:
    es: "Se acumulan, en el momento de la solicitud, las deudas de la propia solicitud, las demás del mismo deudor para las que se haya solicitado y no resuelto el aplazamiento o fraccionamiento, y los vencimientos pendientes de las deudas aplazadas, salvo que estén garantizadas (artículo 2). No se computa solo la deuda de la solicitud. La exención rige en período voluntario y ejecutivo. El cálculo se hace en el momento de la solicitud, no al final."
  citation: "art. 2 Orden HFP/311/2023"
  difficulty: 3
  tags:
  - "aplazamiento"
  - "garantías"
  - "límite exento"
# anchor: boe-a-2023-8119-art-2
- id: m03-l09-q0133
  prompt:
    es: "Aurelio Cabrera solicita el aplazamiento de una deuda de 30.000 euros, y tiene ya otra solicitud de aplazamiento de 15.000 euros sin resolver y vencimientos pendientes de 10.000 euros de una deuda aplazada sin garantizar. Conforme al artículo 2 de la Orden HFP/311/2023, de 28 de marzo, por la que se eleva el límite exento de la obligación de aportar garantía en las solicitudes de aplazamiento o fraccionamiento a 50.000 euros, ¿cuánto se acumula, en el momento de la solicitud, para determinar si queda exento de garantía?"
  options:
  - id: a
    text:
      es: "30.000 euros, porque solo se computa la deuda de la propia solicitud."
  - id: b
    text:
      es: "45.000 euros, porque no se suman los vencimientos pendientes de la deuda aplazada."
  - id: c
    text:
      es: "40.000 euros, porque no se suma la otra solicitud pendiente de resolver."
  - id: d
    correct: true
    text:
      es: "55.000 euros, porque se suman la deuda de la solicitud, la solicitud sin resolver y los vencimientos sin garantizar."
  explanation:
    es: "Se suman la deuda de la propia solicitud (30.000), las otras del mismo deudor con aplazamiento pedido y sin resolver (15.000) y los vencimientos pendientes de las aplazadas no garantizadas (10.000): 55.000 euros (artículo 2). Computar solo la propia deuda, o dejar fuera los vencimientos o la otra solicitud, da 30.000, 45.000 o 40.000 euros, y la norma obliga a sumar los tres conceptos."
  citation: "art. 2 Orden HFP/311/2023"
  difficulty: 3
  tags:
  - "aplazamiento"
  - "garantías"
  - "límite exento"
  - "cómputo"
# anchor: boe-a-2023-8119-dd-unica
- id: m03-l09-q0135
  prompt:
    es: "De acuerdo con la disposición derogatoria única de la Orden HFP/311/2023, de 28 de marzo, por la que se eleva el límite exento de la obligación de aportar garantía en las solicitudes de aplazamiento o fraccionamiento a 50.000 euros, esta orden derogó la Orden HAP/2178/2015, de 9 de octubre, que fijaba ese límite exento en:"
  options:
  - id: a
    text:
      es: "Un límite de 18.000 euros."
  - id: b
    text:
      es: "Un límite de 24.000 euros."
  - id: c
    correct: true
    text:
      es: "Un límite de 30.000 euros."
  - id: d
    text:
      es: "Un límite de 40.000 euros."
  explanation:
    es: "La orden derogó la Orden HAP/2178/2015, que fijaba el límite exento en 30.000 euros. Los otros importes no corresponden a ese límite anterior."
  citation: "disposición derogatoria única Orden HFP/311/2023"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "garantías"
  - "límite exento"
# anchor: boe-a-2023-8119-df-unica
- id: m03-l09-q0136
  prompt:
    es: "Conforme a la disposición final única de la Orden HFP/311/2023, de 28 de marzo, por la que se eleva el límite exento de la obligación de aportar garantía en las solicitudes de aplazamiento o fraccionamiento a 50.000 euros, esta orden entró en vigor:"
  options:
  - id: a
    correct: true
    text:
      es: "El 15 de abril de 2023."
  - id: b
    text:
      es: "El 31 de marzo de 2023."
  - id: c
    text:
      es: "El 1 de enero de 2024."
  - id: d
    text:
      es: "El 1 de julio de 2023."
