- id: g-provider-state
  term:
    en: provider state
  definition:
    en: Provider states allow you describe the preconditions on the provider required to generate the expected response - for example, the existence of specific user data.
  origin: m11-l06
  citation: pact-how-it-works#consumer-testing
- id: g-shrinking
  term:
    en: shrinking
  definition:
    en: If a property could be falsified with a generated set of values, jqwik will try to “shrink” this sample in order to find a “smaller” sample that also falsifies the property.
  origin: m11-l06
  citation: jqwik-user-guide#result-shrinking
- id: g-mutant
  term:
    en: mutant
  definition:
    en: Mutants are Java classes which contain a mutation (or fault) which should make them behave differently from the unmutated class.
  origin: m11-l06
  citation: pitest-basic-concepts#mutants
- id: g-equivalent-mutation
  term:
    en: equivalent mutation
  definition:
    en: Not all mutations will behave differently than the unmutated class. These mutants are referred to as equivalent mutations.
  origin: m11-l06
  citation: pitest-basic-concepts#equivalent-mutations
- id: g-closed-model
  term:
    en: closed model
  definition:
    en: In a closed model, the execution time of each iteration dictates the number of iterations executed in your test. The next iteration doesn’t start until the previous one finishes.
  origin: m11-l06
  citation: k6-open-vs-closed#closed-model
- id: g-open-model
  term:
    en: open model
  definition:
    en: Compared to the closed model, the open model decouples VU iterations from the iteration duration. The response times of the target system no longer influence the load on the target system.
  origin: m11-l06
  citation: k6-open-vs-closed#open-model
- id: g-soak-test
  term:
    en: soak test
  definition:
    en: Soak testing is another variation of the Average-Load test. It focuses on extended periods.
  origin: m11-l06
  citation: k6-soak#soak-testing
- id: g-chaos-engineering
  term:
    en: Chaos Engineering
  definition:
    en: Chaos Engineering is the discipline of experimenting on a distributed system in order to build confidence in its capability to withstand turbulent conditions in production.
  origin: m11-l06
  citation: paper-basiri-chaos-engineering#p2
