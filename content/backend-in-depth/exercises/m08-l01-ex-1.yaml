type: quiz
variants:
- id: m08-l01-q01
  prompt:
    en: In Gilbert and Lynch's statement of the CAP Theorem, which of these is impossible for a web service in a
      network subject to communication failures?
  options:
  - id: a
    correct: true
    text:
      en: Implementing an atomic read/write shared memory that guarantees a response to every request
  - id: b
    text:
      en: Returning any response at all, because a partitioned server has to stay silent
  - id: c
    text:
      en: Implementing a trivial service, such as one that returns the value of a constant
  - id: d
    text:
      en: Implementing a weakly consistent service, such as a distributed web cache
  explanation:
    en: In a network subject to communication failures, it is impossible for a web service to implement an atomic
      read/write shared memory that guarantees a response to every request. A partitioned server can still return
      a response, at the risk of returning the wrong one, so returning any response at all is not ruled out. A trivial
      service needs no coordination among the servers, so it falls outside the scope of the CAP Theorem. A weakly
      consistent service such as a distributed web cache avoids sacrificing availability, so the theorem does not
      rule it out.
  citation: paper-gilbert-lynch-cap#p3; paper-gilbert-lynch-cap#p2
- id: m08-l01-q03
  prompt:
    en: In etcd, a client sets a read request's consistency mode to serializable. What does the client accept in
      exchange for lower latencies and higher throughput?
  options:
  - id: a
    text:
      en: Nothing, because etcd already serves every read in serializable mode by default
  - id: b
    text:
      en: The read still goes through the Raft consensus process on the leader, but it may return stale data afterwards
  - id: c
    correct: true
    text:
      en: The read may access stale data with respect to quorum, because it avoids relying on live consensus
  - id: d
    text:
      en: Linearizable ordering of writes, because serializable mode also applies to write requests
  explanation:
    en: A serializable read may access stale data with respect to quorum, because it removes the reliance on live
      consensus. Serving every read in serializable mode by default is wrong, because etcd ensures linearizability
      for all other operations by default. A serializable read that still goes through the Raft consensus process
      on the leader is wrong, because the mode removes the performance penalty of linearized accesses. Giving up
      the ordering of writes is wrong, because the mode is configured for read requests.
  citation: etcd-api-guarantees#linearizability
  extract:
    en: which may access stale data with respect to quorum
- id: m08-l01-q04
  prompt:
    en: In ZooKeeper, which property of read operations explains why a read can return stale data shortly after
      another client's write has completed?
  options:
  - id: a
    text:
      en: Updates from one client are applied in an arbitrary order, so an older write can overwrite a newer one
  - id: b
    correct: true
    text:
      en: A read is not a quorum operation, so the server responds immediately to the client
  - id: c
    text:
      en: A client that moves to a second server sees an older view of the service than the first server showed
  - id: d
    text:
      en: Write operations are not linearizable, so a read after a write can return the value from before it
  explanation:
    en: A read in ZooKeeper is not a quorum operation, so the server responds immediately to the client that is
      performing it. Applying updates from one client in an arbitrary order is wrong, because ZooKeeper applies
      updates from a client in the order that they were sent. A second server showing an older view is wrong, because
      a client never sees an older view of the system even when it fails over to a different server with the same
      session. Non-linearizable writes are wrong, because write operations in ZooKeeper are linearizable.
  citation: zk-internals#sc_consistency; zk-over#Guarantees
- id: m08-l01-q05
  prompt:
    en: In an NTP version 4 packet as specified by RFC 5905, which stratum value identifies a primary server, such
      as one equipped with a GPS receiver?
  options:
  - id: a
    text:
      en: '0'
  - id: b
    text:
      en: '2'
  - id: c
    text:
      en: '16'
  - id: d
    correct: true
    text:
      en: '1'
  explanation:
    en: Stratum value 1 identifies a primary server, for example one equipped with a GPS receiver. Stratum value
      0 is unspecified or invalid, so it does not identify a primary server. Stratum value 2 falls in the range
      2 to 15, which marks a secondary server reached via NTP. Stratum value 16 means unsynchronized.
  citation: rfc5905#top
  extract:
    en: primary server (e.g., equipped with a GPS receiver)
- id: m08-l01-q06
  prompt:
    en: In etcd, which cost do linearizable requests carry, compared with requests in the serializable consistency
      mode?
  options:
  - id: a
    text:
      en: They return data that may be stale with respect to quorum
  - id: b
    text:
      en: They keep the performance penalty of live consensus only for writes, never for reads
  - id: c
    correct: true
    text:
      en: Linearizable requests must go through the Raft consensus process
  - id: d
    text:
      en: They are available only for write operations, because a read cannot be linearized
  explanation:
    en: Linearizable requests in etcd must go through the Raft consensus process. Stale data is wrong, because linearizability
      guarantees the read returns the most current value. Keeping the penalty only for writes is wrong, because
      the serializable mode removes the performance penalty of linearized accesses for read requests. Write-only
      availability is wrong, because a client issuing a read after a completed write should receive a value at least
      as recent as that write.
  citation: etcd-api-guarantees#linearizability
  extract:
    en: linearized requests must go through the Raft consensus process
- id: m08-l01-q07
  prompt:
    en: According to RFC 5905, NTP version 4 extends the potential accuracy to which order of magnitude with modern
      workstations and fast LANs?
  options:
  - id: a
    text:
      en: Tens of milliseconds
  - id: b
    text:
      en: Tens of nanoseconds
  - id: c
    text:
      en: Single seconds
  - id: d
    correct: true
    text:
      en: Tens of microseconds
  explanation:
    en: NTPv4 extends the potential accuracy to the tens of microseconds with modern workstations and fast LANs.
      Tens of milliseconds is wrong, because the stated accuracy is in microseconds. Tens of nanoseconds is wrong,
      because the stated accuracy is in microseconds. Single seconds is wrong, because the stated accuracy is in
      microseconds.
  citation: rfc5905#top
  extract:
    en: extend the potential accuracy to the tens of microseconds with modern workstations and fast LANs
- id: m08-l01-q09
  prompt:
    en: In the stratum field of an NTPv4 packet, which of the listed meanings belongs to the stratum value 16?
  options:
  - id: a
    correct: true
    text:
      en: Unsynchronized
  - id: b
    text:
      en: Unspecified or invalid
  - id: c
    text:
      en: Primary server
  - id: d
    text:
      en: Secondary server
  explanation:
    en: Stratum value 16 means unsynchronized. Unspecified or invalid is wrong, because that is the meaning of stratum
      value 0. Primary server is wrong, because that is the meaning of stratum value 1. Secondary server is wrong,
      because that is the meaning of stratum values 2 to 15.
  citation: rfc5905#top
  extract:
    en: 16 | unsynchronized
- id: m08-l01-q10
  prompt:
    en: Which range of stratum values marks a secondary server reached via NTP in an NTPv4 packet?
  options:
  - id: a
    text:
      en: 1 to 15
  - id: b
    correct: true
    text:
      en: 2 to 15
  - id: c
    text:
      en: 2 to 16
  - id: d
    text:
      en: 17 to 255
  explanation:
    en: Stratum values 2 to 15 mark a secondary server. 1 to 15 is wrong, because stratum value 1 is a primary server.
      2 to 16 is wrong, because stratum value 16 is unsynchronized. 17 to 255 is wrong, because those values are
      reserved.
  citation: rfc5905#top
  extract:
    en: 2-15 | secondary server (via NTP)
