# anchor: boe-a-2003-23186-art-74
- id: m03-l10-q0105
  prompt:
    es: "¿Qué determina el inicio del procedimiento de deducción sobre transferencias, según el artículo 74.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "La extinción inmediata de las deudas por la cantidad concurrente."
  - id: b
    text:
      es: "El devengo del recargo del período ejecutivo sobre las deudas afectadas."
  - id: c
    correct: true
    text:
      es: "La suspensión del cobro de las deudas a las que el procedimiento se refiere."
  - id: d
    text:
      es: "La compensación automática de las deudas con los créditos de la entidad."
  explanation:
    es: "El inicio del procedimiento suspende el cobro de las deudas a las que se refiere. La extinción llega solo cuando se produce la deducción (artículo 74.3). El recargo y la compensación automática no son efectos del inicio."
  citation: "art. 74.2 LGT"
  difficulty: 1
  tags:
  - "deducciones sobre transferencias"
  - "suspensión"
# anchor: boe-a-2005-14803-art-60
- id: m03-l10-q0109
  prompt:
    es: "Antes de iniciar el procedimiento de deducción sobre transferencias, señale la respuesta CORRECTA sobre lo que comprueba el órgano de recaudación competente según el artículo 60.2.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación:"
  options:
  - id: a
    correct: true
    text:
      es: "La existencia de la deuda y la inexistencia de créditos a favor de la entidad deudora que puedan compensarse de oficio."
  - id: b
    text:
      es: "La existencia de la deuda y la inexistencia de bienes de la entidad deudora que puedan ser embargados."
  - id: c
    text:
      es: "La existencia de la deuda y la existencia de créditos a favor de la entidad deudora que puedan compensarse de oficio con la deuda reclamada."
  - id: d
    text:
      es: "La existencia de la deuda y que la entidad deudora ha solicitado un aplazamiento que no ha sido concedido."
  explanation:
    es: "El órgano comprueba que existe la deuda y que no hay créditos a favor de la entidad que puedan compensarse de oficio, porque si los hubiera se compensaría. El embargo no es la vía contra entidades públicas, la existencia de créditos compensables lo contradice y el aplazamiento denegado no es requisito."
  citation: "art. 60.2.a RGR"
  difficulty: 2
  tags:
  - "deducciones sobre transferencias"
  - "inicio"
# anchor: boe-a-2003-23186-art-74
- id: m03-l10-q0113
  prompt:
    es: "Según el artículo 74.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, para que las deudas tributarias de las comunidades autónomas, entidades locales y demás entidades de derecho público con el Estado puedan extinguirse con deducciones sobre transferencias deben ser:"
  options:
  - id: a
    text:
      es: "Vencidas, líquidas y firmes en vía administrativa."
  - id: b
    correct: true
    text:
      es: "Vencidas, líquidas y exigibles."
  - id: c
    text:
      es: "Líquidas, exigibles y garantizadas con aval suficiente."
  - id: d
    text:
      es: "Vencidas, exigibles y declaradas en período ejecutivo con providencia."
  explanation:
    es: "El artículo 74.1 exige deudas vencidas, líquidas y exigibles. La firmeza en vía administrativa, el aval y la providencia de apremio no son requisitos de este régimen."
  citation: "art. 74.1 LGT"
  difficulty: 1
  tags:
  - "deducciones sobre transferencias"
  - "requisitos"
# anchor: boe-a-2007-21228-art-6
- id: m03-l10-q0123
  prompt:
    es: "Una comunidad autónoma tiene deudas vencidas, líquidas y exigibles con la Hacienda estatal, y se tramita su deducción sobre las cantidades que la Administración General del Estado debe transferirle. Conforme al artículo 6.1.l de la Orden PRE/3581/2007, de 10 de diciembre, por la que se establecen los departamentos de la Agencia Estatal de Administración Tributaria y se les atribuyen funciones y competencias, ¿qué departamento de la Agencia Tributaria resuelve el expediente de deducción?"
  options:
  - id: a
    text:
      es: "El Departamento de Inspección Financiera y Tributaria de la Agencia Estatal de Administración Tributaria."
  - id: b
    text:
      es: "El Departamento de Aduanas e Impuestos Especiales de la Agencia Estatal de Administración Tributaria."
  - id: c
    text:
      es: "La Delegación Central de Grandes Contribuyentes de la Agencia Estatal de Administración Tributaria."
  - id: d
    correct: true
    text:
      es: "El Departamento de Recaudación de la Agencia Estatal de Administración Tributaria."
  explanation:
    es: "Corresponde al Departamento de Recaudación la resolución de los expedientes de deducción sobre las cantidades que la Administración General del Estado deba transferir a los entes territoriales, organismos autónomos, Seguridad Social y demás entidades de Derecho público (art. 6.1.l de la Orden PRE/3581/2007). La inspección financiera y tributaria, las aduanas y los impuestos especiales y la Delegación Central de Grandes Contribuyentes tienen sus propias funciones y no resuelven estos expedientes."
  citation: "art. 6.1.l Orden PRE/3581/2007"
  difficulty: 2
  tags:
  - "deducción sobre transferencias"
  - "Departamento de Recaudación"
