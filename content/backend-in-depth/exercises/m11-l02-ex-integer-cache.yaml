- id: m11-l02-v-integer-cache-001
  prompt:
    en: |-
      On the pinned JDK, what does this program print, line by line? `identical` wraps `==` and `equal` wraps `equals`, both on two `Integer` objects returned by `Integer.valueOf`.

      ```java
      public class Main {
          static boolean identical(Integer p, Integer q) {
              return p == q;
          }

          static boolean equal(Integer p, Integer q) {
              return p.equals(q);
          }

          public static void main(String[] args) {
              Integer a = Integer.valueOf(200);
              Integer b = Integer.valueOf(200);
              Integer c = Integer.valueOf(500);
              Integer d = Integer.valueOf(500);
              System.out.println(identical(a, b));
              System.out.println(equal(a, b));
              System.out.println(identical(c, d));
              System.out.println(equal(c, d));
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`false`, `true`, `false`, `true`'
    correct: true
  - id: b
    text:
      en: '`true`, `true`, `true`, `true`'
  - id: c
    text:
      en: '`false`, `false`, `false`, `false`'
  - id: d
    text:
      en: '`true`, `true`, `false`, `true`'
  explanation:
    en: '`identical` uses `==`, which compares references, and `equal` uses `equals`, which compares the `int` values. `200`
      is outside the range -128 to 127 that `valueOf` always caches, and on the pinned JDK the two calls returned different
      objects, so `identical` is `false` while `equal` is `true` because both hold the same `int`; outside that range this
      is the recorded output, not a guarantee. `500` is outside the range -128 to 127 that `valueOf` always caches, and on
      the pinned JDK the two calls returned different objects, so `identical` is `false` while `equal` is `true` because both
      hold the same `int`; outside that range this is the recorded output, not a guarantee. The program prints `false`, `true`,
      `false`, `true`. `true`, `true`, `true`, `true` comes from this mistake: treating `==` on `Integer` as a comparison
      of the `int` values. `==` on two `Integer` references is `true` only when both refer to the same object, and `valueOf`
      is guaranteed to return shared objects only for -128 to 127. `false`, `false`, `false`, `false` comes from this mistake:
      taking `equals` to compare references. `Integer.equals` is `true` if and only if the argument is an `Integer` holding
      the same `int` value. `true`, `true`, `false`, `true` comes from this mistake: assuming the cache covers 0 to 255. The
      range that `valueOf` always caches is -128 to 127 inclusive.'
