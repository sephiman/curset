    text:
      es: 'A un puesto de nivel no inferior a 24. 2019 ADVO-LI - EXTRAORDINARIO SUPUESTO II Desde la Dirección General de
        Producciones y Mercados Agrarios del Ministerio de Agricultura, Pesca y Alimentación se está tramitando un expediente
        sancionador contra D. Ángel Junco Alba por la realización de una actividad para la que se requería el previo otorgamiento
        de una autorización administrativa, no habiendo obtenido D. Ángel Junco la autorización administrativa preceptiva.
        Con fecha 1 de julio de 2021 se dictó acuerdo de incoación por una presunta infracción tipificada en la normativa
        específica. En el acuerdo de inicio se califica la infracción como grave. No se regulan otras especialidades del procedimiento
        sancionador en la normativa específica, siendo de aplicación lo establecido en las Leyes 39/2015, de 1 de octubre,
        del Procedimiento Administrativo Común de las Administraciones Públicas, y 40/2015, de 1 de octubre, de Régimen Jurídico
        del Sector Público. En el curso de la fase de instrucción del procedimiento, la Administración le requiere para que
        aporte la preceptiva autorización, pero D. Ángel alega que no debe aportarlo por ser un documento que debe obrar en
        poder de la Administración. Con fecha 1 de septiembre de 2021 se dicta propuesta de resolución por el órgano instructor,
        en el que se califica la infracción como grave y en la que se propone una sanción pecuniaria. Realizadas las preceptivas
        fases y trámites del procedimiento sancionador, éste finaliza con una Resolución del Ministro de fecha 1 de octubre
        de 2021, órgano competente para resolver según la normativa específica. De acuerdo con la mencionada Resolución, se
        califica la infracción como muy grave (y no como infracción grave como se indicaba en la propuesta de resolución),
        imponiéndose una sanción de 60.000 euros. Por otra parte, el Ministerio de Agricultura, Pesca y Alimentación quiere
        mejorar las condiciones de accesibilidad de sus edificios, lo que plantea algunas dificultades y cuestiones que debe
        resolver de acuerdo con lo dispuesto en el Real Decreto 366/2007, de 16 de marzo, por el que se establecen las condiciones
        de accesibilidad y no discriminación de las personas con discapacidad en sus relaciones con la Administración General
        del Estado. Otra de las Direcciones Generales del Ministerio, la Dirección General de Servicios e Inspección, tiene
        que librar 18.000 euros a la Consejería de Agricultura, Pesca y Alimentación del mismo Departamento ministerial ubicada
        en París, con el fin de que ésta pueda abonar gastos de funcionamiento por la contratación de diversos servicios que
        tuvieron lugar en esta sede de París. La Consejería necesita también realizar un contrato menor para un servicio de
        traducción al inglés de unos estudios por un importe de 8.000 euros, siendo la duración del contrato de 6 meses. La
        mitad del importe del contrato (4.000 euros) se ha de pagar antes de que acabe el año y la otra mitad, al año siguiente.
        El Ministerio también está tramitando un expediente de contratación que tiene por objeto la realización de unas obras
        consistentes en el solado y pavimentado de unas parcelas de gravilla en el patio de las dependencias de un organismo
        autónomo dependiente del Departamento con un valor estimado de 35.550 euros. Estado, tras superar las pruebas selectivas
