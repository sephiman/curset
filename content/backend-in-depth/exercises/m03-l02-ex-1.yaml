- id: m03-l02-q04
  prompt:
    en: A `ThreadPoolExecutor` has one core thread, a maximum of one thread and an `ArrayBlockingQueue` of capacity
      one, with one task running and one queued. What happens to a third task under the default policy?
  options:
  - id: a
    text:
      en: The task runs in the thread that called `execute`
  - id: b
    text:
      en: The task is dropped without any exception
  - id: c
    correct: true
    text:
      en: '`execute` throws a `RejectedExecutionException`'
  - id: d
    text:
      en: A second worker thread is created because the queue is full
  explanation:
    en: The default `AbortPolicy` handler throws a runtime `RejectedExecutionException` upon rejection. Running
      the task in the calling thread is wrong, because that is the behaviour of `CallerRunsPolicy`, and the default
      handler throws. Dropping the task silently is wrong, because that is `DiscardPolicy`, and the default handler
      throws. A second worker thread is wrong, because a request that cannot be queued is rejected when a new thread
      would exceed `maximumPoolSize`.
  citation: javadoc-threadpoolexecutor#class-threadpoolexecutor
- id: m03-l02-q05
  prompt:
    en: A `ThreadPoolExecutor` uses an unbounded `LinkedBlockingQueue` as its work queue. How many threads will
      the pool ever create, according to the Java 25 Javadoc?
  options:
  - id: a
    correct: true
    text:
      en: No more than `corePoolSize`
  - id: b
    text:
      en: Up to `maximumPoolSize`, once the pool has queued enough tasks
  - id: c
    text:
      en: One new thread for every submitted task
  - id: d
    text:
      en: Exactly `maximumPoolSize` threads, all created at construction
  explanation:
    en: With an unbounded queue no more than `corePoolSize` threads will ever be created. Growing to `maximumPoolSize`
      is wrong, because the value of `maximumPoolSize` has no effect. One thread per submitted task is wrong, because
      no more than `corePoolSize` threads are ever created. Creating `maximumPoolSize` threads at construction is
      wrong for the same limit, since the pool never exceeds `corePoolSize` threads.
  citation: javadoc-threadpoolexecutor#class-threadpoolexecutor
- id: m03-l02-q06
  prompt:
    en: In Java 25, code calls `CompletableFuture.supplyAsync(supplier)` without passing an executor. Which executor
      performs the asynchronous task?
  options:
  - id: a
    text:
      en: A new thread created for each call
  - id: b
    correct: true
    text:
      en: '`ForkJoinPool.commonPool()`'
  - id: c
    text:
      en: The pool of `Executors.newCachedThreadPool()`
  - id: d
    text:
      en: The thread that called `supplyAsync`
  explanation:
    en: Async methods without an explicit `Executor` argument are performed using `ForkJoinPool.commonPool()`. A
      new thread per call is wrong, because the common pool performs the task. The pool of `Executors.newCachedThreadPool()`
      is wrong, because the common pool is the documented default. The calling thread is wrong, because the common
      pool performs the asynchronous task.
  citation: javadoc-completablefuture#class-completablefuture-t
- id: m03-l02-q07
  prompt:
    en: A `CompletableFuture` completed exceptionally with a `CompletionException` whose cause is an `IllegalStateException`.
      What does `get()` throw, according to the Java 25 Javadoc?
  options:
  - id: a
    correct: true
    text:
      en: An `ExecutionException` with the same cause as the `CompletionException`
  - id: b
    text:
      en: The `CompletionException` itself
  - id: c
    text:
      en: The `IllegalStateException` directly, with no wrapper added by the future
  - id: d
    text:
      en: A `CancellationException` that wraps the `CompletionException` as its cause
  explanation:
    en: '`get()` throws an `ExecutionException` with the same cause as the corresponding `CompletionException`.
      Throwing the `CompletionException` itself is wrong, because that is what `join()` and `getNow(T)` do. Throwing
      the `IllegalStateException` directly is wrong, because `get()` wraps it in an `ExecutionException`. A `CancellationException`
      is wrong, because the exception thrown is an `ExecutionException` with the same cause.'
  citation: javadoc-completablefuture#class-completablefuture-t
- id: m03-l02-q08
  prompt:
    en: Which statement about `StampedLock` is correct, according to the Java 25 Javadoc of the class?
  options:
  - id: a
    correct: true
    text:
      en: It has no notion of ownership, so a lock acquired in one thread can be released in another
  - id: b
    text:
      en: It is reentrant, so a thread may safely re-acquire a lock it already holds
  - id: c
    text:
      en: It implements the `Lock` interface, so it can replace a `ReentrantLock` in existing code without any change
  - id: d
    text:
      en: A zero from a `try` method means that the lock is currently held in write mode
  explanation:
    en: A `StampedLock` has no notion of ownership, so locks acquired in one thread can be released or converted
      in another. Reentrancy is wrong, because `StampedLock` instances are not reentrant. Implementing `Lock` is
      wrong, because the class does not directly implement the `Lock` or `ReadWriteLock` interfaces. A zero meaning
      write mode is wrong, because a zero from a `try` method carries no information about the state of the lock.
  citation: javadoc-stampedlock#class-stampedlock
- id: m03-l02-q09
  prompt:
    en: A `ReentrantLock` is constructed with the fairness parameter set to `true`. Which statement about it is
      correct, according to the Java 25 Javadoc?
  options:
  - id: a
    text:
      en: Its overall throughput is always higher than with the default setting when many threads use it
  - id: b
    text:
      en: The untimed `tryLock()` method also honors the fairness setting when the lock is contended
  - id: c
    text:
      en: It guarantees that the threads that use the lock are also scheduled fairly by the system
  - id: d
    correct: true
    text:
      en: Under contention it favors granting access to the longest-waiting thread
  explanation:
    en: With fairness set to true, locks favor granting access to the longest-waiting thread under contention. Higher
      throughput is wrong, because fair locks may display lower overall throughput than the default setting. Honoring
      fairness in `tryLock()` is wrong, because the untimed `tryLock()` method does not honor the fairness setting.
      Fair thread scheduling is wrong, because fairness of locks does not guarantee fairness of thread scheduling.
  citation: javadoc-reentrantlock#class-reentrantlock
- id: m03-l02-q10
  prompt:
    en: A `Semaphore` is created with its fairness parameter set to `false`. Which statement about how threads acquire
      its permits is correct, according to the Java 25 Javadoc?
  options:
  - id: a
    text:
      en: Threads obtain permits strictly in first-in-first-out order of their `acquire` calls
  - id: b
    correct: true
    text:
      en: The class makes no guarantees about the order in which threads acquire permits
  - id: c
    text:
      en: Barging is not permitted, so a thread that has been waiting is always served first
  - id: d
    text:
      en: The untimed `tryAcquire` methods wait until permits can be granted in order
  explanation:
    en: With fairness set to false, the class makes no guarantees about the order in which threads acquire permits.
      First-in-first-out order is wrong, because that is the guarantee given only when fairness is set true. Forbidden
      barging is wrong, because barging is permitted and a thread invoking `acquire()` can get a permit ahead of
      a waiting thread. Waiting `tryAcquire` methods are wrong, because the untimed `tryAcquire` methods take any
      permits that are available.
  citation: javadoc-semaphore#class-semaphore
- id: m03-l02-q12
  prompt:
    en: A thread creates an iterator over a `CopyOnWriteArrayList`, and another thread then adds an element to the
      list. What does the existing iterator do, according to the Java 25 Javadoc?
  options:
  - id: a
    text:
      en: It reflects the addition and traverses the new element in the same pass
  - id: b
    correct: true
    text:
      en: It does not reflect the addition, because it traverses a snapshot of the array
  - id: c
    text:
      en: It reflects the addition only for positions after its current one in the array
  - id: d
    text:
      en: It throws `ConcurrentModificationException` on its next call, as an `ArrayList` iterator does
  explanation:
    en: The iterator of a `CopyOnWriteArrayList` will not reflect additions, removals or changes made after it was
      created. Reflecting the addition is wrong, because the iterator does not reflect changes made since it was
      created. Reflecting it only after the current position is wrong, because no change made since creation is
      reflected. Throwing `ConcurrentModificationException` is wrong, because the iterator is guaranteed not to
      throw it.
  citation: javadoc-copyonwritearraylist#class-copyonwritearraylist-e
- id: m03-l02-q14
  prompt:
    en: A `BlockingQueue` implementation has no intrinsic capacity constraints. What does its `remainingCapacity`
      method always report, according to the Java 25 Javadoc?
  options:
  - id: a
    text:
      en: '`0`'
  - id: b
    text:
      en: '`-1`'
  - id: c
    text:
      en: '`Integer.MAX_VALUE - 1`'
  - id: d
    correct: true
    text:
      en: '`Integer.MAX_VALUE`'
  explanation:
    en: A `BlockingQueue` without intrinsic capacity constraints always reports a remaining capacity of `Integer.MAX_VALUE`.
      Reporting `0` is wrong, because `0` would mean the queue is full, and the documented value is `Integer.MAX_VALUE`.
      Reporting `-1` is wrong, because the documented value is `Integer.MAX_VALUE`. Reporting `Integer.MAX_VALUE
      - 1` is wrong, because the documented value is exactly `Integer.MAX_VALUE`.
