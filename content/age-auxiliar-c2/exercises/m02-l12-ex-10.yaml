  - id: a
    text:
      es: "Cambia a la última pestaña"
  - id: b
    text:
      es: "Abre una pestaña nueva"
  - id: c
    text:
      es: "Cambia a la pestaña anterior"
  - id: d
    correct: true
    text:
      es: "Cambia a la pestaña siguiente"
