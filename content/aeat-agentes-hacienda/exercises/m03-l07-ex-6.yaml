# anchor: boe-a-2003-23186-art-57
- id: m03-l07-q0123
  prompt:
    es: "¿Cuál de los siguientes es un medio de comprobación de valores de los previstos en el artículo 57.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Las cotizaciones en mercados nacionales y extranjeros."
  - id: b
    text:
      es: "El valor contable que el obligado refleje en sus libros de contabilidad."
  - id: c
    text:
      es: "La tasación pericial contradictoria promovida por el propio obligado tributario."
  - id: d
    text:
      es: "El valor de mercado que el obligado fije libremente en su declaración."
  explanation:
    es: "Las cotizaciones en mercados nacionales y extranjeros son el medio de la letra d). El valor contable y el que fija el obligado no son medios de la Administración, y la tasación pericial contradictoria sirve para confirmar o corregir las valoraciones (art. 57.2), no es uno de los medios del apartado 1."
  citation: "art. 57.1 LGT"
  difficulty: 1
  tags:
  - "comprobación de valores"
  - "medios"
# anchor: boe-a-2003-23186-art-57
- id: m03-l07-q0124
  prompt:
    es: "De acuerdo con el artículo 57.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, entre los medios de comprobación de valores figuran el valor asignado a los bienes en las pólizas de contratos de seguros y el valor asignado para la tasación de:"
  options:
  - id: a
    text:
      es: "los bienes embargados en cumplimiento de lo previsto en la legislación de recaudación."
  - id: b
    correct: true
    text:
      es: "las fincas hipotecadas en cumplimiento de lo previsto en la legislación hipotecaria."
  - id: c
    text:
      es: "los bienes aportados a sociedades en cumplimiento de lo previsto en la legislación mercantil."
  - id: d
    text:
      es: "los bienes expropiados en cumplimiento de lo previsto en la legislación de expropiación forzosa."
  explanation:
    es: "La letra g) recoge el valor asignado para la tasación de las fincas hipotecadas conforme a la legislación hipotecaria. Los bienes embargados, expropiados o aportados a sociedades no figuran como referencia de valoración en el artículo."
  citation: "art. 57.1 LGT"
  difficulty: 2
  tags:
  - "comprobación de valores"
  - "medios"
# anchor: boe-a-2007-15984-art-158
- id: m03-l07-q0125
  prompt:
    es: "Conforme al artículo 158.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, el valor de los bienes transmitidos puede comprobarse atendiendo al precio declarado en otras transmisiones del mismo bien realizadas dentro del plazo de:"
  options:
  - id: a
    text:
      es: "cuatro años desde la fecha del devengo del impuesto en el que surta efecto, si se mantienen sustancialmente las circunstancias físicas, jurídicas y económicas."
  - id: b
    text:
      es: "seis meses desde la fecha del devengo del impuesto en el que surta efecto, si se mantienen sustancialmente las circunstancias físicas, jurídicas y económicas."
  - id: c
    correct: true
    text:
      es: "un año desde la fecha del devengo del impuesto en el que surta efecto, si se mantienen sustancialmente las circunstancias físicas, jurídicas y económicas."
  - id: d
    text:
      es: "dos años desde la fecha del devengo del impuesto en el que surta efecto, si se mantienen sustancialmente las circunstancias físicas, jurídicas y económicas."
  explanation:
    es: "El plazo del medio de la letra h) es de un año desde el devengo del impuesto en el que surta efecto la transmisión, siempre que se mantengan sustancialmente las circunstancias determinantes del valor (art. 158.4). Dos años, seis meses y cuatro años no son el plazo del precepto."
  citation: "art. 158.4 RGAT"
  difficulty: 2
  tags:
  - "comprobación de valores"
  - "plazos"
# anchor: boe-a-2003-23186-art-134
- id: m03-l07-q0127
  prompt:
    es: "De acuerdo con el artículo 134.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración puede comprobar valores con los medios del artículo 57, salvo que el obligado hubiera declarado utilizando:"
  options:
  - id: a
    text:
      es: "los valores asignados en las pólizas de contratos de seguros suscritos por el obligado con anterioridad a la declaración."
  - id: b
    correct: true
    text:
      es: "los valores publicados por la propia Administración actuante en aplicación de alguno de esos medios."
  - id: c
    text:
      es: "los valores que haya fijado un perito designado por el propio obligado tributario."
  - id: d
    text:
      es: "los valores que figuren en los registros de cualquier otra Administración pública."
  explanation:
    es: "La excepción afecta al obligado que declara con los valores publicados por la propia Administración actuante. Los valores de otras Administraciones, de un perito del obligado o de pólizas de seguros no le cierran la comprobación."
  citation: "art. 134.1 LGT"
  difficulty: 2
  tags:
  - "comprobación de valores"
  - "límites"
# anchor: boe-a-2003-23186-art-134
- id: m03-l07-q0130
  prompt:
    es: "Según el artículo 134.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento de comprobación de valores se puede iniciar mediante una comunicación de la Administración actuante o, cuando se cuente con datos suficientes, mediante:"
  options:
  - id: a
    text:
      es: "el requerimiento de aclaración o justificación del valor al obligado."
  - id: b
    text:
      es: "el acuerdo de iniciación notificado al obligado con la designación de perito."
  - id: c
    correct: true
    text:
      es: "la notificación conjunta de las propuestas de liquidación y valoración."
  - id: d
    text:
      es: "la notificación de la valoración definitiva y de la liquidación provisional."
  explanation:
    es: "Con datos suficientes, el procedimiento puede iniciarse con la notificación conjunta de las propuestas de liquidación y valoración (art. 134.1). Una valoración definitiva, un requerimiento de aclaración (propio de la verificación) o el nombramiento de perito en el inicio no son formas previstas."
  citation: "art. 134.1 LGT"
  difficulty: 2
  tags:
  - "comprobación de valores"
  - "iniciación"
# anchor: boe-a-2003-23186-art-134
- id: m03-l07-q0132
  prompt:
    es: "De acuerdo con el artículo 134.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la propuesta de valoración cuando el valor determinado por la Administración es distinto del declarado:"
  options:
  - id: a
    text:
      es: "Se comunica solo si el obligado la solicita expresamente tras recibir la propuesta de regularización."
  - id: b
    text:
      es: "Se comunica una vez notificada la regularización, con una referencia sucinta a los medios empleados."
  - id: c
    text:
      es: "Se comunica al tiempo de la propuesta de regularización, sin necesidad de expresar los criterios empleados."
  - id: d
    correct: true
    text:
      es: "Se comunica, al tiempo de notificar la propuesta de regularización, debidamente motivada y con expresión de los medios y criterios empleados."
  explanation:
    es: "La propuesta de valoración se comunica con la propuesta de regularización, motivada y con expresión de medios y criterios (art. 134.3). No se difiere a la regularización, no omite los criterios y no depende de solicitud."
  citation: "art. 134.3 LGT"
  difficulty: 3
  tags:
  - "comprobación de valores"
  - "propuesta de valoración"
# anchor: boe-a-2003-23186-art-134
- id: m03-l07-q0133
  prompt:
    es: "Conforme al artículo 134.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los obligados tributarios no podrán interponer recurso o reclamación independiente contra la valoración, pero podrán:"
  options:
  - id: a
    correct: true
    text:
      es: "promover la tasación pericial contradictoria o plantear cualquier cuestión sobre la valoración al recurrir el acto de regularización."
  - id: b
    text:
      es: "impugnar la valoración ante la jurisdicción contencioso-administrativa sin agotar la vía administrativa."
  - id: c
    text:
      es: "reclamar contra la valoración ante el Tribunal Económico-Administrativo competente en el plazo de un mes."
  - id: d
    text:
      es: "recurrir la valoración en reposición, siempre que lo hagan antes de la notificación de la regularización."
  explanation:
    es: "La valoración no se recurre por separado: el obligado puede promover la tasación pericial contradictoria o discutir la valoración con ocasión de los recursos o reclamaciones contra el acto de regularización. Las otras vías son recursos independientes que el artículo excluye."
  citation: "art. 134.3 LGT"
  difficulty: 2
  tags:
  - "comprobación de valores"
  - "recursos"
# anchor: boe-a-2003-23186-art-134
- id: m03-l07-q0134
  prompt:
    es: "Inmuebles Soler, S.L. recibe una regularización con una valoración administrativa de un local que considera excesiva, y quiere impugnar solo la valoración, sin recurrir la regularización. Según el artículo 134.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué puede hacer?"
  options:
  - id: a
    text:
      es: "Puede interponer recurso de reposición independiente contra la valoración en el plazo de un mes."
  - id: b
    text:
      es: "No puede hacer nada, porque la valoración de la Administración es firme desde su comunicación."
  - id: c
    text:
      es: "Puede reclamar contra la valoración ante el tribunal económico-administrativo sin recurrir la regularización."
  - id: d
    correct: true
    text:
      es: "No puede impugnar la valoración de forma independiente: puede promover la tasación pericial contradictoria o discutirla al recurrir la regularización."
  explanation:
    es: "La ley impide el recurso o reclamación independiente contra la valoración, pero permite la tasación pericial contradictoria o plantear la cuestión con ocasión del recurso contra la regularización (art. 134.3). La valoración no es firme por no poder recurrirse de forma aislada."
  citation: "art. 134.3 LGT"
  difficulty: 2
  tags:
  - "comprobación de valores"
  - "recursos"
# anchor: boe-a-2003-23186-art-134
- id: m03-l07-q0135
  prompt:
    es: "De acuerdo con el artículo 134.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando la ley establece que el valor comprobado debe producir efectos respecto a otros obligados tributarios, la Administración actuante:"
  options:
  - id: a
    text:
      es: "debe revisar de oficio el valor cada vez que un interesado lo impugne."
  - id: b
    text:
      es: "queda vinculada solo respecto del obligado frente al que lo comprobó."
  - id: c
    correct: true
    text:
      es: "queda vinculada por dicho valor en relación con los demás interesados."
  - id: d
    text:
      es: "puede modificar el valor comprobado respecto de cada interesado."
  explanation:
    es: "Si la ley lo prevé, el valor comprobado vincula a la Administración actuante frente a los demás interesados (art. 134.4). No puede variarlo por interesado, no hay revisión de oficio automática y la vinculación no se limita al obligado inicial."
  citation: "art. 134.4 LGT"
  difficulty: 1
  tags:
  - "comprobación de valores"
  - "efectos"
# anchor: boe-a-2007-15984-art-159
- id: m03-l07-q0136
  prompt:
    es: "¿En cuál de los siguientes procedimientos puede realizarse la comprobación de valores como una actuación concreta, según el artículo 159.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "En el procedimiento de devolución iniciado mediante autoliquidación."
  - id: b
    correct: true
    text:
      es: "En el procedimiento iniciado mediante declaración."
  - id: c
    text:
      es: "En el procedimiento de control de la presentación de declaraciones."
  - id: d
    text:
      es: "En el procedimiento de rectificación de autoliquidaciones."
  explanation:
    es: "La comprobación de valores puede hacerse como actuación concreta en el procedimiento iniciado mediante declaración, en el de comprobación limitada y en el de inspección (art. 159.1). Los de devolución, rectificación y control de presentación no figuran en esa lista."
  citation: "art. 159.1 RGAT"
  difficulty: 1
  tags:
  - "comprobación de valores"
  - "actuación concreta"
# anchor: boe-a-2007-15984-art-159
- id: m03-l07-q0137
  prompt:
    es: "Según el artículo 159.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre los procedimientos en los que la comprobación de valores puede realizarse como actuación concreta:"
  options:
  - id: a
    text:
      es: "El procedimiento iniciado mediante declaración, el de rectificación y el de inspección."
  - id: b
    text:
      es: "El procedimiento iniciado mediante declaración, el de comprobación limitada y el sancionador o el de apremio."
  - id: c
    text:
      es: "El procedimiento de devolución, el de comprobación limitada y el de inspección."
  - id: d
    correct: true
    text:
      es: "El procedimiento iniciado mediante declaración, el de comprobación limitada y el de inspección."
  explanation:
    es: "Son tres: el iniciado mediante declaración, la comprobación limitada y la inspección. Cada alternativa sustituye uno por otro procedimiento que el artículo 159.1 no cita (devolución, rectificación o sancionador)."
  citation: "art. 159.1 RGAT"
  difficulty: 2
  tags:
  - "comprobación de valores"
  - "actuación concreta"
# anchor: boe-a-2007-15984-art-159
- id: m03-l07-q0138
  prompt:
    es: "Durante un procedimiento de inspección sobre Textiles Mora, S.L., el órgano actuante necesita valorar un inmueble de la sociedad y decide hacerlo como actuación concreta dentro de la inspección. Según el artículo 159.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿cuál es el plazo máximo de resolución de esa comprobación de valores?"
  options:
  - id: a
    text:
      es: "El que regula el artículo 104 de la ley para el procedimiento de comprobación de valores independiente."
  - id: b
    text:
      es: "Seis meses desde la notificación del acuerdo de valoración del inmueble."
  - id: c
    correct: true
    text:
      es: "El del procedimiento de inspección que se esté tramitando."
  - id: d
    text:
      es: "Un año desde la fecha en que se haya iniciado la inspección sobre la sociedad."
  explanation:
    es: "Cuando la comprobación de valores es una actuación concreta de otro procedimiento, el plazo máximo de resolución es el de ese procedimiento (art. 159.3). Aquí, el de la inspección. No se aplica el del procedimiento independiente, ni seis meses desde un acuerdo de valoración, ni un año fijo."
  citation: "art. 159.3 RGAT"
  difficulty: 2
  tags:
  - "comprobación de valores"
  - "plazos"
# anchor: boe-a-2007-15984-art-159
- id: m03-l07-q0139
  prompt:
    es: "De acuerdo con el artículo 159.5 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, no se consideran actuaciones de comprobación de valores aquellas en las que el valor de las rentas, productos, bienes o elementos de la obligación tributaria resulte directamente de:"
  options:
  - id: a
    correct: true
    text:
      es: "una ley o de un reglamento."
  - id: b
    text:
      es: "las cotizaciones de mercados nacionales."
  - id: c
    text:
      es: "una tasación pericial contradictoria previa."
  - id: d
    text:
      es: "un dictamen de peritos de la Administración."
  explanation:
    es: "Si el valor deriva directamente de una ley o de un reglamento, no hay comprobación de valores. El dictamen de peritos y las cotizaciones son, en cambio, medios de comprobación del artículo 57.1, y la tasación pericial contradictoria corrige valoraciones."
  citation: "art. 159.5 RGAT"
  difficulty: 1
  tags:
  - "comprobación de valores"
# anchor: boe-a-2007-15984-art-160
- id: m03-l07-q0141
  prompt:
    es: "Según el artículo 160.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, la valoración administrativa servirá de base a:"
  options:
  - id: a
    text:
      es: "la sanción que se imponga al obligado por la valoración declarada."
  - id: b
    correct: true
    text:
      es: "la liquidación provisional que se practique."
  - id: c
    text:
      es: "la tasación practicada por el perito designado por el obligado."
  - id: d
    text:
      es: "la liquidación definitiva que se practique en la inspección."
  explanation:
    es: "La valoración administrativa es la base de la liquidación provisional, sin perjuicio de otros procedimientos sobre elementos distintos (art. 160.4). No fundamenta una liquidación definitiva de la inspección ni una sanción ni sirve de base a la tasación del perito del obligado."
  citation: "art. 160.4 RGAT"
  difficulty: 1
  tags:
  - "comprobación de valores"
  - "liquidación"
# anchor: boe-a-2003-23186-art-135
- id: m03-l07-q0142
  prompt:
    es: "De acuerdo con el artículo 135.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los interesados podrán promover la tasación pericial contradictoria dentro del plazo de:"
  options:
  - id: a
    text:
      es: "diez días desde la notificación de la regularización que incorpora la valoración."
  - id: b
    text:
      es: "el último recurso o reclamación que proceda contra la liquidación efectuada con esos valores."
  - id: c
    correct: true
    text:
      es: "el primer recurso o reclamación que proceda contra la liquidación efectuada de acuerdo con los valores comprobados administrativamente."
  - id: d
    text:
      es: "un mes desde la notificación de la propuesta de valoración de la Administración."
  explanation:
    es: "El plazo coincide con el del primer recurso o reclamación contra la liquidación basada en los valores comprobados (art. 135.1). No se fija en un mes desde la propuesta, ni en diez días, ni se refiere al último recurso."
  citation: "art. 135.1 LGT"
  difficulty: 2
  tags:
  - "tasación pericial"
  - "plazos"
# anchor: boe-a-2003-23186-art-135
- id: m03-l07-q0143
  prompt:
    es: "Conforme al artículo 135.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la presentación de la solicitud de tasación pericial contradictoria:"
  options:
  - id: a
    text:
      es: "Determina la suspensión del plazo para recurrir, pero no la de la ejecución de la liquidación."
  - id: b
    text:
      es: "Solo determina la suspensión de la ejecución de la liquidación si el obligado aporta garantía suficiente."
  - id: c
    text:
      es: "Determina la suspensión de la ejecución de la liquidación, pero no la del plazo para interponer recurso contra ella ni la del procedimiento sancionador."
  - id: d
    correct: true
    text:
      es: "Determina la suspensión de la ejecución de la liquidación y del plazo para interponer recurso o reclamación contra ella."
  explanation:
    es: "La solicitud (o la reserva del derecho a promoverla) suspende tanto la ejecución de la liquidación como el plazo para recurrirla (art. 135.1). Las otras opciones separan los dos efectos o añaden una garantía que el artículo no pide."
  citation: "art. 135.1 LGT"
  difficulty: 3
  tags:
  - "tasación pericial"
  - "suspensión"
# anchor: boe-a-2003-23186-art-135
- id: m03-l07-q0144
  prompt:
    es: "Si ya se hubiera iniciado el procedimiento sancionador derivado de la liquidación, ¿qué suspende la presentación de la solicitud de tasación pericial contradictoria, según el artículo 135.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "El plazo máximo para la terminación del procedimiento sancionador."
  - id: b
    text:
      es: "El plazo de prescripción del derecho de la Administración a liquidar el tributo."
  - id: c
    text:
      es: "El plazo para interponer recurso contra la sanción que se imponga."
  - id: d
    text:
      es: "El plazo de alegaciones concedido al obligado en el procedimiento sancionador."
  explanation:
    es: "La solicitud suspende el plazo para iniciar el procedimiento sancionador o, si ya está iniciado, el plazo máximo para su terminación (art. 135.1). No suspende el recurso contra la sanción, la prescripción de la liquidación ni las alegaciones."
  citation: "art. 135.1 LGT"
  difficulty: 3
  tags:
  - "tasación pericial"
  - "suspensión"
# anchor: boe-a-2003-23186-art-135
- id: m03-l07-q0145
  prompt:
    es: "Según el artículo 135.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, será necesaria la valoración de un perito de la Administración en la tasación pericial contradictoria cuando la cuantificación del valor comprobado no se haya realizado mediante:"
  options:
  - id: a
    text:
      es: "estimación por referencia a los registros oficiales de carácter fiscal."
  - id: b
    text:
      es: "dictamen de peritos designados por el obligado tributario."
  - id: c
    correct: true
    text:
      es: "dictamen de peritos de la Administración."
  - id: d
    text:
      es: "precios medios de mercado publicados por la Administración."
  explanation:
    es: "Si el valor comprobado no se cuantificó con dictamen de peritos de la Administración, hace falta una valoración de un perito de esta (art. 135.2). Los demás medios no sustituyen esa condición, y el dictamen del perito del obligado no es de la Administración."
  citation: "art. 135.2 LGT"
  difficulty: 1
  tags:
  - "tasación pericial"
  - "peritos"
# anchor: boe-a-2003-23186-art-135
- id: m03-l07-q0146
  prompt:
    es: "De acuerdo con el artículo 135.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si la diferencia entre el valor del perito de la Administración y la tasación del perito del obligado es igual o inferior a 120.000 euros y al 10 por ciento de dicha tasación:"
  options:
  - id: a
    text:
      es: "deberá designarse un perito tercero para valorar los bienes."
  - id: b
    text:
      es: "la valoración del perito de la Administración servirá de base para la liquidación."
  - id: c
    text:
      es: "la media de ambas valoraciones servirá de base para la liquidación."
  - id: d
    correct: true
    text:
      es: "la tasación del perito del obligado servirá de base para la liquidación."
  explanation:
    es: "Con una diferencia igual o inferior a 120.000 euros y al 10 por ciento de la tasación, esta última sirve de base (art. 135.2). La valoración de la Administración o la media no son la base en ese caso, y el perito tercero solo se designa si la diferencia es superior."
  citation: "art. 135.2 LGT"
  difficulty: 2
  tags:
  - "tasación pericial"
  - "peritos"
