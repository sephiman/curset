# anchor: fuente-ms-office-autoguardado-html
- id: m02-l06-q199
  prompt:
    es: "Con Autoguardado activado, ¿cada cuánto tiempo guarda Microsoft 365 el archivo automáticamente mientras se trabaja?"
  options:
  - id: a
    text:
      es: "Cada hora"
  - id: b
    text:
      es: "Cada 10 minutos"
  - id: c
    text:
      es: "Solo al cerrar el archivo"
  - id: d
    correct: true
    text:
      es: "Cada pocos segundos"
  explanation:
    es: "Autoguardado guarda el archivo cada pocos segundos. Los 10 minutos aproximados son el intervalo con el que se añaden versiones nuevas al historial de versiones, no el del guardado; y Autoguardado guarda mientras se trabaja, sin esperar a una hora fija ni a que se cierre el archivo."
