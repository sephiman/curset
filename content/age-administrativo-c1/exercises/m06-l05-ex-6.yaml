# anchor: fuente-ms-excel-error-nombre-html
- id: m06-l05-q217
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes causas provoca el error #¿NOMBRE? en una fórmula?"
  options:
  - id: a
