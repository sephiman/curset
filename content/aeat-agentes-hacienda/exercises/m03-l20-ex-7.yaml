  prompt:
    es: "¿Qué requisito previo exige el artículo 233, apartado 4, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, para que las autoridades aduaneras puedan autorizar una de las simplificaciones del tránsito de la Unión?"
