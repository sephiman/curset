# anchor: fuente-ms-word-numeros-pagina-html
- id: m06-l04-q233
  prompt:
    es: "En Word 365, ¿cuál de las siguientes acciones se hace antes de insertar números de página para indicar dónde colocarlos?"
  options:
  - id: a
    correct: true
    text:
      es: "Hacer doble clic en el encabezado o pie de página donde se quieran colocar"
  - id: b
    text:
      es: "Seleccionar el último párrafo de la página anterior"
  - id: c
    text:
      es: "Hacer clic en Mostrar u ocultar ¶ del grupo Párrafo"
  - id: d
    text:
      es: "Insertar un salto de sección continuo antes de numerar"
  explanation:
    es: "La página dice: «Haga doble clic en el encabezado o pie de página donde quiera colocar los números de página», y solo después va a Insertar > Numeración de páginas. Seleccionar el último párrafo de la página anterior no es ninguno de los pasos de la página. Mostrar u ocultar ¶ es un botón que la página del índice usa para ver los campos XE, no para numerar. Y el salto de sección continuo, según la página de saltos de sección, inicia una nueva sección en la misma página; no figura entre los pasos para numerar."
  citation: "fuente: `ms-word-numeros-pagina.html`; «Agregar números de página a un encabezado o pie de página»"
  difficulty: 1
  tags:
  - "procedimiento"
