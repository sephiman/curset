# anchor: fuente-ms-win-asistencia-rapida-html
- id: m02-l07-q042
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes comandos restablece la caché de Microsoft Store, según las preguntas frecuentes de la Asistencia rápida?"
  options:
  - id: a
    correct: true
    text:
      es: "wsreset.exe"
  - id: b
    text:
      es: "regedit"
  - id: c
    text:
      es: "eventvwr.msc"
  - id: d
    text:
      es: "recoverydrive.exe"
  explanation:
    es: "La página dice que se restablece la caché de Microsoft Store con la tecla Windows y R, escribiendo wsreset.exe y seleccionando Aceptar. regedit abre el Editor del Registro, eventvwr.msc abre el Visor de eventos y recoverydrive.exe abre la Unidad de recuperación."
  citation: "fuente: `ms-win-asistencia-rapida.html`; «Preguntas frecuentes»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-desuso-html
- id: m02-l07-q136
  prompt:
    es: "Según Microsoft, ¿cuál de las siguientes aplicaciones de Windows 11 se recomienda para crear y editar documentos de texto sin formato, como los archivos con extensión .txt?"
  options:
  - id: a
    correct: true
    text:
      es: "El Bloc de notas de Windows"
  - id: b
    text:
      es: "Microsoft Word, de la suite de Microsoft 365"
  - id: c
    text:
      es: "Paint, la aplicación de edición gráfica"
  - id: d
    text:
      es: "La Calculadora, con sus modos de cálculo"
  explanation:
    es: "La página recomienda el Bloc de notas de Windows para documentos de texto sin formato como .txt y Microsoft Word para documentos de texto enriquecido como .doc y .rtf. Paint es una aplicación de edición gráfica y la Calculadora hace cálculos."
  citation: "fuente: `ms-win-desuso.html`; «WordPad»"
  difficulty: 1
  tags:
  - "concepto"
