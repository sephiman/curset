# anchor: fuente-ms-excel-atajos-html
- id: m06-l05-q108
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes métodos abreviados inserta la fecha actual en la celda activa?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+dos puntos (:)"
  - id: b
    text:
      es: "Ctrl+acento grave (`)"
  - id: c
    text:
      es: "Ctrl+Mayús+#"
  - id: d
    correct: true
    text:
      es: "Ctrl+punto y coma (;)"
  explanation:
    es: "Ctrl+punto y coma (;) inserta la fecha actual. Ctrl+Mayús+dos puntos (:) inserta la hora actual, Ctrl+acento grave (`) alterna entre mostrar valores o fórmulas y Ctrl+Mayús+# aplica el formato de fecha predeterminado."
  citation: "fuente: `ms-excel-atajos.html`; «Métodos abreviados de teclado para dar formato a celdas»"
  difficulty: 1
  tags:
  - "atajo"
