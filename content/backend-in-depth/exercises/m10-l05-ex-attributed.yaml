type: quiz
variants:
- id: m10-l05-qa01
  prompt:
    en: According to Pete Hodgson in Feature Toggles (aka Feature Flags), which statement about release toggles
      does he make?
  options:
  - id: a
    text:
      en: They are permanent by nature, left in place as a standing control
  - id: b
    correct: true
    text:
      en: They should generally not last much longer than a week or two
  - id: c
    text:
      en: Their toggling decision is typically very dynamic, changing per request
  - id: d
    text:
      en: Changing their toggling decision by rolling out a new release is unacceptable
  explanation:
    en: Hodgson writes that release toggles should generally not stick around much longer than a week or two, although
      product-centric toggles may stay longer. He rules out release toggles being permanent, because he writes that
      they are transitionary by nature. He rules out a dynamic toggling decision, because he writes that the toggling
      decision for a release toggle is typically very static. He rules out that rolling out a new release is unacceptable,
      because he writes that changing the decision by rolling out a new release with a toggle configuration change
      is usually perfectly acceptable.
  citation: fowler-feature-toggles#ReleaseToggles
- id: m10-l05-qa03
  prompt:
    en: According to Pete Hodgson in Feature Toggles (aka Feature Flags), which statement about managing the carrying
      cost of feature toggles does he make?
  options:
  - id: a
    correct: true
    text:
      en: Savvy teams treat toggles as inventory with a carrying cost, to be kept low
  - id: b
    text:
      en: Toggles are cheap to create, so they carry no cost once they are in the code
  - id: c
    text:
      en: A toggle removal task is added to the backlog only when an ops toggle is introduced
  - id: d
    text:
      en: A team that reaches its limit on toggles simply raises the limit to add a new one
  explanation:
    en: Hodgson writes that savvy teams view their feature toggles as inventory which comes with a carrying cost,
      and work to keep that inventory as low as possible. He rules out toggles carrying no cost, because he writes
      that toggles do come with a carrying cost. He rules out adding the removal task only for ops toggles, because
      he writes that some teams always add a toggle removal task to the backlog whenever a release toggle is first
      introduced. He rules out raising the limit, because he writes that once the limit is reached, whoever wants
      a new toggle must first do the work to remove an existing flag.
  citation: fowler-feature-toggles#ManagingTheCarryingCostOfFeatureToggles
- id: m10-l05-qa05
  prompt:
    en: According to Danilo Sato in Parallel Change, which statement about the parallel change pattern does the
      article make?
  options:
  - id: a
    text:
      en: Code can be released only once the contract phase has been completed
  - id: b
    text:
      en: It requires an explicit version in the exposed API when evolving a remote API
  - id: c
    correct: true
    text:
      en: During the migrate phase the supplier has to support two different versions
  - id: d
    text:
      en: A feature flag cannot be used to control which version clients use
  explanation:
    en: Sato names as the downside of parallel change that during the migrate phase the supplier has to support
      two different versions, and clients could get confused about which is new and which is old. He rules out releasing
      only after the contract phase, because he writes that the pattern allows the code to be released in any of
      its three phases. He rules out requiring an explicit version, because he writes that using parallel change
      on a remote API is an alternative to using an explicit version in the exposed API. He rules out that a feature
      flag cannot be used, because he writes that during the migrate phase a feature flag can be used to control
      which version of the interface is used.
  citation: fowler-parallel-change#banner
