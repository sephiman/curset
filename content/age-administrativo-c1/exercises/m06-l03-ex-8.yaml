# anchor: fuente-ms-win-bloc-notas-html
- id: m06-l03-q265
  prompt:
    es: "En el Bloc de notas de Windows 11, ¿cuál de los siguientes comandos de encabezado o pie de página alinea a la izquierda los caracteres que le siguen?"
  options:
  - id: a
    text:
      es: "&r"
  - id: b
    correct: true
    text:
      es: "&l"
  - id: c
    text:
      es: "&c"
  - id: d
    text:
      es: "&f"
  explanation:
    es: "La lista de la página dice que &l alinea a la izquierda los caracteres que le siguen. &r los alinea a la derecha, &c los centra y &f imprime el nombre del documento."
  citation: "fuente: `ms-win-bloc-notas.html`; «Cómo cambio el encabezado y el pie de página en el Bloc de notas»"
