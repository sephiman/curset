    - id: m03-l06
      title:
        es: 'Las declaraciones tributarias: concepto y clases. Las autoliquidaciones. Las comunicaciones de datos. Los
          pagos a cuenta.'
      summary:
        es: 'La declaración tributaria es todo documento presentado ante la Administración tributaria donde se
          reconozca o manifieste la realización de cualquier hecho relevante para la aplicación de los tributos. Las
          autoliquidaciones y las comunicaciones de datos son declaraciones, y caben autoliquidaciones complementarias y
          declaraciones o comunicaciones complementarias o sustitutivas. La obligación de realizar pagos a cuenta la
          cumplen el obligado a realizar pagos fraccionados, el retenedor y el obligado a realizar ingresos a cuenta, y
          la lección trata los pagos a cuenta del IRPF, del IS y del IRNR, las declaraciones-liquidaciones del IVA y los
          modelos con sus plazos.'
