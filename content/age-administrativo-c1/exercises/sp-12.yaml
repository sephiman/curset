type: case
title:
  es: "La campaña publicitaria de TURESPAÑA"
scenario:
  es: "El Instituto de Turismo de España (TURESPAÑA), organismo autónomo adscrito al Ministerio de Industria y Turismo a través de la Secretaría de Estado de Turismo, tiene su sede en Madrid. En los plazos por días solo es festivo en Madrid el lunes, 16 de agosto de 2027, y en Zaragoza, además, el viernes, 23 de abril de 2027, Día de Aragón. El recurso especial en materia de contratación se cuenta en la sede del Tribunal Administrativo Central de Recursos Contractuales, en Madrid.\n\nRutas del Norte Turismo, S.L. solicita entrar en un programa de promoción del Instituto. La solicitud entra en el registro electrónico el lunes, 12 de abril de 2027, y la norma del programa no fija plazo para resolver. Don Lorenzo Pastor Villalba se lesiona el viernes, 15 de enero de 2027, al caerle un panel en el stand del Instituto en una feria, y reclama por responsabilidad patrimonial.\n\nEl Instituto licita por procedimiento abierto un contrato de servicios de publicidad, sujeto a regulación armonizada, de valor estimado 1.200.000 euros, IVA excluido, con una prórroga de un año. Hay varios criterios de fórmula y ofertas electrónicas en un solo archivo. El presupuesto base de licitación es de 726.000 euros, IVA incluido, y el pliego no fija otro plazo de adjudicación. El anuncio se envía a la Oficina de Publicaciones de la Unión Europea el lunes, 12 de abril de 2027, y la Mesa abre las proposiciones el jueves, 27 de mayo de 2027. Una oferta se presume anormalmente baja y se sigue el trámite del artículo 149.4 de la Ley de Contratos del Sector Público. El miércoles, 11 de agosto de 2027, se adjudica el contrato por 726.000 euros a Publicidad Meridiana, S.A., y el jueves, 12 de agosto de 2027, se notifica a los licitadores. Campañas Atlántico, S.L., admitida, quiere recurrir. El contrato empieza el viernes, 1 de octubre de 2027, dura doce meses, se paga en mensualidades iguales, y su aplicación tenía en 2027 un crédito inicial de 640.000 euros.\n\nDoña Marta Pereda Linares, funcionaria interina, ocupa una plaza vacante que cubre por concurso un funcionario de carrera. Don Hugo Arce Valdés, funcionario de carrera del Cuerpo de Gestión de la Administración Civil del Estado, ocupa en el Instituto un puesto de libre designación y es nombrado miembro del consejo de gobierno de una comunidad autónoma. Doña Nuria Carrasco Bernal, funcionaria de carrera con destino definitivo en el Instituto desde el martes, 1 de septiembre de 2026, quiere concursar a un puesto de otra unidad de la Secretaría de Estado de Turismo. Doña Sonia Cebrián Mora, funcionaria de carrera en excedencia voluntaria por interés particular, obtiene por concurso un puesto en el Instituto. Doña Inés Beltrán Cuesta, funcionaria de carrera del Instituto, es vocal del tribunal de las pruebas de ingreso en el Cuerpo General Administrativo, subgrupo C1, de categoría segunda. Doña Elvira Santamaría Roca, del Cuerpo Superior de Administradores Civiles del Estado, viaja de Madrid a Sevilla en comisión de servicio.\n\nEl miércoles, 1 de septiembre de 2027, tres entidades cofinancian una campaña conjunta del Instituto: la primera ha ingresado 80.000 euros, la segunda se compromete firmemente a aportar 50.000 en octubre de 2027 y la tercera, 30.000 en 2028.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2015-10565-art-22
- id: q01
  lesson: m03-l03
  prompt:
    es: "Rutas del Norte Turismo, S.L. recibe el lunes, 19 de abril de 2027, un requerimiento de subsanación y lo atiende el miércoles, 28 de abril de 2027. ¿Hasta qué fecha puede el Instituto resolver y notificar su solicitud, cuyo plazo máximo es de tres meses?"
  options:
  - id: a
    text:
      es: "El lunes, 12 de julio de 2027."
  - id: b
    text:
      es: "El lunes, 19 de julio de 2027."
  - id: c
    correct: true
    text:
      es: "El miércoles, 21 de julio de 2027."
  - id: d
    text:
      es: "El miércoles, 28 de julio de 2027."
  explanation:
    es: "El plazo de tres meses cuenta desde la entrada de la solicitud y, sin suspensión, vence el lunes, 12 de julio de 2027. El plazo se suspende por el tiempo que media entre la notificación del requerimiento y su cumplimiento (art. 22.1.a) LPAC): del 19 al 28 de abril pasan nueve días. El lunes, 12 de julio de 2027, más nueve días, da el miércoles, 21 de julio de 2027. La fecha sin suspensión olvida el requerimiento. La que suma siete días solo descuenta los días hábiles del periodo, y la que cuenta tres meses desde el cumplimiento reinicia un plazo que solo se suspende."
  citation: "art. 22.1.a) LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-30
- id: q02
  lesson: m03-l03
  prompt:
    es: "El martes, 13 de abril de 2027, el Instituto abre a Aragón Rutas Activas, S.L., con domicilio en Zaragoza, un trámite de audiencia de diez días. ¿Hasta qué fecha puede la empresa presentar alegaciones?"
  options:
  - id: a
    text:
      es: "El jueves, 22 de abril de 2027."
  - id: b
    text:
      es: "El viernes, 23 de abril de 2027."
  - id: c
    text:
      es: "El martes, 27 de abril de 2027."
  - id: d
    correct: true
    text:
      es: "El miércoles, 28 de abril de 2027."
  explanation:
    es: "Los diez días son hábiles y empiezan el miércoles 14 de abril (art. 30.2–3 LPAC). El viernes 23 de abril es hábil en Madrid, sede del Instituto, pero inhábil donde reside la empresa, y entonces es inhábil en todo caso (art. 30.6 LPAC). Los días hábiles son 14, 15, 16, 19, 20, 21, 22, 26, 27 y 28 de abril, y el décimo es el miércoles, 28 de abril de 2027. La fecha del martes 27 ignora el festivo de Aragón. Las del jueves 22 y el viernes 23 cuentan diez días naturales, con o sin el día de la notificación."
  citation: "art. 30.6 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-88
