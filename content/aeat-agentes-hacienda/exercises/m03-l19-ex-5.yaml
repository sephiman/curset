  prompt:
    es: "¿Cuál de los siguientes vehículos se presume afecto a la actividad en la proporción del 100 por 100, según el artículo 95.Tres.2.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Los remolques de turismos utilizados para el transporte de bienes de la empresa."
  - id: b
    text:
      es: "Los turismos utilizados por el titular de la actividad en sus desplazamientos habituales."
  - id: c
    text:
      es: "Las motocicletas utilizadas en el reparto de documentos de la propia empresa."
  - id: d
    correct: true
    text:
      es: "Los vehículos mixtos utilizados en el transporte de mercancías."
  explanation:
