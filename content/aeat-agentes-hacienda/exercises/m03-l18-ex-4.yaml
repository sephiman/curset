# anchor: boe-a-1992-28740-art-8
- id: m03-l18-q0148
  prompt:
    es: "Conforme al artículo 8.Dos.3.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se consideran entregas de bienes las transmisiones de bienes en virtud de:"
  options:
  - id: a
    text:
      es: "una resolución administrativa, pero no de una resolución jurisdiccional dictada por un juez o tribunal."
  - id: b
    text:
      es: "un contrato de comodato o de depósito suscrito entre las partes."
  - id: c
    text:
      es: "una decisión unilateral del adquirente comunicada al transmitente."
  - id: d
    correct: true
    text:
      es: "una norma o de una resolución administrativa o jurisdiccional, incluida la expropiación forzosa."
  explanation:
    es: "Las transmisiones forzosas, por norma, resolución administrativa o jurisdiccional o expropiación, son entregas de bienes. El comodato y el depósito no transmiten el poder de disposición, la decisión unilateral del adquirente no es un título y las resoluciones judiciales también cuentan."
  citation: "art. 8.Dos.3.º LIVA"
  difficulty: 1
  tags:
  - "entrega de bienes"
  - "expropiación"
# anchor: boe-a-1992-28740-art-8
- id: m03-l18-q0149
  prompt:
    es: "Según el artículo 8.Dos.5.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se asimilan a los contratos de arrendamiento-venta los de arrendamiento de bienes con cláusula de transferencia de la propiedad:"
  options:
  - id: a
    correct: true
    text:
      es: "vinculante para ambas partes."
  - id: b
    text:
      es: "que solo vincule al arrendatario."
  - id: c
    text:
      es: "que se pacte verbalmente entre las partes contratantes."
  - id: d
    text:
      es: "sujeta a la aprobación del arrendador al final del contrato."
  explanation:
    es: "El arrendamiento con cláusula de transferencia de la propiedad se asimila al arrendamiento-venta si la cláusula vincula a ambas partes. Si solo obliga al arrendatario, depende de una aprobación posterior o es verbal, el texto no lo asimila."
  citation: "art. 8.Dos.5.º LIVA"
  difficulty: 2
  tags:
  - "entrega de bienes"
  - "arrendamiento-venta"
# anchor: boe-a-1992-28740-art-9
- id: m03-l18-q0152
  prompt:
    es: "¿Cómo se consideran los autoconsumos de bienes a efectos del impuesto, según el artículo 9 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Entregas de bienes a título gratuito que no están sujetas al impuesto."
  - id: b
    text:
      es: "Prestaciones de servicios asimiladas a título oneroso."
  - id: c
    text:
      es: "Operaciones no sujetas en todo caso por no existir contraprestación."
  - id: d
    correct: true
    text:
      es: "Operaciones asimiladas a las entregas de bienes a título oneroso."
  explanation:
    es: "El autoconsumo de bienes se asimila a una entrega de bienes a título oneroso. No queda fuera del impuesto por ser gratuito, el autoconsumo de servicios es el asimilado a las prestaciones, y la falta de contraprestación no hace la operación no sujeta en todo caso."
  citation: "art. 9.1.º LIVA"
  difficulty: 1
  tags:
  - "autoconsumo"
  - "operaciones asimiladas"
# anchor: boe-a-1992-28740-art-9
- id: m03-l18-q0173
  prompt:
    es: "De acuerdo con el artículo 9.1.º.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, las exclusiones del autoconsumo por cambio de sector o de régimen de tributación se entienden sin perjuicio de:"
  options:
  - id: a
    text:
      es: "las sanciones por cambio de régimen sin comunicación previa."
  - id: b
    text:
      es: "la obligación de presentar una declaración censal de modificación."
  - id: c
    correct: true
    text:
      es: "las regularizaciones de deducciones que prevé la propia ley."
  - id: d
    text:
      es: "la tributación de la plusvalía por el Impuesto sobre Sociedades."
  explanation:
    es: "Aunque no haya autoconsumo, siguen aplicándose las regularizaciones de deducciones que prevé la ley. El Impuesto sobre Sociedades, la declaración censal y las sanciones no son el contenido de esa salvedad."
  citation: "art. 9.1.º.c) LIVA"
  difficulty: 3
  tags:
  - "autoconsumo"
  - "regularización de deducciones"
# anchor: boe-a-1992-28740-art-8
- id: m03-l18-q0183
  prompt:
    es: "De acuerdo con el artículo 8.Dos.6.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se consideran entregas de bienes las transmisiones de bienes entre comitente y comisionista efectuadas en virtud de contratos de:"
  options:
  - id: a
    text:
      es: "Comisión de venta, pero no de comisión de compra, cuando el comisionista actúe en nombre propio."
  - id: b
    text:
      es: "Comisión de compra, pero no de comisión de venta, cuando el comisionista actúe en nombre propio."
  - id: c
    correct: true
    text:
      es: "Comisión de venta o comisión de compra, cuando el comisionista actúe en nombre propio."
  - id: d
    text:
      es: "Comisión de venta o comisión de compra, cuando el comisionista actúe en nombre ajeno."
  explanation:
    es: "Son entregas de bienes las transmisiones entre comitente y comisionista que actúe en nombre propio efectuadas en virtud de contratos de comisión de venta o de comisión de compra (art. 8.Dos.6.º). Limitarlo a una sola de las dos comisiones contradice el precepto, que menciona ambas. Y si el comisionista actúa en nombre ajeno no hay transmisión de bienes entre él y el comitente: la agencia o comisión en nombre ajeno es una prestación de servicios (art. 11.Dos.15.º)."
  citation: "art. 8.Dos.6.º LIVA"
  difficulty: 2
  tags:
  - "entregas de bienes"
  - "comisión"
# anchor: boe-a-1992-28740-art-11
- id: m03-l18-q0064
  prompt:
    es: "Según el artículo 11.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, prestación de servicios es toda operación sujeta al impuesto que, de acuerdo con la ley, no tenga la consideración de entrega, adquisición intracomunitaria o:"
  options:
  - id: a
    text:
      es: "operación sujeta y no exenta realizada por un empresario."
  - id: b
    text:
      es: "exportación de bienes a países terceros fuera de la Comunidad."
  - id: c
    correct: true
    text:
      es: "importación de bienes procedentes de territorios terceros."
  - id: d
    text:
      es: "operación exenta del impuesto por aplicación del artículo 20."
  explanation:
    es: "La prestación de servicios es lo que, siendo operación sujeta, no es entrega, adquisición intracomunitaria ni importación de bienes. La exportación no figura en el precepto, y las operaciones exentas o sujetas y no exentas pueden ser servicios, así que no los excluyen."
  citation: "art. 11.Uno LIVA"
  difficulty: 2
  tags:
  - "prestación de servicios"
  - "concepto"
# anchor: boe-a-1992-28740-art-11
- id: m03-l18-q0065
  prompt:
    es: "¿Cuál de las siguientes operaciones se considera prestación de servicios, conforme al artículo 11.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "El suministro de energía eléctrica a un consumidor."
  - id: b
    text:
      es: "La adjudicación de bienes a los socios en la liquidación de una sociedad."
  - id: c
    text:
      es: "La cesión de bienes en un contrato de venta con condición suspensiva."
  - id: d
    correct: true
    text:
      es: "El arrendamiento de una empresa o de un establecimiento mercantil."
  explanation:
    es: "Los arrendamientos de empresas o establecimientos mercantiles son prestaciones de servicios. La energía eléctrica es un bien corporal y su suministro una entrega, y la venta con condición suspensiva y la adjudicación en la liquidación son entregas de bienes del artículo 8."
  citation: "art. 11.Dos LIVA"
  difficulty: 1
  tags:
  - "prestación de servicios"
  - "arrendamientos"
# anchor: boe-a-1992-28740-art-11
- id: m03-l18-q0066
  prompt:
    es: "Albañilería Duero, S.L. ejecuta para Hotel Sierra, S.A. la construcción de un almacén por 100.000 euros de base imponible y aporta materiales cuyo coste es de 30.000 euros. Conforme a los artículos 8.Dos.1.º y 11.Dos.6.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cómo se califica la operación?"
  options:
  - id: a
    correct: true
    text:
      es: "Como prestación de servicios, porque el coste de los materiales, un 30 %, no excede del 40 % de la base imponible."
  - id: b
    text:
      es: "Como entrega de bienes, porque el coste de los materiales excede del 25 % de la base imponible."
  - id: c
    text:
      es: "Como entrega de bienes, porque el empresario aporta una parte de los materiales."
  - id: d
    text:
      es: "Como prestación de servicios, porque las ejecuciones de obra de una edificación nunca son entregas de bienes con arreglo al artículo 8."
  explanation:
    es: "La ejecución de obra es entrega de bienes solo si los materiales aportados superan el 40 por 100 de la base imponible. Aquí son el 30 por 100, así que es prestación de servicios. Aportar materiales no basta, el umbral no es el 25 por 100 y las obras de edificación sí pueden ser entregas."
  citation: "art. 11.Dos.6.º LIVA"
  difficulty: 2
  tags:
  - "prestación de servicios"
  - "ejecución de obra"
  - "cómputo"
# anchor: boe-a-1992-28740-art-11
- id: m03-l18-q0067
  prompt:
    es: "De acuerdo con el artículo 11.Dos.16.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se considera prestación de servicios el suministro de productos informáticos que no tenga la condición de entrega de bienes, en particular el de los que sean objeto de:"
  options:
  - id: a
    text:
      es: "una copia en soporte físico entregada al usuario final con su licencia de uso."
  - id: b
    correct: true
    text:
      es: "adaptaciones sustanciales necesarias para su uso por el destinatario."
  - id: c
    text:
      es: "una instalación en los equipos propios del proveedor."
  - id: d
    text:
      es: "una licencia de uso que no exija modificación alguna."
  explanation:
    es: "El suministro de productos informáticos con adaptaciones sustanciales necesarias para su uso es una prestación de servicios. Una copia en soporte, la instalación en equipos del proveedor y la licencia sin modificación no son las adaptaciones que describe el precepto, y el producto sin modificación sustancial es una entrega."
  citation: "art. 11.Dos.16.º LIVA"
  difficulty: 3
  tags:
  - "prestación de servicios"
  - "productos informáticos"
# anchor: boe-a-1992-28740-art-11
- id: m03-l18-q0068
  prompt:
    es: "¿Cuál de las siguientes operaciones tiene la consideración de prestación de servicios conforme al artículo 11.Dos.15.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "La cesión de bienes en un contrato de venta con pacto de reserva de dominio."
  - id: b
    text:
      es: "La transmisión entre comitente y comisionista que actúa en nombre propio en una comisión de venta."
  - id: c
    correct: true
    text:
      es: "La agencia o comisión en que el agente o comisionista actúa en nombre ajeno."
  - id: d
    text:
      es: "La adjudicación de bienes a los socios en la disolución de una sociedad."
  explanation:
    es: "La mediación y la agencia o comisión en nombre ajeno son servicios. Si el comisionista actúa en nombre propio, las transmisiones con el comitente son entregas de bienes, igual que la venta con reserva de dominio y la adjudicación en la disolución."
  citation: "art. 11.Dos.15.º LIVA"
  difficulty: 2
  tags:
  - "prestación de servicios"
  - "mediación"
# anchor: boe-a-1992-28740-art-11
- id: m03-l18-q0069
  prompt:
    es: "Conforme al artículo 11.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se consideran prestaciones de servicios, en particular, los traspasos de locales de negocio y:"
  options:
  - id: a
    text:
      es: "las cesiones de bienes en contratos de arrendamiento-venta."
  - id: b
    text:
      es: "las entregas de gas, calor, frío y energía eléctrica."
  - id: c
    correct: true
    text:
      es: "los préstamos y créditos en dinero."
  - id: d
    text:
      es: "las aportaciones no dinerarias a sociedades de elementos empresariales."
  explanation:
    es: "Los préstamos y créditos en dinero figuran entre las prestaciones de servicios del artículo 11.Dos. Las aportaciones no dinerarias, el suministro de energía y el arrendamiento-venta son entregas de bienes del artículo 8."
  citation: "art. 11.Dos LIVA"
  difficulty: 1
  tags:
  - "prestación de servicios"
  - "enumeración"
# anchor: boe-a-1992-28740-art-12
- id: m03-l18-q0070
  prompt:
    es: "Marcos Ibáñez, empresario individual, traslada sin contraprestación a su patrimonio personal la titularidad de una marca registrada que figuraba en su patrimonio empresarial. Según el artículo 12 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cómo se califica la operación?"
  options:
  - id: a
    correct: true
    text:
      es: "Como autoconsumo de servicios, porque se transfieren derechos y no bienes corporales."
  - id: b
    text:
      es: "Como autoconsumo de bienes del artículo 9, asimilado a una entrega de bienes."
  - id: c
    text:
      es: "Como entrega de bienes a título gratuito, que no se asimila a ninguna operación a título oneroso."
  - id: d
    text:
      es: "Como operación no sujeta, porque una marca no es un bien corporal."
  explanation:
    es: "La transferencia de bienes y derechos al patrimonio personal que no es autoconsumo de bienes del artículo 9 es autoconsumo de servicios. Una marca es un derecho, no un bien corporal, de modo que no es autoconsumo de bienes. Tampoco queda fuera del impuesto ni es una entrega gratuita sin asimilar."
  citation: "art. 12 LIVA"
  difficulty: 3
  tags:
  - "autoconsumo de servicios"
  - "transferencia de derechos"
# anchor: boe-a-1992-28740-art-12
- id: m03-l18-q0071
  prompt:
    es: "Señale la respuesta CORRECTA sobre las prestaciones de servicios gratuitas del sujeto pasivo, según el artículo 12 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "No son autoconsumo, porque el autoconsumo de servicios se limita al uso particular de bienes."
  - id: b
    text:
      es: "Son autoconsumo de servicios todas las prestaciones gratuitas, también las realizadas para promocionar su actividad."
  - id: c
    text:
      es: "Son autoconsumo de servicios solo las prestaciones gratuitas que se realicen en favor de familiares."
  - id: d
    correct: true
    text:
      es: "Son autoconsumo de servicios las demás prestaciones gratuitas, siempre que se realicen para fines ajenos a los de la actividad empresarial o profesional."
  explanation:
    es: "Las demás prestaciones gratuitas son autoconsumo si se hacen para fines ajenos a la actividad. Las de promoción de la actividad, como las demostraciones, no lo son, el precepto no se refiere a los familiares y el uso particular de bienes es solo uno de los tres supuestos."
  citation: "art. 12 LIVA"
  difficulty: 2
  tags:
  - "autoconsumo de servicios"
  - "fines ajenos"
# anchor: boe-a-1992-28740-art-12
- id: m03-l18-q0072
  prompt:
    es: "De acuerdo con el artículo 12 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, son autoconsumos de servicios la aplicación total o parcial al uso particular del sujeto pasivo o, en general, a fines ajenos a su actividad empresarial o profesional, de:"
  options:
  - id: a
    text:
      es: "los bienes de un tercero que tenga arrendados el sujeto pasivo."
  - id: b
    correct: true
    text:
      es: "los bienes integrantes de su patrimonio empresarial o profesional."
  - id: c
    text:
      es: "los servicios prestados por terceros para el desarrollo de su actividad."
  - id: d
    text:
      es: "los bienes integrantes de su patrimonio personal ajenos a la actividad."
  explanation:
    es: "El autoconsumo de servicios consiste en aplicar al uso particular o a fines ajenos a la actividad los bienes del patrimonio empresarial o profesional. Los servicios de terceros, los bienes del patrimonio personal y los bienes arrendados no son bienes integrantes de ese patrimonio."
  citation: "art. 12 LIVA"
  difficulty: 2
  tags:
  - "autoconsumo de servicios"
  - "uso particular"
# anchor: boe-a-1992-28740-art-12
- id: m03-l18-q0153
  prompt:
    es: "¿Qué requisito común deben cumplir las operaciones que el artículo 12 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido califica como autoconsumos de servicios?"
  options:
  - id: a
    text:
      es: "Que se presten con carácter habitual en favor de familiares del empresario."
  - id: b
    text:
      es: "Que se presten a un precio inferior al coste de producirlos."
  - id: c
    correct: true
    text:
      es: "Que se realicen sin contraprestación."
  - id: d
    text:
      es: "Que el sujeto pasivo no hubiese deducido el IVA soportado en su adquisición."
  explanation:
    es: "Los autoconsumos de servicios son las operaciones del artículo 12 realizadas sin contraprestación. La deducción del IVA, la habitualidad con familiares y un precio inferior al coste no son requisitos comunes."
  citation: "art. 12 LIVA"
  difficulty: 1
  tags:
  - "autoconsumo de servicios"
  - "sin contraprestación"
# anchor: boe-a-1992-28740-art-11
- id: m03-l18-q0154
  prompt:
    es: "Señale cuál de las siguientes operaciones se considera prestación de servicios, según el artículo 11.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "La adjudicación de edificaciones promovidas por una comunidad de bienes a los comuneros."
  - id: b
    text:
      es: "El suministro de un producto informático normalizado en un soporte material."
  - id: c
    text:
      es: "La transmisión de bienes en virtud de una expropiación forzosa."
  - id: d
    correct: true
    text:
      es: "El ejercicio independiente de una profesión, arte u oficio."
  explanation:
    es: "El ejercicio independiente de una profesión, arte u oficio es una prestación de servicios. La adjudicación a los comuneros, el producto informático normalizado y la expropiación forzosa son entregas de bienes del artículo 8."
  citation: "art. 11.Dos LIVA"
  difficulty: 1
  tags:
  - "prestación de servicios"
  - "enumeración"
# anchor: boe-a-1992-28740-art-11
- id: m03-l18-q0155
  prompt:
    es: "Según el artículo 11.Dos.3.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué cesiones tienen la consideración de prestaciones de servicios?"
  options:
  - id: a
    correct: true
    text:
      es: "Las cesiones del uso o disfrute de bienes."
  - id: b
    text:
      es: "Las cesiones de bienes en virtud de contratos de venta con pacto de reserva de dominio."
  - id: c
    text:
      es: "Las cesiones de bienes en virtud de contratos de arrendamiento-venta y asimilados."
  - id: d
    text:
      es: "Las cesiones de títulos representativos de bienes corporales."
  explanation:
    es: "La cesión del uso o disfrute de bienes es una prestación de servicios. La venta con reserva de dominio y el arrendamiento-venta son entregas de bienes del artículo 8, y la cesión de títulos representativos es una forma de entrega."
  citation: "art. 11.Dos.3.º LIVA"
  difficulty: 2
  tags:
  - "prestación de servicios"
  - "cesión de uso"
# anchor: boe-a-1992-28740-art-12
- id: m03-l18-q0164
  prompt:
    es: "De acuerdo con el artículo 12 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, son autoconsumos de servicios las demás prestaciones de servicios efectuadas a título gratuito por el sujeto pasivo, siempre que se realicen para fines ajenos a los de:"
  options:
  - id: a
    text:
      es: "otros empresarios del mismo sector de actividad."
  - id: b
    correct: true
    text:
      es: "la actividad empresarial o profesional."
  - id: c
    text:
      es: "las operaciones exentas de su empresa."
  - id: d
    text:
      es: "los socios o partícipes de la entidad."
  explanation:
    es: "Son autoconsumo las prestaciones gratuitas realizadas para fines ajenos a la actividad empresarial o profesional. Las operaciones exentas, los socios y otros empresarios del sector no son el criterio del número."
  citation: "art. 12 LIVA"
  difficulty: 1
  tags:
  - "autoconsumo de servicios"
  - "fines ajenos"
# anchor: boe-a-1992-28740-art-11
- id: m03-l18-q0171
  prompt:
    es: "Señale la respuesta CORRECTA sobre las operaciones del artículo 11.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Los traspasos de locales de negocio son entregas de bienes inmuebles."
  - id: b
    correct: true
    text:
      es: "Los traspasos de locales de negocio y los transportes son prestaciones de servicios."
  - id: c
    text:
      es: "Las prestaciones de hospitalización son operaciones no sujetas al impuesto."
  - id: d
    text:
      es: "Los transportes son entregas de bienes cuando lo transportado sean bienes corporales."
  explanation:
    es: "Los traspasos de locales de negocio y los transportes figuran en la lista de prestaciones de servicios. No son entregas de bienes, aunque lo transportado sean bienes, y la hospitalización es una prestación de servicios sujeta, con exención en el artículo 20."
  citation: "art. 11.Dos LIVA"
