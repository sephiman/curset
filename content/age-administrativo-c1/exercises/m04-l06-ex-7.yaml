  prompt:
    es: "Según el artículo 37.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, contestado el pliego o transcurrido el plazo sin hacerlo, para la práctica de las pruebas se dispondrá del plazo de:"
