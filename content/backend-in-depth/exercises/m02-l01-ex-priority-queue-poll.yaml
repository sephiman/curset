- id: m02-l01-v-priority-queue-poll-001
  prompt:
    en: |-
      What does this program print? All six values are offered first, and no two of them tie under the ordering.

      ```java
      import java.util.*;

      public class Main {
          public static void main(String[] args) {
              Queue<Integer> q = new PriorityQueue<>();
              for (int v : new int[] {41, 52, 33, 64, 25, 76}) q.offer(v);
              System.out.println(q.poll() + " " + q.peek() + " " + q.size());
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`25 33 5`'
    correct: true
  - id: b
    text:
      en: '`41 52 5`'
  - id: c
    text:
      en: '`76 64 5`'
  - id: d
    text:
      en: '`25 33 4`'
  explanation:
    en: 'The head of a `PriorityQueue` is the least element under its ordering, which here is natural ascending order. Each
      `poll()` removes the current head, so the values come out in that order whatever order they were offered in, and `size()`
      counts only the values still queued. The program prints `25 33 5`. `41 52 5` comes from this mistake: assuming the queue
      serves values in insertion order. The head of a `PriorityQueue` is its least element under the ordering, not the value
      offered first. `76 64 5` comes from this mistake: assuming the greatest value is served first. The head is the least
      element under the ordering, which here is natural ascending order and not descending natural order. `25 33 4` comes
      from this mistake: assuming `peek` removes the head. `peek()` returns the head without removing it.'
  family: priority-queue-poll
  code_reading: true
  citation: javadoc-priorityqueue#class-priorityqueue-e
  difficulty: 3
