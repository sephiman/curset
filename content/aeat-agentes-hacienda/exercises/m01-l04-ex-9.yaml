# anchor: celex-12016e-txt-art-263
- id: m01-l04-q0226
  prompt:
    es: "Según el artículo 263 del Tratado de Funcionamiento de la Unión Europea, el Tribunal de Justicia de la Unión Europea controla la legalidad de los actos del Parlamento Europeo y del Consejo Europeo:"
  options:
  - id: a
    text:
      es: "Cualquiera que sea su naturaleza."
  - id: b
    text:
      es: "Que sean recomendaciones o dictámenes."
  - id: c
    text:
      es: "Solo si afectan a más de un Estado miembro."
  - id: d
    correct: true
    text:
      es: "Destinados a producir efectos jurídicos frente a terceros."
  explanation:
    es: "Controla los actos del Parlamento y del Consejo Europeo destinados a producir efectos jurídicos frente a terceros. No controla todos los actos sin distinción. Las recomendaciones y dictámenes quedan fuera cuando son del Consejo, la Comisión o el Banco Central Europeo, y el control no depende de que afecten a más de un Estado."
  citation: "art. 263 TFUE"
  difficulty: 3
  tags:
  - "competencia"
