  explanation:
    es: "El nombre debe poder resolverse por el archivo hosts local, por consultas DNS o por técnicas de resolución de nombres NetBIOS. El archivo hosts es uno de los tres medios, no el único. Las consultas DNS son uno de los tres medios, no el único. NetBIOS es uno de los tres medios, no el único."
  citation: "fuente: `ms-win-ping.html`; «ping»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-ping-html
- id: m06-l08-q118
  prompt:
    es: "En Windows 11, si el comando ping se escribe sin ningún parámetro, el sistema muestra:"
  options:
  - id: a
    text:
      es: "El error «Tiempo de espera de solicitud» tras cuatro intentos"
  - id: b
    text:
      es: "Los tiempos de ida y vuelta hacia el equipo local"
  - id: c
    correct: true
    text:
      es: "El contenido de la Ayuda"
  - id: d
    text:
      es: "Una solicitud de eco enviada a la puerta de enlace predeterminada"
