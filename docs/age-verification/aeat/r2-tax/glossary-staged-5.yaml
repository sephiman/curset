# Tax-part glossary entries, batch 5 (III.15–III.20), staged for the blind check.
- id: g-renta-en-especie
  es: rentas en especie
  origin: m03-l15
  definition:
    es: La utilización, consumo u obtención, para fines particulares, de bienes, derechos o servicios de forma gratuita o
      por precio inferior al normal de mercado, aun cuando no supongan un gasto real para quien las conceda; cuando el pagador
      entrega al contribuyente importes en metálico para que adquiera los bienes, derechos o servicios, la renta es dineraria,
      y el apartado 2 excluye determinados supuestos de los rendimientos del trabajo en especie (art. 42.1 y 42.2 LIRPF).
- id: g-ganancias-y-perdidas-patrimoniales
  es: ganancias y pérdidas patrimoniales
  origin: m03-l15
  definition:
    es: Las variaciones en el valor del patrimonio del contribuyente que se pongan de manifiesto con ocasión de cualquier
      alteración en la composición de aquel, salvo que por la LIRPF se califiquen como rendimientos; el artículo 33 excluye
      los supuestos en que se estima que no existe alteración en la composición del patrimonio o que no existe ganancia o
      pérdida patrimonial, y las pérdidas que no se computan (art. 33.1, 33.2, 33.3 y 33.5 LIRPF).
- id: g-minimo-personal-y-familiar
  es: mínimo personal y familiar
  origin: m03-l16
  definition:
    es: La parte de la base liquidable que, por destinarse a satisfacer las necesidades básicas personales y familiares del
      contribuyente, no se somete a tributación por el IRPF (art. 56.1 LIRPF).
- id: g-edificaciones
  es: edificaciones
  origin: m03-l18
  definition:
    es: A efectos del IVA, las construcciones unidas permanentemente al suelo o a otros inmuebles, efectuadas tanto sobre
      la superficie como en el subsuelo, que sean susceptibles de utilización autónoma e independiente; no tienen esa consideración
      las que enumera el apartado Tres, entre ellas las obras de urbanización de terrenos y las minas, canteras o escoriales
      (art. 6.Uno y 6.Tres LIVA).
- id: g-sede-de-la-actividad-economica
  es: sede de la actividad económica
  origin: m03-l18
  definition:
    es: El lugar en el que los empresarios o profesionales centralizan la gestión y el ejercicio habitual de su actividad
      empresarial o profesional (art. 69.Tres.1.º LIVA).
- id: g-bienes-de-inversion
  es: bienes de inversión
  origin: m03-l19
  definition:
    es: Los bienes corporales, muebles, semovientes o inmuebles que, por su naturaleza y función, estén normalmente destinados
      a ser utilizados por un período de tiempo superior a un año como instrumentos de trabajo o medios de explotación; no
      lo son, entre otros, los envases y embalajes, aunque sean susceptibles de reutilización, las ropas utilizadas para el
      trabajo por los sujetos pasivos o el personal dependiente y cualquier otro bien cuyo valor de adquisición sea inferior
      a quinientas mil pesetas (art. 108.Uno y 108.Dos LIVA).
- id: g-deuda-aduanera
  es: deuda aduanera
  origin: m03-l20
  definition:
    es: La obligación de una persona de pagar el importe de los derechos de importación o de exportación aplicables a mercancías
      específicas con arreglo a la legislación aduanera vigente (art. 5.18 CAU).
- id: g-representante-aduanero
  es: representante aduanero
  origin: m03-l20
  definition:
    es: Toda persona nombrada por otra persona para ejecutar los actos y formalidades necesarios en virtud de la legislación
      aduanera en sus relaciones con las autoridades aduaneras (art. 5.6 CAU).
- id: g-levante-de-las-mercancias
  es: levante de las mercancías
  origin: m03-l20
  definition:
    es: El acto por el que las autoridades aduaneras ponen las mercancías a disposición de los fines concretos del régimen
      aduanero en el que se hayan incluido (art. 5.26 CAU).
- id: g-deposito-temporal
  es: depósito temporal
  origin: m03-l20
  definition:
    es: La situación en la que mercancías no pertenecientes a la Unión se almacenan temporalmente bajo vigilancia aduanera
      en el período entre su presentación en aduana y su inclusión en un régimen aduanero o su reexportación (art. 5.17 CAU).
- id: g-operador-economico
  es: operador económico
  origin: m03-l20
  definition:
    es: Toda persona que, en el ejercicio de su actividad profesional, efectúe actividades a las que se aplique la legislación
      aduanera (art. 5.5 CAU).
