# anchor: boe-a-2005-14803-art-54
- id: m03-l09-q0176
  prompt:
    es: "Según el artículo 54.1.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en los aplazamientos, si llegado el vencimiento del plazo concedido no se efectúa el pago y la solicitud se presentó en período voluntario, se iniciará el período ejecutivo:"
  options:
  - id: a
    text:
      es: "Al día siguiente al del vencimiento del plazo de ingreso en período voluntario."
  - id: b
    text:
      es: "A los diez días del vencimiento del plazo incumplido."
  - id: c
    correct: true
    text:
      es: "Al día siguiente del vencimiento del plazo incumplido."
  - id: d
    text:
      es: "Al día siguiente al de la notificación del acuerdo de concesión."
  explanation:
    es: "El período ejecutivo comienza al día siguiente del vencimiento del plazo incumplido (artículo 54.1.a). No retrocede al fin del plazo voluntario ni al día de la concesión, y no hay demora de diez días."
  citation: "art. 54.1 RGR"
  difficulty: 1
  tags:
  - "aplazamiento"
  - "falta de pago"
# anchor: boe-a-2005-14803-art-54
- id: m03-l09-q0177
  prompt:
    es: "Conforme al artículo 54.1.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿cuándo se inicia el período ejecutivo de una deuda con aplazamiento solicitado en período voluntario cuyo plazo concedido vencía el martes 20 de julio de 2027 sin que se haya pagado?"
  options:
  - id: a
    correct: true
    text:
      es: "El miércoles 21 de julio de 2027, día siguiente al vencimiento del plazo incumplido."
  - id: b
    text:
      es: "El martes 20 de julio de 2027, mismo día del vencimiento del plazo incumplido."
  - id: c
    text:
      es: "El viernes 20 de agosto de 2027, un mes después del vencimiento del plazo."
  - id: d
    text:
      es: "El miércoles 21 de abril de 2027, día siguiente al fin del plazo voluntario inicial."
  explanation:
    es: "El período ejecutivo se inicia al día siguiente del vencimiento del plazo incumplido (artículo 54.1.a): el 21 de julio. El mismo día del vencimiento aún es plazo de pago. Un mes después y el día siguiente al fin del plazo voluntario inicial no son fechas del precepto."
  citation: "art. 54.1 RGR"
  difficulty: 3
  tags:
