# anchor: boe-a-2021-5032-art-40
- id: m02-l04-q116
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, la oficina de asistencia en materia de registros digitaliza las solicitudes, escritos y comunicaciones en papel y los anota en el Registro Electrónico General o en el:"
  options:
  - id: a
    correct: true
    text:
      es: "Registro electrónico de cada organismo o entidad, según corresponda."
  - id: b
    text:
      es: "Directorio geográfico de oficinas de asistencia en materia de registros."
  - id: c
    text:
      es: "Archivo electrónico único de la Administración competente."
  - id: d
    text:
      es: "Registro de Funcionarios Habilitados de la Administración General del Estado."
  explanation:
    es: "La anotación se hace en el Registro Electrónico General o en el registro electrónico del organismo o entidad que corresponda. El archivo único, el directorio de oficinas y el registro de funcionarios no son registros de entrada."
  citation: "art. 40.3.a) RD 203/2021"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2021-5032-art-40
- id: m02-l04-q117
  prompt:
    es: "¿En qué procedimientos realiza la oficina de asistencia en materia de registros la identificación o firma electrónica de la persona no obligada a relacionarse electrónicamente?"
  options:
  - id: a
    text:
      es: "En los procedimientos en que el interesado carezca de representante."
  - id: b
    text:
      es: "En todos los procedimientos que se inicien a solicitud del interesado."
  - id: c
    correct: true
    text:
      es: "En los procedimientos para los que se haya previsto habilitación."
  - id: d
    text:
      es: "Solo en los procedimientos de la Administración General del Estado."
  explanation:
    es: "La función se limita a los procedimientos para los que se ha previsto la habilitación. No se extiende a todos los procedimientos de parte, ni se restringe a la Administración General del Estado, ni depende de que falte representante."
  citation: "art. 40.3.f) RD 203/2021"
  difficulty: 2
  tags:
  - "competencia"
# anchor: fuente-sgad-catalogo-servicios-admin-digital-pdf
- id: m02-l04-q118
  prompt:
    es: "En el Catálogo de servicios de Administración digital, ¿qué servicios son soluciones para oficinas de registro, para la digitalización de documentos y para el intercambio de asientos registrales por SIR?"
  options:
  - id: a
    correct: true
    text:
      es: "Geiser y ORVE."
  - id: b
    text:
      es: "REA y RFH."
  - id: c
    text:
      es: "Representa y Notaría."
  - id: d
    text:
      es: "SICRES 3.0 y REC."
  explanation:
    es: "Geiser y ORVE son las soluciones para oficinas de registro y digitalización de documentos que intercambian asientos por SIR. REA y RFH son registros de apoderamientos y de funcionarios, Representa y Notaría validan representaciones, y SICRES 3.0 y REC son un modelo de datos y un punto único de presentación."
  citation: "fuente: `sgad-catalogo-servicios-admin-digital.pdf`; «Registros y representación del ciudadano ante las AA.PP.»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-sgad-catalogo-servicios-admin-digital-pdf
- id: m02-l04-q119
  prompt:
    es: "¿Qué apartado del Catálogo de servicios de Administración digital incluye SIR, REC, SICRES 3.0, Geiser y ORVE, REA, RFH, Representa y Notaría?"
  options:
  - id: a
    text:
      es: "Notificaciones y comunicaciones electrónicas con los ciudadanos."
  - id: b
    correct: true
    text:
      es: "Registros y representación del ciudadano ante las AA.PP."
  - id: c
    text:
      es: "Identidad digital y firma electrónica de los ciudadanos."
  - id: d
    text:
      es: "Atención al ciudadano y empresa en las AA.PP."
  explanation:
    es: "Esos ocho servicios figuran en el apartado «Registros y representación del ciudadano ante las AA.PP.». Identidad digital agrupa Cl@ve y @Firma, y atención al ciudadano incluye el PAG y el 060."
  citation: "fuente: `sgad-catalogo-servicios-admin-digital.pdf`; «Registros y representación del ciudadano ante las AA.PP.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-40
- id: m02-l04-q184
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, las oficinas de asistencia en materia de registros practican notificaciones, en el ámbito de actuación de la Oficina, cuando el interesado o su representante comparezcan de forma espontánea en ella y soliciten:"
  options:
  - id: a
    correct: true
    text:
      es: "La comunicación o notificación personal en ese momento."
  - id: b
    text:
      es: "El aplazamiento de la notificación a la sede electrónica."
  - id: c
    text:
      es: "La emisión de un recibo de presentación."
  - id: d
    text:
      es: "Una copia electrónica auténtica de la notificación."
  explanation:
    es: "La función se activa cuando quien comparece espontáneamente solicita la comunicación o notificación personal en ese momento. La copia auténtica, el aplazamiento a la sede y el recibo de presentación son otras funciones o trámites distintos."
  citation: "art. 40.3.g) RD 203/2021"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2015-2671-preambulo
- id: m02-l04-q035
  prompt:
    es: "¿Qué aprobó el Acuerdo del Consejo de Ministros de 15 de julio de 2005, publicado por Resolución de 19 de julio de 2005?"
  options:
  - id: a
    correct: true
    text:
      es: "La implantación de una Red de Oficinas Integradas de Atención al Ciudadano."
  - id: b
    text:
      es: "La creación del Punto de Acceso General de la Administración General del Estado."
  - id: c
    text:
      es: "La integración de las ventanillas únicas empresariales en los Puntos de Atención al Emprendedor."
  - id: d
    text:
      es: "La creación del sistema de tramitación telemática para constituir empresas."
  explanation:
    es: "El preámbulo del Real Decreto 127/2015 recuerda que se aprobó «el Acuerdo del Consejo de Ministros de 15 de julio de 2005, para la implantación de una Red de Oficinas Integradas de Atención al Ciudadano». El Punto de Acceso General lo regula la Orden HAP/1949/2014. La integración de las ventanillas en los Puntos de Atención al Emprendedor la hace el propio Real Decreto 127/2015. El sistema CIRCE se creó en 2003, según el portal del PAE."
  citation: "preámbulo RD 127/2015"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2014-10908-da-segunda
- id: m02-l04-q036
  prompt:
    es: "De acuerdo con la disposición adicional segunda de la Orden HAP/1949/2014, de 13 de octubre, las referencias al portal 060 de los convenios para la implantación de oficinas integradas se entenderán hechas:"
  options:
  - id: a
    text:
      es: "A la sede de cada Delegación del Gobierno."
  - id: b
    correct: true
    text:
      es: "Al Punto de Acceso General."
  - id: c
    text:
      es: "A la Carpeta Ciudadana del sector público estatal."
  - id: d
    text:
      es: "Al teléfono 060 de información administrativa."
  explanation:
    es: "La disposición adicional segunda dice que esas referencias «se entenderán realizadas al PAG», el Punto de Acceso General. No se entienden hechas a la sede de las Delegaciones del Gobierno, a la Carpeta Ciudadana ni al teléfono 060, que es un canal de acceso al PAG."
  citation: "disposición adicional segunda Orden HAP/1949/2014"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1996-4997-art-10
- id: m02-l04-q120
  prompt:
    es: "Según el Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, mediante convenio de colaboración suscrito por distintas Administraciones públicas podrá acordarse la creación de:"
  options:
  - id: a
    text:
      es: "Una sede electrónica compartida por las Administraciones firmantes del convenio de colaboración."
  - id: b
    text:
      es: "Una oficina de asistencia en materia de registros por cada Ministerio de la Administración."
  - id: c
    correct: true
    text:
      es: "Oficinas integradas de información con participación de varias Administraciones públicas."
  - id: d
    text:
      es: "Un registro único de entrada y salida común a todas las Administraciones públicas firmantes."
  explanation:
    es: "El convenio puede acordar oficinas integradas de información con participación de varias Administraciones. Un registro único, una sede compartida o una oficina de registros por Ministerio no son lo que el artículo prevé."
  citation: "art. 10 RD 208/1996"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-2671-preambulo
- id: m02-l04-q121
  prompt:
    es: "El Acuerdo del Consejo de Ministros de 15 de julio de 2005 buscaba incrementar la colaboración con las Cámaras de Comercio, Industria y Navegación y potenciar una red mediante su unión a la red de oficinas integradas. ¿Qué red?"
  options:
  - id: a
    text:
      es: "La red de Puntos de Atención al Emprendedor electrónicos."
  - id: b
    correct: true
    text:
      es: "La red de Ventanillas Únicas Empresariales."
  - id: c
    text:
      es: "La red de Registros Electrónicos de Apoderamientos."
  - id: d
    text:
      es: "La red de archivos históricos provinciales."
  explanation:
    es: "El Acuerdo quería potenciar la red de Ventanillas Únicas Empresariales uniéndola a la nueva red de oficinas integradas. Los PAE aparecen años después, en 2013, y los archivos provinciales y los registros de apoderamientos no se mencionan."
  citation: "preámbulo RD 127/2015"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2014-10908-preambulo
- id: m02-l04-q122
  prompt:
    es: "¿Qué red se creó al amparo del Acuerdo del Consejo de Ministros de 15 de julio de 2005, según el preámbulo de la orden que regula el Punto de Acceso General?"
  options:
  - id: a
    text:
      es: "La Red de oficinas de asistencia en materia de registros."
  - id: b
    text:
      es: "La Red de Puntos de Atención al Emprendedor."
  - id: c
    text:
      es: "La Red de sedes electrónicas asociadas de los Ministerios."
  - id: d
    correct: true
    text:
      es: "La Red 060 de Atención al Ciudadano."
  explanation:
    es: "El preámbulo sitúa la Red 060 de Atención al Ciudadano al amparo de ese Acuerdo. Los PAE, las oficinas de asistencia en materia de registros y las sedes asociadas tienen otro origen."
  citation: "preámbulo Orden HAP/1949/2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-2671-art-3
- id: m02-l04-q037
  prompt:
    es: "¿Qué sistema de tramitación telemática deben utilizar los Puntos de Atención al Emprendedor de la red estatal de apoyo a los emprendedores?"
  options:
  - id: a
    text:
      es: "El sistema de registro virtual ORVE."
  - id: b
    correct: true
    text:
      es: "El sistema de tramitación telemática CIRCE."
  - id: c
    text:
      es: "La plataforma de identificación electrónica Cl@ve."
  - id: d
    text:
      es: "La plataforma de la Carpeta Ciudadana."
  explanation:
    es: "El artículo 3.2 del Real Decreto 127/2015 dice que los PAE «utilizarán el sistema de tramitación telemática» CIRCE, lo mismo que el artículo 13.3 de la Ley 14/2013. ORVE es una aplicación de registro. Cl@ve sirve para identificarse y firmar. La Carpeta Ciudadana es el área personalizada del interesado ante el sector público estatal. Ninguna de las tres es el sistema de tramitación de los PAE."
  citation: "art. 3.2 RD 127/2015"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-2671-art-4
- id: m02-l04-q038
  prompt:
    es: "¿Cuál de los siguientes es un servicio que prestan los Puntos de Atención al Emprendedor según el Real Decreto 127/2015, de 27 de febrero?"
  options:
  - id: a
    text:
      es: "Conceder ayudas y subvenciones a los emprendedores."
  - id: b
    text:
      es: "Resolver las licencias municipales de actividad."
  - id: c
    text:
      es: "Expedir certificados electrónicos cualificados de firma."
  - id: d
    correct: true
    text:
      es: "Facilitar la tramitación del cese de la actividad."
  explanation:
    es: "El artículo 4.1.g) incluye entre los servicios de los PAE «facilitar la tramitación del cese de la actividad». Los PAE informan sobre ayudas (letra e), pero no las conceden. No resuelven licencias municipales ni expiden certificados electrónicos: facilitan trámites que resuelven otros órganos."
  citation: "art. 4.1.g) RD 127/2015"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-2671-art-6
- id: m02-l04-q039
  prompt:
    es: "Señale la respuesta correcta sobre la integración de las ventanillas electrónicas prevista en el Real Decreto 127/2015, de 27 de febrero:"
  options:
  - id: a
    correct: true
    text:
      es: "La VUDS queda integrada en el PAE electrónico, sin perjuicio de la identidad definida en el marco de la Unión Europea."
  - id: b
    text:
      es: "La VUDS queda suprimida y sus servicios pasan a prestarse a través del Punto de Acceso General."
  - id: c
    text:
      es: "La VUDS queda integrada en el PAE electrónico y pierde la identidad definida en el marco de la Unión Europea."
  - id: d
    text:
      es: "La plataforma «Emprende en 3» queda integrada en el Punto de Acceso General, no en el PAE electrónico."
  explanation:
    es: "El artículo 6.1 dice que, «sin perjuicio de la identidad definida en el marco de la Unión Europea, la VUDS quedará integrada en el PAE electrónico». La VUDS no se suprime, ni pierde esa identidad. Sus servicios no pasan al Punto de Acceso General. La plataforma «Emprende en 3» queda integrada en el PAE electrónico (art. 6.3), no en el Punto de Acceso General."
  citation: "art. 6.1 RD 127/2015"
  difficulty: 3
  tags:
  - "estructura"
# anchor: fuente-pae-circe-html
- id: m02-l04-q040
  prompt:
    es: "Según la página «CIRCE» del portal del PAE electrónico, consultada el 16 de octubre de 2026, el Documento Único Electrónico unifica:"
  options:
  - id: a
    text:
      es: "Más de 10 formularios administrativos."
  - id: b
    correct: true
    text:
      es: "Más de 25 formularios administrativos."
  - id: c
    text:
      es: "Más de 50 formularios administrativos."
  - id: d
    text:
      es: "Más de 100 formularios administrativos."
  explanation:
    es: "La página dice que el DUE «unifica más de 25 formularios administrativos». Las cifras de 10, 50 y 100 formularios no son las que da el portal."
  citation: "fuente: `pae-circe.html`"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-2671-art-1
- id: m02-l04-q059
  prompt:
    es: "De acuerdo con el artículo 1 del Real Decreto 127/2015, de 27 de febrero, los centros de Ventanilla Única Empresarial y la ventanilla única de la Directiva de Servicios se integran en:"
  options:
  - id: a
    text:
      es: "La Red 060 de Atención al Ciudadano."
  - id: b
    text:
      es: "El Punto de Acceso General del Estado."
  - id: c
    text:
      es: "La red de oficinas de asistencia en materia de registros."
  - id: d
    correct: true
    text:
      es: "La red de Puntos de Atención al Emprendedor."
  explanation:
    es: "El artículo 1 regula la integración de los centros VUE y de la VUDS «en la red de Puntos de Atención al Emprendedor». La Red 060 nació del Acuerdo de 2005. El Punto de Acceso General y las oficinas de asistencia en materia de registros son otras estructuras, que el real decreto no menciona como destino de la integración."
  citation: "art. 1 RD 127/2015"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2015-2671-art-3
- id: m02-l04-q060
  prompt:
    es: "Según el artículo 3.2 del Real Decreto 127/2015, de 27 de febrero, ¿a través de qué documento deben iniciar la tramitación los Puntos de Atención al Emprendedor?"
  options:
  - id: a
    text:
      es: "A través de la declaración responsable de inicio de actividad."
  - id: b
    text:
      es: "A través del formulario de solicitud del Registro Electrónico General."
  - id: c
    correct: true
    text:
      es: "A través del Documento Único Electrónico."
  - id: d
    text:
      es: "A través de la comunicación previa ante la entidad local."
  explanation:
    es: "El artículo 3.2 dice que los PAE utilizarán el sistema CIRCE «y deberán iniciar la tramitación a través del Documento Único Electrónico». La declaración responsable y la comunicación previa son documentos que se presentan ante la Administración competente, no el documento con el que el PAE inicia la tramitación. El formulario del Registro Electrónico General tampoco lo es."
  citation: "art. 3.2 RD 127/2015"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-2671-art-2
- id: m02-l04-q123
  prompt:
    es: "Según el Real Decreto 127/2015, de 27 de febrero, se aplica también a las oficinas integradas de atención al ciudadano que presten servicios a empresas, creadas según:"
  options:
  - id: a
    text:
      es: "El Acuerdo del Consejo de Ministros de 24 de mayo de 2013."
  - id: b
    text:
      es: "El Protocolo de 26 de abril de 1999."
  - id: c
    correct: true
    text:
      es: "El Acuerdo de Consejo de Ministros de 15 de julio de 2005."
  - id: d
    text:
      es: "El Real Decreto 4/2010, sobre interoperabilidad."
  explanation:
    es: "Las oficinas integradas que prestan servicios a empresas son las creadas según el Acuerdo de 15 de julio de 2005. El Protocolo de 1999 dio origen a los centros VUE, el Acuerdo de 2013 aprobó la plataforma «Emprende en 3» y el Real Decreto 4/2010 regula la interoperabilidad, no la creación de oficinas integradas."
  citation: "art. 2 RD 127/2015"
  difficulty: 3
  tags:
  - "fecha"
# anchor: boe-a-2015-2671-art-4
- id: m02-l04-q125
  prompt:
    es: "Entre los servicios que prestan los PAE respecto de las sociedades, ¿cuál se enumera junto con facilitar la creación de nuevas empresas?"
  options:
  - id: a
    text:
      es: "Inscribir las cuentas anuales en el Registro Mercantil."
  - id: b
    correct: true
    text:
      es: "Facilitar los trámites necesarios para su constitución."
  - id: c
    text:
      es: "Resolver los procedimientos sancionadores mercantiles."
  - id: d
    text:
      es: "Gestionar la liquidación y disolución de las sociedades."
  explanation:
    es: "Los PAE facilitan los trámites necesarios para constituir sociedades. La liquidación, los procedimientos sancionadores y la inscripción de cuentas no están entre sus servicios."
  citation: "art. 4.1.f) RD 127/2015"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-2671-art-4
- id: m02-l04-q126
  prompt:
    es: "Según el Real Decreto 127/2015, de 27 de febrero, los servicios de los PAE se podrán prestar mediante contraprestación económica, excepto lo referente a:"
  options:
  - id: a
    text:
      es: "El apoyo a la financiación empresarial en el inicio de la actividad."
  - id: b
    correct: true
    text:
      es: "La tramitación del Documento Único Electrónico."
  - id: c
    text:
      es: "El asesoramiento y la formación de las personas emprendedoras."
  - id: d
    text:
      es: "La información sobre ayudas, subvenciones y apoyo financiero."
  explanation:
    es: "La tramitación del DUE es la excepción, y no se cobra. La información sobre ayudas, el asesoramiento y la formación, y el apoyo a la financiación sí pueden prestarse con contraprestación."
  citation: "art. 4.2 RD 127/2015"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-2671-art-6
- id: m02-l04-q127
  prompt:
    es: "Según el Real Decreto 127/2015, de 27 de febrero, en la integración de ventanillas electrónicas, la plataforma «Emprende en 3», que facilita la comunicación de declaraciones responsables, queda integrada en:"
  options:
  - id: a
    text:
      es: "El Punto de Acceso General electrónico."
  - id: b
    text:
      es: "El sistema de tramitación telemática CIRCE."
  - id: c
    correct: true
    text:
      es: "El PAE electrónico."
  - id: d
    text:
      es: "La ventanilla única de la Directiva de Servicios."
  explanation:
    es: "La plataforma «Emprende en 3» queda integrada en el PAE electrónico. La ventanilla de la Directiva de Servicios se integra también en él, pero es otra ventanilla. CIRCE y el Punto de Acceso General no la integran."
  citation: "art. 6.3 RD 127/2015"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-10074-art-13
- id: m02-l04-q128
  prompt:
    es: "Según la Ley 14/2013, de 27 de septiembre, de apoyo a los emprendedores y su internacionalización, los Puntos de Atención al Emprendedor serán oficinas pertenecientes a organismos públicos y privados, incluidas las notarías y los registros mercantiles, así como:"
  options:
  - id: a
    correct: true
    text:
      es: "Puntos virtuales de información y tramitación telemática de solicitudes."
  - id: b
    text:
      es: "Centros de la Administración General del Estado con personal funcionario."
  - id: c
    text:
      es: "Oficinas de las Cámaras de Comercio, Industria y Navegación en exclusiva."
  - id: d
    text:
      es: "Puntos presenciales de las entidades locales con convenio."
  explanation:
    es: "La ley añade los puntos virtuales de información y tramitación telemática. Las Cámaras en exclusiva, los centros de personal funcionario y los puntos locales con convenio no figuran en el apartado."
  citation: "art. 13.1 Ley 14/2013"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-pae-servicios-html
- id: m02-l04-q129
  prompt:
    es: "¿Cómo llama el portal del PAE electrónico, en su página «Servicios que prestan los PAE», a la red de estas oficinas?"
  options:
  - id: a
    text:
      es: "Puntos de Atención al Emprendedor."
  - id: b
    text:
      es: "Puntos de Apoyo a la Empresa."
  - id: c
    text:
      es: "Puntos de Información al Emprendedor."
  - id: d
    correct: true
    text:
      es: "Puntos de Atención al Emprendimiento."
  explanation:
    es: "El portal usa la denominación «Puntos de Atención al Emprendimiento». La ley y el real decreto siguen hablando de Puntos de Atención al Emprendedor, y las otras dos denominaciones no se usan."
  citation: "fuente: `pae-servicios.html`; «Servicios PAE»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-pae-circe-html
- id: m02-l04-q131
  prompt:
    es: "Según la página «CIRCE» del portal del PAE electrónico, ¿para qué permite la tramitación electrónica el sistema CIRCE, a modo de ventanilla única empresarial?"
  options:
  - id: a
    text:
      es: "Para inscribir marcas y patentes de las empresas ante el organismo competente."
  - id: b
    correct: true
    text:
      es: "Para constituir y cesar empresas, a modo de ventanilla única empresarial."
  - id: c
    text:
      es: "Para presentar las declaraciones tributarias anuales de todas las sociedades."
  - id: d
    text:
      es: "Para registrar los convenios colectivos de las empresas ante la autoridad laboral."
  explanation:
    es: "CIRCE permite la tramitación electrónica para constituir y cesar empresas, de forma unificada y a modo de ventanilla única empresarial. Las declaraciones tributarias, las marcas y los convenios colectivos no son sus trámites."
  citation: "fuente: `pae-circe.html`; «CIRCE»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2023-23537-art-10
- id: m02-l04-q171
  prompt:
    es: "El real decreto de la ventanilla única empresarial se aplica al PAE electrónico del Ministerio de Industria, Energía y Turismo. ¿Qué ministerio lleva hoy la política del Gobierno en materia de industria y turismo?"
  options:
  - id: a
    text:
      es: "El Ministerio de Economía, Comercio y Empresa."
  - id: b
    text:
      es: "El Ministerio de Hacienda."
  - id: c
    text:
      es: "El Ministerio para la Transformación Digital y de la Función Pública."
  - id: d
    correct: true
    text:
      es: "El Ministerio de Industria y Turismo."
  explanation:
    es: "Hoy corresponde al Ministerio de Industria y Turismo la política del Gobierno en materia de industria y turismo. Economía, Hacienda y Transformación Digital tienen otras materias."
  citation: "art. 10.1 RD 829/2023"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-2015-2671-art-3
- id: m02-l04-q183
  prompt:
    es: "Según el Real Decreto 127/2015, de 27 de febrero, por el que se integran los centros de ventanilla única empresarial y la ventanilla única de la Directiva de Servicios en los Puntos de Atención al Emprendedor, los Puntos de Atención al Emprendedor utilizarán el sistema de tramitación telemática de:"
  options:
  - id: a
    text:
      es: "La plataforma «Emprende en 3», y iniciarán la tramitación con el acta fundacional."
  - id: b
    correct: true
    text:
      es: "El Centro de Información y Red de Creación de Empresa, e iniciarán la tramitación con el Documento Único Electrónico."
  - id: c
    text:
      es: "El Punto de Acceso General, y tramitarán por el registro mercantil de cada provincia."
  - id: d
    text:
      es: "La Dirección Electrónica Habilitada única, y notificarán a los interesados por comparecencia."
  explanation:
    es: "Los PAE utilizan el sistema del Centro de Información y Red de Creación de Empresa y deben iniciar la tramitación a través del Documento Único Electrónico. La Dirección Electrónica Habilitada única se usa para las notificaciones de emisores estatales. «Emprende en 3» queda integrada en el PAE electrónico, pero no es el sistema de tramitación. El Punto de Acceso General no tramita la creación de empresas."
  citation: "art. 3.2 RD 127/2015"
  difficulty: 2
  tags:
  - "procedimiento"
