# anchor: boe-a-1992-28740-art-102
- id: m03-l19-q0135
  prompt:
    es: "De acuerdo con el artículo 102.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la regla de prorrata es de aplicación cuando el sujeto pasivo efectúe conjuntamente entregas de bienes o prestaciones de servicios que originen el derecho a la deducción y:"
  options:
  - id: a
    correct: true
    text:
      es: "otras operaciones de análoga naturaleza que no habiliten para el ejercicio del citado derecho."
  - id: b
    text:
      es: "otras operaciones de distinta naturaleza que no se realicen en el territorio de aplicación del impuesto."
  - id: c
    text:
      es: "operaciones de autoconsumo que no se destinen a la realización de entregas de bienes de inversión."
  - id: d
    text:
      es: "operaciones sujetas que se realicen en sectores diferenciados de la actividad empresarial o profesional."
  explanation:
    es: "La prorrata se aplica cuando se realizan conjuntamente operaciones que dan derecho a deducir y otras análogas que no lo dan. Las operaciones realizadas fuera del territorio, los sectores diferenciados o los autoconsumos no son el supuesto del apartado Uno."
  citation: "art. 102.Uno LIVA"
  difficulty: 1
  tags:
  - "prorrata"
# anchor: boe-a-1992-28740-art-103
- id: m03-l19-q0136
  prompt:
    es: "Conforme al artículo 103.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuándo se aplica la prorrata general?"
  options:
  - id: a
    text:
      es: "Cuando el sujeto pasivo no supere el volumen de operaciones que fija el artículo 121."
  - id: b
    text:
      es: "Cuando el sujeto pasivo opte expresamente por ella en la declaración censal de la actividad."
  - id: c
    text:
      es: "Cuando el sujeto pasivo realice operaciones exentas por un importe superior al de las sujetas."
  - id: d
    correct: true
    text:
      es: "Cuando no se den las circunstancias que el apartado Dos señala para la prorrata especial."
  explanation:
    es: "La prorrata general es la regla por defecto: se aplica cuando no concurren las circunstancias de la prorrata especial. No exige opción expresa ni depende del importe de las operaciones exentas o del volumen de operaciones."
  citation: "art. 103.Uno LIVA"
  difficulty: 1
  tags:
  - "prorrata"
# anchor: boe-a-1992-28740-art-103
- id: m03-l19-q0137
  prompt:
    es: "Señale la respuesta CORRECTA sobre la aplicación de la regla de prorrata especial, según el artículo 103.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Es aplicable cuando los sujetos pasivos opten por ella en cualquier momento del año natural, sin sujeción a plazo ni forma reglamentarios."
  - id: b
    correct: true
    text:
      es: "Es aplicable cuando los sujetos pasivos opten por ella en los plazos y forma que se determinen reglamentariamente."
  - id: c
    text:
      es: "Es aplicable cuando la Administración tributaria la imponga al sujeto pasivo que realice operaciones exentas de forma habitual."
  - id: d
    text:
      es: "Es aplicable cuando el sujeto pasivo realice operaciones en más de un sector diferenciado de la actividad empresarial."
  explanation:
    es: "La prorrata especial se aplica por opción del sujeto pasivo dentro de los plazos y forma que fije el reglamento. La opción no es libre en el tiempo, la ley no prevé que la Administración la imponga por operaciones exentas y los sectores diferenciados no son por sí mismos el supuesto."
  citation: "art. 103.Dos LIVA"
  difficulty: 2
  tags:
  - "prorrata"
# anchor: boe-a-1992-28740-art-103
- id: m03-l19-q0138
  prompt:
    es: "Ferretería Almazán, S.L. calcula que en 2026 las cuotas deducibles por la prorrata general serían 55.000 euros y por la prorrata especial serían 50.000 euros. No optó por la prorrata especial. Según el artículo 103.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué modalidad de prorrata se le aplica ese año?"
  options:
  - id: a
    text:
      es: "La prorrata general, porque el sujeto pasivo no ha optado por la prorrata especial."
  - id: b
    text:
      es: "La prorrata general, porque el exceso del 10 por ciento debe ser superior y aquí solo es igual."
  - id: c
    correct: true
    text:
      es: "La prorrata especial, porque la general excede en un 10 por ciento del importe que resultaría por la especial."
  - id: d
    text:
      es: "La prorrata especial, porque la diferencia de 5.000 euros supera el 5 por ciento del importe de la general."
  explanation:
    es: "55.000 supera a 50.000 en un 10 por ciento exacto, y la ley dice «un 10 por ciento o más»: se aplica la especial aunque no haya opción. Pedir un exceso mayor cambia el texto, no optar no impide el supuesto del 103.Dos.2.º y el 5 por ciento no es el umbral."
  citation: "art. 103.Dos LIVA"
  difficulty: 3
  tags:
  - "prorrata"
  - "cómputo"
# anchor: boe-a-1992-28740-art-104
- id: m03-l19-q0139
  prompt:
    es: "Según el artículo 104.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, en la prorrata general solo es deducible el impuesto soportado en cada período de liquidación en el porcentaje que resulte del apartado Dos, sin computar en el impuesto soportado:"
  options:
  - id: a
    text:
      es: "las cuotas soportadas en operaciones realizadas fuera del territorio de aplicación."
  - id: b
    text:
      es: "las cuotas soportadas en la adquisición de bienes de inversión de la actividad."
  - id: c
    correct: true
    text:
      es: "las cuotas que no sean deducibles en virtud de los artículos 95 y 96 de la Ley."
  - id: d
    text:
      es: "las cuotas soportadas en operaciones exentas del artículo 20 de la Ley."
  explanation:
    es: "Las cuotas no deducibles por los artículos 95 y 96 se excluyen del impuesto soportado antes de aplicar el porcentaje. Las soportadas en operaciones exentas, en bienes de inversión o fuera del territorio no se excluyen por esa vía."
  citation: "art. 104.Uno LIVA"
  difficulty: 2
  tags:
  - "prorrata"
# anchor: boe-a-1992-28740-art-104
- id: m03-l19-q0140
  prompt:
    es: "De acuerdo con el artículo 104.Dos.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué importe total, determinado para cada año natural, figura en el numerador de la fracción del porcentaje de deducción de la prorrata general?"
  options:
  - id: a
    text:
      es: "Las entregas de bienes y prestaciones de servicios realizadas, incluidas las que no originen el derecho a deducir."
  - id: b
    text:
      es: "Las cuotas del impuesto soportadas en las adquisiciones de bienes y servicios del año natural."
  - id: c
    correct: true
    text:
      es: "Las entregas de bienes y prestaciones de servicios que originen el derecho a la deducción."
  - id: d
    text:
      es: "Las entregas de bienes y prestaciones de servicios exentas que no originen el derecho a deducir."
  explanation:
    es: "El numerador recoge solo las operaciones que originan el derecho a la deducción. La opción que incluye también las que no lo originan describe el denominador, y las cuotas soportadas no son términos de la fracción."
  citation: "art. 104.Dos LIVA"
  difficulty: 1
  tags:
  - "prorrata"
# anchor: boe-a-1992-28740-art-104
- id: m03-l19-q0142
  prompt:
    es: "Vinos Ribeira, S.A. realiza en el año natural 2026 entregas de bienes que originan el derecho a la deducción por 650.000 euros y operaciones exentas que no lo originan por 150.000 euros. No tiene otras operaciones. Según el artículo 104.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuál es el porcentaje de prorrata general de ese año?"
  options:
  - id: a
    text:
      es: "Un porcentaje de prorrata general del 81,25 %."
  - id: b
    text:
      es: "Un porcentaje de prorrata general del 80 %."
  - id: c
    text:
      es: "Un porcentaje de prorrata general del 81 %."
  - id: d
    correct: true
    text:
      es: "Un porcentaje de prorrata general del 82 %."
  explanation:
    es: "El porcentaje es 650.000 / (650.000 + 150.000) x 100 = 81,25, y la ley manda redondear en la unidad superior: 82 %. Truncar da 81, 80 solo ocurre si el denominador fuera otro, y dejar los decimales (81,25) incumple el redondeo."
  citation: "art. 104.Dos LIVA"
  difficulty: 2
  tags:
  - "prorrata"
  - "cómputo"
# anchor: boe-a-1992-28740-art-104
- id: m03-l19-q0143
  prompt:
    es: "¿Qué operación queda excluida de ambos términos de la relación para determinar el porcentaje de deducción de la prorrata, según el artículo 104.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "El importe de las operaciones de arrendamiento realizadas por el sujeto pasivo en el desarrollo de su actividad empresarial."
  - id: b
    text:
      es: "El importe de las operaciones inmobiliarias o financieras que constituyan actividad habitual del sujeto pasivo."
  - id: c
    text:
      es: "El importe de las entregas de existencias realizadas por el sujeto pasivo en el desarrollo de su actividad."
  - id: d
    correct: true
    text:
      es: "El importe de las entregas y exportaciones de los bienes de inversión que el sujeto pasivo haya utilizado en su actividad."
  explanation:
    es: "Las entregas y exportaciones de bienes de inversión utilizados en la actividad no se computan en ninguno de los términos (104.Tres.3.º). Las operaciones inmobiliarias o financieras solo se excluyen si no son habituales, y el arrendamiento se reputa siempre habitual, por lo que se computa."
  citation: "art. 104.Tres LIVA"
  difficulty: 2
  tags:
  - "prorrata"
  - "bienes de inversión"
# anchor: boe-a-1992-28740-art-104
- id: m03-l19-q0145
  prompt:
    es: "De acuerdo con el artículo 104.Tres.4.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, no se computan en la prorrata las operaciones inmobiliarias o financieras que no constituyan actividad empresarial o profesional habitual del sujeto pasivo, pero se reputa en todo caso actividad habitual:"
  options:
  - id: a
    correct: true
    text:
      es: "la de arrendamiento."
  - id: b
    text:
      es: "la de gestión de patrimonios inmobiliarios."
  - id: c
    text:
      es: "la de compraventa de inmuebles."
  - id: d
    text:
      es: "la de préstamo y cesión de créditos."
  explanation:
    es: "El arrendamiento se considera siempre actividad habitual y por eso se computa. La compraventa de inmuebles, los préstamos y la gestión de patrimonios no reciben esa calificación automática."
  citation: "art. 104.Tres LIVA"
  difficulty: 1
  tags:
  - "prorrata"
# anchor: boe-a-1992-28740-art-104
- id: m03-l19-q0146
  prompt:
    es: "Conforme al artículo 104.Tres.5.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, para determinar el porcentaje de deducción de la prorrata no se computan en ninguno de los términos de la relación:"
  options:
  - id: a
    correct: true
    text:
      es: "las operaciones no sujetas al impuesto según lo dispuesto en el artículo 7 de la Ley."
  - id: b
    text:
      es: "las operaciones sujetas realizadas por entidades sin ánimo de lucro."
  - id: c
    text:
      es: "las operaciones sujetas y no exentas realizadas a empresarios no establecidos."
  - id: d
    text:
      es: "las operaciones exentas del impuesto según lo dispuesto en el artículo 20, apartado uno, de la Ley."
  explanation:
    es: "Las operaciones no sujetas del artículo 7 quedan fuera de ambos términos. Las exentas sí se computan en el denominador, y las sujetas realizadas a empresarios no establecidos o por entidades sin ánimo de lucro no están excluidas por el artículo 104.Tres."
  citation: "art. 104.Tres LIVA"
  difficulty: 2
  tags:
  - "prorrata"
# anchor: boe-a-1992-28740-art-105
- id: m03-l19-q0147
  prompt:
    es: "Según el artículo 105.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuál es el porcentaje de deducción provisionalmente aplicable cada año natural, salvo lo dispuesto en los apartados dos y tres?"
  options:
  - id: a
    text:
      es: "El fijado por la Administración tributaria para cada sujeto pasivo."
  - id: b
    correct: true
    text:
      es: "El fijado como definitivo para el año precedente."
  - id: c
    text:
      es: "El que resulte de la media de los tres años anteriores."
  - id: d
    text:
      es: "El calculado con las operaciones del primer trimestre del año."
  explanation:
    es: "El porcentaje provisional de cada año es el definitivo del año anterior. No se calcula con el primer trimestre, ni con una media de tres años, ni lo fija la Administración para cada sujeto pasivo."
  citation: "art. 105.Uno LIVA"
  difficulty: 1
  tags:
  - "prorrata"
  - "regularización"
# anchor: boe-a-1992-28740-art-105
- id: m03-l19-q0148
  prompt:
    es: "De acuerdo con el artículo 105.Cuatro de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿en qué declaración-liquidación calcula el sujeto pasivo la prorrata definitiva y practica la regularización de las deducciones provisionales?"
  options:
  - id: a
    text:
      es: "La declaración-liquidación del período en que se advierta la diferencia entre porcentajes."
  - id: b
    text:
      es: "Una declaración complementaria que debe presentarse en el mes de enero del año siguiente."
  - id: c
    correct: true
    text:
      es: "La última declaración-liquidación del impuesto correspondiente a cada año natural."
  - id: d
    text:
      es: "La primera declaración-liquidación del impuesto del año natural siguiente."
  explanation:
    es: "La prorrata definitiva y la regularización se hacen en la última declaración-liquidación del año natural. No se desplazan a la primera del año siguiente, al período en que se advierte la diferencia ni a una declaración complementaria de enero."
  citation: "art. 105.Cuatro LIVA"
  difficulty: 1
  tags:
  - "prorrata"
  - "regularización"
# anchor: boe-a-1992-28740-art-105
- id: m03-l19-q0149
  prompt:
    es: "Conforme al artículo 105.Seis de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, el porcentaje de deducción de la prorrata se aplica a la suma de las cuotas soportadas por el sujeto pasivo durante el año natural correspondiente, excluidas:"
  options:
  - id: a
    text:
      es: "las que se hubiesen soportado en el último trimestre del año."
  - id: b
    correct: true
    text:
      es: "las que no sean deducibles en virtud de los artículos 95 y 96."
  - id: c
    text:
      es: "las que correspondan a operaciones exentas realizadas durante el año."
  - id: d
    text:
      es: "las que correspondan a bienes de inversión adquiridos durante el año."
  explanation:
    es: "El porcentaje se aplica a las cuotas soportadas del año, sin las no deducibles por los artículos 95 y 96. Las cuotas de bienes de inversión, las de operaciones exentas o las del último trimestre no se excluyen por esa vía."
  citation: "art. 105.Seis LIVA"
  difficulty: 2
  tags:
  - "prorrata"
# anchor: boe-a-1992-28740-art-105
- id: m03-l19-q0150
  prompt:
    es: "Mármoles Ibérica, S.A. realiza en 2026 operaciones que originan derecho a deducir por 800.000 euros y operaciones exentas que no lo originan por 200.000 euros. Vende además por 50.000 euros una máquina que usó en su actividad. Sus cuotas soportadas suman 40.000 euros, de las que 4.000 no son deducibles por el artículo 96. En 2025 el porcentaje definitivo fue del 90 %. Según los artículos 104 y 105 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué regularización practica en la última declaración-liquidación de 2026?"
  options:
  - id: a
    text:
      es: "Un ingreso adicional de 4.000 euros, porque deben excluirse solo las cuotas no deducibles del año."
  - id: b
    correct: true
    text:
      es: "Un ingreso adicional de 3.600 euros, porque la deducción provisional (32.400) supera a la definitiva (28.800)."
  - id: c
    text:
      es: "Una deducción adicional de 3.600 euros, porque el porcentaje definitivo es inferior al provisional."
  - id: d
    text:
      es: "Un ingreso adicional de 3.950 euros, porque la venta de la máquina eleva el porcentaje de deducción."
  explanation:
    es: "El porcentaje definitivo es 800.000 / 1.000.000 = 80 %, sin la máquina (art. 104.Tres.3.º). Las cuotas computables son 36.000 euros (art. 105.Seis). Provisional: 36.000 x 90 % = 32.400. Definitivo: 36.000 x 80 % = 28.800. La diferencia, 3.600 euros, se ingresa. Una deducción adicional invierte el signo, y las otras cifras no salen de ningún paso de la regla."
  citation: "art. 105.Cuatro LIVA"
  difficulty: 3
  tags:
  - "prorrata"
  - "regularización"
  - "cómputo"
# anchor: boe-a-1992-28740-art-106
- id: m03-l19-q0151
  prompt:
    es: "Según el artículo 106.Uno.1.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, en la prorrata especial las cuotas soportadas en la adquisición o importación de bienes o servicios utilizados exclusivamente en la realización de operaciones que originen el derecho a la deducción:"
  options:
  - id: a
    text:
      es: "no pueden ser objeto de deducción hasta la regularización anual."
  - id: b
    text:
      es: "pueden deducirse en el cincuenta por ciento de su importe."
  - id: c
    text:
      es: "pueden deducirse en el porcentaje de la prorrata general."
  - id: d
    correct: true
    text:
      es: "pueden deducirse íntegramente."
  explanation:
    es: "En la prorrata especial, lo usado exclusivamente en operaciones con derecho a deducir se deduce íntegramente. No se aplica el porcentaje de la general, ni un cincuenta por ciento, ni se aplaza a la regularización."
  citation: "art. 106.Uno LIVA"
  difficulty: 1
  tags:
  - "prorrata especial"
# anchor: boe-a-1992-28740-art-106
- id: m03-l19-q0152
  prompt:
    es: "Conforme al artículo 106.Uno.3.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, en la prorrata especial las cuotas soportadas en bienes o servicios utilizados solo en parte en operaciones que originen el derecho a la deducción pueden deducirse:"
  options:
  - id: a
    text:
      es: "íntegramente, siempre que el uso en operaciones con derecho a deducir sea superior al cincuenta por ciento."
  - id: b
    correct: true
    text:
      es: "en la proporción resultante de aplicar al importe global de las mismas el porcentaje del artículo 104, apartados Dos y siguientes."
  - id: c
    text:
      es: "en la proporción que resulte de la superficie o el tiempo de uso del bien en cada actividad."
  - id: d
    text:
      es: "en el cincuenta por ciento de su importe, cualquiera que sea el porcentaje de uso."
  explanation:
    es: "Los bienes de uso mixto se deducen aplicando al importe global el porcentaje del artículo 104. No hay deducción íntegra por superar el cincuenta por ciento, ni reparto por superficie o tiempo, ni un cincuenta por ciento fijo."
  citation: "art. 106.Uno LIVA"
  difficulty: 2
  tags:
  - "prorrata especial"
# anchor: boe-a-1992-28740-art-106
- id: m03-l19-q0153
  prompt:
    es: "Aceites Jaén, S.L. aplica la prorrata especial en 2026. Soporta 10.000 euros de IVA en bienes usados exclusivamente en operaciones con derecho a deducir, 6.000 euros en bienes usados exclusivamente en operaciones sin ese derecho y 8.000 euros en bienes de uso mixto. El porcentaje conforme al artículo 104 es del 60 %. Todas las cuotas son deducibles por los artículos 95 y 96. Según el artículo 106.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué cuota deduce?"
  options:
  - id: a
    text:
      es: "Una cuota deducible de 14.400 euros."
  - id: b
    text:
      es: "Una cuota deducible de 24.000 euros."
  - id: c
    correct: true
    text:
      es: "Una cuota deducible de 14.800 euros."
  - id: d
    text:
      es: "Una cuota deducible de 18.000 euros."
  explanation:
    es: "Se deduce íntegramente el 10.000 de la 1.ª regla, nada de los 6.000 de la 2.ª y el 60 % de 8.000, que son 4.800, de la 3.ª: 10.000 + 0 + 4.800 = 14.800. Aplicar el 60 % al total de 24.000 da 14.400, sumar solo las dos primeras partidas íntegras con la mixta íntegra da 18.000, y 24.000 es deducir todo."
  citation: "art. 106.Uno LIVA"
  difficulty: 3
  tags:
  - "prorrata especial"
  - "cómputo"
# anchor: boe-a-1992-28740-art-106
