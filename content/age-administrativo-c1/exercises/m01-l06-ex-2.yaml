  citation: "fuente: `transparencia-v-plan.pdf`"
  difficulty: 2
  tags:
  - "órgano"
# anchor: fuente-transparencia-v-plan-pdf
- id: m01-l06-q040
  prompt:
    es: "¿Cuál de los siguientes es uno de los diez compromisos del V Plan de Gobierno Abierto de España 2025-2029?"
  options:
  - id: a
    text:
      es: "El compromiso de protección de denunciantes."
  - id: b
    correct: true
    text:
      es: "El compromiso de gobernanza digital e inteligencia artificial."
  - id: c
    text:
      es: "El compromiso de sistemas preventivos de integridad pública."
  - id: d
    text:
      es: "El compromiso de reforma del marco regulatorio."
