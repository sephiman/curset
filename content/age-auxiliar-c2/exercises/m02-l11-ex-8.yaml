# anchor: fuente-ms-outlook-importancia-html
- id: m02-l11-q163
  prompt:
    es: "En Outlook 365 clásico, ¿dónde se selecciona Importancia alta al redactar un mensaje nuevo o una respuesta?"
  options:
  - id: a
    correct: true
    text:
      es: "En la pestaña Mensaje"
  - id: b
    text:
      es: "En la pestaña Inicio"
  - id: c
    text:
      es: "En la pestaña Revisar"
  - id: d
    text:
      es: "En la pestaña Opciones"
  explanation:
    es: "En Outlook clásico, Importancia alta se selecciona en la pestaña Mensaje. La pestaña Opciones es donde el nuevo Outlook ofrece Importancia. La pestaña Inicio y la pestaña Revisar contradicen la frase de la ayuda, que indica la pestaña Mensaje."
  citation: "fuente: `ms-outlook-importancia.html`; «Marcar un mensaje como importante»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-importancia-html
- id: m02-l11-q164
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué ruta lleva a los niveles de importancia de un mensaje nuevo o de una respuesta?"
  options:
  - id: a
    text:
      es: "Mensaje › Importancia alta"
  - id: b
    text:
      es: "Mensaje › Etiquetas › Importancia"
  - id: c
    text:
      es: "Configuración › Correo › Importancia"
  - id: d
    correct: true
    text:
      es: "Opciones › Importancia"
  explanation:
    es: "En el nuevo Outlook, en la pestaña Opciones se selecciona Importancia y después el nivel. Mensaje › Importancia alta es la ruta de Outlook clásico. Configuración › Correo › Importancia contradice la ayuda, que indica la pestaña Opciones. Mensaje › Etiquetas es la sección a la que se llega en Outlook clásico con los puntos suspensivos."
  citation: "fuente: `ms-outlook-importancia.html`; «Marcar un mensaje como importante»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-importancia-html
- id: m02-l11-q165
  prompt:
    es: "En Outlook 365 clásico, ¿qué debe hacerse si no aparece el comando Importancia alta en la pestaña Mensaje?"
  options:
  - id: a
    text:
      es: "Seleccionar la pestaña Opciones y elegir Importancia en el grupo Etiquetas"
  - id: b
    correct: true
    text:
      es: "Abrir los puntos suspensivos y elegir Importancia alta en Etiquetas"
  - id: c
    text:
      es: "Seleccionar Archivo › Opciones › Correo y activar Importancia alta"
  - id: d
    text:
      es: "Seleccionar Ver › Configuración de vista y elegir Importancia alta"
  explanation:
    es: "Si no se ve Importancia alta, se seleccionan los puntos suspensivos y se elige Importancia alta en la sección Etiquetas. La pestaña Opciones con Importancia es la ruta del nuevo Outlook. Archivo › Opciones › Correo sirve para opciones como Limpieza de conversación. Ver › Configuración de vista sirve para cambiar fuentes de la lista de mensajes."
  citation: "fuente: `ms-outlook-importancia.html`; «Marcar un mensaje como importante»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-importancia-html
- id: m02-l11-q166
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál es la configuración de importancia predeterminada de un mensaje, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Alta"
  - id: b
    text:
      es: "Baja"
  - id: c
    correct: true
    text:
      es: "Normal"
  - id: d
    text:
      es: "La que se eligió en el último mensaje enviado"
  explanation:
    es: "La ayuda dice que la configuración de importancia predeterminada es Normal. Alta y Baja son niveles que se eligen a propósito: Baja, por ejemplo, para información de rutina. Que sea la del último mensaje enviado contradice que la predeterminada sea Normal."
  citation: "fuente: `ms-outlook-importancia.html`; «Marcar un mensaje como importante»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-importancia-html
- id: m02-l11-q167
  prompt:
    es: "En Outlook 365 clásico, ¿qué se selecciona en la pestaña Mensaje para marcar un mensaje como de importancia baja, por ser información de rutina?"
  options:
  - id: a
    correct: true
    text:
      es: "Importancia baja"
  - id: b
    text:
      es: "Aviso"
  - id: c
    text:
      es: "Importancia, en la pestaña Opciones"
  - id: d
    text:
      es: "Importancia alta"
  explanation:
    es: "La sugerencia indica seleccionar importancia baja en la pestaña Mensaje para marcar información de rutina. Importancia alta hace que el destinatario vea un signo de exclamación rojo. Aviso es el recordatorio que se puede agregar a un mensaje saliente. Importancia en la pestaña Opciones es el procedimiento del nuevo Outlook."
  citation: "fuente: `ms-outlook-importancia.html`; «Marcar un mensaje como importante»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-cifrar-m365-html
- id: m02-l11-q169
  prompt:
    es: "En el nuevo Outlook para Windows, ¿en qué pestaña de la cinta de un mensaje nuevo se encuentra el comando Cifrar?"
  options:
  - id: a
    text:
      es: "Inicio"
  - id: b
    correct: true
    text:
      es: "Opciones"
  - id: c
    text:
      es: "Ver"
  - id: d
    text:
      es: "Ayuda"
  explanation:
    es: "La página indica que, al redactar un mensaje nuevo, se selecciona la cinta Opciones y después Cifrar. Inicio no lleva ese comando: es la pestaña de la ventana principal del nuevo Outlook, que muestra Inicio, Ver y Ayuda según la página sobre la versión de Outlook. Ver y Ayuda son las otras dos pestañas de esa ventana principal y tampoco lo contienen."
  citation: "fuente: `ms-outlook-cifrar-m365.html`; «¿Cómo envío un mensaje de correo electrónico cifrado?»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-cifrar-m365-html
- id: m02-l11-q170
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de las siguientes afirmaciones sobre los datos adjuntos de un mensaje enviado con No reenviar es correcta?"
  options:
  - id: a
    correct: true
    text:
      es: "Los archivos de Office siguen cifrados tras descargarse; los PDF no."
  - id: b
    text:
      es: "Los datos adjuntos no se cifran: el cifrado afecta solo al cuerpo del mensaje."
  - id: c
    text:
      es: "Los archivos de Word, Excel o PowerPoint se descargan siempre sin cifrar, igual que los PDF."
  - id: d
    text:
      es: "Todos los datos adjuntos, también los PDF y las imágenes, siguen cifrados después de descargarse."
  explanation:
    es: "Con No reenviar, los datos adjuntos de Microsoft Office siguen cifrados tras descargarse y quien los reciba reenviados no podrá abrirlos; los PDF y las imágenes sí se descargan sin cifrar. La afirmación de que todos siguen cifrados falla en los PDF y las imágenes. La de que los archivos de Office se descargan sin cifrar contradice la página, que los mantiene cifrados. La de que los adjuntos no se cifran también es falsa: la página dice que todos los datos adjuntos están cifrados."
  citation: "fuente: `ms-outlook-cifrar-m365.html`; «Los datos adjuntos también se cifran»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-cifrar-m365-html
- id: m02-l11-q171
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de las siguientes afirmaciones describe lo que hace el TLS oportunista de la configuración predeterminada?"
  options:
  - id: a
    text:
      es: "Impide que el destinatario copie o reenvíe el mensaje, igual que la opción No reenviar."
  - id: b
    text:
      es: "Cifra solo los datos adjuntos de Office y deja el cuerpo del mensaje sin proteger."
  - id: c
    correct: true
    text:
      es: "Cifra la conexión con el proveedor del destinatario, pero no el mensaje."
  - id: d
    text:
      es: "Mantiene el mensaje cifrado dentro de Microsoft 365 aunque lo abra el proveedor del destinatario."
  explanation:
    es: "La página explica que TLS cifra la conexión, no el mensaje, y que este puede no seguir cifrado cuando llega al proveedor del destinatario. Mantener el mensaje cifrado dentro de Microsoft 365 es lo que hacen Cifrar y No reenviar, no TLS. Impedir el reenvío tampoco: el cifrado TLS no proporcionaba esa capacidad. Cifrar solo los adjuntos de Office no figura en ningún punto: esos adjuntos permanecen cifrados con No reenviar, que es otra opción."
  citation: "fuente: `ms-outlook-cifrar-m365.html`; «¿Cuál es la diferencia con respecto al nivel actual de cifrado en Outlook.com?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-cifrar-m365-html
- id: m02-l11-q172
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cómo puede leer un mensaje cifrado el destinatario que usa una cuenta de Google o de Yahoo?"
  options:
  - id: a
    text:
      es: "Solo con un certificado S/MIME instalado en su equipo."
  - id: b
    text:
      es: "No puede leerlo: el mensaje se devuelve al remitente sin entregarse."
  - id: c
    correct: true
    text:
      es: "Con su cuenta de Google o Yahoo o con un código de acceso temporal."
  - id: d
    text:
      es: "Solo con una cuenta de Microsoft 365 Familia o Personal propia."
  explanation:
    es: "Si el mensaje cifrado va a una cuenta de Google o Yahoo, el destinatario puede autenticarse con esa cuenta o usar un código de acceso temporal, que recibe por correo. El certificado S/MIME es la vía de la otra página: allí el destinatario necesita un certificado, pero no es lo que pide Cifrar. Exigir una suscripción propia a Microsoft 365 contradice la página, que da a otros proveedores el portal con código temporal. La devolución del mensaje tampoco existe: el destinatario recibe instrucciones para leerlo."
  citation: "fuente: `ms-outlook-cifrar-m365.html`; «Leer un mensaje de correo electrónico cifrado sin usar Outlook.com o Microsoft 365»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-cifrar-m365-html
- id: m02-l11-q173
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de las siguientes opciones de Cifrar se selecciona para quitar el cifrado de un mensaje?"
  options:
  - id: a
    text:
      es: "Más opciones"
  - id: b
    text:
      es: "No reenviar"
  - id: c
    text:
      es: "Cifrar"
  - id: d
    correct: true
    text:
      es: "Sin conjunto de permisos"
  explanation:
    es: "La página indica que, para quitar el cifrado, se selecciona Sin conjunto de permisos. No reenviar mantiene el mensaje cifrado y además impide copiarlo o reenviarlo. Cifrar lo mantiene cifrado dentro de Microsoft 365. Más opciones, en la cinta Opciones de un mensaje, abre las opciones de S/MIME según la página de S/MIME, y sirve para cifrar, no para quitar el cifrado."
  citation: "fuente: `ms-outlook-cifrar-m365.html`; «¿Cómo envío un mensaje de correo electrónico cifrado?»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-proteger-html
- id: m02-l11-q174
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes características pueden usar también las cuentas personales de Microsoft con Microsoft 365, además de las cuentas profesionales o educativas?"
  options:
  - id: a
    text:
      es: "Protección de mensajes con Information Rights Management"
  - id: b
    correct: true
    text:
      es: "Configurar el cifrado"
  - id: c
    text:
      es: "Aplicar etiquetas de confidencialidad a los mensajes"
  - id: d
    text:
      es: "Enviar mensajes con una firma digital"
  explanation:
    es: "La tabla de la página da Sí a configurar el cifrado tanto para cuentas profesionales o educativas como para cuentas de Microsoft con Microsoft 365. La protección con IRM, las etiquetas de confidencialidad y el envío con firma digital figuran con Sí solo para las cuentas profesionales o educativas, y con No para las cuentas de Microsoft."
  citation: "fuente: `ms-outlook-proteger.html`; «Opciones de seguridad»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-proteger-html
- id: m02-l11-q175
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes opciones describe lo que ocurre con un mensaje al que se aplica una protección de Information Rights Management, como No reenviar o No imprimir?"
  options:
  - id: a
    text:
      es: "Se envía sin cifrar y solo se avisa al destinatario de la restricción."
  - id: b
    text:
      es: "Se convierte en un mensaje con etiqueta de confidencialidad."
  - id: c
    text:
      es: "Se cifra únicamente si el destinatario tiene un certificado de S/MIME."
  - id: d
    correct: true
    text:
      es: "Se cifra automáticamente."
  explanation:
    es: "La página dice que un mensaje con firma digital o con protección de IRM, como No reenviar o No imprimir, se cifra automáticamente. Enviarlo sin cifrar contradice esa frase. Exigir un certificado S/MIME al destinatario mezcla otra vía: IRM comprueba la licencia del destinatario, no un certificado. Las etiquetas de confidencialidad son otra característica: no impiden acciones del destinatario, mientras que IRM sí."
  citation: "fuente: `ms-outlook-proteger.html`; «Usar el cifrado para impedir el acceso no autorizado a un correo electrónico»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-proteger-html
- id: m02-l11-q176
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes afirmaciones sobre las etiquetas de confidencialidad de un mensaje es correcta?"
  options:
  - id: a
    text:
      es: "Impiden que el destinatario reenvíe el mensaje, igual que la protección con IRM."
  - id: b
    text:
      es: "Cifran el mensaje automáticamente, como ocurre con una firma digital o con una protección de IRM."
  - id: c
    text:
      es: "Las puede aplicar cualquier cuenta de Microsoft, aunque no tenga Microsoft 365."
  - id: d
    correct: true
    text:
      es: "No impiden acciones del destinatario; para restringirlas se recomienda cifrar o usar IRM."
  explanation:
    es: "La página dice que las etiquetas de confidencialidad no impiden a los destinatarios realizar acciones y recomienda cifrar o usar IRM para restringirlas. Impedir el reenvío es propio de IRM con No reenviar. Cifrar automáticamente es lo que hacen una firma digital o una protección de IRM, no las etiquetas. Aplicarlas exige una cuenta profesional o educativa con una suscripción apta de Microsoft 365, y no vale una cuenta de Microsoft."
  citation: "fuente: `ms-outlook-proteger.html`; «Aplicar etiquetas de confidencialidad a los correos electrónicos en Outlook»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-proteger-html
- id: m02-l11-q177
  prompt:
    es: "¿Cuál de los siguientes elementos hay que instalar en Outlook 365 para poder insertar una firma digital en un mensaje?"
  options:
  - id: a
    text:
      es: "Un complemento de Information Rights Management en cada equipo."
  - id: b
    correct: true
    text:
      es: "Un identificador digital verificado por un tercero."
  - id: c
    text:
      es: "Una etiqueta de confidencialidad definida por la organización."
  - id: d
    text:
      es: "Un código de acceso temporal enviado por correo."
  explanation:
    es: "Para insertar una firma digital hace falta un identificador digital (certificado) verificado por un tercero, que emiten las entidades de certificación. El código de acceso temporal sirve a los destinatarios de otros proveedores para leer un mensaje cifrado, no para firmar. Las etiquetas de confidencialidad las define la organización y no autentican al remitente. IRM es una protección de permisos sobre el contenido, no una firma, y la página no pide instalar nada para ello."
  citation: "fuente: `ms-outlook-proteger.html`; «Enviar mensajes con una firma digital (S/MIME) para comprobar la identidad del remitente»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-menciones-html
- id: m02-l11-q179
  prompt:
    es: "En Outlook 365 clásico, ¿qué parte del nombre del contacto incluye Outlook de forma predeterminada al elegir una @mención?"
  options:
  - id: a
    text:
      es: "La dirección de correo completa"
  - id: b
    correct: true
    text:
      es: "El nombre completo del contacto"
  - id: c
    text:
      es: "Solo los apellidos"
  - id: d
    text:
      es: "Solo el nombre de pila"
  explanation:
    es: "De forma predeterminada se incluye el nombre completo del contacto, y se puede eliminar una parte de la mención, por ejemplo todo excepto el nombre. El nombre de pila solo y los apellidos solos son lo que queda si se recorta la mención, no el valor predeterminado. La dirección de correo se agrega a la línea Para, pero la mención en el cuerpo lleva el nombre."
  citation: "fuente: `ms-outlook-menciones.html`; «Para Outlook clásico: use @ en el cuerpo de un mensaje o invitación a una reunión»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-menciones-html
- id: m02-l11-q180
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de las siguientes opciones de Filtro, en la parte superior de la lista de mensajes, muestra solo los mensajes que mencionan al usuario?"
  options:
  - id: a
    text:
      es: "Con datos adjuntos"
  - id: b
    correct: true
    text:
      es: "@ mencionarme"
  - id: c
    text:
      es: "Correo mencionado"
  - id: d
    text:
      es: "Mención"
  explanation:
    es: "En el nuevo Outlook, el filtro se llama @ mencionarme. Correo mencionado es el nombre que la página da a ese filtro en Outlook clásico. Mención es la columna que se agrega a la lista de mensajes de Outlook clásico, no una opción de Filtro. Con datos adjuntos genera una búsqueda de los elementos que tienen datos adjuntos y no filtra por menciones."
  citation: "fuente: `ms-outlook-menciones.html`; «Filtre los mensajes que le mencionan»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-menciones-html
- id: m02-l11-q181
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes rutas lleva a las columnas de la lista de mensajes para agregar la columna Mención?"
  options:
  - id: a
    text:
      es: "Inicio › Eliminar › Limpiar"
  - id: b
    text:
      es: "Archivo › Opciones › Buscar"
  - id: c
    text:
      es: "Vista › Diseño › Panel de lectura"
  - id: d
    correct: true
    text:
      es: "Vista › Configuración de vista › Columnas"
  explanation:
    es: "La columna Mención se agrega en la pestaña Vista, con Configuración de vista y Columnas. Vista › Diseño › Panel de lectura sirve para mostrar, mover o desactivar el panel de lectura. Archivo › Opciones › Buscar es donde se deja Buzón actual como ámbito de búsqueda predeterminado. Inicio › Eliminar › Limpiar quita mensajes redundantes de una conversación."
  citation: "fuente: `ms-outlook-menciones.html`; «Agregue menciones a sus columnas de correo electrónico para ver dónde se le menciona»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-menciones-html
- id: m02-l11-q182
  prompt:
    es: "En Outlook 365, ¿para qué destinatarios está disponible la característica de correo mencionado, según la nota de la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Para cualquier destinatario, con independencia de su servidor de correo."
  - id: b
    correct: true
    text:
      es: "Para los que usan Exchange Server 2016 o 2019, Exchange Online u Outlook.com."
  - id: c
    text:
      es: "Solo para los que usan Exchange Online u Outlook.com."
  - id: d
    text:
      es: "Solo para los destinatarios con una cuenta profesional de la misma organización."
  explanation:
    es: "La nota de la página limita el correo mencionado a destinatarios con Exchange Server 2016, Exchange Server 2019, Exchange Online u Outlook.com. Decir que sirve para cualquier destinatario contradice esa nota. Solo Exchange Online u Outlook.com es lo que la página dice del indicador @ (el símbolo), no del correo mencionado. Limitarlo a cuentas profesionales de la misma organización deja fuera Outlook.com, que es una cuenta personal y sí figura entre los destinatarios admitidos."
  citation: "fuente: `ms-outlook-menciones.html`; «Filtre los mensajes que le mencionan»"
  difficulty: 2
  tags:
  - "requisito"
