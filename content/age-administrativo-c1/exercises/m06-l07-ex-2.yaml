      es: "Autor"
  - id: b
    text:
      es: "Colaborador"
  - id: c
    correct: true
    text:
      es: "Revisor"
  - id: d
    text:
      es: "Ninguno"
  explanation:
    es: "La tabla da a Revisor una sola actividad: solo leer elementos. Colaborador solo crea elementos. Autor crea y lee, y modifica y elimina los elementos que cree. Ninguno no permite ninguna actividad ni abrir la carpeta."
