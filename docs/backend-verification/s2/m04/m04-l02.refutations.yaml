    anchor: kotlin-docs-delegation#delegation.md
    sentence: b will be stored internally in objects of Derived
  - option: Require `Derived` to override each method of `Base` by hand
    anchor: kotlin-docs-delegation#delegation.md
    sentence: Kotlin supports it natively requiring zero boilerplate code
  - option: Replace the delegation pattern with implementation inheritance from the class of `b`
    anchor: kotlin-docs-delegation#delegation.md
    sentence: The Delegation pattern has proven to be a good alternative to implementation inheritance
m04-l02-q08:
  key:
    anchor: kotlin-docs-delegated-properties#lazy-properties
    sentence: 'By default, the evaluation of lazy properties is synchronized: the value is computed only in one thread, but all threads will see the same value.'
  wrong:
  - option: It is computed once in each thread, so each thread keeps its own value
    anchor: kotlin-docs-delegated-properties#lazy-properties
    sentence: 'By default, the evaluation of lazy properties is synchronized: the value is computed only in one thread, but all threads will see the same value.'
  - option: It is computed without thread-safety guarantees, as with `LazyThreadSafetyMode.NONE`
    anchor: kotlin-docs-delegated-properties#lazy-properties
    sentence: If you're sure that the initialization will always happen in the same thread as the one where you use the property, you can use LazyThreadSafetyMode.NONE.
  - option: It may be computed by several threads at once, as with `LazyThreadSafetyMode.PUBLICATION`
    anchor: kotlin-docs-delegated-properties#lazy-properties
    sentence: pass LazyThreadSafetyMode.PUBLICATION as a parameter to lazy().
