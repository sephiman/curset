# anchor: fuente-ms-outlook-atajos-html
- id: m02-l11-q050
  prompt:
    es: "En Outlook 365 clásico, el método abreviado de teclado que abre la Libreta de direcciones es:"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl+Mayús+B"
  - id: b
    text:
      es: "Ctrl+Mayús+C"
  - id: c
    text:
      es: "Ctrl+Mayús+L"
  - id: d
    text:
      es: "Ctrl+Mayús+F"
  explanation:
    es: "Ctrl+Mayús+B abre la Libreta de direcciones. Ctrl+Mayús+C crea un contacto. Ctrl+Mayús+L crea un grupo de contactos. Ctrl+Mayús+F abre la Búsqueda avanzada."
  citation: "fuente: `ms-outlook-atajos.html`; «Métodos abreviados de teclado de correo en la versión clásica de Outlook»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-atajos-html
- id: m02-l11-q051
  prompt:
    es: "En Outlook 365 clásico, el método abreviado de teclado que crea un contacto desde cualquier vista de Outlook es:"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+A"
  - id: b
    text:
      es: "Ctrl+Mayús+B"
  - id: c
    correct: true
    text:
      es: "Ctrl+Mayús+C"
  - id: d
    text:
      es: "Ctrl+Mayús+K"
  explanation:
    es: "Ctrl+Mayús+C crea un contacto. Ctrl+Mayús+B abre la Libreta de direcciones. Ctrl+Mayús+A crea una cita. Ctrl+Mayús+K crea una tarea."
  citation: "fuente: `ms-outlook-atajos.html`; «Crear un contacto. — Ctrl+Mayús+C»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-atajos-html
- id: m02-l11-q052
  prompt:
    es: "Señale el método abreviado de teclado de Outlook 365 clásico que crea un grupo de contactos:"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+X"
  - id: b
    text:
      es: "Ctrl+Mayús+C"
  - id: c
    text:
      es: "Ctrl+Mayús+B"
  - id: d
    correct: true
    text:
      es: "Ctrl+Mayús+L"
  explanation:
    es: "Ctrl+Mayús+L crea un grupo de contactos. Ctrl+Mayús+C crea un contacto. Ctrl+Mayús+B abre la Libreta de direcciones. Ctrl+Mayús+X crea un fax."
  citation: "fuente: `ms-outlook-atajos.html`; «Crear un elemento o archivo en la versión clásica de Outlook»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-atajos-html
- id: m02-l11-q053
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué vista es la libreta de direcciones de Outlook, donde se almacenan los contactos personales?"
  options:
  - id: a
    text:
      es: "Copilot"
  - id: b
    text:
      es: "Correo"
  - id: c
    correct: true
    text:
      es: "People"
  - id: d
    text:
      es: "Calendario"
  explanation:
    es: "La vista People es la libreta de direcciones de Outlook. Calendario es la vista de las citas y reuniones. Correo es la vista de los mensajes. Copilot es otra vista que acompaña a Correo, Calendar y People en la barra lateral."
  citation: "fuente: `ms-outlook-atajos.html`; «Métodos abreviados de teclado de Contactos (Personas)»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-atajos-html
- id: m02-l11-q054
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué contenido tiene la vista People, que funciona como libreta de direcciones?"
  options:
  - id: a
    text:
      es: "Solo los miembros de los grupos de Microsoft 365"
  - id: b
    text:
      es: "Solo los contactos personales, sin libretas de la organización"
  - id: c
    text:
      es: "Solo las libretas de direcciones configuradas para la organización"
  - id: d
    correct: true
    text:
      es: "Contactos personales y libretas de direcciones de la organización"
  explanation:
    es: "La vista People guarda los contactos personales y permite abrir cualquier libreta de direcciones configurada para la organización. Que solo tenga contactos personales o solo libretas de la organización contradice esa frase, que cita las dos. Que solo muestre miembros de grupos de Microsoft 365 contradice que almacene los contactos personales."
  citation: "fuente: `ms-outlook-atajos.html`; «Métodos abreviados de teclado de Contactos (Personas)»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-listas-contactos-2026-11-06-html
- id: m02-l11-q056
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cómo se llama lo que en la versión clásica de Outlook se llama grupo de contactos?"
  options:
  - id: a
    text:
      es: "Carpeta de búsqueda"
  - id: b
    correct: true
    text:
      es: "Lista de contactos"
  - id: c
    text:
      es: "Libreta de direcciones"
  - id: d
    text:
      es: "Grupo de Microsoft 365"
  explanation:
    es: "En el nuevo Outlook, las listas de contactos son lo que en Outlook clásico se llamaba grupos de contactos. Un grupo de Microsoft 365 comparte bandeja, calendario y archivos. La libreta de direcciones es la vista People. La carpeta de búsqueda muestra mensajes que cumplen unos criterios."
  citation: "fuente: `ms-outlook-listas-contactos_2026-11-06.html`; «Crear, editar o eliminar una lista de contactos (o grupo de contactos) en Outlook»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-listas-contactos-2026-11-06-html
- id: m02-l11-q057
  prompt:
    es: "En Outlook 365 clásico, ¿qué ocurre con los contactos al eliminar un grupo de contactos?"
  options:
  - id: a
    text:
      es: "Se eliminan los contactos que no están en otro grupo"
  - id: b
    correct: true
    text:
      es: "No se eliminan los contactos, solo el grupo de contactos"
  - id: c
    text:
      es: "Se mueven a la carpeta Elementos eliminados con el grupo"
  - id: d
    text:
      es: "Se eliminan el grupo y todos sus contactos"
  explanation:
    es: "La ayuda dice que los contactos no se eliminan, solo la lista de contactos. Eliminar el grupo con todos sus contactos, solo los que no estén en otro grupo o llevarlos a Elementos eliminados contradice esa frase."
  citation: "fuente: `ms-outlook-listas-contactos_2026-11-06.html`; «Eliminar un grupo de contactos en Outlook clásico»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-listas-contactos-2026-11-06-html
- id: m02-l11-q058
  prompt:
    es: "En Outlook 365, si se quiere más funcionalidad que una lista de contactos, ¿qué recomienda la ayuda considerar?"
  options:
  - id: a
    text:
      es: "Crear un grupo de envío y recepción con los contactos"
  - id: b
    text:
      es: "Crear una regla que envíe automáticamente mensajes a los contactos"
  - id: c
    correct: true
    text:
      es: "Crear un grupo en Outlook, para compartir bandeja, calendario y archivos"
  - id: d
    text:
      es: "Crear una carpeta de búsqueda, que permite compartir los contactos"
  explanation:
    es: "La ayuda recomienda crear un grupo en Outlook, con el que se comparten bandeja de entrada, calendario y archivos. La carpeta de búsqueda es una carpeta virtual con mensajes, y no comparte contactos. La regla actúa sobre el correo que llega. El grupo de envío y recepción contiene cuentas y carpetas, no contactos."
  citation: "fuente: `ms-outlook-listas-contactos_2026-11-06.html`; «Crear, editar o eliminar una lista de contactos (o grupo de contactos) en Outlook»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-listas-contactos-2026-11-06-html
- id: m02-l11-q069
  prompt:
    es: "En Outlook 365 clásico, ¿qué botón se selecciona para guardar el nuevo grupo de contactos cuando se han agregado los miembros?"
  options:
  - id: a
    text:
      es: "Descartar"
  - id: b
    text:
      es: "Aceptar"
  - id: c
    correct: true
    text:
      es: "Guardar & Cerrar"
  - id: d
    text:
      es: "Guardar"
  explanation:
    es: "Cuando se ha terminado de crear un grupo de contactos en Outlook clásico se selecciona Guardar & cerrar. Guardar es el botón con el que se termina de editar una lista de contactos en el nuevo Outlook. Aceptar confirma cuadros de diálogo. Descartar cancela la creación de una regla del nuevo Outlook."
  citation: "fuente: `ms-outlook-listas-contactos_2026-11-06.html`; «Crear un grupo de contactos en Outlook clásico»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-contactos-combinar-html
- id: m02-l11-q221
  prompt:
    es: "En Outlook 365 para Windows, ¿cuál de las siguientes opciones indica dónde está disponible el comando Combinar correspondencia de Contactos?"
  options:
  - id: a
    text:
      es: "Solo en el nuevo Outlook"
  - id: b
    text:
      es: "En Outlook clásico y en el nuevo Outlook"
  - id: c
    text:
      es: "En ninguno: se hace solo desde Word"
  - id: d
    correct: true
    text:
      es: "Solo en Outlook clásico"
  explanation:
    es: "El comando Combinar correspondencia de Contactos solo está en Outlook clásico para Windows. Decir que está solo en el nuevo Outlook invierte el dato. Decir que está en los dos tampoco: el nuevo Outlook ofrece en su lugar una opción de Enviar. Hacerlo solo desde Word no vale: la combinación de Word también necesita Outlook clásico para leer los contactos y enviar los mensajes."
  citation: "fuente: `ms-outlook-contactos-combinar.html`; «Usar los contactos de Outlook como un origen de datos para una combinación de correspondencia»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-contactos-combinar-html
- id: m02-l11-q222
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de las siguientes opciones permite enviar a cada destinatario su propia copia del mensaje desde un mensaje nuevo?"
  options:
  - id: a
    text:
      es: "Con la flecha junto a Enviar y Programar envío"
  - id: b
    correct: true
    text:
      es: "Con la flecha junto a Enviar y Iniciar combinación de correspondencia"
  - id: c
    text:
      es: "Con Inicio › Combinación de correspondencia, tras seleccionar los nombres en People"
  - id: d
    text:
      es: "Con Cancelar envío, abriendo el mensaje en Borrador"
  explanation:
    es: "En un mensaje nuevo, se selecciona la flecha junto a Enviar y después Iniciar combinación de correspondencia. Programar envío, en el mismo menú, retiene el mensaje en Borrador hasta la hora elegida. Inicio › Combinación de correspondencia, desde People, es la vía de Outlook clásico. Cancelar envío, en Borrador, sirve para enviar de inmediato un mensaje programado."
  citation: "fuente: `ms-outlook-contactos-combinar.html`; «Usar los contactos de Outlook como un origen de datos para una combinación de correspondencia»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-contactos-combinar-html
- id: m02-l11-q224
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones describe lo que hay que hacer para incluir toda la libreta de direcciones en una combinación de correspondencia desde Contactos?"
  options:
  - id: a
    text:
      es: "Seleccionar el grupo de contactos que contenga todos los nombres de la libreta."
  - id: b
    text:
      es: "Seleccionar todos los nombres en People con Ctrl+E y marcar Archivo permanente para guardar la lista con un nombre."
  - id: c
    text:
      es: "Ir a Inicio › Combinación de correspondencia y elegir Finalizar & combinar."
  - id: d
    correct: true
    text:
      es: "No seleccionar ningún nombre en People antes de ir a Inicio › Combinación de correspondencia."
  explanation:
    es: "En People se seleccionan los nombres que se quieran incluir, o ninguno si se desea toda la libreta de direcciones, y luego se va a Inicio › Combinación de correspondencia. Ctrl+E lleva al cuadro de búsqueda, y Archivo permanente solo guarda con nombre un conjunto ya seleccionado para reutilizarlo. Un grupo de contactos no es lo que la página pide para toda la libreta. Finalizar & combinar es el comando de Word que completa la combinación, no el paso que elige los contactos."
  citation: "fuente: `ms-outlook-contactos-combinar.html`; «Usar los contactos de Outlook como un origen de datos para una combinación de correspondencia»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-contactos-combinar-html
- id: m02-l11-q225
  prompt:
    es: "En Outlook 365 clásico, ¿para qué sirve la opción Archivo permanente del cuadro de combinación de correspondencia?"
  options:
  - id: a
    text:
      es: "Para mover los contactos seleccionados a una carpeta de archivo."
  - id: b
    correct: true
    text:
      es: "Para reutilizar el conjunto de contactos seleccionado, dándole un nombre."
  - id: c
    text:
      es: "Para guardar el documento de combinación y poder ejecutarlo de nuevo sin configurar nada."
  - id: d
    text:
      es: "Para enviar los mensajes combinados sin pasar por Word."
  explanation:
    es: "Archivo permanente guarda con nombre el conjunto de contactos seleccionado, para volver a usarlo sin elegirlos cada vez. Guardar el documento de combinación es otro paso: se guarda en Word y permanece conectado al origen de datos. Mover contactos a una carpeta de archivo no figura entre sus funciones. Enviar sin Word tampoco: el documento de combinación se completa en Word con Finalizar & combinar."
  citation: "fuente: `ms-outlook-contactos-combinar.html`; «Usar los contactos de Outlook como un origen de datos para una combinación de correspondencia»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-listas-contactos-2026-11-06-html
- id: m02-l11-q249
  prompt:
    es: "En Outlook 365, ¿para qué sirve una lista de contactos, que en Outlook clásico se llama grupo de contactos?"
  options:
  - id: a
    text:
      es: "Para compartir una bandeja de entrada, un calendario y archivos con varias personas."
  - id: b
    text:
      es: "Para enviar a cada destinatario su copia con campos personalizados."
  - id: c
    correct: true
    text:
      es: "Para reunir contactos y direcciones y escribir a un grupo de personas."
  - id: d
    text:
      es: "Para aplicar la misma regla a los mensajes de varias personas."
  explanation:
    es: "Una lista o grupo de contactos reúne contactos y direcciones de correo, y resulta útil para enviar mensajes a un grupo de personas. Compartir bandeja, calendario y archivos es lo que ofrece un grupo de Outlook, que la página recomienda para quien quiera más funcionalidad. Aplicar una regla a varias personas es función de las reglas. Los campos personalizados son de la combinación de correspondencia de Word, que parte de los contactos de Outlook clásico."
  citation: "fuente: `ms-outlook-listas-contactos_2026-11-06.html`; «Crear, editar o eliminar una lista de contactos (o grupo de contactos) en Outlook»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-listas-contactos-2026-11-06-html
- id: m02-l11-q250
  prompt:
    es: "En Outlook 365 clásico, ¿cómo se agregan o quitan miembros de un grupo de contactos que ya existe?"
  options:
  - id: a
    correct: true
    text:
      es: "En People, con doble clic en el grupo y Agregar o quitar miembros; luego, Guardar & cerrar."
  - id: b
    text:
      es: "Con Ctrl+Mayús+L sobre el grupo seleccionado en People."
  - id: c
    text:
      es: "Con Ctrl+Mayús+B, que abre el grupo para modificar sus miembros."
  - id: d
    text:
      es: "En People, con Nuevo grupo de contactos y escribiendo otra vez el mismo nombre."
  explanation:
    es: "Se va a People, se abre el grupo con doble clic, se selecciona Agregar o quitar miembros y, al terminar, Guardar & cerrar. Nuevo grupo de contactos crea un grupo distinto, no edita el existente. Ctrl+Mayús+L es el método abreviado para crear un grupo de contactos. Ctrl+Mayús+B abre la libreta de direcciones."
  citation: "fuente: `ms-outlook-listas-contactos_2026-11-06.html`; «Editar un grupo de contactos en Outlook clásico»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-listas-contactos-2026-11-06-html
- id: m02-l11-q251
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cómo se quita un contacto de una lista de contactos?"
  options:
  - id: a
    text:
      es: "En People, con el botón Eliminar de la lista, que borra el contacto y la lista."
  - id: b
    text:
      es: "En People, con doble clic en la lista y Agregar o quitar miembros; después, Guardar & cerrar."
  - id: c
    correct: true
    text:
      es: "En People, Sus listas de contactos, botón Editar y la X junto al contacto; después, Guardar."
  - id: d
    text:
      es: "En People, con Nuevo grupo de contactos en la cinta de opciones."
  explanation:
    es: "En el nuevo Outlook se va a Sus listas de contactos, se pasa el puntero por la lista, se selecciona Editar, se marca la X junto al contacto y se guarda con Guardar. Agregar o quitar miembros y Guardar & cerrar son los pasos de Outlook clásico. El botón Eliminar borra solo la lista, y no los contactos. Nuevo grupo de contactos en la cinta es la vía de Outlook clásico para crear un grupo, no para quitar un contacto."
  citation: "fuente: `ms-outlook-listas-contactos_2026-11-06.html`; «Quitar contactos de una lista en el nuevo Outlook»"
  difficulty: 3
  tags:
  - "ofimática-menú"
