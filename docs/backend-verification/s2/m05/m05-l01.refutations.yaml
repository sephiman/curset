  - option: Neither kind of callback is called, because the container keeps no record of the instance
    anchor: spring-fw-beans-factory-scopes#beans-factory-scopes-prototype
    sentence: initialization lifecycle callback methods are called on all objects regardless of scope
  - option: Only destruction callbacks are called, when the container is closed
