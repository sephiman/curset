# anchor: boe-a-2015-10566-art-29
- id: m03-l05-q022
  prompt:
    es: "¿En qué término debe cometerse más de una infracción de la misma naturaleza para que se aprecie reincidencia en la graduación de la sanción, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "En el término de seis meses."
  - id: b
    correct: true
    text:
      es: "En el término de un año."
  - id: c
    text:
      es: "En el término de dos años."
  - id: d
    text:
      es: "En el término de tres años."
  explanation:
    es: "El artículo 29.3.d) habla de la «comisión en el término de un año de más de una infracción de la misma naturaleza». Seis meses, dos años y tres años son plazos de prescripción del artículo 30.1, no el término de la reincidencia."
