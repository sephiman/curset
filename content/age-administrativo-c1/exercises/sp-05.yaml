  prompt:
    es: "Según el artículo 87 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las actuaciones complementarias que acuerda la Directora deberán practicarse, como máximo, hasta:"
  options:
  - id: a
    text:
      es: "el jueves, 4 de marzo de 2027."
  - id: b
    text:
      es: "el martes, 9 de marzo de 2027."
  - id: c
