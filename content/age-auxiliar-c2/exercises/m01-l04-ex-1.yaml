# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q001
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los Jueces y Magistrados integrantes del poder judicial es correcta según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Son independientes, inamovibles, responsables y sometidos únicamente al imperio de la ley."
  - id: b
    text:
      es: "Son independientes, inamovibles, inviolables y sometidos únicamente al imperio de la ley."
  - id: c
    text:
      es: "Pueden ser trasladados o jubilados por acuerdo del Gobierno, oído el Consejo General del Poder Judicial."
  - id: d
    text:
      es: "Pueden pertenecer a partidos políticos mientras se hallen en activo, pero no a sindicatos."
  explanation:
    es: "El artículo 117.1 CE dice que los Jueces y Magistrados son «independientes, inamovibles, responsables y sometidos únicamente al imperio de la ley». Una opción cambia «responsables» por «inviolables», que es la nota que el artículo 56.3 CE da a la persona del Rey. La del traslado «por acuerdo del Gobierno» contradice el artículo 117.2 CE: solo pueden ser trasladados o jubilados por las causas y con las garantías previstas en la ley. La que admite partidos «pero no sindicatos» contradice el artículo 127.1 CE, que les prohíbe pertenecer a partidos políticos y también a sindicatos."
  citation: "art. 117.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q002
  prompt:
    es: "Según el artículo 117 de la Constitución Española de 1978, ¿a qué están sometidos los Jueces y Magistrados integrantes del poder judicial?"
  options:
  - id: a
    correct: true
    text:
      es: "Únicamente al imperio de la ley."
  - id: b
    text:
      es: "A la ley y a las instrucciones del Consejo General del Poder Judicial."
  - id: c
    text:
      es: "A la ley y a las órdenes de los Presidentes de sus Tribunales."
  - id: d
    text:
      es: "A la ley y a las directrices de política judicial del Gobierno."
  explanation:
    es: "El artículo 117.1 CE los declara «sometidos únicamente al imperio de la ley». Las otras tres opciones añaden una segunda sujeción, al Consejo General del Poder Judicial, a los Presidentes de los Tribunales o al Gobierno, y el adverbio «únicamente» las excluye. El Consejo es el órgano de gobierno del Poder Judicial (art. 122.2 CE), pero no dicta a los jueces cómo juzgar."
  citation: "art. 117.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q003
  prompt:
    es: "Según la Constitución Española de 1978, que dedica su título VI al Poder Judicial, la justicia emana del pueblo y se administra:"
  options:
  - id: a
    correct: true
    text:
      es: "En nombre del Rey por Jueces y Magistrados integrantes del poder judicial."
  - id: b
    text:
      es: "En nombre del pueblo por Jueces y Magistrados integrantes del poder judicial."
  - id: c
    text:
      es: "En nombre del Rey por el Consejo General del Poder Judicial."
  - id: d
    text:
      es: "En nombre de las Cortes Generales por Jueces y Magistrados de carrera."
  explanation:
    es: "El artículo 117.1 CE dice que la justicia «emana del pueblo y se administra en nombre del Rey por Jueces y Magistrados integrantes del poder judicial». La opción «en nombre del pueblo» confunde de quién emana la justicia con en nombre de quién se administra. Otra opción pone al Consejo General del Poder Judicial, que es el órgano de gobierno del Poder Judicial (art. 122.2 CE) y no juzga. Otra opción cambia al Rey por las Cortes Generales."
  citation: "art. 117.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q004
  prompt:
    es: "De acuerdo con el artículo 117 de la Constitución Española de 1978, los Jueces y Magistrados no podrán ser separados, suspendidos, trasladados ni jubilados:"
  options:
  - id: a
    text:
      es: "Sino por acuerdo del Consejo General del Poder Judicial adoptado por tres quintos."
  - id: b
    text:
      es: "Sino por alguna de las causas previstas en el reglamento del Consejo General del Poder Judicial."
  - id: c
    text:
      es: "Sino por sentencia firme del Tribunal Supremo dictada en única instancia."
  - id: d
    correct: true
    text:
      es: "Sino por alguna de las causas y con las garantías previstas en la ley."
  explanation:
    es: "El artículo 117.2 dice que Jueces y Magistrados no podrán ser separados, suspendidos, trasladados ni jubilados «sino por alguna de las causas y con las garantías previstas en la ley». La remisión es a la ley, no a un reglamento del Consejo General del Poder Judicial: un reglamento no es la ley. Un acuerdo del Consejo adoptado por tres quintos tampoco sirve: pone un órgano y una mayoría donde el artículo exige causas y garantías legales. Una sentencia firme del Tribunal Supremo en única instancia como único cauce tampoco: la ley puede prever otras causas."
  citation: "art. 117.2 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q005
  prompt:
    es: "De acuerdo con el artículo 117 de la Constitución Española de 1978, el ejercicio de la potestad jurisdiccional corresponde exclusivamente a los Juzgados y Tribunales:"
  options:
  - id: a
    text:
      es: "Determinados por el Consejo General del Poder Judicial, según las normas de competencia que este establezca."
  - id: b
    text:
      es: "Determinados por el Gobierno mediante real decreto, según las normas de competencia y procedimiento vigentes."
  - id: c
    text:
      es: "Determinados por los Estatutos de Autonomía en su respectivo ámbito territorial."
  - id: d
    correct: true
    text:
      es: "Determinados por las leyes, según las normas de competencia y procedimiento que las mismas establezcan."
  explanation:
    es: "El artículo 117.3 CE atribuye la potestad jurisdiccional «exclusivamente a los Juzgados y Tribunales determinados por las leyes, según las normas de competencia y procedimiento que las mismas establezcan». Dos opciones ponen la determinación en manos del Consejo General del Poder Judicial o del Gobierno, y otra en los Estatutos de Autonomía. El artículo reserva esa determinación a las leyes."
  citation: "art. 117.3 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q006
  prompt:
    es: "¿En qué consiste, según la Constitución Española de 1978, la potestad jurisdiccional que corresponde exclusivamente a los Juzgados y Tribunales?"
  options:
  - id: a
    correct: true
    text:
      es: "En juzgar y hacer ejecutar lo juzgado en todo tipo de procesos."
  - id: b
    text:
      es: "En juzgar en todo tipo de procesos, mientras la ejecución corresponde al Gobierno."
  - id: c
    text:
      es: "En juzgar y hacer ejecutar lo juzgado solo en los procesos penales."
  - id: d
    text:
      es: "En juzgar y proponer al Gobierno la ejecución de lo juzgado."
  explanation:
    es: "El artículo 117.3 CE habla de «la potestad jurisdiccional en todo tipo de procesos, juzgando y haciendo ejecutar lo juzgado». Dos opciones sacan la ejecución de los Juzgados y Tribunales y se la dan al Gobierno. Otra limita la potestad a los procesos penales, cuando el artículo dice «en todo tipo de procesos»."
  citation: "art. 117.3 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q008
  prompt:
    es: "De acuerdo con el artículo 117 de la Constitución Española de 1978, la ley regulará el ejercicio de la jurisdicción militar:"
  options:
  - id: a
    correct: true
    text:
      es: "En el ámbito estrictamente castrense y en los supuestos de estado de sitio."
  - id: b
    text:
      es: "En el ámbito estrictamente castrense y en los supuestos de estado de excepción y de sitio."
  - id: c
    text:
      es: "En el ámbito castrense y en los supuestos de estado de alarma, de excepción y de sitio."
  - id: d
    text:
      es: "Únicamente en tiempo de guerra y en los supuestos de estado de sitio."
  explanation:
    es: "El artículo 117.5 CE limita la jurisdicción militar al «ámbito estrictamente castrense» y a «los supuestos de estado de sitio». Una opción añade el estado de excepción y otra, además, el de alarma. Otra sustituye el ámbito castrense por el tiempo de guerra."
  citation: "art. 117.5 CE"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1978-31229-art-121
- id: m01-l04-q012
  prompt:
    es: "¿A cargo de quién corre, según la Constitución Española de 1978, la indemnización de los daños causados por error judicial?"
  options:
  - id: a
    text:
      es: "A cargo del Juez o Magistrado que haya causado el daño."
  - id: b
    text:
      es: "A cargo del Consejo General del Poder Judicial, con cargo a su presupuesto."
  - id: c
    correct: true
    text:
      es: "A cargo del Estado, conforme a la ley."
  - id: d
    text:
      es: "A cargo de la Comunidad Autónoma con competencias asumidas en materia de Justicia."
  explanation:
    es: "El artículo 121 CE dice que los daños causados por error judicial y los debidos al funcionamiento anormal de la Administración de Justicia «darán derecho a una indemnización a cargo del Estado, conforme a la ley». No la paga el juez, ni el Consejo General del Poder Judicial, ni la Comunidad Autónoma."
  citation: "art. 121 CE"
  difficulty: 2
  tags:
  - "efecto"
  - "órgano"
# anchor: boe-a-1978-31229-art-124
- id: m01-l04-q013
  prompt:
    es: "¿Qué misión atribuye la Constitución Española de 1978 al Ministerio Fiscal, sin perjuicio de las funciones encomendadas a otros órganos?"
  options:
  - id: a
    text:
      es: "Gobernar el poder judicial, en particular en materia de nombramientos, ascensos, inspección y régimen disciplinario."
  - id: b
    correct: true
    text:
      es: "Promover la acción de la justicia en defensa de la legalidad, de los derechos de los ciudadanos y del interés público tutelado por la ley."
  - id: c
    text:
      es: "Juzgar y hacer ejecutar lo juzgado en defensa de la legalidad y del interés público tutelado por la ley."
  - id: d
    text:
      es: "Defender los derechos fundamentales supervisando la actividad de la Administración y dando cuenta a las Cortes."
  explanation:
    es: "El artículo 124.1 CE da al Ministerio Fiscal la misión de «promover la acción de la justicia en defensa de la legalidad, de los derechos de los ciudadanos y del interés público tutelado por la ley». La opción de «gobernar el poder judicial» describe las funciones del Consejo General del Poder Judicial (art. 122.2 CE). La de «juzgar y hacer ejecutar lo juzgado» es la potestad jurisdiccional, que corresponde a los Juzgados y Tribunales (art. 117.3 CE). La que habla de supervisar «la actividad de la Administración» describe al Defensor del Pueblo (art. 54 CE)."
  citation: "art. 124.1 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-124
- id: m01-l04-q014
  prompt:
    es: "De acuerdo con el artículo 124 de la Constitución Española de 1978, el Fiscal General del Estado será nombrado por el Rey, a propuesta del Gobierno:"
  options:
  - id: a
    text:
      es: "Previo informe favorable del Consejo General del Poder Judicial."
  - id: b
    text:
      es: "Oído el Pleno del Consejo de Estado."
  - id: c
    correct: true
    text:
      es: "Oído el Consejo General del Poder Judicial."
  - id: d
    text:
      es: "Previa aprobación del Congreso de los Diputados por mayoría absoluta."
  explanation:
    es: "El artículo 124.4 dice: «El Fiscal General del Estado será nombrado por el Rey, a propuesta del Gobierno, oído el Consejo General del Poder Judicial». Un informe favorable es un requisito más fuerte que ser «oído»: el Gobierno tendría que atenerse a él. El órgano oído es el Consejo General del Poder Judicial, no el Pleno del Consejo de Estado. La cadena que describe el artículo es Rey, Gobierno y Consejo oído, sin ninguna aprobación del Congreso por mayoría absoluta."
  citation: "art. 124.4 CE"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-127
- id: m01-l04-q015
  prompt:
    es: "De acuerdo con el artículo 127 de la Constitución Española de 1978, los Jueces y Magistrados, así como los Fiscales, mientras se hallen en activo:"
  options:
  - id: a
    text:
      es: "No podrán pertenecer a partidos políticos, pero sí afiliarse a sindicatos de su elección."
  - id: b
    text:
      es: "No podrán desempeñar otros cargos públicos, salvo los de elección popular en el ámbito local."
  - id: c
    text:
      es: "Podrán pertenecer a partidos políticos, pero no desempeñar cargos directivos en ellos."
  - id: d
    correct: true
    text:
      es: "No podrán desempeñar otros cargos públicos, ni pertenecer a partidos políticos o sindicatos."
  explanation:
    es: "El artículo 127.1 CE dice que, mientras se hallen en activo, «no podrán desempeñar otros cargos públicos, ni pertenecer a partidos políticos o sindicatos». Una opción permite la afiliación sindical y otra la afiliación a partidos, ambas prohibidas. Otra más inventa una excepción para cargos locales de elección popular."
  citation: "art. 127.1 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q057
  prompt:
    es: "Señale la respuesta correcta sobre la base de la organización y del funcionamiento de los Tribunales, de acuerdo con el artículo 117.5 de la Constitución Española de 1978:"
  options:
  - id: a
    correct: true
    text:
      es: "Es el principio de unidad jurisdiccional."
  - id: b
    text:
      es: "Es el principio de especialización por materias."
  - id: c
    text:
      es: "Es la pluralidad de jurisdicciones por territorios."
  - id: d
    text:
      es: "Es el principio de gratuidad de la justicia."
  explanation:
    es: "El artículo 117.5 dice que «el principio de unidad jurisdiccional es la base de la organización y funcionamiento de los Tribunales». La especialización por materias y la pluralidad territorial de jurisdicciones contradicen esa unidad. La gratuidad de la justicia es otra garantía, recogida en el artículo 119, y no es la base de la organización."
  citation: "art. 117.5 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-117
- id: m01-l04-q058
  prompt:
    es: "Conforme al artículo 117.6 de la Constitución Española de 1978, al regular la organización del Poder Judicial, el texto constitucional prohíbe de forma expresa:"
  options:
  - id: a
    text:
      es: "Los Tribunales consuetudinarios y tradicionales."
  - id: b
    correct: true
    text:
      es: "Los Tribunales de excepción."
  - id: c
    text:
      es: "El Jurado en los procesos penales que la ley determine."
  - id: d
    text:
      es: "Los Juzgados de Paz en los municipios sin Tribunal de Instancia."
  explanation:
    es: "El artículo 117.6 es breve: «se prohíben los Tribunales de excepción». Los Tribunales consuetudinarios y tradicionales y el Jurado los admite el artículo 125, y los Juzgados de Paz son uno de los órganos a los que la Ley Orgánica 6/1985 atribuye potestad jurisdiccional."
  citation: "art. 117.6 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-1978-31229-art-118
- id: m01-l04-q059
  prompt:
    es: "Según la Constitución Española de 1978, todos están obligados, en relación con las decisiones de los Jueces y Tribunales, a cumplir:"
  options:
  - id: a
    text:
      es: "Las sentencias desde que se dictan, aunque no sean firmes."
  - id: b
    text:
      es: "Solo las sentencias firmes del Tribunal Supremo y del Tribunal Constitucional."
  - id: c
    correct: true
    text:
      es: "Las sentencias y demás resoluciones firmes de los Jueces y Tribunales."
  - id: d
    text:
      es: "Las resoluciones de los Jueces y Tribunales cuando el Ministerio Fiscal lo solicite."
  explanation:
    es: "El artículo 118 obliga a cumplir «las sentencias y demás resoluciones firmes de los Jueces y Tribunales». No basta con que se hayan dictado: han de ser firmes. Tampoco se limita a las sentencias de los dos Tribunales superiores, ni depende de que el Ministerio Fiscal lo pida."
  citation: "art. 118 CE"
  difficulty: 1
  tags:
  - "efecto"
  - "requisito"
# anchor: boe-a-1978-31229-art-119
- id: m01-l04-q060
  prompt:
    es: "Según la Constitución Española de 1978, la justicia será gratuita cuando así lo disponga la ley y, en todo caso, respecto de:"
  options:
  - id: a
    text:
      es: "Quienes ejerzan la acción popular en un proceso penal."
  - id: b
    text:
      es: "Quienes litiguen contra la Administración del Estado."
  - id: c
    text:
      es: "Quienes sean beneficiarios de una pensión pública."
  - id: d
    correct: true
    text:
      es: "Quienes acrediten insuficiencia de recursos para litigar."
  explanation:
    es: "El artículo 119 garantiza la gratuidad «en todo caso, respecto de quienes acrediten insuficiencia de recursos para litigar». Ejercer la acción popular, litigar contra el Estado o cobrar una pensión no dan por sí solos derecho a ella."
  citation: "art. 119 CE"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-120
- id: m01-l04-q061
  prompt:
    es: "Según la Constitución Española de 1978, las actuaciones judiciales serán públicas como regla general, aunque admiten excepciones, que podrán prever:"
  options:
  - id: a
    text:
      es: "Un reglamento del Consejo."
  - id: b
    correct: true
    text:
      es: "Las leyes de procedimiento."
  - id: c
    text:
      es: "Los acuerdos de la Sala de Gobierno de cada Tribunal."
  - id: d
    text:
      es: "Las resoluciones motivadas de cada Juez."
  explanation:
    es: "El artículo 120.1 remite a «las leyes de procedimiento». Un reglamento del Consejo General del Poder Judicial, un acuerdo de la Sala de Gobierno o la resolución de un Juez no pueden fijar excepciones a la publicidad."
  citation: "art. 120.1 CE"
  difficulty: 1
  tags:
  - "excepción"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-120
- id: m01-l04-q062
  prompt:
    es: "Señale la respuesta correcta sobre el procedimiento judicial que regula la Constitución Española de 1978, conforme al artículo 120.2 de su texto:"
  options:
  - id: a
    correct: true
    text:
      es: "Será predominantemente oral, sobre todo en materia criminal."
  - id: b
    text:
      es: "Será predominantemente escrito, sobre todo en materia civil."
  - id: c
    text:
      es: "Será predominantemente oral, sobre todo en materia contencioso-administrativa."
  - id: d
    text:
      es: "Será íntegramente escrito, salvo en materia criminal."
  explanation:
    es: "El artículo 120.2 dice que el procedimiento «será predominantemente oral, sobre todo en materia criminal». Las otras opciones cambian el predominio (escrito) o la materia (civil o contencioso-administrativa), o lo vuelven íntegramente escrito, y ninguna es la regla del artículo."
  citation: "art. 120.2 CE"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-120
- id: m01-l04-q063
  prompt:
    es: "Según la Constitución Española de 1978, todas las sentencias de los Jueces y Tribunales serán siempre motivadas y, además, se pronunciarán:"
  options:
  - id: a
    text:
      es: "En sesión reservada."
  - id: b
    text:
      es: "Por escrito, sin audiencia."
  - id: c
    correct: true
    text:
      es: "En audiencia pública."
  - id: d
    text:
      es: "En audiencia restringida a las partes."
  explanation:
    es: "El artículo 120.3 manda pronunciar las sentencias «en audiencia pública». La sesión reservada, la comunicación solo por escrito y la audiencia limitada a las partes no cumplen esa publicidad."
  citation: "art. 120.3 CE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-1978-31229-art-125
- id: m01-l04-q064
  prompt:
    es: "Según el artículo 125 de la Constitución Española de 1978, los ciudadanos podrán participar en la Administración de Justicia mediante:"
  options:
  - id: a
    text:
      es: "La elección de los Jueces por sufragio en cada partido judicial."
  - id: b
    text:
      es: "La intervención de las Cortes Generales en los procesos penales."
  - id: c
    text:
      es: "Los Tribunales de excepción en los procesos que fije el Gobierno."
  - id: d
    correct: true
    text:
      es: "La institución del Jurado, en los procesos penales que la ley determine."
  explanation:
    es: "El artículo 125 prevé la participación «mediante la institución del Jurado, en la forma y con respecto a aquellos procesos penales que la ley determine». La elección de Jueces por sufragio y la intervención de las Cortes no existen en el texto, y los Tribunales de excepción los prohíbe el artículo 117.6."
  citation: "art. 125 CE"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-125
- id: m01-l04-q065
  prompt:
    es: "¿Cuál de las siguientes facultades pueden ejercer los ciudadanos, además de participar en la Administración de Justicia mediante el Jurado, según el artículo 125 de la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "La acción popular."
  - id: b
    text:
      es: "La acción de nulidad contra las leyes."
  - id: c
    text:
      es: "La iniciativa legislativa en materia judicial."
  - id: d
    text:
      es: "La potestad jurisdiccional en los procesos de menor cuantía."
  explanation:
    es: "El artículo 125 dice que los ciudadanos «podrán ejercer la acción popular». La nulidad de las leyes la decide el Tribunal Constitucional y no es una acción ciudadana. La iniciativa legislativa no figura en ese artículo y la potestad jurisdiccional corresponde en exclusiva a Juzgados y Tribunales (artículo 117.3)."
  citation: "art. 125 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-122
- id: m01-l04-q067
  prompt:
    es: "Según la Constitución Española de 1978, la constitución, el funcionamiento y el gobierno de los Juzgados y Tribunales los determina:"
  options:
  - id: a
    text:
      es: "Un reglamento del Consejo General del Poder Judicial."
  - id: b
    text:
      es: "La ley ordinaria que apruebe cada Comunidad Autónoma."
  - id: c
    correct: true
    text:
      es: "La ley orgánica del poder judicial."
  - id: d
    text:
      es: "Un real decreto del Gobierno."
  explanation:
    es: "El artículo 122.1 dice que «la ley orgánica del poder judicial determinará la constitución, funcionamiento y gobierno de los Juzgados y Tribunales». Ni un reglamento del Consejo, ni una ley autonómica, ni un real decreto pueden hacerlo."
  citation: "art. 122.1 CE"
