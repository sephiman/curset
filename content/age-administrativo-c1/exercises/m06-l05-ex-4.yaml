      es: "Completa la entrada y selecciona la celda situada debajo"
  - id: b
    text:
      es: "Comienza una nueva línea en la misma celda"
  - id: c
    correct: true
    text:
      es: "Completa la entrada y selecciona la celda situada encima"
  - id: d
    text:
      es: "Rellena el rango de celdas seleccionado con la entrada actual"
  explanation:
