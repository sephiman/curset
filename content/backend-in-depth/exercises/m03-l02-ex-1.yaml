- id: m03-l02-q15
  prompt:
    en: Under chapter 17 of the Java Language Specification, when is a program said to contain a data race?
  options:
  - id: a
    text:
      en: When two threads only read the same variable without any synchronization between them
  - id: b
    text:
      en: When a volatile field is written in one thread and read in another thread later
  - id: c
    correct: true
    text:
      en: When two conflicting accesses are not ordered by a happens-before relationship
  - id: d
    text:
      en: When a local variable is used by two threads
  explanation:
    en: A program contains a data race when two conflicting accesses are not ordered by a happens-before relationship.
      Two plain reads are wrong, because accesses conflict only if at least one of them is a write. A volatile write
      and read are wrong, because the write happens-before every subsequent read of that field. A local variable
      is wrong, because local variables are never shared between threads.
  citation: jls-17#jls-17.4.5
  extract:
    en: When a program contains two conflicting accesses (§17.4.1) that are not ordered by a happens-before relationship,
      it is said to contain a data race.
- id: m03-l02-q16
  prompt:
    en: According to the Java 25 Javadoc, which statement about the `ForkJoinPool` class, as compared with other
      kinds of `ExecutorService`, is correct?
  options:
  - id: a
    text:
      en: It has no shared instance, so each application must construct and manage its own pool
  - id: b
    text:
      en: Its worker threads are non-daemon, so they keep the JVM alive
  - id: c
    text:
      en: Its default parallelism level is fixed at one thread, whatever the number of processors
  - id: d
    correct: true
    text:
      en: Its main difference from other kinds of `ExecutorService` is employing work-stealing
  explanation:
    en: A `ForkJoinPool` differs mainly by employing work-stealing. The claim that there is no shared instance is
      wrong, because a static `commonPool()` is available and appropriate for most applications. The claim of non-daemon
      workers is wrong, because all worker threads are initialized with `Thread.isDaemon()` set true. The claim
      of a single thread is wrong, because the default parallelism is the number of available processors.
  citation: javadoc-forkjoinpool#class-forkjoinpool
