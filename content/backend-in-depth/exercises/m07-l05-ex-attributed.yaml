type: quiz
variants:
- id: m07-l05-qa01
  prompt:
    en: 'According to Google in AIP-121: Resource-oriented design, which statement about designing a resource-oriented
      API does the guidance make?'
  options:
  - id: a
    correct: true
    text:
      en: An API identical to the database schema is an anti-pattern
  - id: b
    text:
      en: A typical API exposes a few resources with many methods on each
  - id: c
    text:
      en: A service with a resource-oriented API is necessarily a database
  - id: d
    text:
      en: Methods are emphasized over the resources they are performed on
  explanation:
    en: Google writes in AIP-121 that having an API identical to the underlying database schema is an anti-pattern.
      It writes that a typical resource-oriented API exposes a large number of resources with a small number of
      methods on each, which contradicts a few resources with many methods. It writes that a service with a resource-oriented
      API is not necessarily a database, which contradicts the claim that it is. It writes that such APIs emphasize
      resources over the methods performed on them, which contradicts emphasizing methods.
  citation: google-aip-121#resources; google-aip-121#methods
  extract:
    en: having an API that is identical to the underlying database schema is actually an anti-pattern
- id: m07-l05-qa02
  prompt:
    en: 'According to Google in AIP-121: Resource-oriented design, which statement about custom methods in a resource-oriented
      API does the guidance make?'
  options:
  - id: a
    text:
      en: They require a new custom HTTP verb to be defined for every custom method
  - id: b
    correct: true
    text:
      en: They use traditional HTTP verbs, usually `POST`, and define the custom verb in the URI
  - id: c
    text:
      en: They are preferred over standard methods whenever an operation is complex
  - id: d
    text:
      en: They may use a resource schema that differs from the standard methods' schema
  explanation:
    en: Google writes in AIP-121 that custom methods use traditional HTTP verbs, usually `POST`, and define the
      custom verb in the URI. It writes that a custom method does not entail defining a new or custom HTTP verb,
      which contradicts a new verb for each method. It writes that APIs should prefer standard methods over custom
      ones, which contradicts preferring custom methods for complex operations. It writes that the resource schema
      must be the same across all methods, including a custom method in the same service, which contradicts a differing
      schema.
  citation: google-aip-121#methods
  extract:
    en: Custom methods use traditional HTTP verbs (usually POST) and define the custom verb in the URI.
- id: m07-l05-qa03
  prompt:
    en: 'According to Google in AIP-158: Pagination, how does a response to a collection request signal that the
      end of the collection has been reached?'
  options:
  - id: a
    correct: true
    text:
      en: The `next_page_token` field is empty in the response
  - id: b
    text:
      en: The response carries no resources on the final page
  - id: c
    text:
      en: The `total_size` field equals the count of items returned
  - id: d
    text:
      en: The server closes a streaming response after the last item
  explanation:
    en: Google writes in AIP-158 that when the end of the collection has been reached, the `next_page_token` field
      must be empty. It writes that the API may return fewer results than requested, including zero, even when not
      at the end, which contradicts reading an empty page as the end. It writes that an empty `next_page_token`
      is the only way to communicate end-of-collection, which contradicts `total_size` as a signal. It writes that
      the response must not be a streaming response, which contradicts a stream that closes.
  citation: google-aip-158#guidance
  extract:
    en: If the end of the collection has been reached, the next_page_token field must be empty.
- id: m07-l05-qa04
  prompt:
    en: 'According to Google in AIP-158: Pagination, which statement about the optional `skip` field of a paginated
      request does the guidance make?'
  options:
  - id: a
    text:
      en: A `skip` of 30 with no page token starts at the 30th result
  - id: b
    text:
      en: A `skip` known to pass the end still returns a `next_page_token`
  - id: c
    text:
      en: A `skip` that cannot be fulfilled gets an error status, not `200 OK`
  - id: d
    correct: true
    text:
      en: The `skip` value counts individual resources, not pages
  explanation:
    en: Google writes in AIP-158 that the `skip` value refers to the number of individual resources to skip, not
      the number of pages. It writes that a request with no page token and a `skip` of 30 starts at the 31st result,
      which contradicts starting at the 30th. It writes that a `skip` known to put the cursor beyond the end must
      not include a `next_page_token`, which contradicts returning one. It writes that a `skip` that cannot be fulfilled
      gets `200 OK` with an empty result set, which contradicts an error status.
  citation: google-aip-158#skipping-results
  extract:
    en: The skip value must refer to the number of individual resources to skip, not the number of pages.
- id: m07-l05-qa05
  prompt:
    en: 'According to Google in AIP-158: Pagination, which reason does the guidance give for requiring an RPC that
      returns a collection to provide pagination at the outset?'
  options:
  - id: a
    text:
      en: Adding pagination fields to a proto message breaks wire compatibility
  - id: b
    text:
      en: Client libraries cannot represent paginated methods at all
  - id: c
    correct: true
    text:
      en: Adding pagination to an existing method is backwards-incompatible
  - id: d
    text:
      en: A default limit of 100 keeps existing clients working as collections grow
  explanation:
    en: Google writes in AIP-158 that RPCs returning collections must provide pagination at the outset because adding
      it to an existing method is a backwards-incompatible change. It writes that adding fields to proto messages
      is generally backwards compatible and that the break is behavioural, which contradicts a wire-compatibility
      break. It writes that client libraries implement automatic pagination with different method signatures, which
      contradicts their being unable to represent paginated methods. It writes that even a default limit of 100
      breaks code once the collection grows, which contradicts a default that keeps clients working.
  citation: google-aip-158#guidance; google-aip-158#backwards-compatibility
  extract:
    en: it is a backwards-incompatible change to add pagination to an existing method
- id: m07-l05-qa06
  prompt:
    en: According to the Standard Webhooks specification, which statement about how a producer should treat the
      response codes of webhook deliveries does it make?
  options:
  - id: a
    text:
      en: A `3xx` response counts as success once the redirect is followed
  - id: b
    correct: true
    text:
      en: A `410 Gone` response tells the sender to disable the endpoint
  - id: c
    text:
      en: A `429 Too Many Requests` response tells the sender to retry at once
  - id: d
    text:
      en: A `404` response counts as delivered, since the receiver answered
  explanation:
    en: The specification writes that on a `410 Gone` response the sender should disable the webhook endpoint and
      stop sending it messages. It writes that a `3xx` response is a failure because following redirects causes
      unnecessary load, which contradicts counting it as success. It writes that a `429` response means a rate limit
      was met and that additional requests should be throttled, which contradicts retrying at once. It lists `404`
      among the non-`2xx` failure scenarios, which contradicts counting it as delivered.
  citation: standard-webhooks-spec#untitled
