# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q120
  prompt:
    es: "¿Cuál de los siguientes esquemas sigue el protocolo HTTP, el más utilizado para la navegación web, según el glosario de INCIBE?"
  options:
  - id: a
    text:
      es: "Petición-respuesta: el servidor pide los recursos al navegador y este se los envía"
  - id: b
    text:
      es: "Suscripción: el servidor envía los recursos al navegador sin que este los pida"
  - id: c
    text:
      es: "Conexión permanente: el navegador y el servidor mantienen un canal cifrado abierto"
  - id: d
    correct: true
    text:
      es: "Petición-respuesta: el navegador pide los recursos y el servidor se los envía si los tiene"
  explanation:
    es: "HTTP sigue un esquema petición-respuesta: el navegador pide los recursos que necesita y el servidor se los envía si dispone de ellos. Invertir los papeles contradice la página: es el navegador quien realiza las peticiones. El servidor solo envía los recursos que el navegador ha pedido. La información enviada por HTTP va en texto claro, no por un canal cifrado."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.8.8. HTTP»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q121
  prompt:
    es: "Señale con qué se identifica cada pieza de información transmitida por HTTP, según el glosario de términos de ciberseguridad de INCIBE:"
  options:
  - id: a
    text:
      es: "Con una dirección IP, que identifica al sistema conectado"
  - id: b
    correct: true
    text:
      es: "Con una URL (Uniform Resource Locator)"
  - id: c
    text:
      es: "Con un certificado X.509 que autentica al servidor"
  - id: d
    text:
      es: "Con una dirección MAC, escrita en el hardware de la red"
  explanation:
    es: "En HTTP, cada pieza de información transmitida se identifica con una URL (Uniform Resource Locator). La dirección MAC identifica a un dispositivo conectado a una red, no a cada pieza de información. La dirección IP identifica a todo sistema conectado a una red, no cada recurso transmitido. El certificado X.509 se usa en SSL para autenticar, no para identificar cada recurso."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.8.8. HTTP»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q122
  prompt:
    es: "Señale lo que implica que HTTP envíe la información en texto claro, según el glosario de términos de ciberseguridad de INCIBE:"
  options:
  - id: a
    text:
      es: "Que solo el servidor de destino puede leer lo que envía el navegador a la página"
  - id: b
    text:
      es: "Que el navegador y el servidor intercambian antes una clave de cifrado"
  - id: c
    correct: true
    text:
      es: "Que cualquiera que intercepte el tráfico puede leer lo enviado y recibido"
  - id: d
    text:
      es: "Que la información se cifra antes de ser enviada por la red"
  explanation:
    es: "HTTP envía la información en texto claro: cualquiera que intercepte el tráfico de red puede leer lo que se envía y se recibe. Que solo el servidor pueda leerla contradice que cualquiera que intercepte el tráfico puede hacerlo. Cifrar la información antes de enviarla es lo que hace HTTPS. Intercambiar antes una clave entre navegador y servidor es lo que se hace en HTTPS para cifrar el tráfico."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.8.8. HTTP»"
  difficulty: 1
  tags:
  - "concepto"
  - "comportamiento"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q123
  prompt:
    es: "¿Cuál de las siguientes razones explica por qué se desarrolló el protocolo HTTPS, según el glosario de términos de ciberseguridad de INCIBE?"
  options:
  - id: a
    text:
      es: "Porque HTTP es un protocolo poco utilizado para la navegación web"
  - id: b
    correct: true
    text:
      es: "Porque HTTP envía en texto claro y lo puede leer quien intercepte el tráfico"
  - id: c
    text:
      es: "Porque HTTP no identifica con una URL cada pieza de información transmitida"
  - id: d
    text:
      es: "Porque HTTP no sigue un esquema de petición y respuesta entre navegador y servidor"
  explanation:
    es: "HTTPS se desarrolló porque HTTP envía en texto claro, de modo que cualquiera que intercepte el tráfico puede leerlo; en HTTPS la información se cifra antes de enviarse. HTTP sí sigue un esquema petición-respuesta, y HTTPS se basa en él. HTTP sí identifica cada pieza de información con una URL. HTTP es el protocolo más utilizado para la navegación web."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.8.8. HTTP»"
  difficulty: 2
  tags:
  - "concepto"
