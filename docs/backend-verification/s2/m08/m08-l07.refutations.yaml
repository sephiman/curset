m08-l07-q11:
  key:
    anchor: kafka-producer-configs#transactional.id
    sentence: If no TransactionalId is provided, then the producer is limited to idempotent delivery.
  wrong:
  - option: It has no delivery guarantee beyond a plain retry, so duplicates are always possible
    anchor: kafka-producer-configs#enable.idempotence
    sentence: Idempotence is enabled by default if no conflicting configurations are set.
  - option: It uses transactions with an id that the broker generates for it
    anchor: kafka-producer-configs#transactional.id
    sentence: By default the TransactionId is not configured, which means transactions cannot be used.
  - option: It cannot enable idempotence, because only transactional producers can
    anchor: kafka-producer-configs#transactional.id
    sentence: If a TransactionalId is configured, enable.idempotence is implied.
m08-l07-q12:
  key:
    anchor: flink-stateful-stream-processing#barriers
    sentence: Barriers never overtake records, they flow strictly in line.
  wrong:
  - option: They overtake records so that the sinks learn about a snapshot first
    anchor: flink-stateful-stream-processing#barriers
    sentence: Barriers never overtake records, they flow strictly in line.
  - option: They pause the flow of the stream while the snapshot is taken
    anchor: flink-stateful-stream-processing#barriers
    sentence: Barriers do not interrupt the flow of the stream and are hence very lightweight.
  - option: They carry the timestamp of the latest record that they follow
    anchor: flink-stateful-stream-processing#barriers
    sentence: Each barrier carries the ID of the snapshot whose records it pushed in front of it.
m08-l07-q13:
  key:
    anchor: flink-stateful-stream-processing#exactly-once-vs-at-least-once
    sentence: On a restore, these records will occur as duplicates, because they are both included in the state snapshot of checkpoint n, and will be replayed as part of the data after checkpoint n.
  wrong:
  - option: Those records are lost, because the snapshot of checkpoint n does not contain them
    anchor: flink-stateful-stream-processing#exactly-once-vs-at-least-once
    sentence: That way, the operator also processes elements that belong to checkpoint n+1 before the state snapshot for checkpoint n was taken.
  - option: A dataflow of only `map`, `flatMap` and `filter` operators loses its exactly once guarantee
    anchor: flink-stateful-stream-processing#exactly-once-vs-at-least-once
    sentence: Because of that, dataflows with only embarrassingly parallel streaming operations (map(), flatMap(), filter(), …) actually give exactly once guarantees even in at least once mode.
  - option: The checkpoint is discarded and the job restarts from scratch
    anchor: flink-stateful-stream-processing#exactly-once-vs-at-least-once
    sentence: Checkpoint snapshots are still drawn as soon as an operator has seen the checkpoint barrier from each input.
m08-l07-q14:
  key:
    anchor: kafka-streams-architecture#fault-tolerance
    sentence: If tasks run on a machine that fails and are restarted on another machine, Kafka Streams guarantees to restore their associated state stores to the content before the failure by replaying the corresponding changelog topics prior to resuming the processing on the newly started tasks.
  wrong:
  - option: By copying the local store files from the failed machine
    anchor: kafka-streams-architecture#fault-tolerance
    sentence: For each state store, it maintains a replicated changelog Kafka topic in which it tracks any state updates.
  - option: By re-reading the whole input topic from its first offset
    anchor: kafka-streams-architecture#fault-tolerance
    sentence: Note that the cost of task (re)initialization typically depends primarily on the time for restoring the state by replaying the state stores’ associated changelog topics.
  - option: By reading a per-task `.checkpoint` file, in Kafka 4.3 and later
    anchor: kafka-streams-memory-mgmt#rocksdb-offset-durability
    sentence: Since 4.3 (KIP-1035), Kafka Streams stores each persistent store’s changelog offset inside RocksDB rather than in a per-task .checkpoint file.
