  explanation:
    es: "La ayuda dice: «El encabezado del informe se imprime antes del encabezado de página». «El encabezado de grupo» se imprime «al inicio de cada grupo de registros nuevo». «El pie del informe» se imprime «al final del informe». El «detalle» aparece «una vez por cada fila del origen de registros». Ninguno se imprime antes del encabezado de página."
