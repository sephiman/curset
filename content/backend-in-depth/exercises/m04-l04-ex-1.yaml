type: quiz
variants:
- id: m04-l04-q01
  prompt:
    en: Which Kotlin compiler plugin generates a zero-argument constructor for classes that carry a registered annotation,
      so that a framework can instantiate them through reflection?
  options:
  - id: a
    correct: true
    text:
      en: '`no-arg`'
  - id: b
    text:
      en: '`all-open`'
  - id: c
    text:
      en: '`kotlin-spring`'
  - id: d
    text:
      en: '`power-assert`'
  explanation:
    en: The `no-arg` plugin generates a zero-argument constructor for classes with a specific annotation. The `all-open`
      plugin does something else, because it makes classes and their members open at compile time. The `kotlin-spring`
      plugin does not generate constructors either, because it makes a class and its members open when they have
      a Spring annotation. The `power-assert` plugin is not a constructor generator, because it provides detailed
      failure messages for assertions.
  citation: kotlin-docs-no-arg-plugin#no-arg-plugin.md
  extract:
    en: The no-arg compiler plugin generates a zero-argument constructor for classes with a specific annotation.
- id: m04-l04-q02
  prompt:
    en: Spring Boot's Kotlin documentation says you are likely to want to configure the `kotlin-spring` plugin.
      Which problem does that plugin solve for Spring-annotated Kotlin classes?
  options:
  - id: a
    correct: true
    text:
      en: Kotlin classes are final by default, so the plugin opens them to let Spring proxy them
  - id: b
    text:
      en: Kotlin classes are open by default, so Spring cannot tell which of them are beans
  - id: c
    text:
      en: Spring beans need a zero-argument constructor, which the plugin generates for them
  - id: d
    text:
      en: Spring beans declared as data classes must be open, and the plugin makes them so
  explanation:
    en: Spring Boot says that, since Kotlin classes are final by default, the plugin automatically opens Spring-annotated
      classes so that they can be proxied. Kotlin classes are not open by default, because classes and their members
      are final by default. The plugin does not generate constructors, because it is a wrapper on top of all-open.
      Data classes cannot be opened by it, because data classes can't be abstract, open, sealed, or inner.
  citation: spring-boot-features-kotlin#features.kotlin.requirements
- id: m04-l04-q03
  prompt:
    en: Among the following declarations on a Kotlin data class, which one is NOT allowed by the Kotlin language
      documentation on data classes?
  options:
  - id: a
    text:
      en: Extending another class
  - id: b
    correct: true
    text:
      en: Declaring the class `open`
  - id: c
    text:
      en: Declaring a primary constructor parameter with `var`
  - id: d
    text:
      en: Writing an explicit `toString()` in the class body
  explanation:
    en: Data classes can't be abstract, open, sealed, or inner, so declaring the class `open` is not allowed. Extending
      another class is allowed, because data classes may extend other classes. A `var` primary constructor parameter
      is allowed, because all primary constructor parameters must be marked as `val` or `var`. An explicit `toString()`
      is allowed, because the existing implementation is then used and none is generated.
  citation: kotlin-docs-data-classes#data-classes.md
  extract:
    en: Data classes can't be abstract, open, sealed, or inner.
- id: m04-l04-q04
  prompt:
    en: In Kotlin, a class declared without the `data` modifier does not override `equals()`. What does `==` compare
      for two such instances that hold identical property values?
  options:
  - id: a
    text:
      en: Structural equality over the properties of the primary constructor
  - id: b
    text:
      en: The order defined by the `Comparable` interface
  - id: c
    text:
      en: 'The result of an `equals(other: Foo)` overload declared in the class'
  - id: d
    correct: true
    text:
      en: Referential equality, inherited from the `Any` class
  explanation:
    en: 'Non-data classes implement the referential equality behavior inherited from the `Any` class. They do not
      compare properties, because they do not override `equals()` by default. They do not use `Comparable`, because
      structural equality has nothing to do with comparison defined by that interface. An `equals(other: Foo)` overload
      is not used, because functions with the same name and other signatures don''t affect `==` and `!=`.'
  citation: kotlin-docs-equality#structural-equality
  extract:
    en: Instead, non-data classes implement referential equality behavior inherited from the Any class.
- id: m04-l04-q05
  prompt:
    en: In the Hibernate User Guide, a transient `Book` is added to a `Set` and the transaction commits. With a
      generated id, `contains` then returns false. Which cause does the guide give?
  options:
  - id: a
    text:
      en: '`equals` and `hashCode` use the natural id, which changes when the entity is flushed'
  - id: b
    text:
      en: Assigned identifiers are always null until the commit, so every id-based `hashCode` fails
  - id: c
    text:
      en: Within one session, each `find` call returns a different instance for the same row
  - id: d
    correct: true
    text:
      en: '`equals` and `hashCode` use the generated id, which is not set until the transaction commits'
  explanation:
    en: The guide says the `equals` and `hashCode` are based on the generated id, which was not set until the Jakarta
      Persistence transaction is committed. A natural id is not the cause, because the entity can be retrieved after
      it is persisted when `equals` and `hashCode` use a natural id. Assigned identifiers are not the cause, because
      with them this is not a problem as long as the value is assigned before adding to the `Set`. Separate instances
      are not the cause, because Hibernate guarantees equivalence of persistent identity and Java identity inside
      a particular session scope.
  citation: hibernate-user-guide#mapping-model-pojo-equalshashcode
- id: m04-l04-q06
  prompt:
    en: In the Hibernate User Guide's list of static fetching strategies, which one is the strategy generally termed
      N+1, a separate SQL select that is either EAGER or LAZY?
  options:
  - id: a
    correct: true
    text:
      en: '`SELECT`'
  - id: b
    text:
      en: '`JOIN`'
  - id: c
    text:
      en: '`BATCH`'
  - id: d
    text:
      en: '`SUBSELECT`'
  explanation:
    en: '`SELECT` is the strategy generally termed N+1. `JOIN` is not, because it is inherently an eager style of
      fetching that uses an SQL outer join. `BATCH` is not, because it loads a number of related data items using
      an `IN` restriction based on a batch size. `SUBSELECT` is not, because it loads associated data based on the
      SQL restriction used to load the owner.'
  citation: hibernate-user-guide#fetching-basics
- id: m04-l04-q07
  prompt:
    en: 'In a Spring Data Coroutines repository, a method is declared as `fun getUser(): User`, with no `suspend`
      modifier. What does the documentation say it does?'
  options:
  - id: a
    text:
      en: It retrieves a stream of data that is fetched when `Flow.collect` is called
  - id: b
    text:
      en: It retrieves the data once and synchronously by suspending the caller
  - id: c
    correct: true
    text:
      en: It retrieves data once, blocking the thread and without context propagation
  - id: d
    text:
      en: It keeps the coroutine context available, because it returns a plain value
  explanation:
    en: 'The documentation says `fun getUser(): User` retrieves data once, blocking the thread and without context
      propagation. It does not return a stream, because a stream of data is what a method returning `Flow<User>`
      retrieves. It does not suspend, because retrieving the data once by suspending is what a `suspend` method
      does. It does not keep the context, because that needs a `suspend` declaration or a return type such as `Flow`.'
  citation: spring-data-commons-kotlin-coroutines#kotlin.coroutines.repositories
- id: m04-l04-q09
  prompt:
    en: Spring Framework's documentation compares Kotlin `Flow` with the reactive `Flux`. Which statement about
      the two is correct?
  options:
  - id: a
    text:
      en: '`Flow` has several collect methods, while `Flux` has a single one'
  - id: b
    text:
      en: '`Flow` suits only finite streams, while `Flux` also handles infinite ones'
  - id: c
    correct: true
    text:
      en: '`Flow` is push-based, while `Flux` is a push-pull hybrid'
  - id: d
    text:
      en: '`Flow` implements backpressure through subscription requests, while `Flux` suspends'
  explanation:
    en: '`Flow` is push-based while `Flux` is a push-pull hybrid. `Flow` does not have several collect methods,
      because it has only a single suspending collect method. `Flow` suits finite and infinite streams alike, because
      it is suitable for hot or cold, finite or infinite streams. `Flow` does not use subscription requests, because
      backpressure is implemented via suspending functions.'
  citation: spring-fw-kotlin-coroutines#how-reactive-translates-to-coroutines
  extract:
    en: Flow is push-based while Flux is push-pull hybrid
- id: m04-l04-q10
  prompt:
    en: Which `TestCoroutineScheduler` operation runs the tasks that are scheduled to run as soon as possible but
      haven't yet been dispatched, as part of kotlinx-coroutines-test?
  options:
  - id: a
    text:
      en: '`advanceTimeBy`'
  - id: b
    correct: true
    text:
      en: '`runCurrent`'
  - id: c
    text:
      en: '`advanceUntilIdle`'
  - id: d
    text:
      en: '`TestScope.testScheduler`'
  explanation:
    en: The scheduler runs the tasks scheduled to run as soon as possible but not yet dispatched via `runCurrent`.
      `advanceTimeBy` is a different operation, because it advances the time. `advanceUntilIdle` is a different
      operation, because it runs all the scheduled tasks and advances the virtual time as needed. `TestScope.testScheduler`
      is not an operation that runs tasks, because it is how the scheduler is accessed.
  citation: coroutines-api-test-scheduler#content
  extract:
    en: The scheduler can be queried to advance the time (via advanceTimeBy), run all the scheduled tasks advancing
      the virtual time as needed (via advanceUntilIdle), or run the tasks that are scheduled to run as soon as possible
      but haven't yet been dispatched (via runCurrent).
