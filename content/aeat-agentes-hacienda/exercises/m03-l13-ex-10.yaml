    es: "Conforme al artículo 210.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la propuesta de resolución del procedimiento sancionador:"
  options:
  - id: a
    text:
      es: "Se formula al inicio del procedimiento en todo caso, antes de que concluyan las actuaciones."
  - id: b
    text:
      es: "Concreta la sanción propuesta, pero no incluye los criterios de graduación, que solo figuran en la resolución."
  - id: c
