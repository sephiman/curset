# anchor: fuente-oecd-recomendacion-gobierno-abierto-2017-pdf
- id: m01-l06-q001
  prompt:
    es: "¿En qué fecha adoptó el Consejo de la Organización para la Cooperación y el Desarrollo Económicos (OCDE) su Recomendación sobre Gobierno Abierto?"
  options:
  - id: a
    text:
      es: "El 9 de diciembre de 2013."
  - id: b
    text:
      es: "El 25 de septiembre de 2015."
  - id: c
    correct: true
    text:
      es: "El 14 de diciembre de 2017."
  - id: d
    text:
      es: "El 29 de octubre de 2020."
  explanation:
    es: "El Consejo de la OCDE adoptó la Recomendación el 14 de diciembre de 2017. El 9 de diciembre de 2013 es la fecha de la Ley 19/2013. El 25 de septiembre de 2015 la Asamblea General de las Naciones Unidas aprobó la Agenda 2030. El 29 de octubre de 2020 el pleno del Foro de Gobierno Abierto aprobó el IV Plan."
  citation: "fuente: `oecd-recomendacion-gobierno-abierto-2017.pdf`"
  difficulty: 2
  tags:
  - "fecha"
# anchor: fuente-transparencia-gobierno-abierto-que-es-html
- id: m01-l06-q050
  prompt:
    es: "Señale la respuesta correcta sobre el Gobierno Abierto, según la definición de la Recomendación del Consejo de la OCDE, de 14 de diciembre de 2017, que recoge el Portal de la Transparencia:"
  options:
  - id: a
    text:
      es: "Es un modelo de gestión que promueve sus principios en apoyo de la eficacia y el crecimiento económico."
  - id: b
    text:
      es: "Es una cultura de gobernanza que promueve sus principios en apoyo del Estado de derecho y la cohesión territorial."
  - id: c
    text:
      es: "Es un conjunto de normas que regula sus principios en apoyo de la democracia y la seguridad jurídica."
  - id: d
    correct: true
    text:
      es: "Es una cultura de gobernanza que promueve sus principios en apoyo de la democracia y el crecimiento inclusivo."
  explanation:
    es: "La definición dice que el Gobierno Abierto es una cultura de gobernanza que promueve sus principios en apoyo de la democracia y el crecimiento inclusivo. La opción de la eficacia y el crecimiento económico cambia el fin y el tipo de crecimiento. La del Estado de derecho y la cohesión territorial cambia los dos fines. La del conjunto de normas cambia la naturaleza, porque no es una norma sino una cultura, y sustituye el crecimiento inclusivo por la seguridad jurídica."
  citation: "fuente: `transparencia-gobierno-abierto-que-es.html`"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-transparencia-gobierno-abierto-que-es-html
- id: m01-l06-q051
  prompt:
    es: "¿Cuál de las siguientes opciones completa la definición del Gobierno Abierto como una «cultura de…», según la Recomendación del Consejo de la OCDE, de 14 de diciembre de 2017, que recoge el Portal de la Transparencia?"
  options:
  - id: a
    text:
      es: "Gestión pública."
  - id: b
    correct: true
    text:
      es: "Gobernanza."
  - id: c
    text:
      es: "Servicio público."
  - id: d
    text:
      es: "Control democrático."
  explanation:
    es: "El Portal define el Gobierno Abierto como «una cultura de gobernanza». La gestión pública, el servicio público y el control democrático son conceptos del ámbito administrativo, pero ninguno es el que la definición da como núcleo."
  citation: "fuente: `transparencia-gobierno-abierto-que-es.html`"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-oecd-recomendacion-gobierno-abierto-2017-pdf
- id: m01-l06-q002
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge los principios de Gobierno Abierto que nombra la Recomendación del Consejo de la OCDE sobre Gobierno Abierto, de 14 de diciembre de 2017?"
  options:
  - id: a
    correct: true
    text:
      es: "Transparencia, integridad, rendición de cuentas y participación de las partes interesadas."
  - id: b
    text:
      es: "Transparencia, colaboración, participación ciudadana y rendición de cuentas."
  - id: c
    text:
      es: "Publicidad activa, derecho de acceso, buen gobierno e integridad pública."
  - id: d
    text:
      es: "Transparencia, integridad, eficacia y participación de las partes interesadas."
  explanation:
    es: "La Recomendación nombra cuatro principios: transparencia, integridad, rendición de cuentas y participación de las partes interesadas. Una opción cambia la integridad por la colaboración. Otra mezcla el contenido de la Ley 19/2013 (publicidad activa, acceso y buen gobierno). Otra pone la eficacia en lugar de la rendición de cuentas."
  citation: "fuente: `oecd-recomendacion-gobierno-abierto-2017.pdf`"
  difficulty: 1
  tags:
  - "concepto"
