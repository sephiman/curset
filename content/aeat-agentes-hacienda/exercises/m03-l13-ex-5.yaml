    es: "De acuerdo con el artículo 188.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en los supuestos de conformidad, el importe de la reducción practicada se exige sin más requisito que la notificación al interesado cuando se haya interpuesto recurso o reclamación contra:"
  options:
