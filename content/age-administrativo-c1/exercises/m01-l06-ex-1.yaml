    text:
      es: "Cuatro principios de Gobierno Abierto."
  - id: c
    text:
      es: "Cinco principios de Gobierno Abierto."
  - id: d
    text:
      es: "Diez principios de Gobierno Abierto."
  explanation:
    es: "La Recomendación nombra cuatro: transparencia, integridad, rendición de cuentas y participación de las partes interesadas. No enumera tres, cinco ni diez."
  citation: "fuente: `oecd-recomendacion-gobierno-abierto-2017.pdf`"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2013-12887-art-1
- id: m01-l06-q010
  prompt:
    es: "De acuerdo con el artículo 1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, esta Ley tiene por objeto, entre otros fines:"
  options:
  - id: a
    text:
      es: "Regular la participación de los ciudadanos en la elaboración de normas con rango de ley."
  - id: b
    text:
      es: "Establecer los principios generales de actuación de las Administraciones Públicas."
  - id: c
    correct: true
    text:
      es: "Ampliar y reforzar la transparencia de la actividad pública."
  - id: d
    text:
      es: "Fijar las bases del régimen estatutario de los empleados públicos."
  explanation:
    es: "El artículo 1 fija tres objetos: ampliar y reforzar la transparencia de la actividad pública, regular y garantizar el derecho de acceso a la información y establecer las obligaciones de buen gobierno. La participación en la elaboración de normas está en el artículo 133 de la Ley 39/2015. Los principios generales de actuación están en el artículo 3 de la Ley 40/2015. Las bases del régimen estatutario de los empleados públicos no son objeto de la Ley 19/2013."
  citation: "art. 1 Ley 19/2013"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-3
- id: m01-l06-q011
  prompt:
    es: "De acuerdo con el artículo 3.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las Administraciones Públicas deberán respetar en su actuación y relaciones el principio de:"
  options:
  - id: a
    text:
      es: "Participación, objetividad y publicidad de la actuación administrativa."
  - id: b
    text:
      es: "Participación, imparcialidad y transparencia de la actividad normativa."
  - id: c
    text:
      es: "Colaboración, objetividad y transparencia de la actuación administrativa."
  - id: d
    correct: true
    text:
      es: "Participación, objetividad y transparencia de la actuación administrativa."
  explanation:
    es: "La letra c) del artículo 3.1 dice «participación, objetividad y transparencia de la actuación administrativa». Una opción cambia la transparencia por la publicidad. Otra cambia la objetividad por la imparcialidad y la actuación administrativa por la actividad normativa. Otra cambia la participación por la colaboración."
  citation: "art. 3.1.c LRJSP"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q012
  prompt:
    es: "De acuerdo con el artículo 133.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la consulta pública previa a la elaboración de una ley o un reglamento se sustanciará:"
  options:
  - id: a
    text:
      es: "A través del Boletín Oficial del Estado y del diario oficial autonómico."
  - id: b
    correct: true
    text:
      es: "A través del portal web de la Administración competente."
  - id: c
    text:
      es: "A través del registro electrónico general de la Administración competente."
  - id: d
    text:
      es: "A través del Tablón Edictal Único del Boletín Oficial del Estado."
  explanation:
    es: "El artículo 133.1 dice que la consulta pública se sustancia «a través del portal web de la Administración competente». No prevé hacerla en los diarios oficiales, en el registro electrónico ni en el Tablón Edictal Único."
  citation: "art. 133.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q013
  prompt:
    es: "¿Cuál de las siguientes cuestiones somete la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas a la consulta pública previa a la elaboración de una norma?"
  options:
  - id: a
    correct: true
    text:
      es: "La necesidad y oportunidad de su aprobación."
  - id: b
    text:
      es: "La adecuación de la norma al orden constitucional de distribución de competencias."
  - id: c
    text:
      es: "El impacto económico y presupuestario de la norma para la Administración competente."
  - id: d
    text:
      es: "El impacto de la norma por razón de género."
  explanation:
    es: "El artículo 133.1 recaba la opinión sobre cuatro cuestiones: los problemas que se pretenden solucionar, la necesidad y oportunidad de la aprobación, los objetivos de la norma y las soluciones alternativas regulatorias y no regulatorias. La adecuación al orden de competencias, el impacto presupuestario y el impacto de género no figuran en esa lista."
  citation: "art. 133.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q014
  prompt:
    es: "De acuerdo con el artículo 133.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando la norma afecte a derechos e intereses legítimos, publicará el texto en el portal web:"
  options:
  - id: a
    correct: true
    text:
      es: "El centro directivo que resulte competente."
  - id: b
    text:
      es: "El titular del departamento ministerial que proponga la norma."
  - id: c
    text:
      es: "La Secretaría General Técnica del ministerio proponente."
  - id: d
    text:
      es: "La Comisión General de Secretarios de Estado y Subsecretarios."
  explanation:
    es: "El artículo 133.2 encarga la publicación al «centro directivo competente». No la atribuye al ministro, a la Secretaría General Técnica ni a la Comisión General de Secretarios de Estado y Subsecretarios."
  citation: "art. 133.2 LPAC"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q015
  prompt:
    es: "De acuerdo con el artículo 133.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la publicación del texto de la norma en el portal web tiene por objeto:"
  options:
  - id: a
    correct: true
    text:
      es: "Dar audiencia a los ciudadanos afectados y recabar aportaciones adicionales de otras personas o entidades."
  - id: b
    text:
      es: "Recabar la opinión de los afectados sobre los problemas que la iniciativa pretende solucionar."
  - id: c
    text:
      es: "Dar audiencia a las organizaciones reconocidas por ley y recabar el dictamen del Consejo de Estado."
  - id: d
    text:
      es: "Dar audiencia a los ciudadanos afectados y recabar el informe de la Secretaría General Técnica."
  explanation:
    es: "El texto se publica «con el objeto de dar audiencia a los ciudadanos afectados y recabar cuantas aportaciones adicionales puedan hacerse por otras personas o entidades». Recabar la opinión sobre los problemas que se pretenden solucionar es la consulta pública del artículo 133.1. El artículo 133.2 no menciona el dictamen del Consejo de Estado ni el informe de la Secretaría General Técnica."
  citation: "art. 133.2 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q016
  prompt:
    es: "Señale la respuesta correcta sobre la participación de los ciudadanos en la elaboración de leyes y reglamentos según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "La audiencia precede a la redacción del texto y la consulta pública se hace sobre el texto ya redactado."
  - id: b
    text:
      es: "La consulta pública solo procede cuando la norma afecte a los derechos e intereses legítimos de las personas."
  - id: c
    correct: true
    text:
      es: "La consulta pública precede a la redacción del texto y la audiencia se hace sobre el texto ya redactado."
  - id: d
    text:
      es: "La audiencia y la información pública solo proceden en las normas presupuestarias u organizativas."
  explanation:
    es: "El artículo 133.2 ordena publicar el texto para audiencia e información pública «sin perjuicio de la consulta previa a la redacción del texto de la iniciativa»: primero la consulta, luego el texto. La opción que pone la audiencia antes de la redacción invierte el orden. Afectar a derechos e intereses legítimos es la condición de la audiencia, no de la consulta. En las normas presupuestarias u organizativas se puede prescindir de los trámites; no son el único caso en que proceden."
  citation: "art. 133.2 LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q017
  prompt:
    es: "De acuerdo con el artículo 133.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los documentos que se pongan a disposición en la consulta, audiencia e información públicas serán:"
  options:
  - id: a
    text:
      es: "Claros, completos y redactados también en las lenguas cooficiales de cada Comunidad Autónoma."
  - id: b
    text:
      es: "Claros, concisos y acompañados en todo caso de la memoria del análisis de impacto normativo."
  - id: c
    text:
      es: "Breves, sencillos y acompañados de un resumen de la norma en lenguaje accesible."
  - id: d
    correct: true
    text:
      es: "Claros, concisos y reunir toda la información precisa para poder pronunciarse sobre la materia."
  explanation:
    es: "El artículo 133.3 exige documentos «claros, concisos y reunir toda la información precisa para poder pronunciarse sobre la materia». No exige su traducción a las lenguas cooficiales, ni acompañar la memoria del análisis de impacto normativo, ni un resumen en lenguaje accesible."
  citation: "art. 133.3 LPAC"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q018
  prompt:
    es: "De acuerdo con el artículo 133.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, podrá prescindirse de los trámites de consulta, audiencia e información públicas en el caso de:"
  options:
  - id: a
    text:
      es: "Normas tributarias o sancionadoras de cualquiera de las Administraciones Públicas."
  - id: b
    correct: true
    text:
      es: "Normas presupuestarias u organizativas de las Administraciones Públicas."
  - id: c
    text:
      es: "Normas que regulen aspectos parciales de una materia."
  - id: d
    text:
      es: "Normas que no impongan obligaciones relevantes a sus destinatarios."
  explanation:
    es: "El artículo 133.4 permite prescindir de los tres trámites en las normas presupuestarias u organizativas de la Administración General del Estado, la autonómica, la local o sus organizaciones dependientes o vinculadas, y cuando concurran razones graves de interés público. Las normas tributarias o sancionadoras no figuran. Regular aspectos parciales de una materia o no imponer obligaciones relevantes permite omitir solo la consulta pública, no la audiencia ni la información públicas."
  citation: "art. 133.4 LPAC"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q019
  prompt:
    es: "Según el artículo 133.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo puede prescindirse de la consulta, audiencia e información públicas, además de en las normas presupuestarias u organizativas?"
  options:
  - id: a
    text:
      es: "Cuando la norma no tenga un impacto significativo en la actividad económica."
  - id: b
    text:
      es: "Cuando la norma regule aspectos parciales de una materia."
  - id: c
    text:
      es: "Cuando así lo acuerde el centro directivo competente por razones de urgencia."
  - id: d
    correct: true
    text:
      es: "Cuando concurran razones graves de interés público que lo justifiquen."
  explanation:
    es: "El primer párrafo del artículo 133.4 añade a las normas presupuestarias u organizativas el caso en que «concurran razones graves de interés público que lo justifiquen». La falta de impacto significativo en la actividad económica y la regulación de aspectos parciales de una materia solo permiten omitir la consulta pública. El artículo no deja la decisión al centro directivo por razones de urgencia; la tramitación urgente se rige por la normativa de cada Administración."
  citation: "art. 133.4 LPAC"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q020
  prompt:
    es: "De acuerdo con el artículo 133.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, podrá omitirse la consulta pública cuando la propuesta normativa:"
  options:
  - id: a
    text:
      es: "Afecte a los derechos e intereses legítimos de las personas."
  - id: b
    text:
