# anchor: boe-a-2015-11719-art-7
- id: m04-l08-q001
  prompt:
    es: "Según el artículo 7 del texto refundido de la Ley del Estatuto Básico del Empleado Público, además de por la legislación laboral y las normas convencionalmente aplicables, ¿por qué se rige el personal laboral de las Administraciones públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Por los preceptos de este Estatuto que así lo dispongan."
  - id: b
    text:
      es: "Por todos los preceptos de este Estatuto, salvo los de régimen disciplinario."
  - id: c
    text:
      es: "Por los preceptos de este Estatuto solo cuando lo prevea su convenio colectivo."
  - id: d
    text:
      es: "Por los preceptos de este Estatuto, con carácter exclusivamente supletorio."
  explanation:
    es: "El artículo 7 dice que ese personal se rige también «por los preceptos de este Estatuto que así lo dispongan». No se le aplica todo el Estatuto salvo una materia, y la opción que excluye el régimen disciplinario choca además con el artículo 93.1, que sujeta al personal laboral a ese título. El Estatuto no condiciona su aplicación a lo que diga el convenio colectivo. Tampoco es solo supletorio: el carácter supletorio del artículo 2.5 es para el personal no incluido en su ámbito, y el laboral sí lo está."
  citation: "art. 7 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-7
- id: m04-l08-q002
  prompt:
    es: "Según el artículo 7 del texto refundido de la Ley del Estatuto Básico del Empleado Público, en materia de permisos de nacimiento, adopción, lactancia y parental, ¿qué previsiones del Estatuto de los Trabajadores dejan de aplicarse al personal laboral?"
  options:
  - id: a
    text:
      es: "Las excedencias por cuidado de familiares que corresponderían por los mismos supuestos de hecho."
  - id: b
    correct: true
    text:
      es: "Las suspensiones de los contratos de trabajo que corresponderían por los mismos supuestos de hecho."
  - id: c
    text:
      es: "Las reducciones de jornada que corresponderían por los mismos supuestos de hecho."
  - id: d
    text:
      es: "Las extinciones de los contratos de trabajo que corresponderían por los mismos supuestos de hecho."
  explanation:
    es: "En esas materias el personal laboral se rige por el Estatuto Básico, «no siendo de aplicación a este personal, por tanto, las previsiones del texto refundido de la Ley del Estatuto de los Trabajadores sobre las suspensiones de los contratos de trabajo». El artículo 7 no desplaza las excedencias, las reducciones de jornada ni las extinciones del contrato: solo nombra las suspensiones."
  citation: "art. 7 TREBEP"
  difficulty: 3
  tags:
  - "excepción"
  - "efecto"
# anchor: boe-a-2015-11719-art-2
- id: m04-l08-q003
  prompt:
    es: "Según el artículo 2.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cómo se aplica este Estatuto al personal laboral al servicio de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Se aplica íntegramente, en los mismos términos que al personal funcionario."
  - id: b
    text:
      es: "Se aplica solo cuando el convenio colectivo se remita a él de forma expresa."
  - id: c
    correct: true
    text:
      es: "Se aplica a ese personal en lo que proceda."
  - id: d
    text:
      es: "No se aplica, porque ese personal se rige solo por la legislación laboral."
  explanation:
    es: "El artículo 2.1 dice que el Estatuto «se aplica al personal funcionario y en lo que proceda al personal laboral» de la Administración General del Estado, entre otras. No se aplica en los mismos términos que a los funcionarios. Tampoco depende de una remisión del convenio colectivo. Y el personal laboral no se rige solo por la legislación laboral: el artículo 7 le aplica los preceptos del Estatuto que así lo dispongan."
  citation: "art. 2.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-51
- id: m04-l08-q004
  prompt:
    es: "Conforme al artículo 51 del texto refundido de la Ley del Estatuto Básico del Empleado Público, para el régimen de jornada de trabajo, permisos y vacaciones del personal laboral se estará a lo establecido:"
  options:
  - id: a
    text:
      es: "Exclusivamente en la legislación laboral y en los convenios colectivos que resulten aplicables."
  - id: b
    text:
      es: "Exclusivamente en el capítulo del Estatuto sobre jornada, permisos y vacaciones de los funcionarios."
  - id: c
    text:
      es: "En el convenio colectivo y, en su defecto, en las instrucciones que dicte cada Departamento."
  - id: d
    correct: true
    text:
      es: "En el capítulo del Estatuto sobre jornada, permisos y vacaciones y en la legislación laboral."
  explanation:
    es: "El artículo 51 remite a dos fuentes: «a lo establecido en este capítulo y en la legislación laboral correspondiente». El capítulo es el V del título III, sobre jornada, permisos y vacaciones. Las dos opciones con «exclusivamente» dejan fuera una de esas fuentes. La que pone primero el convenio y luego las instrucciones de cada Departamento no recoge ninguna de las dos."
  citation: "art. 51 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-61
- id: m04-l08-q005
  prompt:
    es: "Según el artículo 61 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué sistema selectivo del personal laboral fijo solo puede aplicarse a los funcionarios de carrera en virtud de ley y con carácter excepcional?"
  options:
  - id: a
    text:
      es: "La oposición, con pruebas de capacidad y orden de prelación."
  - id: b
    correct: true
    text:
      es: "El concurso, que consiste únicamente en la valoración de méritos."
  - id: c
    text:
      es: "El concurso-oposición, con pruebas de capacidad previas a los méritos."
  - id: d
    text:
      es: "La libre designación, por apreciación de la idoneidad del aspirante."
  explanation:
    es: "El artículo 61.7 fija para el personal laboral fijo «oposición, concurso-oposición, con las características establecidas en el apartado anterior, o concurso de valoración de méritos». Para los funcionarios, el 61.6 dice: «Sólo en virtud de ley podrá aplicarse, con carácter excepcional, el sistema de concurso que consistirá únicamente en la valoración de méritos». La oposición y el concurso-oposición son los sistemas ordinarios de los funcionarios, sin ley que los habilite. La libre designación no es un sistema selectivo del artículo 61."
  citation: "art. 61.7 TREBEP"
  difficulty: 3
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2015-11719-art-61
- id: m04-l08-q006
  prompt:
    es: "De acuerdo con los apartados 6 y 7 del artículo 61 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la oposición y el concurso-oposición del personal laboral fijo deben incluir, en todo caso:"
  options:
  - id: a
    correct: true
    text:
      es: "Una o varias pruebas para determinar la capacidad de los aspirantes y establecer el orden de prelación."
  - id: b
    text:
      es: "Una fase de concurso en la que se valore la experiencia previa en la Administración convocante."
  - id: c
    text:
      es: "Una entrevista personal que determine por sí misma el orden de prelación de los aspirantes."
  - id: d
    text:
      es: "Un curso selectivo o un periodo de prácticas antes de la formalización del contrato."
  explanation:
    es: "El artículo 61.7 aplica a la oposición y al concurso-oposición del personal laboral fijo «las características establecidas en el apartado anterior», y el 61.6 exige que incluyan «en todo caso, una o varias pruebas para determinar la capacidad de los aspirantes y establecer el orden de prelación». La fase de concurso no es obligatoria en la oposición. La entrevista y los cursos o prácticas son complementos que las pruebas «podrán» tener (art. 61.5), no exigencias. Y el 61.3 impide que una valoración determine por sí misma el resultado."
  citation: "art. 61.6 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2015-11719-art-11
- id: m04-l08-q007
  prompt:
    es: "Según el artículo 11.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, además de por los de igualdad, mérito y capacidad, ¿por qué principio se rige igualmente la selección del personal laboral temporal?"
  options:
  - id: a
    text:
      es: "Por el principio de especialidad."
  - id: b
    text:
      es: "Por el principio de inmediatez."
  - id: c
    text:
      es: "Por el principio de proximidad."
  - id: d
    correct: true
    text:
      es: "Por el principio de celeridad."
  explanation:
    es: "El artículo 11.3 dice que la selección del personal laboral temporal «se regirá igualmente por el principio de celeridad». La especialidad es un principio de los órganos de selección (art. 31.2 del Convenio único), no de la selección del temporal. La inmediatez y la proximidad no aparecen en el artículo."
  citation: "art. 11.3 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-11
- id: m04-l08-q008
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la selección del personal laboral es correcta según el artículo 11.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "La del personal laboral fijo se rige por el principio de celeridad y atiende razones de necesidad y urgencia."
  - id: b
    text:
      es: "La del personal laboral temporal puede apartarse del principio de mérito cuando concurran razones de urgencia."
  - id: c
    correct: true
    text:
      es: "La del personal laboral temporal tiene por finalidad atender razones expresamente justificadas de necesidad y urgencia."
  - id: d
    text:
      es: "La del personal laboral temporal se hace por procedimientos restringidos, sin necesidad de que sean públicos."
  explanation:
    es: "El artículo 11.3 dice que la selección del personal laboral temporal tiene «por finalidad atender razones expresamente justificadas de necesidad y urgencia». La celeridad y la necesidad y urgencia son del temporal, no del fijo. Los procedimientos son públicos y se rigen «en todo caso» por igualdad, mérito y capacidad, también los del temporal."
  citation: "art. 11.3 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2019-7414-dt-tercera
- id: m04-l08-q011
  prompt:
    es: "En el IV Convenio colectivo único para el personal laboral de la Administración General del Estado, las previsiones sobre ingreso, promoción, provisión de puestos y movilidad resultan de aplicación:"
  options:
  - id: a
    text:
      es: "Desde el día siguiente al de la publicación del Convenio en el «Boletín Oficial del Estado»."
  - id: b
    correct: true
    text:
      es: "Cuando se haga efectivo el nuevo encuadramiento, previa adecuación de las relaciones de puestos de trabajo."
  - id: c
    text:
      es: "Desde el 1 de enero de 2019, fecha en que empiezan a regir los efectos económicos del Convenio."
  - id: d
    text:
      es: "Cuando la Comisión Negociadora apruebe la clasificación profesional de cada colectivo afectado."
  explanation:
    es: "La disposición transitoria tercera aplica esas previsiones «cuando se haga efectivo el nuevo encuadramiento del personal laboral del ámbito del presente Convenio, previa adecuación de las correspondientes relaciones de puestos de trabajo». La entrada en vigor al día siguiente de la publicación y los efectos económicos desde el 1 de enero de 2019 son reglas generales del artículo 3.1, que esta disposición exceptúa. La Comisión Negociadora aprueba modificaciones de clasificación de colectivos (art. 11), no la aplicación de esas previsiones."
  citation: "disposición transitoria tercera Convenio único"
  difficulty: 3
  tags:
  - "efecto"
  - "fecha"
# anchor: boe-a-2019-7414-art-29
- id: m04-l08-q012
  prompt:
    es: "¿Por qué principios se rigen, de acuerdo con la legislación vigente, los sistemas selectivos del IV Convenio colectivo único para el personal laboral de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Igualdad, mérito, capacidad y celeridad."
  - id: b
    text:
      es: "Igualdad, mérito, capacidad y especialidad."
  - id: c
    text:
      es: "Igualdad, mérito, capacidad y antigüedad."
  - id: d
    correct: true
    text:
      es: "Igualdad, mérito, capacidad y publicidad."
  explanation:
    es: "El artículo 29 dice que los sistemas selectivos «se regirán por los principios de igualdad, mérito, capacidad y publicidad». La celeridad es el principio que el artículo 11.3 del Estatuto Básico añade para el personal laboral temporal. La especialidad es un principio de los órganos de selección (art. 31.2). La antigüedad se valora en el concurso (art. 29.a), pero no es un principio de los sistemas selectivos."
  citation: "art. 29 Convenio único"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2019-7414-art-31
- id: m04-l08-q013
  prompt:
    es: "Un Departamento convoca un proceso selectivo en el ámbito del IV Convenio colectivo único para el personal laboral de la Administración General del Estado. ¿Cuántos miembros tendrá, como mínimo, el órgano de selección?"
  options:
  - id: a
    text:
      es: "Cinco: tres de la Administración y dos de los trabajadores y trabajadoras."
  - id: b
    correct: true
    text:
      es: "Siete: cuatro de la Administración y tres de los trabajadores y trabajadoras."
  - id: c
    text:
      es: "Ocho: cuatro de la Administración y cuatro de los trabajadores y trabajadoras."
  - id: d
    text:
      es: "Nueve: cinco de la Administración y cuatro de los trabajadores y trabajadoras."
  explanation:
    es: "El artículo 31.1 fija un mínimo de «cuatro representantes de la Administración» y «tres de los trabajadores y trabajadoras». Cuatro más tres son siete. Cinco se queda por debajo de los dos mínimos. Ocho y nueve superan el mínimo, que es siete."
  citation: "art. 31.1 Convenio único"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-2019-7414-art-31
- id: m04-l08-q014
  prompt:
    es: "Si una convocatoria del IV Convenio colectivo único para el personal laboral de la Administración General del Estado afecta a dos o más Departamentos, ¿a propuesta de quién se designa a la representación del personal laboral?"
  options:
  - id: a
    text:
      es: "De los sindicatos presentes en la Subcomisión Paritaria del Departamento convocante."
  - id: b
    text:
      es: "Del comité de empresa del centro de trabajo con más plazas convocadas."
  - id: c
    text:
      es: "De la Comisión Negociadora del Convenio, por mayoría de cada parte."
  - id: d
    correct: true
    text:
      es: "De las organizaciones sindicales presentes en la Comisión Paritaria."
  explanation:
    es: "Si la convocatoria afecta a todo el ámbito del Convenio o a dos o más Departamentos, la representación del personal laboral «será designada por la Administración a propuesta de las Organizaciones sindicales presentes en la Comisión Paritaria». Los sindicatos de la Subcomisión Paritaria proponen solo cuando la convocatoria afecta al ámbito de una Subcomisión. El comité de empresa y la Comisión Negociadora no proponen a esos miembros."
  citation: "art. 31.1 Convenio único"
  difficulty: 3
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2019-7414-art-31
- id: m04-l08-q015
  prompt:
    es: "Conforme al artículo 31.1 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, los miembros del órgano de selección designados a propuesta de los sindicatos actúan:"
  options:
  - id: a
    correct: true
    text:
      es: "A título individual en el órgano de selección."
  - id: b
    text:
      es: "Con voz pero sin voto en las decisiones del órgano."
  - id: c
    text:
      es: "En representación del comité de empresa de su ámbito."
  - id: d
    text:
      es: "Por delegación de la Comisión Paritaria que los propuso."
  explanation:
    es: "El artículo 31.1 dice de ellos: «Estos miembros actuarán a título individual en el órgano de selección». Tener voz pero no voto es la posición de los especialistas que el órgano puede recabar (art. 31.2), no la de sus miembros. No actúan en representación del comité de empresa. La Comisión Paritaria no los propone: lo hacen las organizaciones sindicales presentes en ella."
  citation: "art. 31.1 Convenio único"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-2019-7414-art-31
- id: m04-l08-q016
  prompt:
    es: "De acuerdo con el artículo 31.3 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, el personal funcionario que forme parte de un órgano de selección debe pertenecer:"
  options:
  - id: a
    text:
      es: "A cualquier grupo de titulación, al no estar sujeto al Convenio."
  - id: b
    correct: true
    text:
      es: "Al grupo de titulación equivalente igual o superior al del puesto convocado."
  - id: c
    text:
      es: "Al grupo de titulación inmediatamente superior al del puesto convocado."
  - id: d
    text:
      es: "Al mismo grupo de titulación que el puesto convocado, ni superior ni inferior."
  explanation:
    es: "El artículo 31.3 dice que el personal funcionario «deberá pertenecer al grupo de titulación equivalente igual o superior». La opción de cualquier grupo ignora ese requisito. La del grupo inmediatamente superior excluye el igual, y la del mismo grupo excluye los superiores; el artículo admite los dos."
  citation: "art. 31.3 Convenio único"
  difficulty: 2
  tags:
  - "requisito"
  - "composición"
# anchor: boe-a-2019-7414-art-31
- id: m04-l08-q017
  prompt:
    es: "¿Puede formar parte del órgano de selección para un puesto del grupo profesional M1 una trabajadora fija del grupo E2, según el IV Convenio colectivo único para el personal laboral de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Sí, siempre que cuente con dos años de servicios efectivos en su grupo profesional."
  - id: b
    text:
      es: "Sí, siempre que la Administración la designe a propuesta de los sindicatos."
  - id: c
    text:
      es: "No, porque los miembros deben pertenecer en todo caso al grupo profesional M3."
  - id: d
    correct: true
    text:
      es: "No, porque debe pertenecer a un grupo profesional igual o superior al del puesto."
  explanation:
    es: "El artículo 31.3 exige que todos los miembros pertenezcan «a un grupo profesional igual o superior al del puesto de trabajo convocado». E2 está por debajo de M1 en la escala del artículo 8.1, así que no puede. Los dos años de servicios son un requisito de la promoción interna (art. 28.2), no del órgano de selección. La designación a propuesta sindical no dispensa del requisito de grupo. El artículo no exige el grupo M3."
  citation: "art. 31.3 Convenio único"
  difficulty: 1
  tags:
  - "requisito"
  - "composición"
# anchor: boe-a-2019-7414-art-31
- id: m04-l08-q018
  prompt:
    es: "Señale la respuesta correcta sobre el personal laboral temporal y los órganos de selección del IV Convenio colectivo único para el personal laboral de la Administración General del Estado:"
  options:
  - id: a
    text:
      es: "El personal laboral temporal puede formar parte del órgano solo como especialista con voz y sin voto."
  - id: b
    correct: true
    text:
      es: "El personal laboral temporal no puede formar parte de los órganos de selección."
  - id: c
    text:
      es: "El personal laboral temporal puede formar parte si pertenece a un grupo igual o superior al del puesto."
  - id: d
    text:
      es: "El personal laboral temporal puede formar parte solo de los órganos que seleccionan personal temporal."
  explanation:
    es: "El artículo 31.3 dice: «No podrá formar parte de los órganos de selección el personal laboral temporal». No admite excepciones por grupo profesional ni por tipo de proceso. El artículo 31.2 permite recabar especialistas, pero no abre el órgano al personal temporal."
  citation: "art. 31.3 Convenio único"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2019-7414-art-31
- id: m04-l08-q019
  prompt:
    es: "De acuerdo con el artículo 31.4 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, el número de contratos que se formalicen tras un proceso selectivo:"
  options:
  - id: a
    text:
      es: "Puede exceder del de plazas convocadas si lo prevé la propia convocatoria."
  - id: b
    text:
      es: "Puede exceder del de plazas convocadas si se producen renuncias."
  - id: c
    correct: true
    text:
      es: "En ningún caso puede exceder del número de plazas convocadas."
  - id: d
    text:
      es: "Lo fija la Comisión Paritaria a la vista de las calificaciones obtenidas."
  explanation:
    es: "El artículo 31.4 dice: «En ningún caso, el número de contratos que se formalicen podrá exceder del número de plazas convocadas». La excepción «cuando así lo prevea la propia convocatoria» es del artículo 61.8 del Estatuto Básico, para el acceso a la condición de funcionario. Las renuncias, en ese mismo artículo 61.8, permiten pedir una relación complementaria, no superar las plazas. La Comisión Paritaria no fija el número de contratos."
  citation: "art. 31.4 Convenio único"
  difficulty: 3
  tags:
  - "cantidad"
  - "efecto"
# anchor: boe-a-2019-7414-art-32
- id: m04-l08-q020
  prompt:
    es: "Según el artículo 32.1 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, el período de prueba del personal de nuevo ingreso por turno libre en los grupos profesionales M3 y M2:"
  options:
  - id: a
    correct: true
    text:
      es: "Se pacta por escrito en el contrato de trabajo y dura tres meses."
  - id: b
    text:
      es: "Se fija en la convocatoria del proceso selectivo y dura seis meses."
  - id: c
    text:
      es: "Se pacta por escrito en el contrato de trabajo y dura dos meses."
  - id: d
    text:
      es: "Se pacta de palabra al incorporarse al puesto y dura tres meses."
  explanation:
    es: "El artículo 32.1 dice que el período de prueba «se pactará por escrito en el contrato de trabajo» y que su duración «será de tres meses para los grupos profesionales M3 y M2». No se fija en la convocatoria ni dura seis meses. Dos meses no es ninguna de las duraciones del artículo. El pacto de palabra contradice la forma escrita."
  citation: "art. 32.1 Convenio único"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2019-7414-art-32
- id: m04-l08-q021
  prompt:
    es: "Una persona ingresa por turno libre en un puesto para el que no se exige titulación, en el ámbito del IV Convenio colectivo único para el personal laboral de la Administración General del Estado. ¿Cuánto dura su período de prueba?"
  options:
  - id: a
    text:
      es: "Un período de diez días laborables."
  - id: b
    correct: true
    text:
      es: "Un período de quince días laborables."
  - id: c
    text:
      es: "Un período de quince días naturales."
  - id: d
    text:
      es: "Un período de treinta días naturales."
  explanation:
    es: "El artículo 32.1 da tres meses a los grupos M3 y M2 y un mes a los demás, «excepto para el personal sin titulación, para el que será de quince días laborables». Los quince días son laborables, no naturales. Diez días laborables y treinta naturales no figuran en el artículo."
  citation: "art. 32.1 Convenio único"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11430-art-15
- id: m04-l08-q022
  prompt:
    es: "De acuerdo con el artículo 15.1 del texto refundido de la Ley del Estatuto de los Trabajadores, el contrato de trabajo de duración determinada solo podrá celebrarse:"
  options:
  - id: a
    text:
      es: "Por obra o servicio determinado o por circunstancias de la producción."
  - id: b
    text:
      es: "Por sustitución de persona trabajadora o por necesidades urgentes justificadas."
  - id: c
    text:
      es: "Por acumulación de tareas o por cobertura temporal de una vacante."
  - id: d
    correct: true
    text:
      es: "Por circunstancias de la producción o por sustitución de persona trabajadora."
  explanation:
    es: "El artículo 15.1 dice: «El contrato de trabajo de duración determinada solo podrá celebrarse por circunstancias de la producción o por sustitución de persona trabajadora». El contrato por obra o servicio determinado ya no figura entre las causas del artículo. Las necesidades urgentes, la acumulación de tareas y la cobertura de una vacante no son las causas que nombra."
  citation: "art. 15.1 ET"
  difficulty: 2
  tags:
  - "requisito"
