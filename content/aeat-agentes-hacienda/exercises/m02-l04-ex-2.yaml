    es: "El plazo máximo de la audiencia es de quince días, hábiles, que se cuentan desde el día siguiente: del 9 al 13 de marzo son cinco, del 16 al 20 otros cinco y del 23 al 27 los cinco últimos, luego vence el viernes 27. El viernes 20 resulta de aplicar el mínimo de diez días. El sábado 21 sale de contar quince días naturales. Y el lunes 30 supone conceder dieciséis días."
