  - id: d
    text:
      es: "Sí, porque todo suministro de un poder adjudicador está sujeto a ella."
  explanation:
    es: "El umbral de 140.000 euros del artículo 21.1.a) LCSP solo rige para la Administración General del Estado, sus organismos autónomos y las Entidades Gestoras y Servicios Comunes de la Seguridad Social. Para los demás suministros, el artículo 21.1.b) fija 216.000 euros, y 180.000 no llega. No todo suministro de un poder adjudicador está sujeto: el artículo 19.1 exige alcanzar el umbral. Los 750.000 euros son el umbral de los servicios sociales y específicos del anexo IV, no el de un suministro."
