# anchor: boe-a-1998-16718-art-19
- id: m01-l11-q410
  prompt:
    es: "¿Cuál de los siguientes requisitos previos debe cumplir la Administración autora de un acto para impugnarlo ante el orden contencioso-administrativo, conforme al artículo 19.2 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa?"
  options:
  - id: a
    text:
      es: "La autorización del Ministerio Fiscal."
  - id: b
    text:
      es: "La reclamación previa en vía administrativa."
  - id: c
    correct: true
    text:
      es: "La declaración de lesividad para el interés público."
  - id: d
    text:
      es: "La revocación del acto por la propia Administración autora."
  explanation:
    es: "El artículo 19.2 exige que la Administración autora del acto declare previamente su lesividad para el interés público. La autorización del Ministerio Fiscal, que solo interviene en los procesos que determine la Ley (artículo 19.1.f), la reclamación previa en vía administrativa y la revocación del acto por la propia Administración no son requisitos de ese artículo."
  citation: "art. 19.2 LJCA"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1998-16718-art-22
- id: m01-l11-q411
  prompt:
    es: "¿Cuál de las siguientes personas puede ser sucedida por el causahabiente en cualquier estado del proceso, según el artículo 22 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa?"
  options:
  - id: a
    text:
      es: "El Procurador que ostentase la representación de la parte en el proceso."
  - id: b
    correct: true
    text:
      es: "La persona que inicialmente hubiera actuado como parte."
  - id: c
    text:
      es: "El Abogado que hubiera asistido a la parte."
  - id: d
    text:
      es: "El perito que hubiera informado en el proceso."
  explanation:
    es: "El artículo 22 dice que, si la legitimación deriva de una relación jurídica transmisible, el causahabiente puede suceder a la persona que inicialmente hubiera actuado como parte. El Procurador que representa a la parte, el Abogado que la asiste y el perito que informa en el proceso no son parte, y la legitimación no pasa a ellos."
  citation: "art. 22 LJCA"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-24
- id: m01-l11-q001
  prompt:
    es: "De acuerdo con el artículo 24.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los actos administrativos producidos por silencio administrativo producen efectos:"
  options:
  - id: a
    text:
      es: "Desde el día siguiente a la presentación de la solicitud en el registro electrónico del órgano competente para resolver."
  - id: b
    correct: true
    text:
      es: "Desde que vence el plazo máximo para dictar y notificar la resolución expresa sin que esta se haya expedido."
  - id: c
    text:
      es: "Desde la fecha en que el órgano competente expida de oficio el certificado acreditativo del silencio producido."
  - id: d
    text:
      es: "Desde que el interesado comunique a la Administración su intención de hacer valer el silencio."
  explanation:
    es: "El artículo 24.4 dice que estos actos «producen efectos desde el vencimiento del plazo máximo en el que debe dictarse y notificarse la resolución expresa sin que la misma se haya expedido». El certificado acreditativo del silencio no da origen a los efectos: el mismo apartado lo menciona como un medio de prueba de su existencia. La presentación de la solicitud abre el plazo para resolver; no produce el acto. La ley no exige al interesado comunicar que hará valer el silencio."
  citation: "art. 24.4 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-112
- id: m01-l11-q002
  prompt:
    es: "¿Contra qué actos de trámite podrán los interesados interponer los recursos de alzada y potestativo de reposición, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Contra los que produzcan indefensión o perjuicio irreparable a derechos e intereses legítimos."
  - id: b
    text:
      es: "Contra los que dicte un órgano que carezca de superior jerárquico en la organización."
  - id: c
    text:
      es: "Contra todos los actos de trámite, sin excepción alguna, dictados en cualquier tipo de procedimiento."
  - id: d
    text:
      es: "Contra los que se dicten en procedimientos iniciados de oficio por la Administración."
  explanation:
    es: "El artículo 112.1 admite esos recursos contra los actos de trámite que «deciden directa o indirectamente el fondo del asunto, determinan la imposibilidad de continuar el procedimiento, producen indefensión o perjuicio irreparable a derechos e intereses legítimos». No los admite contra todos: la oposición a los restantes actos de trámite se alega para la resolución que ponga fin al procedimiento. Que el procedimiento se iniciara de oficio no es uno de esos supuestos. Tampoco lo es que el órgano carezca de superior jerárquico."
  citation: "art. 112.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-109
- id: m01-l11-q003
  prompt:
    es: "¿Hasta cuándo podrán las Administraciones Públicas revocar sus actos de gravamen o desfavorables, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Mientras no haya transcurrido el plazo de prescripción."
  - id: b
    text:
      es: "Mientras esos actos no hayan sido notificados a los interesados."
  - id: c
    text:
      es: "Dentro de los cuatro años siguientes a la fecha en que se dictaron."
  - id: d
    text:
      es: "En cualquier momento, de oficio o a instancia de los interesados."
  explanation:
    es: "El artículo 109.1 permite revocar los actos de gravamen o desfavorables «mientras no haya transcurrido el plazo de prescripción». No fija un plazo propio de cuatro años. La fórmula «en cualquier momento, de oficio o a instancia de los interesados» es la del apartado 2, para rectificar errores materiales, de hecho o aritméticos. La notificación del acto no limita su revocación."
  citation: "art. 109.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-109
- id: m01-l11-q004
  prompt:
    es: "¿Cuál de los siguientes es, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, un límite a la revocación de los actos de gravamen o desfavorables?"
  options:
  - id: a
    text:
      es: "Que la revocación cuente con el dictamen previo del Consejo de Estado."
  - id: b
    text:
      es: "Que el acto revocado no haya puesto fin a la vía administrativa."
  - id: c
    text:
      es: "Que la revocación la solicite el propio interesado en el procedimiento."
  - id: d
    correct: true
    text:
      es: "Que la revocación no sea una dispensa o exención no permitida por las leyes."
  explanation:
    es: "El artículo 109.1 exige que la revocación «no constituya dispensa o exención no permitida por las leyes, ni sea contraria al principio de igualdad, al interés público o al ordenamiento jurídico». No pide dictamen del Consejo de Estado ni solicitud del interesado. Tampoco excluye los actos que ponen fin a la vía administrativa."
  citation: "art. 109.1 LPAC"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-37
- id: m01-l11-q005
  prompt:
    es: "Según el artículo 37.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las resoluciones administrativas de carácter particular no podrán vulnerar lo establecido en una disposición de carácter general:"
  options:
  - id: a
    text:
      es: "Salvo que procedan de un órgano de superior jerarquía al que dictó la disposición."
  - id: b
    correct: true
    text:
      es: "Aunque procedan de un órgano de igual o superior jerarquía al que dictó la disposición."
  - id: c
    text:
      es: "Salvo que la disposición general la haya dictado una Administración Pública distinta."
  - id: d
    text:
      es: "Salvo que procedan del mismo órgano que dictó la disposición de carácter general."
  explanation:
    es: "El artículo 37.1 dice que no podrán vulnerarla «aunque aquéllas procedan de un órgano de igual o superior jerarquía al que dictó la disposición general». Ni el rango superior ni la identidad del órgano abren una excepción. El artículo no distingue según la Administración que dictó la disposición."
  citation: "art. 37.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-37
- id: m01-l11-q006
  prompt:
    es: "¿Cómo denomina la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas la prohibición de que una resolución de carácter particular vulnere una disposición de carácter general?"
  options:
  - id: a
    text:
      es: "La reserva de ley."
  - id: b
    text:
      es: "La jerarquía normativa."
  - id: c
    correct: true
    text:
      es: "La inderogabilidad singular."
  - id: d
    text:
      es: "La irretroactividad de los actos."
  explanation:
    es: "El artículo 37 lleva por título «Inderogabilidad singular», y su apartado 1 contiene esta regla. La jerarquía normativa ordena normas de distinto rango, y aquí la resolución puede proceder de un órgano de igual o superior jerarquía. La reserva de ley y la irretroactividad son otras reglas; ninguna da nombre a este artículo."
  citation: "art. 37.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-37
- id: m01-l11-q007
  prompt:
    es: "Conforme al artículo 37.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, son nulas las resoluciones administrativas que:"
  options:
  - id: a
    correct: true
    text:
      es: "Vulneren lo establecido en una disposición reglamentaria."
  - id: b
    text:
      es: "Omitan en su notificación los recursos que procedan."
  - id: c
    text:
      es: "Se aparten del criterio seguido en actuaciones precedentes."
  - id: d
    text:
      es: "Se dicten fuera del plazo máximo establecido para resolver."
  explanation:
    es: "El artículo 37.2 dice: «Son nulas las resoluciones administrativas que vulneren lo establecido en una disposición reglamentaria». Apartarse del criterio de actuaciones precedentes es posible si el acto se motiva (art. 35.1.c). Resolver fuera de plazo sólo implica la anulabilidad cuando lo imponga la naturaleza del término o plazo (art. 48.3). La falta de indicación de recursos afecta a la eficacia de la notificación (art. 40.3), no a la validez de la resolución."
  citation: "art. 37.2 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-39
- id: m01-l11-q008
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los actos de las Administraciones Públicas sujetos al Derecho Administrativo producirán efectos:"
  options:
  - id: a
    text:
      es: "Desde el día siguiente al de su notificación o publicación oficial."
  - id: b
    correct: true
    text:
      es: "Desde la fecha en que se dicten, salvo que en ellos se disponga otra cosa."
  - id: c
    text:
      es: "Desde su notificación, salvo que en ellos se disponga otra cosa."
  - id: d
    text:
      es: "Desde que adquieran firmeza por no haberse interpuesto recurso."
  explanation:
    es: "El artículo 39.1 dice que «se presumirán válidos y producirán efectos desde la fecha en que se dicten, salvo que en ellos se disponga otra cosa». La notificación o la publicación demoran la eficacia sólo cuando esta esté supeditada a ellas (art. 39.2); no son la regla general. La firmeza no es condición de los efectos."
  citation: "art. 39.1 LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-39
- id: m01-l11-q009
  prompt:
    es: "¿En cuál de los siguientes casos quedará demorada la eficacia de un acto administrativo, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando esté supeditada a su notificación, publicación o aprobación superior."
  - id: b
    text:
      es: "Cuando se trate de un acto de gravamen o desfavorable para el interesado."
  - id: c
    text:
      es: "Cuando se haya dictado en un procedimiento iniciado de oficio."
  - id: d
    text:
      es: "Cuando el interesado haya anunciado su intención de recurrirlo en vía administrativa."
  explanation:
    es: "El artículo 39.2 dice que la eficacia «quedará demorada cuando así lo exija el contenido del acto o esté supeditada a su notificación, publicación o aprobación superior». Anunciar un recurso no demora la eficacia. El artículo tampoco distingue entre actos de gravamen y favorables, ni según cómo se inició el procedimiento."
  citation: "art. 39.2 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-39
- id: m01-l11-q010
  prompt:
    es: "De acuerdo con el artículo 39.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, podrá otorgarse excepcionalmente eficacia retroactiva a los actos:"
  options:
  - id: a
    text:
      es: "Que se dicten en ejecución de sentencias y a los que produzcan efectos favorables al interesado."
  - id: b
    text:
      es: "Que el interesado solicite expresamente, siempre que no se lesionen derechos de otras personas."
  - id: c
    text:
      es: "Que se dicten en sustitución de actos anulados y a los de gravamen o desfavorables para el interesado."
  - id: d
    correct: true
    text:
      es: "Que se dicten en sustitución de actos anulados y a los que produzcan efectos favorables al interesado."
  explanation:
    es: "El artículo 39.3 permite la retroactividad «cuando se dicten en sustitución de actos anulados, así como cuando produzcan efectos favorables al interesado». Los actos de gravamen no están en la lista. Tampoco la ejecución de sentencias. La solicitud del interesado no basta: el artículo exige uno de los dos supuestos."
  citation: "art. 39.3 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-10565-art-39
- id: m01-l11-q011
  prompt:
    es: "Según el artículo 39.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué requisito debe cumplirse para otorgar eficacia retroactiva a un acto favorable al interesado?"
  options:
  - id: a
    text:
      es: "Que la retroactividad no se extienda más allá del año anterior a la fecha del acto."
  - id: b
    text:
      es: "Que el acto se haya dictado en un procedimiento que se inició a solicitud del propio interesado."
  - id: c
    text:
      es: "Que el acto se haya publicado en el diario oficial que corresponda a la Administración."
  - id: d
    correct: true
    text:
      es: "Que los supuestos de hecho necesarios existieran ya en la fecha a que se retrotraiga la eficacia."
  explanation:
    es: "El artículo 39.3 exige «que los supuestos de hecho necesarios existieran ya en la fecha a que se retrotraiga la eficacia del acto y ésta no lesione derechos o intereses legítimos de otras personas». No pide que el procedimiento se iniciara a solicitud del interesado. No fija un límite de un año. La publicación tampoco es requisito de la retroactividad."
  citation: "art. 39.3 LPAC"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
