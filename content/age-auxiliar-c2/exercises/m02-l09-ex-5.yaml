  options:
  - id: a
    text:
      es: "31 de diciembre de 1899"
  - id: b
    correct: true
    text:
      es: "1 de enero de 1900"
  - id: c
    text:
      es: "1 de enero de 1970"
  - id: d
    text:
      es: "1 de enero de 2000"
  explanation:
    es: "La página dice que, de manera predeterminada, el número de serie 1 es el 1 de enero de 1900. «1 de enero de 1970»: la página da el 1 de enero de 1900 como número de serie 1. «31 de diciembre de 1899»: la serie empieza con el 1 de enero de 1900 como número 1, no con el día anterior. «1 de enero de 2000»: el número 1 corresponde al 1 de enero de 1900."
  citation: "fuente: `ms-excel-funcion-dia.html`; «Observaciones»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
