# anchor: fuente-ms-win-notificaciones-html
- id: m02-l06-q109
  prompt:
    es: "¿Cuál de las siguientes opciones recoge los niveles de prioridad que Windows 11 permite asignar a las notificaciones de una aplicación?"
  options:
  - id: a
    text:
      es: "Superior, Alta, Media o Baja"
  - id: b
    correct: true
    text:
      es: "Superior, Alta o Normal"
  - id: c
    text:
      es: "Alta, Normal o Baja"
  - id: d
    text:
      es: "Crítica, Alta o Normal"
  explanation:
    es: "La página dice que la prioridad se establece en Superior, Alta o Normal. Las demás combinaciones cambian algún nivel por Media, Baja o Crítica, o añaden un cuarto nivel, y contradicen esa lista de tres."
  citation: "fuente: `ms-win-notificaciones.html`; «Configurar notificaciones»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-notificaciones-html
- id: m02-l06-q110
  prompt:
    es: "Señale la afirmación correcta sobre la prioridad de las notificaciones de las aplicaciones en Windows 11:"
  options:
  - id: a
    correct: true
    text:
      es: "Las notificaciones de prioridad alta aparecen encima de las normales en el centro de notificaciones"
  - id: b
    text:
      es: "Las notificaciones de prioridad alta aparecen debajo de las normales en el centro de notificaciones"
  - id: c
    text:
      es: "Varias aplicaciones pueden tener a la vez la prioridad Superior en el centro de notificaciones"
  - id: d
    text:
      es: "La prioridad de una aplicación se elige entre cuatro niveles distintos en la configuración"
  explanation:
    es: "La página dice que las notificaciones de prioridad alta aparecerán encima de las normales en el centro de notificaciones, que solo una aplicación puede tener la máxima prioridad y que los niveles son Superior, Alta o Normal, es decir, tres y no cuatro."
  citation: "fuente: `ms-win-notificaciones.html`; «Configurar notificaciones»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-notificaciones-html
- id: m02-l06-q111
  prompt:
    es: "En la configuración de notificaciones de Windows 11, ¿cuál de las siguientes opciones muestra una pantalla de bienvenida con novedades y sugerencias tras las actualizaciones?"
  options:
  - id: a
    text:
      es: "Mostrar banners de notificación"
  - id: b
    text:
      es: "Ocultar contenido cuando las notificaciones están en la pantalla de bloqueo"
  - id: c
    text:
      es: "Mostrar notificaciones en el centro de notificaciones"
  - id: d
    correct: true
    text:
      es: "Mostrar la experiencia de bienvenida de Windows"
  explanation:
    es: "La página dice que la casilla de la experiencia de bienvenida de Windows da una pantalla de bienvenida con nuevas características y sugerencias después de las actualizaciones o al iniciar sesión. Mostrar banners habilita los banners emergentes, Ocultar contenido evita notificaciones confidenciales en la pantalla de bloqueo y Mostrar notificaciones en el centro elige si aparecen en él."
  citation: "fuente: `ms-win-notificaciones.html`; «Configurar notificaciones»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-notificaciones-html
- id: m02-l06-q112
  prompt:
    es: "En Windows 11, ¿cómo se activa manualmente la opción No molestar desde el centro de notificaciones, tras abrirlo?"
  options:
  - id: a
    text:
      es: "Seleccionando el botón Borrar todo"
  - id: b
    text:
      es: "Seleccionando el botón Más junto a una aplicación"
  - id: c
    text:
      es: "Seleccionando la flecha junto a la hora de una notificación"
  - id: d
    correct: true
    text:
      es: "Seleccionando el icono de campana con zZ"
  explanation:
    es: "La página indica que, para activar manualmente No molestar, se abre el centro de notificaciones y se selecciona el icono de campana con zZ. Borrar todo quita las notificaciones, Más permite desactivar las de una aplicación y la flecha junto a la hora expande una notificación."
  citation: "fuente: `ms-win-notificaciones.html`; «No molestar»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-notificaciones-html
- id: m02-l06-q113
  prompt:
    es: "En Windows 11, con No molestar activado, siguen mostrándose en pantalla, según la ayuda de Microsoft, los banners de notificación:"
  options:
  - id: a
    text:
      es: "los de las aplicaciones con prioridad Alta o Superior"
  - id: b
    text:
      es: "solo los del correo electrónico y los mensajes"
  - id: c
    correct: true
    text:
      es: "los de alarmas, recordatorios y las aplicaciones elegidas"
  - id: d
    text:
      es: "ninguno, porque se silencian todos sin excepción"
  explanation:
    es: "La página dice que, con No molestar activado, solo se reciben banners de alarmas, recordatorios y aplicaciones elegidas, y que las demás notificaciones van directamente al centro de notificaciones. Por eso ni la prioridad Alta ni el correo se citan como excepción, y tampoco se silencian todos."
  citation: "fuente: `ms-win-notificaciones.html`; «No molestar»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-notificaciones-html
- id: m02-l06-q114
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes botones permite elegir las aplicaciones que pueden enviar notificaciones mientras No molestar está activado?"
  options:
  - id: a
    text:
      es: "Desactivar todas las notificaciones"
  - id: b
    correct: true
    text:
      es: "Agregar aplicaciones"
  - id: c
    text:
      es: "Borrar todo"
  - id: d
    text:
      es: "Mostrar banners de notificación"
  explanation:
    es: "La página dice que, en Aplicaciones, se elige qué aplicaciones pueden enviar notificaciones con No molestar activado seleccionando el botón Agregar aplicaciones. Desactivar todas las notificaciones se aplica a una aplicación, Borrar todo limpia el centro y Mostrar banners es una opción por aplicación."
  citation: "fuente: `ms-win-notificaciones.html`; «En Aplicaciones, seleccione qué aplicaciones pueden enviar notificaciones mientras no molestar está activado seleccionando el botón Agregar aplicaciones.»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q115
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes combinaciones de teclas de la tabla de métodos abreviados crea otro escritorio?"
  options:
  - id: a
    correct: true
    text:
      es: "Windows+Ctrl+D"
  - id: b
    text:
      es: "Windows+Ctrl+F4"
  - id: c
    text:
      es: "Windows+Ctrl+Flecha derecha"
  - id: d
    text:
      es: "Windows+Tab"
  explanation:
    es: "La tabla de métodos abreviados de varios escritorios asigna a Windows+Ctrl+D «Crear otro escritorio». Windows+Ctrl+F4 cierra el escritorio en uso, Windows+Ctrl+Flecha derecha alterna entre los escritorios creados a la derecha y Windows+Tab abre la Vista de tareas."
  citation: "fuente: `ms-win-atajos.html`; «Varios métodos abreviados de teclado de escritorios»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q116
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes combinaciones de teclas cierra el escritorio que se está usando en ese momento?"
  options:
  - id: a
    correct: true
    text:
      es: "Windows+Ctrl+F4"
  - id: b
    text:
      es: "Windows+Ctrl+D"
  - id: c
    text:
      es: "Windows+Ctrl+Flecha izquierda"
  - id: d
    text:
      es: "Alt+F4"
  explanation:
    es: "La tabla de varios escritorios asigna a Windows+Ctrl+F4 «Cerrar el escritorio que estás usando». Windows+Ctrl+D crea otro escritorio, Windows+Ctrl+Flecha izquierda alterna entre los escritorios de la izquierda y Alt+F4 cierra la ventana activa, no el escritorio."
  citation: "fuente: `ms-win-atajos.html`; «Varios métodos abreviados de teclado de escritorios»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q117
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas permite alternar con el teclado entre los escritorios creados situados a la derecha en Windows 11?"
  options:
  - id: a
    text:
      es: "Windows+Flecha derecha"
  - id: b
    text:
      es: "Windows+Alt+Flecha abajo"
  - id: c
    text:
      es: "Windows+Ctrl+D"
  - id: d
    correct: true
    text:
      es: "Windows+Ctrl+Flecha derecha"
  explanation:
    es: "La tabla de varios escritorios asigna a Windows+Ctrl+Flecha derecha «Alternar entre otros escritorios que has creado a la derecha». Windows+Flecha derecha acopla la ventana al lado derecho de la pantalla, Windows+Alt+Flecha abajo acopla la ventana activa a la mitad inferior y Windows+Ctrl+D crea otro escritorio."
  citation: "fuente: `ms-win-atajos.html`; «Varios métodos abreviados de teclado de escritorios»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q118
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes combinaciones de teclas abre la Vista de tareas, desde la que se puede crear un escritorio nuevo?"
  options:
  - id: a
    text:
      es: "Windows+Ctrl+D"
  - id: b
    text:
      es: "Windows+Alt+Flecha arriba"
  - id: c
    correct: true
    text:
      es: "Windows+Tab"
  - id: d
    text:
      es: "Alt+Esc"
  explanation:
    es: "La tabla de varios escritorios asigna a Windows+Tab «Abrir la Vista de tareas». Windows+Ctrl+D crea otro escritorio, Windows+Alt+Flecha arriba acopla la ventana activa a la mitad superior y Alt+Esc se desplaza por las ventanas en el orden en que se abrieron."
  citation: "fuente: `ms-win-atajos.html`; «Varios métodos abreviados de teclado de escritorios»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-escritorios-html
- id: m02-l06-q119
  prompt:
    es: "En Windows 11, ¿qué se puede hacer con el ratón para abrir la Vista de tareas y crear desde ella un nuevo escritorio?"
  options:
  - id: a
    text:
      es: "Mantener el puntero sobre el botón Maximizar de una ventana"
  - id: b
    correct: true
    text:
      es: "Mantener el puntero sobre el icono de Vista de tareas de la barra"
  - id: c
    text:
      es: "Mantener el puntero sobre el botón Widgets de la barra de tareas"
  - id: d
    text:
      es: "Seleccionar la esquina más alejada de la barra de tareas"
  explanation:
    es: "La página indica que, para crear un nuevo escritorio, se mantiene el puntero sobre el icono de Vista de tareas de la barra de tareas o se presiona Windows y Tab, y luego se selecciona Nuevo escritorio. El puntero sobre Maximizar muestra los diseños de ajuste, sobre Widgets abre el panel de widgets y la esquina más alejada muestra el escritorio."
  citation: "fuente: `ms-win-escritorios.html`; «Crear un nuevo escritorio»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-escritorios-html
- id: m02-l06-q120
  prompt:
    es: "En Windows 11, una vez abierta la Vista de tareas, para crear un escritorio nuevo se selecciona la opción:"
  options:
  - id: a
    text:
      es: "Elegir fondo"
  - id: b
    correct: true
    text:
      es: "Nuevo escritorio"
  - id: c
    text:
      es: "Mostrar el escritorio"
  - id: d
    text:
      es: "Nuevo › Acceso directo"
  explanation:
    es: "La página dice que, tras abrir la Vista de tareas, se selecciona Nuevo escritorio. Elegir fondo cambia la imagen de un escritorio ya creado y Nuevo › Acceso directo es la ruta del clic derecho en un área vacía del escritorio para crear un acceso directo. Mostrar el escritorio minimiza las ventanas."
  citation: "fuente: `ms-win-escritorios.html`; «Estos son los pasos para crear un nuevo escritorio:»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-escritorios-html
- id: m02-l06-q121
  prompt:
    es: "¿Cómo se configura en Windows 11 un fondo distinto para cada escritorio virtual creado con la Vista de tareas?"
  options:
  - id: a
    correct: true
    text:
      es: "Con clic derecho en ese escritorio, en la Vista de tareas, y Elegir fondo"
  - id: b
    text:
      es: "Con clic derecho en un área vacía del escritorio y la opción Ver"
  - id: c
    text:
      es: "Con Configuración › Personalización › Temas › Configuración del icono de escritorio"
  - id: d
    text:
      es: "Con Configuración › Sistema › Multitarea › Escritorios"
  explanation:
    es: "La página indica que, en la Vista de tareas, se hace clic con el botón derecho en el escritorio que se desea personalizar y se selecciona Elegir fondo. El menú Ver del escritorio cambia el tamaño de los iconos, la configuración del icono de escritorio elige iconos como Este equipo y la Papelera, y Multitarea › Escritorios decide qué ventanas muestra la barra de tareas."
  citation: "fuente: `ms-win-escritorios.html`; «Configure fondos para cada escritorio»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-escritorios-html
- id: m02-l06-q122
  prompt:
    es: "Señale la afirmación correcta sobre los fondos de los distintos escritorios virtuales de Windows 11:"
  options:
  - id: a
    text:
      es: "Cada escritorio puede tener una presentación de diapositivas diferente de las demás"
  - id: b
    text:
      es: "Cada escritorio puede tener un color sólido diferente al de los demás escritorios"
  - id: c
    text:
      es: "Todos los escritorios deben compartir siempre el mismo fondo de pantalla elegido"
  - id: d
    correct: true
    text:
      es: "Cada escritorio puede tener su imagen, pero no una presentación ni un color sólido propios"
  explanation:
    es: "La página dice que solo es posible configurar un fondo personalizado para cada escritorio cuando se usa una imagen, y que no se puede usar una presentación de diapositivas ni un color sólido diferente en cada uno. Por eso ninguna de las otras afirmaciones se sostiene."
  citation: "fuente: `ms-win-escritorios.html`; «Configure fondos para cada escritorio»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-escritorios-html
- id: m02-l06-q123
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones de Configuración › Sistema › Multitarea › Escritorios hace que la barra de tareas muestre las ventanas abiertas de todos los escritorios?"
  options:
  - id: a
    text:
      es: "Solo en el escritorio que estoy usando"
  - id: b
    text:
      es: "Mostrar mi barra de tareas en todas las pantallas"
  - id: c
    correct: true
    text:
      es: "En todos los escritorios"
  - id: d
    text:
      es: "Mostrar todas las ventanas abiertas al presionar Alt+TAB"
  explanation:
    es: "La página dice que En todos los escritorios muestra en la barra de tareas las ventanas abiertas de todos los escritorios. Solo en el escritorio que estoy usando muestra únicamente las del escritorio actual. Mostrar mi barra de tareas en todas las pantallas es una opción de comportamiento con varios monitores, y la opción de Alt+TAB solo afecta a las ventanas que muestra esa combinación."
  citation: "fuente: `ms-win-escritorios.html`; «Personalizar la experiencia de múltiples escritorios»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-win-escritorios-html
- id: m02-l06-q124
  prompt:
    es: "Con varios escritorios en Windows 11, ¿qué dos valores ofrece Configuración para las ventanas abiertas que muestra la barra de tareas?"
  options:
  - id: a
    text:
      es: "Solo en la pantalla principal y En todas las pantallas conectadas"
  - id: b
    text:
      es: "Solo en las aplicaciones ancladas y En todas las aplicaciones abiertas"
  - id: c
    correct: true
    text:
      es: "Solo en el escritorio que estoy usando y En todos los escritorios"
  - id: d
    text:
      es: "En el escritorio actual y En el último escritorio que se usó"
  explanation:
    es: "La página enumera dos opciones para las ventanas abiertas en la barra de tareas con varios escritorios: Solo en el escritorio que estoy usando, que muestra las del escritorio actual, y En todos los escritorios, que muestra las de todos. Las otras parejas cambian los términos por pantallas, aplicaciones o un último escritorio, y contradicen los dos valores que enumera la página."
  citation: "fuente: `ms-win-escritorios.html`; «En todos los escritorios: esta configuración mostrará todas las ventanas abiertas de todos los escritorios de la barra de tareas, independientemente del escritorio que esté usando actualmente. Esto puede ser útil si desea obtener acceso rápido a todas las aplicaciones abiertas sin cambiar de escritorio.»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q125
  prompt:
    es: "En Windows 11, ¿en qué carpeta guarda Windows la captura de pantalla completa que se hace con la tecla Windows y Impr Pant?"
  options:
  - id: a
    text:
      es: "En la subcarpeta Grabaciones de pantalla de Vídeos"
  - id: b
    correct: true
    text:
      es: "En la subcarpeta Capturas de pantalla de la carpeta Imágenes"
  - id: c
    text:
      es: "En la carpeta Descargas"
  - id: d
    text:
      es: "En el Portapapeles, sin crear ningún archivo"
  explanation:
    es: "La tabla dice que Windows+Impr Pant captura la pantalla completa y la guarda en un archivo en la subcarpeta Capturas de pantalla de la carpeta Imágenes. Las grabaciones de vídeo con Windows+Mayús+R se guardan en Grabaciones de pantalla, en Vídeos. La captura se guarda en un archivo, no solo en el Portapapeles, y la tabla da otra carpeta que Descargas."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q126
  prompt:
    es: "En Windows 11, ¿qué hace la combinación de la tecla Windows con Impr Pant, según la tabla de métodos abreviados?"
  options:
  - id: a
    correct: true
    text:
      es: "Captura la pantalla completa y la guarda en un archivo de la carpeta Imágenes"
  - id: b
    text:
      es: "Selecciona una zona de la pantalla y hace la captura en el Portapapeles"
  - id: c
    text:
      es: "Selecciona una zona de la pantalla y graba un vídeo como archivo MP4"
  - id: d
    text:
      es: "Captura la ventana activa y la copia en el Portapapeles del equipo"
  explanation:
    es: "La tabla asigna a Windows+Impr Pant la captura de la pantalla completa guardada en un archivo de Imágenes. Seleccionar una zona con captura en el Portapapeles es lo que hace Windows+Mayús+S, grabar un vídeo MP4 es Windows+Mayús+R y capturar la ventana activa al Portapapeles es Alt+Impr Pant."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q127
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas de Windows 11 captura solo la ventana activa y la copia en el Portapapeles?"
  options:
  - id: a
    text:
      es: "Windows+Impr Pant"
  - id: b
    text:
      es: "Windows+Mayús+S"
  - id: c
    text:
      es: "Windows+Mayús+R"
  - id: d
    correct: true
    text:
      es: "Alt+Impr Pant"
  explanation:
    es: "La tabla asigna a Alt+Impr Pant la captura de la ventana activa en el Portapapeles. Windows+Impr Pant guarda la pantalla completa en un archivo, Windows+Mayús+S selecciona una zona para capturarla en el Portapapeles y Windows+Mayús+R graba un vídeo de una zona."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q128
  prompt:
    es: "En Windows 11, ¿dónde se guarda de forma predeterminada la grabación de pantalla que se inicia con Windows+Mayús+R?"
  options:
  - id: a
    text:
      es: "Como archivo MP4 en la subcarpeta Capturas de pantalla de la carpeta Imágenes"
  - id: b
    text:
      es: "Como archivo de imagen en la subcarpeta Grabaciones de pantalla de Vídeos"
  - id: c
    correct: true
    text:
      es: "Como archivo MP4 en la subcarpeta Grabaciones de pantalla de la carpeta Vídeos"
  - id: d
    text:
      es: "En el Portapapeles, hasta que se guarda desde la herramienta Recortes"
  explanation:
    es: "La tabla dice que Windows+Mayús+R abre la grabación en la herramienta Recortes y, de forma predeterminada, la guarda como archivo MP4 en la subcarpeta Grabaciones de pantalla de la carpeta Vídeos. Imágenes › Capturas de pantalla recibe las capturas de Windows+Impr Pant, y un vídeo no se guarda como imagen ni solo en el Portapapeles."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 2
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m02-l06-q162
  prompt:
    es: "En Windows 11, ¿cuál de los iconos del escritorio que se pueden personalizar es un acceso directo a las carpetas personales del usuario?"
  options:
  - id: a
    text:
      es: "Red"
  - id: b
    correct: true
    text:
      es: "User's Files"
  - id: c
    text:
      es: "Este equipo"
  - id: d
    text:
      es: "Papelera de reciclaje"
  explanation:
