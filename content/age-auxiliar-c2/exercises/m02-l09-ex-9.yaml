# anchor: fuente-ms-excel-funcion-truncar-html
- id: m02-l09-q237
  prompt:
    es: "Al preparar un libro en Microsoft Excel 365 con las etiquetas en español, ¿cuál de los siguientes valores devuelve la fórmula =TRUNCAR(-8,9)?"
  options:
  - id: a
    text:
      es: "-9"
  - id: b
    correct: true
    text:
      es: "-8"
  - id: c
    text:
      es: "-8,9"
  - id: d
    text:
      es: "8"
  explanation:
    es: "La página da -8 para =TRUNCAR(-8,9): elimina la parte fraccionaria. «-9»: redondea hacia abajo la función ENTERO, no TRUNCAR, que elimina la parte fraccionaria. «8»: TRUNCAR conserva el signo negativo. «-8,9»: TRUNCAR sin decimales quita la parte fraccionaria."
  citation: "fuente: `ms-excel-funcion-truncar.html`; «Ejemplo»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-truncar-html
- id: m02-l09-q238
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes funciones devuelve -5 para el número -4,3 y cuál devuelve -4?"
  options:
  - id: a
    text:
      es: "TRUNCAR devuelve -5 y ENTERO devuelve -4"
  - id: b
    text:
      es: "Las dos devuelven -5"
  - id: c
    text:
      es: "Las dos devuelven -4"
  - id: d
    correct: true
    text:
      es: "ENTERO devuelve -5 y TRUNCAR devuelve -4"
  explanation:
    es: "La página compara TRUNCAR con ENTERO: TRUNCAR(-4,3) devuelve -4, pero INT(-4,3) devuelve -5, porque -5 es el número más bajo. «TRUNCAR devuelve -5 y ENTERO devuelve -4»: está invertido: TRUNCAR(-4,3) da -4 e INT(-4,3) da -5. «Las dos devuelven -4»: INT devuelve el entero inferior más cercano, que para -4,3 es -5. «Las dos devuelven -5»: TRUNCAR solo elimina la parte fraccionaria, y da -4."
  citation: "fuente: `ms-excel-funcion-truncar.html`; «Comparación con la función ENTERO»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-funcion-truncar-html
