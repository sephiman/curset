  difficulty: 2
  tags:
  - "plazo"
# anchor: celex-12016m-txt-art-19
- id: m01-l10-q123
  prompt:
    es: "Según el Tratado de la Unión Europea, ¿a petición de qué sujetos se pronuncia el Tribunal de Justicia de la Unión Europea con carácter prejudicial sobre la interpretación del Derecho de la Unión?"
  options:
  - id: a
    correct: true
    text:
      es: "Los órganos jurisdiccionales nacionales."
  - id: b
    text:
      es: "La Comisión."
  - id: c
    text:
      es: "El Parlamento Europeo."
  - id: d
    text:
      es: "Los Gobiernos de los Estados miembros."
  explanation:
    es: "La cuestión prejudicial la plantean los órganos jurisdiccionales nacionales. La Comisión, el Parlamento y los Gobiernos no la plantean con ese carácter."
  citation: "art. 19.3 TUE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: celex-12016m-txt-art-19
- id: m01-l10-q124
  prompt:
    es: "De acuerdo con el artículo 19.3 del Tratado de la Unión Europea, el Tribunal de Justicia de la Unión Europea se pronunciará sobre los recursos interpuestos por:"
  options:
  - id: a
    text:
      es: "Únicamente los Estados miembros."
  - id: b
    text:
      es: "Un Estado miembro o una institución, pero no por personas físicas o jurídicas."
  - id: c
    text:
      es: "Las instituciones y los órganos jurisdiccionales nacionales."
  - id: d
    correct: true
    text:
      es: "Un Estado miembro, una institución o personas físicas o jurídicas."
  explanation:
    es: "Pueden recurrir los Estados miembros, las instituciones y las personas físicas o jurídicas. La opción de solo Estados miembros, la que excluye a las personas físicas o jurídicas y la que sustituye a los Estados por los órganos jurisdiccionales nacionales restringen o alteran la lista."
  citation: "art. 19.3 TUE"
  difficulty: 3
  tags:
  - "competencia"
# anchor: celex-12016e-txt-art-256
- id: m01-l10-q125
  prompt:
    es: "¿Cuál de las siguientes normas determina las materias específicas en las que el Tribunal General conoce de cuestiones prejudiciales planteadas en virtud del artículo 267, según el artículo 256.3 del Tratado de Funcionamiento de la Unión Europea?"
  options:
  - id: a
    text:
      es: "El Reglamento interno del Consejo."
  - id: b
    text:
      es: "El Reglamento del Parlamento."
  - id: c
