# anchor: boe-a-2003-23186-art-131
- id: m03-l07-q0103
  prompt:
    es: "Conforme al artículo 131 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre los supuestos del procedimiento de verificación de datos:"
  options:
  - id: a
    text:
      es: "Cabe cuando el obligado no haya aplicado la normativa en un periodo distinto del declarado y no consten justificantes."
  - id: b
    text:
      es: "Cabe cuando se aprecie una aplicación indebida de la normativa que solo pueda descubrirse examinando la contabilidad del obligado."
  - id: c
    text:
      es: "Cabe cuando se aprecie una aplicación indebida de la normativa que resulte de datos obtenidos de terceros mediante requerimiento."
  - id: d
    correct: true
    text:
      es: "Cabe cuando se aprecie una aplicación indebida de la normativa que resulte patente de la propia declaración o autoliquidación o de los justificantes aportados."
  explanation:
    es: "La verificación alcanza la aplicación indebida de la normativa que resulte patente de la propia declaración o de los justificantes aportados (art. 131.c). Lo que exige examinar la contabilidad o requerir a terceros no es patente y queda para otros procedimientos."
  citation: "art. 131 LGT"
  difficulty: 2
  tags:
  - "verificación de datos"
  - "supuestos"
# anchor: boe-a-2003-23186-art-131
- id: m03-l07-q0105
  prompt:
    es: "Beatriz Cano presenta su declaración del IRPF con un dato de rendimientos del trabajo que no coincide con el que consta en los datos que obran en poder de la Administración tributaria. La Administración quiere regularizar la discrepancia sin examinar otros elementos de la obligación tributaria. Según el artículo 131 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué procedimiento puede iniciar?"
  options:
  - id: a
    text:
      es: "El de comprobación de valores, porque el dato declarado debe valorarse por los medios del artículo 57."
  - id: b
    text:
      es: "El iniciado mediante declaración, porque el dato discrepante procede de la declaración presentada."
  - id: c
    correct: true
    text:
      es: "El de verificación de datos, porque los datos declarados no coinciden con los que obran en su poder."
  - id: d
    text:
      es: "El de inspección, porque solo ese procedimiento admite contrastar datos con los de otras fuentes."
  explanation:
    es: "La discrepancia entre lo declarado y lo que obra en poder de la Administración es un supuesto de verificación de datos (art. 131.b). No se trata de valorar bienes, la inspección no es la única vía de contraste y el procedimiento iniciado mediante declaración es el de las declaraciones que cuantifican la obligación con liquidación provisional."
  citation: "art. 131 LGT"
  difficulty: 2
  tags:
  - "verificación de datos"
  - "supuestos"
# anchor: boe-a-2003-23186-art-132
- id: m03-l07-q0107
  prompt:
    es: "Según el artículo 132.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, con carácter previo a la práctica de la liquidación provisional en el procedimiento de verificación de datos, la Administración deberá comunicar al obligado la propuesta de liquidación para que:"
  options:
  - id: a
    text:
      es: "aporte una garantía por la cuantía propuesta."
  - id: b
    correct: true
    text:
      es: "alegue lo que convenga a su derecho."
  - id: c
    text:
      es: "preste su conformidad con los datos que figuran en ella."
  - id: d
    text:
      es: "pueda recurrir en reposición contra la propuesta."
  explanation:
    es: "La propuesta se comunica para que el obligado alegue lo que convenga a su derecho (art. 132.3). Una propuesta no es un acto recurrible en reposición, no pide conformidad y no exige garantías."
  citation: "art. 132.3 LGT"
  difficulty: 1
  tags:
  - "verificación de datos"
  - "tramitación"
# anchor: boe-a-2003-23186-art-132
- id: m03-l07-q0108
  prompt:
    es: "Conforme al artículo 132.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la propuesta de liquidación provisional en el procedimiento de verificación de datos deberá ser en todo caso motivada con:"
  options:
  - id: a
    correct: true
    text:
      es: "una referencia sucinta a los hechos y fundamentos de derecho que hayan sido tenidos en cuenta."
  - id: b
    text:
      es: "una valoración de los medios de prueba aportados por el obligado en sus alegaciones."
  - id: c
    text:
      es: "el informe razonado del órgano que haya tramitado el requerimiento al obligado."
  - id: d
    text:
      es: "una relación detallada de las actuaciones de comprobación realizadas en el procedimiento y de sus resultados parciales."
  explanation:
    es: "La motivación exigida es una referencia sucinta a los hechos y fundamentos de derecho tenidos en cuenta. No se exige una relación detallada de actuaciones, un informe razonado ni una valoración de las pruebas aportadas."
  citation: "art. 132.4 LGT"
  difficulty: 2
  tags:
  - "verificación de datos"
  - "tramitación"
# anchor: boe-a-2003-23186-art-133
- id: m03-l07-q0109
  prompt:
    es: "De acuerdo con el artículo 133.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento de verificación de datos terminará, entre otras formas, por resolución en la que se indique que no procede practicar liquidación provisional o en la que:"
  options:
  - id: a
    text:
      es: "se acuerde la devolución de los ingresos indebidos."
  - id: b
    correct: true
    text:
      es: "se corrijan los defectos advertidos."
  - id: c
    text:
      es: "se declare la prescripción del derecho a liquidar."
  - id: d
    text:
      es: "se imponga la sanción por el defecto advertido."
  explanation:
    es: "La resolución que termina la verificación puede indicar que no procede liquidación provisional o corregir los defectos advertidos (art. 133.1.a). No se declara prescripción, no se resuelve una devolución de ingresos indebidos ni se sanciona en ella."
  citation: "art. 133.1 LGT"
  difficulty: 1
  tags:
  - "verificación de datos"
  - "terminación"
# anchor: boe-a-2003-23186-art-133
- id: m03-l07-q0110
  prompt:
    es: "Según el artículo 133.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la terminación del procedimiento de verificación de datos por liquidación provisional:"
  options:
  - id: a
    text:
      es: "La liquidación provisional exige un informe previo del órgano de inspección sobre los datos verificados."
  - id: b
    text:
      es: "La liquidación provisional es definitiva si el obligado no la recurre en el plazo de un mes."
  - id: c
    correct: true
    text:
      es: "La liquidación provisional debe ser en todo caso motivada con una referencia sucinta a los hechos y fundamentos de derecho tenidos en cuenta."
  - id: d
    text:
      es: "La liquidación provisional debe ser motivada solo cuando el obligado haya presentado alegaciones a la propuesta."
  explanation:
    es: "El artículo 133.1.b) exige motivar siempre la liquidación provisional, con una referencia sucinta a hechos y fundamentos. La motivación no depende de las alegaciones, la liquidación sigue siendo provisional aunque no se recurra y no hace falta informe de la inspección."
  citation: "art. 133.1 LGT"
  difficulty: 2
  tags:
  - "verificación de datos"
  - "terminación"
# anchor: boe-a-2003-23186-art-133
- id: m03-l07-q0112
  prompt:
    es: "De acuerdo con el artículo 133.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento de verificación de datos terminará por caducidad una vez transcurrido el plazo regulado en el artículo 104 sin haberse notificado liquidación provisional, sin perjuicio de que la Administración:"
  options:
  - id: a
    correct: true
    text:
      es: "también pueda iniciar de nuevo este procedimiento dentro del plazo de prescripción."
  - id: b
    text:
      es: "pueda continuar las actuaciones hasta notificar la liquidación provisional sin límite de tiempo."
  - id: c
    text:
      es: "deba archivar las actuaciones sin posibilidad de nueva regularización del dato verificado."
  - id: d
    text:
      es: "pueda reclamar al obligado la presentación de una nueva declaración en plazo."
  explanation:
    es: "La caducidad no cierra el paso: la Administración puede iniciar de nuevo el procedimiento dentro del plazo de prescripción (art. 133.1.d). No obliga a archivar sin regularizar, no deja continuar sin límite de tiempo y no se traduce en pedir una nueva declaración."
  citation: "art. 133.1 LGT"
  difficulty: 2
  tags:
  - "verificación de datos"
  - "caducidad"
# anchor: boe-a-2003-23186-art-133
- id: m03-l07-q0113
  prompt:
    es: "Conforme al artículo 133.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento de verificación de datos terminará por el inicio de un procedimiento de comprobación limitada o de inspección que:"
  options:
  - id: a
    text:
      es: "afecte a otro obligado tributario relacionado con el declarante."
  - id: b
    text:
      es: "se refiera a un periodo impositivo distinto del verificado."
  - id: c
    text:
      es: "se haya acordado tras la notificación de la liquidación provisional."
  - id: d
    correct: true
    text:
      es: "incluya el objeto del procedimiento de verificación de datos."
  explanation:
    es: "La verificación termina cuando se inicia una comprobación limitada o una inspección que incluya su objeto (art. 133.1.e). Un procedimiento sobre otro obligado, otro periodo o posterior a la liquidación no cumple esa condición."
  citation: "art. 133.1 LGT"
  difficulty: 2
  tags:
  - "verificación de datos"
  - "terminación"
# anchor: boe-a-2003-23186-art-133
- id: m03-l07-q0115
  prompt:
    es: "Tras un procedimiento de verificación de datos sobre la declaración de Ramón Ibarra, que terminó corrigiendo un error aritmético, la Administración quiere iniciar después un procedimiento de comprobación limitada sobre el mismo objeto. Según el artículo 133.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede hacerlo?"
  options:
  - id: a
    text:
      es: "Sí, pero solo si transcurre un año desde la terminación de la verificación de datos y la notificación de la resolución."
  - id: b
    correct: true
    text:
      es: "Sí, porque la verificación de datos no impide la posterior comprobación del objeto de la misma."
  - id: c
    text:
      es: "No, salvo que la verificación hubiera terminado por caducidad del procedimiento."
  - id: d
    text:
      es: "Sí, pero solo mediante un procedimiento de comprobación de valores."
  explanation:
    es: "La verificación de datos no impide comprobar después su objeto (art. 133.2), sin esperar un año ni depender de la forma de terminación. Tampoco limita la comprobación posterior a la de valores."
  citation: "art. 133.2 LGT"
  difficulty: 2
  tags:
  - "verificación de datos"
  - "comprobación posterior"
# anchor: boe-a-2007-15984-art-155
- id: m03-l07-q0117
  prompt:
    es: "De acuerdo con el artículo 155.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, antes de la resolución que corrija los defectos o de la liquidación provisional, la Administración notifica la propuesta para que el obligado alegue en un plazo de:"
  options:
  - id: a
    text:
      es: "10 días, contados a partir del día siguiente al de la finalización de las actuaciones."
  - id: b
    correct: true
    text:
      es: "10 días, contados a partir del día siguiente al de la notificación de la propuesta."
  - id: c
    text:
      es: "un mes, contado a partir del día siguiente al de la notificación de la propuesta."
  - id: d
    text:
      es: "15 días, contados a partir del día siguiente al de la notificación de la propuesta."
  explanation:
    es: "El plazo de alegaciones de la verificación de datos es de 10 días desde el día siguiente a la notificación de la propuesta (art. 155.3 RGAT). Quince días son los de la rectificación de autoliquidaciones, y ni el fin de las actuaciones ni el mes son el cómputo de este trámite."
  citation: "art. 155.3 RGAT"
  difficulty: 1
  tags:
  - "verificación de datos"
  - "plazos"
# anchor: boe-a-2007-15984-art-156
- id: m03-l07-q0118
  prompt:
    es: "¿Qué se hace constar y qué no hace falta dictar cuando la verificación de datos termina por subsanación del obligado, según el artículo 156.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    correct: true
    text:
      es: "Se hace constar en diligencia y no es necesario dictar resolución expresa."
  - id: b
    text:
      es: "Se hace constar en diligencia y es necesario dictar resolución expresa de archivo."
  - id: c
    text:
      es: "Se hace constar en resolución y es necesario notificar una liquidación provisional."
  - id: d
    text:
      es: "Se hace constar en acta y no es necesario notificar nada al obligado tributario."
  explanation:
    es: "Si el obligado subsana, aclara o justifica, basta una diligencia que lo recoja y no hay que dictar resolución expresa (art. 156.1). Las demás opciones exigen resolución, liquidación o acta, que el artículo no prevé en este caso."
  citation: "art. 156.1 RGAT"
  difficulty: 1
  tags:
  - "verificación de datos"
  - "terminación"
# anchor: boe-a-2003-23186-art-131
- id: m03-l07-q0121
  prompt:
    es: "¿Cuál de las siguientes situaciones NO permite iniciar un procedimiento de verificación de datos, según el artículo 131 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Que los datos declarados no coincidan con los que obran en poder de la Administración."
  - id: b
    text:
      es: "Que la declaración adolezca de defectos formales."
  - id: c
    text:
      es: "Que se aprecie una aplicación indebida de la normativa patente en la propia declaración."
  - id: d
    correct: true
    text:
      es: "Que la Administración deba examinar la contabilidad del obligado para comprobar la veracidad de las operaciones declaradas."
  explanation:
    es: "El examen de la contabilidad no figura entre los supuestos del artículo 131 y es propio de otros procedimientos, como la comprobación limitada. Los defectos formales, la discrepancia de datos y la aplicación indebida patente sí son supuestos de verificación (letras a, b y c)."
  citation: "art. 131 LGT"
  difficulty: 2
  tags:
  - "verificación de datos"
  - "supuestos"
