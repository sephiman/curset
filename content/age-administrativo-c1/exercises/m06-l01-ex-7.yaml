# anchor: fuente-ms-win-tolerancia-errores-html
- id: m06-l01-q212
  prompt:
    es: "¿Cuál de los siguientes niveles de RAID se parece más a la creación de reflejo de Espacios de almacenamiento directo de Windows Server, según Microsoft?"
  options:
  - id: a
    text:
      es: "RAID-0."
  - id: b
    correct: true
    text:
      es: "RAID-1."
  - id: c
    text:
      es: "RAID-5."
  - id: d
    text:
      es: "RAID-6."
  explanation:
    es: "La página dice que la creación de reflejo mantiene varias copias de todos los datos y que «esto se parece más a RAID-1». RAID-5 es el parecido que da la página a la paridad única, que mantiene un solo símbolo de paridad. RAID-6 es el de la paridad dual, que mantiene dos. Y RAID-0 no es el parecido de ninguna de las resiliencias que la página compara: ni del reflejo ni de la paridad."
  citation: "fuente: `ms-win-tolerancia-errores.html`; «Tolerancia a errores y eficiencia del almacenamiento en clústeres de Azure Local y Windows Server»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-tolerancia-errores-html
- id: m06-l01-q213
  prompt:
    es: "¿Cuál de los siguientes tipos de resistencia de Espacios de almacenamiento directo de Windows Server se parece más a RAID-5, según la documentación de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "La paridad única."
  - id: b
    text:
      es: "El reflejo bidireccional."
  - id: c
    text:
      es: "La paridad dual."
  - id: d
    text:
      es: "La paridad acelerada por reflejo."
  explanation:
    es: "La página dice de la paridad única, que mantiene un solo símbolo de paridad bit a bit, que «se parece más a RAID-5». La página compara la creación de reflejo con RAID-1, no con RAID-5. La página compara la paridad dual con RAID-6, no con RAID-5. La página describe la paridad acelerada por reflejo como una combinación de reflejo y paridad, sin compararla con RAID-5."
  citation: "fuente: `ms-win-tolerancia-errores.html`; «Tolerancia a errores y eficiencia del almacenamiento en clústeres de Azure Local y Windows Server»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-tolerancia-errores-html
- id: m06-l01-q214
  prompt:
    es: "Según la documentación de Microsoft, la paridad dual de Espacios de almacenamiento directo mantiene este número de símbolos de paridad bit a bit:"
  options:
  - id: a
    text:
      es: "Uno."
  - id: b
    correct: true
    text:
      es: "Dos."
  - id: c
    text:
      es: "Tres."
  - id: d
    text:
      es: "Cuatro."
  explanation:
    es: "La paridad dual implementa códigos Reed-Solomon «para mantener dos símbolos de paridad bit a bit». La paridad que mantiene un solo símbolo es la paridad única, no la dual. La página dice que la paridad dual mantiene dos símbolos, no tres. La página dice que la paridad dual mantiene dos símbolos; cuatro es su mínimo de dominios de error de hardware."
  citation: "fuente: `ms-win-tolerancia-errores.html`; «Tolerancia a errores y eficiencia del almacenamiento en clústeres de Azure Local y Windows Server»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-win-tolerancia-errores-html
- id: m06-l01-q215
  prompt:
    es: "¿Cuál de las siguientes cifras es la eficacia de almacenamiento del reflejo bidireccional en Espacios de almacenamiento directo, según la documentación de Microsoft?"
  options:
  - id: a
    text:
      es: "El 33,3 por ciento."
  - id: b
    text:
      es: "El 66,7 por ciento."
  - id: c
    correct: true
    text:
      es: "El 50 por ciento."
  - id: d
    text:
      es: "El 80 por ciento."
  explanation:
    es: "El reflejo bidireccional escribe dos copias de todo y su eficacia de almacenamiento es del 50 por ciento: para escribir 1 TB de datos se necesitan al menos 2 TB de capacidad física. La eficacia del 33,3 % es la del reflejo triple, que escribe tres copias. La eficacia del 66,7 % es la de la paridad dual con siete dominios de error, no la del reflejo bidireccional. El 80 % es el máximo de la paridad dual, no la eficacia del reflejo bidireccional."
  citation: "fuente: `ms-win-tolerancia-errores.html`; «Tolerancia a errores y eficiencia del almacenamiento en clústeres de Azure Local y Windows Server»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-win-tolerancia-errores-html
- id: m06-l01-q216
  prompt:
    es: "¿Cuántos dominios de error de hardware necesita como mínimo el reflejo triple de Espacios de almacenamiento directo, según la documentación de Microsoft?"
  options:
  - id: a
