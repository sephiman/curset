# anchor: fuente-ms-win-bloc-notas-html
- id: m06-l03-q275
  prompt:
    es: "En el Bloc de notas de Windows 11, ¿cómo se imprime un encabezado si el código de formato no es el primer elemento del cuadro de texto Encabezado?"
  options:
  - id: a
    text:
      es: "Alineado a la izquierda, con el primer código que se escriba"
  - id: b
    text:
      es: "Alineado a la derecha, con el último código que se escriba"
  - id: c
    text:
      es: "Sin imprimirse, hasta que el código vaya el primero"
  - id: d
    correct: true
    text:
      es: "Centrado, con independencia de los códigos de formato que se usen"
  explanation:
    es: "La nota de la página dice que, si el código de formato no es el primer elemento del cuadro de texto Encabezado, el encabezado está centrado independientemente de los códigos de formato que se usen. Por eso las otras opciones, que lo alinean o lo omiten, contradicen la nota."
  citation: "fuente: `ms-win-bloc-notas.html`; «Cómo cambio el encabezado y el pie de página en el Bloc de notas»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-paint-html
- id: m06-l03-q301
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde a Paint en Windows 11, según la página de Microsoft sobre esta aplicación?"
  options:
  - id: a
    correct: true
    text:
      es: "Una aplicación de edición gráfica para crear y editar imágenes y dibujos"
  - id: b
    text:
      es: "Una aplicación para capturar la pantalla y compartir las capturas con otras personas"
  - id: c
    text:
      es: "Un editor de texto sin formato para archivos con extensión .txt"
  - id: d
    text:
      es: "Una aplicación de cálculo con modos científico y de gráficos"
  explanation:
    es: "La página dice que Paint es una app de edición gráfica versátil y fácil de usar para crear, editar y manipular imágenes y dibujos. Capturar la pantalla es lo que hace Recortes, el texto sin formato es del Bloc de notas y los modos científico y de gráficos son de la Calculadora."
  citation: "fuente: `ms-win-paint.html`; «¿Qué es Paint?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-paint-html
- id: m06-l03-q302
  prompt:
    es: "¿Cuál de las siguientes tareas es propia de Paint, según la página de Microsoft sobre esta aplicación de Windows 11?"
  options:
  - id: a
    text:
      es: "Calcular diferencias entre dos fechas y convertir unidades y monedas"
  - id: b
    text:
      es: "Programar alarmas y temporizadores que suenan con la aplicación cerrada"
  - id: c
    text:
      es: "Grabar un vídeo de una selección rectangular de la pantalla y editarlo en Clipchamp"
  - id: d
    correct: true
    text:
      es: "Recortar y cambiar el tamaño de imágenes, dibujar y añadir formas y texto"
  explanation:
    es: "La página dice que Paint es ideal para el recorte, el cambio de tamaño y el dibujo sencillos, así como para añadir formas básicas y texto a las imágenes. Calcular fechas y convertir monedas es de la Calculadora, las alarmas y los temporizadores son del Reloj y grabar un recorte de vídeo es de Recortes."
  citation: "fuente: `ms-win-paint.html`; «¿Qué es Paint?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-paint-html
- id: m06-l03-q304
  prompt:
    es: "Señale la afirmación correcta sobre Paint en Windows 11, según la página de Microsoft sobre esta aplicación:"
  options:
  - id: a
    text:
      es: "Se compra por separado en Microsoft Store con licencia"
  - id: b
    correct: true
    text:
      es: "Se incluye en Windows, sin necesidad de comprarla por separado"
  - id: c
    text:
      es: "Es una función de la herramienta Recortes y no una aplicación"
  - id: d
    text:
      es: "Solo se incluye en las ediciones de Windows para administradores"
  explanation:
    es: "La página dice que Paint se incluye en Windows. Comprarlo por separado, que sea una función de Recortes o que solo venga en ediciones para administradores contradice esa frase, y la propia página lo presenta como una app de edición gráfica de Windows."
  citation: "fuente: `ms-win-paint.html`; «¿Cuánto cuesta Paint?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-reloj-html
- id: m06-l03-q315
  prompt:
    es: "En la aplicación Reloj de Windows 11, si se cierra la aplicación o se bloquea el dispositivo, las alarmas y los temporizadores:"
  options:
  - id: a
    text:
      es: "se pausan hasta que se vuelve a abrir la aplicación"
  - id: b
    correct: true
    text:
      es: "siguen funcionando"
  - id: c
    text:
      es: "solo suenan si el dispositivo está desbloqueado"
  - id: d
    text:
      es: "se cancelan y hay que crearlos de nuevo"
  explanation:
    es: "La página dice que las alarmas y los temporizadores funcionan incluso si la aplicación está cerrada o si el dispositivo está bloqueado. Pausarse, sonar solo con el dispositivo desbloqueado o cancelarse contradicen esa frase."
  citation: "fuente: `ms-win-reloj.html`; «Reloj»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-reloj-html
- id: m06-l03-q318
  prompt:
    es: "¿Cuál de las siguientes opciones permite responder a una alarma de la aplicación Reloj de Windows 11 deteniéndola por completo?"
  options:
  - id: a
    text:
      es: "Posponer"
  - id: b
    text:
      es: "Temporizador"
  - id: c
    text:
      es: "Alarma"
  - id: d
    correct: true
    text:
      es: "Descartar"
  explanation:
    es: "La página dice que, para responder a una alarma, se selecciona Posponer o Descartar la alarma para detenerla por completo. Posponer la retrasa, y Temporizador y Alarma son las dos opciones de la aplicación para crear avisos."
  citation: "fuente: `ms-win-reloj.html`; «Reloj»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-reloj-html
- id: m06-l03-q319
  prompt:
    es: "En Windows 11, si aparece una advertencia de que las notificaciones del Reloj solo se muestran si el dispositivo está activo, ¿qué hay que asegurar?"
  options:
  - id: a
    text:
      es: "Que la aplicación Reloj esté abierta en primer plano"
  - id: b
    text:
      es: "Que el volumen del dispositivo esté en silencio"
  - id: c
    correct: true
    text:
      es: "Que el dispositivo no vaya a suspensión"
  - id: d
    text:
      es: "Que el dispositivo no esté conectado a la corriente"
  explanation:
    es: "La página dice que, ante esa advertencia, hay que asegurarse de que el dispositivo no vaya a suspensión, y que conviene mantener el portátil o la tableta enchufados y con el volumen lo bastante alto para oír la alarma. Por eso un volumen en silencio o no estar enchufado van en sentido contrario, y la aplicación funciona aunque esté cerrada."
  citation: "fuente: `ms-win-reloj.html`; «Reloj»"
