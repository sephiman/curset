# anchor: boe-a-1986-1216-art-20
- id: m04-l06-q156
  prompt:
    es: "Un funcionario cometió una falta leve el lunes, 20 de octubre de 2025, conocida por su jefe el lunes, 3 de noviembre de 2025. Según el artículo 20.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿qué día vence la prescripción de la falta?"
  options:
  - id: a
    correct: true
    text:
      es: "El jueves, 20 de noviembre de 2025."
  - id: b
    text:
      es: "El miércoles, 3 de diciembre de 2025."
  - id: c
    text:
      es: "El lunes, 20 de abril de 2026."
  - id: d
    text:
      es: "El martes, 20 de octubre de 2026."
  explanation:
    es: "En el Reglamento las faltas leves prescriben «al mes», contado «desde que la falta se hubiere cometido» (artículo 20.1). Los plazos en meses y años se cuentan de fecha a fecha: del lunes, 20 de octubre de 2025 al jueves, 20 de noviembre de 2025. Contar desde que el jefe la conoce da el miércoles, 3 de diciembre de 2025. Seis meses es el plazo de las faltas leves en el Estatuto Básico. Un año es el de las sanciones por falta leve en el Estatuto."
  citation: "art. 20.1 RD 33/1986"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-97
- id: m04-l06-q159
  prompt:
    es: "Una funcionaria comete una falta muy grave continuada desde el lunes, 12 de enero de 2026, hasta el lunes, 15 de junio de 2026, en que cesa. Según el artículo 97 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué día vence el plazo de prescripción?"
  options:
  - id: a
    text:
      es: "El jueves, 15 de junio de 2028."
  - id: b
    text:
      es: "El viernes, 12 de enero de 2029."
  - id: c
    correct: true
    text:
      es: "El viernes, 15 de junio de 2029."
  - id: d
    text:
      es: "El martes, 15 de junio de 2032."
  explanation:
    es: "Las infracciones muy graves prescriben a los tres años (artículo 97.1), y en las continuadas el plazo corre «desde el cese de su comisión» (artículo 97.2). Los plazos en meses y años se cuentan de fecha a fecha: del lunes, 15 de junio de 2026 al viernes, 15 de junio de 2029. Contar desde el primer acto da el viernes, 12 de enero de 2029. Dos años es el plazo de las faltas graves. Seis años es el plazo de las muy graves en el Reglamento de Régimen Disciplinario de 1986."
  citation: "art. 97.2 TREBEP"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2015-11719-art-97
- id: m04-l06-q162
  prompt:
    es: "Según el artículo 97.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la sanción impuesta por la falta muy grave de publicar indebidamente información conocida por razón del cargo prescribe:"
  options:
  - id: a
    text:
      es: "A los seis años."
  - id: b
    text:
      es: "A los dos años."
  - id: c
    correct: true
    text:
      es: "A los tres años."
  - id: d
    text:
      es: "Al año."
  explanation:
    es: "El artículo 97.1 del Estatuto dice que las sanciones impuestas por faltas muy graves prescriben a los tres años. Los seis años son el plazo del Reglamento de 1986 para esas sanciones, no el del Estatuto. Los dos años son el plazo de las sanciones por faltas graves y el año el de las impuestas por faltas leves."
  citation: "art. 97.1 TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-96
- id: m04-l06-q164
  prompt:
    es: "Un empleado laboral publica indebidamente documentación de su cargo, falta muy grave. Según el artículo 96.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué sanción reservada a faltas muy graves puede imponérsele?"
  options:
  - id: a
    text:
      es: "Separación del servicio, con revocación de su nombramiento."
  - id: b
    text:
      es: "Demérito en la carrera, la promoción o la movilidad voluntaria."
  - id: c
    text:
      es: "Traslado forzoso a otra localidad de residencia."
  - id: d
    correct: true
    text:
      es: "Despido disciplinario, con inhabilitación para un nuevo contrato similar."
  explanation:
    es: "El artículo 96.1.b) prevé el despido disciplinario del personal laboral, que solo puede sancionar faltas muy graves y comporta la inhabilitación para un nuevo contrato de trabajo con funciones similares. La separación del servicio es la sanción de los funcionarios, no la del personal laboral. El demérito y el traslado forzoso no están reservados a las faltas muy graves en el Estatuto."
  citation: "art. 96.1.b) TREBEP"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1986-1216-art-16
- id: m04-l06-q165
  prompt:
    es: "Según el artículo 16 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿por cuál de las siguientes faltas puede imponerse la sanción de suspensión de funciones?"
  options:
  - id: a
    text:
      es: "La falta de asistencia injustificada de un día."
  - id: b
    correct: true
    text:
      es: "El atentado grave a la dignidad de los funcionarios o de la Administración."
  - id: c
    text:
      es: "La incorrección con el público, superiores, compañeros o subordinados."
  - id: d
    text:
      es: "El incumplimiento injustificado del horario de trabajo, cuando no suponga falta grave."
  explanation:
    es: "El artículo 16 permite la suspensión de funciones por faltas graves o muy graves, y el atentado grave a la dignidad es falta grave del artículo 7.1. La falta de asistencia de un día, la incorrección y el incumplimiento del horario que no es grave son faltas leves del artículo 8, y las leves solo se corrigen con las sanciones que señala el artículo 17."
  citation: "art. 16 RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-16
- id: m04-l06-q167
  prompt:
    es: "Un funcionario es sancionado con suspensión de funciones por abuso de autoridad, falta grave. Según el artículo 16 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿cuál es la duración máxima de esa suspensión?"
  options:
  - id: a
    correct: true
    text:
      es: "Tres años."
  - id: b
    text:
      es: "Seis años."
  - id: c
    text:
      es: "Dos años."
  - id: d
    text:
      es: "Un año."
  explanation:
    es: "El artículo 16 dice que la suspensión impuesta por falta grave no excederá de tres años. Los seis años son el máximo de la suspensión por falta muy grave, que además no puede bajar de tres. Dos años y un año no figuran en el artículo."
  citation: "art. 16 RD 33/1986"
  difficulty: 2
  tags:
  - "plazo"
  - "cantidad"
# anchor: boe-a-1986-1216-art-16
- id: m04-l06-q168
  prompt:
    es: "Un funcionario es trasladado con cambio de residencia por abuso de autoridad, falta grave. Según el artículo 16 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿cuánto tiempo no podrá obtener destino en esa localidad?"
  options:
  - id: a
    text:
      es: "Tres años."
  - id: b
    text:
      es: "Seis meses."
  - id: c
    text:
      es: "Dos años."
  - id: d
    correct: true
    text:
      es: "Un año."
  explanation:
    es: "El artículo 16 fija esa prohibición en un año cuando la sanción correspondió a una falta grave, y en tres años cuando fue por falta muy grave; el plazo se cuenta desde el traslado. Los tres años serían los de una falta muy grave. Seis meses y dos años no figuran en el artículo."
  citation: "art. 16 RD 33/1986"
  difficulty: 3
  tags:
  - "plazo"
  - "cantidad"
# anchor: boe-a-1986-1216-art-7
- id: m04-l06-q169
  prompt:
    es: "¿Cuál de las siguientes conductas es falta grave según el artículo 7.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "La incorrección con el público, superiores, compañeros o subordinados."
  - id: b
    correct: true
    text:
      es: "El abuso de autoridad en el ejercicio del cargo."
  - id: c
    text:
      es: "El descuido o negligencia en el ejercicio de sus funciones."
  - id: d
    text:
      es: "La falta de asistencia injustificada de un día."
  explanation:
    es: "El abuso de autoridad en el ejercicio del cargo es la falta grave de la letra b) del artículo 7.1. La incorrección, el descuido o negligencia y la falta de asistencia de un día son faltas leves del artículo 8."
  citation: "art. 7.1 RD 33/1986"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-20
- id: m04-l06-q170
  prompt:
    es: "Según el artículo 20.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿en cuánto prescribe la falta de incumplir los plazos de procedimiento en materia de incompatibilidades sin mantener una situación de incompatibilidad?"
  options:
  - id: a
    text:
      es: "Al mes."
  - id: b
    text:
      es: "A los seis años."
  - id: c
    correct: true
    text:
      es: "A los dos años."
  - id: d
    text:
      es: "A los seis meses."
  explanation:
    es: "Esa conducta es falta grave según el artículo 7.1.k), y el artículo 20.1 dice que las faltas graves prescriben a los dos años. El mes es el plazo de las faltas leves y los seis años el de las muy graves. Los seis meses son el plazo del Estatuto Básico del Empleado Público para las leves, no el de este Reglamento."
  citation: "art. 20.1 RD 33/1986"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-95
- id: m04-l06-q171
  prompt:
    es: "Según el artículo 95.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, es falta muy grave el incumplimiento del deber de respeto a la Constitución y a:"
  options:
  - id: a
    correct: true
    text:
      es: "Los respectivos Estatutos de Autonomía de las comunidades autónomas y ciudades de Ceuta y Melilla."
  - id: b
    text:
      es: "Las leyes de las Cortes Generales y de las asambleas legislativas autonómicas."
  - id: c
    text:
      es: "Los tratados internacionales ratificados por España y el Derecho de la Unión Europea."
  - id: d
    text:
      es: "Los reglamentos y las ordenanzas dictados por las entidades locales de su territorio."
  explanation:
    es: "La letra a) del artículo 95.2 habla del deber de respeto a la Constitución y a los respectivos Estatutos de Autonomía, incluidos los de Ceuta y Melilla. No menciona las leyes, los tratados internacionales ni las normas locales."
  citation: "art. 95.2.a) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-95
- id: m04-l06-q172
  prompt:
    es: "Según el artículo 95.2.b) del texto refundido de la Ley del Estatuto Básico del Empleado Público, además de toda actuación que suponga discriminación, es falta muy grave:"
  options:
  - id: a
    text:
      es: "La grave falta de consideración con los administrados."
  - id: b
    text:
      es: "La incorrección con el público, superiores, compañeros o subordinados."
  - id: c
    text:
      es: "La grave perturbación del servicio."
  - id: d
    correct: true
    text:
      es: "El acoso moral y sexual, y el acoso por razón de sexo o de origen racial o étnico."
  explanation:
    es: "La letra b) del artículo 95.2 incluye, junto a la discriminación, el acoso por razón de sexo, de origen racial o étnico y otras causas, y el acoso moral y sexual. La falta de consideración con los administrados y la perturbación del servicio son faltas graves del Reglamento de 1986, y la incorrección es una falta leve de ese mismo Reglamento."
  citation: "art. 95.2.b) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-95
- id: m04-l06-q173
  prompt:
    es: "Según el artículo 95.2.c) del texto refundido de la Ley del Estatuto Básico del Empleado Público, además del abandono del servicio, es falta muy grave:"
  options:
  - id: a
    text:
      es: "La falta de rendimiento que afecte al normal funcionamiento de los servicios."
  - id: b
    correct: true
    text:
      es: "No hacerse cargo voluntariamente de las tareas o funciones encomendadas."
  - id: c
    text:
      es: "El incumplimiento injustificado de la jornada de trabajo durante diez horas al mes."
  - id: d
    text:
      es: "La falta de asistencia injustificada de un día."
  explanation:
    es: "La letra c) del artículo 95.2 une al abandono del servicio el no hacerse cargo voluntariamente de las tareas o funciones encomendadas. La falta de rendimiento y el incumplimiento de la jornada de diez horas al mes son faltas graves del Reglamento de 1986, y la ausencia de un día es falta leve de ese Reglamento."
  citation: "art. 95.2.c) TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-7
- id: m04-l06-q175
  prompt:
    es: "¿Cuál de las siguientes conductas es falta grave según el artículo 7.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "La falta de obediencia debida a los superiores y autoridades."
  - id: b
    text:
      es: "El incumplimiento injustificado del horario de trabajo, cuando no suponga falta grave."
  - id: c
    text:
      es: "El incumplimiento de los deberes del funcionario, si no es falta muy grave o grave."
  - id: d
    text:
      es: "La incorrección con el público, superiores, compañeros o subordinados."
  explanation:
    es: "La falta de obediencia debida a los superiores y autoridades es la falta grave de la letra a) del artículo 7.1. Las otras tres conductas son faltas leves del artículo 8."
  citation: "art. 7.1 RD 33/1986"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-7
- id: m04-l06-q176
  prompt:
    es: "¿Cuál de las siguientes conductas es falta grave según el artículo 7.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "La incorrección con el público, superiores, compañeros o subordinados."
  - id: b
    text:
      es: "El incumplimiento injustificado del horario de trabajo, cuando no suponga falta grave."
  - id: c
    text:
      es: "La falta de asistencia injustificada de un día."
