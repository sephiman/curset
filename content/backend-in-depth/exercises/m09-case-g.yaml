type: case
title:
  en: Agentic diagnostics platform and enterprise AI gateway
scenario:
  en: 'A cloud company builds an internal platform in which diagnostic agents investigate production incidents.
    An agent reads alerts, fetches logs and dashboards, and proposes a fix to the on-call engineer. The agents reach
    internal systems through tools exposed by Model Context Protocol (MCP) servers, and all calls to language models
    and to tools go through one enterprise AI gateway.


    The gateway has to enforce the company''s rules in one place:


    - Tool access. Agents call tools with `tools/call` requests. The MCP servers use an HTTP-based transport, so
    the access token is checked on every request, and a call that needs more permission gets a scope challenge.

    - An MCP proxy. One proxy server fronts a third-party ticketing API for all agents, using a static client ID
    and a consent screen, so it must guard against confused deputy attacks and token passthrough.

    - Content risks. Agents read logs, tickets and web pages written by others. Hidden instructions in that content
    could steer the model, and sensitive data such as personal data must not leak through answers.

    - Verification. The security team plans adversarial testing of the whole chain.'
questions:
- id: m09-case-g-q01
  lesson: m10-l04
  prompt:
    en: A diagnostics agent calls an MCP server that uses an HTTP-based transport and needs to present its access
      token on each request. Where must the MCP client place the access token?
  options:
  - id: a
    correct: true
    text:
      en: In the `Authorization` header as a `Bearer` token
  - id: b
    text:
      en: In the query string of the request URI
  - id: c
    text:
      en: In the first request only, since the session then stays authorized
  - id: d
    text:
      en: In a `Cookie` header that the server sets after the first call
  explanation:
    en: 'An MCP client must send the access token in the `Authorization` request header as `Authorization: Bearer
      <access-token>`. The URI query string is wrong, because access tokens must not be included in the URI query
      string. Sending it once is wrong, because authorization must be included in every HTTP request from client
      to server. A `Cookie` header is wrong, because the client must send the token as `Authorization: Bearer <access-token>`.'
  citation: mcp-authorization#token-requirements
- id: m09-case-g-q02
  lesson: m10-l04
  prompt:
    en: An AI gateway holds a token for an MCP server and gets a scope challenge for one more operation. When it
      re-authorizes, which scopes should the MCP client include in its request?
  options:
  - id: a
    correct: true
    text:
      en: The challenged scopes together with the scopes already granted
  - id: b
    text:
      en: Only the challenged scopes, replacing the earlier grant
  - id: c
    text:
      en: The whole `scopes_supported` list instead of the challenge
  - id: d
    text:
      en: No scope, reusing the token it already has
  explanation:
    en: When re-authorizing, clients should include the challenged scopes alongside any previously granted scopes
      to avoid losing permissions needed for other operations. Only the challenged scopes is wrong, because including
      the earlier scopes avoids losing permissions needed for other operations. The whole list is wrong, because
      clients must treat the scopes provided in the challenge as authoritative for the current operation. Reusing
      the token is wrong, because scope challenge handling covers insufficient scope errors where a client holds
      a token but needs additional permissions.
  citation: mcp-authorization#scope-selection-strategy
- id: m09-case-g-q03
  lesson: m10-l04
  prompt:
    en: An MCP client receives a `401` response with no `scope` parameter in `WWW-Authenticate`, and the Protected
      Resource Metadata document does not define `scopes_supported`. What should the client do?
  options:
  - id: a
    text:
      en: Send an empty `scope` value in its authorization request
  - id: b
    correct: true
    text:
      en: Omit the `scope` parameter
  - id: c
    text:
      en: Request every scope that it knows from earlier sessions
  - id: d
    text:
      en: Stop the authorization flow and report an error
  explanation:
    en: If no `scope` is available, the client should use all scopes in `scopes_supported`, and omit the `scope`
      parameter if `scopes_supported` is undefined. An empty `scope` value is wrong, because the client should omit
      the `scope` parameter if `scopes_supported` is undefined. Requesting every known scope is wrong, because the
      client should omit the `scope` parameter when `scopes_supported` is undefined. Stopping the flow is wrong,
      because the client should omit the `scope` parameter and carry on.
  citation: mcp-authorization#scope-selection-strategy
- id: m09-case-g-q05
  lesson: m10-l04
  prompt:
    en: An MCP server accepts a token sent by a client and forwards it unchanged to a downstream API, without checking
      that the token was issued to the MCP server itself. What does the MCP security guidance call this?
  options:
  - id: a
    correct: true
    text:
      en: Token passthrough, an anti-pattern
  - id: b
    text:
      en: Step-up authorization, which requests extra scopes
  - id: c
    text:
      en: Scope challenge handling after insufficient scope
  - id: d
    text:
      en: A static client ID shared by all clients
  explanation:
    en: “Token passthrough” is an anti-pattern where an MCP server accepts tokens from an MCP client without validating
      that they were issued to the MCP server. Step-up authorization is wrong, because it is the flow through which
      additional scopes are requested incrementally. Scope challenge handling is wrong, because it covers insufficient
      scope errors during runtime operations. A static client ID is wrong, because it is a fixed OAuth client identifier
      that the MCP proxy server uses with the third-party authorization server.
  citation: mcp-security-best-practices#token-passthrough
- id: m09-case-g-q06
  lesson: m10-l04
  prompt:
    en: An MCP proxy server checks the `redirect_uri` of each authorization request against the registered URI.
      How must the comparison be made, according to the MCP security guidance?
  options:
  - id: a
    text:
      en: By prefix matching against the registered URI
  - id: b
    text:
      en: By wildcard matching on the host name
  - id: c
    correct: true
    text:
      en: By exact string matching
  - id: d
    text:
      en: By regular expression supplied by the client
  explanation:
    en: The `redirect_uri` comparison must use exact string matching, not pattern matching or wildcards. Prefix
      matching is wrong, because the comparison must use exact string matching, not pattern matching or wildcards.
      Wildcard matching is wrong, because the comparison must use exact string matching, not pattern matching or
      wildcards. A client regular expression is wrong, because the comparison must use exact string matching, not
      pattern matching.
  citation: mcp-security-best-practices#required-protections
- id: m09-case-g-q07
  lesson: m10-l04
  prompt:
    en: An MCP proxy server stores a consent cookie after the user approves a client. Which attributes must the
      consent cookie set, according to the MCP security best practices?
  options:
  - id: a
    text:
      en: '`Secure` and `SameSite=None`'
  - id: b
    text:
      en: '`HttpOnly` only, without `Secure`'
  - id: c
    correct: true
    text:
      en: '`Secure`, `HttpOnly` and `SameSite=Lax`'
  - id: d
    text:
      en: '`Secure` with `SameSite=Lax`, readable from scripts'
  explanation:
    en: A consent cookie must set the `Secure`, `HttpOnly` and `SameSite=Lax` attributes. `SameSite=None` is wrong,
      because the consent cookie must set `Secure`, `HttpOnly` and `SameSite=Lax`. `HttpOnly` alone is wrong, because
      the consent cookie must also set `Secure` and `SameSite=Lax`. A cookie readable from scripts is wrong, because
      it must set `HttpOnly` too.
  citation: mcp-security-best-practices#required-protections
- id: m09-case-g-q08
  lesson: m10-l04
  prompt:
    en: An MCP proxy server generates a `state` value for each authorization request it starts. Which handling of
      `state` values do the MCP security best practices require?
  options:
  - id: a
    text:
      en: Reusable for 24 hours, then deleted by a nightly job
  - id: b
    text:
      en: Reusable until the user logs out of the proxy
  - id: c
    correct: true
    text:
      en: Single-use, deleted after validation, with a short expiry such as 10 minutes
  - id: d
    text:
      en: Single-use, but valid for a full day
  explanation:
    en: '`state` values must be single-use, deleted after validation, and have a short expiration time such as 10
      minutes. Reuse for 24 hours is wrong, because `state` values must be single-use and have a short expiration
      time such as 10 minutes. Reuse until the user logs out of the proxy is wrong, because `state` values must
      be single-use and deleted after validation. A full day is wrong, because `state` values must have a short
      expiration time such as 10 minutes.'
  citation: mcp-security-best-practices#required-protections
- id: m09-case-g-q10
  lesson: m09-l04
  prompt:
    en: An AI gateway uses Retrieval Augmented Generation (RAG) and a fine-tuned model to defend against prompt
      injection. According to OWASP, what does research show about these two measures?
  options:
  - id: a
    text:
      en: RAG fully mitigates it, but fine-tuning does not
  - id: b
    correct: true
    text:
      en: They do not fully mitigate prompt injection
  - id: c
    text:
      en: Fine-tuning fully mitigates it, but RAG does not
  - id: d
    text:
      en: Together they fully mitigate it
  explanation:
    en: Research shows that RAG and fine-tuning do not fully mitigate prompt injection vulnerabilities. RAG alone
      fully mitigating is wrong, because research shows RAG and fine-tuning do not fully mitigate prompt injection
      vulnerabilities. Fine-tuning alone fully mitigating is wrong, because research shows RAG and fine-tuning do
      not fully mitigate prompt injection. Full mitigation together is wrong, because research shows RAG and fine-tuning
      do not fully mitigate prompt injection vulnerabilities.
  citation: owasp-llm-top10-prompt-injection#main
- id: m09-case-g-q12
  lesson: m10-l04
  prompt:
    en: A team builds an MCP server that is reached over an HTTP-based transport. According to the MCP authorization
      section, what should that implementation do about authorization?
  options:
  - id: a
    text:
      en: It should retrieve credentials from the environment
  - id: b
    correct: true
    text:
      en: It should conform to the MCP authorization specification
  - id: c
    text:
      en: It must implement authorization, which is mandatory
  - id: d
    text:
      en: It should follow only the security practices of its own protocol
  explanation:
    en: An MCP implementation that uses an HTTP-based transport should conform to the MCP authorization specification.
      Retrieving credentials from the environment is wrong, because that applies to an implementation that uses
      an STDIO transport. Mandatory authorization is wrong, because authorization is optional for MCP implementations.
      Following only its own protocol is wrong, because that applies to implementations using an alternative transport.
  citation: mcp-authorization#protocol-requirements
- id: m09-case-g-q13
  lesson: m10-l04
  prompt:
    en: A security team runs adversarial testing against an AI gateway that connects agents to internal tools. According
      to OWASP, how does adversarial testing treat the model?
  options:
  - id: a
    text:
      en: As a trusted administrator, to confirm that its access is sufficient
  - id: b
    text:
      en: As a read-only auditor, to confirm that logs are complete
  - id: c
    text:
      en: As a trusted component, to confirm that its output needs no checks
  - id: d
    correct: true
    text:
      en: As an untrusted user, to test trust boundaries and access controls
  explanation:
    en: Adversarial testing treats the model as an untrusted user to test the effectiveness of trust boundaries
      and access controls. A trusted administrator is wrong, because adversarial testing treats the model as an
      untrusted user. A read-only auditor is wrong, because adversarial testing treats the model as an untrusted
      user to test trust boundaries and access controls. A trusted component is wrong, because adversarial testing
      treats the model as an untrusted user.
  citation: owasp-llm-top10-prompt-injection#7-conduct-adversarial-testing-and-attack-simulations
- id: m09-case-g-q15
  lesson: m09-l04
  prompt:
    en: An MCP proxy server uses one static client ID with a third-party API for all of its users. Which value does
      that static client ID take across the MCP clients that use the proxy?
  options:
  - id: a
    text:
      en: A different value for each MCP client
  - id: b
    text:
      en: A different value for each user
  - id: c
    text:
      en: A new value for each session
  - id: d
    correct: true
    text:
      en: The same value for every MCP client
  explanation:
    en: The static client ID is the same value for all MCP server to third-party API interactions, regardless of
      which MCP client initiated the request. A different value per client is wrong, because the static client ID
      is the same value regardless of which MCP client initiated the request. A different value per user is wrong,
      because the static client ID is the same value for all interactions. A new value per session is wrong, because
      the static client ID is the same value for all interactions.
  citation: mcp-security-best-practices#terminology
