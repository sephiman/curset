# Generated by docs/backend-verification/s2/tools/build_case.py from m09-case-c.questions.json.
type: case
title:
  en: Multi-channel notification platform
scenario:
  en: 'A retail company sends order confirmations, shipping updates and marketing messages by email, SMS and mobile
    push. Business services publish notification requests to Kafka, and one consumer group per channel reads them
    and calls the external provider for that channel. Providers are slow and fail often, and a duplicated order
    confirmation annoys customers while a lost one raises support tickets.


    The team has to settle the following points:


    - Delivery semantics. Each consumer reads a batch, calls the provider and saves its position in the log. The
    order of those steps decides whether a failure loses messages or repeats them.

    - Retries. Failed sends are retried with a backoff, either in the client, with Resilience4j `Retry`, or as non-blocking
    retry and dead-letter topics in Spring for Apache Kafka.

    - Dead letters. For the RabbitMQ queue that carries SMS requests, messages that cannot be delivered must end
    in a dead letter exchange for inspection.

    - Idempotent requests. Business services call the notification API with an `Idempotency-Key` header, so a retried
    request never sends a second message.'
questions:
- id: m09-case-c-q02
  lesson: m09-l04
  prompt:
    en: A push-notification consumer reads messages from a Kafka partition, sends the notifications, and finally
      saves its position in the log. What semantics does it get when the consumer fails in between?
  options:
  - id: a
    text:
      en: At-most-once, because the position is saved after the work
  - id: b
    correct: true
    text:
      en: At-least-once
  - id: c
    text:
      en: Exactly-once, because Kafka makes every consumer idempotent
  - id: d
    text:
      en: At-most-once, because producer retries are off by default
  explanation:
    en: Processing the messages and saving the position last gives at-least-once semantics on a consumer failure.
      At-most-once is wrong, because that result comes from saving the position before processing the messages.
      Exactly-once is wrong, because exactly-once delivery to other destination systems generally requires cooperation
      with such systems. Default-off retries are wrong, because Kafka guarantees at-least-once delivery by default.
  citation: kafka-design#message-delivery-semantics
- id: m09-case-c-q05
  lesson: m09-l04
  prompt:
    en: A team using Spring for Apache Kafka wants non-blocking retry and dead-letter handling through the `@RetryableTopic`
      annotation. Since which version does Spring for Apache Kafka offer it?
  options:
  - id: a
    text:
      en: '3.2'
  - id: b
    correct: true
    text:
      en: '2.7'
  - id: c
    text:
      en: '2.2'
  - id: d
    text:
      en: '1.3'
  explanation:
    en: Since 2.7 Spring for Apache Kafka offers non-blocking retry and dead-letter support through `@RetryableTopic`
      and `RetryTopicConfiguration`. Version 3.2 is wrong, because support through `@RetryableTopic` has existed
      since 2.7. Version 2.2 is wrong, because support through `@RetryableTopic` arrived with 2.7. Version 1.3 is
      wrong, because support through `@RetryableTopic` arrived with 2.7.
  citation: spring-kafka-retrytopic#page-title
- id: m09-case-c-q07
  lesson: m08-l04
  prompt:
    en: A Kafka producer client in a notification service enables exponential retry backoff and sets no value for
      `retry.backoff.max.ms`. What is the default of `retry.backoff.max.ms`?
  options:
  - id: a
    text:
      en: 100 milliseconds
  - id: b
    text:
      en: 500 milliseconds
  - id: c
    text:
      en: 30000 milliseconds
  - id: d
    correct: true
    text:
      en: 1000 milliseconds
  explanation:
    en: The default of `retry.backoff.max.ms` is 1000, which is one second. 100 milliseconds is wrong, because the
      default of `retry.backoff.max.ms` is 1000. 500 milliseconds is wrong, because the default of `retry.backoff.max.ms`
      is 1000. 30000 milliseconds is wrong, because the default of `retry.backoff.max.ms` is 1000.
  citation: kafka-producer-configs#retry.backoff.max.ms
- id: m09-case-c-q08
  lesson: m08-l04
  prompt:
    en: A Kafka client retries a failed notification request with a computed backoff of 10,000 ms and the randomized
      jitter factor of 0.2 that Kafka applies. In which range does the actual backoff fall?
  options:
  - id: a
    text:
      en: Between 10,000 ms and 12,000 ms
  - id: b
    text:
      en: Between 9,800 ms and 10,200 ms
  - id: c
    text:
      en: Between 5,000 ms and 15,000 ms
  - id: d
    correct: true
    text:
      en: Between 8,000 ms and 12,000 ms
  explanation:
    en: Kafka applies a randomized jitter factor of 0.2, so the backoff falls between 20% below and 20% above the
      computed value. A range only above 10,000 ms is wrong, because the jitter falls between 20% below and 20%
      above the backoff. A range of 2% either side is wrong, because the jitter factor of 0.2 allows 20% below and
      20% above. A range of 50% either side is wrong, because the jitter factor of 0.2 allows 20% below and 20%
      above.
  citation: kafka-producer-configs#retry.backoff.max.ms
- id: m09-case-c-q09
  lesson: m08-l04
  prompt:
    en: A notification sender wraps a call in a Resilience4j `Retry` with default settings, and every attempt fails.
      How many attempts does the `Retry` make in total with the default `maxAttempts`?
  options:
  - id: a
    text:
      en: 4, because 3 retries follow the initial call
  - id: b
    text:
      en: 2, because the initial call is not retried
  - id: c
    correct: true
    text:
      en: 3, counting the initial call as the first attempt
  - id: d
    text:
      en: 1, because retries must be enabled explicitly
  explanation:
    en: In Resilience4j, `maxAttempts` defaults to 3 and counts the initial call as the first attempt. Four attempts
      is wrong, because `maxAttempts` defaults to 3 and counts the initial call. Two attempts is wrong, because
      `maxAttempts` defaults to 3 and counts the initial call. A single attempt because retries must be enabled
      explicitly is wrong, since `maxAttempts` defaults to 3 and counts the initial call.
  citation: resilience4j-retry#create-and-configure-retry
- id: m09-case-c-q11
  lesson: m09-l04
  prompt:
    en: A notification API documents an operation that requires the `Idempotency-Key` header, and a client calls
      it without that header. Which HTTP status code SHOULD the resource reply with, according to the IETF draft?
  options:
  - id: a
    correct: true
    text:
      en: '`400`'
  - id: b
    text:
      en: '`409`'
  - id: c
    text:
      en: '`422`'
  - id: d
    text:
      en: '`404`'
  explanation:
    en: A missing `Idempotency-Key` on an operation that requires it SHOULD get a `400` reply. `409` is wrong, because
      that code is for a retry while the original request is still being processed. `422` is wrong, because that
      code is for reusing a key with a different request payload. `404` is wrong, because the draft says a missing
      header on such an operation SHOULD get `400`.
  citation: ietf-httpapi-idempotency-key#content
- id: m09-case-c-q12
  lesson: m09-l04
  prompt:
    en: A notification consumer reads a Kafka topic that producers write with transactions, and it keeps the default
      isolation level. Which messages does the consumer see?
  options:
  - id: a
    correct: true
    text:
      en: All messages, even those of aborted transactions
  - id: b
    text:
      en: Only messages from committed transactions
  - id: c
    text:
      en: Only messages of the most recent transaction
  - id: d
    text:
      en: No messages until the transaction coordinator releases them
  explanation:
    en: In the default `read_uncommitted` isolation level, all messages are visible to consumers even if they were
      part of an aborted transaction. Only committed messages is wrong, because that is `read_committed`, while
      the default `read_uncommitted` shows all messages. Only the latest transaction is wrong, because the default
      `read_uncommitted` level shows all messages. Waiting for a release is wrong, because the default `read_uncommitted`
      level shows all messages.
  citation: kafka-design#message-delivery-semantics
- id: m09-case-c-q13
  lesson: m09-l04
  prompt:
    en: Since Kafka 0.11 a producer can resend a notification after a network error without creating duplicate log
      entries. How does the broker deduplicate the resent messages?
  options:
  - id: a
    text:
      en: It writes the messages atomically to several partitions in one transaction
  - id: b
    text:
      en: It waits until every in-sync replica has applied the message
  - id: c
    correct: true
    text:
      en: It assigns each producer an ID and checks a sequence number sent with each message
  - id: d
    text:
      en: It reads an `Idempotency-Key` HTTP header sent with each record
  explanation:
    en: The broker assigns each producer an ID and deduplicates messages using a sequence number sent by the producer
      along with every message. Atomic multi-partition writes are wrong, because that is the separate transaction
      feature, which makes all messages be written or none. Waiting for all in-sync replicas is wrong, because that
      rule only defines when a message is committed. An `Idempotency-Key` header is wrong, because that header makes
      non-idempotent HTTP methods such as `POST` fault-tolerant, not Kafka records.
  citation: kafka-design#message-delivery-semantics
- id: m09-case-c-q14
  lesson: m09-l04
  prompt:
    en: A Kafka partition has a leader and two followers, and all three are in the in-sync replica set. When does
      Kafka consider a message committed for that partition?
  options:
  - id: a
    text:
      en: As soon as the leader appends it to its own log
  - id: b
    text:
      en: When a majority of all replicas have acknowledged it
  - id: c
    correct: true
    text:
      en: When every in-sync replica has applied it to its log
  - id: d
    text:
      en: When a consumer has read it for the first time
  explanation:
    en: A message is considered committed only when all replicas in the in-sync replicas (ISR) for that partition
      have applied it to their log. Leader-only append is wrong, because a message is committed only when all in-sync
      replicas have applied it. A majority of all replicas is wrong, because the rule uses all replicas in the in-sync
      set. A first consumer read is wrong, because commitment depends on all in-sync replicas applying it to their
      log.
  citation: kafka-design#message-delivery-semantics
- id: m09-case-c-q15
  lesson: m08-l04
  prompt:
    en: A notification service uses Spring for Apache Kafka and wants an exponential backoff that stops after a
      fixed number of retries without computing `maxElapsedTime` by hand. Since which version does `ExponentialBackOffWithMaxRetries`
      exist?
  options:
  - id: a
    correct: true
    text:
