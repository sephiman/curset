- id: m01-l06-q084
  prompt:
    es: "Señale cuántas iniciativas, presentadas en conjunto por las diversas Administraciones, agrupan los diez compromisos del V Plan de Gobierno Abierto de España 2025-2029:"
  options:
  - id: a
    correct: true
    text:
      es: "218."
  - id: b
    text:
      es: "182."
  - id: c
    text:
      es: "228."
  - id: d
    text:
      es: "123."
  explanation:
    es: "Los diez compromisos agrupan 218 iniciativas. El número 123 es el de las iniciativas del ámbito central, una parte del total. Los otros dos números son cifras cercanas que no aparecen en el Plan."
  citation: "fuente: `transparencia-v-plan.pdf`"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-transparencia-v-plan-pdf
- id: m01-l06-q085
  prompt:
    es: "¿Cuál de las siguientes opciones completa lo que, con respecto al IV Plan de Gobierno Abierto, suprime el V Plan de Gobierno Abierto de España 2025-2029?"
  options:
  - id: a
    text:
      es: "Los compromisos, que quedan integrados en los ejes."
  - id: b
    text:
      es: "Las iniciativas, que quedan integradas en los ejes transversales."
  - id: c
    text:
      es: "El compromiso del Observatorio de Gobierno Abierto."
  - id: d
    correct: true
    text:
      es: "Los ejes, que quedan integrados en los compromisos."
  explanation:
    es: "El V Plan suprime los ejes y los integra en los compromisos. Lo contrario, compromisos integrados en ejes, invierte la relación. Las iniciativas no se integran en los ejes transversales, que son dos y siguen existiendo. El Observatorio de Gobierno Abierto es el compromiso 9 del V Plan."
  citation: "fuente: `transparencia-v-plan.pdf`; «Con respecto al IV Plan, se suprimen los ejes, que quedan integrados en los compromisos.»"
  difficulty: 2
  tags:
  - "estructura"
