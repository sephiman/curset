  citation: spring-security-servlet-oauth2-resource-server-jwt#_runtime_expectations
- id: m05-l06-q09
  prompt:
    en: Spring Security lets you inject several `AuthenticationProvider` instances into `ProviderManager`. Which
      provider supports authenticating a JWT token?
  options:
  - id: a
    text:
      en: '`DaoAuthenticationProvider`'
  - id: b
    correct: true
    text:
      en: '`JwtAuthenticationProvider`'
  - id: c
    text:
      en: '`ProviderManager`'
  - id: d
    text:
      en: '`JwtDecoder`'
  explanation:
    en: '`JwtAuthenticationProvider` supports authenticating a JWT token. `DaoAuthenticationProvider` handles another
      kind of authentication, because it supports username/password-based authentication. `ProviderManager` is not
      a provider, because it is the most common implementation of `AuthenticationManager`. `JwtDecoder` is not the
      provider, because `JwtAuthenticationProvider` uses it to decode, verify and validate the `Jwt`.'
  citation: spring-security-servlet-authentication-architecture#servlet-authentication-authenticationprovider
- id: m05-l06-q11
  prompt:
    en: In a Spring Security servlet application, `AuthorizationFilter` denies a request and an `AccessDeniedException`
      is thrown. Which component then handles that exception?
  options:
  - id: a
    text:
      en: '`DelegatingFilterProxy`'
  - id: b
    correct: true
    text:
      en: '`ExceptionTranslationFilter`'
  - id: c
    text:
      en: '`ProviderManager`'
  - id: d
    text:
      en: '`SecurityContextHolder`'
  explanation:
    en: If authorization is denied, the `ExceptionTranslationFilter` handles the `AccessDeniedException`. `DelegatingFilterProxy`
      is ruled out because it bridges between the Servlet container's lifecycle and Spring's `ApplicationContext`.
      `ProviderManager` is ruled out because it is the most commonly used implementation of `AuthenticationManager`.
      `SecurityContextHolder` is ruled out because it is where Spring Security stores the details of who is authenticated.
  citation: spring-security-servlet-authorization-authorize-http-requests#request-authorization-architecture
- id: m05-l06-q13
  prompt:
    en: '`FilterChainProxy` can choose a `SecurityFilterChain` based on anything in the `HttpServletRequest`, not
      only the URL. Which interface does it use to make that choice?'
  options:
  - id: a
    correct: true
    text:
      en: '`RequestMatcher`'
  - id: b
    text:
      en: '`HttpFirewall`'
  - id: c
    text:
      en: '`AuthorizationManager`'
  - id: d
    text:
      en: '`AuthenticationProvider`'
  explanation:
    en: '`FilterChainProxy` can determine invocation based upon anything in the `HttpServletRequest` by using the
      `RequestMatcher` interface. `HttpFirewall` is ruled out because `FilterChainProxy` applies it to protect applications
      against certain types of attacks. `AuthorizationManager` is ruled out because it matches the request to the
      patterns in `authorizeHttpRequests` and runs the corresponding rule. `AuthenticationProvider` is ruled out
      because each one knows how to perform a specific type of authentication.'
  citation: spring-security-servlet-architecture#servlet-securityfilterchain
- id: m05-l06-q14
  prompt:
    en: By default, how does Spring Security's `SecurityContextHolder` store the details of who is authenticated
      so that the `SecurityContext` reaches methods running in the same thread?
  options:
  - id: a
    text:
      en: In the `HttpSession` of the request
  - id: b
    text:
      en: In one context shared by all threads of the JVM
  - id: c
    correct: true
    text:
      en: In a `ThreadLocal`
  - id: d
    text:
      en: In an inheritable thread-local that threads spawned by the current thread also see
  explanation:
    en: By default, `SecurityContextHolder` uses a `ThreadLocal` to store these details. The `HttpSession`, one
      context shared by all threads and an inheritable thread-local are ruled out together, because the default
      storage has one value, a plain `ThreadLocal`.
  citation: spring-security-servlet-authentication-architecture#servlet-authentication-securitycontextholder
