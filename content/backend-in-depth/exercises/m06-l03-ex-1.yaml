      and written comes from the `BUFFERS` parameter. The number of executions is what the `loops` value reports.
  citation: pg-using-explain#USING-EXPLAIN-ANALYZE; pg-sql-explain#id-1.9.3.148.8
  extract:
    en: reports the total number of searches across all node executions
- id: m06-l03-q53
  prompt:
    en: In PostgreSQL 18, which statement is correct about a partial index that was built to exclude the common
      values of a column?
  options:
  - id: a
    text:
      en: The planner still uses it for a query that searches for one of the common values, like for any other value
  - id: b
    text:
      en: It saves no index space, because an entry is kept for every table row whether or not the row satisfies
        the predicate
  - id: c
    correct: true
    text:
      en: It requires the common values to be predetermined, so it suits data distributions that do not change
  - id: d
    text:
      en: It needs no maintenance, because the predicate adapts by itself when the distribution of the data changes
  explanation:
    en: Such a partial index requires the common values to be predetermined, so it is best used for data distributions
      that do not change. A query searching for a common value will not use the index anyway. The index contains
      entries only for the table rows that satisfy the predicate, which reduces its size. The index can be recreated
      occasionally to adjust for new data distributions, which adds maintenance effort.
  citation: pg-indexes-partial#INDEXES-PARTIAL
  extract:
    en: this kind of partial index requires that the common values be predetermined
- id: m06-l03-q54
  prompt:
    en: In Spring Data JPA 4.1, which statement about the query method return types `Page<T>`, `Slice<T>` and `Window<T>`
      is correct?
  options:
  - id: a
    correct: true
    text:
      en: A `Page<T>` query can require an additional `COUNT(...)` query to determine the total number of elements
  - id: b
    text:
      en: A `Window<T>` can navigate to the previous `Window<T>` as well as to the next one
  - id: c
    text:
      en: A `Slice<T>` always needs a `COUNT(...)` query, because it cannot tell whether there is more data to fetch
  - id: d
    text:
      en: A `Page<T>` fetches `limit + 1` rows using a rewritten `WHERE` condition, in the way a keyset-based window
        does
  explanation:
    en: A `Page<T>` can require an additional `COUNT(...)` query for the total number of elements. A `Window` can
      only navigate to the next `Window`. A `Slice` fetches the page size plus one row and provides details on whether
      there is more data to fetch. A `Page` fetches the page size at `Pageable.getOffset()`, while the rewritten
      `WHERE` condition belongs to the keyset-based window.
