    correct: true
    text:
      en: They cause no blocking, so they cannot play any part in causing a deadlock
  - id: c
    text:
      en: They appear in `pg_locks` with a mode of `ExclusiveLock` while held
  - id: d
    text:
      en: They are always released when the statement that took them ends
  explanation:
    en: Predicate locks do not cause any blocking and therefore cannot play any part in causing a deadlock. They
      are based on data actually accessed by a transaction, not on whole tables. They show up in `pg_locks` with
      a mode of `SIReadLock`. SIRead locks often need to be kept past transaction commit.
  citation: pg-transaction-iso#XACT-SERIALIZABLE
  extract:
    en: In PostgreSQL these locks do not cause any blocking and therefore can not play any part in causing a deadlock.
- id: m06-l02-q31
  prompt:
    en: In Jakarta Persistence 3.2, a transaction has obtained a pessimistic lock on an entity instance. What does
      the lock guarantee for other transactions?
  options:
  - id: a
    text:
      en: They may modify the instance but are not allowed to delete it until the holder ends
  - id: b
    text:
      en: Only transactions that use the Jakarta Persistence API are blocked by the lock
  - id: c
    text:
      en: The lock is released as soon as the statement that took it has finished running
  - id: d
    correct: true
    text:
      en: None may successfully modify or delete it until the lock holder's transaction ends
  explanation:
    en: Pessimistic locking guarantees that no other transaction may modify or delete the instance until the holder's
      transaction ends. The guarantee covers both modify and delete. It applies whether the other transaction uses
      the API or any other transaction using the underlying resource. The lock lasts until the transaction ends,
      not the statement.
  citation: jakarta-persistence-spec#a2066
  extract:
    en: no other transaction (whether a transaction of an application using the Jakarta Persistence API or any other
      transaction using the underlying resource) may successfully modify or delete that instance until the transaction
      holding the lock has ended.
- id: m06-l02-q32
  prompt:
    en: In the Berenson critique, write skew (A5B) starts with T1 reading x and y, consistent with a constraint,
      and T2 reading x and y, writing x and committing. What happens next?
  options:
  - id: a
    text:
      en: T1 reads y after T2 updated x and y, and sees an inconsistent state from two committed versions
  - id: b
    correct: true
    text:
      en: T1 writes y, so the constraint between x and y might be violated
  - id: c
    text:
      en: T1 and T2 write the same item concurrently, and both commit with one of the updates lost
  - id: d
    text:
      en: T1 rereads a predicate and finds that the set of matching items has changed because of T2
  explanation:
    en: In write skew T1 then writes y, and a constraint between x and y might be violated. T1 reading y after T2
      updated both items is read skew, a different anomaly with its own definition. Two concurrent writes of the
      same item cannot both commit under Snapshot Isolation, because first-committer-wins prevents lost updates.
      A changed predicate set is the A3 anomaly, which Snapshot Isolation cannot experience.
  citation: paper-berenson-critique-ansi-isolation#p9; paper-berenson-critique-ansi-isolation#p10
