  - option: Required, because a wrong return value would otherwise go unnoticed
    anchor: mockito-javadoc-source#2
    sentence: If your code cares what get(0) returns, then something else breaks (often before verify() even gets executed).
  - option: Required, because `verify` works only on calls that were stubbed first
