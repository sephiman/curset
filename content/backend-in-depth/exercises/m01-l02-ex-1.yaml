- id: m01-l02-q31
  prompt:
    en: In Java 25, this snippet pays 1000 through a `Checkout` with a halving discount and two listeners, then
      through one with an identity discount. What does it print?
  options:
  - id: a
    correct: true
    text:
      en: '```text

        audit 500

        mail 500

        500

        1000

        ```'
  - id: b
    text:
      en: '```text

        500

        audit 500

        mail 500

        1000

        ```'
  - id: c
    text:
      en: '```text

        mail 500

        audit 500

        500

        1000

        ```'
  - id: d
    text:
      en: '```text

        audit 500

        mail 500

        500

        audit 1000

        mail 1000

        1000

        ```'
  explanation:
    en: The listeners run inside `pay` in subscription order, so the snippet prints `audit 500` and `mail 500`,
      then the returned `500`, then `1000` from the checkout with no listeners. The output that starts with `500`
      is wrong because the listeners run before `pay` returns. The output with `mail` first is wrong because the
      list keeps subscription order. The output with extra listener lines is wrong because the second checkout has
      its own empty list of listeners.
  citation: course-requirements#4-content-classes
