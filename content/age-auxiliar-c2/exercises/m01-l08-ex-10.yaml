# anchor: boe-a-2015-10566-art-64
- id: m01-l08-q033
  prompt:
    es: "¿Cuál de los siguientes requisitos exige la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público para el nombramiento de los Secretarios generales de los Ministerios?"
  options:
  - id: a
    text:
      es: "La pertenencia a la Carrera Diplomática o a otro Cuerpo del Subgrupo A1 del Estado."
  - id: b
    text:
      es: "La condición de funcionario de carrera del Subgrupo A1 con diez años de experiencia en la gestión pública."
  - id: c
    correct: true
    text:
      es: "Cualificación y experiencia en el desempeño de puestos de responsabilidad en la gestión pública o privada."
  - id: d
    text:
      es: "La condición de funcionario de carrera del Subgrupo A1 del Estado, de las Comunidades Autónomas o de las Entidades locales."
  explanation:
    es: "El artículo 64.3 dice que los Secretarios generales se nombran «entre personas con cualificación y experiencia en el desempeño de puestos de responsabilidad en la gestión pública o privada». No se exige ser funcionario: esa condición se pide a Subsecretarios, Secretarios generales técnicos y Directores generales (arts. 63.3, 65.3 y 66.2). La Carrera Diplomática y los diez años de experiencia no aparecen en el artículo."
  citation: "art. 64.3 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-64
- id: m01-l08-q034
  prompt:
    es: "Según el artículo 64.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Secretarios generales, con categoría de Subsecretario, son nombrados y separados por Real Decreto del Consejo de Ministros:"
  options:
  - id: a
    text:
      es: "Únicamente a propuesta del Presidente del Gobierno."
  - id: b
    text:
      es: "A propuesta del Subsecretario del Ministerio, oído el titular del Departamento."
  - id: c
    correct: true
    text:
      es: "A propuesta del titular del Ministerio o del Presidente del Gobierno."
  - id: d
    text:
      es: "Únicamente a propuesta del titular del Ministerio."
  explanation:
    es: "El artículo 64.3 dice que se nombran y separan por Real Decreto del Consejo de Ministros «a propuesta del titular del Ministerio o del Presidente del Gobierno». Cualquiera de los dos puede proponer, así que las opciones que reservan la propuesta a uno solo son incorrectas. El Subsecretario no propone el nombramiento."
  citation: "art. 64.3 LRJSP"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-65
- id: m01-l08-q035
  prompt:
    es: "De acuerdo con el artículo 65.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Secretarios generales técnicos, bajo la inmediata dependencia del Subsecretario, tienen en todo caso las competencias relativas a:"
  options:
  - id: a
    correct: true
    text:
      es: "Producción normativa, asistencia jurídica y publicaciones."
  - id: b
    text:
      es: "Gestión de recursos humanos, gestión financiera y publicaciones."
  - id: c
    text:
      es: "Inspección de servicios, asistencia jurídica y estadística para fines estatales."
  - id: d
    text:
      es: "Producción normativa, representación ordinaria del Ministerio y publicaciones."
  explanation:
    es: "El artículo 65.1 atribuye en todo caso a los Secretarios generales técnicos las competencias «relativas a producción normativa, asistencia jurídica y publicaciones». Recursos humanos, gestión financiera, inspección y estadística son servicios comunes (art. 68.1), pero el artículo 65.1 no los reserva al Secretario general técnico. La representación ordinaria del Ministerio es del Subsecretario (art. 63.1)."
  citation: "art. 65.1 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-66
- id: m01-l08-q036
  prompt:
    es: "Según el artículo 66.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Directores generales se nombran entre funcionarios de carrera del Subgrupo A1 o jubilados que lo fueron, salvo que:"
  options:
  - id: a
    text:
      es: "El Consejo de Ministros lo acuerde a propuesta del Presidente del Gobierno, sin necesidad de motivación."
  - id: b
    text:
      es: "El candidato acredite diez años de experiencia en puestos directivos de la gestión privada."
  - id: c
    correct: true
    text:
      es: "El Real Decreto de estructura lo permita por las características específicas de las funciones de la Dirección General."
  - id: d
    text:
      es: "El Ministro lo autorice mediante orden, por razones de urgencia debidamente justificadas."
  explanation:
    es: "El artículo 66.2 admite la excepción cuando «el Real Decreto de estructura permita que, en atención a las características específicas de las funciones de la Dirección General, su titular no reúna dicha condición de funcionario». La excepción va en el Real Decreto de estructura, no en una orden ministerial ni en un acuerdo sin motivar: exige memoria razonada. La ley no prevé una excepción por años de experiencia privada."
  citation: "art. 66.2 LRJSP"
  difficulty: 1
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-2015-10566-art-66
- id: m01-l08-q037
  prompt:
    es: "Según el artículo 66.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿cómo debe motivarse la excepción que permite nombrar Director general a quien no sea funcionario?"
  options:
  - id: a
    correct: true
    text:
      es: "Mediante memoria razonada que justifique las especiales características de las funciones."
  - id: b
    text:
      es: "Mediante informe preceptivo del Consejo de Estado sobre la idoneidad del candidato."
  - id: c
    text:
      es: "Mediante informe favorable de la Oficina de Conflictos de Intereses."
  - id: d
    text:
      es: "Mediante acuerdo del Consejo de Ministros adoptado a propuesta del Presidente del Gobierno."
  explanation:
    es: "El artículo 66.2 exige «motivarse mediante memoria razonada la concurrencia de las especiales características que justifiquen esa circunstancia excepcional». El artículo no pide informe del Consejo de Estado ni de la Oficina de Conflictos de Intereses. El acuerdo del Consejo de Ministros es la forma del nombramiento, no la motivación de la excepción."
  citation: "art. 66.2 LRJSP"
  difficulty: 3
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2015-10566-art-66
- id: m01-l08-q038
  prompt:
    es: "Señale la respuesta correcta sobre el nombramiento de los Directores generales de los Ministerios, conforme a la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    text:
      es: "Se nombran solo entre funcionarios de carrera del Subgrupo A1 en servicio activo, excluidos los jubilados."
  - id: b
    text:
      es: "Se nombran entre personas con cualificación y experiencia en la gestión pública o privada, sin ningún otro requisito de pertenencia a la función pública."
  - id: c
    correct: true
    text:
      es: "Con carácter general, se nombran entre funcionarios de carrera del Subgrupo A1 o personas que perdieron esa condición por jubilación."
  - id: d
    text:
      es: "Se nombran entre funcionarios de carrera de los Subgrupos A1 o A2 que acrediten al menos cinco años de servicios."
  explanation:
    es: "El artículo 66.2 manda nombrar a los Directores generales entre funcionarios de carrera del Subgrupo A1 «o entre personas que hubieran perdido tal condición como consecuencia de su jubilación», salvo la excepción del Real Decreto de estructura. El Subgrupo A2 no basta y la ley no pide años de servicio. Los jubilados no están excluidos. La cualificación y experiencia en la gestión pública o privada es el requisito de los Secretarios generales (art. 64.3)."
  citation: "art. 66.2 LRJSP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-67
- id: m01-l08-q040
  prompt:
    es: "De acuerdo con el artículo 67.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Subdirectores generales son nombrados, respetando los principios de igualdad, mérito y capacidad, y cesados por:"
  options:
  - id: a
    text:
      es: "Real Decreto del Consejo de Ministros, a propuesta del titular del Departamento."
  - id: b
    text:
      es: "El Director general del que dependan, previa autorización del Subsecretario."
  - id: c
    text:
      es: "El Subsecretario del Departamento en todo caso, cualquiera que sea su dependencia."
  - id: d
    correct: true
    text:
      es: "El Ministro, Secretario de Estado o Subsecretario del que dependan."
  explanation:
    es: "El artículo 67.2 dice que los Subdirectores generales son nombrados y cesados «por el Ministro, Secretario de Estado o Subsecretario del que dependan». El Real Decreto del Consejo de Ministros es para los órganos directivos de nivel superior (arts. 63.3, 65.3 y 66.2). El Director general no nombra Subdirectores. El Subsecretario solo nombra a los que dependen de la Subsecretaría (art. 63.1.l)."
  citation: "art. 67.2 LRJSP"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-67
- id: m01-l08-q041
  prompt:
    es: "Según el artículo 67.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué principios han de respetarse en el nombramiento de los Subdirectores generales?"
  options:
  - id: a
    correct: true
    text:
      es: "Los principios de igualdad, mérito y capacidad."
  - id: b
    text:
      es: "Los principios de publicidad, mérito y capacidad."
  - id: c
    text:
      es: "Los principios de igualdad, objetividad y libre concurrencia."
  - id: d
    text:
      es: "Los principios de mérito, capacidad y antigüedad en el servicio."
  explanation:
    es: "El artículo 67.2 dice que los Subdirectores generales serán nombrados «respetando los principios de igualdad, mérito y capacidad». La publicidad, la objetividad, la libre concurrencia y la antigüedad no están en ese artículo."
  citation: "art. 67.2 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-67
- id: m01-l08-q042
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿entre qué funcionarios de carrera han de efectuarse los nombramientos de Subdirectores generales?"
  options:
  - id: a
    text:
      es: "Entre los del Estado del Subgrupo A1, sin que quepa nombrar a funcionarios de otras Administraciones."
  - id: b
    correct: true
    text:
      es: "Entre los del Estado, o de otras Administraciones cuando lo prevean las normas, del Subgrupo A1."
  - id: c
    text:
      es: "Entre los del Estado pertenecientes a los Subgrupos A1 o A2, con cualquier antigüedad."
  - id: d
    text:
      es: "Entre los de cualquier Administración pertenecientes al grupo A, con diez años de antigüedad."
  explanation:
    es: "El artículo 67.2 manda nombrarlos «entre funcionarios de carrera del Estado, o de otras Administraciones, cuando así lo prevean las normas de aplicación, pertenecientes al Subgrupo A1». El Subgrupo A2 no basta y la ley no pide antigüedad. Los funcionarios de otras Administraciones pueden ser nombrados cuando las normas lo prevean."
  citation: "art. 67.2 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-55
- id: m01-l08-q043
  prompt:
    es: "Señale la respuesta INCORRECTA sobre los Subdirectores generales de la Administración General del Estado, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    correct: true
    text:
      es: "Tienen la condición de alto cargo, igual que los Directores generales."
  - id: b
    text:
      es: "Son órganos directivos de la organización central de la Administración General del Estado."
  - id: c
    text:
      es: "Se nombran entre funcionarios de carrera pertenecientes al Subgrupo A1."
  - id: d
    text:
      es: "Los cesa el Ministro, Secretario de Estado o Subsecretario del que dependan."
  explanation:
    es: "El artículo 55.6 da la condición de alto cargo a los órganos superiores y directivos «excepto los Subdirectores generales y asimilados», así que la afirmación de que «tienen la condición de alto cargo» es la incorrecta. Las otras tres son ciertas: los Subdirectores generales son órganos directivos (art. 55.3.b), se nombran entre funcionarios de carrera del Subgrupo A1 y los cesa el Ministro, Secretario de Estado o Subsecretario del que dependan (art. 67.2)."
  citation: "art. 55.6 LRJSP"
  difficulty: 2
  tags:
  - "excepción"
  - "órgano"
# anchor: boe-a-2015-10566-art-64
- id: m01-l08-q044
  prompt:
    es: "¿Cuál de los siguientes órganos directivos puede nombrarse, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, entre personas con experiencia en puestos de responsabilidad en la gestión privada?"
  options:
  - id: a
    correct: true
    text:
      es: "Los Secretarios generales de los Ministerios."
  - id: b
    text:
      es: "Los Subsecretarios de los Ministerios."
  - id: c
    text:
      es: "Los Secretarios generales técnicos de los Ministerios."
  - id: d
    text:
      es: "Los Subdirectores generales de los Ministerios."
  explanation:
    es: "El artículo 64.3 permite nombrar a los Secretarios generales «entre personas con cualificación y experiencia en el desempeño de puestos de responsabilidad en la gestión pública o privada». Los Subsecretarios, los Secretarios generales técnicos y los Subdirectores generales deben ser funcionarios de carrera del Subgrupo A1 (arts. 63.3, 65.3 y 67.2); en el caso de los Subsecretarios caben también quienes perdieron esa condición por jubilación."
  citation: "art. 64.3 LRJSP"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-69
- id: m01-l08-q045
  prompt:
    es: "Según el artículo 69.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las Delegaciones del Gobierno tienen su sede, sin perjuicio de lo que disponga el Estatuto de Autonomía:"
  options:
  - id: a
    text:
      es: "En la capital de la provincia más poblada de la Comunidad Autónoma, en todo caso."
  - id: b
    text:
      es: "En la localidad que determine el Presidente de la Comunidad Autónoma, oído el Consejo de Ministros."
  - id: c
    correct: true
    text:
      es: "En la localidad donde radique el Consejo de Gobierno de la Comunidad Autónoma, salvo que el Consejo de Ministros acuerde otra."
  - id: d
    text:
      es: "En la localidad donde radique la Asamblea Legislativa de la Comunidad Autónoma, salvo que el Ministro competente acuerde otra."
  explanation:
    es: "El artículo 69.2 sitúa la sede «en la localidad donde radique el Consejo de Gobierno de la Comunidad Autónoma, salvo que el Consejo de Ministros acuerde ubicarla en otra distinta». El criterio es el Consejo de Gobierno, no la Asamblea Legislativa ni la población, y quien puede cambiarla es el Consejo de Ministros, no un Ministro ni el Presidente autonómico."
  citation: "art. 69.2 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
