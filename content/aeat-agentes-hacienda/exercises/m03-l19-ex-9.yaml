# anchor: boe-a-1992-28740-art-110
- id: m03-l19-q0167
  prompt:
    es: "De acuerdo con el artículo 110.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué regularización se efectúa en las entregas de bienes de inversión durante el período de regularización?"
  options:
  - id: a
    text:
      es: "Una regularización por cada año que quede por transcurrir hasta su finalización."
  - id: b
    text:
      es: "Una regularización única por el total de los años del período de regularización, hayan transcurrido o no."
  - id: c
    correct: true
    text:
      es: "Una regularización única por el tiempo de dicho período que quede por transcurrir."
  - id: d
    text:
      es: "Una regularización por cada año del período, hasta la fecha de la entrega."
  explanation:
    es: "La entrega durante el período provoca una sola regularización, por el tiempo que queda. No hay una por cada año ni se regulariza el período entero."
  citation: "art. 110.Uno LIVA"
  difficulty: 2
  tags:
  - "bienes de inversión"
  - "entrega"
# anchor: boe-a-1992-28740-art-110
- id: m03-l19-q0168
  prompt:
    es: "Señale la respuesta CORRECTA sobre la entrega de un bien de inversión durante el período de regularización, según el artículo 110.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Si la entrega es exenta o no sujeta, el bien se considera empleado exclusivamente en operaciones que originan el derecho a deducir."
  - id: b
    correct: true
    text:
      es: "Si la entrega es sujeta y no exenta, el bien se considera empleado exclusivamente en operaciones que originan el derecho a deducir durante el año de la entrega y los restantes."
  - id: c
    text:
      es: "Si la entrega es sujeta y no exenta, el bien se considera empleado exclusivamente en operaciones que no originan derecho a deducir."
  - id: d
    text:
      es: "Si la entrega es sujeta y no exenta, se mantiene el porcentaje de deducción definitivo aplicado en el año de adquisición."
  explanation:
    es: "La entrega sujeta y no exenta se trata como empleo exclusivo en operaciones con derecho a deducir durante el año de la entrega y los restantes. La exenta o no sujeta se trata como empleo sin ese derecho, y no se mantiene el porcentaje del año de adquisición."
  citation: "art. 110.Uno LIVA"
  difficulty: 3
  tags:
  - "bienes de inversión"
  - "entrega"
# anchor: boe-a-1992-28740-art-108
- id: m03-l19-q0212
  prompt:
    es: "Según el artículo 108.Dos.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, no tienen la consideración de bienes de inversión los accesorios y piezas de recambio:"
  options:
  - id: a
    text:
      es: "adquiridos para la reventa a otros empresarios o profesionales en el curso normal de su actividad."
  - id: b
    text:
      es: "adquiridos con una vida útil prevista superior a cinco años."
  - id: c
    text:
      es: "incorporados de forma definitiva a un bien de inversión de valor superior."
  - id: d
    correct: true
    text:
      es: "adquiridos para la reparación de los bienes de inversión utilizados por el sujeto pasivo."
  explanation:
    es: "La exclusión alcanza a accesorios y piezas adquiridos para reparar bienes de inversión. Los de reventa, los incorporados a otro bien o los de larga vida útil no figuran en el número 1.º."
  citation: "art. 108.Dos LIVA"
  difficulty: 2
  tags:
  - "bienes de inversión"
# anchor: boe-a-1992-28740-art-108
