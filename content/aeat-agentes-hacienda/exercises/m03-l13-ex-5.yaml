# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0057
  prompt:
    es: "¿Dentro de qué plazo anterior a la comisión de la infracción debe haber sido sancionado el sujeto infractor, por resolución firme en vía administrativa y por una infracción de la misma naturaleza, para que haya comisión repetida según el artículo 187.1.a de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Los cuatro años anteriores a la comisión de la infracción."
  - id: b
    text:
      es: "Los tres años anteriores a la comisión de la infracción."
  - id: c
    text:
      es: "Los cinco años anteriores a la comisión de la infracción."
  - id: d
    text:
      es: "Los cuatro años anteriores a la notificación de la resolución sancionadora."
  explanation:
    es: "El artículo 187.1.a LGT cuenta cuatro años hacia atrás desde la comisión de la nueva infracción. No son tres ni cinco, y el cómputo no parte de la notificación de la nueva sanción. Hace falta, además, que la anterior sea firme en vía administrativa."
  citation: "art. 187.1.a LGT"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0058
  prompt:
    es: "Según el artículo 187.1.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuáles de las siguientes infracciones se consideran todas ellas de la misma naturaleza a efectos de la comisión repetida?"
  options:
  - id: a
    text:
      es: "Las de los artículos 192 y 198, porque ambas se refieren a declaraciones no presentadas."
  - id: b
    correct: true
    text:
      es: "Las de los artículos 191, 192 y 193, que se consideran de la misma naturaleza entre sí."
  - id: c
    text:
      es: "Las de los artículos 193 y 203, porque ambas consisten en obstaculizar la actuación de la Administración."
  - id: d
    text:
      es: "Las de los artículos 191 y 194, porque ambas se refieren a la falta de ingreso de la deuda."
  explanation:
    es: "El artículo 187.1.a LGT considera de la misma naturaleza las infracciones de un mismo artículo del capítulo III y, expresamente, las de los artículos 191, 192 y 193 entre sí. Los artículos 194, 198 y 203 tipifican otras conductas y cada uno se compara solo con su propio artículo."
  citation: "art. 187.1.a LGT"
  difficulty: 2
  tags:
  - "lista"
  - "naturaleza"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0059
  prompt:
    es: "De acuerdo con el artículo 187.1.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando concurra la comisión repetida y el sujeto infractor hubiera sido sancionado por una infracción leve, la sanción mínima se incrementará en:"
  options:
  - id: a
    text:
      es: "Un incremento de quince puntos porcentuales."
  - id: b
    correct: true
    text:
      es: "Un incremento de cinco puntos porcentuales."
  - id: c
    text:
      es: "Un incremento de diez puntos porcentuales."
  - id: d
    text:
      es: "Un incremento del cinco por ciento de la sanción mínima."
  explanation:
    es: "El incremento por una sanción anterior leve es de cinco puntos porcentuales, según el artículo 187.1.a LGT. Se suma al porcentaje mínimo: no es un cinco por ciento de la sanción. Los quince puntos corresponden a una infracción grave anterior y los diez no son un escalón de la comisión repetida."
  citation: "art. 187.1.a LGT"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0060
  prompt:
    es: "De acuerdo con el artículo 187.1.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando concurra la comisión repetida y el sujeto infractor hubiera sido sancionado por una infracción muy grave, la sanción mínima se incrementará en:"
  options:
  - id: a
    correct: true
    text:
      es: "Un incremento de veinticinco puntos porcentuales."
  - id: b
    text:
      es: "Un incremento de cincuenta puntos porcentuales, en todo caso."
  - id: c
    text:
      es: "Un incremento de veinte puntos porcentuales."
  - id: d
    text:
      es: "Un incremento de quince puntos porcentuales."
  explanation:
    es: "Según el artículo 187.1.a LGT, la sanción anterior muy grave incrementa el mínimo en 25 puntos porcentuales. Quince puntos es el incremento de la grave. Veinte es un tramo del perjuicio económico, no de la comisión repetida, y no existe un incremento de cincuenta."
  citation: "art. 187.1.a LGT"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0061
  prompt:
    es: "Olivia Prieto comete en 2026 una infracción tributaria del artículo 191 cuya sanción mínima es el 50 por ciento. En marzo de 2023 había sido sancionada, por resolución firme en vía administrativa, por una infracción muy grave del artículo 193. Según el artículo 187.1.a de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿a qué porcentaje queda fijada la sanción mínima tras el incremento por la comisión repetida?"
  options:
  - id: a
    text:
      es: "El 65 por ciento, porque el 50 por ciento se incrementa en 15 puntos, al ser el 193 una infracción de menor entidad que el 191."
  - id: b
    text:
      es: "El 75 por ciento, pero solo si Olivia es además sancionada por perjuicio económico a la Hacienda Pública."
  - id: c
    correct: true
    text:
      es: "El 75 por ciento, porque el 50 por ciento se incrementa en 25 puntos al haber sido sancionada por una infracción muy grave."
  - id: d
    text:
      es: "El 50 por ciento, porque los artículos 191 y 193 no se consideran infracciones de la misma naturaleza."
  explanation:
    es: "Los artículos 191, 192 y 193 se consideran de la misma naturaleza y la sanción de 2023 es firme y está dentro de los cuatro años anteriores. Como era muy grave, el incremento es de 25 puntos: 50 + 25 = 75 por ciento. El incremento depende de la gravedad de la sanción anterior, no de la nueva, y no requiere que concurra otro criterio."
  citation: "art. 187.1.a LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0063
  prompt:
    es: "De acuerdo con el artículo 187.1.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, el perjuicio económico para la Hacienda Pública se determina por el porcentaje resultante de la relación existente entre la base de la sanción y:"
  options:
  - id: a
    text:
      es: "La cuantía total de las ventas u operaciones del obligado en el período objeto de comprobación o investigación."
  - id: b
    text:
      es: "La cuantía de la deuda tributaria resultante de la regularización, incluidos los intereses de demora y los recargos aplicables."
  - id: c
    correct: true
    text:
      es: "La cuantía total que hubiera debido ingresarse en la autoliquidación o por la adecuada declaración del tributo, o el importe de la devolución inicialmente obtenida."
  - id: d
    text:
      es: "La cuantía de la cuota íntegra del tributo, sin deducir las retenciones y pagos a cuenta ya ingresados por el obligado."
  explanation:
    es: "El artículo 187.1.b LGT mide el perjuicio por la relación entre la base de la sanción y lo que se debió ingresar en la autoliquidación o declaración, o la devolución inicialmente obtenida. No se mide contra las ventas, que es la referencia de la facturación, ni contra la cuota íntegra sin descontar pagos a cuenta, ni contra la deuda con intereses y recargos."
  citation: "art. 187.1.b LGT"
  difficulty: 3
  tags:
  - "concepto"
  - "perjuicio económico"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0064
  prompt:
    es: "Mónica Vidal debía ingresar 30.000 euros en una autoliquidación y solo ingresó 24.000. La base de la sanción es la cuantía no ingresada, 6.000 euros, y no concurre otro criterio de graduación. Según el artículo 187.1.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en cuántos puntos porcentuales se incrementa la sanción mínima por el perjuicio económico?"
  options:
  - id: a
    text:
      es: "En 15 puntos, porque el perjuicio es del 20 por ciento, superior al 10 e inferior o igual al 50 por ciento."
  - id: b
    text:
      es: "En 20 puntos, porque el perjuicio es del 20 por ciento y cada diez puntos de perjuicio suman uno."
  - id: c
    text:
      es: "En ningún punto, porque el perjuicio es inferior al 25 por ciento y solo se incrementa desde ese umbral."
  - id: d
    correct: true
    text:
      es: "En 10 puntos, porque el perjuicio es del 20 por ciento, superior al 10 e inferior o igual al 25 por ciento."
  explanation:
    es: "El perjuicio económico es 6.000 / 30.000 = 20 por ciento. El artículo 187.1.b LGT lo sitúa en el tramo superior al 10 e inferior o igual al 25 por ciento, con un incremento de 10 puntos. El de 15 puntos corresponde al tramo siguiente. No hay incremento proporcional por décimas, y el primer escalón empieza en el 10 por ciento, no en el 25."
  citation: "art. 187.1.b LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0065
  prompt:
    es: "Textiles Prado, S.L. debía ingresar 20.000 euros en una autoliquidación y ingresó 10.000, de modo que la base de la sanción es de 10.000 euros. Según el artículo 187.1.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué incremento sobre la sanción mínima corresponde por el perjuicio económico?"
  options:
  - id: a
    text:
      es: "25 puntos porcentuales, porque la sociedad ha dejado de ingresar la mitad de la deuda."
  - id: b
    correct: true
    text:
      es: "15 puntos porcentuales, porque el perjuicio del 50 por ciento entra en el tramo igual o inferior al 50 por ciento."
  - id: c
    text:
      es: "20 puntos porcentuales, porque el perjuicio del 50 por ciento se considera ya superior a ese umbral."
  - id: d
    text:
      es: "10 puntos porcentuales, porque el perjuicio no llega al 75 por ciento de la deuda correcta."
  explanation:
    es: "El perjuicio es 10.000 / 20.000 = 50 por ciento. El artículo 187.1.b LGT incluye el 50 por ciento exacto en el tramo superior al 25 e inferior o igual al 50, que suma 15 puntos. Para los 20 puntos haría falta superar el 50 por ciento. Los 10 puntos son del tramo inferior y los 25 solo se aplican por encima del 75 por ciento."
  citation: "art. 187.1.b LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0066
  prompt:
    es: "Una cooperativa debía ingresar 40.000 euros en una autoliquidación y ingresó 30.000, lo que deja una base de sanción de 10.000 euros. Según el artículo 187.1.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué incremento corresponde por el perjuicio económico?"
  options:
  - id: a
    correct: true
    text:
      es: "10 puntos porcentuales, porque el perjuicio del 25 por ciento no supera ese umbral y queda en el tramo inferior."
  - id: b
    text:
      es: "Ninguno, porque el perjuicio no es superior al 25 por ciento y los incrementos empiezan por encima de ese porcentaje."
  - id: c
    text:
      es: "20 puntos porcentuales, porque se ha dejado de ingresar la cuarta parte de la deuda correcta."
  - id: d
    text:
      es: "15 puntos porcentuales, porque el perjuicio del 25 por ciento abre el tramo siguiente."
  explanation:
    es: "El perjuicio es 10.000 / 40.000 = 25 por ciento. El artículo 187.1.b LGT reserva el tramo de 15 puntos para lo superior al 25 por ciento, así que el 25 exacto sigue en el tramo de 10 puntos. No hay incremento de 20 puntos para esa cifra y el primer escalón empieza por encima del 10 por ciento, no del 25."
  citation: "art. 187.1.b LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0067
  prompt:
    es: "Comercial Nieto, S.A. debía ingresar 30.000 euros en una autoliquidación y solo ingresó 12.000, de modo que la base de la sanción es de 18.000 euros. Según el artículo 187.1.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué incremento corresponde por el perjuicio económico?"
  options:
  - id: a
    text:
      es: "15 puntos porcentuales, porque el perjuicio del 60 por ciento es superior al 25 e inferior o igual al 50 por ciento."
  - id: b
    correct: true
    text:
      es: "20 puntos porcentuales, porque el perjuicio del 60 por ciento es superior al 50 e inferior o igual al 75 por ciento."
  - id: c
    text:
      es: "20 puntos porcentuales, porque el perjuicio del 40 por ciento, que resulta de 12.000 sobre 30.000, es el relevante."
  - id: d
    text:
      es: "25 puntos porcentuales, porque el perjuicio del 60 por ciento supera la mitad de la deuda correcta."
  explanation:
    es: "El perjuicio es la base entre la deuda que debía ingresarse: 18.000 / 30.000 = 60 por ciento. Ese porcentaje cae en el tramo superior al 50 e inferior o igual al 75, con 20 puntos, según el artículo 187.1.b LGT. Los 25 puntos exigen más del 75. Y el 40 por ciento sale de dividir por lo ingresado, que no es la referencia que fija el artículo."
  citation: "art. 187.1.b LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0068
  prompt:
    es: "De acuerdo con el artículo 187.1.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando el perjuicio económico sea superior al 75 por ciento, la sanción mínima se incrementará en:"
  options:
  - id: a
    text:
      es: "Un incremento de 75 puntos porcentuales."
  - id: b
    text:
      es: "Un incremento de 15 puntos porcentuales."
  - id: c
    correct: true
    text:
      es: "Un incremento de 25 puntos porcentuales."
  - id: d
    text:
      es: "Un incremento de 20 puntos porcentuales."
  explanation:
    es: "El tramo más alto del perjuicio económico, superior al 75 por ciento, suma 25 puntos porcentuales en el artículo 187.1.b LGT. Los 20 puntos son del tramo anterior y los 15 del tramo situado entre el 25 y el 50 por ciento. Los 75 puntos confunden el umbral con el incremento."
  citation: "art. 187.1.b LGT"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0069
  prompt:
    es: "Conforme al artículo 187.1.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el perjuicio económico como criterio de graduación de las sanciones tributarias:"
  options:
  - id: a
    text:
      es: "Si el perjuicio es igual al 75 por ciento, el incremento es de 25 puntos, que es el del tramo más alto."
  - id: b
    text:
      es: "El perjuicio económico se mide siempre en relación con la cuantía de la devolución inicialmente obtenida."
  - id: c
    text:
      es: "Si el perjuicio es igual al 10 por ciento de la base, el incremento es de 10 puntos porcentuales sobre la sanción mínima."
  - id: d
    correct: true
    text:
      es: "Si el perjuicio es igual al 10 por ciento de la base, no hay incremento, porque el primer tramo exige que sea superior al 10 por ciento."
  explanation:
    es: "El artículo 187.1.b LGT empieza a incrementar cuando el perjuicio es superior al 10 por ciento, así que el 10 exacto no suma nada. El 75 exacto pertenece al tramo anterior, de 20 puntos, porque el de 25 exige superar el 75. Y la devolución obtenida es solo una de las dos referencias posibles, junto con la cuantía que debió ingresarse."
  citation: "art. 187.1.b LGT"
  difficulty: 3
  tags:
  - "porcentaje"
  - "condición"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0070
  prompt:
    es: "Por error, Ignacio Soto obtuvo una devolución inicial de 8.000 euros en su autoliquidación y la Administración constata que le correspondían 6.000. La base de la sanción es de 2.000 euros, la cantidad devuelta indebidamente. Según el artículo 187.1.b de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué porcentaje de perjuicio económico se toma, y qué incremento supone?"
  options:
  - id: a
    correct: true
    text:
      es: "El 25 por ciento, resultado de dividir 2.000 entre la devolución inicialmente obtenida de 8.000, con un incremento de 10 puntos."
  - id: b
    text:
      es: "El 33 por ciento, resultado de dividir 2.000 entre la devolución correcta de 6.000, con un incremento de 15 puntos."
  - id: c
    text:
      es: "El 100 por ciento, porque toda devolución indebida supone un perjuicio del cien por cien, con 25 puntos de incremento."
  - id: d
    text:
      es: "El 75 por ciento, resultado de dividir 6.000 entre la devolución obtenida de 8.000, con un incremento de 20 puntos."
  explanation:
    es: "El artículo 187.1.b LGT usa como referencia el importe de la devolución inicialmente obtenida: 2.000 / 8.000 = 25 por ciento, que está en el tramo de 10 puntos. Dividir por la devolución correcta es una referencia equivocada, el perjuicio del cien por cien es una regla del artículo 191.5 para otro supuesto, y el 75 por ciento resulta de usar el numerador equivocado."
  citation: "art. 187.1.b LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0071
  prompt:
    es: "¿A partir de qué porcentaje del importe de las operaciones sujetas al deber de facturación se produce el incumplimiento sustancial de esa obligación, según el artículo 187.1.c de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Más del 50 por ciento de ese importe."
  - id: b
    correct: true
    text:
      es: "Más del 20 por ciento de ese importe."
  - id: c
    text:
      es: "Más del 25 por ciento de ese importe."
  - id: d
    text:
      es: "Más del 10 por ciento de ese importe."
  explanation:
    es: "El umbral del incumplimiento sustancial de facturación es más del 20 por ciento del importe de las operaciones, según el artículo 187.1.c LGT. El 10 por ciento es el de la ocultación, el 25 un tramo del perjuicio económico y el 50 el de la llevanza incorrecta de libros del artículo 184.3.a."
  citation: "art. 187.1.c LGT"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0072
  prompt:
    es: "Según el artículo 187.1.c de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el incumplimiento sustancial de la obligación de facturación o documentación:"
  options:
  - id: a
    text:
      es: "Se produce solo cuando el incumplimiento afecta a más del 20 por ciento del importe de las operaciones, sin otro supuesto."
  - id: b
    text:
      es: "Se produce cuando el incumplimiento afecta a más del 20 por ciento del número de facturas, y no de su importe."
  - id: c
    text:
      es: "Se produce cuando el incumplimiento supera el 50 por ciento de las operaciones del último período de liquidación."
  - id: d
    correct: true
    text:
      es: "Se produce también cuando, por el incumplimiento, la Administración no puede conocer el importe de las operaciones sujetas al deber de facturación."
  explanation:
    es: "El artículo 187.1.c LGT recoge dos supuestos: que afecte a más del 20 por ciento del importe de las operaciones o que la Administración no pueda conocer ese importe por el incumplimiento. No se mide por número de facturas ni se exige el 50 por ciento, y no se limita al primer supuesto."
  citation: "art. 187.1.c LGT"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0073
  prompt:
    es: "De acuerdo con el artículo 187.1.c de la Ley 58/2003, de 17 de diciembre, General Tributaria, en el supuesto del artículo 201.4, el incumplimiento sustancial de la obligación de facturación o documentación se produce cuando afecta a más del 20 por ciento de:"
  options:
  - id: a
    text:
      es: "Las operaciones sujetas al deber de facturación en el ejercicio, medidas por su importe total."
  - id: b
    correct: true
    text:
      es: "Los documentos de circulación expedidos o utilizados en el período objeto de comprobación o investigación."
  - id: c
    text:
      es: "Los libros y registros exigidos por la normativa tributaria en el período objeto de comprobación."
  - id: d
    text:
      es: "Las facturas emitidas en el último trimestre natural anterior a la notificación del inicio de las actuaciones."
  explanation:
    es: "En el artículo 201.4, el artículo 187.1.c LGT cambia la base de medida: el 20 por ciento se mide sobre los documentos de circulación expedidos o utilizados en el período comprobado. No se mide sobre facturas de un trimestre ni sobre el importe de las operaciones, que es la regla general, ni sobre los libros y registros."
  citation: "art. 187.1.c LGT"
  difficulty: 2
  tags:
  - "base"
# anchor: boe-a-2003-23186-art-187
- id: m03-l13-q0075
  prompt:
    es: "Conforme al artículo 187.1.d de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el acuerdo o conformidad como criterio de graduación en los procedimientos de verificación de datos y de comprobación limitada:"
  options:
  - id: a
    correct: true
    text:
      es: "Salvo que se requiera la conformidad expresa, se entiende producida siempre que la liquidación resultante no sea objeto de recurso o reclamación económico-administrativa."
  - id: b
    text:
      es: "Se entiende producida cuando transcurre el plazo para alegar sin que el obligado haya presentado alegaciones."
  - id: c
    text:
      es: "Se entiende producida solo si el obligado manifiesta por escrito su conformidad antes de la propuesta de liquidación."
  - id: d
    text:
      es: "Se entiende producida cuando el obligado paga la liquidación, aunque la haya recurrido o reclamado en vía económico-administrativa."
  explanation:
    es: "El artículo 187.1.d LGT presume la conformidad en verificación de datos y comprobación limitada cuando la liquidación no se recurre ni se reclama, salvo que se exija conformidad expresa. Pagar y recurrir a la vez es incompatible con esa presunción, y tampoco basta la inactividad en el trámite de alegaciones ni se exige escrito previo."
  citation: "art. 187.1.d LGT"
  difficulty: 3
  tags:
