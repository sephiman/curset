# anchor: fuente-ms-access-mascara-entrada-html
- id: m02-l10-q257
  prompt:
    es: "En una máscara de entrada de Access 365, ¿cuál de las siguientes opciones describe lo que ocurre si el usuario omite el carácter correspondiente a un marcador de posición #?"
  options:
  - id: a
    text:
      es: "Access completa la posición con el signo más."
  - id: b
    correct: true
    text:
      es: "Access escribe un espacio en blanco."
  - id: c
    text:
      es: "Access escribe un cero en esa posición."
  - id: d
    text:
      es: "Access rechaza el dato y muestra el texto de validación."
  explanation:
    es: "Con el carácter #, el usuario puede escribir un dígito, un espacio o un signo más o menos, y si se omite, Access escribe un espacio en blanco. Un cero lo escribiría el formato numérico con marcador 0, no la máscara. Rechazar el dato es lo que haría el carácter 0, que sí lo exige, pero con # es opcional. El signo más es solo uno de los caracteres que el usuario puede escribir."
  citation: "fuente: `ms-access-mascara-entrada.html`; «En la siguiente lista, se enumeran los caracteres literales y marcadores de posición de una máscara de entrada»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-formato-numero-html
- id: m02-l10-q259
  prompt:
    es: "En un campo Número de Access 365, ¿cuál de las siguientes opciones describe lo que hace el formato predefinido Porcentaje?"
  options:
  - id: a
    correct: true
    text:
      es: "Multiplica el valor por 100 y añade el signo %."
  - id: b
    text:
      es: "Muestra el valor con el símbolo del euro."
  - id: c
    text:
      es: "Divide el valor entre 100 y añade el signo %."
  - id: d
    text:
      es: "Muestra el valor con notación científica estándar."
  explanation:
    es: "El formato Porcentaje multiplica el valor por 100 y anexa un signo de porcentaje. Dividir entre 100 invierte la operación. La notación científica estándar es la del formato Científico. El símbolo del euro es el del formato Euro, que lo usa con independencia de la configuración regional de Windows."
  citation: "fuente: `ms-access-formato-numero.html`; «Ejemplos de formatos predefinidos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q136
  prompt:
    es: "En Access 365, ¿para qué sirve una consulta de selección, según la ayuda de Microsoft sobre consultas?"
  options:
  - id: a
    text:
      es: "Para agregar, cambiar o eliminar datos"
  - id: b
    text:
      es: "Para crear una tabla nueva a partir de otras tablas"
  - id: c
    correct: true
    text:
      es: "Para recuperar datos de una tabla o hacer cálculos"
  - id: d
    text:
      es: "Para pedir al usuario los valores de los criterios"
  explanation:
    es: "La ayuda dice que Seleccionar sirve «para recuperar datos de una tabla o hacer cálculos». Agregar, cambiar o eliminar datos es lo propio de las consultas de acción, crear una tabla nueva es la consulta de creación de tabla y pedir valores es la función de la consulta de parámetros."
  citation: "fuente: `ms-access-consultas.html`; «Principales tipos de consulta»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q137
  prompt:
    es: "Señale la afirmación correcta de la ayuda de Access 365 sobre las consultas de acción:"
  options:
  - id: a
    text:
      es: "Se pueden deshacer con Ctrl+Z mientras la base de datos siga abierta"
  - id: b
    text:
      es: "Solo se pueden deshacer si se ejecutan desde la vista Hoja de datos de la consulta"
  - id: c
    text:
      es: "Se deshacen automáticamente si la ejecución devuelve un mensaje de error"
  - id: d
    correct: true
    text:
      es: "No se pueden deshacer, por lo que conviene hacer una copia de seguridad de las tablas"
  explanation:
    es: "La ayuda advierte: «Las consultas de acciones no se pueden deshacer. Conviene que haga una copia de seguridad de las tablas». Deshacerlas con Ctrl+Z contradice «no se pueden deshacer», y hacerlo solo desde la vista Hoja de datos de la consulta contradice lo mismo, que no distingue vistas. Y deshacerse solas ante un error tampoco: la única mención que hace la página de un error en una consulta es el mensaje que dice precisamente que la consulta no se puede deshacer."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de actualización»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q138
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas de la cinta ejecuta una consulta abierta en la vista Diseño?"
  options:
  - id: a
    correct: true
    text:
      es: "Diseño de consulta › Resultados › Ejecutar"
  - id: b
    text:
      es: "Diseño de consulta › Tipo de consulta › Ejecutar"
  - id: c
    text:
      es: "Diseño de consulta › Mostrar u ocultar › Ejecutar"
  - id: d
    text:
      es: "Diseño de consulta › Configuración de consulta › Ejecutar"
  explanation:
    es: "La ayuda indica: «En la pestaña Diseño de consulta, en el grupo Resultados, haga clic en Ejecutar». Tipo de consulta contiene Crear tabla, Anexar, Actualizar y Eliminar; Mostrar u ocultar contiene Totales y Parámetros; y Configuración de consulta contiene Agregar tablas."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de selección»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q139
  prompt:
    es: "En Access 365, ¿cómo se abre la cuadrícula de diseño para crear una consulta de selección desde cero?"
  options:
  - id: a
    text:
      es: "Pestaña Inicio › Diseño de consulta"
  - id: b
    correct: true
    text:
      es: "Pestaña Crear › Diseño de consulta"
  - id: c
    text:
      es: "Pestaña Herramientas de base de datos › Diseño de consulta"
  - id: d
    text:
      es: "Pestaña Datos externos › Diseño de consulta"
  explanation:
    es: "La ayuda dice: «Abra la base de datos y, en la pestaña Crear, haga clic en Diseño de consulta». Inicio contiene la vista Ver, Herramientas de base de datos contiene Compactar y Relaciones, y Datos externos contiene Importar y Exportar, no Diseño de consulta."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de selección»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q140
  prompt:
    es: "Según la ayuda de Microsoft sobre consultas, una consulta de datos anexados de Access 365:"
  options:
  - id: a
    text:
      es: "crea una tabla nueva con los datos recuperados."
  - id: b
    text:
      es: "elimina de una tabla las filas que cumplen los criterios."
  - id: c
    text:
      es: "agrupa y resume los datos, como las ventas totales por producto."
  - id: d
    correct: true
    text:
      es: "recupera datos de una o varias tablas y los agrega a otra tabla."
  explanation:
    es: "La ayuda dice: «Puede usar una consulta de datos anexados para recuperar datos de una o varias tablas y agregar esos datos a otra tabla». Crear una tabla nueva es la consulta de creación de tabla, borrar filas es la de eliminación y agrupar y resumir datos es la de totales."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de datos anexados»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q141
  prompt:
    es: "En Access 365, ¿cuál de las siguientes filas aparece en la cuadrícula de diseño de una consulta de datos anexados para indicar el campo de destino de cada columna?"
  options:
  - id: a
    correct: true
    text:
      es: "Anexar a"
  - id: b
    text:
      es: "Actualizar a"
  - id: c
    text:
      es: "Eliminar"
  - id: d
    text:
      es: "Referencias cruzadas"
  explanation:
    es: "La ayuda dice: «En la fila Anexar a, seleccione el campo correspondiente a cada columna». Actualizar a es la fila de la consulta de actualización, Eliminar aparece al elegir una consulta de eliminación y Referencias cruzadas, en la de tabla de referencias cruzadas."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de datos anexados»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q142
  prompt:
    es: "En Access 365, ¿qué permite hacer una consulta de actualización antes de realizar la actualización?"
  options:
  - id: a
    text:
      es: "Deshacer los cambios una vez ejecutada"
  - id: b
    correct: true
    text:
      es: "Revisar los datos que se van a actualizar"
  - id: c
    text:
      es: "Cambiar la estructura de la tabla de destino"
  - id: d
    text:
      es: "Anexar los registros actualizados a otra tabla"
  explanation:
    es: "La ayuda dice: «Las consultas de actualización permiten revisar los datos actualizados antes de realizar la actualización», y añade que se puede ver qué valores cambiarán en la vista Hoja de datos. Deshacer contradice que las consultas de acciones no se pueden deshacer; cambiar la estructura de la tabla se hace aparte, en la vista Diseño de tabla, y anexar es otra consulta de acción."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de actualización»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q143
  prompt:
    es: "En Access 365, ¿cuáles de las siguientes filas desaparecen de la cuadrícula de diseño al elegir el tipo de consulta Eliminar?"
  options:
  - id: a
    text:
      es: "Campo y Tabla"
  - id: b
    text:
      es: "Criterios y o"
  - id: c
    text:
      es: "Total y Referencias cruzadas"
  - id: d
    correct: true
    text:
      es: "Ordenar y Mostrar"
  explanation:
    es: "La ayuda dice: «En la cuadrícula de diseño, las filas Ordenar y Mostrar desaparecen y aparece la fila Eliminar». Campo y Tabla siguen siendo necesarias para elegir el campo, Criterios se usa en el ejemplo para escribir «Es nulo», y Total y Referencias cruzadas son filas de otros tipos de consulta."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de eliminación»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q144
  prompt:
    es: "Señale qué hace Access 365 si ya existe una tabla con el mismo nombre que la que va a crear una consulta de creación de tabla:"
  options:
  - id: a
    correct: true
    text:
      es: "La elimina antes de que se inicie la consulta"
  - id: b
    text:
      es: "Anexa los datos nuevos a las filas de la tabla existente"
  - id: c
    text:
      es: "Cancela la consulta y muestra un mensaje de error"
  - id: d
    text:
      es: "Sobrescribe solo los campos que tienen el mismo nombre"
  explanation:
    es: "La nota de la ayuda dice: «Si ya hay una tabla con el mismo nombre, Access la elimina antes de que se inicie la consulta». No anexa los datos (eso es una consulta de datos anexados), no cancela con un error y no sobrescribe campo a campo."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de creación de tabla»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q145
  prompt:
    es: "En Access 365, ¿cuál de los siguientes tipos de consulta permite agrupar y resumir datos, por ejemplo las ventas totales por producto?"
  options:
  - id: a
    text:
      es: "Una consulta de actualización"
  - id: b
    correct: true
    text:
      es: "Una consulta de totales"
  - id: c
    text:
      es: "Una consulta de eliminación"
  - id: d
    text:
      es: "Una consulta de creación de tabla"
  explanation:
    es: "La ayuda dice: «Una consulta de totales es una consulta de selección que permite agrupar y resumir datos, por ejemplo, cuando se quieren ver las ventas totales por producto». Las de actualización y eliminación cambian o borran datos y la de creación de tabla genera una tabla nueva."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de totales»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q146
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas de la cinta muestra la fila Total en la cuadrícula de diseño de una consulta?"
  options:
  - id: a
    text:
      es: "Diseño de consulta › Resultados › Totales"
  - id: b
    text:
      es: "Diseño de consulta › Tipo de consulta › Totales"
  - id: c
    correct: true
    text:
      es: "Diseño de consulta › Mostrar u ocultar › Totales"
  - id: d
    text:
      es: "Diseño de consulta › Configuración de consulta › Totales"
  explanation:
    es: "La ayuda indica: «En la pestaña Diseño de consulta, en el grupo Mostrar u ocultar, haga clic en Totales. Aparece la fila Totales en la cuadrícula de diseño de la consulta». Resultados contiene Ejecutar, Tipo de consulta contiene los tipos de acción y Configuración de consulta contiene Agregar tablas."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de totales»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-criterios-html
- id: m02-l10-q147
  prompt:
    es: "En Access 365, si es suficiente que se cumpla uno de dos conjuntos de criterios independientes, ¿dónde se escriben?"
  options:
  - id: a
    text:
      es: "Los dos en la fila Criterios del mismo campo, unidos con Y"
  - id: b
    correct: true
    text:
      es: "En las filas Criterios y o de la cuadrícula de diseño"
  - id: c
    text:
      es: "En la fila Mostrar de cada campo"
  - id: d
    text:
      es: "En la fila Total de cada campo"
  explanation:
    es: "La ayuda dice que, con criterios alternativos, se usan «ambos Criterios y las filas o en la cuadrícula de diseño» y se combinan con el operador O. Unir los dos con Y exigiría que se cumplieran ambos, y las filas Mostrar y Total sirven para ocultar un campo y para resumir datos, no para escribir criterios."
  citation: "fuente: `ms-access-criterios.html`; «Introducción a los criterios de búsqueda»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-criterios-html
- id: m02-l10-q148
  prompt:
    es: "En un criterio de consulta de Access 365, ¿cómo se escribe un valor de fecha como el 2 de febrero de 2006?"
  options:
  - id: a
    text:
      es: "Entre comillas dobles, como \"02/02/2006\""
  - id: b
    text:
      es: "Entre corchetes, como [02/02/2006]"
  - id: c
    correct: true
    text:
      es: "Rodeado del carácter #, como #02/02/2006#"
  - id: d
    text:
      es: "Precedido del signo =, como =02/02/2006 sin delimitadores"
  explanation:
    es: "La ayuda dice: «Recuerde rodear los valores de fecha con el carácter # para que Access pueda distinguir entre valores de fecha y cadenas de texto». Las comillas dobles delimitan cadenas de texto, y los corchetes encierran nombres de campo o la pregunta de un parámetro, como [¿Qué ciudad?]. Escribirla sin delimitadores no distingue la fecha del texto."
  citation: "fuente: `ms-access-criterios.html`; «Criterios para campos de fecha y hora»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-access-criterios-html
- id: m02-l10-q149
  prompt:
    es: "En una consulta de Access 365, el criterio Longitud([PaísRegión]) > 10 en el campo de países devuelve:"
  options:
  - id: a
    text:
      es: "los países cuyo nombre tiene 10 caracteres o menos."
  - id: b
    text:
      es: "los países cuyo nombre empieza por «10»."
  - id: c
    text:
      es: "los países cuyo nombre acaba con la cadena «10»."
  - id: d
    correct: true
    text:
      es: "los países cuyo nombre tiene más de 10 caracteres."
  explanation:
    es: "La ayuda dice que ese criterio devuelve «registros de países y regiones cuyo nombre esté formado por más de 10 caracteres». Los de 10 o menos serían la condición contraria, y empezar o acabar por una cadena se expresa con Como U* o Como \"*ina\", no con Longitud."
  citation: "fuente: `ms-access-criterios.html`; «Criterios para campos de texto, Memo e hipervínculo»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-criterios-html
- id: m02-l10-q150
  prompt:
    es: "En Access 365, ¿cuál de las siguientes expresiones equivale al criterio Entre #02/02/2006# y #04/02/2006#?"
  options:
  - id: a
    text:
      es: ">#02/02/2006# y <#04/02/2006#"
  - id: b
    text:
      es: "<#02/02/2006# o >#04/02/2006#"
  - id: c
    text:
      es: "#02/02/2006# o #04/02/2006#"
  - id: d
    correct: true
    text:
      es: ">=#02/02/2006# y <=#04/02/2006#"
  explanation:
    es: "La ayuda dice: «Entre #02/02/2006# y #04/02/2006# es lo mismo que >=#02/02/2006# y <=#04/02/2006#», incluidos los extremos. >… y <… deja fuera ambas fechas; <… o >… devuelve las transacciones fuera del intervalo y #02/02/2006# o #04/02/2006# devuelve solo las de esos dos días."
  citation: "fuente: `ms-access-criterios.html`; «Criterios para campos de fecha y hora»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q151
  prompt:
    es: "En una consulta de Access 365, ¿qué ocurre al desactivar la casilla Mostrar de un campo que tiene un criterio?"
  options:
  - id: a
    text:
      es: "El criterio deja de aplicarse al ocultar el campo"
  - id: b
    correct: true
    text:
      es: "El criterio se sigue aplicando, pero el campo no aparece en el resultado"
  - id: c
    text:
      es: "El campo se elimina de la cuadrícula de diseño de la consulta"
  - id: d
    text:
      es: "El campo aparece en el resultado, pero sin su criterio"
  explanation:
    es: "La ayuda dice: «No es necesario mostrar un campo para usarlo con un criterio»; desactivar Mostrar hace que la consulta no muestre el campo. Por tanto el criterio no deja de aplicarse, el campo no se elimina de la cuadrícula y no aparece sin criterio."
  citation: "fuente: `ms-access-consultas.html`; «Revisar los datos de varias tablas relacionadas a la vez»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q154
  prompt:
    es: "En Access 365, ¿cuál de las siguientes entradas en la fila Criterios hace que la consulta pida al usuario la ciudad al ejecutarse?"
  options:
  - id: a
    correct: true
    text:
      es: "[¿Qué ciudad?]"
  - id: b
    text:
      es: "¿Qué ciudad?"
  - id: c
    text:
      es: "\"¿Qué ciudad?\""
  - id: d
    text:
      es: "(¿Qué ciudad?)"
  explanation:
    es: "La ayuda dice: «La cadena [¿Qué ciudad?] es la petición de parámetros. Los corchetes indican que quiere que la consulta pida información». Sin corchetes, con comillas o con paréntesis no se cumple esa condición: la página solo da los corchetes como forma de pedir el valor."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de parámetros»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q155
  prompt:
    es: "Según la ayuda de Access 365, ¿cuál de las siguientes acciones realiza una consulta de parámetros cuando se inicia?"
  options:
  - id: a
    text:
      es: "Agrega a otra tabla los datos que recupera"
  - id: b
    correct: true
    text:
      es: "Pide los valores de los campos y los usa como criterios"
  - id: c
    text:
      es: "Muestra solo los campos numéricos de las tablas de origen"
  - id: d
    text:
      es: "Elimina las filas que no cumplen los criterios"
  explanation:
    es: "La ayuda dice: «Cuando inicia una consulta de este tipo, la consulta pide los valores de los campos y, después, usa los valores especificados para crear los criterios de la consulta». Agregar datos a otra tabla es la consulta de datos anexados, eliminar filas es la de eliminación y mostrar solo campos numéricos no lo describe la página para ningún tipo de consulta."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de parámetros»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q156
  prompt:
    es: "En Access 365, con el criterio Como [¿Qué ciudad?]&\"*\" en la columna Ciudad, ¿qué devuelve la consulta si el usuario escribe L?"
  options:
  - id: a
    text:
      es: "Todas las ciudades que contienen la letra L"
  - id: b
    text:
      es: "Solo la ciudad cuyo nombre es exactamente L"
  - id: c
    text:
      es: "Todas las ciudades que acaban en la letra L"
  - id: d
    correct: true
    text:
      es: "Todas las ciudades que empiezan por la letra L"
  explanation:
    es: "La ayuda dice que, con ese criterio, «si el usuario escribe L, la consulta devolverá todas las ciudades que empiecen por la letra «L»». Las que contienen la letra corresponden a escribir *s*, y un asterisco solo al final no selecciona ni una ciudad exacta ni las que acaban en la letra."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de parámetros»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q157
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas de la cinta permite especificar el tipo de datos de los parámetros de una consulta?"
  options:
  - id: a
    correct: true
    text:
      es: "Diseño de consulta › Mostrar u ocultar › Parámetros"
  - id: b
    text:
      es: "Diseño de consulta › Resultados › Parámetros"
  - id: c
    text:
      es: "Diseño de consulta › Tipo de consulta › Parámetros"
  - id: d
    text:
      es: "Diseño de consulta › Configuración de consulta › Parámetros"
  explanation:
    es: "La ayuda indica: «en la pestaña Diseño de la consulta, en el grupo Mostrar u ocultar, haga clic en Parámetros». Resultados contiene Ejecutar, Tipo de consulta contiene Crear tabla, Anexar, Actualizar y Eliminar, y Configuración de consulta contiene Agregar tablas."
  citation: "fuente: `ms-access-consultas.html`; «Especificar los tipos de datos de los parámetros»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q158
  prompt:
    es: "Si en Access 365 se establece un parámetro para que acepte datos de texto, ¿qué ocurre con la entrada del usuario?"
  options:
  - id: a
    text:
      es: "Se rechaza si contiene dígitos, con un mensaje de error"
  - id: b
    correct: true
    text:
      es: "Se interpreta como texto, sin ningún mensaje de error"
  - id: c
    text:
      es: "Se convierte en número siempre que sea posible"
  - id: d
    text:
      es: "Aparece un mensaje de error específico si no es una fecha"
  explanation:
    es: "La ayuda dice: «Si se establece un parámetro para que acepte datos de texto, cualquier entrada se interpreta como texto y no aparece ningún mensaje de error». Por eso no se rechazan los dígitos, no se convierte en número y no se exige una fecha; los mensajes más específicos aparecen con tipos numéricos, de moneda o de fecha y hora."
  citation: "fuente: `ms-access-consultas.html`; «Especificar los tipos de datos de los parámetros»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-criterios-html
- id: m02-l10-q160
  prompt:
    es: "En Access 365, ¿cuál de los siguientes tipos de consulta conviene crear si los campos de criterios no cambian, pero sí los valores que se usan?"
  options:
  - id: a
    text:
      es: "Una consulta de eliminación"
  - id: b
    text:
      es: "Una consulta de totales"
  - id: c
    text:
      es: "Una consulta de creación de tabla"
  - id: d
    correct: true
    text:
      es: "Una consulta de parámetros"
  explanation:
    es: "La ayuda dice: «Si los campos de criterios no cambian pero los valores que quiere usar cambian a menudo, puede crear una consulta de parámetros», que pide los valores y crea con ellos los criterios. Una de eliminación borra filas, una de totales agrupa y resume datos y una de creación de tabla genera una tabla nueva."
  citation: "fuente: `ms-access-criterios.html`; «Introducción a los criterios de búsqueda»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q161
  prompt:
    es: "Según la ayuda de Access 365, ¿por qué no conviene almacenar en una tabla valores calculados, como la edad de una persona?"
  options:
  - id: a
    correct: true
    text:
      es: "Porque dejan de estar actualizados si cambian los datos en que se basan"
  - id: b
    text:
      es: "Porque una tabla no admite expresiones en ninguno de sus campos"
  - id: c
    text:
      es: "Porque ocupan más de 2 GB en la base de datos de Access"
  - id: d
    text:
      es: "Porque solo se pueden guardar mediante consultas de acción y no en formularios"
  explanation:
    es: "La ayuda dice que normalmente las tablas no almacenan valores calculados «ya que los valores calculados dejan de estar actualizados si cambian los valores en los que están basados». Que no admita expresiones es falso, porque existen reglas de validación y el tipo Calculado; el límite de 2 GB es el tamaño total de la base de datos, y las consultas de acción no se citan como único modo de guardarlos."
  citation: "fuente: `ms-access-consultas.html`; «Hacer cálculos basados en los datos»"
  difficulty: 2
  tags:
  - "concepto"
