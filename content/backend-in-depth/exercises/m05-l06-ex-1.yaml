- id: m05-l06-q09
  prompt:
    en: Spring Security lets you inject several `AuthenticationProvider` instances into `ProviderManager`. Which
      provider supports authenticating a JWT token?
  options:
  - id: a
    text:
      en: '`DaoAuthenticationProvider`'
  - id: b
    text:
      en: '`ProviderManager`'
  - id: c
    text:
      en: '`JwtDecoder`'
  - id: d
    correct: true
    text:
      en: '`JwtAuthenticationProvider`'
  explanation:
    en: '`JwtAuthenticationProvider` supports authenticating a JWT token. `DaoAuthenticationProvider` handles another
      kind of authentication, because it supports username/password-based authentication. `ProviderManager` is not
      a provider, because it is the most common implementation of `AuthenticationManager`. `JwtDecoder` is not the
      provider, because `JwtAuthenticationProvider` uses it to decode, verify and validate the `Jwt`.'
  citation: spring-security-servlet-authentication-architecture#servlet-authentication-authenticationprovider
