type: case
title:
  en: Search and autocomplete
scenario:
  en: 'An online marketplace lists 40 million products. Shoppers type into a search box and expect suggestions after
    every keystroke, then expect relevant, stable result pages when they submit. The catalogue lives in Elasticsearch,
    with the product database as the source of truth.


    The search team has three jobs to design:


    - Autocomplete. The title field must complete partially typed words and phrases within a few milliseconds. The
    team compares a `search_as_you_type` field with its shingle subfields, a field mapped as `completion` for the
    completion suggester, and the term suggester for misspellings.

    - Relevance. Results are ranked with the default similarity of Elasticsearch, and the team wants to understand
    how term frequency, document frequency and document length affect scores, and which parameters tune them.

    - Pagination. Some users, and some export jobs, page through tens of thousands of hits. The team must keep pages
    consistent while documents are indexed and refreshed.


    An inverted index stores the dictionary of terms and a posting list for each term, and the query text is analysed
    in the same way as the indexed text.'
questions:
- id: m09-case-f-q01
  lesson: m09-l04
  prompt:
    en: A product catalogue maps its `name` field as `search_as_you_type` in Elasticsearch to serve completions
      while the user types. Which kinds of completion does a `search_as_you_type` field support?
  options:
  - id: a
    text:
      en: Prefix completion only, matching from the start of the text
  - id: b
    correct: true
    text:
      en: Both prefix completion and infix completion
  - id: c
    text:
      en: Infix completion only, matching inside the text
  - id: d
    text:
      en: Neither kind, because completion needs a `completion` field
  explanation:
    en: A `search_as_you_type` field supports both prefix completion and infix completion. Prefix only is wrong,
      because a `search_as_you_type` field supports both prefix and infix completion. Infix only is wrong, because
      a `search_as_you_type` field supports both prefix and infix completion. Needing a `completion` field is wrong,
      because a `search_as_you_type` field supports prefix and infix completion itself.
  citation: es-search-as-you-type#elastic-docs-v3
- id: m09-case-f-q02
  lesson: m09-l04
  prompt:
    en: In Elasticsearch, a `search_as_you_type` field `my_field` has the subfield `my_field._index_prefix`. Which
      token filter does that subfield add on top of the analyzer of `my_field._3gram`?
  options:
  - id: a
    correct: true
    text:
      en: An edge ngram token filter
  - id: b
    text:
      en: A shingle token filter of the subfield
  - id: c
    text:
      en: A stop-word token filter on the subfield
  - id: d
    text:
      en: A synonym token filter on the subfield
  explanation:
    en: '`my_field._index_prefix` wraps the analyzer of `my_field._3gram` with an edge ngram token filter. A shingle
      token filter is wrong, because `my_field._index_prefix` wraps the analyzer of `my_field._3gram` with an edge
      ngram token filter. A stop-word filter is wrong, because the wrapping filter is an edge ngram token filter.
      A synonym filter is wrong, because the wrapping filter is an edge ngram token filter.'
  citation: es-search-as-you-type#elastic-docs-v3
- id: m09-case-f-q05
  lesson: m09-l04
  prompt:
    en: An Elasticsearch catalogue serves a search-as-you-type box over a `search_as_you_type` field. Which query
      is usually the most efficient way to serve that use case, according to the Elasticsearch documentation?
  options:
  - id: a
    correct: true
    text:
      en: A `multi_match` query of type `bool_prefix` over the root and shingle fields
  - id: b
    text:
      en: A `match_phrase_prefix` query on the root field, which requires the terms in order
  - id: c
    text:
      en: A completion suggester query over the `search_as_you_type` field and its subfields
  - id: d
    text:
      en: A term suggester query that corrects the typed text by edit distance
  explanation:
    en: The most efficient way to serve search-as-you-type is usually a `multi_match` query of type `bool_prefix`
      over the root field and its shingle subfields. `match_phrase_prefix` is wrong, because using phrase queries
      may be less efficient than the `bool_prefix` approach. The completion suggester is wrong here, because it
      requires the field to be mapped as type `completion`. The term suggester is wrong, because its score is based
      on edit distance, so it suggests similar looking terms rather than completions.
  citation: es-search-as-you-type#elastic-docs-v3
- id: m09-case-f-q07
  lesson: m09-l04
  prompt:
    en: A team wants the Elasticsearch completion suggester for the `title` field of its catalogue. As which field
      type must `title` be mapped to use the completion suggester?
  options:
  - id: a
    text:
      en: '`search_as_you_type`'
  - id: b
    correct: true
    text:
      en: '`completion`'
  - id: c
    text:
      en: '`keyword`'
  - id: d
    text:
      en: '`text` with an edge ngram analyzer'
  explanation:
    en: To use the completion suggester, the field must be mapped as type `completion`. `search_as_you_type` is
      wrong, because the field must be mapped as type `completion` for the completion suggester. `keyword` is wrong,
      because the field must be mapped as type `completion` for the completion suggester. A `text` field with an
      edge ngram analyzer is wrong, because the field must be mapped as type `completion` for the completion suggester.
  citation: es-completion-mapping#elastic-docs-v3
- id: m09-case-f-q08
  lesson: m09-l04
  prompt:
    en: A search page uses the Elasticsearch term suggester through the `suggest` parameter to correct misspelled
      words. On what is the score of the term suggester based?
  options:
  - id: a
    text:
      en: The BM25 relevance of the suggested term
  - id: b
    text:
      en: The length of the posting list of the term
  - id: c
    correct: true
    text:
      en: The edit distance
  - id: d
    text:
      en: The number of shingles in the subfield
  explanation:
    en: The score of the term suggester is based on the edit distance. BM25 relevance is wrong, because the term
      suggester's score is based on the edit distance. Posting list length is wrong, because the term suggester's
      score is based on the edit distance. The number of shingles is wrong, because the term suggester's score is
      based on the edit distance.
  citation: es-search-suggesters#elastic-docs-v3
- id: m09-case-f-q09
  lesson: m09-l04
  prompt:
    en: An Elasticsearch index ranks product search results and the team has not changed the similarity setting.
      Which similarity algorithm does Elasticsearch use by default to calculate relevance scores?
  options:
  - id: a
    text:
      en: Plain TF-IDF without length normalisation
  - id: b
    correct: true
    text:
      en: Okapi BM25
  - id: c
    text:
      en: A link-based score over the links between documents
  - id: d
    text:
      en: Cosine similarity between document embeddings
  explanation:
    en: The default similarity algorithm is Okapi BM25, a variation of the TF-IDF algorithm. Plain TF-IDF is wrong,
      because the default is Okapi BM25, a variation of the TF-IDF algorithm. A link-based score is wrong, because
      the default is Okapi BM25. Embedding cosine similarity is wrong, because the default is Okapi BM25.
  citation: es-how-full-text-works#elastic-docs-v3
- id: m09-case-f-q13
  lesson: m09-l04
  prompt:
    en: In an Elasticsearch inverted index, each term has a posting list. What does the posting list hold for a
      term?
  options:
  - id: a
    correct: true
    text:
      en: The IDs of documents where the term appears, with optional frequency and position
  - id: b
    text:
      en: A sorted list of all unique terms in the index
  - id: c
    text:
      en: The relevance score of the term for each document
  - id: d
    text:
      en: The analyzed form of the user's query text
  explanation:
    en: The posting list holds, for each term, a list of document IDs where the term appears, along with optional
      metadata like term frequency and position. A list of unique terms is wrong, because that is the dictionary
      of an inverted index. A relevance score is wrong, because BM25 calculates scores from term frequency, document
      frequency and document length. The analyzed query text is wrong, because query text is analyzed at search
      time the same way as the indexed text.
  citation: es-how-full-text-works#elastic-docs-v3
- id: m09-case-f-q14
  lesson: m09-l04
  prompt:
    en: Elasticsearch ranks product search hits with Okapi BM25. Which factors does BM25 use to calculate relevance
      scores, according to the Elasticsearch documentation?
  options:
  - id: a
    text:
      en: Term frequency alone
  - id: b
    text:
      en: Term frequency and the age of the document
  - id: c
    text:
      en: Term frequency, field boost and shard count
  - id: d
    correct: true
    text:
      en: Term frequency, document frequency and document length
  explanation:
    en: BM25 calculates relevance scores based on term frequency, document frequency, and document length. Term
      frequency alone is wrong, because BM25 also uses document frequency and document length. Document age is wrong,
      because BM25 uses term frequency, document frequency and document length. Field boost and shard count are
      wrong, because BM25 uses term frequency, document frequency and document length.
  citation: es-how-full-text-works#elastic-docs-v3
- id: m09-case-f-q16
  lesson: m09-l04
  prompt:
    en: A search team runs the Elasticsearch `suggest` parameter over several indices. Which use of `suggest` does
      the documentation say is not supported?
  options:
  - id: a
    text:
      en: On one index with a field mapped as `completion`
  - id: b
    text:
      en: With the term suggester on a text field
  - id: c
    text:
      en: To suggest similar looking terms from a given text
  - id: d
    correct: true
    text:
      en: Across multiple indices with different analysis chains
  explanation:
    en: Using `suggest` across multiple indices with different analysis chains is not supported. A `completion`
      field is wrong, because mapping a field as `completion` indexes its values for fast completions. The term
      suggester is wrong, because it scores suggestions by edit distance and is a supported suggester. Suggesting
      similar looking terms is wrong, because that is what the `suggest` parameter does by using a suggester.
  citation: es-search-suggesters#elastic-docs-v3
- id: m09-case-f-q17
  lesson: m09-l04
  prompt:
    en: A search box must match the typed terms strictly in order on a `search_as_you_type` field in Elasticsearch.
      Which query does the documentation name for that?
  options:
  - id: a
    text:
      en: A `bool_prefix` query, which matches the terms in any order
  - id: b
    text:
      en: A completion suggester over the field
  - id: c
    correct: true
    text:
      en: A `match_phrase_prefix` query on the root field
  - id: d
    text:
      en: A term suggester over the field
  explanation:
    en: To search for documents that strictly match the query terms in order, use a `match_phrase_prefix` query
      on the root field. A `bool_prefix` query is wrong, because it can match the query terms in any order. The
      completion suggester is wrong, because it needs the field mapped as type `completion`. The term suggester
      is wrong, because its score is based on edit distance, not on term order.
  citation: es-search-as-you-type#elastic-docs-v3
