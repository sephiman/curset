  prompt:
    es: "Según los artículos 242.3, 243.4 y 244.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en cuál de los siguientes recursos la resolución se dicta en el plazo de tres meses?"
  options:
