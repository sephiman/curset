# anchor: boe-a-1992-28740-art-13
- id: m03-l18-q0073
  prompt:
    es: "Según el artículo 13.1.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué adquisiciones intracomunitarias de bienes están sujetas cuando el transmitente es un empresario o profesional?"
  options:
  - id: a
    text:
      es: "Las efectuadas a título oneroso solo por empresarios que tengan derecho a deducir el impuesto soportado."
  - id: b
    text:
      es: "Las efectuadas a título gratuito o a título oneroso por cualquier persona física residente en España."
  - id: c
    correct: true
    text:
      es: "Las efectuadas a título oneroso por empresarios, profesionales o personas jurídicas que no actúen como tales."
  - id: d
    text:
      es: "Las efectuadas a título oneroso por empresarios o profesionales, pero no las de personas jurídicas que no actúen como tales."
  explanation:
    es: "La regla general alcanza las adquisiciones onerosas de empresarios, profesionales y personas jurídicas que no actúen como tales, si el transmitente es empresario o profesional. Quedan fuera las adquisiciones gratuitas de particulares, la limitación a empresarios con derecho a deducir no existe y las personas jurídicas que no actúan como empresarios sí están incluidas."
  citation: "art. 13.1.ª LIVA"
  difficulty: 2
  tags:
  - "adquisiciones intracomunitarias"
  - "hecho imponible"
# anchor: boe-a-1992-28740-art-13
- id: m03-l18-q0074
  prompt:
    es: "Conforme al artículo 13.1.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, no se comprenden en las adquisiciones intracomunitarias sujetas las de bienes cuya entrega efectúe un empresario o profesional que se beneficie del régimen de franquicia del impuesto en:"
  options:
  - id: a
    correct: true
    text:
      es: "el Estado miembro desde el que se inicie la expedición o el transporte de los bienes."
  - id: b
    text:
      es: "el Estado miembro de llegada de la expedición o del transporte de los bienes."
  - id: c
    text:
      es: "un país tercero desde el que se importen los bienes a la Comunidad."
  - id: d
    text:
      es: "el territorio de aplicación del impuesto en que esté establecido el adquirente de los bienes."
  explanation:
    es: "La franquicia que cuenta es la del empresario en el Estado miembro de salida de los bienes. La del Estado de llegada, la del territorio de aplicación del impuesto donde está el adquirente y la de un país tercero no son el supuesto del precepto."
  citation: "art. 13.1.ª.a) LIVA"
  difficulty: 3
  tags:
  - "adquisiciones intracomunitarias"
  - "franquicia"
# anchor: boe-a-1992-28740-art-13
- id: m03-l18-q0076
  prompt:
    es: "Elena Roca, particular que reside en Madrid, compra en Italia a otro particular una motocicleta de 125 cm³ matriculada hace dos meses, con 800 kilómetros recorridos, y la trae a España. Conforme al artículo 13.2.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cómo se califica la operación?"
  options:
  - id: a
    text:
      es: "Como operación no sujeta, porque la motocicleta no supera los 48 cm³ de cilindrada."
  - id: b
    text:
      es: "Como adquisición intracomunitaria sujeta solo si la motocicleta supera los 6.000 kilómetros."
  - id: c
    text:
      es: "Como operación no sujeta, porque el transmitente no es empresario o profesional."
  - id: d
    correct: true
    text:
      es: "Como adquisición intracomunitaria sujeta, porque es un medio de transporte nuevo y la adquirente no es empresaria ni profesional."
  explanation:
    es: "La motocicleta supera los 48 cm³ y tiene dos meses y 800 kilómetros, así que es un medio de transporte nuevo. La adquirente no es empresaria, por lo que la adquisición está sujeta aunque el transmitente sea un particular. Los 6.000 kilómetros son un máximo para considerarlo nuevo, no un mínimo."
  citation: "art. 13.2.ª LIVA"
  difficulty: 2
  tags:
  - "adquisiciones intracomunitarias"
  - "medios de transporte nuevos"
  - "cómputo"
# anchor: boe-a-1992-28740-art-13
- id: m03-l18-q0077
  prompt:
    es: "¿Cuál de los siguientes medios tiene la consideración de medio de transporte a los efectos del artículo 13.2.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Una aeronave con un peso total al despegue de 1.500 kilogramos."
  - id: b
    text:
      es: "Una embarcación de recreo con una eslora máxima de 7 metros."
  - id: c
    text:
      es: "Un vehículo terrestre a motor de 45 cm³ de cilindrada y 6 Kw de potencia."
  - id: d
    correct: true
    text:
      es: "Una embarcación de recreo con una eslora máxima de 8 metros."
  explanation:
    es: "Una embarcación es medio de transporte si su eslora máxima supera los 7,5 metros, y 8 la supera. Una de 7 metros, un vehículo de 45 cm³ y 6 Kw que no llega a 48 cm³ ni a 7,2 Kw y una aeronave de 1.500 kilogramos, por debajo de 1.550, no alcanzan los umbrales."
  citation: "art. 13.2.ª LIVA"
  difficulty: 2
  tags:
  - "adquisiciones intracomunitarias"
  - "medios de transporte"
# anchor: boe-a-1992-28740-art-13
- id: m03-l18-q0078
  prompt:
    es: "Señale la respuesta CORRECTA sobre el concepto de medio de transporte, según el artículo 13.2.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Las embarcaciones lo son si su eslora máxima es superior a 5 metros, sea cual sea su destino."
  - id: b
    correct: true
    text:
      es: "Los vehículos terrestres accionados a motor lo son si su cilindrada es superior a 48 cm³ o su potencia excede de 7,2 Kw."
  - id: c
    text:
      es: "Los vehículos terrestres accionados a motor lo son solo si su cilindrada es superior a 125 cm³ y su potencia excede de 7,2 Kw."
  - id: d
    text:
      es: "Las aeronaves lo son si su peso total al despegue excede de 1.000 kilogramos."
  explanation:
    es: "Un vehículo terrestre a motor es medio de transporte si cumple uno de los dos umbrales, 48 cm³ o 7,2 Kw, sin necesidad de ambos. Para las embarcaciones el límite es una eslora de 7,5 metros, con la excepción de las que gocen de la exención del artículo 22, y para las aeronaves 1.550 kilogramos."
  citation: "art. 13.2.ª LIVA"
  difficulty: 3
  tags:
  - "adquisiciones intracomunitarias"
  - "medios de transporte"
# anchor: boe-a-1992-28740-art-13
- id: m03-l18-q0079
  prompt:
    es: "De acuerdo con el artículo 13.2.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, los medios de transporte son nuevos cuando su entrega se efectúe antes de los tres meses siguientes a la fecha de su primera puesta en servicio o, tratándose de vehículos terrestres accionados a motor, antes de:"
  options:
  - id: a
    correct: true
    text:
      es: "los seis meses siguientes a la citada fecha."
  - id: b
    text:
      es: "los nueve meses siguientes a la primera puesta en servicio, sea cual sea su kilometraje."
  - id: c
    text:
      es: "los doce meses siguientes a la fecha de matriculación del vehículo en el país de origen."
  - id: d
    text:
      es: "los tres meses siguientes a la citada fecha, como el resto de medios de transporte."
  explanation:
    es: "Para los vehículos terrestres a motor el plazo es de seis meses desde la primera puesta en servicio. Tres meses es el plazo del resto de medios de transporte, y no existe un plazo de nueve ni de doce meses."
  citation: "art. 13.2.ª LIVA"
  difficulty: 1
  tags:
  - "adquisiciones intracomunitarias"
  - "medios de transporte nuevos"
# anchor: boe-a-1992-28740-art-13
- id: m03-l18-q0080
  prompt:
    es: "Ignacio Lara, particular, compra el 10 de junio de 2025 en Francia una furgoneta a motor de 1.600 cm³ que se puso en servicio por primera vez el 1 de diciembre de 2024 y ha recorrido 9.000 kilómetros. Según el artículo 13.2.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿tiene la consideración de medio de transporte nuevo?"
  options:
  - id: a
    text:
      es: "Sí, porque la entrega se hace antes de los seis meses siguientes a la puesta en servicio."
  - id: b
    text:
      es: "Sí, porque el comprador es un particular, con independencia de las fechas de entrega y de los kilómetros que haya recorrido."
  - id: c
    correct: true
    text:
      es: "No, porque la entrega se hace pasados seis meses desde la puesta en servicio y ha recorrido más de 6.000 kilómetros."
  - id: d
    text:
      es: "Sí, porque no ha recorrido más de 10.000 kilómetros desde su puesta en servicio."
  explanation:
    es: "Los seis meses siguientes al 1 de diciembre de 2024 terminan el 1 de junio de 2025, y la entrega del 10 de junio es posterior. Con 9.000 kilómetros se supera también el máximo de 6.000, así que no se da ninguna de las dos circunstancias. La condición de particular del comprador no cambia el concepto de medio de transporte nuevo."
  citation: "art. 13.2.ª LIVA"
  difficulty: 3
  tags:
  - "adquisiciones intracomunitarias"
  - "medios de transporte nuevos"
  - "cómputo"
# anchor: boe-a-1992-28740-art-13
- id: m03-l18-q0081
  prompt:
    es: "Señale la respuesta CORRECTA sobre cuándo un medio de transporte es nuevo, según el artículo 13.2.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    correct: true
    text:
      es: "Un vehículo terrestre es nuevo si no ha recorrido más de 6.000 kilómetros, aunque se entregue pasados seis meses desde su puesta en servicio."
  - id: b
    text:
      es: "Una embarcación es nueva si no ha navegado más de 40 horas, y una aeronave si no ha volado más de 100 horas."
  - id: c
    text:
      es: "Una aeronave es nueva si su entrega se efectúa antes de los seis meses siguientes a su primera puesta en servicio."
  - id: d
    text:
      es: "Un vehículo terrestre es nuevo solo si cumple a la vez el límite de 6.000 kilómetros y el de seis meses desde su primera puesta en servicio en cualquier país."
  explanation:
    es: "Basta que se dé cualquiera de las dos circunstancias: la entrega dentro del plazo o no superar los límites de uso. Un vehículo con menos de 6.000 kilómetros es nuevo aunque pase el plazo. Los límites son 100 horas de navegación y 40 de vuelo, no al revés, y los seis meses solo valen para los vehículos terrestres."
  citation: "art. 13.2.ª LIVA"
  difficulty: 3
  tags:
  - "adquisiciones intracomunitarias"
  - "medios de transporte nuevos"
# anchor: boe-a-1992-28740-art-13
- id: m03-l18-q0082
  prompt:
    es: "¿Quiénes pueden realizar adquisiciones intracomunitarias sujetas, además de los empresarios y profesionales, conforme al artículo 13.1.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Las personas jurídicas que actúen como empresarios, pero no las que adquieran como consumidores finales."
  - id: b
    text:
      es: "Las entidades sin personalidad jurídica que adquieran bienes por un importe superior a 10.000 euros."
  - id: c
    text:
      es: "Los particulares que adquieran cualquier bien en otro Estado miembro, aunque el transmitente no sea empresario ni profesional."
  - id: d
    correct: true
    text:
      es: "Las personas jurídicas que no actúen como empresarios o profesionales, cuando el transmitente sea un empresario o profesional."
  explanation:
    es: "La regla incluye a las personas jurídicas que no actúan como empresarios, siempre que el transmitente sea empresario o profesional. Los particulares solo están sujetos en medios de transporte nuevos, y la cifra de 10.000 euros no es un requisito de este precepto. Tampoco se excluye a las personas jurídicas que no actúan como tales."
  citation: "art. 13.1.ª LIVA"
  difficulty: 2
  tags:
  - "adquisiciones intracomunitarias"
  - "personas jurídicas"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0083
  prompt:
    es: "Según el artículo 20.Uno.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿bajo qué condición están exentas las prestaciones de hospitalización o asistencia sanitaria realizadas por entidades o establecimientos privados?"
  options:
  - id: a
    text:
      es: "Que el establecimiento carezca de finalidad lucrativa y reinvierta sus beneficios."
  - id: b
    correct: true
    text:
      es: "Que se presten en régimen de precios autorizados o comunicados."
  - id: c
    text:
      es: "Que el establecimiento sea calificado como entidad de carácter social por la Administración."
  - id: d
    text:
      es: "Que se presten en régimen de precios concertados con la Seguridad Social."
  explanation:
    es: "Los establecimientos privados quedan exentos si actúan en régimen de precios autorizados o comunicados. Los precios concertados con la Seguridad Social, la ausencia de ánimo de lucro y la calificación como entidad social no son la condición de este número."
  citation: "art. 20.Uno.2.º LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "hospitalización"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0084
  prompt:
    es: "¿Cuál de las siguientes operaciones queda excluida de la exención de las prestaciones de hospitalización y asistencia sanitaria, según el artículo 20.Uno.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Las prestaciones de quirófano realizadas por una clínica privada en régimen de precios autorizados."
  - id: b
    text:
      es: "El suministro de medicamentos y material sanitario a los pacientes hospitalizados."
  - id: c
    correct: true
    text:
      es: "La entrega de medicamentos para ser consumidos fuera de los establecimientos sanitarios."
  - id: d
    text:
      es: "Los servicios de alimentación y alojamiento prestados a los acompañantes de los pacientes hospitalizados."
  explanation:
    es: "La entrega de medicamentos para consumirlos fuera del establecimiento no se beneficia de la exención. Los medicamentos y material suministrados a los hospitalizados, la alimentación y el alojamiento de los acompañantes y el quirófano están directamente relacionados con la hospitalización y sí quedan exentos."
  citation: "art. 20.Uno.2.º.a) LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "hospitalización"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0085
  prompt:
    es: "La Clínica Veterinaria Duero, S.L. presta servicios de vacunación a animales de compañía en régimen de precios comunicados a la Administración. Conforme al artículo 20.Uno.2.º.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿están exentos estos servicios?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque la exención de la asistencia sanitaria no se extiende a los servicios veterinarios."
  - id: b
    text:
      es: "Sí, porque la asistencia sanitaria a animales se asimila a la asistencia sanitaria a personas."
  - id: c
    text:
      es: "Sí, porque se prestan en régimen de precios comunicados, que es la condición de la exención."
  - id: d
    text:
      es: "No están sujetos, porque los servicios veterinarios no son operaciones empresariales."
  explanation:
    es: "La exención de la asistencia sanitaria no se extiende a los servicios veterinarios, y por eso están sujetos y no exentos. Los precios comunicados son la condición para los establecimientos privados de asistencia a personas, no para servicios excluidos, y prestarlos de forma profesional es una actividad empresarial."
  citation: "art. 20.Uno.2.º.c) LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "servicios veterinarios"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0086
  prompt:
    es: "Señale la respuesta CORRECTA sobre la asistencia sanitaria prestada por profesionales, según el artículo 20.Uno.3.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Está exenta la asistencia que profesionales sanitarios presten a animales de compañía."
  - id: b
    text:
      es: "Está exenta la asistencia a personas físicas por profesionales médicos solo cuando la pague el propio paciente."
  - id: c
    text:
      es: "Está exenta la asistencia sanitaria solo cuando la presten entidades de Derecho público."
  - id: d
    correct: true
    text:
      es: "Está exenta la asistencia a personas físicas por profesionales médicos o sanitarios, cualquiera que sea la persona destinataria de los servicios."
  explanation:
    es: "La exención cubre la asistencia a personas físicas por profesionales médicos o sanitarios, la pague quien la pague. No se limita a lo que abona el paciente ni a entidades públicas, y la atención a animales es un servicio veterinario, que no es asistencia a personas físicas."
  citation: "art. 20.Uno.3.º LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "asistencia sanitaria"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0087
  prompt:
    es: "Según el artículo 20.Uno.4.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué entregas de sangre, plasma sanguíneo y demás elementos del cuerpo humano están exentas?"
  options:
  - id: a
    text:
      es: "Las efectuadas con ánimo de lucro para fines comerciales de productos sanitarios."
  - id: b
    text:
      es: "Solo las de sangre y plasma sanguíneo, y no las de otros fluidos o tejidos."
  - id: c
    correct: true
    text:
      es: "Las efectuadas para fines médicos o de investigación o para su procesamiento con idénticos fines."
  - id: d
    text:
      es: "Las de órganos y tejidos efectuadas para cualquier fin por empresarios o profesionales sanitarios."
  explanation:
    es: "La exención depende del fin: médico, de investigación o de procesamiento con esos fines. Los fines comerciales no están cubiertos, no vale cualquier fin y el precepto incluye los demás fluidos, tejidos y elementos del cuerpo humano, no solo la sangre y el plasma."
  citation: "art. 20.Uno.4.º LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "sangre"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0088
  prompt:
    es: "Marta Cobo, protésica dental, entrega y coloca una prótesis dental a un paciente, y el coste lo paga una mutua privada. Según el artículo 20.Uno.5.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿está exenta la operación?"
  options:
  - id: a
    text:
      es: "Solo está exenta la colocación, y no la entrega ni la reparación de la prótesis."
  - id: b
    correct: true
    text:
      es: "Sí, la exención se aplica cualquiera que sea la persona a cuyo cargo se realice la operación."
  - id: c
    text:
      es: "Sí, pero solo si la mutua que paga es una entidad de Derecho público."
  - id: d
    text:
      es: "No, porque la exención solo se aplica cuando el coste lo paga directamente el propio paciente."
  explanation:
    es: "La entrega, reparación y colocación de prótesis dentales por protésicos dentales está exenta, cualquiera que sea quien la pague. No importa que la abone una mutua, la exención comprende entrega, reparación y colocación, y la naturaleza pública del pagador no es una condición."
  citation: "art. 20.Uno.5.º LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "prótesis dentales"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0089
  prompt:
    es: "De acuerdo con el artículo 20.Uno.14.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, están exentas las prestaciones de servicios propias de bibliotecas, archivos y centros de documentación efectuadas por entidades de Derecho público o por entidades o establecimientos:"
  options:
  - id: a
    text:
      es: "educativos privados con finalidad lucrativa."
  - id: b
    text:
      es: "mercantiles que presten servicios de reprografía."
  - id: c
    correct: true
    text:
      es: "culturales privados de carácter social."
  - id: d
    text:
      es: "deportivos privados que cobren precios de mercado."
  explanation:
    es: "Si no las presta una entidad de Derecho público, el servicio de bibliotecas, archivos y centros de documentación solo está exento cuando lo hace un establecimiento cultural privado de carácter social. Los establecimientos educativos lucrativos, los deportivos y los mercantiles no son los que cita el número."
  citation: "art. 20.Uno.14.º.a) LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "servicios culturales"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0090
  prompt:
    es: "¿Cuál de las siguientes operaciones está exenta conforme al artículo 20.Uno.16.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "Las operaciones de seguro, reaseguro y capitalización."
  - id: b
    text:
      es: "La entrega de medicamentos para consumirlos fuera del establecimiento sanitario."
  - id: c
    text:
      es: "Los servicios veterinarios prestados por una clínica en régimen de precios comunicados."
  - id: d
    text:
      es: "La gestión de cobro de créditos, letras de cambio, recibos y otros documentos."
  explanation:
    es: "Las operaciones de seguro, reaseguro y capitalización están exentas. La gestión de cobro de créditos se excluye de la exención financiera, y los servicios veterinarios y la entrega de medicamentos para consumir fuera quedan excluidos de la exención sanitaria."
  citation: "art. 20.Uno.16.º LIVA"
  difficulty: 1
  tags:
  - "exenciones"
  - "seguros"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0093
  prompt:
    es: "Según el artículo 20.Uno.18.º.a) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué servicios quedan excluidos de la exención de los depósitos en efectivo y las operaciones relacionadas con los mismos?"
  options:
  - id: a
    text:
      es: "Los depósitos en cuenta corriente y en cuentas de ahorro de los clientes."
  - id: b
    correct: true
    text:
      es: "Los servicios de gestión de cobro de créditos, letras de cambio, recibos y otros documentos."
  - id: c
    text:
      es: "Las demás operaciones relacionadas con los depósitos en efectivo."
  - id: d
    text:
      es: "Los servicios de cobro o pago prestados por el depositario en favor del depositante de los fondos."
  explanation:
    es: "La gestión de cobro de créditos, letras, recibos y otros documentos no está exenta. Los servicios de cobro o pago del depositario al depositante, los depósitos en cuenta corriente y de ahorro y las demás operaciones relacionadas con los depósitos sí lo están."
  citation: "art. 20.Uno.18.º.a) LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "gestión de cobro"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0095
  prompt:
    es: "Señale la respuesta CORRECTA sobre las entregas de terrenos rústicos, según el artículo 20.Uno.20.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    correct: true
    text:
      es: "Están exentas las entregas de terrenos rústicos y de los que no sean edificables, incluidas las construcciones indispensables para el desarrollo de una explotación agraria."
  - id: b
    text:
      es: "Están exentas las entregas de terrenos en curso de urbanización siempre que tengan la naturaleza de rústicos."
  - id: c
    text:
      es: "Están exentas las entregas de terrenos rústicos, pero no las construcciones que se enclaven en ellos, aunque sean indispensables para la explotación agraria de la propia finca."
  - id: d
    text:
      es: "Están exentas las entregas de terrenos edificables cuando el adquirente los destine a una explotación agraria."
  explanation:
    es: "La exención cubre los terrenos rústicos y los no edificables, con las construcciones enclavadas que sean indispensables para la explotación agraria. Los terrenos edificables no están exentos por su destino agrario y los terrenos en curso de urbanización quedan fuera aunque fuesen rústicos."
  citation: "art. 20.Uno.20.º.a) LIVA"
  difficulty: 3
  tags:
  - "exenciones"
  - "terrenos"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0096
  prompt:
    es: "Conforme al artículo 20.Uno.22.º.A) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, están exentas las segundas y ulteriores entregas de edificaciones, incluidos los terrenos en que se hallen enclavadas, cuando tengan lugar:"
  options:
  - id: a
    text:
      es: "después de que hayan transcurrido dos años desde la terminación de su construcción o rehabilitación."
  - id: b
    text:
      es: "después de que el adquirente las utilice de forma ininterrumpida durante dos años."
  - id: c
    correct: true
    text:
      es: "después de terminada su construcción o rehabilitación."
  - id: d
    text:
      es: "después de su primera inscripción en el Registro de la Propiedad a nombre del promotor."
  explanation:
    es: "La segunda y ulterior entrega está exenta cuando se hace después de terminada la construcción o rehabilitación. No hay que esperar dos años desde la terminación, la inscripción registral no es el criterio y los dos años de uso ininterrumpido solo sirven para decidir si una entrega del promotor es primera."
  citation: "art. 20.Uno.22.º.A) LIVA"
  difficulty: 1
  tags:
  - "exenciones"
  - "segunda entrega"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0097
  prompt:
    es: "Señale la respuesta CORRECTA sobre la primera entrega de edificaciones, según el artículo 20.Uno.22.º.A) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Se considera primera entrega solo la realizada por el promotor a un adquirente empresario o profesional."
  - id: b
    text:
      es: "Se considera primera entrega la realizada por el promotor mientras la edificación está todavía en construcción."
  - id: c
    text:
      es: "Se considera primera entrega la primera que se formaliza en escritura pública, sea quien sea el transmitente."
  - id: d
    correct: true
    text:
      es: "Se considera primera entrega la realizada por el promotor que tenga por objeto una edificación cuya construcción o rehabilitación esté terminada."
  explanation:
    es: "La primera entrega es la del promotor sobre una edificación terminada, ya sea de construcción o de rehabilitación. La condición del adquirente no importa y la escritura pública y el transmitente que no sea el promotor no definen la primera entrega."
  citation: "art. 20.Uno.22.º.A) LIVA"
  difficulty: 1
  tags:
  - "exenciones"
  - "primera entrega"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0098
  prompt:
    es: "Promociones Ebro, S.A. terminó un edificio y arrendó un local, sin opción de compra, a una tienda desde el 1 de abril de 2023 hasta el 31 de enero de 2025. El 1 de marzo de 2025 vende el local a un tercero ajeno al arrendamiento. Conforme al artículo 20.Uno.22.º.A) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cómo se califica la entrega?"
  options:
  - id: a
    text:
      es: "Como segunda entrega, porque los dos años se cuentan desde la terminación del edificio."
  - id: b
    correct: true
    text:
      es: "Como primera entrega no exenta, porque el arrendamiento duró 22 meses, menos de los dos años exigidos."
  - id: c
    text:
      es: "Como primera entrega exenta, por tratarse de un local y no de una vivienda."
  - id: d
    text:
      es: "Como segunda entrega exenta, porque basta que el local haya estado arrendado sin opción de compra durante algún período."
  explanation:
    es: "El arrendamiento va de abril de 2023 a enero de 2025, es decir, 22 meses, y no llega a los dos años de utilización ininterrumpida que impiden considerar primera la entrega del promotor. La entrega sigue siendo primera, sujeta y no exenta. No basta con haber arrendado el local, los dos años no cuentan desde la terminación y la clase de inmueble no cambia la regla."
  citation: "art. 20.Uno.22.º.A) LIVA"
  difficulty: 3
  tags:
  - "exenciones"
  - "primera entrega"
  - "cómputo"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0099
  prompt:
    es: "De acuerdo con el artículo 20.Uno.22.º.A) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, no tiene la consideración de primera entrega la realizada por el promotor tras utilizar el inmueble de forma ininterrumpida durante dos años o más en virtud de arrendamiento sin opción de compra, salvo que el adquirente sea:"
  options:
  - id: a
    correct: true
    text:
      es: "quien utilizó la edificación durante el referido plazo."
  - id: b
    text:
      es: "un sujeto pasivo con derecho a deducir el impuesto soportado en la compra."
  - id: c
    text:
      es: "quien arrendó otra edificación del mismo promotor durante ese plazo."
  - id: d
    text:
      es: "una persona vinculada con el promotor o con el arrendatario del inmueble."
  explanation:
    es: "La excepción juega cuando el adquirente es la misma persona que usó la edificación durante el plazo: entonces la entrega sigue siendo primera. La vinculación, el derecho a deducir y haber arrendado otro inmueble no entran en la salvedad."
  citation: "art. 20.Uno.22.º.A) LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "primera entrega"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0100
  prompt:
    es: "¿Cuál de las siguientes utilizaciones del inmueble cuenta para el plazo de dos años que impide considerar primera entrega la del promotor, conforme al artículo 20.Uno.22.º.A) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "La ocupación de hecho por un tercero sin título alguno sobre la edificación."
  - id: b
    text:
      es: "La mera tenencia de la edificación terminada sin ocuparla ni arrendarla."
  - id: c
    correct: true
    text:
      es: "La utilización en virtud de un contrato de arrendamiento sin opción de compra."
  - id: d
    text:
      es: "La utilización en virtud de un contrato de arrendamiento con opción de compra."
  explanation:
    es: "Cuenta la utilización ininterrumpida por el propietario, por titulares de derechos reales de goce o en virtud de un arrendamiento sin opción de compra. El arrendamiento con opción de compra, la tenencia sin uso y la ocupación sin título no figuran en ese listado."
  citation: "art. 20.Uno.22.º.A) LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "primera entrega"
# anchor: boe-a-1992-28740-art-20
- id: m03-l18-q0102
  prompt:
    es: "Según el artículo 20.Uno.22.º.A) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la exención del número 22.º no se aplica a las entregas de edificaciones que sean objeto de demolición con carácter previo a:"
  options:
  - id: a
    text:
      es: "una declaración de ruina por el ayuntamiento."
  - id: b
    correct: true
    text:
      es: "una nueva promoción urbanística."
  - id: c
    text:
      es: "su transmisión a un adquirente no empresario."
  - id: d
    text:
      es: "su inscripción en el Registro de la Propiedad."
  explanation:
    es: "Las edificaciones que se demuelen con carácter previo a una nueva promoción urbanística quedan fuera de la exención. La inscripción registral, la transmisión a un no empresario y la declaración de ruina no son el supuesto de la letra."
  citation: "art. 20.Uno.22.º.A) LIVA"
  difficulty: 2
  tags:
  - "exenciones"
  - "demolición"
