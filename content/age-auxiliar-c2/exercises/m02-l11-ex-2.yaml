# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q080
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes opciones describe lo que devuelve la búsqueda cc:\"miguel tórrez\" según la tabla de ejemplos de la ayuda de Outlook?"
  options:
  - id: a
    text:
      es: "Los elementos cuyo asunto contiene la frase miguel tórrez"
  - id: b
    text:
      es: "Los elementos en los que miguel tórrez está en la línea CCO"
  - id: c
    correct: true
    text:
      es: "Los elementos con el nombre miguel tórrez en la línea Cc"
  - id: d
    text:
      es: "Los elementos enviados desde miguel tórrez"
  explanation:
    es: "La palabra clave cc: busca el nombre para mostrar en la línea Cc. Los elementos enviados desde miguel tórrez los halla de:\"miguel tórrez\". Los que tienen la frase en el asunto, asunto:\"miguel tórrez\". La línea CCO se busca con cco:."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q081
  prompt:
    es: "En Outlook 365, ¿qué búsqueda devuelve los elementos en los que la dirección bobbymoore@contoso.com figura en la línea Cc, según la tabla de ejemplos de la ayuda?"
  options:
  - id: a
    text:
      es: "cco:bobbymoore@contoso.com"
  - id: b
    correct: true
    text:
      es: "CC:bobbymoore@contoso.com"
  - id: c
    text:
      es: "para:bobbymoore@contoso.com"
  - id: d
    text:
      es: "de:bobbymoore@contoso.com"
  explanation:
    es: "CC: seguido de la dirección busca esa dirección en la línea Cc. cco: busca en la línea CCO. de: limita a los elementos enviados desde esa dirección. para: halla los elementos que se enviaron a esa persona cuando se busca en Elementos enviados."
  citation: "fuente: `ms-outlook-buscar.html`; «CC:bobbymoore@contoso.com — Elementos en los que la dirección bobbymoore@contoso.com de correo electrónico está en la línea Cc.»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q082
  prompt:
    es: "En Outlook 365, ¿qué debe escribirse en el cuadro de búsqueda para limitar los resultados a los correos enviados desde la dirección cheryl.parsons64@yahoo.com?"
  options:
  - id: a
    text:
      es: "asunto:cheryl.parsons64@yahoo.com"
  - id: b
    text:
      es: "cc:cheryl.parsons64@yahoo.com"
  - id: c
    text:
      es: "cheryl.parsons64@yahoo.com"
  - id: d
    correct: true
    text:
      es: "de:cheryl.parsons64@yahoo.com"
  explanation:
    es: "Para limitar a los correos de una dirección se escribe de: y la dirección. Escribir solo la dirección devuelve también los mensajes que la contienen en el asunto, el cuerpo o los adjuntos. asunto: busca en el asunto y cc: en la línea Cc."
  citation: "fuente: `ms-outlook-buscar.html`; «Conceptos básicos de búsqueda en Outlook»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q083
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes opciones describe lo que devuelve la búsqueda miguel Y tórrez, con el operador en mayúsculas, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Los elementos que contengan miguel, tórrez o ambos términos"
  - id: b
    text:
      es: "Los elementos que contengan miguel, pero no tórrez"
  - id: c
    correct: true
    text:
      es: "Los elementos con miguel y con tórrez, en cualquier orden"
  - id: d
    text:
      es: "Los elementos que contengan la frase exacta miguel tórrez, en ese orden"
  explanation:
    es: "El operador Y exige los dos términos, pero no un orden. Los elementos con miguel pero sin tórrez son lo que devuelve NO, que excluye el segundo término. Los elementos con miguel, tórrez o ambos son lo que devuelve O. La frase exacta miguel tórrez, en ese orden, exige comillas dobles: la tabla dice que, para buscar una cadena concreta, debe usar comillas."
  citation: "fuente: `ms-outlook-buscar.html`; «miguel Y tórrez — Los elementos que contengan tanto miguel como tórrez, pero no necesariamente en ese orden.»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q084
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes opciones describe lo que devuelve la búsqueda miguel NO tórrez, con el operador en mayúsculas, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Los elementos con miguel y sus variaciones, pero sin tórrez"
  - id: b
    text:
      es: "Los elementos que contengan miguel, tórrez o ambos términos"
  - id: c
    text:
      es: "Los elementos que contengan tanto miguel como tórrez"
  - id: d
    text:
      es: "Los elementos que contengan tórrez, pero no miguel"
  explanation:
    es: "NO deja los elementos con miguel y descarta los que contienen tórrez. Los elementos con miguel y tórrez a la vez son lo que devuelve Y, que exige ambos. Los que contienen tórrez pero no miguel invierten la búsqueda, porque la tabla dice miguel, pero no tórrez. Los que contienen miguel, tórrez o ambos son lo que devuelve O."
  citation: "fuente: `ms-outlook-buscar.html`; «miguel NO tórrez — Los elementos que contengan miguel, junto con todas las variaciones enumeradas en la primera fila de la tabla, pero no tórrez.»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q085
  prompt:
    es: "En Outlook 365, ¿qué devuelve una búsqueda de dos palabras escritas sin operador entre ellas, como miguel tórrez, según la tabla de ejemplos de la ayuda?"
  options:
  - id: a
    text:
      es: "Solo los elementos con la frase exacta miguel tórrez, en ese orden"
  - id: b
    text:
      es: "Solo los elementos que contengan miguel y no contengan tórrez"
  - id: c
    text:
      es: "Solo los elementos que contengan las dos palabras a la vez"
  - id: d
    correct: true
    text:
      es: "Los elementos con miguel o con tórrez, en cualquier orden"
  explanation:
    es: "Sin operador ni comillas, la tabla dice que la búsqueda devuelve miguel o bien tórrez, pero no necesariamente en ese orden. Pedir las dos palabras a la vez es el operador Y. La frase exacta en ese orden exige comillas dobles. Miguel sin tórrez es el operador NO."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q086
  prompt:
    es: "En Outlook 365, según la ayuda de Microsoft, los operadores lógicos Y, NO y O deben escribirse:"
  options:
  - id: a
    text:
      es: "Indistintamente en mayúsculas o en minúsculas"
  - id: b
    correct: true
    text:
      es: "En letras mayúsculas"
  - id: c
    text:
      es: "Solo con la inicial en mayúscula"
  - id: d
    text:
      es: "En letras minúsculas"
  explanation:
    es: "La ayuda dice que los operadores lógicos Y, NO y O se deben escribir en letras mayúsculas. No valen las minúsculas, ni la mezcla indistinta, ni la inicial sola."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q087
  prompt:
    es: "En Outlook 365, ¿cómo trata la búsqueda instantánea las mayúsculas y las minúsculas de las palabras que se escriben en el cuadro de búsqueda?"
  options:
  - id: a
    text:
      es: "Solo halla palabras que empiezan por mayúscula"
  - id: b
    text:
      es: "Distingue: solo halla los elementos que coinciden letra a letra"
  - id: c
    correct: true
    text:
      es: "No distingue entre mayúsculas y minúsculas"
  - id: d
    text:
      es: "Distingue solo en el asunto, no en el cuerpo del mensaje"
  explanation:
    es: "La ayuda dice que la búsqueda instantánea no distingue entre mayúsculas y minúsculas. Exigir coincidencia letra a letra, distinguir solo en el asunto o buscar solo palabras con inicial en mayúscula supone que sí las distingue, y esa frase lo contradice."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q088
  prompt:
    es: "En Outlook 365, según la ayuda de Microsoft, para que Outlook funcione correctamente una búsqueda devuelve como máximo:"
  options:
  - id: a
    text:
      es: "Los primeros 100 resultados"
  - id: b
    text:
      es: "Los primeros 10 000 resultados"
  - id: c
    correct: true
    text:
      es: "Los primeros 1000 resultados"
  - id: d
    text:
      es: "Los primeros 500 resultados"
  explanation:
    es: "La ayuda dice que solo se devuelven los primeros 1000 resultados y aconseja una búsqueda más específica si la lista no contiene lo buscado. Los primeros 100, los primeros 500 y los primeros 10 000 contradicen esa cifra."
  citation: "fuente: `ms-outlook-buscar.html`; «Conceptos básicos de búsqueda en Outlook»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q089
  prompt:
    es: "Señale la búsqueda de Outlook 365 que, según la tabla de ejemplos de la ayuda, devuelve los elementos que tienen datos adjuntos:"
  options:
  - id: a
    correct: true
    text:
      es: "hasattachment:yes"
  - id: b
    text:
      es: "categoría:azul"
  - id: c
    text:
      es: "tiene indicador:true"
  - id: d
    text:
      es: "leído:no"
  explanation:
    es: "hasattachment:yes halla los elementos con datos adjuntos, y tiene archivos adjuntos:true da lo mismo. tiene indicador:true halla los marcados para seguimiento. leído:no halla los no leídos. categoría:azul halla los que tienen un nombre de categoría con la palabra azul."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q090
  prompt:
    es: "En Outlook 365, ¿qué elementos devuelve la búsqueda leído:no, según la tabla de ejemplos de la ayuda de Outlook?"
  options:
  - id: a
    text:
      es: "Los elementos marcados para su seguimiento"
  - id: b
    correct: true
    text:
      es: "Los elementos que no se han leído"
  - id: c
    text:
      es: "Los elementos que llegaron esta semana"
  - id: d
    text:
      es: "Los elementos que tienen datos adjuntos"
  explanation:
    es: "leído:no, o leído:false, halla los elementos sin leer. Los marcados para seguimiento se buscan con tiene indicador:true. Los que tienen datos adjuntos, con hasattachment:yes. Los de esta semana, con recibido:\"esta semana\"."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q091
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes opciones describe lo que devuelve la búsqueda tamañodelmensaje:>5 MB, según la tabla de ejemplos de la ayuda?"
  options:
  - id: a
    text:
      es: "Los elementos cuyo tamaño está entre 500 kilobytes y 1 megabyte"
  - id: b
    text:
      es: "Los elementos cuyo tamaño es menor de 5 megabytes"
  - id: c
    text:
      es: "Los elementos cuyo tamaño es menor de 10 kilobytes"
  - id: d
    correct: true
    text:
      es: "Los elementos cuyo tamaño es mayor que 5 megabytes"
  explanation:
    es: "El operador mayor que (>) con 5 MB halla los elementos de más de 5 megabytes. El operador menor que (<) daría los menores. Entre 500 kilobytes y 1 megabyte es tamaño del mensaje:muy grande. Menos de 10 kilobytes es tamaño del mensaje:<10 KB o muy pequeño."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
  difficulty: 3
  tags:
  - "comportamiento"
  - "cantidad"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q092
  prompt:
    es: "En Outlook 365 clásico, ¿qué tamaño de elementos halla la búsqueda tamaño del mensaje:grande, según la tabla de ejemplos de la ayuda?"
  options:
  - id: a
    text:
      es: "Entre 10 y 25 kilobytes"
  - id: b
    text:
      es: "Entre 500 kilobytes y 1 megabyte"
  - id: c
    text:
      es: "Entre 25 y 100 kilobytes"
  - id: d
    correct: true
    text:
      es: "Entre 100 y 500 kilobytes"
  explanation:
    es: "Grande equivale a entre 100 y 500 kilobytes. Pequeño es entre 10 y 25 kilobytes, medio entre 25 y 100, y muy grande entre 500 kilobytes y 1 megabyte. La ayuda indica que estos nombres de tamaño no se admiten en el nuevo Outlook para Windows."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q093
  prompt:
    es: "En Outlook 365, ¿dónde busca Outlook una búsqueda sugerida que lleva a su izquierda el icono de un reloj, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Solo en el nombre del remitente, sin mirar el asunto ni el cuerpo"
  - id: b
    correct: true
    text:
      es: "En el asunto, el cuerpo del mensaje y los adjuntos de Microsoft 365"
  - id: c
    text:
      es: "Solo en el cuerpo del mensaje, no en los adjuntos de Microsoft 365"
  - id: d
    text:
      es: "Solo en el asunto del mensaje, sin mirar el cuerpo ni los adjuntos"
  explanation:
    es: "Las búsquedas sugeridas con icono de reloj devuelven los mensajes que contienen la cadena en el asunto, el cuerpo e incluso cualquier adjunto de Microsoft 365. Buscar solo en el asunto, solo en el cuerpo sin adjuntos o solo en el nombre del remitente contradice esa frase."
  citation: "fuente: `ms-outlook-buscar.html`; «Cualquier búsqueda sugerida con el icono de un reloj a la izquierda devolverá todos los mensajes que contengan la cadena de búsqueda en el asunto, el cuerpo del mensaje e incluso cualquier adjunto de Microsoft 365.»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m02-l11-q094
  prompt:
    es: "En Outlook 365 clásico, al hacer clic en el cuadro de búsqueda aparece la pestaña Buscar. ¿Qué grupo de esa pestaña sirve para mejorar los resultados de la búsqueda?"
  options:
  - id: a
    text:
      es: "Preferencias"
  - id: b
    text:
      es: "Eliminar"
  - id: c
    correct: true
    text:
      es: "Restringir"
  - id: d
    text:
      es: "Cerrar"
  explanation:
    es: "El grupo Restringir de la pestaña Buscar reúne las opciones para mejorar los resultados. Cerrar contiene Cerrar búsqueda. Preferencias es un grupo de la pestaña Enviar y recibir. Eliminar es un grupo de la pestaña Inicio."
  citation: "fuente: `ms-outlook-buscar.html`; «Usar filtros de búsqueda integrada de Outlook»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-atajos-html
- id: m02-l11-q095
  prompt:
    es: "Señale el método abreviado de teclado de Outlook 365 clásico que lleva el cursor al campo de búsqueda para buscar un mensaje u otro elemento:"
  options:
  - id: a
    text:
      es: "F4"
  - id: b
    correct: true
    text:
      es: "Ctrl+E o F3"
  - id: c
    text:
      es: "Ctrl+M o F9"
  - id: d
    text:
      es: "Ctrl+Mayús+F"
  explanation:
