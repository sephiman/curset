# anchor: boe-a-2015-10565-art-25
- id: m02-l03-q0023
  prompt:
    es: "De acuerdo con el artículo 25.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en un procedimiento de oficio del que pudieran derivarse derechos, el vencimiento del plazo sin resolución expresa:"
  options:
  - id: a
    text:
      es: "Permite a los interesados que hubieren comparecido entender estimadas sus pretensiones por silencio."
  - id: b
    correct: true
    text:
      es: "Permite a los interesados que hubieren comparecido entender desestimadas sus pretensiones por silencio."
  - id: c
    text:
      es: "Produce la caducidad del procedimiento, y la resolución que la declare ordenará el archivo de las actuaciones."
  - id: d
    text:
      es: "Permite a cualquier persona, aunque no haya comparecido, entender estimadas sus pretensiones."
  explanation:
    es: "El artículo 25.1.a) dice que en estos procedimientos «los interesados que hubieren comparecido podrán entender desestimadas sus pretensiones por silencio administrativo». El silencio no es estimatorio, ni para los comparecidos ni para quien no compareció. La caducidad es el efecto en los procedimientos sancionadores o de intervención con efectos desfavorables (art. 25.1.b)."
  citation: "art. 25.1.a) LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-25
- id: m02-l03-q0030
  prompt:
    es: "¿En cuál de los siguientes procedimientos produce la caducidad el vencimiento del plazo máximo sin resolución expresa notificada, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "En uno iniciado de oficio del que pudiera derivarse el reconocimiento de derechos."
  - id: b
    text:
      es: "En uno iniciado a solicitud del interesado sin norma que disponga otro sentido del silencio."
  - id: c
    correct: true
    text:
      es: "En uno iniciado de oficio en que la Administración ejerce potestades sancionadoras."
  - id: d
    text:
      es: "En uno de responsabilidad patrimonial iniciado a solicitud del particular."
  explanation:
    es: "El artículo 25.1.b) dice que en los procedimientos en que la Administración ejercite potestades sancionadoras o de intervención con efectos desfavorables «se producirá la caducidad». En los de oficio que pueden reconocer derechos, los comparecidos pueden entender desestimadas sus pretensiones (art. 25.1.a). En los iniciados a solicitud rige el silencio estimatorio salvo norma en contrario (art. 24.1). En la responsabilidad patrimonial el silencio es desestimatorio (arts. 24.1 y 91.3)."
  citation: "art. 25.1.b) LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-91
- id: m02-l03-q0031
  prompt:
    es: "Según el artículo 91.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿desde cuándo se cuentan los seis meses tras los cuales la resolución de responsabilidad patrimonial puede entenderse contraria?"
  options:
  - id: a
    text:
      es: "Desde que se produjo el hecho que motiva la indemnización."
  - id: b
    correct: true
    text:
      es: "Desde que se inició el procedimiento de responsabilidad patrimonial."
  - id: c
    text:
      es: "Desde que se notificó al particular la admisión de su reclamación."
  - id: d
    text:
      es: "Desde que finalizó el trámite de audiencia del procedimiento."
  explanation:
    es: "El artículo 91.3 cuenta los seis meses «desde que se inició el procedimiento». No se cuentan desde el hecho lesivo, ni desde una admisión de la reclamación, ni desde el final de la audiencia."
  citation: "art. 91.3 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-24
- id: m02-l03-q0124
  prompt:
    es: "Don Raúl presentó una solicitud en un procedimiento iniciado a su instancia, regulado por un reglamento que no dice nada sobre el sentido del silencio. Venció el plazo máximo sin que se le notificara resolución expresa. Según el artículo 24.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué puede entender?"
  options:
  - id: a
    text:
      es: "Que su solicitud está desestimada, porque el silencio es negativo salvo que una norma disponga lo contrario."
  - id: b
    correct: true
    text:
      es: "Que su solicitud está estimada por silencio administrativo."
  - id: c
    text:
      es: "Que debe esperar a la resolución expresa, porque el silencio no produce efecto alguno sobre la solicitud."
  - id: d
    text:
      es: "Que su solicitud está estimada solo si el órgano competente certifica antes el silencio producido."
  explanation:
    es: "En los procedimientos a solicitud del interesado, el artículo 24.1 permite entender estimada la solicitud por silencio, salvo que una norma con rango de ley o del Derecho de la Unión Europea o internacional disponga lo contrario, y un reglamento no lo hace. El silencio no es negativo por regla, sí produce efectos, y no depende de que antes se certifique, pues los efectos nacen al vencer el plazo."
  citation: "art. 24.1 LPAC"
  difficulty: 3
  tags:
  - "silencio"
  - "supuesto"
# anchor: boe-a-2015-10565-art-24
- id: m02-l03-q0126
  prompt:
    es: "Conforme al artículo 24.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre el sentido del silencio administrativo en los procedimientos iniciados a solicitud del interesado:"
  options:
  - id: a
    text:
      es: "En los procedimientos de responsabilidad patrimonial de las Administraciones Públicas el silencio es estimatorio, salvo que el órgano disponga lo contrario."
  - id: b
    text:
      es: "En los procedimientos relativos al ejercicio del derecho de petición el silencio produce siempre efectos estimatorios."
  - id: c
    text:
      es: "En los procedimientos de impugnación de actos y disposiciones el silencio es estimatorio en todos los casos."
  - id: d
    correct: true
    text:
      es: "En los procedimientos de responsabilidad patrimonial de las Administraciones Públicas el silencio tiene efecto desestimatorio."
  explanation:
    es: "El artículo 24.1 declara desestimatorio el silencio en los procedimientos de responsabilidad patrimonial. Tampoco es estimatorio en el derecho de petición. En la impugnación de actos y disposiciones es desestimatorio, y solo cuando se interpone alzada contra una desestimación por silencio se entiende estimada si no se resuelve, con excepciones, de modo que no lo es en todos los casos."
  citation: "art. 24.1 LPAC"
  difficulty: 2
  tags:
  - "silencio"
  - "efectos"
# anchor: boe-a-2015-10565-art-24
- id: m02-l03-q0127
  prompt:
    es: "Según el artículo 24.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando el recurso de alzada se interpone contra la desestimación por silencio de una solicitud, se entiende estimado si el órgano competente no dicta y notifica resolución expresa en plazo, siempre que no se refiera a:"
  options:
  - id: a
    text:
      es: "las materias en las que la norma reguladora fije un plazo de resolución superior a tres meses."
  - id: b
    text:
      es: "las solicitudes que hubieran sido presentadas por personas jurídicas o por sus representantes."
  - id: c
    text:
      es: "los recursos que interponga un tercero interesado distinto del solicitante inicial."
  - id: d
    correct: true
    text:
      es: "las materias enumeradas en las que el silencio tiene efecto desestimatorio, como el derecho de petición o la responsabilidad patrimonial."
  explanation:
    es: "El artículo 24.1 exceptúa de la estimación por silencio de la alzada las materias que enumera como de silencio desestimatorio, entre ellas el derecho de petición y la responsabilidad patrimonial. No se excepciona según el plazo de la norma reguladora, ni por ser el solicitante una persona jurídica, ni por quién interponga el recurso."
  citation: "art. 24.1 LPAC"
  difficulty: 2
  tags:
  - "silencio"
  - "alzada"
# anchor: boe-a-2015-10565-art-24
- id: m02-l03-q0129
  prompt:
    es: "Conforme al artículo 24.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la estimación por silencio administrativo tiene a todos los efectos la consideración de:"
  options:
  - id: a
    text:
      es: "acto de trámite que debe ser confirmado por resolución expresa posterior."
  - id: b
    correct: true
    text:
      es: "acto administrativo finalizador del procedimiento."
  - id: c
    text:
      es: "mera expectativa de derecho, hasta que se expida el certificado acreditativo del silencio."
  - id: d
    text:
      es: "acto presunto sin efectos frente a terceros mientras no se publique en el diario oficial."
  explanation:
    es: "El artículo 24.2 equipara la estimación por silencio a un acto administrativo finalizador del procedimiento. No es un acto de trámite pendiente de confirmación, ni una expectativa hasta que se expida el certificado, ni un acto sin efectos frente a terceros hasta su publicación."
  citation: "art. 24.2 LPAC"
  difficulty: 1
  tags:
  - "silencio"
  - "efectos"
# anchor: boe-a-2015-10565-art-24
- id: m02-l03-q0130
  prompt:
    es: "La solicitud de la empresa Ferrer y Soto, S.L. quedó estimada por silencio administrativo. Una vez vencido el plazo, el órgano competente dicta una resolución expresa denegatoria. Según el artículo 24.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿es válida?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque tras la estimación por silencio la resolución expresa solo puede dictarse si es confirmatoria."
  - id: b
    text:
      es: "Sí, porque la Administración mantiene plena libertad para resolver en cualquier sentido tras el vencimiento del plazo."
  - id: c
    text:
      es: "Sí, si la dicta el superior jerárquico del órgano, que no queda vinculado por el silencio."
  - id: d
    text:
      es: "No, porque vencido el plazo la Administración ya no puede dictar ninguna resolución expresa."
  explanation:
    es: "El artículo 24.3.a) dice que, producida la estimación por silencio, la resolución expresa posterior solo puede dictarse de ser confirmatoria. No hay libertad para resolver en otro sentido, ni cambia por actuar el superior jerárquico. Pero la Administración sí conserva la obligación de resolver, de modo que no es cierto que no pueda dictar resolución alguna."
  citation: "art. 24.3 LPAC"
  difficulty: 2
  tags:
  - "silencio"
  - "supuesto"
# anchor: boe-a-2015-10565-art-24
- id: m02-l03-q0131
  prompt:
    es: "Según el artículo 24.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los casos de desestimación por silencio administrativo, la resolución expresa posterior al vencimiento del plazo se adopta:"
  options:
  - id: a
    correct: true
    text:
      es: "sin vinculación alguna al sentido del silencio."
  - id: b
    text:
      es: "confirmando necesariamente el sentido desestimatorio del silencio."
  - id: c
    text:
      es: "solo si resulta favorable al interesado que presentó la solicitud."
  - id: d
    text:
      es: "con vinculación al sentido del silencio, salvo que el interesado acepte otro."
  explanation:
    es: "El artículo 24.3.b) dice que tras la desestimación por silencio la Administración resuelve sin vinculación alguna a su sentido: puede estimar o desestimar. No debe confirmar la desestimación, ni dictar solo resoluciones favorables, ni queda vinculada salvo aceptación del interesado."
  citation: "art. 24.3 LPAC"
  difficulty: 1
  tags:
  - "silencio"
  - "resolución"
# anchor: boe-a-2015-10565-art-24
- id: m02-l03-q0132
  prompt:
    es: "¿En qué plazo debe expedir de oficio el órgano competente para resolver el certificado acreditativo del silencio producido, según el artículo 24.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "En diez días desde que expire el plazo máximo para resolver el procedimiento, computados como días naturales."
  - id: b
    text:
      es: "En un mes desde que el interesado presente la solicitud de certificado."
  - id: c
    text:
      es: "En tres meses desde que expire el plazo máximo para resolver el procedimiento."
  - id: d
    correct: true
    text:
      es: "En quince días desde que expire el plazo máximo para resolver el procedimiento."
  explanation:
    es: "El artículo 24.4 fija quince días desde que expire el plazo máximo para resolver. No son diez días, ni un mes desde una solicitud que no hace falta para la expedición de oficio, ni tres meses."
  citation: "art. 24.4 LPAC"
  difficulty: 2
  tags:
  - "silencio"
  - "certificado"
  - "plazo"
# anchor: boe-a-2015-10565-art-24
- id: m02-l03-q0133
  prompt:
    es: "El plazo máximo para resolver un procedimiento iniciado a solicitud de doña Marta expiró el lunes 2 de marzo de 2026 sin resolución. El órgano debe expedir de oficio el certificado del silencio en el plazo del artículo 24.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas. No hay festivos en marzo. ¿Cuándo vence ese plazo?"
  options:
  - id: a
    text:
      es: "El martes 17 de marzo de 2026."
  - id: b
    text:
      es: "El viernes 20 de marzo de 2026."
  - id: c
    correct: true
    text:
      es: "El lunes 23 de marzo de 2026."
  - id: d
    text:
      es: "El jueves 2 de abril de 2026."
  explanation:
    es: "Los quince días del artículo 24.4 son hábiles (artículo 30.2) y se cuentan desde el día siguiente (artículo 30.3): del martes 3 al viernes 6 de marzo son cuatro, del 9 al 13 son cinco más, del 16 al 20 cinco más y el lunes 23 es el decimoquinto. El 17 sale de contar quince días naturales, el 20 de contar el 2 de marzo como primer día, y el 2 de abril de confundirlo con un plazo de un mes."
  citation: "art. 24.4 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "certificado"
  - "plazo"
# anchor: boe-a-2015-10565-art-32
- id: m02-l03-q0012
  prompt:
    es: "De acuerdo con el artículo 32.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la Administración, salvo precepto en contrario, podrá conceder una ampliación de los plazos establecidos:"
  options:
  - id: a
    text:
      es: "Que no exceda de la tercera parte de los mismos, si las circunstancias lo aconsejan y no se perjudican derechos de tercero."
  - id: b
    correct: true
    text:
      es: "Que no exceda de la mitad de los mismos, si las circunstancias lo aconsejan y no se perjudican derechos de tercero."
  - id: c
    text:
      es: "Que no exceda del doble de los mismos, si las circunstancias lo aconsejan y no se perjudican derechos de tercero."
  - id: d
    text:
      es: "Que no exceda de la mitad de los mismos, solo a petición de los interesados y oídos los terceros."
  explanation:
    es: "El artículo 32.1 permite una ampliación «que no exceda de la mitad de los mismos, si las circunstancias lo aconsejan y con ello no se perjudican derechos de tercero». El límite no es la tercera parte ni el doble. La ampliación cabe «de oficio o a petición de los interesados», no solo a petición, y la ley no exige oír a terceros."
  citation: "art. 32.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "cantidad"
# anchor: boe-a-2015-10565-art-33
- id: m02-l03-q0014
  prompt:
    es: "De acuerdo con el artículo 33 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la aplicación de la tramitación de urgencia a un procedimiento:"
  options:
  - id: a
    text:
      es: "Reduce a la mitad todos los plazos del procedimiento ordinario, incluidos los de presentación de solicitudes y recursos."
  - id: b
    correct: true
    text:
      es: "Reduce a la mitad los plazos del procedimiento ordinario, salvo los de presentación de solicitudes y recursos."
  - id: c
    text:
      es: "Reduce a la tercera parte los plazos del procedimiento ordinario, salvo los de presentación de solicitudes y recursos."
  - id: d
    text:
      es: "Reduce a la mitad los plazos del procedimiento ordinario, salvo los de audiencia y prueba."
  explanation:
    es: "Con la tramitación de urgencia «se reducirán a la mitad los plazos establecidos para el procedimiento ordinario, salvo los relativos a la presentación de solicitudes y recursos». Los plazos de solicitudes y recursos no se reducen. La reducción es a la mitad, no a la tercera parte, y la audiencia y la prueba no están exceptuadas."
  citation: "art. 33 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10565-art-33
- id: m02-l03-q0015
  prompt:
    es: "Según el artículo 33 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en un procedimiento al que se aplica la tramitación de urgencia, ¿cuál es el plazo mínimo del trámite de audiencia?"
  options:
  - id: a
    text:
      es: "No inferior a diez días."
  - id: b
    text:
      es: "No inferior a siete días."
  - id: c
    correct: true
    text:
      es: "No inferior a cinco días."
  - id: d
    text:
      es: "No inferior a tres días."
  explanation:
    es: "En la tramitación ordinaria la audiencia dura un plazo no inferior a diez días ni superior a quince (art. 82.2). La urgencia reduce a la mitad los plazos del procedimiento ordinario, salvo los de presentación de solicitudes y recursos (art. 33). La audiencia no está exceptuada, así que su mínimo pasa de diez a cinco días. Diez días es el mínimo ordinario, sin reducir. Siete días es el plazo de alegaciones tras las actuaciones complementarias (art. 87). Tres días no resulta de ninguna reducción a la mitad."
  citation: "art. 33 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-68
- id: m02-l03-q0024
  prompt:
    es: "De acuerdo con el artículo 68.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el plazo de subsanación podrá ampliarse hasta cinco días si la aportación de documentos presenta dificultades especiales:"
  options:
  - id: a
    text:
      es: "Salvo en los procedimientos sancionadores o de responsabilidad patrimonial."
  - id: b
    correct: true
    text:
      es: "Salvo en los procedimientos selectivos o de concurrencia competitiva."
  - id: c
    text:
      es: "Solo en los procedimientos selectivos o de concurrencia competitiva."
  - id: d
    text:
      es: "Salvo en los procedimientos tramitados de manera simplificada o de urgencia."
  explanation:
    es: "La ampliación cabe «siempre que no se trate de procedimientos selectivos o de concurrencia competitiva» (art. 68.2). Esos procedimientos son la excepción, no el único caso en que se amplía. La ley no excluye los procedimientos sancionadores, los de responsabilidad patrimonial ni los de tramitación simplificada o de urgencia."
  citation: "art. 68.2 LPAC"
  difficulty: 2
  tags:
  - "excepción"
  - "plazo"
# anchor: boe-a-2015-10565-art-68
- id: m02-l03-q0026
  prompt:
    es: "Según el artículo 68.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el interesado no atiende en plazo el requerimiento de subsanación de su solicitud, ¿cómo se le tiene por desistido?"
  options:
  - id: a
    text:
      es: "Automáticamente al vencer el plazo, sin necesidad de dictar resolución alguna."
  - id: b
    text:
      es: "Mediante un nuevo requerimiento que le conceda un plazo adicional de cinco días."
  - id: c
    correct: true
    text:
      es: "Mediante resolución dictada en los términos del artículo 21, que declare el desistimiento."
  - id: d
    text:
      es: "Mediante acuerdo del órgano instructor, contra el que no cabe recurso alguno."
  explanation:
    es: "El artículo 68.1 advierte de que, si no se subsana, «se le tendrá por desistido de su petición, previa resolución que deberá ser dictada en los términos previstos en el artículo 21». El desistimiento no opera solo al vencer el plazo: hace falta resolución. La ampliación de hasta cinco días del artículo 68.2 se pide o se acuerda dentro del plazo; no es un segundo requerimiento tras el vencimiento. La ley no atribuye esa decisión a un acuerdo irrecurrible del instructor."
  citation: "art. 68.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-122
- id: m02-l03-q0032
  prompt:
    es: "Según el artículo 122 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en el recurso de alzada contra un acto expreso, los plazos de interposición y de resolución son:"
  options:
  - id: a
    text:
      es: "Un mes para interponerlo y un mes para dictar y notificar la resolución."
  - id: b
    text:
      es: "Tres meses para interponerlo y un mes para dictar y notificar la resolución."
  - id: c
    text:
      es: "Dos meses para interponerlo y tres meses para dictar y notificar la resolución."
  - id: d
    correct: true
    text:
      es: "Un mes para interponerlo y tres meses para dictar y notificar la resolución."
  explanation:
    es: "El artículo 122.1 fija para la alzada contra un acto expreso un plazo de interposición «de un mes», y el 122.2 un plazo máximo «de tres meses» para dictar y notificar la resolución. Un mes para resolver es el plazo de la reposición (art. 124.2). Los dos meses son el plazo del recurso contencioso-administrativo contra actos expresos (art. 46.1 LJCA)."
  citation: "art. 122.1–2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-32
- id: m02-l03-q0036
  prompt:
    es: "Si la Jefatura denegara a Doña Amparo la ampliación del plazo que pidió, ¿qué recurso cabría contra ese acuerdo, según el artículo 32.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El recurso de reposición, ante el mismo órgano, en el plazo de un mes."
  - id: b
    text:
      es: "El recurso contencioso-administrativo, directamente y sin agotar la vía administrativa."
  - id: c
    correct: true
    text:
      es: "Ninguno, sin perjuicio del que proceda contra la resolución que ponga fin al procedimiento."
  - id: d
    text:
      es: "El recurso extraordinario de revisión, si aparecen documentos nuevos."
  explanation:
    es: "Los acuerdos sobre ampliación de plazos o sobre su denegación no son susceptibles de recurso, sin perjuicio del que proceda contra la resolución que ponga fin al procedimiento (art. 32.3 LPAC). Por eso no cabe contra la denegación a Doña Amparo la reposición ni el contencioso directo. Tampoco el recurso extraordinario de revisión, que solo cabe contra actos firmes en vía administrativa."
  citation: "art. 32.3 LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-33
- id: m02-l03-q0037
  prompt:
    es: "¿Qué recurso cabe contra el acuerdo de la Jefatura que declara la tramitación de urgencia, según el artículo 33.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Recurso de alzada ante el superior jerárquico de la Jefatura, en el plazo de un mes desde el acuerdo."
  - id: b
    correct: true
    text:
      es: "Ninguno contra el acuerdo, sin perjuicio del que proceda contra la resolución final del procedimiento."
  - id: c
    text:
      es: "Recurso potestativo de reposición, en el plazo de un mes, ante la propia Jefatura Central."
  - id: d
    text:
      es: "Recurso extraordinario de revisión, por tratarse de un acto de trámite que acelera el procedimiento."
  explanation:
    es: "No cabe recurso alguno contra el acuerdo que declara la tramitación de urgencia, sin perjuicio del procedente contra la resolución que ponga fin al procedimiento (art. 33.2 LPAC). La alzada y la reposición son recursos contra resoluciones y actos de trámite que la ley no excluye, y aquí la ley los excluye. El recurso extraordinario de revisión solo cabe contra actos firmes y por las causas tasadas del artículo 125. El interesado puede alegar su disconformidad al recurrir la resolución final."
  citation: "art. 33.2 LPAC"
  difficulty: 2
  tags:
  - "recurso"
  - "requisito"
# anchor: boe-a-2015-10565-art-32
- id: m02-l03-q0039
  prompt:
    es: "¿Cuál de las siguientes informaciones debe publicar la Administración en la sede electrónica al ampliar plazos por una incidencia técnica, según el artículo 32.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El acuerdo de ampliación, en el Boletín Oficial del Estado."
  - id: b
    correct: true
    text:
      es: "La incidencia técnica acontecida y la ampliación concreta del plazo no vencido."
  - id: c
    text:
      es: "La relación de interesados afectados y el plazo de cada uno."
  - id: d
    text:
      es: "El informe técnico del órgano responsable del sistema."
  explanation:
    es: "El artículo 32.4 obliga a publicar en la sede electrónica la incidencia técnica y la ampliación concreta del plazo no vencido. No exige publicar el acuerdo en el Boletín Oficial del Estado, ni una relación de afectados con su plazo, ni un informe técnico."
  citation: "art. 32.4 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-122
- id: m02-l03-q0041
  prompt:
    es: "Conforme al artículo 122.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, contra la resolución de un recurso de alzada no cabrá ningún otro recurso administrativo, salvo:"
  options:
  - id: a
    correct: true
    text:
      es: "El recurso extraordinario de revisión."
  - id: b
    text:
      es: "El recurso potestativo de reposición."
  - id: c
    text:
      es: "Una nueva alzada ante el órgano superior."
  - id: d
    text:
      es: "La reclamación previa a la vía judicial."
  explanation:
    es: "El artículo 122.3 deja abierto solo el recurso extraordinario de revisión, en los casos del artículo 125.1. La reposición procede contra actos que ponen fin a la vía administrativa, no contra la resolución de alzada, y una nueva alzada o una reclamación previa tampoco están previstas."
  citation: "art. 122.3 LPAC"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-30
- id: m02-l03-q0144
  prompt:
    es: "De acuerdo con el artículo 30.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta CORRECTA sobre los plazos señalados por horas, salvo que una ley o el Derecho de la Unión Europea dispongan otro cómputo:"
  options:
  - id: a
    text:
      es: "Son hábiles todas las horas del día natural, incluidos los sábados, los domingos y los festivos, y se cuentan desde las cero horas del día siguiente."
  - id: b
    text:
      es: "Se cuentan de hora en hora y de minuto en minuto desde la notificación o publicación, y pueden superar las veinticuatro horas sin expresarse en días."
  - id: c
    correct: true
    text:
      es: "Se cuentan de hora en hora y de minuto en minuto desde la notificación o publicación del acto, y no pueden superar las veinticuatro horas."
  - id: d
    text:
      es: "Son hábiles solo las horas del horario de apertura de las oficinas, y se cuentan desde el inicio del primer día hábil siguiente."
  explanation:
    es: "El artículo 30.1 hace hábiles todas las horas de un día hábil, las cuenta de hora en hora y de minuto en minuto desde la notificación o publicación, y limita estos plazos a veinticuatro horas (si fueran más, se expresan en días). No son hábiles las horas de los días inhábiles, ni se cuentan desde las cero horas del día siguiente, ni dependen del horario de las oficinas, ni pueden superar las veinticuatro horas."
  citation: "art. 30.1 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "horas"
# anchor: boe-a-2015-10565-art-30
- id: m02-l03-q0145
  prompt:
    es: "A una empresa se le notifica el viernes 13 de marzo de 2026, a las 18:00 horas, un acto con un plazo de veinticuatro horas, sin que ninguna norma disponga otro cómputo. El 14 y el 15 de marzo son sábado y domingo, y no hay festivos. Según el artículo 30.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo vence el plazo?"
  options:
  - id: a
    text:
      es: "El sábado 14 de marzo de 2026 a las 18:00 horas."
  - id: b
    correct: true
    text:
      es: "El lunes 16 de marzo de 2026 a las 18:00 horas."
  - id: c
    text:
      es: "El viernes 13 de marzo de 2026 a las 24:00 horas."
  - id: d
    text:
      es: "El lunes 16 de marzo de 2026 a las 24:00 horas."
  explanation:
    es: "Solo cuentan las horas de días hábiles (artículo 30.1): del viernes a las 18:00 quedan seis horas hasta las 24:00, el sábado y el domingo no cuentan, y las dieciocho restantes se agotan el lunes a las 18:00. El sábado a las 18:00 sale de contar veinticuatro horas naturales. El viernes a las 24:00 deja el plazo en seis horas. Y el lunes a las 24:00 supone contar un día hábil entero después de las seis horas del viernes."
  citation: "art. 30.1 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
  - "horas"
# anchor: boe-a-2015-10565-art-30
- id: m02-l03-q0146
  prompt:
    es: "Según el artículo 30.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando los plazos se señalan por días y ninguna ley ni el Derecho de la Unión Europea expresan otro cómputo, ¿qué días se excluyen del cómputo?"
  options:
  - id: a
    correct: true
    text:
      es: "Los sábados, los domingos y los declarados festivos."
  - id: b
    text:
      es: "Los domingos, los festivos y los días de cierre de las oficinas del órgano que tramita."
  - id: c
    text:
      es: "Únicamente los festivos nacionales y los de la Comunidad Autónoma del órgano."
  - id: d
    text:
      es: "Los sábados y los domingos, pero no los declarados festivos."
  explanation:
    es: "El artículo 30.2 excluye del cómputo los sábados, los domingos y los declarados festivos. No cuentan como excluidos los días de cierre de las oficinas, ni solo los festivos, ni se limita a los fines de semana."
  citation: "art. 30.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "días hábiles"
# anchor: boe-a-2015-10565-art-30
- id: m02-l03-q0147
  prompt:
    es: "Una ley fija un plazo de diez días naturales para formular alegaciones en un procedimiento. El órgano competente notifica el acuerdo de iniciación. Según el artículo 30.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué debe hacer constar en la notificación?"
  options:
  - id: a
    correct: true
    text:
      es: "Que el plazo se ha señalado por días naturales por declararlo así una ley."
  - id: b
    text:
      es: "Que el plazo se cuenta en días hábiles, con exclusión de sábados, domingos y festivos."
  - id: c
    text:
      es: "Nada, porque cuando lo fija una ley el cómputo en días naturales se presume."
  - id: d
    text:
      es: "Que el plazo se ampliará hasta la mitad si su último día fuera inhábil."
  explanation:
    es: "Cuando una ley o el Derecho de la Unión Europea señalan los plazos por días naturales, el artículo 30.2 exige hacerlo constar en las notificaciones. No se computan como hábiles, no se presume el cómputo natural sin advertirlo, y la ampliación hasta la mitad es una figura del artículo 32 que no se anuncia por esa vía."
  citation: "art. 30.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "días naturales"
  - "supuesto"
