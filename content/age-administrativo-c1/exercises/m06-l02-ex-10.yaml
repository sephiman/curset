# anchor: fuente-ms-outlook-copilot-resumir-html
- id: m06-l02-q352
  prompt:
    es: "En Outlook clásico o en el nuevo Outlook, ¿dónde aparece el resumen que genera Copilot de una conversación de correo?"
  options:
  - id: a
    text:
      es: "Debajo del correo electrónico"
  - id: b
    correct: true
    text:
      es: "En la parte superior del correo electrónico"
  - id: c
    text:
      es: "En un panel lateral junto a la lista de mensajes"
  - id: d
    text:
      es: "En una ventana emergente que oculta la conversación"
  explanation:
    es: "La página dice que el resumen aparecerá en la parte superior del correo electrónico, y que puede incluir citas numeradas que llevan al correo correspondiente. Debajo del correo es donde se ve el resumen en Outlook para iOS y Android, y la página sitúa el resumen en la parte superior, no en un panel lateral ni en una ventana emergente."
  citation: "fuente: `ms-outlook-copilot-resumir.html`; «Resumen por Copilot»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-copilot-resumir-html
- id: m06-l02-q353
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de las siguientes opciones permite resumir los datos adjuntos de un correo electrónico?"
  options:
  - id: a
    text:
      es: "Resumen por Copilot"
  - id: b
    correct: true
    text:
      es: "Resumir un archivo"
  - id: c
    text:
      es: "Reescribir"
  - id: d
    text:
      es: "Editar con Copilot"
  explanation:
    es: "La página dice que, en el nuevo Outlook, si el correo tiene datos adjuntos (PDF, PowerPoint o Word), se puede seleccionar Resumir un archivo. Resumen por Copilot resume la conversación, y Reescribir y Editar con Copilot son opciones de Word."
  citation: "fuente: `ms-outlook-copilot-resumir.html`; «Resumen por Copilot»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-copilot-html
- id: m06-l02-q354
  prompt:
    es: "En Word para Microsoft 365, ¿cómo se indica a Copilot que use un documento, un correo electrónico o una reunión concretos?"
  options:
  - id: a
    correct: true
    text:
      es: "Escribiendo / en el panel de chat y empezando a escribir el nombre"
  - id: b
    text:
      es: "Seleccionando Solo chat en el panel de chat de Copilot"
  - id: c
    text:
      es: "Seleccionando el texto y eligiendo la opción preestablecida Reescribir"
  - id: d
    text:
      es: "Usando el selector de modelos del panel de chat"
  explanation:
    es: "La página dice que se escribe / en el panel de chat de Copilot y se empieza a escribir el nombre de un documento, correo electrónico o reunión que Copilot debe usar. Solo chat impide los cambios en el documento, Reescribir es una opción preestablecida sobre el texto seleccionado y el selector de modelos sirve para cambiar de modelo."
  citation: "fuente: `ms-word-copilot.html`; «Otras notas y sugerencias»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-copilot-html
- id: m06-l02-q355
  prompt:
    es: "En Word para Microsoft 365, ¿qué se usa en el panel de chat de Copilot para cambiar de modelo en cuestión de segundos?"
  options:
  - id: a
    text:
      es: "El botón Solo chat"
  - id: b
    text:
      es: "La opción Editar con Copilot"
  - id: c
    text:
      es: "El comando / del panel de chat"
  - id: d
    correct: true
    text:
      es: "El selector de modelos"
  explanation:
    es: "La página dice que se usa el selector de modelos para cambiar de modelo en cuestión de segundos. Solo chat decide que Copilot no cambie el documento, Editar con Copilot sirve para mejorar un documento existente y / permite indicar un documento, correo o reunión."
  citation: "fuente: `ms-word-copilot.html`; «Otras notas y sugerencias»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-copilot-html
- id: m06-l02-q356
  prompt:
    es: "En Excel para Microsoft 365, ¿desde dónde puede Copilot recuperar datos de otros libros de Excel?"
  options:
  - id: a
    text:
      es: "Solo desde libros de OneDrive o de SharePoint, nunca desde el equipo"
  - id: b
    text:
      es: "Solo desde libros guardados en el equipo, no en OneDrive ni SharePoint"
  - id: c
    correct: true
    text:
      es: "Desde libros guardados en OneDrive, en SharePoint o en el equipo"
  - id: d
    text:
      es: "Solo desde libros guardados en SharePoint, no en OneDrive ni en el equipo"
  explanation:
    es: "La página dice que Copilot puede importar datos de otros libros de Excel guardados en OneDrive, en SharePoint o en el equipo. Limitarlo a uno solo de esos tres sitios contradice la frase."
  citation: "fuente: `ms-excel-copilot.html`; «Qué puede hacer con Copilot en Excel»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q357
  prompt:
    es: "Con un grupo o un icono con el foco en el menú Inicio de Windows 11, ¿cuál de las siguientes combinaciones de teclas lo mueve en la dirección que indica la tecla de dirección?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+teclas de dirección"
  - id: b
    text:
      es: "Mayús+teclas de dirección"
  - id: c
    correct: true
    text:
      es: "Alt+Mayús+teclas de dirección"
  - id: d
    text:
      es: "Ctrl+Alt+Tab"
  explanation:
    es: "La tabla asigna a Alt+Mayús+teclas de dirección mover un grupo o un icono con el foco en el menú Inicio en la dirección especificada. Ctrl+Mayús+teclas de dirección mueve una ventana con el foco a otra para crear una carpeta, Mayús con las teclas de dirección selecciona varios elementos y Ctrl+Alt+Tab muestra una miniatura de las aplicaciones abiertas."
  citation: "fuente: `ms-win-atajos.html`; «Escritorio y otros métodos abreviados generales»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q358
  prompt:
    es: "Con un elemento con el foco en el menú Inicio de Windows 11, ¿cuál de las siguientes combinaciones de teclas lo mueve a otro para crear una carpeta?"
  options:
  - id: a
    text:
      es: "Alt+Mayús+teclas de dirección"
  - id: b
    correct: true
    text:
      es: "Ctrl+Mayús+teclas de dirección"
  - id: c
    text:
      es: "Mayús+teclas de dirección"
  - id: d
    text:
      es: "Ctrl+Alt+Tab"
  explanation:
    es: "La tabla asigna a Ctrl+Mayús+teclas de dirección mover una ventana con el foco en el menú Inicio a otra para crear una carpeta. Alt+Mayús+teclas de dirección solo mueve un grupo o un icono, Mayús con las teclas de dirección selecciona varios elementos y Ctrl+Alt+Tab muestra una miniatura de las aplicaciones abiertas."
  citation: "fuente: `ms-win-atajos.html`; «Escritorio y otros métodos abreviados generales»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-excel-copilot-html
- id: m06-l02-q359
  prompt:
    es: "¿Qué ofrece Copilot en Excel para Microsoft 365 cuando se le pide información de la web, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Recupera datos de otros libros guardados solo en OneDrive"
  - id: b
    correct: true
    text:
      es: "Fundamenta las respuestas con citas a las fuentes utilizadas"
  - id: c
    text:
      es: "Crea gráficos sin vínculos a los datos de origen"
  - id: d
    text:
      es: "Sustituye las respuestas por una lista de enlaces sin resumen"
  explanation:
    es: "Según la página, la búsqueda web obtiene información de la web para fundamentar las respuestas, con citas a las fuentes utilizadas. «Recupera datos de otros libros guardados solo en OneDrive» altera otra función: la página dice que importa datos de libros guardados en OneDrive o SharePoint o en su equipo. «Crea gráficos sin vínculos a los datos de origen» contradice la página, que habla de gráficos con vínculos editables a datos de origen. «Sustituye las respuestas por una lista de enlaces sin resumen» no aparece en la página, que describe respuestas fundamentadas con citas."
  citation: "fuente: `ms-excel-copilot.html`; «Búsqueda web: Obtenga información de la web para fundamentar las respuestas, con citas a las fuentes utilizadas.»"
  difficulty: 2
  tags:
  - "comportamiento"
