- id: m01-l14-q379
  prompt:
    es: "Según el anexo IV del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, la cuantía por asistencia de los vocales de un tribunal de oposición o concurso de categoría segunda es de:"
  options:
  - id: a
    text:
      es: "42,83 euros."
