# anchor: fuente-ms-access-subformulario-html
- id: m06-l06-q318
  prompt:
    es: "En Access 365, ¿cuál de los siguientes nombres recibe a veces una combinación de formulario y subformulario?"
  options:
  - id: a
    text:
      es: "Formulario dividido"
  - id: b
    text:
      es: "Formulario independiente"
  - id: c
    correct: true
    text:
      es: "Formulario jerárquico"
  - id: d
    text:
      es: "Formulario en blanco"
  explanation:
    es: "La ayuda dice: «Una combinación de formulario y subformulario a veces se denomina formulario jerárquico, formulario principal/detallado o formulario primario/secundario». «Formulario dividido» es una herramienta de la pestaña Crear que muestra dos vistas conectadas. «Formulario independiente» es el que no está vinculado a un origen de datos. «Formulario en blanco» es la herramienta que abre un formulario vacío en vista Presentación. Ninguno designa la combinación."
  citation: "fuente: `ms-access-subformulario.html`; «Información sobre subformularios»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-orden-tabulacion-html
- id: m06-l06-q319
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas de la cinta abre el cuadro de diálogo Orden de tabulación de un formulario en la vista Diseño?"
  options:
  - id: a
    text:
      es: "Diseño › Controles › Orden de tabulación"
  - id: b
    text:
      es: "Inicio › Vistas › Orden de tabulación"
  - id: c
    text:
      es: "Datos externos › Exportar › Orden de tabulación"
  - id: d
    correct: true
    text:
      es: "Diseño › Herramientas › Orden de tabulación"
  explanation:
    es: "La página dice: «En la pestaña Diseño, en el grupo Herramientas, haga clic en Orden de tabulación». «Diseño › Controles» es el grupo con el control Salto de página y otros controles, no el de este comando. «Inicio › Vistas» sirve para cambiar de vista. «Datos externos › Exportar» agrupa los comandos de exportación, como Excel o PDF o XPS."
  citation: "fuente: `ms-access-orden-tabulacion.html`; «Cambiar el orden de tabulación de los controles»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-orden-tabulacion-html
- id: m06-l06-q320
  prompt:
    es: "En Access 365, ¿cuál de las siguientes acciones consigue que Access cree el orden de tabulación de un formulario según la posición de sus controles, de arriba a abajo y de izquierda a derecha?"
  options:
  - id: a
    correct: true
    text:
      es: "Con el botón Orden automático del cuadro"
  - id: b
    text:
      es: "Poniendo la propiedad Tabulación en Sí en cada control"
  - id: c
    text:
      es: "Poniendo la propiedad Ciclo en Todos los registros"
  - id: d
    text:
      es: "Arrastrando cada control en la lista de la sección"
  explanation:
    es: "La página dice: «Si desea que Access cree un orden de tabulación de arriba a abajo y de izquierda a derecha, haga clic en Orden automático». «Poniendo la propiedad Tabulación en Sí en cada control» no crea ningún orden: Tabulación en No es lo que quita un control del orden. «La propiedad Ciclo en Todos los registros» solo define qué ocurre al pulsar Tab en el último campo. «Arrastrando cada control en la lista de la sección» es el procedimiento para crear el propio orden personalizado."
  citation: "fuente: `ms-access-orden-tabulacion.html`; «Cambiar el orden de tabulación de los controles»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-orden-tabulacion-html
- id: m06-l06-q321
  prompt:
    es: "En Access 365, ¿cómo se crea un orden de tabulación personalizado en el cuadro de diálogo Orden de tabulación?"
  options:
  - id: a
    text:
      es: "Con el botón Orden automático y luego Aceptar"
  - id: b
    correct: true
    text:
      es: "Arrastrando el selector del control a su lugar en la lista"
  - id: c
    text:
      es: "Poniendo la propiedad Ciclo en Registro actual"
  - id: d
    text:
      es: "Quitando la propiedad Tabulación de cada control"
  explanation:
    es: "La página dice: «Si desea crear su propio orden de tabulación personalizado, haga clic en el selector del control que desee mover». Después: «Vuelva a hacer clic en el selector y arrastre el control a la ubicación deseada en la lista». «Orden automático» crea el orden de arriba a abajo y de izquierda a derecha, no uno propio. «Ciclo en Registro actual» solo mantiene el foco en el registro actual. «Quitando la propiedad Tabulación de cada control» saca los controles del orden en lugar de ordenarlos."
  citation: "fuente: `ms-access-orden-tabulacion.html`; «Cambiar el orden de tabulación de los controles»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-orden-tabulacion-html
- id: m06-l06-q323
  prompt:
    es: "De forma predeterminada, al presionar Tab en Access 365 con el cursor en el último campo del orden de tabulación de un formulario:"
  options:
  - id: a
    text:
      es: "Access permanece en el registro actual y vuelve al primer campo"
  - id: b
    text:
      es: "Access guarda el registro y cierra el formulario"
  - id: c
    text:
      es: "Access pasa a la pestaña siguiente de la cinta"
  - id: d
    correct: true
    text:
      es: "Access muestra el registro siguiente y va al primer campo"
  explanation:
    es: "La página dice: «De forma predeterminada, al presionar la tecla TAB mientras el cursor está en el último campo del orden de tabulación, Access muestra el registro siguiente en el origen de datos y mueve el cursor al primer campo del orden de tabulación». «Permanece en el registro actual y vuelve al primer campo» es lo que ocurre solo si se cambia Ciclo a Registro actual. «Guarda el registro y cierra el formulario» y «pasa a la pestaña siguiente de la cinta» no figuran en la página."
  citation: "fuente: `ms-access-orden-tabulacion.html`; «Cambiar el comportamiento de tabulación del último campo del orden de tabulación»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-orden-tabulacion-html
- id: m06-l06-q324
  prompt:
    es: "En Access 365, con la propiedad Ciclo en Registro actual, ¿cuál de las siguientes opciones indica adónde se desplaza el foco al presionar Tab en el último campo?"
  options:
  - id: a
    correct: true
    text:
      es: "Al primer campo del registro actual"
  - id: b
    text:
      es: "Al primer campo del registro siguiente"
  - id: c
    text:
      es: "Al primer campo de la página siguiente"
  - id: d
    text:
      es: "Al último campo del registro anterior"
  explanation:
    es: "La página dice de Registro actual: «Al presionar la tecla TAB en el último campo del registro, el foco se desplaza al primer campo del registro actual». Ir al primer campo del registro siguiente es el comportamiento predeterminado, el de la opción Todos los registros. Ir a la página siguiente no es ninguna de las tres opciones de Ciclo: Página actual lleva al primer campo de la página actual. Y ir al último campo del registro anterior tampoco es una de las tres: las únicas son Todos los registros, Registro actual y Página actual."
  citation: "fuente: `ms-access-orden-tabulacion.html`; «Cambiar el comportamiento de tabulación del último campo del orden de tabulación»"
  difficulty: 2
  tags:
  - "comportamiento"
