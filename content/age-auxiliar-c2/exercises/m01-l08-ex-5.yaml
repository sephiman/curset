    es: "Según el artículo 76.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué aspecto de las Delegaciones y Subdelegaciones del Gobierno se fija por Real Decreto del Consejo de Ministros?"
