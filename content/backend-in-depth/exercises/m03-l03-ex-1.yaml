- id: m03-l03-q15
  prompt:
    en: A scope's owner thread is interrupted while it waits in `join()`. What does the try-with-resources statement
      then do with the scope and its subtasks?
  options:
  - id: a
    text:
      en: It returns at once and leaves the unfinished subtasks running in the background
  - id: b
    text:
      en: It ignores the interrupt, so `join()` completes normally
  - id: c
    text:
      en: It terminates the subtask threads forcibly, even those blocked in non-interruptible methods
  - id: d
    correct: true
    text:
      en: It cancels the scope, which cancels all subtasks and waits for them to terminate
  explanation:
    en: The try-with-resources statement cancels the scope, which cancels all the subtasks and waits for them to
      terminate. Returning at once is wrong because the `close` method always waits for threads executing subtasks
      to finish. Ignoring the interrupt is wrong because `join()` throws an exception when the owner is interrupted.
      Forcible termination is wrong because subtasks that do not respond to interrupts may delay the closing of
      a scope indefinitely.
  citation: jep-505#Cancellation
