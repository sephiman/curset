- id: m06-l03-q026
  prompt:
    es: "En Windows 11, si no se conoce la extensión de un archivo, ¿qué opción de su menú contextual hace que Microsoft Store muestre las aplicaciones que pueden abrirlo?"
  options:
  - id: a
    text:
      es: "Mostrar más opciones › Enviar a"
  - id: b
    text:
      es: "Abrir con › Elegir otra aplicación"
  - id: c
    correct: true
    text:
      es: "Abrir con › Buscar en Microsoft Store"
  - id: d
    text:
      es: "Mostrar más opciones › Conceder acceso a"
  explanation:
    es: "La página de extensiones indica: si no se conoce la extensión, se hace clic con el botón derecho en el archivo y se selecciona «Abrir con>Buscar en Microsoft Store», y Microsoft Store muestra las aplicaciones que pueden abrirlo. Abrir con › Elegir otra aplicación muestra las aplicaciones del equipo, no las de la tienda; Enviar a lleva a destinos como una carpeta comprimida, y Conceder acceso a sirve para compartir el archivo en la red local."
  citation: "fuente: `ms-win-extensiones.html`; «Abrir extensiones de archivo desconocidas»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-extensiones-html
- id: m06-l03-q027
  prompt:
    es: "En Windows 11, al hacer clic con el botón derecho en un archivo de extensión desconocida y seleccionar Abrir con › Elegir otra aplicación:"
  options:
  - id: a
    correct: true
    text:
      es: "Se muestra una lista de aplicaciones del equipo para intentar abrirlo."
  - id: b
    text:
      es: "Microsoft Store muestra una lista de las aplicaciones que pueden abrirlo."
  - id: c
    text:
      es: "Se cambia la extensión del archivo por la de la aplicación que se elija."
  - id: d
    text:
      es: "Se abre con la aplicación predeterminada, sin poder elegir otra."
  explanation:
    es: "La página indica que Abrir con › Elegir otra aplicación muestra «una lista de aplicaciones en el equipo» para intentar abrir el archivo. La lista de Microsoft Store es la de Abrir con › Buscar en Microsoft Store. Elegir una aplicación no cambia la extensión. La guía del Explorador para lectores de pantalla dice que Abrir con permite elegir una aplicación «incluso si ya hay un programa predeterminado configurado para ese tipo de archivo»."
  citation: "fuente: `ms-win-extensiones.html`; «Abrir extensiones de archivo desconocidas»"
  difficulty: 2
  tags:
  - "comportamiento"
