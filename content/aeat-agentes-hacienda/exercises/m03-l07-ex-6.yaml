  prompt:
    es: "¿Cuál de las siguientes es una forma de terminación del procedimiento de tasación pericial contradictoria, según el artículo 162.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "La firma de la hoja de aprecio por el perito de la Administración y el del obligado."
  - id: b
    text:
      es: "El pago por el obligado de los honorarios de su propio perito."
  - id: c
    text:
      es: "La notificación de la liquidación al obligado tributario con los valores comprobados por la Administración actuante."
  - id: d
    correct: true
    text:
      es: "La entrega en la Administración tributaria de la valoración efectuada por el perito tercero."
  explanation:
