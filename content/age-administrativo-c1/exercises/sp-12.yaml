    text:
      es: "El lunes, 15 de febrero de 2027."
  - id: d
    text:
      es: "El lunes, 22 de febrero de 2027."
  explanation:
    es: "En los procedimientos de responsabilidad patrimonial el informe del servicio es preceptivo y su emisión no puede exceder de diez días (art. 81.1 LPAC), que son hábiles (art. 30.2 LPAC). Desde el martes 2 de febrero, el décimo día hábil es el lunes, 15 de febrero de 2027. La fecha del jueves 11 de febrero cuenta diez días naturales. La del viernes 12 cuenta el lunes 1 de febrero como primer día. La del lunes 22 aplica quince días, un plazo que este informe no tiene."
  citation: "art. 81.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-156
- id: q06
  lesson: m03-l04
  prompt:
    es: "El Instituto acepta la presentación electrónica de ofertas en el contrato publicitario y quiere fijar el plazo de presentación de proposiciones más corto que permite la ley, sin invocar urgencia ni anuncio previo. ¿Cuándo termina ese plazo?"
  options:
  - id: a
    text:
      es: "El martes, 27 de abril de 2027."
  - id: b
    text:
      es: "El viernes, 7 de mayo de 2027."
  - id: c
    correct: true
    text:
      es: "El miércoles, 12 de mayo de 2027."
  - id: d
    text:
      es: "El lunes, 17 de mayo de 2027."
  explanation:
    es: "En un abierto sujeto a regulación armonizada, el plazo de proposiciones no es inferior a treinta y cinco días desde el envío del anuncio (art. 156.2 LCSP), y si se aceptan ofertas electrónicas puede reducirse en cinco (art. 156.3.c LCSP). Quedan treinta días, naturales según la disposición adicional duodécima LCSP, y desde el lunes 12 de abril terminan el miércoles, 12 de mayo de 2027. La fecha de treinta y cinco días no aplica la reducción. La de veinticinco resta cinco días dos veces. La de quince es el plazo de urgencia, que el Instituto no invoca."
  citation: "art. 156.2–3 LCSP"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-158
- id: q07
  lesson: m03-l04
  prompt:
    es: "Conforme al artículo 158 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿hasta qué fecha puede adjudicarse el contrato publicitario del Instituto, dado que la Mesa sigue el trámite de las ofertas anormalmente bajas?"
  options:
  - id: a
    text:
      es: "El martes, 27 de julio de 2027."
  - id: b
    text:
      es: "El miércoles, 11 de agosto de 2027."
  - id: c
    text:
      es: "El martes, 17 de agosto de 2027."
  - id: d
    correct: true
    text:
      es: "El miércoles, 18 de agosto de 2027."
  explanation:
    es: "Con varios criterios, el plazo de adjudicación es de dos meses desde la apertura (art. 158.2 LCSP): desde el jueves 27 de mayo, vence el martes 27 de julio. Si hay que seguir el trámite del artículo 149.4, se amplía en quince días hábiles (art. 158.3 LCSP). Desde el miércoles 28 de julio, y sin contar el lunes 16 de agosto, festivo en Madrid, el decimoquinto día hábil es el miércoles, 18 de agosto de 2027. La fecha del martes 27 de julio olvida la ampliación. La del miércoles 11 de agosto suma quince días naturales. La del martes 17 de agosto cuenta como hábil el festivo."
  citation: "art. 158.1–3 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-50
