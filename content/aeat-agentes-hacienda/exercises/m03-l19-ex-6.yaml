# anchor: boe-a-1992-28740-art-95
- id: m03-l19-q0098
  prompt:
    es: "De acuerdo con el artículo 95.Cuatro de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, lo dispuesto para los bienes de inversión se aplica también a las cuotas soportadas por la adquisición o importación de accesorios y piezas de recambio, combustibles, carburantes, lubrificantes y productos energéticos, y por los servicios de:"
  options:
  - id: a
    text:
      es: "seguros y financiación, y el arrendamiento de los bienes de inversión sin opción de compra de los mismos."
  - id: b
    text:
      es: "formación del personal y asesoramiento para el uso de los bienes de inversión."
  - id: c
    correct: true
    text:
      es: "aparcamiento y utilización de vías de peaje, y la rehabilitación, renovación y reparación de esos bienes."
  - id: d
    text:
      es: "transporte de mercancías y alquiler de plazas de garaje para los bienes de inversión."
  explanation:
    es: "La extensión alcanza a los servicios de aparcamiento y uso de vías de peaje y a la rehabilitación, renovación y reparación de los bienes. Los seguros, la financiación, la formación o el transporte de mercancías no figuran en el apartado Cuatro."
  citation: "art. 95.Cuatro LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "vehículos"
# anchor: boe-a-1992-28740-art-96
- id: m03-l19-q0100
  prompt:
    es: "Según el artículo 96.Uno.5.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, no tienen la consideración de atenciones a clientes, asalariados o terceras personas, a efectos de la exclusión de la deducción:"
  options:
  - id: a
    correct: true
    text:
      es: "las muestras gratuitas y los objetos publicitarios de escaso valor definidos en el artículo 7, números 2.º y 4.º."
  - id: b
    text:
      es: "los regalos de empresa a asalariados cuyo valor no exceda de un importe razonable."
  - id: c
    text:
      es: "los obsequios a clientes entregados con ocasión de celebraciones de carácter institucional."
  - id: d
    text:
      es: "las comidas de trabajo con clientes que consten debidamente justificadas en la contabilidad."
  explanation:
    es: "Quedan fuera del concepto las muestras gratuitas y los objetos publicitarios de escaso valor del artículo 7, números 2.º y 4.º. Las comidas con clientes, los regalos a asalariados de valor razonable y los obsequios institucionales siguen siendo atenciones excluidas."
  citation: "art. 96.Uno LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "exclusiones"
# anchor: boe-a-1992-28740-art-96
- id: m03-l19-q0101
  prompt:
    es: "Conforme al artículo 96.Uno.6.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, no son deducibles las cuotas soportadas por servicios de desplazamiento o viajes, hostelería y restauración, salvo que su importe tuviera la consideración de gasto:"
  options:
  - id: a
    text:
      es: "contable registrado en la contabilidad del empresario o profesional."
  - id: b
    text:
      es: "deducible únicamente a efectos del Impuesto sobre Sociedades, con exclusión del IRPF."
  - id: c
    correct: true
    text:
      es: "fiscalmente deducible a efectos del Impuesto sobre la Renta de las Personas Físicas o del Impuesto sobre Sociedades."
  - id: d
    text:
      es: "justificado mediante factura completa expedida con el número de identificación del cliente."
  explanation:
    es: "La salvedad es que el importe sea gasto fiscalmente deducible en el IRPF o en el Impuesto sobre Sociedades. Que esté contabilizado, que sea deducible solo en uno de los dos impuestos o que conste en factura completa no basta."
  citation: "art. 96.Uno LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "exclusiones"
# anchor: boe-a-1992-28740-art-96
- id: m03-l19-q0102
  prompt:
    es: "De acuerdo con el artículo 96.Dos.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se exceptúan de la exclusión de la deducción del artículo 96.Uno, entre otros, los bienes que objetivamente considerados sean de exclusiva aplicación:"
  options:
  - id: a
    text:
      es: "industrial, financiera, agraria, jurídica o científica."
  - id: b
    text:
      es: "comercial, agraria, fiscal, clínica o artesanal."
  - id: c
    text:
      es: "industrial, comercial, administrativa, docente o científica."
  - id: d
    correct: true
    text:
      es: "industrial, comercial, agraria, clínica o científica."
  explanation:
    es: "La excepción cubre los bienes de exclusiva aplicación industrial, comercial, agraria, clínica o científica. Cada una de las otras listas mezcla un ámbito que el precepto no recoge."
  citation: "art. 96.Dos.1.º LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "exclusiones"
# anchor: boe-a-1992-28740-art-97
- id: m03-l19-q0103
  prompt:
    es: "¿De qué deben estar en posesión los empresarios o profesionales para ejercitar el derecho a la deducción, según el artículo 97.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "Del documento justificativo de su derecho."
  - id: b
    text:
      es: "De la autorización previa de la Administración tributaria."
  - id: c
    text:
      es: "Del justificante de pago de las cuotas soportadas."
  - id: d
    text:
      es: "De la declaración censal de inicio de la actividad."
  explanation:
    es: "El requisito es poseer el documento justificativo del derecho. No hace falta autorización previa, ni acreditar el pago de las cuotas, ni la declaración censal por sí sola."
  citation: "art. 97.Uno LIVA"
  difficulty: 1
  tags:
  - "deducciones"
  - "requisitos formales"
# anchor: boe-a-1992-28740-art-97
- id: m03-l19-q0104
  prompt:
    es: "Señale la respuesta CORRECTA sobre los documentos justificativos del derecho a la deducción, según el artículo 97.Uno.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Es documento justificativo el albarán de entrega firmado por el destinatario de los bienes adquiridos."
  - id: b
    correct: true
    text:
      es: "Es documento justificativo la factura original expedida por quien realice la entrega o preste el servicio."
  - id: c
    text:
      es: "Es documento justificativo la copia de la factura que conserva quien realice la entrega o preste el servicio."
  - id: d
    text:
      es: "Es documento justificativo el justificante de pago bancario de la cuota soportada en la operación."
  explanation:
    es: "El primer documento justificativo del artículo 97.Uno es la factura original expedida por quien entrega o presta el servicio. La copia que conserva el emisor, el albarán firmado y el justificante bancario no figuran como tales en el número 1.º."
  citation: "art. 97.Uno LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "requisitos formales"
# anchor: boe-a-1992-28740-art-98
- id: m03-l19-q0106
  prompt:
    es: "¿En qué momento nace el derecho a la deducción de las cuotas deducibles, salvo en los casos de los apartados siguientes del artículo 98 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "En el momento en que se presenta la autoliquidación del período."
  - id: b
    correct: true
    text:
      es: "En el momento en que se devengan las cuotas deducibles."
  - id: c
    text:
      es: "En el momento en que se recibe la factura que documenta la operación."
  - id: d
    text:
      es: "En el momento en que se paga el precio al proveedor de los bienes."
  explanation:
    es: "El derecho nace cuando se devengan las cuotas deducibles. La recepción de la factura fija cuándo se entienden soportadas (art. 99.Cuatro), no el nacimiento del derecho, y el pago o la autoliquidación no son el hecho que lo origina."
  citation: "art. 98.Uno LIVA"
  difficulty: 1
  tags:
  - "deducciones"
  - "nacimiento del derecho"
# anchor: boe-a-1992-28740-art-99
- id: m03-l19-q0107
  prompt:
    es: "Según el artículo 99.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, en las declaraciones-liquidaciones de cada período, ¿cómo pueden deducir los sujetos pasivos las cuotas soportadas?"
  options:
  - id: a
    correct: true
    text:
      es: "Deduciendo globalmente el total de las cuotas deducibles soportadas en el período del total de las cuotas devengadas durante el mismo período."
  - id: b
    text:
      es: "Deduciendo las cuotas soportadas únicamente cuando superen a las cuotas devengadas en el mismo período."
  - id: c
    text:
      es: "Deduciendo cada cuota soportada de la cuota devengada por la operación concreta a la que se refiere."
  - id: d
    text:
      es: "Deduciendo las cuotas soportadas en el período del total de las cuotas devengadas en el período anterior."
  explanation:
    es: "La deducción es global: el total de cuotas deducibles soportadas en el período se resta del total devengado en el mismo período. No se imputa operación por operación ni contra el período anterior, y no exige que las soportadas superen a las devengadas."
  citation: "art. 99.Uno LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "ejercicio"
# anchor: boe-a-1992-28740-art-99
- id: m03-l19-q0108
  prompt:
    es: "¿En función de qué deben efectuarse las deducciones, sin perjuicio de su rectificación posterior si aquel fuese alterado, según el artículo 99.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "Del destino previsible de los bienes y servicios adquiridos."
  - id: b
    text:
      es: "De la forma de pago pactada para los bienes y servicios adquiridos."
  - id: c
    text:
      es: "Del valor de adquisición de los bienes y servicios adquiridos."
  - id: d
    text:
      es: "Del destino real que tengan los bienes al cierre del ejercicio."
  explanation:
    es: "Las deducciones se practican según el destino previsible y se rectifican si luego cambia. El destino real al cierre, el valor de adquisición o la forma de pago no son el criterio del apartado Dos."
  citation: "art. 99.Dos LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "ejercicio"
# anchor: boe-a-1992-28740-art-99
- id: m03-l19-q0109
  prompt:
    es: "¿Desde qué momento se cuenta el plazo de cuatro años durante el cual solo puede ejercitarse el derecho a la deducción, según el artículo 99.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Desde la expedición de la factura por el proveedor de los bienes o servicios."
  - id: b
    text:
      es: "Desde el pago del precio de la operación al proveedor de los bienes o servicios."
  - id: c
    text:
      es: "Desde la presentación de la declaración-liquidación del período en que se soportó la cuota."
  - id: d
    correct: true
    text:
      es: "Desde el nacimiento del mencionado derecho."
  explanation:
    es: "El plazo de cuatro años se cuenta desde el nacimiento del derecho, que se produce con el devengo de las cuotas (art. 98.Uno). Ni la presentación de la declaración, ni la fecha de la factura, ni el pago son el origen del cómputo. En el examen 2023 (pregunta 80) la plantilla oficial dio otra respuesta; esta pregunta sigue el texto del artículo."
  citation: "art. 99.Tres LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "plazos"
# anchor: boe-a-1992-28740-art-99
- id: m03-l19-q0110
  prompt:
    es: "Metalúrgica Tajo, S.A., con períodos de liquidación trimestrales, recibe el 20 de noviembre de 2026 una factura anticipada por un servicio que se prestará y devengará el 5 de febrero de 2027. Según el artículo 99.Cuatro de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿en qué período se entienden soportadas las cuotas?"
  options:
  - id: a
    text:
      es: "En el segundo trimestre de 2027, porque se presenta entonces la primera declaración del servicio."
  - id: b
    correct: true
    text:
      es: "En el primer trimestre de 2027, porque el devengo es posterior a la recepción de la factura."
  - id: c
    text:
      es: "En el cuarto trimestre de 2026, porque en ese período se recibe la factura."
  - id: d
    text:
      es: "En el cuarto trimestre de 2026, y se regulariza en el primer trimestre de 2027."
  explanation:
    es: "Si el devengo es posterior a la recepción de la factura, las cuotas se entienden soportadas cuando se devengan: el 5 de febrero de 2027, primer trimestre. La recepción en noviembre de 2026 solo sería decisiva si el devengo fuese anterior o simultáneo, y el precepto no prevé regularización ni desplazamiento al segundo trimestre."
  citation: "art. 99.Cuatro LIVA"
  difficulty: 3
  tags:
  - "deducciones"
  - "soportadas"
  - "cómputo"
# anchor: boe-a-1992-28740-art-99
- id: m03-l19-q0111
  prompt:
    es: "Señale la respuesta CORRECTA sobre el derecho a la deducción de las cuotas soportadas antes de la declaración de concurso y pendientes de deducir, según el artículo 99.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Se pierde en todo caso desde que se declara el concurso, sin posibilidad de deducción."
  - id: b
    text:
      es: "Debe ejercitarse en la declaración-liquidación correspondiente al período en que se dicte el auto de declaración de concurso."
  - id: c
    text:
      es: "Puede ejercitarse en cualquier declaración-liquidación posterior, dentro del plazo de cuatro años desde el nacimiento del derecho."
  - id: d
    correct: true
    text:
      es: "Debe ejercitarse en la declaración-liquidación correspondiente al período de liquidación en el que se hubieran soportado."
  explanation:
    es: "En caso de concurso, la deducción pendiente se ejercita en la declaración del período en que se soportaron las cuotas, sin esperar a períodos posteriores. No se desplaza al período del auto ni se pierde sin más."
  citation: "art. 99.Tres LIVA"
  difficulty: 3
  tags:
  - "deducciones"
  - "concurso"
# anchor: boe-a-1992-28740-art-99
- id: m03-l19-q0112
  prompt:
    es: "En las ventas ocasionales de medios de transporte nuevos a que se refiere el artículo 5, apartado uno, letra e), ¿cuándo puede ejercitarse el derecho a la deducción según el artículo 99.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "Solo en la declaración relativa al período en que se realice la entrega de los medios de transporte nuevos."
  - id: b
    text:
      es: "En cualquiera de las declaraciones de los cuatro años siguientes a la adquisición."
  - id: c
    text:
      es: "En la declaración relativa al período en que se adquirieron los medios de transporte nuevos por el sujeto pasivo."
  - id: d
    text:
      es: "En la declaración anual correspondiente al ejercicio en que se realice la entrega."
  explanation:
    es: "En estas ventas ocasionales el derecho se ejercita solo en la declaración del período de la entrega. No cabe hacerlo en el período de adquisición, en los cuatro años siguientes ni en la declaración anual."
  citation: "art. 99.Tres LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "medios de transporte nuevos"
# anchor: boe-a-1992-28740-art-99
- id: m03-l19-q0113
  prompt:
    es: "Según el artículo 99.Cinco de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, cuando las deducciones procedentes superen las cuotas devengadas en el mismo período, ¿hasta cuándo puede compensarse el exceso en las declaraciones posteriores?"
  options:
  - id: a
    text:
      es: "Sin límite de tiempo, hasta que el exceso quede totalmente compensado con cuotas devengadas."
  - id: b
    text:
      es: "Siempre que no hubiesen transcurrido cuatro años contados a partir del nacimiento del derecho a deducir las cuotas."
  - id: c
    correct: true
    text:
      es: "Siempre que no hubiesen transcurrido cuatro años contados a partir de la presentación de la declaración-liquidación en que se origine el exceso."
  - id: d
    text:
      es: "Siempre que no hubiese transcurrido un año contado a partir de la presentación de la declaración en que se origine el exceso."
  explanation:
    es: "El exceso se compensa durante cuatro años desde la presentación de la declaración-liquidación en que se origina. Contarlos desde el nacimiento del derecho es la regla del ejercicio del derecho (art. 99.Tres), y ni se reduce a un año ni es ilimitado."
  citation: "art. 99.Cinco LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "compensación"
  - "plazos"
# anchor: boe-a-1992-28740-art-99
- id: m03-l19-q0114
  prompt:
    es: "Hormigones Sella, S.L. presenta el 20 de enero de 2026 la declaración-liquidación en la que las deducciones superan en 5.000 euros las cuotas devengadas. No opta por la devolución. Según el artículo 99.Cinco de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿puede compensar ese exceso en la declaración-liquidación que presente el 20 de abril de 2029?"
  options:
  - id: a
    text:
      es: "No, porque el exceso solo puede compensarse en la declaración del período inmediatamente siguiente."
  - id: b
    correct: true
    text:
      es: "Sí, porque no habrán transcurrido cuatro años desde la presentación de la declaración en que se originó el exceso."
  - id: c
    text:
      es: "No, porque habrá transcurrido más de un año desde la presentación de la declaración en que se originó el exceso."
  - id: d
    text:
      es: "Sí, pero solo si el sujeto pasivo solicita antes la devolución del exceso a la Administración."
  explanation:
    es: "Los cuatro años de compensación se cuentan desde la presentación de la declaración del 20 de enero de 2026 y llegan hasta el 20 de enero de 2030. El 20 de abril de 2029 es anterior. No hay límite de un año ni obligación de compensar en el período siguiente, y pedir la devolución excluiría la compensación."
  citation: "art. 99.Cinco LIVA"
  difficulty: 3
  tags:
  - "deducciones"
  - "compensación"
  - "cómputo"
# anchor: boe-a-1992-28740-art-99
- id: m03-l19-q0115
  prompt:
    es: "Señale la respuesta CORRECTA sobre la opción por la devolución del saldo a favor del sujeto pasivo, según el artículo 99.Cinco de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "El sujeto pasivo puede optar por la devolución del saldo a su favor y, además, compensar el mismo saldo en las declaraciones-liquidaciones posteriores que presente."
  - id: b
    correct: true
    text:
      es: "El sujeto pasivo puede optar por la devolución del saldo a su favor cuando proceda, sin que pueda compensarlo en declaraciones-liquidaciones posteriores."
  - id: c
    text:
      es: "El sujeto pasivo puede optar por la devolución del saldo a su favor solo cuando se encuentre declarado en concurso."
  - id: d
    text:
      es: "El sujeto pasivo debe optar por la devolución del saldo a su favor cuando este supere el importe de las cuotas devengadas."
  explanation:
    es: "Quien opta por la devolución, cuando procede, no puede compensar ese saldo después. La opción es voluntaria, no se limita al concurso y no permite acumular devolución y compensación."
  citation: "art. 99.Cinco LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "compensación"
  - "devolución"
# anchor: boe-a-1992-28740-art-100
- id: m03-l19-q0116
  prompt:
    es: "¿Cuándo caduca el derecho a la deducción, según el artículo 100 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Cuando el titular no lo hubiera ejercitado en el período de liquidación siguiente a aquel en que se devengó."
  - id: b
    text:
      es: "Cuando el titular no lo hubiera ejercitado en el plazo de un año desde la recepción de la factura."
  - id: c
    correct: true
    text:
      es: "Cuando el titular no lo hubiera ejercitado en los plazos y cuantías señalados en el artículo 99."
  - id: d
    text:
      es: "Cuando el titular no lo hubiera comunicado a la Administración tributaria en el plazo de seis meses."
  explanation:
    es: "La caducidad se remite a los plazos y cuantías del artículo 99, no a un año desde la factura, a una comunicación en seis meses ni al período siguiente al devengo."
  citation: "art. 100 LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "caducidad"
# anchor: boe-a-1992-28740-art-100
- id: m03-l19-q0117
  prompt:
    es: "Según el artículo 100 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, cuando la procedencia del derecho a deducir esté pendiente de la resolución de una controversia en vía administrativa o jurisdiccional, ¿cuándo caduca el derecho?"
  options:
  - id: a
    text:
      es: "Cuando hubiesen transcurrido seis meses desde la fecha en que la resolución o sentencia sean firmes y notificadas."
  - id: b
    text:
      es: "Cuando hubiesen transcurrido cuatro años desde la fecha en que se inició la controversia."
  - id: c
    correct: true
    text:
      es: "Cuando hubiesen transcurrido cuatro años desde la fecha en que la resolución o sentencia sean firmes."
  - id: d
    text:
      es: "Cuando hubiesen transcurrido cuatro años desde la fecha en que se devengaron las cuotas."
  explanation:
    es: "Con controversia pendiente, los cuatro años se cuentan desde que la resolución o sentencia son firmes. No se cuentan desde el inicio de la controversia ni desde el devengo, y el plazo no es de seis meses."
  citation: "art. 100 LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "caducidad"
# anchor: boe-a-1992-28740-art-94
- id: m03-l19-q0118
  prompt:
    es: "¿Cuál de las siguientes operaciones realizadas fuera del territorio de aplicación del impuesto origina el derecho a la deducción, según el artículo 94.Uno.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "Las que originarían el derecho a la deducción si se hubieran efectuado en el interior del territorio de aplicación del impuesto."
  - id: b
    text:
      es: "Las que se realicen en Canarias, Ceuta o Melilla, aunque no originasen derecho a deducir en el interior."
  - id: c
    text:
      es: "Las que se realicen en Estados miembros de la Unión Europea, sea cual sea su régimen en el interior."
  - id: d
    text:
      es: "Las que estarían exentas sin derecho a deducción si se hubieran efectuado en el interior del territorio."
  explanation:
    es: "El derecho alcanza a las operaciones realizadas fuera que habrían dado derecho a deducir de haberse hecho dentro. El criterio es el régimen que tendrían en el interior, no el lugar de realización por sí solo."
  citation: "art. 94.Uno LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "operaciones con derecho a deducir"
# anchor: boe-a-1992-28740-art-95
- id: m03-l19-q0119
  prompt:
    es: "Cerámicas Alcalá, S.L. adquiere una furgoneta, vehículo mixto, por 24.000 euros más 5.040 euros de IVA para el transporte de mercancías de su actividad. Según el artículo 95.Tres.2.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué cuota puede deducir inicialmente?"
  options:
  - id: a
    text:
      es: "2.520 euros, porque todo vehículo de uso mixto se presume afecto en el 50 por 100."
  - id: b
    text:
      es: "5.040 euros, solo si acredita un uso exclusivo del vehículo durante los cuatro años siguientes."
  - id: c
    correct: true
    text:
      es: "5.040 euros, porque el vehículo mixto utilizado en el transporte de mercancías se presume afecto en el 100 por 100."
  - id: d
    text:
      es: "Ninguna, porque el vehículo mixto no se afecta directa y exclusivamente a la actividad."
  explanation:
    es: "El vehículo mixto dedicado al transporte de mercancías se presume afecto al 100 por 100: se deducen los 5.040 euros. La regla del 50 por 100 es para turismos, remolques, ciclomotores y motocicletas, y la presunción no exige acreditar un uso exclusivo posterior."
  citation: "art. 95.Tres LIVA"
  difficulty: 2
  tags:
  - "deducciones"
  - "vehículos"
  - "cómputo"
# anchor: boe-a-1992-28740-art-95
- id: m03-l19-q0189
  prompt:
    es: "¿Qué bien se excluye de la afectación directa y exclusiva por destinarse habitualmente a la actividad empresarial y a otras no empresariales por períodos de tiempo alternativos, según el artículo 95.Dos.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "Un local que se destina a la actividad profesional del titular unos meses al año y a un uso particular el resto."
  - id: b
    text:
      es: "Un local que se destina todo el año a la actividad profesional y a servicios socio-culturales del personal de la empresa."
  - id: c
    text:
      es: "Un local que figura en la contabilidad y se destina al alojamiento gratuito del vigilante de la empresa."
  - id: d
    text:
      es: "Un local que se destina todo el año a la actividad profesional, aunque algunos días lo use un empleado."
  explanation:
    es: "El destino alterno, unos períodos a la actividad y otros a usos no empresariales, es el supuesto del 95.Dos.1.º. El vigilante y los servicios socio-culturales son excepciones expresas del 5.º, y el uso puntual por un empleado no es un destino alterno por períodos."
  citation: "art. 95.Dos LIVA"
  difficulty: 3
  tags:
  - "deducciones"
  - "limitaciones"
# anchor: boe-a-1992-28740-art-95
- id: m03-l19-q0190
  prompt:
    es: "De acuerdo con el artículo 95.Dos.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, no se entienden afectos directa y exclusivamente a la actividad empresarial o profesional los bienes o servicios que se utilicen simultáneamente para actividades empresariales o profesionales y para:"
  options:
  - id: a
    text:
      es: "actividades de investigación y desarrollo de la empresa."
  - id: b
    text:
      es: "operaciones de exportación de bienes de la empresa."
  - id: c
    text:
      es: "actividades de formación del personal de la empresa."
  - id: d
    correct: true
    text:
      es: "necesidades privadas del empresario o profesional."
  explanation:
    es: "El uso simultáneo para la actividad y para necesidades privadas excluye la afectación directa y exclusiva. Investigación, exportación y formación del personal no son necesidades privadas."
  citation: "art. 95.Dos LIVA"
  difficulty: 1
  tags:
  - "deducciones"
  - "limitaciones"
# anchor: boe-a-1992-28740-art-95
- id: m03-l19-q0191
  prompt:
    es: "Según el artículo 95.Dos.5.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, no se entienden afectos directa y exclusivamente a la actividad los bienes destinados a ser utilizados en la satisfacción de necesidades personales de los empresarios, de sus familiares o del personal dependiente, con excepción de los destinados:"
  options:
  - id: a
    text:
      es: "a la entrega gratuita de obsequios al personal y al uso particular de los familiares del empresario."
  - id: b
    text:
      es: "al transporte gratuito del personal desde su domicilio y a la formación profesional del personal."
  - id: c
    correct: true
    text:
      es: "al alojamiento gratuito del personal de vigilancia y seguridad y a los servicios económicos y socio-culturales del personal."
  - id: d
    text:
      es: "al alojamiento gratuito del personal directivo y a los servicios de restauración de los clientes."
  explanation:
    es: "Las excepciones son el alojamiento gratuito en los locales de la empresa del personal de vigilancia y seguridad y los servicios económicos y socio-culturales. El transporte desde el domicilio, el alojamiento de directivos, los obsequios y el uso de los familiares no están exceptuados."
  citation: "art. 95.Dos LIVA"
  difficulty: 3
  tags:
