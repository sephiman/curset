- id: m02-l01-q02
  prompt:
    en: In Java 25, which statement about `ArrayDeque` is correct when it is used as a stack or a queue by several
      threads and by one thread?
  options:
  - id: a
    correct: true
    text:
      en: Null elements are prohibited, so `addLast(null)` is rejected
  - id: b
    text:
      en: It is thread-safe, so several threads can share one instance without external synchronization
  - id: c
    text:
      en: Its capacity is fixed at construction, so `addLast` fails once the array is full
  - id: d
    text:
      en: Used as a queue it is likely to be slower than `LinkedList`, because it is backed by an array
  explanation:
    en: '`ArrayDeque` prohibits null elements. The claim that it is thread-safe is wrong, because without external
      synchronization it does not support concurrent access by multiple threads. The claim of a fixed capacity is
      wrong, because array deques have no capacity restrictions and grow as necessary. The claim that it is slower
      than `LinkedList` is wrong, because it is likely to be faster than `LinkedList` when used as a queue.'
  citation: javadoc-arraydeque#class-arraydeque-e
- id: m02-l01-q03
  prompt:
    en: A service keeps prices in a `TreeMap<String, Integer>` and calls `get`, `put` and `remove` on it constantly.
      In Java 25, which statement about this `TreeMap` is correct?
  options:
  - id: a
    text:
      en: It is a hash table whose keys are sorted only when the map is iterated
  - id: b
    correct: true
    text:
      en: '`containsKey`, `get`, `put` and `remove` have guaranteed log(n) time cost'
  - id: c
    text:
      en: '`putFirst` places an entry at the head of the encounter order, ahead of the sorted keys'
  - id: d
    text:
      en: Keys can be ordered only by their natural ordering, never by a separate `Comparator`
  explanation:
    en: '`TreeMap` guarantees log(n) time cost for `containsKey`, `get`, `put` and `remove`. The claim of a hash
      table is wrong, because `TreeMap` is a Red-Black tree based `NavigableMap` implementation. The claim that
      `putFirst` positions an entry is wrong, because `putFirst` and `putLast` throw `UnsupportedOperationException`.
      The claim of natural ordering only is wrong, because a `Comparator` can be provided at map creation time.'
  citation: javadoc-treemap#class-treemap-k-v
- id: m02-l01-q04
  prompt:
    en: A scheduler uses a `PriorityQueue<Integer>` and sometimes loops over it with a `for` loop or calls `contains`.
      In Java 25, which statement about this queue is correct?
  options:
  - id: a
    text:
      en: The iterator returns the elements in ascending order, from the head to the greatest element
  - id: b
    text:
      en: '`contains(Object)` takes constant time, because the head is always the least element'
  - id: c
    text:
      en: A `null` element is accepted and sorts as the least element, so it becomes the head
  - id: d
    correct: true
    text:
      en: '`offer` and `poll` take O(log(n)) time'
  explanation:
    en: '`PriorityQueue` takes O(log(n)) time for `offer` and `poll`. The claim of ascending iteration is wrong,
      because the iterator is not guaranteed to traverse the elements in any particular order. The claim of constant
      time for `contains` is wrong, because `contains(Object)` takes linear time. The claim that null is accepted
      is wrong, because a priority queue does not permit null elements.'
  citation: javadoc-priorityqueue#class-priorityqueue-e
- id: m02-l01-q05
  prompt:
    en: In Java 25, how does iterating over the collection views of a `LinkedHashMap` compare with iterating over
      the views of a `HashMap` created with the same large initial capacity?
  options:
  - id: a
    text:
      en: It requires time proportional to the capacity plus the size, exactly like a `HashMap`
  - id: b
    text:
      en: It is slower by more than a constant factor, because every `get` walks the linked list
  - id: c
    text:
      en: It returns the entries sorted by key, so it needs time proportional to size times log(n)
  - id: d
    correct: true
    text:
      en: It requires time proportional to the size of the map, regardless of its capacity
  explanation:
    en: Iteration over a `LinkedHashMap` requires time proportional to the size of the map, regardless of its capacity.
      The claim that it behaves like a `HashMap` is wrong, because iteration over a `HashMap` is likely to be more
      expensive, requiring time proportional to its capacity. The claim that every `get` walks the list is wrong,
      because like `HashMap` it provides constant-time performance for the basic operations. The claim of sorted
      entries is wrong, because the linked list defines an encounter order that is normally the insertion order.
  citation: javadoc-linkedhashmap#class-linkedhashmap-k-v
- id: m02-l01-q08
  prompt:
    en: A class implements `Comparable<T>`. In Java 25, which requirement does the Javadoc of `compareTo` impose
      on the implementor, as opposed to merely recommending it?
  options:
  - id: a
    text:
      en: '`x.compareTo(y) == 0` must imply `x.equals(y)` for every `x` and `y`'
  - id: b
    text:
      en: '`e.compareTo(null)` must return a negative integer, because `null` sorts first'
  - id: c
    correct: true
    text:
      en: 'The relation must be transitive: `x.compareTo(y) > 0` and `y.compareTo(z) > 0` imply `x.compareTo(z)
        > 0`'
  - id: d
    text:
      en: '`x.compareTo(y)` and `y.compareTo(x)` must return the same sign, so the order is symmetric'
  explanation:
    en: The implementor must ensure that the `compareTo` relation is transitive. The claim that equality is required
      is wrong, because consistency with `equals` is strongly recommended but not strictly required. The claim of
      a negative result for `null` is wrong, because `e.compareTo(null)` should throw a `NullPointerException`.
      The claim of the same sign is wrong, because `signum(x.compareTo(y))` must equal `-signum(y.compareTo(x))`.
  citation: javadoc-comparable#compareTo(java.lang.Object); javadoc-comparable#interface-comparable-t
- id: m02-l01-q09
  prompt:
    en: A `TreeSet<BigDecimal>` without a comparator already holds `new BigDecimal("4.0")`. In Java 25, which statement
      about adding `new BigDecimal("4.00")` is correct?
  options:
  - id: a
    text:
      en: The `add` returns `true`, because `equals` decides membership in a sorted set and `equals` returns `false`
  - id: b
    text:
      en: The `add` throws a `ClassCastException`, because the two representations are not comparable to each other
  - id: c
    correct: true
    text:
      en: The `add` returns `false` because the natural ordering equates the two values although `equals` does not
  - id: d
    text:
      en: The `add` returns `true`, because the natural ordering of `BigDecimal` is consistent with equals
  explanation:
    en: The second `add` returns `false`, because the natural ordering equates 4.0 and 4.00 while `equals` does
      not. The claim that `equals` decides membership is wrong, because a sorted map performs all key comparisons
      using `compareTo` or `compare`. The claim of a `ClassCastException` is wrong, because that exception is thrown
      only when the object's type prevents the comparison, and both are `BigDecimal`. The claim of a consistent
      ordering is wrong, because `BigDecimal` is the documented exception whose natural ordering equates 4.0 and
      4.00.
  citation: javadoc-comparable#interface-comparable-t; javadoc-treemap#class-treemap-k-v; javadoc-comparable#compareTo(java.lang.Object)
- id: m02-l01-q11
  prompt:
    en: The program increments a 64-bit counter 1,000 times from zero, counting every bit flip, and prints the total,
      the most flips in one increment and the value of 2n minus the 1-bits of n. What does it print?
  options:
  - id: a
    correct: true
    text:
      en: 'total flips 1994

        most flips in one increment 10

        2n minus ones 1994'
  - id: b
    text:
      en: 'total flips 2000

        most flips in one increment 10

        2n minus ones 2000'
  - id: c
    text:
      en: 'total flips 1994

        most flips in one increment 1000

        2n minus ones 1994'
  - id: d
    text:
      en: 'total flips 1000

        most flips in one increment 2

        2n minus ones 1994'
  explanation:
    en: The total is 1994 because the number of flips is exactly 2n minus the number of 1 bits of n, and 1000 has
      six. The most flips in one increment is 10, reached when 511 becomes 512. The lines total flips 2000 and 2n
      minus ones 2000 are wrong because the exact count subtracts the 1 bits of n. The line most flips in one increment
      1000 is wrong because that is the number of increments, not the bits one increment changes. The line total
      flips 1000 is wrong because it counts one flip per increment and forgets the carry resets.
  citation: erickson-amortized-analysis#p2
