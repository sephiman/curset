  prompt:
    es: "Según el artículo 95 bis.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede figurar en el listado de deudores quien ha sido declarado responsable solidario de unas deudas de 700.000 euros que no ha pagado en el plazo concedido?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque los declarados responsables solidarios son deudores incluibles si el importe pendiente supera los 600.000 euros."
  - id: b
    text:
      es: "No, porque el listado incluye solo a los deudores principales y no a los responsables."
  - id: c
    text:
      es: "No, porque los responsables solidarios solo figuran si han sido sancionados además."
  - id: d
    text:
      es: "Sí, pero únicamente si el deudor principal también figura en el listado."
  explanation:
