# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # provenance.py blames C1 sentences back past C2 commits
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # uv downloads the pinned Python (3.14) automatically on first sync.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # Testcontainers spins a real Postgres per xdist worker on the runner's Docker.
      - run: uv run pytest -n auto

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  # Builds both images on every run and pushes them under the commit's tag, which the e2e job runs as a
  # service; a PR from a fork cannot push, so it builds only. `latest` moves only once e2e is green too.
  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Backend context is the repo root so the image can bake in ./content.
          - component: backend
            context: .
            dockerfile: backend/Dockerfile
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/curset-${{ matrix.component }}
          tags: |
            type=sha,format=long
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Feeds /api/version (backend only; the frontend Dockerfile declares no such ARGs).
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # Delta K7: the Playwright suite against this commit's backend image and a throwaway Postgres, both
  # job services. `frontend/e2e/ci-local.sh` runs the same two containers and the same command locally;
  # keep the service settings below and that script in step.
  e2e:
    needs: [images]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: curset
          POSTGRES_PASSWORD: curset-e2e
          POSTGRES_DB: curset
        options: >-
          --health-cmd "pg_isready -U curset -d curset"
          --health-interval 2s --health-timeout 5s --health-retries 30
      backend:
        image: ghcr.io/${{ github.repository_owner }}/curset-backend:sha-${{ github.sha }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 8000:8000
        env:
          DB_HOST: postgres
          DB_USERNAME: curset
          DB_PASSWORD: curset-e2e
          DB_NAME: curset
          AUTH_SECRET: e2e-only-not-a-secret
          COOKIE_SECURE: "false"
          RUN_MIGRATIONS_ON_STARTUP: "true"
          SYNC_CONTENT_ON_STARTUP: "true"
          # The phone sitting test pins its draw with a seed, which only a dev-mode server accepts.
          DEV_MODE: "true"
        # Both services start together and the backend does not retry its first database connection,
        # so it restarts until Postgres is up; the faster healthcheck lets the job start without waiting 30 s.
        options: >-
          --restart on-failure:20
          --health-cmd "curl -fsS http://localhost:8000/api/health"
          --health-interval 3s --health-timeout 5s --health-start-period 5s --health-retries 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Playwright starts `npm run dev` itself (playwright.config.ts `webServer`); Vite proxies /api to :8000.
      - run: npm run test:e2e

  latest:
    needs: [images, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for component in backend frontend; do
            image="ghcr.io/${{ github.repository_owner }}/curset-${component}"
            docker buildx imagetools create --tag "${image}:latest" "${image}:sha-${{ github.sha }}"
          done
