  prompt:
    es: "¿Cuál de los siguientes módulos de PowerShell figura como módulo de terceros en la página de Microsoft Learn que explica qué es PowerShell?"
  options:
  - id: a
    text:
      es: "Azure"
  - id: b
    text:
      es: "Exchange"
  - id: c
    correct: true
    text:
      es: "VMware"
  - id: d
    text:
      es: "SQL"
