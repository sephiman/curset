- id: g-insecure-direct-object-reference
  term:
    en: Insecure Direct Object Reference
  definition:
    en: Insecure Direct Object Reference (IDOR) is a vulnerability that arises when attackers can access or modify objects by manipulating identifiers used in a web application's URLs or parameters.
  origin: m10-l06
  citation: owasp-cs-idor#introduction
- id: g-mass-assignment
  term:
    en: Mass Assignment
  definition:
    en: Software frameworks sometimes allow developers to automatically bind HTTP request parameters into program code variables or objects to make using that framework easier on developers. Attackers can sometimes use this methodology to create new parameters that the developer never intended.
  origin: m10-l06
  citation: owasp-cs-mass-assignment#definition
- id: g-server-side-request-forgery
  term:
    en: Server-Side Request Forgery
  definition:
    en: Server-Side Request Forgery (SSRF) flaws can occur when an API is fetching a remote resource without validating the user-supplied URI.
  origin: m10-l06
  citation: owasp-api-top10-2023#owasp-top-10-api-security-risks-2023
- id: g-stride
  term:
    en: STRIDE
  definition:
    en: STRIDE is a mature and popular threat modeling technique and mnemonic originally developed by Microsoft employees.
  origin: m10-l06
  citation: owasp-cs-threat-modeling#threat-identification
- id: g-provenance
  term:
    en: provenance
  definition:
    en: Provenance describes what entity built the artifact, what process they used, and what the inputs were.
  origin: m10-l06
  citation: slsa-tracks#build-track
- id: g-reproducible-build
  term:
    en: reproducible build
  definition:
    en: A build is reproducible if given the same source code, build environment and build instructions, any party can recreate bit-by-bit identical copies of all specified artifacts.
  origin: m10-l06
  citation: reproducible-builds-definition#when-is-a-build-reproducible
