# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q048
  prompt:
    es: "Señale la respuesta correcta sobre las metas del Objetivo 16 de la Agenda 2030 para el Desarrollo Sostenible, aprobada por la Asamblea General de las Naciones Unidas:"
  options:
  - id: a
    text:
      es: "La meta 16.6 consiste en garantizar el acceso público a la información y proteger las libertades fundamentales."
  - id: b
    text:
      es: "La meta 16.6 consiste en garantizar la adopción en todos los niveles de decisiones inclusivas, participativas y representativas."
  - id: c
    correct: true
    text:
      es: "La meta 16.7 consiste en garantizar la adopción en todos los niveles de decisiones inclusivas, participativas y representativas."
  - id: d
    text:
      es: "La meta 16.10 consiste en crear a todos los niveles instituciones eficaces y transparentes que rindan cuentas."
  explanation:
    es: "La meta 16.7 es «garantizar la adopción en todos los niveles de decisiones inclusivas, participativas y representativas que respondan a las necesidades». La 16.6 pide instituciones eficaces y transparentes que rindan cuentas, y la 16.10, el acceso público a la información y la protección de las libertades fundamentales. Las otras tres opciones cruzan esos números y contenidos."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q049
  prompt:
    es: "La meta 16.10 de la Agenda 2030 para el Desarrollo Sostenible consiste en garantizar el acceso público a la información y en:"
  options:
  - id: a
    text:
      es: "Reducir considerablemente la corrupción y el soborno en todas sus formas."
  - id: b
    text:
      es: "Promover el estado de derecho en los planos nacional e internacional."
  - id: c
    text:
      es: "Crear a todos los niveles instituciones eficaces y transparentes que rindan cuentas."
  - id: d
    correct: true
    text:
      es: "Proteger las libertades fundamentales, de conformidad con las leyes nacionales y los acuerdos internacionales."
  explanation:
    es: "La meta 16.10 termina «proteger las libertades fundamentales, de conformidad con las leyes nacionales y los acuerdos internacionales». Reducir la corrupción y el soborno es la meta 16.5. Promover el estado de derecho es la 16.3. Crear instituciones eficaces y transparentes es la 16.6."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-1
- id: m01-l06-q054
  prompt:
    es: "De acuerdo con el artículo 1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, la Ley tiene por objeto regular y garantizar:"
  options:
  - id: a
    text:
      es: "El derecho de participación en la elaboración de las normas."
  - id: b
    correct: true
    text:
      es: "El derecho de acceso a la información relativa a la actividad pública."
  - id: c
    text:
      es: "El derecho a la protección de los datos de carácter personal."
  - id: d
    text:
      es: "El derecho de petición ante las Administraciones Públicas."
  explanation:
    es: "El artículo 1 asigna a la Ley regular y garantizar el derecho de acceso a la información relativa a la actividad pública. La participación en la elaboración de normas la regula la Ley 39/2015, la protección de datos tiene su propia normativa y el derecho de petición también."
  citation: "art. 1 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-1
- id: m01-l06-q055
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge lo que, según el artículo 1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, constituye el objeto de la Ley?"
  options:
  - id: a
    text:
      es: "Reforzar la participación, garantizar el derecho de acceso y establecer obligaciones de buen gobierno."
  - id: b
    text:
      es: "Ampliar y reforzar la transparencia, regular la protección de datos y establecer obligaciones de buen gobierno."
  - id: c
    correct: true
    text:
      es: "Ampliar y reforzar la transparencia, garantizar el derecho de acceso y establecer obligaciones de buen gobierno."
  - id: d
    text:
      es: "Ampliar y reforzar la transparencia, garantizar el derecho de acceso y fijar el régimen de los altos cargos."
  explanation:
    es: "El artículo 1 enumera tres partes: ampliar y reforzar la transparencia de la actividad pública, regular y garantizar el derecho de acceso a la información y establecer las obligaciones de buen gobierno. Cada opción incorrecta altera una de ellas: la que habla de participación sustituye la transparencia, la que habla de protección de datos sustituye el derecho de acceso y la que habla del régimen de los altos cargos sustituye las obligaciones de buen gobierno."
  citation: "art. 1 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2015-10566-art-3
- id: m01-l06-q056
  prompt:
    es: "Conforme al artículo 3.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿cuál de los siguientes NO es un principio que las Administraciones Públicas deben respetar en su actuación y relaciones?"
  options:
  - id: a
    text:
      es: "Participación, objetividad y transparencia de la actuación administrativa."
  - id: b
    text:
      es: "Responsabilidad por la gestión pública."
  - id: c
    text:
      es: "Simplicidad, claridad y proximidad a los ciudadanos."
  - id: d
    correct: true
    text:
      es: "Gratuidad de los servicios administrativos."
  explanation:
    es: "El artículo 3.1 enumera, entre otros, la participación, objetividad y transparencia de la actuación administrativa, la responsabilidad por la gestión pública y la simplicidad, claridad y proximidad a los ciudadanos. La gratuidad de los servicios administrativos no figura en la lista."
  citation: "art. 3.1.c LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q057
  prompt:
    es: "De acuerdo con el artículo 133.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la consulta pública previa recaba la opinión de:"
  options:
  - id: a
    correct: true
    text:
      es: "Los sujetos y las organizaciones más representativas potencialmente afectados por la futura norma."
  - id: b
    text:
      es: "Los órganos consultivos de la Administración competente y los colegios profesionales."
  - id: c
    text:
      es: "Cualquier ciudadano que resida en el ámbito territorial de la norma."
  - id: d
    text:
      es: "Los grupos parlamentarios y las asociaciones de consumidores."
  explanation:
    es: "La consulta pública previa recaba la opinión de los sujetos y de las organizaciones más representativas potencialmente afectados por la futura norma. No se dirige a los órganos consultivos ni a los colegios profesionales como tales, ni a cualquier ciudadano por el hecho de residir en el ámbito de la norma, ni a los grupos parlamentarios y las asociaciones de consumidores: el artículo exige que estén potencialmente afectados."
  citation: "art. 133.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q058
  prompt:
    es: "Según el artículo 133.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿sobre cuál de las siguientes cuestiones NO se recaba la opinión en la consulta pública previa?"
  options:
  - id: a
    text:
      es: "Los objetivos de la norma."
  - id: b
    correct: true
    text:
      es: "El coste presupuestario de aplicar la norma."
  - id: c
    text:
      es: "Los problemas que se pretenden solucionar con la iniciativa."
  - id: d
    text:
      es: "Las posibles soluciones alternativas regulatorias y no regulatorias."
  explanation:
    es: "El artículo 133.1 limita la consulta a cuatro cuestiones: los problemas que se pretenden solucionar, la necesidad y oportunidad de aprobar la norma, sus objetivos y las posibles soluciones alternativas, regulatorias y no regulatorias. El coste presupuestario de aplicarla no está entre ellas. Los objetivos, los problemas y las soluciones alternativas sí se consultan."
  citation: "art. 133.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q059
  prompt:
    es: "Conforme al artículo 133.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, entre las cuestiones sobre las que versa la consulta pública previa están los objetivos de la norma y:"
  options:
  - id: a
    correct: true
    text:
      es: "Las posibles soluciones alternativas regulatorias y no regulatorias."
  - id: b
    text:
      es: "Los plazos previstos para su entrada en vigor."
  - id: c
    text:
      es: "Los recursos humanos necesarios para su aplicación."
  - id: d
    text:
      es: "El órgano que haya de aprobarla definitivamente."
  explanation:
    es: "Entre las cuestiones de la lista del artículo 133.1 figuran las posibles soluciones alternativas, regulatorias y no regulatorias. La entrada en vigor, los recursos humanos y el órgano de aprobación definitiva no forman parte de lo que se consulta."
  citation: "art. 133.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q060
  prompt:
    es: "De acuerdo con el artículo 133.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el centro directivo competente publica el texto de la iniciativa en el portal web cuando la norma:"
  options:
  - id: a
    text:
      es: "Haya sido aprobada por el Consejo de Ministros."
  - id: b
    text:
      es: "Proceda de una iniciativa legislativa popular."
  - id: c
    text:
      es: "Haya sido objeto de consulta pública previa."
  - id: d
    correct: true
    text:
      es: "Afecte a los derechos e intereses legítimos de las personas."
  explanation:
    es: "La publicación del texto para dar audiencia depende de que la norma afecte a los derechos e intereses legítimos de las personas. Que el Consejo de Ministros la haya aprobado o que proceda de una iniciativa popular no cambia el trámite. Tampoco la consulta previa: el artículo dice que la audiencia se hace sin perjuicio de ella."
  citation: "art. 133.2 LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q061
  prompt:
    es: "Según el artículo 133.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los documentos necesarios para emitir opinión deben ponerse a disposición en los trámites de:"
  options:
  - id: a
    text:
      es: "Consulta pública previa únicamente."
  - id: b
    text:
      es: "Audiencia a los ciudadanos afectados únicamente."
  - id: c
    correct: true
    text:
      es: "Consulta, audiencia e información públicas."
  - id: d
    text:
      es: "Información pública y dictamen del órgano consultivo."
  explanation:
    es: "El apartado 3 se refiere a la consulta, la audiencia y la información públicas reguladas en el artículo. Limitarlo a la consulta previa o solo a la audiencia deja fuera trámites que el apartado incluye. El dictamen de un órgano consultivo no es uno de los trámites del artículo 133."
  citation: "art. 133.3 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q064
  prompt:
    es: "Señale la respuesta correcta sobre la omisión de la consulta pública previa, según el artículo 133.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Puede omitirse cuando la propuesta normativa no imponga obligaciones relevantes a los destinatarios."
  - id: b
    text:
      es: "Puede omitirse cuando la propuesta normativa afecte a los derechos e intereses legítimos de las personas."
  - id: c
    text:
      es: "Puede omitirse siempre que la propuesta normativa tenga un impacto significativo en la actividad económica."
  - id: d
    text:
      es: "Puede omitirse cuando la propuesta normativa regule por completo una materia."
  explanation:
    es: "El artículo permite omitir la consulta cuando la propuesta no tiene impacto significativo en la actividad económica, no impone obligaciones relevantes a los destinatarios o regula aspectos parciales de una materia. Las otras opciones invierten esas circunstancias: afectar a derechos e intereses legítimos es lo que activa la audiencia, un impacto significativo y regular por completo una materia son lo contrario de lo que el artículo exige."
  citation: "art. 133.4 LPAC"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-133
- id: m01-l06-q065
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge los tres trámites de participación en la elaboración de leyes y reglamentos que regula el artículo 133 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Consulta previa, dictamen e información reservada."
  - id: b
    correct: true
    text:
      es: "Consulta pública, audiencia e información pública."
  - id: c
    text:
      es: "Audiencia, alegaciones e información pública."
  - id: d
    text:
      es: "Consulta pública, informe de legalidad y audiencia."
  explanation:
    es: "El artículo 133 combina la consulta pública previa, la audiencia a los afectados y la información pública. El dictamen y la información reservada, las alegaciones y el informe de legalidad pertenecen a otros trámites o no existen en este artículo."
  citation: "art. 133.3 LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
  - "estructura"
# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q097
  prompt:
    es: "Según la Resolución 70/1 de la Asamblea General de las Naciones Unidas, el Objetivo 16 consiste, entre otros fines, en construir a todos los niveles instituciones:"
  options:
  - id: a
    correct: true
    text:
      es: "Eficaces e inclusivas que rindan cuentas."
  - id: b
    text:
      es: "Eficaces y transparentes que garanticen la participación."
  - id: c
    text:
      es: "Sólidas y transparentes que protejan los derechos humanos."
  - id: d
    text:
      es: "Independientes e inclusivas que garanticen el acceso a la justicia."
  explanation:
    es: "El título del Objetivo 16 termina con «construir a todos los niveles instituciones eficaces e inclusivas que rindan cuentas». Las otras opciones cambian los adjetivos o el fin: «eficaces y transparentes» es la redacción de la meta 16.6, no del título, y «sólidas» e «independientes» no aparecen en él."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q098
  prompt:
    es: "Según la Resolución 70/1 de la Asamblea General de las Naciones Unidas, la meta 16.6 de la Agenda 2030 para el Desarrollo Sostenible consiste en crear a todos los niveles instituciones:"
  options:
  - id: a
    text:
      es: "Sólidas y participativas que respeten los derechos."
  - id: b
    text:
      es: "Independientes y representativas que garanticen la justicia."
  - id: c
    text:
      es: "Fuertes e inclusivas que protejan a los ciudadanos."
  - id: d
    correct: true
    text:
      es: "Eficaces y transparentes que rindan cuentas."
  explanation:
    es: "La meta 16.6 dice «crear a todos los niveles instituciones eficaces y transparentes que rindan cuentas». Las otras opciones sustituyen los adjetivos y el fin por otros que no figuran en la meta."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 3
  tags:
  - "concepto"
