# anchor: fuente-ms-win-sistemas-archivos-html
- id: m06-l01-q202
  prompt:
    es: "Según la comparación de Microsoft de los sistemas de archivos de Windows, el tamaño de archivo máximo que admite FAT32 es de:"
  options:
  - id: a
    text:
      es: "2 GiB."
  - id: b
    correct: true
    text:
      es: "4 GiB."
  - id: c
    text:
      es: "16 TB."
  - id: d
    text:
      es: "2^64–1 bytes."
  explanation:
    es: "En la tabla de límites, el tamaño de archivo máximo de FAT32 es de 4 GiB, mientras que NTFS, exFAT y UDF admiten 2^64–1 bytes. La tabla de límites da 4 GiB para FAT32, no 2 GiB. Los 16 TB son un límite de volumen de NTFS con clústeres de 4 KB, no el tamaño de archivo de FAT32. Los 2^64–1 bytes son el máximo de NTFS, exFAT y UDF, no el de FAT32."
  citation: "fuente: `ms-win-sistemas-archivos.html`; «Tamaño de archivo máximo — 2^64–1 bytes — 2^64–1 bytes — 2^64–1 bytes — 4 GiB»"
