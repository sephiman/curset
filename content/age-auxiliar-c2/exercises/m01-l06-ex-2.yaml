    text:
      es: "El impulso de la administración electrónica y la inteligencia artificial."
  - id: b
    text:
      es: "La cooperación con la Alianza para el Gobierno Abierto y la OCDE."
  - id: c
    text:
      es: "La simplificación de procedimientos y la reducción de cargas."
  - id: d
    correct: true
    text:
      es: "La promoción de la inclusión social, la igualdad y la accesibilidad universal."
  explanation:
    es: "El segundo eje transversal es la promoción de la inclusión social, la igualdad y la accesibilidad universal. La administración electrónica y la inteligencia artificial corresponden al compromiso 5, no a un eje transversal. La cooperación con la Alianza y la OCDE y la simplificación de procedimientos no son ejes del Plan."
