# anchor: boe-a-2015-10565-art-30
- id: m03-l03-q101
  prompt:
    es: "De acuerdo con el artículo 30.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en defecto de otro cómputo legal o europeo, los plazos señalados por horas:"
  options:
  - id: a
    correct: true
    text:
      es: "Se entienden hábiles, y son hábiles todas las horas del día que formen parte de un día hábil."
  - id: b
    text:
      es: "Se entienden naturales, y se cuentan todas las horas del día, sea este hábil o inhábil."
  - id: c
    text:
      es: "Se entienden hábiles, y solo lo son las horas en que abren las oficinas de registro."
  - id: d
    text:
      es: "Se entienden hábiles, y solo lo son las horas de la jornada ordinaria de un día hábil."
  explanation:
    es: "El artículo 30.1 dice que las horas «son hábiles» y que «son hábiles todas las horas del día que formen parte de un día hábil». No se cuentan como naturales: las horas de un sábado, un domingo o un festivo no corren. Tampoco se limitan a las horas de apertura de las oficinas ni a la jornada ordinaria: cuenta el día hábil entero, de las 0:00 a las 24:00."
  citation: "art. 30.1 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m03-l03-q102
  prompt:
    es: "Según el artículo 30.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué duración máxima pueden tener los plazos expresados por horas?"
  options:
  - id: a
    text:
      es: "Cuarenta y ocho horas; si fuera mayor, el plazo se expresará en días."
  - id: b
    text:
      es: "Setenta y dos horas; si fuera mayor, el plazo se expresará en días."
  - id: c
    text:
      es: "Doce horas; si fuera mayor, el plazo se expresará en días hábiles."
  - id: d
    correct: true
    text:
      es: "Veinticuatro horas; si fuera mayor, el plazo se expresará en días."
  explanation:
    es: "Los plazos por horas «no podrán tener una duración superior a veinticuatro horas, en cuyo caso se expresarán en días». Un plazo de cuarenta y ocho o de setenta y dos horas no cabe: se fija en días. El límite tampoco es de doce horas."
  citation: "art. 30.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-30
- id: m03-l03-q104
  prompt:
    es: "De acuerdo con el artículo 30.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando los plazos se señalen por días y no se exprese otro cómputo:"
  options:
  - id: a
    text:
      es: "Se entiende que son hábiles, y se excluyen del cómputo solo los domingos y los declarados festivos."
  - id: b
    text:
      es: "Se entiende que son naturales, salvo que la notificación indique expresamente que se trata de días hábiles."
  - id: c
    text:
      es: "Se entiende que son hábiles, y se excluyen del cómputo solo los días declarados festivos de carácter nacional."
  - id: d
    correct: true
    text:
      es: "Se entiende que son hábiles, y se excluyen del cómputo los sábados, los domingos y los declarados festivos."
  explanation:
    es: "El artículo 30.2 dice que los plazos por días «son hábiles, excluyéndose del cómputo los sábados, los domingos y los declarados festivos». Los sábados también se excluyen, y los festivos que se excluyen no son solo los nacionales. La regla no es la de días naturales: los naturales necesitan una ley o una norma europea que lo diga."
  citation: "art. 30.2 LPAC"
  difficulty: 1
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m03-l03-q105
  prompt:
    es: "De acuerdo con el artículo 30.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando una ley o el Derecho de la Unión Europea señalen un plazo por días naturales:"
  options:
  - id: a
    text:
      es: "Esta circunstancia se hará constar en el calendario anual de días inhábiles."
  - id: b
    text:
      es: "Esta circunstancia se hará constar en el acuerdo de iniciación, no en las notificaciones."
  - id: c
    correct: true
    text:
      es: "Esta circunstancia se hará constar en las correspondientes notificaciones."
  - id: d
    text:
      es: "Esta circunstancia solo se hará constar si el plazo es superior a quince días."
  explanation:
    es: "El artículo 30.2 dice que, cuando los plazos se señalen por días naturales, «se hará constar esta circunstancia en las correspondientes notificaciones». El lugar es la notificación, no el calendario de días inhábiles ni solo el acuerdo de iniciación. La ley no limita el deber a los plazos de más de quince días."
  citation: "art. 30.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "requisito"
# anchor: boe-a-2015-10565-art-30
- id: m03-l03-q106
  prompt:
    es: "Una ley fija un plazo de diez días naturales y así consta en la notificación, practicada el jueves 5 de febrero de 2026. Sin festivos en el periodo, ¿cuál es el último día del plazo?"
  options:
  - id: a
    text:
      es: "El viernes 13 de febrero de 2026."
  - id: b
    text:
      es: "El domingo 15 de febrero de 2026."
  - id: c
    correct: true
    text:
      es: "El lunes 16 de febrero de 2026."
  - id: d
    text:
      es: "El jueves 19 de febrero de 2026."
  explanation:
    es: "Los días naturales se cuentan todos, sábados y domingos incluidos, desde el día siguiente a la notificación (art. 30.3): el primero es el viernes 6 de febrero y el décimo, el domingo 15. El último día es inhábil, así que el plazo se prorroga al primer día hábil siguiente (art. 30.5): el lunes 16 de febrero de 2026. El domingo 15 olvida la prórroga. El viernes 13 lleva el vencimiento al día hábil anterior, que la ley no prevé. El jueves 19 sale de contar diez días hábiles, y el plazo era de naturales."
  citation: "art. 30.5 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m03-l03-q107
  prompt:
    es: "Se notifica un requerimiento de subsanación el lunes 16 de marzo de 2026. El jueves 19 de marzo es festivo en la sede del órgano y en el municipio del interesado, y no hay otros festivos. ¿Cuál es el último día para subsanar?"
  options:
  - id: a
    text:
      es: "El jueves 26 de marzo de 2026."
  - id: b
    text:
      es: "El lunes 30 de marzo de 2026."
  - id: c
    correct: true
    text:
      es: "El martes 31 de marzo de 2026."
  - id: d
    text:
      es: "El miércoles 1 de abril de 2026."
  explanation:
    es: "El plazo de subsanación es de diez días (art. 68.1), hábiles: se excluyen sábados, domingos y festivos (art. 30.2). Se cuenta desde el martes 17 de marzo (art. 30.3). El jueves 19 es festivo y no cuenta. El décimo día hábil es el martes 31 de marzo de 2026. El lunes 30 olvida excluir el festivo. El jueves 26 sale de contar diez días naturales. El miércoles 1 de abril añade un día de más."
  citation: "art. 30.2 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m03-l03-q108
  prompt:
    es: "En el procedimiento administrativo común, cuando un acto fija un plazo expresado en días, ese plazo se cuenta:"
  options:
  - id: a
    text:
      es: "A partir del mismo día en que tenga lugar la notificación o publicación del acto."
  - id: b
    text:
      es: "A partir del día siguiente a aquel en que se dicte el acto, aunque se notifique después."
  - id: c
    text:
      es: "A partir del tercer día hábil siguiente a la notificación o publicación del acto."
  - id: d
    correct: true
    text:
      es: "A partir del día siguiente a aquel en que tenga lugar la notificación o publicación del acto."
  explanation:
    es: "El artículo 30.3 de la Ley 39/2015 dice que los plazos en días «se contarán a partir del día siguiente a aquel en que tenga lugar la notificación o publicación del acto». El día de la notificación no cuenta. La fecha en que se dicta el acto no abre el plazo si se notifica después, y no hay espera de tres días hábiles."
  citation: "art. 30.3 LPAC"
  difficulty: 1
  tags:
  - "cómputo"
# anchor: boe-a-2015-10565-art-30
- id: m03-l03-q109
  prompt:
    es: "De acuerdo con el artículo 30.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si un plazo en meses vence en un mes sin día equivalente al de inicio del cómputo:"
  options:
  - id: a
    correct: true
    text:
      es: "Se entenderá que el plazo expira el último día del mes."
  - id: b
    text:
      es: "Se entenderá que el plazo expira el primer día del mes siguiente."
  - id: c
    text:
      es: "Se entenderá que el plazo expira el primer día hábil del mes siguiente."
  - id: d
    text:
      es: "Se contará el plazo por días naturales, a razón de treinta días por mes."
  explanation:
    es: "El artículo 30.4 dice que, si en el mes de vencimiento no hay día equivalente, «se entenderá que el plazo expira el último día del mes». El plazo no pasa al mes siguiente, ni a su primer día ni a su primer día hábil. Los meses se cuentan de fecha a fecha, no como treinta días naturales."
  citation: "art. 30.4 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m03-l03-q110
  prompt:
    es: "Un acto notificado el viernes 30 de enero de 2026 concede al interesado un plazo de un mes. Sin festivos en el periodo, ¿cuál es el último día del plazo?"
  options:
  - id: a
    text:
      es: "El viernes 27 de febrero de 2026."
  - id: b
    text:
      es: "El sábado 28 de febrero de 2026."
  - id: c
    correct: true
    text:
      es: "El lunes 2 de marzo de 2026."
  - id: d
    text:
      es: "El lunes 30 de marzo de 2026."
  explanation:
    es: "El plazo de un mes empieza el día siguiente a la notificación y concluye el mismo día del mes de vencimiento (art. 30.4). Febrero de 2026 no tiene día 30, así que el plazo expira el último día del mes, el sábado 28 de febrero. Ese día es inhábil y el plazo se prorroga al primer día hábil siguiente (art. 30.5): el lunes 2 de marzo de 2026. El sábado 28 olvida la prórroga. El viernes 27 adelanta el vencimiento al hábil anterior, que la ley no prevé. El lunes 30 de marzo cuenta dos meses."
  citation: "art. 30.4 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m03-l03-q112
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué ocurre cuando el último día de un plazo es inhábil?"
  options:
  - id: a
    text:
      es: "Se entiende vencido el último día hábil anterior."
  - id: b
    text:
      es: "Se entiende prorrogado al segundo día hábil siguiente."
  - id: c
    text:
      es: "Se entiende ampliado en la mitad del plazo inicial."
  - id: d
    correct: true
    text:
      es: "Se entiende prorrogado al primer día hábil siguiente."
  explanation:
    es: "El artículo 30.5 dice que, cuando el último día del plazo sea inhábil, «se entenderá prorrogado al primer día hábil siguiente». El plazo no se adelanta al hábil anterior ni salta al segundo hábil. La ampliación en la mitad del plazo es otra figura, la del artículo 32.1, que la Administración acuerda y que no opera sola."
  citation: "art. 30.5 LPAC"
  difficulty: 1
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m03-l03-q113
  prompt:
    es: "Según el artículo 30.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cómo se considera un día hábil donde reside el interesado e inhábil en la sede del órgano?"
  options:
  - id: a
    correct: true
    text:
      es: "Inhábil en todo caso, tanto para el interesado como para la Administración."
  - id: b
    text:
      es: "Hábil en todo caso, porque prevalece el calendario del interesado."
  - id: c
    text:
      es: "Hábil para el interesado e inhábil para la Administración."
  - id: d
    text:
      es: "Hábil o inhábil según lo que decida el órgano en cada procedimiento."
  explanation:
    es: "El artículo 30.6 dice que un día hábil en el municipio o Comunidad Autónoma del interesado e inhábil en la sede del órgano, o a la inversa, «se considerará inhábil en todo caso». No prevalece el calendario del interesado, no hay un régimen distinto para cada parte y el órgano no decide en cada caso."
  citation: "art. 30.6 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
# anchor: boe-a-2015-10565-art-30
- id: m03-l03-q114
  prompt:
    es: "De acuerdo con el artículo 30.7 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el calendario de días inhábiles a efectos de cómputo de plazos:"
  options:
  - id: a
    text:
      es: "Lo fija la Administración General del Estado para todas las Administraciones, y se publica antes del comienzo de cada año."
  - id: b
    text:
      es: "Lo fijan la Administración General del Estado y las Comunidades Autónomas, y se publica en el primer mes de cada año."
  - id: c
    text:
      es: "Lo fija cada Entidad Local para su término municipal, y se publica antes del comienzo de cada año."
  - id: d
    correct: true
    text:
      es: "Lo fijan la Administración General del Estado y las Comunidades Autónomas, y se publica antes del comienzo de cada año."
  explanation:
    es: "El artículo 30.7 dice que la Administración General del Estado y las de las Comunidades Autónomas «fijarán, en su respectivo ámbito, el calendario de días inhábiles», que «deberá publicarse antes del comienzo de cada año». El Estado no fija el de todas las Administraciones. No se publica en enero, sino antes. Las Entidades Locales no aprueban el suyo: sus días inhábiles van en el calendario de su Comunidad Autónoma."
  citation: "art. 30.7 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "cómputo"
# anchor: boe-a-2015-10565-art-30
- id: m03-l03-q115
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la declaración de un día como hábil o inhábil a efectos de plazos es correcta, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "No determina por sí sola el funcionamiento de los centros de trabajo de las Administraciones Públicas."
  - id: b
    text:
      es: "Determina por sí sola la apertura o el cierre de los centros de trabajo de las Administraciones Públicas."
  - id: c
    text:
      es: "Obliga a cerrar las oficinas de asistencia en materia de registros en los días declarados inhábiles."
  - id: d
    text:
      es: "Fija el régimen de jornada y horarios del personal de las Administraciones Públicas en esos días."
  explanation:
    es: "El artículo 30.8 dice que la declaración de un día como hábil o inhábil «no determina por sí sola el funcionamiento de los centros de trabajo», ni la organización del tiempo de trabajo ni el régimen de jornada y horarios. No abre ni cierra oficinas por sí misma, tampoco las de asistencia en materia de registros, y no fija la jornada del personal."
  citation: "art. 30.8 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-31
- id: m03-l03-q116
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el registro electrónico de cada Administración u Organismo es correcta, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Permite la presentación de documentos solo en días hábiles, durante las veinticuatro horas."
  - id: b
    text:
      es: "Se rige, a efectos de plazos, por la fecha y hora del dispositivo desde el que se presenta."
  - id: c
    text:
      es: "Permite la presentación de documentos todos los días del año, en horario de oficina."
  - id: d
    correct: true
    text:
      es: "Permite la presentación de documentos todos los días del año durante las veinticuatro horas."
  explanation:
    es: "El artículo 31.2 dice que el registro electrónico «permitirá la presentación de documentos todos los días del año durante las veinticuatro horas». No se limita a los días hábiles ni al horario de las oficinas. Para el cómputo de plazos rige «la fecha y hora oficial de la sede electrónica de acceso», no la del equipo del interesado."
  citation: "art. 31.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "requisito"
# anchor: boe-a-2015-10565-art-31
- id: m03-l03-q117
  prompt:
    es: "De acuerdo con el artículo 31.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la presentación por el interesado en un día inhábil, a efectos de un plazo en días hábiles:"
  options:
  - id: a
    correct: true
    text:
      es: "Se entenderá realizada en la primera hora del primer día hábil siguiente, salvo que una norma permita la recepción en día inhábil."
  - id: b
    text:
      es: "Se entenderá realizada en la última hora del último día hábil anterior, salvo que una norma permita la recepción en día inhábil."
  - id: c
    text:
      es: "Se entenderá realizada en ese mismo día inhábil, a la hora que conste, salvo que una norma disponga otra cosa."
  - id: d
    text:
      es: "No será admitida por el registro electrónico hasta el día hábil siguiente, salvo que una norma permita la recepción en día inhábil."
  explanation:
    es: "El artículo 31.2.b) dice que la presentación en un día inhábil «se entenderá realizada en la primera hora del primer día hábil siguiente salvo que una norma permita expresamente la recepción en día inhábil». No se retrotrae al último hábil anterior ni vale como hecha ese mismo día. El registro sí la admite: funciona todos los días del año durante las veinticuatro horas."
  citation: "art. 31.2.b) LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "efecto"
# anchor: boe-a-2015-10565-art-31
- id: m03-l03-q118
  prompt:
    es: "Un plazo de diez días hábiles para presentar alegaciones vence el viernes 20 de febrero de 2026. El interesado las presenta en el registro electrónico el sábado 21 a las 10:00. Si ninguna norma permite la recepción en día inhábil, ¿cuándo se entienden presentadas?"
  options:
  - id: a
    text:
      es: "El sábado 21 a las 10:00, dentro de plazo, porque el registro admite documentos ese día."
  - id: b
    text:
      es: "En la última hora del viernes 20 de febrero, dentro de plazo."
  - id: c
    text:
      es: "En la primera hora del lunes 23 de febrero, dentro de plazo por ser el siguiente día hábil."
  - id: d
    correct: true
    text:
      es: "En la primera hora del lunes 23 de febrero, fuera de plazo."
  explanation:
    es: "En un plazo por días hábiles, lo presentado en día inhábil «se entenderá realizada en la primera hora del primer día hábil siguiente» (art. 31.2.b): el lunes 23 de febrero de 2026. El plazo terminó el viernes 20, así que las alegaciones llegan fuera de plazo. Que el registro admita documentos el sábado no cambia la fecha a efectos del plazo. La ley no retrotrae la presentación al viernes. La prórroga al hábil siguiente solo opera cuando el último día del plazo es inhábil (art. 30.5), y aquí el último día, el viernes, era hábil."
  citation: "art. 31.2.b) LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "efecto"
# anchor: boe-a-2015-10565-art-32
- id: m03-l03-q119
  prompt:
    es: "De acuerdo con el artículo 32.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la Administración, salvo precepto en contrario, podrá conceder una ampliación de los plazos establecidos:"
  options:
  - id: a
    text:
      es: "Que no exceda de la tercera parte de los mismos, si las circunstancias lo aconsejan y no se perjudican derechos de tercero."
  - id: b
    correct: true
    text:
      es: "Que no exceda de la mitad de los mismos, si las circunstancias lo aconsejan y no se perjudican derechos de tercero."
  - id: c
    text:
      es: "Que no exceda del doble de los mismos, si las circunstancias lo aconsejan y no se perjudican derechos de tercero."
  - id: d
    text:
      es: "Que no exceda de la mitad de los mismos, solo a petición de los interesados y oídos los terceros."
  explanation:
    es: "El artículo 32.1 permite una ampliación «que no exceda de la mitad de los mismos, si las circunstancias lo aconsejan y con ello no se perjudican derechos de tercero». El límite no es la tercera parte ni el doble. La ampliación cabe «de oficio o a petición de los interesados», no solo a petición, y la ley no exige oír a terceros."
  citation: "art. 32.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "cantidad"
# anchor: boe-a-2015-10565-art-32
- id: m03-l03-q120
  prompt:
    es: "Según el artículo 32.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si un plazo de diez días notificado el lunes 12 de enero de 2026 se amplía por el máximo permitido, ¿cuándo vence?"
  options:
  - id: a
    text:
      es: "El lunes 26 de enero de 2026."
  - id: b
    text:
      es: "El martes 27 de enero de 2026."
  - id: c
    correct: true
    text:
      es: "El lunes 2 de febrero de 2026."
  - id: d
    text:
      es: "El lunes 9 de febrero de 2026."
  explanation:
    es: "La ampliación no puede exceder de la mitad del plazo (art. 32.1): diez días más cinco, quince días hábiles (art. 30.2). Se cuentan desde el martes 13 de enero, día siguiente a la notificación (art. 30.3). Excluidos sábados y domingos, el decimoquinto día hábil es el lunes 2 de febrero de 2026. El lunes 26 de enero es el décimo día hábil, sin ampliación. El martes 27 de enero sale de contar quince días naturales. El lunes 9 de febrero suma diez días de ampliación, el doble de lo permitido."
  citation: "art. 32.1 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-32
- id: m03-l03-q121
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la ampliación de plazos es correcta, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "En ningún caso podrá ser objeto de ampliación un plazo ya vencido."
  - id: b
    text:
      es: "Un plazo ya vencido podrá ampliarse si el interesado lo pide en los cinco días siguientes."
  - id: c
    text:
      es: "Contra el acuerdo que deniega la ampliación cabe recurso de alzada."
  - id: d
    text:
      es: "La decisión sobre la ampliación podrá adoptarse después de vencido el plazo, si se pidió antes."
  explanation:
    es: "El artículo 32.3 dice que «en ningún caso podrá ser objeto de ampliación un plazo ya vencido». No hay un margen de cinco días para pedirla después. La petición y la decisión deben producirse «antes del vencimiento del plazo», aunque la petición llegue a tiempo. Los acuerdos sobre ampliación o su denegación «no serán susceptibles de recurso», tampoco de alzada."
  citation: "art. 32.3 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10565-art-33
- id: m03-l03-q122
  prompt:
    es: "De acuerdo con el artículo 33 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la aplicación de la tramitación de urgencia a un procedimiento:"
  options:
  - id: a
    text:
      es: "Reduce a la mitad todos los plazos del procedimiento ordinario, incluidos los de presentación de solicitudes y recursos."
  - id: b
    correct: true
    text:
      es: "Reduce a la mitad los plazos del procedimiento ordinario, salvo los de presentación de solicitudes y recursos."
  - id: c
    text:
      es: "Reduce a la tercera parte los plazos del procedimiento ordinario, salvo los de presentación de solicitudes y recursos."
  - id: d
    text:
      es: "Reduce a la mitad los plazos del procedimiento ordinario, salvo los de audiencia y prueba."
  explanation:
    es: "Con la tramitación de urgencia «se reducirán a la mitad los plazos establecidos para el procedimiento ordinario, salvo los relativos a la presentación de solicitudes y recursos». Los plazos de solicitudes y recursos no se reducen. La reducción es a la mitad, no a la tercera parte, y la audiencia y la prueba no están exceptuadas."
  citation: "art. 33 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10565-art-33
- id: m03-l03-q123
  prompt:
    es: "Según el artículo 33 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en un procedimiento al que se aplica la tramitación de urgencia, ¿cuál es el plazo mínimo del trámite de audiencia?"
  options:
  - id: a
    text:
      es: "No inferior a diez días."
  - id: b
    text:
      es: "No inferior a siete días."
  - id: c
    correct: true
    text:
      es: "No inferior a cinco días."
  - id: d
    text:
      es: "No inferior a tres días."
  explanation:
    es: "En la tramitación ordinaria la audiencia dura un plazo no inferior a diez días ni superior a quince (art. 82.2). La urgencia reduce a la mitad los plazos del procedimiento ordinario, salvo los de presentación de solicitudes y recursos (art. 33). La audiencia no está exceptuada, así que su mínimo pasa de diez a cinco días. Diez días es el mínimo ordinario, sin reducir. Siete días es el plazo de alegaciones tras las actuaciones complementarias (art. 87). Tres días no resulta de ninguna reducción a la mitad."
  citation: "art. 33 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-21
- id: m03-l03-q124
  prompt:
    es: "De acuerdo con el artículo 21.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la Administración está obligada a dictar resolución expresa y a notificarla en todos los procedimientos, excepto:"
  options:
  - id: a
    text:
      es: "En la terminación por desistimiento o renuncia y en los relativos a derechos sometidos solo a declaración responsable o comunicación."
  - id: b
    text:
      es: "En la terminación por pacto o convenio y en los iniciados de oficio en que se haya producido la caducidad."
  - id: c
    text:
      es: "En la terminación por caducidad y en los relativos a derechos sometidos a autorización administrativa previa."
  - id: d
    correct: true
    text:
      es: "En la terminación por pacto o convenio y en los relativos a derechos sometidos solo a declaración responsable o comunicación."
  explanation:
    es: "El artículo 21.1 exceptúa «los supuestos de terminación del procedimiento por pacto o convenio, así como los procedimientos relativos al ejercicio de derechos sometidos únicamente al deber de declaración responsable o comunicación». En el desistimiento, la renuncia y la caducidad sí hay que resolver: la resolución declara la circunstancia que concurra. Los derechos sometidos a autorización previa no están exceptuados."
  citation: "art. 21.1 LPAC"
  difficulty: 2
  tags:
  - "excepción"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-21
- id: m03-l03-q125
  prompt:
    es: "Conforme al artículo 21.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el plazo máximo para notificar la resolución expresa que fije la norma reguladora del procedimiento:"
  options:
  - id: a
    text:
      es: "No podrá exceder de seis meses en ningún caso, aunque una norma con rango de Ley o el Derecho de la Unión Europea prevean otro."
  - id: b
    text:
      es: "No podrá exceder de seis meses, salvo que una norma reglamentaria establezca uno mayor o lo prevea el Derecho de la Unión Europea."
  - id: c
    correct: true
    text:
      es: "No podrá exceder de seis meses, salvo que una norma con rango de Ley establezca uno mayor o lo prevea el Derecho de la Unión Europea."
  - id: d
    text:
      es: "No podrá exceder de un año, salvo que una norma con rango de Ley establezca uno mayor o lo prevea el Derecho de la Unión Europea."
  explanation:
    es: "El artículo 21.2 dice que el plazo «no podrá exceder de seis meses salvo que una norma con rango de Ley establezca uno mayor o así venga previsto en el Derecho de la Unión Europea». El límite admite esas dos salvedades, así que no es absoluto. Un reglamento no puede superarlo. El límite es de seis meses, no de un año."
  citation: "art. 21.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10565-art-21
- id: m03-l03-q127
  prompt:
    es: "Según el artículo 21.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿desde cuándo se cuenta el plazo máximo para resolver en los procedimientos iniciados de oficio?"
  options:
  - id: a
    text:
      es: "Desde la notificación del acuerdo de iniciación."
  - id: b
    correct: true
    text:
      es: "Desde la fecha del acuerdo de iniciación."
  - id: c
    text:
      es: "Desde la publicación del acuerdo de iniciación."
  - id: d
    text:
      es: "Desde el día siguiente a la primera actuación de instrucción."
  explanation:
    es: "En los procedimientos iniciados de oficio el plazo se cuenta «desde la fecha del acuerdo de iniciación» (art. 21.3.a). No se cuenta desde su notificación ni desde su publicación, ni desde la primera actuación de instrucción."
  citation: "art. 21.3 LPAC"
  difficulty: 1
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-21
- id: m03-l03-q128
  prompt:
    es: "Una solicitud se presenta en el registro de un ayuntamiento el lunes 4 de mayo de 2026 y entra en el registro electrónico del organismo estatal competente para tramitarla el jueves 7 de mayo. Su norma no fija plazo máximo. ¿Cuál es el último día para notificar la resolución?"
  options:
  - id: a
    text:
      es: "El martes 4 de agosto de 2026."
  - id: b
    text:
      es: "El jueves 6 de agosto de 2026."
  - id: c
    correct: true
    text:
      es: "El viernes 7 de agosto de 2026."
  - id: d
    text:
      es: "El lunes 10 de agosto de 2026."
  explanation:
    es: "Sin plazo en la norma, el plazo es de tres meses y se cuenta desde la entrada de la solicitud en el registro electrónico del organismo competente para tramitarla (art. 21.3.b), el jueves 7 de mayo, no desde la presentación en el ayuntamiento. Los meses se cuentan de fecha a fecha (art. 30.4): el plazo concluye el viernes 7 de agosto de 2026, que es hábil. El martes 4 de agosto cuenta desde la presentación en el ayuntamiento. El jueves 6 de agosto termina un día antes de la fecha equivalente. El lunes 10 de agosto toma como fecha de partida el 8 de mayo."
  citation: "art. 21.3 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
