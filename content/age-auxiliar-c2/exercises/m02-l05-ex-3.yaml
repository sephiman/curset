# anchor: fuente-ms-azure-ocr-html
- id: m02-l05-q206
  prompt:
    es: "¿Cuál de los siguientes tipos de texto permiten extraer las técnicas de OCR basadas en aprendizaje automático, según la página de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Texto impreso o manuscrito de imágenes y documentos"
  - id: b
    text:
      es: "Solo texto mecanografiado de documentos en papel escaneados"
  - id: c
    text:
      es: "Solo el texto de los archivos digitales con formato PDF"
  - id: d
    text:
      es: "El audio de las grabaciones convertido en texto escrito"
  explanation:
    es: "La página indica que el OCR extrae texto impreso o manuscrito de imágenes como carteles y de documentos. «Solo texto mecanografiado de documentos en papel escaneados» contradice la página, que incluye también el texto manuscrito y las imágenes. «Solo el texto de los archivos digitales con formato PDF» contradice la página, que incluye imágenes como pósteres y señales. «El audio de las grabaciones convertido en texto escrito» no es OCR: la página trata de texto en imágenes y documentos."
  citation: "fuente: `ms-azure-ocr.html`; «OCR: reconocimiento óptico de caracteres»"
  difficulty: 1
  tags:
  - "concepto"
