- id: g-changeset
  term: {en: changeset}
  definition: {en: "The basic unit of change in Liquibase. Changesets are stored in the changelog and contain change types that specify what each change does, like creating a new table or adding a column to an existing table."}
  origin: m06-l04
  citation: "liquibase-changeset#main-header"
- id: g-migrations
  term: {en: migrations}
  definition: {en: "SQL scripts that capture incremental changes to a development database, schema and data changes alike. The same scripts are run in the same order on each environment, which gives a repeatable deployment process."}
  origin: m06-l04
  citation: "flyway-migrations#migrations"
