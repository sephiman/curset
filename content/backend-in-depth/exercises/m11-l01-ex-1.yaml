- id: m11-l01-q03
  prompt:
    en: The program groups `apple`, `avocado`, `banana`, `blueberry`, `cherry`, `apple` by first letter and then
      by length with `counting()`, partitions them by `length() > 6`, and partitions an empty stream. What does
      it print, one line per map?
  options:
  - id: a
    correct: true
    text:
      en: '{a={5=2, 7=1}, b={6=1, 9=1}, c={6=1}}

        {false=4, true=2}

        {false=0, true=0}'
  - id: b
    text:
      en: '{a={5=[apple, apple], 7=[avocado]}, b={6=[banana], 9=[blueberry]}, c={6=[cherry]}}

        {false=4, true=2}

        {false=0, true=0}'
  - id: c
    text:
      en: '{a={5=2, 7=1}, b={6=1, 9=1}, c={6=1}}

        {false=4, true=2}

        {}'
  - id: d
    text:
      en: '{a={5=2, 7=1}, b={6=1, 9=1}, c={6=1}}

        {false=2, true=4}

        {false=0, true=0}'
  explanation:
    en: 'The program prints `{a={5=2, 7=1}, b={6=1, 9=1}, c={6=1}}`, `{false=4, true=2}` and `{false=0, true=0}`:
      the inner `counting()` reduces each group, and both partitions exist even for an empty stream. The first line
      with lists is wrong because the downstream collector reduces the values of each key to a count. The lines
      ending with `{}` are wrong because the map from `partitioningBy` always contains mappings for both `false`
      and `true`. The line `{false=2, true=4}` is wrong because `length() > 6` excludes the six-letter words, so
      only `avocado` and `blueberry` land in `true`.'
