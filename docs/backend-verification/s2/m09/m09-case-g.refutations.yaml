m09-case-g-q01:
  key:
    anchor: mcp-authorization#token-requirements
    sentence: 'MCP client MUST use the Authorization request header field defined in OAuth 2.1 Section 5.1.1:'
  wrong:
  - option: In the query string of the request URI
    anchor: mcp-authorization#token-requirements
    sentence: Access tokens MUST NOT be included in the URI query string
  - option: In the first request only, since the session then stays authorized
    anchor: mcp-authorization#token-requirements
    sentence: Note that authorization MUST be included in every HTTP request from client to server.
  - option: In a `Cookie` header that the server sets after the first call
    anchor: mcp-authorization#token-requirements
    sentence: 'MCP client MUST use the Authorization request header field defined in OAuth 2.1 Section 5.1.1:'
    exclusive: true
m09-case-g-q02:
  key:
    anchor: mcp-authorization#scope-selection-strategy
    sentence: When re-authorizing, clients SHOULD include these scopes alongside any previously granted scopes to avoid losing permissions needed for other operations
  wrong:
  - option: Only the challenged scopes, replacing the earlier grant
    anchor: mcp-authorization#scope-selection-strategy
    sentence: When re-authorizing, clients SHOULD include these scopes alongside any previously granted scopes to avoid losing permissions needed for other operations
    exclusive: true
  - option: The whole `scopes_supported` list instead of the challenge
    anchor: mcp-authorization#scope-selection-strategy
    sentence: Clients MUST treat the scopes provided in the challenge as authoritative for the current operation.
  - option: No scope, reusing the token it already has
    anchor: mcp-authorization#scope-challenge-handling
    sentence: This section covers handling insufficient scope errors during runtime operations when a client already has a token but needs additional permissions.
m09-case-g-q03:
  key:
    anchor: mcp-authorization#scope-selection-strategy
    sentence: If scope is not available, use all scopes defined in scopes_supported from the Protected Resource Metadata document, omitting the scope parameter if scopes_supported is undefined.
  wrong:
  - option: Send an empty `scope` value in its authorization request
    anchor: mcp-authorization#scope-selection-strategy
    sentence: If scope is not available, use all scopes defined in scopes_supported from the Protected Resource Metadata document, omitting the scope parameter if scopes_supported is undefined.
    exclusive: true
  - option: Request every scope that it knows from earlier sessions
    anchor: mcp-authorization#scope-selection-strategy
    sentence: If scope is not available, use all scopes defined in scopes_supported from the Protected Resource Metadata document, omitting the scope parameter if scopes_supported is undefined.
    exclusive: true
  - option: Stop the authorization flow and report an error
    anchor: mcp-authorization#scope-selection-strategy
    sentence: If scope is not available, use all scopes defined in scopes_supported from the Protected Resource Metadata document, omitting the scope parameter if scopes_supported is undefined.
    exclusive: true
m09-case-g-q04:
  key:
    anchor: mcp-authorization#scope-selection-strategy
    sentence: The scopes_supported field is intended to represent the minimal set of scopes necessary for basic functionality
  wrong:
  - option: The complete list of every scope the server ever issues
    anchor: mcp-authorization#scope-selection-strategy
    sentence: they are not required to surface every dynamically issued scope through scopes_supported
  - option: Only scopes that clients request through step-up authorization
    anchor: mcp-authorization#scope-selection-strategy
    sentence: with additional scopes requested incrementally through the step-up authorization flow steps described in the Scope Challenge Handling section
  - option: A set that clients must treat as a superset of challenged scopes
    anchor: mcp-authorization#scope-selection-strategy
    sentence: Clients MUST NOT assume any particular set relationship between the challenged scope set and scopes_supported.
m09-case-g-q05:
  key:
    anchor: mcp-security-best-practices#token-passthrough
    sentence: “Token passthrough” is an anti-pattern where an MCP server accepts tokens from an MCP client without validating that the tokens were properly issued to the MCP server and passes them through to the downstream API.
  wrong:
  - option: Step-up authorization, which requests extra scopes
    anchor: mcp-authorization#scope-selection-strategy
    sentence: with additional scopes requested incrementally through the step-up authorization flow steps described in the Scope Challenge Handling section
  - option: Scope challenge handling after insufficient scope
    anchor: mcp-authorization#scope-challenge-handling
    sentence: This section covers handling insufficient scope errors during runtime operations when a client already has a token but needs additional permissions.
  - option: A static client ID shared by all clients
    anchor: mcp-security-best-practices#terminology
    sentence: 'Static Client ID : A fixed OAuth 2.0 client identifier used by the MCP proxy server when communicating with the third-party authorization server.'
m09-case-g-q06:
  key:
    anchor: mcp-security-best-practices#required-protections
    sentence: Use exact string matching (not pattern matching or wildcards)
  wrong:
  - option: By prefix matching against the registered URI
    anchor: mcp-security-best-practices#required-protections
    sentence: Use exact string matching (not pattern matching or wildcards)
    exclusive: true
  - option: By wildcard matching on the host name
    anchor: mcp-security-best-practices#required-protections
    sentence: Use exact string matching (not pattern matching or wildcards)
    exclusive: true
  - option: By regular expression supplied by the client
    anchor: mcp-security-best-practices#required-protections
    sentence: Use exact string matching (not pattern matching or wildcards)
    exclusive: true
m09-case-g-q07:
  key:
    anchor: mcp-security-best-practices#required-protections
    sentence: Set Secure, HttpOnly, and SameSite=Lax attributes
  wrong:
  - option: '`Secure` and `SameSite=None`'
