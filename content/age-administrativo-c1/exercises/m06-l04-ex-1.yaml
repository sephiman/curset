# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q002
  prompt:
    es: "En Word 365, ¿cuál de las siguientes teclas activa o desactiva por sí sola las Sugerencias de teclas de la cinta de opciones?"
  options:
  - id: a
    correct: true
    text:
      es: "F10"
  - id: b
    text:
      es: "Alt+F10"
  - id: c
    text:
      es: "Mayús+F10"
  - id: d
    text:
      es: "Ctrl+F1"
  explanation:
    es: "En la tabla de teclas de función, «Solo F10: activa o desactiva las KeyTips», el nombre inglés de las Sugerencias de teclas; la tabla de la cinta da también «Alt o F10» para activar las teclas de acceso. Mayús+F10 muestra el menú contextual del elemento seleccionado, Ctrl+F1 muestra u oculta la cinta de opciones y Alt+F10 muestra el panel de tareas de Selección."
  citation: "fuente: `ms-word-atajos.html`; «Usar métodos abreviados de tecla de función»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q003
  prompt:
    es: "En Word 365, después de abrir una pestaña de la cinta de opciones con su tecla de acceso, ¿qué ocurre al volver a presionar la tecla Alt?"
  options:
  - id: a
    text:
      es: "El foco pasa al campo Información o Búsqueda de la cinta."
  - id: b
    text:
      es: "Se abre la página Archivo para usar la vista Backstage."
  - id: c
    text:
      es: "Se abre la pestaña Revisar para usar la revisión ortográfica."
  - id: d
    correct: true
    text:
      es: "Se ven las Sugerencias de teclas de esa pestaña."
  explanation:
    es: "La página indica: «Vuelva a presionar Alt para ver las Key Tips de las opciones de la pestaña seleccionada». Abrir la página Archivo es lo que hace Alt, F; ir al campo Información o Búsqueda, Alt, Q; y abrir la pestaña Revisar, Alt, R. Ninguna de esas acciones se obtiene con un segundo Alt."
  citation: "fuente: `ms-word-atajos.html`; «Métodos abreviados de teclado de la cinta»"
  difficulty: 3
  tags:
  - "comportamiento"
  - "atajo"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q004
  prompt:
    es: "En Word 365, ¿qué ocurre si se presiona Alt y, a continuación, una de las teclas de menú de versiones anteriores, como E (Editar)?"
  options:
  - id: a
    correct: true
    text:
      es: "Aparece una notificación de que se usa una tecla de acceso de una versión anterior."
  - id: b
    text:
      es: "Word no responde, porque los métodos abreviados antiguos con Alt ya no funcionan."
  - id: c
    text:
      es: "Se activa el campo Información o Búsqueda para buscar ayuda sobre el comando."
  - id: d
    text:
      es: "Se abre la pestaña Revisar de la cinta para usar la revisión ortográfica."
  explanation:
    es: "La página dice que «la mayoría de los métodos abreviados de teclado antiguos con la tecla Alt también siguen funcionando» y que, al usarlos, «aparece una notificación que le indica que está usando una tecla de acceso de una versión anterior». Por eso es falso que ya no funcionen. Abrir la pestaña Revisar es Alt, R, y el campo Información o Búsqueda se abre con Alt, Q."
  citation: "fuente: `ms-word-atajos.html`; «Métodos abreviados de teclado de la cinta»"
  difficulty: 3
  tags:
  - "comportamiento"
  - "atajo"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q005
  prompt:
    es: "En Word 365, ¿cuál de las siguientes secuencias de teclas abre la pestaña Revisar para usar la revisión ortográfica y el seguimiento de cambios?"
  options:
  - id: a
    text:
      es: "Alt, S"
  - id: b
    text:
      es: "Alt, M"
  - id: c
    correct: true
    text:
      es: "Alt, R"
  - id: d
    text:
      es: "Alt, Q"
  explanation:
    es: "En la tabla de teclas de acceso, «Abrir la pestaña Revisar para usar la Revisión ortográfica, establecer los idiomas de revisión y para realizar un seguimiento y revisar los cambios» corresponde a Alt, R. Alt, M abre la pestaña Correspondencia; Alt, S, la pestaña Referencias; y Alt, Q lleva al campo Información o Búsqueda."
  citation: "fuente: `ms-word-atajos.html`; «Usar las teclas de acceso para las pestañas de la cinta de opciones»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q006
  prompt:
    es: "En Word 365, ¿qué pestaña de la cinta de opciones se abre con la secuencia de teclas Alt, S, según la tabla de teclas de acceso de Microsoft?"
  options:
  - id: a
    text:
      es: "Correspondencia, para combinar correspondencia y hacer sobres"
  - id: b
    correct: true
    text:
      es: "Referencias, para agregar una tabla de contenido o notas al pie"
  - id: c
    text:
      es: "Revisar, para usar la revisión ortográfica y los cambios"
  - id: d
    text:
      es: "Vista, para elegir el modo Lectura o la vista Esquema"
  explanation:
    es: "La tabla asigna Alt, S a «Abrir la pestaña Referencias para agregar una tabla de contenido, notas al pie, o una tabla de citas». Revisar se abre con Alt, R; Correspondencia, con Alt, M; y Vista, con Alt, W."
  citation: "fuente: `ms-word-atajos.html`; «Usar las teclas de acceso para las pestañas de la cinta de opciones»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q007
  prompt:
    es: "En Word 365, ¿cuál de las siguientes acciones realiza la secuencia de teclas Alt, Q, según la tabla de teclas de acceso de la cinta?"
  options:
  - id: a
    correct: true
    text:
      es: "Lleva al campo Información o Búsqueda para buscar ayuda o contenido."
  - id: b
    text:
      es: "Abre la página Archivo para usar la vista Backstage del documento."
  - id: c
    text:
      es: "Abre la pestaña Referencias para agregar una tabla de contenido."
  - id: d
    text:
      es: "Abre la pestaña Revisar para usar la revisión ortográfica del texto."
  explanation:
    es: "La tabla dice: «Ir al campo Información o Búsqueda en la cinta de opciones para buscar ayuda o contenido de ayuda. | Alt, Q». La vista Backstage se abre con Alt, F; la pestaña Revisar, con Alt, R; y la pestaña Referencias, con Alt, S."
  citation: "fuente: `ms-word-atajos.html`; «Usar las teclas de acceso para las pestañas de la cinta de opciones»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-word-lector-pantalla-html
- id: m06-l04-q008
  prompt:
    es: "En Word 365, ¿en qué parte de la ventana se encuentra la barra de estado, donde aparecen el recuento de páginas y el de palabras?"
  options:
  - id: a
    text:
      es: "En la parte superior, junto a la barra de título"
  - id: b
    correct: true
    text:
      es: "En la parte inferior de la ventana de Word"
  - id: c
    text:
      es: "En el margen derecho, junto al panel Comentarios"
  - id: d
    text:
      es: "Justo debajo de la fila de pestañas de la cinta"
  explanation:
    es: "La página de Microsoft describe «la barra de estado en la parte inferior de la pantalla», con estadísticas del documento. Arriba están la barra de herramientas de acceso rápido y la barra de título; el panel Comentarios aparece en el margen derecho; y debajo de la fila de pestañas está la cinta de opciones con las opciones de la pestaña seleccionada."
  citation: "fuente: `ms-word-lector-pantalla.html`; «Navegar por la vista principal»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-lector-pantalla-html
- id: m06-l04-q009
  prompt:
    es: "En Word 365, ¿cuál de los siguientes elementos forma parte de la información que muestra la barra de estado sobre el documento?"
  options:
  - id: a
    correct: true
    text:
      es: "El idioma en que está escrito el texto"
  - id: b
    text:
      es: "El nombre del documento que está abierto"
  - id: c
    text:
      es: "El botón para activar el Autoguardado"
  - id: d
    text:
      es: "Los botones Compartir y Comentarios"
  explanation:
    es: "Según la página, la barra de estado muestra «el recuento de páginas, el recuento de palabras, el idioma del texto y el nivel de zoom». El botón de Autoguardado y el nombre del documento están en la barra de herramientas de acceso rápido y la barra de título, arriba. Los botones Compartir y Comentarios están en la fila de pestañas de la cinta."
  citation: "fuente: `ms-word-lector-pantalla.html`; «Navegar por la vista principal»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-lector-pantalla-html
- id: m06-l04-q010
  prompt:
    es: "En Word 365, ¿cuál de las siguientes teclas desplaza el foco hacia delante entre los elementos de la vista principal, como el documento, la barra de estado y la cinta?"
  options:
  - id: a
    correct: true
    text:
      es: "F6"
  - id: b
    text:
      es: "Mayús+F6"
  - id: c
    text:
      es: "F10"
  - id: d
    text:
      es: "Ctrl+F6"
  explanation:
    es: "La página dice: «presione F6 (hacia delante) o Mayús+F6 (hacia atrás)». Mayús+F6 recorre los mismos elementos, pero hacia atrás. Ctrl+F6 cambia a la ventana del documento siguiente cuando hay más de uno abierto, y F10 activa o desactiva las Sugerencias de teclas."
  citation: "fuente: `ms-word-lector-pantalla.html`; «Navegar por la vista principal»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-word-contar-palabras-html
- id: m06-l04-q011
  prompt:
    es: "En Word 365, ¿cómo se consulta el número de caracteres, párrafos y líneas del documento, además del de palabras?"
  options:
  - id: a
    text:
      es: "Con Ctrl+B, que abre el panel de tareas de Navegación"
  - id: b
    text:
      es: "Con Mostrar u ocultar ¶, en el grupo Párrafo de Inicio"
  - id: c
    correct: true
    text:
      es: "Con un clic en el recuento de palabras, en la barra de estado"
  - id: d
    text:
      es: "Con Mayús+F7, con el cursor en cualquier lugar del documento"
  explanation:
    es: "La recomendación de la página es: «Descubra el número de caracteres, párrafos y líneas haciendo clic en el recuento de palabras en la barra de estado». Mayús+F7 abre el panel del diccionario de sinónimos; Ctrl+B, el panel de Navegación para buscar; y Mostrar u ocultar ¶ enseña las marcas de formato."
  citation: "fuente: `ms-word-contar-palabras.html`; «Mostrar recuento de palabras»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-contar-palabras-html
- id: m06-l04-q012
  prompt:
    es: "En Word 365, cuando se selecciona una parte del texto para obtener un recuento parcial de palabras, la barra de estado muestra:"
  options:
  - id: a
    text:
      es: "Solo el recuento de la selección, sin el total del documento."
  - id: b
    text:
      es: "El recuento de la selección y el de la página en que está."
  - id: c
    correct: true
    text:
      es: "El recuento de la selección realizada y el de todo el documento."
  - id: d
    text:
      es: "Solo el recuento del documento, porque la selección no lo cambia."
  explanation:
    es: "La página dice: «La barra de estado muestra el recuento de palabras de la selección realizada y de todo el documento». «Solo la selección» quita el total, y «solo el documento» quita la selección, que es justo la cifra parcial que se pide al seleccionar. La opción con el recuento de la página mezcla la selección con otra cifra: la página nombra las páginas como algo que Word también cuenta, pero el recuento parcial de la frase es el de la selección y el de todo el documento, no el de la página."
  citation: "fuente: `ms-word-contar-palabras.html`; «Mostrar recuento de palabras»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-contar-palabras-html
- id: m06-l04-q013
  prompt:
    es: "En Word 365, de acuerdo con la página de Microsoft sobre el recuento, el número de palabras de un documento:"
  options:
  - id: a
    text:
      es: "Lo cuenta Word mientras se escribe y se ve en la barra de título."
  - id: b
    text:
      es: "Solo se calcula al guardar el documento, y se ve en la barra de estado."
  - id: c
    text:
      es: "Solo se calcula al presionar F7 para revisar la ortografía del documento."
  - id: d
    correct: true
    text:
      es: "Lo cuenta Word mientras se escribe y se comprueba en la barra de estado."
  explanation:
    es: "La página dice que «Word cuenta el número de palabras de un documento mientras escribe» y que, para saber cuántas hay, se comprueba «la barra de estado». Las opciones que lo limitan al guardar o a la revisión con F7 contradicen el recuento mientras se escribe. La barra de título no es donde la página sitúa el recuento."
  citation: "fuente: `ms-word-contar-palabras.html`; «Mostrar recuento de palabras»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-ajustar-imagenes-html
- id: m06-l04-q014
  prompt:
    es: "En Word 365, ¿cuál de las siguientes rutas de la cinta de opciones muestra las marcas de formato del documento?"
  options:
  - id: a
    text:
      es: "Inicio › Portapapeles › Mostrar u ocultar ¶"
  - id: b
    correct: true
    text:
      es: "Inicio › Párrafo › Mostrar u ocultar ¶"
  - id: c
    text:
      es: "Inicio › Estilos › Mostrar u ocultar ¶"
  - id: d
    text:
      es: "Inicio › Edición › Mostrar u ocultar ¶"
  explanation:
    es: "La página dice: «Mostrar marcas de formato En la pestaña Inicio, en el grupo Párrafo, seleccione Mostrar u ocultar ¶». El botón está en la pestaña Inicio, pero en el grupo Párrafo, no en Estilos, Edición ni Portapapeles. Algunos exámenes lo llaman «Mostrar todo»; la etiqueta que imprime Microsoft es «Mostrar u ocultar ¶»."
  citation: "fuente: `ms-word-ajustar-imagenes.html`; «Información sobre los anclajes»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-ajustar-imagenes-html
- id: m06-l04-q015
  prompt:
    es: "En Word 365, una imagen con un ajuste distinto de «En línea con el texto» no muestra su delimitador de objeto. ¿Qué comando de la cinta permite que se vean los anclajes?"
  options:
  - id: a
    text:
      es: "Panel de revisiones, en la pestaña Revisar de la cinta"
  - id: b
    text:
      es: "Bloquear anclaje, en Ver más del icono Opciones de diseño"
  - id: c
    correct: true
    text:
      es: "Mostrar u ocultar ¶, en el grupo Párrafo de la pestaña Inicio"
  - id: d
    text:
      es: "Panel de selección, en el menú Seleccionar de la pestaña Inicio"
  explanation:
    es: "La página da dos maneras de asegurarse de que se muestran los anclajes; la de la cinta es «Mostrar marcas de formato»: en la pestaña Inicio, grupo Párrafo, «Mostrar u ocultar ¶». El Panel de selección sirve para seleccionar, mostrar, ocultar u ordenar objetos. Bloquear anclaje mantiene la imagen en su sitio aunque se borre el texto de alrededor. El Panel de revisiones muestra las revisiones del documento."
  citation: "fuente: `ms-word-ajustar-imagenes.html`; «Información sobre los anclajes»"
  difficulty: 3
  tags:
  - "comportamiento"
  - "ofimática-menú"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q016
  prompt:
    es: "En Word 365, ¿cuál de los siguientes métodos abreviados de teclado muestra todos los caracteres no imprimibles del documento?"
  options:
  - id: a
    text:
      es: "Mayús+F1"
  - id: b
    text:
      es: "Ctrl+F1"
  - id: c
    text:
      es: "Ctrl+Mayús+F8"
  - id: d
    correct: true
    text:
      es: "Ctrl+Mayús+8"
  explanation:
    es: "La tabla «Administrar el formato del texto» asigna Ctrl+Mayús+8 (sin usar el teclado numérico) a «Mostrar todos los caracteres no imprimibles». En la misma página, Mayús+F1 muestra el panel de tareas Mostrar formato, Ctrl+F1 muestra u oculta la cinta de opciones y Ctrl+Mayús+F8 sirve para seleccionar un bloque de texto vertical."
  citation: "fuente: `ms-word-atajos.html`; «Administrar el formato del texto»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q017
  prompt:
    es: "En Word 365, ¿qué hace el método abreviado Ctrl+Mayús+8, pulsado sin usar el teclado numérico?"
  options:
  - id: a
    text:
      es: "Oculta el texto seleccionado sin borrarlo del documento."
  - id: b
    correct: true
    text:
      es: "Muestra todos los caracteres no imprimibles del documento."
  - id: c
    text:
      es: "Inserta un salto de columna en la posición del cursor."
  - id: d
    text:
      es: "Muestra el panel de tareas Mostrar formato del texto."
  explanation:
    es: "La página asigna Ctrl+Mayús+8 a «Mostrar todos los caracteres no imprimibles». El panel Mostrar formato se abre con Mayús+F1; ocultar el texto seleccionado es Ctrl+Mayús+H; y el salto de columna se inserta con Ctrl+Mayús+Entrar."
  citation: "fuente: `ms-word-atajos.html`; «Administrar el formato del texto»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q018
  prompt:
    es: "En Word 365, ¿cuál de los siguientes métodos abreviados muestra el panel de tareas de Navegación para buscar en el contenido del documento?"
  options:
  - id: a
    text:
      es: "Alt+F10"
  - id: b
    text:
      es: "F5"
  - id: c
    text:
      es: "Mayús+F4"
  - id: d
    correct: true
    text:
      es: "Ctrl+B"
  explanation:
    es: "La tabla «Navegar por el documento» dice: «Mostrar el panel de tareas de Navegación para buscar en el contenido del documento. | Ctrl+B». F5 muestra el cuadro de diálogo Ir a; Alt+F10, el panel de tareas de Selección; y Mayús+F4 vuelve a ejecutar la acción de Buscar o Ir a más reciente, sin abrir el panel."
  citation: "fuente: `ms-word-atajos.html`; «Navegar por el documento»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-word-atajos-html
- id: m06-l04-q019
  prompt:
    es: "En Word 365, según la página de métodos abreviados de teclado de Microsoft, ¿qué se muestra al presionar Ctrl+B?"
  options:
  - id: a
    text:
      es: "El cuadro de diálogo Reemplazar, para buscar y cambiar texto"
  - id: b
    correct: true
    text:
      es: "El panel de tareas de Navegación, para buscar en el documento"
  - id: c
    text:
      es: "El cuadro de diálogo Ir a, para ir a una página o un marcador"
  - id: d
    text:
      es: "El panel de tareas de Selección, con los objetos de la página"
  explanation:
    es: "La página asigna Ctrl+B a «Mostrar el panel de tareas de Navegación para buscar en el contenido del documento». El cuadro Ir a se abre con F5, el panel de Selección con Alt+F10 y el cuadro Reemplazar con Ctrl+H."
  citation: "fuente: `ms-word-atajos.html`; «Navegar por el documento»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-word-lector-pantalla-html
- id: m06-l04-q020
  prompt:
    es: "En Word 365, ¿cuál de las siguientes descripciones corresponde al panel de navegación, que también se abre con Ctrl+B?"
  options:
  - id: a
    text:
      es: "Sirve para seleccionar, mostrar, ocultar o cambiar el orden de los objetos del documento."
  - id: b
    text:
      es: "Sirve para ver juntos todos los comentarios del documento, activos y resueltos."
  - id: c
    correct: true
    text:
      es: "Sirve para desplazarse rápidamente entre partes del documento, como títulos o gráficos."
  - id: d
    text:
      es: "Sirve para ver el formato aplicado al texto seleccionado en el documento."
  explanation:
    es: "La página dice: «Puede usar el panel de navegación para desplazarse rápidamente entre partes del documento, como títulos o gráficos». Seleccionar, mostrar, ocultar u ordenar objetos es lo que hace el Panel de selección. Ver juntos los comentarios activos y resueltos es la vista Lista del panel Comentarios. El formato del texto se consulta en el panel Mostrar formato."
  citation: "fuente: `ms-word-lector-pantalla.html`; «Usar el panel de navegación»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-seleccionar-objetos-html
- id: m06-l04-q021
  prompt:
    es: "En Word 365, ¿qué permite hacer la opción Seleccionar objetos del menú Seleccionar de la pestaña Inicio?"
  options:
  - id: a
    correct: true
    text:
      es: "Seleccionar con un clic los objetos que están ocultos, apilados o detrás del texto."
  - id: b
    text:
      es: "Seleccionar de una vez todo el texto del documento, con sus imágenes y formas."
  - id: c
    text:
      es: "Abrir un panel de tareas para mostrar, ocultar o cambiar el orden de los objetos."
  - id: d
    text:
      es: "Seleccionar de una vez el texto que tiene un formato similar al de la selección."
  explanation:
    es: "La página dice: «Para seleccionar objetos que están ocultos, apilados o detrás del texto, elija Seleccionar objetos»; se selecciona cada uno con un clic cuando el puntero se convierte en flecha de selección. El panel de tareas para mostrar, ocultar u ordenar objetos es el Panel de selección. El texto de formato similar se elige con Seleccionar todo el texto con formato similar, y todo el texto, con Seleccionar todo."
