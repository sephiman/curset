# anchor: boe-a-2003-23186-art-85
- id: m03-l05-q0001
  prompt:
    es: "¿Cuál de las siguientes actuaciones figura entre las que enumera el artículo 85.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, para instrumentar la información y asistencia a los obligados tributarios?"
  options:
  - id: a
    text:
      es: "La práctica de requerimientos individualizados de información a terceros sobre sus relaciones económicas."
  - id: b
    correct: true
    text:
      es: "Las actuaciones previas de valoración."
  - id: c
    text:
      es: "La tramitación de las solicitudes de aplazamiento de las deudas tributarias en período voluntario."
  - id: d
    text:
      es: "La instrucción de los procedimientos sancionadores por las infracciones tributarias cometidas."
  explanation:
    es: "El artículo 85.2 enumera cinco actuaciones y las actuaciones previas de valoración son la cuarta. Los requerimientos a terceros, los aplazamientos y los procedimientos sancionadores son trámites de aplicación de los tributos que ese artículo no incluye en su lista."
  citation: "art. 85.2 LGT"
  difficulty: 2
  tags:
  - "actuaciones"
  - "enumeración"
# anchor: boe-a-2003-23186-art-85
- id: m03-l05-q0002
  prompt:
    es: "Según el artículo 85.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en qué órganos se realizan las comunicaciones y actuaciones de información efectuadas por los servicios destinados a tal efecto, dentro de la información y asistencia a los obligados?"
  options:
  - id: a
    correct: true
    text:
      es: "Los órganos de la Administración tributaria."
  - id: b
    text:
      es: "Los órganos de las Administraciones locales con competencia en gestión catastral."
  - id: c
    text:
      es: "Los colegios y asociaciones de profesionales de la asesoría fiscal."
  - id: d
    text:
      es: "Los tribunales económico-administrativos regionales y locales."
  explanation:
    es: "La letra b) del artículo 85.2 sitúa esos servicios en los órganos de la Administración tributaria. Las Administraciones locales, los colegios de asesores fiscales y los tribunales económico-administrativos quedan fuera: los colegios aparecen en la colaboración social del artículo 92 y los tribunales resuelven reclamaciones, no informan a los obligados."
  citation: "art. 85.2 LGT"
  difficulty: 2
  tags:
  - "actuaciones"
  - "órgano"
# anchor: boe-a-2003-23186-art-85
- id: m03-l05-q0004
  prompt:
    es: "De acuerdo con el artículo 85.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la información y asistencia a los obligados tributarios:"
  options:
  - id: a
    text:
      es: "La Administración prestará información y asistencia solo a quienes la soliciten previamente por escrito."
  - id: b
    text:
      es: "La Administración prestará esa información únicamente sobre las obligaciones tributarias, no sobre los derechos."
  - id: c
    text:
      es: "La Administración podrá prestar la información y asistencia en función de sus medios disponibles en cada momento y en cada ejercicio presupuestario."
  - id: d
    correct: true
    text:
      es: "La Administración deberá prestar a los obligados la necesaria información y asistencia acerca de sus derechos y obligaciones."
  explanation:
    es: "El artículo 85.1 impone un deber: la Administración «deberá» prestar la información y asistencia necesarias sobre derechos y obligaciones. No exige solicitud escrita previa, no limita la materia a las obligaciones y no deja la prestación a la disponibilidad de medios."
  citation: "art. 85.1 LGT"
  difficulty: 1
  tags:
  - "deber"
  - "información"
# anchor: boe-a-2007-15984-art-62
- id: m03-l05-q0005
  prompt:
    es: "Según el artículo 62 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿de qué modo promueve y facilita la Administración tributaria el cumplimiento de las obligaciones y el ejercicio de los derechos?"
  options:
  - id: a
    correct: true
    text:
      es: "Poniendo a disposición de los obligados servicios de información y asistencia tributaria."
  - id: b
    text:
      es: "Remitiendo a cada obligado, antes de cada plazo, una comunicación individual con las fechas de sus deberes."
  - id: c
    text:
      es: "Exigiendo a los obligados que soliciten por escrito cada actuación de información que necesiten."
  - id: d
    text:
      es: "Delegando la información tributaria en los colegios y asociaciones de profesionales de la asesoría fiscal."
  explanation:
    es: "El artículo 62 del reglamento dice que la Administración promueve y facilita el cumplimiento y el ejercicio de derechos poniendo a disposición de los obligados servicios de información y asistencia tributaria. La norma no impone comunicaciones individuales previas a cada plazo, ni exige petición escrita, ni delega la tarea en los colegios profesionales, que participan por vía de la colaboración social."
  citation: "art. 62 RGAT"
  difficulty: 1
  tags:
  - "deber"
  - "información"
# anchor: boe-a-2003-23186-art-86
- id: m03-l05-q0006
  prompt:
    es: "Según el artículo 86.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el Ministerio de Hacienda difundirá por cualquier medio, durante el primer trimestre del año, los textos actualizados de las normas estatales en materia tributaria con rango de:"
  options:
  - id: a
    text:
      es: "ley y real decreto aprobados en cualquiera de los cinco años anteriores, hayan variado o no."
  - id: b
    text:
      es: "ley, real decreto y orden ministerial, con independencia de que se hayan modificado."
  - id: c
    correct: true
    text:
      es: "ley y real decreto en los que se hayan producido variaciones respecto de los textos vigentes en el año precedente."
  - id: d
    text:
      es: "ley orgánica y real decreto-ley únicamente, siempre que hayan variado en el año precedente."
  explanation:
    es: "El artículo 86.1 limita los textos actualizados a las normas estatales con rango de ley y real decreto que hayan variado respecto de los vigentes el año anterior. No exige remontarse cinco años, no alcanza a las órdenes ministeriales y no se circunscribe a las leyes orgánicas y los reales decretos-leyes."
  citation: "art. 86.1 LGT"
  difficulty: 2
  tags:
  - "publicación"
  - "texto"
# anchor: boe-a-2003-23186-art-86
- id: m03-l05-q0007
  prompt:
    es: "Además de los textos actualizados de las normas estatales, ¿qué difunde el Ministerio de Hacienda durante el primer trimestre del año, según el artículo 86.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Una relación de todas las disposiciones tributarias que se hayan aprobado en el año precedente."
  - id: b
    text:
      es: "Una relación de las disposiciones con rango de ley que hayan modificado tributos estatales."
  - id: c
    text:
      es: "Un informe con las disposiciones tributarias cuya aprobación se prevea para el año siguiente."
  - id: d
    text:
      es: "Una relación de las disposiciones tributarias autonómicas que hayan sido recurridas ante el Tribunal Constitucional."
  explanation:
    es: "El artículo 86.1 habla de una relación de «todas» las disposiciones tributarias aprobadas en el año, sin limitarla a las de rango de ley. Tampoco es un informe de las previstas para el año siguiente ni una relación de normas autonómicas recurridas."
  citation: "art. 86.1 LGT"
  difficulty: 1
  tags:
  - "publicación"
  - "contenido"
# anchor: boe-a-2003-23186-art-86
- id: m03-l05-q0008
  prompt:
    es: "¿Qué contestaciones a consultas y resoluciones económico-administrativas difundirá periódicamente el Ministerio de Hacienda, según el artículo 86.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Todas las dictadas durante el ejercicio anterior, sin excepción alguna."
  - id: b
    text:
      es: "Solo las que hayan sido confirmadas por una sentencia firme del Tribunal Supremo."
  - id: c
    text:
      es: "Las que soliciten por escrito los obligados tributarios a quienes afecten."
  - id: d
    correct: true
    text:
      es: "Las que considere de mayor trascendencia y repercusión."
  explanation:
    es: "El artículo 86.2 deja el criterio de selección al Ministerio: difunde las que considere de mayor trascendencia y repercusión. La ley no pide difundir todas, no exige una sentencia del Tribunal Supremo y no condiciona la difusión a la solicitud de los afectados."
  citation: "art. 86.2 LGT"
  difficulty: 1
  tags:
  - "publicación"
  - "contenido"
# anchor: boe-a-2003-23186-art-86
- id: m03-l05-q0009
  prompt:
    es: "En relación con las publicaciones del artículo 86 de la Ley 58/2003, de 17 de diciembre, General Tributaria, y de acuerdo con su apartado 4, señale la respuesta CORRECTA:"
  options:
  - id: a
    correct: true
    text:
      es: "El acceso a través de internet a estas publicaciones será, en todo caso, gratuito."
  - id: b
    text:
      es: "El acceso a estas publicaciones por internet será gratuito solo para los obligados tributarios identificados con certificado electrónico."
  - id: c
    text:
      es: "El acceso a estas publicaciones por internet podrá estar sujeto a una tasa que cubra el coste del servicio."
  - id: d
    text:
      es: "El acceso a estas publicaciones por internet será gratuito únicamente durante el primer trimestre de cada año."
  explanation:
    es: "El artículo 86.4 declara gratuito, en todo caso, el acceso por internet a las publicaciones. No lo limita a quienes tengan certificado electrónico, no permite una tasa y no lo restringe al primer trimestre, que es el plazo de difusión del apartado 1."
  citation: "art. 86.4 LGT"
  difficulty: 2
  tags:
  - "publicación"
  - "gratuidad"
# anchor: boe-a-2003-23186-art-87
- id: m03-l05-q0011
  prompt:
    es: "Conforme al artículo 87.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿a qué facilitará la Administración tributaria la consulta cuando informa a los contribuyentes de los criterios administrativos existentes para la aplicación de la normativa tributaria?"
  options:
  - id: a
    text:
      es: "Los expedientes de comprobación abiertos a otros contribuyentes del mismo sector."
  - id: b
    correct: true
    text:
      es: "Las bases informatizadas donde se contienen dichos criterios."
  - id: c
    text:
      es: "Los archivos donde consten los datos personales de los obligados de cada territorio."
  - id: d
    text:
      es: "Los registros de las consultas escritas presentadas por los obligados en el último año."
  explanation:
    es: "El artículo 87.1 hace que la Administración facilite la consulta a las bases informatizadas con los criterios administrativos. Los expedientes de otros contribuyentes, los datos personales de los obligados y los registros de consultas ajenas quedan protegidos por el carácter reservado de los datos del artículo 95."
  citation: "art. 87.1 LGT"
  difficulty: 1
  tags:
  - "información"
  - "criterios"
# anchor: boe-a-2003-23186-art-87
- id: m03-l05-q0012
  prompt:
    es: "Según el artículo 87.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el suministro del texto íntegro de consultas o resoluciones concretas:"
  options:
  - id: a
    text:
      es: "Se suministra de oficio a todos los obligados, con identificación del consultante para garantizar su autenticidad."
  - id: b
    correct: true
    text:
      es: "Se suministra a petición de los interesados, suprimiendo toda referencia a los datos que permitan identificar a las personas a las que afecten."
  - id: c
    text:
      es: "Se suministra a petición de los interesados, incluyendo los datos de identificación de las personas afectadas."
  - id: d
    text:
      es: "Se suministra únicamente a quien acredite ser parte en el procedimiento al que se refiera la resolución."
  explanation:
    es: "La Administración debe suministrar el texto íntegro a petición de los interesados y suprimir toda referencia que permita identificar a los afectados. No se entrega de oficio a todos, no se mantienen los datos de identificación y no se limita a quienes sean parte en el procedimiento."
  citation: "art. 87.2 LGT"
  difficulty: 2
  tags:
  - "información"
  - "datos"
# anchor: boe-a-2003-23186-art-87
- id: m03-l05-q0013
  prompt:
    es: "¿Sobre la tributación de qué podrá remitir comunicaciones informativas la Administración tributaria, según lo dispuesto en el artículo 87.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Territorios, regímenes especiales o tipos impositivos."
  - id: b
    correct: true
    text:
      es: "Sectores, actividades o fuentes de renta."
  - id: c
    text:
      es: "Sectores, previa solicitud escrita de cada obligado afectado."
  - id: d
    text:
      es: "Colectivos de obligados, previa autorización individual de cada uno."
  explanation:
    es: "El artículo 87.1 permite remitir comunicaciones sobre la tributación de determinados sectores, actividades o fuentes de renta. No lo condiciona a una solicitud escrita ni a una autorización individual, y la lista no habla de territorios, regímenes especiales ni tipos impositivos."
  citation: "art. 87.1 LGT"
  difficulty: 2
  tags:
  - "información"
  - "comunicaciones"
# anchor: boe-a-2007-15984-art-63
- id: m03-l05-q0015
  prompt:
    es: "De acuerdo con el artículo 63.3 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, señale la respuesta CORRECTA sobre la contestación a las solicitudes de información tributaria:"
  options:
  - id: a
    text:
      es: "Comunica los criterios administrativos existentes y puede ser objeto de recurso de reposición en el plazo de un mes."
  - id: b
    text:
      es: "Comunica criterios que vinculan a todos los órganos de la Administración tributaria y puede recurrirse ante el tribunal económico-administrativo."
  - id: c
    text:
      es: "Comunica los criterios existentes, que quedan fijados para el obligado durante tres meses desde su notificación."
  - id: d
    correct: true
    text:
      es: "Comunica los criterios administrativos existentes para la aplicación de la normativa tributaria y no puede ser objeto de recurso."
  explanation:
    es: "Según el artículo 63.3, la contestación comunica los criterios existentes y no puede ser objeto de recurso. No cabe reposición ni reclamación económico-administrativa, ni se le asigna el efecto vinculante de tres meses, que pertenece a la información previa sobre el valor de inmuebles del artículo 90.2 de la ley."
  citation: "art. 63.3 RGAT"
  difficulty: 2
  tags:
  - "información"
  - "recurso"
# anchor: boe-a-2007-15984-art-63
- id: m03-l05-q0016
  prompt:
    es: "Conforme al artículo 63.3 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, la falta de contestación a una solicitud de información tributaria en los plazos del artículo 64:"
  options:
  - id: a
    text:
      es: "implicará la aceptación de los criterios expresados en el escrito de solicitud."
  - id: b
    text:
      es: "implicará la aceptación de esos criterios, salvo que la Administración notifique después su rechazo."
  - id: c
    correct: true
    text:
      es: "no implicará la aceptación de los criterios expresados en el escrito de solicitud."
  - id: d
    text:
      es: "obligará a la Administración a contestar en el plazo adicional de un mes con efectos vinculantes."
  explanation:
    es: "El artículo 63.3 dice lo contrario de lo que sostienen quienes ven aceptados los criterios, con o sin posible rechazo posterior: el silencio no significa aceptarlos. Tampoco prevé un plazo adicional de un mes ni efectos vinculantes para una contestación tardía."
  citation: "art. 63.3 RGAT"
  difficulty: 2
  tags:
  - "información"
  - "silencio"
# anchor: boe-a-2007-15984-art-64
- id: m03-l05-q0017
  prompt:
    es: "Según el artículo 64.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿en qué plazo máximo se contestan las solicitudes de información tributaria formuladas por escrito que pueden contestarse a partir de los antecedentes existentes en el órgano competente?"
  options:
  - id: a
    correct: true
    text:
      es: "En tres meses, haciendo referencia en todo caso a la normativa aplicable al objeto de la solicitud."
  - id: b
    text:
      es: "En seis meses, haciendo referencia en todo caso a la normativa aplicable al objeto de la solicitud."
  - id: c
    text:
      es: "En quince días, haciendo referencia en todo caso a la doctrina administrativa vinculante."
  - id: d
    text:
      es: "En veinte días, haciendo referencia en todo caso a la normativa aplicable al objeto de la solicitud."
  explanation:
    es: "El artículo 64.1 fija tres meses y exige que la contestación haga referencia a la normativa aplicable. Seis meses es el plazo máximo general de resolución del artículo 104.1 de la ley, y veinte días es el de los certificados tributarios del artículo 73.1 del reglamento. La doctrina vinculante no forma parte del contenido exigido."
  citation: "art. 64.1 RGAT"
  difficulty: 2
  tags:
  - "información"
  - "plazo"
# anchor: boe-a-2003-23186-art-90
- id: m03-l05-q0019
  prompt:
    es: "El 20 de enero de 2026 se notifica a Raúl Ibarra la información sobre el valor de un inmueble que va a comprar. La solicitó antes de que finalizara el plazo de su autoliquidación y con datos verdaderos y suficientes. Según el artículo 90.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿hasta qué fecha tiene efectos vinculantes?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el 20 de abril de 2026."
  - id: b
    text:
      es: "Hasta el 20 de julio de 2026."
  - id: c
    text:
      es: "Hasta el 20 de enero de 2027."
  - id: d
    text:
      es: "Hasta el 20 de enero de 2029."
  explanation:
    es: "La información vincula tres meses desde la notificación (art. 90.2). Los plazos de meses se cuentan desde el día siguiente a la notificación y concluyen el mismo día del mes de vencimiento (art. 30.4 de la Ley 39/2015): el 20 de abril de 2026. Seis meses es el plazo general de resolución, doce meses es la validez de un certificado de obligaciones periódicas y tres años la vigencia de un acuerdo previo de valoración."
  citation: "art. 90.2 LGT"
  difficulty: 2
  tags:
  - "información previa"
  - "cómputo"
  - "plazo"
# anchor: boe-a-2003-23186-art-90
- id: m03-l05-q0020
  prompt:
    es: "De acuerdo con el artículo 90.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿tiene efectos vinculantes la información sobre el valor de un inmueble que se solicita una vez finalizado el plazo para presentar la autoliquidación?"
  options:
  - id: a
    text:
      es: "Sí, durante tres meses desde la notificación, porque basta que los datos aportados sean verdaderos."
  - id: b
    text:
      es: "Sí, durante seis meses desde la notificación, porque el plazo de la autoliquidación no condiciona el efecto."
  - id: c
    correct: true
    text:
      es: "No, porque la solicitud debía formularse antes de que finalizara el plazo para presentar la autoliquidación."
  - id: d
    text:
      es: "No, porque la información previa nunca tiene efectos vinculantes para la Administración que la facilita."
  explanation:
    es: "Los efectos vinculantes exigen que la solicitud se haya formulado antes de que finalice el plazo para presentar la autoliquidación o declaración y que los datos sean verdaderos y suficientes (art. 90.2). Falta el primer requisito. Tampoco basta la veracidad de los datos, y el plazo de vinculación nunca es de seis meses."
  citation: "art. 90.2 LGT"
  difficulty: 2
  tags:
  - "información previa"
  - "requisito"
# anchor: boe-a-2003-23186-art-90
- id: m03-l05-q0021
  prompt:
    es: "¿Desde cuándo se cuentan los tres meses durante los que tiene efectos vinculantes la información sobre el valor de un inmueble, según el artículo 90.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "La presentación de la solicitud por el interesado."
  - id: b
    text:
      es: "La finalización del plazo para presentar la autoliquidación."
  - id: c
    text:
      es: "La fecha en que el órgano competente valora el inmueble."
  - id: d
    correct: true
    text:
      es: "La notificación al interesado."
  explanation:
    es: "El artículo 90.2 cuenta los tres meses desde la notificación al interesado. La presentación de la solicitud, el fin del plazo de la autoliquidación y la fecha de valoración del inmueble no marcan el inicio."
  citation: "art. 90.2 LGT"
  difficulty: 1
  tags:
  - "información previa"
  - "cómputo"
# anchor: boe-a-2007-15984-art-69
- id: m03-l05-q0025
  prompt:
    es: "Según el artículo 69.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿cuándo tiene efectos vinculantes la información previa sobre el valor de un inmueble, en los términos del artículo 90.2 de la ley?"
  options:
  - id: a
    text:
      es: "Cuando la ha suministrado cualquier Administración tributaria, con independencia del tributo que grave la operación."
  - id: b
    correct: true
    text:
      es: "Cuando la ha suministrado la Administración gestora del tributo que grave la adquisición o la transmisión, respecto de inmuebles situados en su territorio."
  - id: c
    text:
      es: "Cuando la ha suministrado la Administración del territorio donde se otorgue la escritura, aunque el inmueble esté fuera."
  - id: d
    text:
      es: "Cuando la ha suministrado la Administración gestora del tributo, aunque el inmueble esté fuera de su territorio."
  explanation:
    es: "El artículo 69.1 exige que la información proceda de la Administración gestora del tributo que grave la operación y que el inmueble esté en su territorio. Aceptar la información de cualquier Administración con independencia del tributo, o la del lugar de la escritura, o la de la gestora respecto de inmuebles fuera de su territorio, prescinde de alguna de las dos condiciones."
  citation: "art. 69.1 RGAT"
  difficulty: 3
  tags:
  - "información previa"
  - "órgano"
# anchor: boe-a-2007-15984-art-69
- id: m03-l05-q0026
  prompt:
    es: "¿Por qué valor se determina la base imponible de los tributos a los que se limita la solicitud de información previa sobre inmuebles, según el artículo 69.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria?"
  options:
  - id: a
    text:
      es: "El valor catastral de dichos bienes."
  - id: b
    correct: true
    text:
      es: "El valor real de dichos bienes."
  - id: c
    text:
      es: "El precio consignado en la escritura de dichos bienes."
  - id: d
    text:
      es: "El valor de adquisición actualizado de dichos bienes."
  explanation:
    es: "El reglamento limita la solicitud a tributos cuya base imponible se determine por el valor real de los bienes. El valor catastral, el precio de la escritura o el valor de adquisición actualizado no son el criterio que fija el artículo 69.1."
  citation: "art. 69.1 RGAT"
  difficulty: 2
  tags:
  - "información previa"
  - "tributos"
# anchor: boe-a-2007-15984-art-69
- id: m03-l05-q0027
  prompt:
    es: "¿Qué plazo establece el artículo 69.6 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos, para contestar las solicitudes de información sobre el valor de bienes inmuebles?"
  options:
  - id: a
    correct: true
    text:
      es: "El plazo será de tres meses."
  - id: b
    text:
      es: "El plazo será de un mes."
  - id: c
    text:
      es: "El plazo será de seis meses."
  - id: d
    text:
      es: "El plazo será de diez días."
  explanation:
    es: "El artículo 69.6 fija tres meses para contestar. Seis meses es el plazo máximo general de resolución del artículo 104.1 de la ley, y diez días es el plazo de disconformidad con un certificado tributario."
  citation: "art. 69.6 RGAT"
  difficulty: 1
  tags:
  - "información previa"
  - "plazo"
# anchor: boe-a-2003-23186-art-91
- id: m03-l05-q0028
  prompt:
    es: "Según el artículo 91.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los obligados tributarios podrán solicitar que se determine con carácter previo y vinculante la valoración a efectos fiscales de:"
  options:
  - id: a
    text:
      es: "rentas, productos, bienes y sanciones, además de los elementos que determinen la deuda tributaria del obligado."
  - id: b
    text:
      es: "únicamente bienes inmuebles y vehículos que vayan a ser objeto de transmisión."
  - id: c
    text:
      es: "las deudas tributarias ya liquidadas y pendientes de ingreso en período voluntario."
  - id: d
    correct: true
    text:
      es: "rentas, productos, bienes, gastos y demás elementos determinantes de la deuda tributaria."
  explanation:
    es: "El objeto del acuerdo son rentas, productos, bienes, gastos y demás elementos determinantes de la deuda. No incluye las sanciones, no se limita a inmuebles y vehículos y no sirve para valorar deudas ya liquidadas."
  citation: "art. 91.1 LGT"
  difficulty: 2
  tags:
  - "acuerdo previo"
  - "objeto"
# anchor: boe-a-2003-23186-art-91
- id: m03-l05-q0030
  prompt:
    es: "¿Qué documento ha de acompañarse a la solicitud de un acuerdo previo de valoración presentada por el obligado tributario, según el artículo 91.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "La propuesta de valoración formulada por el obligado tributario."
  - id: b
    text:
      es: "La valoración pericial elaborada por un tasador independiente."
  - id: c
    text:
      es: "Un informe de la Administración sobre los valores medios de mercado."
  - id: d
    text:
      es: "La autoliquidación o declaración del tributo al que se refiera el acuerdo."
  explanation:
    es: "El artículo 91.2 exige acompañar la propuesta de valoración del propio obligado. No se pide una tasación pericial, un informe previo de la Administración ni la autoliquidación del tributo, que todavía no existe si no se ha realizado el hecho imponible."
  citation: "art. 91.2 LGT"
  difficulty: 1
  tags:
  - "acuerdo previo"
  - "solicitud"
# anchor: boe-a-2003-23186-art-91
- id: m03-l05-q0031
  prompt:
    es: "¿Qué podrá comprobar la Administración tributaria al tramitar una solicitud de acuerdo previo de valoración, según el artículo 91.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Únicamente la propuesta de valoración, sin entrar en los hechos declarados por el obligado."
  - id: b
    text:
      es: "Los elementos de hecho declarados, pero no las circunstancias que los acompañen."
  - id: c
    text:
      es: "Los datos de terceros relacionados con el objeto de la valoración propuesta."
  - id: d
    correct: true
    text:
      es: "Los elementos de hecho y las circunstancias declaradas por el obligado tributario."
  explanation:
    es: "El artículo 91.3 permite comprobar los elementos de hecho y las circunstancias declaradas. No se limita a la propuesta de valoración, no excluye las circunstancias y no habla de datos de terceros."
  citation: "art. 91.3 LGT"
  difficulty: 1
  tags:
  - "acuerdo previo"
  - "comprobación"
# anchor: boe-a-2003-23186-art-91
- id: m03-l05-q0032
  prompt:
    es: "Según el artículo 91.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué efecto produce la falta de contestación de la Administración, dentro del plazo fijado por la normativa del tributo, a la solicitud de un acuerdo previo de valoración?"
  options:
  - id: a
    text:
      es: "Se entiende denegada la solicitud y el obligado puede recurrir en reposición."
  - id: b
    text:
      es: "Se abre un plazo adicional de un mes para que la Administración emita el acuerdo."
  - id: c
    correct: true
    text:
      es: "Se entienden aceptados los valores propuestos por el obligado tributario."
  - id: d
    text:
      es: "Se entiende que la Administración renuncia a comprobar los hechos declarados."
  explanation:
    es: "Según el artículo 91.4, la falta de contestación en plazo implica aceptar los valores propuestos. No hay denegación presunta, no se abre un plazo adicional y la ley no dice que la Administración pierda la facultad de comprobar prevista en el artículo 91.3."
  citation: "art. 91.4 LGT"
  difficulty: 2
  tags:
  - "acuerdo previo"
  - "silencio"
# anchor: boe-a-2003-23186-art-91
- id: m03-l05-q0033
  prompt:
    es: "De acuerdo con el artículo 91.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué debe indicar también el acuerdo previo de valoración, además de la valoración, del supuesto de hecho al que se refiere y del impuesto al que se aplica?"
  options:
  - id: a
    correct: true
    text:
      es: "Su carácter vinculante."
  - id: b
    text:
      es: "Su carácter meramente informativo."
  - id: c
    text:
      es: "El órgano ante el que podrá recurrirse."
  - id: d
    text:
      es: "Su plazo de vigencia, que será siempre de cuatro años."
  explanation:
    es: "El contenido del acuerdo incluye su carácter vinculante. No es informativo, el artículo 91.4 no exige indicar el órgano de recurso y la vigencia máxima es de tres años salvo otra previsión, no cuatro."
  citation: "art. 91.4 LGT"
  difficulty: 1
  tags:
  - "acuerdo previo"
  - "contenido"
