# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q047
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes métodos abreviados de teclado maximiza la ventana activa?"
  options:
  - id: a
    correct: true
    text:
      es: "Windows+Flecha arriba"
  - id: b
    text:
      es: "Windows+Alt+Flecha arriba"
  - id: c
    text:
      es: "Windows+M"
  - id: d
    text:
      es: "Windows+Flecha izquierda"
  explanation:
    es: "La tabla de Microsoft asigna a Windows+Flecha arriba «Maximizar la ventana activa». Windows+Alt+Flecha arriba acopla la ventana a la mitad superior, Windows+M minimiza todas las ventanas y Windows+Flecha izquierda acopla la ventana al lado izquierdo."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q048
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes métodos abreviados de teclado minimiza todas las ventanas abiertas del escritorio?"
  options:
  - id: a
    text:
      es: "Windows+Inicio"
  - id: b
    text:
      es: "Windows+Mayús+M"
  - id: c
    correct: true
    text:
      es: "Windows+M"
  - id: d
    text:
      es: "Windows+Tab"
  explanation:
    es: "Windows+M sirve para «Minimizar todas las ventanas». Windows+Inicio minimiza o restaura todas excepto la activa, Windows+Mayús+M restaura las ventanas minimizadas y Windows+Tab abre la Vista de tareas."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q049
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes afirmaciones describe lo que hace el método abreviado de teclado Alt+F4?"
  options:
  - id: a
    correct: true
    text:
      es: "Cierra la ventana activa y, si no hay ventanas abiertas, solicita el cierre."
  - id: b
    text:
      es: "Cierra el documento activo de la aplicación, pero no toda la aplicación."
  - id: c
    text:
      es: "Cierra el escritorio virtual que se está usando en ese momento."
  - id: d
    text:
      es: "Cierra la pestaña activa, o la ventana si solo tiene una pestaña."
  explanation:
    es: "La tabla dice que Alt+F4 sirve para «Cerrar la ventana activa. Si no hay ventanas abiertas, solicite el cierre». Cerrar el documento activo sin cerrar la aplicación es Ctrl+F4, cerrar el escritorio en uso es Windows+Ctrl+F4, y cerrar la pestaña activa es Ctrl+W en el Explorador de archivos."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de Windows en general y para escritorio»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q050
  prompt:
    es: "En Windows 11, ¿qué método abreviado cambia entre ventanas abiertas y permite recorrer varias manteniendo pulsada su primera tecla y pulsando la segunda repetidamente?"
  options:
  - id: a
    text:
      es: "Windows+Tab"
  - id: b
    correct: true
    text:
      es: "Alt+Tab"
  - id: c
    text:
      es: "Ctrl+Tab"
  - id: d
    text:
      es: "Mayús+Tab"
  explanation:
    es: "La tabla dice que Alt+Tab sirve para «Cambiar entre ventanas abiertas» y que, para recorrer varias, se mantiene pulsada Alt y se pulsa el tabulador varias veces. Windows+Tab abre la Vista de tareas; en los cuadros de diálogo, Ctrl+Tab avanza por las pestañas y Mayús+Tab retrocede por las opciones."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de Windows en general y para escritorio»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q051
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes métodos abreviados de teclado abre la Vista de tareas?"
  options:
  - id: a
    text:
      es: "Alt+Tab"
  - id: b
    text:
      es: "Ctrl+Alt+Tab"
  - id: c
    text:
      es: "Windows+Ctrl+D"
  - id: d
    correct: true
    text:
      es: "Windows+Tab"
  explanation:
    es: "Windows+Tab sirve para «Abrir la Vista de tareas». Alt+Tab cambia entre ventanas abiertas, Ctrl+Alt+Tab muestra una miniatura de todas las aplicaciones abiertas y Windows+Ctrl+D crea otro escritorio."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q052
  prompt:
    es: "En Windows 11, ¿qué acción realiza el método abreviado de teclado Alt+Esc en el escritorio?"
  options:
  - id: a
    text:
      es: "Muestra una miniatura de todas las aplicaciones abiertas."
  - id: b
    text:
      es: "Abre el menú contextual de la ventana activa."
  - id: c
    correct: true
    text:
      es: "Se desplaza por las ventanas en el orden en que se abrieron."
  - id: d
    text:
      es: "Cierra la ventana activa o solicita el cierre del equipo."
  explanation:
    es: "La tabla asigna a Alt+Esc «Desplazarse por las ventanas en el orden en que se abrieron». La miniatura de todas las aplicaciones es Ctrl+Alt+Tab, el menú contextual de la ventana activa es Alt+Barra espaciadora y cerrar la ventana activa es Alt+F4."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de Windows en general y para escritorio»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q053
  prompt:
    es: "En Windows 11, ¿qué hace el método abreviado de teclado Windows+Inicio con las ventanas abiertas?"
  options:
  - id: a
    text:
      es: "Minimiza todas las ventanas, incluida la ventana activa."
  - id: b
    text:
      es: "Restaura todas las ventanas que estaban minimizadas."
  - id: c
    text:
      es: "Muestra el escritorio y lo vuelve a ocultar al repetirlo."
  - id: d
    correct: true
    text:
      es: "Minimiza o restaura todas las ventanas excepto la activa."
  explanation:
    es: "La tabla asigna a Windows+Inicio «Minimizar o restaurar todas las ventanas excepto la activa». Minimizar todas es Windows+M, restaurar las minimizadas es Windows+Mayús+M y mostrar y ocultar el escritorio es Windows+D."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q054
  prompt:
    es: "En Windows 11, con varios monitores conectados, ¿qué hace el método abreviado de teclado Windows+Mayús+Flecha izquierda?"
  options:
  - id: a
    text:
      es: "Acopla la ventana activa al lado izquierdo de la pantalla."
  - id: b
    correct: true
    text:
      es: "Mueve la ventana activa al monitor de la izquierda."
  - id: c
    text:
      es: "Cambia al escritorio virtual creado a la izquierda."
  - id: d
    text:
      es: "Selecciona caracteres hacia atrás desde la posición del cursor."
  explanation:
    es: "Windows+Mayús+Flecha izquierda sirve para mover la ventana activa al monitor de la izquierda. Acoplarla al lado izquierdo es Windows+Flecha izquierda, cambiar al escritorio de la izquierda es Windows+Ctrl+Flecha izquierda, y seleccionar caracteres hacia atrás es Mayús+Flecha izquierda."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q055
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes métodos abreviados de teclado acopla la ventana activa al lado izquierdo de la pantalla?"
  options:
  - id: a
    correct: true
    text:
      es: "Windows+Flecha izquierda"
  - id: b
    text:
      es: "Windows+Mayús+Flecha izquierda"
  - id: c
    text:
      es: "Windows+Ctrl+Flecha izquierda"
  - id: d
    text:
      es: "Alt+Flecha izquierda"
  explanation:
    es: "La tabla asigna a Windows+Flecha izquierda «Acoplar la ventana al lado izquierdo de la pantalla». Windows+Mayús+Flecha izquierda mueve la ventana al monitor de la izquierda, Windows+Ctrl+Flecha izquierda cambia al escritorio de la izquierda y Alt+Flecha izquierda sirve para volver."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-acoplar-html
- id: m06-l02-q056
  prompt:
    es: "En Windows 11, con Acoplar, ¿qué ocurre al arrastrar con el ratón una ventana hasta una esquina de la pantalla?"
  options:
  - id: a
    text:
      es: "Se acopla a la mitad izquierda o derecha de la pantalla."
  - id: b
    text:
      es: "Se expande verticalmente y mantiene su ancho actual."
  - id: c
    correct: true
    text:
      es: "Se acopla a ese cuarto de la pantalla."
  - id: d
    text:
      es: "Se minimiza y queda solo su icono en la barra de tareas."
  explanation:
    es: "La página dice: «Arrastra una ventana a una esquina para acoplarla a ese cuarto de la pantalla». La mitad izquierda o derecha se obtiene arrastrando al borde izquierdo o derecho, y la expansión vertical manteniendo el ancho, arrastrando a la parte superior; arrastrar a una esquina no minimiza la ventana."
  citation: "fuente: `ms-win-acoplar.html`; «Cómo usar Acoplar»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-acoplar-html
- id: m06-l02-q057
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes afirmaciones describe la opción «Maximizar verticalmente» de Acoplar?"
  options:
  - id: a
    text:
      es: "Al arrastrar la ventana a la parte superior, ocupa toda la pantalla en alto y en ancho."
  - id: b
    text:
      es: "Al arrastrar la ventana al borde izquierdo, ocupa todo el alto y mantiene su ancho actual."
  - id: c
    text:
      es: "Al arrastrar la ventana a una esquina, ocupa todo el alto y mantiene su ancho actual."
  - id: d
    correct: true
    text:
      es: "Al arrastrar la ventana a la parte superior, ocupa todo el alto y mantiene su ancho actual."
  explanation:
    es: "La página define «Maximizar verticalmente: arrastra una ventana a la parte superior de la pantalla para expandirla verticalmente, ocupando todo el alto y manteniendo su ancho actual». No ocupa también todo el ancho; arrastrar al borde izquierdo acopla la ventana a ese lado y arrastrarla a una esquina la acopla a un cuarto."
  citation: "fuente: `ms-win-acoplar.html`; «Cómo usar Acoplar»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-acoplar-html
- id: m06-l02-q058
  prompt:
    es: "En Windows 11, ¿qué ocurre al arrastrar la línea divisoria entre dos ventanas acopladas para cambiar el tamaño de una de ellas?"
  options:
  - id: a
    text:
      es: "Solo cambia la ventana arrastrada y queda espacio libre en la pantalla."
  - id: b
    correct: true
    text:
      es: "La ventana contigua cambia de tamaño para que no quede espacio sin usar."
  - id: c
    text:
      es: "Las dos ventanas se desacoplan y recuperan su tamaño anterior."
  - id: d
    text:
      es: "Las dos ventanas se maximizan verticalmente y mantienen su ancho."
  explanation:
    es: "La página dice que, al cambiar el tamaño de una ventana acoplada arrastrando el divisor, «las ventanas contiguas se cambiarán de tamaño para que quepan al lado para que no tengas espacio de pantalla desperdiciado». No queda espacio libre, las ventanas no se desacoplan y tampoco se maximizan verticalmente."
  citation: "fuente: `ms-win-acoplar.html`; «Cambiar el tamaño de las ventanas acopladas»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-acoplar-html
- id: m06-l02-q059
  prompt:
    es: "En Windows 11, para acoplar con el teclado la aplicación en la que se trabaja, se mantiene pulsada la tecla Windows y:"
  options:
  - id: a
    correct: true
    text:
      es: "Se usan las flechas para cambiar la posición y se suelta Windows al llegar a la deseada."
  - id: b
    text:
      es: "Se usan las flechas para cambiar la posición y se pulsa Esc al llegar a la deseada."
  - id: c
    text:
      es: "Se pulsa Tab para recorrer las posiciones y se pulsa Entrar al llegar a la deseada."
  - id: d
    text:
      es: "Se pulsa la barra espaciadora para recorrer las posiciones hasta la deseada."
  explanation:
    es: "La página dice que se mantiene pulsada la tecla Windows y se usan las flechas para cambiar la posición del acoplamiento; «cuando encuentre la ubicación deseada, suelte la tecla del logotipo de Windows para colocar la ventana». Esc, Tab con Entrar o la barra espaciadora no son el procedimiento que describe."
  citation: "fuente: `ms-win-acoplar.html`; «Acoplar con un teclado»"
  difficulty: 2
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-win-acoplar-html
- id: m06-l02-q060
  prompt:
    es: "Señale cuál de las siguientes afirmaciones sobre los grupos de acoplamiento de Windows 11 es correcta:"
  options:
  - id: a
    text:
      es: "Se crean a mano desde la sección Multitarea de la aplicación Configuración."
  - id: b
    text:
      es: "Se muestran en la Vista de tareas, pero no al pasar el puntero por la barra de tareas."
  - id: c
    correct: true
    text:
      es: "Se crean automáticamente al acoplar varias ventanas."
  - id: d
    text:
      es: "Se pierden en cuanto se abre una nueva aplicación encima de ellos."
  explanation:
    es: "La página dice que los grupos de acoplamiento «se crean automáticamente al acoplar varias ventanas». No se crean a mano; se recuperan pasando el puntero por el icono de la barra de tareas y también se muestran en la Vista de tareas; y, si se abre otra aplicación, se puede volver al grupo."
  citation: "fuente: `ms-win-acoplar.html`; «Grupos de acoplamiento»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-acoplar-html
- id: m06-l02-q101
  prompt:
    es: "En Windows 11, ¿qué aparece al mantener el puntero del ratón sobre el botón Maximizar de una ventana abierta?"
  options:
  - id: a
    text:
      es: "La Vista de tareas, con miniaturas de las aplicaciones activas"
  - id: b
    text:
      es: "La lista de accesos directos de la aplicación de esa ventana"
  - id: c
    correct: true
    text:
      es: "El menú flotante Acoplar, con los diseños de ajuste disponibles"
  - id: d
    text:
      es: "El menú contextual de la ventana activa, con sus comandos"
  explanation:
    es: "La página dice que «el control flotante Acoplar aparece al mantener el puntero sobre el botón Maximizar en una ventana» y que en él se elige un diseño. La Vista de tareas con miniaturas se abre con su botón de la barra de tareas o con Windows+Tab. La lista de accesos directos sale al hacer clic con el botón derecho en el icono de la aplicación en la barra de tareas. El menú contextual de la ventana activa se abre con Alt+Barra espaciadora."
  citation: "fuente: `ms-win-acoplar.html`; «Menú flotante Acoplar»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q102
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes combinaciones de teclas abre los diseños de ajuste para colocar la ventana activa?"
  options:
  - id: a
    text:
      es: "Windows+Tab"
  - id: b
    correct: true
    text:
      es: "Windows+Z"
  - id: c
    text:
      es: "Windows+X"
  - id: d
    text:
      es: "Windows+Flecha arriba"
  explanation:
    es: "La tabla de métodos abreviados con la tecla Windows asigna a Windows+Z «Abrir los diseños de ajuste». En la misma tabla, Windows+Tab abre la Vista de tareas, Windows+X abre el menú Vínculo rápido y Windows+Flecha arriba maximiza la ventana activa."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-acoplar-html
- id: m06-l02-q103
  prompt:
    es: "En Windows 11, después de elegir uno de los diseños de ajuste para una ventana, ¿qué función ayuda a rellenar el resto del diseño con otras ventanas?"
  options:
  - id: a
    correct: true
    text:
      es: "El Asistente para el ajuste"
  - id: b
    text:
      es: "Los grupos de acoplamiento"
  - id: c
    text:
      es: "El control flotante Acoplar"
  - id: d
    text:
      es: "La barra de ajuste"
  explanation:
    es: "Según la página, «después de seleccionar un diseño, se invoca» el asistente «para ayudarte a rellenar el resto del diseño con otras ventanas»; la página lo nombra de varias formas y el nombre que se usa aquí es Asistente para el ajuste. Los grupos de acoplamiento son las colecciones de ventanas ya acopladas, que permiten volver a esa disposición. El control flotante Acoplar, que aparece sobre el botón Maximizar, es donde se elige el diseño, no lo que lo rellena. La barra de ajuste es otra forma de elegir un diseño: aparece al arrastrar una ventana a la parte superior de la pantalla."
  citation: "fuente: `ms-win-acoplar.html`; «Diseños de ajuste»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-acoplar-html
- id: m06-l02-q104
  prompt:
    es: "En Windows 11, al acoplar una ventana a un lado de la pantalla, ¿cuál de las siguientes cosas muestra el Asistente para el ajuste?"
  options:
  - id: a
    text:
      es: "Miniaturas de las ventanas minimizadas, para restaurarlas todas a la vez"
  - id: b
    text:
      es: "Miniaturas de los escritorios creados, para mover la ventana a otro de ellos"
  - id: c
    text:
      es: "Una barra con los diseños predeterminados en la parte superior de la pantalla"
  - id: d
    correct: true
    text:
      es: "Miniaturas de las otras ventanas abiertas, para elegir cuál acoplar al otro lado"
  explanation:
    es: "La página dice que, «al acoplar una ventana a un lado de la pantalla», el asistente «mostrará miniaturas de las otras ventanas abiertas» para elegir «qué ventana acoplar al otro lado». Restaurar las ventanas minimizadas es lo que hace Windows+Mayús+M. Los escritorios creados se ven en la Vista de tareas, no en el asistente. La barra con diseños en la parte superior es la barra de ajuste, que aparece al arrastrar una ventana hacia arriba."
  citation: "fuente: `ms-win-acoplar.html`; «Asistente para ajustar»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-acoplar-html
- id: m06-l02-q105
  prompt:
    es: "En Windows 11, ¿en qué página de Configuración está el botón de alternancia Ajustar ventanas, que activa o desactiva la función Acoplar?"
  options:
  - id: a
    text:
      es: "Configuración › Personalización › Inicio"
  - id: b
    text:
      es: "Configuración › Accesibilidad › Teclado"
  - id: c
    correct: true
    text:
      es: "Configuración › Sistema › Multitarea"
  - id: d
    text:
      es: "Configuración › Sistema › Notificaciones"
  explanation:
    es: "La página manda abrir Multitarea, dentro de Sistema, y dice: «Use el botón de alternancia Ajustar ventanas para activar o desactivar Acoplar». Personalización › Inicio es donde la página de la barra de tareas manda activar la opción de mostrar elementos abiertos recientemente en las listas de accesos directos. Accesibilidad › Teclado es otra página de Configuración, sin relación con Acoplar. Sistema › Notificaciones configura las notificaciones."
  citation: "fuente: `ms-win-acoplar.html`; «seleccione Multitarea del sistema > o use el vínculo siguiente:»"
  difficulty: 1
  tags:
  - "ofimática-menú"
  - "configuración"
# anchor: fuente-ms-win-acoplar-html
- id: m06-l02-q106
  prompt:
    es: "En Windows 11, en la sección Ajustar ventanas de la configuración de Multitarea, ¿cuál de las siguientes casillas habilita o deshabilita la barra de ajuste?"
  options:
  - id: a
    text:
      es: "Mostrar diseños de ajuste al mantener el puntero sobre el botón de maximización de una ventana"
  - id: b
    text:
      es: "Cuando acoplo una ventana, mostrar lo que puedo ajustar junto a ella"
  - id: c
    correct: true
    text:
      es: "Mostrar diseños de ajuste al arrastrar una ventana a la parte superior de la pantalla"
  - id: d
    text:
      es: "Cuando arrastro una ventana, permítanme acoplarla sin arrastrarla hasta el borde de la pantalla"
  explanation:
    es: "La página asigna a «Mostrar diseños de ajuste al arrastrar una ventana a la parte superior de la pantalla» la función de habilitar o deshabilitar la barra de ajuste. La casilla del botón de maximización controla el control flotante Acoplar. «Cuando acoplo una ventana, mostrar lo que puedo ajustar junto a ella» controla el Asistente para el ajuste. La casilla «Cuando arrastro una ventana, permítanme acoplarla…» permite acoplar sin llegar al borde de la pantalla."
  citation: "fuente: `ms-win-acoplar.html`; «Configurar los ajustes de acoplamiento»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-acoplar-html
- id: m06-l02-q107
  prompt:
    es: "En Windows 11, ¿qué son los grupos de acoplamiento que aparecen al trabajar con la función Acoplar en el escritorio?"
  options:
  - id: a
    text:
      es: "Conjuntos de diseños de ajuste que cambian según el tamaño de la pantalla"
  - id: b
    correct: true
    text:
      es: "Colecciones de ventanas acopladas que permiten volver a esa disposición"
  - id: c
    text:
      es: "Escritorios adicionales creados en la Vista de tareas para separar ventanas"
  - id: d
    text:
      es: "Ventanas minimizadas que Windows+Mayús+M restaura todas a la vez"
  explanation:
    es: "La página define los grupos de acoplamiento como «colecciones de ventanas que se han acoplado», que permiten «volver rápidamente a una disposición específica de ventanas». Que los diseños cambien con el tamaño de la pantalla es una nota sobre los diseños de ajuste, no sobre los grupos. Los escritorios adicionales son otra función de la Vista de tareas. Windows+Mayús+M restaura las ventanas minimizadas, sin relación con los grupos."
  citation: "fuente: `ms-win-acoplar.html`; «Grupos de acoplamiento»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-acoplar-html
- id: m06-l02-q108
  prompt:
    es: "Señale la afirmación correcta sobre cómo se crean los grupos de acoplamiento en Windows 11:"
  options:
  - id: a
    text:
      es: "Se crean solo al elegir un diseño con la combinación Windows+Z"
  - id: b
    correct: true
    text:
      es: "Se crean solos al acoplar varias ventanas, sin pasos adicionales"
  - id: c
    text:
      es: "Se crean al mover varias ventanas a otro escritorio de la Vista de tareas"
  - id: d
    text:
      es: "Se crean al anclar varias aplicaciones a la barra de tareas"
  explanation:
    es: "La página dice que los grupos «se crean automáticamente al acoplar varias ventanas», sin ningún esfuerzo adicional. Windows+Z no es la única vía: acoplar varias ventanas basta, y los diseños de ajuste son solo uno de los métodos de acoplar que la página enumera. Mover ventanas a otro escritorio no crea el grupo: la Vista de tareas es donde la página dice que los grupos se muestran. Y anclar aplicaciones a la barra de tareas tampoco: la barra de tareas es donde se mantiene el puntero sobre un icono para restaurar un grupo que ya existe."
  citation: "fuente: `ms-win-acoplar.html`; «Grupos de acoplamiento»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-acoplar-html
- id: m06-l02-q109
  prompt:
    es: "En Windows 11, si se abre otra aplicación después de acoplar varias ventanas, ¿cómo se vuelve al grupo de acoplamiento que formaban?"
  options:
  - id: a
    correct: true
    text:
      es: "Manteniendo el puntero sobre el icono de una de sus aplicaciones en la barra"
  - id: b
    text:
      es: "Haciendo clic con el botón derecho en un área vacía del escritorio y eligiendo Ver"
  - id: c
    text:
      es: "Pulsando Windows+Ctrl+D para crear otro escritorio con esas mismas ventanas"
  - id: d
    text:
      es: "Seleccionando el área pequeña de la esquina más alejada de la barra de tareas"
  explanation:
    es: "Según la página, basta con mantener «el puntero sobre cualquier icono de aplicación en la barra de tareas que forme parte de un grupo de Acoplar» para restaurar todo el grupo o solo esa aplicación. El menú Ver del escritorio cambia el tamaño de los iconos. Windows+Ctrl+D crea otro escritorio. El área de la esquina de la barra de tareas da acceso al escritorio minimizando las ventanas abiertas."
  citation: "fuente: `ms-win-acoplar.html`; «Grupos de acoplamiento»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q110
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes combinaciones de teclas abre el menú contextual de la ventana que está activa en ese momento?"
  options:
  - id: a
    text:
      es: "Ctrl+Barra espaciadora"
  - id: b
    text:
      es: "Windows+Barra espaciadora"
  - id: c
    text:
      es: "Alt+Tab"
  - id: d
    correct: true
    text:
      es: "Alt+Barra espaciadora"
  explanation:
    es: "La tabla general asigna a Alt+Barra espaciadora «Abrir el menú contextual de la ventana activa». En la misma página, Ctrl+Barra espaciadora habilita o deshabilita el Editor de métodos de entrada para chino, Windows+Barra espaciadora avanza entre los idiomas de entrada y las distribuciones del teclado, y Alt+Tab cambia entre ventanas abiertas."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de Windows en general y para escritorio»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q111
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué combinación de teclas muestra el menú contextual del elemento que está seleccionado?"
  options:
  - id: a
    text:
      es: "Alt+Entrar"
  - id: b
    text:
      es: "F10"
  - id: c
    text:
      es: "Alt+P"
  - id: d
    correct: true
    text:
      es: "Mayús+F10"
  explanation:
    es: "La tabla del Explorador de archivos asigna a Mayús+F10 «Mostrar el menú contextual del elemento seleccionado». Alt+Entrar muestra las propiedades del elemento, F10 activa la barra de menús de la ventana activa y Alt+P muestra u oculta el panel de vista previa."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
