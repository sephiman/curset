# Tax-part summaries, batch 2 (III.3–III.6), staged for the blind check.
m03-l03: 'El derecho tributario de la LGT parte de sus principios y fuentes y define los tributos y sus clases: tasas, contribuciones
  especiales e impuestos. La obligación tributaria principal nace con el devengo del hecho imponible y se cuantifica con la
  base imponible, la base liquidable, el tipo de gravamen y las cuotas. La deuda tributaria la integra la cuota y, en su caso,
  el interés de demora y los recargos, entre ellos los del artículo 27 por declaración extemporánea.'
m03-l04: Entre las obligaciones tributarias formales están las de presentar declaraciones censales, solicitar y utilizar el
  número de identificación fiscal, llevar y conservar libros de contabilidad y registros, y expedir y entregar facturas. La
  LGT reconoce los derechos y garantías de los obligados tributarios y regula los sujetos pasivos, los sucesores, los responsables,
  la capacidad de obrar, la representación y el domicilio fiscal. Los derechos del artículo 66 de la LGT prescriben a los
  cuatro años, con reglas propias de cómputo e interrupción.
m03-l05: La Administración informa y asiste a los obligados tributarios mediante publicaciones, comunicaciones, contestaciones
  a consultas escritas, actuaciones previas de valoración y asistencia en sus declaraciones, entre otras actuaciones, y los
  datos con trascendencia tributaria tienen carácter reservado. Los procedimientos tributarios siguen normas comunes de iniciación,
  desarrollo y terminación, y su resolución se notifica en el plazo que fija la normativa de cada uno, que no puede exceder
  de seis meses salvo norma con rango de ley o normativa comunitaria europea y que es de seis meses si no se fija. Las notificaciones
  siguen las normas administrativas generales con las especialidades de los artículos 109 a 112 de la LGT.
m03-l06: La declaración tributaria es todo documento presentado ante la Administración tributaria donde se reconozca o manifieste
  la realización de cualquier hecho relevante para la aplicación de los tributos. Las autoliquidaciones y las comunicaciones
  de datos son declaraciones, y caben autoliquidaciones complementarias y declaraciones o comunicaciones complementarias o
  sustitutivas. Los pagos a cuenta son las retenciones, los ingresos a cuenta y los pagos fraccionados; los del IRPF los regulan
  su ley y su reglamento, y los del IS, su ley.
