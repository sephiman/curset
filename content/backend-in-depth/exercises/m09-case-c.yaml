  - id: b
    text:
      en: 2.2.0
  - id: c
    text:
      en: 3.0.0
  - id: d
    text:
      en: 2.8.0
  explanation:
    en: Since version 2.7.3, Spring for Apache Kafka provides `ExponentialBackOffWithMaxRetries`, which receives
      `maxRetries` and calculates `maxElapsedTime`. Version 2.2.0 is wrong, because `ExponentialBackOffWithMaxRetries`
      has been provided since 2.7.3. Version 3.0.0 is wrong, because `ExponentialBackOffWithMaxRetries` has been
      provided since 2.7.3. Version 2.8.0 is wrong, because `ExponentialBackOffWithMaxRetries` has been provided
      since 2.7.3.
  citation: spring-kafka-error-handling#exp-backoff
- id: m09-case-c-q16
  lesson: m09-l04
  prompt:
    en: A notification pipeline needs exactly-once processing and wants to stay inside the Kafka ecosystem. Where
      does Kafka support exactly-once delivery, according to its design documentation?
  options:
  - id: a
    text:
      en: In any consumer that calls an external provider
  - id: b
    correct: true
    text:
      en: In Kafka Streams
  - id: c
    text:
      en: In a plain consumer that saves its position before processing
  - id: d
    text:
      en: In a plain consumer that saves its position after processing
  explanation:
    en: Kafka supports exactly-once delivery in Kafka Streams. Any consumer calling a provider is wrong, because
      exactly-once delivery to other destination systems generally requires cooperation with such systems. Saving
      the position first is wrong, because that order gives at-most-once semantics. Saving the position last is
      wrong, because that order gives at-least-once semantics.
  citation: kafka-design#message-delivery-semantics
