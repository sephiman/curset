# anchor: boe-a-2006-20764-art-97
- id: m03-l16-q0150
  prompt:
    es: "Según el artículo 97.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el ingreso del importe resultante de la autoliquidación solo se puede fraccionar:"
  options:
  - id: a
    text:
      es: "en la forma que se determine en la Ley General Tributaria."
  - id: b
    text:
      es: "en tres plazos de igual importe, a elección del contribuyente."
  - id: c
    text:
      es: "en la forma que solicite el contribuyente, previa garantía."
  - id: d
    correct: true
    text:
      es: "en la forma que se determine en el reglamento de desarrollo de la ley."
  explanation:
    es: "El fraccionamiento del ingreso solo es posible en la forma que fije el reglamento de desarrollo de la propia ley (art. 97.2). La Ley General Tributaria no es la norma a la que remite el precepto. Y la ley no reconoce un fraccionamiento libre en tres plazos ni a petición del contribuyente con garantía."
  citation: "art. 97.2 LIRPF"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2006-20764-art-97
- id: m03-l16-q0151
  prompt:
    es: "Pedro Ruiz y Marta Sanz son cónyuges no separados legalmente y ambos están obligados a declarar. La autoliquidación de Pedro resulta a ingresar 800 euros y la de Marta, a devolver 500 euros, del mismo período impositivo. Se cumplen los demás requisitos. Conforme al artículo 97.6 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿por qué cuantía máxima puede Pedro solicitar la suspensión del ingreso, sin intereses de demora?"
  options:
  - id: a
    text:
      es: "800 euros, importe íntegro de la deuda de Pedro."
  - id: b
    text:
      es: "300 euros, diferencia entre la deuda y la devolución."
  - id: c
    correct: true
    text:
      es: "500 euros, igual a la devolución a la que tiene derecho Marta."
  - id: d
    text:
      es: "1.300 euros, suma de la deuda y la devolución."
  explanation:
    es: "La suspensión se pide en una cuantía igual o inferior a la devolución a la que tiene derecho el cónyuge (art. 97.6), es decir, hasta 500 euros. Pedir los 800 euros supera esa devolución. Los 300 euros que quedarían como diferencia no son el límite de la suspensión, sino el resto de la deuda que se paga o fracciona. Y sumar deuda y devolución no tiene apoyo en el texto."
  citation: "art. 97.6 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2006-20764-art-97
- id: m03-l16-q0152
  prompt:
    es: "De acuerdo con el artículo 97.6 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, para obtener la suspensión cautelar del ingreso, el cónyuge cuya autoliquidación resulte a devolver debe:"
  options:
  - id: a
    text:
      es: "solicitar el aplazamiento de su propia devolución durante seis meses y acreditar que la deuda de su cónyuge está garantizada por un aval bancario."
  - id: b
    text:
      es: "ingresar previamente la deuda de su cónyuge y pedir después su devolución."
  - id: c
    correct: true
    text:
      es: "renunciar al cobro de la devolución hasta el importe de la deuda cuya suspensión se solicita y aceptar que se aplique al pago de dicha deuda."
  - id: d
    text:
      es: "avalar la deuda de su cónyuge ante la Administración tributaria."
  explanation:
    es: "El cónyuge con devolución debe renunciar a cobrarla hasta el importe de la deuda suspendida y aceptar que se aplique a su pago (art. 97.6.a). Aplazar su devolución, adelantar el ingreso de la deuda ajena o avalarla no son requisitos del precepto."
  citation: "art. 97.6 LIRPF"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-97
- id: m03-l16-q0153
  prompt:
    es: "Según el artículo 97.6 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre los requisitos de la suspensión cautelar del ingreso de la deuda tributaria:"
  options:
  - id: a
    text:
      es: "La deuda y la devolución pueden corresponder a períodos impositivos distintos, siempre que sean consecutivos."
  - id: b
    correct: true
    text:
      es: "La deuda cuya suspensión se solicita y la devolución pretendida deben corresponder al mismo período impositivo."
  - id: c
    text:
      es: "Los cónyuges deben estar acogidos al sistema de cuenta corriente tributaria."
  - id: d
    text:
      es: "Las autoliquidaciones de los cónyuges pueden presentarse en momentos distintos mientras no haya liquidación provisional."
  explanation:
    es: "El requisito de la letra b) es que la deuda y la devolución correspondan al mismo período impositivo. Admitir períodos consecutivos lo amplía. La letra d) exige lo contrario de estar acogidos a la cuenta corriente tributaria: los cónyuges no pueden estarlo. Y la letra c) obliga a presentar ambas autoliquidaciones de forma simultánea."
  citation: "art. 97.6 LIRPF"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-97
- id: m03-l16-q0154
  prompt:
    es: "Conforme al artículo 97.6.c) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, para la suspensión cautelar del ingreso las autoliquidaciones de ambos cónyuges deben presentarse:"
  options:
  - id: a
    correct: true
    text:
      es: "de forma simultánea dentro del plazo de presentación."
  - id: b
    text:
      es: "de forma sucesiva, primero la del cónyuge con derecho a devolución."
  - id: c
    text:
      es: "de forma sucesiva, primero la del cónyuge que debe ingresar."
  - id: d
    text:
      es: "en plazos distintos para cada cónyuge."
  explanation:
    es: "Ambas autoliquidaciones deben presentarse de forma simultánea dentro del plazo establecido (art. 97.6.c). Presentarlas sucesivamente, en cualquier orden, o en plazos distintos contradice la simultaneidad que exige la letra."
  citation: "art. 97.6 LIRPF"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-97
- id: m03-l16-q0155
  prompt:
    es: "De acuerdo con el artículo 97.6.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el sistema de cuenta corriente tributaria en la suspensión cautelar del ingreso:"
  options:
  - id: a
    text:
      es: "Los cónyuges deben estar acogidos al sistema de cuenta corriente tributaria."
  - id: b
    text:
      es: "Basta con que uno de los cónyuges esté acogido al sistema de cuenta corriente tributaria."
  - id: c
    text:
      es: "La cuenta corriente tributaria solo impide la suspensión si la deuda supera 1.000 euros."
  - id: d
    correct: true
    text:
      es: "Los cónyuges no pueden estar acogidos al sistema de cuenta corriente tributaria."
  explanation:
    es: "Es requisito que los cónyuges no estén acogidos a la cuenta corriente tributaria (art. 97.6.d). Exigirla, o bastar con que uno la tenga, invierte la regla. Y la ley no fija un importe de 1.000 euros a partir del cual la cuenta corriente impida la suspensión."
  citation: "art. 97.6 LIRPF"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-97
- id: m03-l16-q0156
  prompt:
    es: "Según el artículo 97.6 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál de los siguientes NO es un requisito para obtener la suspensión cautelar del ingreso de la deuda tributaria?"
  options:
  - id: a
    text:
      es: "Que los cónyuges estén al corriente en el pago de sus obligaciones tributarias."
  - id: b
    text:
      es: "Que la deuda y la devolución correspondan al mismo período impositivo."
  - id: c
    text:
      es: "Que el cónyuge con devolución renuncie a su cobro hasta el importe de la deuda."
  - id: d
    correct: true
    text:
      es: "Que los cónyuges hayan optado por la tributación conjunta."
  explanation:
    es: "Los requisitos del artículo 97.6 son cinco y la lista es cerrada: renuncia del cónyuge con devolución, mismo período, presentación simultánea, no estar en cuenta corriente tributaria y estar al corriente de obligaciones. Optar por la tributación conjunta no figura entre ellos, y de hecho cada cónyuge presenta su autoliquidación. La renuncia del cónyuge con devolución, el mismo período y estar al corriente de las obligaciones tributarias sí son requisitos."
  citation: "art. 97.6 LIRPF"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-97
- id: m03-l16-q0158
  prompt:
    es: "Conforme al artículo 97.6 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre el acuerdo que adopte la Administración respecto de la suspensión del ingreso:"
  options:
  - id: a
    text:
      es: "Se notifica solo al cónyuge que solicitó la suspensión, con expresión de la deuda extinguida, y al otro cónyuge únicamente si lo solicita expresamente a la Administración."
  - id: b
    correct: true
    text:
      es: "Se notifica a ambos cónyuges, con expresión, en su caso, de la deuda extinguida y de las devoluciones o ingresos adicionales que procedan."
  - id: c
    text:
      es: "Se notifica a ambos cónyuges, sin necesidad de expresar la deuda extinguida."
  - id: d
    text:
      es: "Se notifica solo al cónyuge con derecho a devolución."
  explanation:
    es: "El acuerdo se notifica a ambos cónyuges y expresa, en su caso, la deuda extinguida y las devoluciones o ingresos adicionales que procedan (art. 97.6). Notificar solo a uno de ellos, o prescindir de esa expresión, no cumple el precepto."
  citation: "art. 97.6 LIRPF"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2006-20764-art-98
- id: m03-l16-q0160
  prompt:
    es: "De acuerdo con el artículo 98.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la Administración tributaria puede poner a disposición de los contribuyentes un borrador de declaración:"
  options:
  - id: a
    correct: true
    text:
      es: "a efectos meramente informativos, sin perjuicio del cumplimiento de lo dispuesto en el artículo 97.1."
  - id: b
    text:
      es: "con carácter vinculante para el contribuyente, que debe suscribirlo en todo caso."
  - id: c
    text:
      es: "con carácter obligatorio para todos los contribuyentes que no hayan presentado declaración."
  - id: d
    text:
      es: "a efectos de liquidación definitiva, sin necesidad de declaración posterior."
  explanation:
    es: "El borrador se pone a disposición a efectos meramente informativos, sin perjuicio de la obligación del artículo 97.1 (art. 98.1). No es vinculante, ni obligatorio para todos, ni sustituye a la declaración."
  citation: "art. 98.1 LIRPF"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2006-20764-art-98
- id: m03-l16-q0161
  prompt:
    es: "Conforme al artículo 98.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la falta de recepción del borrador de declaración:"
  options:
  - id: a
    text:
      es: "Exonera al contribuyente de presentar declaración en ese período impositivo."
  - id: b
    text:
      es: "Obliga a la Administración a practicar liquidación provisional de oficio."
  - id: c
    text:
      es: "Solo exonera al contribuyente si sus rentas no superan 22.000 euros."
  - id: d
    correct: true
    text:
      es: "No exonera al contribuyente del cumplimiento de su obligación de presentar declaración."
  explanation:
    es: "Aunque no se reciba el borrador, el contribuyente sigue obligado a presentar declaración (art. 98.3). Ni lo exonera, ni obliga a liquidar de oficio, ni existe una excepción por rentas inferiores a 22.000 euros."
  citation: "art. 98.3 LIRPF"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2006-20764-art-98
- id: m03-l16-q0162
  prompt:
    es: "Según el artículo 98.4 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, cuando el contribuyente considera que el borrador refleja su situación tributaria y lo suscribe o confirma, el borrador:"
  options:
  - id: a
    text:
      es: "se convierte en liquidación provisional practicada por la Administración."
  - id: b
    text:
      es: "debe complementarse con una declaración ordinaria presentada en el mismo plazo."
  - id: c
    correct: true
    text:
      es: "tiene la consideración de declaración por el impuesto a los efectos del artículo 97.1."
  - id: d
    text:
      es: "solo produce efectos si lo suscriben ambos cónyuges."
  explanation:
    es: "El borrador suscrito o confirmado tiene la consideración de declaración por el impuesto a los efectos del artículo 97.1 (art. 98.4). No equivale a una liquidación provisional, no requiere una declaración adicional y no exige la firma de ambos cónyuges."
  citation: "art. 98.4 LIRPF"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2006-20764-art-98
- id: m03-l16-q0164
  prompt:
    es: "Conforme al artículo 98.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, entre las fuentes de renta que permiten poner a disposición el borrador figuran las ganancias patrimoniales sometidas a retención o ingreso a cuenta, así como:"
  options:
  - id: a
    text:
      es: "las ganancias obtenidas en la transmisión de la segunda vivienda."
  - id: b
    correct: true
    text:
      es: "las subvenciones para la adquisición de vivienda habitual."
  - id: c
    text:
      es: "las pérdidas patrimoniales de ejercicios anteriores pendientes de compensar."
  - id: d
    text:
      es: "las rentas exentas con progresividad por convenios para evitar la doble imposición."
  explanation:
    es: "La letra c) añade a las ganancias sometidas a retención las subvenciones para la adquisición de vivienda habitual. La segunda vivienda, las pérdidas pendientes de compensar y las rentas exentas con progresividad no figuran en esa lista."
  citation: "art. 98.1 LIRPF"
  difficulty: 2
  tags:
  - "lista"
