  difficulty: 1
  tags:
  - "bienes de inversión"
  - "regularización"
# anchor: boe-a-1992-28740-art-109
- id: m03-l19-q0164
  prompt:
    es: "Conforme al artículo 109.3.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la diferencia, positiva o negativa, entre la deducción que procedería y la efectuada se divide por cinco o, tratándose de terrenos o edificaciones, por:"
  options:
  - id: a
    text:
      es: "cuatro, y el cociente es la cuantía del ingreso o de la deducción complementarios a efectuar."
  - id: b
    text:
      es: "nueve, y el cociente es la cuantía del ingreso o de la deducción complementarios a efectuar."
  - id: c
    text:
      es: "diez, y el cociente es la cuantía del ingreso o de la deducción de la primera regularización."
  - id: d
    correct: true
    text:
      es: "diez, y el cociente es la cuantía del ingreso o de la deducción complementarios a efectuar."
  explanation:
    es: "El divisor es cinco, o diez en terrenos y edificaciones: se reparte la diferencia entre el año de la operación y los cuatro o nueve siguientes. Nueve y cuatro son la duración de los períodos, no el divisor, y el cociente no es la deducción de la primera regularización."
  citation: "art. 109 LIVA"
  difficulty: 2
  tags:
  - "bienes de inversión"
  - "regularización"
# anchor: boe-a-1992-28740-art-107
- id: m03-l19-q0165
  prompt:
    es: "Según el artículo 107.Siete de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿en qué declaración-liquidación deben efectuarse los ingresos o deducciones complementarias por regularización de bienes de inversión?"
  options:
  - id: a
    text:
      es: "Al primer período de liquidación del año natural siguiente al que se refieran."
  - id: b
    correct: true
    text:
      es: "Al último período de liquidación del año natural a que se refieran."
  - id: c
    text:
      es: "Al último período de liquidación del año de adquisición de los bienes."
  - id: d
    text:
      es: "Al período de liquidación en que se advierta la diferencia entre porcentajes."
  explanation:
    es: "Los ingresos o deducciones complementarias van en la declaración del último período del año al que se refieren. No se difieren al primer período del año siguiente, ni al período en que se advierte la diferencia, ni al año de adquisición."
  citation: "art. 107.Siete LIVA"
  difficulty: 1
  tags:
  - "bienes de inversión"
  - "regularización"
# anchor: boe-a-1992-28740-art-107
