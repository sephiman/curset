    text:
      es: "La cuantía del gasto, si no supera el límite que fije el Ministro."
  - id: b
    text:
      es: "La solicitud del tercero con quien se contrata el gasto."
  - id: c
    text:
      es: "El acuerdo previo del Consejo de Ministros en cada caso."
  - id: d
    correct: true
    text:
      es: "La naturaleza de la operación o gasto."
