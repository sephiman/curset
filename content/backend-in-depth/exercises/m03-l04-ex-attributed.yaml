type: quiz
variants:
- id: m03-l04-qa01
  prompt:
    en: According to Chris Jones in Effective Troubleshooting, in which order does he advise performing the tests
      of the hypotheses about what is wrong with a system?
  options:
  - id: a
    text:
      en: Starting with the most improbable theory, because it tells the team the most about the system
  - id: b
    correct: true
    text:
      en: In decreasing order of likelihood, considering the risks the test poses to the system
  - id: c
    text:
      en: Starting with the cause of the last similar problem, because a cause that happened once will return
  - id: d
    text:
      en: Starting with the more complicated explanation, because simpler explanations are usually too naive
  explanation:
    en: Jones advises performing the tests in decreasing order of likelihood, considering possible risks to the
      system from the test. Jones writes that not all failures are equally probable and quotes doctors who say that
      when you hear hoofbeats you should think of horses, not zebras; starting with the most improbable theory contradicts
      the maxim. His list of common pitfalls includes latching on to the causes of past problems, reasoning that
      since it happened once it must be happening again, which is what starting with the cause of the last similar
      problem does. He also writes that, all things being equal, we should prefer simpler explanations, so starting
      with the more complicated one contradicts the preference.
  citation: sre-book-effective-troubleshooting#test-and-treat-EvsWceuj; sre-book-effective-troubleshooting#common-pitfalls-QASNTOi0;
    sre-book-effective-troubleshooting#common-pitfalls-QASNTOi0; sre-book-effective-troubleshooting#common-pitfalls-QASNTOi0
  extract:
    en: perform the tests in decreasing order of likelihood, considering possible risks to the system from the test
- id: m03-l04-qa03
  prompt:
    en: According to Chris Jones in Effective Troubleshooting, what does he say about fixing the proximate causes
      of a problem relative to root-causing and writing a postmortem?
  options:
  - id: a
    correct: true
    text:
      en: Fixing the proximate causes need not always wait for root-causing or postmortem writing
  - id: b
    text:
      en: Stopping the bleeding is secondary, so the root cause must be found first
  - id: c
    text:
      en: A postmortem is written first, so that the tests that follow can be documented
  - id: d
    text:
      en: Freezing a system that corrupts data is never an option, since users must keep being served
  explanation:
    en: Jones writes that fixing the proximate causes need not always wait for root-causing or postmortem writing.
      In Jones's text, stopping the bleeding should be your first priority, which contradicts finding the root cause
      first. Jones notes that using either of these strategies, the troubleshooter repeatedly tests until a root
      cause is identified, at which point the troubleshooter can then take corrective action to prevent a recurrence
      and write a postmortem, which contradicts writing a postmortem first. As an example, Jones says that if a
      bug is leading to possibly unrecoverable data corruption, freezing the system to prevent further failure may
      be better than letting this behavior continue, which contradicts the claim that freezing a system that corrupts
      data is never an option.
  citation: sre-book-effective-troubleshooting#theory-Nbsviy; sre-book-effective-troubleshooting#triage-BVs0truY;
    sre-book-effective-troubleshooting#triage-BVs0truY
  extract:
    en: Of course, fixing the proximate cause(s) needn’t always wait for root-causing or postmortem writing.
