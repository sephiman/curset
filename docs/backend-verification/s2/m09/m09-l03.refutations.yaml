m09-l03-q10:
  key:
    anchor: k8s-resource-management#requests-and-limits
    sentence: cpu limits are enforced by CPU throttling.
  wrong:
  - option: By terminating the container with an out of memory (OOM) kill
    anchor: k8s-resource-management#requests-and-limits
    sentence: memory limits are enforced by the kernel with out of memory (OOM) kills.
  - option: Loosely, since a container may use more CPU than its limit when the node has spare CPU
    anchor: k8s-resource-management#requests-and-limits
    sentence: Containers may not use more CPU than is specified in their cpu limit.
  - option: By the scheduler, which refuses to place Pods whose containers could exceed the limit
    anchor: k8s-resource-management#requests-and-limits
    sentence: Both cpu and memory limits are applied by the kubelet (and container runtime), and are ultimately enforced by the kernel.
