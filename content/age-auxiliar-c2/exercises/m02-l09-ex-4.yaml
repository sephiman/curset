# anchor: fuente-ms-excel-formatos-numero-html
- id: m02-l09-q199
  prompt:
    es: "En Excel 365, aplicar un formato de número a una celda con un valor, ¿qué cambia?"
  options:
  - id: a
    correct: true
    text:
      es: "Solo la forma en que se muestra el número, no su valor"
  - id: b
    text:
      es: "El valor que se usa en los cálculos"
  - id: c
    text:
      es: "El tipo de dato, que pasa a texto"
  - id: d
    text:
      es: "El valor almacenado, que se redondea a las posiciones decimales mostradas"
  explanation:
    es: "La página dice que los formatos solo cambian cómo se muestran los números y no afectan a los valores. «El valor que se usa en los cálculos»: la página dice que el formato no afecta a los valores de celda de los cálculos. «El valor almacenado, que se redondea a las posiciones decimales mostradas»: la página dice que el valor real se ve en la barra de fórmulas, sin cambios. «El tipo de dato, que pasa a texto»: solo la categoría Texto muestra el contenido como texto; el formato no convierte el valor."
  citation: "fuente: `ms-excel-formatos-numero.html`; «Formatos de número»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-formatos-numero-html
- id: m02-l09-q200
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe lo que caracteriza a los formatos de fecha que empiezan por un asterisco (*) en el cuadro de formato?"
  options:
  - id: a
    text:
      es: "No cambian al modificar la configuración regional del Panel de control"
  - id: b
    text:
      es: "Son formatos de fecha integrados que se pueden modificar directamente"
  - id: c
    correct: true
    text:
      es: "Cambian cuando cambia la configuración regional de fecha y hora del Panel de control"
  - id: d
    text:
      es: "Siempre muestran el año con cuatro cifras y el mes con su nombre completo en cada celda"
  explanation:
    es: "La página dice que los formatos con asterisco responden a la configuración regional del Panel de control y los demás no. «Siempre muestran el año con cuatro cifras y el mes con su nombre completo en cada celda»: la página define el asterisco por su respuesta al Panel de control, y no por las cifras del año. «No cambian al modificar la configuración regional del Panel de control»: esa es la propiedad que la página da a los formatos sin asterisco. «Son formatos de fecha integrados que se pueden modificar directamente»: la página dice que el formato de fecha integrado no se puede cambiar."
  citation: "fuente: `ms-excel-formatos-numero.html`; «Formatos de número»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-porcentaje-html
- id: m02-l09-q201
  prompt:
    es: "En Excel 365 una celda ya contiene el número 10. ¿Qué se ve al aplicarle el formato Porcentaje con dos decimales?"
  options:
  - id: a
    text:
      es: "10,00%"
  - id: b
    correct: true
    text:
      es: "1000,00%"
  - id: c
    text:
      es: "0,10%"
  - id: d
    text:
      es: "10000,00%"
  explanation:
    es: "La página dice que, si la celda ya tiene 10, Excel lo multiplica por 100 y se ve 1000,00%. «10,00%»: eso ocurre si el formato se aplica antes y se escribe después el número en la celda vacía. «0,10%»: el formato multiplica por 100 los números existentes, no los divide. «10000,00%»: 10 multiplicado por 100 da 1000, no 10000."
  citation: "fuente: `ms-excel-porcentaje.html`; «Cómo administra Excel los porcentajes»"
  difficulty: 1
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-porcentaje-html
- id: m02-l09-q202
  prompt:
    es: "En Excel 365 una celda vacía tiene formato Porcentaje con dos decimales. ¿Qué se muestra al escribir 0,1 en ella?"
  options:
  - id: a
    text:
      es: "0,10%"
  - id: b
    text:
      es: "0,00%"
  - id: c
    correct: true
    text:
      es: "10,00%"
  - id: d
    text:
      es: "1000,00%"
  explanation:
    es: "La página dice que, en celdas vacías con formato Porcentaje, escribir 10 o 0,1 da 10,00%. «0,10%»: el número 0,1 se multiplica por 100 al escribirlo, y se ve 10,00%. «0,00%»: el valor escrito no se redondea a cero; el formato lo multiplica por 100. «1000,00%»: esa cifra sale al dar formato a una celda que ya contiene 10."
  citation: "fuente: `ms-excel-porcentaje.html`; «Por ejemplo, si escribe 10 o 0,1 ambos dan como resultado 10,00%.»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-porcentaje-html
- id: m02-l09-q203
  prompt:
    es: "En Excel 365 una celda vacía tiene formato Porcentaje con dos decimales y se escribe en ella el número 5. ¿Qué se muestra?"
  options:
  - id: a
    correct: true
    text:
      es: "5,00%"
  - id: b
    text:
      es: "0,05%"
  - id: c
    text:
      es: "5,00"
  - id: d
    text:
      es: "500,00%"
  explanation:
    es: "La página dice que los números iguales o superiores a 1 se convierten a porcentajes de forma predeterminada, así que 5 se ve como 5,00%. «500,00%»: los números iguales o superiores a 1 se convierten a porcentajes sin multiplicarlos por 100. «0,05%»: el número se muestra como porcentaje directo, no se divide entre 100. «5,00»: el formato Porcentaje añade el símbolo % al resultado."
  citation: "fuente: `ms-excel-porcentaje.html`; «Cómo administra Excel los porcentajes»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-porcentaje-html
- id: m02-l09-q204
  prompt:
    es: "En Excel 365 configurado en español, ¿cuál de los siguientes métodos abreviados aplica el formato Porcentaje sin decimales a la selección?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+#"
  - id: b
    text:
      es: "Ctrl+Mayús+$"
  - id: c
    correct: true
    text:
      es: "Ctrl+Mayús+%"
  - id: d
    text:
      es: "Ctrl+Mayús+@"
  explanation:
    es: "Las páginas dan Ctrl+Mayús+% para aplicar rápidamente el formato de porcentaje a la selección. «Ctrl+Mayús+$»: aplica el formato Moneda con dos decimales. «Ctrl+Mayús+#»: aplica el formato Fecha con día, mes y año. «Ctrl+Mayús+@»: aplica el formato Hora con horas y minutos."
  citation: "fuente: `ms-excel-porcentaje.html`; «Mostrar números como porcentajes»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-excel-porcentaje-html
- id: m02-l09-q205
  prompt:
    es: "En Excel 365, ¿qué se escribe en el cuadro Posiciones decimales para ver 10% en vez de 10,00%?"
  options:
  - id: a
    text:
      es: "2"
  - id: b
    correct: true
    text:
      es: "0"
  - id: c
    text:
      es: "10"
  - id: d
    text:
      es: "1"
  explanation:
    es: "La página dice que se escribe 0 en el cuadro Posiciones decimales para ver 10% en vez de 10,00%. «1»: con 1 decimal se vería 10,0%. «2»: con 2 decimales se vería 10,00%. «10»: con 10 decimales se mostrarían diez cifras decimales, no ninguna."
  citation: "fuente: `ms-excel-porcentaje.html`; «Mostrar números como porcentajes»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-excel-porcentaje-html
- id: m02-l09-q206
  prompt:
    es: "En Excel 365, B2 contiene el gasto semanal de 25 y C2 el porcentaje de reducción, 25%. ¿Qué fórmula en D2 calcula el gasto reducido?"
  options:
  - id: a
    text:
      es: "=B2/C2"
  - id: b
    text:
      es: "=B2*(1+C2)"
  - id: c
    text:
      es: "=B2*C2"
  - id: d
    correct: true
    text:
      es: "=B2*(1-C2)"
  explanation:
    es: "La página usa =B2*(1-C2): el 1 representa el 100% y se resta el porcentaje. Con 25 y 25% da 18,75. «=B2*(1+C2)»: suma el porcentaje en vez de restarlo, con lo que aumenta el gasto. «=B2*C2»: da el 25% de B2, que es la reducción, no el gasto reducido. «=B2/C2»: divide el gasto entre el porcentaje y no lo reduce."
  citation: "fuente: `ms-excel-porcentaje.html`; «Si B2 es la cantidad que desea gastar en comida, y C2 es el porcentaje en el que desea reducir dicha cantidad, puede escribir =B2*(1-C2) en D2 para obtener el resultado:»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-porcentaje-html
- id: m02-l09-q207
  prompt:
    es: "En Excel 365, B2 contiene el precio 800 y C2 el impuesto, 8,9%. ¿Qué muestra D2 con =B2*C2, con formato Número de dos decimales?"
  options:
  - id: a
    text:
      es: "8,90"
  - id: b
    correct: true
    text:
      es: "71,20"
  - id: c
    text:
      es: "808,90"
  - id: d
    text:
      es: "7120,00"
  explanation:
    es: "La página explica que la fórmula multiplica 800 por 0,089 para dar el impuesto: 71,20. «7120,00»: la fórmula multiplica 800 por 0,089, el valor decimal de 8,9%, no por 8,9. «8,90»: esa cifra es el porcentaje; la fórmula lo multiplica por el precio. «808,90»: la fórmula calcula el impuesto, sin sumarlo al precio."
  citation: "fuente: `ms-excel-porcentaje.html`; «Ejemplo 2: Calcular una cantidad basada en un porcentaje»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-porcentaje-html
- id: m02-l09-q208
  prompt:
    es: "En Excel 365, B2 contiene el precio de venta, 15, que supone un 25% de descuento sobre el original, y C2 contiene 0,75. ¿Qué devuelve =B2/C2 en D2?"
  options:
  - id: a
    text:
      es: "3,75"
  - id: b
    text:
      es: "11,25"
  - id: c
    correct: true
    text:
      es: "20"
  - id: d
    text:
      es: "18,75"
  explanation:
    es: "La página usa =B2/C2 para hallar el precio original: 15 entre 0,75 da 20. «11,25»: es 15 por 0,75; la fórmula divide, no multiplica. «3,75»: sería el 25% de 15, que no es el precio original. «18,75»: sería 15 más el 25%, y la fórmula divide entre 0,75."
  citation: "fuente: `ms-excel-porcentaje.html`; «Ejemplo 4: Calcular una cantidad basada en otra cantidad y en un porcentaje»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-porcentaje-html
- id: m02-l09-q209
  prompt:
    es: "En Excel 365, las ganancias de noviembre (B2) son 2000 y las de diciembre (C2) 2500. ¿Qué muestra D2 con =(C2-B2)/ABS(B2), con formato Porcentaje sin decimales?"
  options:
  - id: a
    correct: true
    text:
      es: "25%"
  - id: b
    text:
      es: "125%"
  - id: c
    text:
      es: "20%"
  - id: d
    text:
      es: "500%"
  explanation:
    es: "La página usa =(C2-B2)/ABS(B2): la diferencia, 500, entre el valor absoluto del primer número, 2000, da 0,25, que con formato Porcentaje es 25%. «20%»: sería 500 entre 2500; la fórmula divide entre el valor absoluto del primer número. «125%»: sería 2500 entre 2000, y la fórmula resta antes de dividir. «500%»: sería la diferencia, 500, sin dividir entre el primer número."
  citation: "fuente: `ms-excel-porcentaje.html`; «Ejemplo 5: Calcular la diferencia entre dos números y mostrarla como porcentaje»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-numeros-redondeados-html
- id: m02-l09-q211
  prompt:
    es: "En Excel 365, un número con decimales aparece redondeado en una celda con formato General. ¿Dónde se ve el número completo?"
  options:
  - id: a
    correct: true
    text:
      es: "En la barra de fórmulas"
  - id: b
    text:
      es: "Solo al ensanchar la columna al máximo"
  - id: c
    text:
      es: "No se conserva, porque el redondeo es real"
  - id: d
    text:
      es: "En la barra de estado"
  explanation:
    es: "La página dice que el número completo sigue visible en la barra de fórmulas y se usa en los cálculos. «Solo al ensanchar la columna al máximo»: la página dice que el número completo sigue visible en la barra de fórmulas. «En la barra de estado»: la página sitúa el número completo en la barra de fórmulas. «No se conserva, porque el redondeo es real»: la página dice que el número completo se usa en los cálculos."
  citation: "fuente: `ms-excel-numeros-redondeados.html`; «No volver a mostrar números redondeados»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-numeros-redondeados-html
- id: m02-l09-q212
  prompt:
    es: "En Excel 365, un número aparece redondeado sin haber usado ninguna función de redondeo. ¿Cuál de las siguientes puede ser la causa?"
  options:
  - id: a
    text:
      es: "La celda tiene aplicado el formato Fecha"
  - id: b
    correct: true
    text:
      es: "El formato muestra menos posiciones decimales de las que tiene el número"
  - id: c
    text:
      es: "La celda tiene aplicada la categoría Texto"
  - id: d
    text:
      es: "Excel redondea los números al guardar el libro"
  explanation:
    es: "La página da dos causas: la columna no es lo bastante ancha o el formato muestra menos decimales que el número real. «Excel redondea los números al guardar el libro»: la página dice que el número completo se conserva y se usa en los cálculos. «La celda tiene aplicada la categoría Texto»: Texto muestra el contenido tal como se escribe, sin redondear. «La celda tiene aplicado el formato Fecha»: Fecha muestra números de serie como fechas, y no redondea decimales."
  citation: "fuente: `ms-excel-numeros-redondeados.html`; «No volver a mostrar números redondeados»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-proteger-hoja-html
- id: m02-l09-q355
  prompt:
    es: "En Excel 365, con la hoja protegida y Eliminar columnas protegido pero Insertar columnas permitido, ¿qué puede hacer un usuario?"
  options:
  - id: a
    correct: true
    text:
      es: "Insertar columnas, pero no eliminarlas"
  - id: b
    text:
      es: "Insertar y eliminar columnas"
  - id: c
    text:
      es: "Eliminar columnas, pero no insertarlas"
  - id: d
    text:
      es: "Ni insertar ni eliminar columnas"
  explanation:
    es: "La página dice que, si Eliminar columnas está protegido e Insertar columnas no, el usuario puede insertar columnas, pero no eliminarlas. «Eliminar columnas, pero no insertarlas»: la página dice que el usuario puede insertar, pero no eliminar. «Ni insertar ni eliminar columnas»: la página dice que, con Insertar columnas permitido, puede insertarlas. «Insertar y eliminar columnas»: la página dice que no puede eliminarlas si Eliminar columnas está protegido."
  citation: "fuente: `ms-excel-proteger-hoja.html`; «Si Eliminar columnas está protegido e Insertar columnas no está protegido, un usuario puede insertar columnas, pero no puede eliminarlas.»"
  difficulty: 3
  tags:
  - "comportamiento"
