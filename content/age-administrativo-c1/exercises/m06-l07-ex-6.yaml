# anchor: fuente-ms-outlook-carpetas-busqueda-html
- id: m06-l07-q153
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de los siguientes tipos de carpeta de búsqueda solo se admite en Outlook clásico?"
  options:
  - id: a
    correct: true
    text:
      es: "Las carpetas de búsqueda personalizadas avanzadas"
  - id: b
    text:
      es: "La carpeta de búsqueda de Correo grande"
  - id: c
    text:
      es: "La carpeta de búsqueda de Correo con datos adjuntos"
  - id: d
    text:
      es: "La carpeta de búsqueda de Correo no leído"
  explanation:
    es: "La ayuda dice que las carpetas de búsqueda personalizadas avanzadas solo se admiten en Outlook clásico. Correo no leído, Correo grande y Correo con datos adjuntos figuran en la lista de tipos predefinidos que ofrece el nuevo Outlook para crear una carpeta de búsqueda."
  citation: "fuente: `ms-outlook-carpetas-busqueda.html`; «Usar carpetas de búsqueda para buscar mensajes u otros elementos de Outlook»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-carpetas-busqueda-html
- id: m06-l07-q154
  prompt:
    es: "En Outlook 365 clásico, al crear una carpeta de búsqueda personalizada, ¿qué botón se elige para añadir a la lista cada criterio avanzado una vez fijados Condición y Valor?"
  options:
  - id: a
    text:
      es: "Elegir"
  - id: b
    correct: true
    text:
      es: "Agregar a la lista"
  - id: c
    text:
      es: "Examinar"
  - id: d
    text:
      es: "Criterios"
  explanation:
    es: "En la pestaña Avanzado, tras elegir Condición y Valor, se selecciona Agregar a la lista. Examinar sirve para elegir las carpetas donde buscar. Criterios abre las pestañas con las opciones de criterios. Elegir, en Personalizar carpeta de búsqueda, es el paso previo a escribir el nombre de la carpeta personalizada."
  citation: "fuente: `ms-outlook-carpetas-busqueda.html`; «Crear una carpeta de búsqueda personalizada en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-carpetas-busqueda-html
- id: m06-l07-q155
  prompt:
    es: "En Outlook 365 clásico, al crear una carpeta de búsqueda personalizada, ¿para qué se selecciona el botón Examinar?"
  options:
  - id: a
    text:
      es: "Para abrir las pestañas con las opciones de criterios"
  - id: b
    text:
      es: "Para escribir el nombre de la carpeta de búsqueda personalizada"
  - id: c
    text:
      es: "Para añadir un criterio avanzado a la lista de criterios"
  - id: d
    correct: true
    text:
      es: "Para seleccionar las carpetas en las que se desea buscar"
  explanation:
    es: "Con Examinar se seleccionan las carpetas en las que buscar. El nombre se escribe antes, tras Elegir. Las opciones de criterios se abren con Criterios. Los criterios avanzados se añaden con Agregar a la lista, en la pestaña Avanzado."
  citation: "fuente: `ms-outlook-carpetas-busqueda.html`; «Crear una carpeta de búsqueda personalizada en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-carpetas-busqueda-html
- id: m06-l07-q156
  prompt:
    es: "En Outlook 365 clásico, con varias cuentas, ¿qué cuadro permite elegir en qué cuenta de correo busca una carpeta de búsqueda predefinida?"
  options:
  - id: a
    text:
      es: "Personalizar carpeta de búsqueda"
  - id: b
    text:
      es: "Definir criterios adicionales"
  - id: c
    correct: true
    text:
      es: "Buscar en correo electrónico"
  - id: d
    text:
      es: "Seleccionar una carpeta de búsqueda"
  explanation:
    es: "El cuadro Buscar en correo electrónico selecciona la cuenta en la que buscar. Seleccionar una carpeta de búsqueda es la lista donde se elige la carpeta predefinida. Personalizar carpeta de búsqueda es donde se escriben las palabras de opciones como Correo con determinadas palabras. Definir criterios adicionales es el apartado de la pestaña Avanzado."
  citation: "fuente: `ms-outlook-carpetas-busqueda.html`; «Crear y usar carpetas de búsqueda predefinidas en Outlook clásico para Windows»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-carpetas-busqueda-html
- id: m06-l07-q157
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes limitaciones de las carpetas de búsqueda señala la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "No pueden mostrar mensajes guardados en diferentes carpetas del buzón"
  - id: b
    text:
      es: "No pueden crearse en Outlook clásico, solo en el nuevo Outlook"
  - id: c
    text:
      es: "No pueden usarse para seguir el correo no leído o marcado"
  - id: d
    correct: true
    text:
      es: "No pueden contener resultados de búsqueda de varios Outlook Data Files"
  explanation:
    es: "La nota dice que las carpetas de búsqueda no pueden contener resultados de varios archivos .pst. Mostrar mensajes de diferentes carpetas del buzón es justo su uso, según el ejemplo de correo no leído. Crearlas en Outlook clásico se explica con la pestaña Carpeta. Seguir el correo no leído o marcado figura entre sus usos."
  citation: "fuente: `ms-outlook-carpetas-busqueda.html`; «Usar carpetas de búsqueda para buscar mensajes u otros elementos de Outlook»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-procedimientos-html
- id: m06-l07-q158
  prompt:
    es: "En Outlook 365 clásico, para encontrar un mensaje que puede estar en cualquier carpeta de todo el buzón se selecciona el ámbito de búsqueda:"
  options:
  - id: a
    correct: true
    text:
      es: "Buzón actual"
  - id: b
    text:
      es: "Datos adjuntos"
  - id: c
    text:
      es: "De"
  - id: d
    text:
      es: "Cerrar búsqueda"
  explanation:
    es: "La ayuda indica seleccionar Buzón actual para encontrar mensajes en todo el buzón. Cerrar búsqueda detiene la búsqueda. De limita la búsqueda a los mensajes de una persona. Datos adjuntos limita la búsqueda a los mensajes con datos adjuntos."
  citation: "fuente: `ms-outlook-procedimientos.html`; «Encontrar ese mensaje: búsqueda eficaz»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-procedimientos-html
- id: m06-l07-q159
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes rutas deja Buzón actual como ámbito de búsqueda predeterminado, de modo que se busque en todas las carpetas?"
  options:
  - id: a
    text:
      es: "Archivo › Herramientas › Limpieza de buzón"
  - id: b
    correct: true
    text:
      es: "Archivo › Opciones › Buscar › Resultados › Buzón actual"
  - id: c
    text:
      es: "Archivo › Cuenta de Office › Tema de Office"
  - id: d
    text:
      es: "Archivo › Opciones › Correo › Limpieza de conversación"
  explanation:
    es: "La ayuda establece el ámbito predeterminado en Archivo › Opciones, con Buscar y, en Resultados, Buzón actual. Archivo › Opciones › Correo › Limpieza de conversación fija a dónde van los mensajes redundantes. Archivo › Herramientas › Limpieza de buzón muestra el tamaño del buzón. Archivo › Cuenta de Office › Tema de Office cambia el fondo oscuro."
  citation: "fuente: `ms-outlook-procedimientos.html`; «Encontrar ese mensaje: búsqueda eficaz»"
  difficulty: 2
  tags:
  - "ofimática-menú"
  - "configuración"
# anchor: fuente-ms-outlook-procedimientos-html
- id: m06-l07-q160
  prompt:
    es: "En Outlook 365 clásico, al seleccionar los comandos de la cinta De y Con datos adjuntos para generar una búsqueda, ¿cómo se combinan esos términos de búsqueda?"
  options:
  - id: a
    text:
      es: "Se sustituyen: el último comando seleccionado anula al anterior"
  - id: b
    text:
      es: "Se excluyen: la búsqueda devuelve mensajes de alguien sin datos adjuntos"
  - id: c
    correct: true
    text:
      es: "Son aditivos: se suman en una única búsqueda"
  - id: d
    text:
      es: "Se aplican por separado: hay que ejecutar una búsqueda para cada uno"
  explanation:
    es: "La ayuda dice que todos los términos de búsqueda son aditivos, de modo que De y Con datos adjuntos se suman. Que el último anule al anterior, que se excluyan entre sí o que se apliquen por separado contradicen esa frase."
  citation: "fuente: `ms-outlook-procedimientos.html`; «Encontrar ese mensaje: búsqueda eficaz»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-procedimientos-html
- id: m06-l07-q161
  prompt:
    es: "En Outlook 365 clásico, ¿qué comando de la pestaña Buscar se selecciona para detener la búsqueda cuando ya se ha encontrado el elemento?"
  options:
  - id: a
    correct: true
    text:
      es: "Cerrar búsqueda"
  - id: b
    text:
      es: "Buzón actual"
  - id: c
    text:
      es: "Datos adjuntos"
  - id: d
    text:
      es: "De"
  explanation:
    es: "Cerrar búsqueda, en el grupo Cerrar, detiene la búsqueda. Buzón actual es un ámbito de búsqueda de la pestaña Buscar. De limita la búsqueda a los mensajes de una persona. Datos adjuntos limita la búsqueda a los mensajes con adjuntos."
  citation: "fuente: `ms-outlook-procedimientos.html`; «Encontrar ese mensaje: búsqueda eficaz»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-limpieza-buzon-html
- id: m06-l07-q162
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes rutas abre Limpieza de buzón, la herramienta para recortar el tamaño del buzón?"
  options:
  - id: a
    text:
      es: "Archivo › Configuración de la cuenta › Delegar el acceso"
  - id: b
    correct: true
    text:
      es: "Archivo › Herramientas › Limpieza de buzón"
  - id: c
    text:
      es: "Archivo › Opciones › Buscar"
  - id: d
    text:
      es: "Inicio › Eliminar › Limpiar"
  explanation:
    es: "La ayuda lleva a Limpieza de buzón desde Archivo y Herramientas. Archivo › Opciones › Buscar fija el ámbito de búsqueda predeterminado. Inicio › Eliminar › Limpiar quita mensajes redundantes de conversaciones. Archivo › Configuración de la cuenta › Delegar el acceso concede el acceso delegado."
  citation: "fuente: `ms-outlook-limpieza-buzon.html`; «Administrar el tamaño del buzón en Outlook»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-limpieza-buzon-html
- id: m06-l07-q163
  prompt:
    es: "En Outlook 365 clásico, ¿qué información muestra la herramienta Limpieza de buzón sobre el tamaño del buzón?"
  options:
  - id: a
    text:
      es: "Solo el tamaño de la carpeta Elementos eliminados"
  - id: b
    text:
      es: "El tamaño de los datos adjuntos, pero no el de las carpetas"
  - id: c
    correct: true
    text:
      es: "El tamaño total del buzón y el de las carpetas individuales que contiene"
  - id: d
    text:
      es: "Solo el tamaño total del buzón, sin el de cada carpeta"
  explanation:
    es: "Limpieza de buzón permite ver el tamaño total del buzón y de las carpetas individuales que contiene. Mostrar solo el total o solo el de Elementos eliminados contradice esa frase, que incluye cada carpeta. Mostrar el tamaño de los adjuntos y no el de las carpetas la contradice igualmente: la lista de acciones habla del tamaño de las carpetas."
  citation: "fuente: `ms-outlook-limpieza-buzon.html`; «Administrar el tamaño del buzón en Outlook»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-limpieza-buzon-html
- id: m06-l07-q164
  prompt:
    es: "En Outlook 365 clásico, ¿qué permite hacer Limpieza de buzón con los elementos del buzón por su antigüedad o su tamaño?"
  options:
  - id: a
    text:
      es: "Buscar elementos posteriores a una fecha determinada o menores que un tamaño"
  - id: b
    text:
      es: "Buscar elementos posteriores a una fecha determinada o mayores que un tamaño"
  - id: c
    text:
      es: "Buscar elementos anteriores a una fecha determinada o menores que un tamaño"
  - id: d
    correct: true
    text:
      es: "Buscar elementos anteriores a una fecha determinada o mayores que un tamaño determinado"
  explanation:
    es: "Limpieza de buzón permite buscar elementos anteriores a una fecha o mayores que un tamaño. Buscar los posteriores a una fecha o los menores que un tamaño, o combinar uno de esos criterios con el correcto, invierte la frase de la ayuda."
  citation: "fuente: `ms-outlook-limpieza-buzon.html`; «Administrar el tamaño del buzón en Outlook»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-outlook-limpiar-conversacion-html
- id: m06-l07-q166
  prompt:
    es: "En Outlook 365 clásico, con la cinta clásica, ¿en qué pestaña y grupo está el comando Limpiar para quitar mensajes redundantes?"
  options:
  - id: a
    text:
      es: "Pestaña Inicio, grupo Mover"
  - id: b
    text:
      es: "Pestaña Inicio, grupo Etiquetas"
  - id: c
    correct: true
    text:
      es: "Pestaña Inicio, grupo Eliminar"
  - id: d
    text:
      es: "Pestaña Carpeta, grupo Nuevo"
  explanation:
    es: "Con la cinta clásica, Limpiar está en la pestaña Inicio, grupo Eliminar. El grupo Etiquetas contiene Categorizar. El grupo Mover contiene Más acciones de movimiento. El grupo Nuevo de la pestaña Carpeta contiene Nueva carpeta de búsqueda."
  citation: "fuente: `ms-outlook-limpiar-conversacion.html`; «Quitar mensajes redundantes»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-limpiar-conversacion-html
- id: m06-l07-q167
  prompt:
    es: "En Outlook 365 clásico, ¿qué comando de Limpiar revisa todas las conversaciones de la carpeta seleccionada y de todas las carpetas que esta contenga?"
  options:
  - id: a
    text:
      es: "Limpiar carpeta, del grupo Eliminar"
  - id: b
    text:
      es: "Limpieza de buzón, del menú Herramientas"
  - id: c
    text:
      es: "Limpiar conversación, del grupo Eliminar"
  - id: d
    correct: true
    text:
      es: "Limpiar carpeta y subcarpetas"
  explanation:
    es: "Limpiar carpeta y subcarpetas revisa la carpeta seleccionada y las carpetas que contenga. Limpiar conversación revisa solo la conversación actual. Limpiar carpeta revisa las conversaciones de la carpeta seleccionada. Limpieza de buzón muestra el tamaño del buzón y no es un comando de Limpiar."
  citation: "fuente: `ms-outlook-limpiar-conversacion.html`; «Quitar mensajes redundantes»"
  difficulty: 3
  tags:
  - "función"
# anchor: fuente-ms-outlook-limpiar-conversacion-html
- id: m06-l07-q168
  prompt:
    es: "En Outlook 365 clásico, ¿qué hace el comando Limpiar conversación del grupo Eliminar de la pestaña Inicio?"
  options:
  - id: a
    text:
      es: "Revisa las conversaciones de la carpeta seleccionada y de sus subcarpetas"
  - id: b
    correct: true
    text:
      es: "Revisa la conversación actual y elimina los mensajes redundantes"
  - id: c
    text:
      es: "Elimina todos los mensajes de la conversación excepto el primero"
  - id: d
    text:
      es: "Revisa todas las conversaciones de la carpeta seleccionada"
  explanation:
    es: "Limpiar conversación revisa la conversación actual y elimina los mensajes redundantes. Revisar todas las conversaciones de la carpeta es Limpiar carpeta. Hacerlo también en las subcarpetas es Limpiar carpeta y subcarpetas. Dejar solo el primer mensaje contradice el ejemplo de la ayuda, donde se conserva el último mensaje porque incluye todos los anteriores."
  citation: "fuente: `ms-outlook-limpiar-conversacion.html`; «Quitar mensajes redundantes»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-outlook-limpiar-conversacion-html
- id: m06-l07-q169
  prompt:
    es: "En Outlook 365 clásico, los mensajes redundantes que elimina el comando Limpiar van por defecto, según la ayuda de Microsoft, a:"
  options:
  - id: a
    correct: true
    text:
      es: "La carpeta Elementos eliminados"
  - id: b
    text:
      es: "La carpeta Correo no deseado"
  - id: c
    text:
      es: "La carpeta Elementos enviados"
  - id: d
    text:
      es: "La carpeta Archivo"
  explanation:
    es: "Por defecto, los mensajes redundantes se colocan en la carpeta Elementos eliminados. Archivo, Correo no deseado y Elementos enviados contradicen esa frase, que fija Elementos eliminados como destino predeterminado."
  citation: "fuente: `ms-outlook-limpiar-conversacion.html`; «Cambiar las opciones de limpieza de la conversación»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-limpiar-conversacion-html
- id: m06-l07-q170
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes casillas de Limpieza de conversación desaconseja activar la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "No mover los mensajes ordenados por categoría"
  - id: b
    correct: true
    text:
      es: "No mover los mensajes no leídos"
  - id: c
    text:
      es: "No mover los mensajes firmados digitalmente"
  - id: d
    text:
      es: "No mover los mensajes marcados"
  explanation:
    es: "Para No mover los mensajes no leídos, la ayuda recomienda no seleccionar la opción. Para No mover los mensajes marcados, No mover los mensajes ordenados por categoría y No mover los mensajes firmados digitalmente, la ayuda dice «Le recomendamos que seleccione esta opción»."
  citation: "fuente: `ms-outlook-limpiar-conversacion.html`; «Cambiar las opciones de limpieza de la conversación»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-limpiar-conversacion-html
- id: m06-l07-q171
  prompt:
    es: "En Outlook 365 clásico, ¿en qué parte de las opciones de Outlook se cambia la carpeta de destino de los mensajes eliminados por Limpiar?"
  options:
  - id: a
    text:
      es: "Inicio › Eliminar › Limpiar › Limpiar carpeta y subcarpetas"
  - id: b
    text:
      es: "Archivo › Herramientas › Limpieza de buzón"
  - id: c
    correct: true
    text:
      es: "Archivo › Opciones › Correo, en Limpieza de conversación"
  - id: d
    text:
      es: "Archivo › Opciones › Buscar › Resultados › Buzón actual"
  explanation:
    es: "La carpeta de destino se cambia en Archivo › Opciones › Correo, en Limpieza de conversación, con Examinar. Archivo › Opciones › Buscar, en Resultados, fija el ámbito de búsqueda. Archivo › Herramientas › Limpieza de buzón muestra el tamaño del buzón. Inicio › Eliminar › Limpiar ejecuta la limpieza, no cambia el destino."
  citation: "fuente: `ms-outlook-limpiar-conversacion.html`; «Cambiar las opciones de limpieza de la conversación»"
  difficulty: 3
  tags:
  - "ofimática-menú"
  - "configuración"
# anchor: fuente-ms-outlook-limpiar-conversacion-html
- id: m06-l07-q172
  prompt:
    es: "En Outlook 365 clásico, ¿qué es una conversación para la función Limpieza de conversación, también llamada hilo de correo electrónico?"
  options:
  - id: a
    text:
      es: "Todos los mensajes recibidos del mismo remitente en un día"
  - id: b
    text:
      es: "El primer mensaje y sus respuestas, aunque cada una cambie el asunto"
  - id: c
    text:
      es: "Los mensajes de una carpeta que tienen la misma categoría"
  - id: d
    correct: true
    text:
      es: "El primer mensaje y todas las respuestas, todos con el mismo asunto"
  explanation:
    es: "Una conversación es el conjunto de mensajes que incluye el primer mensaje y todas las respuestas, y todos tienen el mismo asunto. Los mensajes de un remitente en un día y los de una misma categoría no se mencionan como conversación. Que cada respuesta cambie el asunto contradice la frase sobre el mismo asunto."
  citation: "fuente: `ms-outlook-limpiar-conversacion.html`; «¿Qué es una Conversación?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-limpiar-conversacion-html
- id: m06-l07-q173
  prompt:
    es: "En Outlook 365 clásico, ¿cuándo considera Limpieza de conversación que un mensaje es redundante y se elimina?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando está completamente integrado en una de las respuestas"
  - id: b
    text:
      es: "Cuando ya se ha leído y no tiene ninguna marca de seguimiento"
  - id: c
    text:
      es: "Cuando es el mensaje más antiguo de toda la conversación"
  - id: d
    text:
      es: "Cuando lo envió el mismo remitente que la respuesta posterior"
  explanation:
    es: "Un mensaje se elimina si está completamente integrado en una de las respuestas. Que esté leído, que sea el más antiguo o que tenga el mismo remitente no es el criterio: la ayuda lo basa en el contenido, y en su ejemplo se conserva solo el último mensaje porque incluye una copia de todos los anteriores."
  citation: "fuente: `ms-outlook-limpiar-conversacion.html`; «¿Qué hace una limpieza de conversación?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m06-l07-q174
  prompt:
    es: "En Outlook 365, ¿por qué se escribe entre comillas dobles el nombre en la búsqueda de:\"miguel tórrez\", según la tabla de ejemplos de la ayuda?"
  options:
  - id: a
    text:
      es: "Para que Outlook trate el nombre como un operador lógico"
  - id: b
    text:
