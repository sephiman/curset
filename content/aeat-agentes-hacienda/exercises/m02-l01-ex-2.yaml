# anchor: boe-a-2015-10565-art-131
- id: m02-l01-q0011
  prompt:
    es: "De acuerdo con el artículo 131 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las normas con rango de ley, los reglamentos y disposiciones administrativas:"
  options:
  - id: a
    text:
      es: "Entrarán en vigor desde su aprobación, aunque no se publiquen en ningún diario oficial."
  - id: b
    text:
      es: "Producirán efectos desde su notificación a los interesados, sin necesidad de publicación oficial."
  - id: c
    text:
      es: "Habrán de publicarse en el «Boletín Oficial del Estado», cualquiera que sea la Administración autora."
  - id: d
    correct: true
    text:
      es: "Habrán de publicarse en el diario oficial correspondiente para que entren en vigor y produzcan efectos."
  explanation:
    es: "El artículo 131 dice que estas normas «habrán de publicarse en el diario oficial correspondiente para que entren en vigor y produzcan efectos jurídicos». Sin publicación no entran en vigor, y la notificación a los interesados no la sustituye. El diario es el «correspondiente» a cada Administración, no siempre el «Boletín Oficial del Estado»."
  citation: "art. 131 LPAC"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-1889-4763-art-2
- id: m02-l01-q0013
  prompt:
    es: "De acuerdo con el artículo 2.1 del Código Civil, el plazo de veinte días para la entrada en vigor de las leyes:"
  options:
  - id: a
    text:
      es: "Se aplica a todas las leyes, sin que estas puedan fijar un plazo distinto."
  - id: b
    text:
      es: "Solo puede reducirse mediante un real decreto-ley posterior a la ley."
  - id: c
    correct: true
    text:
      es: "Se aplica si en la propia ley no se dispone otra cosa."
  - id: d
    text:
      es: "Solo se aplica a las leyes orgánicas."
  explanation:
    es: "El artículo 2.1 fija los veinte días «si en ellas no se dispone otra cosa». Cada ley puede fijar su propia entrada en vigor, así que la opción que lo prohíbe contradice el texto. El artículo no reserva el cambio a un real decreto-ley ni limita la regla a las leyes orgánicas y los decretos legislativos."
  citation: "art. 2.1 Código Civil"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-75
- id: m02-l01-q0061
  prompt:
    es: "Según el artículo 75.2 de la Constitución Española de 1978, el Pleno podrá recabar el debate y votación de cualquier proyecto o proposición de ley que haya sido objeto de delegación en una Comisión Legislativa Permanente:"
  options:
  - id: a
    text:
      es: "Solo antes de que la Comisión inicie su tramitación."
  - id: b
    text:
      es: "Únicamente cuando lo solicite el Gobierno."
  - id: c
    text:
      es: "Solo dentro de los treinta días siguientes a la delegación."
  - id: d
    correct: true
    text:
      es: "En cualquier momento, no obstante la delegación."
  explanation:
    es: "El artículo 75.2 deja al Pleno la posibilidad de recabar en cualquier momento el debate y votación de lo delegado. No lo limita a un momento anterior al inicio de la tramitación, no exige la petición del Gobierno y no fija un plazo de treinta días, que es el del artículo 86.2 para los Decretos-leyes."
  citation: "art. 75.2 CE"
  difficulty: 3
  tags:
  - "Comisiones Legislativas"
  - "Pleno"
# anchor: boe-a-1978-31229-art-75
- id: m02-l01-q0062
  prompt:
    es: "Señale la respuesta CORRECTA sobre las materias exceptuadas de la delegación en las Comisiones Legislativas Permanentes, de acuerdo con el artículo 75.3 de la Constitución Española de 1978:"
  options:
  - id: a
    correct: true
    text:
      es: "Quedan exceptuados la reforma constitucional, las cuestiones internacionales, las leyes orgánicas y de bases y los Presupuestos Generales del Estado."
  - id: b
    text:
      es: "Quedan exceptuados la reforma constitucional, las cuestiones internacionales, las leyes orgánicas y ordinarias y los Presupuestos Generales del Estado."
  - id: c
    text:
      es: "Quedan exceptuados la reforma constitucional, las cuestiones internacionales y las leyes orgánicas, pero no las leyes de bases ni los Presupuestos Generales del Estado."
  - id: d
    text:
      es: "Quedan exceptuados la reforma constitucional, las leyes orgánicas y de bases, los Presupuestos Generales del Estado y los proyectos de ley tributarios."
  explanation:
    es: "El artículo 75.3 exceptúa cuatro materias de la delegación: la reforma constitucional, las cuestiones internacionales, las leyes orgánicas y de bases, y los Presupuestos Generales del Estado. Las leyes ordinarias sí pueden delegarse; las de bases y los Presupuestos están excluidos expresamente; y los proyectos tributarios no figuran en la lista."
  citation: "art. 75.3 CE"
  difficulty: 3
  tags:
  - "Comisiones Legislativas"
  - "delegación"
# anchor: boe-a-1978-31229-art-81
- id: m02-l01-q0064
  prompt:
    es: "De acuerdo con el artículo 81.2 de la Constitución Española de 1978, la aprobación, modificación o derogación de las leyes orgánicas exigirá mayoría absoluta del Congreso, en una votación final sobre:"
  options:
  - id: a
    correct: true
    text:
      es: "El conjunto del proyecto."
  - id: b
    text:
      es: "Cada uno de los artículos del proyecto."
  - id: c
    text:
      es: "Únicamente el texto remitido por el Senado."
  - id: d
    text:
      es: "El dictamen de la Comisión, sin votación del Pleno."
  explanation:
    es: "El artículo 81.2 exige la mayoría absoluta del Congreso en una votación final sobre el conjunto del proyecto. No se vota artículo por artículo con ese requisito, el Senado no tiene en esta regla un texto propio que se someta aparte, y el Pleno sí vota; no basta el dictamen de una Comisión."
  citation: "art. 81.2 CE"
  difficulty: 2
  tags:
  - "leyes orgánicas"
  - "mayorías"
# anchor: boe-a-1978-31229-art-92
- id: m02-l01-q0080
  prompt:
    es: "Según el artículo 92.3 de la Constitución Española de 1978, una ley orgánica regulará las condiciones y el procedimiento de:"
  options:
  - id: a
    text:
      es: "Las consultas populares de ámbito autonómico o local."
  - id: b
    text:
      es: "Todas las modalidades de consulta popular, estén o no previstas en la Constitución."
  - id: c
    text:
      es: "Únicamente el referéndum consultivo sobre decisiones políticas de especial trascendencia."
  - id: d
    correct: true
    text:
      es: "Las distintas modalidades de referéndum previstas en la Constitución."
  explanation:
    es: "La ley orgánica del artículo 92.3 regula las distintas modalidades de referéndum previstas en la Constitución, no las consultas autonómicas o locales ni cualquier consulta popular. Tampoco se limita al referéndum consultivo del apartado 1, porque habla de todas las modalidades constitucionales."
  citation: "art. 92.3 CE"
  difficulty: 2
  tags:
  - "referéndum"
  - "ley orgánica"
# anchor: boe-a-1889-4763-art-2
- id: m02-l01-q0095
  prompt:
    es: "Señale la respuesta CORRECTA sobre la derogación de las leyes, de acuerdo con el artículo 2.2 del Real Decreto de 24 de julio de 1889 por el que se publica el Código Civil:"
  options:
  - id: a
    text:
      es: "Las leyes se derogan por otras posteriores o por su desuso, y por la simple derogación de una ley no recobran vigencia las que esta hubiere derogado."
  - id: b
    text:
      es: "Las leyes solo se derogan por otras posteriores, y por la simple derogación de una ley recobran vigencia las que esta hubiere derogado."
  - id: c
    text:
      es: "Las leyes se derogan por cualquier disposición posterior, y por la simple derogación de una ley no recobran vigencia las que esta hubiere derogado."
  - id: d
    correct: true
    text:
      es: "Las leyes solo se derogan por otras posteriores, y por la simple derogación de una ley no recobran vigencia las que esta hubiere derogado."
  explanation:
    es: "El artículo 2.2 dice que las leyes solo se derogan por otras posteriores y que la simple derogación de una ley no hace revivir las que esta había derogado. Por eso el desuso no deroga, la vigencia anterior no se recobra automáticamente, y no vale cualquier disposición posterior, sino una ley."
  citation: "art. 2.2 Código Civil"
  difficulty: 2
  tags:
  - "derogación"
# anchor: boe-a-1889-4763-art-2
- id: m02-l01-q0096
  prompt:
    es: "La Ley C deroga la Ley B, que a su vez había derogado la Ley A. La Ley C no dice nada sobre la Ley A. De acuerdo con el artículo 2.2 del Real Decreto de 24 de julio de 1889 por el que se publica el Código Civil, ¿qué ocurre con la Ley A?"
  options:
  - id: a
    correct: true
    text:
      es: "No recobra vigencia por la simple derogación de la Ley B."
  - id: b
    text:
      es: "Recobra vigencia automáticamente desde la derogación de la Ley B."
  - id: c
    text:
      es: "Recobra vigencia solo si la Ley A es de rango superior a la Ley C."
  - id: d
    text:
      es: "Recobra vigencia si lo solicita el Tribunal Supremo."
  explanation:
    es: "El artículo 2.2 establece que por la simple derogación de una ley no recobran vigencia las que esta hubiere derogado, de modo que la Ley A sigue sin vigencia. El rango de la Ley A y la petición del Tribunal Supremo no cambian esa regla."
  citation: "art. 2.2 Código Civil"
  difficulty: 2
  tags:
  - "derogación"
# anchor: boe-a-1889-4763-art-2
- id: m02-l01-q0097
  prompt:
    es: "Señale la respuesta CORRECTA sobre la retroactividad de las leyes, de acuerdo con el artículo 2.3 del Real Decreto de 24 de julio de 1889 por el que se publica el Código Civil:"
  options:
  - id: a
    text:
      es: "Las leyes no tendrán efecto retroactivo, salvo que una disposición reglamentaria disponga lo contrario."
  - id: b
    correct: true
    text:
      es: "Las leyes no tendrán efecto retroactivo, si no dispusieren lo contrario."
  - id: c
    text:
      es: "Las leyes no tendrán efecto retroactivo en ningún caso, aunque dispusieren lo contrario."
  - id: d
    text:
      es: "Las leyes tendrán efecto retroactivo, si no dispusieren lo contrario."
  explanation:
    es: "El artículo 2.3 niega efecto retroactivo a las leyes salvo que ellas mismas dispongan lo contrario, de modo que solo una ley puede dárselo y la que guarda silencio no es retroactiva. Un reglamento no puede otorgarlo, la regla no es absoluta y la retroactividad no es la regla general."
  citation: "art. 2.3 Código Civil"
  difficulty: 1
  tags:
  - "retroactividad"
# anchor: boe-a-1978-31229-art-82
- id: m02-l01-q0066
  prompt:
    es: "Las Cortes Generales quieren delegar en el Gobierno la potestad de dictar un texto articulado sobre una materia determinada. De acuerdo con el artículo 82.2 de la Constitución Española de 1978, ¿mediante qué norma debe otorgarse la delegación legislativa?"
  options:
  - id: a
    text:
      es: "Mediante una ley orgánica."
  - id: b
    text:
      es: "Mediante un Decreto-ley convalidado por el Congreso."
  - id: c
    correct: true
    text:
      es: "Mediante una ley de bases."
  - id: d
    text:
      es: "Mediante un Real Decreto del Presidente del Gobierno."
  explanation:
    es: "Cuando el objeto de la delegación es la formación de textos articulados, el artículo 82.2 exige una ley de bases. La ley ordinaria queda para refundir varios textos legales en uno solo. Una ley orgánica, un Decreto-ley o un Real Decreto no son el instrumento con el que las Cortes delegan en el Gobierno."
  citation: "art. 82.2 CE"
  difficulty: 2
  tags:
  - "delegación legislativa"
# anchor: boe-a-1978-31229-art-82
- id: m02-l01-q0068
  prompt:
    es: "Conforme al artículo 82.3 de la Constitución Española de 1978, la delegación legislativa habrá de otorgarse al Gobierno de forma expresa para:"
  options:
  - id: a
    text:
      es: "Materia concreta, sin que sea necesario fijar el plazo para su ejercicio."
  - id: b
    text:
      es: "Cualquier materia, y con fijación del plazo para su ejercicio."
  - id: c
    correct: true
    text:
      es: "Materia concreta y con fijación del plazo para su ejercicio."
  - id: d
    text:
      es: "Materia concreta, por tiempo indeterminado mientras las Cortes no la revoquen."
  explanation:
    es: "El artículo 82.3 exige una delegación expresa para materia concreta y con fijación de plazo. Prescindir del plazo, extenderla a cualquier materia o concederla por tiempo indeterminado contradice el texto, que prohíbe expresamente entenderla concedida de modo implícito o por tiempo indeterminado."
  citation: "art. 82.3 CE"
  difficulty: 1
  tags:
  - "delegación legislativa"
# anchor: boe-a-1978-31229-art-82
- id: m02-l01-q0069
  prompt:
    es: "¿Cómo se agota la delegación legislativa en el Gobierno, una vez otorgada por las Cortes Generales, según el artículo 82.3 de la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Por el uso que de ella haga el Gobierno mediante la publicación de la norma correspondiente."
  - id: b
    text:
      es: "Por el uso que de ella haga el Gobierno mediante la aprobación de la norma en el Consejo de Ministros."
  - id: c
    text:
      es: "Por el uso que de ella haga el Gobierno mediante la convalidación de la norma por el Congreso."
  - id: d
    text:
      es: "Por el uso que de ella haga el Gobierno mediante la sanción de la norma por el Rey."
  explanation:
    es: "La delegación se agota con el uso que haga el Gobierno, y el artículo 82.3 fija el momento: la publicación de la norma correspondiente. No basta con su aprobación en el Consejo de Ministros, la convalidación por el Congreso es propia de los Decretos-leyes y la sanción regia no es el hecho que la agota."
  citation: "art. 82.3 CE"
  difficulty: 2
  tags:
  - "delegación legislativa"
# anchor: boe-a-1978-31229-art-82
- id: m02-l01-q0070
  prompt:
    es: "Una ley de delegación concede al Gobierno la potestad de dictar un decreto legislativo sobre una materia concreta, pero no fija ningún plazo para ejercerla. Según el artículo 82.3 de la Constitución Española de 1978, ¿cómo debe valorarse esa delegación?"
  options:
  - id: a
    text:
      es: "Cumple la Constitución, porque se entiende concedida por un año desde la publicación de la ley."
  - id: b
    correct: true
    text:
      es: "No cumple la Constitución, porque no puede entenderse concedida por tiempo indeterminado y ha de fijar el plazo para su ejercicio."
  - id: c
    text:
      es: "Cumple la Constitución, porque basta con que la materia sea concreta."
  - id: d
    text:
      es: "Cumple la Constitución, porque el plazo lo fija después el Consejo de Ministros."
  explanation:
    es: "El artículo 82.3 exige que la delegación fije el plazo para su ejercicio y prohíbe entenderla concedida de modo implícito o por tiempo indeterminado. Por eso no se sustituye por un plazo supletorio de un año, no basta que la materia sea concreta y no puede fijarlo después quien la ejerce."
  citation: "art. 82.3 CE"
  difficulty: 3
  tags:
  - "delegación legislativa"
# anchor: boe-a-1978-31229-art-83
- id: m02-l01-q0071
  prompt:
    es: "Conforme al artículo 83 de la Constitución Española de 1978, las leyes de bases, que otorgan la delegación legislativa al Gobierno, no podrán en ningún caso:"
  options:
  - id: a
    text:
      es: "Facultar para formar textos articulados."
  - id: b
    text:
      es: "Fijar el plazo para el ejercicio de la delegación."
  - id: c
    correct: true
    text:
      es: "Autorizar la modificación de la propia ley de bases."
  - id: d
    text:
      es: "Delimitar el objeto y alcance de la delegación legislativa."
  explanation:
    es: "El artículo 83.a) prohíbe a las leyes de bases autorizar su propia modificación. Facultar para formar textos articulados es su función según el artículo 82.2, fijar el plazo es una exigencia del 82.3 y delimitar el objeto y alcance de la delegación es lo que el 82.4 les encomienda."
  citation: "art. 83 CE"
  difficulty: 1
  tags:
  - "leyes de bases"
# anchor: boe-a-1978-31229-art-83
- id: m02-l01-q0072
  prompt:
    es: "Según el artículo 83 de la Constitución Española de 1978, ¿pueden las leyes de bases facultar al Gobierno para dictar normas con carácter retroactivo mediante decreto legislativo?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque las leyes de bases no pueden facultar para dictar normas con carácter retroactivo en ningún caso."
  - id: b
    text:
      es: "Sí, siempre que la retroactividad se refiera a materias determinadas."
  - id: c
    text:
      es: "Sí, si la habilitación se limita a disposiciones favorables a los ciudadanos."
  - id: d
    text:
      es: "No, salvo que la ley de bases la autorice expresamente el Congreso por mayoría absoluta."
  explanation:
    es: "El artículo 83.b) prohíbe en todo caso que las leyes de bases faculten para dictar normas retroactivas, sin excepciones por materia ni por el signo favorable de la norma. Y la prohibición no se levanta con una mayoría reforzada del Congreso."
  citation: "art. 83 CE"
  difficulty: 2
  tags:
  - "leyes de bases"
# anchor: boe-a-1978-31229-art-85
- id: m02-l01-q0073
  prompt:
    es: "¿Qué título reciben las disposiciones del Gobierno que contienen legislación delegada, según el artículo 85 de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Reciben el título de Decretos-leyes."
  - id: b
    correct: true
    text:
      es: "Reciben el título de Decretos Legislativos."
  - id: c
    text:
      es: "Reciben el título de Reales Decretos de desarrollo."
  - id: d
    text:
      es: "Reciben el título de Leyes de bases."
  explanation:
    es: "El artículo 85 reserva el título de Decretos Legislativos para las disposiciones del Gobierno con legislación delegada. Los Decretos-leyes son disposiciones provisionales dictadas en caso de extraordinaria y urgente necesidad (art. 86.1). Los Reales Decretos de desarrollo no tienen rango de ley, y las leyes de bases son las que otorgan la delegación, no las que el Gobierno dicta."
  citation: "art. 85 CE"
  difficulty: 1
  tags:
  - "decretos legislativos"
# anchor: boe-a-1978-31229-art-86
- id: m02-l01-q0074
  prompt:
    es: "Según el artículo 86.1 de la Constitución Española de 1978, los Decretos-leyes que el Gobierno dicta en caso de extraordinaria y urgente necesidad no podrán afectar:"
  options:
  - id: a
    text:
      es: "Al ordenamiento de las instituciones básicas del Estado, a los derechos, deberes y libertades del Título I, al régimen de las Corporaciones locales ni al Derecho electoral general."
  - id: b
    text:
      es: "Al ordenamiento de las instituciones básicas del Estado, a los derechos, deberes y libertades del Título II, al régimen de las Comunidades Autónomas ni al Derecho electoral general."
  - id: c
    text:
      es: "Al ordenamiento de las instituciones básicas del Estado, a los derechos, deberes y libertades del Título I, al régimen de las Comunidades Autónomas ni al Derecho penal."
  - id: d
    correct: true
    text:
      es: "Al ordenamiento de las instituciones básicas del Estado, a los derechos, deberes y libertades del Título I, al régimen de las Comunidades Autónomas ni al Derecho electoral general."
  explanation:
    es: "Los límites del artículo 86.1 son las instituciones básicas del Estado, los derechos, deberes y libertades del Título I, el régimen de las Comunidades Autónomas y el Derecho electoral general. Cada distractor cambia un elemento: las Corporaciones locales por las Comunidades Autónomas, el Título II por el Título I, y el Derecho penal por el Derecho electoral general."
  citation: "art. 86.1 CE"
  difficulty: 3
  tags:
  - "decreto-ley"
  - "límites"
# anchor: boe-a-1978-31229-art-86
- id: m02-l01-q0076
  prompt:
    es: "Según el artículo 86.1 de la Constitución Española de 1978, en caso de extraordinaria y urgente necesidad el Gobierno podrá dictar:"
  options:
  - id: a
    text:
      es: "Disposiciones legislativas provisionales que tomarán la forma de Decretos Legislativos."
  - id: b
    text:
      es: "Disposiciones reglamentarias provisionales que tomarán la forma de Decretos-leyes."
  - id: c
    text:
      es: "Disposiciones legislativas definitivas que tomarán la forma de Decretos-leyes."
  - id: d
    correct: true
    text:
      es: "Disposiciones legislativas provisionales que tomarán la forma de Decretos-leyes."
  explanation:
    es: "El artículo 86.1 habla de disposiciones legislativas provisionales con la forma de Decretos-leyes. Los Decretos Legislativos recogen legislación delegada (art. 85), no tienen carácter provisional ni nacen de la urgencia. Las disposiciones reglamentarias carecen de rango de ley, y definitivas no es el adjetivo que usa el precepto."
  citation: "art. 86.1 CE"
  difficulty: 1
  tags:
  - "decreto-ley"
