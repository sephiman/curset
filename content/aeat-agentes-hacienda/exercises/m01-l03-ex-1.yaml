# anchor: boe-a-1997-25336-art-2
- id: m01-l03-q0007
  prompt:
    es: "¿Cuál de las siguientes funciones corresponde, en todo caso, al Presidente del Gobierno según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Aprobar los Reales Decretos-leyes y los Reales Decretos Legislativos."
  - id: b
    text:
      es: "Crear, modificar y suprimir los órganos directivos de los Departamentos Ministeriales."
  - id: c
    correct: true
    text:
      es: "Interponer el recurso de inconstitucionalidad."
  - id: d
    text:
      es: "Aprobar el Proyecto de Ley de Presupuestos Generales del Estado."
  explanation:
    es: "El artículo 2.2.i) atribuye al Presidente «interponer el recurso de inconstitucionalidad». Las otras tres son funciones del Consejo de Ministros: aprobar los Reales Decretos-leyes y los Reales Decretos Legislativos (art. 5.1.c), crear, modificar y suprimir los órganos directivos de los Departamentos (art. 5.1.i) y aprobar el Proyecto de Ley de Presupuestos (art. 5.1.b)."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-13
- id: m01-l03-q0010
  prompt:
    es: "De acuerdo con el artículo 13.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, en los casos de vacante, ausencia o enfermedad, las funciones del Presidente del Gobierno serán asumidas:"
  options:
  - id: a
    correct: true
    text:
      es: "Por los Vicepresidentes, de acuerdo con su orden de prelación, y, en defecto de ellos, por los Ministros, según el orden de precedencia de los Departamentos."
  - id: b
    text:
      es: "Por el Vicepresidente primero y, en su defecto, por el Ministro de la Presidencia, sin atender al orden de los Departamentos."
  - id: c
    text:
      es: "Por los Vicepresidentes, de acuerdo con su orden de prelación, y, en defecto de ellos, por el Ministro de mayor edad."
  - id: d
    text:
      es: "Por el Ministro que designe el Presidente mediante Real Decreto y, en su defecto, por el Ministro de la Presidencia."
  explanation:
    es: "El artículo 13.1 dice que las funciones del Presidente las asumen «los Vicepresidentes, de acuerdo con el correspondiente orden de prelación, y, en defecto de ellos, por los Ministros, según el orden de precedencia de los Departamentos». La ley no da la suplencia al Ministro de la Presidencia ni al Ministro de mayor edad. La designación por Real Decreto del Presidente es la regla de la suplencia de los Ministros (art. 13.2), no del Presidente."
  citation: "art. 13.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-2
- id: m01-l03-q0040
  prompt:
    es: "¿Cuál de las siguientes funciones corresponde, en todo caso, al Presidente del Gobierno según el artículo 2.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Aprobar los Reales Decretos-leyes."
  - id: b
    correct: true
    text:
      es: "Representar al Gobierno."
  - id: c
    text:
      es: "Remitir los Tratados internacionales a las Cortes Generales."
  - id: d
    text:
      es: "Disponer la emisión de Deuda Pública."
  explanation:
    es: "El artículo 2.2.a atribuye al Presidente la representación del Gobierno. Aprobar los Reales Decretos-leyes, remitir los Tratados a las Cortes y disponer la emisión de Deuda Pública son funciones del Consejo de Ministros, según el artículo 5.1."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-2
- id: m01-l03-q0042
  prompt:
    es: "De acuerdo con el artículo 2.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Presidente del Gobierno propone al Rey la disolución del Congreso, del Senado o de las Cortes Generales, previa:"
  options:
  - id: a
    text:
      es: "Autorización del Congreso de los Diputados."
  - id: b
    text:
      es: "Consulta con los Grupos políticos."
  - id: c
    text:
      es: "Propuesta de la Comisión General de Secretarios de Estado y Subsecretarios."
  - id: d
    correct: true
    text:
      es: "Deliberación del Consejo de Ministros."
  explanation:
    es: "El artículo 2.2.c exige la previa deliberación del Consejo de Ministros. La autorización del Congreso es el requisito de la propuesta de referéndum consultivo. La consulta con los Grupos políticos corresponde a la propuesta de candidato a la Presidencia del Gobierno que hace el Rey. La Comisión General no interviene."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1997-25336-art-2
- id: m01-l03-q0045
  prompt:
    es: "Señale la opción correcta sobre las facultades del Presidente del Gobierno en relación con las reuniones del Consejo de Ministros, según el artículo 2.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno:"
  options:
  - id: a
    text:
      es: "Convocarlas y presidirlas, sin fijar el orden del día."
  - id: b
    text:
      es: "Presidirlas y fijar el orden del día, sin convocarlas."
  - id: c
    text:
      es: "Fijar el orden del día y levantar el acta."
  - id: d
    correct: true
    text:
      es: "Convocarlas, presidirlas y fijar su orden del día."
  explanation:
    es: "El artículo 2.2.g le atribuye convocar, presidir y fijar el orden del día de las reuniones del Consejo de Ministros. Las demás opciones le quitan una de las tres tareas, o le atribuyen el acta, que no le corresponde, sin base en la ley."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-3
- id: m01-l03-q0050
  prompt:
    es: "¿Cuál de las siguientes condiciones ostenta, además, el Vicepresidente que asuma la titularidad de un Departamento Ministerial, según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "La condición de Secretario de Estado."
  - id: b
    text:
      es: "La condición de Subsecretario del Departamento."
  - id: c
    correct: true
    text:
      es: "La condición de Ministro."
  - id: d
    text:
      es: "La condición de Director del Gabinete del Presidente."
  explanation:
    es: "El artículo 3.2 le da, además, la condición de Ministro. Secretario de Estado, Subsecretario y Director del Gabinete son cargos subordinados que un Vicepresidente no adquiere por dirigir un Departamento."
  citation: "art. 3 Ley 50/1997"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1997-25336-art-4
- id: m01-l03-q0051
  prompt:
    es: "Según la Ley 50/1997, de 27 de noviembre, del Gobierno, los Ministros, como titulares de sus Departamentos, tienen competencia y responsabilidad en:"
  options:
  - id: a
    text:
      es: "Toda la acción del Gobierno, junto con el Presidente."
  - id: b
    correct: true
    text:
      es: "La esfera específica de su actuación."
  - id: c
    text:
      es: "Las materias que les delegue el Rey."
  - id: d
    text:
      es: "Las decisiones del Consejo de Ministros en su conjunto."
  explanation:
    es: "El artículo 4.1 limita su competencia y responsabilidad a la esfera específica de su actuación. La dirección de toda la acción del Gobierno corresponde al Presidente, según el artículo 98.2 de la Constitución. El Rey no les delega materias. Las decisiones del Consejo de Ministros son colegiadas."
  citation: "art. 4 Ley 50/1997"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-4
- id: m01-l03-q0052
  prompt:
    es: "Conforme a la Ley 50/1997, de 27 de noviembre, del Gobierno, los Ministros, como titulares de un Departamento, ejercen la potestad reglamentaria:"
  options:
  - id: a
    text:
      es: "En todas las materias, sin habilitación legal."
  - id: b
    text:
      es: "Solo por delegación del Presidente del Gobierno."
  - id: c
    text:
      es: "Solo en materias de organización interna."
  - id: d
    correct: true
    text:
      es: "En las materias propias de su Departamento."
  explanation:
    es: "El artículo 4.1.b les atribuye la potestad reglamentaria en las materias propias de su Departamento. No es general, ni exige una delegación del Presidente, ni se limita a la organización interna."
  citation: "art. 4 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-4
- id: m01-l03-q0054
  prompt:
    es: "De acuerdo con el artículo 4.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, los Ministros, como titulares de sus Departamentos, refrendan, en su caso, los actos del Rey:"
  options:
  - id: a
    text:
      es: "En materia de política general del Gobierno."
  - id: b
    correct: true
    text:
      es: "En materia de su competencia."
  - id: c
    text:
      es: "En materia de los asuntos que les encomiende el Consejo de Ministros."
  - id: d
    text:
      es: "En materia de cualquier Departamento ministerial."
  explanation:
    es: "El artículo 4.1.d atribuye al Ministro refrendar, en su caso, los actos del Rey en materia de su competencia. La política general del Gobierno la dirige el Presidente, no cada Ministro. Los asuntos que encomiende el Consejo de Ministros no amplían el refrendo, que sigue la competencia del Departamento. El refrendo de los actos de cualquier Departamento desborda la esfera específica de actuación del Ministro."
  citation: "art. 4.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-4
- id: m01-l03-q0154
  prompt:
    es: "Según el artículo 4.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, a los Ministros sin cartera se les atribuye la responsabilidad de:"
  options:
  - id: a
    text:
      es: "Un Departamento ministerial propio."
  - id: b
    correct: true
    text:
      es: "Determinadas funciones gubernamentales."
  - id: c
    text:
      es: "Un sector de actividad administrativa de otro Departamento."
  - id: d
    text:
      es: "Las funciones del Presidente del Gobierno en su ausencia."
  explanation:
    es: "El artículo 4.2 les atribuye la responsabilidad de determinadas funciones gubernamentales. Por definición no titulan un Departamento. Tampoco se les asigna un sector de otro Departamento ni la suplencia del Presidente del Gobierno."
  citation: "art. 4.2 Ley 50/1997"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1997-25336-art-18
- id: m01-l03-q0013
  prompt:
    es: "De acuerdo con el artículo 18.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, en las reuniones del Consejo de Ministros:"
  options:
  - id: a
    text:
      es: "El Presidente del Gobierno las convoca y preside, y actúa como Secretario el Director del Secretariado del Gobierno."
  - id: b
    correct: true
    text:
      es: "El Presidente del Gobierno las convoca y preside, y actúa como Secretario el Ministro de la Presidencia."
  - id: c
    text:
      es: "El Presidente del Gobierno las convoca y preside, y actúa como Secretario el Subsecretario de la Presidencia."
  - id: d
    text:
      es: "El Vicepresidente primero las convoca y preside, y actúa como Secretario el Ministro de la Presidencia."
  explanation:
    es: "El artículo 18.1 dice: «El Presidente del Gobierno convoca y preside las reuniones del Consejo de Ministros, actuando como Secretario el Ministro de la Presidencia». El Director del Secretariado del Gobierno suple al Secretario de la Comisión General de Secretarios de Estado y Subsecretarios (art. 8.3). El Subsecretario de la Presidencia es el Secretario de esa Comisión, no del Consejo. El Consejo lo convoca y preside el Presidente, no un Vicepresidente."
  citation: "art. 18.1 Ley 50/1997"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1997-25336-art-18
- id: m01-l03-q0016
  prompt:
    es: "De acuerdo con el artículo 18.4 de la Ley 50/1997, de 27 de noviembre, del Gobierno, en el acta de las sesiones del Consejo de Ministros figurarán, exclusivamente:"
  options:
  - id: a
    correct: true
    text:
      es: "El tiempo y lugar de su celebración, la relación de asistentes, los acuerdos adoptados y los informes presentados."
  - id: b
    text:
      es: "El tiempo y lugar de su celebración, la relación de asistentes, los acuerdos adoptados y el sentido de las deliberaciones."
  - id: c
    text:
      es: "El tiempo y lugar de su celebración, la relación de asistentes, los acuerdos adoptados y los votos particulares formulados."
  - id: d
    text:
      es: "La relación de asistentes, el orden del día, las deliberaciones mantenidas y los acuerdos adoptados."
  explanation:
    es: "El artículo 18.4 dice que en el acta figurarán, exclusivamente, «las circunstancias relativas al tiempo y lugar de su celebración, la relación de asistentes, los acuerdos adoptados y los informes presentados». Las deliberaciones son secretas (art. 5.3) y no constan en el acta, ni su sentido ni su contenido. Los votos particulares no figuran en la lista."
  citation: "art. 18.4 Ley 50/1997"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-1997-25336-art-5
- id: m01-l03-q0057
  prompt:
    es: "¿Qué órgano aprueba los Reales Decretos-leyes y los Reales Decretos Legislativos, según el artículo 5.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "El Presidente del Gobierno."
  - id: b
    text:
      es: "La Comisión General de Secretarios de Estado y Subsecretarios."
  - id: c
    correct: true
    text:
      es: "El Consejo de Ministros."
  - id: d
    text:
      es: "Las Comisiones Delegadas del Gobierno."
  explanation:
    es: "El artículo 5.1.c encomienda al Consejo de Ministros aprobar los Reales Decretos-leyes y los Reales Decretos Legislativos. El Presidente no los aprueba por sí solo. La Comisión General solo prepara asuntos y no puede adoptar acuerdos por delegación del Gobierno. Las Comisiones Delegadas tampoco los aprueban."
  citation: "art. 5.1 Ley 50/1997"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1997-25336-art-5
- id: m01-l03-q0058
  prompt:
    es: "Según el artículo 5.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Consejo de Ministros remite los Tratados internacionales, en los términos previstos en la Constitución:"
  options:
  - id: a
    text:
      es: "Al Consejo de Estado."
  - id: b
    correct: true
    text:
      es: "A las Cortes Generales."
  - id: c
    text:
      es: "Al Rey, para su sanción."
  - id: d
    text:
      es: "Al Congreso de los Diputados, con exclusión del Senado."
  explanation:
    es: "El artículo 5.1.e dice que el Consejo de Ministros remite los Tratados internacionales a las Cortes Generales. Los demás destinos no figuran en ese apartado."
  citation: "art. 5.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-5
- id: m01-l03-q0059
  prompt:
    es: "Señale la opción correcta sobre la función del Consejo de Ministros respecto del estado de sitio, según el artículo 5.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno:"
  options:
  - id: a
    text:
      es: "Declararlo directamente, dando cuenta al Congreso de los Diputados."
  - id: b
    text:
      es: "Declararlo previa autorización del Congreso de los Diputados."
  - id: c
    text:
      es: "Solicitar su declaración al Senado."
  - id: d
    correct: true
    text:
      es: "Proponer al Congreso de los Diputados su declaración."
  explanation:
    es: "El artículo 5.1.f le atribuye proponer al Congreso la declaración del estado de sitio, que el Congreso declara. Declararlo directamente o con autorización del Congreso son las fórmulas de los estados de alarma y de excepción. El Senado no interviene en esa declaración."
  citation: "art. 5.1 Ley 50/1997"
  difficulty: 3
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-5
- id: m01-l03-q0060
  prompt:
    es: "De acuerdo con el artículo 5.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, el Consejo de Ministros dispone la emisión de Deuda Pública o contrae crédito, cuando haya sido autorizado:"
  options:
  - id: a
    correct: true
    text:
      es: "Por una ley."
  - id: b
    text:
      es: "Por el Presidente del Gobierno."
  - id: c
    text:
      es: "Por el Congreso de los Diputados, mediante acuerdo."
  - id: d
    text:
      es: "Por una orden del Ministerio de Hacienda."
  explanation:
    es: "El artículo 5.1.g exige que la emisión de Deuda o el crédito estén autorizados por una ley. Un acuerdo del Congreso, una orden ministerial o la voluntad del Presidente no sustituyen a esa ley."
  citation: "art. 5.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1997-25336-art-18
- id: m01-l03-q0065
  prompt:
    es: "Según la Ley 50/1997, de 27 de noviembre, del Gobierno, las reuniones del Consejo de Ministros, que preside el Presidente del Gobierno, podrán tener carácter:"
  options:
  - id: a
    text:
      es: "Público o reservado, según el asunto."
  - id: b
    correct: true
    text:
      es: "Decisorio o deliberante."
  - id: c
    text:
      es: "Consultivo o vinculante, según el Presidente."
  - id: d
    text:
      es: "Resolutivo o fiscalizador, según el orden del día."
  explanation:
    es: "El artículo 18.2 distingue las reuniones decisorias de las deliberantes. Las demás opciones inventan otras distinciones: sus deliberaciones son secretas, no públicas, y la ley no las clasifica en consultivas, vinculantes, resolutivas ni fiscalizadoras."
  citation: "art. 18.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "concepto"
