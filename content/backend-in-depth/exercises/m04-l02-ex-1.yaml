  - id: d
    correct: true
    text:
      en: 'User(name=John, age=42)

        true

        User(name=John, age=43)

        Empty

        large circle

        circle'
  explanation:
    en: The data class prints its properties, equals an instance with the same values, and `copy` changes only `age`;
      the data object prints its name and the guard picks `large circle` for a radius of 11. The output with `false`
