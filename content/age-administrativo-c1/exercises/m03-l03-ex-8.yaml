# anchor: boe-a-2015-10565-art-114
- id: m03-l03-q224
  prompt:
    es: "Según el artículo 114.2.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué nivel mínimo debe tener un órgano directivo estatal para que sus actos de personal agoten la vía administrativa?"
  options:
  - id: a
    text:
      es: "El nivel de Subdirector general o superior."
  - id: b
    text:
      es: "El nivel de Subsecretario o superior."
  - id: c
    correct: true
    text:
      es: "El nivel de Director general o superior."
  - id: d
    text:
      es: "El nivel de Secretario de Estado o superior."
  explanation:
    es: "El artículo 114.2.c) se refiere a los actos «emanados de los órganos directivos con nivel de Director general o superior, en relación con las competencias que tengan atribuidas en materia de personal». El Subdirector general está por debajo de ese nivel: sus actos de personal no agotan la vía y admiten alzada. Subsecretario y Secretario de Estado están por encima, de modo que no son el nivel mínimo."
  citation: "art. 114.2.c) LPAC"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10565-art-114
- id: m03-l03-q226
  prompt:
    es: "Conforme al artículo 114.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en el ámbito estatal ponen fin a la vía administrativa los actos de los Ministros y Secretarios de Estado:"
  options:
  - id: a
    text:
      es: "Solo cuando resuelvan recursos de alzada interpuestos contra actos de sus órganos dependientes."
  - id: b
    text:
      es: "Solo en materia de personal, como ocurre con los órganos directivos de nivel de Director general."
  - id: c
    text:
      es: "Solo cuando así lo disponga el real decreto de estructura del departamento."
  - id: d
    correct: true
    text:
      es: "En el ejercicio de las competencias que tienen atribuidas los órganos de los que son titulares."
  explanation:
    es: "El artículo 114.2.b) dice que ponen fin a la vía administrativa los actos «emanados de los Ministros y los Secretarios de Estado en el ejercicio de las competencias que tienen atribuidas los órganos de los que son titulares». No se limita a la resolución de alzadas ni a la materia de personal, que es la restricción propia de los órganos directivos (art. 114.2.c). La regla está en la ley y no depende del real decreto de estructura."
  citation: "art. 114.2 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10565-art-114
- id: m03-l03-q227
  prompt:
    es: "Según el artículo 114.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los organismos públicos y entidades de derecho público estatales ponen fin a la vía administrativa los actos emanados de:"
  options:
  - id: a
    correct: true
    text:
      es: "Los máximos órganos de dirección, unipersonales o colegiados, según lo que establezcan sus estatutos."
  - id: b
    text:
      es: "Solo los órganos colegiados de dirección, nunca los unipersonales, según lo que establezcan sus estatutos."
  - id: c
    text:
      es: "Los máximos órganos de dirección, pero solo en las materias de personal y de contratación."
  - id: d
    text:
      es: "Los órganos directivos con nivel de Subdirector general o superior, según sus estatutos."
  explanation:
    es: "El artículo 114.2.d) dice que, en los organismos públicos y entidades de derecho público estatales, ponen fin a la vía administrativa «los emanados de los máximos órganos de dirección unipersonales o colegiados, de acuerdo con lo que establezcan sus estatutos». Limitarlo a los colegiados contradice «unipersonales o colegiados». Limitarlo a personal y contratación no corresponde a la letra d), que habla de los actos de esos órganos sin restringir la materia: la materia de personal es el límite de la letra c), que se refiere a los Directores generales. El nivel de Subdirector general tampoco: la letra c) llega a Director general o superior, y la letra d) se refiere a los máximos órganos de dirección del organismo."
  citation: "art. 114.2 LPAC"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2015-10565-art-114
- id: m03-l03-q228
  prompt:
    es: "¿Cuál de los siguientes actos pone fin a la vía administrativa en el ámbito estatal, según el artículo 114.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Los actos de los Subdirectores generales en materia de contratación."
  - id: b
    text:
      es: "Los actos de trámite simples dictados por los Directores generales."
  - id: c
    text:
      es: "Los actos de los Jefes de Servicio sin competencia delegada."
  - id: d
    correct: true
    text:
      es: "Los actos administrativos de los miembros y órganos del Gobierno."
  explanation:
    es: "El artículo 114.2.a) incluye «los actos administrativos de los miembros y órganos del Gobierno». Los Subdirectores generales y los Jefes de Servicio están por debajo del nivel que fija el artículo 114.2.c), que además se limita a la materia de personal. Un acto de trámite simple no pone fin al procedimiento, sea cual sea el órgano que lo dicta."
  citation: "art. 114.2 LPAC"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10565-art-115
- id: m03-l03-q229
  prompt:
    es: "El error o la ausencia de la calificación del recurso administrativo por parte del recurrente:"
  options:
  - id: a
    correct: true
    text:
      es: "No es obstáculo para su tramitación, siempre que se deduzca su verdadero carácter."
  - id: b
    text:
      es: "Obliga a requerir al recurrente para que lo califique en el plazo de diez días."
  - id: c
    text:
      es: "Obliga a devolver el escrito al recurrente para que lo presente de nuevo con su calificación."
  - id: d
    text:
      es: "No impide su tramitación, pero solo si se presentó ante el órgano competente para resolver."
  explanation:
    es: "El artículo 115.2 de la Ley 39/2015 dice que el error o la ausencia de calificación «no será obstáculo para su tramitación, siempre que se deduzca su verdadero carácter». No hay requerimiento de calificación ni devolución del escrito. La regla tampoco depende del órgano ante el que se presentó."
  citation: "art. 115.2 LPAC"
  difficulty: 1
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-118
- id: m03-l03-q230
  prompt:
    es: "En un recurso de alzada se ponen de manifiesto al interesado documentos nuevos no recogidos en el expediente, por notificación del lunes, 17 de noviembre de 2025. ¿Qué día termina el plazo más corto que se le puede conceder para alegar?"
  options:
  - id: a
    text:
      es: "El jueves, 27 de noviembre de 2025."
  - id: b
    text:
      es: "El lunes, 24 de noviembre de 2025."
  - id: c
    correct: true
    text:
      es: "El lunes, 1 de diciembre de 2025."
  - id: d
    text:
      es: "El miércoles, 17 de diciembre de 2025."
  explanation:
    es: "El artículo 118.1 de la Ley 39/2015 da un plazo «no inferior a diez días ni superior a quince», en días hábiles (art. 30.2). El mínimo son diez días hábiles que empiezan el martes 18 de noviembre. Se excluyen los fines de semana del 22–23 y del 29–30 de noviembre, y no hay festivos en ese periodo: el décimo día hábil es el lunes 1 de diciembre. El jueves 27 resulta de contar diez días naturales. El lunes 24 son cinco días hábiles, por debajo del mínimo. El 17 de diciembre aplica un mes."
  citation: "art. 118.1 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-121
- id: m03-l03-q231
  prompt:
    es: "De acuerdo con el artículo 121.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los actos que no pongan fin a la vía administrativa podrán ser recurridos en alzada ante:"
  options:
  - id: a
    text:
      es: "El mismo órgano que dictó el acto recurrido."
  - id: b
    text:
      es: "El titular del departamento ministerial, en todo caso."
  - id: c
    correct: true
    text:
      es: "El órgano superior jerárquico del que los dictó."
  - id: d
    text:
      es: "El Consejo de Estado, previo informe del órgano autor."
  explanation:
    es: "El artículo 121.1 dice que esos actos «podrán ser recurridos en alzada ante el órgano superior jerárquico del que los dictó». El recurso ante el mismo órgano es la reposición, y procede contra actos que sí ponen fin a la vía (art. 123.1). La alzada no se resuelve siempre por el Ministro, sino por el superior inmediato, y el Consejo de Estado no resuelve recursos."
  citation: "art. 121.1 LPAC"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2015-10565-art-121
- id: m03-l03-q232
  prompt:
    es: "Un recurso de alzada se presenta el lunes, 9 de febrero de 2026, ante el órgano que dictó el acto impugnado. ¿Hasta qué día debe ese órgano remitirlo al competente para resolverlo?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el lunes, 23 de febrero de 2026."
  - id: b
    text:
      es: "Hasta el jueves, 19 de febrero de 2026."
  - id: c
    text:
      es: "Hasta el lunes, 2 de marzo de 2026."
  - id: d
    text:
      es: "Hasta el lunes, 9 de marzo de 2026."
  explanation:
    es: "El artículo 121.2 de la Ley 39/2015 obliga al órgano que dictó el acto a remitir el recurso al competente «en el plazo de diez días», que son hábiles (art. 30.2). El cómputo empieza el martes 10 de febrero y excluye los fines de semana del 14–15 y del 21–22 de febrero; no hay festivos nacionales en ese periodo. El décimo día hábil es el lunes 23 de febrero. El jueves 19 resulta de contar días naturales. El lunes 2 de marzo son quince días hábiles y el lunes 9 de marzo, un mes."
  citation: "art. 121.2 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-122
- id: m03-l03-q233
  prompt:
    es: "Según el artículo 122 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en el recurso de alzada contra un acto expreso, los plazos de interposición y de resolución son:"
  options:
  - id: a
    text:
      es: "Un mes para interponerlo y un mes para dictar y notificar la resolución."
  - id: b
    text:
      es: "Tres meses para interponerlo y un mes para dictar y notificar la resolución."
  - id: c
    text:
      es: "Dos meses para interponerlo y tres meses para dictar y notificar la resolución."
  - id: d
    correct: true
    text:
      es: "Un mes para interponerlo y tres meses para dictar y notificar la resolución."
  explanation:
    es: "El artículo 122.1 fija para la alzada contra un acto expreso un plazo de interposición «de un mes», y el 122.2 un plazo máximo «de tres meses» para dictar y notificar la resolución. Un mes para resolver es el plazo de la reposición (art. 124.2). Los dos meses son el plazo del recurso contencioso-administrativo contra actos expresos (art. 46.1 LJCA)."
  citation: "art. 122.1–2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-122
- id: m03-l03-q234
  prompt:
    es: "Una resolución que no pone fin a la vía administrativa se notifica el martes, 3 de febrero de 2026. ¿Cuál es el último día para interponer contra ella recurso de alzada?"
  options:
  - id: a
    text:
      es: "El martes, 17 de febrero de 2026."
  - id: b
    text:
      es: "El miércoles, 4 de marzo de 2026."
  - id: c
    correct: true
    text:
      es: "El martes, 3 de marzo de 2026."
  - id: d
    text:
      es: "El lunes, 4 de mayo de 2026."
  explanation:
    es: "La alzada contra un acto expreso se interpone en un mes (art. 122.1 de la Ley 39/2015). El plazo empieza el día siguiente a la notificación, miércoles 4 de febrero, y concluye el mismo día del mes siguiente en que se notificó: el martes 3 de marzo de 2026, día hábil (art. 30.4). En un plazo por meses los festivos intermedios no cuentan; solo importa que el último día sea hábil. El 17 de febrero resulta de contar diez días hábiles. El 4 de marzo añade un día de más al cómputo. El 4 de mayo corresponde a tres meses: el 3 de mayo es domingo."
  citation: "art. 122.1 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-122
- id: m03-l03-q235
  prompt:
    es: "Según el artículo 122.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si una resolución recurrible en alzada se notifica el viernes, 30 de enero de 2026, ¿hasta qué día puede interponerse el recurso?"
  options:
  - id: a
    text:
      es: "Hasta el sábado, 28 de febrero de 2026."
  - id: b
    text:
      es: "Hasta el viernes, 27 de febrero de 2026."
  - id: c
    correct: true
    text:
      es: "Hasta el lunes, 2 de marzo de 2026."
  - id: d
    text:
      es: "Hasta el lunes, 30 de marzo de 2026."
  explanation:
    es: "El plazo de la alzada es de un mes (art. 122.1). Empieza el sábado 31 de enero y debería concluir el 30 de febrero, que no existe. Si en el mes de vencimiento no hay día equivalente, el plazo expira el último día del mes (art. 30.4): el sábado 28 de febrero de 2026. El sábado es inhábil, y el plazo se prorroga al primer día hábil siguiente (art. 30.5), el lunes 2 de marzo. Quedarse en el sábado 28 olvida la prórroga, y el viernes 27 la adelanta un día. El 30 de marzo aplica dos meses."
  citation: "art. 122.1 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-122
- id: m03-l03-q236
  prompt:
    es: "Un Subdirector General, en una competencia propia ajena a la materia de personal, dicta una resolución que no pone fin a la vía administrativa y que se notifica el miércoles, 20 de enero de 2027. ¿Qué recurso cabe y hasta qué día?"
  options:
  - id: a
    text:
      es: "Recurso de alzada, hasta el sábado, 20 de febrero de 2027."
  - id: b
    text:
      es: "Recurso potestativo de reposición, hasta el lunes, 22 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "Recurso de alzada, hasta el lunes, 22 de febrero de 2027."
  - id: d
    text:
      es: "Recurso de alzada, hasta el martes, 20 de abril de 2027."
  explanation:
    es: "La resolución no agota la vía administrativa, de modo que cabe alzada ante el superior jerárquico (art. 121.1 de la Ley 39/2015), no reposición, que exige un acto que ponga fin a la vía (art. 123.1). La alzada se interpone en un mes (art. 122.1): el plazo empieza el jueves 21 de enero y concluye el sábado 20 de febrero de 2027 (art. 30.4). Al ser sábado, se prorroga al lunes 22 de febrero (art. 30.5). La fecha del sábado olvida la prórroga y la del 20 de abril aplica tres meses. No hay festivos nacionales en el periodo."
  citation: "art. 122.1 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-122
- id: m03-l03-q237
  prompt:
    es: "Según el artículo 122.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si los efectos del silencio administrativo desestimatorio se producen el jueves, 12 de marzo de 2026, ¿cuándo puede el solicitante interponer alzada?"
  options:
  - id: a
    text:
      es: "Desde el viernes, 13 de marzo, hasta el lunes, 13 de abril de 2026."
  - id: b
    text:
      es: "Desde el viernes, 13 de marzo, hasta el viernes, 12 de junio de 2026."
  - id: c
    text:
      es: "Desde el viernes, 13 de marzo, hasta el lunes, 14 de septiembre de 2026."
  - id: d
    correct: true
    text:
      es: "Desde el viernes, 13 de marzo de 2026, en cualquier momento."
  explanation:
    es: "Si el acto no es expreso, el solicitante puede interponer alzada «en cualquier momento a partir del día siguiente a aquel en que [...] se produzcan los efectos del silencio administrativo» (art. 122.1). El día siguiente es el viernes 13 de marzo de 2026 y no hay fecha final. Las demás opciones aplican un mes (con vencimiento el domingo 12 de abril, prorrogado al lunes 13), tres meses o seis meses (con vencimiento el sábado 12 de septiembre, prorrogado al lunes 14). Ninguno de esos límites está en la ley."
  citation: "art. 122.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "fecha"
  - "cómputo"
# anchor: boe-a-2015-10565-art-122
- id: m03-l03-q238
  prompt:
    es: "Un recurso de alzada tiene entrada en el registro electrónico del órgano competente para resolverlo el miércoles, 16 de septiembre de 2026. ¿Qué día vence el plazo máximo para dictar y notificar la resolución?"
  options:
  - id: a
    text:
      es: "El viernes, 16 de octubre de 2026."
  - id: b
    correct: true
    text:
      es: "El miércoles, 16 de diciembre de 2026."
  - id: c
    text:
      es: "El lunes, 16 de noviembre de 2026."
  - id: d
    text:
      es: "El martes, 16 de marzo de 2027."
  explanation:
    es: "El plazo máximo para dictar y notificar la resolución de la alzada es de tres meses (art. 122.2 de la Ley 39/2015), contados desde la entrada en el registro del órgano competente (art. 21.3). Concluye el mismo día del tercer mes: el miércoles 16 de diciembre de 2026, día hábil. En un plazo por meses los festivos intermedios no cuentan; solo importa que el último día sea hábil. El 16 de octubre aplica un mes, el plazo de la reposición. El 16 de noviembre aplica dos meses y el 16 de marzo de 2027, seis."
  citation: "art. 122.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-122
- id: m03-l03-q240
  prompt:
    es: "Una vez resuelto un recurso de alzada por el superior jerárquico, ¿qué recurso administrativo cabe contra esa resolución?"
  options:
  - id: a
    correct: true
    text:
      es: "Solo el recurso extraordinario de revisión, en los casos del artículo 125.1."
  - id: b
    text:
      es: "El recurso potestativo de reposición ante el órgano que resolvió la alzada."
  - id: c
    text:
      es: "Un nuevo recurso de alzada ante el superior jerárquico del que la resolvió."
  - id: d
    text:
      es: "Ninguno en ningún caso, ni siquiera el recurso extraordinario de revisión del artículo 125."
  explanation:
    es: "El artículo 122.3 de la Ley 39/2015 dice que contra la resolución de una alzada «no cabrá ningún otro recurso administrativo, salvo el recurso extraordinario de revisión, en los casos establecidos en el artículo 125.1». No cabe reposición ni una segunda alzada. Negar también el extraordinario de revisión suprime la excepción que el precepto recoge."
  citation: "art. 122.3 LPAC"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2015-10565-art-124
- id: m03-l03-q242
  prompt:
    es: "Una Orden ministerial que pone fin a la vía administrativa se notifica el miércoles, 14 de enero de 2026. ¿Cuál es el último día para interponer contra ella recurso potestativo de reposición?"
  options:
  - id: a
    text:
      es: "El sábado, 14 de febrero de 2026."
  - id: b
    text:
      es: "El viernes, 13 de febrero de 2026."
  - id: c
    correct: true
    text:
      es: "El lunes, 16 de febrero de 2026."
  - id: d
    text:
      es: "El martes, 14 de abril de 2026."
  explanation:
    es: "La reposición contra un acto expreso se interpone en un mes (art. 124.1 de la Ley 39/2015). El plazo empieza el jueves 15 de enero y concluye el mismo día del mes siguiente, el sábado 14 de febrero de 2026 (art. 30.4). Como es inhábil, se prorroga al lunes 16 de febrero (art. 30.5). No hay festivos en el periodo. Quedarse en el sábado olvida la prórroga y el viernes 13 la adelanta. El 14 de abril aplica tres meses."
  citation: "art. 124.1 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-124
- id: m03-l03-q243
  prompt:
    es: "Según los artículos 123.1 y 124.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el recurso potestativo de reposición contra un acto expreso se interpone:"
  options:
  - id: a
    text:
      es: "En el plazo de un mes, ante el superior jerárquico del que dictó el acto."
  - id: b
    text:
      es: "En el plazo de dos meses, ante el mismo órgano que dictó el acto."
  - id: c
    text:
      es: "En el plazo de tres meses, ante el superior jerárquico del que dictó el acto."
  - id: d
    correct: true
    text:
      es: "En el plazo de un mes, ante el mismo órgano que dictó el acto."
  explanation:
    es: "El artículo 124.1 fija para la reposición contra un acto expreso un plazo «de un mes», y el 123.1 dice que se interpone «ante el mismo órgano que los hubiera dictado». El superior jerárquico es el órgano de la alzada. Dos meses es el plazo del recurso contencioso-administrativo y tres meses, el de resolución de la alzada."
  citation: "art. 124.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-2015-10565-art-124
- id: m03-l03-q244
  prompt:
    es: "Un recurso potestativo de reposición tiene entrada en el registro electrónico del órgano competente el martes, 20 de octubre de 2026. ¿Qué día vence el plazo máximo para dictar y notificar su resolución?"
  options:
  - id: a
    text:
      es: "El martes, 3 de noviembre de 2026."
  - id: b
    text:
      es: "El lunes, 21 de diciembre de 2026."
  - id: c
    text:
      es: "El miércoles, 20 de enero de 2027."
  - id: d
    correct: true
    text:
      es: "El viernes, 20 de noviembre de 2026."
  explanation:
    es: "El artículo 124.2 de la Ley 39/2015 fija en un mes el plazo máximo para dictar y notificar la resolución de la reposición. Desde la entrada en el registro, el plazo concluye el mismo día del mes siguiente: el viernes 20 de noviembre de 2026, día hábil. En un plazo por meses los festivos intermedios no cuentan; solo importa que el último día sea hábil. El 3 de noviembre resulta de contar diez días hábiles. El 21 de diciembre aplica dos meses (el 20 es domingo) y el 20 de enero de 2027, tres meses, que es el plazo de la alzada."
  citation: "art. 124.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-124
- id: m03-l03-q245
  prompt:
    es: "Señale la respuesta correcta sobre el recurso potestativo de reposición, según el artículo 124 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "El plazo máximo para dictar y notificar la resolución del recurso de reposición es de tres meses."
  - id: b
    correct: true
    text:
      es: "Contra la resolución de un recurso de reposición no puede interponerse de nuevo dicho recurso."
  - id: c
    text:
      es: "Contra la resolución del recurso cabe alzada ante el órgano superior jerárquico del que la dictó."
  - id: d
    text:
      es: "Si el acto recurrido es expreso, el plazo de interposición es de dos meses."
  explanation:
    es: "El artículo 124.3 dice que «contra la resolución de un recurso de reposición no podrá interponerse de nuevo dicho recurso». El plazo para resolver es de un mes (art. 124.2), no de tres, que es el de la alzada. La reposición se dirige contra actos que ya agotan la vía, de modo que su resolución no admite alzada. El plazo de interposición contra un acto expreso es de un mes (art. 124.1)."
  citation: "art. 124.3 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "concepto"
# anchor: boe-a-2015-10565-art-123
- id: m03-l03-q246
  prompt:
    es: "En el procedimiento administrativo común, si el interesado ha interpuesto recurso potestativo de reposición, el recurso contencioso-administrativo:"
  options:
  - id: a
    correct: true
    text:
      es: "No podrá interponerse hasta que la reposición se resuelva expresamente o se desestime de forma presunta."
  - id: b
    text:
      es: "Podrá interponerse a la vez, y el órgano administrativo suspenderá entonces la tramitación de la reposición."
  - id: c
    text:
      es: "Podrá interponerse cuando pasen diez días desde la presentación de la reposición sin que se haya resuelto."
  - id: d
    text:
      es: "Ya no podrá interponerse, porque la reposición sustituye a la vía contencioso-administrativa."
  explanation:
    es: "El artículo 123.2 de la Ley 39/2015 dice que «no se podrá interponer recurso contencioso-administrativo hasta que sea resuelto expresamente o se haya producido la desestimación presunta del recurso de reposición interpuesto». Los dos recursos no se tramitan a la vez, y el plazo de diez días no existe: la desestimación presunta llega al vencer el mes del artículo 124.2. La reposición no cierra el paso al contencioso, solo lo aplaza."
  citation: "art. 123.2 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2015-10565-art-123
- id: m03-l03-q247
  prompt:
    es: "Un recurso potestativo de reposición tiene entrada en el registro del órgano competente el lunes, 19 de enero de 2026, y no se dicta ni notifica resolución. ¿Desde qué día puede interponerse el recurso contencioso-administrativo?"
  options:
  - id: a
    text:
      es: "Desde el martes, 20 de enero de 2026."
  - id: b
    correct: true
    text:
      es: "Desde el viernes, 20 de febrero de 2026."
  - id: c
    text:
      es: "Desde el lunes, 20 de abril de 2026."
  - id: d
    text:
      es: "Desde el lunes, 20 de julio de 2026."
  explanation:
    es: "Interpuesta la reposición, el contencioso espera a su resolución o a su desestimación presunta (art. 123.2 de la Ley 39/2015). El plazo para resolver es de un mes (art. 124.2): concluye el jueves 19 de febrero de 2026, día hábil. Vencido ese día sin resolución, la reposición se entiende desestimada y el contencioso cabe desde el viernes 20 de febrero. El 20 de enero es el día siguiente a la presentación, cuando la reposición está pendiente. El 20 de abril aplica tres meses y el 20 de julio, seis."
  citation: "art. 123.2 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "efecto"
# anchor: boe-a-2015-10565-art-125
- id: m03-l03-q248
  prompt:
    es: "De acuerdo con el artículo 125.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el recurso extraordinario de revisión contra actos firmes en vía administrativa se interpone:"
  options:
  - id: a
    text:
      es: "Ante el órgano superior jerárquico del que los dictó, que es el competente para resolverlo."
  - id: b
    text:
      es: "Ante el órgano que los dictó, que lo remite al Consejo de Estado para que lo resuelva."
  - id: c
    text:
      es: "Ante el titular del departamento ministerial, que es el competente para resolverlo en todo caso."
  - id: d
    correct: true
    text:
      es: "Ante el órgano administrativo que los dictó, que también es el competente para resolverlo."
  explanation:
    es: "El artículo 125.1 dice que el recurso se interpone «ante el órgano administrativo que los dictó, que también será el competente para su resolución». No interviene el superior jerárquico, que es el órgano de la alzada, ni el Ministro con carácter general. El Consejo de Estado no resuelve el recurso."
  citation: "art. 125.1 LPAC"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10565-art-125
- id: m03-l03-q249
  prompt:
    es: "Según el artículo 125.1.a) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, procede el recurso extraordinario de revisión cuando al dictar el acto se hubiera incurrido en:"
  options:
  - id: a
    text:
      es: "Error de hecho o de derecho, que resulte de los documentos incorporados al expediente."
  - id: b
    correct: true
    text:
      es: "Error de hecho, que resulte de los propios documentos incorporados al expediente."
  - id: c
    text:
      es: "Error de derecho, que resulte de la interpretación de la norma aplicada al caso."
  - id: d
    text:
      es: "Error de hecho, aunque no resulte de los documentos incorporados al expediente."
  explanation:
    es: "La causa a) exige un «error de hecho, que resulte de los propios documentos incorporados al expediente». El error de derecho no abre este recurso, ni solo ni junto al de hecho. Un error de hecho que no resulte de los documentos del expediente tampoco basta."
  citation: "art. 125.1.a) LPAC"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-10565-art-125
- id: m03-l03-q250
  prompt:
    es: "Tras una resolución firme en vía administrativa aparecen documentos de valor esencial, posteriores a ella, que evidencian su error. ¿Qué recurso cabe y ante qué órgano?"
  options:
  - id: a
    text:
      es: "El recurso extraordinario de revisión, ante el superior jerárquico del que dictó el acto."
  - id: b
    correct: true
    text:
      es: "El recurso extraordinario de revisión, ante el órgano que dictó el acto."
  - id: c
    text:
      es: "El recurso de alzada, ante el superior jerárquico del órgano que dictó el acto."
  - id: d
    text:
      es: "El recurso potestativo de reposición, ante el mismo órgano que dictó el acto."
  explanation:
    es: "El artículo 125.1.b) de la Ley 39/2015 admite el recurso extraordinario de revisión cuando «aparezcan documentos de valor esencial para la resolución del asunto que, aunque sean posteriores, evidencien el error de la resolución recurrida». Se interpone ante el órgano que dictó el acto, que lo resuelve (art. 125.1). La alzada y la reposición no proceden contra un acto ya firme en vía administrativa."
  citation: "art. 125.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10565-art-125
- id: m03-l03-q251
  prompt:
    es: "Conforme al artículo 125.1.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cabe el recurso extraordinario de revisión si en la resolución influyeron esencialmente documentos o testimonios declarados falsos por:"
  options:
  - id: a
    correct: true
    text:
      es: "Sentencia judicial firme, anterior o posterior a aquella resolución."
  - id: b
    text:
      es: "Sentencia judicial firme, siempre que sea anterior a aquella resolución."
  - id: c
    text:
      es: "Resolución administrativa firme, anterior o posterior a aquella resolución."
  - id: d
    text:
      es: "Sentencia judicial, aunque no sea firme, posterior a aquella resolución."
  explanation:
    es: "La causa c) se refiere a documentos o testimonios «declarados falsos por sentencia judicial firme, anterior o posterior a aquella resolución». La sentencia puede ser posterior a la resolución, de modo que exigir que sea anterior es incorrecto. La falsedad la declara un juez, no una resolución administrativa, y la sentencia tiene que ser firme."
  citation: "art. 125.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
