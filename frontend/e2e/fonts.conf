<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<!--
  The e2e browser's text face, set through FONTCONFIG_FILE in the Playwright image (CI and e2e/ci-local.sh).
  The image's default sans is WenQuanYi Zen Hei, whose Latin metrics match no reader's; Liberation Sans has
  Arial's, close to the system faces the app's stack resolves to on readers' devices.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
