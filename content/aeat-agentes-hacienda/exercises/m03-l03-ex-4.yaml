# anchor: boe-a-2003-23186-art-27
- id: m03-l03-q0107
  prompt:
    es: "De acuerdo con el artículo 27.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los recargos por declaración extemporánea son prestaciones accesorias que deben satisfacer los obligados tributarios como consecuencia de la presentación de autoliquidaciones o declaraciones fuera de plazo:"
  options:
  - id: a
    text:
      es: "tras un requerimiento previo de la Administración tributaria."
  - id: b
    text:
      es: "sin haber ingresado la cuota en el período voluntario de pago."
  - id: c
    text:
      es: "sin solicitud previa de aplazamiento o fraccionamiento de la deuda."
  - id: d
    correct: true
    text:
      es: "sin requerimiento previo de la Administración tributaria."
  explanation:
    es: "El recargo se exige a quien presenta fuera de plazo sin requerimiento previo de la Administración. Si hubo requerimiento, el recargo no se aplica y se siguen los intereses de demora del artículo 26. Haber ingresado o no la cuota en voluntaria y haber solicitado o no un aplazamiento no son la condición que fija el precepto."
  citation: "art. 27.1 LGT"
  difficulty: 1
  tags:
  - "condición"
  - "definición"
# anchor: boe-a-2003-23186-art-27
- id: m03-l03-q0108
  prompt:
    es: "El 15 de junio de 2026 la Administración tributaria notifica a Pascual Rojo el inicio de actuaciones de comprobación de su impuesto del ejercicio 2025, cuya autoliquidación no había presentado. El 25 de junio de 2026 Pascual presenta e ingresa esa autoliquidación fuera de plazo. Conforme al artículo 27.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede aplicársele el recargo por declaración extemporánea sin requerimiento previo?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque la notificación del inicio de la comprobación es una actuación con conocimiento formal del obligado y hay requerimiento previo."
  - id: b
    text:
      es: "Sí, porque solo es requerimiento previo la notificación de una liquidación provisional."
  - id: c
    text:
      es: "Sí, porque la comprobación no es requerimiento previo hasta que el obligado conteste a la Administración."
  - id: d
    text:
      es: "No, porque el recargo solo se aplica a las declaraciones presentadas una vez transcurridos doce meses."
  explanation:
    es: "Es requerimiento previo cualquier actuación administrativa realizada con conocimiento formal del obligado y conducente a la comprobación de la deuda, y la notificación del inicio de la comprobación lo es. Por eso no cabe el recargo. No hace falta que se haya notificado una liquidación, ni que el obligado conteste. Y el recargo no se limita a presentaciones tardías de doce meses, sino que se aplica desde el primer mes."
  citation: "art. 27.1 LGT"
  difficulty: 3
  tags:
  - "condición"
  - "efecto"
# anchor: boe-a-2003-23186-art-27
- id: m03-l03-q0109
  prompt:
    es: "Según el artículo 27.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el recargo por declaración extemporánea sin requerimiento previo será un porcentaje igual al 1 por ciento más otro 1 por ciento adicional por cada:"
  options:
  - id: a
    correct: true
    text:
      es: "mes completo de retraso con que se presente la autoliquidación o declaración respecto al término del plazo establecido."
  - id: b
    text:
      es: "mes natural iniciado de retraso con que se presente la autoliquidación o declaración respecto al término del plazo."
  - id: c
    text:
      es: "trimestre completo de retraso con que se presente la autoliquidación o declaración respecto al término del plazo."
  - id: d
    text:
      es: "quince días naturales de retraso con que se presente la autoliquidación o declaración respecto al término del plazo establecido."
  explanation:
    es: "Al 1 por ciento inicial se suma otro 1 por ciento por cada mes completo de retraso. El mes empezado no cuenta, y tampoco se computan por trimestres ni por períodos de quince días."
  citation: "art. 27.2 LGT"
  difficulty: 1
  tags:
  - "porcentaje"
  - "plazo"
# anchor: boe-a-2003-23186-art-27
- id: m03-l03-q0110
  prompt:
    es: "El plazo de presentación e ingreso de una autoliquidación de Fruterías Mediterráneo, S.L., terminó el viernes 20 de marzo de 2026. La sociedad la presenta e ingresa, sin requerimiento previo, el martes 21 de julio de 2026, por un importe a ingresar de 3.000 euros. Según el artículo 27.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué recargo se le exige?"
  options:
  - id: a
    text:
      es: "180 euros, porque el mes iniciado el 21 de julio cuenta como completo."
  - id: b
    text:
      es: "120 euros, porque el 1 por ciento inicial no se suma a los meses completos."
  - id: c
    text:
      es: "150 euros, más los intereses de demora devengados hasta la presentación."
  - id: d
    correct: true
    text:
      es: "150 euros, sin intereses de demora ni sanciones."
  explanation:
    es: "Del 20 de marzo al 20 de julio de 2026 pasan cuatro meses completos: 20 de abril, 20 de mayo, 20 de junio y 20 de julio. El 21 de julio no completa un quinto. El recargo es el 1 por ciento más un 1 por ciento por cada uno de los cuatro meses, es decir, el 5 por ciento, y el 5 por ciento de 3.000 euros son 150 euros. Contar el mes iniciado daría el 6 por ciento y 180 euros. Omitir el 1 por ciento inicial daría el 4 por ciento y 120 euros. Y el recargo excluye los intereses de demora devengados hasta la presentación y las sanciones."
  citation: "art. 27.2 LGT"
  difficulty: 2
  tags:
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-27
- id: m03-l03-q0111
  prompt:
    es: "El plazo de presentación e ingreso de una autoliquidación de Carmen Valdés terminó el lunes 20 de julio de 2026. Carmen la presenta e ingresa, sin requerimiento previo, el martes 2 de marzo de 2027, por un importe a ingresar de 2.500 euros. Conforme al artículo 27.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué recargo debe satisfacer?"
  options:
  - id: a
    text:
      es: "175 euros, el 7 por ciento del importe a ingresar."
  - id: b
    correct: true
    text:
      es: "200 euros, el 8 por ciento del importe a ingresar."
  - id: c
    text:
      es: "225 euros, el 9 por ciento del importe a ingresar."
  - id: d
    text:
      es: "375 euros, el 15 por ciento del importe a ingresar."
  explanation:
    es: "Entre el 20 de julio de 2026 y el 2 de marzo de 2027 hay siete meses completos, hasta el 20 de febrero de 2027. El 2 de marzo no completa el octavo. El recargo es el 1 por ciento inicial más un 1 por ciento por cada mes completo, el 8 por ciento, y el 8 por ciento de 2.500 euros son 200 euros. El 7 por ciento olvida el 1 por ciento inicial, el 9 por ciento cuenta el mes empezado y el 15 por ciento solo se aplica pasados doce meses."
  citation: "art. 27.2 LGT"
  difficulty: 2
  tags:
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-27
- id: m03-l03-q0117
  prompt:
    es: "Según el artículo 27.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, no se exigen los recargos si el obligado regulariza hechos idénticos a los regularizados por la Administración y concurren ciertas circunstancias. Señale la que NO es una de ellas:"
  options:
  - id: a
    text:
      es: "Que se produzca el completo reconocimiento y pago de las cantidades resultantes de la declaración o autoliquidación."
  - id: b
    correct: true
    text:
      es: "Que el obligado haya presentado en plazo todas las declaraciones del mismo concepto de los períodos anteriores."
  - id: c
    text:
      es: "Que no se presente solicitud de rectificación ni se interponga recurso o reclamación contra la liquidación dictada."
  - id: d
    text:
      es: "Que de la regularización efectuada por la Administración no derive la imposición de una sanción."
  explanation:
    es: "Las circunstancias del artículo 27.2 son cuatro: presentar en seis meses desde la notificación de la liquidación, reconocer y pagar completamente las cantidades, no solicitar rectificación ni recurrir la liquidación, y que la regularización no lleve una sanción. Haber presentado en plazo todas las declaraciones anteriores no es una de ellas."
  citation: "art. 27.2 LGT"
  difficulty: 3
  tags:
  - "condición"
  - "requisito"
# anchor: boe-a-2003-23186-art-27
- id: m03-l03-q0118
  prompt:
    es: "La Administración tributaria notifica el 10 de marzo de 2026 a Ana Peña una liquidación por un período de su impuesto. El 20 de abril de 2026 Ana presenta e ingresa por completo la autoliquidación de otro período del mismo concepto, por hechos idénticos a los regularizados. No pide rectificación ni recurre la liquidación, y esta no lleva sanción. Según el artículo 27.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿se le exigen recargos por declaración extemporánea?"
  options:
  - id: a
    text:
      es: "Sí, el 1 por ciento más otro 1 por ciento por cada mes completo de retraso del otro período."
  - id: b
    text:
      es: "Sí, porque solo se evitan los recargos si la presentación se hace antes de que finalice el plazo voluntario de la liquidación."
  - id: c
    correct: true
    text:
      es: "No, porque presenta en seis meses desde la notificación y concurren las demás circunstancias del precepto."
  - id: d
    text:
      es: "No, pero se le exige la sanción que corresponda por no haber presentado el otro período en plazo."
  explanation:
    es: "Ana presenta el 20 de abril de 2026, dentro de los seis meses siguientes al 11 de marzo, que vencen el 10 de septiembre de 2026. Ingresa por completo, no pide rectificación ni recurre, y la liquidación no lleva sanción. Concurren las cuatro circunstancias, así que no se exigen los recargos. El precepto no condiciona la exención al plazo voluntario de la liquidación, y tampoco prevé una sanción adicional por esa presentación."
  citation: "art. 27.2 LGT"
  difficulty: 3
  tags:
  - "cómputo"
  - "condición"
# anchor: boe-a-2003-23186-art-27
- id: m03-l03-q0119
  prompt:
    es: "Conforme al artículo 27.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el incumplimiento de cualquiera de las circunstancias que permiten no exigir los recargos por regularizar otros períodos determinará:"
  options:
  - id: a
    correct: true
    text:
      es: "la exigencia del recargo correspondiente sin más requisito que la notificación al interesado."
  - id: b
    text:
      es: "la exigencia del recargo correspondiente previa tramitación de un procedimiento sancionador."
  - id: c
    text:
      es: "la pérdida de la exención del recargo solo si se incumplen todas las circunstancias."
  - id: d
    text:
      es: "la exigencia de la sanción pertinente, además del recargo, sin más requisito que la notificación."
  explanation:
    es: "Basta incumplir cualquiera de las circunstancias para que se exija el recargo correspondiente, y solo hace falta notificarlo al interesado. No se necesita un procedimiento sancionador, ni incumplirlas todas, y el recargo no lleva aparejada una sanción."
  citation: "art. 27.2 LGT"
  difficulty: 2
  tags:
  - "efecto"
  - "condición"
# anchor: boe-a-2003-23186-art-27
- id: m03-l03-q0120
  prompt:
    es: "Según el artículo 27.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, para que sea aplicable el artículo 27, las autoliquidaciones extemporáneas deberán identificar expresamente el período impositivo de liquidación al que se refieren y contener:"
  options:
  - id: a
    text:
      es: "los datos de todos los períodos impositivos pendientes de ingreso."
  - id: b
    text:
      es: "los datos de ese período y los de los ejercicios anteriores no prescritos."
  - id: c
    text:
      es: "los datos de ese período y la solicitud de aplazamiento del importe a ingresar."
  - id: d
    correct: true
    text:
      es: "únicamente los datos relativos a dicho período."
  explanation:
    es: "Las autoliquidaciones extemporáneas deben identificar el período impositivo y contener únicamente los datos de ese período. Incluir otros períodos, ejercicios anteriores o una solicitud de aplazamiento no cumple la exigencia del artículo 27.4."
  citation: "art. 27.4 LGT"
  difficulty: 1
  tags:
  - "requisito"
  - "condición"
# anchor: boe-a-2003-23186-art-27
- id: m03-l03-q0121
  prompt:
    es: "De acuerdo con el artículo 27.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el importe de los recargos del apartado 2 se reducirá en el:"
  options:
  - id: a
    text:
      es: "30 por ciento, siempre que se realicen los ingresos en los plazos que el propio artículo establece."
  - id: b
    correct: true
    text:
      es: "25 por ciento, siempre que se realicen los ingresos en los plazos que el propio artículo establece."
  - id: c
    text:
      es: "20 por ciento, siempre que se realicen los ingresos en los plazos que el propio artículo establece."
  - id: d
    text:
      es: "50 por ciento, siempre que se realicen los ingresos en los plazos que el propio artículo establece."
  explanation:
    es: "La reducción del recargo es del 25 por ciento si se ingresan los importes en los plazos del artículo 27.5. El 30 por ciento es la reducción de las sanciones por conformidad, y el 20 y el 50 por ciento no son la reducción del recargo."
  citation: "art. 27.5 LGT"
  difficulty: 1
  tags:
  - "porcentaje"
  - "cantidad"
# anchor: boe-a-2003-23186-art-27
- id: m03-l03-q0122
  prompt:
    es: "Conforme al artículo 27.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre los requisitos para reducir el recargo por declaración extemporánea:"
  options:
  - id: a
    text:
      es: "Basta ingresar el total del importe restante del recargo en el plazo de pago abierto con la notificación de su liquidación, sin que importe el pago de la deuda."
  - id: b
    text:
      es: "Debe ingresarse el total de la deuda al presentar la autoliquidación, pero el recargo puede pagarse en cualquier momento del período ejecutivo."
  - id: c
    correct: true
    text:
      es: "Debe ingresarse el total del importe restante del recargo en el plazo de pago abierto con la notificación de su liquidación, y el total de la deuda al presentar la autoliquidación o en su plazo."
  - id: d
    text:
      es: "Debe ingresarse el recargo al presentar la autoliquidación, y la deuda puede pagarse después sin solicitar aplazamiento alguno."
  explanation:
    es: "La reducción exige dos ingresos: el del importe restante del recargo, en el plazo abierto con la notificación de su liquidación, y el de la deuda de la autoliquidación o de la liquidación derivada de la declaración, al presentarla o en su plazo. Pagar solo el recargo, dejar el recargo para el período ejecutivo o pagar la deuda tarde y sin aplazamiento no cumple los requisitos."
  citation: "art. 27.5 LGT"
  difficulty: 3
  tags:
  - "requisito"
  - "condición"
# anchor: boe-a-2003-23186-art-27
- id: m03-l03-q0123
  prompt:
    es: "El plazo de presentación e ingreso de una autoliquidación de Gráficas Ebro, S.L., terminó el miércoles 20 de mayo de 2026. La sociedad la presenta, sin requerimiento previo, el jueves 23 de julio de 2026 e ingresa en ese momento los 6.000 euros a ingresar. Después ingresa el importe restante del recargo dentro del plazo que abre la notificación de su liquidación. Según los artículos 27.2 y 27.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué recargo satisface?"
  options:
  - id: a
    text:
      es: "144 euros, tras reducir en el 20 por ciento el recargo del 3 por ciento."
  - id: b
    text:
      es: "126 euros, tras reducir en el 30 por ciento el recargo del 3 por ciento."
  - id: c
    text:
      es: "180 euros, porque la reducción exige ingresar también el recargo al presentar la autoliquidación."
  - id: d
    correct: true
    text:
      es: "135 euros, tras reducir en el 25 por ciento el recargo del 3 por ciento."
  explanation:
    es: "Del 20 de mayo al 20 de julio de 2026 pasan dos meses completos: 20 de junio y 20 de julio. El 23 de julio no completa el tercero. El recargo es el 1 por ciento más un 1 por ciento por cada mes completo, el 3 por ciento, y el 3 por ciento de 6.000 euros son 180 euros. La sociedad ingresa la deuda al presentar y el resto del recargo en el plazo de la notificación, así que se reduce en el 25 por ciento: 180 menos 45 son 135 euros. Las reducciones del 20 y del 30 por ciento no existen en el precepto, y no hace falta pagar el recargo al presentar."
  citation: "art. 27.5 LGT"
  difficulty: 3
  tags:
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-27
- id: m03-l03-q0124
  prompt:
    es: "Según el artículo 27.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si no se hacen los ingresos que condicionan la reducción del recargo en los plazos previstos, el importe de la reducción practicada:"
  options:
  - id: a
    correct: true
    text:
      es: "se exigirá sin más requisito que la notificación al interesado."
  - id: b
    text:
      es: "solo se exigirá tras tramitar un procedimiento de comprobación limitada."
  - id: c
    text:
      es: "no se exigirá, porque la reducción practicada se considera definitiva."
  - id: d
    text:
      es: "se exigirá solo si el obligado ha cometido una infracción tributaria."
  explanation:
    es: "Si no se hacen los ingresos en los plazos, la reducción se exige sin más requisito que la notificación al interesado. No hay que tramitar un procedimiento de comprobación, la reducción no es definitiva y no depende de que exista una infracción."
  citation: "art. 27.5 LGT"
  difficulty: 1
  tags:
  - "efecto"
  - "condición"
# anchor: boe-a-2003-23186-art-26
- id: m03-l03-q0126
  prompt:
    es: "En un ejercicio en que el interés legal del dinero fuera del 4 por ciento y la Ley de Presupuestos Generales del Estado no estableciera otro interés diferente, ¿cuál sería el interés de demora según el artículo 26.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "El 4 por ciento anual, el interés legal sin incremento alguno."
  - id: b
    text:
      es: "El 6 por ciento anual, el interés legal incrementado en dos puntos."
  - id: c
    text:
      es: "El 4,25 por ciento anual, el interés legal incrementado en 0,25 puntos."
  - id: d
    correct: true
    text:
      es: "El 5 por ciento anual, el interés legal incrementado en un 25 por ciento."
  explanation:
    es: "El interés de demora es el interés legal incrementado en un 25 por ciento: el 25 por ciento de 4 es 1, y el resultado es el 5 por ciento. El interés legal sin incremento solo se exige en los supuestos con aval o seguro de caución. Los incrementos de dos puntos o de 0,25 puntos no son lo que establece el precepto, que habla de un porcentaje del interés legal."
  citation: "art. 26.6 LGT"
  difficulty: 2
  tags:
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-26
- id: m03-l03-q0127
  prompt:
    es: "Una deuda tributaria aplazada en 2026 está garantizada en su totalidad con aval solidario de una entidad de crédito. Según el artículo 26.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, y la Ley 31/2022, de 23 de diciembre, de Presupuestos Generales del Estado para el año 2023, prorrogada para 2026, ¿qué interés se exige en 2026?"
  options:
  - id: a
    text:
      es: "El interés de demora general, el 4,0625 por ciento anual."
  - id: b
    correct: true
    text:
      es: "El interés legal del dinero, el 3,25 por ciento anual."
  - id: c
    text:
      es: "El interés legal incrementado en un 25 por ciento, el 4,0625 por ciento anual."
  - id: d
    text:
      es: "El interés legal reducido a la mitad, el 1,625 por ciento anual."
  explanation:
    es: "Si la deuda aplazada está garantizada en su totalidad con aval solidario de una entidad de crédito, el interés exigible es el interés legal, que en 2026 es el 3,25 por ciento por la Ley 31/2022 prorrogada. El 4,0625 por ciento es el interés de demora general, que es el legal incrementado en un 25 por ciento, y no se aplica a estas deudas. El interés legal reducido a la mitad no existe en el precepto."
  citation: "art. 26.6 LGT"
  difficulty: 3
  tags:
  - "porcentaje"
  - "condición"
# anchor: boe-a-2003-23186-art-58
- id: m03-l03-q0128
  prompt:
    es: "Según los artículos 25.1 y 58.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el interés de demora:"
  options:
  - id: a
    text:
      es: "Es una obligación tributaria accesoria, pero no forma parte de la deuda tributaria."
  - id: b
    text:
      es: "No es una obligación tributaria accesoria, aunque sí forma parte de la deuda tributaria."
  - id: c
    correct: true
    text:
      es: "Es una obligación tributaria accesoria y forma parte de la deuda tributaria."
  - id: d
    text:
      es: "No es una obligación tributaria accesoria ni forma parte de la deuda, que solo comprende la cuota."
  explanation:
    es: "El interés de demora es una obligación accesoria y, además, la deuda tributaria está integrada, en su caso, por él. No se puede separar una cosa de la otra, ni limitar la deuda a la cuota, porque el artículo 58.2 incluye también los intereses y los recargos."
  citation: "art. 58.2 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "efecto"
# anchor: boe-a-2003-23186-art-27
- id: m03-l03-q0130
  prompt:
    es: "El plazo de presentación e ingreso de una autoliquidación de Textiles Alcor, S.L., terminó el jueves 20 de agosto de 2026. La sociedad la presenta e ingresa, sin requerimiento previo, el lunes 21 de septiembre de 2026, por un importe a ingresar de 2.000 euros. Según el artículo 27.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué recargo debe satisfacer?"
  options:
  - id: a
    text:
      es: "20 euros, el 1 por ciento sin sumar el mes completo de retraso."
  - id: b
    text:
      es: "60 euros, el 3 por ciento por contar también el mes empezado."
  - id: c
    text:
      es: "300 euros, el 15 por ciento por superar el plazo de un mes."
  - id: d
    correct: true
    text:
      es: "40 euros, el 2 por ciento por un mes completo de retraso."
  explanation:
    es: "Del 20 de agosto al 20 de septiembre de 2026 pasa un mes completo, y el 21 de septiembre no inicia un segundo mes completo. El recargo es el 1 por ciento más un 1 por ciento por ese mes, el 2 por ciento, y el 2 por ciento de 2.000 euros son 40 euros. El 1 por ciento omite el mes, el 3 por ciento cuenta uno que no se ha completado, y el 15 por ciento solo se aplica pasados doce meses."
  citation: "art. 27.2 LGT"
  difficulty: 2
  tags:
  - "cómputo"
  - "porcentaje"
# anchor: boe-a-2003-23186-art-21
- id: m03-l03-q0160
  prompt:
    es: "De acuerdo con el artículo 21.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la ley propia de cada tributo puede establecer la exigibilidad de la cuota o cantidad a ingresar, o de parte de ella:"
  options:
  - id: a
    text:
      es: "En el mismo momento del devengo, sin posibilidad de fijar otro distinto."
  - id: b
    correct: true
    text:
      es: "En un momento distinto al del devengo del tributo."
  - id: c
    text:
      es: "Solo en el período voluntario posterior a la notificación de la liquidación."
  - id: d
    text:
      es: "En el momento en que la Administración requiera su pago al obligado tributario."
  explanation:
    es: "La ley propia de cada tributo puede establecer la exigibilidad de la cuota, o de parte de ella, en un momento distinto al del devengo (art. 21.2). Negar esa posibilidad contradice el precepto. Limitar la exigibilidad al período voluntario posterior a una liquidación o dejarla al requerimiento de la Administración sustituye la regla legal por un momento que la norma no prevé."
  citation: "art. 21.2 LGT"
  difficulty: 3
  tags:
  - "devengo"
  - "exigibilidad"
# anchor: boe-a-2003-23186-art-27
- id: m03-l03-q0164
  prompt:
    es: "En las liquidaciones derivadas de declaraciones presentadas fuera de plazo sin requerimiento previo, ¿durante qué tiempo se excluyen los intereses de demora, según el artículo 27.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Por el transcurrido desde la notificación de la liquidación hasta su ingreso efectivo por el obligado."
  - id: b
    text:
      es: "Por el transcurrido desde el inicio del período ejecutivo hasta el pago de la deuda."
  - id: c
    correct: true
    text:
      es: "Por el transcurrido desde la presentación de la declaración hasta la finalización del plazo de pago en período voluntario de la liquidación."
  - id: d
    text:
      es: "Por el transcurrido desde la presentación de la declaración hasta que se dicte la liquidación."
  explanation:
    es: "En las liquidaciones derivadas de declaraciones presentadas fuera de plazo sin requerimiento previo no se exigen intereses de demora por el tiempo transcurrido desde la presentación hasta la finalización del plazo de pago en período voluntario de la liquidación que se practique (art. 27.2). Ese plazo se abre con la notificación de la liquidación, de modo que no basta que se dicte: el tiempo exento llega hasta el fin del plazo de pago. Hasta el ingreso efectivo sería un período mayor que el previsto, y el período ejecutivo queda fuera de la regla."
  citation: "art. 27.2 LGT"
  difficulty: 2
  tags:
  - "recargo extemporáneo"
  - "intereses de demora"
  - "liquidación"
# anchor: boe-a-2003-23186-art-26
- id: m03-l03-q0166
  prompt:
    es: "De acuerdo con el artículo 26.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la exigencia del interés de demora tributario no requiere:"
  options:
  - id: a
    text:
      es: "La previa intimación de la Administración, aunque sí la concurrencia de un retraso culpable en el obligado."
  - id: b
    text:
      es: "La concurrencia de un retraso culpable en el obligado, aunque sí la previa intimación de la Administración."
  - id: c
    text:
      es: "Ni la previa intimación ni el retraso culpable, salvo cuando el obligado hubiera recibido un requerimiento."
  - id: d
    correct: true
    text:
      es: "La previa intimación de la Administración ni la concurrencia de un retraso culpable en el obligado."
  explanation:
    es: "La exigencia del interés de demora no requiere la previa intimación de la Administración ni la concurrencia de un retraso culpable en el obligado (art. 26.1). Las dos primeras alternativas mantienen una de las dos exigencias, y la norma las excluye a ambas. La tercera añade una excepción por requerimiento que el precepto no contiene."
  citation: "art. 26.1 LGT"
  difficulty: 1
  tags:
  - "interés de demora"
  - "intimación"
