    - id: m03-l15
      title:
        es: 'El Impuesto sobre la Renta de las Personas Físicas (I). Naturaleza, objeto y ámbito de aplicación. Sujeción
          al impuesto: aspectos materiales, personales y temporales. Rendimientos del trabajo, rendimientos
          del capital mobiliario, rendimientos del capital inmobiliario, rendimientos de actividades
          económicas. Imputación de rentas inmobiliarias. Ganancias y pérdidas patrimoniales.'
      summary:
        es: 'El IRPF grava la renta de las personas físicas: los rendimientos del trabajo, del capital y de las
          actividades económicas, las ganancias y pérdidas patrimoniales y las imputaciones de renta. La lección trata
          quién es contribuyente, las rentas exentas, el período impositivo y el devengo, cómo se calcula cada clase
          de renta, las dietas del artículo 9 del RIRPF, la reducción por el arrendamiento de vivienda del artículo
          23.2 de la LIRPF y los límites de la estimación objetiva. El artículo 85 de la LIRPF imputa renta por los
          inmuebles urbanos, y por los rústicos con construcciones no indispensables para explotaciones agrícolas,
          ganaderas o forestales, no afectos a actividades económicas ni generadores de rendimientos del capital,
          excluida la vivienda habitual y el suelo no edificado; desde el 01-01-2027 rige una redacción nueva de su
          apartado 1 (Real Decreto-ley 29/2026).'
