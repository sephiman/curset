- id: m04-l01-q07
  prompt:
    en: Kotlin reads the JSR-305 annotation `@Nonnull(when = ...)` on a Java type. Which `when` value forces Kotlin
      to treat the type as a platform type?
  options:
  - id: a
    text:
      en: '`When.ALWAYS`'
  - id: b
    correct: true
    text:
      en: '`When.UNKNOWN`'
  - id: c
    text:
      en: '`When.MAYBE`'
  - id: d
    text:
      en: '`When.NEVER`'
  explanation:
    en: '`When.UNKNOWN` forces the type to be a platform type. `When.ALWAYS` is wrong because it makes the annotated
      type non-nullable. `When.MAYBE` is wrong because it denotes a nullable type. `When.NEVER` is wrong because
      it also denotes a nullable type.'
  citation: kotlin-docs-java-interop#jsr-305-support
  extract:
