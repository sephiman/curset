  prompt:
    es: "Señale la respuesta CORRECTA sobre la pérdida o inutilización definitiva de los bienes de inversión, según el artículo 107.Seis de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Si es por causa no imputable al sujeto pasivo, la regularización se practica en un solo acto por los años restantes."
