# anchor: fuente-ms-outlook-agregar-cuenta-html
- id: m06-l07-q075
  prompt:
    es: "En Outlook 365, según la ayuda de Microsoft, ¿cuál de las siguientes funciones sirve para programar reuniones y citas fácilmente?"
  options:
  - id: a
    text:
      es: "Compartir archivos desde la nube"
  - id: b
    text:
      es: "Organizar el correo electrónico"
  - id: c
    text:
      es: "Seguir conectado y productivo desde cualquier lugar"
  - id: d
    correct: true
    text:
      es: "Administrar el calendario"
  explanation:
    es: "La página enumera lo que se puede hacer con Outlook y empareja cada función con su fin: administrar el calendario, para programar reuniones y citas fácilmente. Compartir archivos desde la nube es para que todos los usuarios tengan siempre la versión más reciente, y organizar el correo electrónico, para centrarse en los mensajes más importantes. Seguir conectado y productivo desde cualquier lugar es otra función de la lista, sin relación con programar reuniones."
  citation: "fuente: `ms-outlook-agregar-cuenta.html`; «Inicio rápido: Agregar una cuenta de correo electrónico a Outlook»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-vistas-html
- id: m06-l07-q103
  prompt:
    es: "En Outlook 365 clásico, el tipo de vista que muestra la información en filas y columnas, y que la ayuda señala como una de las más eficaces para el correo, es:"
  options:
  - id: a
    text:
      es: "Día, semana y mes"
  - id: b
    text:
      es: "Icono"
  - id: c
    text:
      es: "Línea de tiempo"
  - id: d
    correct: true
    text:
      es: "Tabla"
  explanation:
    es: "La vista Tabla muestra la información en filas y columnas y la ayuda la señala como una de las más eficaces para el correo. Icono muestra cada elemento con un icono y su asunto. Línea de tiempo coloca los elementos en una escala de tiempo fija. Día, semana y mes se usa normalmente en carpetas de calendario."
  citation: "fuente: `ms-outlook-vistas.html`; «Tipos de vistas»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-vistas-html
- id: m06-l07-q105
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes vistas muestra los elementos a lo largo de una escala de tiempo fija y resulta útil para tareas o carpetas con pocos elementos?"
  options:
  - id: a
    text:
      es: "Tabla"
  - id: b
    text:
      es: "Tarjeta de presentación"
  - id: c
    text:
      es: "Icono"
  - id: d
    correct: true
    text:
      es: "Línea de tiempo"
  explanation:
    es: "La vista de escala de tiempo, llamada Línea de tiempo, sitúa los elementos sobre una escala fija. Tabla usa filas y columnas. Icono muestra icono y asunto. Tarjeta de presentación enseña los campos con datos de cada contacto."
  citation: "fuente: `ms-outlook-vistas.html`; «Tipos de vistas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-vistas-html
- id: m06-l07-q106
  prompt:
    es: "En Outlook 365 clásico, ¿qué vista muestra cada elemento con un icono y su asunto y es útil para carpetas con pocos elementos o para carpetas de notas?"
  options:
  - id: a
    text:
      es: "Línea de tiempo"
  - id: b
    correct: true
    text:
      es: "Icono"
  - id: c
    text:
      es: "People"
  - id: d
    text:
      es: "Tabla"
  explanation:
    es: "La vista Icono muestra los elementos con un icono y su asunto, y la ayuda la recomienda para carpetas con pocos elementos o de notas. Línea de tiempo usa una escala de tiempo. Tabla usa filas y columnas. People lista contactos con nombre y foto."
  citation: "fuente: `ms-outlook-vistas.html`; «Tipos de vistas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-vistas-html
- id: m06-l07-q107
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de los siguientes tipos de vista se usa normalmente para las carpetas de calendario, aunque también sirve para carpetas de correo?"
  options:
  - id: a
    correct: true
    text:
      es: "Día, semana y mes"
  - id: b
    text:
      es: "Tarjeta de presentación"
  - id: c
    text:
      es: "Tarjeta"
  - id: d
    text:
      es: "Icono"
  explanation:
    es: "La vista día, semana y mes se usa normalmente en carpetas de calendario, pero puede usarse también en carpetas de correo. Tarjeta y Tarjeta de presentación se usan normalmente en carpetas de contactos. Icono es útil para carpetas con pocos elementos o de notas."
  citation: "fuente: `ms-outlook-vistas.html`; «Tipos de vistas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-vistas-html
- id: m06-l07-q108
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes rutas lleva al cuadro desde el que se elimina una vista personalizada que ya no hace falta?"
  options:
  - id: a
    text:
      es: "Vista › Vista actual › Cambiar vista › Aplicar vista actual a otras carpetas de correo"
  - id: b
    text:
      es: "Archivo › Opciones › Correo › Limpieza de conversación"
  - id: c
    correct: true
    text:
      es: "Vista › Vista actual › Cambiar vista › Administrar vistas"
  - id: d
    text:
      es: "Archivo › Cuenta de Office › Tema de Office"
  explanation:
    es: "Para eliminar una vista personalizada se abre Administrar vistas en el grupo Vista actual de la pestaña Vista. Aplicar vista actual a otras carpetas de correo copia la vista a otras carpetas. Tema de Office cambia el fondo oscuro. Limpieza de conversación fija a dónde van los mensajes redundantes eliminados."
  citation: "fuente: `ms-outlook-vistas.html`; «Eliminar una vista personalizada»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-vistas-html
- id: m06-l07-q109
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes vistas se puede eliminar desde el cuadro Administrar vistas?"
  options:
  - id: a
    text:
      es: "La vista predefinida de la Bandeja de entrada sin modificar"
  - id: b
    correct: true
    text:
      es: "Una vista personalizada creada por el usuario"
  - id: c
    text:
      es: "Una vista predefinida cuya configuración se ha cambiado"
  - id: d
    text:
      es: "La vista predefinida de la carpeta de calendario"
  explanation:
    es: "La ayuda dice que no se puede eliminar una vista predefinida, incluso si se ha cambiado su configuración. Por eso la vista predefinida cuya configuración se ha cambiado, la vista predefinida de la Bandeja de entrada sin modificar y la vista predefinida de la carpeta de calendario siguen en la lista. Solo la vista personalizada se quita con Eliminar."
  citation: "fuente: `ms-outlook-vistas.html`; «Eliminar una vista personalizada»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-categorias-html
- id: m06-l07-q112
  prompt:
    es: "En Outlook 365, ¿qué nombres tienen las categorías de color predeterminadas antes de que el usuario les cambie el nombre?"
  options:
  - id: a
    text:
      es: "Nombres de usuario, como los de los miembros de la organización"
  - id: b
    text:
      es: "Nombres numerados por antigüedad, como Categoría 1 y Categoría 2"
  - id: c
    correct: true
    text:
      es: "Nombres genéricos, como Categoría roja y Categoría azul"
  - id: d
    text:
      es: "Nombres de uso, como Reunión y Personal, que no se pueden cambiar"
  explanation:
    es: "Las categorías predeterminadas tienen nombres genéricos, como Categoría roja y Categoría azul. Los nombres de uso como Reunión y Personal contradicen esa frase, y además la ayuda dice que se puede cambiar el nombre de las categorías. Los nombres de usuario y la numeración como Categoría 1 tampoco son los nombres genéricos que la ayuda cita."
  citation: "fuente: `ms-outlook-categorias.html`; «Crear y asignar categorías de color en Outlook»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-categorias-html
- id: m06-l07-q113
  prompt:
    es: "En Outlook 365, si una cuenta de correo es de tipo IMAP, ¿qué ocurre al intentar asignar una categoría de color a un elemento?"
  options:
  - id: a
    text:
      es: "Se asigna, pero solo a los elementos que se han leído"
  - id: b
    correct: true
    text:
      es: "No se puede, porque el tipo de cuenta IMAP no admite categorías"
  - id: c
    text:
      es: "Se asigna, pero solo se guarda en el equipo y no en el servidor"
  - id: d
    text:
      es: "Se asigna, pero solo se muestra en la Bandeja de entrada"
  explanation:
    es: "Con una cuenta IMAP no se puede asignar categorías a un elemento, porque ese tipo de cuenta no las admite. La opción de guardarla solo en el equipo, la de mostrarla solo en la Bandeja de entrada y la de aplicarla solo a los leídos suponen que la asignación se hace, y la ayuda dice que no puede asignar categorías."
  citation: "fuente: `ms-outlook-categorias.html`; «Crear y asignar categorías de color en Outlook»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-categorias-html
- id: m06-l07-q114
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes afirmaciones sobre las categorías de color asignadas a un mismo elemento es correcta?"
  options:
  - id: a
    text:
      es: "Se pueden asignar hasta tres, que es el máximo que admite Outlook"
  - id: b
    text:
      es: "Solo se puede asignar una; al elegir otra, sustituye a la anterior"
  - id: c
    text:
      es: "Se puede asignar una por cada tipo de elemento, como mensaje o cita"
  - id: d
    correct: true
    text:
      es: "Se puede asignar más de una categoría de color a un elemento"
  explanation:
    es: "La ayuda dice que se puede asignar más de una categoría y que se repite la acción tantas veces como sea necesario. Por tanto, la categoría única que sustituye a la anterior, el máximo de tres y el límite de una por tipo de elemento contradicen que se pueda repetir la acción las veces que haga falta."
  citation: "fuente: `ms-outlook-categorias.html`; «Crear y asignar categorías de color en Outlook»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-categorias-html
- id: m06-l07-q115
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones muestra la lista desplegable Categorizar de la cinta?"
  options:
  - id: a
    text:
      es: "Todas las categorías, ordenadas alfabéticamente por nombre"
  - id: b
    text:
      es: "Las cinco categorías predeterminadas con los colores originales"
  - id: c
    correct: true
    text:
      es: "Las diez categorías usadas más recientemente"
  - id: d
    text:
      es: "Las diez categorías con más elementos asignados"
  explanation:
    es: "En Outlook clásico la lista Categorizar muestra las diez categorías usadas más recientemente. Para el resto de la lista hay que elegir Todas las categorías. No muestra solo cinco predeterminadas, ni todas ordenadas, ni las más usadas por número de elementos."
  citation: "fuente: `ms-outlook-categorias.html`; «Asignar una categoría de color a un mensaje de correo electrónico en Outlook clásico»"
  difficulty: 2
  tags:
  - "comportamiento"
  - "cantidad"
# anchor: fuente-ms-outlook-categorias-html
- id: m06-l07-q116
  prompt:
    es: "En Outlook 365 clásico, ¿qué opción de la lista Categorizar hay que elegir para ver las categorías que no aparecen entre las más recientes?"
  options:
  - id: a
    correct: true
    text:
      es: "Todas las categorías"
  - id: b
    text:
      es: "Nueva categoría"
  - id: c
    text:
      es: "Establecer clic rápido"
  - id: d
    text:
      es: "Administrar categorías"
  explanation:
    es: "En Outlook clásico, Todas las categorías muestra el resto de la lista. Establecer clic rápido fija la categoría predeterminada de ciertas vistas de tabla. Administrar categorías es la opción equivalente del nuevo Outlook. Nueva categoría es la que crea una categoría en el nuevo Outlook."
  citation: "fuente: `ms-outlook-categorias.html`; «Asignar una categoría de color a un mensaje de correo electrónico en Outlook clásico»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-categorias-html
- id: m06-l07-q117
  prompt:
    es: "En el nuevo Outlook para Windows, ¿qué opción de la lista Categorizar hay que seleccionar para obtener el resto de las categorías que no se muestran?"
  options:
  - id: a
    correct: true
    text:
      es: "Administrar categorías"
  - id: b
    text:
      es: "Establecer clic rápido"
  - id: c
    text:
      es: "Nueva categoría"
  - id: d
    text:
      es: "Todas las categorías"
  explanation:
    es: "En el nuevo Outlook, la lista Categorizar muestra las categorías usadas más recientemente y Administrar categorías da el resto. Todas las categorías y Establecer clic rápido son opciones de Outlook clásico. Nueva categoría crea una categoría y no amplía la lista."
  citation: "fuente: `ms-outlook-categorias.html`; «Asignar una categoría de color a un mensaje de correo electrónico en el nuevo Outlook»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-categorias-html
- id: m06-l07-q118
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes rutas abre el cuadro Categorías de color, donde se crea una categoría nueva con el botón Nuevo?"
  options:
  - id: a
    text:
      es: "Etiquetas › Categorizar › Nueva categoría"
  - id: b
    correct: true
    text:
      es: "Etiquetas › Categorizar › Todas las categorías"
  - id: c
    text:
      es: "Etiquetas › Categorizar › Establecer clic rápido"
  - id: d
    text:
      es: "Etiquetas › Categorizar › Administrar categorías"
  explanation:
    es: "En Outlook clásico, Etiquetas › Categorizar › Todas las categorías abre el cuadro Categorías de color y allí se elige Nuevo. Establecer clic rápido fija la categoría predeterminada de ciertas vistas de tabla. Administrar categorías y Nueva categoría son opciones del nuevo Outlook."
  citation: "fuente: `ms-outlook-categorias.html`; «Crear una categoría de color en Outlook clásico»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-categorias-html
- id: m06-l07-q119
  prompt:
    es: "En Outlook 365 clásico, según la ayuda de Microsoft, ¿qué es una categoría Clic rápido del grupo Etiquetas?"
  options:
  - id: a
    text:
      es: "Una categoría que se aplica a todos los mensajes de la carpeta a la vez"
  - id: b
    text:
      es: "Una categoría que solo se puede asignar con una tecla de método abreviado"
  - id: c
    correct: true
    text:
      es: "Una categoría predeterminada de ciertas vistas de tabla"
  - id: d
    text:
      es: "Una categoría que Outlook asigna sola a los mensajes de un remitente"
  explanation:
    es: "Una categoría Clic rápido es una categoría predeterminada que se establece en ciertas vistas de tabla y se asigna con un clic en la columna Categoría. No la asigna una regla por remitente, ni exige una tecla de método abreviado, ni se aplica a toda la carpeta."
  citation: "fuente: `ms-outlook-categorias.html`; «Establecer una categoría de Clic rápido y asignarla a los mensajes en Outlook clásico»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-categorias-html
- id: m06-l07-q120
  prompt:
    es: "En Outlook 365 clásico, ¿qué ocurre con los elementos que ya tienen asignada una categoría de color cuando se cambia el nombre de esa categoría?"
  options:
  - id: a
    text:
      es: "Solo se actualizan los que están en la Bandeja de entrada"
  - id: b
    text:
      es: "Conservan el nombre antiguo y solo los nuevos usan el nombre nuevo"
  - id: c
    text:
      es: "Pierden la categoría y hay que volver a asignarla uno a uno"
  - id: d
    correct: true
    text:
      es: "Todos se actualizan para mostrar el nombre nuevo"
  explanation:
    es: "Si se modifica una categoría ya asignada, todos los elementos se actualizan para mostrar el nombre nuevo. No conservan el antiguo, no pierden la categoría y la actualización no se limita a la Bandeja de entrada."
  citation: "fuente: `ms-outlook-categorias.html`; «Cambiar el nombre de una categoría de color en Outlook clásico»"
