# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0174
  prompt:
    es: "Conforme al artículo 150.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las actuaciones del procedimiento de inspección deberán concluir en el plazo de 18 meses con carácter general y en el de 27 meses cuando:"
  options:
  - id: a
    text:
      es: "Concurran todas las circunstancias que enumera el precepto en cada una de las obligaciones tributarias o períodos objeto de comprobación, sin que baste en una de ellas."
  - id: b
    text:
      es: "Concurra alguna de las circunstancias que enumera el precepto en la mayoría de las obligaciones tributarias objeto de comprobación."
  - id: c
    correct: true
    text:
      es: "Concurra alguna de las circunstancias que enumera el precepto en cualquiera de las obligaciones tributarias o períodos objeto de comprobación."
  - id: d
    text:
      es: "El obligado tributario tenga la condición de persona jurídica y sus actuaciones tengan carácter general en todos los períodos."
  explanation:
    es: "Los 27 meses se aplican cuando concurre alguna de las circunstancias del apartado 1.b en cualquiera de las obligaciones o períodos comprobados (art. 150.1). No hacen falta todas ni basta con que afecten a la mayoría, y la condición de persona jurídica o el alcance general no son circunstancias de la lista."
  citation: "art. 150.1 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "27 meses"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0175
  prompt:
    es: "De acuerdo con el artículo 150.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el plazo de las actuaciones del procedimiento de inspección cuando la Cifra Anual de Negocios del obligado tributario es igual o superior al requerido para auditar sus cuentas:"
  options:
  - id: a
    text:
      es: "El plazo de duración es de 18 meses, ampliables por seis más al notificar la comunicación de inicio."
  - id: b
    correct: true
    text:
      es: "El plazo de duración es de 27 meses."
  - id: c
    text:
      es: "El plazo de duración es de 24 meses, que se reducen a 18 si el obligado colabora en el requerimiento."
  - id: d
    text:
      es: "El plazo de duración es de 18 meses, salvo que además el obligado esté integrado en un grupo consolidado."
  explanation:
    es: "La letra b).1.º del artículo 150.1 fija 27 meses cuando la Cifra Anual de Negocios es igual o superior al importe requerido para auditar cuentas, sin necesidad de más circunstancias. No hay ampliación de seis meses por la comunicación de inicio, ni un plazo de 24 meses, ni se exige la pertenencia a un grupo."
  citation: "art. 150.1 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "27 meses"
  - "Cifra Anual de Negocios"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0176
  prompt:
    es: "Según el artículo 150.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo de las actuaciones es de 27 meses cuando el obligado tributario esté integrado en un grupo sometido al régimen de consolidación fiscal o al régimen especial de grupo de entidades:"
  options:
  - id: a
    correct: true
    text:
      es: "Que esté siendo objeto de comprobación inspectora."
  - id: b
    text:
      es: "Cuyo grupo haya presentado declaraciones consolidadas en el último ejercicio."
  - id: c
    text:
      es: "Cuya entidad dominante tenga su domicilio fiscal en territorio español."
  - id: d
    text:
      es: "Que haya optado por el régimen en un ejercicio anterior al comprobado."
  explanation:
    es: "La circunstancia 2.º del artículo 150.1.b se refiere al grupo que esté siendo objeto de comprobación inspectora. Haber presentado declaraciones consolidadas, el domicilio de la dominante o la fecha de la opción por el régimen no figuran como condición."
  citation: "art. 150.1 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "27 meses"
  - "grupo"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0177
  prompt:
    es: "¿Qué objeto del procedimiento inspector determina el plazo de 27 meses, según el artículo 150.1.b.3.º de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Que el objeto del procedimiento sea la comprobación o investigación del Impuesto sobre el Valor Añadido de un grupo."
  - id: b
    text:
      es: "Que el objeto del procedimiento sea la comprobación o investigación del Impuesto sobre Sociedades de la entidad dominante."
  - id: c
    text:
      es: "Que el objeto del procedimiento sea la comprobación o investigación de varios impuestos en períodos distintos."
  - id: d
    correct: true
    text:
      es: "Que el objeto del procedimiento sea la comprobación o investigación del Impuesto Complementario."
  explanation:
    es: "La circunstancia 3.º del artículo 150.1.b es que el objeto sea la comprobación o investigación del Impuesto Complementario. El IVA de un grupo o el Impuesto sobre Sociedades de la dominante no se mencionan como tales, y comprobar varios impuestos o períodos no alarga el plazo por sí solo."
  citation: "art. 150.1 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "27 meses"
  - "Impuesto Complementario"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0178
  prompt:
    es: "Conforme al artículo 150.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las actuaciones inspectoras con diversas personas o entidades vinculadas de acuerdo con el artículo 18 de la Ley del Impuesto sobre Sociedades:"
  options:
  - id: a
    correct: true
    text:
      es: "Si en cualquiera de ellas concurre alguna circunstancia de la letra b), el plazo de 27 meses se aplica a los procedimientos seguidos con todas."
  - id: b
    text:
      es: "Si en cualquiera de ellas concurre alguna circunstancia de la letra b), el plazo de 27 meses se aplica solo a su procedimiento."
  - id: c
    text:
      es: "Si en todas ellas concurre alguna circunstancia de la letra b), el plazo de 27 meses se aplica a los procedimientos seguidos con todas."
  - id: d
    text:
      es: "Si en cualquiera de ellas concurre alguna circunstancia de la letra b), el plazo de 27 meses se aplica solo a las entidades de mayor Cifra Anual de Negocios del grupo vinculado."
  explanation:
    es: "Basta que una de las personas o entidades vinculadas cumpla una circunstancia de la letra b) para que los 27 meses valgan para los procedimientos seguidos con todas (art. 150.1). No se limita a la que la cumple, no hace falta que concurra en todas y no se aplica solo a las de mayor cifra de negocios."
  citation: "art. 150.1 LGT"
  difficulty: 3
  tags:
  - "plazo"
  - "27 meses"
  - "vinculadas"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0179
  prompt:
    es: "De acuerdo con el artículo 150.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo del procedimiento inspector se contará desde la fecha de notificación al obligado tributario de su inicio hasta que:"
  options:
  - id: a
    text:
      es: "Se dicte el acto administrativo resultante del mismo por el órgano competente para liquidar."
  - id: b
    correct: true
    text:
      es: "Se notifique o se entienda notificado el acto administrativo resultante del mismo."
  - id: c
    text:
      es: "Se formalice el acta con la propuesta de regularización que resulte de las actuaciones."
  - id: d
    text:
      es: "Se abra el trámite de audiencia previo a la formalización de las actas del procedimiento."
  explanation:
    es: "El plazo termina cuando se notifica, o se entiende notificado, el acto resultante del procedimiento (art. 150.2). No basta que se dicte, ni que se formalice el acta ni que se abra la audiencia, que son trámites anteriores."
  citation: "art. 150.2 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "notificación"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0180
  prompt:
    es: "De acuerdo con el artículo 150.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la notificación del acto resultante del procedimiento inspector a efectos de cumplir el plazo de duración:"
  options:
  - id: a
    text:
      es: "Es necesario que la notificación se practique efectivamente, sin que baste acreditar un intento de notificación."
  - id: b
    text:
      es: "Basta acreditar que se ha realizado un intento de notificación, aunque no contenga el texto íntegro de la resolución."
  - id: c
    correct: true
    text:
      es: "Basta acreditar que se ha realizado un intento de notificación que contenga el texto íntegro de la resolución."
  - id: d
    text:
      es: "Basta que el órgano competente para liquidar haya dictado la liquidación dentro del plazo, aunque la notifique después."
  explanation:
    es: "A efectos de entender cumplida la obligación de notificar y de computar el plazo, basta acreditar un intento de notificación con el texto íntegro de la resolución (art. 150.2). No se exige la notificación efectiva, el intento debe incluir el texto íntegro y no basta con dictar el acto."
  citation: "art. 150.2 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "notificación"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0181
  prompt:
    es: "Según el artículo 150.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en la comunicación de inicio del procedimiento inspector se informará al obligado tributario:"
  options:
  - id: a
    text:
      es: "De la fecha prevista para la formalización del acta."
  - id: b
    text:
      es: "De las extensiones del plazo que podrán solicitarse."
  - id: c
    text:
      es: "Del órgano que dictará la liquidación y su plazo."
  - id: d
    correct: true
    text:
      es: "Del plazo que le resulte aplicable."
  explanation:
    es: "La comunicación de inicio informa del plazo aplicable, 18 o 27 meses (art. 150.2). No anticipa la fecha del acta, no detalla las extensiones solicitables ni identifica el órgano que liquidará."
  citation: "art. 150.2 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "comunicación de inicio"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0182
  prompt:
    es: "Conforme al artículo 150.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si las circunstancias del apartado 1.b se aprecian durante el desarrollo de las actuaciones inspectoras, el plazo será de 27 meses:"
  options:
  - id: a
    correct: true
    text:
      es: "Contados desde la notificación de la comunicación de inicio, lo que se pondrá en conocimiento del obligado tributario."
  - id: b
    text:
      es: "Contados desde que se aprecien las circunstancias, lo que se pondrá en conocimiento del obligado tributario."
  - id: c
    text:
      es: "Contados desde la notificación de la comunicación de inicio, sin que sea necesario comunicarlo al obligado tributario."
  - id: d
    text:
      es: "Contados desde la apertura del trámite de audiencia, lo que se pondrá en conocimiento del obligado tributario."
  explanation:
    es: "Si las circunstancias se aprecian después, los 27 meses cuentan igualmente desde la notificación de la comunicación de inicio y se pone en conocimiento del obligado (art. 150.2). No desde el momento de apreciarlas, ni sin comunicarlo, ni desde la audiencia."
  citation: "art. 150.2 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "27 meses"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0183
  prompt:
    es: "De acuerdo con el artículo 150.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el plazo del procedimiento inspector cuando las circunstancias que determinan los 27 meses solo afectan a algunas de las obligaciones o períodos incluidos en él:"
  options:
  - id: a
    text:
      es: "El plazo es de 27 meses para las obligaciones afectadas y de 18 meses para las demás obligaciones y períodos."
  - id: b
    text:
      es: "El plazo es de 18 meses para todas las obligaciones, porque las circunstancias no afectan a la totalidad de ellas."
  - id: c
    correct: true
    text:
      es: "El plazo es único para todas las obligaciones tributarias y períodos del procedimiento, salvo la desagregación prevista para el caso de suspensión."
  - id: d
    text:
      es: "El plazo es único para todas las obligaciones y períodos del procedimiento, sin excepción alguna en ningún supuesto."
  explanation:
    es: "El artículo 150.2 declara un plazo único para todas las obligaciones y períodos aunque las circunstancias solo afecten a algunas, con la excepción de la desagregación por suspensión del apartado 3. No se divide por obligaciones, no se reduce a 18 meses y la excepción existe."
  citation: "art. 150.2 LGT"
  difficulty: 3
  tags:
  - "plazo"
  - "plazo único"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0184
  prompt:
    es: "Según el artículo 150.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, a efectos del cómputo del plazo del procedimiento inspector no será de aplicación lo dispuesto en el artículo 104.2 respecto de:"
  options:
  - id: a
    text:
      es: "Los períodos de interrupción justificada, pero sí respecto de las dilaciones por causa no imputable a la Administración."
  - id: b
    correct: true
    text:
      es: "Los períodos de interrupción justificada ni de las dilaciones en el procedimiento por causa no imputable a la Administración."
  - id: c
    text:
      es: "Las dilaciones por causa no imputable a la Administración, pero sí respecto de los períodos de interrupción justificada."
  - id: d
    text:
      es: "Los períodos de suspensión por remisión del expediente al Ministerio Fiscal ni de los plazos de las actuaciones complementarias."
  explanation:
    es: "El artículo 150.2 excluye del cómputo del plazo inspector tanto los períodos de interrupción justificada como las dilaciones por causa no imputable a la Administración. Las opciones que aplican una de las dos reglas la recortan. La remisión al Ministerio Fiscal es una causa de suspensión del apartado 3, y las actuaciones complementarias no aparecen en este apartado."
  citation: "art. 150.2 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "dilaciones"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0185
  prompt:
    es: "De acuerdo con el artículo 150.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el cómputo del plazo del procedimiento inspector se suspenderá desde la remisión del expediente al Ministerio Fiscal o a la jurisdicción competente:"
  options:
  - id: a
    text:
      es: "Habiendo practicado la liquidación provisional, de acuerdo con lo señalado en el artículo 251 de la Ley."
  - id: b
    text:
      es: "Tras notificar la comunicación de inicio, de acuerdo con lo señalado en el artículo 101 de la Ley."
  - id: c
    text:
      es: "Con la propuesta de sanción por delito fiscal, de acuerdo con lo señalado en el artículo 188 de la Ley."
  - id: d
    correct: true
    text:
      es: "Sin practicar la liquidación, de acuerdo con lo señalado en el artículo 251 de la Ley."
  explanation:
    es: "La letra a) suspende el cómputo con la remisión del expediente al Ministerio Fiscal o a la jurisdicción sin practicar la liquidación, conforme al artículo 251. Con liquidación practicada no hay suspensión por esta causa, y el artículo 251 es la remisión legal, no el 101 ni el 188."
  citation: "art. 150.3 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "suspensión"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0188
  prompt:
    es: "Conforme al artículo 150.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el cómputo del plazo del procedimiento inspector se suspende por la notificación al interesado de la remisión del expediente de conflicto en la aplicación de la norma tributaria:"
  options:
  - id: a
    text:
      es: "Al Tribunal Económico-Administrativo Central."
  - id: b
    text:
      es: "A la Junta Arbitral competente."
  - id: c
    text:
      es: "Al órgano competente para liquidar."
  - id: d
    correct: true
    text:
      es: "A la Comisión consultiva."
  explanation:
    es: "La letra d) suspende el cómputo con la notificación al interesado de la remisión del expediente de conflicto en la aplicación de la norma a la Comisión consultiva. El Tribunal Económico-Administrativo Central y el órgano que liquida no intervienen, y la Junta Arbitral es la causa de la letra c), un conflicto distinto."
  citation: "art. 150.3 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "suspensión"
  - "conflicto"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0189
  prompt:
    es: "De acuerdo con el artículo 150.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el intento de notificación al obligado de la propuesta de resolución o de liquidación como causa de suspensión del cómputo del plazo inspector:"
  options:
  - id: a
    text:
      es: "Es causa de suspensión, y en ese caso la inspección no puede realizar ninguna actuación en relación con el procedimiento."
  - id: b
    text:
      es: "No es causa de suspensión, porque la notificación de la propuesta solo interrumpe la prescripción del derecho a liquidar de la Administración."
  - id: c
    correct: true
    text:
      es: "Es causa de suspensión, y en ese caso la inspección sí puede realizar actuaciones en relación con el procedimiento suspendido."
  - id: d
    text:
      es: "Es causa de suspensión solo si el obligado rechaza expresamente la notificación de la propuesta de liquidación."
  explanation:
    es: "El intento de notificación de la propuesta de resolución o de liquidación, o del acuerdo que ordena completar actuaciones, suspende el cómputo (letra e), y es el único caso en que la inspección conserva la posibilidad de actuar (art. 150.3). La regla general es lo contrario, y no se exige que el obligado rechace la notificación."
  citation: "art. 150.3 LGT"
  difficulty: 3
  tags:
  - "plazo"
  - "suspensión"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0190
  prompt:
    es: "Según el artículo 150.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el cómputo del plazo del procedimiento inspector también se suspende por la concurrencia de una causa:"
  options:
  - id: a
    text:
      es: "De interés público que aconseje paralizar las actuaciones."
  - id: b
    correct: true
    text:
      es: "De fuerza mayor que obligue a suspender las actuaciones."
  - id: c
    text:
      es: "De caso fortuito que impida atender el requerimiento."
  - id: d
    text:
      es: "De enfermedad del actuario que desarrolle las actuaciones."
  explanation:
    es: "La letra g) suspende el cómputo por una causa de fuerza mayor que obligue a suspender las actuaciones. El interés público, el caso fortuito y la enfermedad del actuario no figuran como causas del apartado."
  citation: "art. 150.3 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "suspensión"
  - "fuerza mayor"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0192
  prompt:
    es: "De acuerdo con el artículo 150.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si algún período, obligación tributaria o elemento de esta no se encuentra afectado por las causas de suspensión, la Administración:"
  options:
  - id: a
    text:
      es: "Suspenderá igualmente el procedimiento respecto de ellos, hasta que finalice la suspensión de los demás."
  - id: b
    text:
      es: "Iniciará un procedimiento distinto respecto de ellos, con un plazo máximo de 18 meses."
  - id: c
    correct: true
    text:
      es: "Continuará el procedimiento inspector respecto de ellos, pudiendo practicarse, en su caso, la correspondiente liquidación."
  - id: d
    text:
      es: "Continuará el procedimiento respecto de ellos, sin que pueda practicarse liquidación hasta que finalice la suspensión de los demás elementos."
  explanation:
    es: "Los elementos no afectados siguen su procedimiento y pueden liquidarse (art. 150.3), con desagregación de los plazos a los solos efectos del cómputo. No se suspenden con los demás, no exigen un procedimiento distinto y no se retrasa su liquidación."
  citation: "art. 150.3 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "suspensión"
  - "desagregación"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0193
  prompt:
    es: "Según el artículo 150.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, una vez finalizada la suspensión del cómputo del plazo, el procedimiento inspector continuará:"
  options:
  - id: a
    text:
      es: "Por un nuevo plazo de la misma duración que el inicial."
  - id: b
    text:
      es: "Por un plazo de seis meses, ampliable por el órgano competente."
  - id: c
    text:
      es: "Hasta que se notifique la propuesta de liquidación al obligado."
  - id: d
    correct: true
    text:
      es: "Por el plazo que reste."
  explanation:
    es: "Al terminar la suspensión el procedimiento sigue por el plazo que reste (art. 150.3). No se reinicia el plazo, no se fija uno nuevo de seis meses y la notificación de la propuesta no marca el fin del procedimiento."
  citation: "art. 150.3 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "suspensión"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0195
  prompt:
    es: "Conforme al artículo 150.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los períodos que el obligado tributario solicite para que la inspección no efectúe actuaciones con él no podrán exceder en su conjunto, para todo el procedimiento, de:"
  options:
  - id: a
    text:
      es: "Sesenta días hábiles para todo el procedimiento, sumados todos los períodos solicitados."
  - id: b
    text:
      es: "Treinta días naturales para todo el procedimiento, sumados todos los períodos solicitados."
  - id: c
    text:
      es: "Noventa días naturales para todo el procedimiento, sumados todos los períodos solicitados."
  - id: d
    correct: true
    text:
      es: "Sesenta días naturales para todo el procedimiento, sumados todos los períodos solicitados."
  explanation:
    es: "El tope es de 60 días naturales para todo el procedimiento (art. 150.4). No son hábiles, y 30 y 90 días no son la cifra del artículo."
  citation: "art. 150.4 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "extensión"
  - "60 días"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0196
  prompt:
    es: "De acuerdo con el artículo 150.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre los períodos de inactividad inspectora que solicita el obligado tributario antes del trámite de audiencia:"
  options:
  - id: a
    correct: true
    text:
      es: "No pueden exceder en su conjunto de 60 días naturales para todo el procedimiento y suponen una extensión del plazo máximo de duración."
  - id: b
    text:
      es: "No pueden exceder en su conjunto de 60 días naturales para todo el procedimiento y no extienden el plazo máximo de duración del procedimiento inspector."
  - id: c
    text:
      es: "No pueden exceder cada uno de 60 días naturales y suponen una extensión del plazo máximo de duración."
  - id: d
    text:
      es: "No pueden exceder en su conjunto de 30 días naturales para todo el procedimiento y suponen una extensión del plazo máximo."
  explanation:
    es: "El límite de 60 días naturales se aplica al conjunto de los períodos y esos períodos extienden el plazo máximo (art. 150.4). No se mide por período ni es de 30 días, y la extensión existe: el plazo máximo se amplía."
  citation: "art. 150.4 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "extensión"
  - "60 días"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0197
  prompt:
    es: "Según el artículo 150.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el obligado tributario podrá solicitar uno o varios períodos en los que la inspección no efectuará actuaciones con él, antes de:"
  options:
  - id: a
    text:
      es: "La formalización del acta de inspección."
  - id: b
    correct: true
    text:
      es: "La apertura del trámite de audiencia."
  - id: c
    text:
      es: "La notificación de la propuesta de liquidación."
  - id: d
    text:
      es: "La conclusión de las actuaciones del procedimiento."
  explanation:
    es: "La solicitud debe presentarse antes de la apertura del trámite de audiencia (art. 150.4). Después de ese momento, y por tanto tampoco al formalizar el acta, al notificar la propuesta o al concluir las actuaciones, ya no cabe pedirla."
  citation: "art. 150.4 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "extensión"
# anchor: boe-a-2007-15984-art-184
- id: m03-l08-q0199
  prompt:
    es: "Conforme al artículo 184.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, el obligado tributario podrá solicitar antes de la apertura del trámite de audiencia uno o varios períodos de inactividad inspectora, de un mínimo de:"
  options:
  - id: a
    text:
      es: "Quince días naturales cada uno, con el límite conjunto de 60 días."
  - id: b
    correct: true
    text:
      es: "Siete días naturales cada uno."
  - id: c
    text:
      es: "Diez días hábiles cada uno, con el límite conjunto de 60 días."
  - id: d
    text:
      es: "Cinco días naturales cada uno, con el límite conjunto de 30 días."
  explanation:
    es: "El artículo 184.1 fija un mínimo de siete días naturales para cada período, dentro del límite conjunto de 60 días naturales. Quince y cinco días naturales y diez días hábiles no son el mínimo del reglamento."
  citation: "art. 184.1 RGAT"
  difficulty: 2
  tags:
  - "plazo"
  - "extensión"
  - "7 días"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0200
  prompt:
    es: "De acuerdo con el artículo 150.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si el obligado manifiesta que no va a aportar la documentación solicitada, o no la aporta íntegramente en el plazo del tercer requerimiento, su aportación posterior extiende el plazo máximo por un período de:"
  options:
  - id: a
    correct: true
    text:
      es: "Tres meses, siempre que se produzca una vez transcurridos al menos nueve meses desde el inicio."
  - id: b
    text:
      es: "Seis meses, siempre que se produzca una vez transcurridos al menos nueve meses desde el inicio."
  - id: c
    text:
      es: "Tres meses, siempre que se produzca una vez transcurridos al menos seis meses desde el inicio."
  - id: d
    text:
      es: "Tres meses, sin que importe el tiempo que haya transcurrido desde el inicio del procedimiento."
  explanation:
    es: "La aportación tardía extiende el plazo tres meses, y solo si se produce pasados al menos nueve meses desde el inicio (art. 150.5). Seis meses es la extensión de otros supuestos, el umbral no son seis meses y el tiempo transcurrido sí importa."
  citation: "art. 150.5 LGT"
  difficulty: 2
  tags:
  - "plazo"
  - "extensión"
  - "3 meses"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0201
  prompt:
    es: "Conforme al artículo 150.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la extensión del plazo máximo cuando la aportación de documentación tras el tercer requerimiento se efectúa después de la formalización del acta:"
  options:
  - id: a
    text:
      es: "La extensión es de tres meses si la aportación determina que el órgano competente para liquidar acuerde la práctica de actuaciones complementarias, siempre que hayan transcurrido nueve meses."
  - id: b
    text:
      es: "La extensión es de seis meses en todo caso, aunque la aportación no determine actuaciones complementarias."
  - id: c
    correct: true
    text:
      es: "La extensión es de seis meses si la aportación determina que el órgano competente para liquidar acuerde la práctica de actuaciones complementarias."
  - id: d
    text:
      es: "La extensión es de seis meses si la aportación determina que el actuario acuerde la práctica de actuaciones complementarias."
  explanation:
    es: "Si la aportación se produce tras la formalización del acta y determina que el órgano competente para liquidar acuerde actuaciones complementarias, la extensión es de seis meses (art. 150.5). No es de tres meses, no opera sin actuaciones complementarias y la decisión no corresponde al actuario."
  citation: "art. 150.5 LGT"
  difficulty: 3
  tags:
  - "plazo"
  - "extensión"
  - "6 meses"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0202
  prompt:
    es: "Según el artículo 150.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo máximo de duración del procedimiento inspector se extenderá por un período de seis meses cuando, tras dejar constancia de las circunstancias determinantes del método de estimación indirecta, se aporten:"
  options:
  - id: a
    text:
      es: "Los libros y registros que el obligado haya declarado inexistentes."
  - id: b
    correct: true
    text:
      es: "Datos, documentos o pruebas relacionados con dichas circunstancias."
  - id: c
    text:
      es: "Las alegaciones del obligado contra la aplicación del método."
  - id: d
    text:
      es: "El informe razonado sobre las causas de la estimación indirecta."
  explanation:
    es: "La extensión de seis meses se produce cuando, tras dejar constancia de las circunstancias de la estimación indirecta, se aportan datos, documentos o pruebas relacionados con ellas (art. 150.5). Los libros declarados inexistentes, las alegaciones y el informe razonado no son el supuesto."
  citation: "art. 150.5 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "extensión"
  - "estimación indirecta"
# anchor: boe-a-2003-23186-art-150
- id: m03-l08-q0203
  prompt:
    es: "De acuerdo con el artículo 150.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el incumplimiento del plazo de duración del procedimiento de inspección no determinará la caducidad del procedimiento, que:"
  options:
  - id: a
    text:
      es: "Continuará hasta que se dicte la liquidación provisional."
  - id: b
    text:
      es: "Continuará hasta el plazo máximo de seis meses adicionales."
  - id: c
    text:
      es: "Se archivará en cuanto el obligado lo solicite por escrito."
  - id: d
    correct: true
    text:
      es: "Continuará hasta su terminación."
  explanation:
    es: "Superar el plazo no produce caducidad y el procedimiento continúa hasta su terminación (art. 150.6). No termina con la liquidación provisional, no hay un margen adicional de seis meses y el archivo a instancia del obligado no existe."
  citation: "art. 150.6 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "incumplimiento"
