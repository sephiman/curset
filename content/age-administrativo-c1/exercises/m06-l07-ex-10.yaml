# anchor: fuente-ms-outlook-reglas-html
- id: m06-l07-q327
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuáles son los elementos que necesita como mínimo cada regla, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Un nombre, una condición y una acción"
  - id: b
    text:
      es: "Un nombre, una carpeta y una excepción"
  - id: c
    text:
      es: "Un nombre, una acción y una carpeta de destino"
  - id: d
    text:
      es: "Una condición, una acción y una excepción"
  explanation:
    es: "Cada regla necesita al menos tres elementos: un nombre, una condición y una acción. Las excepciones de las condiciones son opcionales, y la ayuda dice que las reglas también pueden contenerlas. Por eso el nombre con carpeta y excepción, la condición con acción y excepción, y el nombre con acción y carpeta de destino contradicen esa frase."
  citation: "fuente: `ms-outlook-reglas.html`; «Crear una regla de bandeja de entrada para el nuevo Outlook para Windows»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-reglas-html
- id: m06-l07-q328
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cómo se crea rápidamente una regla que mueva a una carpeta los correos de un remitente, a partir de un mensaje de la lista?"
  options:
  - id: a
    text:
      es: "Botón derecho en el mensaje › Mover › Crear regla"
  - id: b
    text:
      es: "Configuración › Correo › Reglas › Editar regla"
  - id: c
    correct: true
    text:
      es: "Botón derecho en el mensaje › Reglas › Crear regla"
  - id: d
    text:
      es: "Archivo › Administrar reglas y alertas › Nueva regla"
  explanation:
    es: "En el nuevo Outlook se hace clic con el botón derecho en un mensaje, se mantiene el puntero sobre Reglas y se selecciona Crear regla. Archivo › Administrar reglas y alertas › Nueva regla es la ruta de Outlook clásico. Configuración › Correo › Reglas sirve para editar reglas existentes. El menú Mover contradice que el comando esté en Reglas."
  citation: "fuente: `ms-outlook-reglas.html`; «Crear una regla de bandeja de entrada para el nuevo Outlook para Windows»"
  difficulty: 1
  tags:
  - "ofimática-menú"
