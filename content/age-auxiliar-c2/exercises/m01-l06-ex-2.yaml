  prompt:
    es: "¿Cuál de las siguientes opciones completa los dos ejes transversales del V Plan de Gobierno Abierto de España 2025-2029, que son la alineación con los Objetivos de Desarrollo Sostenible de la Agenda 2030 y otro más?"
  options:
