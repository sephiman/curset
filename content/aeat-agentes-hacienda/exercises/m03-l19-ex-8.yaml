# anchor: boe-a-1992-28740-art-106
- id: m03-l19-q0202
  prompt:
    es: "De acuerdo con el artículo 106.Uno.2.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, en la prorrata especial las cuotas soportadas en bienes o servicios utilizados exclusivamente en operaciones que no originen el derecho a deducir:"
  options:
  - id: a
    correct: true
    text:
      es: "no pueden ser objeto de deducción."
  - id: b
    text:
      es: "pueden deducirse en el porcentaje de la prorrata general."
  - id: c
    text:
      es: "pueden deducirse en la mitad de su importe, como mínimo."
  - id: d
    text:
      es: "pueden deducirse íntegramente si se regularizan al final del año."
  explanation:
    es: "Lo usado exclusivamente en operaciones sin derecho a deducir no se deduce. No cabe el porcentaje general, ni la deducción íntegra con regularización, ni una mitad mínima."
  citation: "art. 106.Uno LIVA"
  difficulty: 1
  tags:
  - "prorrata especial"
# anchor: boe-a-1992-28740-art-104
- id: m03-l19-q0228
  prompt:
    es: "¿Cómo se redondea la prorrata de deducción resultante de aplicar los criterios del artículo 104.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Se redondea en la unidad inferior."
  - id: b
    text:
      es: "Se redondea a dos decimales."
  - id: c
    correct: true
    text:
      es: "Se redondea en la unidad superior."
  - id: d
    text:
      es: "Se redondea a la unidad más próxima."
  explanation:
    es: "La prorrata de deducción resultante se redondea en la unidad superior (art. 104.Dos): un porcentaje de 71,11 pasa a ser 72. Redondear en la unidad inferior o a la unidad más próxima daría 71. Y expresarlo con dos decimales no cumple la norma, que exige un porcentaje entero redondeado por exceso."
  citation: "art. 104.Dos LIVA"
  difficulty: 3
  tags:
  - "prorrata"
  - "redondeo"
