type: case
title:
  es: "La reproducción de un manuscrito"
scenario:
  es: "La Biblioteca Nacional de España, organismo autónomo adscrito al Ministerio de Cultura, está en Madrid. Son festivos el 12 de octubre y el 1 de noviembre. A efectos de este supuesto, en Madrid son inhábiles el sábado, 15 de mayo, y el martes, 9 de noviembre de 2027. Ningún otro festivo afecta a los plazos.\n\nEl lunes, 11 de enero de 2027, Doña Aurora Villalobos Sepúlveda solicita reproducir un manuscrito. El martes, 26 de enero de 2027, se le notifica el trámite de audiencia con el plazo más largo que permite la ley. El miércoles, 17 de febrero de 2027, la Directora acuerda realizar actuaciones complementarias, que se notifican ese día, con la duración máxima que permite la ley. El lunes, 22 de marzo de 2027, se le notifica la resolución de la Directora, que deniega la reproducción y pone fin a la vía administrativa. El miércoles, 31 de marzo de 2027, interpone recurso potestativo de reposición, con entrada ese día en el registro de la Directora.\n\nEl lunes, 17 de mayo de 2027, el órgano instructor pide al Servicio de Mantenimiento informe sobre la reclamación de Don Gaspar Olmedo Fuentes por la caída de una escalera.\n\nPara digitalizar fondos manuscritos, el organismo licita un contrato de servicios de seis meses, prorrogable, de 54.000 euros, IVA excluido, y valor estimado de 113.400 euros. El martes, 9 de febrero de 2027, se notifica la adjudicación a Digitaliza Patrimonio, S.L., y a Archivos Digitales Ibérica, S.A., que quedó segunda. El plazo total acaba el jueves, 30 de septiembre de 2027, y Digitaliza termina doce días naturales tarde. Se le encarga después un lote adicional de 14.000 euros, IVA excluido, no previsto en el pliego, por circunstancias sobrevenidas.\n\nDon Ernesto Palomares Ruiz, funcionario de carrera de la Biblioteca, es designado personal eventual de asesoramiento especial en la Secretaría de Estado de Cultura y no opta por seguir en servicio activo. Cesa el jueves, 30 de septiembre de 2027. Don Julián Ibáñez Roldán, del Ministerio de Hacienda, es propuesto para un puesto de libre designación de la Biblioteca. El lunes, 4 de octubre de 2027, se pide a ese Ministerio informe sobre el nombramiento; el jueves, 28 de octubre de 2027, no ha llegado. Doña Lucía Ferrández Ortiz, funcionaria de la Biblioteca, quiere dar clases en una academia privada. Sus retribuciones básicas anuales son 17.300 euros, 2.300 de ellos de antigüedad, y su puesto lleva complemento específico. Solicita el lunes, 6 de septiembre de 2027, con entrada ese día en el registro del órgano que debe resolver.\n\nLa Biblioteca sustituye las estanterías metálicas de los depósitos, inservibles por el uso normal, por otras análogas inventariables, por 250.000 euros. No hay crédito adecuado en el capítulo 6, de crédito inicial 3.200.000 euros, donde ya se autorizó este año un suplemento de 120.000 euros. El contrato de mantenimiento de la climatización, de 2027 a 2030, se imputa a una aplicación de crédito inicial en 2027 de 400.000 euros. El organismo tiene un anticipo de caja fija, y la imprenta factura 6.200 euros por el catálogo de una exposición. La Intervención Delegada verifica de forma continua la situación económico-financiera del organismo. Terminado el ejercicio, la Intervención General de la Administración del Estado revisa de forma posterior y sistemática su actividad.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2015-10565-art-123
- id: q21
  lesson: m03-l03
  prompt:
    es: "Según el artículo 123.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en qué momento puede Doña Aurora acudir al orden contencioso-administrativo contra la denegación de su solicitud?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando su reposición se resuelva expresamente o se produzca su desestimación presunta."
  - id: b
    text:
      es: "En cualquier momento, porque la reposición es potestativa y no impide acudir ya al contencioso."
  - id: c
    text:
      es: "Solo cuando la Directora resuelva expresamente su reposición, sin que valga la desestimación presunta."
  - id: d
    text:
      es: "Solo una vez agotada la alzada ante el órgano superior jerárquico de la Directora."
  explanation:
    es: "Interpuesta la reposición, no se puede acudir al orden contencioso-administrativo hasta que se resuelva expresamente o se produzca su desestimación presunta (art. 123.2 LPAC). La resolución de la Directora pone fin a la vía administrativa, así que cabe reposición y no alzada. La opción que permite acudir ya al contencioso confunde que la reposición sea potestativa con poder simultanearla. La que excluye la desestimación presunta restringe el artículo. La de la alzada no procede contra un acto que agota la vía administrativa."
  citation: "art. 123.2 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2015-10565-art-82
- id: q02
  lesson: m03-l03
  prompt:
    es: "Conforme al artículo 82 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué fecha puede alegar Doña Aurora Villalobos Sepúlveda en el trámite de audiencia?"
  options:
  - id: a
    text:
      es: "El martes, 9 de febrero de 2027."
  - id: b
    correct: true
    text:
      es: "El martes, 16 de febrero de 2027."
  - id: c
    text:
      es: "El miércoles, 10 de febrero de 2027."
  - id: d
    text:
      es: "El lunes, 15 de febrero de 2027."
  explanation:
    es: "El plazo de audiencia no es inferior a diez días ni superior a quince (art. 82.2 LPAC) y los días son hábiles (art. 30.2 LPAC). Con el plazo más largo, quince días hábiles desde el día siguiente al martes 26 de enero, el decimoquinto es el martes, 16 de febrero de 2027; no hay festivos en esas fechas. La fecha del martes, 9 de febrero de 2027, cuenta el plazo mínimo de diez días hábiles. La del miércoles, 10 de febrero de 2027, cuenta quince días naturales. La del lunes, 15 de febrero de 2027, cuenta como primer día el de la notificación."
  citation: "art. 82.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-87
