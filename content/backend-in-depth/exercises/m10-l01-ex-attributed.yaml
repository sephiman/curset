type: quiz
variants:
- id: m10-l01-qa01
  prompt:
    en: According to Brendan Gregg in The USE Method, how does he define saturation for a resource in the terminology
      of the method?
  options:
  - id: a
    text:
      en: The average time that the resource was busy servicing work
  - id: b
    text:
      en: The count of the error events that the resource has reported
  - id: c
    correct: true
    text:
      en: The degree to which the resource has extra work that it can't service, often queued
  - id: d
    text:
      en: The proportion of the resource that is used, where 100% means no more work can be accepted
  explanation:
    en: Gregg defines saturation as the degree to which the resource has extra work which it can't service, often
      queued. In his terminology, the average time the resource was busy servicing work is the definition of utilization,
      which is a different measure from saturation. The count of error events is listed there as the definition
      of errors, so it does not define saturation. Gregg gives the proportion of the resource used as an alternative
      definition of utilization, where 100% utilization means no more work can be accepted, so it is not saturation
      either.
  citation: gregg-use-method#Summary
- id: m10-l01-qa02
  prompt:
    en: 'According to Julie Dam in The RED Method: How to Instrument Your Services, why does Tom Wilkie say the
      USE Method was not the right fit for services?'
  options:
  - id: a
    text:
      en: It is too concrete to apply to the metrics of a microservice
  - id: b
    correct: true
    text:
      en: It applies to hardware such as network disks, not to services
  - id: c
    text:
      en: It leaves out errors, which every service needs to count
  - id: d
    text:
      en: It cannot be used together with any other method
  explanation:
    en: Dam quotes Wilkie saying that the USE Method does not really apply to services, because it applies to hardware,
      network disks and things like that. Dam reports that Wilkie pointed out the method, while useful, is somewhat
      abstract, which contradicts calling it too concrete. Under the USE Method, the page lists errors, as a count
      of error events, among the things to monitor for every resource, so it does not leave errors out. Dam reports
      that Wilkie recommended using the USE and RED Methods together, which contradicts any claim that the USE Method
      cannot be combined with another.
  citation: grafana-red-method#the-red-method; grafana-red-method#the-use-method; grafana-red-method#two-sides-of-the-same-coin
- id: m10-l01-qa04
  prompt:
    en: According to the Prometheus Authors in Alerting, which practice for deciding what to alert on do they recommend
      for a service?
  options:
  - id: a
    correct: true
    text:
      en: Alert on symptoms associated with end-user pain, with as few alerts as possible
  - id: b
    text:
      en: Page on latency at every level of the stack to locate the slow components
  - id: c
    text:
      en: Page separately on errors further down the stack that cause a user-visible failure
  - id: d
    text:
      en: Page as soon as a single run of a batch job fails to complete
  explanation:
    en: The documentation says to aim for as few alerts as possible, by alerting on symptoms associated with end-user
      pain rather than trying to catch every possible cause. The documentation says to page on latency at only one
      point in a stack, not at every level. According to the same section, errors further down the stack that will
      cause a user-visible failure need no separate page. It says that if you cannot withstand a single run failing
      you should run the job more frequently, as a single failure should not require human intervention, which contradicts
      paging on a single failed batch run.
  citation: prom-alerting-practices#what-to-alert-on; prom-alerting-practices#online-serving-systems; prom-alerting-practices#batch-jobs
  extract:
    en: Aim to have as few alerts as possible, by alerting on symptoms that are associated with end-user pain rather
      than trying to catch every possible way that pain could be caused.
- id: m10-l01-qa05
  prompt:
    en: According to Steven Thurgood in Alerting on SLOs, which statement about the multiwindow, multi-burn-rate
      alert does he make?
  options:
  - id: a
    text:
      en: It keeps firing for an hour after the errors stop, until the long window falls
  - id: b
    text:
      en: It starts firing as soon as the short window goes over the threshold
  - id: c
    text:
      en: It raises the number of false positives compared with the multiple burn rate alerts
  - id: d
    correct: true
    text:
      en: It adds a shorter window to check that the budget is still being consumed
  explanation:
    en: Thurgood writes that the alert needs another parameter, a shorter window, to check whether the error budget
      is still being consumed as the alert triggers. Thurgood writes that the page-level alert ceases to fire five
      minutes later rather than one hour later, so it does not keep firing for an hour after the errors stop. In
      his example, the alert starts firing when the long window average also goes over the threshold, not as soon
      as the short window does. His account says the enhancement notifies only when the budget is still being burned,
      thereby reducing the number of false positives, which leaves no room for more of them.
  citation: sre-workbook-slo-alerting#6-multiwindow-multi-burn-rate-alerts
  extract:
    en: 'To do this, we need to add another parameter: a shorter window to check if the error budget is still being
      consumed as we trigger the alert.'
