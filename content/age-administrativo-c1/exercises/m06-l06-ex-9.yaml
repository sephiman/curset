# anchor: fuente-ms-access-orden-tabulacion-html
- id: m06-l06-q325
  prompt:
    es: "Si un formulario de Access 365 no contiene saltos de página, la opción Página actual de la propiedad Ciclo se comporta de la misma manera que la opción:"
  options:
  - id: a
    text:
      es: "Todos los registros"
  - id: b
    correct: true
    text:
      es: "Registro actual"
  - id: c
    text:
      es: "Orden automático"
  - id: d
    text:
      es: "Tabulación"
  explanation:
    es: "La página dice: «Si el formulario no contiene saltos de página, la opción Página actual se comporta de la misma manera que la opción Registro actual». «Todos los registros» lleva el foco al registro siguiente. «Orden automático» es un botón del cuadro Orden de tabulación, no una opción de Ciclo. «Tabulación» es una propiedad de cada control, no una opción de Ciclo."
  citation: "fuente: `ms-access-orden-tabulacion.html`; «Cambiar el comportamiento de tabulación del último campo del orden de tabulación»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-orden-tabulacion-html
- id: m06-l06-q326
  prompt:
    es: "En Access 365, para cambiar la propiedad Ciclo, ¿cuál de las siguientes opciones hay que seleccionar en la lista desplegable de la parte superior de la hoja de propiedades?"
  options:
  - id: a
    text:
      es: "Cualquier control del formulario"
  - id: b
    text:
      es: "La sección Detalle"
  - id: c
    correct: true
    text:
      es: "Formulario"
  - id: d
    text:
      es: "El cuadro de texto del último campo"
  explanation:
    es: "La página dice: «Seleccione Formulario en la lista desplegable situada en la parte superior de la hoja de propiedades» y, en la pestaña Otros, la propiedad Ciclo. Un control, la sección Detalle o el cuadro de texto del último campo mostrarían las propiedades de ese elemento y no las del formulario, que es donde la página sitúa Ciclo."
  citation: "fuente: `ms-access-orden-tabulacion.html`; «Cambiar el comportamiento de tabulación del último campo del orden de tabulación»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-access-orden-tabulacion-html
- id: m06-l06-q327
  prompt:
    es: "En la vista Diseño de Access 365, ¿cuál de los siguientes controles permite dividir un formulario en varias páginas?"
  options:
  - id: a
    text:
      es: "Subformulario/Subinforme"
  - id: b
    text:
      es: "Marco de objeto dependiente"
  - id: c
    text:
      es: "Gráfico"
  - id: d
    correct: true
    text:
      es: "Salto de página"
  explanation:
    es: "La página dice: «Puede dividir un formulario en páginas mediante el control Salto de página. Este control está disponible en la vista Diseño, en el grupo Controles de la pestaña Diseño». «Subformulario/Subinforme» inserta un formulario o informe dentro de otro. «Marco de objeto dependiente» y «Gráfico» son otros controles que se agregan en la vista Diseño, sin relación con las páginas del formulario."
  citation: "fuente: `ms-access-orden-tabulacion.html`; «Cambiar el comportamiento de tabulación del último campo del orden de tabulación»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q328
  prompt:
    es: "En Access 365, ¿cuál de los siguientes propósitos tiene un informe, según la ayuda de Microsoft sobre informes?"
  options:
  - id: a
    text:
      es: "Introducir registros nuevos uno a uno"
  - id: b
    correct: true
    text:
      es: "Mostrar o distribuir un resumen de los datos"
  - id: c
    text:
      es: "Definir relaciones entre las tablas"
  - id: d
    text:
      es: "Importar datos desde una hoja de Excel"
  explanation:
    es: "La ayuda dice: un informe resulta útil para «Mostrar o distribuir un resumen de los datos», entre otros propósitos (archivar instantáneas de los datos, aportar detalles sobre un registro concreto, crear etiquetas). «Introducir registros nuevos uno a uno» no figura entre ellos: es la función de la vista Formulario, que sirve «para que pueda ver o introducir información». «Definir relaciones entre las tablas» se hace en la ventana Relaciones, y «importar datos desde una hoja de Excel» con el asistente de la pestaña Datos externos; la ayuda no los cita como propósitos de un informe."
  citation: "fuente: `ms-access-informes.html`; «¿Qué se puede hacer con un informe?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q329
  prompt:
    es: "En Access 365, además de una tabla y de una consulta con nombre, ¿cuál de las siguientes opciones puede ser también el origen de registros de un informe?"
  options:
  - id: a
    text:
      es: "Una macro con nombre"
  - id: b
    text:
      es: "Un módulo de VBA"
  - id: c
    correct: true
    text:
      es: "Una consulta incrustada"
  - id: d
    text:
      es: "Una hoja de cálculo abierta de Excel"
  explanation:
    es: "La ayuda dice: «El origen de registros de un informe puede ser una tabla, una consulta con nombre o una consulta incrustada». «Una macro con nombre», «un módulo de VBA» y «una hoja de cálculo abierta de Excel» no figuran entre los orígenes de registros que enumera la ayuda."
  citation: "fuente: `ms-access-informes.html`; «Paso 1: Elegir un origen de registros»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q330
  prompt:
    es: "En Access 365, si se coloca en el encabezado del informe un control calculado con la función de agregado Suma, ¿para qué conjunto de datos se calcula el resultado?"
  options:
  - id: a
    text:
      es: "Para la página actual"
  - id: b
    text:
      es: "Para el grupo de registros actual"
  - id: c
    text:
      es: "Para cada fila del origen de registros"
  - id: d
    correct: true
    text:
      es: "Para todo el informe"
  explanation:
    es: "La ayuda dice: «Cuando se coloca un control calculado que usa la función de agregado de suma en el encabezado del informe, el resultado de la suma se calcula para todo el informe». «Para el grupo de registros actual» es lo que ocurre en el encabezado de grupo: «la suma se calcula para el grupo actual». «Para la página actual» y «para cada fila del origen de registros» no se citan en la ayuda: la sección Detalle aparece una vez por cada fila, pero no es donde la ayuda ejemplifica la suma."
  citation: "fuente: `ms-access-informes.html`; «Partes de un informe»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q331
  prompt:
    es: "En Access 365, ¿cuál de las siguientes secciones de un informe se imprime antes del encabezado de página?"
  options:
  - id: a
    correct: true
    text:
      es: "El encabezado del informe"
  - id: b
    text:
      es: "El encabezado de grupo"
  - id: c
    text:
      es: "El pie del informe"
  - id: d
    text:
      es: "El detalle"
  explanation:
    es: "La ayuda dice: «El encabezado del informe se imprime antes del encabezado de página». «El encabezado de grupo» se imprime «al inicio de cada grupo de registros nuevo». «El pie del informe» se imprime «al final del informe». El «detalle» aparece «una vez por cada fila del origen de registros». Ninguno se imprime antes del encabezado de página."
  citation: "fuente: `ms-access-informes.html`; «Partes de un informe»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q332
  prompt:
    es: "En Access 365, ¿cuál de las siguientes opciones indica para qué se usa el encabezado de página de un informe?"
  options:
  - id: a
    text:
      es: "Para ofrecer un logotipo o una fecha de portada"
  - id: b
    correct: true
    text:
      es: "Para repetir el título en todas las páginas"
  - id: c
    text:
      es: "Para imprimir el nombre de cada grupo de registros"
  - id: d
    text:
      es: "Para imprimir los números de página al final"
  explanation:
    es: "La ayuda dice: «El encabezado de página se usa para repetir el título del informe en todas las páginas». «Un logotipo o una fecha de portada» corresponde al encabezado del informe, que ofrece «información que normalmente aparecería en una página de portada». «Imprimir el nombre de cada grupo» es el uso del encabezado de grupo. «Imprimir los números de página al final» es el uso del pie de página."
  citation: "fuente: `ms-access-informes.html`; «Partes de un informe»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q333
  prompt:
    es: "En un informe de Access 365 agrupado por producto, ¿qué sección se usa para imprimir el nombre del producto de cada grupo?"
  options:
  - id: a
    text:
      es: "El encabezado de página"
  - id: b
    text:
      es: "El pie del grupo"
  - id: c
    correct: true
    text:
      es: "El encabezado de grupo"
  - id: d
    text:
      es: "El encabezado del informe"
  explanation:
    es: "La ayuda dice: «El encabezado de grupo se usa para imprimir el nombre del grupo. Por ejemplo, en un informe que se agrupa por producto, use el encabezado de grupo para imprimir el nombre del producto». «El encabezado de página» repite el título en todas las páginas. «El pie del grupo» se usa «para imprimir información de resumen de un grupo». «El encabezado del informe» ofrece la información de portada."
  citation: "fuente: `ms-access-informes.html`; «Partes de un informe»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q334
  prompt:
    es: "En Access 365, ¿con qué frecuencia aparece la sección Detalle de un informe cuando este se imprime o se ve en vista previa?"
  options:
  - id: a
    text:
      es: "Una vez al inicio de cada página"
  - id: b
    text:
      es: "Una vez al final de cada grupo de registros"
  - id: c
    text:
      es: "Una sola vez, al final del informe"
  - id: d
    correct: true
    text:
      es: "Una vez por cada fila del origen de registros"
  explanation:
    es: "La ayuda dice de Detalle: «Aparece una vez por cada fila del origen de registros». «Una vez al inicio de cada página» es lo que hace el encabezado de página: «Al principio de cada página». «Una vez al final de cada grupo» es lo que hace el pie del grupo: «Al final de cada grupo de registros». «Una sola vez, al final del informe» es lo que hace el pie del informe."
  citation: "fuente: `ms-access-informes.html`; «Partes de un informe»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q335
  prompt:
    es: "En Access 365, ¿cuál de las siguientes secciones de un informe se usa para imprimir información de resumen de un grupo de registros?"
  options:
  - id: a
    correct: true
    text:
      es: "El pie del grupo"
  - id: b
    text:
      es: "El encabezado de grupo"
  - id: c
    text:
      es: "El pie de página"
  - id: d
    text:
      es: "El pie del informe"
  explanation:
    es: "La ayuda dice: «El pie de grupo se usa para imprimir información de resumen de un grupo». «El encabezado de grupo» se usa para imprimir el nombre del grupo. «El pie de página» se usa para imprimir números de página o información sobre cada página. «El pie del informe» se usa para imprimir totales de los informes u otra información de resumen de todo el informe, no de un grupo."
  citation: "fuente: `ms-access-informes.html`; «Partes de un informe»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q336
  prompt:
    es: "En Access 365, ¿para qué se usa el pie del informe, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Para imprimir números de página o información sobre cada página"
  - id: b
    text:
      es: "Para imprimir información de resumen de cada grupo de registros"
  - id: c
    correct: true
    text:
      es: "Para imprimir totales u otro resumen de todo el informe"
  - id: d
    text:
      es: "Para ofrecer un título y una fecha como en una portada"
  explanation:
    es: "La ayuda dice: «El pie de informe se usa para imprimir totales de los informes u otra información de resumen de todo el informe». «Imprimir números de página o información sobre cada página» es el uso del pie de página. «Información de resumen de cada grupo» es el uso del pie del grupo. «Ofrecer un título y una fecha como en una portada» es el uso del encabezado del informe."
  citation: "fuente: `ms-access-informes.html`; «Partes de un informe»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q337
  prompt:
    es: "En Access 365, al imprimir un informe o verlo en vista previa, ¿dónde aparece el pie del informe respecto al pie de página?"
  options:
  - id: a
    text:
      es: "Debajo del pie de página, al final de la hoja"
  - id: b
    text:
      es: "Antes del encabezado de página, en la primera hoja"
  - id: c
    text:
      es: "Dentro del pie de página, en la misma línea"
  - id: d
    correct: true
    text:
      es: "Encima del pie de página, tras el último grupo o detalle"
  explanation:
    es: "La nota de la ayuda dice que, fuera de la vista Diseño, «el pie de informe aparece encima del pie de página, inmediatamente después del último pie de grupo o línea de detalle en la última página». Debajo del pie de página es lo que la nota da solo para la vista Diseño. Antes del encabezado de página es el lugar del encabezado del informe, que según la página se imprime antes del encabezado de página. Y dentro del pie de página no cuadra con las funciones de cada sección: el pie de página imprime números de página o datos de cada página, y el pie de informe, totales o resúmenes de todo el informe."
  citation: "fuente: `ms-access-informes.html`; «Partes de un informe»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q338
  prompt:
    es: "En Access 365, ¿cuál de las siguientes herramientas del grupo Informes crea un informe sencillo y tabular con todos los campos del origen seleccionado?"
  options:
  - id: a
    text:
      es: "Diseño de informe"
  - id: b
    correct: true
    text:
      es: "Informe"
  - id: c
    text:
      es: "Informe en blanco"
  - id: d
    text:
      es: "Asistente para informes"
  explanation:
    es: "La ayuda dice de Informe: «Crea un informe sencillo y tabular que contiene todos los campos en el origen de registros seleccionado en el panel de navegación». «Diseño de informe» abre un informe en blanco en vista Diseño. «Informe en blanco» lo abre en la vista Presentación con la lista de campos. «Asistente para informes» muestra un asistente de varios pasos."
  citation: "fuente: `ms-access-informes.html`; «Paso 2: Elegir una herramienta de informe»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q340
  prompt:
    es: "En Access 365, ¿cuál de las siguientes herramientas de informe muestra un asistente de varios pasos para especificar campos, niveles de agrupación y ordenación?"
  options:
  - id: a
    correct: true
    text:
      es: "Asistente para informes"
  - id: b
    text:
      es: "Etiquetas"
  - id: c
    text:
      es: "Diseño de informe"
  - id: d
    text:
      es: "Informe en blanco"
  explanation:
    es: "La ayuda dice del Asistente para informes: «Muestra un asistente de varios pasos que le permite especificar campos, niveles de agrupación y ordenación, y opciones de diseño». «Etiquetas» muestra un asistente distinto, para tamaños de etiqueta y campos. «Diseño de informe» e «Informe en blanco» abren un informe vacío, sin asistente."
  citation: "fuente: `ms-access-informes.html`; «Paso 2: Elegir una herramienta de informe»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q341
  prompt:
    es: "En Access 365, ¿cuál de las siguientes herramientas del grupo Informes muestra un asistente para seleccionar tamaños de etiqueta personalizados o estándar?"
  options:
  - id: a
    text:
      es: "Asistente para informes"
  - id: b
    correct: true
    text:
      es: "Etiquetas"
  - id: c
    text:
      es: "Informe"
  - id: d
    text:
      es: "Diseño de informe"
  explanation:
    es: "La ayuda dice de Etiquetas: «Muestra un asistente que permite seleccionar tamaños de etiqueta personalizados o estándar, así como los campos que se van a mostrar». «Asistente para informes» especifica campos, niveles de agrupación y ordenación. «Informe» crea un informe tabular sin asistente. «Diseño de informe» abre un informe en blanco en vista Diseño."
  citation: "fuente: `ms-access-informes.html`; «Paso 2: Elegir una herramienta de informe»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q343
  prompt:
    es: "En Access 365, ¿cuál es la forma más rápida de agregar agrupaciones, ordenación o totales a un informe de una base de datos de escritorio?"
  options:
  - id: a
    correct: true
    text:
      es: "Clic derecho en el campo y elegir el comando del menú"
  - id: b
    text:
      es: "Abrir la hoja de propiedades y escribir la agrupación"
  - id: c
    text:
      es: "Ejecutar el Asistente para informes de nuevo"
  - id: d
    text:
      es: "Arrastrar el campo hasta el encabezado de página"
  explanation:
    es: "La ayuda dice: «La forma más rápida de agregar agrupaciones, ordenación o totales a un informe de base de datos de escritorio es hacer clic con el botón derecho en el campo donde desea aplicar el grupo, la ordenación o el total y, después, seleccionar el comando que desee en el menú contextual». «Abrir la hoja de propiedades» y «arrastrar el campo hasta el encabezado de página» no se citan para este fin. «Ejecutar el Asistente para informes de nuevo» es otra vía que la ayuda no presenta como la más rápida."
  citation: "fuente: `ms-access-informes.html`; «Agregar agrupaciones, ordenaciones o totales»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q345
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas de la cinta permite agregar formato condicional a los controles de un informe abierto en la vista Presentación?"
  options:
  - id: a
    text:
      es: "Diseño de informe › Agrupación y totales › Formato condicional"
  - id: b
    text:
      es: "Diseño de presentación de informe › Temas › Formato condicional"
  - id: c
    text:
      es: "Crear › Informes › Formato condicional"
  - id: d
    correct: true
    text:
      es: "Formato › Formato del control › Formato condicional"
  explanation:
    es: "La ayuda dice: «En la pestaña Formato, en el grupo Formato del control, haga clic en Formato condicional». «Diseño de informe › Agrupación y totales» contiene Agrupar y ordenar. «Diseño de presentación de informe › Temas» contiene los temas de color y fuentes. «Crear › Informes» agrupa las herramientas para crear informes."
  citation: "fuente: `ms-access-informes.html`; «Resaltar datos con formato condicional»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q346
  prompt:
    es: "En el cuadro Nueva regla de formato de Access 365, ¿cuál de los siguientes tipos de regla compara los registros entre sí mediante barras de datos?"
  options:
  - id: a
    correct: true
    text:
      es: "Compare con otros registros"
  - id: b
    text:
      es: "Comprobar valores del registro actual o use una expresión"
  - id: c
    text:
      es: "Evaluar cada registro individualmente"
  - id: d
    text:
      es: "Aplicar el tema del informe"
  explanation:
    es: "La ayuda dice: «Para crear una regla que compare registros entre sí mediante barras de datos, haga clic en Compare con otros registros». «Comprobar valores del registro actual o use una expresión» crea una regla que evalúa cada registro individualmente. «Evaluar cada registro individualmente» describe esa misma regla, no la comparación. «Aplicar el tema del informe» no es un tipo de regla."
  citation: "fuente: `ms-access-informes.html`; «Resaltar datos con formato condicional»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q347
  prompt:
    es: "En Access 365, ¿cuál de los siguientes comandos de la pestaña Diseño de presentación de informe permite probar temas de color y fuentes con vista previa?"
  options:
  - id: a
    text:
      es: "Logotipo"
  - id: b
    correct: true
    text:
      es: "Temas"
  - id: c
    text:
      es: "Imagen de fondo"
  - id: d
    text:
      es: "Formato condicional"
  explanation:
    es: "La ayuda dice: «En la pestaña Diseño de presentación de informe, haga clic en Temas y coloque el cursor sobre los distintos temas de la galería para obtener una vista previa de los efectos». «Logotipo» agrega una imagen en el encabezado o pie de página. «Imagen de fondo» está en el grupo Fondo de la pestaña Formato. «Formato condicional» resalta datos con reglas."
  citation: "fuente: `ms-access-informes.html`; «Personalizar el color y las fuentes»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q348
  prompt:
    es: "En Access 365, ¿cuál de las siguientes rutas agrega una imagen de logotipo a un informe abierto en la vista Presentación?"
  options:
  - id: a
    text:
      es: "Diseño de presentación de informe › Fondo › Logotipo"
  - id: b
    text:
      es: "Diseño de presentación de informe › Temas › Logotipo"
  - id: c
    correct: true
    text:
      es: "Diseño de presentación de informe › Encabezado o pie de página › Logotipo"
  - id: d
    text:
      es: "Diseño de presentación de informe › Controles › Logotipo"
  explanation:
    es: "La ayuda dice: «En la pestaña Diseño de presentación de informe, en el grupo Encabezado o pie de página, haga clic en Logotipo». El grupo Fondo no está en esa pestaña: la página sitúa Imagen de fondo en el grupo Fondo de la pestaña Formato. Temas es el comando con el que la página elige un tema de la galería, no una imagen. Y el grupo Controles no es donde la página pone Logotipo: lo pone en Encabezado o pie de página."
  citation: "fuente: `ms-access-informes.html`; «Agregar un logotipo o una imagen de fondo»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q349
  prompt:
    es: "En Access 365, ¿cómo se obtiene una vista previa de un informe desde el panel de navegación?"
  options:
  - id: a
    correct: true
    text:
      es: "Clic derecho en el informe y Vista previa de impresión"
  - id: b
    text:
      es: "Doble clic en el informe y Vista Diseño"
  - id: c
    text:
      es: "Clic con el botón derecho y Imprimir"
  - id: d
    text:
      es: "Archivo › Exportar › PDF o XPS"
  explanation:
    es: "La ayuda dice: «Haga clic con el botón derecho en el informe en el panel de navegación y seleccione Vista previa de impresión». «Imprimir» con el botón derecho envía el informe a la impresora predeterminada, sin vista previa. «Vista Diseño» muestra la estructura del informe. «Archivo › Exportar › PDF o XPS» no es la ruta que da la ayuda: la exportación a PDF está en Datos externos."
  citation: "fuente: `ms-access-informes.html`; «Obtener una vista previa de un informe»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-informes-html
- id: m06-l06-q350
  prompt:
    es: "Señale qué ocurre en Access 365 al hacer clic con el botón derecho en un informe del panel de navegación y seleccionar Imprimir:"
  options:
  - id: a
    text:
      es: "Se abre un cuadro para elegir la impresora y las copias"
  - id: b
    correct: true
    text:
      es: "El informe se envía a la impresora predeterminada"
  - id: c
    text:
      es: "Se abre la vista previa de impresión"
  - id: d
    text:
      es: "Se exporta el informe a un archivo PDF"
  explanation:
    es: "La ayuda dice: «Haga clic con el botón derecho en el informe en el panel de navegación y seleccione Imprimir. El informe se envía a la impresora predeterminada». El cuadro para elegir impresora y copias aparece, según la nota de la página, al seleccionar Imprimir en la pestaña Archivo, no con el menú del panel. La vista previa de impresión es otro comando del mismo menú, con su propio procedimiento. Y exportar a PDF contradice que el informe se envíe a la impresora."
  citation: "fuente: `ms-access-informes.html`; «Imprimir un informe»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-especificaciones-html
- id: m06-l06-q351
  prompt:
    es: "Según las especificaciones de Access 365, ¿cuál es el número máximo de encabezados y pies de página de grupo que admite un informe?"
  options:
  - id: a
    text:
      es: "5"
  - id: b
    text:
      es: "20"
  - id: c
    text:
      es: "100"
  - id: d
    correct: true
    text:
      es: "10"
  explanation:
    es: "Las especificaciones dicen: «1 encabezado o pie de página; 1 encabezado / pie de página; 10 encabezados/pies de página de grupo». Por eso 5 y 20 no son el máximo, y 100 lo supera con mucho."
  citation: "fuente: `ms-access-especificaciones.html`; «Formulario e informe»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-access-especificaciones-html
- id: m06-l06-q352
  prompt:
    es: "Según las especificaciones de Access 365, ¿cuál es el número máximo de páginas impresas de un informe?"
  options:
  - id: a
    correct: true
    text:
      es: "65 536"
  - id: b
    text:
      es: "32 768"
  - id: c
    text:
      es: "10 000"
  - id: d
    text:
      es: "1 048 576"
  explanation:
    es: "Las especificaciones dicen: «Número de páginas impresas en un informe», con el valor «65 536». Por eso 32 768 y 10 000 se quedan cortos y 1 048 576 se pasa del máximo que fija la página."
  citation: "fuente: `ms-access-especificaciones.html`; «Formulario e informe»"
  difficulty: 3
  tags:
  - "cantidad"
