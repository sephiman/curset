m05-l05-q01:
  key:
    anchor: spring-fw-webflux-new-framework#webflux-concurrency-model
    sentence: Therefore, non-blocking servers use a small, fixed-size thread pool (event loop workers) to handle requests.
  wrong:
  - option: They use a large thread pool to absorb potential blocking during request handling
    anchor: spring-fw-webflux-new-framework#webflux-concurrency-model
    sentence: In Spring WebFlux (and non-blocking servers in general), it is assumed that applications do not block.
  - option: They add extra threads to the pool each time a request makes a blocking call
    anchor: spring-fw-webflux-new-framework#webflux-concurrency-model
    sentence: “To scale” and “small number of threads” may sound contradictory, but to never block the current thread (and rely on callbacks instead) means that you do not need extra threads, as there are no blocking calls to absorb.
  - option: They use one thread per connection, created and discarded for each request
    anchor: spring-fw-webflux-new-framework#webflux-concurrency-model
    sentence: For this reason, servlet containers use a large thread pool to absorb potential blocking during request handling.
m05-l05-q02:
  key:
    anchor: spring-fw-webflux-new-framework#webflux-performance
    sentence: The key expected benefit of reactive and non-blocking is the ability to scale with a small, fixed number of threads and less memory.
  wrong:
  - option: It makes applications run faster in every case
    anchor: spring-fw-webflux-new-framework#webflux-performance
    sentence: Reactive and non-blocking generally do not make applications run faster.
  - option: It shows its strengths even when no call has any latency
    anchor: spring-fw-webflux-new-framework#webflux-performance
    sentence: In order to observe those benefits, however, you need to have some latency (including a mix of slow and unpredictable network I/O).
  - option: It removes the extra work of writing code the non-blocking way
    anchor: spring-fw-webflux-new-framework#webflux-performance
    sentence: However, it requires more work to do things the non-blocking way, and that can slightly increase the required processing time.
m05-l05-q03:
  key:
    anchor: spring-boot-features-task-execution-and-scheduling#page-title
    sentence: When virtual threads are enabled (using Java 21+ and spring.threads.virtual.enabled set to true) this will be a SimpleAsyncTaskExecutor that uses virtual threads.
  wrong:
  - option: A `ThreadPoolTaskExecutor` with sensible defaults
    anchor: spring-boot-features-task-execution-and-scheduling#page-title
    sentence: Otherwise, it will be a ThreadPoolTaskExecutor with sensible defaults.
  - option: No executor, so the application must declare an `Executor` bean itself
    anchor: spring-boot-features-task-execution-and-scheduling#page-title
    sentence: In the absence of an Executor bean in the context, Spring Boot auto-configures an AsyncTaskExecutor.
  - option: A `SimpleAsyncTaskScheduler` that ignores any pooling related properties
    anchor: spring-boot-features-task-execution-and-scheduling#page-title
    sentence: When virtual threads are enabled (using Java 21+ and spring.threads.virtual.enabled set to true) this will be a SimpleAsyncTaskExecutor that uses virtual threads.
m05-l05-q04:
  key:
    anchor: spring-fw-webmvc-controller-advice#page-title
    sentence: By contrast, global @ModelAttribute and @InitBinder methods are applied before local ones.
  wrong:
  - option: Global `@ExceptionHandler` methods are applied before the local ones
    anchor: spring-fw-webmvc-controller-advice#page-title
    sentence: Global @ExceptionHandler methods, from an @ControllerAdvice, are applied after local ones, from the @Controller.
  - option: Such methods apply only to the `@Controller` class in which they are declared
    anchor: spring-fw-webmvc-controller-advice#page-title
    sentence: If, instead, they are declared in an @ControllerAdvice or @RestControllerAdvice class, then they apply to any controller.
  - option: '`@ControllerAdvice` applies to `@Controller` classes but never to `@RestController` classes'
    anchor: spring-fw-webmvc-controller-advice#page-title
    sentence: By default, both @ControllerAdvice and @RestControllerAdvice apply to any controller, including @Controller and @RestController.
m05-l05-q05:
  key:
    anchor: spring-fw-webmvc-exceptionhandler#mvc-ann-exceptionhandler-exc
    sentence: When multiple exception methods match, a root exception match is generally preferred to a cause exception match.
  wrong:
  - option: The cause exception match over the root exception match
    anchor: spring-fw-webmvc-exceptionhandler#mvc-ann-exceptionhandler-exc
    sentence: When multiple exception methods match, a root exception match is generally preferred to a cause exception match.
  - option: The method declared first in the class, whatever the exception depth
    anchor: spring-fw-webmvc-exceptionhandler#mvc-ann-exceptionhandler-exc
    sentence: More specifically, the ExceptionDepthComparator is used to sort exceptions based on their depth from the thrown exception type.
  - option: Only an immediate cause is considered, so deeper causes never match
    anchor: spring-fw-webmvc-exceptionhandler#mvc-ann-exceptionhandler-exc
    sentence: As of 5.3, this can match at arbitrary cause levels, whereas previously only an immediate cause was considered.
