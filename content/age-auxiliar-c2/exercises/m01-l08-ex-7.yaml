# anchor: boe-a-2015-10566-art-80
- id: m01-l08-q178
  prompt:
    es: "¿Cuál de las siguientes normas rige, según el artículo 80 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, el Servicio Exterior del Estado en lo concerniente a su composición, organización, funciones, integración y personal?"
  options:
  - id: a
    text:
      es: "La Ley 40/2015, de Régimen Jurídico del Sector Público, con carácter exclusivo."
  - id: b
    text:
      es: "La Ley 50/1997, del Gobierno, y su normativa de desarrollo."
  - id: c
    text:
      es: "El Real Decreto 829/2023, por el que se reestructuran los departamentos ministeriales."
  - id: d
    correct: true
    text:
      es: "La Ley 2/2014, de la Acción y del Servicio Exterior del Estado, y su normativa de desarrollo."
  explanation:
    es: "El artículo 80 remite a la Ley 2/2014 y a su normativa de desarrollo. La Ley 40/2015 solo se aplica de forma supletoria, no exclusiva. La Ley del Gobierno y el decreto de departamentos ministeriales no regulan la composición y el personal del Servicio Exterior."
  citation: "art. 80 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-80
- id: m01-l08-q179
  prompt:
    es: "Según el artículo 80 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, el Servicio Exterior del Estado se rige por la Ley 2/2014 y su normativa de desarrollo y, supletoriamente, por:"
  options:
  - id: a
    text:
      es: "La Ley 39/2015, del Procedimiento Administrativo Común de las Administraciones Públicas."
  - id: b
    correct: true
    text:
      es: "La Ley 40/2015, de Régimen Jurídico del Sector Público."
  - id: c
    text:
      es: "La Ley 50/1997, del Gobierno."
  - id: d
    text:
      es: "El Estatuto Básico del Empleado Público."
  explanation:
    es: "El artículo 80 declara supletoria a la propia Ley 40/2015. La Ley 39/2015, la Ley del Gobierno y el Estatuto Básico del Empleado Público no se citan como norma supletoria del Servicio Exterior."
  citation: "art. 80 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2014-3248-art-1
- id: m01-l08-q180
  prompt:
    es: "Según el artículo 1 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, el Servicio Exterior del Estado lo integran los órganos, unidades y medios que ejecutan y desarrollan:"
  options:
  - id: a
    correct: true
    text:
      es: "La Política Exterior y la Acción Exterior."
  - id: b
    text:
      es: "La política de Defensa y la Acción humanitaria."
  - id: c
    text:
      es: "La Política Exterior, con exclusión de la Acción Exterior."
  - id: d
    text:
      es: "La cooperación internacional al desarrollo y la Política Comercial."
  explanation:
    es: "El artículo 1.2.c dice que ejecutan y desarrollan la Política Exterior y la Acción Exterior. No se limitan a la Política Exterior ni a la cooperación o a la política comercial, y la defensa no es el objeto de esa definición."
  citation: "art. 1.2.c Ley 2/2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2014-3248-art-41
- id: m01-l08-q181
  prompt:
    es: "Según el artículo 41.3 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, el Servicio Exterior del Estado presta asistencia y protección a:"
  options:
  - id: a
    text:
      es: "Los extranjeros que residan en España."
  - id: b
    text:
      es: "Los españoles que residan en territorio nacional."
  - id: c
    correct: true
    text:
      es: "Los españoles en el exterior."
  - id: d
    text:
      es: "Los funcionarios de las Organizaciones internacionales."
  explanation:
    es: "El artículo 41.3 le encarga prestar asistencia y protección a los españoles en el exterior. No la presta a extranjeros residentes en España ni a españoles que residen en territorio nacional, ni a los funcionarios de las Organizaciones internacionales."
  citation: "art. 41.3 Ley 2/2014"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2014-3248-art-42
- id: m01-l08-q182
  prompt:
    es: "Conforme al artículo 42.1 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, las Misiones Diplomáticas Permanentes representan con este carácter a España ante:"
  options:
  - id: a
    text:
      es: "La Unión Europea o una Organización Internacional."
  - id: b
    text:
      es: "Únicamente los Estados con relaciones consulares."
  - id: c
    text:
      es: "Las organizaciones intergubernamentales."
  - id: d
    correct: true
    text:
      es: "Uno o varios Estados."
  explanation:
    es: "El artículo 42.1 las acredita ante uno o varios Estados con los que España tiene relaciones diplomáticas. La Unión Europea y las Organizaciones internacionales son el ámbito de las Representaciones Permanentes según el artículo 42.2."
  citation: "art. 42.1 Ley 2/2014"
  difficulty: 2
  tags:
  - "concepto"
  - "órgano"
# anchor: boe-a-2014-3248-art-42
- id: m01-l08-q183
  prompt:
    es: "Según la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, cuando una Misión Diplomática represente a España ante varios Estados lo hará en régimen de:"
  options:
  - id: a
    correct: true
    text:
      es: "Acreditación múltiple."
  - id: b
    text:
      es: "Acreditación compartida."
  - id: c
    text:
      es: "Representación rotatoria."
  - id: d
    text:
      es: "Acreditación conjunta."
  explanation:
    es: "El artículo 42.1 llama a ese régimen acreditación múltiple, con residencia en uno de los Estados. Las otras denominaciones no existen en el artículo."
  citation: "art. 42.1 Ley 2/2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2014-3248-art-44
- id: m01-l08-q184
  prompt:
    es: "De acuerdo con el artículo 44.1 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, la Jefatura de la Misión Diplomática Permanente es ejercida por un:"
  options:
  - id: a
    text:
      es: "Embajador Representante Permanente."
  - id: b
    text:
      es: "Encargado de Negocios con cartas credenciales."
  - id: c
    correct: true
    text:
      es: "Embajador Extraordinario y Plenipotenciario."
  - id: d
    text:
      es: "Cónsul General."
  explanation:
    es: "El artículo 44.1 asigna la Jefatura de la Misión Diplomática Permanente a un Embajador Extraordinario y Plenipotenciario. El Embajador Representante Permanente dirige las Representaciones Permanentes. El Encargado de Negocios actúa con cartas de gabinete, no credenciales, y el Cónsul General dirige una Oficina Consular."
  citation: "art. 44.1 Ley 2/2014"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2014-3248-art-44
- id: m01-l08-q185
  prompt:
    es: "Conforme a la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, la Jefatura de las Representaciones Permanentes es ejercida por un:"
  options:
  - id: a
    text:
      es: "Embajador Extraordinario y Plenipotenciario."
  - id: b
    text:
      es: "Cónsul General Representante."
  - id: c
    text:
      es: "Encargado de Negocios permanente."
  - id: d
    correct: true
    text:
      es: "Embajador Representante Permanente."
  explanation:
    es: "El artículo 44.1 la atribuye al Embajador Representante Permanente. El Embajador Extraordinario y Plenipotenciario es el Jefe de la Misión Diplomática Permanente. El Cónsul General Representante y el Encargado de Negocios permanente no existen como jefes de Representación."
  citation: "art. 44.1 Ley 2/2014"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2014-3248-art-44
- id: m01-l08-q186
  prompt:
    es: "Conforme al artículo 44.1 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, el Rey acredita a los Jefes de Misión Diplomática y de Representación Permanente mediante:"
  options:
  - id: a
    text:
      es: "Cartas de gabinete."
  - id: b
    correct: true
    text:
      es: "Cartas credenciales."
  - id: c
    text:
      es: "Cartas patentes."
  - id: d
    text:
      es: "Cartas de instrucciones."
  explanation:
    es: "El artículo 44.1 dice que el Rey los acredita mediante cartas credenciales. Las cartas de gabinete acreditan a los Encargados de Negocios, y las cartas patentes corresponden al Jefe de la Oficina Consular según el artículo 48.2. Las cartas de instrucciones las facilita después el Ministerio a cada Embajador."
  citation: "art. 44.1 Ley 2/2014"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2014-3248-art-44
- id: m01-l08-q187
  prompt:
    es: "¿Quién acredita a los Jefes de Misión Diplomática mediante cartas credenciales, según el artículo 44.1 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado?"
  options:
  - id: a
    text:
      es: "El Presidente del Gobierno."
  - id: b
    text:
      es: "El Ministro de Asuntos Exteriores, Unión Europea y Cooperación."
  - id: c
    text:
      es: "El Consejo de Ministros."
  - id: d
    correct: true
    text:
      es: "El Rey."
  explanation:
    es: "El artículo 44.1 atribuye la acreditación mediante cartas credenciales al Rey. El Ministro de Asuntos Exteriores firma las cartas de gabinete de los Encargados de Negocios, y ni el Presidente del Gobierno ni el Consejo de Ministros acreditan a los Jefes de Misión."
  citation: "art. 44.1 Ley 2/2014"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2014-3248-art-44
- id: m01-l08-q188
  prompt:
    es: "Según el artículo 44.4 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, los Encargados de Negocios con cartas de gabinete son designados por:"
  options:
  - id: a
    text:
      es: "Real Decreto acordado en Consejo de Ministros."
  - id: b
    text:
      es: "Carta credencial firmada por el Rey."
  - id: c
    correct: true
    text:
      es: "Orden del Ministro de Asuntos Exteriores, Unión Europea y Cooperación."
  - id: d
    text:
      es: "Resolución del Jefe de la Misión Diplomática."
  explanation:
    es: "El artículo 44.4 los hace designar por Orden del Ministro de Asuntos Exteriores. El Real Decreto acordado en Consejo de Ministros es el cauce de los Embajadores. Las cartas credenciales del Rey no se emiten para ellos, y el Jefe de Misión no los designa."
  citation: "art. 44.4 Ley 2/2014"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2014-3248-art-44
- id: m01-l08-q189
  prompt:
    es: "¿Cuál de las siguientes opciones recoge el personal sobre el que ejerce la jefatura superior el Jefe de Misión, según el artículo 44.2 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado?"
  options:
  - id: a
    text:
      es: "Únicamente el personal diplomático de la Misión."
  - id: b
    correct: true
    text:
      es: "Todo el personal de la Misión."
  - id: c
    text:
      es: "Todo el personal de las Oficinas Consulares del país."
  - id: d
    text:
      es: "Todo el personal del Ministerio de Asuntos Exteriores, Unión Europea y Cooperación."
  explanation:
    es: "El artículo 44.2 le da la jefatura superior de todo el personal de la Misión, no solo del diplomático. Las Oficinas Consulares tienen su propio Jefe según el artículo 48.3, y el personal del Ministerio no está bajo su jefatura."
  citation: "art. 44.2 Ley 2/2014"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2014-3248-art-44
- id: m01-l08-q190
  prompt:
    es: "Conforme al artículo 44.4 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, los Embajadores se designan, con carácter general, entre:"
  options:
  - id: a
    correct: true
    text:
      es: "Funcionarios de la Carrera Diplomática."
  - id: b
    text:
      es: "Funcionarios de cualquier Cuerpo del Subgrupo A1."
  - id: c
    text:
      es: "Los Subsecretarios y los Secretarios generales del Ministerio."
  - id: d
    text:
      es: "Los Directores generales del Ministerio de Asuntos Exteriores, Unión Europea y Cooperación."
  explanation:
    es: "El artículo 44.4 los designa entre funcionarios de la Carrera Diplomática, aunque el Gobierno puede nombrar Embajadores a personas ajenas a ella. No basta pertenecer a cualquier Cuerpo del Subgrupo A1, ni se reserva el puesto a Subsecretarios, Secretarios generales o Directores generales."
  citation: "art. 44.4 Ley 2/2014"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2014-3248-art-47
- id: m01-l08-q191
  prompt:
    es: "Según el artículo 47.1 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, las Oficinas Consulares ejercen las funciones consulares y, en especial, se encargan de:"
  options:
  - id: a
    text:
      es: "Negociar con el Gobierno del Estado receptor."
  - id: b
    text:
      es: "Representar a España ante el Estado receptor."
  - id: c
    correct: true
    text:
      es: "Prestar asistencia y protección a los españoles en el exterior."
  - id: d
    text:
      es: "Acreditar a los Jefes de Misión ante el Gobierno receptor."
  explanation:
    es: "El artículo 47.1 destaca la asistencia y protección a los españoles en el exterior. Negociar con el Gobierno receptor y representar a España ante el Estado son funciones de las Misiones Diplomáticas, y acreditar a los Jefes de Misión corresponde al Rey."
  citation: "art. 47.1 Ley 2/2014"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2014-3248-art-48
- id: m01-l08-q192
  prompt:
    es: "Conforme al artículo 48.1 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, las Oficinas Consulares podrán ser:"
  options:
  - id: a
    text:
      es: "Principales y subordinadas."
  - id: b
    text:
      es: "Generales y delegadas."
  - id: c
    text:
      es: "Permanentes y temporales."
  - id: d
    correct: true
    text:
      es: "De carrera y honorarias."
  explanation:
    es: "El artículo 48.1 las clasifica en de carrera y honorarias. Las demás parejas de adjetivos no son clases que prevea la ley."
  citation: "art. 48.1 Ley 2/2014"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2014-3248-art-48
- id: m01-l08-q194
  prompt:
    es: "Según el artículo 48.1 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, las Oficinas Consulares honorarias, que están a cargo de cónsules honorarios, se crean por:"
  options:
  - id: a
    text:
      es: "Real Decreto del Consejo de Ministros."
  - id: b
    correct: true
    text:
      es: "Orden del Ministro de Asuntos Exteriores, Unión Europea y Cooperación."
  - id: c
    text:
      es: "Resolución del Jefe de la Misión Diplomática."
  - id: d
    text:
      es: "Orden conjunta de los Ministerios de Asuntos Exteriores y de Hacienda."
  explanation:
    es: "El artículo 48.1 las crea por Orden del Ministro de Asuntos Exteriores. El Real Decreto del Consejo de Ministros es el cauce de las de carrera y de las agencias consulares según el artículo 47.2. Ni el Jefe de la Misión ni una orden conjunta tienen esa competencia."
  citation: "art. 48.1 Ley 2/2014"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2014-3248-art-48
- id: m01-l08-q195
  prompt:
    es: "¿Cuál de las siguientes opciones indica quiénes dirigen las Oficinas Consulares de carrera, según el artículo 48.1 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado?"
  options:
  - id: a
    text:
      es: "Cónsules honorarios."
  - id: b
    correct: true
    text:
      es: "Funcionarios de la Carrera Diplomática."
  - id: c
    text:
      es: "Encargados de Negocios con cartas de gabinete."
  - id: d
    text:
      es: "Funcionarios de cualquier Cuerpo del Subgrupo A1."
  explanation:
    es: "El artículo 48.1 pone al frente de las de carrera a funcionarios de la Carrera Diplomática. Los cónsules honorarios están a cargo de las honorarias. Los Encargados de Negocios dirigen una Misión, no una Oficina Consular, y no basta cualquier Cuerpo del Subgrupo A1."
  citation: "art. 48.1 Ley 2/2014"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-2014-3248-art-48
- id: m01-l08-q196
  prompt:
    es: "Según el artículo 48.2 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, el Jefe de la Oficina Consular de carrera es designado por:"
  options:
  - id: a
    text:
      es: "Real Decreto acordado en Consejo de Ministros, entre funcionarios de la Carrera Diplomática."
  - id: b
    text:
      es: "Orden del Ministro de Asuntos Exteriores, Unión Europea y Cooperación, entre cualquier funcionario del Subgrupo A1."
  - id: c
    text:
      es: "Orden del Jefe de la Misión Diplomática, entre funcionarios de la Carrera Diplomática."
  - id: d
    correct: true
    text:
      es: "Orden del Ministro de Asuntos Exteriores, Unión Europea y Cooperación, entre funcionarios de la Carrera Diplomática."
  explanation:
    es: "El artículo 48.2 lo designa por Orden del Ministro de Asuntos Exteriores y entre funcionarios de la Carrera Diplomática. El Real Decreto es el cauce de los Embajadores. No basta el Subgrupo A1 y no corresponde al Jefe de la Misión designarlo."
  citation: "art. 48.2 Ley 2/2014"
  difficulty: 3
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2014-3248-art-48
- id: m01-l08-q197
  prompt:
    es: "Según el artículo 48.1 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, las Oficinas Consulares honorarias podrán ser:"
  options:
  - id: a
    correct: true
    text:
      es: "Consulados Honorarios o Viceconsulados Honorarios."
  - id: b
    text:
      es: "Consulados Generales o Consulados Honorarios."
  - id: c
    text:
      es: "Viceconsulados o Agencias consulares."
  - id: d
    text:
      es: "Consulados de carrera o Consulados Honorarios."
  explanation:
    es: "El artículo 48.1 da a las honorarias la forma de Consulados Honorarios o Viceconsulados Honorarios. El Consulado General es una categoría de las de carrera. Las agencias consulares dependen de una Oficina Consular de carrera, y los Consulados de carrera no son honorarios."
  citation: "art. 48.1 Ley 2/2014"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-2014-3248-art-48
- id: m01-l08-q200
  prompt:
    es: "De acuerdo con el artículo 48.1 de la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado, las Oficinas Consulares de carrera podrán tener categoría de:"
  options:
  - id: a
    correct: true
    text:
      es: "Consulado General o Consulado."
  - id: b
    text:
      es: "Consulado Honorario o Viceconsulado Honorario."
  - id: c
    text:
      es: "Consulado General o agencia consular."
  - id: d
    text:
      es: "Consulado General o Consulado Honorario."
  explanation:
    es: "El artículo 48.1 da a las Oficinas Consulares de carrera la categoría de Consulado General o de Consulado, y las pone a cargo de funcionarios de la Carrera Diplomática. Consulado Honorario y Viceconsulado Honorario son las categorías de las honorarias, que dirigen cónsules honorarios según el mismo artículo 48.1. La agencia consular no es una categoría de la oficina de carrera, sino una oficina que depende de ella, según el artículo 48.5. La pareja de Consulado General y Consulado Honorario mezcla una categoría de carrera con una honoraria."
  citation: "art. 48.1 Ley 2/2014"
  difficulty: 2
  tags:
  - "estructura"
