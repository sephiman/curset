# anchor: boe-a-2003-23186-art-136
- id: m03-l07-q0154
  prompt:
    es: "Conforme al artículo 136.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en la comprobación limitada la Administración puede hacer requerimientos a terceros para que aporten información y documentación justificativa con el objeto de:"
  options:
  - id: a
    correct: true
    text:
      es: "comprobar la veracidad de la información que obre en poder de la Administración tributaria, incluida la obtenida en el procedimiento."
  - id: b
    text:
      es: "investigar el origen de los fondos de las operaciones financieras que el obligado haya realizado."
  - id: c
    text:
      es: "valorar los bienes del obligado cuando no puedan obtenerse sus circunstancias de fuentes documentales."
  - id: d
    text:
      es: "descubrir los supuestos de hecho de las obligaciones tributarias que sean ignorados por la Administración tributaria o por terceros."
  explanation:
    es: "El requerimiento a terceros tiene un fin acotado: contrastar la veracidad de la información que ya obra en poder de la Administración. Descubrir hechos ignorados es investigación (inspección), valorar bienes corresponde a la comprobación de valores y el origen de fondos no es el objeto de la actuación."
  citation: "art. 136.2 LGT"
  difficulty: 2
  tags:
  - "comprobación limitada"
  - "actuaciones"
# anchor: boe-a-2003-23186-art-136
- id: m03-l07-q0156
  prompt:
    es: "Según el artículo 136.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el examen de la contabilidad en el procedimiento de comprobación limitada:"
  options:
  - id: a
    text:
      es: "Permite la ulterior comprobación en inspección solo si se descubren nuevos hechos o circunstancias."
  - id: b
    correct: true
    text:
      es: "No impide ni limita la ulterior comprobación de las operaciones a que se refiere en un procedimiento de inspección."
  - id: c
    text:
      es: "Limita la ulterior comprobación en inspección a las operaciones que no figuren en los libros examinados."
  - id: d
    text:
      es: "Impide que la Administración compruebe después, en un procedimiento de inspección, las operaciones examinadas y las no examinadas."
  explanation:
    es: "El examen de la contabilidad en comprobación limitada no impide ni limita comprobar después las mismas operaciones en una inspección (art. 136.2.c). No hay cierre del objeto, límite a lo no registrado ni exigencia de nuevos hechos, que es condición del artículo 140.1 tras la resolución."
  citation: "art. 136.2 LGT"
  difficulty: 3
  tags:
  - "comprobación limitada"
  - "contabilidad"
# anchor: boe-a-2003-23186-art-136
- id: m03-l07-q0158
  prompt:
    es: "Conforme al artículo 136.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en ningún caso se podrá requerir a terceros información sobre movimientos financieros, pero podrá solicitarse al obligado tributario:"
  options:
  - id: a
    correct: true
    text:
      es: "la justificación documental de operaciones financieras que tengan incidencia en la base o en la cuota de una obligación tributaria."
  - id: b
    text:
      es: "la declaración del origen de los fondos de cualquier cuenta, tenga o no incidencia tributaria."
  - id: c
    text:
      es: "una autorización para que la Administración acceda directamente a sus cuentas en entidades de crédito."
  - id: d
    text:
      es: "la información sobre las operaciones financieras de otros obligados con los que mantenga relaciones."
  explanation:
    es: "Al obligado puede pedírsele la justificación documental de operaciones financieras con incidencia en la base o en la cuota. No cabe pedir una autorización de acceso directo, información de otros obligados ni el origen de fondos sin incidencia tributaria."
  citation: "art. 136.3 LGT"
  difficulty: 2
  tags:
  - "comprobación limitada"
  - "movimientos financieros"
# anchor: boe-a-2003-23186-art-137
- id: m03-l07-q0160
  prompt:
    es: "¿Cómo se inician las actuaciones del procedimiento de comprobación limitada, según el artículo 137.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Por la presentación de una declaración con resultado a ingresar o a devolver."
  - id: b
    text:
      es: "Por requerimiento de la inspección tributaria al obligado para que aporte documentación."
  - id: c
    text:
      es: "A instancia del obligado tributario, mediante una solicitud ante el órgano competente."
  - id: d
    correct: true
    text:
      es: "De oficio, por acuerdo del órgano competente."
  explanation:
    es: "Las actuaciones de comprobación limitada se inician de oficio por acuerdo del órgano competente (art. 137.1). No las inicia la solicitud del obligado, ni una declaración, ni un requerimiento de la inspección."
  citation: "art. 137.1 LGT"
  difficulty: 1
  tags:
  - "comprobación limitada"
  - "iniciación"
# anchor: boe-a-2003-23186-art-137
- id: m03-l07-q0162
  prompt:
    es: "Conforme al artículo 137.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la iniciación del procedimiento de comprobación limitada cuando los datos en poder de la Administración son suficientes:"
  options:
  - id: a
    correct: true
    text:
      es: "El procedimiento puede iniciarse mediante la notificación de la propuesta de liquidación."
  - id: b
    text:
      es: "El procedimiento no puede iniciarse sin que el obligado haya presentado alegaciones a una propuesta previa."
  - id: c
    text:
      es: "El procedimiento puede iniciarse mediante requerimiento para que el obligado aclare los datos de su declaración."
  - id: d
    text:
      es: "El procedimiento debe iniciarse siempre mediante comunicación previa de la naturaleza y alcance de las actuaciones."
  explanation:
    es: "Con datos suficientes para formular la propuesta de liquidación, el procedimiento puede iniciarse con su notificación (art. 137.2). No hace falta una comunicación previa, el requerimiento de aclaración es la vía de la verificación de datos y no se exigen alegaciones antes de iniciar."
  citation: "art. 137.2 LGT"
  difficulty: 3
  tags:
  - "comprobación limitada"
  - "iniciación"
# anchor: boe-a-2007-15984-art-163
- id: m03-l07-q0164
  prompt:
    es: "De acuerdo con el artículo 163 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, se podrá iniciar el procedimiento de comprobación limitada cuando, en relación con las autoliquidaciones, declaraciones, comunicaciones de datos o solicitudes presentadas, se adviertan errores en su contenido o:"
  options:
  - id: a
    text:
      es: "incumplimientos del deber de conservar los justificantes durante el plazo de prescripción."
  - id: b
    text:
      es: "diferencias entre el valor declarado y el valor de mercado fijado por un perito de la Administración."
  - id: c
    correct: true
    text:
      es: "discrepancias entre los datos declarados o justificantes aportados y los elementos de prueba que obren en poder de la Administración tributaria."
  - id: d
    text:
      es: "omisiones en la presentación de las declaraciones informativas exigibles a terceros relacionados con el obligado."
  explanation:
    es: "La letra a) del artículo 163 incluye los errores en el contenido y las discrepancias entre lo declarado o justificado y los elementos de prueba de la Administración. Las declaraciones informativas de terceros, los valores periciales y la conservación de justificantes no aparecen en ese supuesto."
  citation: "art. 163 RGAT"
  difficulty: 2
  tags:
  - "comprobación limitada"
  - "iniciación"
# anchor: boe-a-2003-23186-art-138
- id: m03-l07-q0165
  prompt:
    es: "Según el artículo 138.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las actuaciones del procedimiento de comprobación limitada se documentarán en:"
  options:
  - id: a
    text:
      es: "las propuestas de resolución que se notifiquen al obligado en cada trámite."
  - id: b
    text:
      es: "los informes razonados que se emitan por los servicios jurídicos de la Administración."
  - id: c
    correct: true
    text:
      es: "las comunicaciones y diligencias a las que se refiere el apartado 7 del artículo 99."
  - id: d
    text:
      es: "las actas de conformidad o de disconformidad que se extiendan por el órgano actuante."
  explanation:
    es: "Las actuaciones se documentan en comunicaciones y diligencias (art. 138.1, con remisión al artículo 99.7). Las actas son el documento propio de la inspección, y los informes razonados y las propuestas no son el medio de documentar las actuaciones."
  citation: "art. 138.1 LGT"
  difficulty: 2
  tags:
  - "comprobación limitada"
  - "tramitación"
# anchor: boe-a-2003-23186-art-138
- id: m03-l07-q0166
  prompt:
    es: "De acuerdo con el artículo 138.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el obligado tributario que hubiera sido requerido en el procedimiento de comprobación limitada deberá personarse en el lugar, día y hora señalados para la práctica de las actuaciones y deberá:"
  options:
  - id: a
    correct: true
    text:
      es: "aportar la documentación y demás elementos solicitados."
  - id: b
    text:
      es: "prestar su conformidad a las actuaciones que se practiquen."
  - id: c
    text:
      es: "designar un representante con poder suficiente para actuar."
  - id: d
    text:
      es: "acreditar que no tiene deudas pendientes con la Administración."
  explanation:
    es: "El obligado requerido debe personarse y aportar la documentación y demás elementos solicitados (art. 138.2). No se exige designar representante, prestar conformidad ni acreditar la ausencia de deudas."
  citation: "art. 138.2 LGT"
  difficulty: 1
  tags:
  - "comprobación limitada"
  - "tramitación"
# anchor: boe-a-2003-23186-art-138
- id: m03-l07-q0168
  prompt:
    es: "Conforme al artículo 138.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, con carácter previo a la práctica de la liquidación provisional en el procedimiento de comprobación limitada, la Administración deberá comunicar al obligado:"
  options:
  - id: a
    text:
      es: "el informe del órgano de inspección para que lo ratifique expresamente."
  - id: b
    correct: true
    text:
      es: "la propuesta de liquidación para que alegue lo que convenga a su derecho."
  - id: c
    text:
      es: "la resolución definitiva para que ingrese la deuda en periodo voluntario."
  - id: d
    text:
      es: "el acta de la comprobación para que manifieste su conformidad o disconformidad."
  explanation:
    es: "Antes de liquidar provisionalmente se comunica la propuesta de liquidación para que el obligado alegue (art. 138.3). El acta con conformidad o disconformidad es de la inspección, y no hay informe a ratificar ni resolución definitiva previa."
  citation: "art. 138.3 LGT"
  difficulty: 2
  tags:
  - "comprobación limitada"
  - "tramitación"
# anchor: boe-a-2007-15984-art-164
- id: m03-l07-q0169
  prompt:
    es: "De acuerdo con el artículo 164.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, con carácter previo a la resolución de la comprobación limitada, la Administración notifica la propuesta para que el obligado alegue en un plazo de:"
  options:
  - id: a
    text:
      es: "10 días, contados a partir del día siguiente a la finalización de las actuaciones."
  - id: b
    text:
      es: "15 días, contados a partir del día siguiente al de la notificación de la propuesta."
  - id: c
    text:
      es: "5 días, contados a partir del día siguiente al de la notificación de la propuesta."
  - id: d
    correct: true
    text:
      es: "10 días, contados a partir del día siguiente al de la notificación de la propuesta."
  explanation:
    es: "El plazo de alegaciones es de 10 días desde el día siguiente a la notificación de la propuesta (art. 164.4 RGAT). Quince días son los de la rectificación de autoliquidaciones, cinco días no es plazo de este trámite y el cómputo no parte del fin de las actuaciones."
  citation: "art. 164.4 RGAT"
  difficulty: 1
  tags:
  - "comprobación limitada"
  - "plazos"
# anchor: boe-a-2007-15984-art-164
- id: m03-l07-q0171
  prompt:
    es: "Según el artículo 164.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿qué puede acordar la Administración antes de abrir el plazo de alegaciones en la comprobación limitada?"
  options:
  - id: a
    text:
      es: "De forma motivada, la conversión de la comprobación limitada en un procedimiento de inspección general sobre todas las obligaciones del obligado."
  - id: b
    correct: true
    text:
      es: "De forma motivada, la ampliación o reducción del alcance de las actuaciones, con notificación al obligado."
  - id: c
    text:
      es: "Sin motivación, la ampliación del plazo de alegaciones de diez a quince días."
  - id: d
    text:
      es: "De forma motivada, la suspensión de las actuaciones hasta que el obligado aporte los justificantes."
  explanation:
    es: "Antes del plazo de alegaciones, la Administración puede ampliar o reducir de forma motivada el alcance de las actuaciones y debe notificarlo al obligado (art. 164.1). No se prevé convertir el procedimiento, ampliar sin motivar el plazo ni suspender hasta nuevos justificantes."
  citation: "art. 164.1 RGAT"
  difficulty: 2
  tags:
  - "comprobación limitada"
  - "tramitación"
# anchor: boe-a-2003-23186-art-139
- id: m03-l07-q0173
  prompt:
    es: "Conforme al artículo 139.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la caducidad del procedimiento de comprobación limitada:"
  options:
  - id: a
    text:
      es: "Se produce a los tres meses del inicio sin que el obligado haya presentado alegaciones, aunque exista resolución."
  - id: b
    text:
      es: "Se produce transcurrido el plazo del artículo 104 sin notificar resolución expresa e impide iniciar de nuevo el procedimiento."
  - id: c
    text:
      es: "Se produce transcurrido el plazo del artículo 104 sin notificar liquidación provisional, sin perjuicio de iniciar otro procedimiento."
  - id: d
    correct: true
    text:
      es: "Se produce transcurrido el plazo del artículo 104 sin notificar resolución expresa, sin que ello impida iniciar de nuevo el procedimiento dentro del plazo de prescripción."
  explanation:
    es: "La caducidad llega al transcurrir el plazo del artículo 104 sin notificar resolución expresa, y no impide reabrir el procedimiento dentro de la prescripción (art. 139.1.b). Lo que se debe notificar es resolución expresa, no solo liquidación provisional, y no depende de las alegaciones."
  citation: "art. 139.1 LGT"
  difficulty: 3
  tags:
  - "comprobación limitada"
  - "caducidad"
# anchor: boe-a-2003-23186-art-139
- id: m03-l07-q0174
  prompt:
    es: "Según el artículo 139.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento de comprobación limitada terminará por el inicio de un procedimiento inspector que:"
  options:
  - id: a
    text:
      es: "se inicie después de notificada la resolución expresa."
  - id: b
    correct: true
    text:
      es: "incluya el objeto de la comprobación limitada."
  - id: c
    text:
      es: "se refiera a un periodo distinto del comprobado."
  - id: d
    text:
      es: "afecte a cualquier obligación tributaria del mismo obligado."
  explanation:
    es: "La comprobación limitada termina por el inicio de una inspección que incluya su objeto (art. 139.1.c). Una inspección sobre otras obligaciones, otro periodo o posterior a la resolución no la termina."
  citation: "art. 139.1 LGT"
  difficulty: 1
  tags:
  - "comprobación limitada"
  - "terminación"
# anchor: boe-a-2003-23186-art-139
- id: m03-l07-q0175
  prompt:
    es: "¿Cuál de los siguientes forma parte del contenido mínimo de la resolución que pone fin a la comprobación limitada, según el artículo 139.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "La especificación de las actuaciones concretas realizadas."
  - id: b
    text:
      es: "La relación de los medios de prueba propuestos por el obligado y no admitidos."
  - id: c
    text:
      es: "La indicación del plazo en que el obligado puede solicitar la tasación pericial contradictoria."
  - id: d
    text:
      es: "El informe razonado del órgano que dictó el acuerdo de inicio del procedimiento."
  explanation:
    es: "La resolución debe incluir, al menos, la obligación tributaria o elementos y ámbito temporal, las actuaciones concretas realizadas, los hechos y fundamentos de derecho y la liquidación provisional o la manifestación de que no procede regularizar (art. 139.2). Los medios de prueba no admitidos, el plazo de la tasación y el informe razonado no figuran en la lista."
  citation: "art. 139.2 LGT"
  difficulty: 1
  tags:
  - "comprobación limitada"
  - "terminación"
# anchor: boe-a-2003-23186-art-139
- id: m03-l07-q0176
  prompt:
    es: "De acuerdo con el artículo 139.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la resolución que pone fin a la comprobación limitada debe incluir, al menos, una liquidación provisional o, en su caso:"
  options:
  - id: a
    text:
      es: "propuesta de inicio de un procedimiento de inspección sobre el mismo objeto."
  - id: b
    text:
      es: "declaración de que el derecho de la Administración a liquidar ha prescrito."
  - id: c
    correct: true
    text:
      es: "manifestación expresa de que no procede regularizar la situación tributaria como consecuencia de la comprobación realizada."
  - id: d
    text:
      es: "manifestación expresa de que el obligado ha prestado conformidad con los hechos comprobados."
  explanation:
    es: "Si no hay liquidación provisional, la resolución debe manifestar expresamente que no procede regularizar (art. 139.2.d). La conformidad del obligado, la propuesta de inspección y la declaración de prescripción no son ese contenido."
  citation: "art. 139.2 LGT"
  difficulty: 2
  tags:
  - "comprobación limitada"
  - "terminación"
# anchor: boe-a-2003-23186-art-140
- id: m03-l07-q0181
  prompt:
    es: "En una comprobación limitada, el administrador de Pinturas Lara, S.L. presta conformidad expresa a unos hechos determinantes de la deuda. Más tarde quiere impugnarlos alegando que desconocía la normativa aplicable. Según el artículo 140.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede hacerlo?"
  options:
  - id: a
    text:
      es: "Sí, porque el desconocimiento de la normativa permite impugnar la conformidad prestada."
  - id: b
    text:
      es: "No, porque la conformidad expresa impide toda impugnación posterior sin excepción."
  - id: c
    text:
      es: "Sí, pero solo si el representante de la sociedad no es quien prestó la conformidad."
  - id: d
    correct: true
    text:
      es: "No, porque solo podría impugnar esos hechos si probara que incurrió en error de hecho."
  explanation:
    es: "Los hechos conformados solo se impugnan probando error de hecho (art. 140.2). El desconocimiento de la norma no lo es, la conformidad del representante vincula igual que la del obligado y la regla admite esa excepción."
  citation: "art. 140.2 LGT"
  difficulty: 2
  tags:
  - "comprobación limitada"
  - "conformidad"
# anchor: boe-a-2007-15984-art-153
- id: m03-l07-q0184
  prompt:
    es: "¿En cuál de los siguientes supuestos corresponde a la Administración tributaria el control del cumplimiento de la obligación de presentar declaraciones, según el artículo 153.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "Cuando el obligado haya solicitado el aplazamiento de una deuda tributaria distinta y aún pendiente de resolución."
  - id: b
    text:
      es: "Cuando el obligado haya cambiado su domicilio fiscal en el último año."
  - id: c
    correct: true
    text:
      es: "Cuando los obligados resulten obligados a presentarlas de acuerdo con su situación censal."
  - id: d
    text:
      es: "Cuando haya prescrito el derecho de la Administración a liquidar el tributo."
  explanation:
    es: "El primer supuesto del artículo 153.1 es que los obligados lo estén según su situación censal. Una solicitud de aplazamiento, la prescripción del derecho a liquidar y el cambio de domicilio fiscal no figuran entre los cuatro supuestos."
  citation: "art. 153.1 RGAT"
  difficulty: 1
  tags:
  - "control de presentación"
  - "supuestos"
# anchor: boe-a-2007-15984-art-153
- id: m03-l07-q0185
  prompt:
    es: "De acuerdo con el artículo 153.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre el control de la obligación de presentar declaraciones, autoliquidaciones y comunicaciones de datos:"
  options:
  - id: a
    text:
      es: "Corresponde a la Administración solo cuando el propio obligado lo ponga de manifiesto en otra declaración presentada con anterioridad."
  - id: b
    correct: true
    text:
      es: "Corresponde a la Administración cuando se derive de información que obre en su poder procedente de terceras personas."
  - id: c
    text:
      es: "Corresponde a la Administración cuando lo solicite una tercera persona mediante denuncia pública."
  - id: d
    text:
      es: "Corresponde a la Administración solo cuando se tramite un procedimiento de inspección sobre el obligado."
  explanation:
    es: "El artículo 153.1.c) incluye la información de terceras personas que obre en poder de la Administración. No se limita a lo que ponga de manifiesto el propio obligado ni exige una inspección, y la denuncia de un tercero no es un supuesto."
  citation: "art. 153.1 RGAT"
  difficulty: 2
  tags:
  - "control de presentación"
  - "supuestos"
# anchor: boe-a-2007-15984-art-153
- id: m03-l07-q0186
  prompt:
    es: "Según el artículo 153.6 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, el control de presentación de declaraciones termina por la presentación de lo omitido, por la justificación de la no sujeción o exención, por el inicio de una comprobación o investigación o por:"
  options:
  - id: a
    correct: true
    text:
      es: "caducidad, una vez transcurrido el plazo de tres meses sin haberse notificado resolución expresa."
  - id: b
    text:
      es: "caducidad, una vez transcurrido el plazo de dos meses sin haberse notificado resolución expresa."
  - id: c
    text:
      es: "caducidad, una vez transcurrido el plazo de seis meses sin haberse notificado resolución expresa."
  - id: d
    text:
      es: "caducidad, una vez transcurrido el plazo de un año sin haberse notificado resolución expresa."
  explanation:
    es: "La caducidad del control de presentación se produce a los tres meses sin notificar resolución expresa (art. 153.6.d). Seis meses, dos meses y un año no son el plazo de este procedimiento."
  citation: "art. 153.6 RGAT"
  difficulty: 2
  tags:
  - "control de presentación"
  - "caducidad"
# anchor: boe-a-2007-15984-art-153
- id: m03-l07-q0188
  prompt:
    es: "¿Cuál de las siguientes es una forma de terminación del procedimiento de control de presentación de declaraciones, según el artículo 153.6 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "La firma de un acta con acuerdo entre el obligado y la Administración."
  - id: b
    text:
      es: "La liquidación provisional practicada por la Administración tributaria."
  - id: c
    text:
      es: "La resolución en la que se corrijan los defectos advertidos."
  - id: d
    correct: true
    text:
      es: "El inicio de un procedimiento de comprobación o investigación."
  explanation:
    es: "El inicio de un procedimiento de comprobación o investigación termina el control de presentación (art. 153.6.c). La liquidación provisional, la corrección de defectos (verificación de datos) y el acta con acuerdo son formas de terminar otros procedimientos."
  citation: "art. 153.6 RGAT"
  difficulty: 1
  tags:
  - "control de presentación"
  - "terminación"
# anchor: boe-a-2007-15984-art-137
- id: m03-l07-q0191
  prompt:
    es: "Fundación Aurora obtiene el reconocimiento de un beneficio fiscal que queda condicionado a que mantenga durante los próximos años una actividad que todavía no puede comprobarse en el expediente. Según el artículo 137.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿qué carácter tiene el reconocimiento?"
  options:
  - id: a
    text:
      es: "Revocable, aunque produce efectos desde que el obligado lo solicite."
  - id: b
    correct: true
    text:
      es: "Provisional, porque está condicionado al cumplimiento de condiciones futuras o a requisitos no comprobados en el expediente."
  - id: c
    text:
      es: "Definitivo, porque el beneficio ya ha sido concedido por el órgano competente."
  - id: d
    text:
      es: "Condicional, pero sin efectos hasta que se compruebe el requisito de actividad."
  explanation:
    es: "El reconocimiento es provisional cuando depende de condiciones futuras o de requisitos aún no comprobados (art. 137.1). Por eso no es definitivo, y el artículo no habla de un reconocimiento condicional sin efectos ni de uno revocable desde la solicitud."
  citation: "art. 137.1 RGAT"
  difficulty: 2
  tags:
  - "beneficios fiscales"
  - "reconocimiento provisional"
# anchor: boe-a-2007-15984-art-137
- id: m03-l07-q0193
  prompt:
    es: "¿A qué órgano deben comunicar los obligados tributarios cualquier modificación relevante de las condiciones o requisitos para aplicar un beneficio fiscal, según el artículo 137.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "Al órgano de inspección competente por razón del domicilio fiscal del obligado."
  - id: b
    text:
      es: "Al órgano de recaudación que gestione las deudas pendientes del obligado."
  - id: c
    text:
      es: "A la Dirección General de Tributos, como centro directivo competente en la materia."
  - id: d
    correct: true
    text:
      es: "Al órgano que reconoció la procedencia del beneficio fiscal."
  explanation:
    es: "La comunicación se dirige al órgano que reconoció la procedencia del beneficio (art. 137.2). Los órganos de inspección o recaudación y la Dirección General de Tributos no son sus destinatarios."
  citation: "art. 137.2 RGAT"
  difficulty: 1
  tags:
  - "beneficios fiscales"
  - "comunicación"
# anchor: boe-a-2007-15984-art-137
- id: m03-l07-q0195
  prompt:
    es: "Cooperativa Agraria Solana disfruta de un beneficio fiscal y deja de cumplir uno de sus requisitos. La normativa específica del beneficio no dice desde cuándo se pierde el derecho a aplicarlo. Según el artículo 137.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿desde cuándo lo pierde?"
  options:
  - id: a
    text:
      es: "Desde el inicio del periodo impositivo siguiente a aquel en que la cooperativa comunique el incumplimiento."
  - id: b
    correct: true
    text:
      es: "Desde que se produce el incumplimiento, sin necesidad de declaración administrativa previa."
  - id: c
    text:
      es: "Desde que la cooperativa solicite al órgano competente que declare el cese del beneficio."
  - id: d
    text:
      es: "Desde que la Administración notifica a la cooperativa la declaración administrativa del incumplimiento."
  explanation:
    es: "A falta de regla en la normativa específica, el derecho se pierde desde que se produce el incumplimiento, y no hace falta declaración administrativa previa (art. 137.3). No hay que esperar a una declaración de la Administración, a un periodo posterior a la comunicación ni a una solicitud de la cooperativa."
  citation: "art. 137.3 RGAT"
  difficulty: 2
  tags:
  - "beneficios fiscales"
  - "pérdida"
# anchor: boe-a-2007-15984-art-136
- id: m03-l07-q0196
  prompt:
    es: "Conforme al artículo 136.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre la terminación del procedimiento de reconocimiento de beneficios fiscales de carácter rogado:"
  options:
  - id: a
    text:
      es: "Termina por acta con acuerdo en la que se fijen las condiciones de aplicación del beneficio fiscal."
  - id: b
    text:
      es: "Termina por liquidación provisional en la que se regularice la aplicación del beneficio fiscal."
  - id: c
    correct: true
    text:
      es: "Termina por resolución en la que se reconozca o se deniegue la aplicación del beneficio fiscal."
  - id: d
    text:
      es: "Termina por diligencia en la que se haga constar la aportación de los justificantes exigibles."
  explanation:
    es: "El procedimiento termina por resolución que reconoce o deniega la aplicación del beneficio (art. 136.4). La liquidación provisional, el acta con acuerdo y la diligencia son formas de terminar otros procedimientos de aplicación de los tributos."
  citation: "art. 136.4 RGAT"
  difficulty: 2
  tags:
  - "beneficios fiscales"
  - "terminación"
