# anchor: fuente-ms-excel-funcion-sierror-html
- id: m02-l09-q259
  prompt:
    es: "En Excel 365, A3 contiene 55 y B3 contiene 0. ¿Qué muestra =SI.ERROR(A3/B3;\"Error en el cálculo\")?"
  options:
  - id: a
    correct: true
    text:
      es: "Error en el cálculo"
  - id: b
    text:
      es: "55"
  - id: c
    text:
      es: "#¡DIV/0!"
  - id: d
    text:
      es: "Error en el cálculo de la hoja"
  explanation:
    es: "La división entre 0 da un error #¡DIV/0!, y SI.ERROR devuelve el segundo argumento. «#¡DIV/0!»: SI.ERROR sustituye el error por el valor indicado en el segundo argumento. «Error en el cálculo de la hoja»: SI.ERROR devuelve el texto indicado, sin añadir palabras, cuando la fórmula da error. «55»: SI.ERROR devuelve el resultado de la fórmula solo si no hay error."
  citation: "fuente: `ms-excel-funcion-sierror.html`; «Ejemplo»"
  difficulty: 1
  tags:
  - "resultado-fórmula"
