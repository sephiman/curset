# anchor: boe-a-1992-28740-art-115
- id: m03-l19-q0169
  prompt:
    es: "Según el artículo 115.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuándo tienen derecho a solicitar la devolución del saldo a su favor los sujetos pasivos que no hayan podido hacer efectivas las deducciones por el procedimiento del artículo 99?"
  options:
  - id: a
    text:
      es: "Al término de cada período de liquidación, en la autoliquidación correspondiente a ese período."
  - id: b
    correct: true
    text:
      es: "A 31 de diciembre de cada año, en la autoliquidación correspondiente al último período de liquidación de dicho año."
  - id: c
    text:
      es: "A 30 de junio de cada año, en la autoliquidación correspondiente al segundo trimestre de dicho año natural."
  - id: d
    text:
      es: "A 31 de diciembre de cada año, en una solicitud independiente presentada durante el mes de enero."
  explanation:
    es: "El apartado Uno concede la devolución del saldo existente a 31 de diciembre, en la autoliquidación del último período del año. La devolución al término de cada período es la modalidad del artículo 116, y la solicitud independiente de enero o el corte de junio no figuran en el precepto."
  citation: "art. 115.Uno LIVA"
  difficulty: 2
  tags:
  - "devoluciones"
# anchor: boe-a-1992-28740-art-115
- id: m03-l19-q0170
  prompt:
    es: "Conforme al artículo 115.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuándo tienen derecho a solicitar la devolución del saldo a su favor los sujetos pasivos a que se refiere el artículo 116?"
  options:
  - id: a
    correct: true
    text:
      es: "Al término de cada período de liquidación."
  - id: b
    text:
      es: "A 31 de diciembre de cada año natural."
  - id: c
    text:
      es: "Al término de cada trimestre natural del año."
  - id: d
    text:
      es: "Al término del ejercicio económico del sujeto pasivo."
  explanation:
    es: "Los sujetos del artículo 116 pueden pedir la devolución al término de cada período de liquidación, que para ellos es el mes natural. El corte anual del 31 de diciembre es la regla general del apartado Uno, y el trimestre o el cierre del ejercicio económico no figuran."
  citation: "art. 115.Dos LIVA"
  difficulty: 2
  tags:
  - "devoluciones"
# anchor: boe-a-1992-28740-art-115
- id: m03-l19-q0171
  prompt:
    es: "Según el artículo 115.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿desde cuándo se computan los seis meses para practicar la liquidación provisional si la autoliquidación se hubiera presentado fuera de plazo?"
  options:
  - id: a
    correct: true
    text:
      es: "Desde la fecha de su presentación."
  - id: b
    text:
      es: "Desde la fecha en que el sujeto pasivo reciba el requerimiento."
  - id: c
    text:
      es: "Desde el día siguiente a la finalización del plazo de presentación."
  - id: d
    text:
      es: "Desde el último día del período de liquidación al que se refiere."
  explanation:
    es: "Con presentación fuera de plazo, los seis meses se cuentan desde la fecha de presentación. No se cuentan desde el fin del plazo, desde un requerimiento ni desde el último día del período."
  citation: "art. 115.Tres LIVA"
  difficulty: 2
  tags:
  - "devoluciones"
  - "plazos"
# anchor: boe-a-1992-28740-art-115
- id: m03-l19-q0173
  prompt:
    es: "Señale la respuesta CORRECTA sobre la devolución cuando vence el plazo para la liquidación provisional sin que esta se haya dictado, según el artículo 115.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    correct: true
    text:
      es: "La Administración devuelve de oficio el importe total de la cantidad solicitada, sin perjuicio de las liquidaciones provisionales o definitivas ulteriores que procedan."
  - id: b
    text:
      es: "La Administración entiende desestimada la solicitud de devolución, y el sujeto pasivo debe reclamar en vía económico-administrativa."
  - id: c
    text:
      es: "La Administración devuelve de oficio el importe total solicitado, y se pierde la posibilidad de practicar liquidaciones ulteriores."
  - id: d
    text:
      es: "La Administración devuelve de oficio solo el cincuenta por ciento de la cantidad solicitada, hasta que practique la liquidación provisional."
  explanation:
    es: "Si vence el plazo sin liquidación provisional, la Administración devuelve de oficio el total solicitado, sin perder la posibilidad de liquidar después. No hay devolución parcial, ni desestimación presunta, ni renuncia a futuras liquidaciones."
  citation: "art. 115.Tres LIVA"
  difficulty: 2
  tags:
  - "devoluciones"
# anchor: boe-a-1992-28740-art-116
- id: m03-l19-q0175
  prompt:
    es: "De acuerdo con el artículo 116.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿con qué coincide el período de liquidación de los sujetos pasivos que opten por solicitar la devolución al término de cada período de liquidación?"
  options:
  - id: a
    text:
      es: "El trimestre natural, con independencia de su volumen de operaciones."
  - id: b
    text:
      es: "El año natural, con independencia de su volumen de operaciones."
  - id: c
    correct: true
    text:
      es: "El mes natural, con independencia de su volumen de operaciones."
  - id: d
    text:
      es: "El mes natural, solo si su volumen de operaciones supera el límite del artículo 121."
  explanation:
    es: "Quien opta por la devolución mensual liquida por meses naturales, sea cual sea su volumen. El trimestre y el año natural no son su período, y no hay límite de volumen que condicione la regla."
  citation: "art. 116.Uno LIVA"
  difficulty: 1
  tags:
  - "devoluciones"
# anchor: boe-a-1992-28740-art-117
- id: m03-l19-q0176
  prompt:
    es: "Según el artículo 117.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, en el régimen de viajeros del artículo 21, número 2.º, la devolución de las cuotas soportadas en las adquisiciones de bienes se ajusta a:"
  options:
  - id: a
    text:
      es: "los requisitos y el procedimiento de la devolución de ingresos indebidos."
  - id: b
    correct: true
    text:
      es: "los requisitos y procedimiento que se establezcan reglamentariamente."
  - id: c
    text:
      es: "el procedimiento general de devolución a sujetos pasivos del artículo 115."
  - id: d
    text:
      es: "la autorización previa del titular de la Delegación de la Agencia Tributaria."
  explanation:
    es: "La devolución del régimen de viajeros se regula por los requisitos y el procedimiento reglamentarios. No se somete a la devolución de ingresos indebidos, al procedimiento general del artículo 115 ni a una autorización previa."
  citation: "art. 117.Uno LIVA"
  difficulty: 1
  tags:
  - "devoluciones"
# anchor: boe-a-1992-28740-art-118
- id: m03-l19-q0177
  prompt:
    es: "De acuerdo con el artículo 118 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué puede exigir la Administración tributaria de los sujetos pasivos en los supuestos de devolución regulados en el capítulo II del título VIII?"
  options:
  - id: a
    text:
      es: "El depósito del cincuenta por ciento de la cantidad devuelta."
  - id: b
    text:
      es: "La presentación de una declaración informativa adicional."
  - id: c
    text:
      es: "El pago previo del importe de la cuota solicitada."
  - id: d
    correct: true
    text:
      es: "La prestación de garantías suficientes."
  explanation:
    es: "El artículo 118 faculta a la Administración a exigir garantías suficientes. No prevé una declaración informativa adicional, un pago previo de la cuota ni un depósito del cincuenta por ciento."
  citation: "art. 118 LIVA"
  difficulty: 1
  tags:
  - "devoluciones"
# anchor: boe-a-1992-28740-art-119
- id: m03-l19-q0231
  prompt:
    es: "¿Qué contempla el artículo 119.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido para los empresarios o profesionales no establecidos en el territorio de aplicación del impuesto pero establecidos en la Comunidad, Islas Canarias, Ceuta o Melilla?"
  options:
  - id: a
    text:
      es: "Un régimen especial de tributación simplificada de las operaciones que realicen en ese territorio."
  - id: b
    correct: true
    text:
      es: "Un régimen especial de devoluciones de las cuotas soportadas en el territorio de aplicación."
  - id: c
    text:
      es: "Un régimen especial de deducción mediante prorrata especial de las cuotas que repercutan."
  - id: d
    text:
      es: "Un régimen especial de exención de las operaciones que realicen en el territorio de aplicación."
  explanation:
    es: "Estos empresarios tienen un régimen especial de devoluciones: pueden solicitar la devolución de las cuotas del impuesto soportadas por adquisiciones o importaciones realizadas en el territorio de aplicación (art. 119.Uno). El artículo no establece una exención de sus operaciones ni una tributación simplificada. Y la prorrata especial es una regla de deducción para quienes realizan operaciones que originan y que no originan el derecho a deducir (art. 103.Dos), no el régimen de este artículo."
  citation: "art. 119.Uno LIVA"
  difficulty: 2
  tags:
  - "devoluciones"
  - "no establecidos"
