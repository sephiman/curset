  - id: b
    correct: true
    text:
      es: "Devuelve el número de filas de una referencia"
  - id: c
    text:
      es: "Cuenta cuántos números hay en la lista de argumentos"
  - id: d
    text:
      es: "Devuelve el número de la hoja a la que se hace referencia"
  explanation:
    es: "FILAS devuelve el número de filas de una referencia. Devolver la cantidad de hojas es HOJAS, contar números es CONTAR y devolver el número de la hoja a la que se hace referencia es HOJA."
