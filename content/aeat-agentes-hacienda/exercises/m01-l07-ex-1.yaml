# anchor: boe-a-2015-11719-art-8
- id: m01-l07-q0193
  prompt:
    es: "Según el artículo 8.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, los empleados públicos se clasifican en:"
  options:
  - id: a
    text:
      es: "Funcionarios de carrera, funcionarios interinos, personal laboral y personal directivo."
  - id: b
    text:
      es: "Funcionarios de carrera, funcionarios en prácticas, personal laboral y personal eventual."
  - id: c
    text:
      es: "Funcionarios de carrera, personal laboral, personal eventual y personal directivo profesional."
  - id: d
    correct: true
    text:
      es: "Funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual."
  explanation:
    es: "El artículo 8.2 enumera cuatro clases: funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual. El personal directivo no es una clase de esa lista; el Estatuto lo regula aparte, en su artículo 13. Los funcionarios en prácticas tampoco figuran en la lista del artículo 8.2. La lista que suprime a los interinos y añade el personal directivo profesional altera dos elementos."
  citation: "art. 8.2 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-2023-25758-art-108
- id: m01-l07-q0304
  prompt:
    es: "Según el artículo 108.3 del Real Decreto-ley 6/2023, de 19 de diciembre, la oferta de empleo público incluirá para promoción interna un porcentaje no inferior al treinta por ciento:"
  options:
  - id: a
    text:
      es: "De las vacantes de cada cuerpo o escala que se convoque"
  - id: b
    correct: true
    text:
      es: "De las plazas de acceso libre"
  - id: c
    text:
      es: "Del total de plazas de la oferta, incluidas las de promoción"
  - id: d
    text:
      es: "De las plazas reservadas a personas con discapacidad"
  explanation:
    es: "El artículo 108.3 fija el porcentaje sobre «las plazas de acceso libre». No se calcula sobre el total de la oferta ni sobre las vacantes de cada cuerpo o escala. Las plazas reservadas a personas con discapacidad son otra reserva, la del artículo 108.4."
  citation: "art. 108.3 RDL 6/2023"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-59
- id: m01-l07-q0310
  prompt:
    es: "Según el artículo 59.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, en las ofertas de empleo público se reservará para personas con discapacidad un cupo:"
  options:
  - id: a
    text:
      es: "No inferior al quince por ciento de las vacantes"
  - id: b
    text:
      es: "No inferior al siete por ciento de los efectivos totales"
  - id: c
    text:
      es: "No superior al siete por ciento de las vacantes"
  - id: d
    correct: true
    text:
      es: "No inferior al siete por ciento de las vacantes"
  explanation:
    es: "El artículo 59.1 reserva «un cupo no inferior al siete por ciento de las vacantes». El quince por ciento no está en el artículo. El siete por ciento es un mínimo, no un máximo. El cupo se calcula sobre las vacantes; los efectivos totales son la base del objetivo progresivo del dos por ciento."
  citation: "art. 59.1 TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2013-12632-art-4
- id: m01-l07-q0314
  prompt:
    es: "Según el artículo 4.2 del texto refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, son personas con discapacidad, entre otras, aquellas con un grado de discapacidad reconocido:"
  options:
  - id: a
    text:
      es: "Igual o superior al 30 por ciento"
  - id: b
    text:
      es: "Igual o superior al 20 por ciento"
  - id: c
    text:
      es: "Igual o superior al 25 por ciento"
  - id: d
    correct: true
    text:
      es: "Igual o superior al 33 por ciento"
  explanation:
    es: "El artículo 4.2 da la consideración de personas con discapacidad a aquellas a quienes se haya reconocido «un grado de discapacidad igual o superior al 33 por ciento». El 20, el 25 y el 30 por ciento no son ese umbral: con un grado del 25 o del 30 por ciento no se alcanza."
  citation: "art. 4.2 RDL 1/2013"
  difficulty: 2
  tags:
  - "cantidad"
  - "concepto"
# anchor: boe-a-2023-25758-art-113
- id: m01-l07-q0316
  prompt:
    es: "De acuerdo con el artículo 113.3 del Real Decreto-ley 6/2023, de 19 de diciembre, el acceso por pruebas específicas a las plazas reservadas a personas con discapacidad intelectual exige tener reconocido un grado de discapacidad:"
  options:
  - id: a
    correct: true
    text:
      es: "Igual o superior al treinta y tres por cien"
  - id: b
    text:
      es: "Igual o superior al cincuenta por cien"
  - id: c
    text:
      es: "Igual o superior al sesenta y cinco por cien"
  - id: d
    text:
      es: "Igual o superior al cuarenta y cinco por cien"
  explanation:
    es: "El artículo 113.3 se aplica a las personas con discapacidad intelectual «siempre que éstas tengan reconocido un grado de discapacidad igual o superior al treinta y tres por cien». El cuarenta y cinco, el cincuenta y el sesenta y cinco por cien endurecen ese umbral, que el artículo fija en el treinta y tres."
  citation: "art. 113.3 RDL 6/2023"
  difficulty: 3
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-2015-11719-art-48
- id: m01-l07-q0430
  prompt:
    es: "Señale la respuesta CORRECTA sobre el permiso por accidente o enfermedad graves de un familiar dentro del segundo grado de consanguinidad o afinidad, de acuerdo con el artículo 48.a) del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    correct: true
    text:
      es: "El permiso por accidente o enfermedad graves, hospitalización o intervención quirúrgica sin hospitalización que precise reposo domiciliario será de cuatro días hábiles."
  - id: b
    text:
      es: "El permiso por accidente o enfermedad graves, hospitalización o intervención quirúrgica sin hospitalización que precise reposo domiciliario será de tres días hábiles."
  - id: c
    text:
      es: "El permiso por accidente o enfermedad graves, hospitalización o intervención quirúrgica sin hospitalización que precise reposo domiciliario será de dos días hábiles."
  - id: d
    text:
      es: "El permiso por accidente o enfermedad graves, hospitalización o intervención quirúrgica sin hospitalización que precise reposo domiciliario será de seis días naturales."
  explanation:
    es: "Para un familiar dentro del segundo grado de consanguinidad o afinidad, el artículo 48.a) concede cuatro días hábiles, sin distinguir si el suceso ocurre en la misma localidad. Tres días hábiles es la duración por el fallecimiento de un familiar de primer grado en la misma localidad, dos días hábiles la del fallecimiento de un familiar de segundo grado en la misma localidad, y el permiso se cuenta en días hábiles, no naturales."
  citation: "art. 48 TREBEP"
  difficulty: 3
  tags:
  - "permisos"
# anchor: boe-a-2015-11719-art-48
- id: m01-l07-q0431
  prompt:
    es: "Fallece una hermana de un funcionario, familiar dentro del segundo grado de consanguinidad, y el suceso se produce en una localidad distinta de aquella en la que reside el funcionario. Según el artículo 48.a) del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿de qué permiso dispone por el fallecimiento?"
  options:
  - id: a
    text:
      es: "De dos días hábiles, porque el suceso se produce en distinta localidad."
  - id: b
    text:
      es: "De cinco días hábiles, porque se trata de un familiar de segundo grado."
  - id: c
    text:
      es: "De tres días hábiles, porque el suceso se produce en distinta localidad."
  - id: d
    correct: true
    text:
      es: "De cuatro días hábiles, porque el suceso se produce en distinta localidad."
  explanation:
    es: "Para el fallecimiento de un familiar de segundo grado, el artículo 48.a) concede dos días hábiles si el suceso ocurre en la misma localidad y cuatro si es en distinta. Dos y tres días no corresponden a la distinta localidad, y cinco días hábiles es la duración del fallecimiento de un familiar de primer grado en distinta localidad."
  citation: "art. 48 TREBEP"
  difficulty: 2
  tags:
  - "permisos"
# anchor: boe-a-2015-11719-art-48
- id: m01-l07-q0432
  prompt:
    es: "Señale la respuesta CORRECTA sobre el permiso por matrimonio o por registro o constitución formalizada por documento público de pareja de hecho, de acuerdo con el artículo 48.l) del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    text:
      es: "El permiso es de diez días hábiles."
  - id: b
    text:
      es: "El permiso es de veinte días naturales."
  - id: c
    correct: true
    text:
      es: "El permiso es de quince días."
  - id: d
    text:
      es: "El permiso es de una semana natural."
  explanation:
    es: "El artículo 48.l) concede quince días por matrimonio o por registro o constitución formalizada por documento público de pareja de hecho. Diez días hábiles, veinte naturales y una semana no son la duración que prevé."
  citation: "art. 48 TREBEP"
  difficulty: 1
  tags:
  - "permisos"
# anchor: boe-a-2015-11719-art-30
- id: m01-l07-q0434
  prompt:
    es: "Señale la respuesta CORRECTA sobre las retribuciones de quienes ejercitan el derecho de huelga, de acuerdo con el artículo 30.2 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    text:
      es: "No devengan ni perciben las retribuciones del tiempo en huelga, y la deducción de haberes tiene carácter de sanción disciplinaria."
  - id: b
    text:
      es: "No devengan ni perciben las retribuciones del tiempo en huelga, y la deducción de haberes afecta al régimen de sus prestaciones sociales."
  - id: c
    correct: true
    text:
      es: "No devengan ni perciben las retribuciones del tiempo en huelga, y la deducción de haberes no tiene carácter de sanción ni afecta al régimen de sus prestaciones sociales."
  - id: d
    text:
      es: "Devengan las retribuciones íntegras del tiempo en huelga, pero la Administración puede deducirlas como medida cautelar."
  explanation:
    es: "Según el artículo 30.2, quienes ejercen el derecho de huelga no devengan ni perciben las retribuciones del tiempo en que permanezcan en esa situación, sin que la deducción tenga carácter de sanción ni afecte a las prestaciones sociales. El artículo 30.1 reitera que la deducción proporcional de haberes no es sancionadora, y no hay retribución íntegra con deducción cautelar."
  citation: "art. 30 TREBEP"
  difficulty: 2
  tags:
  - "huelga"
  - "retribuciones"
# anchor: boe-a-1995-8729-art-76
- id: m01-l07-q0356
  prompt:
    es: "Según el artículo 76 del Real Decreto 364/1995, de 10 de marzo, ¿dónde debe tenerse la antigüedad mínima de dos años exigida para participar en pruebas de promoción interna?"
  options:
  - id: a
    text:
      es: "En el puesto de trabajo que desempeñe el funcionario."
  - id: b
    correct: true
    text:
      es: "En el Cuerpo o Escala a que pertenezca el funcionario."
  - id: c
    text:
      es: "En el Departamento que convoca las pruebas selectivas."
  - id: d
    text:
      es: "En cualquier Cuerpo de la Administración General del Estado."
  explanation:
    es: "El artículo 76 exige «una antigüedad de, al menos, dos años en el Cuerpo o Escala a que pertenezcan». La antigüedad se mide en el Cuerpo o Escala propio, no en el puesto, en el Departamento convocante ni en cualquier Cuerpo de la Administración."
  citation: "art. 76 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-89
- id: m01-l07-q0423
  prompt:
    es: "Señale la respuesta CORRECTA sobre los efectos de la excedencia voluntaria por interés particular, de acuerdo con el artículo 89.2 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    correct: true
    text:
      es: "Quienes se encuentren en esa situación no devengarán retribuciones, ni les será computable el tiempo a efectos de ascensos, trienios y derechos en el régimen de Seguridad Social."
  - id: b
    text:
      es: "Quienes se encuentren en esa situación no devengarán retribuciones, pero el tiempo les será computable a efectos de trienios."
  - id: c
    text:
      es: "Quienes se encuentren en esa situación devengarán las retribuciones básicas, pero el tiempo no les será computable a efectos de ascensos."
  - id: d
    text:
      es: "Quienes se encuentren en esa situación no devengarán retribuciones, pero el tiempo les será computable a efectos de derechos en el régimen de Seguridad Social."
  explanation:
    es: "En la excedencia por interés particular no se devengan retribuciones y el tiempo no computa a efectos de ascensos, trienios ni derechos en el régimen de Seguridad Social (art. 89.2). Los distractores mantienen el cómputo de trienios o de Seguridad Social o conservan las retribuciones básicas, y la excedencia por cuidado de familiares es la que sí computa esos conceptos (art. 89.4)."
  citation: "art. 89 TREBEP"
  difficulty: 2
  tags:
  - "excedencia voluntaria"
  - "efectos"
# anchor: boe-a-2015-11719-art-89
- id: m01-l07-q0426
  prompt:
    es: "Señale la respuesta CORRECTA sobre la reserva del puesto de trabajo en la excedencia por cuidado de familiares, de acuerdo con el artículo 89.4 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    text:
      es: "El puesto se reservará durante tres años y, transcurrido ese periodo, se reservará un puesto del mismo cuerpo o escala y de igual grupo de clasificación y nivel de complemento de destino."
  - id: b
    text:
      es: "El puesto se reservará durante un año y, transcurrido ese periodo, se reservará un puesto en la misma localidad y de igual retribución."
  - id: c
    correct: true
    text:
      es: "El puesto se reservará, al menos, durante dos años y, transcurrido ese periodo, se reservará un puesto en la misma localidad y de igual retribución."
  - id: d
    text:
      es: "El puesto se reservará mientras dure la excedencia, sin que exista límite temporal ni cambio en la reserva."
  explanation:
    es: "El artículo 89.4 reserva el puesto, al menos, durante dos años, y después reserva un puesto en la misma localidad y de igual retribución. No son tres años ni un año, y la reserva posterior no se refiere al cuerpo o escala sino a la localidad y la retribución, ni es indefinida."
  citation: "art. 89 TREBEP"
  difficulty: 2
  tags:
  - "excedencia por cuidado de familiares"
  - "reserva de puesto"
# anchor: boe-a-2015-11719-art-89
- id: m01-l07-q0427
  prompt:
    es: "¿Desde cuándo se cuenta la duración máxima de tres años de la excedencia para atender al cuidado de cada hijo por naturaleza, según el artículo 89.4 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "Desde la fecha en que la Administración resuelve la solicitud de excedencia."
  - id: b
    text:
      es: "Desde la fecha de incorporación al puesto tras el permiso por nacimiento."
  - id: c
    text:
      es: "Desde la fecha en que el hijo cumple su primer año de vida."
  - id: d
    correct: true
    text:
      es: "Desde la fecha de nacimiento del hijo."
  explanation:
    es: "La excedencia de duración no superior a tres años por cada hijo se cuenta a partir de la fecha de nacimiento o, en su caso, de la resolución judicial o administrativa en adopción, guarda con fines de adopción o acogimiento permanente (art. 89.4). Ni la resolución de la solicitud, ni la reincorporación tras el permiso, ni el primer cumpleaños del hijo son el punto de partida."
  citation: "art. 89 TREBEP"
  difficulty: 1
  tags:
  - "excedencia por cuidado de familiares"
  - "duración"
# anchor: boe-a-2015-11719-art-89
- id: m01-l07-q0428
  prompt:
    es: "Señale la respuesta CORRECTA sobre la excedencia de las funcionarias víctimas de violencia de género o de violencia sexual, de acuerdo con el artículo 89.5 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público:"
  options:
  - id: a
    correct: true
    text:
      es: "Durante los seis primeros meses se reserva el puesto, y cuando las actuaciones judiciales lo exijan el periodo se puede prorrogar por tres meses, con un máximo de dieciocho."
  - id: b
    text:
      es: "Durante los seis primeros meses se reserva el puesto, y cuando las actuaciones judiciales lo exijan el periodo se puede prorrogar por seis meses, con un máximo de dieciocho."
  - id: c
    text:
      es: "Durante los seis primeros meses se reserva el puesto, y cuando las actuaciones judiciales lo exijan el periodo se puede prorrogar por tres meses, con un máximo de doce."
  - id: d
    text:
      es: "Durante los dos primeros años se reserva el puesto, y cuando las actuaciones judiciales lo exijan el periodo se puede prorrogar por tres meses, con un máximo de dieciocho."
  explanation:
    es: "El artículo 89.5 reserva el puesto durante los seis primeros meses y permite prorrogar el periodo por tres meses cuando las actuaciones judiciales lo exijan, con un máximo de dieciocho. Los distractores cambian el tiempo de cada prórroga, el máximo total o el periodo inicial de reserva."
  citation: "art. 89 TREBEP"
  difficulty: 3
  tags:
  - "excedencia por violencia de género"
