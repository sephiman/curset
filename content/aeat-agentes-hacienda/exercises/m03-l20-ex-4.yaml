  - "deudor"
# anchor: celex-32013r0952-art-79
- id: m03-l20-q0061
  prompt:
    es: "De acuerdo con el artículo 79, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre las circunstancias de las que nace una deuda aduanera de importación por incumplimiento:"
  options:
  - id: a
    text:
      es: "El incumplimiento de una obligación relativa a la circulación de mercancías de la Unión dentro de un mismo Estado miembro."
  - id: b
    correct: true
    text:
      es: "El incumplimiento de una obligación relativa a la circulación, transformación o depósito de mercancías no pertenecientes a la Unión en el territorio aduanero."
  - id: c
    text:
      es: "El retraso del declarante en el pago voluntario de una deuda aduanera que ya hubiera nacido anteriormente."
  - id: d
    text:
      es: "El incumplimiento de una obligación relativa a la exportación de mercancías de la Unión sujetas a derechos de exportación."
  explanation:
    es: "El artículo 79.1.a) incluye el incumplimiento de obligaciones relativas a la circulación, transformación, depósito, depósito temporal, importación temporal o disposición de mercancías no pertenecientes a la Unión en el territorio aduanero. Las mercancías de la Unión que circulan dentro de un Estado miembro no están entre ellas. El retraso en el pago de una deuda ya nacida no es la causa de su nacimiento. Y el incumplimiento relativo a la exportación origina la deuda de exportación del artículo 82."
  citation: "art. 79.1 CAU"
  difficulty: 2
  tags:
  - "deuda de importación"
  - "incumplimiento"
# anchor: celex-32013r0952-art-79
- id: m03-l20-q0064
  prompt:
    es: "El 12 de noviembre de 2026 se admite una declaración en aduana para despachar a libre práctica unas mercancías con una reducción del tipo de los derechos de importación por su destino final. El 3 de febrero de 2027 la aduana comprueba que no se cumplía una de las condiciones de esa reducción. Según el artículo 79, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cuándo nació la deuda aduanera?"
  options:
  - id: a
    text:
      es: "El 3 de febrero de 2027, cuando se comprobó el incumplimiento de la condición."
  - id: b
    text:
      es: "En la fecha en que se concedió el levante de las mercancías, posterior al 12 de noviembre de 2026."
  - id: c
    text:
      es: "El 1 de enero de 2027, al comenzar el ejercicio siguiente a la admisión de la declaración."
  - id: d
    correct: true
    text:
      es: "El 12 de noviembre de 2026, cuando se admitió la declaración en aduana."
  explanation:
    es: "Cuando se comprueba después que no se cumplía una condición, la deuda nace en el momento en que se admitió la declaración en aduana: el 12 de noviembre de 2026. No nace el 3 de febrero de 2027, que es la fecha de la comprobación. Tampoco con el levante, ni con el comienzo de un ejercicio, que no son hechos que el artículo tome como momento."
  citation: "art. 79.2 CAU"
  difficulty: 3
  tags:
  - "deuda de importación"
  - "incumplimiento"
  - "momento"
  - "cómputo"
# anchor: celex-32013r0952-art-79
- id: m03-l20-q0065
  prompt:
    es: "De acuerdo con el artículo 79, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, en los casos de las letras a) y b) del apartado 1, el deudor será, entre otros, toda persona que:"
  options:
  - id: a
    text:
      es: "Hubiera adquirido o poseído las mercancías, con independencia de lo que supiera o debiera haber sabido al adquirirlas o recibirlas."
  - id: b
    text:
      es: "Hubiera transportado las mercancías por cuenta del comprador, aunque no supiera ni debiera haber sabido que se incumplió una obligación aduanera sobre ellas antes de transportarlas."
  - id: c
    correct: true
    text:
      es: "Hubiera adquirido o poseído las mercancías y supiera o debiera razonablemente haber sabido, al adquirirlas o recibirlas, que no se había cumplido una obligación."
  - id: d
    text:
      es: "Hubiera presentado la declaración en aduana de despacho a libre práctica, aunque no se le hubiera exigido ninguna de las obligaciones."
  explanation:
    es: "Es deudor quien adquirió o poseyó las mercancías y supo, o debió razonablemente haber sabido al adquirirlas o recibirlas, que no se había cumplido una obligación. Sin ese conocimiento real o exigible no se es deudor por adquirir o poseer. Transportar por cuenta del comprador sin conocimiento tampoco convierte en deudor. Y el declarante de una declaración de despacho a libre práctica es deudor por el artículo 77, no por este."
  citation: "art. 79.3 CAU"
  difficulty: 3
  tags:
  - "deuda de importación"
  - "incumplimiento"
  - "deudor"
# anchor: celex-32013r0952-art-79
- id: m03-l20-q0066
  prompt:
    es: "Conforme al artículo 79, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿es deudora quien adquiere mercancías no pertenecientes a la Unión y, al adquirirlas, debía razonablemente haber sabido que se incumplió una obligación aduanera?"
  options:
  - id: a
    text:
      es: "No, porque solo es deudora la persona a la que se hubiera exigido el cumplimiento de la obligación incumplida."
  - id: b
    text:
      es: "No, porque quien adquiere las mercancías solo responde si las ha poseído durante más de noventa días."
  - id: c
    text:
      es: "Sí, pero solo si además actuó por cuenta de la persona que estaba obligada a cumplir la obligación."
  - id: d
    correct: true
    text:
      es: "Sí, porque adquirió las mercancías y debía razonablemente haber sabido, en el momento de adquirirlas, que se había incumplido una obligación."
  explanation:
    es: "Quien adquiere las mercancías y debía razonablemente haber sabido en ese momento que se incumplió una obligación es deudor. No hace falta que se le hubiera exigido el cumplimiento, porque esa es otra categoría de deudor. No existe un plazo de posesión de noventa días. Y actuar por cuenta del obligado es otro supuesto distinto, no un requisito añadido."
  citation: "art. 79.3 CAU"
  difficulty: 2
  tags:
  - "deuda de importación"
  - "incumplimiento"
  - "deudor"
# anchor: celex-32013r0952-art-79
- id: m03-l20-q0067
  prompt:
    es: "De acuerdo con el artículo 79, apartado 4, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, en los casos de la letra c) del apartado 1, el deudor será la persona que deba cumplir:"
  options:
  - id: a
    text:
      es: "Las obligaciones relativas a la introducción de las mercancías en el territorio aduanero de la Unión y a su circulación."
  - id: b
    text:
      es: "Únicamente la declaración de reexportación relativa a los productos fabricados con mercancías no originarias."
  - id: c
    text:
      es: "Las condiciones con arreglo a las cuales se permitió la salida de las mercancías con exención de derechos de exportación."
  - id: d
    correct: true
    text:
      es: "Las condiciones que regulan la inclusión de las mercancías en un régimen aduanero o la concesión de una exención o reducción de derechos por su destino final."
  explanation:
    es: "En los casos de la letra c) es deudor quien debe cumplir las condiciones que regulan la inclusión en el régimen o la concesión de la exención o reducción por destino final. Las obligaciones de introducción y circulación son las de la letra a). La declaración de reexportación es el supuesto del artículo 78. Y las condiciones de salida con exención de derechos de exportación pertenecen a la deuda de exportación."
  citation: "art. 79.4 CAU"
  difficulty: 2
  tags:
  - "deuda de importación"
  - "incumplimiento"
  - "deudor"
# anchor: celex-32013r0952-art-80
- id: m03-l20-q0068
  prompt:
    es: "De acuerdo con el artículo 80, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, si nace una deuda sobre mercancías despachadas a libre práctica con tipo reducido por su destino final, el importe pagado al despacharlas se:"
  options:
  - id: a
    text:
      es: "Devuelve al deudor antes de exigirle el importe de los derechos de importación de la deuda nacida."
  - id: b
    text:
      es: "Suma al importe de los derechos de importación correspondiente a la deuda aduanera nacida."
  - id: c
    correct: true
    text:
      es: "Deduce del importe de los derechos de importación correspondiente a la deuda aduanera."
  - id: d
    text:
      es: "Mantiene al margen de la deuda, que se calcula sobre el total de los derechos sin tipo reducido."
  explanation:
    es: "Los derechos ya pagados al despachar las mercancías con tipo reducido se deducen del importe de los derechos de la deuda nacida. No se devuelven antes de reclamar la deuda, no se suman a ella y no quedan fuera del cálculo."
  citation: "art. 80.1 CAU"
  difficulty: 1
  tags:
  - "deuda de importación"
  - "deducción"
# anchor: celex-32013r0952-art-80
- id: m03-l20-q0069
  prompt:
    es: "Unas mercancías se despacharon a libre práctica con tipo reducido por su destino final y se pagaron 3 000 euros de derechos de importación. Tras incumplirse el destino final nace una deuda aduanera cuyos derechos, sin reducción, ascienden a 8 000 euros. Conforme al artículo 80, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cuánto queda por pagar?"
  options:
  - id: a
    text:
      es: "8 000 euros: se exige el importe total de la deuda sin descontar lo ya pagado."
  - id: b
    correct: true
    text:
      es: "5 000 euros: se deducen del importe de la deuda los derechos ya pagados al despachar las mercancías."
  - id: c
    text:
      es: "11 000 euros: se suman los derechos ya pagados al importe de la deuda nacida."
  - id: d
    text:
      es: "3 000 euros: la deuda se limita al importe que ya se había pagado con el tipo reducido."
  explanation:
    es: "Del importe de la deuda, 8 000 euros, se deducen los 3 000 euros pagados al despachar las mercancías: quedan 5 000 euros. Exigir 8 000 euros ignora la deducción. Sumar los 3 000 daría 11 000 euros, lo contrario de deducir. Y limitar la deuda a 3 000 euros la dejaría en lo ya pagado, cuando la deuda es de 8 000 euros."
  citation: "art. 80.1 CAU"
  difficulty: 3
  tags:
  - "deuda de importación"
  - "deducción"
  - "cómputo"
# anchor: celex-32013r0952-art-80
- id: m03-l20-q0070
  prompt:
    es: "De acuerdo con el artículo 80, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre la deuda aduanera nacida respecto de mercancías en importación temporal con exención parcial:"
  options:
  - id: a
    correct: true
    text:
      es: "El importe de los derechos pagados con arreglo a la exención parcial se deduce del importe de los derechos correspondiente a la deuda aduanera."
  - id: b
    text:
      es: "Los derechos pagados con arreglo a la exención parcial no se deducen, porque la importación temporal queda anulada desde su inicio y con efectos retroactivos."
  - id: c
    text:
      es: "Los derechos pagados con arreglo a la exención parcial solo se deducen si las mercancías se reexportaron antes de vencer el plazo."
  - id: d
    text:
      es: "Los derechos pagados con arreglo a la exención parcial se deducen del importe de los derechos de exportación de la deuda."
  explanation:
    es: "Lo pagado con arreglo a la exención parcial se deduce del importe de los derechos de importación de la deuda. El artículo no anula la importación temporal ni condiciona la deducción a una reexportación. Y la deducción se hace sobre los derechos de importación, no sobre los de exportación."
  citation: "art. 80.2 CAU"
  difficulty: 2
  tags:
  - "deuda de importación"
  - "deducción"
# anchor: celex-32013r0952-art-79
- id: m03-l20-q0130
  prompt:
    es: "De acuerdo con el artículo 79, apartado 1, letra b), del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cuál de las siguientes obligaciones, si se incumple, hace nacer una deuda aduanera de importación?"
  options:
  - id: a
    text:
      es: "Una obligación relativa a la salida de las mercancías del territorio aduanero de la Unión."
  - id: b
    text:
      es: "Una obligación relativa al pago de los tributos interiores devengados en el Estado miembro."
  - id: c
    text:
      es: "Una obligación relativa a la presentación de la declaración sumaria de salida de las mercancías en la aduana."
  - id: d
    correct: true
    text:
      es: "Una obligación relativa al destino final de las mercancías dentro del territorio aduanero de la Unión."
  explanation:
    es: "El incumplimiento de las obligaciones relativas al destino final de las mercancías dentro del territorio aduanero de la Unión hace nacer la deuda de importación. Las obligaciones de salida corresponden a la deuda de exportación. Los tributos interiores y la declaración sumaria de salida no figuran entre las circunstancias del artículo."
  citation: "art. 79.1 CAU"
  difficulty: 2
  tags:
  - "deuda de importación"
  - "incumplimiento"
