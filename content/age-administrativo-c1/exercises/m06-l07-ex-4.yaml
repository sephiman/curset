# anchor: fuente-ms-outlook-atajos-html
- id: m06-l07-q069
  prompt:
    es: "Según la ayuda de Microsoft, ¿cómo se sabe si en Windows se está usando el nuevo Outlook o Outlook clásico?"
  options:
  - id: a
    text:
      es: "Si aparece la pestaña Archivo en la cinta de opciones, es el nuevo Outlook."
  - id: b
    text:
      es: "Si aparece Configuración en la cinta de opciones, es Outlook clásico."
  - id: c
    text:
      es: "Si aparece la pestaña Enviar y recibir en la cinta, es el nuevo Outlook."
  - id: d
    correct: true
    text:
      es: "Si aparece Configuración en la cinta de opciones, es el nuevo Outlook."
  explanation:
    es: "La página dice que se busque Configuración en la cinta: si no aparece, se siguen los pasos de Outlook clásico, y si aparece, los del nuevo Outlook. La opción que atribuye Configuración a Outlook clásico invierte la regla. Archivo y Enviar y recibir no indican el nuevo Outlook: la tabla de la cinta de Outlook clásico, en la misma página, abre el menú Archivo con Alt+F y la pestaña Enviar y recibir con Alt+J, S."
  citation: "fuente: `ms-outlook-atajos.html`; «Métodos abreviados de teclado para Outlook»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-atajos-html
- id: m06-l07-q070
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de los siguientes métodos abreviados de teclado va a People?"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl+4"
  - id: b
    text:
      es: "Ctrl+1"
  - id: c
    text:
      es: "Ctrl+3"
  - id: d
    text:
      es: "Ctrl+2"
  explanation:
    es: "La tabla de Contactos del nuevo Outlook asigna Ctrl+4 a ir a People. Ctrl+1 va a Mail, Ctrl+2 a Calendario y Ctrl+3 a Copilot."
  citation: "fuente: `ms-outlook-atajos.html`; «Métodos abreviados de teclado de Contactos (Personas)»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-atajos-html
- id: m06-l07-q071
  prompt:
    es: "En Outlook clásico, según la tabla de navegación básica de la ayuda de Microsoft, ¿a qué vista cambia el método abreviado Ctrl+2?"
  options:
  - id: a
    text:
      es: "A la vista Correo."
  - id: b
    text:
      es: "A la vista Copilot."
  - id: c
    correct: true
    text:
      es: "A la vista Calendario."
  - id: d
    text:
      es: "A la vista People."
  explanation:
    es: "La tabla de navegación básica de Outlook clásico asigna Ctrl+2 a cambiar a la vista Calendario. Ctrl+1 cambia a Correo, Ctrl+3 a Copilot y Ctrl+4 a People."
  citation: "fuente: `ms-outlook-atajos.html`; «Accesos directos para la navegación básica»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-atajos-html
- id: m06-l07-q072
  prompt:
    es: "En Outlook clásico, según la tabla de navegación básica de la ayuda de Microsoft, ¿cuál de los siguientes métodos abreviados abre Tareas?"
  options:
  - id: a
    text:
      es: "Ctrl+5"
  - id: b
    correct: true
    text:
      es: "Ctrl+8"
  - id: c
    text:
      es: "Ctrl+6"
  - id: d
    text:
      es: "Ctrl+3"
  explanation:
    es: "La tabla de navegación básica asigna Ctrl+8 a abrir Tareas. Ctrl+5 cambia a To Do, Ctrl+3 a la vista Copilot y Ctrl+6 al panel del Explorador de la organización. La página avisa de que estas teclas numéricas pueden cambiar con la configuración de la aplicación."
  citation: "fuente: `ms-outlook-atajos.html`; «Accesos directos para la navegación básica»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-atajos-html
- id: m06-l07-q073
  prompt:
    es: "En Outlook clásico, según la tabla de navegación básica de la ayuda de Microsoft, ¿qué hace el método abreviado Ctrl+Y?"
  options:
  - id: a
    text:
      es: "Abrir la Libreta de direcciones."
  - id: b
    text:
      es: "Cambiar a la vista People."
  - id: c
    text:
      es: "Ir al cuadro de búsqueda."
  - id: d
    correct: true
    text:
      es: "Ir a otra carpeta."
  explanation:
    es: "La tabla de navegación básica de Outlook clásico asigna Ctrl+Y a ir a otra carpeta. Ir al cuadro de búsqueda es F3 o Ctrl+E. Abrir la Libreta de direcciones es Ctrl+Mayús+B. Cambiar a la vista People es Ctrl+4."
  citation: "fuente: `ms-outlook-atajos.html`; «Accesos directos para la navegación básica»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-atajos-html
- id: m06-l07-q074
  prompt:
    es: "En el nuevo Outlook para Windows, según la tabla de métodos abreviados de Contactos de la ayuda de Microsoft, ¿adónde va Ctrl+3?"
  options:
  - id: a
    text:
      es: "A Mail."
  - id: b
    text:
      es: "A Calendario."
  - id: c
    correct: true
    text:
      es: "A Copilot."
  - id: d
    text:
      es: "A People."
  explanation:
    es: "La tabla de Contactos del nuevo Outlook asigna Ctrl+3 a ir a Copilot. Ctrl+4 va a People, Ctrl+2 a Calendario y Ctrl+1 a Mail."
  citation: "fuente: `ms-outlook-atajos.html`; «Métodos abreviados de teclado de Contactos (Personas)»"
  difficulty: 2
