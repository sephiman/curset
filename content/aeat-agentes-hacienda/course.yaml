- id: block-b
  title:
    es: Programa
  modules:
  - id: m01
    title:
      es: Organización del Estado y funcionamiento de la Administración General del Estado
    summary:
      es: 'La Constitución, las Cortes Generales, el Poder Judicial, el Gobierno y la Administración del Estado, la
        organización territorial y las instituciones de la Unión Europea. Siguen la administración electrónica, la
        transparencia y la protección de datos, las políticas de igualdad y el régimen del personal funcionario.'
    lessons:
    - id: m01-l01
      title:
        es: 'La Constitución Española de 1978: Estructura y contenido. Derechos y deberes fundamentales. Su garantía y
          suspensión. La Corona. El Tribunal Constitucional.'
      summary:
        es: 'El primer ejercicio es un cuestionario de 80 preguntas sobre todo el programa, y cada respuesta errónea
          descuenta un cuarto del valor de una respuesta correcta. El segundo es un cuestionario con diez supuestos
          prácticos sobre las Materias específicas, que se contesta por escrito. La lección explica cómo se califican
          los dos ejercicios y qué cubre el curso.'
      exercises:
      - id: m01-l01-ex-1
        type: quiz
      - id: m01-l01-ex-2
        type: quiz
      - id: m01-l01-ex-3
        type: quiz
    - id: m01-l02
      title:
        es: 'Las Cortes Generales: Composición, atribuciones y funcionamiento. El Defensor del Pueblo. El Poder Judicial.
          El Consejo General del Poder Judicial. El Tribunal Supremo. La organización judicial española.'
      summary:
        es: 'Las Cortes Generales, formadas por el Congreso y el Senado, representan al pueblo español y ejercen la
          potestad legislativa, y la lección recorre el Reglamento del Congreso y el del Senado; el Defensor del
          Pueblo es el alto comisionado de las Cortes Generales para defender los derechos del título I. La justicia
          la administran Jueces y Magistrados independientes, con el Consejo General del Poder Judicial como órgano de
          gobierno y el Tribunal Supremo como órgano jurisdiccional superior en todos los órdenes, salvo en garantías
          constitucionales. La potestad jurisdiccional se atribuye a los jueces de paz, los Tribunales de Instancia,
          las Audiencias Provinciales, los Tribunales Superiores de Justicia, el Tribunal Central de Instancia, la
          Audiencia Nacional y el Tribunal Supremo.'
      exercises:
      - id: m01-l02-ex-1
        type: quiz
      - id: m01-l02-ex-2
        type: quiz
      - id: m01-l02-ex-3
        type: quiz
      - id: m01-l02-ex-4
        type: quiz
      - id: m01-l02-ex-5
        type: quiz
    - id: m01-l03
      title:
        es: 'El Gobierno: Nombramiento y cese. Las funciones del Gobierno. La Administración Pública: Principios
          constitucionales informadores. La Administración central y periférica del Estado. Tipos de Entes
          Públicos.'
      summary:
        es: 'El Gobierno lo forman el Presidente, los Vicepresidentes, en su caso, y los Ministros; dirige la política
          interior y exterior, la Administración civil y militar y la defensa del Estado. El Presidente se designa por
          investidura en el Congreso, y el Gobierno cesa tras las elecciones generales, por pérdida de la confianza
          parlamentaria o por dimisión o fallecimiento del Presidente. La Administración General del Estado comprende
          la Organización Central, la Organización Territorial y la Administración General del Estado en el exterior,
          y el sector público institucional estatal comprende organismos públicos, autoridades administrativas
          independientes, sociedades mercantiles estatales, consorcios, fundaciones del sector público, fondos sin
          personalidad jurídica y universidades públicas no transferidas.'
      exercises:
      - id: m01-l03-ex-1
        type: quiz
      - id: m01-l03-ex-2
        type: quiz
      - id: m01-l03-ex-3
        type: quiz
      - id: m01-l03-ex-4
        type: quiz
      - id: m01-l03-ex-5
        type: quiz
      - id: m01-l03-ex-6
        type: quiz
      - id: m01-l03-ex-7
        type: quiz
      - id: m01-l03-ex-8
        type: quiz
    - id: m01-l04
      title:
        es: 'La organización territorial del Estado. Comunidades y Ciudades Autónomas. Las Entidades Locales. Las
          Instituciones de la Unión Europea: El Consejo, el Parlamento Europeo, la Comisión, el Tribunal de
          Justicia.'
      summary:
        es: 'El Estado se organiza en municipios, provincias y Comunidades Autónomas; Ceuta y Melilla son Ciudades
          Autónomas, cada una con su Estatuto de Autonomía y su régimen económico y financiero, y la lección trata
          también la financiación de las Comunidades Autónomas. La LBRL es la ley básica de la Administración local y
          distingue las Entidades Locales territoriales, que son el Municipio, la Provincia y la Isla en los
          archipiélagos balear y canario, de las otras entidades locales: las Comarcas u otras entidades que agrupen
          varios Municipios, las Áreas Metropolitanas y las Mancomunidades de Municipios. De la Unión Europea, la
          lección trata el Consejo Europeo, el Consejo, el Parlamento Europeo, la Comisión Europea y el Tribunal de
          Justicia de la Unión Europea.'
      exercises:
      - id: m01-l04-ex-1
        type: quiz
      - id: m01-l04-ex-2
        type: quiz
      - id: m01-l04-ex-3
        type: quiz
      - id: m01-l04-ex-4
        type: quiz
      - id: m01-l04-ex-5
        type: quiz
      - id: m01-l04-ex-6
        type: quiz
      - id: m01-l04-ex-7
        type: quiz
      - id: m01-l04-ex-8
        type: quiz
      - id: m01-l04-ex-9
        type: quiz
    - id: m01-l05
      title:
        es: 'El funcionamiento electrónico del sector público. Derecho y obligación de relacionarse electrónicamente con
          las Administraciones Públicas, registros y archivo electrónico. El Gobierno abierto, la
          transparencia, el acceso a la información pública, la participación en la rendición de cuentas y el
          buen gobierno. Normativa reguladora de la protección de datos personales: principios, derechos de
          las personas y ejercicios de los derechos.'
      summary:
        es: 'El sector público actúa por medios electrónicos: sede, registro, archivo, firma y relación con los
          interesados se regulan en la LRJSP, la LPAC y el RD 203/2021, con los lugares de presentación de documentos
          y las oficinas de asistencia en materia de registros. La Ley 19/2013 obliga a publicar información y
          reconoce el derecho de acceso, con el Consejo de Transparencia y Buen Gobierno como órgano de control. El
          RGPD y la LOPDGDD fijan los principios y los derechos en protección de datos, con el deber de información al
          interesado y las limitaciones del artículo 23 del RGPD.'
      exercises:
      - id: m01-l05-ex-1
        type: quiz
      - id: m01-l05-ex-2
        type: quiz
      - id: m01-l05-ex-3
        type: quiz
      - id: m01-l05-ex-4
        type: quiz
      - id: m01-l05-ex-5
        type: quiz
      - id: m01-l05-ex-6
        type: quiz
    - id: m01-l06
      title:
        es: 'Políticas de igualdad de género, no discriminación y contra la violencia de género. Discapacidad y
          dependencia: régimen jurídico.'
      summary:
        es: 'La LO 3/2007 prohíbe la discriminación por razón de sexo y fija medidas de igualdad en el empleo público;
          la LO 1/2004 protege a las víctimas de violencia de género. La Ley 15/2022 y la Ley 4/2023 regulan la igualdad
          de trato y los derechos de las personas LGTBI. El RDL 1/2013 y la Ley 39/2006 regulan la discapacidad y la
          dependencia.'
      exercises:
      - id: m01-l06-ex-1
        type: quiz
      - id: m01-l06-ex-2
        type: quiz
      - id: m01-l06-ex-3
        type: quiz
      - id: m01-l06-ex-4
        type: quiz
      - id: m01-l06-ex-5
        type: quiz
      - id: m01-l06-ex-6
        type: quiz
    - id: m01-l07
      title:
        es: Régimen jurídico del personal al servicio de las Administraciones Públicas. El Estatuto Básico del Empleado
          Público. Derechos y deberes de los funcionarios. La provisión de puestos de trabajo y la carrera
          administrativa. Situaciones administrativas. Incompatibilidades y régimen disciplinario. El régimen
          de Seguridad Social de los funcionarios.
      summary:
        es: 'El TREBEP regula las clases de empleados públicos, sus derechos y deberes, la provisión de puestos, la
          carrera, las situaciones y el régimen disciplinario; en la Administración del Estado rigen además la Ley
          30/1984 y sus reglamentos y el libro segundo del Real Decreto-ley 6/2023, con la evaluación del desempeño,
          la carrera horizontal y el personal directivo público profesional. Las incompatibilidades están en la Ley
          53/1984. Los funcionarios civiles del Estado tienen un régimen especial de Seguridad Social con dos
          mecanismos: el mutualismo administrativo, que gestiona MUFACE, y las Clases Pasivas.'
      exercises:
      - id: m01-l07-ex-1
        type: quiz
      - id: m01-l07-ex-2
        type: quiz
      - id: m01-l07-ex-3
        type: quiz
      - id: m01-l07-ex-4
        type: quiz
      - id: m01-l07-ex-5
        type: quiz
      - id: m01-l07-ex-6
        type: quiz
      - id: m01-l07-ex-7
        type: quiz
      - id: m01-l07-ex-8
        type: quiz
  - id: m02
    title:
      es: Derecho Administrativo General
    summary:
      es: 'Las fuentes del derecho administrativo, el acto administrativo y su revisión de oficio, el procedimiento
        administrativo común y los recursos, administrativos y contencioso-administrativo.'
    lessons:
    - id: m02-l01
      title:
        es: Las fuentes del Derecho Administrativo. La jerarquía de las fuentes. La Constitución. La Ley. El Reglamento.
          El ordenamiento jurídico de la Unión Europea.
      summary:
        es: 'Las fuentes del ordenamiento son la ley, la costumbre y los principios generales del derecho, y una
          disposición que contradiga otra de rango superior carece de validez. El decreto legislativo, el decreto-ley y
          el reglamento tienen sus límites, y el reglamento sigue un procedimiento de elaboración propio. La Unión
          Europea se fundamenta en los Tratados y adopta reglamentos, directivas y decisiones por el procedimiento
          legislativo ordinario o por uno especial.'
      exercises:
      - id: m02-l01-ex-1
        type: quiz
      - id: m02-l01-ex-2
        type: quiz
      - id: m02-l01-ex-3
        type: quiz
      - id: m02-l01-ex-4
        type: quiz
      - id: m02-l01-ex-5
        type: quiz
    - id: m02-l02
      title:
        es: Los actos administrativos. Concepto y clases. Motivación, forma y eficacia de los actos administrativos.
          Notificación y publicación. Nulidad y anulabilidad. La revisión de oficio.
      summary:
        es: 'La LPAC fija la forma, la motivación, la eficacia, la notificación y la publicación de los actos
          administrativos. El acto nulo de pleno derecho y el anulable se distinguen por sus causas. La Administración
          puede revisar de oficio sus propios actos.'
      exercises:
      - id: m02-l02-ex-1
        type: quiz
      - id: m02-l02-ex-2
        type: quiz
      - id: m02-l02-ex-3
        type: quiz
      - id: m02-l02-ex-4
        type: quiz
      - id: m02-l02-ex-5
        type: quiz
      - id: m02-l02-ex-6
        type: quiz
      - id: m02-l02-ex-7
        type: quiz
    - id: m02-l03
      title:
        es: El procedimiento administrativo común. La capacidad de obrar y el concepto de interesado. Representación.
          Identificación y firma de los interesados. Derechos del interesado en el procedimiento
          administrativo. Obligación de resolver y silencio administrativo. Términos y plazos.
      summary:
        es: 'Los interesados actúan con capacidad de obrar, por sí o por representante, se identifican y firman por los
          sistemas de los artículos 9 y siguientes de la LPAC y tienen los derechos de los artículos 13 y 53 de la
          LPAC. La Administración debe resolver y notificar en plazo, y en los procedimientos iniciados a solicitud
          del interesado el silencio es estimatorio salvo las excepciones del artículo 24.1 de la LPAC. Los plazos en
          días se cuentan en días hábiles salvo que una ley o el derecho de la Unión digan otra cosa.'
      exercises:
      - id: m02-l03-ex-1
        type: quiz
      - id: m02-l03-ex-2
        type: quiz
      - id: m02-l03-ex-3
        type: quiz
      - id: m02-l03-ex-4
        type: quiz
      - id: m02-l03-ex-5
        type: quiz
      - id: m02-l03-ex-6
        type: quiz
    - id: m02-l04
      title:
        es: 'Las fases del procedimiento administrativo: Iniciación, ordenación, instrucción y finalización. La ejecución
          de los actos y resoluciones administrativas.'
      summary:
        es: 'El procedimiento se inicia de oficio o a solicitud del interesado, se ordena e instruye y termina por
          resolución, desistimiento, renuncia al derecho, declaración de caducidad o imposibilidad material de
          continuarlo por causas sobrevenidas, y puede terminar también por acuerdo, pacto, convenio o contrato. Los
          actos son inmediatamente ejecutivos, salvo los casos del artículo 98.1 de la LPAC, y la Administración puede
          ejecutarlos forzosamente por apremio sobre el patrimonio, ejecución subsidiaria, multa coercitiva o
          compulsión sobre las personas.'
      exercises:
      - id: m02-l04-ex-1
        type: quiz
      - id: m02-l04-ex-2
        type: quiz
      - id: m02-l04-ex-3
        type: quiz
      - id: m02-l04-ex-4
        type: quiz
    - id: m02-l05
      title:
        es: 'Los recursos administrativos: concepto y clases. Recurso de alzada. Recurso potestativo de reposición.
          Recurso extraordinario de revisión. La jurisdicción contencioso-administrativa: objeto y plazos de
          interposición del recurso contencioso-administrativo.'
      summary:
        es: 'Los actos se recurren en alzada, en reposición o con el recurso extraordinario de revisión, cada uno con
          sus causas y plazos. El recurso contencioso-administrativo se interpone en dos meses contra el acto expreso y
          en seis contra el presunto. La LJCA fija qué actividad es impugnable y qué cuestiones quedan fuera de ese
          orden.'
      exercises:
      - id: m02-l05-ex-1
        type: quiz
      - id: m02-l05-ex-2
        type: quiz
      - id: m02-l05-ex-3
        type: quiz
      - id: m02-l05-ex-4
        type: quiz
  - id: m03
    title:
      es: Organización de la Hacienda Pública y Derecho Tributario
    summary:
      es: 'El módulo trata el sistema fiscal español y sus principios constitucionales, la Hacienda Pública estatal,
        autonómica y local y la Agencia Estatal de Administración Tributaria. De la Ley General Tributaria y sus
        reglamentos recoge, entre otras materias, los tributos, los obligados tributarios, la gestión, la inspección,
        la recaudación, las sanciones y la revisión. Siguen el IRPF, el Impuesto sobre Sociedades, el IVA y la
        Aduana.'
    lessons:
    - id: m03-l01
      title:
        es: El sistema fiscal español. Principios impositivos en la Constitución Española. Los impuestos de titularidad
          estatal y sus características. La Hacienda Pública Estatal, Autonómica y Local.
      summary:
        es: 'El sistema tributario se inspira en los principios de igualdad y progresividad, y la potestad originaria
          para establecer los tributos corresponde exclusivamente al Estado, mediante ley. La ley de cada impuesto
          estatal dice qué grava y si es directo o indirecto. Las Haciendas autonómica y local se financian con los
          recursos que fijan la CE, la LOFCA, la Ley 22/2009 y el TRLRHL.'
      exercises:
      - id: m03-l01-ex-1
        type: quiz
      - id: m03-l01-ex-2
        type: quiz
      - id: m03-l01-ex-3
        type: quiz
      - id: m03-l01-ex-4
        type: quiz
    - id: m03-l02
      title:
        es: 'La Agencia Estatal de Administración Tributaria: creación, naturaleza, objetivos, funciones y organización.'
      summary:
        es: 'La AEAT es un ente de derecho público creado por el artículo 103 de la Ley 31/1990; su Presidente tiene
          rango de Secretario de Estado y su Director General, de Subsecretario. Su organización central son los
          departamentos, con rango de dirección general, y los servicios y la Delegación Central de Grandes
          Contribuyentes, con rango de dirección adjunta. Su organización territorial son las Delegaciones Especiales,
          las Delegaciones y las Administraciones.'
      exercises:
      - id: m03-l02-ex-1
        type: quiz
      - id: m03-l02-ex-2
        type: quiz
      - id: m03-l02-ex-3
        type: quiz
      - id: m03-l02-ex-4
        type: quiz
      - id: m03-l02-ex-5
        type: quiz
    - id: m03-l03
      title:
        es: 'Derecho Tributario: concepto y contenido. Fuentes. Los tributos: concepto y clasificación. La obligación
          tributaria. Hecho imponible. Devengo. Base imponible y liquidable. Cuota y deuda tributaria.'
      summary:
        es: 'El derecho tributario de la LGT parte de sus principios y fuentes y define los tributos y sus clases: tasas,
          contribuciones especiales e impuestos. La obligación tributaria principal nace con el devengo del hecho
          imponible y se cuantifica con la base imponible, la base liquidable, el tipo de gravamen y las cuotas. La
          deuda tributaria la integra la cuota y, en su caso, el interés de demora, los recargos por declaración
          extemporánea, los recargos del período ejecutivo y los recargos exigibles legalmente sobre las bases o las
          cuotas.'
      exercises:
      - id: m03-l03-ex-1
        type: quiz
      - id: m03-l03-ex-2
        type: quiz
      - id: m03-l03-ex-3
        type: quiz
      - id: m03-l03-ex-4
        type: quiz
      - id: m03-l03-ex-5
        type: quiz
    - id: m03-l04
      title:
        es: Obligaciones tributarias formales. Derechos y garantías de los obligados tributarios. Los obligados
          tributarios. La capacidad de obrar en el orden tributario. Representación y domicilio fiscal. Plazos
          de prescripción.
      summary:
        es: 'Las obligaciones tributarias formales que trata el tema son las declaraciones censales, el número de
          identificación fiscal, los libros registro y las declaraciones informativas, que regula el RGAT, con los
          libros registro que exigen el RIVA y el RIRPF y la contabilidad que exige el Código de Comercio, y la
          facturación, que regulan el Real Decreto 1619/2012 y, para los sistemas informáticos de facturación, el Real
          Decreto 1007/2023. La LGT reconoce los derechos y garantías de los obligados tributarios, con el Consejo
          para la Defensa del Contribuyente que regula el Real Decreto 1676/2009 y el reembolso del coste de las
          garantías que desarrolla el RGRVA, y regula los obligados tributarios, la capacidad de obrar, la
          representación y el domicilio fiscal. Los derechos del artículo 66 de la LGT prescriben a los cuatro años,
          con reglas propias de cómputo e interrupción.'
      exercises:
      - id: m03-l04-ex-1
        type: quiz
      - id: m03-l04-ex-2
        type: quiz
      - id: m03-l04-ex-3
        type: quiz
      - id: m03-l04-ex-4
        type: quiz
      - id: m03-l04-ex-5
        type: quiz
      - id: m03-l04-ex-6
        type: quiz
      - id: m03-l04-ex-7
        type: quiz
      - id: m03-l04-ex-8
        type: quiz
      - id: m03-l04-ex-9
        type: quiz
      - id: m03-l04-ex-10
        type: quiz
      - id: m03-l04-ex-11
        type: quiz
    - id: m03-l05
      title:
        es: 'Información y Asistencia a los obligados tributarios. La colaboración social en la aplicación de los
          tributos. Carácter reservado de los datos con trascendencia tributaria. Normas comunes sobre
          actuaciones y procedimientos tributarios: fases. Las liquidaciones tributarias. Obligación de
          resolver y plazos de resolución. Carga de la prueba. Las notificaciones.'
      summary:
        es: 'La Administración informa y asiste a los obligados tributarios, entre otras, con las actuaciones del
          artículo 85.2 de la LGT: publicación de textos actualizados de las normas tributarias y de la doctrina
          administrativa de mayor trascendencia, comunicaciones y actuaciones de información, contestaciones a consultas
          escritas, actuaciones previas de valoración y asistencia en la realización de declaraciones, autoliquidaciones
          y comunicaciones tributarias. Los interesados pueden colaborar en la aplicación de los tributos, y los datos
          con trascendencia tributaria tienen carácter reservado. Los procedimientos tributarios siguen normas comunes
          de iniciación, desarrollo, documentación y terminación, con reglas propias de prueba y de notificación, y su
          resolución se notifica en el plazo que fija la normativa de cada uno, que no puede exceder de seis meses salvo
          norma con rango de ley o normativa comunitaria europea y es de seis meses si no se fija.'
