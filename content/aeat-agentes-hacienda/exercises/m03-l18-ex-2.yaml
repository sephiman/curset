# anchor: boe-a-1992-28740-art-4
- id: m03-l18-q0012
  prompt:
    es: "De acuerdo con el artículo 4.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, están sujetas al impuesto las entregas de bienes y prestaciones de servicios realizadas en el ámbito espacial del impuesto por empresarios o profesionales:"
  options:
  - id: a
    text:
      es: "a título oneroso, con carácter habitual u ocasional, si persiguen un fin lucrativo en cada operación."
  - id: b
    correct: true
    text:
      es: "a título oneroso, con carácter habitual u ocasional, en el desarrollo de su actividad empresarial o profesional."
  - id: c
    text:
      es: "a título oneroso o gratuito, con carácter habitual u ocasional, en el desarrollo de su actividad."
  - id: d
    text:
      es: "a título oneroso, solo con carácter habitual, en el desarrollo de su actividad empresarial o profesional propia."
  explanation:
    es: "La sujeción exige carácter oneroso y que la operación se haga en el desarrollo de la actividad, de forma habitual u ocasional. No basta la habitualidad, el título gratuito no sujeta y el fin lucrativo de cada operación es irrelevante."
  citation: "art. 4.Uno LIVA"
  difficulty: 1
  tags:
  - "hecho imponible"
# anchor: boe-a-1992-28740-art-4
- id: m03-l18-q0014
  prompt:
    es: "Conforme al artículo 4.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se entenderán realizadas en el desarrollo de una actividad empresarial o profesional las entregas de bienes y prestaciones de servicios efectuadas por las sociedades mercantiles:"
  options:
  - id: a
    correct: true
    text:
      es: "cuando tengan la condición de empresario o profesional."
  - id: b
    text:
      es: "solo cuando se efectúen en favor de terceros distintos de sus propios socios."
  - id: c
    text:
      es: "únicamente cuando estén inscritas en el Registro Mercantil y tributen en el Impuesto sobre Sociedades."
  - id: d
    text:
      es: "solo cuando su objeto social incluya expresamente esas entregas y prestaciones."
  explanation:
    es: "Para las sociedades mercantiles basta que tengan la condición de empresario o profesional. El objeto social, la exclusión de los socios y la inscripción registral no son condiciones del precepto, y las operaciones en favor de socios están incluidas por el apartado Uno."
  citation: "art. 4.Dos.a) LIVA"
  difficulty: 1
  tags:
  - "hecho imponible"
  - "sociedades mercantiles"
# anchor: boe-a-1992-28740-art-4
- id: m03-l18-q0016
  prompt:
    es: "Según el artículo 4.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se entienden realizados en el desarrollo de una actividad empresarial o profesional los servicios desarrollados por los Registradores de la Propiedad en su condición de:"
  options:
  - id: a
    text:
      es: "liquidadores del Impuesto sobre Sucesiones y Donaciones de la Comunidad Autónoma."
  - id: b
    text:
      es: "liquidadores titulares de una oficina de la Agencia Estatal de Administración Tributaria."
  - id: c
    text:
      es: "delegados de la Administración tributaria en cada Registro Mercantil provincial."
  - id: d
    correct: true
    text:
      es: "liquidadores titulares de una Oficina Liquidadora de Distrito Hipotecario."
  explanation:
    es: "La condición que recoge el precepto es la de liquidador titular de una Oficina Liquidadora de Distrito Hipotecario. Las otras opciones atribuyen funciones de liquidación de otro impuesto, una delegación en el Registro Mercantil o una oficina de la Agencia Tributaria que el artículo no menciona."
  citation: "art. 4.Dos.c) LIVA"
  difficulty: 2
  tags:
  - "hecho imponible"
  - "registradores"
# anchor: boe-a-1992-28740-art-4
- id: m03-l18-q0017
  prompt:
    es: "De acuerdo con el artículo 4.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la sujeción al impuesto se produce con independencia de:"
  options:
  - id: a
    text:
      es: "el carácter oneroso de la operación efectuada por el empresario o profesional."
  - id: b
    correct: true
    text:
      es: "los fines o resultados perseguidos en la actividad empresarial o profesional o en cada operación en particular."
  - id: c
    text:
      es: "la condición de empresario o profesional de quien realice la entrega o la prestación."
  - id: d
    text:
      es: "el ámbito espacial del impuesto en que se realicen las entregas y las prestaciones."
  explanation:
    es: "El artículo 4.Tres hace irrelevantes los fines y los resultados de la actividad o de cada operación. La condición de empresario, el carácter oneroso y el ámbito espacial sí son requisitos del artículo 4.Uno."
  citation: "art. 4.Tres LIVA"
  difficulty: 1
  tags:
  - "hecho imponible"
  - "fines o resultados"
# anchor: boe-a-1992-28740-art-4
- id: m03-l18-q0018
  prompt:
    es: "Señale la respuesta CORRECTA sobre la relación del impuesto con el Impuesto sobre Transmisiones Patrimoniales y Actos Jurídicos Documentados, según el artículo 4.Cuatro de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Las operaciones sujetas al IVA tributan además por «transmisiones patrimoniales onerosas», con deducción de la cuota."
  - id: b
    text:
      es: "Las operaciones sujetas al IVA no están sujetas a ningún concepto del Impuesto sobre Transmisiones Patrimoniales y Actos Jurídicos Documentados."
  - id: c
    text:
      es: "Las operaciones sujetas al IVA no están sujetas a «transmisiones patrimoniales onerosas» solo si el IVA se repercute íntegramente."
  - id: d
    correct: true
    text:
      es: "Las operaciones sujetas al IVA no están sujetas al concepto «transmisiones patrimoniales onerosas»."
  explanation:
    es: "La no sujeción se refiere al concepto «transmisiones patrimoniales onerosas». No hay doble tributación con deducción de cuota, la regla no alcanza a todos los conceptos del impuesto y no depende de cómo se repercuta el IVA."
  citation: "art. 4.Cuatro LIVA"
  difficulty: 2
  tags:
  - "hecho imponible"
  - "ITP"
# anchor: boe-a-1992-28740-art-5
- id: m03-l18-q0019
  prompt:
    es: "Conforme al artículo 5.Uno.a) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, no tendrán la consideración de empresarios o profesionales quienes realicen exclusivamente entregas de bienes o prestaciones de servicios:"
  options:
  - id: a
    text:
      es: "a título gratuito o a título oneroso con carácter ocasional."
  - id: b
    text:
      es: "a título gratuito, también cuando se trate de sociedades mercantiles."
  - id: c
    correct: true
    text:
      es: "a título gratuito, sin perjuicio de la consideración de las sociedades mercantiles."
  - id: d
    text:
      es: "a título oneroso, cuando las realicen de forma ocasional y no con carácter habitual."
  explanation:
    es: "Quien solo entrega o presta a título gratuito no es empresario, salvo lo que la letra siguiente dice de las sociedades mercantiles. Lo ocasional a título oneroso no excluye la condición de empresario, y las sociedades mercantiles sí se reputan empresarios."
  citation: "art. 5.Uno LIVA"
  difficulty: 2
  tags:
  - "empresario o profesional"
  - "título gratuito"
# anchor: boe-a-1992-28740-art-5
- id: m03-l18-q0020
  prompt:
    es: "Según el artículo 5.Uno.b) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se reputarán empresarios o profesionales las sociedades mercantiles:"
  options:
  - id: a
    correct: true
    text:
      es: "salvo prueba en contrario, a los efectos de esta ley."
  - id: b
    text:
      es: "solo cuando figuren dadas de alta en el Impuesto sobre Actividades Económicas."
  - id: c
    text:
      es: "solo si realizan entregas de bienes a título oneroso con habitualidad."
  - id: d
    text:
      es: "siempre, sin que se admita prueba en contrario sobre su actividad."
  explanation:
    es: "Las sociedades mercantiles son empresarios o profesionales salvo prueba en contrario, así que la condición admite desvirtuarse. No es absoluta, no exige habitualidad en las entregas y no depende del alta en el Impuesto sobre Actividades Económicas."
  citation: "art. 5.Uno LIVA"
  difficulty: 1
  tags:
  - "empresario o profesional"
  - "sociedades mercantiles"
# anchor: boe-a-1992-28740-art-5
- id: m03-l18-q0021
  prompt:
    es: "Joaquín Ferrer, jubilado, alquila desde 2024 un local de su propiedad a una empresa por 900 euros al mes y no realiza otra actividad. Según el artículo 5.Uno.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿tiene la consideración de empresario o profesional a efectos del IVA?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque explota un bien corporal para obtener ingresos continuados en el tiempo, como los arrendadores de bienes."
  - id: b
    text:
      es: "No, porque es una persona física que no tiene la condición de sociedad mercantil."
  - id: c
    text:
      es: "Solo si el local se alquila a un sujeto pasivo con derecho a deducir el IVA soportado."
  - id: d
    text:
      es: "No, porque no ordena factores de producción para intervenir en la producción o distribución de bienes o servicios en el mercado."
  explanation:
    es: "El arrendador de bienes se reputa empresario por explotar un bien para obtener ingresos continuados en el tiempo. La falta de una organización de factores de producción no lo impide, la forma de persona física no importa y la condición del arrendatario tampoco la altera."
  citation: "art. 5.Uno LIVA"
  difficulty: 2
  tags:
  - "empresario o profesional"
  - "arrendadores"
# anchor: boe-a-1992-28740-art-5
- id: m03-l18-q0022
  prompt:
    es: "Isabel Montero, que no ejerce ninguna actividad, compra un solar en 2025 y construye en él una vivienda para venderla a un tercero. Conforme al artículo 5.Uno.d) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué consideración tiene a efectos del IVA?"
  options:
  - id: a
    text:
      es: "No es empresaria, porque una persona física solo lo es si ejerce una profesión liberal o artística de forma habitual."
  - id: b
    correct: true
    text:
      es: "Es empresaria, porque promueve y construye una edificación destinada a su venta, aunque lo haga de forma ocasional."
  - id: c
    text:
      es: "Es empresaria solo si vende la vivienda a un empresario con derecho a deducir el impuesto."
  - id: d
    text:
      es: "No es empresaria, porque la construcción de una sola vivienda es una operación ocasional."
  explanation:
    es: "Quien promueve o construye edificaciones destinadas a su venta es empresario aunque lo haga ocasionalmente. La ocasionalidad no excluye la condición, no se exige que el comprador sea empresario y las personas físicas no tienen que ejercer una profesión liberal o artística."
  citation: "art. 5.Uno LIVA"
  difficulty: 2
  tags:
  - "empresario o profesional"
  - "promotor"
# anchor: boe-a-1992-28740-art-5
- id: m03-l18-q0023
  prompt:
    es: "De acuerdo con el artículo 5.Uno.e) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, quienes realicen a título ocasional las entregas de medios de transporte nuevos exentas en virtud del artículo 25 solo tienen la condición de empresarios o profesionales:"
  options:
  - id: a
    text:
      es: "respecto de todas las entregas de bienes que realicen, aunque no sean medios de transporte."
  - id: b
    text:
      es: "respecto de las entregas de medios de transporte nuevos y de las prestaciones de servicios que realicen."
  - id: c
    correct: true
    text:
      es: "respecto de las entregas de esos medios de transporte nuevos, y no de otras operaciones."
  - id: d
    text:
      es: "durante los tres años siguientes a la entrega del medio de transporte nuevo."
  explanation:
    es: "La condición de empresario de quien entrega ocasionalmente un medio de transporte nuevo se limita a esas entregas. No se extiende a otras entregas ni a servicios, y el precepto no fija ningún plazo de tres años."
  citation: "art. 5.Uno LIVA"
  difficulty: 2
  tags:
  - "empresario o profesional"
  - "medios de transporte nuevos"
# anchor: boe-a-1992-28740-art-5
- id: m03-l18-q0024
  prompt:
    es: "Según el artículo 5.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, son actividades empresariales o profesionales las que impliquen la ordenación por cuenta propia de factores de producción materiales y humanos, o de uno de ellos, con la finalidad de:"
  options:
  - id: a
    text:
      es: "transmitir bienes a título oneroso a consumidores finales."
  - id: b
    text:
      es: "obtener un beneficio económico de forma habitual y organizada."
  - id: c
    text:
      es: "prestar servicios a terceros a cambio de una contraprestación periódica."
  - id: d
    correct: true
    text:
      es: "intervenir en la producción o distribución de bienes o servicios."
  explanation:
    es: "Lo que define la actividad es ordenar por cuenta propia factores de producción para intervenir en la producción o distribución de bienes o servicios. El ánimo de beneficio, la periodicidad de la contraprestación y vender a consumidores finales no son parte de la definición."
  citation: "art. 5.Dos LIVA"
  difficulty: 1
  tags:
  - "actividad empresarial"
  - "factores de producción"
# anchor: boe-a-1992-28740-art-5
- id: m03-l18-q0025
  prompt:
    es: "Señale la respuesta CORRECTA sobre el inicio de las actividades empresariales o profesionales, según el artículo 5.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    correct: true
    text:
      es: "Se consideran iniciadas desde que se adquieren bienes o servicios con la intención, confirmada por elementos objetivos, de destinarlos a la actividad."
  - id: b
    text:
      es: "Se consideran iniciadas cuando se obtienen los primeros ingresos derivados de la actividad."
  - id: c
    text:
      es: "Se consideran iniciadas desde la presentación de la declaración censal de alta ante la Administración tributaria."
  - id: d
    text:
      es: "Se consideran iniciadas cuando se realiza la primera entrega de bienes o prestación de servicios a un tercero."
  explanation:
    es: "La actividad empieza con la adquisición de bienes o servicios destinados a ella, si la intención se confirma con elementos objetivos. No hay que esperar a la primera operación con terceros, al alta censal ni a los primeros ingresos."
  citation: "art. 5.Dos LIVA"
  difficulty: 2
  tags:
  - "actividad empresarial"
  - "inicio"
# anchor: boe-a-1992-28740-art-5
- id: m03-l18-q0026
  prompt:
    es: "¿Cuál de las siguientes actividades tiene en particular la consideración de empresarial o profesional, según el artículo 5.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "El desempeño de un puesto de trabajo en régimen de dependencia laboral."
  - id: b
    text:
      es: "La tenencia de bienes sin ordenar medios de producción ni distribución."
  - id: c
    text:
      es: "La mera inversión del patrimonio personal en valores cotizados."
  - id: d
    correct: true
    text:
      es: "El ejercicio de profesiones liberales y artísticas."
  explanation:
    es: "El precepto cita expresamente el ejercicio de profesiones liberales y artísticas. El trabajo por cuenta ajena no ordena factores de producción por cuenta propia, y la simple tenencia de bienes o la inversión patrimonial tampoco intervienen en la producción o distribución."
  citation: "art. 5.Dos LIVA"
  difficulty: 2
  tags:
  - "actividad empresarial"
  - "profesiones liberales"
# anchor: boe-a-1992-28740-art-6
- id: m03-l18-q0029
  prompt:
    es: "Señale cuál de las siguientes construcciones tiene la consideración de edificación a efectos del impuesto, según el artículo 6.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    correct: true
    text:
      es: "Los puertos, aeropuertos y mercados unidos a un inmueble de una manera fija."
  - id: b
    text:
      es: "Las obras de urbanización de terrenos, como las redes de distribución de gas."
  - id: c
    text:
      es: "Un campo de cultivo sin ninguna construcción unida al suelo."
  - id: d
    text:
      es: "Las minas, canteras y pozos de petróleo o de gas."
  explanation:
    es: "Los puertos, aeropuertos y mercados son edificaciones si están unidos al inmueble de manera fija. Las obras de urbanización y las minas, canteras y pozos están excluidas por el artículo 6.Tres, y un campo sin construcción alguna no cumple el concepto."
  citation: "art. 6.Dos LIVA"
  difficulty: 1
  tags:
  - "edificaciones"
  - "enumeración"
# anchor: boe-a-1992-28740-art-6
- id: m03-l18-q0030
  prompt:
    es: "De acuerdo con el artículo 6.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, no tendrán la consideración de edificaciones, entre otras:"
  options:
  - id: a
    text:
      es: "los edificios concebidos para ser utilizados como vivienda o para una actividad económica."
  - id: b
    correct: true
    text:
      es: "las obras de urbanización de terrenos, como las de abastecimiento y evacuación de aguas."
  - id: c
    text:
      es: "los caminos y carreteras unidos de manera fija a un inmueble."
  - id: d
    text:
      es: "los puertos, aeropuertos y mercados unidos de manera fija a un inmueble."
  explanation:
    es: "Las obras de urbanización, como el abastecimiento y la evacuación de aguas, no son edificaciones. Los edificios, los puertos, aeropuertos y mercados, y los caminos y carreteras unidos al inmueble sí lo son según el artículo 6.Dos."
  citation: "art. 6.Tres.a) LIVA"
  difficulty: 2
  tags:
  - "edificaciones"
  - "urbanización"
# anchor: boe-a-1992-28740-art-7
- id: m03-l18-q0033
  prompt:
    es: "Conforme al artículo 7.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, no están sujetas las entregas gratuitas de muestras de mercancías sin valor comercial estimable, con fines de:"
  options:
  - id: a
    correct: true
    text:
      es: "promoción de las actividades empresariales o profesionales."
  - id: b
    text:
      es: "difusión cultural de las actividades de la entidad que las entrega."
  - id: c
    text:
      es: "colaboración con entidades sin fines lucrativos de carácter social."
  - id: d
    text:
      es: "investigación y desarrollo de nuevos productos comerciales."
  explanation:
    es: "La no sujeción exige que las muestras se entreguen gratuitamente y sin valor comercial estimable, con fines de promoción de la actividad. La difusión cultural, la investigación de productos y la colaboración social no figuran en el precepto."
  citation: "art. 7.2.º LIVA"
  difficulty: 1
  tags:
  - "no sujeción"
  - "muestras"
# anchor: boe-a-1992-28740-art-7
- id: m03-l18-q0034
  prompt:
    es: "Maquinaria Cantabria, S.A. permite gratuitamente a clientes potenciales probar una cosechadora durante una jornada, para promocionar su actividad. Según el artículo 7.3.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué consideración tiene esta prestación?"
  options:
  - id: a
    text:
      es: "Está sujeta como autoconsumo de servicios, por no mediar contraprestación."
  - id: b
    text:
      es: "Está sujeta solo si el coste de la demostración supera los 200 euros por destinatario en el año natural, y no en otro caso."
  - id: c
    text:
      es: "Está sujeta y exenta, por servir a una actividad empresarial."
  - id: d
    correct: true
    text:
      es: "No está sujeta, por ser un servicio de demostración a título gratuito efectuado para la promoción de su actividad."
  explanation:
    es: "Los servicios de demostración a título gratuito para promocionar la actividad no están sujetos. No son un autoconsumo de servicios porque no se prestan para fines ajenos a la actividad, no existe una exención aplicable y el límite de 200 euros es el de los objetos publicitarios."
  citation: "art. 7.3.º LIVA"
  difficulty: 2
  tags:
  - "no sujeción"
  - "demostración"
# anchor: boe-a-1992-28740-art-7
- id: m03-l18-q0035
  prompt:
    es: "Señale la respuesta CORRECTA sobre las entregas de objetos publicitarios, según el artículo 7.4.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Quedan sujetas cuando el coste total de los suministros a un mismo destinatario durante el año natural exceda de 100 euros, aunque se entreguen a sujetos pasivos para su redistribución gratuita posterior."
  - id: b
    text:
      es: "No quedan sujetas aunque su coste total exceda de 200 euros, porque las entregas sin contraprestación nunca están sujetas."
  - id: c
    correct: true
    text:
      es: "Quedan sujetas cuando el coste total de los suministros a un mismo destinatario durante el año natural exceda de 200 euros, salvo que se entreguen a otros sujetos pasivos para su redistribución gratuita."
  - id: d
    text:
      es: "Quedan sujetas cuando el coste de cada suministro individual exceda de 200 euros, sea quien sea el destinatario."
  explanation:
    es: "La excepción mira el coste total de los suministros a un mismo destinatario en el año natural, con un límite de 200 euros, y no se aplica a las entregas a sujetos pasivos que las redistribuyen gratuitamente. El límite de 100 euros, el coste de cada suministro individual y la no sujeción sin excepciones no son la regla."
  citation: "art. 7.4.º LIVA"
  difficulty: 2
  tags:
  - "no sujeción"
  - "objetos publicitarios"
# anchor: boe-a-1992-28740-art-7
- id: m03-l18-q0036
  prompt:
    es: "Calzados Levante, S.L. regala en 2025 a Hostelería Duero, S.L. bolígrafos con su nombre grabado de forma indeleble y sin valor comercial intrínseco: 150 euros en marzo, 120 euros en junio y 90 euros en octubre. Hostelería Duero los usa en su negocio y no los redistribuye. Conforme al artículo 7.4.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿están sujetas las entregas?"
  options:
  - id: a
    text:
      es: "Sí, pero solo respecto de los 160 euros que exceden del límite de 200 euros."
  - id: b
    correct: true
    text:
      es: "Sí, porque el coste total a un mismo destinatario en 2025 es de 360 euros y excede de 200 euros."
  - id: c
    text:
      es: "No, porque las entregas sin contraprestación de objetos publicitarios nunca tributan en el impuesto."
  - id: d
    text:
      es: "No, porque ningún suministro individual de los realizados excede de 200 euros."
  explanation:
    es: "El límite se aplica al coste total de los suministros a un mismo destinatario en el año natural. 150 + 120 + 90 son 360 euros, más de 200, y el destinatario no los redistribuye gratuitamente, así que las entregas quedan sujetas en su totalidad. No importa que cada suministro sea inferior a 200, la excepción existe precisamente para el exceso y no se limita a la diferencia de 160 euros."
  citation: "art. 7.4.º LIVA"
  difficulty: 3
  tags:
  - "no sujeción"
  - "objetos publicitarios"
  - "cómputo"
# anchor: boe-a-1992-28740-art-7
- id: m03-l18-q0037
  prompt:
    es: "¿Qué consideración tienen los servicios prestados por personas físicas en régimen de dependencia derivado de relaciones laborales de carácter especial, conforme al artículo 7.5.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "No están sujetos al impuesto, pues el precepto incluye las relaciones laborales de carácter especial."
  - id: b
    text:
      es: "Están sujetos si el trabajador presta sus servicios a una sociedad mercantil."
  - id: c
    text:
      es: "Están sujetos, porque solo se excluyen las relaciones laborales de carácter común y no las especiales."
  - id: d
    text:
      es: "Están sujetos, pero exentos por una de las exenciones del artículo 20."
  explanation:
    es: "El precepto excluye los servicios en régimen de dependencia derivado de relaciones administrativas o laborales, y entre las laborales incluye las de carácter especial. No se limita a las comunes, la no sujeción no es una exención y no depende de que el empleador sea una sociedad mercantil."
  citation: "art. 7.5.º LIVA"
  difficulty: 2
  tags:
  - "no sujeción"
  - "relación laboral"
# anchor: boe-a-1992-28740-art-7
- id: m03-l18-q0038
  prompt:
    es: "Señale la respuesta CORRECTA sobre los servicios prestados por socios a las cooperativas, según el artículo 7.6.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "No están sujetos los servicios prestados a cualquier cooperativa por todos sus socios, sean o no socios de trabajo."
  - id: b
    text:
      es: "No están sujetos los servicios que las cooperativas de trabajo asociado prestan a sus socios."
  - id: c
    text:
      es: "Están sujetos los servicios prestados por los socios a las cooperativas de trabajo asociado, por no mediar relación laboral."
  - id: d
    correct: true
    text:
      es: "No están sujetos los servicios prestados a las demás cooperativas por sus socios de trabajo."
  explanation:
    es: "La no sujeción cubre los servicios de los socios a su cooperativa de trabajo asociado y los de los socios de trabajo a las demás cooperativas. No alcanza a cualquier socio de cualquier cooperativa, los servicios a las cooperativas de trabajo asociado sí están cubiertos y los que la cooperativa presta a sus socios no son los que describe el número."
  citation: "art. 7.6.º LIVA"
  difficulty: 2
  tags:
  - "no sujeción"
  - "cooperativas"
# anchor: boe-a-1992-28740-art-7
- id: m03-l18-q0039
  prompt:
    es: "Según el artículo 7.7.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, no están sujetas las operaciones del artículo 9, número 1.º, y del artículo 12, números 1.º y 2.º, siempre que no se hubiese atribuido al sujeto pasivo el derecho a deducir el IVA efectivamente soportado con ocasión de:"
  options:
  - id: a
    text:
      es: "la adquisición de los servicios necesarios para realizar esas operaciones en su actividad empresarial o profesional."
  - id: b
    correct: true
    text:
      es: "la adquisición o importación de los bienes o de sus elementos componentes que sean objeto de esas operaciones."
  - id: c
    text:
      es: "la entrega posterior de esos bienes a un tercero que los adquiera como empresario."
  - id: d
    text:
      es: "la presentación de las autoliquidaciones periódicas del ejercicio en que se realicen."
  explanation:
    es: "La no sujeción del autoconsumo depende de que no se haya deducido el IVA soportado en la adquisición o importación de los bienes o de sus elementos componentes. Los servicios necesarios, la entrega posterior y la presentación de autoliquidaciones no son el criterio."
  citation: "art. 7.7.º LIVA"
  difficulty: 3
  tags:
  - "no sujeción"
  - "autoconsumo"
  - "deducción"
# anchor: boe-a-1992-28740-art-7
- id: m03-l18-q0040
  prompt:
    es: "Paula Vega, autónoma, compra en 2025 una cafetera de oficina a un particular, sin que le repercutan IVA, y por eso no deduce cuota alguna. En 2026 se la lleva a su casa para uso personal. Según los artículos 7.7.º y 9.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué consideración tiene la operación?"
  options:
  - id: a
    text:
      es: "No está sujeta, porque el valor del bien no excede del límite de 200 euros anuales."
  - id: b
    text:
      es: "Está sujeta como autoconsumo de bienes, porque el bien sale de su patrimonio empresarial hacia el personal."
  - id: c
    correct: true
    text:
      es: "No está sujeta, porque no se le atribuyó el derecho a deducir IVA soportado en la adquisición del bien."
  - id: d
    text:
      es: "Está sujeta como autoconsumo de servicios, aunque no dedujera el IVA en la adquisición."
  explanation:
    es: "El autoconsumo de bienes no está sujeto cuando no se atribuyó al sujeto pasivo el derecho a deducir el IVA soportado en la adquisición. Aquí Paula no dedujo nada, de modo que la salida del bien a su patrimonio personal queda fuera del impuesto. El autoconsumo de servicios sigue la misma regla y el límite de 200 euros es el de los objetos publicitarios."
  citation: "art. 7.7.º LIVA"
  difficulty: 3
  tags:
  - "no sujeción"
  - "autoconsumo"
  - "deducción"
# anchor: boe-a-1992-28740-art-7
- id: m03-l18-q0041
  prompt:
    es: "¿En cuál de las siguientes actividades están sujetas en todo caso las entregas de bienes y prestaciones de servicios que realicen las Administraciones Públicas, conforme al artículo 7.8.º.F) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "En los transportes de personas y bienes."
  - id: b
    text:
      es: "En la enseñanza escolar y universitaria de carácter público."
  - id: c
    text:
      es: "En la defensa nacional y la seguridad ciudadana."
  - id: d
    text:
      es: "En la expedición de certificaciones y licencias administrativas."
  explanation:
    es: "El transporte de personas y bienes está en la lista de actividades que quedan sujetas siempre, como las telecomunicaciones o las agencias de viajes. La enseñanza, la defensa y la expedición de certificaciones no figuran en esa lista."
  citation: "art. 7.8.º.F) LIVA"
  difficulty: 2
  tags:
  - "no sujeción"
  - "Administraciones Públicas"
# anchor: boe-a-1992-28740-art-7
- id: m03-l18-q0043
  prompt:
    es: "¿Cuál de las siguientes concesiones o autorizaciones administrativas queda sujeta al impuesto por excepción a la no sujeción del artículo 7.9.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "La concesión del uso de una carretera para su explotación por una empresa."
  - id: b
    correct: true
    text:
      es: "La cesión del derecho a utilizar el dominio público portuario."
  - id: c
    text:
      es: "La concesión de una licencia para construir un edificio en suelo urbano."
  - id: d
    text:
      es: "La autorización para instalar un quiosco de prensa en una vía pública."
  explanation:
    es: "Las concesiones y autorizaciones administrativas no están sujetas, salvo las que cita el precepto, entre ellas la cesión del derecho a utilizar el dominio público portuario. Una licencia de obras, un quiosco en la vía pública y el uso de una carretera no están entre esas excepciones."
  citation: "art. 7.9.º LIVA"
  difficulty: 2
  tags:
  - "no sujeción"
  - "concesiones administrativas"
