m03-l04-q08:
  key:
    anchor: wrk2-readme#acknowledgements
    sentence: Rather than measure response latency from the time that the actual transmission of a request occurred, wrk2 measures response latency from the time the transmission should have occurred according to the constant throughput configured for the run.
  wrong:
  - option: From the first byte of the request sent to the complete response received
    anchor: wrk2-readme#acknowledgements
    sentence: wrk's model, which is similar to the model found in many current load generators, computes the latency for a given request as the time from the sending of the first byte of the request to the time the complete response was received.
  - option: From individual request samples kept in a separate buffer per request
    anchor: wrk2-readme#wrk2
    sentence: wrk2 replaces wrk's individual request sample buffers with HdrHistograms.
  - option: By sending requests without waiting for earlier responses, which works for every protocol
    anchor: wrk2-readme#acknowledgements
    sentence: However, this (asynchronous) technique is normally only effective with non-blocking protocols or single-request-per-connection workloads.
