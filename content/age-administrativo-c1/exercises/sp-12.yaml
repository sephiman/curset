# anchor: boe-a-2017-12902-art-153
- id: q09
  lesson: m03-l04
  prompt:
    es: "Publicidad Meridiana, S.A. no formaliza el contrato por causas que le son imputables. ¿Qué importe se le exige como penalidad, a hacer efectivo en primer lugar contra la garantía definitiva?"
  options:
  - id: a
    correct: true
    text:
      es: "Una penalidad de 18.000 euros."
  - id: b
    text:
      es: "Una penalidad de 21.780 euros."
  - id: c
    text:
      es: "Una penalidad de 36.000 euros."
  - id: d
    text:
      es: "Una penalidad de 30.000 euros."
  explanation:
    es: "Si el adjudicatario no formaliza por causas que le son imputables, se le exige el 3 por ciento del presupuesto base de licitación, IVA excluido (art. 153.4 LCSP). El presupuesto con IVA, 726.000 euros, es 600.000 sin IVA, y el 3 por ciento son 18.000 euros. La penalidad de 21.780 euros aplica el porcentaje a la base con IVA. La de 36.000 lo aplica al valor estimado, que incluye la prórroga. La de 30.000 usa el 5 por ciento de la garantía definitiva."
  citation: "art. 153.4 LCSP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2015-11719-art-10
- id: q10
  lesson: m04-l03
  prompt:
    es: "Señale la respuesta correcta sobre el final del nombramiento de Doña Marta Pereda Linares, funcionaria interina, cuando un funcionario de carrera cubre su plaza por concurso:"
  options:
  - id: a
    text:
      es: "Se convierte en funcionaria de carrera por haber desempeñado la plaza durante más de seis meses."
  - id: b
    correct: true
    text:
      es: "La Administración formaliza de oficio la finalización de su relación de interinidad, al cubrirse la plaza."
  - id: c
    text:
      es: "Continúa hasta cumplir tres años de nombramiento, aunque la plaza ya esté cubierta por un funcionario de carrera."
  - id: d
    text:
      es: "Exige su conformidad previa, y puede oponerse mientras no se agote el plazo de su nombramiento."
  explanation:
    es: "La Administración formaliza de oficio la finalización de la interinidad por la cobertura reglada del puesto por un funcionario de carrera (art. 10.3.a TREBEP). El nombramiento de interino no da lugar a la condición de funcionario de carrera. El límite de tres años es máximo y no obliga a mantener una plaza ya cubierta. La finalización no depende de la conformidad de la interina."
  citation: "art. 10.3 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-1995-8730-art-7
- id: q11
  lesson: m04-l04
  prompt:
    es: "Según el Real Decreto 365/1995, de 10 de marzo, ¿qué puesto debe adjudicarse a Don Hugo Arce Valdés si reingresa al servicio activo cuando pierda la condición que lo ha llevado a servicios especiales?"
  options:
  - id: a
    correct: true
    text:
      es: "Uno de igual nivel y similares retribuciones, con carácter provisional y en el mismo municipio."
  - id: b
    text:
      es: "Uno de igual nivel y similares retribuciones, con carácter definitivo y en el mismo Ministerio y municipio."
  - id: c
    text:
      es: "El mismo puesto que desempeñaba, con carácter definitivo, aunque otro funcionario lo haya ocupado entretanto."
  - id: d
    text:
      es: "Cualquier vacante de su Cuerpo, en el municipio que decida el Instituto, con carácter provisional."
  explanation:
    es: "Al funcionario en servicios especiales que procede del servicio activo se le adjudica, al reingresar, un puesto según el sistema por el que obtuvo el anterior (art. 7.1 RD 365/1995). El puesto de Don Hugo era de libre designación, y le corresponde uno de igual nivel y similares retribuciones, con carácter provisional y en el mismo municipio. La opción del carácter definitivo en el mismo Ministerio y municipio es la regla de los demás puestos. La del mismo puesto, aunque esté ocupado, no existe en el artículo. La de cualquier vacante del Cuerpo deja la elección al Instituto sin base."
  citation: "art. 7.1 RD 365/1995"
  difficulty: 2
  tags:
  - "órgano"
  - "efecto"
# anchor: boe-a-1995-8730-art-19
- id: q21
  lesson: m04-l04
  prompt:
    es: "Según el Real Decreto 365/1995, de 10 de marzo, ¿qué efectos tuvo sobre Doña Sonia Cebrián Mora la situación administrativa en la que estaba antes de obtener por concurso su puesto en el Instituto?"
  options:
  - id: a
    text:
      es: "Conservó la reserva de su puesto durante dos años, sin retribuciones, y el tiempo cuenta para los trienios."
  - id: b
    correct: true
    text:
      es: "No conservó reserva de puesto ni devengó retribuciones, y ese tiempo no cuenta para los trienios."
  - id: c
    text:
      es: "Devengó sus retribuciones básicas, sin reserva de puesto, y el tiempo cuenta para los derechos pasivos."
  - id: d
    text:
      es: "Conservó un puesto en su misma localidad, con las retribuciones del Cuerpo, y el tiempo cuenta para la promoción."
  explanation:
    es: "Doña Sonia estaba en excedencia voluntaria por interés particular. Las excedencias voluntarias no producen reserva de puesto, quienes están en ellas no devengan retribuciones y ese tiempo no cuenta para promoción, trienios ni derechos pasivos (art. 19 RD 365/1995). La opción de la reserva durante dos años es la regla de la excedencia por cuidado de familiares. La de las retribuciones básicas contradice que no se devenguen retribuciones, y cuenta el tiempo para los derechos pasivos, que no computa. La del puesto en la misma localidad con las retribuciones del Cuerpo concede una reserva que el artículo niega, y cuenta el tiempo para la promoción."
  citation: "art. 19 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-1995-8729-art-48
- id: q22
  lesson: m04-l05
  prompt:
    es: "Doña Nuria Carrasco Bernal obtiene por concurso un puesto de otra unidad de la Secretaría de Estado de Turismo, y la resolución se publica en el «Boletín Oficial del Estado» el jueves, 24 de junio de 2027. Si nadie difiere su cese, ¿hasta qué fecha debe cesar en el Instituto?"
  options:
  - id: a
    text:
      es: "El domingo, 27 de junio de 2027."
  - id: b
    text:
      es: "El lunes, 28 de junio de 2027."
  - id: c
    correct: true
    text:
      es: "El martes, 29 de junio de 2027."
  - id: d
    text:
      es: "El jueves, 22 de julio de 2027."
  explanation:
    es: "El cese se efectúa dentro de los tres días hábiles siguientes a la publicación de la resolución del concurso (art. 48.1 RD 364/1995). Desde el jueves 24 de junio, los tres días hábiles son el viernes 25, el lunes 28 y el martes 29 (art. 30.2 LPAC): el martes, 29 de junio de 2027. La fecha del domingo 27 cuenta tres días naturales. La del lunes 28 cuenta el día de la publicación como primero. La del jueves 22 de julio suma veinte días hábiles, el máximo del diferimiento que concede el Subsecretario, y aquí nadie lo ha acordado (art. 48.2 RD 364/1995)."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1995-8729-art-48
- id: q14
  lesson: m04-l05
  prompt:
    es: "La resolución del concurso en el que Doña Sonia Cebrián Mora obtiene su puesto se publica en el «Boletín Oficial del Estado» el jueves, 3 de junio de 2027. Si el puesto no supone cambio de localidad, ¿hasta qué fecha puede tomar posesión?"
  options:
  - id: a
    text:
      es: "El martes, 8 de junio de 2027."
  - id: b
    text:
      es: "El viernes, 2 de julio de 2027."
  - id: c
    text:
      es: "El sábado, 3 de julio de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes, 5 de julio de 2027."
  explanation:
    es: "Si la resolución comporta el reingreso al servicio activo, el plazo de toma de posesión es de un mes y se computa desde la publicación (art. 48.1 RD 364/1995). Un mes desde el jueves 3 de junio termina el sábado 3 de julio, y pasa al primer día hábil siguiente (art. 30.5 LPAC): el lunes, 5 de julio de 2027. La fecha del martes 8 de junio aplica tres días hábiles, propios del puesto sin reingreso. La del viernes 2 de julio resta un día al mes. La del sábado 3 de julio olvida la prórroga."
  citation: "art. 48.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1985-151-art-19
- id: q15
  lesson: m04-l06
  prompt:
    es: "¿Necesita Doña Inés Beltrán Cuesta el reconocimiento de compatibilidad para formar parte del tribunal de selección, además de su puesto en el Instituto?"
  options:
  - id: a
    text:
      es: "Sí, porque cualquier segundo puesto público exige la previa y expresa autorización de compatibilidad, sin excepciones."
  - id: b
    correct: true
    text:
      es: "No, porque los tribunales calificadores de pruebas selectivas están exceptuados del régimen de incompatibilidades."
  - id: c
    text:
      es: "Sí, pero basta la autorización de la Subdirección General en la que está destinada, sin otro trámite."
  - id: d
    text:
      es: "No, porque ese régimen solo se aplica al personal que ocupa puestos de libre designación."
  explanation:
    es: "Quedan exceptuadas del régimen de incompatibilidades, entre otras actividades, la participación en tribunales calificadores de pruebas selectivas para el ingreso en las Administraciones Públicas (art. 19.c Ley 53/1984). Doña Inés no necesita reconocimiento de compatibilidad. La opción que exige autorización generaliza la regla del segundo puesto. La de la Subdirección inventa un órgano autorizante. La de los puestos de libre designación limita el ámbito de la ley sin base."
  citation: "art. 19.c) Ley 53/1984"
  difficulty: 1
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1987-28404-art-33
- id: q27
  lesson: m05-l04
  prompt:
    es: "Doña Sonia Cebrián Mora suma 149 días de servicios desde julio hasta el devengo de su paga extraordinaria de diciembre de 2027, de 1.647,00 euros por seis meses. Según el artículo 33.a) de la Ley 33/1987, de 23 de diciembre, de Presupuestos Generales del Estado para 1988, ¿qué importe percibe?"
  options:
  - id: a
    correct: true
    text:
      es: "Un total de 1.341,00 euros."
  - id: b
    text:
      es: "Un total de 1.348,37 euros."
  - id: c
    text:
      es: "Un total de 1.647,00 euros."
  - id: d
    text:
      es: "Un total de 1.372,50 euros."
  explanation:
    es: "Si el tiempo de servicios hasta el devengo no comprende los seis meses anteriores a diciembre, la paga se reduce proporcionalmente, y cada día de servicios computa por la paga de seis meses dividida entre ciento ochenta y tres días en la de diciembre (art. 33.a) Ley 33/1987). Doña Sonia solo prestó servicios desde julio: 1.647,00 / 183 = 9,00 euros al día, y 9,00 × 149 = 1.341,00 euros. La cifra de 1.348,37 euros divide entre ciento ochenta y dos, el divisor de la paga de junio. La de 1.647,00 euros paga la paga entera y olvida la reducción. La de 1.372,50 euros cuenta cinco meses de seis, en vez de los días de servicio."
  citation: "art. 33.a) Ley 33/1987"
  difficulty: 3
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1987-28404-art-34
- id: q28
  lesson: m05-l04
  prompt:
    es: "Doña Sonia Cebrián Mora toma posesión el lunes, 5 de julio de 2027, último día de su plazo. Según el artículo 34 de la Ley 33/1987, de 23 de diciembre, de Presupuestos Generales del Estado para 1988, ¿cómo se liquidan sus retribuciones fijas y mensuales de julio?"
  options:
  - id: a
    correct: true
    text:
      es: "Por los días de julio desde su toma de posesión, por ser el mes de su reingreso al servicio activo."
  - id: b
    text:
      es: "Por la mensualidad completa de julio, porque toma posesión dentro de ese mes y cobra el mes entero."
  - id: c
    text:
      es: "Desde el primer día de agosto, porque el reingreso no devenga retribuciones en el mes de la toma de posesión."
  - id: d
    text:
      es: "Por días las retribuciones complementarias, y las básicas por mensualidad completa del mes de julio."
  explanation:
    es: "Las retribuciones fijas y mensuales se pagan por mensualidades completas según la situación del funcionario el primer día hábil del mes, salvo en el mes de reingreso al servicio activo, en que se liquidan por días (art. 34.a) Ley 33/1987). Doña Sonia reingresa desde la excedencia voluntaria el lunes, 5 de julio de 2027, así que cobra por los días de julio desde esa fecha. La mensualidad completa aplica la regla general a un mes de reingreso. La de empezar a cobrar en agosto niega la retribución de un mes que la ley manda liquidar por días. La de separar básicas y complementarias aplica la liquidación por días a unas y no a otras, y el artículo las trata igual."
  citation: "art. 34.a) Ley 33/1987"
  difficulty: 2
  tags:
  - "requisito"
  - "retribuciones"
# anchor: boe-a-2003-21614-art-53
- id: q18
  lesson: m05-l02
  prompt:
    es: "Según el artículo 53.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿por qué importe puede el Instituto tramitar ya la generación de crédito para la campaña conjunta?"
  options:
  - id: a
    text:
      es: "Por un importe de 80.000 euros."
  - id: b
    text:
      es: "Por un importe de 160.000 euros."
  - id: c
    text:
      es: "Por un importe de 110.000 euros."
  - id: d
    correct: true
    text:
      es: "Por un importe de 130.000 euros."
  explanation:
    es: "En los organismos autónomos, la generación por aportaciones de terceros cabe una vez reconocido el derecho o con un compromiso firme de aportación, si el ingreso se prevé en el propio ejercicio (art. 53.3 LGP). Cuentan los 80.000 euros ya ingresados y los 50.000 comprometidos para octubre de 2027: 130.000 euros. Los 80.000 dejan fuera el compromiso firme. Los 160.000 suman también los 30.000 de 2028, que no se ingresan en el ejercicio. Los 110.000 suman ese compromiso de 2028 y dejan fuera el de octubre."
  citation: "art. 53.3 LGP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2003-21614-art-47
- id: q19
  lesson: m05-l02
  prompt:
    es: "Según el artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿en cuánto excede la anualidad de 2028 del contrato publicitario el límite máximo que puede comprometerse para ese ejercicio?"
  options:
  - id: a
    correct: true
    text:
      es: "La anualidad de 2028 excede el límite en 96.500 euros."
  - id: b
    text:
      es: "La anualidad de 2028 excede el límite en 2.000 euros."
  - id: c
    text:
      es: "La anualidad de 2028 excede el límite en 160.500 euros."
  - id: d
    text:
      es: "La anualidad de 2028 excede el límite en 224.500 euros."
  explanation:
    es: "El gasto del ejercicio inmediato siguiente no puede exceder del 70 por ciento del crédito inicial (art. 47.2 LGP): 70 % de 640.000 son 448.000 euros. El contrato dura doce meses desde el 1 de octubre: tres a 2027 y nueve a 2028, es decir, 544.500 euros con IVA en 2028. El exceso es 544.500 − 448.000 = 96.500 euros. El exceso de 2.000 euros calcula la anualidad sin IVA. El de 160.500 aplica el 60 por ciento, propio del segundo ejercicio posterior. El de 224.500 aplica el 50 por ciento, propio del tercero y el cuarto."
  citation: "art. 47.2 LGP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2003-21614-art-73
- id: q20
  lesson: m05-l03
  prompt:
    es: "Para que el Instituto reconozca la obligación a favor de Publicidad Meridiana, S.A., por un gasto ya aprobado y comprometido, la ley exige previamente:"
  options:
  - id: a
    correct: true
    text:
      es: "La acreditación documental ante el órgano competente de la realización de la prestación."
  - id: b
    text:
      es: "La ordenación del pago por el Director General del Tesoro y Política Financiera."
  - id: c
    text:
      es: "El pago material de la factura, que solo se reconoce una vez abonada."
  - id: d
    text:
      es: "El informe favorable del Tribunal de Cuentas sobre el gasto aprobado y comprometido."
  explanation:
    es: "El reconocimiento de obligaciones se produce previa acreditación documental ante el órgano competente de la realización de la prestación o del derecho del acreedor (art. 73.4 LGP). La ordenación del pago es una fase posterior. El pago material cierra la secuencia. El Tribunal de Cuentas ejerce un control externo y no interviene en el reconocimiento."
  citation: "art. 73.4 LGP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "requisito"
