m03-l02-q15:
  key:
    anchor: jls-17#jls-17.4.5
    sentence: When a program contains two conflicting accesses (§17.4.1) that are not ordered by a happens-before relationship, it is said to contain a data race.
  wrong:
  - option: When two threads only read the same variable without any synchronization between them
    anchor: jls-17#jls-17.4.1
    sentence: Two accesses to (reads of or writes to) the same variable are said to be conflicting if at least one of the accesses is a write.
  - option: When a volatile field is written in one thread and read in another thread later
    anchor: jls-17#jls-17.4.5
    sentence: A write to a volatile field (§8.3.1.4) happens-before every subsequent read of that field.
  - option: When a local variable is used by two threads
    anchor: jls-17#jls-17.4.1
    sentence: Local variables (§14.4), formal method parameters (§8.4.1), and exception handler parameters (§14.20) are never shared between threads and are unaffected by the memory model.
