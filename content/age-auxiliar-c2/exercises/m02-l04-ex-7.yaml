# anchor: boe-a-2015-10565-art-53
- id: m02-l04-q164
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, quienes se relacionan con las Administraciones a través de medios electrónicos tienen derecho a consultar en el Punto de Acceso General electrónico:"
  options:
  - id: a
    correct: true
    text:
      es: "El estado de tramitación de los procedimientos en que sean interesados."
  - id: b
    text:
      es: "Los certificados electrónicos que hayan solicitado a la Administración."
  - id: c
    text:
      es: "El historial de las sedes electrónicas que han utilizado."
  - id: d
    text:
      es: "La relación de sus representantes legales inscritos en los registros."
  explanation:
    es: "El derecho de consulta en el Punto de Acceso General alcanza al estado de tramitación de los procedimientos en que se es interesado. Los certificados solicitados, los representantes inscritos y el historial de sedes no son su objeto."
  citation: "art. 53.1.a) LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-7
- id: m02-l04-q165
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, en la sede electrónica del Punto de Acceso General de la Administración General del Estado está alojada:"
  options:
  - id: a
    text:
      es: "El Registro de Funcionarios Habilitados."
  - id: b
    correct: true
    text:
      es: "La Dirección Electrónica Habilitada única."
  - id: c
    text:
      es: "El directorio de aplicaciones reutilizables."
  - id: d
    text:
      es: "El archivo electrónico único de la Administración."
  explanation:
    es: "En esa sede está alojada la Dirección Electrónica Habilitada única. El registro de funcionarios habilitados, el directorio de aplicaciones y el archivo único no se alojan allí."
  citation: "art. 7.4 RD 203/2021"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-8
- id: m02-l04-q166
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, entre las funcionalidades de la Carpeta Ciudadana está conocer:"
  options:
  - id: a
    text:
      es: "Qué datos de terceros constan en el archivo electrónico único."
  - id: b
    text:
      es: "Qué funcionarios están habilitados para firmar en su nombre."
  - id: c
    text:
      es: "Qué sedes electrónicas ha utilizado durante el último año."
  - id: d
    correct: true
    text:
      es: "Qué datos del interesado obran en poder del sector público estatal."
  explanation:
    es: "La Carpeta permite conocer qué datos del interesado obran en poder del sector público estatal. Los datos de terceros, los funcionarios habilitados y el historial de sedes no son sus funcionalidades."
  citation: "art. 8.2.c) RD 203/2021"
  difficulty: 1
  tags:
  - "concepto"
