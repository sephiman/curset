  - option: '`HttpOnly` only, without `Secure`'
    anchor: mcp-security-best-practices#required-protections
    sentence: Set Secure, HttpOnly, and SameSite=Lax attributes
    exclusive: true
  - option: '`Secure` with `SameSite=Lax`, readable from scripts'
    anchor: mcp-security-best-practices#required-protections
    sentence: Set Secure, HttpOnly, and SameSite=Lax attributes
    exclusive: true
m09-case-g-q08:
  key:
    anchor: mcp-security-best-practices#required-protections
    sentence: Ensure state values are single-use (delete after validation) and have a short expiration time (e.g., 10 minutes)
  wrong:
  - option: Reusable for 24 hours, then deleted by a nightly job
    anchor: mcp-security-best-practices#required-protections
    sentence: Ensure state values are single-use (delete after validation) and have a short expiration time (e.g., 10 minutes)
    exclusive: true
  - option: Reusable until the user logs out of the proxy
    anchor: mcp-security-best-practices#required-protections
    sentence: Ensure state values are single-use (delete after validation) and have a short expiration time (e.g., 10 minutes)
    exclusive: true
  - option: Single-use, but valid for a full day
    anchor: mcp-security-best-practices#required-protections
    sentence: Ensure state values are single-use (delete after validation) and have a short expiration time (e.g., 10 minutes)
    exclusive: true
m09-case-g-q09:
  key:
    anchor: owasp-llm-top10-prompt-injection#indirect-prompt-injections
    sentence: Indirect prompt injections occur when an LLM accepts input from external sources, such as websites or files.
  wrong:
  - option: Direct prompt injection by the user
    anchor: owasp-llm-top10-prompt-injection#main
    sentence: A Prompt Injection Vulnerability occurs when user prompts alter the LLM’s behavior or output in unintended ways.
  - option: Jailbreaking of the safety protocols
    anchor: owasp-llm-top10-prompt-injection#main
    sentence: Jailbreaking is a form of prompt injection where the attacker provides inputs that cause the model to disregard its safety protocols entirely.
  - option: Token passthrough in an MCP server
    anchor: mcp-security-best-practices#token-passthrough
    sentence: “Token passthrough” is an anti-pattern where an MCP server accepts tokens from an MCP client without validating that the tokens were properly issued to the MCP server and passes them through to the downstream API.
m09-case-g-q10:
  key:
    anchor: owasp-llm-top10-prompt-injection#main
    sentence: While techniques like Retrieval Augmented Generation (RAG) and fine-tuning aim to make LLM outputs more relevant and accurate, research shows that they do not fully mitigate prompt injection vulnerabilities.
  wrong:
  - option: RAG fully mitigates it, but fine-tuning does not
    anchor: owasp-llm-top10-prompt-injection#main
    sentence: While techniques like Retrieval Augmented Generation (RAG) and fine-tuning aim to make LLM outputs more relevant and accurate, research shows that they do not fully mitigate prompt injection vulnerabilities.
    exclusive: true
  - option: Fine-tuning fully mitigates it, but RAG does not
    anchor: owasp-llm-top10-prompt-injection#main
    sentence: While techniques like Retrieval Augmented Generation (RAG) and fine-tuning aim to make LLM outputs more relevant and accurate, research shows that they do not fully mitigate prompt injection vulnerabilities.
    exclusive: true
  - option: Together they fully mitigate it
    anchor: owasp-llm-top10-prompt-injection#main
    sentence: While techniques like Retrieval Augmented Generation (RAG) and fine-tuning aim to make LLM outputs more relevant and accurate, research shows that they do not fully mitigate prompt injection vulnerabilities.
    exclusive: true
m09-case-g-q11:
  key:
    anchor: owasp-llm-sensitive-disclosure#1-enforce-strict-access-controls
    sentence: Limit access to sensitive data based on the principle of least privilege.
  wrong:
  - option: Rely on system prompt restrictions as the only control
    anchor: owasp-llm-sensitive-disclosure#main
    sentence: However, such restrictions may not always be honored and could be bypassed via prompt injection or other methods.
  - option: Skip data sanitization because user data never reaches training
    anchor: owasp-llm-sensitive-disclosure#main
    sentence: To reduce this risk, LLM applications should perform adequate data sanitization to prevent user data from entering the training model.
  - option: Offer no way for users to opt out of training
    anchor: owasp-llm-sensitive-disclosure#main
    sentence: Application owners should also provide clear Terms of Use policies, allowing users to opt out of having their data included in the training model.
m09-case-g-q12:
  key:
    anchor: mcp-authorization#protocol-requirements
    sentence: Implementations using an HTTP-based transport SHOULD conform to this specification.
  wrong:
  - option: It should retrieve credentials from the environment
    anchor: mcp-authorization#protocol-requirements
    sentence: Implementations using an STDIO transport SHOULD NOT follow this specification, and instead retrieve credentials from the environment.
  - option: It must implement authorization, which is mandatory
    anchor: mcp-authorization#protocol-requirements
    sentence: Authorization is OPTIONAL for MCP implementations.
  - option: It should follow only the security practices of its own protocol
    anchor: mcp-authorization#protocol-requirements
    sentence: Implementations using alternative transports MUST follow established security best practices for their protocol.
