# anchor: boe-a-2015-10565-art-24
- id: m01-l11-q158
  prompt:
    es: "Según el artículo 24.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué sentido tiene el silencio en los procedimientos relativos al ejercicio del derecho de petición?"
  options:
  - id: a
    correct: true
    text:
      es: "Desestimatorio, como en los procedimientos de responsabilidad patrimonial."
  - id: b
    text:
      es: "Estimatorio, como en la generalidad de los procedimientos iniciados a solicitud."
  - id: c
    text:
      es: "Estimatorio, salvo que la petición se dirija a la Administración General del Estado."
  - id: d
    text:
      es: "Ninguno: el vencimiento del plazo produce la caducidad del procedimiento."
  explanation:
    es: "El artículo 24.1 dice que «el silencio tendrá efecto desestimatorio en los procedimientos relativos al ejercicio del derecho de petición», y también en los de responsabilidad patrimonial. El derecho de petición no sigue la regla general del silencio estimatorio. La ley no distingue según la Administración destinataria. La caducidad es el efecto de ciertos procedimientos de oficio, no de este."
  citation: "art. 24.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-10565-art-24
- id: m01-l11-q159
  prompt:
    es: "Según el artículo 24.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué efecto tiene no resolver en plazo la alzada contra la desestimación por silencio de una solicitud?"
  options:
  - id: a
    text:
      es: "La alzada se entenderá desestimada, como en todos los procedimientos de impugnación de actos."
  - id: b
    correct: true
    text:
      es: "La alzada se entenderá estimada, salvo en las materias en que el artículo 24.1 hace desestimatorio el silencio."
  - id: c
    text:
      es: "La alzada se entenderá estimada en todo caso, cualquiera que sea la materia de la solicitud."
  - id: d
    text:
      es: "La alzada se entenderá caducada, y el interesado podrá presentar una nueva solicitud."
  explanation:
    es: "El artículo 24.1 dice que, cuando la alzada se interpuso contra la desestimación por silencio de una solicitud, «se entenderá estimado el mismo» si no se dicta y notifica resolución en plazo, «siempre que no se refiera a las materias enumeradas en el párrafo anterior». No rige aquí la regla general de la impugnación, que es desestimatoria. La estimación tampoco opera en todo caso: no alcanza al derecho de petición ni a la responsabilidad patrimonial, entre otras materias. La ley no prevé caducidad."
  citation: "art. 24.1 LPAC"
  difficulty: 3
  tags:
  - "efecto"
  - "excepción"
# anchor: boe-a-2015-10565-art-24
- id: m01-l11-q160
  prompt:
    es: "De acuerdo con el artículo 24.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los casos de estimación por silencio administrativo, la resolución expresa posterior a la producción del acto:"
  options:
  - id: a
    text:
      es: "Se adoptará sin vinculación alguna al sentido del silencio."
  - id: b
    text:
      es: "Solo podrá dictarse previa declaración de lesividad del acto presunto."
  - id: c
    correct: true
    text:
      es: "Solo podrá dictarse de ser confirmatoria del mismo."
  - id: d
    text:
      es: "No podrá dictarse, porque el silencio ya puso fin al procedimiento."
  explanation:
    es: "El artículo 24.3.a) dice que, tras la estimación por silencio, la resolución expresa posterior «sólo podrá dictarse de ser confirmatoria del mismo». La resolución sin vinculación al sentido del silencio corresponde a la desestimación (art. 24.3.b). La lesividad no es el cauce para dictarla. La obligación de resolver subsiste (art. 21.1), así que la resolución sí puede dictarse, siempre confirmatoria."
  citation: "art. 24.3.a) LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-24
- id: m01-l11-q161
  prompt:
    es: "Según el artículo 24.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿quién expide el certificado acreditativo del silencio producido y en qué plazo?"
  options:
  - id: a
    correct: true
    text:
      es: "El órgano competente para resolver, de oficio, en quince días desde que expire el plazo máximo para resolver."
  - id: b
    text:
      es: "El órgano competente para resolver, solo a petición del interesado, en diez días desde que la reciba."
  - id: c
    text:
      es: "El superior jerárquico del órgano competente, de oficio, en quince días desde que expire el plazo máximo."
  - id: d
    text:
      es: "La oficina de asistencia en materia de registros, de oficio, en un mes desde que expire el plazo máximo."
  explanation:
    es: "El artículo 24.4 dice que el certificado «se expedirá de oficio por el órgano competente para resolver en el plazo de quince días desde que expire el plazo máximo para resolver». No hace falta petición, aunque el interesado puede pedirlo en cualquier momento. No lo expide el superior jerárquico ni la oficina de registro, y el plazo no es de diez días ni de un mes."
  citation: "art. 24.4 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-2015-10565-art-25
- id: m01-l11-q163
  prompt:
    es: "De acuerdo con el artículo 25.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en un procedimiento de oficio del que pudieran derivarse derechos, el vencimiento del plazo sin resolución expresa:"
  options:
  - id: a
    text:
      es: "Permite a los interesados que hubieren comparecido entender estimadas sus pretensiones por silencio."
  - id: b
    correct: true
    text:
      es: "Permite a los interesados que hubieren comparecido entender desestimadas sus pretensiones por silencio."
  - id: c
    text:
      es: "Produce la caducidad del procedimiento, y la resolución que la declare ordenará el archivo de las actuaciones."
  - id: d
    text:
      es: "Permite a cualquier persona, aunque no haya comparecido, entender estimadas sus pretensiones."
  explanation:
    es: "El artículo 25.1.a) dice que en estos procedimientos «los interesados que hubieren comparecido podrán entender desestimadas sus pretensiones por silencio administrativo». El silencio no es estimatorio, ni para los comparecidos ni para quien no compareció. La caducidad es el efecto en los procedimientos sancionadores o de intervención con efectos desfavorables (art. 25.1.b)."
  citation: "art. 25.1.a) LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-58
- id: m01-l11-q164
  prompt:
    es: "De acuerdo con el artículo 58 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los procedimientos se iniciarán de oficio por acuerdo del órgano competente:"
  options:
  - id: a
    text:
      es: "Por propia iniciativa o como consecuencia de orden superior, a petición razonada de otros órganos o a solicitud del interesado."
  - id: b
    text:
      es: "Por propia iniciativa o como consecuencia de orden superior, o por denuncia, pero nunca a petición de otros órganos."
  - id: c
    correct: true
    text:
      es: "Por propia iniciativa o como consecuencia de orden superior, a petición razonada de otros órganos o por denuncia."
  - id: d
    text:
      es: "Solo por propia iniciativa o por denuncia, que obliga en todo caso a iniciar el procedimiento."
  explanation:
    es: "El artículo 58 dice que la iniciación de oficio se acuerda «bien por propia iniciativa o como consecuencia de orden superior, a petición razonada de otros órganos o por denuncia». La solicitud del interesado abre la iniciación a solicitud, no la de oficio. La petición razonada de otros órganos sí está en la lista, y la orden superior también."
  citation: "art. 58 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-56
- id: m01-l11-q165
  prompt:
    es: "Según el artículo 56.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en qué plazo se dicta el acuerdo de iniciación que se pronuncia sobre medidas provisionales adoptadas antes del procedimiento?"
  options:
  - id: a
    correct: true
    text:
      es: "Dentro de los quince días siguientes a su adopción."
  - id: b
    text:
      es: "Dentro de los diez días siguientes a su adopción."
  - id: c
    text:
      es: "Dentro del mes siguiente a su adopción."
  - id: d
    text:
      es: "Dentro de los tres días siguientes a su adopción."
  explanation:
    es: "El artículo 56.2 dice que las medidas se confirman, modifican o levantan en el acuerdo de iniciación, «que deberá efectuarse dentro de los quince días siguientes a su adopción». El plazo no es de diez días, ni de tres, ni de un mes. Si no se inicia el procedimiento en ese plazo, las medidas quedan sin efecto."
  citation: "art. 56.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-56
- id: m01-l11-q166
  prompt:
    es: "Por urgencia inaplazable, el órgano competente adopta una medida provisional el lunes 1 de febrero de 2027, antes de iniciar el procedimiento. Sin festivos en el periodo, ¿cuál es el último día para dictar el acuerdo de iniciación?"
  options:
  - id: a
    text:
      es: "El lunes 15 de febrero de 2027."
  - id: b
    text:
      es: "El martes 16 de febrero de 2027."
  - id: c
    text:
      es: "El viernes 19 de febrero de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes 22 de febrero de 2027."
  explanation:
    es: "El acuerdo de iniciación debe efectuarse dentro de los quince días siguientes a la adopción de la medida (art. 56.2). Son días hábiles (art. 30.2) desde el martes 2 de febrero. Excluidos sábados y domingos, el decimoquinto día hábil es el lunes 22 de febrero de 2027. El lunes 15 de febrero es el décimo día hábil. El martes 16 de febrero sale de contar quince días naturales. El viernes 19 de febrero cuenta catorce días hábiles."
  citation: "art. 56.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-63
- id: m01-l11-q167
  prompt:
    es: "Según el artículo 63.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los procedimientos de naturaleza sancionadora, ¿a quién se encomiendan la fase instructora y la sancionadora?"
  options:
  - id: a
    text:
      es: "A un mismo órgano, que instruye y después resuelve el procedimiento."
  - id: b
    correct: true
    text:
      es: "A órganos distintos, con la debida separación entre ambas fases."
  - id: c
    text:
      es: "Al órgano que resuelve la instructora, y a su superior jerárquico la sancionadora."
  - id: d
    text:
      es: "A órganos distintos solo cuando la infracción imputada sea muy grave."
  explanation:
    es: "El artículo 63.1 exige «la debida separación entre la fase instructora y la sancionadora, que se encomendará a órganos distintos». Un mismo órgano no puede hacer las dos. La ley no atribuye la instrucción al órgano que resuelve, y la separación rige en todo procedimiento sancionador, no solo en las infracciones muy graves."
  citation: "art. 63.1 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-68
- id: m01-l11-q169
  prompt:
    es: "De acuerdo con el artículo 68.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el plazo de subsanación podrá ampliarse hasta cinco días si la aportación de documentos presenta dificultades especiales:"
  options:
  - id: a
    text:
      es: "Salvo en los procedimientos sancionadores o de responsabilidad patrimonial."
  - id: b
    correct: true
    text:
      es: "Salvo en los procedimientos selectivos o de concurrencia competitiva."
  - id: c
    text:
      es: "Solo en los procedimientos selectivos o de concurrencia competitiva."
  - id: d
    text:
      es: "Salvo en los procedimientos tramitados de manera simplificada o de urgencia."
  explanation:
    es: "La ampliación cabe «siempre que no se trate de procedimientos selectivos o de concurrencia competitiva» (art. 68.2). Esos procedimientos son la excepción, no el único caso en que se amplía. La ley no excluye los procedimientos sancionadores, los de responsabilidad patrimonial ni los de tramitación simplificada o de urgencia."
  citation: "art. 68.2 LPAC"
  difficulty: 2
  tags:
  - "excepción"
  - "plazo"
# anchor: boe-a-2015-10565-art-68
- id: m01-l11-q170
  prompt:
    es: "Señale la respuesta correcta sobre la ampliación del plazo de subsanación de la solicitud, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Puede ampliarse hasta cinco días, a petición del interesado o a iniciativa del órgano."
  - id: b
    text:
      es: "Puede ampliarse hasta cinco días, pero solo a petición del interesado."
  - id: c
    text:
      es: "Puede ampliarse hasta diez días, a petición del interesado o a iniciativa del órgano."
  - id: d
    text:
      es: "Puede ampliarse hasta la mitad del plazo, pero solo a iniciativa del órgano competente."
  explanation:
    es: "El artículo 68.2 permite ampliar el plazo «hasta cinco días, a petición del interesado o a iniciativa del órgano». No hace falta que lo pida el interesado: el órgano puede acordarlo por sí. La ampliación no llega a diez días. La regla de la mitad es la de la ampliación general del artículo 32.1."
  citation: "art. 68.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-2015-10565-art-74
- id: m01-l11-q171
  prompt:
    es: "¿Cuál de las siguientes cuestiones incidentales suspende la tramitación del procedimiento, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La que se refiera a la nulidad de las actuaciones del propio procedimiento."
  - id: b
    correct: true
    text:
      es: "La recusación de la autoridad o del personal que interviene en el procedimiento."
  - id: c
    text:
      es: "La que plantee la falta de acreditación de la representación del interesado."
  - id: d
    text:
      es: "La que se suscite sobre la acumulación del procedimiento con otro conexo."
  explanation:
    es: "El artículo 74 dice que las cuestiones incidentales, «incluso las que se refieran a la nulidad de actuaciones, no suspenderán la tramitación del mismo, salvo la recusación». Solo la recusación suspende. La nulidad de actuaciones está nombrada como cuestión que no suspende. La representación y la acumulación no son excepciones."
  citation: "art. 74 LPAC"
  difficulty: 1
  tags:
  - "efecto"
  - "excepción"
