# anchor: boe-a-2003-23186-art-120
- id: m03-l07-q0032
  prompt:
    es: "Construcciones Valdés, S.L. presentó en plazo una autoliquidación a ingresar. Terminado ya el plazo de presentación, solicita el martes 10 de septiembre de 2024 su rectificación y la Administración reconoce una devolución de 3.000 euros derivada de la normativa del tributo, cuyo pago ordena el lunes 14 de julio de 2025 con retraso imputable a ella. Según el artículo 120.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿durante qué periodo se devenga el interés de demora?"
  options:
  - id: a
    correct: true
    text:
      es: "Desde el 10 de marzo de 2025 hasta el 14 de julio de 2025."
  - id: b
    text:
      es: "Desde la fecha de presentación de la autoliquidación hasta el 14 de julio de 2025."
  - id: c
    text:
      es: "Desde el 10 de septiembre de 2024 hasta el 14 de julio de 2025."
  - id: d
    text:
      es: "Desde el 10 de marzo de 2025 hasta la notificación del acuerdo de devolución."
  explanation:
    es: "Si el plazo de presentación ya había concluido, los seis meses se cuentan desde la solicitud de rectificación (art. 120.3 LGT): terminan el 10 de marzo de 2025 (art. 30.4 LPAC). El interés se abona desde entonces hasta la fecha en que se ordena el pago, el 14 de julio de 2025 (art. 31.2). No corre desde la solicitud ni desde la presentación de la autoliquidación, y el fin del devengo no es la notificación del acuerdo."
  citation: "art. 120.3 LGT"
  difficulty: 3
  tags:
  - "rectificación"
  - "interés de demora"
  - "cómputo"
# anchor: boe-a-2007-15984-art-131
- id: m03-l07-q0034
  prompt:
    es: "Conforme al artículo 131.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, cuando para efectuar la devolución se hubieran solicitado garantías de acuerdo con la ley, la ejecución de la devolución quedará condicionada a:"
  options:
  - id: a
    text:
      es: "la resolución firme de los recursos pendientes."
  - id: b
    text:
      es: "la autorización previa del órgano de recaudación competente."
  - id: c
    correct: true
    text:
      es: "la aportación de las garantías solicitadas."
  - id: d
    text:
      es: "el transcurso de seis meses desde el reconocimiento del derecho."
  explanation:
    es: "La ejecución de la devolución queda condicionada a que se aporten las garantías solicitadas conforme a la ley (art. 131.1). El precepto no exige firmeza de recursos, plazo de espera ni autorización del órgano de recaudación."
  citation: "art. 131.1 RGAT"
  difficulty: 1
  tags:
  - "ejecución de devoluciones"
  - "garantías"
# anchor: boe-a-2007-15984-art-131
- id: m03-l07-q0036
  prompt:
    es: "De acuerdo con el artículo 131.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, cuando el derecho a la devolución se transmita a los sucesores, se atenderá a la normativa específica que determine:"
  options:
  - id: a
    correct: true
    text:
      es: "los titulares del derecho y la cuantía que a cada uno corresponda."
  - id: b
    text:
      es: "los herederos que aceptan la herencia y el valor de los bienes recibidos."
  - id: c
    text:
      es: "el órgano competente para ejecutar la devolución y el plazo para abonarla."
  - id: d
    text:
      es: "el importe de la garantía que deban aportar los sucesores del obligado."
  explanation:
    es: "En la sucesión del derecho a la devolución se aplica la normativa específica, que fija quiénes son los titulares y cuánto corresponde a cada uno. El órgano, el valor de lo heredado y las garantías no son el contenido que el apartado 4 remite a esa normativa."
  citation: "art. 131.4 RGAT"
  difficulty: 2
  tags:
  - "ejecución de devoluciones"
  - "sucesores"
# anchor: boe-a-2007-15984-art-131
- id: m03-l07-q0037
  prompt:
    es: "Conforme al artículo 131.5 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre la transmisión del derecho a una devolución tributaria por actos o negocios entre particulares, salvo el caso de los sucesores:"
  options:
  - id: a
    text:
      es: "Surte efectos ante la Administración tributaria si consta en documento público."
  - id: b
    text:
      es: "Surte efectos ante la Administración tributaria desde que el cesionario lo comunica."
  - id: c
    text:
      es: "Solo surte efectos ante la Administración tributaria cuando la devolución se paga por transferencia."
  - id: d
    correct: true
    text:
      es: "No surte efectos ante la Administración tributaria."
  explanation:
    es: "Fuera de la sucesión, la cesión del derecho a la devolución entre particulares no surte efectos ante la Administración (art. 131.5). Ni la comunicación del cesionario ni el documento público ni el medio de pago cambian esa regla."
  citation: "art. 131.5 RGAT"
  difficulty: 3
  tags:
  - "ejecución de devoluciones"
# anchor: boe-a-2003-23186-art-120
- id: m03-l07-q0038
  prompt:
    es: "De acuerdo con el artículo 120.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el obligado tributario que considera que una autoliquidación ha perjudicado sus intereses legítimos:"
  options:
  - id: a
    correct: true
    text:
      es: "Puede instar su rectificación y, cuando lo establezca la normativa propia del tributo, debe hacerlo mediante una autoliquidación rectificativa."
  - id: b
    text:
      es: "Solo puede rectificarla mediante una autoliquidación rectificativa, sea cual sea el tributo."
  - id: c
    text:
      es: "Puede instar la rectificación únicamente si la autoliquidación resultó a ingresar por un importe excesivo."
  - id: d
    text:
      es: "Solo puede instar la rectificación cuando la Administración haya iniciado una comprobación."
  explanation:
    es: "La regla general es instar la rectificación por el procedimiento reglamentario. La autoliquidación rectificativa se exige solo cuando lo establezca la normativa propia del tributo. No hace falta una comprobación previa y el artículo no limita la rectificación a los ingresos excesivos."
  citation: "art. 120.3 LGT"
  difficulty: 2
  tags:
  - "rectificación"
# anchor: boe-a-2003-23186-art-120
- id: m03-l07-q0040
  prompt:
    es: "De acuerdo con el artículo 120.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si la rectificación de una autoliquidación origina una devolución derivada de la normativa del tributo, el plazo de seis meses comienza a contarse desde el fin del plazo de presentación o, si este había concluido, desde:"
  options:
  - id: a
    text:
      es: "la notificación de la resolución que acuerde la rectificación."
  - id: b
    correct: true
    text:
      es: "la presentación de la solicitud de rectificación o de la autoliquidación rectificativa."
  - id: c
    text:
      es: "el ingreso de la cantidad que el obligado considera indebida."
  - id: d
    text:
      es: "el requerimiento de documentación que haga el órgano competente."
  explanation:
    es: "Concluido ya el plazo de presentación, los seis meses corren desde la presentación de la solicitud de rectificación o de la autoliquidación rectificativa. La resolución, el ingreso inicial y el requerimiento no son el punto de partida."
  citation: "art. 120.3 LGT"
  difficulty: 2
  tags:
  - "rectificación"
  - "interés de demora"
# anchor: boe-a-2007-15984-art-126
- id: m03-l07-q0043
  prompt:
    es: "De acuerdo con el artículo 126.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, la solicitud de rectificación de una autoliquidación solo podrá hacerse una vez presentada esta y antes de que la Administración haya practicado:"
  options:
  - id: a
    text:
      es: "la liquidación definitiva o, en su defecto, antes de que transcurran seis meses desde la presentación."
  - id: b
    correct: true
    text:
      es: "la liquidación definitiva o, en su defecto, antes de que haya prescrito su derecho a determinar la deuda o el derecho a solicitar la devolución."
  - id: c
    text:
      es: "la liquidación provisional o, en su defecto, antes de que concluya el plazo de pago en periodo voluntario."
  - id: d
    text:
      es: "el requerimiento de la documentación o, en su defecto, antes de que se abra un procedimiento sancionador."
  explanation:
    es: "El límite temporal es la liquidación definitiva o, si no la hay, la prescripción del derecho de la Administración a liquidar o del obligado a pedir la devolución. La liquidación provisional no cierra la vía por sí sola, los seis meses no son un límite y el requerimiento o el procedimiento sancionador tampoco lo fijan."
  citation: "art. 126.2 RGAT"
  difficulty: 3
  tags:
  - "rectificación"
  - "iniciación"
# anchor: boe-a-2007-15984-art-126
- id: m03-l07-q0044
  prompt:
    es: "Conforme al artículo 126.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre la solicitud de rectificación de una autoliquidación cuando se tramita un procedimiento de comprobación o investigación:"
  options:
  - id: a
    text:
      es: "Puede solicitarse, pero la comprobación o investigación queda suspendida hasta su resolución."
  - id: b
    text:
      es: "Puede solicitarse en cualquier momento, aunque el procedimiento incluya esa obligación tributaria."
  - id: c
    text:
      es: "No puede solicitarse mientras se tramite cualquier procedimiento de gestión, sea cual sea su objeto."
  - id: d
    correct: true
    text:
      es: "No puede solicitarse si el objeto del procedimiento incluye la obligación tributaria a la que se refiere la autoliquidación presentada."
  explanation:
    es: "La solicitud queda vedada mientras haya un procedimiento de comprobación o investigación cuyo objeto incluya la obligación a que se refiere la autoliquidación. No es libre en todo caso, no se extiende a cualquier procedimiento y no suspende la comprobación. El obligado conserva el derecho a alegar y presentar documentos en ese procedimiento."
  citation: "art. 126.2 RGAT"
  difficulty: 3
  tags:
  - "rectificación"
  - "iniciación"
# anchor: boe-a-2007-15984-art-126
- id: m03-l07-q0045
  prompt:
    es: "Según el artículo 126.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, si la Administración ha practicado una liquidación provisional, el obligado puede solicitar la rectificación de su autoliquidación únicamente si aquella ha sido practicada por:"
  options:
  - id: a
    text:
      es: "la misma consideración o motivo que se invoque en la solicitud del obligado."
  - id: b
    text:
      es: "un procedimiento de comprobación limitada y no de verificación de datos."
  - id: c
    text:
      es: "un órgano distinto del competente para resolver la solicitud de rectificación de la autoliquidación."
  - id: d
    correct: true
    text:
      es: "una consideración o motivo distinto del que se invoque en la solicitud del obligado."
  explanation:
    es: "Tras una liquidación provisional, solo cabe pedir la rectificación si el motivo de aquella es distinto del que se invoca. Si coincide, la solicitud no procede. El órgano que liquidó o el procedimiento seguido no cambian la regla."
  citation: "art. 126.3 RGAT"
  difficulty: 2
  tags:
  - "rectificación"
  - "iniciación"
# anchor: boe-a-2007-15984-art-127
- id: m03-l07-q0046
  prompt:
    es: "De acuerdo con el artículo 127.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, finalizadas las actuaciones del procedimiento de rectificación de autoliquidaciones, se notifica al interesado la propuesta de resolución para que alegue lo que convenga a su derecho en el plazo de:"
  options:
  - id: a
    correct: true
    text:
      es: "quince días, contados a partir del día siguiente al de la notificación de la propuesta."
  - id: b
    text:
      es: "un mes, contado a partir del día siguiente al de la notificación de la propuesta."
  - id: c
    text:
      es: "diez días, contados a partir del día siguiente al de la notificación de la propuesta."
  - id: d
    text:
      es: "cinco días hábiles, contados a partir del día siguiente al de la notificación de la propuesta."
  explanation:
    es: "El plazo de alegaciones es de 15 días desde el día siguiente a la notificación de la propuesta (art. 127.4). Diez días son los de las alegaciones en la verificación de datos y en la comprobación limitada. Un mes y cinco días no son plazos de este trámite."
  citation: "art. 127.4 RGAT"
  difficulty: 1
  tags:
  - "rectificación"
  - "plazos"
# anchor: boe-a-2007-15984-art-127
- id: m03-l07-q0047
  prompt:
    es: "Conforme al artículo 127.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre el trámite de propuesta de resolución en el procedimiento de rectificación de autoliquidaciones:"
  options:
  - id: a
    text:
      es: "Si la rectificación acordada no coincide con la solicitada, se notifica sin más trámite la liquidación."
  - id: b
    text:
      es: "Si la rectificación acordada coincide con la solicitada, debe abrirse siempre un plazo de alegaciones."
  - id: c
    correct: true
    text:
      es: "Si la rectificación acordada coincide con la solicitada, se notifica sin más trámite la liquidación que se practique."
  - id: d
    text:
      es: "La propuesta de resolución se notifica antes de finalizar las actuaciones para que el interesado alegue lo que convenga a su derecho."
  explanation:
    es: "La excepción al trámite de propuesta se da cuando la rectificación acordada coincide con la solicitada: se notifica directamente la liquidación. Si no coincide, sí hay propuesta y alegaciones. La propuesta se notifica una vez finalizadas las actuaciones, no antes."
  citation: "art. 127.4 RGAT"
  difficulty: 2
  tags:
  - "rectificación"
  - "tramitación"
# anchor: boe-a-2007-15984-art-128
- id: m03-l07-q0048
  prompt:
    es: "Según el artículo 128.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, el acuerdo que pone fin al procedimiento de rectificación de autoliquidaciones será motivado cuando sea denegatorio o cuando:"
  options:
  - id: a
    text:
      es: "la rectificación acordada coincida con la solicitada por el interesado, aun en parte."
  - id: b
    correct: true
    text:
      es: "la rectificación acordada no coincida con la solicitada por el interesado."
  - id: c
    text:
      es: "la propuesta de resolución haya recibido alegaciones del interesado."
  - id: d
    text:
      es: "la resolución incluya una liquidación provisional a ingresar."
  explanation:
    es: "Además del acuerdo denegatorio, exige motivación el que rectifica de forma distinta a lo solicitado. La coincidencia con lo pedido no la exige. La liquidación provisional y las alegaciones no son, por sí mismas, el supuesto del precepto."
  citation: "art. 128.1 RGAT"
  difficulty: 2
  tags:
  - "rectificación"
  - "terminación"
# anchor: boe-a-2007-15984-art-128
- id: m03-l07-q0049
  prompt:
    es: "De acuerdo con el artículo 128.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, señale la respuesta CORRECTA sobre la resolución que acuerda rectificar una autoliquidación:"
  options:
  - id: a
    text:
      es: "Incluye siempre una liquidación definitiva que cierra la comprobación de la obligación tributaria."
  - id: b
    text:
      es: "Incluye una liquidación provisional solo cuando la rectificación resulta a ingresar por el obligado."
  - id: c
    text:
      es: "No incluye liquidación alguna: la liquidación se notifica en un procedimiento posterior."
  - id: d
    correct: true
    text:
      es: "Incluye una liquidación provisional cuando afecta a algún elemento determinante de la cuantificación de la deuda efectuada por el obligado."
  explanation:
    es: "Si se acuerda rectificar, la resolución lleva una liquidación provisional cuando afecta a algún elemento determinante de la cuantificación de la deuda hecha por el obligado. No es definitiva, no depende de que el resultado sea a ingresar y no se difiere a otro procedimiento."
  citation: "art. 128.1 RGAT"
  difficulty: 2
  tags:
  - "rectificación"
  - "terminación"
# anchor: boe-a-2007-15984-art-128
- id: m03-l07-q0052
  prompt:
    es: "De acuerdo con el artículo 128.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, transcurrido el plazo máximo para notificar la resolución del procedimiento de rectificación de autoliquidaciones sin notificación expresa, la solicitud:"
  options:
  - id: a
    text:
      es: "se entenderá estimada por silencio administrativo."
  - id: b
    text:
      es: "se tendrá por desistida a instancia del obligado."
  - id: c
    correct: true
    text:
      es: "podrá entenderse desestimada."
  - id: d
    text:
      es: "caducará y se archivarán las actuaciones sin más trámite."
  explanation:
    es: "El silencio en este procedimiento tiene efecto desestimatorio: la solicitud puede entenderse desestimada. No hay estimación por silencio, ni caducidad con archivo, ni desistimiento presumido."
  citation: "art. 128.4 RGAT"
  difficulty: 1
  tags:
  - "rectificación"
  - "silencio"
# anchor: boe-a-2007-15984-art-128
- id: m03-l07-q0053
  prompt:
    es: "¿Cuál es el plazo máximo para notificar la resolución del procedimiento de rectificación de autoliquidaciones, según el artículo 128.4 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "El plazo máximo para notificar la resolución es de cuatro meses."
  - id: b
    text:
      es: "El plazo máximo para notificar la resolución es de nueve meses."
  - id: c
    text:
      es: "El plazo máximo para notificar la resolución es de dos meses."
  - id: d
    correct: true
    text:
      es: "El plazo máximo para notificar la resolución es de seis meses."
  explanation:
    es: "El plazo máximo es de seis meses (art. 128.4). Dos, cuatro y nueve meses no son el plazo de este procedimiento."
  citation: "art. 128.4 RGAT"
  difficulty: 1
  tags:
  - "rectificación"
  - "plazos"
# anchor: boe-a-2007-15984-art-130
- id: m03-l07-q0083
  prompt:
    es: "Conforme al artículo 130.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, dictada la liquidación provisional en un procedimiento iniciado mediante declaración, el obligado puede solicitar la rectificación de esta cuando considere que ha perjudicado sus intereses legítimos o cuando pudiera proceder:"
  options:
  - id: a
    correct: true
    text:
      es: "una liquidación por importe superior o una menor devolución."
  - id: b
    text:
      es: "una liquidación definitiva por importe superior o una mayor devolución."
  - id: c
    text:
      es: "una liquidación por importe superior o una devolución de ingresos indebidos."
  - id: d
    text:
      es: "una liquidación por importe inferior o una mayor devolución."
  explanation:
    es: "La solicitud de rectificación del obligado cabe si el contenido le ha perjudicado o si pudiera proceder una liquidación por importe superior o una menor devolución (art. 130.1). Una liquidación inferior o una mayor devolución irían a su favor, y el precepto no habla de liquidación definitiva ni de ingresos indebidos."
  citation: "art. 130.1 RGAT"
  difficulty: 3
  tags:
  - "rectificación"
  - "declaraciones"
# anchor: boe-a-2007-15984-art-126
- id: m03-l07-q0089
  prompt:
    es: "Comercial Prieto, S.L. presentó una autoliquidación del IVA. La Administración tramita ahora un procedimiento de comprobación limitada cuyo objeto incluye la obligación tributaria a la que se refiere esa autoliquidación, y la sociedad quiere pedir su rectificación. Según el artículo 126.2 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿qué puede hacer la sociedad?"
  options:
  - id: a
    text:
      es: "Puede solicitar la rectificación una vez transcurridos tres meses desde el inicio de la comprobación."
  - id: b
    correct: true
    text:
      es: "No puede solicitar la rectificación, pero puede alegar y presentar los documentos que considere oportunos en el procedimiento en curso."
  - id: c
    text:
      es: "No puede solicitar la rectificación ni alegar ni aportar documentos hasta que el procedimiento termine."
  - id: d
    text:
      es: "Puede solicitar la rectificación, y la comprobación limitada se archiva por haber perdido su objeto."
  explanation:
    es: "Con una comprobación en curso sobre esa obligación tributaria, la rectificación no puede solicitarse, pero el obligado conserva su derecho a alegar y presentar documentos, que el órgano debe tener en cuenta (art. 126.2). No hay archivo del procedimiento, ni espera de tres meses, ni suspensión del derecho a alegar."
  citation: "art. 126.2 RGAT"
  difficulty: 2
  tags:
  - "rectificación"
  - "iniciación"
# anchor: boe-a-2007-15984-art-126
- id: m03-l07-q0090
  prompt:
    es: "Taller Mecánico Rueda, S.L. presentó una autoliquidación y la Administración practicó una liquidación provisional por considerar improcedente una deducción. La sociedad quiere pedir la rectificación de su autoliquidación para incluir un gasto distinto, que la liquidación provisional no regularizó. Según el artículo 126.3 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, ¿puede hacerlo?"
  options:
  - id: a
    text:
      es: "Sí, pero solo si renuncia antes a recurrir la liquidación provisional ya notificada."
  - id: b
    text:
      es: "No, porque practicada una liquidación provisional el obligado no puede solicitar nunca la rectificación."
  - id: c
    correct: true
    text:
      es: "Sí, porque la solicitud afecta a elementos de la obligación tributaria que no han sido regularizados mediante la liquidación provisional."
  - id: d
    text:
      es: "No, porque tras una liquidación provisional solo la Administración puede rectificar la autoliquidación."
  explanation:
    es: "Tras una liquidación provisional cabe la solicitud si el motivo es distinto del de aquella, y concurre motivo distinto cuando la solicitud afecta a elementos no regularizados (art. 126.3). No se prohíbe de forma absoluta, no se condiciona a renunciar al recurso y no se reserva a la Administración."
  citation: "art. 126.3 RGAT"
  difficulty: 2
  tags:
  - "rectificación"
  - "iniciación"
# anchor: boe-a-2007-15984-art-128
- id: m03-l07-q0091
  prompt:
    es: "De acuerdo con el artículo 128.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, el procedimiento de rectificación de autoliquidaciones finalizará mediante:"
  options:
  - id: a
    correct: true
    text:
      es: "resolución en la que se acordará o no la rectificación de la autoliquidación."
  - id: b
    text:
      es: "acta con acuerdo firmada por el obligado y el órgano competente."
  - id: c
    text:
      es: "diligencia que recoja la subsanación de la discrepancia del obligado."
  - id: d
    text:
      es: "liquidación definitiva en la que se acordará la rectificación solicitada por el obligado."
  explanation:
    es: "El procedimiento termina por resolución que acuerda o deniega la rectificación (art. 128.1). No termina por liquidación definitiva, por acta con acuerdo (propia de la inspección) ni por diligencia de subsanación (propia de la verificación de datos)."
  citation: "art. 128.1 RGAT"
  difficulty: 1
  tags:
  - "rectificación"
  - "terminación"
# anchor: boe-a-2007-15984-art-131
- id: m03-l07-q0093
  prompt:
    es: "Según el artículo 131.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, reconocido el derecho a una devolución derivada de la normativa del tributo o a una devolución de ingresos indebidos, se procederá a:"
  options:
  - id: a
    text:
      es: "la comprobación del derecho por un órgano distinto del que lo reconoció."
  - id: b
    text:
      es: "la notificación de una nueva liquidación al obligado."
  - id: c
    text:
      es: "la apertura de un plazo de alegaciones de quince días."
  - id: d
    correct: true
    text:
      es: "la ejecución de la devolución."
  explanation:
    es: "Una vez reconocido el derecho, el artículo 131.1 ordena ejecutar la devolución, con la condición de las garantías si se solicitaron. No hay nueva liquidación, nuevo plazo de alegaciones ni segunda comprobación."
  citation: "art. 131.1 RGAT"
  difficulty: 1
  tags:
  - "ejecución de devoluciones"
# anchor: boe-a-2003-23186-art-120
- id: m03-l07-q0094
  prompt:
    es: "Conforme al artículo 120.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el interés de demora cuando la rectificación de una autoliquidación origina una devolución derivada de la normativa del tributo:"
  options:
  - id: a
    correct: true
    text:
      es: "Si han transcurrido seis meses sin ordenar el pago por causa imputable a la Administración, esta abona el interés del artículo 26 sin necesidad de que el obligado lo solicite."
  - id: b
    text:
      es: "Si han transcurrido tres meses sin ordenar el pago por causa imputable a la Administración, esta abona el interés del artículo 26 sin necesidad de solicitud."
  - id: c
    text:
      es: "Si han transcurrido seis meses sin ordenar el pago, la Administración abona el interés aunque la causa no le sea imputable."
  - id: d
    text:
      es: "Si han transcurrido seis meses sin ordenar el pago por causa imputable a la Administración, esta lo abona solo si el obligado lo solicita expresamente."
  explanation:
    es: "Si la rectificación origina una devolución derivada de la normativa del tributo y pasan seis meses sin ordenar el pago por causa imputable a la Administración, esta abona el interés de demora del artículo 26 sin necesidad de solicitud (art. 120.3). El plazo no es de tres meses, no hace falta solicitud y la causa no imputable a la Administración no genera el interés."
  citation: "art. 120.3 LGT"
  difficulty: 3
  tags:
  - "rectificación"
  - "interés de demora"
# anchor: boe-a-2007-15984-art-130
- id: m03-l07-q0099
  prompt:
    es: "¿Desde qué momento puede el obligado solicitar la rectificación de una comunicación de datos, según el artículo 130.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio?"
  options:
  - id: a
    text:
      es: "Desde que presenta la comunicación de datos ante la Administración."
  - id: b
    correct: true
    text:
      es: "Desde que la Administración acuerda la devolución o dicta la resolución denegatoria."
  - id: c
    text:
      es: "Desde que se inicia un procedimiento de comprobación limitada sobre la comunicación de datos."
  - id: d
    text:
      es: "Desde que termina el plazo de seis meses para notificar la resolución."
  explanation:
    es: "En las comunicaciones de datos y solicitudes de devolución, la rectificación se pide una vez acordada la devolución o dictada la resolución denegatoria (art. 130.1). No antes, ni tras seis meses, ni por el inicio de una comprobación."
  citation: "art. 130.1 RGAT"
  difficulty: 2
  tags:
  - "rectificación"
  - "declaraciones"
