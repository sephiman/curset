- id: m03-l04-q022
  prompt:
    es: "Una consejería de una comunidad autónoma licita en 2026 un suministro de material sanitario con un valor estimado de 180.000 euros. ¿Está sujeto a regulación armonizada?"
  options:
  - id: a
    text:
      es: "No, porque para esta entidad el umbral del suministro es de 750.000 euros."
  - id: b
    correct: true
    text:
