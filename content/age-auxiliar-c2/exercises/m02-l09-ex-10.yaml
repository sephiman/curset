# anchor: fuente-ms-excel-funcion-contara-html
- id: m02-l09-q271
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes funciones se usa para contar solo las celdas que contienen números, y no valores lógicos, texto ni errores?"
  options:
  - id: a
    text:
      es: "CONTAR.SI"
  - id: b
    text:
      es: "CONTAR.SI.CONJUNTO"
  - id: c
    text:
      es: "CONTARA"
  - id: d
    correct: true
    text:
      es: "CONTAR"
  explanation:
    es: "La página recomienda CONTAR si solo se quieren contar las celdas con números. «CONTARA»: CONTARA cuenta celdas con cualquier tipo de información. «CONTAR.SI»: CONTAR.SI cuenta celdas que cumplen un criterio. «CONTAR.SI.CONJUNTO»: CONTAR.SI.CONJUNTO cuenta celdas que cumplen varios criterios."
  citation: "fuente: `ms-excel-funcion-contara.html`; «Si no necesita contar valores lógicos, texto o valores de error (en otras palabras, si desea contar solo las celdas que contienen números), use la función CONTAR.»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q272
  prompt:
    es: "Señale la función de Microsoft Excel 365 que cuenta el número de celdas de un rango que cumplen varios criterios, según la ayuda de Microsoft:"
  options:
  - id: a
    text:
      es: "PROMEDIO.SI.CONJUNTO"
  - id: b
    text:
      es: "SUMAR.SI.CONJUNTO"
  - id: c
    text:
      es: "CONTAR.SI"
  - id: d
    correct: true
    text:
      es: "CONTAR.SI.CONJUNTO"
  explanation:
    es: "La página dice que CONTAR.SI.CONJUNTO cuenta el número de celdas del rango que cumplen varios criterios. «CONTAR.SI»: CONTAR.SI cuenta las que cumplen un solo criterio. «PROMEDIO.SI.CONJUNTO»: PROMEDIO.SI.CONJUNTO calcula el promedio de las celdas que cumplen varios criterios. «SUMAR.SI.CONJUNTO»: SUMAR.SI.CONJUNTO suma valores, no cuenta celdas."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «CONTAR.SI.CONJUNTO — Use esta función para contar el número de celdas, dentro del rango, que cumplen varios criterios.»"
