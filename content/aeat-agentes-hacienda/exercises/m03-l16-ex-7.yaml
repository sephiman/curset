# anchor: boe-a-2006-20764-art-60
- id: m03-l16-q0059
  prompt:
    es: "Sergio Molina acredita un grado de discapacidad del 40 por ciento y necesita ayuda de terceras personas. Según el artículo 60.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál es su mínimo por discapacidad como contribuyente?"
  options:
  - id: a
    text:
      es: "Su mínimo por discapacidad es de 3.000 euros anuales."
  - id: b
    text:
      es: "Su mínimo por discapacidad es de 9.000 euros anuales."
  - id: c
    text:
      es: "Su mínimo por discapacidad es de 12.000 euros anuales."
  - id: d
    correct: true
    text:
      es: "Su mínimo por discapacidad es de 6.000 euros anuales."
  explanation:
    es: "Su grado es inferior al 65 por ciento, de modo que el mínimo base es de 3.000 euros. Como necesita ayuda de terceras personas, se aumenta en 3.000 euros por gastos de asistencia: 3.000 + 3.000 = 6.000 euros (art. 60.1). Los 3.000 euros olvidan el aumento. Los 9.000 y los 12.000 euros corresponden a quien acredita un grado igual o superior al 65 por ciento, sin y con aumento."
  citation: "art. 60.1 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2006-20764-art-60
- id: m03-l16-q0060
  prompt:
    es: "Conforme al artículo 60.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el mínimo por discapacidad del contribuyente se aumenta en 3.000 euros anuales en concepto de gastos de asistencia cuando acredita:"
  options:
  - id: a
    text:
      es: "únicamente un grado de discapacidad igual o superior al 65 por ciento, con independencia de la necesidad de ayuda de terceras personas o de movilidad reducida."
  - id: b
    text:
      es: "un grado de discapacidad igual o superior al 33 por ciento."
  - id: c
    text:
      es: "haber cumplido 65 años y tener reconocida alguna discapacidad."
  - id: d
    correct: true
    text:
      es: "necesitar ayuda de terceras personas o movilidad reducida, o un grado de discapacidad igual o superior al 65 por ciento."
  explanation:
    es: "El aumento procede cuando se acredita necesitar ayuda de terceras personas o movilidad reducida, o un grado igual o superior al 65 por ciento (art. 60.1). Limitarlo al grado del 65 por ciento omite el primer supuesto. Con el 33 por ciento se es persona con discapacidad, pero eso solo da el mínimo base. Y la edad de 65 años no es requisito de este aumento."
  citation: "art. 60.1 LIRPF"
  difficulty: 2
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-60
- id: m03-l16-q0061
  prompt:
    es: "De acuerdo con el artículo 60 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el mínimo por discapacidad es la suma de:"
  options:
  - id: a
    text:
      es: "el mínimo por discapacidad del contribuyente y el mínimo por discapacidad de los descendientes únicamente."
  - id: b
    text:
      es: "el mínimo por discapacidad del contribuyente y el mínimo del contribuyente de 5.550 euros."
  - id: c
    correct: true
    text:
      es: "el mínimo por discapacidad del contribuyente y el mínimo por discapacidad de ascendientes y descendientes."
  - id: d
    text:
      es: "el mínimo por discapacidad de ascendientes y el de descendientes, sin el del contribuyente."
  explanation:
    es: "El mínimo por discapacidad suma el del contribuyente y el de ascendientes y descendientes (art. 60). Excluir a los ascendientes o al contribuyente omite una de las partes. El mínimo del contribuyente de 5.550 euros es otro componente del mínimo personal y familiar, no del de discapacidad."
  citation: "art. 60 LIRPF"
  difficulty: 1
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-60
- id: m03-l16-q0062
  prompt:
    es: "Según el artículo 60.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, tienen la consideración de personas con discapacidad los contribuyentes que acrediten, en las condiciones que reglamentariamente se establezcan, un grado de discapacidad igual o superior al:"
  options:
  - id: a
    text:
      es: "65 por ciento de discapacidad."
  - id: b
    correct: true
    text:
      es: "33 por ciento de discapacidad."
  - id: c
    text:
      es: "25 por ciento de discapacidad."
  - id: d
    text:
      es: "50 por ciento de discapacidad."
  explanation:
    es: "Para el impuesto es persona con discapacidad quien acredita un grado igual o superior al 33 por ciento (art. 60.3). El 65 por ciento es el umbral del mínimo reforzado y del aumento por gastos de asistencia. El 25 y el 50 por ciento no aparecen en el artículo."
  citation: "art. 60.3 LIRPF"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2006-20764-art-61
- id: m03-l16-q0063
  prompt:
    es: "Según la regla 1.ª del artículo 61 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué ocurre cuando dos o más contribuyentes tienen derecho al mínimo por descendientes respecto de los mismos descendientes y tienen igual grado de parentesco con ellos?"
  options:
  - id: a
    correct: true
    text:
      es: "Su importe se prorratea entre ellos por partes iguales."
  - id: b
    text:
      es: "Se aplica íntegramente al contribuyente de mayores rentas."
  - id: c
    text:
      es: "Se aplica íntegramente al primero que presente la declaración."
  - id: d
    text:
      es: "Se aplica íntegramente a cada uno de ellos."
  explanation:
    es: "Con igual grado de parentesco, el importe del mínimo se prorratea entre los contribuyentes por partes iguales (art. 61, regla 1.ª). La ley no atiende a quién tiene más renta ni a quién declara antes, y tampoco duplica el mínimo aplicándolo entero a cada uno."
  citation: "art. 61 LIRPF"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2006-20764-art-61
- id: m03-l16-q0064
  prompt:
    es: "Lola, de 10 años, convive con su madre Marta y con su abuelo Julián. Ambos tienen derecho al mínimo por descendientes por ella. Marta tiene rentas anuales, excluidas las exentas, de 6.000 euros y Julián de 30.000 euros. Conforme a la regla 1.ª del artículo 61 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿a quién corresponde aplicar el mínimo?"
  options:
  - id: a
    correct: true
    text:
      es: "A Julián, porque Marta, que es de grado más cercano, no tiene rentas anuales superiores a 8.000 euros."
  - id: b
    text:
      es: "A Marta, por ser la de grado más cercano, sea cual sea su nivel de rentas."
  - id: c
    text:
      es: "Se prorratea por partes iguales entre Marta y Julián."
  - id: d
    text:
      es: "No corresponde a ninguno de los dos, porque Lola convive con dos contribuyentes de distinto grado."
  explanation:
    es: "Con distinto grado de parentesco, el mínimo corresponde al de grado más cercano, salvo que este no tenga rentas anuales superiores a 8.000 euros, en cuyo caso pasa al siguiente grado (art. 61, regla 1.ª). Marta es la más cercana, pero sus 6.000 euros no superan los 8.000, y el mínimo corresponde a Julián. Aplicarlo a Marta sea cual sea su renta ignora la excepción. El prorrateo solo vale con igual grado. Y la convivencia con dos contribuyentes no anula el derecho, que la regla resuelve atribuyendo el mínimo."
  citation: "art. 61 LIRPF"
  difficulty: 3
  tags:
  - "cómputo"
  - "sujeto"
# anchor: boe-a-2006-20764-art-61
- id: m03-l16-q0065
  prompt:
    es: "De acuerdo con la regla 2.ª del artículo 61 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, no procede la aplicación del mínimo por descendientes, ascendientes o discapacidad cuando los ascendientes o descendientes que generen el derecho presenten declaración por el impuesto con rentas superiores a:"
  options:
  - id: a
    text:
      es: "la cifra de 8.000 euros anuales."
  - id: b
    text:
      es: "la cifra de 1.500 euros anuales."
  - id: c
    text:
      es: "la cifra de 1.000 euros anuales."
  - id: d
    correct: true
    text:
      es: "la cifra de 1.800 euros anuales."
  explanation:
    es: "Si el ascendiente o descendiente presenta declaración con rentas superiores a 1.800 euros, no procede el mínimo (art. 61, regla 2.ª). Esta regla se suma al límite de 8.000 euros de los artículos 58 y 59. Los 1.500 euros son el límite de pagadores del artículo 96.3 y los 1.000 euros, un límite conjunto del artículo 96.2."
  citation: "art. 61 LIRPF"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-61
- id: m03-l16-q0066
  prompt:
    es: "Según la regla 3.ª del artículo 61 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las circunstancias personales y familiares que se tienen en cuenta para los mínimos se determinan atendiendo a la situación existente en la fecha de:"
  options:
  - id: a
    text:
      es: "presentación de la declaración por el contribuyente."
  - id: b
    text:
      es: "cobro de las rentas del contribuyente."
  - id: c
    correct: true
    text:
      es: "devengo del impuesto en cada período impositivo."
  - id: d
    text:
      es: "inicio del período impositivo de que se trate."
  explanation:
    es: "La determinación de las circunstancias personales y familiares para los mínimos se hace según la situación en la fecha de devengo del impuesto (art. 61, regla 3.ª). Ni la presentación de la declaración, ni el cobro de las rentas, ni el inicio del período son el momento que fija la ley."
  citation: "art. 61 LIRPF"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-62
- id: m03-l16-q0067
  prompt:
    es: "De acuerdo con el artículo 62 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la cuota íntegra estatal es la suma de las cantidades resultantes de aplicar los tipos de gravamen de los artículos 63 y 66 a:"
  options:
  - id: a
    text:
      es: "las bases imponibles general y del ahorro, respectivamente."
  - id: b
    correct: true
    text:
      es: "las bases liquidables general y del ahorro, respectivamente."
  - id: c
    text:
      es: "la base liquidable general únicamente, con un tipo único para el ahorro."
  - id: d
    text:
      es: "las bases liquidables general y del ahorro, una vez minoradas por las deducciones."
  explanation:
    es: "La cuota íntegra estatal resulta de aplicar la escala del artículo 63 a la base liquidable general y la del artículo 66 a la base liquidable del ahorro (art. 62). Aplicarlas a las bases imponibles omite las reducciones. Un tipo único para el ahorro contradice el artículo 66, que tiene escala propia. Y las deducciones actúan después, en la cuota líquida, no antes de la cuota íntegra."
  citation: "art. 62 LIRPF"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2006-20764-art-63
- id: m03-l16-q0068
  prompt:
    es: "Según el artículo 63.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, a la cuantía resultante de aplicar la escala general a la base liquidable general se le minora:"
  options:
  - id: a
    text:
      es: "el importe íntegro del mínimo personal y familiar, una vez aplicadas a la base liquidable general las reducciones de los artículos 51 a 55 de esa ley."
  - id: b
    correct: true
    text:
      es: "el importe derivado de aplicar la misma escala a la parte de la base liquidable general correspondiente al mínimo personal y familiar."
  - id: c
    text:
      es: "el importe de las reducciones de los artículos 51, 53, 54 y 55."
  - id: d
    text:
      es: "la cuota líquida autonómica del mismo período."
  explanation:
    es: "La escala se aplica a toda la base liquidable general y la cuantía resultante se minora en lo que resulta de aplicar la misma escala a la parte que corresponde al mínimo personal y familiar (art. 63.1). Restar el mínimo por su importe íntegro mezcla base y cuota. Las reducciones de los artículos 51 a 55 ya se aplicaron al calcular la base liquidable. Y la cuota autonómica no interviene en la cuota estatal."
  citation: "art. 63.1 LIRPF"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2006-20764-art-63
- id: m03-l16-q0069
  prompt:
    es: "¿Qué tipo aplica la escala del artículo 63.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas al resto de la base liquidable general que exceda de 300.000 euros?"
  options:
  - id: a
    correct: true
    text:
      es: "Se aplica el 24,50 por ciento."
  - id: b
    text:
      es: "Se aplica el 22,50 por ciento."
  - id: c
    text:
      es: "Se aplica el 18,50 por ciento."
  - id: d
    text:
      es: "Se aplica el 15 por ciento."
  explanation:
    es: "A partir de 300.000 euros de base liquidable general el tipo es del 24,50 por ciento (art. 63.1). El 22,50 por ciento es el del tramo entre 60.000 y 300.000 euros y el 18,50 por ciento el del tramo entre 35.200 y 60.000. El 15 por ciento es el tipo máximo de la escala del ahorro del artículo 66."
  citation: "art. 63.1 LIRPF"
  difficulty: 1
  tags:
  - "porcentaje"
# anchor: boe-a-2006-20764-art-63
- id: m03-l16-q0070
  prompt:
    es: "Carlos Maestre tiene una base liquidable general de 45.000 euros, ninguna base liquidable del ahorro y un mínimo personal y familiar de 5.550 euros. Aplicando la escala del artículo 63.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas (los primeros 12.450 euros tributan al 9,50 por ciento; a partir de 35.200 euros la cuota es de 4.362,75 euros más el 18,50 por ciento del exceso, hasta 60.000 euros), ¿cuál es su cuota íntegra estatal?"
  options:
  - id: a
    text:
      es: "Su cuota íntegra estatal es de 6.175,75 euros."
  - id: b
    text:
      es: "Su cuota íntegra estatal es de 5.509,75 euros."
  - id: c
    text:
      es: "Su cuota íntegra estatal es de 1.285,75 euros."
  - id: d
    correct: true
    text:
      es: "Su cuota íntegra estatal es de 5.648,50 euros."
  explanation:
    es: "Sobre 45.000 euros la cuantía es 4.362,75 + (45.000 - 35.200) x 18,50 % = 4.362,75 + 1.813 = 6.175,75 euros. Se minora en la escala aplicada al mínimo: 5.550 x 9,50 % = 527,25 euros. La cuota es 6.175,75 - 527,25 = 5.648,50 euros. La cifra de 6.175,75 olvida la minoración. La de 5.509,75 aplica al mínimo el 12 por ciento (666 euros), que es el tipo del segundo tramo y no del primero. Y 1.285,75 euros olvida la cuantía fija de 4.362,75 euros del tramo."
  citation: "art. 63.1 LIRPF"
  difficulty: 3
  tags:
  - "cómputo"
# anchor: boe-a-2006-20764-art-63
- id: m03-l16-q0071
  prompt:
    es: "Teresa Bravo tiene una base liquidable general de 25.000 euros, ninguna base liquidable del ahorro y un mínimo personal y familiar de 5.550 euros. Según la escala del artículo 63.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas (los primeros 12.450 euros tributan al 9,50 por ciento; a partir de 20.200 euros la cuota es de 2.112,75 euros más el 15 por ciento del exceso, hasta 35.200 euros), ¿cuál es su cuota íntegra estatal?"
  options:
  - id: a
    text:
      es: "Su cuota íntegra estatal es de 2.832,75 euros."
  - id: b
    text:
      es: "Su cuota íntegra estatal es de 1.847,75 euros."
  - id: c
    correct: true
    text:
      es: "Su cuota íntegra estatal es de 2.305,50 euros."
  - id: d
    text:
      es: "Su cuota íntegra estatal es de 2.166,75 euros."
  explanation:
    es: "Sobre 25.000 euros la cuantía es 2.112,75 + (25.000 - 20.200) x 15 % = 2.112,75 + 720 = 2.832,75 euros. Al mínimo de 5.550 euros se le aplica el 9,50 por ciento: 527,25 euros. La cuota es 2.832,75 - 527,25 = 2.305,50 euros. La cifra de 2.832,75 no resta el mínimo. La de 1.847,75 aplica el 9,50 por ciento a toda la base (2.375 euros) en lugar de usar la escala. Y la de 2.166,75 minora el mínimo con el 12 por ciento (666 euros)."
  citation: "art. 63.1 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
# anchor: boe-a-2006-20764-art-66
- id: m03-l16-q0072
  prompt:
    es: "Según la escala del artículo 66.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué tipo se aplica a la parte de la base liquidable del ahorro comprendida entre 50.000 y 200.000 euros?"
  options:
  - id: a
    text:
      es: "Se aplica el 10,5 por ciento."
  - id: b
    text:
      es: "Se aplica el 13,5 por ciento."
  - id: c
    correct: true
    text:
      es: "Se aplica el 11,5 por ciento."
  - id: d
    text:
      es: "Se aplica el 15 por ciento."
  explanation:
    es: "El tramo de 50.000 a 200.000 euros se grava al 11,5 por ciento (art. 66.1). El 10,5 por ciento es el tipo del tramo anterior, de 6.000 a 50.000 euros. El 13,5 por ciento corresponde al tramo siguiente, hasta 300.000 euros, y el 15 por ciento, al resto."
  citation: "art. 66.1 LIRPF"
  difficulty: 2
  tags:
  - "porcentaje"
# anchor: boe-a-2006-20764-art-66
- id: m03-l16-q0073
  prompt:
    es: "Nora Campos solo tiene base liquidable del ahorro, de 30.000 euros, y no tiene base liquidable general. Su mínimo personal y familiar es de 5.550 euros. Con la escala del artículo 66.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas (los primeros 6.000 euros tributan al 9,5 por ciento, con una cuota de 570 euros; el exceso hasta 50.000 euros, al 10,5 por ciento), ¿cuál es su cuota íntegra estatal?"
  options:
  - id: a
    text:
      es: "Su cuota íntegra estatal es de 3.090 euros."
  - id: b
    correct: true
    text:
      es: "Su cuota íntegra estatal es de 2.562,75 euros."
  - id: c
    text:
      es: "Su cuota íntegra estatal es de 2.322,75 euros."
  - id: d
    text:
      es: "Su cuota íntegra estatal es de 2.507,25 euros."
  explanation:
    es: "Al no existir base liquidable general, el mínimo forma parte de la del ahorro (art. 56.2). Sobre 30.000 euros la cuantía es 570 + (30.000 - 6.000) x 10,5 % = 570 + 2.520 = 3.090 euros. Al mínimo de 5.550 euros se le aplica el 9,5 por ciento: 527,25 euros. La cuota es 3.090 - 527,25 = 2.562,75 euros. La cifra de 3.090 olvida la minoración. La de 2.322,75 aplica el 9,5 por ciento a toda la base. Y la de 2.507,25 minora el mínimo con el 10,5 por ciento (582,75 euros)."
  citation: "art. 66.1 LIRPF"
  difficulty: 3
  tags:
  - "cómputo"
