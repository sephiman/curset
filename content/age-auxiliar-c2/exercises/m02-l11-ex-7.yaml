# anchor: fuente-ms-outlook-responder-reenviar-html
- id: m02-l11-q156
  prompt:
    es: "En Outlook 365 clásico, ¿qué ocurre con los datos adjuntos de un mensaje original cuando se usa Reenviar?"
  options:
  - id: a
    correct: true
    text:
      es: "Se incluyen todos y se pueden agregar más archivos"
  - id: b
    text:
      es: "Se incluyen solo si se activa una casilla en Opciones"
  - id: c
    text:
      es: "Se incluyen, pero no se pueden agregar más archivos"
  - id: d
    text:
      es: "No se incluyen, y hay que añadirlos a mano"
  explanation:
    es: "Al reenviar, el mensaje incluye todos los datos adjuntos del original y se pueden agregar archivos adicionales. Que no se incluyan es lo que ocurre al responder. Que no se puedan agregar más contradice que se pueden agregar archivos adjuntos adicionales. Que dependa de una casilla contradice que se incluyan automáticamente."
  citation: "fuente: `ms-outlook-responder-reenviar.html`; «Datos adjuntos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-recuperar-html
- id: m02-l11-q157
  prompt:
    es: "En Outlook 365 clásico, tras enviar una solicitud de recuperación, ¿cuánto tarda normalmente en llegar la notificación por correo con el informe de recuperación?"
  options:
  - id: a
    text:
      es: "Hasta 24 horas"
  - id: b
    text:
      es: "Hasta cinco minutos"
  - id: c
    text:
      es: "Hasta treinta minutos"
  - id: d
    correct: true
    text:
      es: "Menos de 30 segundos"
  explanation:
    es: "Después de enviar la solicitud, normalmente menos de 30 segundos después, se recibe una notificación con el asunto Informe de recuperación de mensajes. Cinco minutos es lo que pueden tardar las actualizaciones de estado con unos cientos de destinatarios. Treinta minutos es lo que puede tardar el estado con decenas de miles de destinatarios. Veinticuatro horas es el tiempo máximo de reintento antes de marcar la recuperación como errónea."
  citation: "fuente: `ms-outlook-recuperar.html`; «Para comprobar los recuerdos en Outlook clásico»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-outlook-programar-envio-html
- id: m02-l11-q158
  prompt:
    es: "En Outlook 365 clásico, ¿cómo se envía de inmediato un mensaje con entrega retrasada que espera en la Bandeja de salida?"
  options:
  - id: a
    text:
      es: "Abriéndolo y seleccionando Recuperar este mensaje en Elementos enviados"
  - id: b
    text:
      es: "Abriéndolo en Borrador y seleccionando Programar envío en el menú junto a Enviar"
  - id: c
    correct: true
    text:
      es: "Abriéndolo, desactivando No entregar antes y seleccionando Cerrar y Enviar"
  - id: d
    text:
      es: "Abriéndolo y seleccionando Cancelar envío, y luego Enviar el mensaje"
  explanation:
    es: "En Outlook clásico se cambia a la Bandeja de salida, se abre el mensaje, se desactiva la casilla No entregar antes y se selecciona Cerrar y luego Enviar. Cancelar envío es la opción del nuevo Outlook. Programar envío es el comando del nuevo Outlook que deja el mensaje en Borrador. Recuperar este mensaje retira un mensaje ya enviado."
  citation: "fuente: `ms-outlook-programar-envio.html`; «Enviar el mensaje inmediatamente en Outlook clásico»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-programar-envio-html
- id: m02-l11-q159
  prompt:
    es: "En Outlook 365 clásico con la cinta simplificada, ¿dónde se encuentran las opciones de mensaje para retrasar la entrega, si no aparece la flecha Opciones de mensaje?"
  options:
  - id: a
    correct: true
    text:
      es: "Pestaña Opciones › Más comandos"
  - id: b
    text:
      es: "Pestaña Inicio › Más comandos"
  - id: c
    text:
      es: "Pestaña Mensaje › Más comandos"
  - id: d
    text:
      es: "Pestaña Archivo › Más comandos"
  explanation:
    es: "Con la cinta simplificada, la ayuda indica la pestaña Opciones y Más comandos. La pestaña Mensaje es donde, con la cinta simplificada, se halla Más comandos para recuperar un mensaje. Las pestañas Inicio y Archivo contradicen que sea la pestaña Opciones."
  citation: "fuente: `ms-outlook-programar-envio.html`; «Programar un mensaje para más tarde en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-atajos-html
- id: m02-l11-q160
  prompt:
    es: "En Outlook 365 clásico, el método abreviado de teclado que reenvía un mensaje como un archivo adjunto es:"
  options:
  - id: a
    text:
      es: "Ctrl+F"
  - id: b
    correct: true
    text:
      es: "Ctrl+Alt+F"
  - id: c
    text:
      es: "Ctrl+Mayús+F"
  - id: d
    text:
      es: "Ctrl+Alt+K"
  explanation:
    es: "Ctrl+Alt+F reenvía un mensaje como un archivo adjunto. Ctrl+F reenvía un mensaje. Ctrl+Mayús+F abre la Búsqueda avanzada. Ctrl+Alt+K comprueba nombres."
  citation: "fuente: `ms-outlook-atajos.html`; «Métodos abreviados de teclado de correo en la versión clásica de Outlook»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-atajos-html
- id: m02-l11-q161
  prompt:
    es: "En Outlook 365 clásico, el método abreviado de teclado que selecciona la opción Responder a todos es:"
  options:
  - id: a
    text:
      es: "Ctrl+Alt+R"
  - id: b
    text:
      es: "Ctrl+F"
  - id: c
    text:
      es: "Ctrl+Mayús+F"
  - id: d
    correct: true
    text:
      es: "Ctrl+Mayús+R"
  explanation:
    es: "Ctrl+Mayús+R selecciona Responder a todos. Ctrl+F reenvía un mensaje. Ctrl+Mayús+F abre la Búsqueda avanzada. Ctrl+Alt+R responde con una convocatoria de reunión."
  citation: "fuente: `ms-outlook-atajos.html`; «Métodos abreviados de teclado de correo en la versión clásica de Outlook»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-outlook-recuperar-html
- id: m02-l11-q228
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones describe lo que ocurre al intentar recuperar un mensaje protegido por Azure Information Protection?"
  options:
  - id: a
    text:
      es: "Se recupera tras pedir confirmación a cada destinatario."
  - id: b
    text:
      es: "Se recupera y se reemplaza automáticamente por una versión sin protección."
  - id: c
    text:
      es: "Se recupera solo de los buzones de destinatarios que no lo han abierto."
  - id: d
    correct: true
    text:
      es: "No se puede recuperar."
  explanation:
    es: "La nota de la página dice que no se puede recuperar un mensaje protegido por Azure Information Protection. Recuperarlo de los buzones sin abrir es lo que ocurre con un mensaje normal que cumple los requisitos. La confirmación de los destinatarios no existe en el proceso: la recuperación elimina las copias no leídas o las reemplaza. El reemplazo sin protección tampoco existe: el reemplazo es un mensaje nuevo que redacta el remitente."
  citation: "fuente: `ms-outlook-recuperar.html`; «Recuperar y reemplazar un mensaje en Outlook clásico»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-outlook-recuperar-html
- id: m02-l11-q230
  prompt:
    es: "En Outlook 365 clásico con la cinta simplificada, ¿cuál de las siguientes rutas lleva al comando Recuperar este mensaje desde un mensaje abierto de Elementos enviados?"
  options:
  - id: a
    text:
      es: "Opciones › Más comandos › Recuperar este mensaje"
  - id: b
    text:
      es: "Mensaje › Mover › Más acciones de movimiento › Recuperar este mensaje"
  - id: c
    text:
      es: "Inicio › Eliminar › Más comandos › Recuperar este mensaje"
  - id: d
    correct: true
    text:
      es: "Mensaje › Más comandos (...) › Acciones › Recuperar este mensaje"
  explanation:
    es: "Con la cinta simplificada se selecciona la pestaña Mensaje, Más comandos (...), se apunta a Acciones y se elige Recuperar este mensaje. Mensaje › Mover › Más acciones de movimiento es la ruta de la cinta clásica. Opciones › Más comandos es donde está la entrega retrasada con la cinta simplificada. Inicio › Eliminar agrupa Ignorar, Limpiar y Bloquear, no Recuperar."
  citation: "fuente: `ms-outlook-recuperar.html`; «Recuperar y reemplazar un mensaje en Outlook clásico»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-recuperar-html
- id: m02-l11-q231
  prompt:
    es: "En el nuevo Outlook para Windows, ¿cuál de las siguientes opciones indica qué recibe el remitente en su bandeja de entrada poco después de recuperar un mensaje?"
  options:
  - id: a
    correct: true
    text:
      es: "Un informe de recuperación con un vínculo que indica si fue correcta, pendiente o fallida."
  - id: b
    text:
      es: "Una confirmación de lectura de cada destinatario que había abierto ya el mensaje original."
  - id: c
    text:
      es: "Un aviso del destinatario pidiendo permiso para eliminar el mensaje."
  - id: d
    text:
      es: "Una copia del mensaje original guardada en Borrador para reenviarla."
  explanation:
    es: "Poco después de recuperar, el remitente recibe un informe de recuperación de mensajes, con un vínculo que muestra si la recuperación se ha realizado correctamente, está pendiente o ha fallado. Una confirmación de lectura no forma parte del proceso: la recuperación actúa sobre los destinatarios que aún no abrieron el mensaje. La copia en Borrador es lo que ocurre con un mensaje programado. El permiso del destinatario no se pide: el mensaje se retira de su buzón."
  citation: "fuente: `ms-outlook-recuperar.html`; «Recuperar y reemplazar un mensaje en el nuevo Outlook»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-programar-envio-html
- id: m02-l11-q233
  prompt:
    es: "En Outlook 365 clásico, ¿cuál de las siguientes opciones indica a qué mensajes se aplica una regla de entrega retrasada creada sin condiciones y confirmada con Sí?"
  options:
  - id: a
    text:
      es: "A todos los mensajes que lleguen a la Bandeja de entrada."
  - id: b
    text:
      es: "Solo a los mensajes enviados con importancia alta."
  - id: c
    correct: true
    text:
      es: "A todos los mensajes que se envíen."
  - id: d
    text:
      es: "A ninguno: Outlook descarta la regla."
  explanation:
    es: "Si no se activa ninguna condición y se selecciona Sí en el cuadro de confirmación, la regla se aplicará a todos los mensajes que se envíen. Limitarla a importancia alta no ocurre sin condición. La regla parte de la plantilla Aplicar regla a los mensajes que envíe, así que no actúa sobre los que llegan. Descartarla tampoco: el cuadro de confirmación sirve para aceptar esa aplicación general."
  citation: "fuente: `ms-outlook-programar-envio.html`; «Retrasar la entrega de todos los mensajes en Outlook clásico»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-firma-html
- id: m02-l11-q026
  prompt:
    es: "Señale la ruta de Outlook 365 clásico que lleva al cuadro para crear una firma desde un mensaje nuevo:"
  options:
  - id: a
    text:
      es: "Revisar › Firma › Firmas"
  - id: b
    text:
      es: "Opciones › Firma › Firmas"
  - id: c
    text:
      es: "Inicio › Firma › Firmas"
  - id: d
    correct: true
    text:
      es: "Mensaje › Firma › Firmas"
  explanation:
    es: "En un mensaje nuevo, la ayuda indica el menú Mensaje y Firma, con la opción Firmas. Las rutas que empiezan por Inicio, Opciones o Revisar contradicen esa frase, que fija la pestaña Mensaje."
  citation: "fuente: `ms-outlook-firma.html`; «Crear su firma y elegir cuándo Outlook agrega una firma a sus mensajes en Outlook clásico para Windows»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-firma-html
- id: m02-l11-q027
  prompt:
    es: "En Outlook 365 clásico, ¿qué lista de Elegir firma predeterminada permite elegir la firma que se agrega a los mensajes de respuesta y reenvío?"
  options:
  - id: a
    text:
      es: "Seleccionar firma para editar"
  - id: b
    correct: true
    text:
      es: "Respuestas/reenvíos"
  - id: c
    text:
      es: "Nuevos mensajes"
  - id: d
    text:
      es: "Cuenta de correo electrónico"
  explanation:
    es: "La lista Respuestas/reenvíos permite elegir la firma que aparece en las respuestas y reenvíos. Nuevos mensajes elige la que se agrega a los mensajes nuevos. Cuenta de correo electrónico elige la cuenta a la que se asocia la firma. Seleccionar firma para editar es el apartado donde se elige Nueva y se edita la firma."
  citation: "fuente: `ms-outlook-firma.html`; «Crear su firma y elegir cuándo Outlook agrega una firma a sus mensajes en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-firma-html
- id: m02-l11-q028
  prompt:
    es: "En Outlook 365 clásico, al crear una firma que se aplica a todos los mensajes nuevos, ¿qué ocurre con el mensaje que estaba abierto al crearla?"
  options:
  - id: a
    text:
      es: "Outlook le agrega la firma, pero solo en las respuestas"
  - id: b
    text:
      es: "Outlook le agrega la firma solo si se cierra y se vuelve a abrir"
  - id: c
    text:
      es: "Outlook le agrega la firma al aceptar el cuadro de firmas"
  - id: d
    correct: true
    text:
      es: "Outlook no le agrega la firma y hay que insertarla manualmente"
  explanation:
    es: "Outlook clásico no agrega la firma nueva al mensaje abierto en el paso 1, aunque se aplique a todos los mensajes nuevos, y hay que agregarla manualmente. Que la agregue al aceptar contradice esa frase. Que la agregue al cerrarlo y reabrirlo la contradice también: la ayuda dice que hay que agregarla manualmente a ese mensaje y que la llevan los mensajes futuros. Agregarla solo en respuestas contradice que se aplique a los mensajes nuevos."
  citation: "fuente: `ms-outlook-firma.html`; «Crear su firma y elegir cuándo Outlook agrega una firma a sus mensajes en Outlook clásico para Windows»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-firma-html
- id: m02-l11-q029
  prompt:
    es: "En Outlook 365 clásico, ¿cómo se inserta manualmente una firma en un mensaje si no se ha elegido insertarla automáticamente?"
  options:
  - id: a
    correct: true
    text:
      es: "En la pestaña Mensaje, con Firma, eligiendo la firma en el menú"
  - id: b
    text:
      es: "En la pestaña Inicio, con Firma, eligiendo la firma en el menú"
  - id: c
    text:
      es: "En la pestaña Opciones, con Firmas, eligiendo la firma en el menú"
  - id: d
    text:
      es: "En la pestaña Revisar, con Firma, eligiendo la firma en el menú"
  explanation:
    es: "En el mensaje, en la pestaña Mensaje, se selecciona Firma y se elige la firma en el menú emergente. Las pestañas Opciones, Inicio y Revisar contradicen esa frase, que indica la pestaña Mensaje."
  citation: "fuente: `ms-outlook-firma.html`; «Insertar una firma manualmente en Outlook clásico»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-firma-html
- id: m02-l11-q030
  prompt:
    es: "En Outlook 365 clásico, ¿dónde se almacenan las firmas creadas en un equipo, según la nota de la ayuda de Microsoft sobre firmas?"
  options:
  - id: a
    text:
      es: "En el servidor de correo, disponibles en cualquier dispositivo"
  - id: b
    correct: true
    text:
      es: "Localmente en el dispositivo donde se crearon"
  - id: c
    text:
      es: "En la carpeta Borrador de cada cuenta de correo"
  - id: d
    text:
      es: "En la cuenta de Microsoft, disponibles en cualquier dispositivo"
  explanation:
    es: "Las firmas se almacenan localmente en el dispositivo donde se crearon y es posible que no estén disponibles en otro dispositivo. Guardarlas en el servidor o en la cuenta de Microsoft contradice esa frase: la ayuda aconseja administrarlas a través de la cuenta de Microsoft para usarlas en todas las experiencias. La carpeta Borrador contradice que se guarden en el dispositivo."
  citation: "fuente: `ms-outlook-firma.html`; «Crear su firma y elegir cuándo Outlook agrega una firma a sus mensajes en Outlook clásico para Windows»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-firma-html
- id: m02-l11-q031
  prompt:
    es: "En Outlook 365 clásico, ¿cómo se crea una firma más sólida con viñetas, tablas o bordes, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Con Imagen: se inserta una imagen de la firma ya maquetada"
  - id: b
    text:
      es: "Con la minibarra de formato: inserta tablas y bordes en Editar firma"
  - id: c
    text:
      es: "Con Excel: se crea una hoja y se inserta en el cuadro Editar firma"
  - id: d
    correct: true
    text:
      es: "Con Word: se crea y se copia y pega en el cuadro Editar firma"
  explanation:
    es: "Para una firma con viñetas, tablas o bordes, la ayuda indica usar Word para crear y dar formato al texto y copiarlo y pegarlo en el cuadro Editar firma. Excel contradice que se use Word. La minibarra de formato sirve para vínculos, imágenes, fuentes, colores y justificar el texto. El botón Imagen inserta un archivo de imagen."
  citation: "fuente: `ms-outlook-firma.html`; «Crear su firma y elegir cuándo Outlook agrega una firma a sus mensajes en Outlook clásico para Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-firma-html
- id: m02-l11-q032
  prompt:
    es: "En Outlook 365 clásico, ¿qué casilla de la pestaña Tamaño hay que mantener marcada para conservar las proporciones de una imagen de la firma?"
  options:
  - id: a
    correct: true
    text:
      es: "Bloquear relación de aspecto"
  - id: b
    text:
      es: "Incluir subcarpetas"
  - id: c
    text:
      es: "No mover los mensajes marcados"
  - id: d
    text:
      es: "Detener el procesamiento de más reglas"
  explanation:
    es: "Para mantener las proporciones se deja marcada la casilla Bloquear relación de aspecto. Incluir subcarpetas pertenece a Ejecutar reglas ahora. Detener el procesamiento de más reglas pertenece a la creación de reglas. No mover los mensajes marcados pertenece a las opciones de Limpieza de conversación."
  citation: "fuente: `ms-outlook-firma.html`; «Agregar un logotipo o una imagen a la firma en la versión clásica de Outlook para Windows»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-firma-html
- id: m02-l11-q033
  prompt:
    es: "En el nuevo Outlook para Windows, ¿para qué sirven las casillas de la parte inferior al crear una firma?"
  options:
  - id: a
    text:
      es: "Para elegir si se aplica solo a mensajes con importancia alta"
  - id: b
    text:
      es: "Para elegir el tamaño máximo de las imágenes de la firma"
  - id: c
    correct: true
    text:
      es: "Para elegir si se aplica a mensajes nuevos y a respuestas y reenvíos"
  - id: d
    text:
      es: "Para elegir si se guarda solo en el equipo o también en la cuenta"
  explanation:
    es: "Las casillas de la parte inferior eligen si la firma se aplica a los mensajes nuevos y a las respuestas y reenvíos; si se dejan en blanco, la firma se agrega al redactar. Elegir dónde se guarda, el tamaño de las imágenes o la importancia de los mensajes contradice esa descripción."
  citation: "fuente: `ms-outlook-firma.html`; «Crear y agregar una firma de correo electrónico en el nuevo Outlook»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-outlook-firma-html
- id: m02-l11-q034
  prompt:
    es: "En el nuevo Outlook para Windows, ¿en qué grupo de la pestaña Mensaje se selecciona Firma para agregar una firma guardada al redactar un mensaje?"
  options:
  - id: a
    text:
      es: "Eliminar"
  - id: b
    text:
      es: "Etiquetas"
  - id: c
    text:
      es: "Mover"
  - id: d
    correct: true
    text:
      es: "Insertar"
  explanation:
    es: "En el nuevo Outlook, el grupo Insertar de la pestaña Mensaje contiene Firma. Etiquetas contiene Categorizar y Opciones de mensaje. Mover contiene Más acciones de movimiento. Eliminar contiene Archivar, Limpiar y Bloquear."
  citation: "fuente: `ms-outlook-firma.html`; «Agregar una firma al redactar un mensaje en el nuevo Outlook»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-outlook-firma-html
- id: m02-l11-q059
  prompt:
    es: "En Outlook 365, ¿qué permite configurar la ayuda de Microsoft sobre firmas de correo electrónico respecto a su inclusión en los mensajes?"
  options:
  - id: a
    text:
      es: "Varias firmas, pero solo para mensajes nuevos, nunca para respuestas o reenvíos"
  - id: b
    text:
      es: "Una firma única para todas las cuentas, sin poder cambiarla"
  - id: c
    correct: true
    text:
      es: "Varias firmas, y elegir si se incluyen en nuevos mensajes, respuestas o reenvíos"
  - id: d
    text:
      es: "Una sola firma por cuenta, incluida siempre en nuevos mensajes y respuestas"
  explanation:
    es: "La ayuda dice que se pueden configurar varias firmas para diferentes propósitos y elegir si incluirlas automáticamente en nuevos correos, respuestas o reenvíos. Una sola firma por cuenta o una única para todas las cuentas contradice que se puedan configurar varias. Limitarlas a mensajes nuevos contradice que se pueda elegir también para respuestas o reenvíos."
  citation: "fuente: `ms-outlook-firma.html`; «Resumen»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-outlook-firma-html
- id: m02-l11-q060
  prompt:
    es: "En Outlook 365 clásico, ¿qué se puede hacer en el cuadro desplegable Cuenta de correo electrónico al crear una firma?"
  options:
  - id: a
    text:
      es: "Elegir si la firma se aplica a los mensajes nuevos o a las respuestas"
  - id: b
    correct: true
    text:
      es: "Elegir la cuenta a la que se asocia la firma, con firmas distintas"
  - id: c
    text:
      es: "Elegir el idioma en el que se redacta cada firma de las cuentas"
  - id: d
    text:
      es: "Elegir la carpeta en la que se guardan las firmas de todas las cuentas"
  explanation:
    es: "En Cuenta de correo electrónico se elige una cuenta para asociarla a la firma, y se pueden tener firmas distintas para cada cuenta. Elegir una carpeta o un idioma contradice esa descripción. Elegir si se aplica a mensajes nuevos o respuestas se hace en Elegir firma predeterminada, con las listas Nuevos mensajes y Respuestas/reenvíos."
  citation: "fuente: `ms-outlook-firma.html`; «Crear su firma y elegir cuándo Outlook agrega una firma a sus mensajes en Outlook clásico para Windows»"
