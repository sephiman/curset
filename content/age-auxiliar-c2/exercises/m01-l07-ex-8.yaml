# anchor: boe-a-2013-12887-art-34
- id: m01-l07-q130
  prompt:
    es: "¿Cuál de las siguientes es una de las finalidades del Consejo de Transparencia y Buen Gobierno, según el artículo 34 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "Instruir los procedimientos sancionadores del título II."
  - id: b
    correct: true
    text:
      es: "Salvaguardar el ejercicio del derecho de acceso a la información pública."
  - id: c
    text:
      es: "Aprobar los planes anuales de publicidad activa de todas las Administraciones."
  - id: d
    text:
      es: "Resolver los recursos contencioso-administrativos en materia de acceso."
  explanation:
    es: "Entre las finalidades del Consejo figura salvaguardar el ejercicio del derecho de acceso a la información pública. La instrucción de los procedimientos sancionadores corresponde a la Oficina de Conflictos de Intereses, el Consejo solo puede instar su inicio. Aprobar planes de publicidad activa y resolver recursos contencioso-administrativos no son finalidades del artículo 34."
  citation: "art. 34 Ley 19/2013"
  difficulty: 1
  tags:
  - "competencia"
