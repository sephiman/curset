# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0016
  prompt:
    es: "Según el artículo 103.Dos.5 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, señale la respuesta CORRECTA sobre el tratamiento fiscal de la Agencia Estatal de Administración Tributaria:"
  options:
  - id: a
    text:
      es: "No goza de tratamiento fiscal especial, como cualquier otro Ente de Derecho Público."
  - id: b
    text:
      es: "Goza del tratamiento fiscal de las sociedades mercantiles estatales."
  - id: c
    correct: true
    text:
      es: "Goza del mismo tratamiento fiscal que la Administración del Estado."
  - id: d
    text:
      es: "Goza del mismo tratamiento fiscal que las Comunidades Autónomas."
  explanation:
    es: "El precepto equipara a la Agencia con la Administración del Estado a efectos fiscales. No se le aplica el régimen de las sociedades mercantiles estatales. Tampoco el de las Comunidades Autónomas, que son otra Administración. Y sí goza de un tratamiento especial: el del Estado."
  citation: "art. 103.Dos.5 Ley 31/1990"
  difficulty: 1
  tags:
  - "tratamiento fiscal"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0098
  prompt:
    es: "Según el artículo 103.Dos.2 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, la contratación de la Agencia se ajusta a los principios de publicidad, concurrencia, salvaguardia del interés de la Entidad y:"
  options:
  - id: a
    text:
      es: "igualdad de trato entre los candidatos y transparencia del procedimiento."
  - id: b
    correct: true
    text:
      es: "homogeneización de comportamientos en el Sector Público."
  - id: c
    text:
      es: "economía de medios y eficiencia en el gasto de la Entidad."
  - id: d
    text:
      es: "objetividad y publicidad de los criterios de adjudicación."
  explanation:
    es: "El cuarto principio que enumera el precepto es la homogeneización de comportamientos en el Sector Público. La lista es cerrada: igualdad de trato y transparencia, economía de medios y eficiencia, y objetividad de los criterios de adjudicación no son principios que cite el artículo 103.Dos.2."
  citation: "art. 103.Dos.2 Ley 31/1990"
  difficulty: 2
  tags:
  - "contratación"
  - "principios"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0017
  prompt:
    es: "De acuerdo con el artículo 103.Tres.1 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, los órganos rectores de la Agencia Estatal de Administración Tributaria son:"
  options:
  - id: a
    text:
      es: "el Secretario de Estado de Hacienda y el Subsecretario de Hacienda."
  - id: b
    correct: true
    text:
      es: "el Presidente y el Director General."
  - id: c
    text:
      es: "el Presidente, el Director General y el Delegado Central de Grandes Contribuyentes."
  - id: d
    text:
      es: "el Presidente y el Consejo Superior de Dirección."
  explanation:
    es: "El artículo 103.Tres.1 nombra dos órganos rectores, el Presidente y el Director General. El Consejo Superior de Dirección no es órgano rector según ese precepto. El Delegado Central de Grandes Contribuyentes es un órgano central de la Agencia, no un órgano rector. Y el Subsecretario de Hacienda no figura: el Presidente es el Secretario de Estado de Hacienda o la persona que designe el Gobierno."
  citation: "art. 103.Tres.1 Ley 31/1990"
  difficulty: 1
  tags:
  - "órganos rectores"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0018
  prompt:
    es: "Según el artículo 103.Tres.1 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, ¿quién ostenta la Presidencia de la Agencia, salvo que el Gobierno designe a otra persona?"
  options:
  - id: a
    text:
      es: "El Subsecretario de Hacienda, por razón de su cargo."
  - id: b
    text:
      es: "El Director General de la Agencia, por razón de su cargo."
  - id: c
    text:
      es: "El Interventor General de la Administración del Estado, por razón de su cargo."
  - id: d
    correct: true
    text:
      es: "El Secretario de Estado de Hacienda, por razón de su cargo."
  explanation:
    es: "El Presidente de la Agencia es el Secretario de Estado de Hacienda o la persona que designe el Gobierno. El Subsecretario no ocupa la Presidencia, y de hecho el rango de Subsecretario es el del Director General. Que el Director General presida la Agencia confundiría los dos órganos rectores. Y el Interventor General no tiene papel alguno en la Presidencia."
  citation: "art. 103.Tres.1 Ley 31/1990"
  difficulty: 1
  tags:
  - "Presidente"
  - "nombramiento"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0021
  prompt:
    es: "¿Cuál de los siguientes cargos tiene rango de Subsecretario, según el artículo 103.Tres.1 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991?"
  options:
  - id: a
    text:
      es: "El Presidente de la Agencia Estatal de Administración Tributaria."
  - id: b
    correct: true
    text:
      es: "El Director General de la Agencia Estatal de Administración Tributaria."
  - id: c
    text:
      es: "El Delegado Central de Grandes Contribuyentes de la Agencia."
  - id: d
    text:
      es: "El Director del Departamento de Recaudación de la Agencia Estatal de Administración Tributaria."
  explanation:
    es: "El Director General tiene rango de Subsecretario. El Presidente tiene el rango superior, el de Secretario de Estado. El Director de un Departamento tiene rango de dirección general, según la Orden PRE/3581/2007. Y la Delegación Central de Grandes Contribuyentes tiene rango de Dirección Adjunta."
  citation: "art. 103.Tres.1 Ley 31/1990"
  difficulty: 1
  tags:
  - "rango"
  - "Director General"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0022
  prompt:
    es: "Según el artículo 103.Tres.1 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, el Director General de la Agencia, que tendrá rango de Subsecretario, será nombrado:"
  options:
  - id: a
    text:
      es: "por el Presidente de la Agencia, de entre los Directores de los Departamentos."
  - id: b
    text:
      es: "por el Secretario de Estado de Hacienda, a propuesta de los Directores de los Departamentos."
  - id: c
    text:
      es: "por el Gobierno, a propuesta del Presidente de la Agencia."
  - id: d
    correct: true
    text:
      es: "por el Gobierno, a propuesta del Ministro competente en materia de Hacienda."
  explanation:
    es: "El Director General es nombrado por el Gobierno a propuesta del Ministro competente en materia de Hacienda. La propuesta no la hace el Presidente de la Agencia. Tampoco lo nombra el Presidente de entre los Directores de los Departamentos. Y no lo nombra el Secretario de Estado de Hacienda a propuesta de los Directores."
  citation: "art. 103.Tres.1 Ley 31/1990"
  difficulty: 2
  tags:
  - "Director General"
  - "nombramiento"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0023
  prompt:
    es: "De acuerdo con el artículo 103.Tres.2 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, corresponde al Presidente de la Agencia velar por la consecución de los objetivos asignados, ejercer su superior dirección y ostentar:"
  options:
  - id: a
    text:
      es: "su representación legal únicamente en los actos y contratos que superen la cuantía fijada por el Gobierno."
  - id: b
    text:
      es: "la superior jefatura del personal de sus Servicios Centrales y Periféricos."
  - id: c
    correct: true
    text:
      es: "su representación legal en toda clase de actos y contratos."
  - id: d
    text:
      es: "la ejecución de los acuerdos adoptados por el Director General."
  explanation:
    es: "El Presidente ostenta la representación legal de la Agencia en toda clase de actos y contratos. No hay umbral de cuantía en el precepto. La superior jefatura del personal es del Director General. Y es el Director General quien ejecuta los acuerdos del Presidente, no al revés."
  citation: "art. 103.Tres.2 Ley 31/1990"
  difficulty: 1
  tags:
  - "Presidente"
  - "competencias"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0024
  prompt:
    es: "Según el artículo 103.Tres.2 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, entre las facultades del Presidente de la Agencia se encuentra:"
  options:
  - id: a
    text:
      es: "contratar al personal en régimen de derecho laboral o privado dentro de los límites de la relación de puestos de trabajo aprobada."
  - id: b
    correct: true
    text:
      es: "aprobar la relación de puestos de trabajo y la oferta de empleo de la Agencia, así como sus modificaciones."
  - id: c
    text:
      es: "desempeñar la superior jefatura del personal de los Servicios Centrales y Periféricos de la Agencia."
  - id: d
    text:
      es: "ejecutar los acuerdos adoptados por el propio Presidente y dirigir el funcionamiento ordinario de los servicios."
  explanation:
    es: "El Presidente aprueba la relación de puestos de trabajo y la oferta de empleo, con sus modificaciones. Contratar personal laboral dentro de los límites de esa relación es del Director General. También lo es la superior jefatura del personal. Y la ejecución de los acuerdos del Presidente y el funcionamiento ordinario de los servicios son igualmente del Director General."
  citation: "art. 103.Tres.2 Ley 31/1990"
  difficulty: 2
  tags:
  - "Presidente"
  - "personal"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0025
  prompt:
    es: "¿Cuál de las siguientes facultades corresponde al Presidente de la Agencia Estatal de Administración Tributaria según el artículo 103.Tres.2 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991?"
  options:
  - id: a
    text:
      es: "Ejecutar los acuerdos adoptados por el Presidente de la Agencia."
  - id: b
    correct: true
    text:
      es: "Aprobar la estructura orgánica de la Agencia y los nombramientos y ceses del personal directivo."
  - id: c
    text:
      es: "Contratar al personal en régimen de derecho laboral o privado."
  - id: d
    text:
      es: "Desempeñar la superior jefatura del personal de la Agencia."
  explanation:
    es: "Aprobar la estructura orgánica y los nombramientos y ceses del personal directivo es una facultad del Presidente, según la letra c) del artículo 103.Tres.2. La superior jefatura del personal la desempeña el Director General. A este también le corresponde contratar al personal laboral dentro de la relación de puestos aprobada. Y ejecutar los acuerdos del Presidente es función del Director General, por definición."
  citation: "art. 103.Tres.2 Ley 31/1990"
  difficulty: 1
  tags:
  - "Presidente"
  - "estructura orgánica"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0026
  prompt:
    es: "De acuerdo con el artículo 103.Tres.2 y 3 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, señale la respuesta CORRECTA sobre el anteproyecto de presupuesto de la Agencia:"
  options:
  - id: a
    text:
      es: "Lo elabora el Presidente y lo aprueba el Director General para su elevación al Ministro."
  - id: b
    text:
      es: "Lo elabora y lo aprueba el Director General, sin intervención del Presidente."
  - id: c
    text:
      es: "Lo elaboran y lo aprueban los Directores de los Departamentos, que lo elevan al Presidente."
  - id: d
    correct: true
    text:
      es: "Lo elabora el Director General y lo aprueba el Presidente para su elevación al Ministro."
  explanation:
    es: "La elaboración del anteproyecto de Presupuesto y del Plan de Actuación es del Director General, y su aprobación para elevarlo al Ministro es del Presidente. No se invierten los papeles. Los Directores de los Departamentos no intervienen en esa elaboración según el precepto. Y el Director General no actúa sin el Presidente, que aprueba."
  citation: "art. 103.Tres.2 Ley 31/1990"
  difficulty: 3
  tags:
  - "Presidente"
  - "Director General"
  - "presupuesto"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0027
  prompt:
    es: "Conforme al artículo 103.Tres.2 y 3 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, señale la respuesta CORRECTA sobre las competencias en materia de personal de la Agencia:"
  options:
  - id: a
    text:
      es: "Tanto el Presidente como el Director General ejercen las competencias que las normas atribuyen al Ministro del Departamento."
  - id: b
    text:
      es: "El Presidente ejerce las competencias que las normas atribuyen al Subsecretario, y el Director General las del Ministro del Departamento."
  - id: c
    text:
      es: "El Presidente ejerce las competencias que las normas atribuyen al Secretario de Estado de Hacienda, y el Director General no ejerce ninguna."
  - id: d
    correct: true
    text:
      es: "El Presidente ejerce las competencias que las normas atribuyen al Ministro del Departamento o al Secretario de Estado de Hacienda, y el Director General las del Subsecretario."
  explanation:
    es: "El Presidente ejerce, respecto al personal, las competencias que las normas atribuyen al Ministro o al Secretario de Estado de Hacienda. El Director General asume las funciones atribuidas al Subsecretario. Intercambiarlas invierte el reparto. Repartirlas todas al Ministro ignora la función del Subsecretario. Y el Director General sí ejerce competencias: la superior jefatura del personal."
  citation: "art. 103.Tres.2 Ley 31/1990"
  difficulty: 3
  tags:
  - "Presidente"
  - "Director General"
  - "personal"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0028
  prompt:
    es: "De acuerdo con el artículo 103.Tres.3 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, el Director General de la Agencia dirige la ejecución del Plan de Actuaciones y:"
  options:
  - id: a
    correct: true
    text:
      es: "el funcionamiento ordinario de los servicios y actividades de la Agencia."
  - id: b
    text:
      es: "la elevación del anteproyecto de presupuesto al Ministro competente."
  - id: c
    text:
      es: "la superior dirección de la Agencia y su representación legal en toda clase de actos y contratos."
  - id: d
    text:
      es: "la aprobación de la estructura orgánica y de la relación de puestos de trabajo."
  explanation:
    es: "El Director General dirige la ejecución del Plan de Actuaciones y el funcionamiento ordinario de los servicios y actividades. La superior dirección y la representación legal son del Presidente. También lo son la aprobación de la estructura orgánica y de la relación de puestos de trabajo. Y la aprobación del anteproyecto para elevarlo al Ministro es igualmente del Presidente."
  citation: "art. 103.Tres.3 Ley 31/1990"
  difficulty: 2
  tags:
  - "Director General"
  - "funciones"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0029
  prompt:
    es: "De acuerdo con el artículo 103.Tres.3 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, señale la respuesta CORRECTA sobre la jefatura del personal de la Agencia Estatal de Administración Tributaria:"
  options:
  - id: a
    text:
      es: "La superior jefatura del personal corresponde al Director del Departamento de Recursos Humanos, respecto de todo el personal."
  - id: b
    correct: true
    text:
      es: "La superior jefatura del personal corresponde al Director General, respecto de todo el personal de sus Servicios Centrales o Periféricos."
  - id: c
    text:
      es: "La superior jefatura del personal corresponde al Comité Permanente de Dirección, que la ejerce colegiadamente."
  - id: d
    text:
      es: "La superior jefatura del personal corresponde al Presidente de la Agencia, que la ejerce directamente."
  explanation:
    es: "El Director General desempeña la superior jefatura del personal, con las funciones del Subsecretario y respecto de todo el personal de los Servicios Centrales o Periféricos. No es del Presidente, que aprueba la relación de puestos y la oferta de empleo. Tampoco del Director del Departamento de Recursos Humanos, cuya jefatura abarca solo a su Departamento. Y el Comité Permanente de Dirección es cauce de análisis y coordinación, no un órgano de jefatura."
  citation: "art. 103.Tres.3 Ley 31/1990"
  difficulty: 1
  tags:
  - "Director General"
  - "personal"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0031
  prompt:
    es: "Según el artículo 103.Tres.3 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, ¿a qué órgano corresponde la ejecución de los acuerdos adoptados por el Presidente de la Agencia?"
  options:
  - id: a
    text:
      es: "A los Directores de los Departamentos de la Agencia."
  - id: b
    text:
      es: "A los Delegados Especiales de la Agencia Tributaria."
  - id: c
    text:
      es: "Al Comité Permanente de Dirección de la Agencia."
  - id: d
    correct: true
    text:
      es: "Al Director General de la Agencia."
  explanation:
    es: "El Director General ejecuta los acuerdos que adopta el Presidente. Los Directores de los Departamentos dirigen sus órganos y unidades, no ejecutan los acuerdos del Presidente. Los Delegados Especiales dirigen su Delegación Especial. Y el Comité Permanente de Dirección es cauce de análisis y coordinación."
  citation: "art. 103.Tres.3 Ley 31/1990"
  difficulty: 1
  tags:
  - "Director General"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0099
  prompt:
    es: "Según el artículo 103.Tres.2 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, ¿a qué órgano corresponde la resolución de los procedimientos de responsabilidad patrimonial derivados de reclamaciones contra actos de la Agencia?"
  options:
  - id: a
    text:
      es: "Al Servicio Jurídico de la Agencia."
  - id: b
    text:
      es: "A los Directores de los Departamentos de la Agencia."
  - id: c
    correct: true
    text:
      es: "Al Presidente de la Agencia."
  - id: d
    text:
      es: "Al Comité Permanente de Dirección de la Agencia."
  explanation:
    es: "La resolución de los procedimientos de responsabilidad patrimonial es una de las facultades del Presidente, en la letra e) del artículo 103.Tres.2. El Servicio Jurídico asesora y representa en juicio, pero no figura como órgano resolutor. Los Directores de los Departamentos tampoco. Y el Comité Permanente de Dirección es un cauce de análisis y coordinación, no un órgano resolutor."
  citation: "art. 103.Tres.2 Ley 31/1990"
  difficulty: 2
  tags:
  - "Presidente"
  - "responsabilidad patrimonial"
# anchor: boe-a-1990-31180-art-103
- id: m03-l02-q0104
  prompt:
    es: "La Agencia Estatal de Administración Tributaria necesita contratar a una persona en régimen laboral para un puesto que cabe dentro de los límites de la relación de puestos de trabajo aprobada. Según el artículo 103 de la Ley 31/1990, de 27 de diciembre, de Presupuestos Generales del Estado para 1991, ¿a quién corresponde contratarla?"
  options:
  - id: a
    text:
      es: "Al Presidente de la Agencia, que aprueba la relación de puestos de trabajo."
  - id: b
    text:
      es: "Al Director del Departamento de Recursos Humanos de la Agencia."
  - id: c
    correct: true
    text:
      es: "Al Director General de la Agencia."
  - id: d
    text:
      es: "Al Delegado Especial del territorio donde se ubique el puesto."
  explanation:
    es: "Corresponde al Director General contratar al personal en régimen de derecho laboral o privado dentro de los límites de la relación de puestos de trabajo aprobada (art. 103.Tres.3). El Presidente aprueba esa relación y su oferta de empleo (art. 103.Tres.2.a), pero no contrata. El Director del Departamento de Recursos Humanos y el Delegado Especial dirigen sus ámbitos y no tienen atribuida esa contratación."
  citation: "art. 103.Tres.3 Ley 31/1990"
  difficulty: 1
  tags:
  - "Director General"
  - "personal laboral"
