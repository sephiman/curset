# anchor: boe-a-2009-20375-art-25
- id: m03-l01-q0078
  prompt:
    es: "De acuerdo con el artículo 25.2 de la Ley 22/2009, de 18 de diciembre, por la que se regula el sistema de financiación de las Comunidades Autónomas de régimen común y Ciudades con Estatuto de Autonomía, la eventual supresión o modificación por el Estado de alguno de los tributos cedidos implica:"
  options:
  - id: a
    text:
      es: "El mantenimiento de la cesión sobre el tributo suprimido hasta el final del ejercicio."
  - id: b
    text:
      es: "La conversión del tributo en un tributo propio de cada Comunidad Autónoma."
  - id: c
    text:
      es: "La compensación automática a las Comunidades Autónomas con cargo a los Presupuestos Generales del Estado."
  - id: d
    correct: true
    text:
      es: "La extinción o modificación de la cesión."
  explanation:
    es: "Si el Estado suprime o modifica el tributo, la cesión se extingue o se modifica con él. El precepto no mantiene la cesión sobre un tributo suprimido, ni lo convierte en propio de las Comunidades, ni prevé una compensación automática."
  citation: "art. 25.2 Ley 22/2009"
  difficulty: 2
  tags:
