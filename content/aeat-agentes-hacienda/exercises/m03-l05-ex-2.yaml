# anchor: boe-a-2003-23186-art-91
- id: m03-l05-q0034
  prompt:
    es: "¿Cuál es el plazo máximo de vigencia de un acuerdo previo de valoración, según el artículo 91.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si la normativa que lo establece no prevé otro distinto?"
  options:
  - id: a
    text:
      es: "Dos años, prorrogables por otros dos."
  - id: b
    text:
      es: "Cinco años desde su notificación."
  - id: c
    text:
      es: "Diez años desde la solicitud."
  - id: d
    correct: true
    text:
      es: "Tres años."
  explanation:
    es: "El artículo 91.5 fija un máximo de tres años salvo que la normativa que establezca el acuerdo prevea otro. No hay prórroga automática ni plazos de cinco o diez años."
  citation: "art. 91.5 LGT"
  difficulty: 1
  tags:
  - "acuerdo previo"
  - "plazo"
# anchor: boe-a-2003-23186-art-91
- id: m03-l05-q0035
  prompt:
    es: "Según el artículo 91.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, mientras no se modifique la legislación ni varíen significativamente las circunstancias económicas que fundamentaron la valoración, la Administración que hubiera dictado el acuerdo:"
  options:
  - id: a
    text:
      es: "podrá modificar los valores si lo notifica con un mes de antelación al obligado."
  - id: b
    text:
      es: "podrá aplicar otros valores si el obligado modifica después su declaración."
  - id: c
    correct: true
    text:
      es: "estará obligada a aplicar los valores expresados en el mismo."
  - id: d
    text:
      es: "solo estará obligada a aplicar los valores durante el primer ejercicio afectado."
  explanation:
    es: "El acuerdo vincula a la Administración que lo dictó mientras no cambien la legislación ni las circunstancias económicas que lo fundamentaron. Un aviso previo, una modificación de la declaración o el paso del primer ejercicio no la liberan."
  citation: "art. 91.5 LGT"
  difficulty: 2
  tags:
  - "acuerdo previo"
  - "vinculación"
# anchor: boe-a-2003-23186-art-91
- id: m03-l05-q0036
  prompt:
    es: "Conforme al artículo 91.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué puede impugnar el obligado que discrepa de los valores fijados en un acuerdo previo de valoración notificado por la Administración?"
  options:
  - id: a
    text:
      es: "El acuerdo mediante recurso de reposición, en el plazo de un mes desde su notificación."
  - id: b
    text:
      es: "El acuerdo mediante reclamación económico-administrativa, pero no los actos posteriores."
  - id: c
    text:
      es: "Ni el acuerdo ni los actos posteriores, porque ambos quedan excluidos de recurso."
  - id: d
    correct: true
    text:
      es: "No el acuerdo, pero sí el acto administrativo posterior que aplique las valoraciones."
  explanation:
    es: "El artículo 91.6 impide recurrir el acuerdo y permite recurrir los actos posteriores que apliquen las valoraciones. La reposición o la reclamación económico-administrativa contra el acuerdo no caben, y negar también el recurso contra los actos posteriores contradice el precepto."
  citation: "art. 91.6 LGT"
  difficulty: 2
  tags:
  - "acuerdo previo"
  - "recurso"
# anchor: boe-a-2007-15984-art-70
- id: m03-l05-q0037
  prompt:
    es: "¿Qué acredita el certificado tributario, entendido como el documento expedido por la Administración tributaria, según el artículo 70.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos?"
  options:
  - id: a
    text:
      es: "La titularidad de los bienes y derechos de un obligado frente a terceros."
  - id: b
    correct: true
    text:
      es: "Hechos relativos a la situación tributaria de un obligado tributario."
  - id: c
    text:
      es: "Los criterios administrativos aplicables a una operación que el obligado vaya a realizar."
  - id: d
    text:
      es: "El cumplimiento de sus obligaciones fiscales por los socios de una entidad."
  explanation:
    es: "El certificado acredita hechos relativos a la situación tributaria del obligado. La titularidad de bienes frente a terceros, los criterios aplicables a operaciones futuras y las obligaciones de los socios son contenidos ajenos a la definición del artículo 70.1."
  citation: "art. 70.1 RGAT"
  difficulty: 1
  tags:
  - "certificados"
  - "concepto"
# anchor: boe-a-2007-15984-art-70
- id: m03-l05-q0038
  prompt:
    es: "Según el artículo 70.2 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, los certificados tributarios podrán acreditar la existencia o inexistencia de deudas o sanciones pendientes de pago que consten en:"
  options:
  - id: a
    correct: true
    text:
      es: "las bases de datos de la Administración tributaria."
  - id: b
    text:
      es: "el Registro Mercantil y el Registro de la Propiedad."
  - id: c
    text:
      es: "las bases de datos de todas las Administraciones públicas."
  - id: d
    text:
      es: "los expedientes de las entidades colaboradoras en la recaudación."
  explanation:
    es: "El artículo 70.2 se refiere a las deudas o sanciones que consten en las bases de datos de la Administración tributaria. Los registros públicos, las bases de otras Administraciones y los expedientes de las entidades colaboradoras no son la fuente que cita."
  citation: "art. 70.2 RGAT"
  difficulty: 2
  tags:
  - "certificados"
  - "contenido"
# anchor: boe-a-2007-15984-art-70
- id: m03-l05-q0039
  prompt:
    es: "Conforme al artículo 70.3 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, señale la respuesta CORRECTA sobre los hechos o datos que se certifican en un certificado tributario:"
  options:
  - id: a
    text:
      es: "Pueden referirse a terceros vinculados con el obligado siempre que estos lo autoricen por escrito."
  - id: b
    text:
      es: "Se refieren exclusivamente al obligado, sin excepción alguna, aunque la finalidad del certificado exija otros datos."
  - id: c
    correct: true
    text:
      es: "Se refieren exclusivamente al obligado al que se refiere el certificado, salvo que la finalidad del certificado exija incluir datos de terceros."
  - id: d
    text:
      es: "Pueden incluir los datos de terceros que consten en las bases de datos, con independencia de su finalidad."
  explanation:
    es: "Los datos certificados se refieren exclusivamente al obligado, sin incluir datos de terceros, salvo que la finalidad del certificado exija esa inclusión (art. 70.3). No basta la autorización de los terceros, la exclusión no es absoluta y la finalidad sí condiciona la inclusión."
  citation: "art. 70.3 RGAT"
  difficulty: 2
  tags:
  - "certificados"
  - "datos de terceros"
# anchor: boe-a-2007-15984-art-70
- id: m03-l05-q0040
  prompt:
    es: "Según el artículo 70.4 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿qué ocurre cuando se solicita un certificado sobre los datos de una obligación tributaria respecto de la cual ya ha prescrito el derecho a liquidar la deuda?"
  options:
  - id: a
    text:
      es: "Se certificará solo que la autoliquidación se presentó en su día, sin referirse a la deuda."
  - id: b
    correct: true
    text:
      es: "No podrán certificarse datos referidos a esa obligación tributaria."
  - id: c
    text:
      es: "Se certificarán los datos si el obligado lo solicita expresamente y renuncia a la prescripción."
  - id: d
    text:
      es: "Se certificarán los datos con una mención expresa de que la obligación ha prescrito."
  explanation:
    es: "El artículo 70.4 prohíbe certificar datos de obligaciones cuyo derecho de liquidación ha prescrito, sin distinguir entre presentación y deuda. La solicitud expresa, la renuncia o la mención de la prescripción no levantan esa prohibición."
  citation: "art. 70.4 RGAT"
  difficulty: 2
  tags:
  - "certificados"
  - "prescripción"
# anchor: boe-a-2007-15984-art-70
- id: m03-l05-q0041
  prompt:
    es: "El plazo de presentación e ingreso de una autoliquidación de Imprenta Duero, S.L., termina el 20 de julio de 2026. El 10 de julio de 2026 la sociedad la presenta e ingresa y pide un certificado de cumplimiento. Conforme al artículo 70.5 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿puede expedirse?"
  options:
  - id: a
    text:
      es: "Sí, porque la sociedad ya ha presentado e ingresado antes de que venza el plazo."
  - id: b
    correct: true
    text:
      es: "No, mientras no haya vencido el plazo para cumplir la obligación no puede expedirse certificado sobre su cumplimiento."
  - id: c
    text:
      es: "Sí, aunque con carácter provisional hasta que venza el plazo de presentación."
  - id: d
    text:
      es: "No, porque el certificado de cumplimiento solo puede expedirse transcurrido un año."
  explanation:
    es: "Mientras no venza el plazo de cumplimiento, el artículo 70.5 no permite certificar el cumplimiento, aunque el obligado haya presentado e ingresado antes. El certificado no se expide con carácter provisional ni hay que esperar un año."
  citation: "art. 70.5 RGAT"
  difficulty: 3
  tags:
  - "certificados"
  - "cómputo"
  - "cumplimiento"
# anchor: boe-a-2007-15984-art-71
- id: m03-l05-q0042
  prompt:
    es: "Según el artículo 71.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, los certificados tributarios se expedirán a instancia del obligado o a petición de un órgano administrativo o de otra persona interesada, siempre que esa petición:"
  options:
  - id: a
    text:
      es: "acredite un interés legítimo y se motive por escrito ante el órgano competente."
  - id: b
    correct: true
    text:
      es: "esté prevista en una ley o cuente con el previo consentimiento del obligado tributario."
  - id: c
    text:
      es: "esté prevista en una ley y, además, cuente con el previo consentimiento expreso del obligado tributario."
  - id: d
    text:
      es: "se formule por medios electrónicos y esté firmada por el representante legal."
  explanation:
    es: "La petición de un tercero debe estar prevista en una ley o contar con el previo consentimiento del obligado: basta una de las dos condiciones. La opción que exige ambas las convierte en acumulativas, y ni el interés legítimo ni la forma electrónica figuran en el artículo."
  citation: "art. 71.1 RGAT"
  difficulty: 3
  tags:
  - "certificados"
  - "solicitud"
# anchor: boe-a-2007-15984-art-72
- id: m03-l05-q0044
  prompt:
    es: "¿Qué dato contendrán, al menos, los certificados tributarios además del nombre y apellidos o razón social o denominación completa y del número de identificación fiscal, conforme al artículo 72.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria?"
  options:
  - id: a
    text:
      es: "El domicilio designado por el obligado a efectos de notificaciones."
  - id: b
    text:
      es: "El código de la actividad económica principal del obligado."
  - id: c
    text:
      es: "El número de la cuenta bancaria en la que se domicilie el pago."
  - id: d
    correct: true
    text:
      es: "El domicilio fiscal del obligado tributario."
  explanation:
    es: "Entre los datos mínimos del artículo 72.1.a) está el domicilio fiscal del obligado. El domicilio de notificaciones, la actividad principal y la cuenta bancaria no figuran en esa lista."
  citation: "art. 72.1 RGAT"
  difficulty: 1
  tags:
  - "certificados"
  - "contenido"
# anchor: boe-a-2007-15984-art-72
- id: m03-l05-q0047
  prompt:
    es: "Según el artículo 72.1.b) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos, cuando las certificaciones sean negativas deberán indicarse:"
  options:
  - id: a
    correct: true
    text:
      es: "las circunstancias, obligaciones o requisitos que no consten cumplidos."
  - id: b
    text:
      es: "los motivos por los que el obligado no ha cumplido cada requisito exigido por la normativa."
  - id: c
    text:
      es: "las sanciones que correspondan por cada incumplimiento constatado."
  - id: d
    text:
      es: "el órgano que debe comprobar el cumplimiento de lo pendiente."
  explanation:
    es: "Una certificación negativa indica las circunstancias, obligaciones o requisitos que no constan cumplidos. El artículo no exige explicar los motivos del incumplimiento, citar sanciones ni nombrar un órgano de comprobación."
  citation: "art. 72.1 RGAT"
  difficulty: 2
  tags:
  - "certificados"
  - "negativo"
# anchor: boe-a-2007-15984-art-73
- id: m03-l05-q0049
  prompt:
    es: "Conforme al artículo 73.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, salvo que se establezca lo contrario, la falta de emisión de un certificado tributario en el plazo previsto:"
  options:
  - id: a
    correct: true
    text:
      es: "no determina que se entienda emitido con carácter positivo."
  - id: b
    text:
      es: "determina que se entienda emitido con carácter positivo."
  - id: c
    text:
      es: "determina que se entienda emitido con carácter negativo."
  - id: d
    text:
      es: "obliga a la Administración a expedirlo de oficio en un nuevo plazo de 10 días."
  explanation:
    es: "Sin previsión en contrario, el retraso no convierte el certificado en positivo. Tampoco lo convierte en negativo, y el artículo no prevé un nuevo plazo de diez días para expedirlo de oficio."
  citation: "art. 73.1 RGAT"
  difficulty: 2
  tags:
  - "certificados"
  - "silencio"
# anchor: boe-a-2007-15984-art-73
- id: m03-l05-q0050
  prompt:
    es: "¿Desde cuándo se cuenta el plazo de 10 días para que el obligado manifieste su disconformidad con los datos de un certificado ya emitido, según el artículo 73.4 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria?"
  options:
  - id: a
    text:
      es: "De la fecha en que se haya expedido el certificado."
  - id: b
    text:
      es: "De la fecha en que se presentó la solicitud del certificado."
  - id: c
    correct: true
    text:
      es: "Del día siguiente al de su recepción."
  - id: d
    text:
      es: "Del día siguiente a su puesta a disposición en la sede electrónica."
  explanation:
    es: "El plazo de diez días se cuenta desde el día siguiente al de la recepción del certificado. La fecha de expedición, la de la solicitud y la puesta a disposición en sede no son el inicio que fija el artículo 73.4."
  citation: "art. 73.4 RGAT"
  difficulty: 2
  tags:
  - "certificados"
  - "disconformidad"
# anchor: boe-a-2007-15984-art-73
- id: m03-l05-q0051
  prompt:
    es: "¿A quién se dirige el escrito con el que el obligado manifiesta su disconformidad con los datos de un certificado tributario ya emitido, según el artículo 73.4 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Al órgano que haya expedido el certificado."
  - id: b
    text:
      es: "Al tribunal económico-administrativo regional competente."
  - id: c
    text:
      es: "A la Dirección General de Tributos del Ministerio de Hacienda."
  - id: d
    text:
      es: "Al órgano de inspección que tramite el procedimiento del obligado."
  explanation:
    es: "El escrito se dirige al órgano que expidió el certificado, que es quien puede emitir uno nuevo. Los tribunales económico-administrativos no intervienen, porque contra los certificados no cabe recurso, y la Dirección General de Tributos y la inspección no son destinatarios que prevea el artículo."
  citation: "art. 73.4 RGAT"
  difficulty: 1
  tags:
  - "certificados"
  - "disconformidad"
# anchor: boe-a-2007-15984-art-73
- id: m03-l05-q0052
  prompt:
    es: "¿En qué plazo emite un nuevo certificado el órgano que, al revisar la disconformidad del obligado, estima incorrecto el expedido, conforme al artículo 73.4 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "En el plazo de 10 días."
  - id: b
    text:
      es: "En el plazo de 20 días."
  - id: c
    text:
      es: "En el plazo de tres meses."
  - id: d
    text:
      es: "En el plazo de cinco días."
  explanation:
    es: "La emisión del nuevo certificado se hace en 10 días (art. 73.4). Veinte días es el plazo general de expedición del artículo 73.1, tres meses la validez de un certificado de obligaciones no periódicas y cinco días no figura en el artículo."
  citation: "art. 73.4 RGAT"
  difficulty: 1
  tags:
  - "certificados"
  - "plazo"
# anchor: boe-a-2007-15984-art-75
- id: m03-l05-q0056
  prompt:
    es: "Según el artículo 75.2 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, los certificados tributarios tienen validez durante 12 meses o tres meses, según el tipo de obligación, salvo que:"
  options:
  - id: a
    text:
      es: "el obligado solicite su renovación antes de que venza el plazo."
  - id: b
    text:
      es: "la Administración notifique su revocación al interesado."
  - id: c
    text:
      es: "el certificado se destine a una Administración pública."
  - id: d
    correct: true
    text:
      es: "la normativa específica del certificado establezca otra cosa."
  explanation:
    es: "El plazo cede ante la normativa específica del certificado (art. 75.2). La renovación anticipada, la revocación notificada y el destino público no son excepciones que el artículo prevea."
  citation: "art. 75.2 RGAT"
  difficulty: 2
  tags:
  - "certificados"
  - "validez"
# anchor: boe-a-2007-15984-art-77
- id: m03-l05-q0057
  prompt:
    es: "Según el artículo 77.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, entre otras actuaciones la asistencia tributaria podrá consistir en la confección de declaraciones, autoliquidaciones y comunicaciones de datos, así como en:"
  options:
  - id: a
    text:
      es: "la presentación de recursos en nombre del obligado."
  - id: b
    correct: true
    text:
      es: "la confección de un borrador de declaración."
  - id: c
    text:
      es: "la representación del obligado ante los tribunales económico-administrativos."
  - id: d
    text:
      es: "la comprobación de los datos declarados por otros obligados."
  explanation:
    es: "El artículo 77.1 cita expresamente el borrador de declaración. La Administración no presenta recursos por el obligado, no lo representa ante los tribunales y no comprueba los datos de otros obligados en el marco de la asistencia."
  citation: "art. 77.1 RGAT"
  difficulty: 1
  tags:
  - "asistencia"
  - "actuaciones"
# anchor: boe-a-2007-15984-art-78
- id: m03-l05-q0059
  prompt:
    es: "¿Para la confección y presentación de qué documentos podrá facilitar la Administración tributaria a los obligados programas informáticos de asistencia, según el artículo 78.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Declaraciones, autoliquidaciones y comunicaciones de datos."
  - id: b
    text:
      es: "Recursos, reclamaciones y escritos de alegaciones."
  - id: c
    text:
      es: "Libros registro, facturas y justificantes de gasto."
  - id: d
    text:
      es: "Solicitudes de aplazamiento, fraccionamiento y compensación."
  explanation:
    es: "Los programas de asistencia sirven para confeccionar y presentar declaraciones, autoliquidaciones y comunicaciones de datos (art. 78.1). No se prevén para recursos, libros registro o solicitudes de aplazamiento."
  citation: "art. 78.1 RGAT"
  difficulty: 1
  tags:
  - "asistencia"
  - "programas"
# anchor: boe-a-2003-23186-art-91
- id: m03-l05-q0127
  prompt:
    es: "Conforme al artículo 91.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede obtenerse un acuerdo previo de valoración si la solicitud se presenta un mes después de realizado el hecho imponible y la normativa del tributo no fija plazos propios?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque la solicitud debía presentarse antes de la realización del hecho imponible."
  - id: b
    text:
      es: "Sí, porque basta presentarla dentro del mes siguiente a la realización del hecho imponible."
  - id: c
    text:
      es: "Sí, porque la Administración puede admitir cualquier solicitud mientras no haya prescrito el tributo."
  - id: d
    text:
      es: "No, porque el acuerdo previo de valoración solo puede solicitarse una vez cada tres años."
  explanation:
    es: "La regla general es que la solicitud se presente antes de realizar el hecho imponible, salvo que la normativa del tributo fije otros plazos, y aquí no los fija (art. 91.2). No existe un mes de gracia, la prescripción no es el límite y la limitación a una solicitud cada tres años es invención."
  citation: "art. 91.2 LGT"
  difficulty: 3
  tags:
  - "acuerdo previo"
  - "solicitud"
# anchor: boe-a-2003-23186-art-85
- id: m03-l05-q0132
  prompt:
    es: "Conforme al artículo 85.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, entre las actuaciones de información y asistencia figura la publicación de textos actualizados de las normas tributarias, así como de la doctrina administrativa de:"
  options:
  - id: a
    text:
      es: "los últimos cinco ejercicios, con independencia de su trascendencia."
  - id: b
    text:
      es: "los tribunales económico-administrativos, sea cual sea su repercusión."
  - id: c
    correct: true
    text:
      es: "mayor trascendencia."
  - id: d
    text:
      es: "los órganos de la Administración tributaria, solo si es vinculante."
  explanation:
    es: "La letra a) del artículo 85.2 habla de la doctrina administrativa de mayor trascendencia. No se limita a los últimos cinco ejercicios ni a la de los tribunales, y no exige que sea vinculante."
  citation: "art. 85.2 LGT"
  difficulty: 2
  tags:
  - "actuaciones"
  - "doctrina"
# anchor: boe-a-2007-15984-art-70
- id: m03-l05-q0133
  prompt:
    es: "¿Cuál de las siguientes circunstancias enumera expresamente el artículo 70.2 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos, como acreditable mediante un certificado tributario?"
  options:
  - id: a
    text:
      es: "La solvencia patrimonial del obligado ante las entidades financieras."
  - id: b
    correct: true
    text:
      es: "La presentación de declaraciones, autoliquidaciones y comunicaciones de datos."
  - id: c
    text:
      es: "La titularidad de los bienes inmuebles inscritos a nombre del obligado."
  - id: d
    text:
      es: "La existencia de relaciones comerciales entre el obligado y sus clientes habituales."
  explanation:
    es: "El artículo 70.2 enumera la presentación de declaraciones, autoliquidaciones y comunicaciones, la situación censal, el cumplimiento de obligaciones y la existencia o inexistencia de deudas o sanciones. La solvencia patrimonial, la titularidad de inmuebles y las relaciones comerciales no están en la enumeración."
  citation: "art. 70.2 RGAT"
  difficulty: 1
  tags:
  - "certificados"
  - "contenido"
# anchor: boe-a-2007-15984-art-72
- id: m03-l05-q0134
  prompt:
    es: "Según el artículo 72.1.c) del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, cuando no se pueda certificar la información solicitada, el certificado contendrá la inexistencia de esa información en las bases de datos de la Administración tributaria o:"
  options:
  - id: a
    correct: true
    text:
      es: "la improcedencia de suministrar dicha información."
  - id: b
    text:
      es: "la prescripción del derecho a liquidar la deuda."
  - id: c
    text:
      es: "la caducidad de la solicitud presentada por el obligado."
  - id: d
    text:
      es: "la renuncia del obligado a obtener el certificado."
  explanation:
    es: "Si no puede certificarse, el certificado hace constar la inexistencia de la información en las bases de datos o la improcedencia de suministrarla. La prescripción, la caducidad y la renuncia no son las menciones que prevé la letra c)."
  citation: "art. 72.1 RGAT"
  difficulty: 2
  tags:
  - "certificados"
  - "contenido"
# anchor: boe-a-2007-15984-art-75
- id: m03-l05-q0135
  prompt:
    es: "De acuerdo con el artículo 75.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria y de desarrollo de las normas comunes de los procedimientos de aplicación de los tributos, los certificados tributarios tienen carácter:"
  options:
  - id: a
    text:
      es: "informativo y pueden recurrirse en reposición en el plazo de un mes."
  - id: b
    correct: true
    text:
      es: "informativo y no se puede interponer recurso alguno contra ellos."
  - id: c
    text:
      es: "vinculante para la Administración y pueden recurrirse en vía económico-administrativa."
  - id: d
    text:
      es: "probatorio pleno y no pueden ser corregidos una vez expedidos."
  explanation:
    es: "El artículo 75.1 les da carácter informativo y excluye el recurso, sin perjuicio de la disconformidad del artículo 73.4 y de los recursos contra los actos posteriores. No son vinculantes, no tienen valor probatorio pleno y pueden corregirse mediante la disconformidad."
  citation: "art. 75.1 RGAT"
  difficulty: 1
  tags:
  - "certificados"
  - "recurso"
# anchor: boe-a-2003-23186-art-91
- id: m03-l05-q0137
  prompt:
    es: "De acuerdo con el artículo 91.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los obligados tributarios podrán solicitar un acuerdo previo de valoración cuando:"
  options:
  - id: a
    text:
      es: "lo apruebe el Director General de la Agencia Tributaria mediante resolución."
  - id: b
    text:
      es: "la Administración lo ofrezca de oficio al iniciar actuaciones de comprobación."
  - id: c
    correct: true
    text:
      es: "las leyes o los reglamentos propios de cada tributo así lo prevean."
  - id: d
    text:
      es: "la valoración afecte a más de un ejercicio del mismo impuesto."
  explanation:
    es: "El artículo 91.1 condiciona la solicitud a que las leyes o los reglamentos propios de cada tributo lo prevean. No depende de una resolución del Director General, de un ofrecimiento de oficio ni del número de ejercicios afectados."
  citation: "art. 91.1 LGT"
  difficulty: 1
  tags:
  - "acuerdo previo"
  - "solicitud"
# anchor: boe-a-2003-23186-art-90
- id: m03-l05-q0138
  prompt:
    es: "Conforme al artículo 90.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la información sobre el valor de un inmueble solo vincula a la Administración si se han proporcionado datos:"
  options:
  - id: a
    text:
      es: "completos y verificados por fedatario público."
  - id: b
    text:
      es: "ciertos y avalados por una entidad financiera."
  - id: c
    correct: true
    text:
      es: "verdaderos y suficientes a la Administración tributaria."
  - id: d
    text:
      es: "suficientes y certificados por un colegio profesional o por un fedatario público."
  explanation:
    es: "Uno de los requisitos del artículo 90.2 es haber proporcionado datos verdaderos y suficientes. No exige verificación notarial, aval bancario ni certificación de un colegio profesional."
  citation: "art. 90.2 LGT"
  difficulty: 1
  tags:
  - "información previa"
  - "requisito"
