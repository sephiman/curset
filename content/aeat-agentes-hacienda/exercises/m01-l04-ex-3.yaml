# anchor: boe-a-1978-31229-art-145
- id: m01-l04-q0020
  prompt:
    es: "Señale la respuesta correcta sobre los acuerdos de cooperación entre Comunidades Autónomas distintos de los convenios que prevean sus Estatutos, conforme al artículo 145.2 de la Constitución Española de 1978:"
  options:
  - id: a
    correct: true
    text:
      es: "Necesitan la autorización de las Cortes Generales."
  - id: b
    text:
      es: "Necesitan la autorización del Gobierno de la Nación."
  - id: c
    text:
      es: "Necesitan la aprobación del Senado por mayoría absoluta."
  - id: d
    text:
      es: "No necesitan autorización, pues basta su comunicación a las Cortes Generales."
  explanation:
    es: "Los acuerdos de cooperación que no sean los convenios previstos en los Estatutos necesitan la autorización de las Cortes Generales. El Gobierno de la Nación no los autoriza, ni el Senado por mayoría absoluta. La simple comunicación a las Cortes es el régimen de los convenios que los Estatutos prevean para la gestión y prestación de servicios propios, no el de los demás acuerdos."
  citation: "art. 145.2 CE"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-143
- id: m01-l04-q0021
  prompt:
    es: "Conforme al artículo 143.1 de la Constitución Española de 1978, pueden acceder a su autogobierno y constituirse en Comunidades Autónomas las provincias limítrofes con:"
  options:
  - id: a
    text:
      es: "Características geográficas, históricas y demográficas comunes."
  - id: b
    text:
      es: "Una población superior a la media nacional y una lengua propia."
  - id: c
    text:
      es: "Un mismo sistema de financiación y una misma capital."
  - id: d
    correct: true
    text:
      es: "Características históricas, culturales y económicas comunes."
  explanation:
    es: "Las provincias limítrofes deben tener características históricas, culturales y económicas comunes. Las características geográficas y demográficas, la población superior a la media con lengua propia y el sistema de financiación con una capital común no son los requisitos del artículo 143.1."
  citation: "art. 143.1 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-147
- id: m01-l04-q0022
  prompt:
    es: "De acuerdo con el artículo 147.1 de la Constitución Española de 1978, dentro de los términos de la Constitución, los Estatutos serán:"
  options:
  - id: a
    text:
      es: "La norma institucional superior de cada Comunidad Autónoma."
  - id: b
    text:
      es: "La norma suprema del ordenamiento jurídico de cada Comunidad Autónoma."
  - id: c
    text:
      es: "La norma básica de organización de las instituciones del Estado en cada Comunidad."
  - id: d
    correct: true
    text:
      es: "La norma institucional básica de cada Comunidad Autónoma."
  explanation:
    es: "El artículo 147.1 dice que los Estatutos serán «la norma institucional básica de cada Comunidad Autónoma». La palabra es «básica», no «superior» ni «suprema»: el Estatuto actúa dentro de los términos de la Constitución. El Estatuto organiza las instituciones de la Comunidad, no las del Estado."
  citation: "art. 147.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-81
- id: m01-l04-q0023
  prompt:
    es: "Según el artículo 81.1 de la Constitución Española de 1978, ¿mediante qué tipo de norma se aprueban los Estatutos de Autonomía?"
  options:
  - id: a
    text:
      es: "Mediante ley ordinaria de las Cortes Generales."
  - id: b
    text:
      es: "Mediante ley de la Asamblea Legislativa de la Comunidad."
  - id: c
    correct: true
    text:
      es: "Mediante ley orgánica de las Cortes Generales."
  - id: d
    text:
      es: "Mediante ley marco de las Cortes Generales."
  explanation:
    es: "El artículo 81.1 dice: «Son leyes orgánicas las relativas al desarrollo de los derechos fundamentales y de las libertades públicas, las que aprueben los Estatutos de Autonomía». No basta una ley ordinaria. La Asamblea de la Comunidad no aprueba su propio Estatuto. La ley marco es la técnica del artículo 150.1 para atribuir facultades legislativas."
  citation: "art. 81.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-152
- id: m01-l04-q0025
  prompt:
    es: "Según el artículo 152.2 de la Constitución Española de 1978, una vez sancionados y promulgados los Estatutos aprobados por el procedimiento del artículo 151, ¿cómo podrán modificarse?"
  options:
  - id: a
    text:
      es: "Solamente mediante los procedimientos en ellos establecidos, sin necesidad de referéndum."
  - id: b
    text:
      es: "Solamente mediante ley orgánica aprobada por mayoría de tres quintos de cada Cámara."
  - id: c
    text:
      es: "Solamente mediante referéndum convocado por el Gobierno a propuesta de la Asamblea Legislativa."
  - id: d
    correct: true
    text:
      es: "Solamente mediante los procedimientos en ellos establecidos y con referéndum entre los electores inscritos en los censos correspondientes."
  explanation:
    es: "El artículo 152.2 dice que esos Estatutos «solamente podrán ser modificados mediante los procedimientos en ellos establecidos y con referéndum entre los electores inscritos en los censos correspondientes». El referéndum es necesario. La Constitución no pide tres quintos de cada Cámara para la ley orgánica de reforma. El referéndum se suma al procedimiento del Estatuto, no lo sustituye."
  citation: "art. 152.2 CE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-1978-31229-art-147
- id: m01-l04-q0027
  prompt:
    es: "¿Cuál de los siguientes criterios fija la Constitución Española de 1978 para la denominación de la Comunidad que deben contener los Estatutos de autonomía?"
  options:
  - id: a
    text:
      es: "La que acuerden las Diputaciones provinciales y las dos terceras partes de los municipios interesados."
  - id: b
    text:
      es: "La que apruebe el cuerpo electoral de las provincias afectadas en el referéndum de ratificación."
  - id: c
    correct: true
    text:
      es: "La que mejor corresponda a su identidad histórica."
  - id: d
    text:
      es: "La que fijen las Cortes Generales en la ley orgánica de autorización por motivos de interés nacional."
  explanation:
    es: "El artículo 147.2.a) exige en los Estatutos «la denominación de la Comunidad que mejor corresponda a su identidad histórica». El acuerdo de las Diputaciones y de dos tercios de los municipios es la iniciativa del proceso autonómico (art. 143.2), no un criterio para el nombre. El referéndum de ratificación del artículo 151.1 versa sobre la iniciativa. Las leyes orgánicas del artículo 144 autorizan o acuerdan, pero la Constitución no les encarga fijar la denominación."
  citation: "art. 147.2 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-81
- id: m01-l04-q0028
  prompt:
    es: "Según el artículo 81.2 de la Constitución Española de 1978, la aprobación, modificación o derogación de las leyes orgánicas, entre ellas la de los Estatutos de Autonomía, exigirá:"
  options:
  - id: a
    text:
      es: "Mayoría absoluta de cada una de las Cámaras, en una votación final sobre el conjunto del proyecto."
  - id: b
    correct: true
    text:
      es: "Mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto."
  - id: c
    text:
      es: "Mayoría de tres quintos del Congreso, en una votación final sobre el conjunto del proyecto."
  - id: d
    text:
      es: "Mayoría simple del Congreso, con ratificación del Senado, artículo por artículo."
  explanation:
    es: "El artículo 81.2 pide mayoría absoluta del Congreso en una votación final sobre el conjunto del proyecto. El artículo habla del Congreso, no de la mayoría absoluta de cada Cámara. Los tres quintos no figuran en el artículo 81.2. La mayoría simple con ratificación del Senado, artículo por artículo, es un procedimiento que el artículo no recoge."
  citation: "art. 81.2 CE"
  difficulty: 3
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-147
- id: m01-l04-q0029
  prompt:
    es: "Según el artículo 147.2 de la Constitución Española de 1978, los Estatutos de autonomía deberán contener la denominación, organización y sede de:"
  options:
  - id: a
    text:
      es: "Las Corporaciones locales de su territorio."
  - id: b
    correct: true
    text:
      es: "Las instituciones autónomas propias."
  - id: c
    text:
      es: "Los órganos de la Administración del Estado en la Comunidad."
  - id: d
    text:
      es: "Los partidos políticos con representación en la Asamblea."
  explanation:
    es: "Entre los contenidos obligatorios de los Estatutos figura la denominación, organización y sede de las instituciones autónomas propias. Las Corporaciones locales no son instituciones de la Comunidad. Los órganos de la Administración del Estado dependen del Gobierno de la Nación, y el Delegado dirige esa Administración según el artículo 154. Los partidos políticos no son instituciones autónomas."
  citation: "art. 147.2 CE"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-152
- id: m01-l04-q0030
  prompt:
    es: "De acuerdo con el artículo 152.1 de la Constitución Española de 1978, en los Estatutos aprobados por el procedimiento del artículo 151, al Presidente de la Comunidad le corresponde:"
  options:
  - id: a
    text:
      es: "La dirección del Consejo de Gobierno, la suprema representación de la Comunidad y la dirección de la Administración del Estado en ella."
  - id: b
    text:
      es: "La dirección del Consejo de Gobierno y la suprema representación de la Comunidad, pero no la representación del Estado."
  - id: c
    correct: true
    text:
      es: "La dirección del Consejo de Gobierno, la suprema representación de la Comunidad y la ordinaria del Estado en aquella."
  - id: d
    text:
      es: "La presidencia de la Asamblea Legislativa, la suprema representación de la Comunidad y la ordinaria del Estado en aquella."
  explanation:
    es: "El artículo 152.1 dice que al Presidente «corresponde la dirección del Consejo de Gobierno, la suprema representación de la respectiva Comunidad y la ordinaria del Estado en aquélla». La Administración del Estado en la Comunidad la dirige el Delegado del Gobierno (art. 154). La representación ordinaria del Estado sí es del Presidente. El artículo no le atribuye la presidencia de la Asamblea."
  citation: "art. 152.1 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-152
- id: m01-l04-q0031
  prompt:
    es: "Según el artículo 152.1 de la Constitución Española de 1978, ¿cómo se designa al Presidente de las Comunidades Autónomas cuyos Estatutos se aprobaron por el procedimiento del artículo 151?"
  options:
  - id: a
    text:
      es: "Es elegido por la Asamblea, de entre sus miembros, y nombrado por el Presidente del Gobierno."
  - id: b
    text:
      es: "Es elegido por sufragio universal directo de los electores de la Comunidad y nombrado por el Rey."
  - id: c
    text:
      es: "Es elegido por la Asamblea, entre cualesquiera ciudadanos de la Comunidad, y nombrado por el Rey."
  - id: d
    correct: true
    text:
      es: "Es elegido por la Asamblea, de entre sus miembros, y nombrado por el Rey."
  explanation:
    es: "El artículo 152.1 prevé «un Presidente, elegido por la Asamblea, de entre sus miembros, y nombrado por el Rey». No lo nombra el Presidente del Gobierno. No lo eligen directamente los electores. Debe ser miembro de la Asamblea."
  citation: "art. 152.1 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-148
- id: m01-l04-q0037
  prompt:
    es: "Según el artículo 148.1 de la Constitución Española de 1978, ¿cuál de las siguientes materias relativas a los montes pueden asumir las Comunidades Autónomas?"
  options:
  - id: a
    text:
      es: "La legislación básica sobre montes y aprovechamientos forestales."
  - id: b
    text:
      es: "La legislación básica sobre vías pecuarias y aprovechamientos forestales."
  - id: c
    correct: true
    text:
      es: "Los montes y aprovechamientos forestales."
  - id: d
    text:
      es: "La legislación sobre montes, aprovechamientos forestales y vías pecuarias."
  explanation:
    es: "El artículo 148.1.8.ª incluye entre las materias que pueden asumir las Comunidades «los montes y aprovechamientos forestales». La legislación básica sobre montes, aprovechamientos forestales y vías pecuarias es competencia exclusiva del Estado (art. 149.1.23.ª). La legislación sobre montes, aprovechamientos forestales y vías pecuarias tampoco es materia de la lista del 148.1."
  citation: "art. 148.1.8.ª CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m01-l04-q0038
  prompt:
    es: "De acuerdo con el artículo 149.1 de la Constitución Española de 1978, el Estado tiene competencia exclusiva sobre la siguiente materia:"
  options:
  - id: a
    correct: true
    text:
      es: "Tráfico y circulación de vehículos a motor; correos y telecomunicaciones."
  - id: b
    text:
      es: "Las carreteras cuyo itinerario se desarrolle íntegramente en el territorio de la Comunidad Autónoma."
  - id: c
    text:
      es: "Los puertos de refugio y los puertos y aeropuertos deportivos."
  - id: d
    text:
      es: "La coordinación y demás facultades en relación con las policías locales."
  explanation:
    es: "El artículo 149.1.21.ª atribuye al Estado en exclusiva el «tráfico y circulación de vehículos a motor; correos y telecomunicaciones». Las carreteras con itinerario íntegro en la Comunidad (art. 148.1.5.ª), los puertos de refugio y deportivos (art. 148.1.6.ª) y la coordinación de las policías locales (art. 148.1.22.ª) son materias que pueden asumir las Comunidades."
  citation: "art. 149.1.21.ª CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-149
- id: m01-l04-q0039
  prompt:
    es: "¿A quién atribuye la Constitución Española de 1978 la competencia sobre el tráfico y la circulación de vehículos a motor?"
  options:
  - id: a
    text:
      es: "A las Comunidades Autónomas que la asuman en sus Estatutos."
  - id: b
    correct: true
    text:
      es: "Al Estado, como competencia exclusiva."
  - id: c
    text:
      es: "Al Estado la legislación básica y a las Comunidades Autónomas su desarrollo."
  - id: d
    text:
      es: "A las Comunidades Autónomas, dentro de su territorio, en todo caso."
  explanation:
    es: "El artículo 149.1.21.ª pone el «tráfico y circulación de vehículos a motor» entre las materias de competencia exclusiva del Estado. No está en la lista del artículo 148.1, así que no es materia que asuman las Comunidades por su Estatuto. El artículo no la divide en bases estatales y desarrollo autonómico."
  citation: "art. 149.1.21.ª CE"
  difficulty: 1
  tags:
  - "competencia"
