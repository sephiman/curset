# anchor: fuente-ms-win-compartir-red-html
- id: m06-l03-q107
  prompt:
    es: "En Windows 11, al ir a Red en el Explorador de archivos aparece «La detección de redes está desactivada...». ¿Qué se activa desde el banner para ver los dispositivos que comparten archivos?"
  options:
  - id: a
    text:
      es: "El uso compartido con protección por contraseña"
  - id: b
    text:
      es: "La búsqueda de contenido en la nube de la cuenta de Microsoft"
  - id: c
    text:
      es: "La opción Volver a conectar al iniciar sesión"
  - id: d
    correct: true
    text:
      es: "La detección de redes y el uso compartido de archivos"
  explanation:
    es: "La página indica que se selecciona el banner y, después, «Activar la detección de redes y el uso compartido de archivos». El uso compartido con protección por contraseña es lo que la misma página manda desactivar al solucionar problemas. La búsqueda de contenido en la nube da resultados de OneDrive y Outlook en Windows Search. «Volver a conectar al iniciar sesión» es una casilla de Asignar unidad de red."
  citation: "fuente: `ms-win-compartir-red.html`; «¿Cómo puedo activar la Detección de redes?»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-compartir-red-html
- id: m06-l03-q108
  prompt:
    es: "En Windows 11, para solucionar problemas al compartir archivos en red, ¿cuál de los siguientes ajustes indica Microsoft para «Todas las redes» en la ventana «Configuración de uso compartido avanzado»?"
  options:
  - id: a
    text:
      es: "Activar el uso compartido con protección por contraseña"
  - id: b
    text:
      es: "Desactivar la detección de redes en todas las redes"
  - id: c
    correct: true
    text:
      es: "Desactivar el uso compartido con protección por contraseña"
  - id: d
    text:
      es: "Desactivar el uso compartido de archivos e impresoras"
  explanation:
    es: "La página indica: «En Todas las redes, desactive el uso compartido con protección por contraseña». Activarlo es lo contrario. La detección de redes y el uso compartido de archivos e impresoras se activan, en «Redes privadas»; desactivarlos impediría compartir."
  citation: "fuente: `ms-win-compartir-red.html`; «¿Cómo soluciono problemas de compartir archivos y carpetas?»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-compartir-red-html
- id: m06-l03-q109
  prompt:
    es: "En Windows 11, para que los servicios de uso compartido de archivos se inicien automáticamente, ¿qué se escribe en el cuadro de diálogo Ejecutar antes de abrir sus propiedades?"
  options:
  - id: a
    text:
      es: "regedit"
  - id: b
    text:
      es: "eventvwr.msc"
  - id: c
    text:
      es: "msinfo32"
  - id: d
    correct: true
    text:
      es: "services.msc"
  explanation:
    es: "La página indica que se pulsa Windows+R, se escribe services.msc y, en cada servicio de detección, se fija el tipo de inicio Automático. Las otras tres órdenes también se escriben en Ejecutar, pero abren otra herramienta según la página de herramientas del sistema: regedit el Editor del Registro, eventvwr.msc el Visor de eventos y msinfo32 la Información del sistema."
  citation: "fuente: `ms-win-compartir-red.html`; «¿Cómo soluciono problemas de compartir archivos y carpetas?»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-onedrive-restaurar-html
- id: m06-l03-q110
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes comandos del menú contextual de la Papelera de reciclaje devuelve los archivos seleccionados a su carpeta original?"
  options:
  - id: a
    correct: true
    text:
      es: "Restaurar"
  - id: b
    text:
      es: "Extraer todo..."
  - id: c
    text:
      es: "Anclar a acceso rápido"
  - id: d
    text:
      es: "Conceder acceso a"
  explanation:
    es: "La página indica que se abre la Papelera de reciclaje, se seleccionan los archivos, se hace clic con el botón derecho y se selecciona «Restaurar»; el archivo o la carpeta se restaura a su carpeta original. «Extraer todo...» descomprime una carpeta comprimida. «Anclar a acceso rápido» fija una carpeta en Acceso rápido. «Conceder acceso a» comparte en la red."
  citation: "fuente: `ms-onedrive-restaurar.html`; «Restaurar archivos o carpetas de OneDrive desde la papelera de reciclaje del equipo»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-onedrive-restaurar-html
- id: m06-l03-q111
  prompt:
    es: "En Windows 11 se elimina de la nube un archivo de OneDrive marcado como solo en línea. ¿Desde dónde indica Microsoft que puede restaurarse?"
  options:
  - id: a
    text:
      es: "Desde la Papelera de reciclaje del equipo, con Restaurar"
  - id: b
    text:
      es: "Desde la sección Recientes de Inicio del Explorador de archivos"
  - id: c
    correct: true
    text:
      es: "Desde la papelera de reciclaje web de OneDrive o de SharePoint, no desde la del equipo"
  - id: d
    text:
      es: "Desde la carpeta Documentos del perfil de usuario del equipo"
  explanation:
    es: "La nota de la página dice que los archivos eliminados de la nube, también los marcados como solo en línea, no aparecen en la Papelera de reciclaje del equipo, y que pueden restaurarse desde la papelera de reciclaje web de OneDrive o SharePoint. Por eso la Papelera del equipo, con Restaurar, no sirve aquí, y la sección Recientes o la carpeta Documentos no son el lugar que la página indica."
  citation: "fuente: `ms-onedrive-restaurar.html`; «Restaurar archivos o carpetas de OneDrive desde la papelera de reciclaje del equipo»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-onedrive-restaurar-html
- id: m06-l03-q112
  prompt:
    es: "En Windows 11 se eliminan archivos de las carpetas de OneDrive del equipo y no aparecen en línea. ¿Cuál de los siguientes lugares indica Microsoft que se compruebe?"
  options:
  - id: a
    text:
      es: "La Bóveda personal de OneDrive en el equipo"
  - id: b
    correct: true
    text:
      es: "La Papelera de reciclaje de Windows del equipo"
  - id: c
    text:
      es: "La sección Recientes de Inicio del Explorador de archivos"
  - id: d
    text:
      es: "La carpeta Descargas del perfil de usuario"
  explanation:
    es: "La página dice que, si se eliminan archivos de las carpetas de OneDrive o no se encuentran en línea, se compruebe si están en el contenedor de reciclaje de Windows, es decir, la Papelera de reciclaje del equipo. La Bóveda personal aparece en la página solo como un comando de la papelera web de OneDrive («Mostrar elementos de la Bóveda personal»). Ni Recientes ni Descargas son el lugar que la página manda comprobar."
  citation: "fuente: `ms-onedrive-restaurar.html`; «Restaurar archivos o carpetas de OneDrive desde la papelera de reciclaje del equipo»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-onedrive-restaurar-html
- id: m06-l03-q113
  prompt:
    es: "Con una cuenta personal de Microsoft, y según la ayuda de OneDrive, pueden restaurarse los archivos o carpetas de OneDrive eliminados:"
  options:
  - id: a
    text:
      es: "En los últimos 93 días"
  - id: b
    text:
      es: "En los últimos 60 días"
  - id: c
    correct: true
    text:
      es: "En los últimos 30 días"
  - id: d
    text:
      es: "En los últimos 7 días"
  explanation:
    es: "La nota de la página dice que, para las cuentas personales, se pueden restaurar los archivos o carpetas eliminados en los últimos 30 días. 93 días es el plazo de las cuentas profesionales o educativas, salvo que el administrador cambie la retención. 60 y 7 días no aparecen en la página."
  citation: "fuente: `ms-onedrive-restaurar.html`; «Restaurar archivos eliminados de su OneDrive»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-onedrive-restaurar-html
- id: m06-l03-q115
  prompt:
    es: "Señale la afirmación correcta sobre la restauración de archivos eliminados de OneDrive, según la ayuda de Microsoft para Windows:"
  options:
  - id: a
    correct: true
    text:
      es: "Solo se restauran archivos del propio OneDrive, no los que otra persona ha compartido"
  - id: b
    text:
      es: "También se restauran los archivos que otra persona ha compartido con el usuario"
  - id: c
    text:
      es: "Se restauran aunque se hayan eliminado permanentemente de la papelera de reciclaje de OneDrive"
  - id: d
    text:
      es: "Con una cuenta personal se restauran los eliminados en los últimos 93 días"
  explanation:
    es: "La página dice que solo se pueden restaurar archivos o carpetas del propio OneDrive, no archivos que otra persona haya compartido. También dice que no se pueden restaurar después de eliminarlos permanentemente de la papelera de reciclaje de OneDrive, y que con una cuenta personal el plazo es de 30 días; 93 días es el de las cuentas profesionales o educativas."
  citation: "fuente: `ms-onedrive-restaurar.html`; «Restaurar archivos eliminados de su OneDrive»"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-ms-win-directivas-explorador-html
- id: m06-l03-q116
  prompt:
    es: "En Windows 11, con la directiva «No mover archivos eliminados a la papelera de reciclaje» habilitada, ¿qué ocurre con los archivos que se eliminan en el Explorador de archivos?"
  options:
  - id: a
    text:
      es: "Van a la Papelera de reciclaje tras aceptar un cuadro de diálogo de confirmación"
  - id: b
    correct: true
    text:
      es: "No van a la Papelera de reciclaje y se eliminan permanentemente"
  - id: c
    text:
      es: "Van a la Papelera de reciclaje hasta llenar su tamaño máximo"
  - id: d
    text:
      es: "Van a la papelera de reciclaje web de OneDrive en la nube"
  explanation:
    es: "La directiva dice que, si se habilita, los archivos y carpetas que se eliminan mediante el Explorador de archivos no se colocan en la Papelera de reciclaje y, por tanto, se eliminan permanentemente. El cuadro de confirmación es otra directiva, «Mostrar cuadro de diálogo de confirmación al eliminar archivos». El tamaño máximo lo fija «Tamaño máximo permitido de la papelera de reciclaje». La directiva no envía nada a OneDrive."
  citation: "fuente: `ms-win-directivas-explorador.html`; «No mover archivos eliminados a la papelera de reciclaje»"
  difficulty: 1
  tags:
  - "comportamiento"
  - "configuración"
# anchor: fuente-ms-win-directivas-explorador-html
- id: m06-l03-q117
  prompt:
    es: "En Windows 11, si la directiva «No mover archivos eliminados a la papelera de reciclaje» está deshabilitada o no se ha establecido, ¿cuál de los siguientes es el comportamiento al eliminar en el Explorador de archivos?"
  options:
  - id: a
    text:
      es: "Los archivos y carpetas eliminados se eliminan siempre permanentemente"
  - id: b
    correct: true
    text:
      es: "Los archivos y carpetas eliminados se colocan en la Papelera de reciclaje"
  - id: c
    text:
      es: "Los archivos y carpetas eliminados se mueven al Historial de archivos de la unidad externa"
  - id: d
    text:
      es: "Los archivos y carpetas eliminados piden confirmación antes de borrarse"
  explanation:
    es: "La directiva dice que, si se deshabilita o no se establece, los archivos y carpetas eliminados mediante el Explorador de archivos se colocan en la Papelera de reciclaje. La eliminación permanente es el efecto de habilitarla. El Historial de archivos copia bibliotecas en una unidad externa; no recibe lo eliminado. El cuadro de confirmación depende de otra directiva y, si no se configura, no se muestra."
  citation: "fuente: `ms-win-directivas-explorador.html`; «No mover archivos eliminados a la papelera de reciclaje»"
  difficulty: 2
  tags:
  - "comportamiento"
  - "configuración"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q122
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué método abreviado de teclado selecciona el cuadro de búsqueda para escribir un término?"
  options:
  - id: a
    text:
      es: "Alt+D"
  - id: b
    text:
      es: "Ctrl+I"
  - id: c
    correct: true
    text:
      es: "Ctrl+E"
  - id: d
    text:
      es: "Ctrl+Mayús+E"
  explanation:
    es: "La tabla del Explorador de archivos asigna a Ctrl+E «Seleccionar el cuadro de búsqueda». En la misma tabla, Alt+D selecciona la barra de direcciones, Ctrl+I se centra en la barra de direcciones y Ctrl+Mayús+E expande todas las carpetas del árbol en el panel de navegación."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q123
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes acciones realiza la tecla F3 según la tabla de métodos abreviados de teclado de Microsoft?"
  options:
  - id: a
    text:
      es: "Cambiar el nombre del elemento seleccionado"
  - id: b
    correct: true
    text:
      es: "Buscar un archivo o una carpeta"
  - id: c
    text:
      es: "Seleccionar la barra de direcciones para cambiar la ruta"
  - id: d
    text:
      es: "Actualizar la ventana del Explorador de archivos"
  explanation:
    es: "La tabla del Explorador de archivos asigna a F3 «Buscar un archivo o carpeta». En la misma tabla, F2 cambia el nombre del elemento seleccionado, F4 selecciona la barra de direcciones para cambiar la ruta de acceso y F5 actualiza la ventana."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q124
  prompt:
    es: "En Windows 11, ¿qué hace el método abreviado de teclado Windows+Ctrl+F según la tabla de métodos abreviados con la tecla Windows de Microsoft?"
  options:
  - id: a
    text:
      es: "Seleccionar el cuadro de búsqueda del Explorador"
  - id: b
    text:
      es: "Buscar un archivo o carpeta en el Explorador"
  - id: c
    text:
      es: "Abrir el Explorador de archivos en Inicio"
  - id: d
    correct: true
    text:
      es: "Buscar dispositivos en una red"
  explanation:
    es: "La tabla de la tecla Windows asigna a Windows+Ctrl+F «Buscar dispositivos en una red». Seleccionar el cuadro de búsqueda del Explorador es Ctrl+E, buscar un archivo o carpeta en el Explorador es F3 y abrir el Explorador de archivos es Windows+E."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-explorador-lector-html
- id: m06-l03-q125
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿dónde busca el cuadro de búsqueda de la barra de herramientas cuando se escribe un término?"
  options:
  - id: a
    text:
      es: "Solo en los archivos de OneDrive de la cuenta iniciada"
  - id: b
    text:
      es: "Solo en las carpetas ancladas en Acceso rápido de Inicio"
  - id: c
    text:
      es: "Solo en las carpetas Documentos, Imágenes y Música"
  - id: d
    correct: true
    text:
      es: "Dentro de la carpeta o biblioteca abierta en ese momento"
  explanation:
    es: "La página dice que el cuadro de búsqueda, situado en la barra de herramientas, ayuda a encontrar un archivo dentro de una carpeta o biblioteca específica. Buscar solo en OneDrive o solo en las carpetas ancladas en Acceso rápido, o limitarse a Documentos, Imágenes y Música, no es el ámbito que da la página."
  citation: "fuente: `ms-win-explorador-lector.html`; «Usar el cuadro de búsqueda»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-explorador-lector-html
- id: m06-l03-q126
  prompt:
    es: "En el Explorador de archivos de Windows 11, tras pulsar Ctrl+E y empezar a escribir un término en el cuadro de búsqueda, la búsqueda se inicia:"
  options:
  - id: a
    text:
      es: "Al pulsar Entrar tras escribir el término"
  - id: b
    correct: true
    text:
      es: "Mientras se escribe el término de búsqueda"
  - id: c
    text:
      es: "Al pulsar F6 para ir al panel de contenido"
  - id: d
    text:
      es: "Al pulsar Tab para salir del cuadro de búsqueda"
  explanation:
    es: "La página dice: «Presione Ctrl+E y escriba el término de búsqueda. La búsqueda se iniciará mientras escribe». F6 o Tab se usan después, para llegar al panel de contenido con los resultados; no inician la búsqueda. Tampoco la inicia Entrar: la búsqueda ya está en marcha mientras se escribe."
  citation: "fuente: `ms-win-explorador-lector.html`; «Usar el cuadro de búsqueda»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-explorador-lector-html
- id: m06-l03-q127
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes es la ubicación del cuadro de búsqueda según la ayuda de Microsoft para lectores de pantalla?"
  options:
  - id: a
    text:
      es: "El lado izquierdo de la barra de herramientas"
  - id: b
    text:
      es: "La barra de estado, en la parte inferior derecha"
  - id: c
    correct: true
    text:
      es: "El lado derecho de la barra de herramientas"
  - id: d
    text:
      es: "El panel de navegación, en el lado izquierdo"
  explanation:
    es: "La página dice que el cuadro de búsqueda está situado en el lado derecho de la barra de herramientas. La barra de estado, abajo a la derecha, contiene botones para cambiar la vista y el diseño. El panel de navegación, a la izquierda, da acceso a carpetas, unidades y bibliotecas."
  citation: "fuente: `ms-win-explorador-lector.html`; «Usar el cuadro de búsqueda»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-explorador-lector-html
- id: m06-l03-q128
  prompt:
    es: "En el Explorador de archivos de Windows 11, tras una búsqueda con el cuadro de búsqueda, ¿qué ocurre al seleccionar un archivo de los resultados y pulsar Entrar?"
  options:
  - id: a
    correct: true
    text:
      es: "El archivo se abre en la aplicación asociada"
  - id: b
    text:
      es: "El foco pasa al primer elemento de su carpeta"
  - id: c
    text:
      es: "El archivo se muestra en el panel de detalles"
  - id: d
    text:
      es: "El archivo se selecciona en el panel de navegación"
  explanation:
    es: "La página dice que, si se selecciona un archivo, se abre en la aplicación asociada y el foco pasa a esa ventana. El foco pasa al primer elemento cuando lo seleccionado es una carpeta, no un archivo. El panel de detalles y el panel de navegación no son el resultado de abrir un archivo de la búsqueda."
  citation: "fuente: `ms-win-explorador-lector.html`; «Usar el cuadro de búsqueda»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-indexacion-html
- id: m06-l03-q129
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes elementos crea la indexación de búsquedas para que Windows encuentre la información con más rapidez?"
  options:
  - id: a
    text:
      es: "Una carpeta comprimida con los archivos más usados"
  - id: b
    text:
      es: "Una lista de las carpetas ancladas en Acceso rápido de Inicio"
  - id: c
    correct: true
    text:
      es: "Un índice de los archivos y sus propiedades en el dispositivo"
  - id: d
    text:
      es: "Un registro de los eventos del sistema y de las aplicaciones"
  explanation:
    es: "La página dice que la indexación mejora la velocidad y la eficacia de las búsquedas mediante la creación de un índice de archivos y sus propiedades en el dispositivo. Una carpeta comprimida la crea «Enviar a › Carpeta comprimida (en zip)». Las carpetas ancladas son las de Acceso rápido. El registro de eventos del sistema y de las aplicaciones es el Visor de eventos."
  citation: "fuente: `ms-win-indexacion.html`; «Indización de búsqueda en Windows»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-indexacion-html
- id: m06-l03-q130
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes afirmaciones describe la información que la indexación de búsqueda incluye en el índice de forma predeterminada?"
  options:
  - id: a
    text:
      es: "Solo los nombres de los archivos, sin sus propiedades ni su contenido"
  - id: b
    text:
      es: "Todas las propiedades de los archivos, pero nunca el contenido de los archivos con texto"
  - id: c
    text:
      es: "El contenido de los archivos con texto, pero no las rutas de acceso completas"
  - id: d
    correct: true
    text:
      es: "Todas las propiedades, con nombres y rutas, y el contenido de los archivos con texto"
  explanation:
    es: "La página dice que, de forma predeterminada, se indexan todas las propiedades de los archivos, incluidos los nombres y las rutas de acceso completas, y que en los archivos con texto se indexa su contenido para buscar palabras dentro de ellos. Cada una de las otras opciones quita una de esas piezas: las propiedades, el contenido o las rutas."
  citation: "fuente: `ms-win-indexacion.html`; «¿Qué información se indexa?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-indexacion-html
- id: m06-l03-q131
  prompt:
    es: "En Windows 11, si un tipo de archivo se indexa solo por sus propiedades y no por su contenido, ¿qué ocurre al buscar esos archivos?"
  options:
  - id: a
    text:
      es: "Se encuentran por su contenido, pero no por el nombre de archivo"
  - id: b
    correct: true
    text:
      es: "Se encuentran por el nombre de archivo, pero no por su contenido"
  - id: c
    text:
      es: "No aparecen en ningún resultado de la búsqueda de Windows"
  - id: d
    text:
      es: "El índice ocupa más espacio que si se indexara también el contenido"
  explanation:
    es: "La página dice que, con solo las propiedades, la indexación no atiende al contenido del archivo y se puede seguir buscando por nombre de archivo, pero no por el contenido. Lo contrario, buscar por contenido y no por nombre, invierte la frase. Los archivos siguen apareciendo por su nombre. No indexar el contenido puede reducir el tamaño del índice, no aumentarlo."
  citation: "fuente: `ms-win-indexacion.html`; «¿Puedo cambiar la cantidad de información de un archivo que se indexa?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-indexacion-html
- id: m06-l03-q132
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes rutas del cuadro de diálogo «Opciones de indexación» permite elegir cómo se indexa cada tipo de archivo?"
  options:
  - id: a
    correct: true
    text:
      es: "Avanzadas › pestaña Tipos de archivo"
  - id: b
    text:
      es: "Modificar › Ubicaciones indexadas"
  - id: c
    text:
      es: "Personalizar ubicaciones de búsqueda › Modificar"
  - id: d
    text:
      es: "Avanzadas › Encontrar mis archivos"
  explanation:
    es: "La página indica que, en el cuadro de diálogo «Opciones de indexación», se selecciona «Avanzadas» y se elige la pestaña «Tipos de archivo»; allí se elige una opción en «¿Cómo se debe indexar este archivo?». «Modificar» muestra las ubicaciones indexadas y sirve para agregar carpetas, no tipos. «Personalizar ubicaciones de búsqueda» es el enlace de Configuración que abre ese cuadro de diálogo. «Encontrar mis archivos» es el apartado de Configuración con los modos Clásico y Mejorado."
  citation: "fuente: `ms-win-indexacion.html`; «¿Qué tipos de archivos se pueden indexar?»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-indexacion-html
- id: m06-l03-q133
  prompt:
    es: "En Windows 11, como regla general según la ayuda de Microsoft, ¿cuánto espacio ocupa el índice de búsqueda respecto al tamaño de los archivos indexados?"
  options:
  - id: a
    text:
      es: "Menos del 1 % del tamaño de los archivos indexados"
  - id: b
    text:
      es: "Un 25 % del tamaño de los archivos indexados"
  - id: c
    text:
      es: "Más del 50 % del tamaño de los archivos indexados"
  - id: d
    correct: true
    text:
      es: "Menos del 10 % del tamaño de los archivos indexados"
  explanation:
    es: "La página da como regla general que el índice ocupa menos del 10 por ciento del tamaño de los archivos indexados: con 100 MB de archivos de texto, el índice es menor de 10 MB. Las cifras de 1 %, 25 % y 50 % no aparecen en la página."
  citation: "fuente: `ms-win-indexacion.html`; «¿Cuánto espacio ocupa el índice?»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-win-indexacion-html
- id: m06-l03-q134
  prompt:
    es: "En Windows 11, ¿en cuál de los siguientes casos puede ocupar el índice de búsqueda un porcentaje mayor del tamaño de los archivos indexados?"
  options:
  - id: a
    correct: true
    text:
      es: "Con muchos archivos muy pequeños, de menos de 4 KB"
  - id: b
    text:
      es: "Con muchos archivos de música de gran tamaño"
  - id: c
    text:
      es: "Con pocos archivos de texto de más de 100 MB"
  - id: d
    text:
      es: "Con archivos guardados solo en el escritorio"
  explanation:
    es: "La página dice que el índice puede ocupar un porcentaje mayor si hay muchos archivos muy pequeños (menos de 4 KB) o si se indexa código informático. Los archivos grandes, de música o de texto, no son los casos que cita. Guardar archivos en el escritorio solo indica dónde están, no cambia la proporción."
  citation: "fuente: `ms-win-indexacion.html`; «¿Cuánto espacio ocupa el índice?»"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: fuente-ms-win-indexacion-html
- id: m06-l03-q135
  prompt:
    es: "En Windows 11, ¿cuánto puede tardar la indexación de búsqueda cuando se ejecuta por primera vez, y qué hace después según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Unos minutos; después no vuelve a ejecutarse hasta reinstalar Windows"
  - id: b
    correct: true
    text:
      es: "Un par de horas; después sigue en segundo plano con los cambios"
  - id: c
    text:
      es: "Un par de horas; después solo se ejecuta al reiniciar el equipo"
  - id: d
    text:
      es: "Varios días; mientras tanto la búsqueda de Windows no funciona"
  explanation:
    es: "La página dice que la indexación inicial puede tardar un par de horas y que después se ejecuta en segundo plano mientras se usa el PC, solo para volver a indexar los datos actualizados. La opción que también dice un par de horas cambia lo que ocurre después: la indexación no espera al reinicio. Unos minutos sin repetirse y varios días sin búsqueda contradicen la página."
  citation: "fuente: `ms-win-indexacion.html`; «¿Qué es la indexación?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-indexacion-html
- id: m06-l03-q136
  prompt:
    es: "Según la ayuda de Windows 11 sobre la indexación de búsqueda, ¿para cuál de los siguientes fines usa Microsoft Edge el índice?"
  options:
  - id: a
    text:
      es: "Buscar en el correo electrónico cuando se trabaja en modo sin conexión"
  - id: b
    text:
      es: "Acceder a los archivos del equipo y seguir los cambios que se hacen"
  - id: c
    correct: true
    text:
      es: "Dar resultados del historial del explorador en la barra de direcciones"
  - id: d
    text:
      es: "Mostrar las vistas previas de los sitios web en la Búsqueda segura"
  explanation:
    es: "La página dice que Microsoft Edge usa el índice para dar resultados del historial del explorador en la barra de direcciones. Buscar el correo en modo sin conexión es el uso que hace Outlook. Acceder a los archivos y seguir sus cambios es el uso del Explorador de archivos. Las vistas previas de sitios web son de Windows Search con Bing, no un uso del índice por Edge."
  citation: "fuente: `ms-win-indexacion.html`; «¿Qué aplicaciones usan el índice?»"
  difficulty: 3
  tags:
  - "concepto"
