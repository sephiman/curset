# anchor: fuente-ms-win-aqs-html
- id: m06-l03-q163
  prompt:
    es: "En la sintaxis de consulta avanzada (AQS) de Windows Search, ¿qué símbolo de operador busca los elementos cuyo valor de propiedad termina con unos caracteres dados?"
  options:
  - id: a
    text:
      es: "~<"
  - id: b
    text:
      es: "~="
  - id: c
    correct: true
    text:
      es: "~>"
  - id: d
    text:
      es: "~!"
  explanation:
    es: "La tabla de operadores asigna ~> a COP_VALUE_ENDSWITH, que busca elementos en los que el valor de propiedad termina con los caracteres indicados. En la misma tabla, ~< busca los que empiezan por los caracteres, ~= los que los contienen y ~! los que no los contienen."
  citation: "fuente: `ms-win-aqs.html`; «Operadores de consulta»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m06-l03-q164
  prompt:
    es: "En Windows 11, según la ayuda de Microsoft sobre búsqueda y privacidad, ¿qué permite hacer la Búsqueda segura de Windows Search?"
  options:
  - id: a
    correct: true
    text:
      es: "Mantener el contenido adulto fuera de las vistas previas de sitios web"
  - id: b
    text:
      es: "Borrar el historial de búsqueda guardado en el dispositivo"
  - id: c
    text:
      es: "Elegir si se busca en Documentos, Imágenes y Música o en todo el PC"
  - id: d
    text:
      es: "Conectar Windows Search con la cuenta profesional o educativa"
  explanation:
    es: "La página dice que Búsqueda segura «permite mantener el contenido adulto fuera de las vistas previas de sitios web». Borrar el historial del dispositivo es el botón del apartado Historial. Elegir entre Documentos, Imágenes y Música o todo el equipo se hace en la página Buscar en Windows. Conectar la cuenta profesional se hace en Cuentas usadas por otras aplicaciones."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «Búsqueda segura»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m06-l03-q165
  prompt:
    es: "En Windows 11, tras seleccionar el icono de lupa de la barra de tareas y, en la esquina superior derecha, Opciones, ¿qué aparece en «Cuentas conectadas»?"
  options:
  - id: a
    text:
      es: "La lista de carpetas indexadas del equipo"
  - id: b
    text:
      es: "El historial de búsqueda guardado con la cuenta de Microsoft"
  - id: c
    text:
      es: "Los dispositivos de la red que comparten archivos"
  - id: d
    correct: true
    text:
      es: "El nombre y el tipo de cada cuenta conectada a Windows Search"
  explanation:
    es: "La página dice que, en Opciones, «el nombre de cuenta y el tipo de cuenta aparecen en Cuentas conectadas». Las ubicaciones indexadas se ven con Modificar, en Personalizar ubicaciones de búsqueda. El historial asociado a la cuenta de Microsoft se ve en el Panel de privacidad de Microsoft. Los dispositivos de la red que comparten archivos se ven en Red."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «Búsqueda de contenido en la nube»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-busqueda-privacidad-html
- id: m06-l03-q166
  prompt:
    es: "En Windows 11, según la ayuda de Microsoft sobre búsqueda y privacidad, ¿qué puede ocurrir al elegir buscar en todo el equipo?"
  options:
  - id: a
    text:
      es: "Que mejore la duración de la batería y se reduzca el consumo de CPU"
  - id: b
    text:
      es: "Que se desactive la búsqueda en las carpetas de usuario"
  - id: c
    text:
      es: "Que la indexación se limite a Documentos, Imágenes y Música"
  - id: d
    correct: true
    text:
      es: "Que se afecten la duración de la batería y el consumo de CPU"
  explanation:
    es: "La página dice: «Buscar en todo el equipo puede afectar a la duración de la batería y al consumo de CPU». Mejorar la batería y reducir la CPU es lo contrario. El modo que indexa todo el equipo incluye todas las carpetas y archivos de usuario, así que no desactiva la búsqueda en ellas. Documentos, Imágenes y Música son las carpetas del modo Clásico."
  citation: "fuente: `ms-win-busqueda-privacidad.html`; «Búsqueda en Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-indexacion-html
- id: m06-l03-q167
  prompt:
    es: "En un Copilot+ PC con Windows 11, ¿dónde se almacenan los datos que recopila la indexación semántica, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "En OneDrive, para sincronizarlos con los demás dispositivos del usuario"
  - id: b
    text:
      es: "En los servidores de Microsoft, para entrenar modelos de inteligencia artificial"
  - id: c
    correct: true
    text:
      es: "De forma local en el equipo, sin enviarlos a Microsoft"
  - id: d
    text:
      es: "En la cuenta de Microsoft del usuario, junto con el historial de búsqueda"
  explanation:
    es: "La página dice que los datos de la indexación semántica «se almacenan localmente en el equipo» y que «ninguno de ellos se envía a Microsoft ni se utiliza para entrenar modelos de inteligencia artificial». Eso descarta los servidores de Microsoft para entrenar modelos y la cuenta de Microsoft con el historial de búsqueda, porque ningún dato sale a Microsoft. OneDrive para sincronizar con otros dispositivos es también un envío fuera del equipo, que choca con que se almacenen localmente."
  citation: "fuente: `ms-win-indexacion.html`; «¿Dónde se almacena la información del índice?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-explorador-html
- id: m06-l03-q201
  prompt:
    es: "En Windows 11, desde la versión 22H2, ¿con qué nombre se conoce la página en la que se abre por defecto el Explorador de archivos, antes llamada Acceso rápido?"
  options:
  - id: a
    correct: true
    text:
      es: "Inicio"
  - id: b
    text:
      es: "Este equipo"
  - id: c
    text:
      es: "Escritorio"
  - id: d
    text:
      es: "Documentos"
  explanation:
    es: "La página dice que el Explorador se abre por defecto en Acceso rápido, cuyo nombre se ha cambiado a Inicio del Explorador de archivos en Windows 11, versión 22H2. Este equipo es otra ubicación en la que se puede configurar la apertura, y Escritorio y Documentos son dos de las carpetas conocidas ancladas."
  citation: "fuente: `ms-win-explorador.html`; «Acceso rápido»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-explorador-html
- id: m06-l03-q202
  prompt:
    es: "En Windows 11, desde la versión 22H2, ¿cuál de los siguientes grupos de carpetas conocidas está anclado de forma predeterminada en Acceso rápido?"
  options:
  - id: a
    text:
      es: "Escritorio, Documentos, Descargas, Imágenes, Música y Red"
  - id: b
    text:
      es: "Documentos, Descargas, Imágenes, Música, Vídeos y Papelera de reciclaje"
  - id: c
    text:
      es: "Escritorio, Documentos, Descargas, Imágenes y Música, sin Vídeos"
  - id: d
    correct: true
    text:
      es: "Escritorio, Documentos, Descargas, Imágenes, Música y Vídeos"
  explanation:
    es: "La página dice que, desde Windows 11 22H2, las carpetas conocidas «(escritorio, documentos, descargas, imágenes, música y vídeos)» están ancladas de forma predeterminada en Acceso rápido, y que son seis. La lista con Red en lugar de Vídeos cambia una de esas seis por una carpeta que la página no incluye. La que sustituye Escritorio por Papelera de reciclaje hace lo mismo. Y la de cinco carpetas sin Vídeos contradice que la página cuente seis y nombre Vídeos entre ellas."
  citation: "fuente: `ms-win-explorador.html`; «Acceso rápido»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-explorador-html
- id: m06-l03-q203
  prompt:
    es: "¿Qué muestra la vista Este equipo del Explorador de archivos de Windows 11 desde la versión 22H2, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Las seis carpetas conocidas de Windows ancladas de forma predeterminada en el equipo"
  - id: b
    text:
      es: "Los archivos de Office.com recientes y favoritos del usuario"
  - id: c
    correct: true
    text:
      es: "Las unidades y las ubicaciones de red del equipo, sin las carpetas conocidas"
  - id: d
    text:
      es: "Las carpetas del usuario con los archivos más recientes"
  explanation:
    es: "La página dice que las carpetas predeterminadas ya no se muestran en Este equipo, para mantener la vista centrada en las unidades y las ubicaciones de red del equipo. Las carpetas conocidas ancladas están en Acceso rápido y los archivos de Office.com recientes y favoritos se ven en Inicio del Explorador."
  citation: "fuente: `ms-win-explorador.html`; «Acceso rápido»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-explorador-html
- id: m06-l03-q204
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes opciones del menú contextual de una carpeta la ancla a Acceso rápido?"
  options:
  - id: a
    text:
      es: "Anclar a Inicio"
  - id: b
    correct: true
    text:
      es: "Anclar a acceso rápido"
  - id: c
    text:
      es: "Anclar a la barra de tareas"
  - id: d
    text:
      es: "Mostrar más opciones"
  explanation:
    es: "La página dice que se hace clic con el botón derecho en la carpeta y se selecciona Anclar a acceso rápido. Anclar a Inicio coloca la carpeta en el menú Inicio, Anclar a la barra de tareas es la opción de las aplicaciones y Mostrar más opciones abre el menú contextual anterior de Windows 10."
  citation: "fuente: `ms-win-explorador.html`; «Acceso rápido»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-explorador-html
- id: m06-l03-q205
