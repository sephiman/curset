# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0248
  prompt:
    es: "Según el artículo 7.j) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué becas concedidas por entidades sin fines lucrativos están exentas?"
  options:
  - id: a
    text:
      es: "Las concedidas por las entidades sin fines lucrativos solo para estudios universitarios en España."
  - id: b
    text:
      es: "Las concedidas por cualquier entidad sin fines lucrativos, aunque no se les aplique su régimen especial."
  - id: c
    correct: true
    text:
      es: "Las concedidas por las entidades a las que sea de aplicación su régimen especial, percibidas para cursar estudios reglados."
  - id: d
    text:
      es: "Las concedidas por las entidades a las que sea de aplicación su régimen especial, para cualquier finalidad."
  explanation:
    es: "Están exentas las becas de las entidades sin fines lucrativos a las que se aplica el régimen especial de la Ley 49/2002, percibidas para cursar estudios reglados (art. 7.j) LIRPF). No basta ser entidad sin fines lucrativos, ni vale cualquier finalidad, ni se limita a estudios universitarios en España."
  citation: "art. 7.j) LIRPF"
  difficulty: 3
  tags:
  - "beca"
  - "exención"
# anchor: boe-a-2006-20764-art-9
- id: m03-l15-q0255
  prompt:
    es: "¿Cuál de las siguientes circunstancias determina, de acuerdo con el artículo 9.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, que el contribuyente tenga su residencia habitual en territorio español?"
  options:
  - id: a
    text:
      es: "Que tenga nacionalidad española, aunque resida habitualmente en el extranjero."
  - id: b
    text:
      es: "Que perciba rentas de fuente española, cualquiera que sea el tiempo que permanezca en España."
  - id: c
    text:
      es: "Que tenga una vivienda en propiedad en territorio español, aunque no resida en ella."
  - id: d
    correct: true
    text:
      es: "Que radique en España el núcleo principal o la base de sus actividades o intereses económicos, de forma directa o indirecta."
  explanation:
    es: "El núcleo principal o la base de las actividades o intereses económicos en España, directo o indirecto, es una de las dos circunstancias del artículo 9.1 LIRPF. La nacionalidad por sí sola no decide, ni la propiedad de una vivienda ni percibir rentas de fuente española sin más."
  citation: "art. 9.1 LIRPF"
  difficulty: 2
  tags:
  - "residencia"
# anchor: boe-a-2006-20764-art-10
- id: m03-l15-q0256
  prompt:
    es: "Conforme al artículo 10.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre quiénes se consideran contribuyentes por su condición de miembros de misiones diplomáticas españolas que residen en el extranjero:"
  options:
  - id: a
    text:
      es: "Las personas de nacionalidad española, su cónyuge no separado legalmente e hijos de cualquier edad."
  - id: b
    text:
      es: "Las personas de nacionalidad española, su cónyuge, aunque esté separado legalmente, e hijos menores de edad."
  - id: c
    correct: true
    text:
      es: "Las personas de nacionalidad española, su cónyuge no separado legalmente e hijos menores de edad."
  - id: d
    text:
      es: "Las personas de nacionalidad española y los extranjeros que sean miembros de la misión."
  explanation:
    es: "La regla alcanza a las personas de nacionalidad española, su cónyuge no separado legalmente y los hijos menores de edad (art. 10.1 LIRPF). Si el cónyuge está separado legalmente queda fuera. Los hijos mayores de edad tampoco. Y los extranjeros miembros de la misión no están comprendidos."
  citation: "art. 10.1 LIRPF"
  difficulty: 2
  tags:
  - "residencia en el extranjero"
  - "contribuyentes"
# anchor: boe-a-2006-20764-art-14
- id: m03-l15-q0263
  prompt:
    es: "Felipe Arce fallece el 1 de octubre de 2026 con rentas pendientes de imputación derivadas de una venta a plazos con precio aplazado. Según el artículo 14.4 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿en qué base imponible se integran esas rentas?"
  options:
  - id: a
    correct: true
    text:
      es: "En la del último período impositivo que deba declararse, que es el de 2026."
  - id: b
    text:
      es: "En la del período impositivo de 2027, que es el siguiente al del fallecimiento."
  - id: c
    text:
      es: "En la de cada período impositivo en que los herederos cobren los plazos pendientes."
  - id: d
    text:
      es: "En la del período impositivo en que se acepte la herencia."
  explanation:
    es: "Al fallecer el contribuyente, todas las rentas pendientes de imputación se integran en el último período que deba declararse, el de 2026 (art. 14.4 LIRPF). No se difieren al año siguiente, a los cobros de los herederos ni a la aceptación de la herencia."
  citation: "art. 14.4 LIRPF"
  difficulty: 2
  tags:
  - "supuesto"
  - "imputación temporal"
# anchor: boe-a-2006-20764-art-6
- id: m03-l15-q0265
  prompt:
    es: "Según el artículo 6.5 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, se presumen retribuidas, salvo prueba en contrario, las prestaciones de bienes, derechos o servicios susceptibles de generar rendimientos:"
  options:
  - id: a
    correct: true
    text:
      es: "del trabajo o del capital."
  - id: b
    text:
      es: "del trabajo o de actividades económicas."
  - id: c
    text:
      es: "de actividades económicas o de imputaciones de renta."
  - id: d
    text:
      es: "del capital o de ganancias patrimoniales."
  explanation:
    es: "La presunción de retribución alcanza a las prestaciones susceptibles de generar rendimientos del trabajo o del capital (art. 6.5 LIRPF). Las actividades económicas, las ganancias patrimoniales y las imputaciones de renta no están en el precepto."
  citation: "art. 6.5 LIRPF"
  difficulty: 2
  tags:
  - "presunción"
# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0284
  prompt:
    es: "Señale la respuesta CORRECTA sobre la exención de la prestación por desempleo percibida en la modalidad de pago único, regulada en el artículo 7.n) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, cuando el beneficiario se hace trabajador autónomo:"
  options:
  - id: a
    correct: true
    text:
      es: "Está condicionada al mantenimiento de la actividad durante cinco años."
  - id: b
    text:
      es: "Está condicionada al mantenimiento de la acción o participación durante cinco años."
  - id: c
    text:
      es: "Está condicionada al mantenimiento de la actividad durante tres años."
  - id: d
    text:
      es: "No está condicionada al mantenimiento de la actividad si se destina el importe a ella."
  explanation:
    es: "Para el trabajador autónomo, la exención de la prestación por desempleo en pago único está condicionada al mantenimiento de la actividad durante cinco años (art. 7.n). Tres años es el plazo en que, tras renunciar a un método o ser excluido de él, el contribuyente tributa por otro (arts. 30.1 y 31.1.5.ª), no el de esta exención. El mantenimiento de la acción o participación es la condición de quien se integra en sociedades laborales o cooperativas de trabajo asociado o aporta capital a una entidad mercantil, no la del autónomo. Destinar el importe a la actividad es el requisito común de la exención, pero no sustituye la condición de mantenerla durante cinco años."
  citation: "art. 7.n) LIRPF"
  difficulty: 1
  tags:
  - "rentas exentas"
  - "desempleo pago único"
# anchor: boe-a-2006-20764-art-17
- id: m03-l15-q0071
  prompt:
    es: "De acuerdo con el artículo 17.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, se consideran rendimientos íntegros del trabajo todas las contraprestaciones o utilidades, dinerarias o en especie, que deriven:"
  options:
  - id: a
    correct: true
    text:
      es: "directa o indirectamente del trabajo personal o de la relación laboral o estatutaria y no tengan el carácter de rendimientos de actividades económicas."
  - id: b
    text:
      es: "directamente del trabajo personal o de la relación laboral o estatutaria, con exclusión de las que deriven indirectamente de ellos."
  - id: c
    text:
      es: "directa o indirectamente del trabajo personal, aunque tengan el carácter de rendimientos de actividades económicas."
  - id: d
    text:
      es: "exclusivamente de la relación laboral y se perciban en dinero, sin incluir las utilidades en especie."
  explanation:
    es: "El concepto abarca contraprestaciones dinerarias o en especie que deriven directa o indirectamente del trabajo personal o de la relación laboral o estatutaria, siempre que no sean rendimientos de actividades económicas (art. 17.1 LIRPF). Limitarlo a la relación laboral y al dinero lo recorta. Incluir las de actividades económicas las confunde con otra categoría, y suprimir la derivación indirecta cambia el alcance."
  citation: "art. 17.1 LIRPF"
  difficulty: 3
  tags:
  - "rendimientos del trabajo"
  - "concepto"
# anchor: boe-a-2006-20764-art-17
- id: m03-l15-q0072
  prompt:
    es: "Señale cuál de las siguientes rentas se incluye, en particular, entre los rendimientos íntegros del trabajo según el artículo 17.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Los rendimientos derivados del arrendamiento de bienes inmuebles."
  - id: b
    correct: true
    text:
      es: "Las remuneraciones en concepto de gastos de representación."
  - id: c
    text:
      es: "Los dividendos y participaciones en los beneficios de cualquier tipo de entidad."
  - id: d
    text:
      es: "Las dietas y asignaciones para gastos de locomoción dentro de los límites reglamentarios."
  explanation:
    es: "Los gastos de representación están en la lista del artículo 17.1.c) LIRPF. Las dietas de locomoción con los límites reglamentarios se excluyen de la letra d). Los dividendos son rendimientos del capital mobiliario (art. 25.1.a)) y el arrendamiento de inmuebles es capital inmobiliario (art. 22.1)."
  citation: "art. 17.1 LIRPF"
  difficulty: 1
  tags:
  - "rendimientos del trabajo"
  - "lista"
# anchor: boe-a-2006-20764-art-17
- id: m03-l15-q0073
  prompt:
    es: "Según el artículo 17.1.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, son rendimientos íntegros del trabajo las dietas y asignaciones para gastos de viaje, excepto:"
  options:
  - id: a
    correct: true
    text:
      es: "los de locomoción y los normales de manutención y estancia en establecimientos de hostelería con los límites que reglamentariamente se establezcan."
  - id: b
    text:
      es: "los percibidos por funcionarios públicos en activo con los límites que reglamentariamente se establezcan."
  - id: c
    text:
      es: "los de manutención, pero no los de estancia en establecimientos de hostelería, con los límites que reglamentariamente se establezcan."
  - id: d
    text:
      es: "los de locomoción y los de estancia en hoteles, sin límite cuantitativo alguno."
  explanation:
    es: "Quedan fuera los gastos de locomoción y los normales de manutención y estancia en hostelería, con los límites reglamentarios (art. 17.1.d) LIRPF). La excepción incluye también la estancia y tiene límites. Y no depende de la condición de funcionario del perceptor."
  citation: "art. 17.1.d) LIRPF"
  difficulty: 2
  tags:
  - "rendimientos del trabajo"
  - "dietas"
# anchor: boe-a-2006-20764-art-17
- id: m03-l15-q0074
  prompt:
    es: "Alba Ruiz recibe de su empresa en 2026 una asignación para gastos de locomoción y de manutención en un viaje de trabajo, dentro de los límites que fija el reglamento. Según el artículo 17.1.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿es rendimiento íntegro del trabajo?"
  options:
  - id: a
    text:
      es: "Sí, pero se reduce en un 30 por ciento por su carácter irregular."
  - id: b
    text:
      es: "Sí, porque toda dieta o asignación para gastos de viaje es rendimiento íntegro del trabajo."
  - id: c
    text:
      es: "No, porque las dietas se califican como rendimientos del capital mobiliario."
  - id: d
    correct: true
    text:
      es: "No, porque las asignaciones para gastos de locomoción y los normales de manutención con esos límites quedan excluidas."
  explanation:
    es: "Los gastos de locomoción y los normales de manutención y estancia, dentro de los límites reglamentarios, no son rendimientos íntegros del trabajo (art. 17.1.d) LIRPF). No toda dieta lo es, ni se califica como capital mobiliario. La reducción del 30 por ciento del artículo 18.2 se refiere a rendimientos de generación superior a dos años, no a las dietas."
  citation: "art. 17.1.d) LIRPF"
  difficulty: 2
  tags:
  - "supuesto"
  - "dietas"
# anchor: boe-a-2006-20764-art-17
- id: m03-l15-q0076
  prompt:
    es: "¿Cuál de las siguientes rentas tiene en todo caso la consideración de rendimiento del trabajo, de acuerdo con el artículo 17.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Las pensiones compensatorias recibidas del cónyuge, sin perjuicio de lo dispuesto en el artículo 7."
  - id: b
    text:
      es: "Las ganancias obtenidas por la transmisión onerosa de una vivienda."
  - id: c
    text:
      es: "Los rendimientos obtenidos por el arrendamiento de bienes muebles, negocios o minas que no constituyan actividad económica."
  - id: d
    text:
      es: "Los intereses y demás formas de remuneración pactadas por la cesión a terceros de capitales propios."
  explanation:
    es: "Las pensiones compensatorias del cónyuge y las anualidades por alimentos son rendimientos del trabajo, sin perjuicio del artículo 7 (art. 17.2.f) LIRPF). El arrendamiento de bienes muebles y los intereses son capital mobiliario (art. 25), y la venta de una vivienda genera una ganancia patrimonial (art. 33.1)."
  citation: "art. 17.2 LIRPF"
  difficulty: 2
  tags:
  - "rendimientos del trabajo"
  - "lista"
# anchor: boe-a-2006-20764-art-17
- id: m03-l15-q0077
  prompt:
    es: "Según el artículo 17.2.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, tienen la consideración de rendimientos del trabajo los derivados de la elaboración de obras literarias, artísticas o científicas, siempre que:"
  options:
  - id: a
    text:
      es: "el autor conserve el derecho a su explotación."
  - id: b
    text:
      es: "la obra se publique en un soporte físico y se ponga a la venta."
  - id: c
    correct: true
    text:
      es: "se ceda el derecho a su explotación."
  - id: d
    text:
      es: "el autor no obtenga otros ingresos por actividades económicas."
  explanation:
    es: "El requisito es que se ceda el derecho de explotación de la obra (art. 17.2.d) LIRPF). Si el autor lo conserva, no se cumple. La publicación en soporte físico y la ausencia de otros ingresos son condiciones que la letra no menciona."
  citation: "art. 17.2 LIRPF"
  difficulty: 2
  tags:
  - "rendimientos del trabajo"
# anchor: boe-a-2006-20764-art-17
- id: m03-l15-q0079
  prompt:
    es: "Víctor Mas, economista, imparte en 2026 cursos de formación a empresas. Para ello alquila un aula, contrata a dos formadores y organiza por su cuenta los medios necesarios. Conforme a los artículos 17.2 y 17.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cómo se califican los rendimientos de esos cursos?"
  options:
  - id: a
    text:
      es: "Como rendimientos del capital mobiliario, porque derivan de un servicio prestado a terceros."
  - id: b
    text:
      es: "Como rendimientos del trabajo, porque derivan de impartir cursos, que siempre se califican así."
  - id: c
    correct: true
    text:
      es: "Como rendimientos de actividades económicas, porque supone la ordenación por cuenta propia de medios de producción y recursos humanos."
  - id: d
    text:
      es: "Como ganancias patrimoniales, porque no existe relación laboral con las empresas."
  explanation:
    es: "Impartir cursos es rendimiento del trabajo, pero se califica de actividad económica cuando hay ordenación por cuenta propia de medios y personas (art. 17.3 LIRPF), como hace Víctor con el aula y los formadores. No siempre se califican como trabajo. Y no son capital mobiliario ni ganancias patrimoniales."
  citation: "art. 17.3 LIRPF"
  difficulty: 2
  tags:
  - "supuesto"
  - "calificación"
# anchor: boe-a-2006-20764-art-42
- id: m03-l15-q0080
  prompt:
    es: "Según el artículo 42.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, constituyen rentas en especie la utilización, consumo u obtención, para fines particulares, de bienes, derechos o servicios de forma gratuita o por precio inferior al normal de mercado, aun cuando:"
  options:
  - id: a
    text:
      es: "se concedan a título oneroso por el precio normal de mercado."
  - id: b
    correct: true
    text:
      es: "no supongan un gasto real para quien las conceda."
  - id: c
    text:
      es: "supongan un gasto real superior al precio normal de mercado para quien las conceda."
  - id: d
    text:
      es: "no se destinen a fines particulares del perceptor."
  explanation:
    es: "Hay renta en especie aunque la concesión no suponga un gasto real para quien la concede (art. 42.1 LIRPF). El presupuesto es el uso para fines particulares y la gratuidad o un precio inferior al normal, de modo que no encajan ni los fines ajenos al perceptor ni el precio normal de mercado."
  citation: "art. 42.1 LIRPF"
  difficulty: 2
  tags:
  - "especie"
  - "concepto"
# anchor: boe-a-2006-20764-art-42
- id: m03-l15-q0082
  prompt:
    es: "De acuerdo con el artículo 42.2.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, no tienen la consideración de rendimientos del trabajo en especie las cantidades destinadas a la actualización, capacitación o reciclaje del personal empleado, cuando:"
  options:
  - id: a
    text:
      es: "se impartan dentro del horario laboral y en las instalaciones de la empresa."
  - id: b
    text:
      es: "sean aprobados previamente por los representantes legales de los trabajadores."
  - id: c
    text:
      es: "no excedan del 10 por ciento de las restantes contraprestaciones del trabajo."
  - id: d
    correct: true
    text:
      es: "vengan exigidos por el desarrollo de sus actividades o las características de los puestos de trabajo."
  explanation:
    es: "La formación queda fuera de los rendimientos en especie cuando la exige el desarrollo de las actividades o las características del puesto (art. 42.2.a) LIRPF). El horario, la aprobación sindical y un tope porcentual no son condiciones del precepto. El 10 por ciento pertenece a la valoración de la vivienda del artículo 43.1.1.º.a)."
  citation: "art. 42.2 LIRPF"
  difficulty: 2
  tags:
  - "especie"
  - "formación"
# anchor: boe-a-2006-20764-art-42
- id: m03-l15-q0083
  prompt:
    es: "Conforme al artículo 42.2.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, no tienen la consideración de rendimientos del trabajo en especie las primas o cuotas satisfechas por la empresa en virtud de contrato de seguro de:"
  options:
  - id: a
    text:
      es: "asistencia sanitaria del trabajador y de los miembros de su familia."
  - id: b
    text:
      es: "multirriesgo del hogar del trabajador."
  - id: c
    correct: true
    text:
      es: "accidente laboral o de responsabilidad civil del trabajador."
  - id: d
    text:
      es: "vida a favor del cónyuge del trabajador."
  explanation:
    es: "Solo los seguros de accidente laboral y de responsabilidad civil del trabajador quedan fuera de los rendimientos en especie (art. 42.2.b) LIRPF). Los seguros de vida, de asistencia sanitaria o del hogar benefician al trabajador a título particular y no figuran en la letra."
  citation: "art. 42.2 LIRPF"
  difficulty: 2
  tags:
  - "especie"
  - "seguros"
# anchor: boe-a-2006-20764-art-42
- id: m03-l15-q0085
  prompt:
    es: "De acuerdo con el artículo 42.3.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, están exentas las entregas a empleados de productos a precios rebajados que se realicen en:"
  options:
  - id: a
    text:
      es: "tiendas de la empresa donde los empleados compren con descuento ilimitado."
  - id: b
    text:
      es: "cualquier establecimiento de la empresa abierto al público en general."
  - id: c
    correct: true
    text:
      es: "cantinas o comedores de empresa o economatos de carácter social."
  - id: d
    text:
      es: "los centros de ocio y deporte contratados por la empresa para sus empleados."
  explanation:
    es: "La exención se limita a las entregas con precios rebajados en cantinas, comedores de empresa o economatos de carácter social (art. 42.3.a) LIRPF). Las tiendas abiertas al público y los centros de ocio no están en la letra."
  citation: "art. 42.3 LIRPF"
  difficulty: 1
  tags:
  - "especie"
  - "exención"
# anchor: boe-a-2006-20764-art-42
- id: m03-l15-q0086
  prompt:
    es: "Según el artículo 42.3.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, está exenta, como rendimiento del trabajo en especie, la utilización de los bienes destinados a:"
  options:
  - id: a
    text:
      es: "la representación de la empresa frente a clientes y proveedores."
  - id: b
    text:
      es: "uso particular del personal directivo de la empresa."
  - id: c
    text:
      es: "las actividades de formación exigidas por el puesto de trabajo."
  - id: d
    correct: true
    text:
      es: "los servicios sociales y culturales del personal empleado."
  explanation:
    es: "La letra b) exime la utilización de los bienes destinados a servicios sociales y culturales del personal empleado (art. 42.3.b) LIRPF). El uso particular del personal directivo no es un servicio social colectivo, y la representación no beneficia al empleado. La formación exigida por el puesto no es rendimiento en especie, según el artículo 42.2.a)."
  citation: "art. 42.3 LIRPF"
  difficulty: 2
  tags:
  - "especie"
  - "exención"
# anchor: boe-a-2006-20764-art-42
- id: m03-l15-q0087
  prompt:
    es: "Conforme al artículo 42.3.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, está exenta la prestación del servicio de educación preescolar, infantil, primaria, secundaria obligatoria, bachillerato y formación profesional por centros educativos autorizados, a:"
  options:
  - id: a
    text:
      es: "los hijos de sus empleados, solo cuando el servicio se preste con carácter gratuito."
  - id: b
    correct: true
    text:
      es: "los hijos de sus empleados, con carácter gratuito o por precio inferior al normal de mercado."
  - id: c
    text:
      es: "los empleados y sus cónyuges, con carácter gratuito o por precio inferior al normal de mercado."
  - id: d
    text:
      es: "los hijos y demás familiares de sus empleados hasta el tercer grado."
  explanation:
    es: "Los destinatarios son los hijos de los empleados y la prestación puede ser gratuita o a precio inferior al normal (art. 42.3.d) LIRPF). Los cónyuges y otros familiares no figuran, y limitarla a la gratuidad elimina el supuesto del precio inferior."
  citation: "art. 42.3 LIRPF"
  difficulty: 2
  tags:
  - "especie"
  - "exención"
# anchor: boe-a-2006-20764-art-42
- id: m03-l15-q0088
  prompt:
    es: "Una empresa paga en 2026 a un colegio autorizado la educación secundaria obligatoria de la hija de uno de sus empleados, que no abona nada. Según el artículo 42.3.d) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cómo se trata esa retribución para el empleado?"
  options:
  - id: a
    text:
      es: "No tiene la consideración de rendimiento del trabajo en especie, por ser una cantidad destinada a la capacitación del personal empleado."
  - id: b
    correct: true
    text:
      es: "Es un rendimiento del trabajo en especie exento, por ser un servicio de educación prestado por un centro autorizado a un hijo del empleado."
  - id: c
    text:
      es: "Es un rendimiento del trabajo en especie, que se valora por su valor normal en el mercado."
  - id: d
    text:
      es: "Es un rendimiento del trabajo en especie exento solo si la educación es preescolar o infantil."
  explanation:
    es: "La educación secundaria obligatoria de los hijos de empleados en centros autorizados es rendimiento en especie exento (art. 42.3.d) LIRPF), aunque sea gratuita. Por eso no se valora ni tributa. No es formación del propio personal del artículo 42.2.a), y la exención no se limita a la etapa infantil: abarca también la secundaria."
  citation: "art. 42.3 LIRPF"
  difficulty: 2
  tags:
  - "supuesto"
  - "especie"
# anchor: boe-a-2006-20764-art-43
- id: m03-l15-q0089
  prompt:
    es: "De acuerdo con el artículo 43.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, con carácter general las rentas en especie se valoran por:"
  options:
  - id: a
    text:
      es: "el coste para el pagador, incluidos los tributos que graven la operación."
  - id: b
    text:
      es: "el precio ofertado al público, deducidos los descuentos ordinarios o comunes."
  - id: c
    text:
      es: "el 10 por ciento del valor catastral del bien, con el límite de las restantes contraprestaciones."
  - id: d
    correct: true
    text:
      es: "su valor normal en el mercado, con las especialidades que el propio apartado establece."
  explanation:
    es: "La regla general es el valor normal en el mercado (art. 43.1 LIRPF). El coste para el pagador, el porcentaje del valor catastral y el precio ofertado al público son criterios especiales que el artículo aplica a rentas concretas."
  citation: "art. 43.1 LIRPF"
  difficulty: 2
  tags:
  - "especie"
  - "valoración"
# anchor: boe-a-2006-20764-art-43
- id: m03-l15-q0090
  prompt:
    es: "Según el artículo 43.1.1.º.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la vivienda propiedad del pagador se valora en el 5 por ciento del valor catastral cuando los valores catastrales del municipio, revisados o de valoración colectiva general, hayan entrado en vigor:"
  options:
  - id: a
    correct: true
    text:
      es: "en el período impositivo o en el plazo de los diez períodos impositivos anteriores."
  - id: b
    text:
      es: "en el período impositivo o en el plazo de los cinco períodos impositivos anteriores."
  - id: c
    text:
      es: "en el período impositivo anterior o en el de los dos períodos impositivos precedentes."
  - id: d
    text:
      es: "en el período impositivo o en el plazo de los veinte períodos impositivos anteriores."
  explanation:
    es: "El 5 por ciento se aplica si los valores catastrales entraron en vigor en el período o en los diez anteriores (art. 43.1.1.º.a) LIRPF). Cinco, veinte o dos períodos son plazos que el artículo no recoge."
  citation: "art. 43.1 LIRPF"
  difficulty: 2
  tags:
  - "especie"
  - "plazo"
# anchor: boe-a-2006-20764-art-43
- id: m03-l15-q0091
  prompt:
    es: "De acuerdo con el artículo 43.1.1.º.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la valoración de la utilización de una vivienda propiedad del pagador como rendimiento del trabajo en especie:"
  options:
  - id: a
    correct: true
    text:
      es: "La valoración resultante no puede exceder del 10 por ciento de las restantes contraprestaciones del trabajo."
  - id: b
    text:
      es: "La valoración resultante no puede exceder del 5 por ciento de las restantes contraprestaciones del trabajo."
  - id: c
    text:
      es: "La valoración resultante no puede exceder del 20 por ciento de las restantes contraprestaciones del trabajo."
  - id: d
    text:
      es: "La valoración resultante no puede exceder del 10 por ciento del valor de mercado de la vivienda."
  explanation:
    es: "El tope es el 10 por ciento de las restantes contraprestaciones del trabajo (art. 43.1.1.º.a) LIRPF). Veinte y cinco por ciento son porcentajes cercanos que no figuran, y el valor de mercado de la vivienda no es la base del límite."
  citation: "art. 43.1 LIRPF"
  difficulty: 2
  tags:
  - "especie"
  - "límite"
# anchor: boe-a-2006-20764-art-43
- id: m03-l15-q0094
  prompt:
    es: "De conformidad con el artículo 43.1.1.º.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en el supuesto de entrega de vehículos automóviles como rendimiento del trabajo en especie, la valoración es:"
  options:
  - id: a
    text:
      es: "el coste de adquisición para el pagador, excluidos los tributos que graven la operación."
  - id: b
    text:
      es: "el 20 por ciento anual del coste de adquisición para el pagador."
  - id: c
    text:
      es: "el valor de mercado del vehículo en la fecha de la entrega."
  - id: d
    correct: true
    text:
      es: "el coste de adquisición para el pagador, incluidos los tributos que graven la operación."
  explanation:
    es: "En la entrega se valora el coste de adquisición para el pagador, con los tributos de la operación (art. 43.1.1.º.b) LIRPF). El valor de mercado no es la base. El 20 por ciento anual se aplica al uso, no a la entrega, y excluir los tributos contradice el texto."
  citation: "art. 43.1 LIRPF"
  difficulty: 2
  tags:
  - "especie"
  - "vehículos"
# anchor: boe-a-2006-20764-art-43
- id: m03-l15-q0095
  prompt:
    es: "En 2026, una empresa pone a disposición de Irene Bravo, para uso particular, un vehículo de su propiedad adquirido por 25.000 euros, incluidos los tributos de la operación. Según el artículo 43.1.1.º.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿por qué importe anual se valora el uso?"
  options:
  - id: a
    text:
      es: "El uso se valora en 2.500 euros anuales."
  - id: b
    text:
      es: "El uso se valora en 7.500 euros anuales."
  - id: c
    correct: true
    text:
      es: "El uso se valora en 5.000 euros anuales."
  - id: d
    text:
      es: "El uso se valora en 25.000 euros anuales."
  explanation:
    es: "En el uso de un vehículo propiedad del pagador se aplica el 20 por ciento anual al coste de adquisición: 20 por ciento de 25.000 euros son 5.000 euros (art. 43.1.1.º.b) LIRPF). El importe de 25.000 corresponde a la entrega. Los de 2.500 y 7.500 aplican porcentajes del 10 y el 30 por ciento que el precepto no fija."
  citation: "art. 43.1 LIRPF"
  difficulty: 1
  tags:
  - "cómputo"
  - "supuesto"
  - "vehículos"
