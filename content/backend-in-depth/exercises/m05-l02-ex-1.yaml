type: quiz
variants:
- id: m05-l02-q02
  prompt:
    en: A team publishes its own Spring Boot starter for a project called `thirdpartyproject`. Which artifact name
      follows the Spring Boot naming guidance for third-party starters?
  options:
  - id: a
    text:
      en: '`spring-boot-starter-thirdpartyproject`'
  - id: b
    text:
      en: '`spring-boot-thirdpartyproject-starter`'
  - id: c
    correct: true
    text:
      en: '`thirdpartyproject-spring-boot-starter`'
  - id: d
    text:
      en: '`starter-thirdpartyproject`'
  explanation:
    en: A third-party starter project called `thirdpartyproject` would typically be named `thirdpartyproject-spring-boot-starter`.
      The names `spring-boot-starter-thirdpartyproject` and `spring-boot-thirdpartyproject-starter` are wrong, because
      third-party starters should not start with `spring-boot`, which is reserved for official Spring Boot artifacts.
      The name `starter-thirdpartyproject` is wrong, because a third-party starter typically starts with the name
      of the project.
  citation: spring-boot-using-build-systems#using.build-systems.starters
- id: m05-l02-q03
  prompt:
    en: An application binds properties to a `@ConfigurationProperties` class with prefix `my.main-project.person`
      and field `firstName`. Which property name format does Spring Boot recommend for `.properties` and YAML files?
  options:
  - id: a
    text:
      en: Underscore notation, such as `my.main-project.person.first_name`
  - id: b
    text:
      en: Upper case format, such as `MY_MAINPROJECT_PERSON_FIRSTNAME`
  - id: c
    text:
      en: Camel case, such as `my.main-project.person.firstName`
  - id: d
    correct: true
    text:
      en: Kebab case, such as `my.main-project.person.first-name`
  explanation:
    en: Kebab case is recommended for use in `.properties` and YAML files. The claim that underscore notation is
      recommended is wrong, because it is only an alternative format for use in `.properties` and YAML files. The
      claim that upper case format is recommended for these files is wrong, because that format is recommended when
      using system environment variables. The claim that camel case is recommended is wrong, because the documentation
      recommends that properties are stored in lower-case kebab format when possible.
  citation: spring-boot-features-external-config#features.external-config.typesafe-configuration-properties.relaxed-binding
- id: m05-l02-q04
  prompt:
    en: Which Spring Boot property adds locations for `application.properties` files to the default locations, instead
      of replacing the default locations?
  options:
  - id: a
    correct: true
    text:
      en: '`spring.config.additional-location`'
  - id: b
    text:
      en: '`spring.config.location`, which takes a comma-separated list of locations'
  - id: c
    text:
      en: '`spring.config.name`, which takes the base name of the files'
  - id: d
    text:
      en: The `optional:` prefix, put in front of each location
  explanation:
    en: To add locations rather than replace the defaults, you use `spring.config.additional-location`. The property
      `spring.config.location` is wrong, because locations configured with it replace the default locations. The
      property `spring.config.name` is wrong, because it switches the configuration file name and does not add locations.
      The `optional:` prefix is wrong, because it only marks locations that you do not mind if they do not exist.
  citation: spring-boot-features-external-config#features.external-config.files
- id: m05-l02-q05
  prompt:
    en: In the Spring Boot order of property sources, where later sources override earlier ones, which of these
      sources is considered last and so overrides the other three?
  options:
  - id: a
    correct: true
    text:
      en: Command line arguments
  - id: b
    text:
      en: Config data such as `application.properties` files
  - id: c
    text:
      en: OS environment variables
  - id: d
    text:
      en: Java System properties
  explanation:
    en: Command line arguments come after `SPRING_APPLICATION_JSON` and the other sources in the list, so they override
      the other three. Config data is wrong, because `random.*` properties and OS environment variables come after
      it in the list. OS environment variables are wrong, because Java System properties come after them in the
      list. Java System properties are wrong, because JNDI attributes come after them in the list.
  citation: spring-boot-features-external-config#page-title
- id: m05-l02-q06
  prompt:
    en: How many `@SpringBootApplication` or `@EnableAutoConfiguration` annotations should a Spring Boot application
      add, and where does the documentation recommend adding them?
  options:
  - id: a
    text:
      en: One on every `@Configuration` class that needs auto-configuration
  - id: b
    correct: true
    text:
      en: Only one, generally on the primary `@Configuration` class
  - id: c
    text:
      en: Two, one `@SpringBootApplication` and one `@EnableAutoConfiguration` on the same class
  - id: d
    text:
      en: None, because auto-configuration is enabled for every Spring application
  explanation:
    en: You should only ever add one of these annotations, and the documentation generally recommends the primary
      `@Configuration` class. The claim that every `@Configuration` class that needs it should add one is wrong,
      because the recommendation is to add one or the other to your primary `@Configuration` class only. The claim
      that both annotations belong together is wrong, because you add one or the other. The claim that no annotation
      is needed is wrong, because you need to opt in to auto-configuration with one of the annotations.
  citation: spring-boot-using-auto-configuration#page-title
- id: m05-l02-q08
  prompt:
    en: A library has several flavors, options or optional features, and offers Spring Boot auto-configuration.
      What does the Spring Boot reference say about how to package its auto-configuration and starter?
  options:
  - id: a
    text:
      en: It is better to merge everything into the starter, so that users see a single module
  - id: b
    text:
      en: Spring Boot requires the separation into two modules for every library
  - id: c
    correct: true
    text:
      en: It is better to separate the auto-configuration, to express that some features are optional
  - id: d
    text:
      en: The optional features belong in a separate test-scoped starter
  explanation:
    en: It is better to separate the auto-configuration, because you can clearly express the fact that some features
      are optional. The claim that merging is better is wrong, because merging the two modules in the starter is
      an option when the auto-configuration is straightforward and has no optional features. The claim that the
      separation is required is wrong, because this separation in two modules is in no way necessary. The claim
      that optional features go in a test-scoped starter is wrong, because a separate test-scoped starter is the
      place for test-specific auto-configurations such as in-memory replacements.
  citation: spring-boot-features-developing-auto-configuration#features.developing-auto-configuration.custom-starter
- id: m05-l02-q09
  prompt:
    en: Spring Boot considers config data files in a fixed order, with later files overriding earlier ones. Which
      of these files is considered last and so wins?
  options:
  - id: a
    text:
      en: Application properties packaged inside the jar, as the base values
  - id: b
    text:
      en: Profile-specific application properties packaged inside the jar
  - id: c
    text:
      en: Application properties outside of the packaged jar, next to the jar
  - id: d
    correct: true
    text:
      en: Profile-specific application properties outside of the packaged jar
  explanation:
    en: Profile-specific application properties outside of the packaged jar are the last in the order of config
      data files. The inside-the-jar application properties are wrong, because the profile-specific properties inside
      the jar come after them. The profile-specific properties inside the jar are wrong, because the application
      properties outside of the jar come after them. The application properties outside of the jar are wrong, because
      the profile-specific properties outside of the jar come after them.
  citation: spring-boot-features-external-config#page-title
- id: m05-l02-q11
  prompt:
    en: If the actuator is on the classpath of a Spring Boot application, which endpoint renders the `ConditionEvaluationReport`
      in JSON?
  options:
  - id: a
    text:
      en: The `configprops` endpoint
  - id: b
    correct: true
    text:
      en: The `conditions` endpoint
  - id: c
    text:
      en: The `env` endpoint
  - id: d
    text:
      en: 'No endpoint: the report exists only in tests that use `ApplicationContextRunner`'
  explanation:
    en: With the actuator, a `conditions` endpoint renders the report in JSON. The `configprops` endpoint is wrong,
      because it is the one to look at for classes annotated with `@ConfigurationProperties`. The `env` endpoint
      is wrong, because it and `configprops` help determine why a property has a particular value. The claim that
      the report exists only in `ApplicationContextRunner` tests is wrong, because a `ConditionEvaluationReport`
      is available in any Spring Boot `ApplicationContext`.
  citation: spring-boot-howto-application#howto.application.troubleshoot-auto-configuration; spring-boot-features-external-config#page-title
