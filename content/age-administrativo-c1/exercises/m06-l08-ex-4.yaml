- id: m06-l08-q125
  prompt:
    es: "Señale la definición de HTTPS que ofrece el glosario de términos de ciberseguridad de INCIBE en su apartado sobre protocolos:"
  options:
  - id: a
    text:
      es: "Un protocolo de red basado en FTP, destinado a la transferencia segura de ficheros"
  - id: b
    correct: true
    text:
      es: "Un protocolo de red basado en HTTP, destinado a la transferencia segura de datos de hipertexto"
  - id: c
    text:
      es: "Un protocolo de red basado en TCP/IP, destinado a traducir nombres de dominio de forma segura"
  - id: d
    text:
      es: "Un protocolo de red basado en SMTP, destinado al envío seguro de correo electrónico"
  explanation:
    es: "HTTPS es un protocolo de red basado en HTTP, destinado a la transferencia segura de datos de hipertexto; en otras palabras, la versión segura de HTTP. La versión segura de FTP es SFTP, que usa SSH para la transferencia de datos entre cliente y servidor. SMTP intercambia mensajes de correo electrónico y no tiene una versión segura llamada HTTPS. Traducir nombres de dominio en direcciones IP es la función del DNS."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.8.9. HTTPS»"
  difficulty: 1
  tags:
  - "concepto"
