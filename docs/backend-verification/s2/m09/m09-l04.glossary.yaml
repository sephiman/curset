- id: g-quota-policy
  term:
    en: quota policy
  definition:
    en: A quota policy is implemented by the server to regulate the activity within a specified quota partition, quantified in quota units, over a defined time window.
  origin: m09-l04
  citation: ietf-httpapi-ratelimit-headers#content
- id: g-uuidv7
  term:
    en: UUIDv7
  definition:
    en: UUIDv7 features a time-ordered value field derived from the widely implemented and well-known Unix Epoch timestamp source, the number of milliseconds since midnight 1 Jan 1970 UTC, leap seconds excluded.
  origin: m09-l04
  citation: rfc9562#section-5.7
- id: g-prompt-injection
  term:
    en: prompt injection
  definition:
    en: A Prompt Injection Vulnerability occurs when user prompts alter the LLM's behavior or output in unintended ways.
  origin: m09-l04
  citation: owasp-llm-top10-prompt-injection#main
