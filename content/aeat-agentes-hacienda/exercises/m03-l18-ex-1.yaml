# anchor: boe-a-1992-28740-art-1
- id: m03-l18-q0001
  prompt:
    es: "De acuerdo con el artículo 1 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, el Impuesto sobre el Valor Añadido es un tributo:"
  options:
  - id: a
    correct: true
    text:
      es: "de naturaleza indirecta que recae sobre el consumo."
  - id: b
    text:
      es: "de naturaleza directa que recae sobre la renta de los empresarios."
  - id: c
    text:
      es: "de naturaleza indirecta que recae sobre el patrimonio empresarial."
  - id: d
    text:
      es: "de naturaleza directa que recae sobre el consumo de bienes y servicios."
  explanation:
    es: "El IVA es un tributo indirecto que grava el consumo. No grava la renta ni el patrimonio del empresario, y tampoco es un impuesto directo sobre el consumo."
  citation: "art. 1 LIVA"
  difficulty: 1
  tags:
  - "naturaleza"
# anchor: boe-a-1992-28740-art-2
- id: m03-l18-q0003
  prompt:
    es: "Conforme al artículo 2.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, el impuesto se exigirá de acuerdo con la ley y con las normas reguladoras de los regímenes de Concierto y Convenio Económico en vigor, respectivamente, en:"
  options:
  - id: a
    text:
      es: "los Territorios Históricos del País Vasco y en las ciudades de Ceuta y Melilla."
  - id: b
    correct: true
    text:
      es: "los Territorios Históricos del País Vasco y en la Comunidad Foral de Navarra."
  - id: c
    text:
      es: "las islas Canarias y en la Comunidad Foral de Navarra."
  - id: d
    text:
      es: "los Territorios Históricos del País Vasco y en la Comunidad Autónoma de Cataluña."
  explanation:
    es: "El Concierto Económico rige en los Territorios Históricos del País Vasco y el Convenio Económico en la Comunidad Foral de Navarra, en ese orden. Cataluña no tiene Convenio Económico, y ni Ceuta y Melilla ni Canarias tienen ese régimen."
  citation: "art. 2.Uno LIVA"
  difficulty: 1
  tags:
  - "normas aplicables"
  - "Concierto y Convenio"
# anchor: boe-a-1992-28740-art-2
- id: m03-l18-q0004
  prompt:
    es: "¿Qué debe tenerse en cuenta en la aplicación del impuesto, según el artículo 2.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Solo los Tratados con la Unión Europea, y no los demás Convenios internacionales."
  - id: b
    text:
      es: "Los Tratados y Convenios internacionales solo cuando una norma estatal posterior los desarrolle."
  - id: c
    text:
      es: "Los Tratados y Convenios internacionales firmados por España, formen o no parte del ordenamiento interno español."
  - id: d
    correct: true
    text:
      es: "Lo dispuesto en los Tratados y Convenios internacionales que formen parte del ordenamiento interno español."
  explanation:
    es: "La ley manda atender a los Tratados y Convenios internacionales que formen parte del ordenamiento interno. No limita la regla a los de la Unión Europea, no alcanza a los que no forman parte del ordenamiento interno y no exige un desarrollo posterior."
  citation: "art. 2.Dos LIVA"
  difficulty: 1
  tags:
  - "normas aplicables"
  - "tratados"
# anchor: boe-a-1992-28740-art-3
- id: m03-l18-q0005
  prompt:
    es: "Según el artículo 3.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, el ámbito espacial de aplicación del impuesto incluye el mar territorial hasta el límite de:"
  options:
  - id: a
    text:
      es: "24 millas náuticas, y también las islas adyacentes, pero no el espacio aéreo correspondiente."
  - id: b
    text:
      es: "12 millas náuticas, pero no las islas adyacentes ni el espacio aéreo."
  - id: c
    correct: true
    text:
      es: "12 millas náuticas, y también las islas adyacentes y el espacio aéreo correspondiente."
  - id: d
    text:
      es: "200 millas náuticas, que es el límite de la zona económica exclusiva."
  explanation:
    es: "El territorio español incluye las islas adyacentes, el mar territorial hasta 12 millas náuticas y el espacio aéreo correspondiente. Las 24 millas no son el límite, la ley no deja fuera las islas ni el espacio aéreo, y las 200 millas son un límite que el precepto no recoge."
  citation: "art. 3.Uno LIVA"
  difficulty: 1
  tags:
  - "territorialidad"
  - "ámbito espacial"
# anchor: boe-a-1992-28740-art-3
- id: m03-l18-q0006
  prompt:
    es: "¿Cuál de los siguientes territorios se excluye del «interior del país» del Reino de España en cuanto territorio no comprendido en la Unión Aduanera, según el artículo 3.Dos.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "La Isla de Helgoland y el territorio de Büsingen, en cuanto territorios no comprendidos en la Unión Aduanera."
  - id: b
    text:
      es: "Las islas Baleares, en cuanto territorios no comprendidos en la Unión Aduanera."
  - id: c
    text:
      es: "Las islas adyacentes a la Península, en cuanto territorios no comprendidos en la Unión Aduanera."
  - id: d
    correct: true
    text:
      es: "Ceuta y Melilla, en cuanto territorios no comprendidos en la Unión Aduanera."
  explanation:
    es: "En España, Ceuta y Melilla quedan fuera del «interior del país» por no estar en la Unión Aduanera. Las Baleares y las islas adyacentes forman parte del ámbito espacial, y Helgoland y Büsingen son exclusiones de Alemania, no de España."
  citation: "art. 3.Dos.1.º.a) LIVA"
  difficulty: 2
  tags:
  - "territorialidad"
  - "Ceuta y Melilla"
# anchor: boe-a-1992-28740-art-3
- id: m03-l18-q0007
  prompt:
    es: "Según el artículo 3.Dos.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿por qué razón queda Canarias excluida del «interior del país» del Reino de España?"
  options:
  - id: a
    text:
      es: "Por tratarse de un territorio con régimen de Concierto Económico propio."
  - id: b
    correct: true
    text:
      es: "Por tratarse de un territorio excluido de la armonización de los impuestos sobre el volumen de negocios."
  - id: c
    text:
      es: "Por tratarse de un territorio que no forma parte del Reino de España."
  - id: d
    text:
      es: "Por tratarse de un territorio no comprendido en la Unión Aduanera."
  explanation:
    es: "Canarias se excluye por estar fuera de la armonización de los impuestos sobre el volumen de negocios. El motivo de la Unión Aduanera es el de Ceuta y Melilla, Canarias sí es territorio español y su régimen no es el Concierto, que corresponde al País Vasco."
  citation: "art. 3.Dos.1.º.b) LIVA"
  difficulty: 2
  tags:
  - "territorialidad"
  - "Canarias"
# anchor: boe-a-1992-28740-art-3
- id: m03-l18-q0008
  prompt:
    es: "De acuerdo con el artículo 3.Dos.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, «Comunidad» y «territorio de la Comunidad» es:"
  options:
  - id: a
    correct: true
    text:
      es: "el conjunto de los territorios que constituyen el «interior del país» de cada Estado miembro."
  - id: b
    text:
      es: "el conjunto de los territorios que forman la Unión Aduanera, incluidos Ceuta y Melilla."
  - id: c
    text:
      es: "el conjunto de los territorios de los Estados miembros, incluidos los excluidos del «interior del país»."
  - id: d
    text:
      es: "el conjunto de los territorios de la Unión Europea y de los países con convenios internacionales."
  explanation:
    es: "La Comunidad es el conjunto de los territorios que forman el «interior del país» de cada Estado miembro. Las exclusiones del número anterior, como Ceuta, Melilla o Canarias, quedan fuera, y no depende de la Unión Aduanera ni de convenios con terceros."
  citation: "art. 3.Dos.2.º LIVA"
  difficulty: 2
  tags:
  - "territorialidad"
  - "Comunidad"
# anchor: boe-a-1992-28740-art-3
- id: m03-l18-q0009
  prompt:
    es: "Conforme al artículo 3.Dos.3.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, «territorio tercero» o «país tercero» es cualquier territorio:"
  options:
  - id: a
    text:
      es: "que no sea miembro de la Unión Europea, aunque forme parte del «interior del país»."
  - id: b
    text:
      es: "que no pertenezca a la Organización Mundial del Comercio ni a la Unión Aduanera."
  - id: c
    text:
      es: "situado fuera de España, aunque sea «interior del país» de otro Estado miembro."
  - id: d
    correct: true
    text:
      es: "distinto de los definidos como «interior del país» de los Estados miembros."
  explanation:
    es: "El territorio tercero es el que no es «interior del país» de ningún Estado miembro. Un territorio que sí lo es, aunque esté en otro Estado miembro, no es tercero, y el criterio no es la pertenencia a la Organización Mundial del Comercio."
  citation: "art. 3.Dos.3.º LIVA"
  difficulty: 2
  tags:
  - "territorialidad"
  - "territorio tercero"
# anchor: boe-a-1992-28740-art-3
- id: m03-l18-q0011
  prompt:
    es: "Según el artículo 3.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, las operaciones efectuadas con las zonas de soberanía del Reino Unido en Akrotiri y Dhekelia tendrán la misma consideración que las efectuadas con:"
  options:
  - id: a
    correct: true
    text:
      es: "Chipre, a efectos de este impuesto."
  - id: b
    text:
      es: "Grecia, a efectos de este impuesto."
  - id: c
    text:
      es: "Francia, a efectos de este impuesto."
  - id: d
    text:
      es: "el Reino Unido, a efectos de este impuesto."
  explanation:
    es: "Akrotiri y Dhekelia se equiparan a Chipre. El Reino Unido corresponde a la Isla de Man, Francia al Principado de Mónaco, y Grecia no figura en la equiparación."
  citation: "art. 3.Tres LIVA"
  difficulty: 2
  tags:
  - "territorialidad"
  - "Akrotiri y Dhekelia"
# anchor: boe-a-1992-28740-art-1
- id: m03-l18-q0133
  prompt:
    es: "Según el artículo 1 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, el impuesto grava las entregas de bienes y prestaciones de servicios de empresarios o profesionales, las adquisiciones intracomunitarias de bienes y:"
  options:
  - id: a
    text:
      es: "las exportaciones de bienes a países terceros."
  - id: b
    correct: true
    text:
      es: "las importaciones de bienes."
  - id: c
    text:
      es: "las transmisiones patrimoniales onerosas entre particulares."
  - id: d
    text:
      es: "los actos jurídicos documentados de carácter notarial."
  explanation:
    es: "La tercera operación gravada es la importación de bienes. Las exportaciones no están en la enumeración del artículo 1, y las transmisiones patrimoniales y los actos jurídicos documentados son conceptos de otro impuesto."
  citation: "art. 1 LIVA"
  difficulty: 1
  tags:
  - "naturaleza"
  - "operaciones gravadas"
# anchor: boe-a-1992-28740-art-3
- id: m03-l18-q0134
  prompt:
    es: "¿Qué comprende el ámbito espacial de aplicación del impuesto, según el artículo 3.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    correct: true
    text:
      es: "El territorio español, incluidas las islas adyacentes, el mar territorial hasta 12 millas náuticas y el espacio aéreo correspondiente."
  - id: b
    text:
      es: "El territorio español peninsular, con exclusión de las islas adyacentes y del espacio aéreo."
  - id: c
    text:
      es: "El territorio español y el mar territorial hasta 24 millas náuticas, sin el espacio aéreo."
  - id: d
    text:
      es: "El territorio español y la zona económica exclusiva hasta el límite de 200 millas náuticas."
  explanation:
    es: "El ámbito espacial es el territorio español con las islas adyacentes, el mar territorial hasta 12 millas náuticas y el espacio aéreo correspondiente. No se limita a la Península, no llega a la zona económica exclusiva ni a las 24 millas y sí incluye el espacio aéreo."
  citation: "art. 3.Uno LIVA"
  difficulty: 1
  tags:
  - "territorialidad"
  - "ámbito espacial"
# anchor: boe-a-1992-28740-art-2
- id: m03-l18-q0137
  prompt:
    es: "Según el artículo 2.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué normas se aplican, respectivamente, en los Territorios Históricos del País Vasco y en la Comunidad Foral de Navarra, además de la propia ley?"
  options:
  - id: a
    text:
      es: "Las del régimen especial simplificado y las del régimen de agricultura, ganadería y pesca."
  - id: b
    text:
      es: "Las de los regímenes de Concierto Económico en ambos territorios."
  - id: c
    correct: true
    text:
      es: "Las de los regímenes de Concierto Económico y de Convenio Económico en vigor."
  - id: d
    text:
      es: "Las de los regímenes de Convenio Económico y de Concierto Económico en vigor."
  explanation:
    es: "El País Vasco se rige por el Concierto Económico y Navarra por el Convenio Económico, en ese orden. Invertirlos contradice el «respectivamente», los regímenes especiales del IVA son otra materia y Navarra no tiene un Concierto."
  citation: "art. 2.Uno LIVA"
  difficulty: 2
  tags:
  - "normas aplicables"
  - "Concierto y Convenio"
