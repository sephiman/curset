    correct: true
    text:
      es: "Un plazo de 15 días desde la notificación."
  - id: b
    text:
      es: "Un plazo de dos meses desde la notificación."
  - id: c
    text:
      es: "Un plazo de cinco días desde la notificación."
  - id: d
    text:
      es: "Un plazo de un mes desde la notificación."
  explanation:
    es: "El artículo 210.4 LGT concede un plazo de 15 días para alegar y presentar documentos, justificantes y pruebas. Un mes es el plazo de la conformidad a la propuesta del artículo 211.1. Y no hay plazos de cinco días ni de dos meses en este trámite."
