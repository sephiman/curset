- id: m07-l03-qa01
  prompt:
    en: According to the Envoy project in Supported load balancers, which statement describes how the Maglev balancer
      compares with the ring hash balancer?
  options:
  - id: a
    correct: true
    text:
      en: Maglev builds its lookup table and picks hosts substantially faster
  - id: b
    text:
      en: Maglev keeps more keys in place than ring hash when hosts are removed
  - id: c
    text:
      en: Maglev cannot replace ring hash where consistent hashing is needed
  - id: d
    text:
      en: Maglev balances without routing that specifies a value to hash on
  explanation:
    en: The Envoy project writes that Maglev has substantially faster table lookup build times and host selection
      times than ring hash. It writes that Maglev is not as stable as ring hash when upstream hosts change, which
      contradicts the claim that it keeps more keys in place. It writes that Maglev can be used as a drop in replacement
      for ring hash wherever consistent hashing is desired, which contradicts the claim that it cannot replace it.
      It writes that, like ring hash, Maglev is only effective when protocol routing specifies a value to hash on,
      which contradicts balancing without one.
  citation: envoy-load-balancers#arch-overview-load-balancing-types-maglev
- id: m07-l03-qa03
  prompt:
    en: According to the Envoy project in Supported load balancers, what happens in the least request balancer,
      with hosts of unequal weights, when `active_request_bias` is set to `0.0`?
  options:
  - id: a
    text:
      en: It lowers a busy host's weight as aggressively as it can
  - id: b
    text:
      en: It switches the balancer to power of two choices selection
  - id: c
    text:
      en: It is rejected, because the bias must be greater than 0.0
  - id: d
    correct: true
    text:
      en: It behaves like round robin, ignoring active requests
  explanation:
    en: The Envoy project writes that with `active_request_bias` set to `0.0` the least request balancer behaves
      like round robin and ignores the active request count at the time of picking. It writes that the larger the
      bias, the more aggressively active requests lower the effective weight, which contradicts lowering it as aggressively
      as possible at `0.0`. It writes that unequal weights put the balancer into a weighted round robin schedule,
      which contradicts a switch to power of two choices. It writes that the bias must be greater than or equal
      to `0.0`, which contradicts rejecting `0.0`.
  citation: envoy-load-balancers#arch-overview-load-balancing-types-least-request
- id: m07-l03-qa04
  prompt:
    en: According to the Envoy project in Health checking, which statement about the `x-envoy-immediate-health-check-fail`
      header does the documentation make?
  options:
  - id: a
    text:
      en: It takes effect only when the cluster has passive health checking configured
  - id: b
    correct: true
    text:
      en: A host that sets it is marked failed at once and excluded from load balancing
  - id: c
    text:
      en: An operator must add it by hand because the health checking filter never sets it
  - id: d
    text:
      en: Only the router filter responds to it, not the active HTTP health checker
  explanation:
    en: The Envoy project writes that if an upstream host sets the header, Envoy immediately marks the host as failed
      for active health check and excludes it from load balancing. It writes that this only occurs if the host's
      cluster has active health checking configured, which contradicts a dependence on passive health checking.
      It writes that the health checking filter sets the header automatically once Envoy is marked failed through
      the `/healthcheck/fail` admin endpoint, which contradicts the claim that an operator must add it. It writes
      that both the router filter and the HTTP active health checker respond to the header, which contradicts the
      router filter alone.
  citation: envoy-health-checking#arch-overview-health-checking-fast-failure
- id: m07-l03-qa06
  prompt:
    en: According to Cloudflare in Purge cache, which statement about purging cached content and checking that a
      purge worked does the documentation make?
  options:
  - id: a
    text:
      en: A purge request that returns `HTTP 200` confirms that the targeted content was evicted
  - id: b
    text:
      en: Purge everything is the recommended method for making content updates show immediately
  - id: c
    correct: true
    text:
      en: To verify a purge, request the asset and confirm `CF-Cache-Status` is no longer `HIT`
  - id: d
    text:
      en: Invalidating content makes the next request fetch it from the origin every time
  explanation:
    en: Cloudflare writes that to verify a purge you request the asset after purging and confirm that `CF-Cache-Status`
      is no longer `HIT`. It writes that a successful purge returns `HTTP 200` only to show the request was received,
      not that content was evicted, which contradicts reading `200` as confirmation. It writes that single-file
      purge by URL is the recommended method, which contradicts purge everything as the recommendation. It writes
      that Cloudflare revalidates invalidated content on the next request and reuses what has not changed, which
      contradicts always fetching from the origin.
  citation: cloudflare-cache-purge#_top
