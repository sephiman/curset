# anchor: fuente-ms-win-antivirus-html
- id: m02-l05-q283
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes botones permite quitar de la lista de amenazas permitidas un elemento que se permitió por error, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Cuarentena"
  - id: b
    text:
      es: "Restaurar"
  - id: c
    correct: true
    text:
      es: "No permitir"
  - id: d
    text:
      es: "Excluir"
  explanation:
    es: "La página indica seleccionar el elemento y pulsar No permitir para que Seguridad de Windows vuelva a actuar. «Cuarentena» no es el botón que cita la página para quitar un elemento de la lista de permitidas. «Restaurar» no es el botón que cita la página para quitar un elemento de la lista de permitidas. «Excluir» no es el botón que cita la página para quitar un elemento de la lista de permitidas. Lo que dice la fuente: «selecciónala en la lista y, a continuación, selecciona el botón No permitir»."
  citation: "fuente: `ms-win-antivirus.html`; «Protección contra amenazas y virus en la aplicación Seguridad de Windows»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-antivirus-html
- id: m02-l05-q284
  prompt:
    es: "En Windows 11, ¿qué sección de la página Protección contra virus y amenazas garantiza que el dispositivo cuente con las últimas actualizaciones de inteligencia de seguridad?"
  options:
  - id: a
    text:
      es: "Amenazas actuales"
  - id: b
    text:
      es: "Protección contra ransomware"
  - id: c
    text:
      es: "Configuración de la protección contra virus y amenazas"
  - id: d
    correct: true
    text:
      es: "Actualizaciones de protección contra amenazas y virus"
  explanation:
    es: "La página dedica esa sección a mantener la inteligencia de seguridad al día. «Amenazas actuales» muestra las amenazas encontradas y permite iniciar exámenes, no gestiona las actualizaciones. «Protección contra ransomware» configura el acceso controlado a carpetas, no las actualizaciones de inteligencia. «Configuración de la protección contra virus y amenazas» gestiona los ajustes de Microsoft Defender Antivirus, no las actualizaciones de inteligencia."
  citation: "fuente: `ms-win-antivirus.html`; «Actualizaciones de protección contra amenazas & virus:»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-firewall-html
- id: m02-l05-q323
  prompt:
    es: "¿Cuál de las siguientes opciones de Firewall y protección de red en Windows 11 sirve para diagnosticar y corregir automáticamente problemas generales de conectividad?"
  options:
  - id: a
    text:
      es: "Permitir una aplicación a través del firewall"
  - id: b
    text:
      es: "Configuración de notificaciones de firewall"
  - id: c
    text:
      es: "Restaurar los firewalls a los valores predeterminados"
  - id: d
    correct: true
    text:
      es: "Solucionador de problemas de red e Internet"
  explanation:
    es: "La página dice que el Solucionador de problemas de red e Internet sirve, ante problemas generales de conectividad, para intentar diagnosticarlos y corregirlos automáticamente. Permitir una aplicación a través del firewall agrega una excepción para una aplicación bloqueada o abre un puerto específico. La configuración de notificaciones regula cuántas notificaciones da el firewall cuando bloquea algo. Restaurar los firewalls devuelve la configuración al estado en que estaba al obtener el equipo."
  citation: "fuente: `ms-win-firewall.html`; «Firewall y protección de red en la aplicación Seguridad de Windows»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-antivirus-html
- id: m02-l05-q325
  prompt:
    es: "¿A qué examen se aplican las exclusiones agregadas en Seguridad de Windows de Windows 11, según la página de Microsoft sobre protección contra virus y amenazas?"
  options:
  - id: a
    text:
      es: "A todos los análisis, incluidos los programados con productos antimalware de terceros"
  - id: b
    text:
      es: "Solo a los análisis programados con el Antivirus de Microsoft Defender"
  - id: c
    correct: true
    text:
      es: "Solo al examen en tiempo real del Antivirus de Microsoft Defender"
  - id: d
    text:
      es: "Solo al examen sin conexión que se ejecuta tras un reinicio"
  explanation:
    es: "La página dice que las exclusiones solo se aplican al examen en tiempo real con el Antivirus de Microsoft Defender. Aplicarse a todos los análisis contradice la página, según la cual los análisis programados, con Defender o con productos de terceros, podrían seguir examinando esos archivos. Aplicarse a los análisis programados contradice que solo valgan para el examen en tiempo real. El examen sin conexión es otro tipo de examen, distinto del examen en tiempo real al que se limitan las exclusiones."
  citation: "fuente: `ms-win-antivirus.html`; «Protección contra amenazas y virus en la aplicación Seguridad de Windows»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q330
  prompt:
    es: "¿Qué sinónimo da el glosario de términos de ciberseguridad del INCIBE para empresarios para el término «spyware»?"
  options:
  - id: a
    text:
      es: "Software malicioso"
  - id: b
    correct: true
    text:
      es: "Programa espía"
  - id: c
    text:
      es: "Antimalware"
  - id: d
    text:
      es: "Malvertising"
  explanation:
    es: "El glosario da «programa espía» como sinónimo de spyware. Software malicioso es el sinónimo de malware. Antimalware es el sinónimo de antivirus. Malvertising es el sinónimo de adware."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Spyware»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q332
  prompt:
    es: "Según el glosario de términos de ciberseguridad que publica el INCIBE para empresarios, ¿qué es un rootkit?"
  options:
  - id: a
    correct: true
    text:
      es: "Un malware que da acceso continuo como administrador y oculta su presencia"
  - id: b
    text:
      es: "Un malware que secuestra un dispositivo o su información hasta que se paga un rescate"
  - id: c
    text:
      es: "Un tipo de spyware que monitoriza la actividad del teclado y la envía al ciberdelincuente"
  - id: d
    text:
      es: "Un malware con múltiples utilidades, la más común crear una puerta trasera en el equipo"
  explanation:
    es: "El glosario define el rootkit como un tipo de malware que permite un acceso continuo con permisos de administrador a un dispositivo y mantiene su presencia oculta a los administradores. Secuestrar el dispositivo o su información hasta cobrar un rescate es la definición de ransomware. Monitorizar la actividad del teclado para enviarla al ciberdelincuente es la definición de keylogger. Un malware con múltiples utilidades, cuya más común es crear una puerta trasera, es la definición de troyano."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Rootkit»"
  difficulty: 2
  tags:
  - "concepto"
