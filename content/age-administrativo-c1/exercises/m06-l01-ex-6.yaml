# anchor: fuente-azure-vdi-html
- id: m06-l01-q170
  prompt:
    es: "¿A qué corresponden las siglas VDI, según la documentación de Microsoft Azure sobre los escritorios virtuales?"
  options:
  - id: a
    text:
      es: "A Windows Virtual Desktop Access (VDA)."
  - id: b
    text:
      es: "A Software as a Service (SaaS)."
  - id: c
    correct: true
    text:
      es: "A infraestructura de escritorio virtual."
  - id: d
    text:
      es: "A Bring Your Own Device (BYOD)."
  explanation:
    es: "La página dice que VDI en formato completo es «infraestructura de escritorio virtual». Windows Virtual Desktop Access (VDA) es el modelo de licencia que la misma página distingue de la VDI, BYOD es el caso de los dispositivos personales y SaaS es el modelo de software como servicio."
  citation: "fuente: `azure-vdi.html`; «¿Qué es Infraestructura de escritorio virtual (VDI)?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q171
  prompt:
    es: "¿Cuál de las siguientes acciones se puede hacer con los escritorios virtuales de una VDI cuando un equipo crece o hay recursos estacionales, según Microsoft?"
  options:
  - id: a
    text:
      es: "Instalar en cada dispositivo una copia local del escritorio."
  - id: b
    text:
      es: "Comprar un equipo físico nuevo para cada empleado que se incorpora."
  - id: c
    text:
      es: "Esperar a la renovación anual del hardware de la empresa."
  - id: d
    correct: true
    text:
      es: "Agregarlos, quitarlos o reasignarlos rápidamente."
  explanation:
    es: "La página dice que los escritorios virtuales «se pueden agregar, quitar o reasignar rápidamente, lo que es ideal para equipos en crecimiento o recursos estacionales». Instalar una copia local del escritorio en cada dispositivo contradice el modelo: el escritorio virtual se aloja en servidores centralizados y no en el dispositivo del empleado. Comprar un equipo físico para cada alta es lo que la página dice que la VDI evita: los nuevos miembros empiezan sin un dispositivo físico nuevo y se escala sin grandes inversiones en hardware. Esperar a la renovación anual choca con «rápidamente», que es la ventaja que cita la página."
  citation: "fuente: `azure-vdi.html`; «Ventajas y casos de uso»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q172
  prompt:
    es: "¿Cuál de las siguientes razones da Microsoft para que la VDI sea útil al planear la recuperación ante desastres?"
  options:
  - id: a
    text:
      es: "Los empleados solo pueden trabajar desde la oficina central de la empresa."
  - id: b
    text:
      es: "Cada escritorio guarda una copia de sus datos en el dispositivo del empleado."
  - id: c
    text:
      es: "Elimina por completo la necesidad de un almacenamiento central de datos."
  - id: d
    correct: true
    text:
      es: "Se accede a ellos desde cualquier lugar y son más fáciles de restaurar."
  explanation:
    es: "La página dice que, como se puede acceder a los escritorios virtuales desde cualquier lugar, son más fáciles de restaurar cuando se producen interrupciones inesperadas. En la VDI los datos no se guardan en los dispositivos locales, el acceso no se limita a la oficina y se requiere un sistema de almacenamiento central."
  citation: "fuente: `azure-vdi.html`; «Ventajas y casos de uso»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q173
  prompt:
    es: "Según Microsoft, en los entornos de alta seguridad de sectores como las finanzas, la asistencia sanitaria o la administración pública, la VDI admite:"
  options:
  - id: a
    text:
      es: "que los datos confidenciales se guarden en los dispositivos locales de la oficina."
  - id: b
    text:
      es: "un control de acceso más laxo para facilitar el trabajo remoto de todos."
  - id: c
    correct: true
    text:
      es: "directivas de seguridad centralizadas y ayuda con los requisitos de cumplimiento."
  - id: d
    text:
      es: "que cada empleado configure la seguridad en su propio dispositivo personal."
  explanation:
    es: "La página dice que en los entornos de alta seguridad la VDI admite directivas de seguridad centralizadas y ayuda con los requisitos de cumplimiento. Los datos confidenciales permanecen en el centro de datos o en la nube, no en los dispositivos locales, y la centralización permite un control de acceso más estricto, no más laxo."
  citation: "fuente: `azure-vdi.html`; «Ventajas y casos de uso»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-azure-vdi-html
- id: m06-l01-q174
  prompt:
    es: "¿Cuántos componentes clave de VDI describe la página de Microsoft Azure sobre la infraestructura de escritorio virtual?"
  options:
  - id: a
    text:
      es: "Cuatro."
  - id: b
    text:
      es: "Cinco."
  - id: c
    correct: true
    text:
      es: "Seis."
  - id: d
    text:
      es: "Siete."
  explanation:
    es: "La página titula la sección «Seis componentes clave de VDI» y describe las máquinas virtuales, el hipervisor, el agente de conexión, el almacenamiento, el dispositivo cliente y la administración de perfiles de usuario: son seis, no cuatro, cinco ni siete."
  citation: "fuente: `azure-vdi.html`; «Seis componentes clave de VDI»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-learn-equipos-almacenamiento-html
- id: m06-l01-q175
  prompt:
    es: "¿Cuáles son los dos tipos principales de almacenamiento que distingue la formación de Microsoft sobre el almacenamiento de los equipos?"
  options:
  - id: a
    text:
      es: "El almacenamiento local y el almacenamiento en la nube."
  - id: b
    text:
      es: "La memoria a corto plazo y la memoria a largo plazo."
  - id: c
    text:
      es: "El almacenamiento en cinta y el almacenamiento en disco duro."
  - id: d
    correct: true
    text:
      es: "El almacenamiento magnético y el almacenamiento digital."
  explanation:
    es: "La página dice: «los dos tipos principales que veremos son el almacenamiento magnético y el almacenamiento digital». Local y nube no es ese par: la frase fija los dos tipos, y son otros. Corto y largo plazo separan la RAM del almacenamiento, no son dos tipos de almacenamiento: «Este tipo de memoria, memoria de acceso aleatorio, también se denomina memoria a corto plazo» y el almacenamiento es «el segundo tipo de memoria». Cinta y disco duro son ambos magnéticos, pues los discos duros «usan pequeños imanes para contener datos como una cinta»; el digital son las unidades de estado sólido, que «almacenan datos en circuitos pequeños en lugar de discos magnetizados»."
  citation: "fuente: `ms-learn-equipos-almacenamiento.html`; «Tipos de almacenamiento»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q176
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes afirmaciones sobre las características avanzadas del sistema de archivos NTFS es correcta, según Microsoft?"
  options:
  - id: a
    text:
      es: "Solo admite nombres de archivo de ocho caracteres y extensión de tres letras."
  - id: b
    correct: true
    text:
      es: "Incluye descriptores de seguridad, cifrado, cuotas de disco y metadatos enriquecidos."
  - id: c
    text:
      es: "Limita el tamaño de cada archivo a 4 GiB, igual que hace el sistema FAT32."
  - id: d
    text:
      es: "Carece de cuotas de disco y de cifrado, que solo ofrece el cifrado BitLocker."
  explanation:
    es: "La página dice que NTFS proporciona características avanzadas, incluidos descriptores de seguridad, cifrado, cuotas de disco y compatibilidad con metadatos enriquecidos. NTFS admite nombres de archivo largos con un alias 8.3 para compatibilidad, y la tabla de comparación da para NTFS un tamaño de archivo máximo de 2^64–1 bytes, mientras que los 4 GiB son el límite de FAT32."
  citation: "fuente: `ms-win-ntfs.html`; «Introducción a NTFS»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-ntfs-html
- id: m06-l01-q177
  prompt:
    es: "¿Con qué se integra NTFS para permitir un almacenamiento de alta disponibilidad al que acceden a la vez varios nodos de un clúster de conmutación por error, según Microsoft?"
  options:
  - id: a
    text:
      es: "Con las listas de control de acceso (ACL)."
  - id: b
    correct: true
    text:
      es: "Con los volúmenes compartidos de clúster (CSV)."
  - id: c
    text:
      es: "Con el cifrado de unidad BitLocker."
  - id: d
    text:
      es: "Con las cuotas de disco de cada usuario."
  explanation:
    es: "La página dice que NTFS se integra con los volúmenes compartidos de clúster (CSV), lo que permite un almacenamiento de alta disponibilidad al que varios nodos de un clúster de conmutación por error pueden acceder simultáneamente. BitLocker cifra los datos, las ACL asignan permisos y las cuotas controlan el espacio por usuario."
  citation: "fuente: `ms-win-ntfs.html`; «Introducción a NTFS»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-sql-server-html
- id: m06-l01-q178
  prompt:
    es: "¿Cuál de las siguientes funciones ofrece SQL Server Reporting Services, según la documentación de Microsoft?"
  options:
  - id: a
    text:
      es: "Procesamiento de extracción, transformación y carga para almacenamiento de datos."
  - id: b
    text:
      es: "Copia y distribución de datos de una base de datos a otra."
  - id: c
    correct: true
    text:
      es: "Informes habilitados para web con contenido de diversos orígenes de datos."
  - id: d
    text:
      es: "Integración del aprendizaje automático con los lenguajes R y Python."
  explanation:
    es: "La página dice que SQL Server Reporting Services ofrece funcionalidad empresarial de informes habilitados para web y que permite crear informes con contenido de diversos orígenes de datos. La extracción, transformación y carga es de Integration Services, la copia y distribución de datos es de la Replicación y el aprendizaje automático con R y Python es de Machine Learning Services."
  citation: "fuente: `ms-sql-server.html`; «Componentes y tecnologías de SQL Server»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-sql-server-html
- id: m06-l01-q179
  prompt:
    es: "¿Qué permite SQL Server Machine Learning Services, uno de los componentes de SQL Server que describe Microsoft?"
  options:
  - id: a
    text:
      es: "Copiar y sincronizar datos entre bases de datos de varias ubicaciones."
  - id: b
    text:
      es: "Administrar los datos maestros en un repositorio central y auditable."
  - id: c
    text:
      es: "Crear y publicar informes habilitados para web con distintos formatos."
  - id: d
    correct: true
    text:
      es: "Integrar el aprendizaje automático con R y Python en los flujos de trabajo."
  explanation:
    es: "La página dice que SQL Server Machine Learning Services admite la integración del aprendizaje automático a través de los lenguajes R y Python en los flujos de trabajo empresariales. Los informes son de Reporting Services, el repositorio central de datos maestros es de Master Data Services y la copia y sincronización de bases de datos es de la Replicación."
  citation: "fuente: `ms-sql-server.html`; «Componentes y tecnologías de SQL Server»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-sql-server-html
- id: m06-l01-q180
  prompt:
    es: "¿Qué proporciona el motor de base de datos de SQL Server a las aplicaciones consumidoras de datos, según la documentación de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Acceso controlado y procesamiento de transacciones."
  - id: b
    text:
      es: "Procesamiento de extracción, transformación y carga de datos."
  - id: c
    text:
      es: "Informes habilitados para web y administración de suscripciones."
  - id: d
    text:
      es: "Una solución de administración de datos maestros."
  explanation:
    es: "La página dice que el motor de base de datos proporciona acceso controlado y procesamiento de transacciones. Los informes y las suscripciones son de Reporting Services, la extracción, transformación y carga de Integration Services y la administración de datos maestros de Master Data Services."
  citation: "fuente: `ms-sql-server.html`; «Componentes y tecnologías de SQL Server»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-azure-mysql-html
- id: m06-l01-q181
  prompt:
    es: "¿Cuál de las siguientes series recoge las versiones de MySQL Community Edition en las que se basa Azure Database for MySQL servidor flexible?"
  options:
  - id: a
    text:
      es: "Las versiones 8.0, 8.4 y 9.0."
  - id: b
    text:
      es: "Las versiones 5.5, 8.0 y 8.4."
  - id: c
    correct: true
    text:
      es: "Las versiones 5.7, 8.0 y 8.4."
  - id: d
    text:
      es: "Las versiones 5.6, 5.7 y 8.0."
  explanation:
    es: "La página dice que el servicio se basa en MySQL Community Edition, versiones 5.7, 8.0 y 8.4. La serie 8.0, 8.4 y 9.0 sustituye la 5.7 por la 9.0, que no está en la lista. La 5.5, 8.0 y 8.4 cambia la 5.7 por la 5.5. Y la 5.6, 5.7 y 8.0 cambia la 8.4 por la 5.6. Cada una difiere de la lista de la página en una versión."
  citation: "fuente: `ms-azure-mysql.html`; «¿Qué es el servidor flexible de Azure Database for MySQL?»"
  difficulty: 3
  tags:
  - "cantidad"
