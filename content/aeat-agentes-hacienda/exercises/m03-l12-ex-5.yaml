# anchor: boe-a-2005-14803-art-85
- id: m03-l12-q0246
  prompt:
    es: "Entre los requisitos del mandamiento para la anotación preventiva de embargo, el artículo 85.c del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación incluye el nombre y apellidos o razón social o denominación completa, en su caso:"
  options:
  - id: a
    text:
      es: "del registrador ante el que se solicita la anotación preventiva."
  - id: b
    correct: true
    text:
      es: "del poseedor de las fincas a las que se refiera la notificación."
  - id: c
    text:
      es: "del titular del crédito que motiva la ejecución, en todo caso."
  - id: d
    text:
      es: "del arrendatario de las fincas a las que se refiera la anotación."
  explanation:
    es: "La letra c exige los datos del poseedor de las fincas a las que se refiere la notificación (art. 85 RGR). No se pide el arrendatario ni el registrador. El acreedor aparece en otra letra, en la que consta que la anotación se hace a su favor."
  citation: "art. 85 RGR"
  difficulty: 3
  tags:
  - "contenido"
# anchor: boe-a-2005-14803-art-90
- id: m03-l12-q0247
  prompt:
    es: "De acuerdo con el artículo 90.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el embargo de establecimientos mercantiles e industriales se inicia mediante personación:"
  options:
  - id: a
    correct: true
    text:
      es: "en los establecimientos o en el domicilio de la persona o entidad a que pertenezcan."
  - id: b
    text:
      es: "en la sede de la entidad de crédito donde la empresa tenga abiertas sus cuentas."
  - id: c
    text:
      es: "en el domicilio del administrador, sin necesidad de acudir a los establecimientos."
  - id: d
    text:
      es: "en el Registro Mercantil donde esté inscrita la sociedad titular del establecimiento."
  explanation:
    es: "El embargo comienza con la personación en los establecimientos o en el domicilio de la persona o entidad titular (art. 90.1 RGR). No empieza en el Registro Mercantil, ni en la entidad de crédito, ni en el domicilio del administrador."
  citation: "art. 90.1 RGR"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-92
- id: m03-l12-q0248
  prompt:
    es: "El embargo de los restantes bienes muebles y semovientes se lleva a efecto, según el artículo 92.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, mediante personación:"
  options:
  - id: a
    text:
      es: "en el establecimiento mercantil del obligado, si lo tuviera, y nunca en su domicilio."
  - id: b
    text:
      es: "en el Registro de Bienes Muebles donde estén inscritos los bienes del obligado."
  - id: c
    text:
      es: "en el domicilio fiscal de la entidad de crédito que financió la compra de los bienes embargados al obligado."
  - id: d
    correct: true
    text:
      es: "en el domicilio del obligado al pago o, en su caso, en el lugar donde se encuentren los bienes."
  explanation:
    es: "Se acude al domicilio del obligado o al lugar donde estén los bienes (art. 92.1 RGR). No se actúa en la entidad financiadora, y el Registro de Bienes Muebles solo recibe el mandamiento de anotación cuando los bienes son inscribibles (art. 92.3). Tampoco se excluye el domicilio."
  citation: "art. 92.1 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-83
- id: m03-l12-q0253
  prompt:
    es: "Señale la respuesta CORRECTA sobre el contenido de la diligencia de embargo de bienes inmuebles y derechos sobre estos, según el artículo 83.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación:"
  options:
  - id: a
    text:
      es: "Especifica los derechos del acreedor hipotecario sobre la finca y la fecha de inscripción de las cargas posteriores."
  - id: b
    correct: true
    text:
      es: "Especifica, entre otras circunstancias, el nombre o la razón social del titular y, en su caso, del poseedor de la finca embargada, y el importe total del débito."
  - id: c
    text:
      es: "Especifica el nombre del titular de la finca, sin mención del poseedor, y el importe de la valoración pericial."
  - id: d
    text:
      es: "Especifica el valor de mercado de la finca y la fecha prevista para su enajenación, pero no el importe total del débito."
  explanation:
    es: "La diligencia indica el titular y, en su caso, el poseedor, los derechos del obligado sobre el inmueble, el importe total del débito y la advertencia de la anotación preventiva (art. 83.1 RGR). No lleva el valor de mercado ni la fecha de enajenación, ni se omite el poseedor, ni describe los derechos del acreedor hipotecario o las cargas posteriores."
  citation: "art. 83.1 RGR"
  difficulty: 2
  tags:
  - "contenido"
# anchor: boe-a-2003-23186-art-171
- id: m03-l12-q0265
  prompt:
    es: "Cuando la Administración tributaria tiene conocimiento de la existencia de fondos, valores, títulos u otros bienes entregados o confiados a una determinada oficina de una entidad de crédito, el artículo 171.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria le permite disponer su embargo:"
  options:
  - id: a
    text:
      es: "por el doble del importe de la deuda pendiente, hasta que el obligado designe otros bienes."
  - id: b
    text:
      es: "por el importe total del saldo existente, aunque exceda de la deuda, como medida cautelar."
  - id: c
    correct: true
    text:
      es: "en la cuantía que proceda."
  - id: d
    text:
      es: "por la mitad del importe de la deuda pendiente, hasta su regularización por el obligado."
  explanation:
    es: "La Administración puede embargar los fondos y valores de la oficina en la cuantía que proceda, y el embargo puede extenderse al resto de bienes de esa entidad en el ámbito de la Administración ordenante (art. 171.1 LGT). No se embarga por el saldo total aunque exceda de la deuda, porque el embargo respeta la proporcionalidad del artículo 169.1. Tampoco por el doble ni por la mitad de la deuda, que no son la cuantía que procede."
  citation: "art. 171.1 LGT"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-81
- id: m03-l12-q0272
  prompt:
    es: "Si el crédito, efecto o derecho sin garantía embargado no ha vencido, el artículo 81.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación dispone que:"
  options:
  - id: a
    text:
      es: "queda sin efecto el embargo hasta el vencimiento, momento en que se dicta una nueva diligencia."
  - id: b
    text:
      es: "se ingresa de inmediato en el Tesoro el importe del crédito, aunque no haya vencido todavía."
  - id: c
    correct: true
    text:
      es: "queda afectado a dicha deuda hasta su vencimiento, si antes no resulta solventada."
  - id: d
    text:
      es: "se enajena el crédito mediante subasta pública por el valor actualizado del crédito."
  explanation:
    es: "Un crédito no vencido queda afectado a la deuda hasta su vencimiento, si antes no se paga (art. 81.a RGR). No se ingresa antes de vencer. El embargo no queda sin efecto ni exige una nueva diligencia, y el artículo no prevé enajenar el crédito mediante subasta."
  citation: "art. 81.a RGR"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2005-14803-art-91
- id: m03-l12-q0298
  prompt:
    es: "Conforme al artículo 91.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre el embargo de metales preciosos, piedras finas, joyería, orfebrería y antigüedades:"
  options:
  - id: a
    correct: true
    text:
      es: "Se realiza por el órgano de recaudación mediante su detalle en diligencia, con precauciones como los precintos, y se procede a su depósito conforme a los artículos 94 a 96."
  - id: b
    text:
      es: "Se realiza por el órgano de recaudación mediante su detalle en diligencia, y quedan depositados en el domicilio del obligado sin precinto alguno."
  - id: c
    text:
      es: "Se realiza por perito tasador designado por el obligado, y se depositan en una entidad de crédito elegida por este."
  - id: d
    text:
      es: "Se realiza por el Banco de España mediante su detalle en acta, y se depositan en sus cámaras acorazadas hasta la enajenación."
  explanation:
    es: "El embargo lo hace el órgano de recaudación, con detalle en diligencia y precauciones como los precintos, y los bienes se depositan según los artículos 94 a 96 (art. 91.1 RGR). No interviene el Banco de España ni un perito del obligado, y el depósito en el domicilio del obligado sin precinto contradice las precauciones exigidas."
  citation: "art. 91.1 RGR"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14803-art-78
- id: m03-l12-q0300
  prompt:
    es: "En el embargo de dinero en efectivo, la diligencia se emite con un duplicado. ¿En poder de quién queda uno de los dos ejemplares, según el artículo 78.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Del depositario designado por el órgano de recaudación."
  - id: b
    text:
      es: "De la entidad de crédito donde se ingresa el dinero."
  - id: c
    text:
      es: "Del tercero titular o poseedor del dinero embargado."
  - id: d
    correct: true
    text:
      es: "Del obligado al pago."
  explanation:
    es: "Un ejemplar se une al expediente y el otro queda en poder del obligado al pago (art. 78.1 RGR). El dinero se ingresa de inmediato en el Tesoro, por lo que no hay depositario ni entidad que conserve un ejemplar, y el tercero solo recibe la notificación si no intervino en las actuaciones."
  citation: "art. 78.1 RGR"
  difficulty: 2
  tags:
  - "documento"
# anchor: boe-a-2003-23186-art-170
- id: m03-l12-q0122
  prompt:
    es: "Cuando se embargan bienes muebles, el artículo 170.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria establece que la Administración tributaria puede disponer su depósito:"
  options:
  - id: a
    text:
      es: "en dependencias de los tribunales, a disposición del juez de ejecución."
  - id: b
    correct: true
    text:
      es: "en la forma que se determine reglamentariamente."
  - id: c
    text:
      es: "en el lugar que designe el obligado tributario en cada caso."
  - id: d
    text:
      es: "en el depósito de la entidad de crédito designada por el órgano de recaudación."
  explanation:
    es: "La ley remite al reglamento la forma del depósito de los bienes muebles (art. 170.4 LGT). No lo deja al criterio del obligado, ni lo limita a una entidad de crédito, ni lo dirige a dependencias judiciales, porque el apremio es un procedimiento administrativo."
  citation: "art. 170.4 LGT"
  difficulty: 2
  tags:
  - "depósito"
# anchor: boe-a-2005-14803-art-94
- id: m03-l12-q0123
  prompt:
    es: "Según el artículo 94.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿quién designa, en su caso, el lugar en que los bienes embargados deben ser depositados hasta su realización?"
  options:
  - id: a
    correct: true
    text:
      es: "Los órganos de recaudación."
  - id: b
    text:
      es: "El adjudicatario del bien, una vez notificada la adjudicación."
  - id: c
    text:
      es: "El obligado al pago, de acuerdo con el depositario."
  - id: d
    text:
      es: "El juez de lo contencioso-administrativo competente por razón del territorio."
  explanation:
    es: "El lugar del depósito lo designan los órganos de recaudación (art. 94.1 RGR). No lo elige el obligado, ni un juez, y el adjudicatario aparece cuando el bien ya se enajena, no mientras se deposita."
  citation: "art. 94.1 RGR"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2005-14803-art-94
- id: m03-l12-q0124
  prompt:
    es: "¿Dónde siguen depositados los bienes que, al ser embargados, están en entidades de crédito u otras que a juicio de los órganos de recaudación ofrecen garantías de seguridad y solvencia, según el artículo 94.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "En los recintos de la Administración, adonde se trasladan en el plazo de cinco días."
  - id: b
    correct: true
    text:
      es: "En esas mismas entidades, a disposición de los órganos de recaudación."
  - id: c
    text:
      es: "En los locales del obligado al pago, con precinto y bajo su responsabilidad."
  - id: d
    text:
      es: "En el recinto de una empresa dedicada habitualmente al depósito, designada por sorteo."
  explanation:
    es: "Los bienes ya depositados en entidades que ofrecen seguridad y solvencia siguen allí, a disposición de los órganos de recaudación (art. 94.2 RGR). El traslado a recintos de la Administración, el depósito en locales del obligado y la empresa elegida por sorteo no son lo que dispone el apartado."
  citation: "art. 94.2 RGR"
  difficulty: 2
  tags:
  - "depósito"
# anchor: boe-a-2005-14803-art-94
- id: m03-l12-q0125
  prompt:
    es: "¿En cuál de los siguientes casos pueden depositarse los bienes embargados en recintos o locales del propio obligado al pago, según el artículo 94.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "Cuando el obligado al pago lo solicite y la Administración no disponga de recintos adecuados para el depósito."
  - id: b
    text:
      es: "Cuando los bienes sean de valor inferior al 10 por ciento de la deuda pendiente."
  - id: c
    text:
      es: "Cuando el obligado al pago ofrezca garantías de seguridad y solvencia suficientes."
  - id: d
    correct: true
    text:
      es: "Cuando así se considere oportuno o cuando se trate de bienes de difícil transporte o movilidad."
  explanation:
    es: "El depósito en locales del obligado procede cuando el órgano lo considera oportuno o los bienes son de difícil transporte o movilidad (art. 94.3.e RGR). La solicitud del obligado no es el criterio, ni lo es un valor inferior al 10 por ciento de la deuda. Las garantías de seguridad y solvencia son el requisito de los locales de terceros distintos del obligado (letra d)."
  citation: "art. 94.3 RGR"
  difficulty: 3
  tags:
  - "depósito"
# anchor: boe-a-2005-14803-art-95
- id: m03-l12-q0127
  prompt:
    es: "¿A qué está obligado el depositario de los bienes embargados, según el artículo 95.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación?"
  options:
  - id: a
    text:
      es: "A custodiarlos y a venderlos cuando la Administración se lo ordene por escrito."
  - id: b
    correct: true
    text:
      es: "A custodiarlos y conservarlos y a devolverlos cuando sea requerido para ello, con la diligencia debida."
  - id: c
    text:
      es: "A conservarlos y a destinarlos al uso que mejor garantice su rentabilidad."
  - id: d
    text:
      es: "A custodiarlos y a entregarlos al obligado al pago si este lo solicita."
  explanation:
    es: "El depositario custodia, conserva y devuelve los bienes cuando se le requiera, con la diligencia debida (art. 95.1 RGR). No los vende ni los explota para obtener rentabilidad, y solo los devuelve a quien los requiere, no al obligado por su sola petición."
  citation: "art. 95.1 RGR"
  difficulty: 2
  tags:
  - "obligación"
# anchor: boe-a-2005-14803-art-96
- id: m03-l12-q0128
  prompt:
    es: "Según el artículo 96.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿en qué caso el depositario no tiene derecho a la retribución convenida por la prestación de sus servicios?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando el depositario es el propio obligado al pago."
  - id: b
    text:
      es: "Cuando el depositario es otro ente público."
  - id: c
    text:
      es: "Cuando el depositario es una entidad de crédito."
  - id: d
    text:
      es: "Cuando los bienes depositados son bienes muebles de escaso valor."
  explanation:
    es: "El depositario tiene derecho a la retribución convenida y al reembolso de los gastos, salvo que sea el propio obligado al pago (art. 96.1 RGR). El artículo no excluye a las entidades de crédito ni a otros entes públicos, y tampoco distingue por el valor de los bienes."
  citation: "art. 96.1 RGR"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2005-14803-art-96
- id: m03-l12-q0240
  prompt:
    es: "Conforme al artículo 96.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, además de a la retribución convenida, ¿a qué tiene derecho el depositario, salvo que lo sea el propio obligado al pago?"
  options:
  - id: a
    text:
      es: "A la exención de toda responsabilidad por la pérdida de los bienes por causas de fuerza mayor."
  - id: b
    correct: true
    text:
      es: "Al reembolso de los gastos que haya soportado por razón del depósito, cuando no estén incluidos en la retribución."
  - id: c
    text:
      es: "A una participación del 5 por ciento en el precio obtenido en la enajenación de los bienes depositados por el órgano de recaudación."
  - id: d
    text:
      es: "A conservar los bienes depositados hasta que se le abone el importe íntegro de su retribución."
  explanation:
    es: "El depositario tiene derecho a la retribución convenida y al reembolso de gastos no incluidos en ella (art. 96.1 RGR). No participa en el precio de la enajenación ni retiene los bienes hasta cobrar, y el artículo no regula una exención por fuerza mayor."
  citation: "art. 96.1 RGR"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2005-14803-art-94
- id: m03-l12-q0241
  prompt:
    es: "Los bienes embargados que no están en entidades de crédito se depositan, según el artículo 94.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, a juicio del órgano de recaudación, en uno de estos lugares:"
  options:
  - id: a
    correct: true
    text:
      es: "en recintos o locales de la propia Administración, cuando existan y reúnan condiciones adecuadas para el depósito."
  - id: b
    text:
      es: "en los locales de la entidad de crédito donde el obligado tenga su domicilio bancario, en todo caso."
  - id: c
    text:
      es: "en dependencias de los juzgados y tribunales del lugar donde se hayan embargado los bienes, a disposición del juez."
  - id: d
    text:
      es: "en el domicilio particular de un depositario judicial designado por el obligado al pago entre sus familiares."
  explanation:
    es: "Los recintos o locales de la propia Administración con condiciones adecuadas son una de las cinco opciones del artículo 94.3 RGR, junto con los de otros entes públicos, los de empresas dedicadas al depósito, los de terceros solventes y los del obligado. El domicilio de un depositario elegido por el obligado, las dependencias judiciales y los locales de una entidad de crédito en todo caso no figuran entre ellas."
  citation: "art. 94.3 RGR"
  difficulty: 2
  tags:
  - "orden"
# anchor: boe-a-2005-14803-art-94
- id: m03-l12-q0255
  prompt:
    es: "Conforme al artículo 94.3 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la afirmación INCORRECTA sobre los lugares en que pueden depositarse los bienes embargados que no están en entidades de crédito:"
  options:
  - id: a
    text:
      es: "Pueden depositarse en recintos o locales de la propia Administración cuando existan y reúnan condiciones adecuadas."
  - id: b
    text:
      es: "Pueden depositarse en recintos o locales del obligado al pago cuando se trate de bienes de difícil transporte o movilidad, con precinto de los bienes."
  - id: c
    text:
      es: "Pueden depositarse en recintos o locales de otros entes públicos, incluidos museos, bibliotecas y depósitos de vehículos."
  - id: d
    correct: true
    text:
      es: "Pueden depositarse en dependencias de los juzgados y tribunales, a disposición del juez de ejecución del lugar donde se embargaron."
  explanation:
    es: "Las dependencias judiciales no figuran entre los lugares de depósito del artículo 94.3 RGR, y por eso es la afirmación incorrecta. Las otras tres recogen las letras a, b y e del mismo artículo."
  citation: "art. 94.3 RGR"
  difficulty: 3
  tags:
  - "depósito"
  - "negativa"
# anchor: boe-a-2005-14803-art-94
- id: m03-l12-q0269
  prompt:
    es: "En defecto de los lugares anteriores, el artículo 94.3.d del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación permite depositar los bienes embargados en recintos o locales de personas o entidades:"
  options:
  - id: a
    text:
      es: "dedicadas habitualmente al depósito, aunque no ofrezcan garantías de solvencia."
  - id: b
    correct: true
    text:
      es: "distintas del obligado al pago, que ofrezcan garantías de seguridad y solvencia."
  - id: c
    text:
      es: "vinculadas al obligado al pago, que se comprometan a custodiar los bienes gratuitamente."
  - id: d
    text:
      es: "designadas por el obligado al pago, siempre que cuenten con seguro de responsabilidad civil."
  explanation:
    es: "Si no sirven los lugares anteriores, cabe un tercero distinto del obligado que ofrezca seguridad y solvencia (art. 94.3.d RGR). No se admite una persona vinculada que custodie gratis, ni la que designe el obligado por tener seguro, ni la que carezca de garantías de solvencia."
  citation: "art. 94.3 RGR"
  difficulty: 3
  tags:
  - "depósito"
