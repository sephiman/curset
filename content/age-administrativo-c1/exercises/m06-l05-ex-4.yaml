# anchor: fuente-ms-excel-formato-fecha-html
- id: m06-l05-q125
  prompt:
    es: "En un formato personalizado de Excel 365 que incluye horas, ¿qué muestra el código m escrito justo después de hh?"
  options:
  - id: a
    correct: true
    text:
      es: "Los minutos, en lugar del mes"
  - id: b
    text:
      es: "El mes como número de 1 a 12"
  - id: c
    text:
      es: "El día del mes como número de 1 a 31"
  - id: d
    text:
      es: "Los segundos de la hora indicada"
