# anchor: boe-a-2018-12699-art-15
- id: m02-l04-q104
  prompt:
    es: "¿Con qué enlace se accede a la declaración de accesibilidad desde todas las páginas de un sitio web del sector público?"
  options:
  - id: a
    text:
      es: "Con un enlace denominado «Transparencia»."
  - id: b
    text:
      es: "Con un enlace denominado «Sede electrónica»."
  - id: c
    text:
      es: "Con un enlace denominado «Declaración de conformidad»."
  - id: d
    correct: true
    text:
      es: "Con un enlace denominado «Accesibilidad»."
  explanation:
    es: "La declaración se enlaza desde todas las páginas con un enlace denominado «Accesibilidad». «Transparencia», «Declaración de conformidad» y «Sede electrónica» no son la denominación que fija el artículo."
  citation: "art. 15.1 RD 1112/2018"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2023-23537-art-22
