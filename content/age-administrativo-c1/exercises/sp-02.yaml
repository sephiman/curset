type: case
title:
  es: "La Subdelegación de Valladolid"
scenario:
  es: "La Subdelegación del Gobierno en Valladolid, órgano del Ministerio de Política Territorial y Memoria Democrática, atiende en 2027 estos asuntos. Los plazos por días no incluyen más festivos que los que la cuestión nombra, y el Jueves y el Viernes Santo (jueves, 25 y viernes, 26 de marzo de 2027) no cierran ningún plazo por meses.\n\nDoña Irene Bustamante Calleja presenta una queja por la espera en la oficina de registro. El miércoles, 3 de febrero de 2027, la unidad responsable le notifica un requerimiento para que aclare los hechos.\n\nEl martes, 2 de febrero de 2027, la empresa «Pirotecnia Duero, S.L.» presenta por el registro electrónico una solicitud de autorización de una exhibición de fuegos artificiales. La norma reguladora no fija plazo máximo y no se suspende el procedimiento. El sábado, 20 de febrero de 2027, a las 10:00 horas, la empresa presenta su escrito de alegaciones. El Subdelegado la deniega con una resolución que no pone fin a la vía administrativa, y la empresa interpone alzada.\n\nDon Ramiro Esteban Zapatero se cae el lunes, 11 de enero de 2027, en la sede y se fractura una muñeca. Recibe el alta por curación el jueves, 4 de febrero de 2027, y el miércoles, 10 de febrero de 2027, presenta en el registro una reclamación de 4.800 euros. No se suspende el procedimiento.\n\nLa Subdelegación licita por el procedimiento abierto simplificado la limpieza y desinfección de la sede, de valor estimado 48.000 euros, IVA excluido, sin criterios de juicio de valor ni prestación intelectual. Publica el anuncio en el perfil de contratante el lunes, 8 de marzo de 2027. Adjudica el contrato por 43.500 euros, IVA excluido, a «Limpiezas del Pisuerga, S.A.», y lo formaliza el lunes, 3 de mayo de 2027, con un plazo de ejecución de sesenta días naturales. El pliego solo prevé las penalidades de la ley.\n\nDoña Elena Gallego Arranz, funcionaria del Cuerpo General Administrativo, con doce años de servicio y jornada de lunes a viernes, vive en Valladolid. El miércoles, 9 de junio de 2027, fallece su suegra en Zamora, y Doña Elena disfruta el permiso desde el día siguiente. Después toma sus vacaciones seguidas. Don Julián Montero Sanz, de la Delegación de Economía y Hacienda en Valladolid, solicita el puesto de Secretario del Subdelegado, de libre designación; el lunes, 1 de marzo de 2027, se pide el informe a su Departamento, que no lo emite. Don Hugo Lozano Prieto, funcionario de la Subdelegación, es nombrado Viceconsejero de la Junta de Castilla y León. Don Ángel Rubio Alonso comete una falta leve el lunes, 8 de febrero de 2027.\n\nDon Raúl Peña Cuadrado, del Cuerpo de Gestión de la Administración Civil del Estado, con residencia oficial en Valladolid, va en comisión de servicio a Madrid, con dos noches de hotel a 58,00 euros, facturadas, y automóvil propio autorizado. Doña Pilar Sanz Abad, del Cuerpo General Administrativo, es vocal del tribunal de acceso a ese Cuerpo. Doña Carmen Ríos Tejedor devuelve lo que cobró de más en su nómina de enero de 2027.\n\nLa Subdelegación proyecta contratar el mantenimiento de la climatización para 2027 a 2029, con cargo a una aplicación del capítulo 2 de crédito inicial en 2027 de 520.000 euros y hoy, tras una transferencia, de 560.000.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2005-14836-art-16
- id: q21
  lesson: m02-l01
  prompt:
    es: "Según el artículo 16.2 del Real Decreto 951/2005, de 29 de julio, ¿en qué fecha vence el plazo de Doña Irene Bustamante Calleja para formular las aclaraciones que le requiere la unidad responsable?"
  options:
  - id: a
    text:
      es: "El sábado, 13 de febrero de 2027."
  - id: b
    text:
      es: "El martes, 16 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "El miércoles, 17 de febrero de 2027."
  - id: d
    text:
      es: "El miércoles, 3 de marzo de 2027."
  explanation:
    es: "Si hay que requerir al interesado, este dispone de 10 días hábiles para formular las aclaraciones necesarias (art. 16.2 RD 951/2005). El plazo se cuenta desde el día siguiente a la notificación (art. 30.3 LPAC): el primer día hábil es el jueves, 4 de febrero de 2027, y el décimo, el miércoles, 17 de febrero de 2027. La fecha del sábado 13 de febrero cuenta diez días naturales. La del martes 16 de febrero cuenta como primer día el de la notificación. La del miércoles 3 de marzo suma veinte días hábiles, que es el plazo de la unidad para informar de la queja (art. 16.1 RD 951/2005) y no el de las aclaraciones."
  citation: "art. 16.2 RD 951/2005"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-32
- id: q22
  lesson: m03-l03
  prompt:
    es: "Según el artículo 32.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si la audiencia de la empresa se notifica el lunes, 8 de febrero de 2027, por diez días, y se concede la ampliación máxima, ¿hasta qué fecha puede alegar?"
  options:
  - id: a
    text:
      es: "El lunes, 22 de febrero de 2027."
  - id: b
    text:
      es: "El viernes, 26 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "El lunes, 1 de marzo de 2027."
  - id: d
    text:
      es: "El lunes, 8 de marzo de 2027."
  explanation:
    es: "La Administración puede ampliar un plazo hasta la mitad de su duración (art. 32.1 LPAC). La mitad de diez días son cinco. El plazo de diez días hábiles empieza el día siguiente a la notificación (art. 30.3 LPAC) y acaba el lunes, 22 de febrero de 2027. Con cinco días hábiles más, el último día es el lunes, 1 de marzo de 2027. La fecha del lunes 22 de febrero olvida la ampliación. La del viernes 26 de febrero cuenta como primer día el de la notificación. La del lunes 8 de marzo duplica el plazo con diez días más, el doble de lo que permite el artículo."
  citation: "art. 32.1 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-31
- id: q03
  lesson: m03-l03
  prompt:
    es: "¿En qué momento se entiende presentado en el registro electrónico el escrito de alegaciones de la empresa, a efectos del cómputo de los plazos que ha de cumplir?"
  options:
  - id: a
    correct: true
    text:
      es: "En la primera hora del lunes, 22 de febrero de 2027."
  - id: b
    text:
      es: "A las 10:00 horas del sábado, 20 de febrero de 2027."
  - id: c
    text:
      es: "En la primera hora del domingo, 21 de febrero de 2027."
  - id: d
    text:
      es: "En la primera hora del martes, 23 de febrero de 2027."
  explanation:
    es: "El registro electrónico admite documentos todos los días del año, pero, en plazos por días hábiles y para los que cumplen los interesados, lo presentado en día inhábil se entiende presentado a primera hora del primer día hábil siguiente (art. 31.2.b LPAC). El 20 de febrero de 2027 es sábado; el primer día hábil siguiente es el lunes 22. La opción de las 10:00 del sábado toma la hora real de la presentación, que la ley solo conserva para ordenar los documentos entre sí. La del domingo cuenta el primer día natural, que también es inhábil. La del martes aplaza un día hábil de más."
  citation: "art. 31.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-122
- id: q04
  lesson: m03-l03
  prompt:
    es: "Según el artículo 122.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si la empresa interpone la alzada el lunes, 31 de mayo de 2027, ¿hasta qué fecha puede dictarse y notificarse su resolución?"
  options:
  - id: a
    text:
      es: "El miércoles, 30 de junio de 2027."
  - id: b
    text:
      es: "El miércoles, 1 de septiembre de 2027."
  - id: c
    correct: true
    text:
      es: "El martes, 31 de agosto de 2027."
  - id: d
    text:
      es: "El martes, 30 de noviembre de 2027."
  explanation:
    es: "El plazo máximo para dictar y notificar la resolución de la alzada es de tres meses (art. 122.2 LPAC). Se cuenta desde el día siguiente (art. 30.4 LPAC) y termina el mismo día del mes de vencimiento: el martes, 31 de agosto de 2027. El miércoles 30 de junio es el último día del mes que tiene el interesado para interponer la alzada contra un acto expreso, no el plazo para resolverla. El miércoles 1 de septiembre suma un día de más. El martes 30 de noviembre aplica seis meses, que no corresponden a este recurso."
  citation: "art. 122.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-67
- id: q27
  lesson: m03-l06
  prompt:
    es: "Según el artículo 67.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿desde qué día empieza a computarse el plazo de prescripción del derecho de Don Ramiro Esteban Zapatero a reclamar por la fractura de su muñeca?"
  options:
  - id: a
    text:
      es: "Desde el lunes, 11 de enero de 2027, el día de la caída en la sede."
  - id: b
    correct: true
    text:
      es: "Desde el jueves, 4 de febrero de 2027, el día en que recibió el alta por curación."
  - id: c
    text:
      es: "Desde el miércoles, 10 de febrero de 2027, el día en que presentó la reclamación."
  - id: d
    text:
      es: "Desde el día en que la Subdelegación le notifique la resolución de su reclamación."
  explanation:
    es: "En los daños físicos o psíquicos a las personas, el plazo de prescripción de un año empieza a computarse desde la curación o la determinación del alcance de las secuelas (art. 67.1 LPAC). La curación de Don Ramiro es el alta del jueves, 4 de febrero de 2027. El lunes, 11 de enero de 2027, es el día de la caída: de ahí cuenta la regla general, que no rige en los daños físicos. El miércoles, 10 de febrero de 2027, es el día de la reclamación, que no inicia ningún plazo de prescripción. La notificación de la resolución solo inicia el plazo cuando se reclama por la anulación de un acto o de una disposición, y aquí no hay ninguna."
  citation: "art. 67.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-91
- id: q06
  lesson: m03-l03
  prompt:
    es: "Según el artículo 91.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué fecha debe resolverse y notificarse la reclamación de Don Ramiro para que no pueda entenderse contraria a la indemnización?"
  options:
  - id: a
    correct: true
    text:
      es: "El martes, 10 de agosto de 2027."
  - id: b
    text:
      es: "El lunes, 9 de agosto de 2027."
  - id: c
    text:
      es: "El lunes, 10 de mayo de 2027."
  - id: d
    text:
      es: "El miércoles, 4 de agosto de 2027."
  explanation:
    es: "Transcurridos seis meses desde que se inició el procedimiento sin resolución notificada, la reclamación puede entenderse desestimada (art. 91.3 LPAC). El procedimiento se inicia el miércoles 10 de febrero de 2027, con la entrada en el registro. Los meses se cuentan desde el día siguiente y acaban el mismo día del mes de vencimiento (art. 30.4 LPAC): el martes, 10 de agosto de 2027. El lunes 9 de agosto cuenta el día de presentación como primero. El lunes 10 de mayo aplica tres meses, el plazo general del artículo 21.3 LPAC, que el artículo 91.3 sustituye aquí. El miércoles 4 de agosto parte del alta por curación, que cuenta para la prescripción y no para el plazo de resolver."
  citation: "art. 91.3 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-159
- id: q07
  lesson: m03-l04
  prompt:
    es: "Según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cuál es la fecha más temprana en que puede terminar el plazo de presentación de proposiciones de la licitación del servicio de limpieza?"
  options:
  - id: a
    text:
      es: "El jueves, 18 de marzo de 2027."
  - id: b
    text:
      es: "El martes, 23 de marzo de 2027."
  - id: c
    text:
      es: "El viernes, 19 de marzo de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes, 22 de marzo de 2027."
  explanation:
    es: "Un servicio de valor estimado inferior a 60.000 euros que no es una prestación intelectual puede seguir la tramitación del artículo 159.6 LCSP, con un plazo de proposiciones no inferior a diez días hábiles desde el día siguiente a la publicación del anuncio. El primero es el martes 9 de marzo y el décimo, el lunes, 22 de marzo de 2027. El jueves 18 de marzo cuenta diez días naturales. El martes 23 de marzo aplica los quince días naturales del artículo 159.3, que rigen cuando el valor estimado no permite la tramitación abreviada. El viernes 19 de marzo cuenta el día de la publicación como primero."
  citation: "art. 159.6 LCSP"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-193
- id: q08
  lesson: m03-l04
  prompt:
    es: "Señale la penalidad por demora que la Subdelegación puede imponer a la adjudicataria si el servicio termina el martes, 20 de julio de 2027, por causas que le son imputables:"
  options:
  - id: a
    text:
      es: "Una penalidad total de 568,46 euros."
  - id: b
    text:
      es: "Una penalidad total de 518,40 euros."
  - id: c
    correct: true
    text:
      es: "Una penalidad total de 469,80 euros."
  - id: d
    text:
      es: "Una penalidad total de 495,90 euros."
  explanation:
    es: "El plazo de sesenta días naturales cuenta desde el día siguiente a la formalización: acaba el viernes 2 de julio de 2027. La demora va del 3 al 20 de julio, 18 días. La penalidad diaria es de 0,60 euros por cada 1.000 euros del precio, IVA excluido (art. 193.3 LCSP): 43,5 × 0,60 = 26,10 euros al día, y 18 × 26,10 = 469,80 euros. La cifra de 568,46 euros parte del precio con IVA. La de 518,40 euros parte del valor estimado en lugar del precio del contrato. La de 495,90 euros cuenta 19 días, con el último día del plazo incluido."
  citation: "art. 193.3 LCSP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-198
- id: q26
  lesson: m03-l04
  prompt:
    es: "Según el artículo 198.4 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, si la limpieza termina dentro de su plazo de ejecución y el responsable del contrato aprueba la conformidad el lunes siguiente, ¿hasta qué fecha debe la Subdelegación pagar el precio?"
  options:
  - id: a
    text:
      es: "El martes, 3 de agosto de 2027."
  - id: b
    correct: true
    text:
      es: "El miércoles, 4 de agosto de 2027."
  - id: c
    text:
      es: "El martes, 17 de agosto de 2027."
  - id: d
    text:
      es: "El viernes, 3 de septiembre de 2027."
  explanation:
    es: "La Administración debe pagar el precio dentro de los treinta días siguientes a la aprobación de la conformidad (art. 198.4 LCSP). El plazo de ejecución, sesenta días naturales desde la formalización del lunes, 3 de mayo de 2027, acaba el viernes, 2 de julio de 2027, y la conformidad se aprueba el lunes siguiente, el 5 de julio. Los treinta días naturales empiezan el 6 de julio y acaban el miércoles, 4 de agosto de 2027, día hábil. La fecha del martes 3 de agosto cuenta como primer día el de la conformidad. La del martes 17 de agosto cuenta treinta días hábiles, sin contar el lunes 16 de agosto, festivo en Castilla y León. La del viernes 3 de septiembre aplica sesenta días."
  citation: "art. 198.4 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1996-2627-regla-78
- id: q10
  lesson: m05-l03
  prompt:
    es: "Una vez que la adjudicataria del servicio de limpieza justifica el cumplimiento de la prestación y se aprueba el expediente de reconocimiento de la obligación, el servicio gestor expide:"
  options:
  - id: a
    correct: true
    text:
      es: "Un documento OK, que incluye la propuesta de pago de la obligación reconocida."
  - id: b
    text:
      es: "Un documento D, de compromiso del gasto a favor de la empresa adjudicataria."
  - id: c
    text:
      es: "Un documento AD, de autorización y compromiso del gasto en un solo acto."
  - id: d
    text:
      es: "Un documento RC, de retención de crédito para gastar en el contrato."
  explanation:
    es: "La regla 78.1 IOC exige que el contratista justifique la prestación antes del reconocimiento y manda expedir un documento OK una vez aprobado el expediente de reconocimiento de la obligación. El documento D compromete el gasto y se expide al formalizar el contrato, que aquí ya ocurrió. El AD reúne autorización y compromiso en un acto único y no reconoce la obligación. El RC retiene crédito al iniciar el expediente de contratación."
  citation: "regla 78.1 IOC"
  difficulty: 1
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-2015-11719-art-48
- id: q24
  lesson: m04-l05
  prompt:
    es: "Conforme al artículo 48.a) del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿en qué fecha se reincorpora a su puesto Doña Elena tras el permiso por el fallecimiento de su suegra?"
  options:
  - id: a
    text:
      es: "El lunes, 14 de junio de 2027."
  - id: b
    text:
      es: "El martes, 15 de junio de 2027."
  - id: c
    text:
      es: "El miércoles, 16 de junio de 2027."
  - id: d
    correct: true
    text:
      es: "El jueves, 17 de junio de 2027."
  explanation:
    es: "Por el fallecimiento de un familiar de primer grado por afinidad, como la suegra, el permiso es de tres días hábiles si el suceso ocurre en la misma localidad y de cinco si ocurre en otra (art. 48.a TREBEP). La suegra fallece en Zamora y Doña Elena vive en Valladolid, así que son cinco días hábiles. Desde el día siguiente al fallecimiento, el jueves 10 de junio, los cinco días hábiles son el 10, el 11, el 14, el 15 y el 16 de junio, y vuelve al trabajo el jueves, 17 de junio de 2027. La fecha del martes 15 de junio aplica tres días hábiles, los de la misma localidad. La del miércoles 16 de junio cuenta como primer día el del fallecimiento. La del lunes 14 de junio cuenta cinco días naturales desde el fallecimiento."
  citation: "art. 48.a) TREBEP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-11719-art-50
- id: q12
  lesson: m04-l05
  prompt:
    es: "Según el artículo 50.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál es el último día de las vacaciones de Doña Elena si las empieza el lunes, 12 de julio de 2027?"
  options:
  - id: a
    text:
      es: "El miércoles, 11 de agosto de 2027."
  - id: b
    text:
      es: "El lunes, 2 de agosto de 2027."
  - id: c
    text:
      es: "El jueves, 5 de agosto de 2027."
  - id: d
    correct: true
    text:
      es: "El martes, 10 de agosto de 2027."
  explanation:
    es: "Con doce años de servicio, a Doña Elena le corresponden veintidós días hábiles de vacaciones por año natural, y los sábados no son hábiles (art. 50.1 TREBEP). Contados desde el lunes 12 de julio, el día 22 es el martes, 10 de agosto de 2027. El miércoles 11 de agosto cuenta veintitrés días hábiles, los de quince años de servicio. El lunes 2 de agosto cuenta veintidós días naturales. El jueves 5 de agosto cuenta los sábados como hábiles."
  citation: "art. 50.1 TREBEP"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1995-8729-art-54
- id: q13
  lesson: m04-l05
  prompt:
    es: "¿Cuál es el último día del plazo en que el Departamento de origen de Don Julián puede emitir el informe, antes de que se considere favorable, según el Real Decreto 364/1995, de 10 de marzo?"
  options:
  - id: a
    text:
      es: "El lunes, 15 de marzo de 2027."
  - id: b
    correct: true
    text:
      es: "El martes, 16 de marzo de 2027."
  - id: c
    text:
      es: "El lunes, 22 de marzo de 2027."
  - id: d
    text:
      es: "El jueves, 1 de abril de 2027."
  explanation:
    es: "Si el candidato está destinado en otro Departamento, hace falta su informe favorable, y de no emitirse en quince días naturales se considera favorable (art. 54.1 RD 364/1995). Contados desde el día siguiente, el primero es el martes 2 de marzo y el decimoquinto, el martes, 16 de marzo de 2027. El lunes 15 de marzo cuenta el día de la petición como primero. El lunes 22 de marzo cuenta quince días hábiles. El jueves 1 de abril cuenta un mes, el plazo del nombramiento del artículo 56.1, no el del informe."
  citation: "art. 54.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1995-8730-art-9
- id: q14
  lesson: m04-l04
  prompt:
    es: "Según el artículo 9.1 del Real Decreto 365/1995, de 10 de marzo, si Don Hugo cesa en su cargo el miércoles, 9 de junio de 2027, ¿hasta qué fecha puede solicitar el reingreso sin pasar a excedencia voluntaria por interés particular?"
  options:
  - id: a
    correct: true
    text:
      es: "El viernes, 9 de julio de 2027."
  - id: b
    text:
      es: "El miércoles, 23 de junio de 2027."
  - id: c
    text:
      es: "El jueves, 24 de junio de 2027."
  - id: d
    text:
      es: "El lunes, 9 de agosto de 2027."
  explanation:
    es: "Un alto cargo de una comunidad autónoma pasa a servicios especiales (art. 87.1.a TREBEP). Quien pierde esa condición debe pedir el reingreso en el plazo de un mes, y si no lo hace se le declara en excedencia voluntaria por interés particular (art. 9.1 RD 365/1995). El mes se cuenta desde el día siguiente al cese y acaba el mismo día del mes siguiente (art. 30.4 LPAC): el viernes, 9 de julio de 2027. El jueves 24 de junio cuenta quince días naturales. El miércoles 23 de junio, catorce. El lunes 9 de agosto cuenta dos meses."
  citation: "art. 9.1 RD 365/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-11719-art-97
- id: q15
  lesson: m04-l06
  prompt:
    es: "Señale la respuesta correcta sobre la falta leve de Don Ángel Rubio Alonso, conforme al artículo 97 del texto refundido de la Ley del Estatuto Básico del Empleado Público, si el Subdelegado acuerda incoarle procedimiento el miércoles, 20 de octubre de 2027:"
  options:
  - id: a
    text:
      es: "La falta no ha prescrito, porque las faltas leves prescriben al año desde que se cometen."
  - id: b
    text:
      es: "La falta no ha prescrito, porque las faltas leves prescriben a los dos años desde que se cometen."
  - id: c
    text:
      es: "La falta no ha prescrito, porque el plazo solo empieza a contar desde que se incoa el procedimiento."
  - id: d
    correct: true
    text:
      es: "La falta ha prescrito, porque las faltas leves prescriben a los seis meses desde que se cometen."
  explanation:
    es: "Las faltas leves prescriben a los seis meses y el plazo cuenta desde que se cometieron (art. 97 TREBEP). La falta es del 8 de febrero de 2027, así que el plazo acabó el 8 de agosto; el 20 de octubre ya ha prescrito. El año es el plazo de prescripción de las sanciones por faltas leves, no el de la falta. Los dos años son los de las faltas graves. La tesis de que el plazo empieza al incoar contradice el artículo 97.2, que lo hace correr desde la comisión."
  citation: "art. 97 TREBEP"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2002-10337-art-10
- id: q25
  lesson: m05-l04
  prompt:
    es: "Según el artículo 10.3 del Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, ¿qué importe total percibe Don Raúl por el alojamiento de las noches de su comisión a Madrid?"
  options:
  - id: a
    text:
      es: "Un total de 97,84 euros por alojamiento."
  - id: b
    correct: true
    text:
      es: "Un total de 116,00 euros por alojamiento."
  - id: c
    text:
      es: "Un total de 131,94 euros por alojamiento."
  - id: d
    text:
      es: "Un total de 205,12 euros por alojamiento."
  explanation:
    es: "Sin sistema de concierto o contrato, el alojamiento se paga por lo realmente gastado y justificado, sin superar el máximo del anexo II (art. 10.3 RD 462/2002). Don Raúl es del Cuerpo de Gestión, del grupo 2, con un máximo de 65,97 euros por noche. Gastó 58,00 euros por noche, por debajo del máximo, así que cobra 58,00 por 2, es decir, 116,00 euros. La cifra de 131,94 euros paga el máximo del grupo 2 en lugar del gasto real. La de 97,84 euros aplica el máximo del grupo 3, que no es el suyo. La de 205,12 euros aplica el máximo del grupo 1."
  citation: "art. 10.3 RD 462/2002"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2023-16462-art-1
- id: q17
  lesson: m05-l04
  prompt:
    es: "Conforme a la Orden HFP/793/2023, de 12 de julio, ¿qué importe le corresponde a Don Raúl por usar su automóvil propio en un recorrido total de 396 kilómetros?"
  options:
  - id: a
    correct: true
    text:
      es: "Una indemnización total de 102,96 euros."
  - id: b
    text:
      es: "Una indemnización total de 51,48 euros."
  - id: c
    text:
      es: "Una indemnización total de 41,98 euros."
  - id: d
    text:
      es: "Una indemnización total de 20,99 euros."
  explanation:
    es: "La indemnización por usar el automóvil particular en comisión es de 0,26 euros por kilómetro (art. 1 Orden HFP/793/2023): 396 × 0,26 = 102,96 euros. La cifra de 51,48 euros paga solo un trayecto. La de 41,98 euros aplica la tarifa de la motocicleta, 0,106 euros por kilómetro. La de 20,99 euros suma los dos errores."
  citation: "art. 1 Orden HFP/793/2023"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2002-10337-art-30
- id: q18
  lesson: m05-l04
  prompt:
    es: "Si las tres sesiones del tribunal son el jueves, 17, el viernes, 18 y el sábado, 19 de junio de 2027, la cantidad que percibe Doña Pilar Sanz Abad por sus asistencias es de:"
  options:
  - id: a
    text:
      es: "Un total de 119,34 euros por asistencias."
  - id: b
    correct: true
    text:
      es: "Un total de 139,23 euros por asistencias."
  - id: c
    text:
      es: "Un total de 128,52 euros por asistencias."
  - id: d
    text:
      es: "Un total de 99,45 euros por asistencias."
  explanation:
    es: "El tribunal de acceso a un Cuerpo del grupo C es de categoría segunda, y los vocales cobran 39,78 euros por asistencia (art. 30.1 y anexo IV RD 462/2002). Las asistencias de sábados o festivos se incrementan un 50 % (art. 30.2): 39,78 × 1,5 = 59,67 euros. Total: 39,78 + 39,78 + 59,67 = 139,23 euros. La cifra de 119,34 euros no aplica el incremento del sábado. La de 128,52 euros usa la categoría tercera. La de 99,45 euros cuenta solo dos sesiones."
  citation: "art. 30.2 RD 462/2002"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2003-21614-art-63
- id: q19
  lesson: m05-l02
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué modificación presupuestaria permite aplicar la devolución de Doña Carmen Ríos Tejedor y quién la autoriza?"
  options:
  - id: a
    text:
      es: "Una generación de crédito, que autoriza el Ministro de Hacienda sin informe de la Intervención Delegada."
  - id: b
    text:
      es: "Una incorporación de crédito, que autoriza el Ministro de Hacienda a propuesta del titular del ministerio."
  - id: c
    text:
      es: "Una ampliación de crédito, que autoriza el Consejo de Ministros a propuesta del Ministro de Hacienda."
  - id: d
    correct: true
    text:
      es: "Una generación de crédito, que autoriza el titular del ministerio previo informe favorable de la Intervención Delegada."
  explanation:
    es: "El reintegro de pagos indebidos hechos con cargo al presupuesto corriente genera crédito (art. 53.2.f LGP), y los titulares de los ministerios autorizan esa generación previo informe favorable de la Intervención Delegada (art. 63.1.b LGP). La opción del Ministro de Hacienda mantiene la figura y cambia el órgano. La incorporación lleva al ejercicio siguiente remanentes de crédito, no ingresos del propio año. La ampliación se limita a los créditos que la ley declara ampliables."
  citation: "art. 63.1.b) LGP"
  difficulty: 1
  tags:
  - "concepto"
  - "órgano"
# anchor: boe-a-2003-21614-art-47
- id: q20
  lesson: m05-l02
  prompt:
    es: "Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cuál es el gasto máximo que puede imputarse al ejercicio 2029 con el contrato de mantenimiento de la climatización?"
  options:
  - id: a
    text:
      es: "Un gasto máximo de 364.000 euros."
  - id: b
    text:
      es: "Un gasto máximo de 260.000 euros."
  - id: c
    correct: true
    text:
      es: "Un gasto máximo de 312.000 euros."
  - id: d
    text:
      es: "Un gasto máximo de 336.000 euros."
  explanation:
    es: "El gasto de cada ejercicio posterior no puede exceder de un porcentaje del crédito inicial: 70 % en el inmediato siguiente, 60 % en el segundo y 50 % en el tercero y el cuarto (art. 47.2 LGP). El contrato empieza en 2027, así que 2029 es el segundo: 60 % de 520.000 = 312.000 euros. La cifra de 364.000 euros aplica el 70 %, el del ejercicio 2028. La de 260.000 euros aplica el 50 %. La de 336.000 euros aplica el 60 % al crédito vigente, y la ley habla del crédito inicial."
  citation: "art. 47.2 LGP"
  difficulty: 3
  tags:
  - "cantidad"
