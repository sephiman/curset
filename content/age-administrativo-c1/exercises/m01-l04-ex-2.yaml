# anchor: boe-a-1985-12666-art-3
- id: m01-l04-q016
  prompt:
    es: "De acuerdo con el artículo 3 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, la jurisdicción:"
  options:
  - id: a
    correct: true
    text:
      es: "Es única y se ejerce por los jueces, las juezas y los Tribunales previstos en dicha ley orgánica."
  - id: b
    text:
      es: "Es única y se ejerce por los jueces y Tribunales que designe el Consejo General del Poder Judicial."
  - id: c
    text:
      es: "Se divide en tantas jurisdicciones como Comunidades Autónomas con Tribunal Superior de Justicia."
  - id: d
    text:
      es: "Es única y se ejerce exclusivamente por el Tribunal Supremo y los Tribunales Superiores de Justicia."
  explanation:
    es: "El artículo 3.1 LOPJ dice: «La jurisdicción es única y se ejerce por los jueces, las juezas y los Tribunales previstos en esta ley orgánica». Una opción deja la designación al Consejo General del Poder Judicial, cuando los Tribunales los prevé la ley. Otra niega la unidad de la jurisdicción. Otra la reduce a dos órganos y olvida, entre otros, los Tribunales de Instancia y las Audiencias."
  citation: "art. 3.1 LOPJ"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-12666-art-4
- id: m01-l04-q017
  prompt:
    es: "Según el artículo 4 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿a qué se extiende la jurisdicción?"
  options:
  - id: a
    text:
      es: "A todas las personas y materias, salvo las reservadas a la jurisdicción militar."
  - id: b
    text:
      es: "A las personas de nacionalidad española, en todo el territorio nacional."
  - id: c
    correct: true
    text:
      es: "A todas las personas, a todas las materias y a todo el territorio español."
  - id: d
    text:
      es: "A las materias que le atribuyan las leyes, en el territorio que fije el Gobierno."
  explanation:
    es: "El artículo 4 LOPJ dice: «La jurisdicción se extiende a todas las personas, a todas las materias y a todo el territorio español». Una opción excluye la jurisdicción militar, que el artículo 3.2 LOPJ integra en el Poder Judicial. Otra deja fuera a quienes no tienen nacionalidad española, cuando el artículo dice «todas las personas». Otra deja el territorio en manos del Gobierno."
  citation: "art. 4 LOPJ"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-12666-art-9
- id: m01-l04-q018
  prompt:
    es: "¿Cuál de los siguientes órdenes jurisdiccionales conoce, además de las materias que le son propias, de todas las que no estén atribuidas a otro orden, según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Los Tribunales del orden penal."
  - id: b
    correct: true
    text:
      es: "Los Tribunales del orden civil."
  - id: c
    text:
      es: "Los Tribunales del orden contencioso-administrativo."
  - id: d
    text:
      es: "Los Tribunales del orden social."
  explanation:
    es: "El artículo 9.2 LOPJ dice que los Tribunales del orden civil conocerán, «además de las materias que les son propias, de todas aquellas que no estén atribuidas a otro orden jurisdiccional»: el civil hace de orden residual. El penal conoce de las causas y juicios criminales (art. 9.3), el contencioso-administrativo de la actuación administrativa (art. 9.4) y el social de la rama social del derecho (art. 9.5)."
  citation: "art. 9.2 LOPJ"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1985-12666-art-9
- id: m01-l04-q020
  prompt:
    es: "¿Cuál de las siguientes materias corresponde al orden jurisdiccional social según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "La responsabilidad patrimonial de las Administraciones públicas."
  - id: b
    text:
      es: "Los juicios criminales por delitos contra los derechos de los trabajadores."
  - id: c
    text:
      es: "Los recursos contra disposiciones generales de rango inferior a la ley."
  - id: d
    correct: true
    text:
      es: "Las reclamaciones en materia de Seguridad Social."
  explanation:
    es: "El artículo 9.5 LOPJ atribuye al orden social las pretensiones de la rama social del derecho y «las reclamaciones en materia de Seguridad Social». La responsabilidad patrimonial de las Administraciones y las disposiciones generales de rango inferior a la ley son del orden contencioso-administrativo (art. 9.4). Los juicios criminales son del orden penal (art. 9.3), aunque el delito afecte a los trabajadores."
  citation: "art. 9.5 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-122
- id: m01-l04-q021
  prompt:
    es: "¿Qué órgano es, según la Constitución Española de 1978, el órgano de gobierno del Poder Judicial?"
  options:
  - id: a
    text:
      es: "El Pleno del Tribunal Supremo."
  - id: b
    text:
      es: "El Ministerio de la Presidencia, Justicia y Relaciones con las Cortes."
  - id: c
    text:
      es: "La Sala de Gobierno del Tribunal Supremo."
  - id: d
    correct: true
    text:
      es: "El Consejo General del Poder Judicial."
  explanation:
    es: "El artículo 122.2 CE dice: «El Consejo General del Poder Judicial es el órgano de gobierno del mismo», es decir, del poder judicial. El Pleno y la Sala de Gobierno del Tribunal Supremo son órganos del Tribunal, no del gobierno del Poder Judicial en su conjunto. El Ministerio de la Presidencia, Justicia y Relaciones con las Cortes forma parte del Gobierno."
  citation: "art. 122.2 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1985-12666-art-558
- id: m01-l04-q022
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el Consejo General del Poder Judicial es correcta según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Ejerce sus competencias solo sobre los órganos judiciales con jurisdicción en toda España."
  - id: b
    text:
      es: "Ejerce sus competencias en todo el territorio nacional y su sede la fija el Pleno cada cinco años."
  - id: c
    correct: true
    text:
      es: "Ejerce sus competencias en todo el territorio nacional y tiene su sede en la villa de Madrid."
  - id: d
    text:
      es: "Tiene su sede en la villa de Madrid y delegaciones con competencias propias en cada Comunidad Autónoma."
  explanation:
    es: "El artículo 558 LOPJ dice que el Consejo «ejerce sus competencias en todo el territorio nacional» (apartado 1) y que «tiene su sede en la villa de Madrid» (apartado 2). Una opción limita sus competencias a los órganos centrales. Otra deja la sede a una decisión del Pleno, cuando la fija la ley. Otra inventa delegaciones con competencias propias."
  citation: "art. 558 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-122
- id: m01-l04-q024
  prompt:
    es: "Según el artículo 122 de la Constitución Española de 1978, ¿cómo se reparten los veinte miembros del Consejo General del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Diez entre Jueces y Magistrados, cinco a propuesta del Congreso y cinco a propuesta del Senado."
  - id: b
    text:
      es: "Doce entre Jueces y Magistrados, seis a propuesta del Congreso y dos a propuesta del Senado."
  - id: c
    correct: true
    text:
      es: "Doce entre Jueces y Magistrados, cuatro a propuesta del Congreso y cuatro a propuesta del Senado."
  - id: d
    text:
      es: "Ocho entre Jueces y Magistrados, seis a propuesta del Congreso y seis a propuesta del Senado."
  explanation:
    es: "El artículo 122.3 CE reparte los veinte así: «doce entre Jueces y Magistrados de todas las categorías judiciales [...]; cuatro a propuesta del Congreso de los Diputados, y cuatro a propuesta del Senado». Las otras tres opciones suman veinte, pero con cifras que el artículo no da."
  citation: "art. 122.3 CE"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1978-31229-art-122
- id: m01-l04-q025
  prompt:
    es: "De acuerdo con el artículo 122 de la Constitución Española de 1978, los cuatro miembros del Consejo General del Poder Judicial propuestos por el Congreso y los cuatro propuestos por el Senado se eligen:"
  options:
  - id: a
    correct: true
    text:
      es: "Por mayoría de tres quintos de sus miembros, entre abogados y otros juristas de reconocida competencia."
  - id: b
    text:
      es: "Por mayoría absoluta de sus miembros, entre abogados y otros juristas de reconocida competencia."
  - id: c
    text:
      es: "Por mayoría de dos tercios de sus miembros, entre Jueces y Magistrados de todas las categorías."
  - id: d
    text:
      es: "Por mayoría de tres quintos de sus miembros, entre Magistrados del Tribunal Supremo en activo."
  explanation:
    es: "El artículo 122.3 CE dice que los ocho de las Cámaras se eligen «en ambos casos por mayoría de tres quintos de sus miembros, entre abogados y otros juristas». Una opción cambia la mayoría por la absoluta. Otra cambia la mayoría y confunde a los juristas con los doce del turno judicial. Otra acierta la mayoría pero los busca entre Magistrados del Tribunal Supremo."
  citation: "art. 122.3 CE"
  difficulty: 1
  tags:
  - "mayoría"
  - "requisito"
# anchor: boe-a-1985-12666-art-567
- id: m01-l04-q027
  prompt:
    es: "De acuerdo con el artículo 567 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, los veinte Vocales del Consejo General del Poder Judicial son designados:"
  options:
  - id: a
    text:
      es: "Por el Gobierno, atendiendo al principio de presencia equilibrada de mujeres y hombres."
  - id: b
    correct: true
    text:
      es: "Por las Cortes Generales, atendiendo al principio de presencia equilibrada de mujeres y hombres."
  - id: c
    text:
      es: "Doce por los Jueces y Magistrados en elección directa y ocho por las Cortes Generales."
  - id: d
    text:
      es: "Por el Pleno del Tribunal Supremo, atendiendo al principio de presencia equilibrada de mujeres y hombres."
  explanation:
    es: "El artículo 567.1 LOPJ dice que los veinte Vocales «serán designadas por las Cortes Generales [...] atendiendo al principio de presencia equilibrada de mujeres y hombres». No los designa el Gobierno ni el Pleno del Tribunal Supremo. Otra opción describe una elección directa por los jueces que la LOPJ no prevé: los doce del turno judicial también los eligen las Cámaras (art. 567.2)."
  citation: "art. 567.1 LOPJ"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1985-12666-art-567
- id: m01-l04-q028
  prompt:
    es: "Según el artículo 567 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿cuántos Vocales del Consejo General del Poder Judicial elige cada una de las Cámaras?"
  options:
  - id: a
    text:
      es: "Diez Vocales: seis juristas de reconocida competencia y cuatro del turno judicial."
  - id: b
    text:
      es: "Ocho Vocales: cuatro juristas de reconocida competencia y cuatro del turno judicial."
  - id: c
    correct: true
    text:
      es: "Diez Vocales: cuatro juristas de reconocida competencia y seis del turno judicial."
  - id: d
    text:
      es: "Doce Vocales: seis juristas de reconocida competencia y seis del turno judicial."
  explanation:
    es: "El artículo 567.2 LOPJ dice que cada Cámara elige «a diez Vocales, cuatro entre juristas de reconocida competencia [...] y seis correspondientes al turno judicial». La opción de diez Vocales con «seis juristas» invierte las cifras. Las de ocho y doce Vocales cambian el total; además, dos Cámaras eligiendo doce sumarían veinticuatro, y el Consejo tiene veinte Vocales."
  citation: "art. 567.2 LOPJ"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: boe-a-1985-12666-art-567
- id: m01-l04-q029
  prompt:
    es: "De acuerdo con el artículo 567 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, entre los diez Vocales que elige cada Cámara debe incluirse, de cada uno de los sexos:"
  options:
  - id: a
    text:
      es: "Como mínimo un treinta por ciento."
  - id: b
    correct: true
    text:
      es: "Como mínimo un cuarenta por ciento."
  - id: c
    text:
      es: "Como mínimo un veinticinco por ciento."
  - id: d
    text:
      es: "Como mínimo un cincuenta por ciento."
  explanation:
    es: "El artículo 567.2 LOPJ obliga a cada Cámara a que «entre las diez personas vocales se incluya como mínimo un cuarenta por ciento de cada uno de los sexos». El treinta y el veinticinco por ciento se quedan por debajo de ese mínimo. El cincuenta por ciento exigiría la paridad exacta, cinco y cinco, que la ley no impone."
  citation: "art. 567.2 LOPJ"
  difficulty: 3
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-1985-12666-art-574
- id: m01-l04-q030
  prompt:
    es: "¿Qué aval puede aportar, según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Juez o Magistrado que desee presentar su candidatura a Vocal del Consejo General del Poder Judicial?"
  options:
  - id: a
    text:
      es: "El de cincuenta miembros de la carrera judicial en servicio activo o el de una Asociación judicial."
  - id: b
    text:
      es: "El de veinticinco miembros de la carrera judicial en servicio activo y, además, el de una Asociación judicial."
  - id: c
    text:
      es: "El de doce miembros de la carrera judicial en servicio activo o el de dos Asociaciones judiciales."
  - id: d
    correct: true
    text:
      es: "El de veinticinco miembros de la carrera judicial en servicio activo o el de una Asociación judicial."
  explanation:
    es: "El artículo 574.1 LOPJ deja elegir «entre aportar el aval de veinticinco miembros de la carrera judicial en servicio activo o el aval de una Asociación judicial legalmente constituida». La opción de «cincuenta miembros» cambia la cifra. Otra convierte la alternativa en dos avales acumulados. Otra toma el doce del apartado 2, que es el máximo de candidatos que cada uno puede avalar, no el número de avalistas."
  citation: "art. 574.1 LOPJ"
  difficulty: 3
  tags:
  - "requisito"
  - "cantidad"
# anchor: boe-a-1985-12666-art-578
- id: m01-l04-q031
  prompt:
    es: "Según el artículo 578 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿qué proporción mínima debe respetar la designación de los doce Vocales del turno judicial?"
  options:
  - id: a
    text:
      es: "Cuatro Magistrados del Tribunal Supremo, cuatro con más de quince años de antigüedad y cuatro sin sujeción a antigüedad."
  - id: b
    text:
      es: "Dos Magistrados del Tribunal Supremo, cuatro con más de veinte años de antigüedad y seis sin sujeción a antigüedad."
  - id: c
    text:
      es: "Tres Magistrados del Tribunal Supremo, seis con más de veinticinco años de antigüedad y tres sin sujeción a antigüedad."
  - id: d
    correct: true
    text:
      es: "Tres Magistrados del Tribunal Supremo, tres con más de veinticinco años de antigüedad y seis sin sujeción a antigüedad."
  explanation:
    es: "El artículo 578.3 LOPJ fija como mínimo «tres Magistrados del Tribunal Supremo; tres Magistrados con más de veinticinco años de antigüedad en la carrera judicial y seis Jueces o Magistrados sin sujeción a antigüedad». Las opciones de quince y veinte años cambian las cifras y los años de antigüedad. La que da «seis con más de veinticinco años» mantiene las categorías pero intercambia el seis y el tres."
  citation: "art. 578.3 LOPJ"
  difficulty: 3
  tags:
  - "composición"
  - "requisito"
# anchor: boe-a-1985-12666-art-568
- id: m01-l04-q032
  prompt:
    es: "¿Cada cuánto tiempo se renueva en su totalidad el Consejo General del Poder Judicial según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Cada cinco años, contados desde la fecha de las elecciones generales."
  - id: b
    text:
      es: "Por mitades cada dos años y medio, contados desde su constitución."
  - id: c
    correct: true
    text:
      es: "Cada cinco años, contados desde la fecha de su constitución."
  - id: d
    text:
      es: "Cada cuatro años, coincidiendo con la legislatura de las Cortes Generales."
  explanation:
    es: "El artículo 568.1 LOPJ dice: «El Consejo General del Poder Judicial se renovará en su totalidad cada cinco años, contados desde la fecha de su constitución». La opción que cuenta «desde la fecha de las elecciones generales» cambia el inicio del cómputo. Otra sustituye la renovación total por una renovación por mitades. Otra cambia el plazo y lo ata a la legislatura."
  citation: "art. 568.1 LOPJ"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1985-12666-art-570
- id: m01-l04-q033
  prompt:
    es: "Señale la respuesta correcta sobre lo que ocurre, según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, si ninguna de las dos Cámaras designa a sus Vocales del Consejo General del Poder Judicial en el plazo legal:"
  options:
  - id: a
    text:
      es: "El Gobierno designa provisionalmente a los Vocales pendientes hasta que lo hagan las Cámaras."
  - id: b
    text:
      es: "El Consejo saliente cesa y sus funciones pasan provisionalmente al Pleno del Tribunal Supremo."
  - id: c
    text:
      es: "Se constituye el nuevo Consejo solo con los doce Vocales del turno judicial."
  - id: d
    correct: true
    text:
      es: "El Consejo saliente continúa en funciones hasta la toma de posesión del nuevo."
  explanation:
    es: "El artículo 570.2 LOPJ dice que, en ese caso, «el Consejo saliente continuará en funciones hasta la toma de posesión del nuevo». La ley no da ningún papel al Gobierno ni al Pleno del Tribunal Supremo. La opción de constituirlo «solo con los doce Vocales del turno judicial» no cabe porque las Cámaras eligen también a los Vocales del turno judicial (art. 567.2), así que no hay doce designados con los que constituirlo."
  citation: "art. 570.2 LOPJ"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-1985-12666-art-585
- id: m01-l04-q034
  prompt:
    es: "Quien ostenta la condición de primera autoridad judicial de la Nación y la representación del Poder Judicial y de su órgano de gobierno es:"
  options:
  - id: a
    text:
      es: "El Presidente del Tribunal Constitucional."
  - id: b
    correct: true
    text:
      es: "El Presidente del Tribunal Supremo y del Consejo General del Poder Judicial."
  - id: c
    text:
      es: "El Ministro de la Presidencia, Justicia y Relaciones con las Cortes."
  - id: d
    text:
      es: "El Fiscal General del Estado."
  explanation:
    es: "El artículo 585 LOPJ dice: «El Presidente del Tribunal Supremo y del Consejo General del Poder Judicial es la primera autoridad judicial de la Nación y ostenta la representación del Poder Judicial y del órgano de gobierno del mismo». El Tribunal Constitucional no forma parte del Poder Judicial. El Ministro es miembro del Gobierno. El Fiscal General dirige el Ministerio Fiscal (art. 124 CE)."
  citation: "art. 585 LOPJ"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1985-12666-art-586
- id: m01-l04-q035
  prompt:
    es: "De acuerdo con el artículo 586 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, resulta elegido Presidente del Tribunal Supremo y del Consejo General del Poder Judicial quien obtenga en votación nominal:"
  options:
  - id: a
    correct: true
    text:
      es: "El apoyo de la mayoría de tres quintos de los miembros del Pleno."
  - id: b
    text:
      es: "El apoyo de la mayoría absoluta de los miembros del Pleno."
  - id: c
    text:
      es: "El apoyo de la mayoría de dos tercios de los miembros del Pleno."
  - id: d
    text:
      es: "El apoyo de la mayoría simple de los Vocales presentes en la sesión."
  explanation:
    es: "El artículo 586.3 LOPJ dice que resulta elegido «quien en votación nominal obtenga el apoyo de la mayoría de tres quintos de los miembros del Pleno». La mayoría absoluta es la regla general de los acuerdos del Consejo (art. 630.1 LOPJ), no la de esta elección. Los dos tercios y la mayoría simple no aparecen en el artículo."
  citation: "art. 586.3 LOPJ"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: boe-a-1985-12666-art-586
- id: m01-l04-q036
  prompt:
    es: "De acuerdo con el artículo 586 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Presidente del Tribunal Supremo será nombrado por el Rey mediante:"
  options:
  - id: a
    text:
      es: "Real Decreto refrendado por el Ministro de la Presidencia, Justicia y Relaciones con las Cortes."
  - id: b
    correct: true
    text:
      es: "Real Decreto refrendado por el Presidente del Gobierno."
  - id: c
    text:
      es: "Real Decreto refrendado por el Presidente del Congreso de los Diputados."
  - id: d
    text:
      es: "Real Decreto refrendado por el Vocal de más edad del Consejo General del Poder Judicial."
  explanation:
    es: "El artículo 586.4 LOPJ dice: «El Presidente del Tribunal Supremo será nombrado por el Rey mediante Real Decreto refrendado por el Presidente del Gobierno». El refrendo no es del Ministro del ramo, ni del Presidente del Congreso, ni de un Vocal; el Vocal de más edad solo preside la sesión constitutiva (art. 586.2)."
  citation: "art. 586.4 LOPJ"
  difficulty: 3
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-1985-12666-art-560
- id: m01-l04-q038
  prompt:
    es: "¿Qué atribución tiene el Consejo General del Poder Judicial en el nombramiento del Fiscal General del Estado según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Proponer al Rey su nombramiento por mayoría de tres quintos del Pleno."
  - id: b
    text:
      es: "Nombrarlo a propuesta del Gobierno, oído el Consejo Fiscal."
  - id: c
    text:
      es: "Ratificar el nombramiento acordado por el Consejo de Ministros."
  - id: d
    correct: true
    text:
      es: "Ser oído por el Gobierno antes del nombramiento del Fiscal General del Estado."
  explanation:
    es: "La atribución 4.ª del artículo 560.1 LOPJ es «ser oído por el Gobierno antes del nombramiento del Fiscal General del Estado», en línea con el artículo 124.4 CE. El Consejo no propone: la propuesta es del Gobierno. No nombra: nombra el Rey. No ratifica: su papel es ser oído."
  citation: "art. 560.1 LOPJ"
  difficulty: 2
  tags:
  - "competencia"
  - "procedimiento"
# anchor: boe-a-1985-12666-art-599
- id: m01-l04-q039
  prompt:
    es: "Según el artículo 599 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿en qué plazo máximo debe el Pleno proponer a los dos Magistrados del Tribunal Constitucional que corresponden al Consejo?"
  options:
  - id: a
    text:
      es: "Un mes desde el día siguiente al vencimiento del mandato anterior."
  - id: b
    correct: true
    text:
      es: "Tres meses desde el día siguiente al vencimiento del mandato anterior."
  - id: c
    text:
      es: "Seis meses desde el día siguiente al vencimiento del mandato anterior."
  - id: d
    text:
      es: "Cuatro meses desde el día siguiente al vencimiento del mandato anterior."
  explanation:
    es: "La materia 1.ª del artículo 599.1 LOPJ fija para esa propuesta, que se hace por mayoría de tres quintos, «el plazo máximo de tres meses a contar desde el día siguiente al vencimiento del mandato anterior». Uno, seis y cuatro meses no son el plazo del artículo. Los cuatro meses aparecen en otro lugar de la ley, en el artículo 568.2, para el inicio del proceso de renovación del Consejo."
  citation: "art. 599.1 LOPJ"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1985-12666-art-561
- id: m01-l04-q040
  prompt:
    es: "De acuerdo con el artículo 561 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, el Consejo General del Poder Judicial emite sus informes sobre anteproyectos de ley en el plazo improrrogable de:"
  options:
  - id: a
    text:
      es: "Quince días, o de diez si la orden de remisión hace constar la urgencia."
  - id: b
    text:
      es: "Treinta días, o de diez si la orden de remisión hace constar la urgencia."
  - id: c
    text:
      es: "Dos meses, o de un mes si la orden de remisión hace constar la urgencia."
  - id: d
    correct: true
    text:
      es: "Treinta días, o de quince si la orden de remisión hace constar la urgencia."
  explanation:
    es: "El artículo 561.2 LOPJ dice que el Consejo «emitirá su informe en el plazo improrrogable de treinta días» y que, si la orden de remisión hace constar la urgencia, «el plazo será de quince días». Quince días, o diez con urgencia, son las cifras de la prórroga excepcional del mismo apartado, no las del plazo ordinario. Treinta días, o diez con urgencia, mezcla el plazo ordinario con la prórroga urgente. Dos meses, o un mes con urgencia, supera hasta el máximo con prórroga, que es de treinta más quince días."
  citation: "art. 561.2 LOPJ"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-1985-12666-art-601
- id: m01-l04-q041
  prompt:
    es: "¿Cuál de las siguientes es la composición de la Comisión Permanente del Consejo General del Poder Judicial según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    correct: true
    text:
      es: "El Presidente y siete Vocales: cuatro del turno judicial y tres del turno de juristas."
  - id: b
    text:
      es: "El Presidente y siete Vocales: tres del turno judicial y cuatro del turno de juristas."
  - id: c
    text:
      es: "El Presidente y cinco Vocales: tres del turno judicial y dos del turno de juristas."
  - id: d
    text:
      es: "Siete Vocales: cuatro del turno judicial y tres del turno de juristas, sin el Presidente."
  explanation:
    es: "El artículo 601.2 LOPJ la compone con el Presidente, «que la presidirá, y otros siete Vocales: cuatro de los nombrados por el turno judicial y tres de los designados por el turno de juristas de reconocida competencia». La opción de «tres del turno judicial y cuatro del turno de juristas» invierte los turnos. Otra da la composición de la Comisión de Calificación (cinco Vocales, art. 610 bis.2) y le añade el Presidente. La que deja fuera al Presidente es la Comisión Disciplinaria (art. 603.2)."
  citation: "art. 601.2 LOPJ"
  difficulty: 1
  tags:
  - "composición"
# anchor: boe-a-1985-12666-art-601
- id: m01-l04-q042
  prompt:
    es: "¿Con qué periodicidad elige el Pleno a los Vocales de la Comisión Permanente del Consejo General del Poder Judicial según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "Los elige una vez cada cinco años."
  - id: b
    text:
      es: "Los elige una vez cada dos años."
  - id: c
    correct: true
    text:
      es: "Los elige una vez al año."
  - id: d
    text:
      es: "Los elige una vez cada tres años."
  explanation:
    es: "El artículo 601.1 LOPJ dice: «El Pleno del Consejo General del Poder Judicial elegirá anualmente a los Vocales de la Comisión Permanente». Los cinco años son el mandato de la Comisión Disciplinaria (art. 603.1). Dos y tres años no aparecen en el artículo."
  citation: "art. 601.1 LOPJ"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1985-12666-art-604
- id: m01-l04-q043
  prompt:
    es: "De acuerdo con el artículo 604 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, la Comisión Disciplinaria resuelve los expedientes por infracciones graves y muy graves de Jueces y Magistrados, salvo cuando la sanción propuesta sea:"
  options:
  - id: a
    text:
      es: "La de suspensión de funciones."
  - id: b
    text:
      es: "La de traslado forzoso a otra sede."
  - id: c
    correct: true
    text:
      es: "La de separación del servicio."
  - id: d
    text:
      es: "La de multa o la de advertencia."
  explanation:
    es: "El artículo 604.1 LOPJ da a la Comisión Disciplinaria esos expedientes «con la sola excepción de aquellos supuestos en que la sanción propuesta fuere de separación del servicio». La suspensión, el traslado forzoso, la multa y la advertencia quedan dentro de su competencia, porque la única excepción es la separación."
  citation: "art. 604.1 LOPJ"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-1985-12666-art-610
- id: m01-l04-q044
  prompt:
    es: "¿Cuál de las siguientes Comisiones del Consejo General del Poder Judicial está integrada por tres Vocales, según la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial?"
  options:
  - id: a
    text:
      es: "La Comisión Disciplinaria del Consejo."
  - id: b
    text:
      es: "La Comisión de Calificación del Consejo."
  - id: c
    correct: true
    text:
      es: "La Comisión de Igualdad del Consejo."
  - id: d
    text:
      es: "La Comisión Permanente del Consejo."
  explanation:
    es: "El artículo 610.2 LOPJ dice: «La Comisión de Igualdad estará integrada por tres Vocales». La Disciplinaria tiene siete Vocales (art. 603.2) y la de Calificación cinco (art. 610 bis.2). La Permanente tiene el Presidente y siete Vocales (art. 601.2). La de Asuntos Económicos también tiene tres (art. 609.2) y no figura entre las opciones."
  citation: "art. 610.2 LOPJ"
  difficulty: 3
  tags:
  - "composición"
