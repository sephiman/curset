# anchor: boe-a-2013-12632-art-2
- id: m01-l16-q044
  prompt:
    es: "¿Qué principio exige que las personas con discapacidad puedan llevar una vida en igualdad de condiciones, accediendo a los mismos lugares, ámbitos, bienes y servicios que cualquier otra persona?"
  options:
  - id: a
    text:
      es: "Es el principio de transversalidad de las políticas"
  - id: b
    text:
      es: "Es el principio de diálogo civil"
  - id: c
    correct: true
    text:
      es: "Es el principio de normalización"
  - id: d
    text:
      es: "Es el principio de igualdad de oportunidades"
  explanation:
    es: "El artículo 2.i) del texto refundido de la Ley General de derechos de las personas con discapacidad llama normalización a ese principio. La transversalidad significa que las Administraciones no se limitan a planes específicos para las personas con discapacidad, sino que las tienen en cuenta en todas sus políticas (art. 2.o). El diálogo civil es la participación de las organizaciones representativas en las políticas oficiales (art. 2.n). La igualdad de oportunidades es la ausencia de toda discriminación por razón de discapacidad (art. 2.b)."
  citation: "art. 2.i) RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-2
- id: m01-l16-q045
  prompt:
    es: "Según el artículo 2.m) del texto refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, no realizar un ajuste razonable supone:"
  options:
  - id: a
    correct: true
    text:
      es: "Una discriminación por razón de discapacidad"
  - id: b
    text:
      es: "Un acoso por razón de discapacidad"
  - id: c
    text:
      es: "Una mera irregularidad sin efectos discriminatorios"
  - id: d
    text:
      es: "Un incumplimiento de una medida de acción positiva"
  explanation:
    es: "El artículo 2.m) dice que «la no realización de un ajuste razonable supone una discriminación por razón de discapacidad y la violación del derecho a la no discriminación». El acoso es una conducta no deseada que atenta contra la dignidad (art. 2.f), otra figura. La ley niega que sea una irregularidad sin efectos discriminatorios. El ajuste razonable no es una medida de acción positiva, que la ley define aparte (art. 2.g)."
  citation: "art. 2.m) RDL 1/2013"
  difficulty: 3
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2013-12632-art-42
- id: m01-l16-q046
  prompt:
    es: "Según el artículo 42.1 del texto refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, en las empresas de 50 o más trabajadores deben ser trabajadores con discapacidad, al menos:"
  options:
  - id: a
    correct: true
    text:
      es: "El 2 por 100 de la plantilla total"
  - id: b
    text:
      es: "El 3 por 100 de la plantilla total"
  - id: c
    text:
      es: "El 4 por 100 de la plantilla total"
  - id: d
    text:
      es: "El 5 por 100 de la plantilla total"
  explanation:
    es: "El artículo 42.1 exige que, «al menos, el 2 por 100» de los trabajadores sean trabajadores con discapacidad, calculado sobre la plantilla total. El 3, el 4 y el 5 por 100 no son la cuota que fija este artículo."
  citation: "art. 42.1 RDL 1/2013"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2013-12632-art-42
- id: m01-l16-q047
  prompt:
    es: "¿Qué empresas están obligadas, según el texto refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, a que al menos el 2 por 100 de sus trabajadores sean trabajadores con discapacidad?"
  options:
  - id: a
    text:
      es: "Solo las empresas privadas que empleen a 50 o más trabajadores"
  - id: b
    text:
      es: "Las empresas públicas y privadas que empleen a 100 o más trabajadores"
  - id: c
    text:
      es: "Solo las empresas públicas que empleen a 250 o más trabajadores"
  - id: d
    correct: true
    text:
      es: "Las empresas públicas y privadas que empleen a 50 o más trabajadores"
  explanation:
    es: "El artículo 42.1 obliga a «las empresas públicas y privadas que empleen a un número de 50 o más trabajadores». No se limita a las privadas ni a las públicas. El umbral es de 50 trabajadores, no de 100 ni de 250."
  citation: "art. 42.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2013-12632-art-42
- id: m01-l16-q048
  prompt:
    es: "Según el artículo 42.1 del texto refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, las empresas pueden quedar exentas de la cuota de reserva para trabajadores con discapacidad:"
  options:
  - id: a
    correct: true
    text:
      es: "Excepcionalmente, por negociación colectiva sectorial o por opción voluntaria comunicada a la autoridad laboral, con medidas alternativas"
  - id: b
    text:
      es: "En todo caso, cuando el empresario lo solicite a la autoridad laboral, sin necesidad de aplicar medidas alternativas"
  - id: c
    text:
      es: "De manera excepcional, solo por acuerdo en convenio colectivo de empresa, sin comunicarlo a la autoridad laboral ni aplicar medidas alternativas"
  - id: d
    text:
      es: "De manera excepcional, por resolución del servicio público de empleo, sin necesidad de aplicar medidas alternativas"
  explanation:
    es: "El artículo 42.1 permite la exención «de manera excepcional», bien por acuerdos de la negociación colectiva sectorial, bien por opción voluntaria del empresario comunicada a la autoridad laboral, «y siempre que en ambos supuestos se apliquen las medidas alternativas». No es una exención en todo caso ni puede prescindir de las medidas alternativas. El acuerdo es de negociación colectiva sectorial, no de convenio de empresa. La ley no prevé una resolución del servicio público de empleo."
  citation: "art. 42.1 RDL 1/2013"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2013-12632-art-42
- id: m01-l16-q049
  prompt:
    es: "¿Cuál de las siguientes medidas prevé el texto refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social para las personas con discapacidad en las ofertas de empleo público?"
  options:
  - id: a
    text:
      es: "Una cuota del 2 por 100 de las plazas, igual que en las empresas privadas"
  - id: b
    text:
      es: "La exención de la fase de oposición en todos los procesos selectivos"
  - id: c
    correct: true
    text:
      es: "La reserva de un cupo, en los términos de la normativa reguladora de la materia"
  - id: d
    text:
      es: "Un turno de promoción interna reservado solo a personas con discapacidad"
  explanation:
    es: "El artículo 42.2 dice que «en las ofertas de empleo público se reservará un cupo para ser cubierto por personas con discapacidad, en los términos establecidos en la normativa reguladora de la materia». El 2 por 100 es la cuota de las empresas de 50 o más trabajadores (art. 42.1), no la del empleo público. El artículo no exime de la fase de oposición. Tampoco crea un turno de promoción interna exclusivo."
  citation: "art. 42.2 RDL 1/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2006-21990-art-1
- id: m01-l16-q050
  prompt:
    es: "Según el artículo 1.1 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, la ley regula sus condiciones básicas mediante la creación de:"
  options:
  - id: a
    text:
      es: "Una nueva entidad gestora de la Seguridad Social para la dependencia"
  - id: b
    text:
      es: "Una red estatal de centros públicos de atención a la dependencia"
  - id: c
    text:
      es: "Un fondo estatal gestionado solo por la Administración General del Estado"
  - id: d
    correct: true
    text:
      es: "Un Sistema para la Autonomía y Atención a la Dependencia"
  explanation:
    es: "El artículo 1.1 habla de «la creación de un Sistema para la Autonomía y Atención a la Dependencia», con la colaboración y participación de todas las Administraciones Públicas. La ley no crea una entidad gestora de la Seguridad Social. Tampoco una red estatal de centros públicos. No es un fondo que gestione solo la Administración General del Estado: el Sistema implica a todas las Administraciones."
  citation: "art. 1.1 Ley 39/2006"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2006-21990-art-2
- id: m01-l16-q051
  prompt:
    es: "Según el artículo 2.2 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, la situación de dependencia es:"
  options:
  - id: a
    text:
      es: "El estado temporal en que las personas, por una enfermedad sobrevenida, precisan cuidados y apoyos de otras personas"
  - id: b
    text:
      es: "La capacidad de controlar, afrontar y tomar, por propia iniciativa, decisiones personales acerca de cómo vivir"
  - id: c
    text:
      es: "La situación de quien, por razón de su edad avanzada, necesita la ayuda de otras personas para las tareas domésticas de la vida diaria"
  - id: d
    correct: true
    text:
      es: "El estado permanente en que las personas, por dificultades que afectan a su autonomía, precisan cuidados y apoyos de otras personas"
  explanation:
    es: "El artículo 2.2 la define como «el estado de carácter permanente en el que las personas, debido a dificultades que afectan a su autonomía, precisan de cuidados y apoyos de otra u otras personas o ayudas importantes para realizar actividades de la vida diaria». Un estado temporal no encaja en esa definición. La capacidad de decidir cómo vivir es la autonomía (art. 2.1). La ley no liga la dependencia solo a la edad: también puede asociarse a la discapacidad o la enfermedad."
  citation: "art. 2.2 Ley 39/2006"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2006-21990-art-26
- id: m01-l16-q052
  prompt:
    es: "¿Qué grado de dependencia tiene quien necesita ayuda para varias actividades de la vida diaria dos o tres veces al día, sin requerir el apoyo permanente de una persona cuidadora?"
  options:
  - id: a
    text:
      es: "El Grado I, de dependencia moderada"
  - id: b
    correct: true
    text:
      es: "El Grado II, de dependencia severa"
  - id: c
    text:
      es: "El Grado III, de gran dependencia"
  - id: d
    text:
      es: "El Grado III+, de dependencia extrema"
  explanation:
    es: "El artículo 26.1.b) de la Ley 39/2006 define el Grado II, dependencia severa, como el de quien necesita ayuda para varias actividades de la vida diaria «dos o tres veces al día, pero no requiere el apoyo permanente de una persona cuidadora». El Grado I es la ayuda al menos una vez al día. El Grado III exige ayuda varias veces al día y el apoyo indispensable y continuo de otra persona. El Grado III+ parte de tener reconocido el Grado III (disposición adicional decimoséptima)."
  citation: "art. 26.1 Ley 39/2006"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2006-21990-art-26
- id: m01-l16-q053
  prompt:
    es: "Según el artículo 26.1 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, ¿cuándo se encuentra una persona en el Grado III, gran dependencia?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando necesita ayuda varias veces al día y, por su pérdida total de autonomía, el apoyo indispensable y continuo de otra persona"
  - id: b
    text:
      es: "Cuando necesita ayuda dos o tres veces al día, pero no requiere el apoyo permanente de una persona cuidadora"
  - id: c
    text:
      es: "Cuando necesita ayuda al menos una vez al día o tiene necesidades de apoyo intermitente o limitado"
  - id: d
    text:
      es: "Cuando, teniendo reconocido el Grado III, padece esclerosis lateral amiotrófica en la fase avanzada que determina una dependencia completa"
  explanation:
    es: "El artículo 26.1.c) define la gran dependencia como la de quien necesita ayuda «varias veces al día y, por su pérdida total de autonomía física, mental, intelectual o sensorial, necesita el apoyo indispensable y continuo de otra persona». La ayuda dos o tres veces al día sin apoyo permanente es el Grado II. La ayuda al menos una vez al día es el Grado I. La esclerosis lateral amiotrófica en fase avanzada, con Grado III reconocido, da lugar al Grado III+ de la disposición adicional decimoséptima."
  citation: "art. 26.1 Ley 39/2006"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2006-21990-art-28
- id: m01-l16-q055
  prompt:
    es: "Según el artículo 28.1 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, ¿en qué plazo máximo debe resolverse el reconocimiento de la dependencia?"
  options:
  - id: a
    text:
      es: "En un plazo máximo de un mes"
  - id: b
    text:
      es: "En un plazo máximo de dos meses"
  - id: c
    correct: true
    text:
      es: "En un plazo máximo de tres meses"
  - id: d
    text:
      es: "En un plazo máximo de cuatro meses"
  explanation:
    es: "El artículo 28.1 establece «un plazo máximo de 3 meses para su resolución». Uno, dos y cuatro meses no son el plazo que fija este artículo."
  citation: "art. 28.1 Ley 39/2006"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2006-21990-art-28
- id: m01-l16-q056
  prompt:
    es: "Según el artículo 28.1 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, el procedimiento de reconocimiento de la situación de dependencia se iniciará:"
  options:
  - id: a
    correct: true
    text:
      es: "A instancia de la persona que pueda estar afectada o de quien ostente su representación"
  - id: b
    text:
      es: "De oficio por los servicios sociales de la comunidad autónoma de residencia"
  - id: c
    text:
      es: "De oficio o a instancia de los servicios sociales del municipio de residencia"
  - id: d
    text:
      es: "A instancia de cualquier familiar, aunque no ostente su representación"
  explanation:
    es: "El artículo 28.1 dice que el procedimiento «se iniciará a instancia de la persona que pueda estar afectada por algún grado de dependencia o de quien ostente su representación». No se inicia de oficio, ni por la comunidad autónoma ni por el municipio. Un familiar solo puede instarlo si ostenta la representación."
  citation: "art. 28.1 Ley 39/2006"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2006-21990-art-28
- id: m01-l16-q057
  prompt:
    es: "¿Qué validez territorial tiene, según la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, la resolución de reconocimiento de la situación de dependencia?"
  options:
  - id: a
    text:
      es: "Solo en la comunidad autónoma que la expide"
  - id: b
    text:
      es: "En la comunidad que la expide y en las que tengan convenio con ella"
  - id: c
    text:
      es: "Solo en el municipio de residencia del solicitante"
  - id: d
    correct: true
    text:
      es: "En todo el territorio del Estado"
  explanation:
    es: "El artículo 28.2 dice que la resolución «tendrá validez en todo el territorio del Estado». No se limita a la comunidad autónoma que la expide. No depende de convenios entre comunidades. Tampoco se reduce al municipio de residencia. Si la persona cambia de residencia, la comunidad de destino fija los servicios que le corresponden (art. 28.4), pero el reconocimiento sigue valiendo."
  citation: "art. 28.2 Ley 39/2006"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2026-20528-df-vigesimoctava
- id: m01-l16-q086
  prompt:
    es: "La Ley 4/2026, de 1 de octubre, se publicó en el «Boletín Oficial del Estado» el sábado 3 de octubre de 2026 y entra en vigor a los veinte días de su publicación. ¿En qué fecha entra en vigor?"
  options:
  - id: a
    text:
      es: "El 22 de octubre de 2026."
  - id: b
    text:
      es: "El 1 de noviembre de 2026."
  - id: c
    text:
      es: "El 3 de noviembre de 2026."
  - id: d
    correct: true
    text:
      es: "El 23 de octubre de 2026."
  explanation:
    es: "Contando veinte días naturales desde el sábado 3 de octubre, el día 1 es el 4 de octubre y el día 20 es el viernes 23 de octubre de 2026, fecha de entrada en vigor. El 22 de octubre es solo el día diecinueve. El 1 de noviembre sumaría veintinueve días y el 3 de noviembre, un mes completo, que no es el plazo de la disposición final vigesimoctava."
  citation: "disposición final vigesimoctava Ley 4/2026"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2013-12632-art-4
- id: m01-l16-q087
  prompt:
    es: "¿Cuál de las siguientes opciones recoge las deficiencias que presentan las personas con discapacidad, según el artículo 4.1 del Real Decreto Legislativo 1/2013, de 29 de noviembre?"
  options:
  - id: a
    text:
      es: "Físicas, psíquicas o sociales, temporales o permanentes."
  - id: b
    text:
      es: "Físicas y mentales, siempre que sean de nacimiento."
  - id: c
    correct: true
    text:
      es: "Físicas, mentales, intelectuales o sensoriales, previsiblemente permanentes."
  - id: d
    text:
      es: "Intelectuales o sensoriales, únicamente si son totales."
  explanation:
    es: "El artículo 4.1 enumera las deficiencias físicas, mentales, intelectuales o sensoriales, previsiblemente permanentes. No habla de deficiencias sociales ni temporales, no exige que sean de nacimiento y no restringe la discapacidad intelectual o sensorial a los casos de deficiencia total."
  citation: "art. 4.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-4
- id: m01-l16-q088
  prompt:
    es: "Según el artículo 4.1 del Real Decreto Legislativo 1/2013, de 29 de noviembre, las deficiencias previsiblemente permanentes, al interactuar con diversas barreras, pueden impedir la participación plena y efectiva de la persona:"
  options:
  - id: a
    text:
      es: "En el empleo público, en igualdad de condiciones con los demás."
  - id: b
    correct: true
    text:
      es: "En la sociedad, en igualdad de condiciones con los demás."
  - id: c
    text:
      es: "En la vida política, salvo que alcance el grado de discapacidad del 33 por ciento."
  - id: d
    text:
      es: "En el sistema educativo, sin referencia a los demás."
  explanation:
    es: "La definición habla de la participación plena y efectiva en la sociedad, en igualdad de condiciones con los demás, sin acotarla a un ámbito como el empleo público, la vida política o el sistema educativo. El 33 por ciento es otro criterio, el del artículo 4.2, y no condiciona la participación política."
  citation: "art. 4.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-4
- id: m01-l16-q089
  prompt:
    es: "Señale qué carácter han de tener previsiblemente las deficiencias de las personas con discapacidad, según el artículo 4.1 del Real Decreto Legislativo 1/2013, de 29 de noviembre:"
  options:
  - id: a
    correct: true
    text:
      es: "Permanente."
  - id: b
    text:
      es: "Temporal."
  - id: c
    text:
      es: "Progresivo."
  - id: d
    text:
      es: "Congénito."
  explanation:
    es: "La definición exige deficiencias previsiblemente permanentes. No basta una situación temporal, y la ley no pide que sean progresivas ni que se tengan desde el nacimiento."
  citation: "art. 4.1 RDL 1/2013"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-4
- id: m01-l16-q090
  prompt:
    es: "¿Cuál de los siguientes porcentajes de discapacidad reconocida es el mínimo para tener la consideración de persona con discapacidad, además de lo establecido en el apartado anterior, según el artículo 4.2 del Real Decreto Legislativo 1/2013, de 29 de noviembre?"
  options:
  - id: a
    correct: true
    text:
      es: "33 por ciento."
  - id: b
    text:
      es: "25 por ciento."
  - id: c
    text:
      es: "50 por ciento."
  - id: d
    text:
      es: "75 por ciento."
  explanation:
    es: "El umbral que fija el artículo 4.2 es el 33 por ciento de discapacidad reconocida. El 25 por ciento queda por debajo y el 50 y el 75 por ciento no son el límite de la ley, aunque quien los tenga reconocidos supere el umbral."
  citation: "art. 4.2 RDL 1/2013"
  difficulty: 1
  tags:
  - "cifra"
# anchor: boe-a-2013-12632-art-4
- id: m01-l16-q091
  prompt:
    es: "A una persona se le ha reconocido un grado de discapacidad del 34 por ciento. Conforme al Real Decreto Legislativo 1/2013, de 29 de noviembre, ¿tiene la consideración de persona con discapacidad a efectos de la ley?"
  options:
  - id: a
    text:
      es: "No, porque el grado reconocido ha de ser igual o superior al 50 por ciento."
  - id: b
    text:
      es: "No, porque solo tienen esa consideración quienes presenten una discapacidad intelectual."
  - id: c
    text:
      es: "No, porque necesita además que sus deficiencias sean de nacimiento."
  - id: d
    correct: true
    text:
      es: "Sí, porque el grado reconocido es igual o superior al 33 por ciento."
  explanation:
    es: "Con un 34 por ciento supera el umbral del 33 por ciento del artículo 4.2 y se le aplica la ley. El umbral no es del 50 por ciento, la ley no limita el concepto a la discapacidad intelectual y no exige que las deficiencias sean de nacimiento."
  citation: "art. 4.2 RDL 1/2013"
  difficulty: 2
  tags:
  - "caso"
  - "cifra"
# anchor: boe-a-2013-12632-art-2
- id: m01-l16-q092
  prompt:
    es: "Según el artículo 2.j) del Real Decreto Legislativo 1/2013, de 29 de noviembre, la inclusión, como proceso o estado irrenunciable, es incompatible con:"
  options:
  - id: a
    text:
      es: "Cualquier medida de acción positiva en favor de un colectivo."
  - id: b
    text:
      es: "Cualquier valoración positiva de la diversidad humana."
  - id: c
    correct: true
    text:
      es: "Cualquier forma de segregación, discriminación o exclusión."
  - id: d
    text:
      es: "Cualquier ajuste razonable de los entornos."
  explanation:
    es: "La inclusión es incompatible con cualquier forma de segregación, discriminación o exclusión. La definición parte, además, de la valoración positiva de la diversidad humana, y los ajustes razonables y las acciones positivas son instrumentos de igualdad, no obstáculos a la inclusión."
  citation: "art. 2.j) RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-2
- id: m01-l16-q093
  prompt:
    es: "Conforme al artículo 2.j) del Real Decreto Legislativo 1/2013, de 29 de noviembre, la inclusión asegura, desde la valoración positiva de la diversidad humana, la presencia, participación y progreso plenos de:"
  options:
  - id: a
    text:
      es: "Las personas con discapacidad en el ámbito laboral."
  - id: b
    correct: true
    text:
      es: "Todas las personas en las diferentes esferas de la vida."
  - id: c
    text:
      es: "Las personas con un grado de discapacidad igual o superior al 33 por ciento."
  - id: d
    text:
      es: "Las personas beneficiarias del Sistema para la Autonomía y Atención a la Dependencia."
  explanation:
    es: "La definición de inclusión se refiere a todas las personas en las diferentes esferas de la vida, no solo a quienes tienen discapacidad ni solo al ámbito laboral. Tampoco se limita a quienes alcanzan el 33 por ciento de grado ni a los beneficiarios del sistema de dependencia."
  citation: "art. 2.j) RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-95
- id: m01-l16-q094
  prompt:
    es: "Conforme al Real Decreto Legislativo 1/2013, de 29 de noviembre, en el ámbito de competencias de la Administración General del Estado las infracciones en materia de discapacidad se clasifican en:"
  options:
  - id: a
    text:
      es: "Leves y graves."
  - id: b
    correct: true
    text:
      es: "Leves, graves y muy graves."
  - id: c
    text:
      es: "Leves, moderadas y graves."
  - id: d
    text:
      es: "Graves, muy graves y calificadas."
  explanation:
    es: "El artículo 95.1 distingue tres categorías: leves, graves y muy graves. No hay una clasificación en solo dos grados ni existen las infracciones moderadas ni las calificadas."
  citation: "art. 95.1 RDL 1/2013"
  difficulty: 1
  tags:
  - "lista"
# anchor: boe-a-2013-12632-art-95
- id: m01-l16-q095
  prompt:
    es: "¿Cuál de las siguientes conductas es una infracción grave, según el artículo 95.3 del Real Decreto Legislativo 1/2013, de 29 de noviembre?"
  options:
  - id: a
    correct: true
    text:
      es: "Los actos discriminatorios u omisiones que supongan un trato menos favorable a la persona con discapacidad en relación con otra en situación comparable."
  - id: b
    text:
      es: "Las vejaciones que padezcan las personas en sus derechos fundamentales por razón de su discapacidad."
  - id: c
    text:
      es: "Conculcar deliberadamente la dignidad de las personas con discapacidad con condiciones o cargas humillantes."
  - id: d
    text:
      es: "Generar deliberadamente situaciones de riesgo o grave daño para la integridad física o psíquica de esas personas."
  explanation:
    es: "El trato menos favorable respecto de otra persona en situación análoga o comparable es infracción grave según el artículo 95.3.a). Las vejaciones en derechos fundamentales, conculcar deliberadamente la dignidad con cargas humillantes y generar deliberadamente situaciones de riesgo o grave daño están tipificadas como muy graves en el artículo 95.4."
  citation: "art. 95.3 RDL 1/2013"
  difficulty: 3
  tags:
  - "lista"
# anchor: boe-a-2013-12632-art-95
- id: m01-l16-q096
  prompt:
    es: "Señale la conducta que constituye infracción grave, según el artículo 95.3 del Real Decreto Legislativo 1/2013, de 29 de noviembre:"
  options:
  - id: a
    text:
      es: "Las conductas graves cometidas por odio o desprecio racial o étnico, de género o de orientación sexual."
  - id: b
    text:
      es: "Generar deliberadamente situaciones de riesgo o grave daño para la integridad física o psíquica de esas personas."
  - id: c
    text:
      es: "Las acciones que deliberadamente generen un grave perjuicio económico o profesional."
  - id: d
    correct: true
    text:
      es: "La imposición abusiva de cualquier forma de renuncia total o parcial a los derechos de las personas por su discapacidad, basada en una posición de ventaja."
  explanation:
    es: "La imposición abusiva de renuncias a derechos, basada en una posición de ventaja, es infracción grave del artículo 95.3.b). Las conductas graves cometidas por odio o desprecio, generar deliberadamente situaciones de riesgo o grave daño y las acciones que causan deliberadamente un grave perjuicio económico o profesional son infracciones muy graves del artículo 95.4."
  citation: "art. 95.3 RDL 1/2013"
  difficulty: 3
  tags:
  - "lista"
# anchor: boe-a-2013-12632-art-95
- id: m01-l16-q097
  prompt:
    es: "¿Cuál de las siguientes conductas es infracción grave según el artículo 95.3 del Real Decreto Legislativo 1/2013, de 29 de noviembre?"
  options:
  - id: a
    text:
      es: "Las vejaciones que padezcan las personas en sus derechos fundamentales por razón de su discapacidad."
  - id: b
    text:
      es: "Las acciones que deliberadamente generen un grave perjuicio económico o profesional."
  - id: c
    correct: true
    text:
      es: "La coacción, amenaza o represalia contra quien haya entablado o pretenda entablar una acción legal o reclamación para exigir la igualdad de oportunidades."
  - id: d
    text:
      es: "Conculcar deliberadamente la dignidad de las personas con discapacidad imponiendo condiciones o cargas humillantes para el acceso a los bienes, productos y servicios a disposición del público."
  explanation:
    es: "La coacción, amenaza o represalia contra quien reclama la igualdad de oportunidades es infracción grave según el artículo 95.3.h). Las vejaciones, el grave perjuicio económico o profesional deliberado y las situaciones de riesgo o grave daño deliberadas son muy graves en el artículo 95.4."
  citation: "art. 95.3.h) RDL 1/2013"
  difficulty: 3
  tags:
  - "lista"
