- id: m11-l01-q01
  prompt:
    en: The program flattens three lists, applies `filter`, `takeWhile` and `dropWhile` with `n < 3` to 1, 2, 5,
      1, 6, and reduces 1 to 4 from identity 10. What does it print, one line per statement?
  options:
  - id: a
    correct: true
    text:
      en: '[1, 2, 3]

        [1, 2, 1]

        [1, 2]

        [5, 1, 6]

        20'
  - id: b
    text:
      en: '[1, 2, 3]

        [1, 2, 1]

        [1, 2, 1]

        [5, 6]

        20'
  - id: c
    text:
      en: '[[1, 2], [], [3]]

        [1, 2, 1]

        [1, 2]

        [5, 1, 6]

        20'
  - id: d
    text:
      en: '[1, 2, 3]

        [1, 2, 1]

        [1, 2]

        [5, 1, 6]

        10'
  explanation:
    en: 'The program prints `[1, 2, 3]`, `[1, 2, 1]`, `[1, 2]`, `[5, 1, 6]` and `20`: `takeWhile` stops at the first
      failing element, `dropWhile` keeps everything after it, and the identity 10 is the start value. The lines
      `[1, 2, 3]` `[1, 2, 1]` `[1, 2, 1]` `[5, 6]` `20` are wrong because `takeWhile` and `dropWhile` stop testing
      at the first element that fails, so the later `1` stays in the `dropWhile` result. The lines `[[1, 2], [],
      [3]]` `[1, 2, 1]` `[1, 2]` `[5, 1, 6]` `20` are wrong because `flatMap` flattens the mapped streams into one
      stream. The lines `[1, 2, 3]` `[1, 2, 1]` `[1, 2]` `[5, 1, 6]` `10` are wrong because the identity is added
      as the starting value of the reduction.'
  citation: javadoc-stream#takeWhile(java.util.function.Predicate); javadoc-stream#dropWhile(java.util.function.Predicate);
    javadoc-stream#flatMap(java.util.function.Function); javadoc-stream#reduce(java.lang.Object,java.util.function.BinaryOperator)
  snippet: m11-l01/PrefixSteps.java
- id: m11-l01-q02
  prompt:
    en: 'The program sorts `Zed` and `amy` (city `Lyon`), `Cid` (null city) and `Dee` (`Oslo`) twice: with `nullsFirst`
      and a case-insensitive name tie-break, then with `nullsLast` and natural name order. What does it print?'
  options:
  - id: a
    text:
      en: '[amy, Zed, Dee, Cid]

        [Zed, amy, Dee, Cid]'
  - id: b
    correct: true
    text:
      en: '[Cid, amy, Zed, Dee]

        [Zed, amy, Dee, Cid]'
  - id: c
    text:
      en: '[Cid, Zed, amy, Dee]

        [Zed, amy, Dee, Cid]'
  - id: d
    text:
      en: '[Cid, amy, Zed, Dee]

        [Cid, Zed, amy, Dee]'
  explanation:
    en: 'The program prints `[Cid, amy, Zed, Dee]` and `[Zed, amy, Dee, Cid]`: `nullsFirst` puts the null city first
      and the case-insensitive tie-break puts `amy` before `Zed`, while `nullsLast` puts `Cid` last and natural
      order puts `Zed` before `amy`. The lines [amy, Zed, Dee, Cid] [Zed, amy, Dee, Cid] are wrong because `nullsFirst`
      considers null to be less than non-null. The lines [Cid, Zed, amy, Dee] [Zed, amy, Dee, Cid] are wrong because
      `thenComparing` with a case-insensitive comparator orders `amy` before `Zed`. The lines [Cid, amy, Zed, Dee]
      [Cid, Zed, amy, Dee] are wrong because `nullsLast` is not `nullsFirst` and puts the null city after every
      non-null city.'
  citation: javadoc-comparator#nullsFirst(java.util.Comparator); javadoc-comparator#thenComparing(java.util.Comparator)
