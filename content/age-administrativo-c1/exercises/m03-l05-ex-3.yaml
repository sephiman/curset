# anchor: boe-a-2015-10565-art-112
- id: m03-l05-q039
  prompt:
    es: "De acuerdo con el artículo 112.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las leyes podrán sustituir el recurso de alzada, en supuestos o ámbitos sectoriales determinados, por:"
  options:
  - id: a
    correct: true
    text:
      es: "Otros procedimientos de impugnación, reclamación, conciliación, mediación y arbitraje."
  - id: b
    text:
      es: "El recurso extraordinario de revisión ante el mismo órgano administrativo que dictó el acto."
  - id: c
    text:
      es: "El recurso contencioso-administrativo directo, sin necesidad de agotar antes la vía administrativa."
  - id: d
    text:
      es: "El recurso potestativo de reposición ante el superior jerárquico del órgano que dictó el acto."
  explanation:
    es: "El artículo 112.2 permite sustituir la alzada «por otros procedimientos de impugnación, reclamación, conciliación, mediación y arbitraje». El recurso extraordinario de revisión, el recurso contencioso-administrativo y el recurso de reposición son otras figuras, no los procedimientos sustitutivos del artículo. Además, la reposición se interpone ante el mismo órgano que dictó el acto, no ante el superior."
  citation: "art. 112.2 LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-112
- id: m03-l05-q040
  prompt:
    es: "Según el artículo 112.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿ante quién se tramitan los procedimientos que sustituyen al recurso de alzada?"
  options:
  - id: a
    text:
      es: "Ante el superior jerárquico del órgano administrativo que dictó el acto que se impugna."
  - id: b
    text:
      es: "Ante el mismo órgano que dictó el acto, asistido por una comisión consultiva de expertos."
  - id: c
    correct: true
    text:
      es: "Ante órganos colegiados o Comisiones específicas no sometidas a instrucciones jerárquicas."
  - id: d
    text:
      es: "Ante órganos unipersonales independientes que nombra el Consejo de Ministros."
  explanation:
    es: "El artículo 112.2 los sitúa «ante órganos colegiados o Comisiones específicas no sometidas a instrucciones jerárquicas». El superior jerárquico es quien resuelve la alzada que se sustituye. El órgano autor del acto resuelve la reposición. Y el artículo habla de órganos colegiados, no unipersonales."
  citation: "art. 112.2 LPAC"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2015-10565-art-112
- id: m03-l05-q041
  prompt:
    es: "¿Puede una ley sustituir el recurso de reposición por procedimientos de conciliación, mediación o arbitraje, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Sí, y en tal caso el procedimiento sustitutivo pasará a ser obligatorio para el interesado."
  - id: b
    text:
      es: "No, la ley solo prevé esa sustitución para el recurso de alzada, no para la reposición."
  - id: c
    text:
      es: "No, la ley solo prevé esa sustitución para el recurso extraordinario de revisión."
  - id: d
    correct: true
    text:
      es: "Sí, en las mismas condiciones que el de alzada y respetando su carácter potestativo."
  explanation:
    es: "El artículo 112.2, en su segundo párrafo, dice que, «en las mismas condiciones, el recurso de reposición podrá ser sustituido por los procedimientos a que se refiere el párrafo anterior, respetando su carácter potestativo para el interesado». La sustitución es posible, y no vuelve obligatorio el procedimiento sustitutivo: «carácter potestativo». La sustitución no se limita a la alzada, porque el segundo párrafo extiende el mismo régimen a la reposición. Tampoco se refiere al recurso extraordinario de revisión: el apartado 2 habla de alzada y de reposición."
  citation: "art. 112.2 LPAC"
  difficulty: 3
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-2015-10565-art-112
- id: m03-l05-q042
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los procedimientos que sustituyen al recurso de alzada es correcta, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Pueden reducir los plazos que esa Ley reconoce a los interesados en todo procedimiento."
  - id: b
    text:
      es: "Pueden establecerse por orden ministerial en cualquier ámbito sectorial que el ministerio determine."
  - id: c
    correct: true
    text:
      es: "Deben respetar los principios, garantías y plazos que esa Ley reconoce a los interesados."
  - id: d
    text:
      es: "Pueden establecerse con carácter general para todos los ámbitos, aunque la materia no lo justifique."
  explanation:
    es: "El artículo 112.2 exige «respeto a los principios, garantías y plazos que la presente Ley reconoce a las personas y a los interesados en todo procedimiento administrativo». Por eso no pueden reducir esos plazos. Los establecen las leyes, no una orden ministerial. Y solo en supuestos o ámbitos sectoriales determinados y cuando la especificidad de la materia lo justifique."
  citation: "art. 112.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-23646-art-2
- id: m03-l05-q043
  prompt:
    es: "Según el artículo 2.1 de la Ley 60/2003, de 23 de diciembre, de Arbitraje, ¿qué condición deben reunir las materias sobre las que versa una controversia para que sea susceptible de arbitraje?"
  options:
  - id: a
    text:
      es: "Ser materias de contenido exclusivamente mercantil."
  - id: b
    text:
      es: "Ser materias en las que no intervenga una Administración."
  - id: c
    correct: true
    text:
      es: "Ser materias de libre disposición conforme a derecho."
  - id: d
    text:
      es: "Ser materias de cuantía inferior a la fijada por reglamento."
  explanation:
    es: "El artículo 2.1 dice que «son susceptibles de arbitraje las controversias sobre materias de libre disposición conforme a derecho». El criterio es que la materia sea disponible. No exige que sea mercantil, que no intervenga una Administración ni que la cuantía quede por debajo de un límite."
  citation: "art. 2.1 Ley 60/2003"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2003-23646-art-2
- id: m03-l05-q044
  prompt:
    es: "Dos empresas discrepan sobre el precio pactado en un contrato privado de suministro. ¿Pueden someter la controversia a arbitraje conforme a la Ley 60/2003, de 23 de diciembre, de Arbitraje?"
  options:
  - id: a
    text:
      es: "No, porque el arbitraje solo cabe en controversias entre Administraciones Públicas."
  - id: b
    text:
      es: "No, porque las controversias contractuales están reservadas a los tribunales."
  - id: c
    correct: true
    text:
      es: "Sí, porque versa sobre una materia de libre disposición conforme a derecho."
  - id: d
    text:
      es: "Sí, pero solo si un juez autoriza antes el sometimiento a arbitraje."
  explanation:
    es: "El precio pactado entre dos empresas es una materia de la que las partes pueden disponer, y el artículo 2.1 dice que «son susceptibles de arbitraje las controversias sobre materias de libre disposición conforme a derecho». La ley no limita el arbitraje a las Administraciones, no reserva a los tribunales las controversias contractuales y no exige autorización judicial previa."
  citation: "art. 2.1 Ley 60/2003"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1985-5392-art-85
- id: m03-l05-q045
  prompt:
    es: "Según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, son servicios públicos locales:"
  options:
  - id: a
    text:
      es: "Los que la ley reserva a las entidades locales en régimen de monopolio."
  - id: b
    correct: true
    text:
      es: "Los que prestan las entidades locales en el ámbito de sus competencias."
  - id: c
    text:
      es: "Los que el Pleno de cada entidad local declara como tales por ordenanza."
  - id: d
    text:
      es: "Los que presta cualquier Administración Pública dentro del término municipal."
  explanation:
    es: "El artículo 85.1 dice que «son servicios públicos locales los que prestan las entidades locales en el ámbito de sus competencias». La reserva del artículo 86.2 es un caso más estrecho, no la definición. El artículo no exige una declaración del Pleno por ordenanza. Y lo que presta otra Administración en el término municipal no es un servicio público local."
  citation: "art. 85.1 LBRL"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-86
- id: m03-l05-q046
  prompt:
    es: "¿Cuál de las siguientes actividades o servicios esenciales reserva la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local en favor de las Entidades Locales?"
  options:
  - id: a
    text:
      es: "El alumbrado público de las vías urbanas."
  - id: b
    text:
      es: "La limpieza viaria de las vías públicas."
  - id: c
    correct: true
    text:
      es: "El transporte público de viajeros."
  - id: d
    text:
      es: "La pavimentación de las vías públicas urbanas."
  explanation:
    es: "El artículo 86.2 reserva a las Entidades Locales el abastecimiento domiciliario y depuración de aguas, la recogida, tratamiento y aprovechamiento de residuos y el «transporte público de viajeros». El alumbrado público, la limpieza viaria y la pavimentación son servicios municipales, pero no figuran en la reserva del artículo 86.2."
  citation: "art. 86.2 LBRL"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1985-5392-art-86
- id: m03-l05-q047
  prompt:
    es: "De acuerdo con el artículo 86.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, se declara la reserva en favor de las Entidades Locales de las siguientes actividades o servicios esenciales:"
  options:
  - id: a
    text:
      es: "Abastecimiento domiciliario y depuración de aguas; recogida, tratamiento y aprovechamiento de residuos, y alumbrado público de las vías."
  - id: b
    text:
      es: "Abastecimiento domiciliario y depuración de aguas; limpieza viaria y pavimentación de vías, y transporte público de viajeros."
  - id: c
    correct: true
    text:
      es: "Abastecimiento domiciliario y depuración de aguas; recogida, tratamiento y aprovechamiento de residuos, y transporte público de viajeros."
  - id: d
    text:
      es: "Recogida, tratamiento y aprovechamiento de residuos; alumbrado público y limpieza viaria, y transporte público de viajeros."
  explanation:
    es: "El artículo 86.2 enumera «abastecimiento domiciliario y depuración de aguas; recogida, tratamiento y aprovechamiento de residuos, y transporte público de viajeros». Cada una de las otras listas cambia uno de los tres servicios por el alumbrado público, la limpieza viaria o la pavimentación, que no están en la reserva."
  citation: "art. 86.2 LBRL"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2003-20977-art-2
- id: m03-l05-q050
  prompt:
    es: "¿Qué obligaciones debe cumplir el beneficiario de una entrega sujeta a la ejecución de un proyecto o a la realización de una actividad, según el concepto de subvención de la Ley 38/2003, de 17 de noviembre, General de Subvenciones?"
  options:
  - id: a
    text:
      es: "Solo las obligaciones materiales, sin obligaciones formales."
  - id: b
    text:
      es: "Solo las obligaciones formales de justificar el gasto realizado."
  - id: c
    correct: true
    text:
      es: "Las obligaciones materiales y formales que se hubieran establecido."
  - id: d
    text:
      es: "Las obligaciones de contraprestación directa a favor de la Administración que concede."
  explanation:
    es: "El artículo 2.1.b) termina «debiendo el beneficiario cumplir las obligaciones materiales y formales que se hubieran establecido». Son las dos clases, no solo una. Y la contraprestación directa es lo que el artículo 2.1.a) excluye: la entrega se hace sin ella."
  citation: "art. 2.1 LGS"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-20977-art-2
- id: m03-l05-q051
  prompt:
    es: "De acuerdo con el artículo 2.1.c) de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, el proyecto, la acción, conducta o situación financiada con una subvención debe tener por objeto:"
  options:
  - id: a
    text:
      es: "El fomento de una actividad económica de interés exclusivamente particular para el propio beneficiario de la entrega."
  - id: b
    correct: true
    text:
      es: "El fomento de una actividad de utilidad pública o interés social o la promoción de una finalidad pública."
  - id: c
    text:
      es: "La compensación de un servicio que el beneficiario ha prestado antes a la Administración."
  - id: d
    text:
      es: "La financiación global de la actividad de la Administración a la que se destina la entrega."
  explanation:
    es: "El artículo 2.1.c) exige que tenga «por objeto el fomento de una actividad de utilidad pública o interés social o de promoción de una finalidad pública». Un interés exclusivamente particular no cumple ese fin. Compensar un servicio prestado es una contraprestación, que el artículo 2.1.a) excluye. La financiación global de otra Administración queda fuera de la ley por el artículo 2.2."
  citation: "art. 2.1 LGS"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-20977-art-2
- id: m03-l05-q052
  prompt:
    es: "¿Qué carácter tienen los beneficios fiscales y los beneficios en la cotización a la Seguridad Social, según la Ley 38/2003, de 17 de noviembre, General de Subvenciones?"
  options:
  - id: a
    text:
      es: "Son subvenciones de concesión directa."
  - id: b
    text:
      es: "Son subvenciones en concurrencia competitiva."
  - id: c
    text:
      es: "Son subvenciones si las otorga el Estado."
  - id: d
    correct: true
    text:
      es: "No tienen carácter de subvenciones."
  explanation:
    es: "El artículo 2.4.g) dice que «no tienen carácter de subvenciones» los beneficios fiscales y beneficios en la cotización a la Seguridad Social. No son subvenciones de ninguna clase, ni de concesión directa ni en concurrencia competitiva. Y la exclusión no depende de qué Administración los otorgue."
  citation: "art. 2.4.g) LGS"
  difficulty: 1
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2003-20977-art-2
- id: m03-l05-q053
  prompt:
    es: "¿Qué otros beneficios, junto a los fiscales, no tienen carácter de subvenciones según la Ley 38/2003, de 17 de noviembre, General de Subvenciones?"
  options:
  - id: a
    text:
      es: "Los beneficios en las tarifas de los servicios públicos locales."
  - id: b
    correct: true
    text:
      es: "Los beneficios en la cotización a la Seguridad Social."
  - id: c
    text:
      es: "Los beneficios en el precio de los contratos del sector público."
  - id: d
    text:
      es: "Los beneficios en las cuotas de los colegios profesionales."
  explanation:
    es: "El artículo 2.4.g) recoge «los beneficios fiscales y beneficios en la cotización a la Seguridad Social». Las tarifas de los servicios públicos locales, el precio de los contratos del sector público y las cuotas de los colegios profesionales no aparecen en esa letra."
  citation: "art. 2.4.g) LGS"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2003-20977-art-8
- id: m03-l05-q054
  prompt:
    es: "De acuerdo con el artículo 8.3 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, la gestión de las subvenciones se realizará con eficacia, con eficiencia y de acuerdo con los principios de:"
  options:
  - id: a
    text:
      es: "Publicidad, transparencia, jerarquía, objetividad, igualdad y no discriminación."
  - id: b
    text:
      es: "Publicidad, confidencialidad, concurrencia, objetividad, igualdad y no discriminación."
  - id: c
    correct: true
    text:
      es: "Publicidad, transparencia, concurrencia, objetividad, igualdad y no discriminación."
  - id: d
    text:
      es: "Publicidad, transparencia, concurrencia, discrecionalidad, igualdad y no discriminación."
  explanation:
    es: "El artículo 8.3.a) enumera «publicidad, transparencia, concurrencia, objetividad, igualdad y no discriminación». Cada una de las otras listas cambia una palabra: jerarquía por concurrencia, confidencialidad por transparencia o discrecionalidad por objetividad. Ninguna de las tres sustitutas está en el artículo."
  citation: "art. 8.3 LGS"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2003-20977-art-8
- id: m03-l05-q055
  prompt:
    es: "¿A qué se refiere el principio de eficacia en la gestión de las subvenciones, según la Ley 38/2003, de 17 de noviembre, General de Subvenciones?"
  options:
  - id: a
    correct: true
    text:
      es: "Al cumplimiento de los objetivos fijados por la Administración otorgante."
  - id: b
    text:
      es: "A la asignación y utilización de los recursos públicos."
  - id: c
    text:
      es: "Al cumplimiento de los objetivos que fije el beneficiario en su solicitud."
  - id: d
    text:
      es: "A la reducción de los plazos de los procedimientos de concesión."
  explanation:
    es: "El artículo 8.3.b) habla de «eficacia en el cumplimiento de los objetivos fijados por la Administración otorgante». La asignación y utilización de los recursos públicos es el ámbito de la eficiencia, en el artículo 8.3.c). Los objetivos son los que fija la Administración, no el beneficiario. Y el artículo no liga la eficacia a los plazos de resolución."
  citation: "art. 8.3 LGS"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-85
- id: m03-l05-q056
  prompt:
    es: "De acuerdo con el artículo 85.2 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, los servicios públicos de competencia local habrán de gestionarse:"
  options:
  - id: a
    text:
      es: "De la forma que decida libremente el Pleno de la Entidad Local, sin necesidad de compararla con otras."
  - id: b
    text:
      es: "Preferentemente de forma indirecta, mediante el contrato de concesión de servicios."
  - id: c
    correct: true
    text:
      es: "De la forma más sostenible y eficiente de entre las enumeradas en el propio artículo."
  - id: d
    text:
      es: "Únicamente de forma directa, por la propia Entidad Local o un organismo autónomo."
  explanation:
    es: "El artículo 85.2 dice que «habrán de gestionarse de la forma más sostenible y eficiente de entre las enumeradas a continuación». El criterio no es la libre decisión del Pleno. El artículo no da preferencia a la gestión indirecta ni la excluye: enumera formas directas e indirectas."
  citation: "art. 85.2 LBRL"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-85
- id: m03-l05-q057
  prompt:
    es: "¿Cuál de las siguientes es una forma de gestión directa de los servicios públicos locales según la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local?"
  options:
  - id: a
    text:
      es: "La concesión de servicios a un particular."
  - id: b
    text:
      es: "La sociedad mercantil de capital privado."
  - id: c
    text:
      es: "La fundación privada sin ánimo de lucro."
  - id: d
    correct: true
    text:
      es: "La entidad pública empresarial local."
  explanation:
    es: "El artículo 85.2.A) LBRL enumera como gestión directa la propia Entidad Local, el organismo autónomo local, la «entidad pública empresarial local» y la sociedad mercantil local, «cuyo capital social sea de titularidad pública». La concesión a un particular es gestión indirecta: la letra B) la remite a las formas del contrato de gestión de servicios públicos. La sociedad mercantil de capital privado no es la letra d), que exige capital de titularidad pública. La fundación privada sin ánimo de lucro no es ninguna de las cuatro formas de la letra A)."
  citation: "art. 85.2 LBRL"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1985-5392-art-85
- id: m03-l05-q058
  prompt:
    es: "Según el artículo 85.2.A) de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, es forma de gestión directa de los servicios públicos locales la sociedad mercantil local:"
  options:
  - id: a
    correct: true
    text:
      es: "Cuyo capital social sea de titularidad pública."
  - id: b
    text:
      es: "Cuyo capital social sea mayoritariamente público."
  - id: c
    text:
      es: "Cuyo capital social sea público al menos en un 25 %."
  - id: d
    text:
      es: "Sea cual sea la titularidad de su capital social."
  explanation:
    es: "El artículo 85.2.A).d) menciona la «sociedad mercantil local, cuyo capital social sea de titularidad pública». La opción del capital mayoritariamente público y la del 25 % público admiten capital privado. La que prescinde de la titularidad del capital contradice el texto."
  citation: "art. 85.2 LBRL"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-1985-5392-art-85
- id: m03-l05-q059
  prompt:
    es: "Según el artículo 85.2.B) de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿mediante qué se realiza la gestión indirecta de los servicios públicos de competencia local?"
  options:
  - id: a
    correct: true
    text:
      es: "Mediante las formas previstas para el contrato de gestión de servicios públicos en el texto refundido de 2011."
  - id: b
    text:
      es: "Mediante un organismo autónomo local o una entidad pública empresarial local adscrita a la propia Entidad Local."
  - id: c
    text:
      es: "Mediante la gestión por la propia Entidad Local a través de sus servicios administrativos ordinarios y de su personal."
  - id: d
    text:
      es: "Mediante una sociedad mercantil local cuyo capital social sea íntegramente de titularidad pública."
  explanation:
    es: "El artículo 85.2.B) remite a «las distintas formas previstas para el contrato de gestión de servicios públicos en el texto refundido de la Ley de Contratos del Sector Público, aprobado por Real Decreto Legislativo 3/2011». La Ley 9/2017 derogó ese texto refundido, pero el artículo conserva esa redacción. El organismo autónomo, la entidad pública empresarial, la propia Entidad Local y la sociedad mercantil de capital público son formas de gestión directa del apartado A)."
  citation: "art. 85.2 LBRL"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-284
- id: m03-l05-q061
  prompt:
    es: "De acuerdo con el artículo 284.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en ningún caso podrán prestarse mediante concesión de servicios:"
  options:
  - id: a
    text:
      es: "Los que tengan la consideración de servicios esenciales para la comunidad en el ámbito local."
  - id: b
    correct: true
    text:
      es: "Los que impliquen ejercicio de la autoridad inherente a los poderes públicos."
  - id: c
    text:
      es: "Los que sean susceptibles de explotación económica por particulares."
  - id: d
    text:
      es: "Los que la ley reserve a las Entidades Locales como servicios esenciales."
  explanation:
    es: "El artículo 284.1 dice que «en ningún caso podrán prestarse mediante concesión de servicios los que impliquen ejercicio de la autoridad inherente a los poderes públicos». Ser susceptible de explotación económica por particulares es justo la condición para poder concederlo. El artículo no excluye los servicios esenciales ni los reservados a las Entidades Locales."
  citation: "art. 284.1 LCSP"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2017-12902-art-284
- id: m03-l05-q062
  prompt:
    es: "Según el artículo 284.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué servicios podrá gestionar indirectamente la Administración mediante contrato de concesión de servicios?"
  options:
  - id: a
    text:
      es: "Los de su titularidad o competencia, aunque no sean susceptibles de explotación económica por particulares."
  - id: b
    text:
      es: "Solo los servicios de titularidad local que la ley reserva a las Entidades Locales."
  - id: c
    text:
      es: "Cualesquiera servicios de su titularidad, incluidos los que impliquen ejercicio de la autoridad pública."
  - id: d
    correct: true
    text:
      es: "Los de su titularidad o competencia que sean susceptibles de explotación económica por particulares."
  explanation:
    es: "El artículo 284.1 permite gestionar mediante concesión «los servicios de su titularidad o competencia siempre que sean susceptibles de explotación económica por particulares». Sin esa posibilidad de explotación no cabe la concesión. El artículo no la limita a los servicios locales reservados. Y excluye en todo caso los que implican ejercicio de autoridad."
  citation: "art. 284.1 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-89
- id: m03-l05-q063
  prompt:
    es: "Conforme al artículo 89.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el archivo de las actuaciones en un procedimiento sancionador por prescripción de la infracción, sin propuesta de resolución, lo resuelve:"
  options:
  - id: a
    text:
      es: "el órgano que acordó iniciar el procedimiento."
  - id: b
    correct: true
    text:
      es: "el órgano instructor del procedimiento sancionador."
  - id: c
    text:
      es: "el órgano competente para imponer la sanción."
  - id: d
    text:
      es: "el superior jerárquico del órgano instructor del procedimiento."
  explanation:
    es: "El artículo 89.1 dice que «el órgano instructor resolverá la finalización del procedimiento, con archivo de las actuaciones, sin que sea necesaria la formulación de la propuesta de resolución» cuando ha prescrito la infracción, entre otras circunstancias. El artículo da el acto al instructor. No lo da al órgano que acordó la iniciación, ni al competente para sancionar, que resuelve tras la propuesta, ni al superior del instructor."
  citation: "art. 89.1 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-89
- id: m03-l05-q064
  prompt:
    es: "¿En cuál de los siguientes casos resuelve el órgano instructor, según el artículo 89.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el archivo de las actuaciones sin propuesta de resolución?"
  options:
  - id: a
    text:
      es: "Cuando los hechos probados constituyan, de modo manifiesto, una infracción administrativa."
  - id: b
    text:
      es: "Cuando el presunto responsable haya sido sancionado antes por otra infracción de la misma naturaleza."
  - id: c
    text:
      es: "Cuando el presunto responsable no haya presentado alegaciones."
  - id: d
    correct: true
    text:
      es: "Cuando no se haya podido identificar a la persona responsable de la infracción."
  explanation:
    es: "El artículo 89.1.d) lista el caso en que «no exista o no se haya podido identificar a la persona o personas responsables». La opción de los hechos probados invierte el apartado c), que pide que no constituyan infracción de modo manifiesto. Una sanción anterior por infracción de la misma naturaleza no está entre las circunstancias; solo cuenta para graduar la sanción. Tampoco lo está no presentar alegaciones."
  citation: "art. 89.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2015-10565-art-25
- id: m03-l05-q065
  prompt:
    es: "De acuerdo con el artículo 25.1.b) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la resolución que declare la caducidad de un procedimiento sancionador iniciado de oficio ordenará:"
  options:
  - id: a
    text:
      es: "la retroacción de las actuaciones al trámite de audiencia."
  - id: b
    text:
      es: "la sustitución de la sanción por un apercibimiento."
  - id: c
    correct: true
    text:
      es: "el archivo de las actuaciones, con los efectos previstos en el artículo 95."
  - id: d
    text:
      es: "la continuación del procedimiento hasta su resolución expresa."
  explanation:
    es: "El artículo 25.1.b) dice que «la resolución que declare la caducidad ordenará el archivo de las actuaciones, con los efectos previstos en el artículo 95». No ordena retroceder al trámite de audiencia ni sustituir la sanción por un apercibimiento, y tampoco sigue el procedimiento: la caducidad lo termina."
  citation: "art. 25.1.b) LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-25
- id: m03-l05-q067
  prompt:
    es: "Según el artículo 25.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en cuál de estos procedimientos iniciados de oficio produce caducidad el vencimiento del plazo máximo sin resolución expresa?"
  options:
  - id: a
    text:
      es: "El que puede dar lugar al reconocimiento o a la constitución de derechos u otras situaciones jurídicas favorables."
  - id: b
    correct: true
    text:
      es: "El que ejerce potestades sancionadoras o de intervención con efectos desfavorables o de gravamen."
  - id: c
    text:
      es: "Cualquiera de ellos, sin que importe el efecto favorable o desfavorable que pueda producir para el interesado."
  - id: d
    text:
      es: "Solo el sancionador, sin que alcance a los demás de intervención con efectos de gravamen."
  explanation:
    es: "El artículo 25.1.b) fija la caducidad para los procedimientos en que la Administración ejerce potestades sancionadoras o, «en general, de intervención, susceptibles de producir efectos desfavorables o de gravamen». En los que pueden reconocer o constituir derechos u otras situaciones favorables, el artículo 25.1.a) da otro efecto: los interesados que hubieren comparecido pueden entender desestimadas sus pretensiones por silencio. El artículo distingue según el efecto del procedimiento, así que no vale cualquiera de ellos. Tampoco se limita al sancionador, porque la letra b) añade los de intervención en general."
  citation: "art. 25.1.b) LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
