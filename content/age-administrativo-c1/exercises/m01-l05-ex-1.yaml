# anchor: boe-a-1978-31229-art-97
- id: m01-l05-q001
  prompt:
    es: "De acuerdo con el artículo 97 de la Constitución Española de 1978, el Gobierno dirige la política interior y exterior, la Administración civil y militar y:"
  options:
  - id: a
    correct: true
    text:
      es: "La defensa del Estado, y ejerce la función ejecutiva y la potestad reglamentaria de acuerdo con la Constitución y las leyes."
  - id: b
    text:
      es: "La defensa del Estado, y ejerce la función ejecutiva y la potestad legislativa de acuerdo con la Constitución y las leyes."
  - id: c
    text:
      es: "La defensa del Estado, y ejerce la función ejecutiva y la potestad reglamentaria de acuerdo con las directrices de las Cortes Generales."
  - id: d
    text:
      es: "La seguridad ciudadana, y ejerce la función ejecutiva y la potestad reglamentaria de acuerdo con la Constitución y las leyes."
  explanation:
    es: "El artículo 97 dice que el Gobierno dirige «la defensa del Estado» y ejerce «la función ejecutiva y la potestad reglamentaria de acuerdo con la Constitución y las leyes». La potestad legislativa es de las Cortes Generales (art. 66.2 CE), no del Gobierno. La potestad reglamentaria se ejerce de acuerdo con la Constitución y las leyes, no con directrices de las Cortes. La seguridad ciudadana es la misión de las Fuerzas y Cuerpos de seguridad (art. 104.1 CE); el artículo 97 habla de la defensa del Estado."
  citation: "art. 97 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-98
- id: m01-l05-q002
  prompt:
    es: "De acuerdo con el artículo 98.1 de la Constitución Española de 1978, el Gobierno se compone del Presidente, de los Vicepresidentes, en su caso, de los Ministros y de:"
  options:
  - id: a
    text:
      es: "Los Secretarios de Estado que designe el Presidente del Gobierno."
  - id: b
    text:
      es: "Los Subsecretarios de cada uno de los Departamentos Ministeriales."
  - id: c
    correct: true
    text:
      es: "Los demás miembros que establezca la ley."
  - id: d
    text:
      es: "Los Delegados del Gobierno en las Comunidades Autónomas."
  explanation:
    es: "El artículo 98.1 cierra la lista con «los demás miembros que establezca la ley». Los Secretarios de Estado son órganos superiores de la Administración General del Estado (art. 7.1 Ley 50/1997), no miembros del Gobierno. Tampoco lo son los Subsecretarios ni los Delegados del Gobierno, que son órganos de la Administración."
  citation: "art. 98.1 CE"
  difficulty: 1
  tags:
  - "composición"
# anchor: boe-a-1997-25336-art-1
- id: m01-l05-q003
  prompt:
    es: "¿Cuál de las siguientes afirmaciones recoge la composición del Gobierno tal como la establece la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    correct: true
    text:
      es: "Se compone del Presidente, del Vicepresidente o Vicepresidentes, en su caso, y de los Ministros."
  - id: b
    text:
      es: "Se compone del Presidente, del Vicepresidente o Vicepresidentes, en su caso, de los Ministros y de los Secretarios de Estado."
  - id: c
    text:
      es: "Se compone del Presidente, de los Ministros y de los Subsecretarios de los Departamentos Ministeriales."
  - id: d
    text:
      es: "Se compone del Presidente, del Vicepresidente o Vicepresidentes, en su caso, de los Ministros y del Abogado General del Estado."
  explanation:
    es: "El artículo 1.2 de la Ley 50/1997 dice que el Gobierno «se compone del Presidente, del Vicepresidente o Vicepresidentes, en su caso, y de los Ministros». La ley no añade otros miembros. Los Secretarios de Estado son órganos superiores de la Administración General del Estado (art. 7.1). Los Subsecretarios y el Abogado General del Estado forman parte o asisten a la Comisión General de Secretarios de Estado y Subsecretarios (art. 8.1), pero no son miembros del Gobierno."
  citation: "art. 1.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1978-31229-art-103
- id: m01-l05-q004
  prompt:
    es: "De acuerdo con el artículo 103.1 de la Constitución Española de 1978, la Administración Pública sirve con objetividad los intereses generales y actúa de acuerdo con los principios de:"
  options:
  - id: a
    text:
      es: "Eficacia, eficiencia, jerarquía, descentralización y coordinación."
  - id: b
    correct: true
    text:
      es: "Eficacia, jerarquía, descentralización, desconcentración y coordinación."
  - id: c
    text:
      es: "Eficacia, jerarquía, descentralización, desconcentración y cooperación."
  - id: d
    text:
      es: "Eficiencia, jerarquía, descentralización, desconcentración y coordinación."
  explanation:
    es: "El artículo 103.1 enumera cinco principios: «eficacia, jerarquía, descentralización, desconcentración y coordinación». La lista no incluye la eficiencia, así que fallan las dos opciones que la nombran. La opción que cambia coordinación por cooperación altera el último principio."
  citation: "art. 103.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-107
- id: m01-l05-q005
  prompt:
    es: "Según la Constitución Española de 1978, ¿qué órgano es el supremo órgano consultivo del Gobierno?"
  options:
  - id: a
    text:
      es: "El Consejo Económico y Social, cuya composición regula una ley ordinaria."
  - id: b
    text:
      es: "La Comisión General de Secretarios de Estado y Subsecretarios, que preside un Vicepresidente."
  - id: c
    text:
      es: "El Secretariado del Gobierno, como órgano de apoyo del Consejo de Ministros."
  - id: d
    correct: true
    text:
      es: "El Consejo de Estado, cuya composición y competencia regula una ley orgánica."
  explanation:
    es: "El artículo 107 dice: «El Consejo de Estado es el supremo órgano consultivo del Gobierno. Una ley orgánica regulará su composición y competencia». El Consejo Económico y Social es un órgano consultivo en materia socioeconómica, no el supremo órgano consultivo del Gobierno. La Comisión General de Secretarios de Estado y Subsecretarios es un órgano de colaboración del Gobierno y el Secretariado del Gobierno es un órgano de apoyo (arts. 8 y 9 Ley 50/1997); ninguno es consultivo."
  citation: "art. 107 CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-art-98
- id: m01-l05-q006
  prompt:
    es: "De acuerdo con el artículo 98.2 de la Constitución Española de 1978, el Presidente dirige la acción del Gobierno y coordina las funciones de los demás miembros del mismo:"
  options:
  - id: a
    text:
      es: "Que responden solo ante él de su gestión, y no ante el Congreso de los Diputados."
  - id: b
    text:
      es: "Que ejercen sus competencias por delegación del Presidente del Gobierno."
  - id: c
    text:
      es: "Sin perjuicio de la responsabilidad solidaria de éstos ante el Senado."
  - id: d
    correct: true
    text:
      es: "Sin perjuicio de la competencia y responsabilidad directa de éstos en su gestión."
  explanation:
    es: "El artículo 98.2 termina con «sin perjuicio de la competencia y responsabilidad directa de éstos en su gestión». Los miembros del Gobierno no responden solo ante el Presidente: el Gobierno responde solidariamente ante el Congreso (art. 108 CE). No ejercen sus competencias por delegación del Presidente, sino como competencia propia. La responsabilidad solidaria es ante el Congreso, no ante el Senado."
  citation: "art. 98.2 CE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-2
- id: m01-l05-q007
  prompt:
    es: "¿Cuál de las siguientes funciones corresponde, en todo caso, al Presidente del Gobierno según la Ley 50/1997, de 27 de noviembre, del Gobierno?"
  options:
  - id: a
    text:
      es: "Aprobar los Reales Decretos-leyes y los Reales Decretos Legislativos."
  - id: b
    text:
      es: "Crear, modificar y suprimir los órganos directivos de los Departamentos Ministeriales."
  - id: c
    correct: true
    text:
      es: "Interponer el recurso de inconstitucionalidad."
  - id: d
    text:
      es: "Aprobar el Proyecto de Ley de Presupuestos Generales del Estado."
  explanation:
    es: "El artículo 2.2.i) atribuye al Presidente «interponer el recurso de inconstitucionalidad». Las otras tres son funciones del Consejo de Ministros: aprobar los Reales Decretos-leyes y los Reales Decretos Legislativos (art. 5.1.c), crear, modificar y suprimir los órganos directivos de los Departamentos (art. 5.1.i) y aprobar el Proyecto de Ley de Presupuestos (art. 5.1.b)."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-2
- id: m01-l05-q008
  prompt:
    es: "De acuerdo con el artículo 2.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, corresponde al Presidente del Gobierno crear, modificar y suprimir, por Real Decreto:"
  options:
  - id: a
    text:
      es: "Los órganos directivos de los Departamentos Ministeriales."
  - id: b
    text:
      es: "Los Departamentos Ministeriales y las Subsecretarías de cada uno de ellos."
  - id: c
    correct: true
    text:
      es: "Los Departamentos Ministeriales, así como las Secretarías de Estado."
  - id: d
    text:
      es: "Las Comisiones Delegadas del Gobierno y sus respectivas Secretarías."
  explanation:
    es: "El artículo 2.2.j) atribuye al Presidente crear, modificar y suprimir, por Real Decreto, «los Departamentos Ministeriales, así como las Secretarías de Estado». Los órganos directivos de los Departamentos los crea el Consejo de Ministros (art. 5.1.i). Las Subsecretarías no figuran en esta letra. Las Comisiones Delegadas las crea el Consejo de Ministros mediante Real Decreto, a propuesta del Presidente (art. 6.1)."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-2
- id: m01-l05-q009
  prompt:
    es: "Según el artículo 2.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿con qué requisito propone el Presidente del Gobierno al Rey la convocatoria de un referéndum consultivo?"
  options:
  - id: a
    text:
      es: "Previa deliberación del Consejo de Ministros."
  - id: b
    text:
      es: "Previa autorización de las Cortes Generales."
  - id: c
    text:
      es: "Previo dictamen favorable del Consejo de Estado."
  - id: d
    correct: true
    text:
      es: "Previa autorización del Congreso de los Diputados."
  explanation:
    es: "El artículo 2.2.e) dice que el Presidente propone la convocatoria «previa autorización del Congreso de los Diputados». La deliberación del Consejo de Ministros es el requisito de la disolución y de la cuestión de confianza (letras c y d), no del referéndum. La autorización es del Congreso, no de las Cortes Generales. El dictamen del Consejo de Estado no aparece en esta letra."
  citation: "art. 2.2 Ley 50/1997"
  difficulty: 3
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-13
- id: m01-l05-q010
  prompt:
    es: "De acuerdo con el artículo 13.1 de la Ley 50/1997, de 27 de noviembre, del Gobierno, en los casos de vacante, ausencia o enfermedad, las funciones del Presidente del Gobierno serán asumidas:"
  options:
  - id: a
    correct: true
    text:
      es: "Por los Vicepresidentes, de acuerdo con su orden de prelación, y, en defecto de ellos, por los Ministros, según el orden de precedencia de los Departamentos."
  - id: b
    text:
      es: "Por el Vicepresidente primero y, en su defecto, por el Ministro de la Presidencia, sin atender al orden de los Departamentos."
  - id: c
    text:
      es: "Por los Vicepresidentes, de acuerdo con su orden de prelación, y, en defecto de ellos, por el Ministro de mayor edad."
  - id: d
    text:
      es: "Por el Ministro que designe el Presidente mediante Real Decreto y, en su defecto, por el Ministro de la Presidencia."
  explanation:
    es: "El artículo 13.1 dice que las funciones del Presidente las asumen «los Vicepresidentes, de acuerdo con el correspondiente orden de prelación, y, en defecto de ellos, por los Ministros, según el orden de precedencia de los Departamentos». La ley no da la suplencia al Ministro de la Presidencia ni al Ministro de mayor edad. La designación por Real Decreto del Presidente es la regla de la suplencia de los Ministros (art. 13.2), no del Presidente."
  citation: "art. 13.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1997-25336-art-3
- id: m01-l05-q011
  prompt:
    es: "¿Qué condición ostenta, además, el Vicepresidente del Gobierno que asume la titularidad de un Departamento Ministerial?"
  options:
  - id: a
    correct: true
    text:
      es: "Ostenta, además, la condición de Ministro."
  - id: b
    text:
      es: "Ostenta, además, la condición de Secretario de Estado."
  - id: c
    text:
      es: "Ostenta, además, la condición de Ministro sin cartera."
  - id: d
    text:
      es: "Ostenta, además, la condición de Subsecretario del Departamento."
  explanation:
    es: "El artículo 3.2 dice que el Vicepresidente que asuma la titularidad de un Departamento «ostentará, además, la condición de Ministro». Un Secretario de Estado o un Subsecretario no son miembros del Gobierno. El Ministro sin cartera es el que no es titular de un Departamento (art. 4.2)."
  citation: "art. 3.2 Ley 50/1997"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1997-25336-art-13
- id: m01-l05-q012
  prompt:
    es: "De acuerdo con el artículo 13.2 de la Ley 50/1997, de 27 de noviembre, del Gobierno, la suplencia de los Ministros, para el despacho ordinario de los asuntos de su competencia:"
  options:
  - id: a
    correct: true
    text:
      es: "Será determinada por Real Decreto del Presidente del Gobierno y recaerá, en todo caso, en otro miembro del Gobierno."
  - id: b
    text:
      es: "Será determinada por Real Decreto del Presidente del Gobierno y podrá recaer en un Secretario de Estado del mismo Departamento."
  - id: c
    text:
      es: "Será determinada por acuerdo del Consejo de Ministros y recaerá, en todo caso, en otro miembro del Gobierno."
  - id: d
    text:
      es: "Corresponderá al Subsecretario del Departamento, salvo que el Presidente del Gobierno designe a otro Ministro."
  explanation:
    es: "El artículo 13.2 dice que la suplencia «será determinada por Real Decreto del Presidente del Gobierno, debiendo recaer, en todo caso, en otro miembro del Gobierno». Un Secretario de Estado o un Subsecretario no son miembros del Gobierno, así que no pueden suplir a un Ministro. La suplencia no la acuerda el Consejo de Ministros, sino el Presidente por Real Decreto."
  citation: "art. 13.2 Ley 50/1997"
  difficulty: 3
  tags:
  - "órgano"
  - "procedimiento"
