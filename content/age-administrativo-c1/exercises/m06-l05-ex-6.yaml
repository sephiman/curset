# anchor: fuente-ms-excel-funcion-o-html
- id: m06-l05-q156
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe lo que devuelve la función O con sus argumentos?"
  options:
  - id: a
    correct: true
    text:
      es: "Devuelve VERDADERO si alguno de sus argumentos se evalúa como VERDADERO"
  - id: b
    text:
      es: "Devuelve VERDADERO solo si todos sus argumentos se evalúan como VERDADERO"
  - id: c
    text:
      es: "Invierte el valor lógico de su argumento"
  - id: d
    text:
      es: "Devuelve FALSO si alguno de sus argumentos se evalúa como VERDADERO"
  explanation:
    es: "O devuelve VERDADERO si alguno de sus argumentos es VERDADERO y FALSO si todos son FALSO. Pedir que todos sean verdaderos es Y, invertir el valor es NO y devolver FALSO con un argumento verdadero contradice la definición."
  citation: "fuente: `ms-excel-funcion-o.html`; «Detalles técnicos»"
  difficulty: 1
  tags:
  - "función"
  - "concepto"
# anchor: fuente-ms-excel-funcion-o-html
- id: m06-l05-q157
  prompt:
    es: "En Excel 365, B14 vale 120000 (ventas), B4 100000 (objetivo de ventas), C14 8 (cuentas), B5 10 (objetivo de cuentas) y B6 5 %. ¿Qué muestra =SI(O(B14>=B4;C14>=B5);B14*B6;0)?"
  options:
  - id: a
    text:
      es: "0"
  - id: b
    text:
      es: "120000"
  - id: c
    correct: true
    text:
      es: "6000"
  - id: d
    text:
      es: "VERDADERO"
  explanation:
    es: "B14>=B4 se cumple, así que O es VERDADERO y SI multiplica las ventas totales por el porcentaje de comisión: 120000 × 5 % = 6000. 0 solo aparece si no se cumple ninguna condición; 120000 omite la comisión y VERDADERO es el resultado de O."
  citation: "fuente: `ms-excel-funcion-o.html`; «Cálculo de la comisión de ventas»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-no-html
- id: m06-l05-q158
  prompt:
    es: "En Excel 365, B14 vale 80000, B7 100000, C14 12, B5 10 y B8 5 %. ¿Qué muestra =SI(Y(NO(B14<B7);NO(C14<B5));B14*B8;0)?"
  options:
  - id: a
    text:
      es: "4000"
  - id: b
    text:
      es: "80000"
  - id: c
    text:
      es: "FALSO"
  - id: d
    correct: true
    text:
      es: "0"
  explanation:
    es: "El total de ventas es inferior al objetivo, por lo que NO(B14<B7) es FALSO, Y no se cumple y se devuelve 0, el valor del caso contrario. 4000 sería la comisión si se cumpliera, 80000 el total de ventas y FALSO el resultado de Y sin SI."
  citation: "fuente: `ms-excel-funcion-no.html`; «Cálculo de la comisión de ventas»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-sierror-html
- id: m06-l05-q201
  prompt:
    es: "En Excel 365, la celda A1 contiene 80 y B1 contiene 0. ¿Cuál de los siguientes resultados muestra la celda que contiene =SI.ERROR(A1/B1; \"Sin datos\")?"
  options:
  - id: a
    text:
      es: "El valor 80"
  - id: b
    correct: true
    text:
      es: "Sin datos"
  - id: c
    text:
      es: "#N/A"
  - id: d
    text:
      es: "FALSO"
  explanation:
    es: "A1/B1 divide entre 0 y da un error, y SI.ERROR devuelve en ese caso el valor especificado, el texto Sin datos. 80 sería el resultado de ignorar B1; #N/A y FALSO no son el valor especificado."
  citation: "fuente: `ms-excel-funcion-sierror.html`; «Descripción»"
  difficulty: 1
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-sierror-html
- id: m06-l05-q202
  prompt:
    es: "En Excel 365, A1 contiene 80 y B1 contiene 4. ¿Qué muestra la celda que contiene =SI.ERROR(A1/B1; \"Sin datos\")?"
  options:
  - id: a
    text:
      es: "Sin datos"
  - id: b
    text:
      es: "#¡DIV/0!"
  - id: c
    correct: true
    text:
      es: "20"
  - id: d
    text:
      es: "320"
  explanation:
    es: "La división 80/4 no da error, así que SI.ERROR devuelve el resultado de la fórmula: 20. El texto Sin datos solo se devuelve ante un error, #¡DIV/0! es el error que SI.ERROR sustituye y 320 resulta de multiplicar."
  citation: "fuente: `ms-excel-funcion-sierror.html`; «Ejemplos»"
  difficulty: 1
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-sierror-html
- id: m06-l05-q203
  prompt:
    es: "En Excel 365, A1 contiene 50, B1 contiene 0 y C1 está vacía. ¿Cuál de los siguientes resultados muestra la celda con =SI.ERROR(A1/B1; C1)?"
  options:
  - id: a
    text:
      es: "El número 0"
  - id: b
    text:
      es: "El error #¡DIV/0!"
  - id: c
    text:
      es: "El valor lógico FALSO"
  - id: d
    correct: true
    text:
      es: "Una cadena vacía (\"\")"
  explanation:
    es: "A1/B1 da un error y SI.ERROR devuelve C1, pero si value_if_error es una celda vacía lo trata como un valor de cadena vacío (\"\"). Por eso no muestra 0, ni el error original, ni un valor lógico."
  citation: "fuente: `ms-excel-funcion-sierror.html`; «Observaciones»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
  - "comportamiento"
# anchor: fuente-ms-excel-funcion-sierror-html
- id: m06-l05-q204
  prompt:
    es: "En Excel 365, A4 está vacía y B4 contiene 23. ¿Cuál de los siguientes resultados muestra la celda con =SI.ERROR(A4/B4; \"Sin cálculo\")?"
  options:
  - id: a
    correct: true
    text:
      es: "0"
  - id: b
    text:
      es: "Sin cálculo"
  - id: c
    text:
      es: "#¡DIV/0!"
  - id: d
    text:
      es: "#¡VALOR!"
  explanation:
    es: "Según el ejemplo de la página, dividir una celda vacía (\"\") entre 23 no encuentra ningún error y SI.ERROR devuelve el resultado de la fórmula, 0. El texto solo aparecería ante un error, y ni #¡DIV/0! ni #¡VALOR! se producen aquí."
  citation: "fuente: `ms-excel-funcion-sierror.html`; «Ejemplos»"
  difficulty: 3
  tags:
