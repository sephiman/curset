- id: m11-l02-v-zone-change-arithmetic-001
  prompt:
    en: |-
      A `ZonedDateTime` in `Europe/Madrid`, where the clocks change in 2026, is moved with one `plus` method. What does this program print, line by line?

      ```java
      import java.time.ZoneId;
      import java.time.ZonedDateTime;

      public class Main {
          public static void main(String[] args) {
              ZoneId zone = ZoneId.of("Europe/Madrid");
              ZonedDateTime start = ZonedDateTime.of(2026, 3, 28, 12, 0, 0, 0, zone);
              System.out.println(start);
              System.out.println(start.plusDays(1));
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`2026-03-28T12:00+01:00[Europe/Madrid]`, `2026-03-29T12:00+02:00[Europe/Madrid]`'
    correct: true
  - id: b
    text:
      en: '`2026-03-28T12:00+01:00[Europe/Madrid]`, `2026-03-29T13:00+02:00[Europe/Madrid]`'
  - id: c
    text:
      en: '`2026-03-28T12:00+01:00[Europe/Madrid]`, `2026-03-29T11:00+02:00[Europe/Madrid]`'
  - id: d
    text:
      en: '`2026-03-28T12:00+01:00[Europe/Madrid]`, `2026-03-29T12:00+01:00[Europe/Madrid]`'
  explanation:
    en: 'The first line is the start, `2026-03-28T12:00+01:00[Europe/Madrid]`. `plusDays(1)` works on the local time-line,
      so it adds 1 day to the local date-time `2026-03-28T12:00` and the zone rules then give the offset. The local date-time
      `2026-03-29T12:00` has offset `+02:00` in `Europe/Madrid`. The program prints `2026-03-28T12:00+01:00[Europe/Madrid]`,
      `2026-03-29T12:00+02:00[Europe/Madrid]`. `2026-03-28T12:00+01:00[Europe/Madrid]`, `2026-03-29T13:00+02:00[Europe/Madrid]`
      comes from this mistake: reading `plusDays(1)` as `plusHours(24)`. `plusDays` and `plusWeeks` work on the local time-line,
      while `plusHours` and `plusMinutes` work on the instant time-line, so they differ across a clock change. `2026-03-28T12:00+01:00[Europe/Madrid]`,
      `2026-03-29T11:00+02:00[Europe/Madrid]` comes from this mistake: subtracting one hour from the result of `plusDays(1)`.
      The offset rules of `Europe/Madrid` are already applied by `plusDays(1)`, so no hour is subtracted. `2026-03-28T12:00+01:00[Europe/Madrid]`,
      `2026-03-29T12:00+01:00[Europe/Madrid]` comes from this mistake: keeping the starting offset on the result of `plusDays(1)`.
      The offset of the result comes from the rules of `Europe/Madrid` at the result''s own time, so it can differ from the
      starting offset.'
  family: zone-change-arithmetic
  code_reading: true
