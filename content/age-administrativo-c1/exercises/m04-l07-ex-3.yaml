# anchor: boe-a-1997-9874-art-1
- id: m04-l07-q074
  prompt:
    es: "Según el artículo 1.1 del Real Decreto 577/1997, de 18 de abril, por el que se aprueba el Estatuto de la Mutualidad General de Funcionarias y Funcionarios Civiles del Estado, O.A., ¿cómo queda adscrita la Mutualidad a su Ministerio?"
  options:
  - id: a
    text:
      es: "A través de la Subsecretaría del Ministerio para la Transformación Digital y de la Función Pública."
  - id: b
    text:
      es: "A través de la Dirección General de la Función Pública."
  - id: c
    correct: true
    text:
      es: "A través de la Secretaría de Estado de Función Pública."
  - id: d
    text:
      es: "A través de la Secretaría de Estado de Digitalización e Inteligencia Artificial."
  explanation:
    es: "El artículo 1.1 la declara «adscrito a través de la Secretaría de Estado de Función Pública al Ministerio del que ésta dependa». La adscripción no pasa por la Subsecretaría del Ministerio ni por la Dirección General de la Función Pública, órganos que el precepto no menciona. Tampoco por la Secretaría de Estado de Digitalización e Inteligencia Artificial, que es otra de las secretarías de Estado del mismo Ministerio, pero no la que nombra el artículo."
  citation: "art. 1.1 RD 577/1997"
  difficulty: 2
  tags:
  - "órgano"
