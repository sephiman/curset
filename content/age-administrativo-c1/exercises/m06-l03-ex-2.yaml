# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q028
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué hace la combinación Alt+D, según la tabla de métodos abreviados de Microsoft?"
  options:
  - id: a
    text:
      es: "Muestra u oculta el panel de detalles"
  - id: b
    text:
      es: "Va a la carpeta anterior de la ruta"
  - id: c
    correct: true
    text:
      es: "Selecciona la barra de direcciones"
  - id: d
    text:
      es: "Muestra las propiedades del elemento seleccionado"
  explanation:
    es: "La tabla del Explorador asigna a Alt+D «Seleccionar la barra de direcciones». El panel de detalles se muestra u oculta con Alt+Mayús+P; la carpeta anterior se abre con Alt+Flecha izquierda o Retroceso, y las propiedades del elemento seleccionado se ven con Alt+Entrar."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q029
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes combinaciones selecciona la barra de direcciones?"
  options:
  - id: a
    text:
      es: "Ctrl+Mayús+E"
  - id: b
    text:
      es: "Alt+Flecha arriba"
  - id: c
    text:
      es: "Alt+Mayús+P"
  - id: d
    correct: true
    text:
      es: "Alt+D"
  explanation:
    es: "La tabla del Explorador asigna a Alt+D «Seleccionar la barra de direcciones». Alt+Flecha arriba sube un nivel en la ruta de la carpeta, Alt+Mayús+P muestra u oculta el panel de detalles y Ctrl+Mayús+E expande todas las carpetas del árbol del panel de navegación."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q030
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué ocurre al pulsar Alt+Entrar con un archivo seleccionado?"
  options:
  - id: a
    text:
      es: "Se muestra el menú contextual del elemento seleccionado"
  - id: b
    text:
      es: "Se muestra u oculta el panel de vista previa del elemento"
  - id: c
    correct: true
    text:
      es: "Se muestran las propiedades del elemento seleccionado"
  - id: d
    text:
      es: "Se pasa a cambiar el nombre del elemento seleccionado"
  explanation:
    es: "La tabla del Explorador asigna a Alt+Entrar «Ver las propiedades del elemento seleccionado». El menú contextual se abre con Mayús+F10, el nombre se cambia con F2 y el panel de vista previa se muestra u oculta con Alt+P."
