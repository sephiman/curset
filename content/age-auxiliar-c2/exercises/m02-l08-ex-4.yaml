# anchor: fuente-ms-word-control-cambios-html
- id: m02-l08-q286
  prompt:
    es: "En Word 365, ¿qué muestra el Panel de revisión vertical de la pestaña Revisar, según la página de Microsoft sobre el seguimiento de cambios?"
  options:
  - id: a
    correct: true
    text:
      es: "Una lista de todos los cambios junto al documento"
  - id: b
    text:
      es: "Una lista de todos los cambios debajo del documento"
  - id: c
    text:
      es: "Una lista solo con los cambios del propio usuario"
  - id: d
    text:
      es: "Una lista de todos los cambios en una ventana flotante sobre el documento"
  explanation:
    es: "La página dice que el Panel de revisión vertical muestra una lista de todos los cambios junto al documento. La lista debajo del documento es la del Panel de revisión horizontal. La lista solo con los cambios del propio usuario no es la del panel, que lista todos los cambios; registrar solo los propios es la opción Solo míos del seguimiento. La página sitúa el panel al lado o debajo del documento, no en una ventana flotante."
  citation: "fuente: `ms-word-control-cambios.html`; «Realizar un seguimiento de los cambios en Word»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-word-control-cambios-html
- id: m02-l08-q287
  prompt:
    es: "En Word 365, ¿qué indica la página de Microsoft que debe hacerse para editar sin seguimiento un documento compartido para revisión que no deja desactivar el Control de cambios?"
  options:
  - id: a
    text:
      es: "Elegir Solo míos en el menú Seguimiento de cambios de la pestaña Revisar, para mostrarlo"
  - id: b
    correct: true
    text:
      es: "Guardar una copia o pedir que lo compartan de nuevo con la revisión desactivada"
  - id: c
    text:
      es: "Elegir Sin marcado en el grupo Marcado de la pestaña Revisar, para ocultar los cambios"
  - id: d
    text:
      es: "Elegir Bloquear seguimiento y escribir una contraseña para el documento compartido"
  explanation:
    es: "La nota de la página dice que, si el documento se ha compartido para revisión, quizá no se pueda desactivar el Control de cambios, y que hay que guardar una copia o pedir a quien lo envió que lo comparta de nuevo con el modo de revisión desactivado. Solo míos solo limita el seguimiento a los cambios propios, que siguen registrándose. Sin marcado oculta el marcado para mostrar el documento con los cambios incorporados, pero no desactiva el seguimiento. Bloquear seguimiento pide una contraseña para que otros usuarios no puedan desactivar el Control de cambios, justo lo contrario de lo que se busca."
  citation: "fuente: `ms-word-control-cambios.html`; «Realizar un seguimiento de los cambios en Word»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-control-cambios-html
- id: m02-l08-q288
  prompt:
    es: "¿Cuál de los siguientes comandos de Seguimiento, en la pestaña Revisar de Word 365, permite ver el cambio de revisión anterior?"
  options:
  - id: a
    text:
      es: "Siguiente"
  - id: b
    text:
      es: "Aceptar"
  - id: c
    correct: true
    text:
      es: "Anterior"
  - id: d
    text:
      es: "Rechazar"
  explanation:
    es: "La página dice que, en la pestaña Revisar, se selecciona Seguimiento y después Anterior para ver el cambio de revisión anterior. Siguiente muestra el siguiente cambio de revisión. Aceptar abre las opciones para aceptar cambios, como aceptar el cambio o aceptar todos. Rechazar abre las opciones para rechazar cambios."
  citation: "fuente: `ms-word-control-cambios.html`; «Realizar un seguimiento de los cambios en Word»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-office-comprobador-accesibilidad-html
- id: m02-l08-q289
  prompt:
    es: "¿Cuál de las siguientes listas se abre con el botón de flecha abajo junto a un problema, en el panel Accesibilidad del Comprobador de accesibilidad de Word 365?"
  options:
  - id: a
    text:
      es: "La lista de Resultados de la inspección"
  - id: b
    text:
      es: "El menú desplegable Comprobar si hay problemas"
  - id: c
    text:
      es: "La lista de Información adicional"
  - id: d
    correct: true
    text:
      es: "La lista de Acciones recomendadas"
  explanation:
    es: "La página dice que, para solucionar un problema, se selecciona el botón de flecha abajo situado junto a él y se abre la lista de Acciones recomendadas. Los Resultados de la inspección son donde se revisan los hallazgos del panel. El menú Comprobar si hay problemas es la vía de Archivo › Información para abrir el Comprobador en versiones anteriores de la aplicación. La información adicional es donde aparece por qué y cómo corregir un problema, al seleccionarlo en los resultados."
  citation: "fuente: `ms-office-comprobador-accesibilidad.html`; «Mejorar la accesibilidad con el Comprobador de accesibilidad»"
  difficulty: 2
  tags:
  - "ofimática-menú"
