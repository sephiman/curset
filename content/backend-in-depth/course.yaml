# backend-in-depth course manifest — course → blocks → modules → lessons (stable ids, order = list position).
# Requirements: docs/backend-in-depth-course-requirements.md v1.1. Programme: programme.md (section 9, locked in S0).
# Module mNN is programme module NN and lesson mNN-lMM its subsection NN.MM; titles verbatim from the programme.
# Block «About this course» sits before the programme. The blocks below are generated by
# docs/backend-verification/s0/scripts/skeleton.py; summaries are placeholders until S2.
# IDs are unique inside this course; another course may reuse them (see content/README.md).
course:
  id: backend-in-depth
  title:
    en: Backend Engineering in Depth
  subtitle:
    en: Backend Engineering in Depth
  description:
    en: >-
      A self-paced course for senior backend engineers: Java and Kotlin, Spring, persistence, networking, distributed
      systems, system design, operations and technical leadership, written from the primary documentation of pinned
      versions.
  languages: [en]
  # Requirements 8.1: unpublished until S3; the platform's unpublished status is `draft`.
  status: draft
  # Generators of requirements 6.3 are the psicotecnico type; the static bank (6.1) is quiz, from S2; case waits for m09.
  exercise_types: [psicotecnico, quiz]
  # Requirements 6.5: unseen questions first, failed ones return at growing intervals.
  practice_scheduler: spaced
  option_labels: letters
  pdf_exercises: false
  # Requirements 6.3 runtime generators: equal weights, levels 1 and 2 drawn equally (no index fixes a mix).
  practice_generators:
  - generator: capacity-estimation
    title:
      en: Capacity estimation
    weight: 1
    difficulty: {1: 1, 2: 1}
  - generator: quorum-reads
    title:
