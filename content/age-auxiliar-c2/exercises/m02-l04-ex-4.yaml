# anchor: boe-a-2018-12699-art-15
- id: m02-l04-q182
  prompt:
    es: "Según el Real Decreto 1112/2018, de 7 de septiembre, sobre accesibilidad de los sitios web y aplicaciones para dispositivos móviles del sector público, la declaración de accesibilidad de los sitios web se publicará en el sitio web correspondiente, con acceso desde todas las páginas del sitio a través de un enlace denominado:"
  options:
  - id: a
    correct: true
    text:
      es: "«Accesibilidad» o su equivalente en el idioma en el que se encuentre disponible la página."
  - id: b
    text:
      es: "«Aviso legal», con acceso desde la página de inicio."
  - id: c
    text:
      es: "«Mapa del sitio», con acceso desde el pie de la página principal."
  - id: d
    text:
      es: "«Declaración» o su equivalente en el idioma de la entidad responsable del sitio web o de la aplicación."
  explanation:
    es: "El enlace se denomina «Accesibilidad» o su equivalente en el idioma de la página, y ha de estar disponible desde todas las páginas del sitio. «Declaración», «Aviso legal» y «Mapa del sitio» son otras denominaciones que el artículo no prevé."
  citation: "art. 15.1 RD 1112/2018"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-43
- id: m02-l04-q029
  prompt:
    es: "¿Cuál de las siguientes formas de practicar las notificaciones por medios electrónicos recoge la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El envío del acto al correo electrónico que el interesado haya comunicado."
  - id: b
    correct: true
    text:
      es: "La comparecencia en la sede, la dirección electrónica habilitada única o ambos sistemas."
  - id: c
    text:
      es: "La comparecencia en la sede, solo si no existe dirección electrónica habilitada única."
  - id: d
    text:
      es: "El envío al dispositivo móvil del interesado de un mensaje con el contenido íntegro del acto."
  explanation:
    es: "El artículo 43.1 dice que las notificaciones electrónicas se practicarán «mediante comparecencia en la sede electrónica de la Administración u Organismo actuante, a través de la dirección electrónica habilitada única o mediante ambos sistemas». El correo electrónico y el dispositivo móvil que comunica el interesado sirven para los avisos, «pero no para la práctica de notificaciones» (art. 41.1). La comparecencia en sede no está condicionada a que falte la dirección habilitada."
  citation: "art. 43.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-43
- id: m02-l04-q030
  prompt:
    es: "De acuerdo con el artículo 43.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la notificación electrónica obligatoria, o elegida expresamente por el interesado, se entenderá rechazada cuando hayan transcurrido:"
  options:
  - id: a
    text:
      es: "Diez días hábiles desde su puesta a disposición sin que se acceda a su contenido."
  - id: b
    text:
      es: "Quince días naturales desde su puesta a disposición sin que se acceda a su contenido."
  - id: c
    correct: true
    text:
      es: "Diez días naturales desde su puesta a disposición sin que se acceda a su contenido."
  - id: d
    text:
      es: "Diez días naturales desde el envío del aviso sin que se acceda a su contenido."
  explanation:
    es: "El artículo 43.2 fija el rechazo cuando «hayan transcurrido diez días naturales desde la puesta a disposición de la notificación sin que se acceda a su contenido». Los días son naturales, no hábiles, y son diez, no quince. El plazo se cuenta desde la puesta a disposición, no desde el aviso."
  citation: "art. 43.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2021-5032-art-42
- id: m02-l04-q032
  prompt:
    es: "Según el artículo 42.5 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, ¿a través de qué se pone a disposición del interesado toda notificación cuyo emisor pertenezca al ámbito estatal?"
  options:
  - id: a
    correct: true
    text:
      es: "A través de la Dirección Electrónica Habilitada única."
  - id: b
    text:
      es: "A través de la sede del órgano emisor, exclusivamente."
  - id: c
    text:
      es: "A través de la Carpeta Ciudadana, exclusivamente."
  - id: d
    text:
      es: "A través del correo electrónico comunicado por el interesado."
  explanation:
    es: "El artículo 42.5 dice que toda notificación de un emisor estatal «se pondrá a disposición del interesado a través de la Dirección Electrónica Habilitada única». La sede del emisor solo puede usarse de forma complementaria, no exclusiva. La Carpeta Ciudadana da acceso a las notificaciones, pero no es el medio de puesta a disposición. El correo electrónico sirve para avisos."
  citation: "art. 42.5 RD 203/2021"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2021-5032-art-40
- id: m02-l04-q033
  prompt:
    es: "De acuerdo con el artículo 40.3 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, las oficinas de asistencia en materia de registros hacen la identificación o firma electrónica del interesado no obligado:"
  options:
  - id: a
    text:
      es: "En cualquier procedimiento administrativo, sin necesidad de habilitación previa."
  - id: b
    correct: true
    text:
      es: "En los procedimientos administrativos para los que se haya previsto habilitación."
  - id: c
    text:
      es: "Solo en los procedimientos iniciados de oficio por la propia oficina."
  - id: d
    text:
      es: "Solo cuando el interesado actúe por medio de un representante."
  explanation:
    es: "La letra f) del artículo 40.3 atribuye a las oficinas la identificación o firma del interesado no obligado «en los procedimientos administrativos para los que se haya previsto habilitación». No alcanza a cualquier procedimiento sin habilitación. No se limita a los procedimientos de oficio. No depende de que el interesado actúe por representante."
  citation: "art. 40.3.f) RD 203/2021"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2021-5032-art-40
- id: m02-l04-q034
  prompt:
    es: "Según el artículo 40.3.a) del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, ¿qué escritos en papel digitalizan las oficinas de asistencia en materia de registros?"
  options:
  - id: a
    text:
      es: "Solo los que se dirijan a órganos y organismos públicos de la Administración General del Estado."
  - id: b
    text:
      es: "Solo los que se dirijan al departamento ministerial del que dependa la propia oficina."
  - id: c
    correct: true
    text:
      es: "Los que se dirijan a cualquier órgano, organismo o entidad de cualquier Administración Pública."
  - id: d
    text:
      es: "Solo los dirigidos a la Administración General del Estado o a la de la comunidad autónoma."
  explanation:
    es: "La letra a) del artículo 40.3 encarga a las oficinas la digitalización de los escritos en papel que «se dirijan a cualquier órgano, organismo público o entidad de derecho público de cualquier Administración Pública». No se limita a la Administración General del Estado ni al departamento del que dependa la oficina. Tampoco a la Administración estatal y a la de la comunidad autónoma."
  citation: "art. 40.3.a) RD 203/2021"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10565-art-41
- id: m02-l04-q058
  prompt:
    es: "De acuerdo con el artículo 41.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las notificaciones se practicarán:"
  options:
  - id: a
    text:
      es: "Exclusivamente por medios electrónicos, salvo que el interesado acredite que carece de los medios necesarios para ello."
  - id: b
    text:
      es: "Preferentemente en papel, salvo que el interesado haya elegido de forma expresa recibirlas por medios electrónicos."
  - id: c
    text:
      es: "Por medios electrónicos solo cuando el interesado sea una persona jurídica o una entidad sin personalidad jurídica."
  - id: d
    correct: true
    text:
      es: "Preferentemente por medios electrónicos y, en todo caso, cuando el interesado resulte obligado a recibirlas por esta vía."
  explanation:
    es: "El artículo 41.1 dice que las notificaciones se practicarán «preferentemente por medios electrónicos y, en todo caso, cuando el interesado resulte obligado a recibirlas por esta vía». No son exclusivamente electrónicas. La preferencia no es el papel. La vía electrónica no se reserva a personas jurídicas y entidades sin personalidad."
  citation: "art. 41.1 LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2021-5032-art-11
- id: m02-l04-q108
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, toda sede electrónica dispone, al menos, de un enlace para la formulación de:"
  options:
  - id: a
    text:
      es: "Reclamaciones de responsabilidad patrimonial ante el Consejo de Estado."
  - id: b
    correct: true
    text:
      es: "Sugerencias y quejas ante los órganos que en cada caso resulten competentes."
  - id: c
    text:
      es: "Recursos de alzada ante la Subsecretaría del Departamento titular de la sede."
  - id: d
    text:
      es: "Solicitudes de acceso a la información pública ante el Consejo de Transparencia."
  explanation:
    es: "La sede incluye un enlace para sugerencias y quejas ante los órganos competentes. Los recursos de alzada, las reclamaciones de responsabilidad patrimonial y las solicitudes de acceso a la información pública se presentan por otras vías."
  citation: "art. 11.2.b) RD 203/2021"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-11
- id: m02-l04-q109
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, las sedes electrónicas dispondrán, al menos, de un sistema de verificación de:"
  options:
  - id: a
    text:
      es: "Las habilitaciones de los funcionarios de las oficinas."
  - id: b
    text:
      es: "Los poderes notariales de quienes actúan en representación."
  - id: c
    correct: true
    text:
      es: "Los certificados de la sede electrónica."
  - id: d
    text:
      es: "Las firmas manuscritas de las personas interesadas."
  explanation:
    es: "La letra d) exige un sistema de verificación de los certificados de la sede electrónica. Las firmas manuscritas, los poderes notariales y las habilitaciones de funcionarios no son objeto de ese sistema."
  citation: "art. 11.2.d) RD 203/2021"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-11
- id: m02-l04-q110
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, las sedes disponen de un servicio de comprobación de la autenticidad e integridad de los documentos emitidos por sus órganos que hayan sido firmados y para los cuales se haya generado un:"
  options:
  - id: a
    correct: true
    text:
      es: "Código seguro de verificación."
  - id: b
    text:
      es: "Certificado de autenticación de sitio web."
  - id: c
    text:
      es: "Número de registro de salida."
  - id: d
    text:
      es: "Sello de tiempo cualificado."
  explanation:
    es: "El servicio comprueba los documentos para los que se haya generado un código seguro de verificación. El sello de tiempo, el número de registro de salida y el certificado de sitio web no son lo que la letra f) comprueba."
  citation: "art. 11.2.f) RD 203/2021"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-11
- id: m02-l04-q111
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, las sedes disponen de un servicio de consulta del directorio geográfico de:"
  options:
  - id: a
    text:
      es: "Puntos de Atención al Emprendedor."
  - id: b
    text:
      es: "Archivos históricos provinciales."
  - id: c
    text:
      es: "Oficinas integradas de atención al ciudadano."
  - id: d
    correct: true
    text:
      es: "Oficinas de asistencia en materia de registros."
  explanation:
    es: "El directorio que se consulta es el de oficinas de asistencia en materia de registros, para identificar la más próxima a la dirección de consulta. Los archivos provinciales, las oficinas integradas y los PAE tienen otros directorios o ninguno en el precepto."
