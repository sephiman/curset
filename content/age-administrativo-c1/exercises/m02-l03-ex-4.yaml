# anchor: boe-a-2021-5032-art-6
- id: m02-l03-q068
  prompt:
    es: "De acuerdo con el artículo 6.1 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, la resolución de la persona titular de la Presidencia o de la Dirección sirve para crear o suprimir los portales:"
  options:
  - id: a
    text:
      es: "De los departamentos ministeriales que carezcan de un órgano superior propio."
  - id: b
    text:
      es: "De las Delegaciones y Subdelegaciones del Gobierno en las comunidades autónomas."
  - id: c
    text:
      es: "De las sociedades mercantiles estatales y de las fundaciones del sector público."
  - id: d
    correct: true
    text:
      es: "De los organismos públicos y entidades de derecho público vinculados o dependientes."
  explanation:
    es: "El artículo 6.1 reserva la resolución de la persona titular de la Presidencia o de la Dirección para los portales «de sus organismos públicos y entidades de derecho público vinculados o dependientes». En los ministerios, los portales se crean o suprimen por orden de su titular o por resolución del órgano superior, no por una resolución de Presidencia o Dirección. Las Delegaciones del Gobierno son órganos de la Administración General del Estado. Las sociedades mercantiles y las fundaciones no son entidades de derecho público, y el precepto no las nombra."
  citation: "art. 6.1 RD 203/2021"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2021-5032-art-6
- id: m02-l03-q069
  prompt:
    es: "De acuerdo con el artículo 6.2 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, la dirección electrónica de un nuevo portal en el ámbito estatal deberá incluir, como nombre de dominio de segundo nivel:"
  options:
  - id: a
    text:
      es: "El dominio «.age.es»."
  - id: b
    text:
      es: "El dominio «.admin.es»."
  - id: c
    correct: true
    text:
      es: "El dominio «.gob.es»."
  - id: d
    text:
      es: "El dominio «.estado.es»."
  explanation:
    es: "El artículo 6.2 dice que el acto de creación identificará la dirección electrónica del portal, «que deberá incluir el nombre de dominio de segundo nivel «.gob.es»». Los dominios «.age.es», «.admin.es» y «.estado.es» no figuran en el precepto."
  citation: "art. 6.2 RD 203/2021"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-38
- id: m02-l03-q070
  prompt:
    es: "De acuerdo con el artículo 38.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, el establecimiento de una sede electrónica conlleva la responsabilidad del titular respecto de:"
  options:
  - id: a
    text:
      es: "La integridad y veracidad de la información publicada en ella, pero no de su actualización periódica."
  - id: b
    correct: true
    text:
      es: "La integridad, veracidad y actualización de la información y los servicios accesibles a través de ella."
  - id: c
    text:
      es: "La veracidad de la información publicada en ella, pero no de los servicios que se presten a través de ella."
  - id: d
    text:
      es: "La disponibilidad continua de la sede y de sus servicios, pero no de la información que publique en ella."
  explanation:
    es: "El artículo 38.2 hace responsable al titular «respecto de la integridad, veracidad y actualización de la información y los servicios a los que pueda accederse a través de la misma». La responsabilidad cubre la actualización y alcanza a los servicios. El precepto no la reduce a la disponibilidad de la sede ni excluye la información."
  citation: "art. 38.2 LRJSP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2018-12699-art-2
- id: m02-l03-q071
  prompt:
    es: "Señale la respuesta correcta sobre el ámbito de aplicación del Real Decreto 1112/2018, de 7 de septiembre, sobre accesibilidad de los sitios web y aplicaciones para dispositivos móviles del sector público:"
  options:
  - id: a
    text:
      es: "No se aplica a las entidades que integran la Administración Local."
  - id: b
    correct: true
    text:
      es: "Se aplica también a la Administración de Justicia."
  - id: c
    text:
      es: "Se aplica solo a la Administración General del Estado y a sus organismos."
  - id: d
    text:
      es: "No se aplica al sector público institucional."
  explanation:
    es: "El artículo 2.2 dice que lo dispuesto en el real decreto «también será de aplicación a la Administración de Justicia». El artículo 2.1 incluye en el sector público a la Administración General del Estado, las de las comunidades autónomas, las entidades de la Administración Local, el sector público institucional y las asociaciones constituidas por las Administraciones. Por eso no excluye a las entidades locales ni al sector público institucional, y no se limita a la Administración General del Estado."
  citation: "art. 2.2 RD 1112/2018"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2018-12699-art-5
- id: m02-l03-q072
  prompt:
    es: "De acuerdo con el artículo 5.1 del Real Decreto 1112/2018, de 7 de septiembre, los contenidos de los sitios web y aplicaciones móviles de las entidades obligadas deben ser:"
  options:
  - id: a
    text:
      es: "Perceptibles, operables, comprensibles y gratuitos."
  - id: b
    text:
      es: "Visibles, interoperables, legibles y robustos."
  - id: c
    text:
      es: "Perceptibles, interoperables, comprensibles y seguros."
  - id: d
    correct: true
    text:
      es: "Perceptibles, operables, comprensibles y robustos."
  explanation:
    es: "El artículo 5.1 exige contenidos «perceptibles, operables, comprensibles y robustos». Las demás series cambian alguno de los cuatro términos: gratuitos, visibles, interoperables, legibles o seguros no son los que usa el precepto."
  citation: "art. 5.1 RD 1112/2018"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2018-12699-art-12
- id: m02-l03-q073
  prompt:
    es: "De acuerdo con el artículo 12.3 del Real Decreto 1112/2018, de 7 de septiembre, recibidas las solicitudes de información accesible y quejas, la entidad obligada deberá responder a la persona interesada:"
  options:
  - id: a
    text:
      es: "En el plazo de diez días hábiles."
  - id: b
    text:
      es: "En el plazo de quince días hábiles."
  - id: c
    correct: true
    text:
      es: "En el plazo de veinte días hábiles."
  - id: d
    text:
      es: "En el plazo máximo de dos meses."
  explanation:
    es: "El artículo 12.3 da a la entidad obligada «el plazo de veinte días hábiles» para responder. Diez días hábiles es el plazo del requerimiento de aclaraciones (art. 12.4). Dos meses es el plazo de la reclamación posterior (art. 13.4). Quince días hábiles no aparece en estos preceptos."
  citation: "art. 12.3 RD 1112/2018"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2018-12699-art-12
- id: m02-l03-q074
  prompt:
    es: "Según el artículo 12.4 del Real Decreto 1112/2018, de 7 de septiembre, ¿en qué caso se podrá suspender el plazo para responder a una solicitud de información accesible o a una queja?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando deba requerirse a la persona interesada para que formule las aclaraciones necesarias."
  - id: b
    text:
      es: "Cuando la entidad obligada esté revisando su declaración de accesibilidad."
  - id: c
    text:
      es: "Cuando la solicitud se presente en un registro distinto del de la entidad obligada."
  - id: d
    text:
      es: "Cuando la entidad obligada aprecie una carga desproporcionada en la petición."
  explanation:
    es: "El artículo 12.4 permite suspender el plazo «en el caso de que deba requerirse a la persona interesada para que, en un plazo de diez días hábiles, formule las aclaraciones necesarias». La revisión de la declaración de accesibilidad, la presentación en otro registro o la carga desproporcionada no son causas de suspensión en este precepto. La carga desproporcionada es una excepción a los requisitos (art. 7.1), no a este plazo."
  citation: "art. 12.4 RD 1112/2018"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-2018-12699-art-12
- id: m02-l03-q075
  prompt:
    es: "De acuerdo con el artículo 12.6 del Real Decreto 1112/2018, de 7 de septiembre, si transcurre el plazo máximo para resolver sin que se haya notificado la respuesta a una queja, se entenderá que:"
  options:
  - id: a
    text:
      es: "La queja ha sido estimada por la entidad obligada."
  - id: b
    text:
      es: "La queja ha sido desestimada por la Unidad responsable."
  - id: c
    text:
      es: "La persona interesada ha desistido de su queja."
  - id: d
    correct: true
    text:
      es: "La queja no ha sido considerada por la entidad obligada."
  explanation:
    es: "El artículo 12.6 dice que, sin respuesta notificada en plazo, se entenderá «que la queja no ha sido considerada». El silencio no la estima. La desestimación por silencio es el efecto del artículo 13.6 para la reclamación, no para la queja. El precepto no presume un desistimiento."
  citation: "art. 12.6 RD 1112/2018"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2018-12699-art-13
- id: m02-l03-q076
  prompt:
    es: "Según el artículo 13.6 del Real Decreto 1112/2018, de 7 de septiembre, ¿qué efecto tiene que transcurra el plazo máximo para resolver una reclamación sin que se haya notificado su resolución?"
  options:
  - id: a
    text:
      es: "Se entenderá que la reclamación ha sido estimada."
  - id: b
    correct: true
    text:
      es: "Se entenderá que la reclamación ha sido desestimada."
  - id: c
    text:
      es: "Se entenderá que la reclamación no ha sido considerada."
  - id: d
    text:
      es: "Se entenderá caducado el procedimiento de reclamación."
  explanation:
    es: "El artículo 13.6 dice que, en ese caso, «se entenderá que la reclamación ha sido desestimada». No hay estimación. «No ha sido considerada» es la fórmula del artículo 12.6 para la queja, no para la reclamación. El precepto no habla de caducidad."
  citation: "art. 13.6 RD 1112/2018"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2018-12699-art-12
- id: m02-l03-q077
  prompt:
    es: "Una solicitud de información accesible tiene entrada en el registro de un ministerio el lunes 1 de febrero de 2027. Según el artículo 12.3 del Real Decreto 1112/2018, de 7 de septiembre, ¿cuál es el último día para responder, contando el plazo desde el día siguiente?"
  options:
  - id: a
    text:
      es: "El viernes 26 de febrero de 2027."
  - id: b
    text:
      es: "El martes 2 de marzo de 2027."
  - id: c
    text:
      es: "El lunes 15 de febrero de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes 1 de marzo de 2027."
  explanation:
    es: "El artículo 12.3 da veinte días hábiles. Los días hábiles excluyen sábados, domingos y festivos (art. 30.2 LPAC), y entre esas fechas no hay festivos. El plazo empieza el martes 2 de febrero: del martes 2 al viernes 26 de febrero hay diecinueve días hábiles, y el vigésimo es el lunes 1 de marzo de 2027. El viernes 26 de febrero sale de contar desde el mismo día de entrada. El martes 2 de marzo es el día hábil vigésimo primero. El lunes 15 de febrero cierra un plazo de diez días hábiles, que es el de las aclaraciones."
  citation: "art. 12.3 RD 1112/2018"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2018-12699-art-13
- id: m02-l03-q078
  prompt:
    es: "La Unidad responsable de accesibilidad recibe una reclamación el jueves 8 de enero de 2026. Según el artículo 13.4 del Real Decreto 1112/2018, de 7 de septiembre, ¿cuál es el último día del plazo para responder, contado de fecha a fecha desde el día siguiente?"
  options:
  - id: a
    text:
      es: "El viernes 6 de marzo de 2026."
  - id: b
    text:
      es: "El lunes 9 de febrero de 2026."
  - id: c
    correct: true
    text:
      es: "El lunes 9 de marzo de 2026."
  - id: d
    text:
      es: "El jueves 5 de febrero de 2026."
  explanation:
    es: "El artículo 13.4 da dos meses. Un plazo en meses termina el mismo día del mes de vencimiento (art. 30.4 LPAC): el 8 de marzo de 2026. Ese día es domingo, y el último día inhábil se prorroga al primer hábil siguiente (art. 30.5 LPAC): el lunes 9 de marzo. El viernes 6 de marzo adelanta el vencimiento en lugar de prorrogarlo. El lunes 9 de febrero es el vencimiento de un solo mes, también trasladado desde un domingo. El jueves 5 de febrero cierra veinte días hábiles, que es el plazo de las quejas."
  citation: "art. 13.4 RD 1112/2018"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2018-12699-art-12
- id: m02-l03-q079
  prompt:
    es: "El martes 2 de febrero de 2027 se notifica a una persona un requerimiento de aclaraciones sobre su queja de accesibilidad. Según el artículo 12.4 del Real Decreto 1112/2018, de 7 de septiembre, ¿cuál es el último día para formularlas?"
  options:
  - id: a
    text:
      es: "El viernes 12 de febrero de 2027."
  - id: b
    correct: true
    text:
      es: "El martes 16 de febrero de 2027."
  - id: c
    text:
      es: "El lunes 15 de febrero de 2027."
  - id: d
    text:
      es: "El martes 2 de marzo de 2027."
  explanation:
    es: "El artículo 12.4 da a la persona interesada diez días hábiles. El plazo empieza el día siguiente a la notificación (art. 30.3 LPAC), el miércoles 3 de febrero. Sin sábados ni domingos, y sin festivos en esas fechas: 3, 4, 5, 8, 9, 10, 11, 12, 15 y 16 de febrero. El décimo es el martes 16 de febrero de 2027. El viernes 12 resulta de contar diez días naturales. El lunes 15 cuenta el día de la notificación. El martes 2 de marzo cierra veinte días hábiles, el plazo de la entidad para responder."
  citation: "art. 12.4 RD 1112/2018"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2018-12699-art-15
- id: m02-l03-q080
  prompt:
    es: "De acuerdo con el artículo 15.1 del Real Decreto 1112/2018, de 7 de septiembre, la declaración de accesibilidad será actualizada:"
  options:
  - id: a
    text:
      es: "Como mínimo cada tres años, o cuando lo solicite la Unidad responsable de accesibilidad."
  - id: b
    text:
      es: "Solo cuando se realice una revisión de accesibilidad, sin una periodicidad mínima."
  - id: c
    correct: true
    text:
      es: "Como mínimo una vez al año, o cada vez que se realice una revisión de accesibilidad."
  - id: d
    text:
      es: "Como mínimo cada seis meses, o cada vez que se modifique el sitio web."
  explanation:
    es: "El artículo 15.1 dice que la declaración «será actualizada periódicamente, como mínimo una vez al año, o cada vez que se realice una revisión de accesibilidad». Sí hay periodicidad mínima, y es anual, no de tres años ni de seis meses. El precepto no la vincula a una petición de la Unidad responsable ni a cada modificación del sitio."
  citation: "art. 15.1 RD 1112/2018"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-41
- id: m02-l03-q081
  prompt:
    es: "De acuerdo con el artículo 41.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las notificaciones se practicarán:"
  options:
  - id: a
    text:
      es: "Exclusivamente por medios electrónicos, salvo que el interesado acredite que carece de los medios necesarios para ello."
  - id: b
    text:
      es: "Preferentemente en papel, salvo que el interesado haya elegido de forma expresa recibirlas por medios electrónicos."
  - id: c
    text:
      es: "Por medios electrónicos solo cuando el interesado sea una persona jurídica o una entidad sin personalidad jurídica."
  - id: d
    correct: true
    text:
      es: "Preferentemente por medios electrónicos y, en todo caso, cuando el interesado resulte obligado a recibirlas por esta vía."
  explanation:
    es: "El artículo 41.1 dice que las notificaciones se practicarán «preferentemente por medios electrónicos y, en todo caso, cuando el interesado resulte obligado a recibirlas por esta vía». No son exclusivamente electrónicas. La preferencia no es el papel. La vía electrónica no se reserva a personas jurídicas y entidades sin personalidad."
  citation: "art. 41.1 LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-2671-art-1
- id: m02-l03-q082
  prompt:
    es: "De acuerdo con el artículo 1 del Real Decreto 127/2015, de 27 de febrero, los centros de Ventanilla Única Empresarial y la ventanilla única de la Directiva de Servicios se integran en:"
  options:
  - id: a
    text:
      es: "La Red 060 de Atención al Ciudadano."
  - id: b
    text:
      es: "El Punto de Acceso General del Estado."
  - id: c
    text:
      es: "La red de oficinas de asistencia en materia de registros."
  - id: d
    correct: true
    text:
      es: "La red de Puntos de Atención al Emprendedor."
  explanation:
    es: "El artículo 1 regula la integración de los centros VUE y de la VUDS «en la red de Puntos de Atención al Emprendedor». La Red 060 nació del Acuerdo de 2005. El Punto de Acceso General y las oficinas de asistencia en materia de registros son otras estructuras, que el real decreto no menciona como destino de la integración."
  citation: "art. 1 RD 127/2015"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2015-2671-art-3
- id: m02-l03-q084
  prompt:
    es: "Según el artículo 3.2 del Real Decreto 127/2015, de 27 de febrero, ¿a través de qué documento deben iniciar la tramitación los Puntos de Atención al Emprendedor?"
  options:
  - id: a
    text:
      es: "A través de la declaración responsable de inicio de actividad."
  - id: b
    text:
      es: "A través del formulario de solicitud del Registro Electrónico General."
  - id: c
    correct: true
    text:
      es: "A través del Documento Único Electrónico."
  - id: d
    text:
      es: "A través de la comunicación previa ante la entidad local."
  explanation:
    es: "El artículo 3.2 dice que los PAE utilizarán el sistema CIRCE «y deberán iniciar la tramitación a través del Documento Único Electrónico». La declaración responsable y la comunicación previa son documentos que se presentan ante la Administración competente, no el documento con el que el PAE inicia la tramitación. El formulario del Registro Electrónico General tampoco lo es."
  citation: "art. 3.2 RD 127/2015"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2018-12699-art-12
- id: m02-l03-q086
  prompt:
    es: "Según la Sentencia del Tribunal Constitucional 100/2019, de 18 de julio, ¿cuál de las siguientes reglas del artículo 12 del Real Decreto 1112/2018, de 7 de septiembre, invade las competencias autonómicas y carece de carácter de legislación básica?"
  options:
  - id: a
    text:
      es: "La que exige concretar con toda claridad los hechos, razones y petición de la solicitud de información accesible."
  - id: b
    text:
      es: "La que obliga a indicar en la respuesta la Unidad ante la cual se puede reclamar y el procedimiento."
  - id: c
    correct: true
    text:
      es: "La que fija en veinte días hábiles el plazo para responder a las solicitudes de información accesible y a las quejas."
  - id: d
    text:
      es: "La que obliga a incluir en la respuesta el plazo estimativo para corregir un posible incumplimiento."
  explanation:
    es: "La nota del BOE al artículo 12 recoge que la Sentencia 100/2019 declara que «los apartados 1, 3, 4 y 6 invaden las competencias autonómicas y carecen de carácter de legislación básica». El apartado 3 es el que fija el plazo de veinte días hábiles para responder. La exigencia de concretar los hechos, razones y petición está en el apartado 2. La Unidad ante la que se reclama y el plazo estimativo para corregir un incumplimiento forman parte del contenido de la respuesta del apartado 5. La nota no nombra ni el apartado 2 ni el 5."
  citation: "art. 12 RD 1112/2018"
  difficulty: 3
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-2018-12699-art-13
- id: m02-l03-q087
  prompt:
    es: "De acuerdo con la Sentencia del Tribunal Constitucional 100/2019, de 18 de julio, los apartados 2 a 6 del artículo 13 del Real Decreto 1112/2018, de 7 de septiembre, que regula el procedimiento de reclamación:"
  options:
  - id: a
    text:
      es: "Invaden las competencias autonómicas y son declarados inconstitucionales y nulos."
  - id: b
    text:
      es: "Respetan las competencias autonómicas y conservan el carácter de legislación básica."
  - id: c
    text:
      es: "Respetan las competencias autonómicas, pero carecen de carácter de legislación básica."
  - id: d
    correct: true
    text:
      es: "Invaden las competencias autonómicas y carecen de carácter de legislación básica."
  explanation:
    es: "La nota del BOE al artículo 13 recoge que la Sentencia 100/2019 declara que «el inciso destacado del apartado 1 y los apartados 2 a 6 invaden las competencias autonómicas y carecen de carácter de legislación básica». La nota no los declara inconstitucionales y nulos. Esa declaración la hace la misma sentencia sobre otros incisos del real decreto, no sobre estos apartados. Las dos opciones que dicen que respetan las competencias autonómicas contradicen la nota, que dice que las invaden."
  citation: "art. 13 RD 1112/2018"
  difficulty: 3
  tags:
  - "efecto"
