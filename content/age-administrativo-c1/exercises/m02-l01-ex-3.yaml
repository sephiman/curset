# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q038
  prompt:
    es: "Según el artículo 4.e) del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la atención al ciudadano incluye recibir las quejas y reclamaciones por:"
  options:
  - id: a
    correct: true
    text:
      es: "Las tardanzas, desatenciones o cualquier otro tipo de actuación irregular en el funcionamiento de las dependencias."
  - id: b
    text:
      es: "Las resoluciones administrativas desfavorables, para su revisión de oficio por el mismo órgano que las dictó."
  - id: c
    text:
      es: "Los daños causados por el funcionamiento de los servicios públicos, a efectos de su indemnización económica."
  - id: d
    text:
      es: "Las tardanzas en la tramitación de los expedientes, con exclusión de cualquier otro tipo de actuación irregular."
  explanation:
    es: "El artículo 4.e) se refiere a las quejas y reclamaciones «por las tardanzas, desatenciones o por cualquier otro tipo de actuación irregular que observen en el funcionamiento de las dependencias administrativas». No son una vía para revisar resoluciones desfavorables ni para pedir una indemnización por daños, y el artículo no se limita a las tardanzas."
  citation: "art. 4.e) RD 208/1996"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2005-14836-art-9
- id: m02-l01-q039
  prompt:
    es: "Según el artículo 9.c) del Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, las reclamaciones por incumplimiento de los compromisos:"
  options:
  - id: a
    text:
      es: "Darán lugar a responsabilidad patrimonial cuando el incumplimiento cause un daño evaluable."
  - id: b
    text:
      es: "Se tramitarán como recurso de alzada ante el Subsecretario del departamento."
  - id: c
    text:
      es: "Darán lugar, en todo caso, a una compensación económica fijada en la propia carta."
  - id: d
    correct: true
    text:
      es: "En ningún caso darán lugar a responsabilidad patrimonial por parte de la Administración."
  explanation:
    es: "El artículo 9.c) dice que esas reclamaciones, cuyo reconocimiento corresponde al titular del órgano u organismo al que se refiere la carta, «en ningún caso darán lugar a responsabilidad patrimonial por parte de la Administración». No hay excepción por daño evaluable. No se tramitan como recurso de alzada. Las medidas de subsanación de contenido económico son posibles, pero no obligatorias en todo caso."
  citation: "art. 9.c) RD 951/2005"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2005-14836-art-15
- id: m02-l01-q040
  prompt:
    es: "Según el artículo 15.2 del Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, los usuarios podrán formular sus quejas o sugerencias:"
  options:
  - id: a
    text:
      es: "Por correo postal y por medios telemáticos, pero no presencialmente."
  - id: b
    text:
      es: "Presencialmente y por correo postal, pero no por medios telemáticos."
  - id: c
    correct: true
    text:
      es: "Presencialmente, por correo postal y por medios telemáticos."
  - id: d
    text:
      es: "Presencialmente y por medios telemáticos, pero no por correo postal."
  explanation:
    es: "El artículo 15.2 admite los tres cauces: los usuarios podrán formular sus quejas o sugerencias «presencialmente, por correo postal y por medios telemáticos». Cada una de las otras opciones excluye uno de esos tres cauces."
  citation: "art. 15.2 RD 951/2005"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14836-art-15
- id: m02-l01-q041
  prompt:
    es: "Las quejas y sugerencias presentadas ante la Administración General del Estado por correo electrónico o a través de Internet:"
  options:
  - id: a
    text:
      es: "Deberán ratificarse presencialmente en el plazo de diez días hábiles."
  - id: b
    text:
      es: "Solo se admitirán si el interesado reside fuera de la localidad."
  - id: c
    correct: true
    text:
      es: "Deberán estar suscritas con la firma electrónica del interesado."
  - id: d
    text:
      es: "Deberán acompañarse de una declaración responsable del interesado."
  explanation:
    es: "El artículo 15.2 RD 951/2005 dice que las quejas y sugerencias presentadas por correo electrónico o a través de Internet «deberán estar suscritas con la firma electrónica del interesado». No exige ratificarlas en persona, no limita este cauce a quien vive fuera de la localidad y no pide una declaración responsable."
  citation: "art. 15.2 RD 951/2005"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2005-14836-art-15
- id: m02-l01-q042
  prompt:
    es: "Formulada una queja o sugerencia ante la Administración General del Estado, ¿a través de qué medio recibe el usuario constancia de su presentación?"
  options:
  - id: a
    text:
      es: "A través de la sede electrónica del departamento, en todo caso."
  - id: b
    text:
      es: "A través de correo postal certificado con acuse de recibo."
  - id: c
    text:
      es: "A través del tablón de anuncios de la unidad responsable."
  - id: d
    correct: true
    text:
      es: "A través del medio que el propio usuario indique."
  explanation:
    es: "El artículo 15.4 RD 951/2005 dice que, formuladas las quejas y sugerencias, los usuarios recibirán constancia de su presentación «a través del medio que indiquen». La norma no impone la sede electrónica, el correo certificado ni el tablón de anuncios; el medio lo elige el usuario."
  citation: "art. 15.4 RD 951/2005"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14836-art-16
- id: m02-l01-q043
  prompt:
    es: "La unidad responsable de las quejas y sugerencias de un Ministerio recibe una queja el jueves 7 de enero de 2027. Según el Real Decreto 951/2005, de 29 de julio, ¿hasta qué día tiene para informar al interesado de las actuaciones realizadas?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el jueves 4 de febrero de 2027."
  - id: b
    text:
      es: "Hasta el miércoles 27 de enero de 2027."
  - id: c
    text:
      es: "Hasta el miércoles 3 de febrero de 2027."
  - id: d
    text:
      es: "Hasta el sábado 30 de enero de 2027."
  explanation:
    es: "El artículo 16.1 da a la unidad «20 días hábiles» desde que recibe la queja. El cómputo empieza el día siguiente, viernes 8 de enero de 2027, y excluye sábados, domingos y festivos (art. 30.2 LPAC); entre el 8 de enero y el 4 de febrero no hay festivos nacionales. El vigésimo día hábil es el jueves 4 de febrero de 2027. El miércoles 27 de enero sale de contar 20 días naturales. El miércoles 3 de febrero sale de contar como primero el propio día de la recepción. El sábado 30 de enero sale de tratar los sábados como hábiles, y no lo son."
  citation: "art. 16.1 RD 951/2005"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2005-14836-art-16
- id: m02-l01-q044
  prompt:
    es: "Según el artículo 16.1 del Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, recibida la queja o sugerencia, la unidad responsable:"
  options:
  - id: a
    text:
      es: "Dictará resolución estimando o desestimando la queja en el plazo de 20 días hábiles."
  - id: b
    correct: true
    text:
      es: "Informará al interesado de las actuaciones realizadas en el plazo de 20 días hábiles."
  - id: c
    text:
      es: "Remitirá la queja a la Inspección General de Servicios en el plazo de 20 días hábiles."
  - id: d
    text:
      es: "Informará al interesado de las actuaciones realizadas cuando termine su tramitación."
  explanation:
    es: "El artículo 16.1 dice que la unidad «informará al interesado de las actuaciones realizadas en el plazo de 20 días hábiles». La queja no es un procedimiento que termine con una resolución estimatoria o desestimatoria. La Inspección General de Servicios interviene si no hay respuesta en plazo (art. 16.3), no por remisión de la unidad. El plazo es fijo, no el del final de la tramitación."
  citation: "art. 16.1 RD 951/2005"
  difficulty: 1
  tags:
  - "procedimiento"
  - "plazo"
# anchor: boe-a-2005-14836-art-16
- id: m02-l01-q045
  prompt:
    es: "¿Cuál de las siguientes afirmaciones es correcta sobre el plazo de contestación de una queja cuando la unidad responsable deba requerir aclaraciones al interesado?"
  options:
  - id: a
    text:
      es: "Volverá a contarse desde el principio, y el interesado formulará las aclaraciones en un plazo de 10 días hábiles."
  - id: b
    correct: true
    text:
      es: "Su transcurso se podrá suspender, y el interesado formulará las aclaraciones en un plazo de 10 días hábiles."
  - id: c
    text:
      es: "Seguirá corriendo sin interrupción, y el interesado formulará las aclaraciones en un plazo de 15 días hábiles."
  - id: d
    text:
      es: "Se ampliará hasta 40 días hábiles, y el interesado formulará las aclaraciones en un plazo de 10 días hábiles."
  explanation:
    es: "El artículo 16.2 RD 951/2005 dice que el transcurso del plazo «se podrá suspender» cuando deba requerirse al interesado para que, «en un plazo de 10 días hábiles», formule las aclaraciones necesarias. Suspender no es volver a contar desde el principio ni ampliar el plazo a 40 días. Que el plazo siga corriendo contradice la suspensión, y el interesado dispone de 10 días hábiles, no de 15."
  citation: "art. 16.2 RD 951/2005"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2005-14836-art-16
- id: m02-l01-q046
  prompt:
    es: "La unidad responsable de las quejas de un organismo autónomo notifica al interesado, el miércoles 3 de marzo de 2027, un requerimiento para que aclare su queja. Según el Real Decreto 951/2005, de 29 de julio, ¿hasta qué día puede formular las aclaraciones?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el miércoles 17 de marzo de 2027."
  - id: b
    text:
      es: "Hasta el lunes 15 de marzo de 2027."
  - id: c
    text:
      es: "Hasta el martes 16 de marzo de 2027."
  - id: d
    text:
      es: "Hasta el miércoles 24 de marzo de 2027."
  explanation:
    es: "El artículo 16.2 da al interesado «un plazo de 10 días hábiles» para formular las aclaraciones. El cómputo empieza el día siguiente a la notificación, jueves 4 de marzo de 2027, y excluye sábados, domingos y festivos (art. 30.2 LPAC); entre el 4 y el 17 de marzo no hay festivos nacionales. El décimo día hábil es el miércoles 17 de marzo de 2027. El lunes 15 de marzo sale de contar 10 días naturales, que acaban el sábado 13 y pasan al lunes. El martes 16 de marzo sale de contar como primero el propio día de la notificación. El miércoles 24 de marzo corresponde a 15 días hábiles."
  citation: "art. 16.2 RD 951/2005"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2005-14836-art-16
- id: m02-l01-q047
  prompt:
    es: "Si, transcurrido el plazo, el ciudadano no ha obtenido respuesta a su queja, ¿para qué puede dirigirse a la Inspección General de Servicios del departamento correspondiente?"
  options:
  - id: a
    text:
      es: "Para que dicte la resolución que la unidad no ha dictado."
  - id: b
    text:
      es: "Para interponer recurso de alzada contra la falta de respuesta."
  - id: c
    text:
      es: "Para solicitar una indemnización por el retraso en la respuesta."
  - id: d
    correct: true
    text:
      es: "Para conocer los motivos de la falta de contestación."
  explanation:
    es: "El artículo 16.3 RD 951/2005 dice que el ciudadano podrá dirigirse a la Inspección General de Servicios del departamento «para conocer los motivos de la falta de contestación» y «para que dicha Inspección proponga, en su caso, a los órganos competentes la adopción de las medidas oportunas». La Inspección propone medidas, no dicta la resolución que la unidad no ha dictado. El recurso de alzada no cabe contra la falta de respuesta: el artículo 19 dice que las quejas «no tendrán, en ningún caso, la calificación de recurso administrativo». Pedir una indemnización por el retraso no es ninguna de las dos finalidades del apartado: conocer los motivos y que la Inspección proponga medidas."
  citation: "art. 16.3 RD 951/2005"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2005-14836-art-16
- id: m02-l01-q048
  prompt:
    es: "¿Cuál de las siguientes actuaciones corresponde a la Inspección General de Servicios del departamento cuando un ciudadano se dirige a ella por no haber recibido respuesta a su queja?"
  options:
  - id: a
    text:
      es: "Contestar directamente la queja en lugar de la unidad responsable de su gestión."
  - id: b
    text:
      es: "Imponer una sanción disciplinaria al responsable de la unidad que no contestó."
  - id: c
    correct: true
    text:
      es: "Proponer, en su caso, a los órganos competentes la adopción de las medidas oportunas."
  - id: d
    text:
      es: "Remitir la queja al Defensor del Pueblo para que la tramite como queja propia."
  explanation:
    es: "El artículo 16.3 RD 951/2005 prevé que la Inspección «proponga, en su caso, a los órganos competentes la adopción de las medidas oportunas». Propone, no resuelve: no contesta la queja en lugar de la unidad ni impone sanciones. El artículo tampoco prevé remitir la queja al Defensor del Pueblo."
  citation: "art. 16.3 RD 951/2005"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2005-14836-art-17
- id: m02-l01-q049
  prompt:
    es: "¿De qué órganos, unidades y organismos hace la Inspección General de Servicios de cada departamento el seguimiento de las quejas y sugerencias?"
  options:
  - id: a
    correct: true
    text:
      es: "De los de su ámbito, tanto centrales como periféricos."
  - id: b
    text:
      es: "De los de su ámbito, solo cuando sean servicios centrales."
  - id: c
    text:
      es: "De los de su ámbito, solo cuando sean servicios periféricos."
  - id: d
    text:
      es: "De los de toda la Administración General del Estado."
  explanation:
    es: "El artículo 17.1 RD 951/2005 dice que la Inspección General de Servicios de cada departamento hará el seguimiento de las quejas y sugerencias relativas a los órganos, unidades y organismos «de su ámbito, tanto centrales como periféricos». Limitarlo a los centrales o a los periféricos contradice ese «tanto… como». Extenderlo a toda la Administración General del Estado sale del ámbito de cada departamento."
  citation: "art. 17.1 RD 951/2005"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2005-14836-art-17
- id: m02-l01-q050
  prompt:
    es: "El artículo 17.2 del Real Decreto 951/2005, de 29 de julio, atribuye a la Inspección General de Servicios del ministerio que llama «de Administraciones Públicas» el seguimiento de las quejas relativas a:"
  options:
  - id: a
    text:
      es: "Los servicios centrales de todos los departamentos ministeriales, sin excepción alguna."
  - id: b
    text:
      es: "Los organismos autónomos adscritos a cualquiera de los departamentos ministeriales."
  - id: c
    correct: true
    text:
      es: "Los servicios periféricos integrados en las Delegaciones y Subdelegaciones del Gobierno."
  - id: d
    text:
      es: "Las Entidades Gestoras y Servicios Comunes de la Seguridad Social, en su conjunto."
  explanation:
    es: "El artículo 17.2 dice que el seguimiento de las quejas y sugerencias «de los servicios periféricos integrados en las Delegaciones y Subdelegaciones del Gobierno» corresponderá a la Inspección General de Servicios del Ministerio que el texto llama «de Administraciones Públicas». Los servicios centrales, los organismos autónomos y las Entidades Gestoras y Servicios Comunes siguen la regla general del artículo 17.1: los sigue la Inspección de su propio departamento."
  citation: "art. 17.2 RD 951/2005"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: boe-a-2005-14836-art-17
- id: m02-l01-q051
  prompt:
    es: "¿Cuándo remite la unidad responsable de las quejas y sugerencias a la Inspección General de Servicios de su ministerio el informe global de las recibidas el año anterior?"
  options:
  - id: a
    text:
      es: "En el mes de marzo de cada año."
  - id: b
    text:
      es: "En el mes de junio de cada año."
  - id: c
    text:
      es: "En el mes de diciembre de cada año."
  - id: d
    correct: true
    text:
      es: "En el mes de enero de cada año."
  explanation:
    es: "El artículo 17.3 RD 951/2005 dice que la unidad remitirá a la Inspección General de Servicios de su ministerio, «en el mes de enero de cada año», un informe global de las quejas y sugerencias del año anterior, con copia de las contestaciones. Marzo, junio y diciembre no son el mes que fija el artículo."
  citation: "art. 17.3 RD 951/2005"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2005-14836-art-19
- id: m02-l01-q052
  prompt:
    es: "Un interesado presenta una queja sobre la tramitación de su expediente cuando le quedan cinco días para recurrir en alzada la resolución. Según el Real Decreto 951/2005, de 29 de julio, ¿qué ocurre con ese plazo de recurso?"
  options:
  - id: a
    text:
      es: "Se interrumpe y vuelve a contarse desde que se conteste la queja."
  - id: b
    correct: true
    text:
      es: "Sigue corriendo, porque la presentación de la queja no interrumpe los plazos."
  - id: c
    text:
      es: "Se suspende mientras la unidad responsable tramita la queja."
  - id: d
    text:
      es: "Se amplía en 20 días hábiles, el plazo para contestar la queja."
  explanation:
    es: "El artículo 19 dice que la presentación de las quejas no «interrumpirá los plazos establecidos en la normativa vigente», y que las quejas no condicionan el ejercicio de las restantes acciones de los interesados. El plazo del recurso de alzada sigue corriendo. Interrumpirlo, suspenderlo mientras se tramita la queja o ampliarlo en el plazo de contestación contradice ese artículo."
  citation: "art. 19 RD 951/2005"
  difficulty: 2
  tags:
  - "efecto"
