  - id: c
    text:
      en: The number of connections in the pool
  - id: d
    correct: true
    text:
      en: Zero
  explanation:
    en: The effective spindle count is zero if the active data set is fully cached. One is wrong because the page
      gives zero for a fully cached data set. The number of CPU cores is wrong for the same reason, since the value
      is zero. The pool's connection count is wrong because it is the result of the formula, not an input, and the
      spindle count for a fully cached data set is zero.
  citation: hikaricp-pool-sizing#connections--core_count--2--effective_spindle_count
  extract:
