# anchor: celex-32009d0937-art-1
- id: m01-l10-q085
  prompt:
    es: "Señale la respuesta correcta sobre la Presidencia del Consejo, con excepción de la formación de Asuntos Exteriores, según el Reglamento interno del Consejo aprobado por la Decisión 2009/937/UE:"
