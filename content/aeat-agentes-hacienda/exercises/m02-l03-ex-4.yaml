# anchor: boe-a-2015-10565-art-21
- id: m02-l03-q0017
  prompt:
    es: "Conforme al artículo 21.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el plazo máximo para notificar la resolución expresa que fije la norma reguladora del procedimiento:"
  options:
  - id: a
    text:
      es: "No podrá exceder de seis meses en ningún caso, aunque una norma con rango de Ley o el Derecho de la Unión Europea prevean otro."
  - id: b
    text:
      es: "No podrá exceder de seis meses, salvo que una norma reglamentaria establezca uno mayor o lo prevea el Derecho de la Unión Europea."
  - id: c
    correct: true
    text:
      es: "No podrá exceder de seis meses, salvo que una norma con rango de Ley establezca uno mayor o lo prevea el Derecho de la Unión Europea."
  - id: d
    text:
      es: "No podrá exceder de un año, salvo que una norma con rango de Ley establezca uno mayor o lo prevea el Derecho de la Unión Europea."
  explanation:
    es: "El artículo 21.2 dice que el plazo «no podrá exceder de seis meses salvo que una norma con rango de Ley establezca uno mayor o así venga previsto en el Derecho de la Unión Europea». El límite admite esas dos salvedades, así que no es absoluto. Un reglamento no puede superarlo. El límite es de seis meses, no de un año."
  citation: "art. 21.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-10565-art-21
- id: m02-l03-q0018
  prompt:
    es: "Según el artículo 21.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿desde cuándo se cuenta el plazo máximo para resolver en los procedimientos iniciados de oficio?"
  options:
  - id: a
    text:
      es: "Desde la notificación del acuerdo de iniciación."
  - id: b
    correct: true
    text:
      es: "Desde la fecha del acuerdo de iniciación."
  - id: c
    text:
      es: "Desde la publicación del acuerdo de iniciación."
  - id: d
    text:
      es: "Desde el día siguiente a la primera actuación de instrucción."
  explanation:
    es: "En los procedimientos iniciados de oficio el plazo se cuenta «desde la fecha del acuerdo de iniciación» (art. 21.3.a). No se cuenta desde su notificación ni desde su publicación, ni desde la primera actuación de instrucción."
  citation: "art. 21.3 LPAC"
  difficulty: 1
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-22
- id: m02-l03-q0020
  prompt:
    es: "De acuerdo con el artículo 22.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si se solicitan informes preceptivos a otro órgano, el plazo máximo para resolver:"
  options:
  - id: a
    text:
      es: "Se suspenderá necesariamente entre la petición y la recepción del informe, sin límite de tiempo alguno."
  - id: b
    correct: true
    text:
      es: "Podrá suspenderse entre la petición y la recepción del informe, sin que la suspensión pueda exceder de tres meses."
  - id: c
    text:
      es: "Podrá suspenderse entre la petición y la recepción del informe, sin que la suspensión exceda de seis meses."
  - id: d
    text:
      es: "Se ampliará en un tiempo igual al que medie entre la petición del informe preceptivo y su recepción."
  explanation:
    es: "El artículo 22.1.d) dice que el plazo «se podrá suspender» por el tiempo entre la petición y la recepción del informe, y que la suspensión «no podrá exceder en ningún caso de tres meses». La suspensión no es obligatoria ni ilimitada, y su tope no es de seis meses. La ley habla de suspensión, no de ampliación del plazo."
  citation: "art. 22.1.d) LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-10565-art-22
- id: m02-l03-q0021
  prompt:
    es: "De acuerdo con el artículo 22.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando los interesados promuevan la recusación, el transcurso del plazo máximo para resolver:"
  options:
  - id: a
    text:
      es: "Se suspenderá desde que se plantee hasta que la resuelva el propio recusado, previo informe."
  - id: b
    correct: true
    text:
      es: "Se suspenderá desde que se plantee hasta que la resuelva el superior jerárquico del recusado."
  - id: c
    text:
      es: "Podrá suspenderse, si el instructor lo acuerda, hasta que el recusado manifieste si concurre la causa."
  - id: d
    text:
      es: "No se suspenderá, porque las cuestiones incidentales no suspenden la tramitación."
  explanation:
    es: "El artículo 22.2.c) dice que el plazo se suspende cuando se promueve la recusación, «desde que ésta se plantee hasta que sea resuelta por el superior jerárquico del recusado». No la resuelve el recusado. La suspensión no depende del instructor. La recusación es justo la cuestión incidental que sí suspende la tramitación (art. 74)."
  citation: "art. 22.2.c) LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-2015-10565-art-23
- id: m02-l03-q0022
  prompt:
    es: "De acuerdo con el artículo 23 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, agotados los medios personales y materiales disponibles, la ampliación del plazo máximo de resolución y notificación:"
  options:
  - id: a
    text:
      es: "Se acordará de manera motivada, sin superar la mitad del plazo establecido, y contra ella no cabe recurso."
  - id: b
    text:
      es: "Se acordará de manera motivada, sin superar el plazo establecido, y contra ella cabe recurso de alzada."
  - id: c
    text:
      es: "Se acordará sin necesidad de motivación, sin superar el plazo establecido, y contra ella no cabe recurso."
  - id: d
    correct: true
    text:
      es: "Se acordará de manera motivada, sin superar el plazo establecido para la tramitación, y contra ella no cabe recurso."
  explanation:
    es: "El artículo 23 permite acordar «de manera motivada» la ampliación del plazo máximo, «no pudiendo ser éste superior al establecido para la tramitación del procedimiento», y contra ese acuerdo «no cabrá recurso alguno». El límite de la mitad del plazo es el de la ampliación de plazos del artículo 32.1, otra figura. No cabe alzada y la motivación es obligatoria."
  citation: "art. 23 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2015-10565-art-22
- id: m02-l03-q0028
  prompt:
    es: "¿En cuál de los siguientes casos se suspende necesariamente, y no solo de forma potestativa, el plazo máximo para resolver, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando el órgano competente decide realizar actuaciones complementarias."
  - id: b
    text:
      es: "Cuando se requiere al interesado para que subsane deficiencias de su solicitud."
  - id: c
    text:
      es: "Cuando se solicita un informe preceptivo a un órgano de otra Administración."
  - id: d
    text:
      es: "Cuando el instructor acuerda la apertura de un período de prueba ordinario."
  explanation:
    es: "El artículo 22.2 enumera los casos en que el plazo «se suspenderá», y entre ellos está la decisión de realizar actuaciones complementarias del artículo 87; el propio artículo 87 dice que el plazo «quedará suspendido». El requerimiento de subsanación y el informe preceptivo están en el artículo 22.1, donde el plazo «se podrá suspender». La apertura de un período de prueba ordinario no figura entre las causas de suspensión."
  citation: "art. 22.2.b) LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-10565-art-22
- id: m02-l03-q0040
  prompt:
    es: "Según el artículo 22.1.a) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el plazo máximo para resolver se suspende al requerir la subsanación de deficiencias, por el tiempo que medie entre:"
  options:
  - id: a
    text:
      es: "La presentación de la solicitud y la notificación del requerimiento."
  - id: b
    correct: true
    text:
      es: "La notificación del requerimiento y su efectivo cumplimiento por el destinatario."
  - id: c
    text:
      es: "La notificación del requerimiento y la propuesta de resolución."
  - id: d
    text:
      es: "La solicitud de informes y la recepción del último de ellos."
  explanation:
    es: "El artículo 22.1.a) suspende el plazo desde la notificación del requerimiento hasta su efectivo cumplimiento por el destinatario. No cuenta el tiempo anterior al requerimiento, ni llega hasta la propuesta de resolución, y la espera de informes es otra causa de suspensión, la de la letra d)."
  citation: "art. 22.1.a) LPAC"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-21
- id: m02-l03-q0044
  prompt:
    es: "Según el artículo 21.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando la norma reguladora de un procedimiento sancionador iniciado de oficio no fije el plazo máximo, este será:"
  options:
  - id: a
    text:
      es: "de dos meses, contados desde que el acuerdo de iniciación se notifique al presunto responsable."
  - id: b
    text:
      es: "de un mes, contado desde la fecha de la propuesta de resolución."
  - id: c
    correct: true
    text:
      es: "de tres meses, contados desde la fecha del acuerdo de iniciación."
  - id: d
    text:
      es: "de tres meses, contados desde que concluya la instrucción del procedimiento."
  explanation:
    es: "El artículo 21.3 fija tres meses cuando la norma reguladora no señala plazo, y en los procedimientos iniciados de oficio se cuentan «desde la fecha del acuerdo de iniciación». Contar desde la notificación del acuerdo, desde la propuesta de resolución o desde el fin de la instrucción no es el inicio que marca el artículo, y dos meses o un mes no son el plazo supletorio."
  citation: "art. 21.3 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-21
- id: m02-l03-q0111
  prompt:
    es: "Según el artículo 21.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿desde cuándo se cuenta el plazo máximo para resolver en los procedimientos iniciados a solicitud del interesado?"
  options:
  - id: a
    text:
      es: "Desde la fecha en que el órgano instructor admita a trámite la solicitud presentada por el interesado."
  - id: b
    text:
      es: "Desde el día siguiente a aquel en que se notifique al interesado el requerimiento de subsanación."
  - id: c
    text:
      es: "Desde la fecha de la solicitud, aunque haya entrado después en el registro del órgano competente."
  - id: d
    correct: true
    text:
      es: "Desde la fecha en que la solicitud haya tenido entrada en el registro electrónico de la Administración u Organismo competente para su tramitación."
  explanation:
    es: "El artículo 21.3.b) cuenta el plazo desde que la solicitud tiene entrada en el registro electrónico de la Administración u Organismo competente para tramitarla. No cuenta desde que el instructor la admite, ni desde el requerimiento de subsanación, ni desde la fecha que figure en la propia solicitud."
  citation: "art. 21.3 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-21
- id: m02-l03-q0112
  prompt:
    es: "La solicitud de doña Clara tiene entrada en el registro electrónico del órgano competente el martes 10 de marzo de 2026. La norma reguladora del procedimiento no fija plazo máximo para resolver. Según el artículo 21 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo vence el plazo para notificar la resolución expresa?"
  options:
  - id: a
    text:
      es: "El martes 9 de junio de 2026."
  - id: b
    text:
      es: "El jueves 11 de junio de 2026."
  - id: c
    correct: true
    text:
      es: "El miércoles 10 de junio de 2026."
  - id: d
    text:
      es: "El jueves 10 de septiembre de 2026."
  explanation:
    es: "Si la norma no fija plazo, el artículo 21.3 lo establece en tres meses desde la entrada de la solicitud en el registro. Un plazo en meses concluye el mismo día del mes de vencimiento (artículo 30.4): el 10 de junio, miércoles y hábil. El 9 de junio sale de contar el día de entrada como primero, el 11 de junio de añadir un día más al mes completo, y el 10 de septiembre de aplicar seis meses, que es el máximo y no el plazo supletorio."
  citation: "art. 21.3 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-21
- id: m02-l03-q0113
  prompt:
    es: "De acuerdo con el artículo 21.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los casos de prescripción, renuncia del derecho, caducidad del procedimiento o desistimiento de la solicitud, la resolución consistirá en:"
  options:
  - id: a
    text:
      es: "el archivo de las actuaciones, sin necesidad de indicar los hechos producidos ni las normas aplicables."
  - id: b
    correct: true
    text:
      es: "la declaración de la circunstancia que concurra en cada caso, con indicación de los hechos producidos y las normas aplicables."
  - id: c
    text:
      es: "la declaración de nulidad del procedimiento, con retroacción de las actuaciones al momento de iniciarse."
  - id: d
    text:
      es: "una resolución sobre el fondo, que decida las cuestiones planteadas por el interesado."
  explanation:
    es: "El artículo 21.1 manda dictar resolución que declare la circunstancia que concurra (prescripción, renuncia, caducidad o desistimiento), indicando los hechos producidos y las normas aplicables. No basta un archivo sin esa indicación, ni procede declarar la nulidad con retroacción, ni resolver sobre el fondo, porque esas circunstancias ponen fin al procedimiento sin entrar en él."
  citation: "art. 21.1 LPAC"
  difficulty: 2
  tags:
  - "resolución"
  - "terminación"
# anchor: boe-a-2015-10565-art-22
- id: m02-l03-q0116
  prompt:
    es: "Según el artículo 22.1.d) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si se suspende el plazo máximo para resolver por la solicitud de informes preceptivos y no se recibe el informe en el plazo máximo de suspensión:"
  options:
  - id: a
    text:
      es: "se archivará el procedimiento por caducidad."
  - id: b
    text:
      es: "se entenderá emitido el informe en sentido favorable."
  - id: c
    text:
      es: "se prorrogará la suspensión hasta que se reciba el informe."
  - id: d
    correct: true
    text:
      es: "proseguirá el procedimiento."
  explanation:
    es: "El artículo 22.1.d) limita la suspensión a tres meses y añade que, si el informe no se recibe en ese plazo, proseguirá el procedimiento. No hay caducidad ni informe favorable presunto, y la suspensión no se prolonga hasta la recepción."
  citation: "art. 22.1.d) LPAC"
  difficulty: 1
  tags:
  - "suspensión"
  - "plazo"
# anchor: boe-a-2015-10565-art-22
- id: m02-l03-q0117
  prompt:
    es: "Cuando se suspende el plazo máximo para resolver por solicitar informes preceptivos a otro órgano, ¿qué debe comunicarse a los interesados, según el artículo 22.1.d) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Solo la petición del informe, pero no su recepción."
  - id: b
    text:
      es: "Solo la recepción del informe, pero no su petición."
  - id: c
    correct: true
    text:
      es: "Tanto la petición del informe como su recepción."
  - id: d
    text:
      es: "Ninguna actuación, porque la suspensión opera de pleno derecho."
  explanation:
    es: "El artículo 22.1.d) dice que la petición debe comunicarse a los interesados y que la recepción del informe también debe comunicarse. Por eso no basta comunicar solo una de las dos, ni cabe prescindir de toda comunicación alegando que la suspensión opera sin más."
  citation: "art. 22.1.d) LPAC"
  difficulty: 1
  tags:
  - "suspensión"
  - "comunicación"
# anchor: boe-a-2015-10565-art-22
- id: m02-l03-q0118
  prompt:
    es: "De acuerdo con el artículo 22.1.a) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el plazo máximo para resolver puede suspenderse mientras se atiende un requerimiento de subsanación y, si este no se cumple, por el tiempo que medie hasta:"
  options:
  - id: a
    text:
      es: "el transcurso de diez días desde la notificación del requerimiento."
  - id: b
    correct: true
    text:
      es: "el vencimiento del plazo concedido para cumplirlo."
  - id: c
    text:
      es: "el agotamiento del plazo máximo de tres meses de suspensión."
  - id: d
    text:
      es: "la declaración de caducidad del procedimiento."
  explanation:
    es: "Según el artículo 22.1.a), la suspensión dura entre la notificación del requerimiento y su efectivo cumplimiento o, en su defecto, el plazo concedido. El tope de tres meses es el de los informes preceptivos de la letra d), no el de los requerimientos, y los diez días no son un plazo fijo. La caducidad es un efecto distinto, no el término de la suspensión."
  citation: "art. 22.1.a) LPAC"
  difficulty: 1
  tags:
  - "suspensión"
  - "plazo"
# anchor: boe-a-2015-10565-art-22
- id: m02-l03-q0119
  prompt:
    es: "Conforme al artículo 22.2.b) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando el órgano competente decide realizar actuaciones complementarias, el plazo máximo para resolver se suspende desde que se notifica a los interesados el acuerdo motivado de inicio de las actuaciones hasta:"
  options:
  - id: a
    text:
      es: "que los interesados presenten sus alegaciones tras ellas."
  - id: b
    correct: true
    text:
      es: "que se produzca su terminación."
  - id: c
    text:
      es: "que se dicte la propuesta de resolución."
  - id: d
    text:
      es: "que transcurra el plazo máximo de quince días desde su inicio."
  explanation:
    es: "El artículo 22.2.b) suspende el plazo hasta que se produzca la terminación de las actuaciones complementarias. No hasta las alegaciones de los interesados, que llegan después, ni hasta la propuesta de resolución, ni por el solo transcurso de los quince días, que son un máximo para practicarlas y no el término de la suspensión."
  citation: "art. 22.2.b) LPAC"
  difficulty: 1
  tags:
  - "suspensión"
  - "actuaciones complementarias"
# anchor: boe-a-2015-10565-art-23
- id: m02-l03-q0121
  prompt:
    es: "De acuerdo con el artículo 23.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, excepcionalmente puede ampliarse el plazo máximo de resolución y notificación cuando se hayan agotado:"
  options:
  - id: a
    text:
      es: "los recursos presupuestarios asignados al procedimiento por el órgano instructor y por el competente para resolver."
  - id: b
    text:
      es: "los plazos de suspensión del plazo máximo previstos en el artículo 22."
  - id: c
    text:
      es: "los trámites de subsanación y mejora de la solicitud del interesado."
  - id: d
    correct: true
    text:
      es: "los medios personales y materiales disponibles a los que se refiere el artículo 21.5."
  explanation:
    es: "El artículo 23.1 exige haber agotado los medios personales y materiales disponibles a los que se refiere el apartado 5 del artículo 21, esto es, los que el órgano competente puede habilitar para cumplir el plazo. No lo condiciona a agotar recursos presupuestarios, plazos de suspensión ni trámites de subsanación."
  citation: "art. 23 LPAC"
  difficulty: 2
  tags:
  - "ampliación"
  - "condición"
# anchor: boe-a-2015-10565-art-25
- id: m02-l03-q0123
  prompt:
    es: "Según el artículo 25.1.b) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando se produce la caducidad de un procedimiento iniciado de oficio en que se ejercen potestades sancionadoras, la resolución que la declare ordenará:"
  options:
  - id: a
    text:
      es: "la devolución del expediente al instructor para que dicte resolución expresa."
  - id: b
    text:
      es: "el inicio inmediato de un nuevo procedimiento sobre los mismos hechos."
  - id: c
    correct: true
    text:
      es: "el archivo de las actuaciones, con los efectos previstos para la caducidad."
  - id: d
    text:
      es: "la prórroga del plazo máximo para resolver por otros tres meses."
  explanation:
    es: "El artículo 25.1.b) dice que la resolución que declare la caducidad ordenará el archivo de las actuaciones, con los efectos del artículo 95. No ordena devolver el expediente para resolver, ni iniciar otro procedimiento, ni prorrogar el plazo, porque la caducidad pone fin al procedimiento."
  citation: "art. 25.1.b) LPAC"
  difficulty: 1
  tags:
  - "caducidad"
  - "efectos"
