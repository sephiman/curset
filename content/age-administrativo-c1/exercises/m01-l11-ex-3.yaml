# anchor: celex-12016m-txt-art-19
- id: m01-l11-q040
  prompt:
    es: "¿Cuál de las siguientes recoge los órganos que comprende el Tribunal de Justicia de la Unión Europea según el Tratado de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "El Tribunal de Justicia, el Tribunal General y los tribunales especializados."
  - id: b
    text:
      es: "El Tribunal de Justicia, el Tribunal General y el Tribunal de Cuentas."
  - id: c
    text:
      es: "El Tribunal de Justicia y el Tribunal General, sin tribunales especializados."
  - id: d
    text:
      es: "El Tribunal de Justicia, el Tribunal General y los tribunales constitucionales nacionales."
  explanation:
    es: "El artículo 19.1 TUE dice que el Tribunal de Justicia de la Unión Europea «comprenderá el Tribunal de Justicia, el Tribunal General y los tribunales especializados». El Tribunal de Cuentas es otra institución (art. 13.1 TUE). Los tribunales especializados sí forman parte. Los tribunales nacionales no forman parte de la institución."
  citation: "art. 19.1 TUE"
  difficulty: 2
  tags:
  - "estructura"
# anchor: celex-12016m-txt-art-19
- id: m01-l11-q041
  prompt:
    es: "¿Cuál de las siguientes describe la composición del Tribunal de Justicia según el Tratado de la Unión Europea?"
  options:
  - id: a
    text:
      es: "Dos jueces por Estado miembro, asistidos por abogados generales."
  - id: b
    correct: true
    text:
      es: "Un juez por Estado miembro, asistido por abogados generales."
  - id: c
    text:
      es: "Un juez por Estado miembro, sin abogados generales."
  - id: d
    text:
      es: "Quince jueces elegidos por rotación entre los Estados miembros, asistidos por abogados generales."
  explanation:
    es: "El artículo 19.2 TUE dice que «el Tribunal de Justicia estará compuesto por un juez por Estado miembro» y que «estará asistido por abogados generales». Dos jueces por Estado es la cifra actual del Tribunal General, no del Tribunal de Justicia. Los abogados generales sí existen. Quince jueces elegidos por rotación no es la composición que fija el artículo."
  citation: "art. 19.2 TUE"
  difficulty: 1
  tags:
  - "composición"
# anchor: celex-12016e-txt-art-252
- id: m01-l11-q042
  prompt:
    es: "Según el artículo 252 del Tratado de Funcionamiento de la Unión Europea, ¿por cuántos abogados generales estará asistido el Tribunal de Justicia?"
  options:
  - id: a
    text:
      es: "Por once abogados generales, número que solo puede cambiar una reforma del Tratado."
  - id: b
    text:
      es: "Por ocho abogados generales, número que el Parlamento Europeo puede aumentar por mayoría de sus miembros."
  - id: c
    correct: true
    text:
      es: "Por ocho abogados generales, número que el Consejo puede aumentar por unanimidad a petición del Tribunal."
  - id: d
    text:
      es: "Por un abogado general por cada Estado miembro."
  explanation:
    es: "El artículo 252 TFUE dice que el Tribunal de Justicia «estará asistido por ocho abogados generales» y que, si el Tribunal lo solicita, «el Consejo, por unanimidad, podrá aumentar» su número. Once es la cifra que da la Curia a fecha de 16-10-2026, no la del Tratado. No decide el Parlamento. El Tratado no fija un abogado general por Estado."
  citation: "art. 252 TFUE"
  difficulty: 2
  tags:
  - "cantidad"
  - "composición"
# anchor: fuente-curia-tribunal-de-justicia-html
- id: m01-l11-q043
  prompt:
    es: "A fecha de 16 de octubre de 2026, ¿con cuántos jueces y abogados generales cuenta el Tribunal de Justicia, según su página de presentación en la web de la Curia?"
  options:
  - id: a
    text:
      es: "Con 27 jueces y 8 abogados generales."
  - id: b
    text:
      es: "Con 54 jueces y 11 abogados generales."
  - id: c
    text:
      es: "Con 28 jueces y 11 abogados generales."
  - id: d
    correct: true
    text:
      es: "Con 27 jueces y 11 abogados generales."
  explanation:
    es: "La página de presentación del Tribunal de Justicia en la Curia, consultada el 16-10-2026, dice que «cuenta con 27 Jueces y 11 Abogados Generales». Ocho es el número de abogados generales que fija el artículo 252 TFUE, no la cifra de la página. Cincuenta y cuatro son los jueces del Tribunal General. Veintiocho no es la cifra de la página."
  citation: "fuente: `curia-tribunal-de-justicia.html`"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: celex-12016e-txt-art-253
- id: m01-l11-q044
  prompt:
    es: "De acuerdo con el artículo 253 del Tratado de Funcionamiento de la Unión Europea, los jueces y abogados generales del Tribunal de Justicia serán designados de común acuerdo por los Gobiernos de los Estados miembros:"
  options:
  - id: a
    correct: true
    text:
      es: "Por un período de seis años, con una renovación parcial cada tres años."
  - id: b
    text:
      es: "Por un período de seis años, con una renovación total al término de ese período."
  - id: c
    text:
      es: "Por un período de nueve años, con una renovación parcial cada tres años."
  - id: d
    text:
      es: "Por un período de cinco años, coincidente con la legislatura del Parlamento Europeo."
  explanation:
    es: "El artículo 253 TFUE dice que se designan «por un período de seis años» y que «cada tres años tendrá lugar una renovación parcial de los jueces y abogados generales». La renovación no es total. Nueve años cambia el período. Cinco años es el mandato de los diputados (art. 14.3 TUE) y de la Comisión (art. 17.3 TUE)."
  citation: "art. 253 TFUE"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: fuente-curia-tribunal-general-html
- id: m01-l11-q045
  prompt:
    es: "A fecha de 16 de octubre de 2026, según su página de presentación en la web de la Curia, el Tribunal General cuenta con:"
  options:
  - id: a
    text:
      es: "27 jueces, uno por cada Estado miembro."
  - id: b
    correct: true
    text:
      es: "54 jueces, dos por cada Estado miembro."
  - id: c
    text:
      es: "81 jueces, tres por cada Estado miembro."
  - id: d
    text:
      es: "28 jueces, uno por cada Estado miembro más su Presidente."
  explanation:
    es: "La página de presentación del Tribunal General en la Curia, consultada el 16-10-2026, dice que «cuenta con 54 Jueces, dos por cada Estado miembro». Veintisiete jueces, uno por Estado, es la composición del Tribunal de Justicia y el mínimo que exige el artículo 19.2 TUE para el Tribunal General. Ochenta y uno y veintiocho no son cifras de la página."
  citation: "fuente: `curia-tribunal-general.html`"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: celex-12016e-pro-03-art-50-ter
- id: m01-l11-q046
  prompt:
    es: "De acuerdo con el artículo 50 ter del Estatuto del Tribunal de Justicia de la Unión Europea, el Tribunal General conoce de las peticiones de decisión prejudicial comprendidas exclusivamente en materias como:"
  options:
  - id: a
    text:
      es: "La interpretación de la Carta de los Derechos Fundamentales de la Unión Europea."
  - id: b
    text:
      es: "Los principios generales del Derecho de la Unión y el Derecho internacional público."
  - id: c
    correct: true
    text:
      es: "El sistema común del impuesto sobre el valor añadido y el código aduanero."
  - id: d
    text:
      es: "La interpretación del Derecho primario de la Unión."
  explanation:
    es: "El artículo 50 ter del Estatuto enumera, entre las materias del Tribunal General, «el sistema común del impuesto sobre el valor añadido» y «el código aduanero». La Carta, los principios generales, el Derecho internacional público y el Derecho primario son justo las cuestiones independientes de interpretación para las que «el Tribunal de Justicia seguirá siendo competente»."
  citation: "art. 50 ter Estatuto del Tribunal de Justicia de la Unión Europea, Protocolo n.º 3"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
# anchor: celex-12016e-txt-art-258
- id: m01-l11-q047
  prompt:
    es: "De acuerdo con el artículo 258 del Tratado de Funcionamiento de la Unión Europea, si la Comisión estima que un Estado miembro ha incumplido una de las obligaciones que le incumben en virtud de los Tratados:"
  options:
  - id: a
    text:
      es: "Podrá imponerle directamente una multa coercitiva, sin necesidad de recurrir al Tribunal de Justicia de la Unión Europea."
  - id: b
    text:
      es: "Emitirá una recomendación y, si el Estado no la sigue en tres meses, el Consejo podrá recurrir al Tribunal de Justicia."
  - id: c
    text:
      es: "Deberá someter el asunto al Consejo Europeo, que decidirá por unanimidad sobre el incumplimiento."
  - id: d
    correct: true
    text:
      es: "Emitirá un dictamen motivado y, si el Estado no se atiene a él en el plazo que determine, podrá recurrir al Tribunal de Justicia de la Unión Europea."
  explanation:
    es: "El artículo 258 TFUE dice que la Comisión «emitirá un dictamen motivado» y que, si el Estado «no se atuviere a este dictamen en el plazo determinado por la Comisión, ésta podrá recurrir al Tribunal de Justicia de la Unión Europea». La Comisión no impone multas por sí misma: solo propone su importe en el procedimiento del artículo 260.2 TFUE. Lo que emite es un dictamen, no una recomendación, y recurre ella, no el Consejo. El Consejo Europeo no interviene."
  citation: "art. 258 TFUE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: celex-12016e-txt-art-263
- id: m01-l11-q048
  prompt:
    es: "Según el artículo 263 del Tratado de Funcionamiento de la Unión Europea, ¿en qué plazo deberá interponerse el recurso de anulación?"
  options:
  - id: a
    correct: true
    text:
      es: "En el plazo de dos meses desde la publicación del acto, su notificación o, a falta de ello, desde que se tuvo conocimiento."
  - id: b
    text:
      es: "En el plazo de un mes desde la publicación del acto, su notificación o, a falta de ello, desde que se tuvo conocimiento."
  - id: c
    text:
      es: "En el plazo de tres meses desde la publicación del acto, su notificación o, a falta de ello, desde que se tuvo conocimiento."
  - id: d
    text:
      es: "En el plazo de seis meses desde la publicación del acto, su notificación o, a falta de ello, desde que se tuvo conocimiento."
  explanation:
    es: "El artículo 263 TFUE dice que los recursos «deberán interponerse en el plazo de dos meses a partir, según los casos, de la publicación del acto, de su notificación al recurrente o, a falta de ello, desde el día en que éste haya tenido conocimiento del mismo». Uno, tres y seis meses no son el plazo del artículo. Tres meses es el plazo de la Comisión para emitir dictamen en el recurso entre Estados (art. 259 TFUE)."
  citation: "art. 263 TFUE"
  difficulty: 2
  tags:
  - "plazo"
# anchor: celex-12016e-txt-art-264
- id: m01-l11-q049
  prompt:
    es: "Cuando el recurso de anulación interpuesto ante él es fundado, el Tribunal de Justicia de la Unión Europea:"
  options:
  - id: a
    text:
      es: "Ordenará a la institución autora que modifique el acto en el plazo que fije."
  - id: b
    correct: true
    text:
      es: "Declarará nulo y sin valor ni efecto alguno el acto impugnado."
  - id: c
    text:
      es: "Declarará el acto inaplicable solo respecto del recurrente."
  - id: d
    text:
      es: "Remitirá el acto al Parlamento Europeo para que proceda a su derogación."
  explanation:
    es: "El artículo 264 TFUE dice que, si el recurso fuere fundado, el Tribunal «declarará nulo y sin valor ni efecto alguno el acto impugnado». No ordena modificarlo, no limita la nulidad al recurrente y no remite el acto a otra institución."
  citation: "art. 264 TFUE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: celex-12016e-txt-art-3
- id: m01-l11-q050
  prompt:
    es: "De acuerdo con el artículo 3 del Tratado de Funcionamiento de la Unión Europea, la Unión dispondrá de competencia exclusiva en:"
  options:
  - id: a
    text:
      es: "La coordinación de las políticas económicas de todos los Estados miembros."
  - id: b
    text:
      es: "La protección de los consumidores."
  - id: c
    correct: true
    text:
      es: "La política monetaria de los Estados miembros cuya moneda es el euro."
  - id: d
    text:
      es: "La cohesión económica, social y territorial."
  explanation:
    es: "El artículo 3.1.c) TFUE incluye entre los ámbitos de competencia exclusiva «la política monetaria de los Estados miembros cuya moneda es el euro». Las políticas económicas las coordinan los Estados miembros en el seno de la Unión (art. 2.3 TFUE). La protección de los consumidores y la cohesión económica, social y territorial son competencias compartidas (art. 4.2 TFUE)."
  citation: "art. 3.1 TFUE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: celex-12016e-txt-art-3
- id: m01-l11-q051
  prompt:
    es: "¿Cuál de las siguientes enumeraciones contiene solo ámbitos de competencia exclusiva de la Unión según el Tratado de Funcionamiento de la Unión Europea?"
  options:
  - id: a
    text:
      es: "La unión aduanera, la política comercial común y el mercado interior."
  - id: b
    text:
      es: "La política comercial común, la energía y la política monetaria de los Estados cuya moneda es el euro."
  - id: c
    text:
      es: "La unión aduanera, la agricultura y la pesca y la política comercial común."
  - id: d
    correct: true
    text:
      es: "La unión aduanera, la política comercial común y la conservación de los recursos biológicos marinos dentro de la política pesquera común."
  explanation:
    es: "El artículo 3.1 TFUE incluye «la unión aduanera», «la conservación de los recursos biológicos marinos dentro de la política pesquera común» y «la política comercial común». El mercado interior y la energía son competencias compartidas (art. 4.2 TFUE). La agricultura y la pesca también lo son, con exclusión de la conservación de los recursos biológicos marinos."
  citation: "art. 3.1 TFUE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: celex-12016e-txt-art-4
- id: m01-l11-q052
  prompt:
    es: "¿Qué tipo de competencia tiene la Unión en el ámbito de la energía, según el Tratado de Funcionamiento de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "Una competencia compartida con los Estados miembros."
  - id: b
    text:
      es: "Una competencia exclusiva de la Unión."
  - id: c
    text:
      es: "Una competencia para llevar a cabo acciones de apoyo, coordinación o complemento."
  - id: d
    text:
      es: "Ninguna competencia, porque la energía corresponde solo a los Estados miembros."
  explanation:
    es: "El artículo 4.2.i) TFUE incluye «la energía» entre los ámbitos principales de las competencias compartidas entre la Unión y los Estados miembros. La competencia exclusiva queda para los cinco ámbitos del artículo 3.1: unión aduanera, normas de competencia del mercado interior, política monetaria del euro, conservación de los recursos biológicos marinos y política comercial común. La energía no es ninguno. Las acciones de apoyo, coordinación o complemento del artículo 6 se refieren a salud, industria, cultura, turismo, educación, protección civil y cooperación administrativa, y tampoco incluyen la energía. Decir que no hay competencia de la Unión contradice el propio artículo 4.2.i), que la atribuye."
  citation: "art. 4.2 TFUE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: celex-12016e-txt-art-2
- id: m01-l11-q054
  prompt:
    es: "De acuerdo con el artículo 2 del Tratado de Funcionamiento de la Unión Europea, en un ámbito de competencia exclusiva de la Unión, los Estados miembros:"
  options:
  - id: a
    text:
      es: "Podrán legislar en la medida en que la Unión no haya ejercido su competencia."
  - id: b
    text:
      es: "Podrán legislar libremente siempre que respeten el principio de proporcionalidad."
  - id: c
    correct: true
    text:
      es: "Únicamente podrán legislar y adoptar actos jurídicamente vinculantes si son facultados por la Unión o para aplicar actos de la Unión."
  - id: d
    text:
      es: "No podrán legislar en ningún caso, ni siquiera para aplicar actos de la Unión."
  explanation:
    es: "El artículo 2.1 TFUE dice que en estos ámbitos los Estados miembros «únicamente podrán hacerlo si son facultados por la Unión o para aplicar actos de la Unión». Legislar en la medida en que la Unión no haya ejercido su competencia es la regla de la competencia compartida (art. 2.2 TFUE). No legislan libremente, y sí pueden hacerlo para aplicar actos de la Unión."
  citation: "art. 2.1 TFUE"
  difficulty: 3
  tags:
  - "competencia"
  - "excepción"
