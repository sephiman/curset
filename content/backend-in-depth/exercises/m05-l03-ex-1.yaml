type: quiz
variants:
- id: m05-l03-q01
  prompt:
    en: In the core Spring Framework with default proxy settings, a Spring AOP target object implements one interface.
      Which kind of proxy is used, and what does it proxy?
  options:
  - id: a
    text:
      en: A CGLIB proxy, which is a runtime-generated subclass of the target class
  - id: b
    text:
      en: A JDK dynamic proxy, but only for the first interface that the target implements
  - id: c
    correct: true
    text:
      en: A JDK dynamic proxy, which proxies all of the interfaces implemented by the target type
  - id: d
    text:
      en: No proxy, because a class that implements an interface is woven at compile time
  explanation:
    en: A JDK dynamic proxy is used, and all of the interfaces implemented by the target type are proxied. The claim
      that a CGLIB proxy is used is wrong, because CGLIB is used by default only if a business object does not implement
      an interface. The claim that only the first interface is proxied is wrong, because all of the interfaces implemented
      by the target type are proxied. The claim that the class is woven instead of proxied is wrong, because Spring
      AOP is proxy-based.
  citation: spring-fw-aop-proxying#proxying-mechanisms; spring-fw-aop-pfb#page-title
  extract:
    en: If the target object to be proxied implements at least one interface, a JDK dynamic proxy is used, and all
      of the interfaces implemented by the target type are proxied.
- id: m05-l03-q03
  prompt:
    en: A bean is wrapped by a Spring AOP proxy. Its method `foo()` calls `this.bar()`, and `bar()` has advice.
      What happens to the advice of `bar()` in that call?
  options:
  - id: a
    correct: true
    text:
      en: It does not run, because self invocation via `this` bypasses the advice
  - id: b
    text:
      en: It runs, because the proxy intercepts every call made inside the target object
  - id: c
    text:
      en: It runs, because `AopContext.currentProxy()` is applied automatically to self invocations
  - id: d
    text:
      en: It runs only if `bar()` is declared `public`
  explanation:
    en: Self invocation via an explicit or implicit `this` reference bypasses the advice. The claim that the proxy
      intercepts every call is wrong, because calls the target makes on itself are invoked against the `this` reference
      and not the proxy. The claim that `AopContext.currentProxy()` is applied automatically is wrong, because that
      approach requires that the `ProxyFactory` is configured to expose the proxy. The claim that `bar()` runs its
      advice only when it is declared `public` is wrong, because the call is invoked against the `this` reference,
      whatever the method.
  citation: spring-fw-aop-proxying#aop-understanding-aop-proxies
  extract:
    en: In other words, self invocation via an explicit or implicit this reference will bypass the advice.
- id: m05-l03-q04
  prompt:
    en: The Spring reference lists several ways to deal with self invocation in a proxied bean. Which one does it
      call the best, least-invasive approach?
  options:
  - id: a
    text:
      en: Use self injection and invoke the methods on the proxy through the self reference
  - id: b
    text:
      en: Call `AopContext.currentProxy()` inside the class
  - id: c
    correct: true
    text:
      en: Refactor the code so that the self invocation does not happen
  - id: d
    text:
      en: Declare the called method `final` so that the call is not lost
  explanation:
    en: The documentation calls refactoring so that the self invocation does not happen the best, least-invasive
      approach. The claim that self injection is the best approach is wrong, because it is presented as an alternative
      approach, while refactoring is the best, least-invasive one. The claim that `AopContext.currentProxy()` is
      the best approach is wrong, because this last approach is highly discouraged. The claim that a `final` method
      keeps the advice is wrong, because `final` methods cannot be advised, since they cannot be overridden.
  citation: spring-fw-aop-proxying#aop-understanding-aop-proxies; spring-fw-aop-proxying#proxying-mechanisms
  extract:
    en: is to refactor your code such that the self invocation does not happen.
- id: m05-l03-q06
  prompt:
    en: A method annotated with `@Retryable` has `maxRetries` set to 4 and always fails. How many times is the method
      invoked at most?
  options:
  - id: a
    text:
      en: 4 times, because `maxRetries` counts the total attempts
  - id: b
    text:
      en: 3 times, which is the default number of attempts
  - id: c
    text:
      en: Without limit, until an invocation succeeds
  - id: d
    correct: true
    text:
      en: '5 times: the initial attempt plus 4 retries'
  explanation:
    en: With `maxRetries` set to 4, the method is invoked at least once and at most 5 times. The claim that `maxRetries`
      counts total attempts is wrong, because total attempts are 1 initial attempt plus `maxRetries` attempts. The
      claim that 3 is the limit is wrong, because 3 retry attempts is the default and this method sets `maxRetries`
      to 4. The claim that there is no limit is wrong, because a `@Retryable` method is retried at most `maxRetries`
      times.
  citation: spring-fw-resilience#resilience-annotations-retryable
  extract:
    en: For example, if maxRetries is set to 4, the @Retryable method will be invoked at least once and at most
      5 times.
- id: m05-l03-q07
  prompt:
    en: A method carries both `@Retryable` and `@Transactional`, with default advice ordering. How do the two advices
      nest, and what follows for each retry attempt?
  options:
  - id: a
    text:
      en: The transaction advice is outermost, so all attempts run inside one transaction
  - id: b
    correct: true
    text:
      en: The retry advice is outermost, so each retry attempt runs in its own transaction
  - id: c
    text:
      en: The retry advice is outermost only if the `order` of `@EnableResilientMethods` is set to the lowest precedence
  - id: d
    text:
      en: The two orders are undefined, so attempts may or may not share a transaction
  explanation:
    en: When `@Transactional` is combined with `@Retryable`, the retry advice is applied outermost, so each retry
      attempt runs in its own transaction. The claim that the transaction advice is outermost is wrong, because
      retry advice is always applied outside `@Transactional`, regardless of the order configured on `@EnableResilientMethods`.
      The claim that the `order` attribute decides is wrong, because the technique of changing the order does not
      apply to `@Transactional` or `@Cacheable`. The claim that the order is undefined is wrong, because the retry
      advice is applied outermost when `@Transactional` is combined with `@Retryable`.
  citation: spring-fw-tx-declarative-annotations#using-transactional; spring-fw-resilience#resilience-annotations-retryable-combining-order
  extract:
    en: When @Transactional is combined with @Retryable, the retry advice is applied outermost, so each retry attempt
      runs in its own transaction.
- id: m05-l03-q08
  prompt:
    en: '`@EnableAsync` and `@EnableResilientMethods` are configured so that retry is the outermost advice and async
      the innermost. What happens to exceptions thrown during asynchronous execution?'
  options:
  - id: a
    text:
      en: They are retried, because retry now wraps the asynchronous task
  - id: b
    text:
      en: They are retried on the async executor thread, as in the default order
  - id: c
    text:
      en: The application context fails to start, because the two order values conflict
  - id: d
    correct: true
    text:
      en: They are not retried, because the retry interceptor only sees the `Future` handle
  explanation:
    en: With the reversed order, exceptions thrown during asynchronous execution are not retried, because the retry
      interceptor only sees the `Future` handle. The claim that retry wraps the asynchronous task is wrong, because
      such an arrangement only retries synchronous submission failures, such as a rejected task submission. The
      claim that retries run on the executor thread is wrong, because that is the result of the default order, in
      which the async advice is applied outermost. The claim that the context fails to start is wrong, because you
      can change the relative ordering by setting the `order` attribute on `@EnableResilientMethods` and `@EnableAsync`.
  citation: spring-fw-resilience#resilience-annotations-retryable-combining-order; spring-fw-async#scheduling-annotation-support-async
  extract:
    en: 'With the reversed order shown above, exceptions thrown during asynchronous execution are not retried: the
      retry interceptor only sees the Future handle, which is returned immediately, rather than the outcome of the
      asynchronous invocation.'
- id: m05-l03-q09
  prompt:
    en: Advice methods of five different types are defined in the same `@Aspect` class and need to run at the same
      join point. How does Spring assign their precedence, from highest to lowest?
  options:
  - id: a
    correct: true
    text:
      en: '`@Around`, `@Before`, `@After`, `@AfterReturning`, `@AfterThrowing`'
  - id: b
    text:
      en: '`@AfterThrowing`, `@AfterReturning`, `@After`, `@Before`, `@Around`'
  - id: c
    text:
      en: '`@Before`, `@After`, `@AfterReturning`, `@AfterThrowing`, `@Around`'
  - id: d
    text:
      en: The order in which the advice methods are declared in the class
  explanation:
    en: Precedence by advice type runs from highest to lowest as `@Around`, `@Before`, `@After`, `@AfterReturning`,
      `@AfterThrowing`. The orders that start with `@AfterThrowing` or end with `@Around` do not match the documented
      order, which runs from `@Around` as highest to `@AfterThrowing` as lowest precedence. The claim that declaration
      order decides is wrong, because for the same type of advice the ordering is undefined, since there is no way
      to retrieve the source code declaration order through reflection.
  citation: spring-fw-aop-ataspectj-advice-ordering#aop-ataspectj-advice-ordering
  extract:
    en: 'are assigned precedence based on their advice type in the following order, from highest to lowest precedence:
      @Around, @Before, @After, @AfterReturning, @AfterThrowing.'
- id: m05-l03-q10
  prompt:
    en: Two aspects define advice for the same join point, one annotated `@Order(1)` and the other `@Order(2)`.
      Which aspect has the higher precedence, and why?
  options:
  - id: a
    text:
      en: The aspect with `@Order(2)`, because the higher value gives the higher precedence
  - id: b
    correct: true
    text:
      en: The aspect with `@Order(1)`, because the lower value gives the higher precedence
  - id: c
    text:
      en: Neither, because `@Order` has no effect on the order of aspects
  - id: d
    text:
      en: The aspect that is declared first in the source
  explanation:
    en: The aspect returning the lower value from `Ordered.getOrder()`, or the annotation value, has the higher
      precedence. The claim that the higher value wins is wrong, because the aspect returning the lower value has
      the higher precedence. The claim that `@Order` has no effect is wrong, because annotating the aspect class
      with `@Order` is a way to control the order of execution. The claim that declaration order decides is wrong,
      because when advice in different aspects runs at the same join point without a specified order, the order
      of execution is undefined.
  citation: spring-fw-aop-ataspectj-advice-ordering#aop-ataspectj-advice-ordering
  extract:
    en: Given two aspects, the aspect returning the lower value from Ordered.getOrder() (or the annotation value)
      has the higher precedence.
