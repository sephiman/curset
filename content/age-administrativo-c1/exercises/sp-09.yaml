type: case
title:
  es: "El monte de Valsaín"
scenario:
  es: "El Organismo Autónomo Parques Nacionales (OAPN) tiene su sede en Madrid, donde son festivos el viernes, 19, el jueves, 25, y el viernes, 26 de marzo de 2027, y el lunes, 16 de agosto de 2027. Ningún otro festivo cae en los plazos por días que se cuentan aquí.\n\nDocumentales Sierra Norte, S.L., con domicilio en Madrid, pide autorización para rodar un documental en un monte de Valsaín que gestiona el OAPN. Presenta la solicitud el viernes, 5 de febrero de 2027, en la oficina de asistencia en materia de registros de la Subdelegación del Gobierno en Segovia, y entra en el registro del OAPN el jueves, 18 de febrero de 2027. La norma reguladora no fija plazo máximo para resolver. El lunes, 8 de marzo de 2027, el OAPN publica en el «Boletín Oficial del Estado» el anuncio de información pública, con el plazo de alegaciones más corto que permite la ley, y no resuelve en plazo. El martes, 12 de marzo de 2024, el OAPN autorizó a Aventuras del Pinar, S.L. el uso de una pista forestal, y ahora la considera anulable y lesiva para el interés público.\n\nUna rama de pino cae sobre Don Aurelio Vegas Cantero en una pista del OAPN, y reclama una indemnización. El lunes, 8 de febrero de 2027, el Director del OAPN acuerda por emergencia talar otros pinos que amenazan la pista.\n\nEl OAPN licita obras para un centro de visitantes, con un valor estimado de 3.360.000 euros, IVA excluido. La Intervención Delegada formula un reparo por escrito al expediente. Solventado, el lunes, 7 de junio de 2027, el OAPN adjudica el contrato a Construcciones Pinares del Sur, S.A. por 3.751.000 euros, IVA incluido, y ese día envía la notificación por medios electrónicos y la publica en el perfil de contratante. El crédito inicial de la aplicación es de 4.000.000 de euros, y el gasto se extiende de 2027 a 2029. El pliego no prevé otras penalidades. La adjudicataria entrega las obras, por causas imputables a ella, el jueves, 14 de diciembre de 2028, y el OAPN las recibe sin reservas el lunes, 18 de diciembre de 2028.\n\nDoña Lidia Carrasco Bermejo, guía de uso público fija discontinua del OAPN, trabaja del jueves, 1 de julio de 2027, al viernes, 31 de diciembre de 2027. Doña Marta Olmedo Sanz, funcionaria de carrera, está en excedencia desde el lunes, 3 de marzo de 2025, para cuidar a su madre, que no puede valerse por sí misma ni trabaja, y pide reingresar el miércoles, 1 de septiembre de 2027. Don Julián Peñalver Ordóñez, funcionario de carrera, tiene a su padre ingresado con una enfermedad muy grave. El lunes, 14 de junio de 2027, se publica en el BOE la convocatoria por libre designación de la Jefatura del Área de Uso Público.\n\nEl miércoles, 17 de noviembre de 2027, Doña Carolina Ibáñez Rubio, funcionaria del Subgrupo A2, del grupo 2 de dietas y con residencia oficial en Madrid, sale a las 8:30 hacia Valsaín en comisión de servicio y regresa a las 16:30. Don Cosme Aldea Ferrer va a Madrid en su motocicleta, autorizada en la orden de comisión, y recorre 170 kilómetros entre ida y vuelta.\n\nSe plantean las siguientes cuestiones:"
questions:
# anchor: boe-a-2015-10565-art-21
- id: q01
  lesson: m03-l03
  prompt:
    es: "De acuerdo con el artículo 21.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿hasta qué fecha puede el OAPN notificar a Documentales Sierra Norte, S.L. la resolución expresa antes de que venza el plazo máximo para resolver?"
  options:
  - id: a
    text:
      es: "El miércoles, 5 de mayo de 2027."
  - id: b
    correct: true
    text:
      es: "El martes, 18 de mayo de 2027."
  - id: c
    text:
      es: "El lunes, 17 de mayo de 2027."
  - id: d
    text:
      es: "El miércoles, 18 de agosto de 2027."
  explanation:
    es: "Si la norma reguladora no fija el plazo máximo, es de tres meses, y en los procedimientos a solicitud se cuenta desde que la solicitud entra en el registro del organismo competente para tramitarla. Aquí entra en el registro del OAPN el jueves, 18 de febrero de 2027, y los tres meses acaban el martes, 18 de mayo de 2027, día hábil. La fecha del miércoles, 5 de mayo de 2027, cuenta desde la presentación en la oficina de la Subdelegación del Gobierno. La del lunes, 17 de mayo de 2027, cuenta el día de entrada como primero. La del miércoles, 18 de agosto de 2027, aplica seis meses, el máximo que solo vale cuando la norma reguladora lo fija."
  citation: "art. 21.3 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-24
- id: q02
  lesson: m03-l03
  prompt:
    es: "Si vence sin resolución expresa el plazo máximo de la cuestión anterior, ¿hasta qué fecha debe el OAPN expedir de oficio el certificado acreditativo del silencio producido?"
  options:
  - id: a
    text:
      es: "El miércoles, 2 de junio de 2027."
  - id: b
    text:
      es: "El lunes, 7 de junio de 2027."
  - id: c
    text:
      es: "El viernes, 18 de junio de 2027."
  - id: d
    correct: true
    text:
      es: "El martes, 8 de junio de 2027."
  explanation:
    es: "El certificado se expide de oficio en quince días desde que expire el plazo máximo para resolver. Los plazos por días son hábiles y se cuentan desde el día siguiente. El plazo máximo expira el martes, 18 de mayo de 2027, así que el primer día es el miércoles, 19 de mayo, y el decimoquinto día hábil es el martes, 8 de junio de 2027. La fecha del miércoles, 2 de junio de 2027, cuenta quince días naturales. La del lunes, 7 de junio de 2027, cuenta el 18 de mayo como primer día. La del viernes, 18 de junio de 2027, cuenta un mes."
  citation: "art. 24.4 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-83
- id: q21
  lesson: m03-l03
  prompt:
    es: "¿Cuál es la fecha más temprana en que puede terminar el plazo de alegaciones del anuncio de información pública que el OAPN publica en el «Boletín Oficial del Estado» sobre la solicitud de Documentales Sierra Norte, S.L.?"
  options:
  - id: a
    correct: true
    text:
      es: "Jueves, 8 de abril de 2027."
  - id: b
    text:
      es: "Miércoles, 7 de abril de 2027."
  - id: c
    text:
      es: "Lunes, 5 de abril de 2027."
  - id: d
    text:
      es: "Lunes, 29 de marzo de 2027."
  explanation:
    es: "El anuncio fija un plazo de alegaciones que no puede ser inferior a veinte días. Los plazos por días son hábiles y se cuentan desde el martes, 9 de marzo de 2027, día siguiente a la publicación. No cuentan el viernes, 19, el jueves, 25, ni el viernes, 26 de marzo, festivos en Madrid: el vigésimo día hábil es el jueves, 8 de abril de 2027. La fecha del miércoles, 7 de abril de 2027, no descuenta el viernes, 19 de marzo. La del lunes, 5 de abril de 2027, no descuenta ningún festivo. La del lunes, 29 de marzo de 2027, cuenta veinte días naturales, que acabarían el domingo, 28 de marzo."
  citation: "art. 83.2 LPAC"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-107
- id: q25
  lesson: m03-l03
  prompt:
    es: "Según el artículo 107.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el OAPN inicia el miércoles, 2 de junio de 2027, el procedimiento para declarar lesiva la autorización de Aventuras del Pinar, S.L., ¿cuándo caduca si no la declara antes?"
  options:
  - id: a
    text:
      es: "El jueves, 2 de septiembre de 2027."
  - id: b
    correct: true
    text:
      es: "El jueves, 2 de diciembre de 2027."
  - id: c
    text:
      es: "El miércoles, 1 de diciembre de 2027."
  - id: d
    text:
      es: "El lunes, 29 de noviembre de 2027."
  explanation:
    es: "El procedimiento de declaración de lesividad caduca cuando transcurren seis meses desde su iniciación sin que se haya declarado la lesividad (art. 107.3 LPAC). Los plazos por meses se cuentan de fecha a fecha desde el día siguiente (art. 30.4 LPAC): iniciado el miércoles, 2 de junio de 2027, el sexto mes acaba el jueves, 2 de diciembre de 2027, día hábil. La fecha del miércoles, 1 de diciembre de 2027, cuenta el día de la iniciación como primero. La del lunes, 29 de noviembre de 2027, cuenta seis meses de treinta días. La del jueves, 2 de septiembre de 2027, aplica tres meses. Los cuatro años del artículo 107.2 miden otra cosa: hasta cuándo puede adoptarse la declaración, contados desde que se dictó el acto."
  citation: "art. 107.3 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-114
- id: q22
  lesson: m03-l06
  prompt:
    es: "Según el artículo 114.1.e) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué efecto tiene la resolución expresa que el OAPN dicta sobre la reclamación de Don Aurelio Vegas Cantero?"
  options:
  - id: a
    correct: true
    text:
      es: "Pone fin a la vía administrativa, sin que quepa contra ella recurso de alzada."
  - id: b
    text:
      es: "No pone fin a la vía administrativa, y cabe recurso de alzada ante el órgano superior."
  - id: c
    text:
      es: "No pone fin a la vía administrativa hasta que el Consejo de Estado emite su dictamen."
  - id: d
    text:
      es: "Pone fin a la vía administrativa solo si la dicta el Ministro y no un Director."
  explanation:
    es: "La resolución administrativa de los procedimientos de responsabilidad patrimonial pone fin a la vía administrativa, cualquiera que sea el tipo de relación, pública o privada, de que derive; por eso no cabe alzada contra ella. La opción de la alzada ante el órgano superior niega ese efecto. La del dictamen del Consejo de Estado confunde un trámite del procedimiento con el fin de la vía. La del Ministro sujeta el efecto al rango de quien dicta la resolución, y la norma lo liga a la materia y no al órgano."
  citation: "art. 114.1.e) LPAC"
  difficulty: 2
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2017-12902-art-120
- id: q06
  lesson: m03-l04
  prompt:
    es: "La fecha límite para iniciar la ejecución de lo acordado por emergencia sobre los pinos, según el artículo 120.1.c) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, es:"
  options:
  - id: a
    text:
      es: "El miércoles, 10 de marzo de 2027."
  - id: b
    text:
      es: "El martes, 23 de febrero de 2027."
  - id: c
    text:
      es: "El jueves, 8 de abril de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes, 8 de marzo de 2027."
  explanation:
    es: "El plazo de inicio de la ejecución de las prestaciones no puede superar un mes desde la adopción del acuerdo, y pasado ese plazo hace falta un procedimiento ordinario. El acuerdo es del lunes, 8 de febrero de 2027, y el mes acaba el lunes, 8 de marzo de 2027. La fecha del miércoles, 10 de marzo de 2027, aplica los treinta días en que se da cuenta del acuerdo al Consejo de Ministros. La del martes, 23 de febrero de 2027, cuenta quince días. La del jueves, 8 de abril de 2027, cuenta dos meses."
  citation: "art. 120.1.c) LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2003-21614-art-154
- id: q07
  lesson: m05-l03
  prompt:
    es: "¿Qué efecto tiene sobre la tramitación del expediente de las obras el reparo que formula por escrito la Intervención Delegada?"
  options:
  - id: a
    text:
      es: "No suspende la tramitación del expediente, pero impide reconocer la obligación mientras no se subsane el defecto."
  - id: b
    text:
      es: "Suspende la tramitación durante quince días, y pasado ese plazo el OAPN puede continuar el expediente."
  - id: c
    correct: true
    text:
      es: "Suspende la tramitación hasta que se subsane la deficiencia o se resuelva la discrepancia."
  - id: d
    text:
      es: "Anula el expediente, que el OAPN debe iniciar de nuevo con los defectos corregidos y con nuevos informes."
  explanation:
    es: "El reparo formulado por escrito suspende la tramitación del expediente hasta que se solventa, por la subsanación de las deficiencias o, si el órgano gestor no lo acepta, por la resolución del procedimiento de discrepancias. La opción que mantiene la tramitación y solo impide reconocer la obligación le quita ese efecto. La de la suspensión de quince días confunde el reparo con el plazo para plantear la discrepancia. La de la anulación del expediente no figura en la norma."
  citation: "art. 154.1 LGP"
  difficulty: 1
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-47
- id: q08
  lesson: m05-l02
  prompt:
    es: "Según el artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué retención adicional de crédito debe efectuar el OAPN, en el momento de adjudicar, por el contrato plurianual de obras?"
  options:
  - id: a
    text:
      es: "187.550 euros, el 5 por ciento del importe de adjudicación con IVA."
  - id: b
    correct: true
    text:
      es: "375.100 euros, el 10 por ciento del importe de adjudicación con IVA."
  - id: c
    text:
      es: "750.200 euros, el 20 por ciento del importe de adjudicación con IVA."
  - id: d
    text:
      es: "240.000 euros, el 10 por ciento de la anualidad prevista para 2028."
  explanation:
    es: "En los contratos de obra de carácter plurianual se hace una retención adicional del 10 por ciento del importe de adjudicación, en el momento de adjudicar. El importe de adjudicación es de 3.751.000 euros, IVA incluido, y el 10 por ciento son 375.100 euros. La cifra de 187.550 euros aplica el 5 por ciento. La de 750.200 euros aplica el 20 por ciento. La de 240.000 euros aplica el 10 por ciento a la anualidad de 2028, que no es el importe de adjudicación."
  citation: "art. 47.2 LGP"
  difficulty: 2
  tags:
  - "cantidad"
  - "efecto"
# anchor: boe-a-2003-21614-art-47
- id: q09
  lesson: m05-l02
  prompt:
    es: "¿Qué cantidad máxima puede imputarse al ejercicio 2029 del compromiso plurianual de las obras del centro de visitantes que el OAPN adjudica en 2027?"
  options:
  - id: a
    correct: true
    text:
      es: "2.400.000 euros, el 60 por ciento del crédito inicial."
  - id: b
    text:
      es: "2.800.000 euros, el 70 por ciento del crédito inicial."
  - id: c
    text:
      es: "2.000.000 euros, el 50 por ciento del crédito inicial."
  - id: d
    text:
      es: "4.000.000 euros, la totalidad del crédito inicial."
  explanation:
    es: "El gasto de cada ejercicio posterior no puede exceder de un porcentaje del crédito inicial: el 70 por ciento el inmediato siguiente, el 60 el segundo y el 50 el tercero y el cuarto. El contrato se autoriza en 2027, así que 2028 es el ejercicio inmediato siguiente y 2029 el segundo: el 60 por ciento de 4.000.000 son 2.400.000 euros. La cifra de 2.800.000 euros aplica el 70 por ciento. La de 2.000.000 euros aplica el 50 por ciento. La de 4.000.000 euros es todo el crédito inicial, sin porcentaje."
  citation: "art. 47.2 LGP"
  difficulty: 2
  tags:
  - "cantidad"
  - "mayoría"
# anchor: boe-a-2017-12902-art-50
- id: q10
  lesson: m03-l04
  prompt:
    es: "¿Hasta qué fecha puede interponer el recurso especial en materia de contratación contra la adjudicación de las obras la licitadora no adjudicataria Obras Serranas, S.A., con domicilio en Madrid?"
  options:
  - id: a
    text:
      es: "El martes, 22 de junio de 2027."
  - id: b
    text:
      es: "El viernes, 25 de junio de 2027."
  - id: c
    text:
      es: "El miércoles, 7 de julio de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes, 28 de junio de 2027."
  explanation:
    es: "Las obras tienen un valor estimado de 3.360.000 euros, superior a tres millones, y por eso cabe el recurso especial. Se interpone en quince días hábiles, y contra la adjudicación se cuentan desde el día siguiente al de su notificación, es decir, desde el martes, 8 de junio de 2027: el decimoquinto día hábil es el lunes, 28 de junio de 2027. La fecha del martes, 22 de junio de 2027, cuenta quince días naturales. La del viernes, 25 de junio de 2027, cuenta el día de la notificación como primero. La del miércoles, 7 de julio de 2027, cuenta un mes."
  citation: "art. 50.1 LCSP"
  difficulty: 1
  tags:
  - "plazo"
