# anchor: fuente-ms-word-tablas-tamano-html
- id: m02-l08-q300
  prompt:
    es: "En Word 365, ¿cómo distingue la página de Microsoft los márgenes de celda del espaciado de celdas en una tabla?"
  options:
  - id: a
    text:
      es: "Los márgenes están entre las celdas y el espaciado dentro de cada celda"
  - id: b
    correct: true
    text:
      es: "Los márgenes están dentro de cada celda y el espaciado está entre las celdas"
  - id: c
    text:
      es: "Los márgenes afectan a toda la hoja y el espaciado solo a la tabla activa"
  - id: d
    text:
      es: "Los dos son el mismo valor y se cambian arrastrando el borde de la tabla"
  explanation:
    es: "La página dice que los márgenes de las celdas están dentro de la celda de la tabla y que el espaciado de celdas está entre las celdas. Invertir los dos contradice esa descripción. Los márgenes no afectan a la hoja: son los márgenes superior, inferior, izquierdo y derecho de cada celda. Son dos ajustes distintos, y se cambian en el grupo Alineación con Márgenes de celda y el cuadro Opciones de tabla, no arrastrando el borde."
  citation: "fuente: `ms-word-tablas-tamano.html`; «Cambiar el tamaño de una tabla, una columna o una fila»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-word-tablas-tamano-html
- id: m02-l08-q301
  prompt:
    es: "¿Para qué sirve activar la casilla Permitir espaciado entre celdas en el cuadro Opciones de tabla de Word 365?"
  options:
  - id: a
    text:
      es: "Para escribir las medidas de los márgenes superior, inferior, izquierdo y derecho de cada celda"
  - id: b
    text:
      es: "Para desactivar el ajuste automático del ancho de la tabla o de las columnas"
  - id: c
    correct: true
    text:
      es: "Para escribir la medida del espacio que queda entre las celdas"
  - id: d
    text:
      es: "Para igualar el tamaño de las columnas o filas seleccionadas"
  explanation:
    es: "La página dice que, en Espaciado de celdas predeterminado, se activa la casilla Permitir espaciado entre celdas y después se escribe la medida que se desee. Las medidas de los márgenes superior, inferior, izquierdo y derecho se escriben en Márgenes de celda predeterminados, que están dentro de cada celda. Desactivar el ajuste automático del ancho es la función de Ancho de columna fijo, en Autoajustar. Igualar el tamaño de las columnas o filas seleccionadas es la función de Distribuir columnas y Distribuir filas."
  citation: "fuente: `ms-word-tablas-tamano.html`; «Cambiar el tamaño de una tabla, una columna o una fila»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-word-tablas-tamano-html
- id: m02-l08-q302
  prompt:
    es: "Señale a qué tablas se aplica en Word 365 la configuración de márgenes y espaciado de celdas elegida en Opciones de tabla, según la nota de la página de Microsoft:"
  options:
  - id: a
    correct: true
    text:
      es: "Solo a la tabla activa; las nuevas usan la configuración original"
  - id: b
    text:
      es: "A todas las tablas del documento abierto, tanto las existentes como las nuevas"
  - id: c
    text:
      es: "A todas las tablas nuevas que se creen en adelante, pero no a la tabla activa"
  - id: d
    text:
      es: "A todas las tablas de todos los documentos que se abran en el equipo"
  explanation:
    es: "La nota dice que la configuración elegida solo está disponible en la tabla activa y que las tablas nuevas usarán la configuración predeterminada original. Aplicarla a todas las tablas del documento contradice que sea solo para la tabla activa. Aplicarla a las tablas nuevas contradice que estas usen la configuración original. Aplicarla a todos los documentos contradice las dos cosas."
  citation: "fuente: `ms-word-tablas-tamano.html`; «Cambiar el tamaño de una tabla, una columna o una fila»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-tablas-tamano-html
- id: m02-l08-q303
  prompt:
    es: "En Word 365, ¿cómo se cambia manualmente el tamaño de una tabla completa, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Haciendo clic en el controlador de movimiento de tabla de la esquina superior"
  - id: b
    text:
      es: "Seleccionando Distribuir columnas en el grupo Tamaño de celda de Diseño de tabla"
  - id: c
    text:
      es: "Seleccionando Autoajustar ventana en el grupo Tamaño de celda de Diseño de tabla"
  - id: d
    correct: true
    text:
      es: "Arrastrando el controlador de tamaño de la esquina inferior de la tabla"
  explanation:
    es: "La página dice que se sitúa el cursor sobre el controlador de tamaño de la esquina inferior de la tabla y se arrastra el borde hasta que la tabla tenga el tamaño deseado. El controlador de movimiento de tabla sirve para seleccionar toda la tabla. Distribuir columnas iguala el tamaño de las columnas seleccionadas. Autoajustar ventana ajusta el ancho de la tabla automáticamente, no de forma manual."
  citation: "fuente: `ms-word-tablas-tamano.html`; «Cambiar el tamaño de una tabla, una columna o una fila»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-listas-multinivel-html
- id: m02-l08-q304
  prompt:
    es: "En Definir nueva lista multinivel de Word 365, ¿para qué se elige Establecer para todos los niveles?"
  options:
  - id: a
    text:
      es: "Para reiniciar la numeración después de un nivel específico"
  - id: b
    text:
      es: "Para usar un estilo existente de Word en cada nivel de la lista"
  - id: c
    correct: true
    text:
      es: "Para aplicar a toda la lista los valores de alineación y sangría"
  - id: d
    text:
      es: "Para aplicar un estilo legal a la lista multinivel"
  explanation:
    es: "La página dice que, tras especificar el valor donde se iniciará la alineación y el de la sangría de texto, Establecer para todos los niveles aplica esos valores a toda la lista. Reiniciar la numeración después de un nivel es la función de la casilla Reiniciar lista después de. Usar un estilo existente en cada nivel es la función de Vincular nivel a estilo. Aplicar un estilo legal es la función de Numeración de estilos legales."
  citation: "fuente: `ms-word-listas-multinivel.html`; «Definir nuevas viñetas, números y listas multinivel»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-word-listas-multinivel-html
- id: m02-l08-q305
  prompt:
    es: "¿Cuál de los siguientes campos del cuadro Definir nuevo formato de número de Word 365 sirve para escribir un guion o un paréntesis que se anexe a la numeración?"
  options:
  - id: a
    correct: true
    text:
      es: "Formato de número"
  - id: b
    text:
      es: "Nombre de lista de campo ListNum"
  - id: c
    text:
      es: "Alineación"
  - id: d
    text:
      es: "Vincular nivel a estilo"
  explanation:
    es: "La página dice que, para anexar la numeración con un guion, paréntesis u otro valor, se escribe en el campo Formato de número. Nombre de lista de campo ListNum es el cuadro donde se escribe el nombre de una lista multinivel, que puede usarse con el campo LISTNUM. Alineación sirve para elegir Izquierda, Centrado o Derecha para el número. Vincular nivel a estilo pertenece al cuadro de la lista multinivel y sirve para usar un estilo existente en cada nivel."
  citation: "fuente: `ms-word-listas-multinivel.html`; «Definir nuevas viñetas, números y listas multinivel»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-word-listas-multinivel-html
- id: m02-l08-q306
  prompt:
    es: "¿Cuál de las siguientes opciones de la ventana Insertar imágenes de Word 365, que se abre al cambiar una viñeta por una imagen, permite elegir una imagen guardada en OneDrive?"
  options:
  - id: a
    text:
      es: "Desde un archivo"
  - id: b
    text:
      es: "Búsqueda de imágenes de Bing"
  - id: c
    text:
      es: "Símbolo"
  - id: d
    correct: true
    text:
      es: "OneDrive - Personal"
  explanation:
    es: "La página dice que, en la ventana Insertar imágenes, OneDrive - Personal sirve para buscar una imagen guardada en OneDrive. Desde un archivo sirve para usar una imagen del equipo. Búsqueda de imágenes de Bing sirve para buscar una imagen en línea. Símbolo no es una opción de esa ventana: es la alternativa de Definir nueva viñeta que cambia la viñeta por un símbolo."
  citation: "fuente: `ms-word-listas-multinivel.html`; «Definir nuevas viñetas, números y listas multinivel»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-office-pdf-html
- id: m02-l08-q134
  prompt:
    es: "Al guardar un documento de Word 365 como PDF, ¿cuál de las siguientes opciones de Qué quiere publicar incluye las marcas de revisión?"
  options:
  - id: a
    text:
      es: "Documento"
  - id: b
    correct: true
    text:
      es: "Documento con marcas"
  - id: c
    text:
      es: "Propiedades del documento"
  - id: d
    text:
      es: "Marcadores de Word"
  explanation:
    es: "La página dice: «Para incluir las marcas de revisión en el PDF, en Qué quiere publicar, seleccione Documento con marcas». Documento es la opción que no incluye las marcas de revisión. Propiedades del documento incluye las propiedades, no las marcas de revisión. Marcadores de Word sirve para crear los marcadores del PDF."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-office-pdf-html
- id: m02-l08-q135
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de PDF permite crear un archivo con solo algunas de las páginas del documento?"
  options:
  - id: a
    text:
      es: "Documento con marcas"
  - id: b
    text:
      es: "Crear marcadores con"
  - id: c
    correct: true
    text:
      es: "Intervalo de páginas"
  - id: d
    text:
      es: "Propiedades del documento"
  explanation:
    es: "La página dice: «Para crear un archivo PDF solo con algunas de las páginas de su documento, elija una opción en Intervalo de páginas». Documento con marcas incluye las marcas de revisión. Crear marcadores con crea un conjunto de marcadores en el PDF. Propiedades del documento incluye las propiedades en el PDF."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-office-pdf-html
- id: m02-l08-q136
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de PDF facilita la lectura del documento con un software de lectura de pantalla?"
  options:
  - id: a
    correct: true
    text:
      es: "Etiquetas de la estructura del documento para accesibilidad"
  - id: b
    text:
      es: "Cifrar el documento con una contraseña"
  - id: c
    text:
      es: "Crear marcadores con Encabezados"
  - id: d
    text:
      es: "Documento con marcas"
  explanation:
    es: "La página dice: «Para facilitar la lectura del documento en un software de lectura de pantalla, seleccione Etiquetas de la estructura del documento para accesibilidad». Cifrar restringe el acceso al PDF con una contraseña. Crear marcadores crea un conjunto de marcadores en el PDF. Documento con marcas incluye las marcas de revisión."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-office-pdf-html
- id: m02-l08-q137
  prompt:
    es: "Según la página de Microsoft, ¿cuándo conviene usar el formato PDF para un archivo de Word 365?"
  options:
  - id: a
    text:
      es: "Cuando se quiere que el destinatario pueda editarlo con facilidad"
  - id: b
    correct: true
    text:
      es: "Cuando se quiere la misma apariencia en la mayoría de los equipos"
  - id: c
    text:
      es: "Cuando se quiere que tenga un tamaño de archivo mayor"
  - id: d
    text:
      es: "Cuando se quiere que solo se pueda abrir con Microsoft Word"
  explanation:
    es: "La página dice: «Use el formato PDF cuando quiera que un archivo: Tenga la misma apariencia en la mayoría de los equipos». La página avisa de que compartir como PDF no garantiza que el destinatario no pueda editarlo; no es su razón de uso. La página lo recomienda para un tamaño de archivo más pequeño. La página dice que muchos programas, incluido Word, pueden abrir PDF."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-imprimir-html
- id: m02-l08-q138
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de Configuración imprime el documento con sus comentarios y marcas de revisión?"
  options:
  - id: a
    text:
      es: "Imprimir página actual"
  - id: b
    text:
      es: "Impresión personalizada"
  - id: c
    text:
      es: "Personas específicas"
  - id: d
    correct: true
    text:
      es: "Imprimir documento con revisiones"
  explanation:
    es: "La página dice: «En Configuración, seleccione Imprimir documento con revisiones» y «El documento se imprimirá con comentarios». Imprimir página actual imprime la página que se muestra en la vista previa. Impresión personalizada permite elegir páginas concretas. Personas específicas sirve para imprimir los comentarios de un revisor concreto."
  citation: "fuente: `ms-word-imprimir.html`; «Imprimir los comentarios del documento»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-imprimir-html
- id: m02-l08-q139
  prompt:
    es: "Según la página de Microsoft, ¿qué se hace en la pestaña Revisar de Word 365 para imprimir un documento sin comentarios?"
  options:
  - id: a
    text:
      es: "Elegir Comentarios en Mostrar marcas, y luego imprimir"
  - id: b
    text:
      es: "Elegir un revisor en Personas específicas, y luego imprimir el documento"
  - id: c
    correct: true
    text:
      es: "Elegir Ninguna revisión en Mostrar para revisión, y luego imprimir"
  - id: d
    text:
      es: "Elegir Imprimir documento con revisiones en Configuración, y luego imprimir"
  explanation:
    es: "La página dice: «Si desea imprimir el documento sin comentarios, vaya a la pestaña Revisar. A continuación, en el grupo Revisión, seleccione la lista desplegable Mostrar para revisión, Ninguna revisión y, a continuación, imprima el documento». Mostrar marcas con Comentarios sirve para ver los comentarios. Personas específicas sirve para imprimir los comentarios de un revisor concreto. Imprimir documento con revisiones imprime el documento con comentarios."
  citation: "fuente: `ms-word-imprimir.html`; «Imprimir los comentarios del documento»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-imprimir-html
- id: m02-l08-q140
  prompt:
    es: "En Word 365, ¿cómo se imprimen páginas consecutivas, como de la 1 a la 3?"
  options:
  - id: a
    text:
      es: "Con Imprimir página actual, repitiendo el comando tres veces"
  - id: b
    correct: true
    text:
      es: "Con Impresión personalizada, escribiendo la primera y la última página"
  - id: c
    text:
      es: "Con Imprimir todas las páginas, y desmarcando la página 4 después"
  - id: d
    text:
      es: "Con Imprimir documento con revisiones, escribiendo el intervalo"
  explanation:
    es: "La página dice: «Para imprimir páginas consecutivas como de la 1 a la 3, seleccione Impresión personalizada e introduzca el primer y el último número de página en el cuadro Páginas». Imprimir página actual imprime la página que se muestra en la vista previa. Imprimir todas las páginas es la opción predeterminada de Configuración. Imprimir documento con revisiones imprime el documento con comentarios."
  citation: "fuente: `ms-word-imprimir.html`; «Imprimir páginas determinadas»"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: fuente-ms-word-imprimir-html
- id: m02-l08-q141
  prompt:
    es: "En Word 365, ¿cuál de los siguientes controles de la vista previa de impresión amplía un texto difícil de leer por ser muy pequeño?"
  options:
  - id: a
    text:
      es: "Las flechas hacia delante y hacia atrás de la parte inferior"
  - id: b
    text:
      es: "El botón Imprimir, con el número de copias elegido"
  - id: c
    correct: true
    text:
      es: "El control deslizante del zoom, en la parte inferior"
  - id: d
    text:
      es: "La lista Personas específicas de Configuración"
  explanation:
    es: "La página dice: «Si es difícil leer el texto porque es muy pequeño, use el control deslizante del zoom en la parte inferior de la página para ampliarlo». Las flechas sirven para ver cada página de la vista previa. El botón Imprimir lanza la impresión. Personas específicas sirve para elegir los comentarios de un revisor."
  citation: "fuente: `ms-word-imprimir.html`; «Obtener una vista previa del documento»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-atajos-html
- id: m02-l08-q142
  prompt:
    es: "En Word 365, ¿cuál de los siguientes métodos abreviados de teclado muestra la pestaña Imprimir en la vista Backstage?"
  options:
  - id: a
    text:
      es: "Mayús+F12"
  - id: b
    text:
      es: "Ctrl+F12"
  - id: c
    correct: true
    text:
      es: "Ctrl+Mayús+F12"
  - id: d
    text:
      es: "Alt+Mayús+F12"
  explanation:
    es: "La tabla de teclas de función dice: «Ctrl+Mayús+F12: muestra la pestaña Imprimir en la vista Backstage». Mayús+F12 guarda el documento. Ctrl+F12 muestra el cuadro de diálogo Abrir. Alt+Mayús+F12 selecciona el botón Tabla de contenido en su contenedor."
  citation: "fuente: `ms-word-atajos.html`; «Obtener una vista previa e imprimir documentos»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m02-l08-q155
  prompt:
    es: "Según la página de Opciones de Word (Guardar) en Word 365, ¿cuál de los siguientes archivos crea Word automáticamente en el intervalo especificado en el cuadro de minutos?"
  options:
  - id: a
    correct: true
    text:
      es: "Un archivo de Autorrecuperación"
  - id: b
    text:
      es: "Una versión nueva en el historial de versiones"
  - id: c
    text:
      es: "Una copia del documento en OneDrive"
  - id: d
    text:
      es: "Un PDF del documento con las marcas de revisión"
  explanation:
    es: "Word crea un archivo de Autorrecuperación en el intervalo fijado. «Una versión nueva en el historial de versiones» la agrega el Autoguardado: «se agrega una nueva versión del archivo al historial de versiones» cuando se abre un archivo y se hacen los primeros cambios, y luego solo ocasionalmente. «Una copia del documento en OneDrive» no es lo que crea Word en el intervalo del cuadro de minutos, que es un archivo de Autorrecuperación. «Un PDF del documento con las marcas de revisión» es una salida de Guardar una copia, no de la Autorrecuperación."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Guardar documentos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m02-l08-q156
  prompt:
    es: "En Word 365, ¿cuál de los siguientes intervalos de minutos admite la opción Guardar información de Autorrecuperación cada?"
  options:
  - id: a
    text:
      es: "Un número positivo entre 1 y 60"
  - id: b
    text:
      es: "Un número positivo entre 5 y 120"
  - id: c
    correct: true
    text:
      es: "Un número positivo entre 1 y 120"
  - id: d
    text:
      es: "Un número positivo entre 1 y 1.440"
  explanation:
    es: "La página fija el intervalo: «El intervalo debe ser un número positivo entre 1 y 120». Por eso «entre 1 y 60» se queda corto, porque 120 también vale; «entre 5 y 120» excluye valores de 1 a 4 que la página admite; y «entre 1 y 1.440» sobrepasa el máximo de 120."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Guardar documentos»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m02-l08-q157
  prompt:
    es: "Según la página de Microsoft, el archivo de Autorrecuperación de Word 365 se abre tras un fallo del equipo:"
  options:
  - id: a
    text:
      es: "Solo cuando se abre el documento original desde OneDrive"
  - id: b
    correct: true
    text:
      es: "La próxima vez que se inicia Word"
  - id: c
    text:
      es: "En el mismo momento del fallo, antes de cerrar Word"
  - id: d
    text:
      es: "Solo si antes se activó el Autoguardado del documento"
  explanation:
    es: "Según la página, Word crea el archivo de Autorrecuperación en el intervalo fijado en el cuadro de minutos y, si el equipo deja de responder o se queda sin energía, «el archivo de Autorrecuperación se abrirá la próxima vez que inicie Word». Decir que solo se abre si el documento original estaba en OneDrive añade una condición que esa frase no tiene: la opción se describe para cualquier documento. Abrirlo en el mismo momento del fallo choca con el propio caso de la frase, un equipo que ha dejado de responder o sin energía, donde el archivo solo puede abrirse al iniciar Word. Y condicionarlo al Autoguardado mezcla dos funciones: la página presenta Autorrecuperación como una opción con su propio intervalo."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Guardar documentos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m02-l08-q158
  prompt:
    es: "En Word 365, ¿puede la Autorrecuperación sustituir al comando Guardar al terminar de trabajar en un documento?"
  options:
  - id: a
    text:
      es: "Sí: con ella ya no hace falta guardar el documento"
  - id: b
    text:
      es: "Sí, pero solo si el intervalo es de 1 minuto"
  - id: c
    text:
      es: "Sí, pero solo para los documentos guardados en OneDrive"
  - id: d
    correct: true
    text:
      es: "No: hay que seguir guardando el documento al terminar"
  explanation:
    es: "La página dice: «Autorrecuperación no reemplaza el comando Guardar. Debe seguir guardando el documento cuando termine de trabajar en él». Que con ella ya no haga falta guardar contradice esa frase. El intervalo de 1 minuto es el mínimo que admite la página, entre 1 y 120, y solo fija cada cuánto se crea el archivo de Autorrecuperación: no cambia que siga siendo un archivo aparte, que puede contener información no guardada del documento original. Y OneDrive aparece en la página como uno de los lugares adicionales donde guardar, no como excepción a esa regla."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Guardar documentos»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m02-l08-q159
  prompt:
    es: "En Word 365, ¿cuál de los siguientes datos puede contener el archivo de Autorrecuperación y, de lo contrario, se perdería del documento original?"
  options:
  - id: a
    correct: true
    text:
      es: "Información no guardada"
  - id: b
    text:
      es: "Los cambios ya guardados con Ctrl+S"
  - id: c
    text:
      es: "Solo el nombre y la ubicación del documento"
  - id: d
    text:
      es: "La configuración de las Opciones de Word"
  explanation:
    es: "La página dice que el archivo de Autorrecuperación «puede contener información no guardada que, de lo contrario, se perdería del documento original». Los «cambios ya guardados con Ctrl+S» ya están en el documento original, así que no se perderían; «solo el nombre y la ubicación del documento» y «la configuración de las Opciones de Word» no son información no guardada del documento, que es lo que la página atribuye al archivo."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Guardar documentos»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m02-l08-q160
  prompt:
    es: "Según la página de Opciones de Word (Guardar) en Word 365, ¿qué ocurre con la opción de conservar la última versión de Autorrecuperación si se cierra sin guardar?"
  options:
  - id: a
    text:
      es: "Word elimina el archivo de Autorrecuperación al cerrar sin guardar"
  - id: b
    text:
      es: "Word guarda el documento original con los últimos cambios al cerrar"
  - id: c
    text:
      es: "Word pide guardar el documento cada vez que se abre de nuevo Word"
  - id: d
    correct: true
    text:
      es: "Word crea el archivo y lo conserva al cerrar; lo muestra al abrir"
  explanation:
    es: "Con la opción de conservar la última versión de Autorrecuperación, «Word creará un archivo de Autorrecuperación y lo conservará al cerrar Word. Se mostrará el archivo recuperado la próxima vez que abra Word». Eliminar el archivo al cerrar es lo contrario de «lo conservará». Guardar el documento original con los últimos cambios tampoco: la página dice que el archivo de Autorrecuperación puede contener información no guardada que se perdería del documento original, es decir, es un archivo aparte. Y pedir guardar el documento cada vez que se abre Word no es lo que dice la página: lo que se muestra al abrir es el archivo recuperado."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Guardar documentos»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m02-l08-q161
  prompt:
    es: "En Word 365, ¿qué se escribe en el cuadro de texto de la opción Ubicación del archivo de Autorrecuperación?"
  options:
  - id: a
    text:
      es: "El intervalo en minutos entre cada archivo"
  - id: b
    correct: true
    text:
      es: "La ruta de acceso de la ubicación del archivo"
  - id: c
    text:
      es: "El nombre del documento que se va a recuperar"
  - id: d
    text:
      es: "El formato de archivo con el que se guarda"
  explanation:
    es: "La página indica: «En el cuadro de texto, escriba la ruta de acceso que desea usar como ubicación de archivo de Autorrecuperación». «El intervalo en minutos entre cada archivo» se fija en otro cuadro, Guardar información de Autorrecuperación cada, con un número entre 1 y 120. «El nombre del documento que se va a recuperar» no se escribe: el cuadro solo pide una ruta. «El formato de archivo con el que se guarda» corresponde a Guardar archivos en este formato, que establece el formato predeterminado al guardar."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Guardar documentos»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-office-autoguardado-html
- id: m02-l08-q162
  prompt:
    es: "Según la página de Microsoft sobre el Autoguardado, ¿qué ocurre con la Autorrecuperación si el Autoguardado de un archivo de Word 365 está desactivado?"
  options:
  - id: a
    text:
      es: "Deja de funcionar hasta que se vuelva a activar el Autoguardado"
  - id: b
    text:
      es: "Solo funciona si el archivo está en OneDrive"
  - id: c
    correct: true
    text:
      es: "Sigue funcionando en un bloqueo mientras el archivo esté abierto"
  - id: d
    text:
      es: "Sustituye al Autoguardado y guarda cada pocos segundos"
  explanation:
    es: "La página dice: «Cuando Autoguardado está desactivado, Autorrecuperación sigue funcionando en caso de bloqueo del sistema mientras el archivo esté abierto». Por eso «deja de funcionar hasta que se vuelva a activar el Autoguardado» y «solo funciona si el archivo está en OneDrive» contradicen esa frase. «Sustituye al Autoguardado y guarda cada pocos segundos» confunde las dos funciones: quien guarda cada pocos segundos es el Autoguardado, no la Autorrecuperación."
  citation: "fuente: `ms-office-autoguardado.html`; «¿Qué es el Autoguardado?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-office-pdf-html
- id: m02-l08-q163
  prompt:
    es: "Según la página de Microsoft, ¿cuál de las siguientes rutas guarda como PDF en Word 365 un archivo que ya se guardó antes?"
  options:
  - id: a
    correct: true
    text:
      es: "Archivo › Guardar una copia"
  - id: b
    text:
      es: "Archivo › Información › Proteger documento"
  - id: c
    text:
      es: "Archivo › Opciones › Revisión"
  - id: d
    text:
      es: "Archivo › Abrir, con la opción PDF"
  explanation:
    es: "La página dice: «Si el archivo se guardó anteriormente, seleccione Archivo>Guardar una copia». «Archivo › Información › Proteger documento» es la ruta de Marcar como final, según la página de Microsoft sobre coautoría, no la de guardar como PDF. «Archivo › Opciones › Revisión» abre las opciones de ortografía y gramática, según la página de Microsoft sobre ortografía. «Archivo › Abrir, con la opción PDF» sirve para abrir un PDF: «Vaya a Archivo>Abrir y busque el archivo PDF. Word abre el contenido del archivo PDF en un archivo nuevo»."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 2
  tags:
  - "ofimática-menú"
