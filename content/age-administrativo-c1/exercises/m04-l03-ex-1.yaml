# anchor: boe-a-2015-11719-art-76
- id: m04-l03-q001
  prompt:
    es: "De acuerdo con el artículo 76 del texto refundido de la Ley del Estatuto Básico del Empleado Público, para el acceso a los cuerpos o escalas del Grupo A se exigirá estar en posesión:"
  options:
  - id: a
    text:
      es: "Del título universitario de Grado, sin que una ley pueda exigir otro título distinto"
  - id: b
    text:
      es: "Del título universitario de Grado o del de Técnico Superior, según disponga la convocatoria"
  - id: c
    correct: true
    text:
      es: "Del título universitario de Grado o, cuando la ley lo exija, de otro título universitario"
  - id: d
    text:
      es: "Del título universitario de Grado y de la acreditación de un idioma extranjero"
  explanation:
    es: "El artículo 76 exige para el Grupo A «estar en posesión del título universitario de Grado» y añade que, cuando la ley exija otro título universitario, «será éste el que se tenga en cuenta». La opción que impide a la ley exigir otro título contradice esa segunda frase. El título de Técnico Superior es el del Grupo B, no una alternativa para el A. El artículo no pide ningún idioma extranjero para el acceso al Grupo A."
  citation: "art. 76 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-76
- id: m04-l03-q002
  prompt:
    es: "¿Qué título exige el texto refundido de la Ley del Estatuto Básico del Empleado Público para el acceso a los cuerpos o escalas del Grupo B?"
  options:
  - id: a
    text:
      es: "El título de Bachiller o Técnico"
  - id: b
    text:
      es: "El título universitario de Grado"
  - id: c
    correct: true
    text:
      es: "El título de Técnico Superior"
  - id: d
    text:
      es: "El título de Graduado en Educación Secundaria Obligatoria"
  explanation:
    es: "Para el Grupo B el artículo 76 exige «estar en posesión del título de Técnico Superior». El título de Bachiller o Técnico es el del Subgrupo C1. El título universitario de Grado es el del Grupo A. El de Graduado en Educación Secundaria Obligatoria es el del Subgrupo C2."
  citation: "art. 76 TREBEP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-76
- id: m04-l03-q003
  prompt:
    es: "Según el artículo 76 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué título se exige para el ingreso en los cuerpos o escalas del Subgrupo C1?"
  options:
  - id: a
    text:
      es: "El título de Técnico Superior"
  - id: b
    text:
      es: "El título de Graduado en Educación Secundaria Obligatoria"
  - id: c
    text:
      es: "El título universitario de Grado"
  - id: d
    correct: true
    text:
      es: "El título de Bachiller o Técnico"
  explanation:
    es: "El artículo 76 divide el Grupo C en dos subgrupos según la titulación exigida para el ingreso, y para el C1 pide el «Título de Bachiller o Técnico». El título de Técnico Superior corresponde al Grupo B. El de Graduado en Educación Secundaria Obligatoria corresponde al Subgrupo C2. El título universitario de Grado es el del Grupo A."
  citation: "art. 76 TREBEP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-11719-art-76
- id: m04-l03-q004
  prompt:
    es: "Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿en qué grupo o subgrupo se clasifican los cuerpos y escalas para cuyo ingreso se exige el título de Graduado en Educación Secundaria Obligatoria?"
  options:
  - id: a
    text:
      es: "En el Subgrupo C1 del Grupo C"
  - id: b
    correct: true
    text:
      es: "En el Subgrupo C2 del Grupo C"
  - id: c
    text:
      es: "En el Subgrupo A2 del Grupo A"
  - id: d
    text:
      es: "En el Grupo B, que no tiene subgrupos"
  explanation:
    es: "El artículo 76 asigna al Subgrupo C2 el «Título de Graduado en Educación Secundaria Obligatoria». El Subgrupo C1 exige el título de Bachiller o Técnico. El Subgrupo A2 exige el título universitario de Grado. El Grupo B exige el título de Técnico Superior."
  citation: "art. 76 TREBEP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2015-11719-art-76
- id: m04-l03-q005
  prompt:
    es: "Según el artículo 76 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿con qué criterio se clasifican en grupos los cuerpos y escalas de funcionarios de carrera?"
  options:
  - id: a
    text:
      es: "De acuerdo con el nivel de complemento de destino de sus puestos"
  - id: b
    text:
      es: "De acuerdo con el departamento ministerial al que estén adscritos"
  - id: c
    text:
      es: "De acuerdo con la antigüedad media de los funcionarios que los integran"
  - id: d
    correct: true
    text:
      es: "De acuerdo con la titulación exigida para el acceso a los mismos"
  explanation:
    es: "El artículo 76 TREBEP dice que los cuerpos y escalas se clasifican en grupos «de acuerdo con la titulación exigida para el acceso a los mismos»: Grupo A con título de Grado, Grupo B con Técnico Superior, Grupo C con Bachiller, Técnico o Graduado en ESO. El nivel de complemento de destino es una característica del puesto, no un criterio del grupo, que el artículo liga al título. El departamento al que se adscribe el cuerpo tampoco aparece entre los criterios del artículo 76. La antigüedad de los funcionarios no es la base de ningún grupo: el único factor, además de la titulación, que el artículo cita dentro del Grupo A es el nivel de responsabilidad de las funciones y las pruebas de acceso."
  citation: "art. 76 TREBEP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2015-11719-art-9
- id: m04-l03-q006
  prompt:
    es: "De acuerdo con el artículo 9.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el ejercicio de las funciones que impliquen la participación directa o indirecta en el ejercicio de las potestades públicas corresponde:"
  options:
  - id: a
    text:
      es: "Preferentemente a los funcionarios públicos, y al personal laboral fijo cuando lo prevea la ley de desarrollo"
  - id: b
    text:
      es: "Exclusivamente a los funcionarios públicos, en los términos que fije cada relación de puestos de trabajo"
  - id: c
    text:
      es: "A los empleados públicos de cualquier clase, en los términos que establezca la ley de desarrollo de cada Administración"
  - id: d
    correct: true
    text:
      es: "Exclusivamente a los funcionarios públicos, en los términos que establezca la ley de desarrollo de cada Administración"
  explanation:
    es: "El artículo 9.2 TREBEP reserva esas funciones «exclusivamente a los funcionarios públicos, en los términos que en la ley de desarrollo de cada Administración Pública se establezca». «Preferentemente» y la apertura al personal laboral fijo contradicen «exclusivamente». Remitir a la relación de puestos de trabajo sustituye la ley de desarrollo, que es el instrumento que nombra el apartado. «Empleados públicos de cualquier clase» contradice «exclusivamente a los funcionarios públicos»."
  citation: "art. 9.2 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-9
- id: m04-l03-q007
  prompt:
    es: "¿Qué funciones corresponden en todo caso exclusivamente a los funcionarios públicos según el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Las que impliquen participación en el ejercicio de las potestades públicas o en la salvaguardia de los intereses generales"
  - id: b
    text:
      es: "Las de dirección de unidades administrativas con nivel orgánico de subdirección general o superior"
  - id: c
    text:
      es: "Las de gestión económica y presupuestaria que impliquen el manejo directo de fondos públicos"
  - id: d
    text:
      es: "Las de atención al público, información y registro en las oficinas de asistencia en materia de registros"
  explanation:
    es: "El artículo 9.2 reserva en todo caso a los funcionarios públicos las funciones que impliquen la participación directa o indirecta «en el ejercicio de las potestades públicas o en la salvaguardia de los intereses generales del Estado y de las Administraciones Públicas». No reserva por sí mismas la dirección de unidades con nivel de subdirección general, la gestión económica y presupuestaria ni la atención al público y el registro: el criterio es la participación en potestades públicas, no el tipo de unidad o de tarea."
  citation: "art. 9.2 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q008
  prompt:
    es: "Según el artículo 10.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, son funcionarios interinos los que son nombrados como tales, con carácter temporal, para el desempeño de funciones propias de funcionarios de carrera:"
  options:
  - id: a
    correct: true
    text:
      es: "Por razones expresamente justificadas de necesidad y urgencia"
  - id: b
    text:
      es: "Por razones de oportunidad apreciadas libremente por el órgano que los nombra"
  - id: c
    text:
      es: "Por razones de confianza o asesoramiento especial del órgano que los nombra"
  - id: d
    text:
      es: "Por razones organizativas que impidan la cobertura del puesto mediante concurso"
  explanation:
    es: "El artículo 10.1 define a los funcionarios interinos como los nombrados «por razones expresamente justificadas de necesidad y urgencia». La libre apreciación de la oportunidad contradice la exigencia de una justificación expresa. La confianza o el asesoramiento especial es lo que caracteriza al personal eventual, no al interino. Las razones organizativas aparecen en el artículo 10.3, pero como causa de cese del interino, no de nombramiento."
  citation: "art. 10.1 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q009
  prompt:
    es: "Según el artículo 10.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿en qué circunstancia puede nombrarse personal funcionario interino por plazo máximo de nueve meses, dentro de un periodo de dieciocho meses?"
  options:
  - id: a
    text:
      es: "La ejecución de programas de carácter temporal"
  - id: b
    correct: true
    text:
      es: "El exceso o acumulación de tareas"
  - id: c
    text:
      es: "La sustitución transitoria de los titulares"
  - id: d
    text:
      es: "La existencia de plazas vacantes sin cobertura posible"
  explanation:
    es: "La letra d) del artículo 10.1 permite nombrar interinos por «el exceso o acumulación de tareas por plazo máximo de nueve meses, dentro de un periodo de dieciocho meses». Los programas de carácter temporal tienen otro límite: tres años, ampliables hasta doce meses más. La sustitución transitoria de los titulares dura el tiempo estrictamente necesario. Las plazas vacantes admiten un máximo de tres años."
  citation: "art. 10.1.d) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q010
  prompt:
    es: "¿Por qué vía puede ampliarse hasta doce meses más, según el texto refundido de la Ley del Estatuto Básico del Empleado Público, la duración de los programas de carácter temporal para cuya ejecución se nombran interinos?"
  options:
  - id: a
    text:
      es: "Resolución motivada del órgano que efectuó el nombramiento del interino"
  - id: b
    text:
      es: "Real decreto del Consejo de Ministros que apruebe el programa temporal"
  - id: c
    correct: true
    text:
      es: "Las leyes de Función Pública que se dicten en desarrollo del Estatuto"
  - id: d
    text:
      es: "Acuerdo de la Mesa General de Negociación de las Administraciones Públicas"
  explanation:
    es: "La letra c) del artículo 10.1 limita los programas de carácter temporal a tres años, «ampliable hasta doce meses más por las leyes de Función Pública que se dicten en desarrollo de este Estatuto». La ampliación necesita, por tanto, una ley de función pública de desarrollo. No basta una resolución del órgano que nombró al interino, un real decreto del Consejo de Ministros ni un acuerdo de la Mesa General de Negociación."
  citation: "art. 10.1.c) TREBEP"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q011
  prompt:
    es: "¿Para qué circunstancia admite el texto refundido de la Ley del Estatuto Básico del Empleado Público el nombramiento de interinos con una duración de hasta tres años, ampliable hasta doce meses más por las leyes de Función Pública?"
  options:
  - id: a
    text:
      es: "La existencia de plazas vacantes sin cobertura posible"
  - id: b
    text:
      es: "El exceso o acumulación de tareas"
  - id: c
    correct: true
    text:
      es: "La ejecución de programas de carácter temporal"
  - id: d
    text:
      es: "La sustitución transitoria de los titulares"
  explanation:
    es: "Solo la letra c) del artículo 10.1, la de los programas de carácter temporal, combina los tres años con la ampliación de «hasta doce meses más por las leyes de Función Pública». Las plazas vacantes también tienen un máximo de tres años, pero sin esa ampliación y en los términos del apartado 4. El exceso o acumulación de tareas tiene un plazo máximo de nueve meses dentro de dieciocho. La sustitución transitoria dura el tiempo estrictamente necesario."
  citation: "art. 10.1.c) TREBEP"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q012
  prompt:
    es: "Según el artículo 10.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿durante cuánto tiempo puede nombrarse personal funcionario interino para la sustitución transitoria de los titulares?"
  options:
  - id: a
    text:
      es: "Por un máximo de seis meses"
  - id: b
    text:
      es: "Por un máximo de un año"
  - id: c
    text:
      es: "Por el plazo que fije su nombramiento, con un máximo de tres años"
  - id: d
    correct: true
    text:
      es: "Durante el tiempo estrictamente necesario"
  explanation:
    es: "La letra b) del artículo 10.1 permite nombrar interinos para «la sustitución transitoria de los titulares, durante el tiempo estrictamente necesario». El artículo no fija para este supuesto un plazo cerrado: ni seis meses, ni un año, ni el plazo del nombramiento con tope de tres años. Los tres años son el máximo de las plazas vacantes y de los programas de carácter temporal, no de la sustitución."
  citation: "art. 10.1.b) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q013
  prompt:
    es: "¿Por cuánto tiempo como máximo admite el texto refundido de la Ley del Estatuto Básico del Empleado Público el nombramiento de interinos por existencia de plazas vacantes sin cobertura posible por funcionarios de carrera?"
  options:
  - id: a
    text:
      es: "Tres años, ampliables hasta doce meses más por ley de desarrollo"
  - id: b
    correct: true
    text:
      es: "Tres años, en los términos previstos en el apartado 4 del artículo"
  - id: c
    text:
      es: "Un año, prorrogable por otro más si persiste la vacante"
  - id: d
    text:
      es: "Cinco años, contados desde la publicación de la oferta de empleo"
  explanation:
    es: "La letra a) del artículo 10.1 permite el nombramiento por plazas vacantes «por un máximo de tres años, en los términos previstos en el apartado 4». La ampliación de doce meses por ley de desarrollo es propia de los programas de carácter temporal, no de las vacantes. El año prorrogable y los cinco años desde la oferta de empleo no aparecen en el artículo."
  citation: "art. 10.1.a) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q014
  prompt:
    es: "Según el artículo 10.2 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la selección del personal funcionario interino se rige por los principios de igualdad, mérito, capacidad, publicidad y:"
  options:
  - id: a
    correct: true
    text:
      es: "Celeridad, y su finalidad es la cobertura inmediata del puesto"
  - id: b
    text:
      es: "Antigüedad, y su finalidad es premiar la experiencia previa en la Administración"
  - id: c
    text:
      es: "Estabilidad, y su finalidad es la consolidación del empleo temporal"
  - id: d
    text:
      es: "Libre designación, y su finalidad es asegurar la confianza del órgano que nombra"
  explanation:
    es: "El artículo 10.2 dice que estos procedimientos son públicos y se rigen «por los principios de igualdad, mérito, capacidad, publicidad y celeridad», y que «tendrán por finalidad la cobertura inmediata del puesto». La antigüedad no figura entre esos principios ni la ley fija como finalidad premiar la experiencia previa. La estabilidad y la consolidación del empleo temporal tampoco están en el artículo. La libre designación es una forma de provisión de puestos, no un principio de la selección de interinos."
  citation: "art. 10.2 TREBEP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q015
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el nombramiento derivado de la selección del personal funcionario interino recoge el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "Da lugar a la condición de funcionario de carrera tras tres años de servicios"
  - id: b
    text:
      es: "Da lugar a la condición de funcionario de carrera si la selección fue por concurso-oposición"
  - id: c
    text:
      es: "Otorga preferencia en los procesos selectivos de acceso a la condición de funcionario de carrera"
  - id: d
    correct: true
    text:
      es: "En ningún caso da lugar al reconocimiento de la condición de funcionario de carrera"
  explanation:
    es: "El artículo 10.2 dice que ese nombramiento «en ningún caso dará lugar al reconocimiento de la condición de funcionario de carrera». Por eso no la da ni tras tres años de servicios ni cuando la selección del interino se hizo por concurso-oposición. El artículo tampoco concede al interino preferencia alguna en los procesos selectivos de funcionarios de carrera."
  citation: "art. 10.2 TREBEP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1995-8729-art-27
- id: m04-l03-q016
  prompt:
    es: "Según el artículo 27.1 del Real Decreto 364/1995, de 10 de marzo, ¿quién nombra al personal funcionario interino de los Cuerpos y Escalas adscritos a un Departamento ministerial y no dependientes de la Secretaría de Estado de Función Pública?"
  options:
  - id: a
    correct: true
    text:
      es: "El Subsecretario del Departamento al que figuren adscritos"
  - id: b
    text:
      es: "El Ministro titular del Departamento al que figuren adscritos"
  - id: c
    text:
      es: "El Secretario General Técnico del Departamento de adscripción"
  - id: d
    text:
      es: "El Delegado del Gobierno en la comunidad autónoma del puesto"
  explanation:
    es: "El artículo 27.1 atribuye el nombramiento del personal funcionario interino «por el Subsecretario del Departamento al que figuren adscritos los correspondientes Cuerpos y Escalas», salvo los Cuerpos y Escalas dependientes de la Secretaría de Estado que el reglamento llama «para la Administración Pública» (hoy, Secretaría de Estado de Función Pública), cuyos interinos nombra el órgano que el artículo llama «Director general de la Función Pública». El Ministro es el órgano un nivel por encima y el Secretario General Técnico otro órgano del mismo departamento; ninguno de los dos aparece en el artículo. El Delegado del Gobierno no tiene esa competencia en el reglamento."
  citation: "art. 27.1 RD 364/1995"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1995-8729-art-27
- id: m04-l03-q017
  prompt:
    es: "Según el artículo 27.1 del Reglamento General de Ingreso del Personal al servicio de la Administración General del Estado, aprobado por el Real Decreto 364/1995, el procedimiento de selección del personal funcionario interino deberá posibilitar:"
  options:
  - id: a
    text:
      es: "La máxima participación de las organizaciones sindicales en la selección"
  - id: b
    correct: true
    text:
      es: "La máxima agilidad en la selección, en razón a la urgencia requerida"
  - id: c
    text:
      es: "La valoración preferente de los servicios previos prestados como interino"
  - id: d
    text:
      es: "La celebración de una prueba de conocimientos de carácter eliminatorio"
  explanation:
    es: "El artículo 27.1 dice que «el procedimiento deberá posibilitar la máxima agilidad en la selección, en razón a la urgencia requerida para cubrir transitoriamente los puestos de trabajo». No exige la máxima participación sindical ni la valoración preferente de servicios previos como interino. Tampoco impone una prueba de conocimientos eliminatoria: el nombramiento se hace con arreglo a los principios de mérito y capacidad."
  citation: "art. 27.1 RD 364/1995"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q018
  prompt:
    es: "Según el artículo 10.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, cuando concurre alguna de las causas de finalización de la relación de interinidad que enumera, la Administración formalizará la finalización:"
  options:
  - id: a
    text:
      es: "De oficio, con una compensación de veinte días de retribuciones por año"
  - id: b
    text:
      es: "A instancia del interesado, sin derecho a compensación alguna"
  - id: c
    correct: true
    text:
      es: "De oficio, en todo caso, y sin derecho a compensación alguna"
  - id: d
    text:
      es: "Previa audiencia de la junta de personal, con compensación económica"
  explanation:
    es: "El artículo 10.3 TREBEP dice que, por esas causas, «la Administración formalizará de oficio la finalización de la relación de interinidad […] sin derecho a compensación alguna». La finalización no se hace a instancia del interesado: el apartado dice «de oficio». La compensación de veinte días de retribuciones por año no cuadra con «sin derecho a compensación alguna». La audiencia previa de la junta de personal y la compensación económica contradicen la misma frase: el apartado dice «en todo caso» y «sin derecho a compensación alguna», y no condiciona la finalización a un trámite de audiencia."
  citation: "art. 10.3 TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q019
  prompt:
    es: "Según el artículo 10.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cuál de las siguientes es causa de finalización de la relación de interinidad?"
  options:
  - id: a
    correct: true
    text:
      es: "La finalización del plazo autorizado expresamente recogido en su nombramiento"
  - id: b
    text:
      es: "La obtención de una evaluación del desempeño inferior a la media de la unidad"
  - id: c
    text:
      es: "El transcurso de un año sin que se haya convocado la plaza que ocupa"
  - id: d
    text:
      es: "La negativa a aceptar un cambio de puesto dentro de la misma localidad"
  explanation:
    es: "La letra c) del artículo 10.3 incluye entre las causas «la finalización del plazo autorizado expresamente recogido en su nombramiento». Las otras causas del apartado son la cobertura reglada del puesto, la supresión o amortización del puesto y la finalización de la causa del nombramiento. Una evaluación del desempeño por debajo de la media de la unidad, el transcurso de un año sin convocar la plaza y la negativa a un cambio de puesto no figuran en la lista."
  citation: "art. 10.3.c) TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q020
  prompt:
    es: "¿Cuál de las siguientes razones organizativas es causa de finalización de la relación de interinidad según el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "Las que den lugar a la modificación del horario de los puestos asignados"
  - id: b
    text:
      es: "Las que den lugar al traslado de la unidad a otro edificio de la misma localidad"
  - id: c
    correct: true
    text:
      es: "Las que den lugar a la supresión o a la amortización de los puestos asignados"
  - id: d
    text:
      es: "Las que den lugar a la reducción del complemento específico de los puestos asignados"
  explanation:
    es: "La letra b) del artículo 10.3 pone fin a la interinidad por «razones organizativas que den lugar a la supresión o a la amortización de los puestos asignados». El cambio de horario, el traslado de la unidad a otro edificio de la localidad y la reducción del complemento específico no suprimen ni amortizan el puesto, así que no son causa de finalización."
  citation: "art. 10.3.b) TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q021
  prompt:
    es: "Según el texto refundido de la Ley del Estatuto Básico del Empleado Público, la cobertura reglada del puesto por personal funcionario de carrera pone fin a la relación de interinidad cuando se hace:"
  options:
  - id: a
    text:
      es: "Únicamente mediante un proceso selectivo de ingreso por turno libre"
  - id: b
    correct: true
    text:
      es: "A través de cualquiera de los procedimientos legalmente establecidos"
  - id: c
    text:
      es: "Únicamente mediante concurso de provisión de puestos de trabajo"
  - id: d
    text:
      es: "Únicamente mediante libre designación con convocatoria pública"
  explanation:
    es: "La letra a) del artículo 10.3 incluye «la cobertura reglada del puesto por personal funcionario de carrera a través de cualquiera de los procedimientos legalmente establecidos». Las tres opciones que empiezan por «únicamente» reducen esos procedimientos a uno solo, sea el ingreso por turno libre, el concurso o la libre designación, y el artículo no hace esa restricción."
  citation: "art. 10.3.a) TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q022
  prompt:
    es: "Según el artículo 10.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, las plazas vacantes desempeñadas por personal funcionario interino nombrado por existir plazas vacantes deberán ser objeto de cobertura mediante:"
  options:
  - id: a
    text:
      es: "Un proceso selectivo de promoción interna reservado al personal de la propia Administración"
  - id: b
    text:
      es: "La conversión del nombramiento en funcionario de carrera tras tres años de servicios"
  - id: c
    correct: true
    text:
      es: "Cualquiera de los mecanismos de provisión o movilidad previstos en la normativa de cada Administración"
  - id: d
    text:
      es: "La libre designación entre funcionarios de carrera del mismo grupo de clasificación profesional"
  explanation:
    es: "El primer párrafo del artículo 10.4 dice que esas plazas «deberán ser objeto de cobertura mediante cualquiera de los mecanismos de provisión o movilidad previstos en la normativa de cada Administración Pública». No limita la cobertura a la promoción interna ni a la libre designación. La conversión del interino en funcionario de carrera choca con el artículo 10.2: el nombramiento de interino nunca da esa condición."
  citation: "art. 10.4 TREBEP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q023
  prompt:
    es: "De acuerdo con el artículo 10.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, transcurridos tres años desde el nombramiento del interino por vacante, si el proceso selectivo para cubrir la plaza queda desierto:"
  options:
  - id: a
    text:
      es: "La plaza deberá amortizarse en la siguiente relación de puestos de trabajo"
  - id: b
    correct: true
    text:
      es: "Se podrá efectuar otro nombramiento de personal funcionario interino"
  - id: c
    text:
      es: "El interino continuará en la plaza hasta que se convoque un nuevo proceso"
  - id: d
    text:
      es: "La plaza quedará vacante hasta la siguiente oferta de empleo público"
  explanation:
    es: "El artículo 10.4 dice que, transcurridos tres años, se produce el fin de la relación de interinidad y la vacante solo puede ocuparla personal funcionario de carrera, «salvo que el correspondiente proceso selectivo quede desierto, en cuyo caso se podrá efectuar otro nombramiento de personal funcionario interino». El artículo no obliga a amortizar la plaza ni a dejarla vacante hasta la siguiente oferta. El interino anterior no continúa: su relación termina a los tres años, y la única permanencia que el artículo admite exige convocatoria publicada dentro de ese plazo."
  citation: "art. 10.4 TREBEP"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q024
  prompt:
    es: "Según el artículo 10.4 del texto refundido de la Ley del Estatuto Básico del Empleado Público, el interino nombrado por vacante puede permanecer excepcionalmente en la plaza transcurridos tres años si la convocatoria para su cobertura:"
  options:
  - id: a
    text:
      es: "Se aprobó en una oferta de empleo dentro de los tres años, aunque no se haya publicado"
  - id: b
    text:
      es: "Se publica dentro de los seis meses siguientes al cumplimiento de los tres años"
  - id: c
    text:
      es: "Se publicó dentro de los tres años desde la creación de la plaza vacante"
  - id: d
    correct: true
    text:
      es: "Se publicó dentro de los tres años desde su nombramiento y se resuelve en plazo"
  explanation:
    es: "El tercer párrafo del artículo 10.4 permite la permanencia «siempre que se haya publicado la correspondiente convocatoria dentro del plazo de los tres años, a contar desde la fecha del nombramiento del funcionario interino y sea resuelta conforme a los plazos establecidos en el artículo 70». No basta con que la plaza figure en una oferta de empleo si la convocatoria no se ha publicado. Publicar la convocatoria en los seis meses siguientes a los tres años llega tarde. Los tres años se cuentan desde el nombramiento del interino, no desde la creación de la plaza."
  citation: "art. 10.4 TREBEP"
  difficulty: 3
  tags:
  - "excepción"
  - "plazo"
# anchor: boe-a-2015-11719-art-10
- id: m04-l03-q025
  prompt:
    es: "¿En qué medida es aplicable al personal funcionario interino el régimen general del personal funcionario de carrera según el texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    text:
      es: "En su integridad, incluidos los derechos inherentes a la condición de funcionario de carrera"
  - id: b
    correct: true
    text:
      es: "En cuanto sea adecuado a su condición temporal, salvo los derechos inherentes a la condición de funcionario de carrera"
  - id: c
    text:
      es: "Solo en materia de retribuciones básicas y de régimen disciplinario, y no en lo demás"
  - id: d
    text:
      es: "Solo cuando lleve más de tres años de servicios en la misma plaza y Administración"
  explanation:
    es: "El artículo 10.5 aplica al interino el régimen general del funcionario de carrera «en cuanto sea adecuado a la naturaleza de su condición temporal y al carácter extraordinario y urgente de su nombramiento, salvo aquellos derechos inherentes a la condición de funcionario de carrera». La aplicación íntegra, con esos derechos incluidos, contradice la salvedad final. El artículo no limita la aplicación a las retribuciones básicas y al régimen disciplinario, ni la hace depender de tres años de servicios."
  citation: "art. 10.5 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
