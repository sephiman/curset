- id: m11-l01-v-dropwhile-001
  prompt:
    en: |-
      What does this program print? The stream is ordered, because `Stream.of` keeps the order of its arguments.

      ```java
      import java.util.stream.Stream;

      public class Main {
          public static void main(String[] args) {
              System.out.println(Stream.of(1, 2, 5, 1, 6, 2)
                      .dropWhile(n -> n < 4)
                      .toList());
          }
      }
      ```
  options:
  - id: a
    text:
      en: '`[5, 1, 6, 2]`'
    correct: true
  - id: b
    text:
      en: '`[1, 2, 1, 2]`'
  - id: c
    text:
      en: '`[1, 2]`'
  - id: d
    text:
      en: '`[1, 6, 2]`'
  explanation:
    en: '`dropWhile` drops the longest prefix of elements that match `n < 4` and returns the remaining elements. The first
      element that fails stays, and the elements after it are not tested again. The program prints `[5, 1, 6, 2]`. `[1, 2,
      1, 2]` comes from this mistake: using `filter`, which tests every element instead of stopping at the first failure.
      `[1, 2]` comes from this mistake: using `takeWhile` where `dropWhile` was written. `[1, 6, 2]` comes from this mistake:
      dropping the first element that fails as well.'
  family: dropwhile
  code_reading: true
  citation: javadoc-stream#dropWhile(java.util.function.Predicate)
  difficulty: 2
  tags: &id001
