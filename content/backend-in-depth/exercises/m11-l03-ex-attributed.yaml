type: quiz
variants:
- id: m11-l03-qa02
  prompt:
    en: According to Chris Jones in Effective Troubleshooting, which statement about logging as a tool for examining
      a system does the chapter make?
  options:
  - id: a
    correct: true
    text:
      en: Having several verbosity levels that can be raised on the fly is really useful
  - id: b
    text:
      en: Verbosity levels must be fixed at startup, since changing them needs a restart
  - id: c
    text:
      en: Sampling a fraction of operations is never appropriate when traffic is high
  - id: d
    text:
      en: Text logs suit retrospective analysis, while binary logs suit real-time debugging
  explanation:
    en: The chapter says it is really useful to have multiple verbosity levels available, along with a way to increase
      them on the fly. Raising verbosity on the fly, the chapter says, lets you examine operations in detail without
      having to restart the process, so levels need not be fixed at startup. Depending on the volume of traffic,
      it says, statistical sampling such as one operation out of every 1,000 might be better, which contradicts
      never sampling at high traffic. The chapter notes that text logs are very helpful for reactive debugging in
      real time, while storing logs in a structured binary format can make it possible to build tools to conduct
      retrospective analysis with much more information, which contradicts the claim that text logs suit retrospective
      analysis while binary logs suit real-time debugging.
  citation: sre-book-effective-troubleshooting#logging-0bS8hLhruA
  extract:
    en: It’s really useful to have multiple verbosity levels available, along with a way to increase these levels
      on the fly.
