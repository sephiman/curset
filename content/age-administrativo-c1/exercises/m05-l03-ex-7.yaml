# anchor: boe-a-2003-21614-art-148
- id: m05-l03-q201
  prompt:
    es: "¿En qué momento controla la función interventora los actos del sector público estatal que dan lugar a la realización de gastos?"
  options:
  - id: a
    correct: true
    text:
      es: "Antes de que esos actos sean aprobados."
  - id: b
    text:
      es: "Una vez aprobados, pero antes de su pago material."
  - id: c
    text:
      es: "Después de realizado el pago, al rendir las cuentas."
  - id: d
    text:
      es: "Solo cuando el órgano gestor lo pida a la Intervención."
  explanation:
    es: "El artículo 148 sitúa la función interventora antes de la aprobación del acto: es un control previo. La opción que la coloca tras la aprobación pero antes del pago y la que la coloca después del pago convierten un control previo en uno posterior, que es propio de la auditoría pública. La opción que la deja a petición del órgano gestor inventa un requisito: la función interventora es preceptiva y no depende de que nadie la pida."
  citation: "art. 148 LGP"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2003-21614-art-148
- id: m05-l03-q202
  prompt:
    es: "Según el artículo 148 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿con qué fin controla la función interventora los actos que dan lugar a gastos y a los pagos que de ellos se derivan?"
  options:
  - id: a
    correct: true
    text:
      es: "Para asegurar que su gestión se ajuste a las disposiciones aplicables en cada caso."
  - id: b
    text:
      es: "Para enjuiciar la responsabilidad contable de quienes manejen caudales públicos."
  - id: c
    text:
      es: "Para proponer la modificación de los créditos que resulten insuficientes."
  - id: d
    text:
      es: "Para formar la Cuenta General del Estado de cada ejercicio."
  explanation:
    es: "El artículo 148 dice que el control se hace «con el fin de asegurar que su gestión se ajuste a las disposiciones aplicables en cada caso». Enjuiciar la responsabilidad contable es función propia del Tribunal de Cuentas. Proponer modificaciones de crédito no es un fin de este control. Formar la Cuenta General corresponde a la Intervención General de la Administración del Estado como tarea contable, no como fin de la función interventora."
  citation: "art. 148 LGP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-149
- id: m05-l03-q203
  prompt:
    es: "¿Quién ejerce la función interventora respecto de los actos de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "El Tribunal de Cuentas y sus departamentos de fiscalización."
  - id: b
    correct: true
    text:
      es: "La Intervención General de la Administración del Estado y sus interventores delegados."
  - id: c
    text:
      es: "La Dirección General de Presupuestos y las oficinas presupuestarias."
  - id: d
    text:
      es: "La Subsecretaría de cada departamento y sus servicios de contabilidad."
  explanation:
    es: "El artículo 149.1 atribuye la función interventora a la Intervención General de la Administración del Estado y a sus interventores delegados. El Tribunal de Cuentas ejerce el control externo, no el interno. Las oficinas presupuestarias y las subsecretarías gestionan el gasto, y quien gestiona no es quien lo interviene."
  citation: "art. 149.1 LGP"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-149
- id: m05-l03-q204
  prompt:
    es: "¿Cuál de los siguientes conjuntos de sujetos queda sometido a la función interventora que regula la Ley General Presupuestaria?"
  options:
  - id: a
    correct: true
    text:
      es: "La Administración General del Estado, sus organismos autónomos y las entidades gestoras y servicios comunes de la Seguridad Social."
  - id: b
    text:
      es: "La Administración General del Estado, las sociedades mercantiles estatales y las fundaciones del sector público."
  - id: c
    text:
      es: "La Administración General del Estado, las Comunidades Autónomas y las entidades locales."
  - id: d
    text:
      es: "La Administración General del Estado, sus organismos autónomos y las entidades públicas empresariales."
  explanation:
    es: "El artículo 149.1 enumera la Administración General del Estado, sus organismos autónomos y las entidades gestoras y servicios comunes de la Seguridad Social. Las sociedades mercantiles y las fundaciones, las Comunidades Autónomas con las entidades locales y las entidades públicas empresariales no figuran en esa lista."
  citation: "art. 149.1 LGP"
  difficulty: 2
  tags:
  - "competencia"
  - "estructura"
# anchor: boe-a-2003-21614-art-150
- id: m05-l03-q205
  prompt:
    es: "Según el artículo 150.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, los actos que aprueben gastos o adquieran compromisos de gasto se someten, dentro de la función interventora, a:"
  options:
  - id: a
    correct: true
    text:
      es: "La fiscalización previa de dichos actos."
  - id: b
    text:
      es: "La intervención material de dichos actos."
  - id: c
    text:
      es: "La intervención del reconocimiento de la obligación."
  - id: d
    text:
      es: "La auditoría posterior de dichos actos."
  explanation:
    es: "El artículo 150.2.a) incluye en la función interventora la fiscalización previa de los actos que aprueben gastos o adquieran compromisos de gasto. La intervención material recae sobre el pago, no sobre la aprobación. La intervención del reconocimiento de la obligación es una actuación posterior de la cadena del gasto. La auditoría posterior pertenece a la auditoría pública y no a la función interventora."
  citation: "art. 150.2 LGP"
  difficulty: 2
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-150
- id: m05-l03-q206
  prompt:
    es: "Según el artículo 150.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué actuaciones de la función interventora recaen sobre la ordenación del pago y sobre el pago?"
  options:
  - id: a
    text:
      es: "Solo la intervención material del pago, sin intervenir la ordenación."
  - id: b
    correct: true
    text:
      es: "La intervención formal de la ordenación del pago y la intervención material del pago."
  - id: c
    text:
      es: "La fiscalización previa de ambos actos, sin intervención material."
  - id: d
    text:
      es: "La intervención formal de ambos actos, sin intervención material del pago."
  explanation:
    es: "El artículo 150.2 distingue dos letras: la intervención formal de la ordenación del pago (c) y la intervención material del pago (d). La opción que omite la ordenación quita la letra c. La que sustituye ambas por una fiscalización previa confunde las modalidades. La que deja ambos actos en intervención formal elimina la intervención material, que la letra d prevé expresamente."
  citation: "art. 150.2 LGP"
  difficulty: 3
  tags:
  - "procedimiento"
  - "concepto"
# anchor: boe-a-2003-21614-art-151
- id: m05-l03-q209
  prompt:
    es: "¿Cuál de las siguientes subvenciones queda fuera de la fiscalización previa según la Ley General Presupuestaria?"
  options:
  - id: a
    correct: true
    text:
      es: "La subvención con asignación nominativa."
  - id: b
    text:
      es: "La subvención concedida mediante convocatoria periódica previa."
  - id: c
    text:
      es: "La subvención concedida de forma directa por razones de interés público."
  - id: d
    text:
      es: "La subvención financiada con fondos de la Unión Europea."
  explanation:
    es: "La letra e) del artículo 151 LGP exceptúa de la fiscalización previa «las subvenciones con asignación nominativa». El artículo cierra la lista en siete letras: contratos menores (a), gastos periódicos y de tracto sucesivo (b), gastos menores de 5.000 euros por caja fija (c), procesos electorales (d), subvenciones nominativas (e), contratos de acceso a bases de datos y suscripciones (f) y emergencia (g), más los gastos menores de 5.000 euros en el extranjero con fondos a justificar. La única subvención de la lista es la nominativa, definida por cómo se asigna. La subvención concedida mediante convocatoria periódica se define por su procedimiento de concesión, y ninguna letra lo recoge. La concedida de forma directa por razones de interés público tampoco está en ninguna letra, porque la letra e) pide asignación nominativa y no una justificación de interés público. La financiada con fondos de la Unión Europea se define por su origen, y ninguna de las siete letras ni el párrafo final habla del origen de los fondos."
  citation: "art. 151 LGP"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2003-21614-art-152
- id: m05-l03-q210
  prompt:
    es: "¿Qué órgano puede acordar que la fiscalización e intervención previas se limiten a comprobar determinados extremos?"
  options:
  - id: a
    text:
      es: "El Ministro de Hacienda, a propuesta de la Intervención General de la Administración del Estado."
  - id: b
    correct: true
    text:
      es: "El Consejo de Ministros, a propuesta de la Intervención General de la Administración del Estado."
  - id: c
    text:
      es: "La Intervención General de la Administración del Estado, a propuesta del Consejo de Ministros."
  - id: d
    text:
      es: "El Consejo de Ministros, a propuesta del Tribunal de Cuentas."
  explanation:
    es: "El artículo 152.1 atribuye la decisión al Consejo de Ministros, a propuesta de la Intervención General de la Administración del Estado. La opción del Ministro de Hacienda baja la decisión un nivel. La que invierte los papeles hace decidir a la Intervención y proponer al Consejo. La que hace proponer al Tribunal de Cuentas mezcla el control interno con el externo."
  citation: "art. 152.1 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-152
- id: m05-l03-q211
  prompt:
    es: "Entre los extremos a los que el Consejo de Ministros puede limitar la fiscalización e intervención previas, el artículo 152.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria incluye:"
  options:
  - id: a
    text:
      es: "La oportunidad económica del gasto para el interés general."
  - id: b
    text:
      es: "La eficiencia del procedimiento de contratación elegido por el órgano gestor."
  - id: c
    correct: true
    text:
      es: "La existencia de crédito presupuestario adecuado y suficiente para el gasto propuesto."
  - id: d
    text:
      es: "La adecuación del precio del contrato al valor de mercado."
  explanation:
    es: "El artículo 152.1.a) incluye la existencia de crédito presupuestario y que el propuesto sea adecuado y suficiente a la naturaleza del gasto. Las otras opciones son juicios de oportunidad, eficiencia o precio, que no son extremos de legalidad previstos en el artículo."
  citation: "art. 152.1 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-152
- id: m05-l03-q212
  prompt:
    es: "Aunque se limite la fiscalización previa a los requisitos básicos, el artículo 152.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria aplica el régimen general respecto de los gastos que deba aprobar:"
  options:
  - id: a
    text:
      es: "Los Ministros."
  - id: b
    text:
      es: "Los Secretarios de Estado."
  - id: c
    text:
      es: "Los Subsecretarios."
  - id: d
    correct: true
    text:
      es: "El Consejo de Ministros."
  explanation:
    es: "El artículo 152.2 mantiene el régimen general de fiscalización previa para los gastos que deba aprobar el Consejo de Ministros. Los gastos que aprueban los Ministros, los Secretarios de Estado o los Subsecretarios pueden quedar en el régimen de requisitos básicos."
  citation: "art. 152.2 LGP"
  difficulty: 3
  tags:
  - "excepción"
  - "órgano"
# anchor: boe-a-2003-21614-art-154
- id: m05-l03-q213
  prompt:
    es: "De acuerdo con el artículo 154.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, si la Intervención está en desacuerdo con el contenido de los actos examinados, formulará sus reparos:"
  options:
  - id: a
    text:
      es: "Por escrito, sin necesidad de citar los preceptos legales aplicables."
  - id: b
    text:
      es: "De palabra, dejando constancia de ello en el expediente."
  - id: c
    text:
      es: "Mediante resolución motivada que notifica al Tribunal de Cuentas."
  - id: d
    correct: true
    text:
      es: "Por escrito, con cita de los preceptos legales en los que sustente su criterio."
  explanation:
    es: "El artículo 154.1 LGP dice que la Intervención «deberá formular sus reparos por escrito, con cita de los preceptos legales en los que sustente su criterio». Dispensar de citar los preceptos contradice «con cita de los preceptos legales». El reparo de palabra contradice «por escrito». El reparo dirigido al Tribunal de Cuentas no es el trámite del apartado: el reparo suspende la tramitación del expediente hasta que se solvente por subsanación o por la resolución del procedimiento del artículo siguiente."
  citation: "art. 154.1 LGP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-2003-21614-art-154
- id: m05-l03-q214
  prompt:
    es: "¿Qué efecto produce la formulación de un reparo por la Intervención sobre el expediente examinado?"
  options:
  - id: a
    text:
      es: "No suspende la tramitación, pero impide el pago material del gasto."
  - id: b
    text:
      es: "Anula el acto examinado y obliga al órgano gestor a iniciar un nuevo expediente."
  - id: c
    text:
      es: "Traslada el expediente al Tribunal de Cuentas para que lo resuelva."
  - id: d
    correct: true
    text:
      es: "Suspende su tramitación hasta que se solvente por subsanación o por resolución de la discrepancia."
  explanation:
    es: "El artículo 154.1 dice que el reparo suspende la tramitación del expediente hasta que se solvente, por subsanación de las deficiencias o por resolución de la discrepancia. La opción que mantiene la tramitación y solo frena el pago contradice la suspensión. Tampoco anula el acto ni lo envía al Tribunal de Cuentas."
  citation: "art. 154.1 LGP"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2003-21614-art-154
- id: m05-l03-q215
  prompt:
    es: "Según el artículo 154.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el reparo suspende la tramitación del expediente hasta que se solvente; si el órgano gestor no lo acepta, se solventa por:"
  options:
  - id: a
    text:
      es: "El transcurso de quince días sin que la Intervención lo reitere."
  - id: b
    correct: true
    text:
      es: "La resolución del procedimiento de discrepancias previsto en el artículo siguiente."
  - id: c
    text:
      es: "La resolución del Tribunal de Cuentas sobre la legalidad del gasto."
  - id: d
    text:
      es: "La aprobación del gasto por el órgano gestor bajo su responsabilidad."
  explanation:
    es: "Si el órgano gestor no acepta el reparo, el artículo 154.1 lo remite a la resolución del procedimiento de discrepancias del artículo 155. El silencio de la Intervención no lo cierra, el Tribunal de Cuentas no interviene en el control interno y el órgano gestor no puede aprobar por su cuenta mientras el reparo siga vivo."
  citation: "art. 154.1 LGP"
  difficulty: 2
  tags:
  - "procedimiento"
  - "efecto"
# anchor: boe-a-2003-21614-art-154
- id: m05-l03-q216
  prompt:
    es: "En el régimen general de fiscalización e intervención previa, el artículo 154.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria manda formular reparo cuando el gasto se proponga a un órgano que:"
  options:
  - id: a
    text:
      es: "Haya aprobado antes otro gasto con cargo al mismo crédito."
  - id: b
    text:
      es: "Pertenezca a un departamento distinto del que tramita el expediente."
  - id: c
    text:
      es: "No cuente con una intervención delegada propia."
  - id: d
    correct: true
    text:
      es: "Carezca de competencia para su aprobación."
  explanation:
    es: "El artículo 154.2.b) prevé el reparo cuando el gasto se propone a un órgano sin competencia para aprobarlo. Haber aprobado otro gasto con cargo al mismo crédito, pertenecer a otro departamento o carecer de intervención delegada propia no figuran entre los casos del artículo."
  citation: "art. 154.2 LGP"
  difficulty: 2
  tags:
  - "requisito"
  - "competencia"
# anchor: boe-a-2003-21614-art-154
- id: m05-l03-q217
  prompt:
    es: "En el régimen general de fiscalización e intervención previa, el artículo 154.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria manda formular reparo cuando este se base en:"
  options:
  - id: a
    text:
      es: "La discrepancia sobre la oportunidad política del gasto."
  - id: b
    correct: true
    text:
      es: "La insuficiencia de crédito o la inadecuación del crédito propuesto."
  - id: c
    text:
      es: "El retraso del proveedor en la entrega de la prestación."
  - id: d
    text:
      es: "La existencia de un recurso pendiente ante el Tribunal de Cuentas."
  explanation:
    es: "El artículo 154.2.a) prevé el reparo cuando se base en la insuficiencia de crédito o cuando el propuesto no se considere adecuado. La oportunidad política, el retraso del proveedor y un recurso pendiente no son causas de reparo del artículo."
  citation: "art. 154.2 LGP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-21614-art-155
- id: m05-l03-q219
  prompt:
    es: "Si el órgano gestor no acepta el reparo de la Intervención, ¿ante quién plantea la discrepancia motivada por escrito?"
  options:
  - id: a
    text:
      es: "Al Consejo de Ministros, sin pasar por la Intervención."
  - id: b
    text:
      es: "Al Tribunal de Cuentas, por conducto de la Subsecretaría."
  - id: c
    text:
      es: "A la Dirección General del Tesoro y Política Financiera del Ministerio."
  - id: d
    correct: true
    text:
      es: "A la Intervención General de la Administración del Estado."
  explanation:
    es: "El artículo 155 manda plantear la discrepancia a la Intervención General de la Administración del Estado. El Consejo de Ministros solo resuelve en el último escalón y el Tribunal de Cuentas no interviene en el control interno. La Dirección General del Tesoro no tiene función alguna en este procedimiento."
  citation: "art. 155 LGP"
  difficulty: 1
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2003-21614-art-155
- id: m05-l03-q220
  prompt:
    es: "En un ministerio, ¿por conducto de qué órgano plantea el gestor la discrepancia ante la Intervención General de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "La Secretaría General Técnica del departamento."
  - id: b
    text:
      es: "La Dirección General de Presupuestos."
  - id: c
    correct: true
    text:
      es: "La Subsecretaría del departamento."
  - id: d
    text:
      es: "La intervención delegada que formuló el reparo."
  explanation:
    es: "En los ministerios el cauce es la Subsecretaría del departamento. La Secretaría General Técnica y la Dirección General de Presupuestos no figuran en el artículo. La intervención delegada es quien formuló el reparo, no el cauce de la discrepancia contra él."
  citation: "art. 155 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2003-21614-art-155
- id: m05-l03-q221
  prompt:
    es: "Según el artículo 155 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, en los organismos o entidades distintos de los ministerios la discrepancia se plantea a la Intervención General de la Administración del Estado a través de:"
  options:
  - id: a
    text:
      es: "La Subsecretaría del ministerio de adscripción."
  - id: b
    correct: true
    text:
      es: "Sus presidentes o directores."
  - id: c
    text:
      es: "Su Secretaría General."
  - id: d
    text:
      es: "El interventor delegado del organismo."
  explanation:
    es: "Fuera de los ministerios, el artículo 155 manda plantearla a través de los presidentes o directores de los organismos o entidades. La Subsecretaría es el cauce de los ministerios, no el de los organismos. La Secretaría General no figura y el interventor delegado es quien formuló el reparo."
  citation: "art. 155 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1996-1578-art-16
- id: m05-l03-q222
  prompt:
    es: "¿En qué plazo plantea el órgano gestor que no acepta el reparo la discrepancia ante la Intervención?"
  options:
  - id: a
    text:
      es: "En el plazo máximo de diez días."
  - id: b
    correct: true
    text:
      es: "En el plazo de quince días."
  - id: c
    text:
      es: "En el plazo de cinco días."
  - id: d
    text:
      es: "En el plazo de un mes."
  explanation:
    es: "El artículo 16.1 RD 2188/1995 dice que, cuando el órgano gestor no acepte el reparo, «planteará a la Intervención discrepancia, en el plazo de quince días». Diez, cinco días y un mes no coinciden con la cifra del apartado, que es quince días."
  citation: "art. 16.1 RD 2188/1995"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1996-1578-art-16
- id: m05-l03-q223
  prompt:
    es: "Según el artículo 16.2 del Real Decreto 2188/1995, de 28 de diciembre, por el que se desarrolla el régimen del control interno ejercido por la IGAE, si el reparo lo formuló una intervención delegada, la IGAE resuelve la discrepancia:"
  options:
  - id: a
    correct: true
    text:
      es: "En quince días, con carácter obligatorio para la intervención delegada."
  - id: b
    text:
      es: "En quince días, con carácter meramente consultivo para la intervención delegada."
  - id: c
    text:
      es: "En diez días, con carácter obligatorio para la intervención delegada."
  - id: d
    text:
      es: "En un mes, con carácter consultivo para la intervención delegada."
  explanation:
    es: "El artículo 16.2 combina dos datos: quince días para resolver y resolución obligatoria para la intervención delegada. La opción consultiva cambia el efecto. La de diez días cambia el plazo. La de un mes cambia los dos."
  citation: "art. 16.2 RD 2188/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-1996-1578-art-16
- id: m05-l03-q224
  prompt:
    es: "Un órgano gestor recibe el lunes, 1 de febrero de 2027, un reparo de la Intervención y no lo acepta. El plazo de quince días para plantear la discrepancia se cuenta en días hábiles, desde el día siguiente a la recepción. ¿Qué día termina el plazo?"
  options:
  - id: a
    correct: true
    text:
      es: "El lunes, 22 de febrero de 2027."
  - id: b
    text:
      es: "El martes, 16 de febrero de 2027."
  - id: c
    text:
      es: "El viernes, 19 de febrero de 2027."
  - id: d
    text:
      es: "El martes, 23 de febrero de 2027."
  explanation:
    es: "El artículo 16.1 del Real Decreto 2188/1995 fija quince días. Con días hábiles el cómputo empieza el martes 2 de febrero, excluye sábados y domingos y llega al decimoquinto día hábil el lunes 22 de febrero. El martes 16 es el resultado de contar quince días naturales. El viernes 19 resulta de contar el día de la recepción como primero. El martes 23 añade un día de más."
  citation: "art. 16.1 RD 2188/1995"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-1996-1578-art-16
- id: m05-l03-q225
  prompt:
    es: "La Intervención General de la Administración del Estado recibe el jueves, 1 de julio de 2027, la discrepancia sobre un reparo de una intervención delegada. Si el plazo de quince días para resolverla se cuenta en días hábiles, desde el día siguiente, ¿qué día termina?"
  options:
  - id: a
    text:
      es: "El viernes, 16 de julio de 2027."
  - id: b
    text:
      es: "El miércoles, 21 de julio de 2027."
  - id: c
    correct: true
    text:
      es: "El jueves, 22 de julio de 2027."
  - id: d
    text:
      es: "El viernes, 23 de julio de 2027."
  explanation:
    es: "El artículo 16.2 del Real Decreto 2188/1995 da quince días para resolver. El cómputo empieza el viernes 2 de julio, no cuenta sábados ni domingos y el decimoquinto día hábil es el jueves 22 de julio. El viernes 16 corresponde a quince días naturales. El miércoles 21 cuenta el día de la recepción como primero. El viernes 23 cuenta un día de más."
  citation: "art. 16.2 RD 2188/1995"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2003-21614-art-155
- id: m05-l03-q226
  prompt:
    es: "Cuando la IGAE resuelve la discrepancia sobre un reparo de una intervención delegada, ¿para quién es obligatoria su resolución?"
  options:
  - id: a
    text:
      es: "El Consejo de Ministros, que queda vinculado por ella."
  - id: b
    text:
      es: "El Tribunal de Cuentas, en su función fiscalizadora."
  - id: c
    text:
      es: "La Subsecretaría del departamento gestor."
  - id: d
    correct: true
    text:
      es: "La intervención delegada que formuló el reparo."
  explanation:
    es: "El artículo 155.a) dice que la resolución de la Intervención General de la Administración del Estado es obligatoria «para aquella», es decir, para la intervención delegada que formuló el reparo. Ni el Consejo de Ministros ni el Tribunal de Cuentas quedan vinculados, y la Subsecretaría solo hace de cauce."
  citation: "art. 155.a) LGP"
  difficulty: 2
  tags:
  - "efecto"
  - "órgano"
# anchor: boe-a-2003-21614-art-155
- id: m05-l03-q227
  prompt:
    es: "Si el reparo lo formuló una intervención delegada en centros del Ministerio de Defensa, ¿qué órgano conoce la discrepancia, con criterio vinculante, antes que la IGAE?"
  options:
  - id: a
    text:
      es: "La Intervención General de la Seguridad Social."
  - id: b
    correct: true
    text:
      es: "La Intervención General de la Defensa."
  - id: c
    text:
      es: "La Subsecretaría de Defensa."
  - id: d
    text:
      es: "El Consejo de Ministros."
  explanation:
    es: "Para las intervenciones delegadas del Ministerio de Defensa conoce primero la Intervención General de la Defensa, y su criterio vincula a la delegada. La Intervención General de la Seguridad Social cumple esa función para las entidades de la Seguridad Social. La Subsecretaría solo hace de cauce y el Consejo de Ministros resuelve en el último escalón."
  citation: "art. 155.a) LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-155
- id: m05-l03-q228
  prompt:
    es: "Si el reparo lo formuló una intervención delegada en una entidad gestora de la Seguridad Social, ¿quién conoce antes la discrepancia?"
  options:
  - id: a
    text:
      es: "La Intervención General de la Defensa."
  - id: b
    correct: true
    text:
      es: "La Intervención General de la Seguridad Social."
  - id: c
    text:
      es: "La Tesorería General de la Seguridad Social."
  - id: d
    text:
      es: "La Dirección General de Presupuestos."
  explanation:
    es: "En las entidades gestoras y servicios comunes de la Seguridad Social conoce primero la Intervención General de la Seguridad Social, haciendo constar su criterio vinculante. La Intervención General de la Defensa solo actúa en el Ministerio de Defensa. La Tesorería y la Dirección General de Presupuestos no figuran en el artículo."
  citation: "art. 155.a) LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
