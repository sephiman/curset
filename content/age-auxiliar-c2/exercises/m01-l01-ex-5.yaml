# anchor: boe-a-1978-31229-art-13
- id: m01-l01-q007
  prompt:
    es: "Señale la respuesta correcta sobre el derecho de sufragio activo y pasivo de los extranjeros en las elecciones municipales, según la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "Puede establecerse por tratado o ley, sin necesidad de atender a criterios de reciprocidad."
  - id: b
    text:
      es: "Solo puede establecerse por tratado internacional, atendiendo a criterios de reciprocidad."
  - id: c
    text:
      es: "Puede establecerse por ley, pero limitado al sufragio activo."
  - id: d
    correct: true
    text:
      es: "Puede establecerse por tratado o ley, atendiendo a criterios de reciprocidad."
  explanation:
    es: "El artículo 13.2 reserva a los españoles los derechos del artículo 23, «salvo lo que, atendiendo a criterios de reciprocidad, pueda establecerse por tratado o ley para el derecho de sufragio activo y pasivo en las elecciones municipales». La reciprocidad es obligada, valen tanto el tratado como la ley y la excepción cubre el sufragio activo y el pasivo."
  citation: "art. 13.2 CE"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1978-31229-art-14
- id: m01-l01-q008
  prompt:
    es: "Según el artículo 14 de la Constitución Española de 1978, los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de:"
  options:
  - id: a
    correct: true
    text:
      es: "Nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social."
  - id: b
    text:
      es: "Nacimiento, raza, sexo, religión u opinión, sin que la ley pueda añadir otras causas."
  - id: c
    text:
      es: "Raza, sexo, religión, opinión o nacionalidad, en los términos que establezca la ley."
  - id: d
    text:
      es: "Nacimiento, raza, sexo o religión, salvo lo que dispongan las leyes orgánicas."
  explanation:
    es: "El artículo 14 enumera «nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social». La lista es abierta, por eso es incorrecta la opción que la cierra. Las otras dos quitan causas del texto, añaden la nacionalidad o introducen salvedades que el artículo no contiene."
  citation: "art. 14 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-17
- id: m01-l01-q009
  prompt:
    es: "Según el artículo 17.2 de la Constitución Española de 1978, ¿en qué plazo máximo el detenido deberá ser puesto en libertad o a disposición de la autoridad judicial?"
  options:
  - id: a
    text:
      es: "En el plazo máximo de veinticuatro horas."
  - id: b
    correct: true
    text:
      es: "En el plazo máximo de setenta y dos horas."
  - id: c
    text:
      es: "En el plazo máximo de cuarenta y ocho horas."
  - id: d
    text:
      es: "En el plazo máximo de noventa y seis horas."
  explanation:
    es: "El artículo 17.2 dice que la detención preventiva no podrá durar más del tiempo estrictamente necesario y que, «en todo caso, en el plazo máximo de setenta y dos horas», el detenido debe ser puesto en libertad o a disposición judicial. Veinticuatro, cuarenta y ocho y noventa y seis horas no aparecen en el artículo."
  citation: "art. 17.2 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-18
- id: m01-l01-q010
  prompt:
    es: "Según el artículo 18.2 de la Constitución Española de 1978, que declara inviolable el domicilio, ¿en qué casos puede hacerse en él una entrada o registro?"
  options:
  - id: a
    correct: true
    text:
      es: "Con consentimiento del titular o resolución judicial, salvo en caso de flagrante delito."
  - id: b
    text:
      es: "Con consentimiento del titular o resolución judicial o gubernativa, salvo en caso de flagrante delito."
  - id: c
    text:
      es: "Solo con resolución judicial, incluso en caso de flagrante delito."
  - id: d
    text:
      es: "Con consentimiento del titular, resolución judicial o resolución administrativa motivada."
  explanation:
    es: "El artículo 18.2 dice que ninguna entrada o registro podrá hacerse «sin consentimiento del titular o resolución judicial, salvo en caso de flagrante delito». No basta una resolución gubernativa ni una administrativa. El flagrante delito es la excepción, así que no hace falta resolución judicial en ese caso."
  citation: "art. 18.2 CE"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1978-31229-art-20
- id: m01-l01-q011
  prompt:
    es: "De acuerdo con el artículo 20.5 de la Constitución Española de 1978, el secuestro de publicaciones, grabaciones y otros medios de información solo podrá acordarse:"
  options:
  - id: a
    text:
      es: "En virtud de resolución judicial o, en caso de urgencia, gubernativa."
  - id: b
    correct: true
    text:
      es: "En virtud de resolución judicial."
  - id: c
    text:
      es: "En virtud de resolución del Ministerio Fiscal, con posterior control judicial."
  - id: d
    text:
      es: "En virtud de resolución motivada de la autoridad administrativa competente."
  explanation:
    es: "El artículo 20.5 dice: «Sólo podrá acordarse el secuestro de publicaciones, grabaciones y otros medios de información en virtud de resolución judicial». No admite resolución gubernativa por urgencia, ni del Ministerio Fiscal, ni de una autoridad administrativa."
  citation: "art. 20.5 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-1978-31229-art-21
- id: m01-l01-q012
  prompt:
    es: "Según el artículo 21 de la Constitución Española de 1978, en los casos de reuniones en lugares de tránsito público y manifestaciones:"
  options:
  - id: a
    text:
      es: "Se requerirá autorización previa de la autoridad, que podrá denegarla por razones fundadas de alteración del orden público."
  - id: b
    text:
      es: "Se dará comunicación previa a la autoridad, que podrá prohibirlas por razones fundadas de alteración del orden público, aunque no haya peligro."
  - id: c
    correct: true
    text:
      es: "Se dará comunicación previa a la autoridad, que solo podrá prohibirlas cuando existan razones fundadas de alteración del orden público, con peligro para personas o bienes."
  - id: d
    text:
      es: "Se requerirá autorización judicial previa cuando existan razones fundadas de alteración del orden público."
  explanation:
    es: "El artículo 21.2 exige «comunicación previa a la autoridad, que sólo podrá prohibirlas cuando existan razones fundadas de alteración del orden público, con peligro para personas o bienes». No es una autorización, ni administrativa ni judicial. La prohibición exige las dos cosas: alteración del orden público y peligro para personas o bienes."
  citation: "art. 21.2 CE"
  difficulty: 3
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-1978-31229-art-21
- id: m01-l01-q013
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el derecho de reunión pacífica y sin armas, tal como lo reconoce la Constitución Española de 1978, es correcta?"
  options:
  - id: a
    text:
      es: "Su ejercicio necesitará autorización previa de la Delegación del Gobierno."
  - id: b
    text:
      es: "Su ejercicio necesitará autorización previa cuando participen más de veinte personas."
  - id: c
    text:
      es: "Su ejercicio necesitará autorización previa salvo en los locales cerrados."
  - id: d
    correct: true
    text:
      es: "Su ejercicio no necesitará autorización previa."
  explanation:
    es: "El artículo 21.1 dice: «El ejercicio de este derecho no necesitará autorización previa». Las otras tres opciones introducen una autorización que el artículo excluye, sea con carácter general, por número de asistentes o por el lugar."
  citation: "art. 21.1 CE"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-22
- id: m01-l01-q014
  prompt:
    es: "De acuerdo con el artículo 22 de la Constitución Española de 1978, las asociaciones solo podrán ser disueltas o suspendidas en sus actividades:"
  options:
  - id: a
    text:
      es: "En virtud de resolución administrativa motivada del Ministerio del Interior."
  - id: b
    correct: true
    text:
      es: "En virtud de resolución judicial motivada."
  - id: c
    text:
      es: "En virtud de resolución judicial o gubernativa, según los casos."
  - id: d
    text:
      es: "Por acuerdo del Consejo de Ministros, previa audiencia de la asociación."
  explanation:
    es: "El artículo 22.4 dice que las asociaciones «sólo podrán ser disueltas o suspendidas en sus actividades en virtud de resolución judicial motivada». No cabe hacerlo por resolución administrativa o gubernativa ni por acuerdo del Consejo de Ministros."
  citation: "art. 22.4 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-1978-31229-art-29
- id: m01-l01-q015
  prompt:
    es: "¿Cómo pueden ejercer el derecho de petición los miembros de las Fuerzas o Institutos armados o de los Cuerpos sometidos a disciplina militar, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Individual y colectivamente, como el resto de los españoles."
  - id: b
    text:
      es: "Solo colectivamente, a través de sus asociaciones profesionales."
  - id: c
    correct: true
    text:
      es: "Solo individualmente y con arreglo a lo dispuesto en su legislación específica."
  - id: d
    text:
      es: "Solo individualmente y previa autorización de su superior jerárquico."
  explanation:
    es: "El artículo 29.2 dice que podrán ejercer este derecho «sólo individualmente y con arreglo a lo dispuesto en su legislación específica». La petición colectiva es la regla general del artículo 29.1, que no les alcanza. El artículo no exige autorización del superior."
  citation: "art. 29.2 CE"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1978-31229-art-55
- id: m01-l01-q019
  prompt:
    es: "Según el artículo 55.1 de la Constitución Española de 1978, ¿cuál de los siguientes derechos NO puede suspenderse cuando se acuerda la declaración del estado de excepción o de sitio?"
  options:
  - id: a
    text:
      es: "El derecho a la huelga de los trabajadores."
  - id: b
    text:
      es: "El derecho de reunión pacífica y sin armas."
  - id: c
    text:
      es: "El derecho a elegir libremente la residencia y a circular por el territorio nacional."
  - id: d
    correct: true
    text:
      es: "El derecho de asociación."
  explanation:
    es: "El artículo 55.1 permite suspender los derechos de los artículos 17, 18.2 y 3, 19, 20.1.a) y d) y 5, 21, 28.2 y 37.2. La huelga (art. 28.2), la reunión (art. 21) y la libre residencia y circulación (art. 19) están en la lista. El derecho de asociación (art. 22) no está, así que no puede suspenderse."
  citation: "art. 55.1 CE"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-55
- id: m01-l01-q020
  prompt:
    es: "De acuerdo con el artículo 55.1 de la Constitución Española de 1978, cuando se declara el estado de excepción, no pueden suspenderse los derechos del detenido consistentes en:"
  options:
  - id: a
    correct: true
    text:
      es: "Ser informado de sus derechos y de las razones de su detención, no ser obligado a declarar y contar con asistencia de abogado."
  - id: b
    text:
      es: "No permanecer detenido más de setenta y dos horas sin ser puesto a disposición judicial."
  - id: c
    text:
      es: "No sufrir entradas ni registros en su domicilio sin resolución judicial."
  - id: d
    text:
      es: "Mantener el secreto de sus comunicaciones salvo resolución judicial."
  explanation:
    es: "El artículo 55.1 exceptúa de la suspensión «el apartado 3 del artículo 17 para el supuesto de declaración de estado de excepción». Ese apartado recoge el derecho a ser informado, a no declarar y a la asistencia de abogado. El plazo de setenta y dos horas (art. 17.2), la inviolabilidad del domicilio (art. 18.2) y el secreto de las comunicaciones (art. 18.3) sí pueden suspenderse."
  citation: "art. 55.1 CE"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-116
- id: m01-l01-q021
  prompt:
    es: "De acuerdo con el artículo 116.2 de la Constitución Española de 1978, el estado de alarma será declarado por el Gobierno mediante decreto acordado en Consejo de Ministros por un plazo máximo de:"
  options:
  - id: a
    text:
      es: "Quince días, previa autorización del Congreso de los Diputados."
  - id: b
    correct: true
    text:
      es: "Quince días, dando cuenta al Congreso de los Diputados."
  - id: c
    text:
      es: "Treinta días, dando cuenta al Congreso de los Diputados."
  - id: d
    text:
      es: "Treinta días, prorrogables por otro plazo igual."
  explanation:
    es: "El artículo 116.2 fija un plazo máximo de quince días, «dando cuenta al Congreso de los Diputados», cuya autorización solo se necesita para prorrogarlo. La autorización previa del Congreso corresponde al estado de excepción. Los treinta días prorrogables por otro plazo igual son también del estado de excepción (art. 116.3)."
  citation: "art. 116.2 CE"
  difficulty: 1
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-1978-31229-art-116
- id: m01-l01-q022
  prompt:
    es: "Según el artículo 116.3 de la Constitución Española de 1978, ¿qué duración puede tener el estado de excepción que determinen su autorización y proclamación?"
  options:
  - id: a
    text:
      es: "No podrá exceder de quince días, prorrogables por otro plazo igual."
  - id: b
    text:
      es: "No podrá exceder de treinta días, sin posibilidad de prórroga."
  - id: c
    text:
      es: "La que determine el Congreso de los Diputados, sin límite máximo."
  - id: d
    correct: true
    text:
      es: "No podrá exceder de treinta días, prorrogables por otro plazo igual."
  explanation:
    es: "El artículo 116.3 dice que su duración «no podrá exceder de treinta días, prorrogables por otro plazo igual, con los mismos requisitos». Quince días es el plazo máximo del estado de alarma. La prórroga está permitida. La duración que fija libremente el Congreso es la del estado de sitio (art. 116.4)."
  citation: "art. 116.3 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-167
- id: m01-l01-q025
  prompt:
    es: "¿Qué mayoría exige la Constitución Española de 1978 para aprobar un proyecto de reforma que no afecte al título preliminar, a la sección 1.ª del capítulo segundo del título I ni al título II?"
  options:
  - id: a
    text:
      es: "Dos tercios de cada una de las Cámaras."
  - id: b
    correct: true
    text:
      es: "Tres quintos de cada una de las Cámaras."
  - id: c
    text:
      es: "Mayoría absoluta del Congreso y tres quintos del Senado."
  - id: d
    text:
      es: "Tres quintos del Congreso y mayoría absoluta del Senado."
  explanation:
    es: "Esa reforma sigue el procedimiento ordinario, y el artículo 167.1 dice que los proyectos «deberán ser aprobados por una mayoría de tres quintos de cada una de las Cámaras». Los dos tercios de cada Cámara son la mayoría del procedimiento agravado (art. 168). Las combinaciones de mayoría absoluta en una Cámara y tres quintos en la otra no aparecen en el artículo. La vía alternativa del artículo 167.2 exige dos tercios del Congreso y mayoría absoluta del Senado."
  citation: "art. 167.1 CE"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-167
- id: m01-l01-q026
  prompt:
    es: "De acuerdo con el artículo 167.2 de la Constitución Española de 1978, de no lograrse la aprobación con la Comisión paritaria, el Congreso, por mayoría de dos tercios, podrá aprobar la reforma siempre que el texto haya obtenido:"
  options:
  - id: a
    text:
      es: "El voto favorable de tres quintos del Senado."
  - id: b
    text:
      es: "El voto favorable de la mayoría simple del Senado."
  - id: c
    text:
      es: "El voto favorable de dos tercios del Senado."
  - id: d
    correct: true
    text:
      es: "El voto favorable de la mayoría absoluta del Senado."
  explanation:
    es: "El artículo 167.2 exige que el texto haya obtenido «el voto favorable de la mayoría absoluta del Senado». Los tres quintos del Senado son la mayoría inicial del artículo 167.1, que aquí no se ha alcanzado. La mayoría simple y la de dos tercios no son las del artículo."
  citation: "art. 167.2 CE"
  difficulty: 3
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-167
- id: m01-l01-q027
  prompt:
    es: "De acuerdo con el artículo 167.3 de la Constitución Española de 1978, la reforma aprobada por las Cortes se somete a referéndum para su ratificación cuando, dentro de los quince días siguientes a su aprobación, lo solicite:"
  options:
  - id: a
    correct: true
    text:
      es: "Una décima parte de los miembros de cualquiera de las Cámaras."
  - id: b
    text:
      es: "Una décima parte de los miembros de cada una de las Cámaras."
  - id: c
    text:
      es: "Una quinta parte de los miembros de cualquiera de las Cámaras."
  - id: d
    text:
      es: "La mayoría absoluta de los miembros del Congreso de los Diputados."
  explanation:
    es: "El artículo 167.3 exige que lo soliciten «una décima parte de los miembros de cualquiera de las Cámaras». Basta una Cámara, no hace falta que la décima parte se reúna en las dos. Una quinta parte y la mayoría absoluta del Congreso no son las del artículo."
  citation: "art. 167.3 CE"
  difficulty: 2
  tags:
  - "requisito"
  - "plazo"
# anchor: boe-a-1978-31229-art-168
- id: m01-l01-q028
  prompt:
    es: "Se sigue el procedimiento agravado, con aprobación del principio por dos tercios de cada Cámara y disolución inmediata de las Cortes, para la reforma parcial que afecte:"
  options:
  - id: a
    text:
      es: "Al título III, De las Cortes Generales."
  - id: b
    correct: true
    text:
      es: "Al título II, De la Corona."
  - id: c
    text:
      es: "A la sección 2.ª del capítulo segundo del título I."
  - id: d
    text:
      es: "Al título VIII, De la Organización Territorial del Estado."
  explanation:
    es: "El artículo 168.1 reserva el procedimiento agravado a la revisión total y a la parcial que afecte «al Título preliminar, al Capítulo segundo, Sección primera del Título I, o al Título II». El título III, la sección 2.ª del capítulo segundo del título I y el título VIII se reforman por el procedimiento ordinario del artículo 167."
  citation: "art. 168.1 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-168
- id: m01-l01-q029
  prompt:
    es: "En el procedimiento agravado de reforma constitucional, una vez aprobado el nuevo texto por las Cortes Generales, el referéndum de ratificación:"
  options:
  - id: a
    text:
      es: "Solo se celebra si lo solicita una décima parte de los miembros de cualquiera de las Cámaras."
  - id: b
    text:
      es: "Solo se celebra si la reforma afecta al título II, De la Corona."
  - id: c
    correct: true
    text:
      es: "Se celebra siempre, sin necesidad de solicitud."
  - id: d
    text:
      es: "Se celebra antes de la disolución de las Cortes, sobre el principio aprobado."
  explanation:
    es: "El artículo 168.3 dice que, aprobada la reforma, «será sometida a referéndum para su ratificación», sin condición alguna. La solicitud de una décima parte de los miembros de una Cámara es el requisito del procedimiento ordinario (art. 167.3). El referéndum no depende de la materia y llega al final del procedimiento, no antes de la disolución."
  citation: "art. 168.3 CE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-1978-31229-art-13
- id: m01-l01-q030
  prompt:
    es: "Según el artículo 13.2 de la Constitución Española de 1978, dejando aparte lo que pueda establecerse por tratado o ley para las elecciones municipales, son titulares de los derechos reconocidos en el artículo 23:"
  options:
  - id: a
    text:
      es: "Los españoles y los extranjeros con residencia legal en España durante más de cinco años."
  - id: b
    text:
      es: "Los españoles y los extranjeros nacidos en España, aunque no hayan adquirido la nacionalidad."
  - id: c
    correct: true
    text:
      es: "Solamente quienes tienen la nacionalidad española."
  - id: d
    text:
      es: "Todas las personas, en los términos que establezcan los tratados y la ley."
  explanation:
    es: "El artículo 13.2 dice: «Solamente los españoles serán titulares de los derechos reconocidos en el artículo 23», con la única salvedad del sufragio en las elecciones municipales. La residencia legal, por larga que sea, no da a un extranjero esos derechos. Haber nacido en España tampoco, si no se tiene la nacionalidad. La fórmula «en los términos que establezcan los tratados y la ley» es la del artículo 13.1, que se refiere a las libertades públicas del título I, no a los derechos del artículo 23."
  citation: "art. 13.2 CE"
  difficulty: 1
  tags:
  - "requisito"
  - "concepto"
