# anchor: boe-a-2015-10565-art-47
- id: m03-l02-q017
  prompt:
    es: "Según el artículo 47.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué consecuencia tiene que un acto administrativo tenga un contenido imposible?"
  options:
  - id: a
    text:
      es: "El acto es anulable y puede convalidarse."
  - id: b
    correct: true
    text:
      es: "El acto es nulo de pleno derecho."
  - id: c
    text:
      es: "El acto es válido, pero su eficacia se demora."
  - id: d
    text:
      es: "El acto es anulable si causa indefensión."
  explanation:
    es: "El artículo 47.1.c) declara nulos de pleno derecho los actos «que tengan un contenido imposible». La convalidación sólo cabe para los actos anulables (art. 52.1). La indefensión es el criterio del artículo 48.2 para el defecto de forma, no para el contenido. Un acto de contenido imposible no es válido."
  citation: "art. 47.1.c) LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-48
- id: m03-l02-q018
  prompt:
    es: "Conforme al artículo 48.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el acto de la Administración que incurra en desviación de poder es:"
  options:
  - id: a
    text:
      es: "Nulo de pleno derecho, por ser contrario al ordenamiento jurídico."
  - id: b
    text:
      es: "Anulable sólo si da lugar a la indefensión de los interesados."
  - id: c
    correct: true
    text:
      es: "Anulable, como cualquier otra infracción del ordenamiento jurídico."
  - id: d
    text:
      es: "Válido, salvo que cause un perjuicio irreparable a terceros."
  explanation:
    es: "El artículo 48.1 dice: «Son anulables los actos de la Administración que incurran en cualquier infracción del ordenamiento jurídico, incluso la desviación de poder». La desviación de poder no está entre los casos de nulidad de pleno derecho del artículo 47.1. La indefensión es el criterio del artículo 48.2 para el defecto de forma. El artículo 48.1 no deja válido el acto con desviación de poder."
  citation: "art. 48.1 LPAC"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-1998-16718-art-70
- id: m03-l02-q019
  prompt:
    es: "De acuerdo con el artículo 70.2 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, se entiende por desviación de poder:"
  options:
  - id: a
    text:
      es: "El ejercicio de potestades administrativas por un órgano manifiestamente incompetente por razón de la materia."
  - id: b
    text:
      es: "El ejercicio de potestades administrativas sin la motivación que exige el ordenamiento jurídico."
  - id: c
    correct: true
    text:
      es: "El ejercicio de potestades administrativas para fines distintos de los fijados por el ordenamiento jurídico."
  - id: d
    text:
      es: "El ejercicio de potestades administrativas prescindiendo totalmente del procedimiento legalmente establecido."
  explanation:
    es: "El artículo 70.2 dice: «Se entiende por desviación de poder el ejercicio de potestades administrativas para fines distintos de los fijados por el ordenamiento jurídico». El órgano manifiestamente incompetente y la omisión total del procedimiento son causas de nulidad del artículo 47.1 de la Ley 39/2015. La falta de motivación es otro vicio; la definición atiende al fin del acto."
  citation: "art. 70.2 LJCA"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-47
- id: m03-l02-q020
  prompt:
    es: "De acuerdo con el artículo 47.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, son nulos de pleno derecho los actos que lesionen:"
  options:
  - id: a
    text:
      es: "Los derechos reconocidos en los Estatutos de Autonomía."
  - id: b
    text:
      es: "Cualquier derecho subjetivo o interés legítimo de los interesados."
  - id: c
    correct: true
    text:
      es: "Los derechos y libertades susceptibles de amparo constitucional."
  - id: d
    text:
      es: "Los principios rectores de la política social y económica."
  explanation:
    es: "El artículo 47.1.a) declara nulos los actos «que lesionen los derechos y libertades susceptibles de amparo constitucional». La lesión de cualquier otro derecho o interés es una infracción del ordenamiento, que el artículo 48.1 hace anulable. Los derechos de los Estatutos y los principios rectores no son derechos susceptibles de amparo."
  citation: "art. 47.1.a) LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-47
- id: m03-l02-q021
  prompt:
    es: "Según el artículo 47.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, son nulos de pleno derecho los actos dictados por un órgano:"
  options:
  - id: a
    correct: true
    text:
      es: "Manifiestamente incompetente por razón de la materia o del territorio."
  - id: b
    text:
      es: "Incompetente por razón de la materia, aunque no lo sea de forma manifiesta."
  - id: c
    text:
      es: "Manifiestamente incompetente por razón de la jerarquía o del territorio."
  - id: d
    text:
      es: "Incompetente por razón de la jerarquía, aunque no lo sea de forma manifiesta."
  explanation:
    es: "El artículo 47.1.b) declara nulos los actos «dictados por órgano manifiestamente incompetente por razón de la materia o del territorio». La incompetencia por razón de la jerarquía no figura en ese supuesto, y la que no determina nulidad puede convalidarla el superior jerárquico (art. 52.3). La incompetencia por razón de la materia tiene que ser manifiesta."
  citation: "art. 47.1.b) LPAC"
  difficulty: 3
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10565-art-47
- id: m03-l02-q022
  prompt:
    es: "¿Qué consecuencia atribuye la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas a que un acto administrativo se dicte como consecuencia de una infracción penal?"
  options:
  - id: a
    text:
      es: "El acto conserva su validez hasta que se revoque."
  - id: b
    text:
      es: "El acto es anulable mientras no haya sentencia penal firme."
  - id: c
    correct: true
    text:
      es: "El acto es nulo de pleno derecho."
  - id: d
    text:
      es: "El acto es anulable si causa perjuicio a terceros."
  explanation:
    es: "El artículo 47.1.d) declara nulos de pleno derecho los actos «que sean constitutivos de infracción penal o se dicten como consecuencia de ésta». El artículo no los califica de anulables ni condiciona la nulidad a una sentencia. Tampoco los deja válidos hasta su revocación."
  citation: "art. 47.1.d) LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-47
- id: m03-l02-q023
  prompt:
    es: "¿Cuál de los siguientes actos es nulo de pleno derecho según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El dictado en ejercicio de potestades para fines distintos de los legales."
  - id: b
    correct: true
    text:
      es: "El dictado prescindiendo total y absolutamente del procedimiento legalmente establecido."
  - id: c
    text:
      es: "El dictado con un defecto de forma que da lugar a la indefensión de los interesados."
  - id: d
    text:
      es: "El dictado por un órgano incompetente por razón de la jerarquía, sin que la incompetencia sea manifiesta."
  explanation:
    es: "El artículo 47.1.e) declara nulos los actos «dictados prescindiendo total y absolutamente del procedimiento legalmente establecido». El defecto de forma que causa indefensión determina la anulabilidad (art. 48.2). La incompetencia por razón de la jerarquía no está en el artículo 47.1, y el artículo 52.3 permite convalidarla. Ejercer potestades para fines distintos de los fijados es desviación de poder, que el artículo 48.1 hace anulable."
  citation: "art. 47.1.e) LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-47
- id: m03-l02-q024
  prompt:
    es: "Conforme al artículo 47.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, son nulos los actos contrarios al ordenamiento jurídico por los que se adquieren facultades o derechos cuando:"
  options:
  - id: a
    text:
      es: "Falte alguno de los requisitos formales para su adquisición."
  - id: b
    text:
      es: "Los derechos se hayan adquirido por silencio administrativo."
  - id: c
    text:
      es: "No se haya notificado la adquisición a otros interesados."
  - id: d
    correct: true
    text:
      es: "Se carezca de los requisitos esenciales para su adquisición."
  explanation:
    es: "El artículo 47.1.f) declara nulos los actos expresos o presuntos de ese tipo «cuando se carezca de los requisitos esenciales para su adquisición». La falta de un requisito formal no basta. El artículo no se refiere a la notificación a otros interesados. Adquirir por silencio no es la causa de nulidad: el supuesto comprende por igual los actos expresos y los presuntos."
  citation: "art. 47.1.f) LPAC"
  difficulty: 3
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-2015-10565-art-47
- id: m03-l02-q025
  prompt:
    es: "Según el artículo 47.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, además de los supuestos que enumera, ¿qué otro acto es nulo de pleno derecho?"
  options:
  - id: a
    correct: true
    text:
      es: "Cualquier otro que se establezca expresamente en una disposición con rango de Ley."
  - id: b
    text:
      es: "Cualquier otro que así declare el superior jerárquico del órgano que lo dictó."
  - id: c
    text:
      es: "Cualquier otro que se establezca expresamente en una disposición reglamentaria."
  - id: d
    text:
      es: "Cualquier otro que se aparte del criterio seguido en actuaciones precedentes."
  explanation:
    es: "El artículo 47.1.g) añade «cualquier otro que se establezca expresamente en una disposición con rango de Ley». Exige rango de ley; una disposición reglamentaria no basta. El superior jerárquico no crea causas de nulidad. Apartarse del criterio de actuaciones precedentes obliga a motivar el acto (art. 35.1.c), no lo hace nulo."
  citation: "art. 47.1.g) LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-48
- id: m03-l02-q026
  prompt:
    es: "Conforme al artículo 48.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el defecto de forma sólo determinará la anulabilidad cuando el acto:"
  options:
  - id: a
    text:
      es: "Carezca de cualquiera de los requisitos formales que exija la norma reguladora del procedimiento de que se trate."
  - id: b
    text:
      es: "Carezca de los requisitos formales indispensables para alcanzar su fin y, además, haya sido recurrido por los interesados."
  - id: c
    correct: true
    text:
      es: "Carezca de los requisitos formales indispensables para alcanzar su fin o dé lugar a la indefensión de los interesados."
  - id: d
    text:
      es: "Se haya dictado por un órgano colegiado sin convocar previamente a todos sus miembros con la antelación debida."
  explanation:
    es: "El artículo 48.2 LPAC dice que el defecto de forma «sólo determinará la anulabilidad cuando el acto carezca de los requisitos formales indispensables para alcanzar su fin o dé lugar a la indefensión de los interesados». Con «cualquiera de los requisitos formales» la anulabilidad se extiende a defectos que no impiden alcanzar el fin del acto, y el apartado dice «indispensables». Exigir además que el acto haya sido recurrido cambia la disyunción «o» por una conjunción, y añade un requisito que el apartado no contiene. La convocatoria irregular de un órgano colegiado es un defecto de forma concreto, y el apartado 2 solo lo convierte en anulabilidad si cumple una de las dos condiciones generales."
  citation: "art. 48.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-2015-10565-art-49
- id: m03-l02-q027
  prompt:
    es: "De acuerdo con el artículo 49.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la nulidad o anulabilidad de un acto:"
  options:
  - id: a
    text:
      es: "Implicará siempre la de todos los actos sucesivos dictados en el mismo procedimiento."
  - id: b
    text:
      es: "No implicará la de los actos sucesivos en el procedimiento, aunque dependan directamente del primero."
  - id: c
    text:
      es: "Implicará la de los actos sucesivos, salvo que estos ya hayan sido notificados a los interesados."
  - id: d
    correct: true
    text:
      es: "No implicará la de los actos sucesivos en el procedimiento que sean independientes del primero."
  explanation:
    es: "El artículo 49.1 dice: «La nulidad o anulabilidad de un acto no implicará la de los sucesivos en el procedimiento que sean independientes del primero». El arrastre no es automático ni depende de la notificación. La regla protege sólo a los actos independientes; los que dependen del primero no quedan a salvo por este artículo."
  citation: "art. 49.1 LPAC"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-50
- id: m03-l02-q028
  prompt:
    es: "¿Cómo denomina la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas la figura por la que los actos nulos o anulables que contengan los elementos constitutivos de otro distinto producen los efectos de éste?"
  options:
  - id: a
    text:
      es: "La convalidación de actos anulables."
  - id: b
    correct: true
    text:
      es: "La conversión de actos viciados."
  - id: c
    text:
      es: "La revocación de actos de gravamen."
  - id: d
    text:
      es: "La conservación de actos y trámites."
  explanation:
    es: "El artículo 50 se titula «Conversión de actos viciados» y dice que esos actos «producirán los efectos de éste». La convalidación subsana los vicios del acto anulable (art. 52.1). La conservación mantiene los actos y trámites que no habrían cambiado sin la infracción (art. 51). La revocación deja sin efecto un acto de gravamen (art. 109.1)."
  citation: "art. 50 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-51
- id: m03-l02-q029
  prompt:
    es: "Conforme al artículo 51 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el órgano que declare la nulidad o anule las actuaciones dispondrá siempre la conservación de los actos y trámites:"
  options:
  - id: a
    text:
      es: "Cuyo contenido no hubiera sido impugnado por los interesados en plazo."
  - id: b
    text:
      es: "Que fueran anteriores al acto viciado, cualquiera que fuera su contenido."
  - id: c
    text:
      es: "Que se hubieran notificado a los interesados antes de declararse la nulidad."
  - id: d
    correct: true
    text:
      es: "Cuyo contenido se hubiera mantenido igual de no haberse cometido la infracción."
  explanation:
    es: "El artículo 51 manda conservar «aquellos actos y trámites cuyo contenido se hubiera mantenido igual de no haberse cometido la infracción». El criterio es el contenido, no la notificación ni la falta de impugnación. Ser anterior al acto viciado no basta si el contenido habría cambiado."
  citation: "art. 51 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-52
- id: m03-l02-q030
  prompt:
    es: "¿Qué actos podrá convalidar la Administración según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Los actos anulables, siempre que no hayan sido recurridos por los interesados."
  - id: b
    text:
      es: "Los actos nulos y los anulables, subsanando los vicios de que adolezcan."
  - id: c
    correct: true
    text:
      es: "Los actos anulables, subsanando los vicios de que adolezcan."
  - id: d
    text:
      es: "Los actos nulos de pleno derecho, previo dictamen del órgano consultivo."
  explanation:
    es: "El artículo 52.1 dice: «La Administración podrá convalidar los actos anulables, subsanando los vicios de que adolezcan». Los actos nulos de pleno derecho no se convalidan. El artículo no condiciona la convalidación a que el acto no se haya recurrido."
  citation: "art. 52.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-52
- id: m03-l02-q031
  prompt:
    es: "Señale la respuesta correcta sobre los efectos del acto de convalidación, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Producirá efecto desde su notificación, salvo que en él se disponga otra cosa."
  - id: b
    text:
      es: "Producirá efecto desde su publicación en el diario oficial que corresponda."
  - id: c
    correct: true
    text:
      es: "Producirá efecto desde su fecha, salvo lo dispuesto en el artículo 39.3 para la retroactividad."
  - id: d
    text:
      es: "Producirá efecto desde la fecha del acto convalidado, en todo caso y sin excepción alguna."
  explanation:
    es: "El artículo 52.2 dice que el acto de convalidación «producirá efecto desde su fecha, salvo lo dispuesto en el artículo 39.3 para la retroactividad de los actos administrativos». No retrotrae siempre sus efectos a la fecha del acto convalidado: eso sólo cabe en los supuestos del artículo 39.3. La notificación y la publicación no marcan el inicio de sus efectos en este artículo."
  citation: "art. 52.2 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-52
- id: m03-l02-q032
  prompt:
    es: "Según el artículo 52.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el vicio de un acto consiste en incompetencia no determinante de nulidad, ¿quién podrá convalidarlo?"
  options:
  - id: a
    text:
      es: "El órgano competente, aunque no sea superior jerárquico del que dictó el acto."
  - id: b
    text:
      es: "El mismo órgano que dictó el acto viciado, en cualquier caso."
  - id: c
    correct: true
    text:
      es: "El órgano competente, cuando sea superior jerárquico del que dictó el acto."
  - id: d
    text:
      es: "Un órgano inferior al que dictó el acto, previa delegación de competencias."
  explanation:
    es: "El artículo 52.3 dice que «la convalidación podrá realizarse por el órgano competente cuando sea superior jerárquico del que dictó el acto viciado». El órgano que dictó el acto es el incompetente y no subsana su propia falta de competencia. El artículo exige que el competente sea superior jerárquico. Un órgano inferior no convalida el acto de su superior."
  citation: "art. 52.3 LPAC"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10565-art-52
- id: m03-l02-q033
  prompt:
    es: "Conforme al artículo 52.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el vicio consistiese en la falta de alguna autorización, podrá convalidarse el acto mediante:"
  options:
  - id: a
    text:
      es: "La conservación de los trámites anteriores a la autorización."
  - id: b
    text:
      es: "Su conversión en otro acto que no requiera la autorización."
  - id: c
    text:
      es: "La ratificación del acto por el órgano que lo dictó."
  - id: d
    correct: true
    text:
      es: "El otorgamiento de la autorización por el órgano competente."
  explanation:
    es: "El artículo 52.4 dice que «podrá ser convalidado el acto mediante el otorgamiento de la misma por el órgano competente». La ratificación por el órgano autor no suple la autorización que falta. La conversión (art. 50) y la conservación (art. 51) son figuras distintas de la convalidación."
  citation: "art. 52.4 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-48
- id: m03-l02-q034
  prompt:
    es: "¿Cuál de los siguientes vicios determina la anulabilidad, y no la nulidad de pleno derecho, de un acto administrativo según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "La lesión de un derecho susceptible de amparo constitucional."
  - id: b
    text:
      es: "Una causa de nulidad que establezca expresamente una ley."
  - id: c
    text:
      es: "El contenido imposible del acto."
  - id: d
    correct: true
    text:
      es: "La desviación de poder."
  explanation:
    es: "El artículo 48.1 hace anulables los actos que incurran en cualquier infracción del ordenamiento jurídico, «incluso la desviación de poder», y el artículo 47.1 no la incluye entre los casos de nulidad. El contenido imposible es nulidad de pleno derecho (art. 47.1.c), igual que la lesión de derechos susceptibles de amparo (art. 47.1.a) y cualquier otro caso que establezca expresamente una disposición con rango de ley (art. 47.1.g)."
  citation: "art. 48.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-52
- id: m03-l02-q036
  prompt:
    es: "Conforme al artículo 52.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, puede convalidar el acto el órgano competente que sea superior jerárquico del que lo dictó cuando el vicio consista en:"
  options:
  - id: a
    text:
      es: "Un contenido imposible para la Administración."
  - id: b
    text:
      es: "La falta de alguna autorización preceptiva."
  - id: c
    text:
      es: "Incompetencia manifiesta por razón de la materia."
  - id: d
    correct: true
    text:
      es: "Incompetencia no determinante de nulidad."
  explanation:
    es: "El artículo 52.3 prevé esta convalidación «si el vicio consistiera en incompetencia no determinante de nulidad». La falta de autorización se convalida con el otorgamiento de la autorización por el órgano competente (art. 52.4). La incompetencia manifiesta por razón de la materia y el contenido imposible hacen el acto nulo de pleno derecho (art. 47.1.b y c), y los actos nulos no se convalidan."
  citation: "art. 52.3 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
