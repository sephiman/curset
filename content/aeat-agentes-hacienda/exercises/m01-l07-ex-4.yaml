# anchor: boe-a-1986-1216-art-45
- id: m01-l07-q0146
  prompt:
    es: "De acuerdo con el artículo 45.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, la resolución que pone fin al procedimiento disciplinario deberá adoptarse en el plazo de diez días:"
  options:
  - id: a
    text:
      es: "Salvo en caso de suspensión de funciones."
  - id: b
    text:
      es: "Salvo en caso de traslado con cambio de residencia."
  - id: c
    text:
      es: "Salvo en caso de falta leve sancionada con apercibimiento."
  - id: d
    correct: true
    text:
      es: "Salvo en caso de separación del servicio."
  explanation:
    es: "El artículo 45.1 dice que la resolución «deberá adoptarse en el plazo de diez días, salvo en caso de separación del servicio». La suspensión de funciones, el traslado con cambio de residencia y el apercibimiento no están exceptuados."
  citation: "art. 45.1 RD 33/1986"
  difficulty: 1
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-2015-11719-art-94
- id: m01-l07-q0153
  prompt:
    es: "El Instructor de un procedimiento disciplinario recoge indicios fundados de que los hechos investigados son delictivos. Según el artículo 94.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿qué efecto tiene esto sobre la tramitación?"
  options:
  - id: a
    text:
      es: "Continúa su curso normal hasta la propuesta de resolución del Instructor."
  - id: b
    correct: true
    text:
      es: "Se suspende la tramitación del procedimiento disciplinario ya iniciado."
  - id: c
    text:
      es: "Se amplía en un mes el plazo para formular el pliego de cargos."
  - id: d
    text:
      es: "Pasa a tramitarse por el procedimiento sumario con audiencia al interesado."
  explanation:
    es: "El artículo 94.3 dice que, ante indicios fundados de criminalidad, «se suspenderá su tramitación». El procedimiento no sigue su curso, y la ampliación del plazo del pliego de cargos exige causas justificadas del Instructor, no indicios de delito. El procedimiento sumario es el de las faltas leves, no el que sustituye al ordinario."
  citation: "art. 94.3 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "procedimiento"
# anchor: boe-a-1986-1216-art-30
- id: m01-l07-q0155
  prompt:
    es: "Según el artículo 30 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, nombrar Instructor a un funcionario de un cuerpo o escala de grupo inferior al del inculpado:"
  options:
  - id: a
    correct: true
    text:
      es: "Incumple el requisito de ser de un cuerpo o escala de igual o superior grupo."
  - id: b
    text:
      es: "Es válido, porque el Instructor solo debe depender del mismo Departamento que el inculpado."
  - id: c
    text:
      es: "Es válido si el inculpado no recusa al Instructor en el plazo de tres días."
  - id: d
    text:
      es: "Es válido si el Instructor cuenta con más años de servicio que el inculpado."
  explanation:
    es: "El artículo 30 exige un Instructor «de igual o superior grupo al del inculpado», así que un grupo inferior incumple el requisito. Depender del mismo Departamento no es lo que se exige: si depende de otro, basta la autorización de su Subsecretario. La falta de recusación y la antigüedad no sustituyen al grupo."
  citation: "art. 30 RD 33/1986"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-61
- id: m01-l07-q0173
  prompt:
    es: "Según el artículo 61 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿cuál de las siguientes funciones corresponde a los Ministros, como titulares del departamento?"
  options:
  - id: a
    text:
      es: "Imponer la sanción de despido disciplinario al personal laboral por faltas graves."
  - id: b
    text:
      es: "Aprobar la oferta de empleo público estatal."
  - id: c
    text:
      es: "Aprobar los estatutos de los organismos públicos dependientes de su Ministerio."
  - id: d
    correct: true
    text:
      es: "Imponer la sanción de separación del servicio por faltas muy graves."
  explanation:
    es: "El artículo 61.s) incluye entre las funciones de los Ministros «imponer la sanción de separación del servicio por faltas muy graves». Ninguna de las otras tres figura en el artículo 61: el despido disciplinario del personal laboral no es una de sus funciones, ni lo son la aprobación de la oferta de empleo público ni la de los estatutos de los organismos públicos, que el artículo 93.2 da al Consejo de Ministros."
  citation: "art. 61.s) LRJSP"
  difficulty: 3
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2015-10566-art-30
- id: m01-l07-q0176
  prompt:
    es: "Conforme al artículo 30.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué requisito debe cumplir la iniciación de un procedimiento sancionador para interrumpir la prescripción de las infracciones?"
  options:
  - id: a
    text:
      es: "Que se anote la iniciación en el Registro Central de Personal."
  - id: b
    correct: true
    text:
      es: "Que la iniciación se produzca con conocimiento del interesado."
  - id: c
    text:
      es: "Que el instructor haya formulado ya el pliego de cargos al funcionario."
  - id: d
    text:
      es: "Que se notifique al interesado la propuesta de resolución del instructor."
  explanation:
    es: "El artículo 30.2 dice que interrumpe la prescripción «la iniciación, con conocimiento del interesado, de un procedimiento administrativo de naturaleza sancionadora». La exigencia es el conocimiento del interesado. El artículo no pide anotarla en el Registro de personal, ni que el instructor haya formulado el pliego de cargos, ni que se notifique la propuesta de resolución."
  citation: "art. 30.2 LRJSP"
  difficulty: 3
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-2015-11719-art-11
- id: m01-l07-q0194
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el personal laboral recoge el artículo 11.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público?"
  options:
  - id: a
    correct: true
    text:
      es: "En función de la duración del contrato, puede ser fijo, por tiempo indefinido o temporal."
  - id: b
    text:
      es: "En función de la duración del contrato, puede ser fijo o temporal, pero nunca por tiempo indefinido."
  - id: c
    text:
      es: "Presta servicios en virtud de nombramiento, con carácter fijo, por tiempo indefinido o temporal."
  - id: d
    text:
      es: "Su contrato puede formalizarse de palabra cuando su duración sea inferior a seis meses."
  explanation:
    es: "El artículo 11.1 TREBEP dice que, «en función de la duración del contrato», el personal laboral «podrá ser fijo, por tiempo indefinido o temporal». Excluir el tiempo indefinido contradice esa lista de tres. El personal laboral presta servicios «en virtud de contrato de trabajo», no de nombramiento: el nombramiento es el título de los funcionarios, según el artículo 9.1. El contrato es «formalizado por escrito» sin distinción por duración, así que un contrato de palabra de menos de seis meses contradice esa fórmula."
  citation: "art. 11.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-10
- id: m01-l07-q0196
  prompt:
    es: "Según el artículo 10.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, son funcionarios interinos los que son nombrados como tales, con carácter temporal, para el desempeño de funciones propias de funcionarios de carrera:"
  options:
  - id: a
    correct: true
    text:
      es: "Por razones expresamente justificadas de necesidad y urgencia"
  - id: b
    text:
      es: "Por razones de oportunidad apreciadas libremente por el órgano que los nombra"
  - id: c
    text:
      es: "Por razones de confianza o asesoramiento especial del órgano que los nombra"
  - id: d
    text:
      es: "Por razones organizativas que impidan la cobertura del puesto mediante concurso"
  explanation:
    es: "El artículo 10.1 define a los funcionarios interinos como los nombrados «por razones expresamente justificadas de necesidad y urgencia». La libre apreciación de la oportunidad contradice la exigencia de una justificación expresa. La confianza o el asesoramiento especial es lo que caracteriza al personal eventual, no al interino. Las razones organizativas aparecen en el artículo 10.3, pero como causa de cese del interino, no de nombramiento."
  citation: "art. 10.1 TREBEP"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1995-8729-art-27
- id: m01-l07-q0200
  prompt:
    es: "Según el artículo 27.1 del Real Decreto 364/1995, de 10 de marzo, ¿quién nombra al personal funcionario interino de los Cuerpos y Escalas adscritos a un Departamento ministerial y no dependientes de la Secretaría de Estado de Función Pública?"
  options:
  - id: a
    correct: true
    text:
      es: "El Subsecretario del Departamento al que figuren adscritos"
  - id: b
    text:
      es: "El Ministro titular del Departamento al que figuren adscritos"
  - id: c
    text:
      es: "El Secretario General Técnico del Departamento de adscripción"
  - id: d
    text:
      es: "El Delegado del Gobierno en la comunidad autónoma del puesto"
  explanation:
    es: "El artículo 27.1 atribuye el nombramiento del personal funcionario interino «por el Subsecretario del Departamento al que figuren adscritos los correspondientes Cuerpos y Escalas», salvo los Cuerpos y Escalas dependientes de la Secretaría de Estado que el reglamento llama «para la Administración Pública» (hoy, Secretaría de Estado de Función Pública), cuyos interinos nombra el órgano que el artículo llama «Director general de la Función Pública». El Ministro es el órgano un nivel por encima y el Secretario General Técnico otro órgano del mismo departamento; ninguno de los dos aparece en el artículo. El Delegado del Gobierno no tiene esa competencia en el reglamento."
  citation: "art. 27.1 RD 364/1995"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-11719-da-decimoseptima
- id: m01-l07-q0204
  prompt:
    es: "¿Qué compensación da el texto refundido de la Ley del Estatuto Básico del Empleado Público al funcionario interino afectado por el incumplimiento del plazo máximo de permanencia?"
  options:
  - id: a
    correct: true
    text:
      es: "Veinte días de sus retribuciones fijas por año de servicio, hasta un máximo de doce mensualidades"
  - id: b
    text:
      es: "Treinta y tres días de sus retribuciones fijas por año de servicio, hasta veinticuatro mensualidades"
  - id: c
    text:
      es: "Veinte días de sus retribuciones totales por año de servicio, sin límite de mensualidades"
  - id: d
    text:
      es: "Doce días de sus retribuciones fijas por año de servicio, hasta un máximo de seis mensualidades"
  explanation:
    es: "El apartado 4 fija una compensación «equivalente a veinte días de sus retribuciones fijas por año de servicio, prorrateándose por meses los períodos de tiempo inferiores a un año, hasta un máximo de doce mensualidades». Los treinta y tres días con tope de veinticuatro mensualidades, los doce días con tope de seis y las retribuciones totales sin tope no son las cifras de la disposición: el cálculo se hace sobre las retribuciones fijas y tiene un límite de doce mensualidades."
  citation: "disposición adicional decimoséptima.4 TREBEP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2023-23537-art-22
- id: m01-l07-q0207
  prompt:
    es: "¿Cuál de las siguientes describe la Secretaría de Estado de Función Pública según el Real Decreto 829/2023, de 20 de noviembre, por el que se reestructuran los departamentos ministeriales?"
  options:
  - id: a
    text:
      es: "Un órgano superior del Ministerio de Hacienda, junto a la Secretaría de Estado de Presupuestos y Gastos"
  - id: b
    correct: true
    text:
      es: "Un órgano superior del Ministerio para la Transformación Digital y de la Función Pública"
  - id: c
    text:
      es: "Un órgano directivo de la Subsecretaría para la Transformación Digital y de la Función Pública"
  - id: d
    text:
      es: "Un órgano superior del Ministerio de la Presidencia, Justicia y Relaciones con las Cortes"
  explanation:
    es: "El artículo 22.3 del Real Decreto 829/2023 dice que el Ministerio para la Transformación Digital y de la Función Pública se estructura en tres órganos superiores, y la letra c) es «la Secretaría de Estado de Función Pública». No está en el Ministerio de Hacienda ni en el de la Presidencia, Justicia y Relaciones con las Cortes. Tampoco es un órgano directivo dependiente de la Subsecretaría: es un órgano superior del ministerio."
  citation: "art. 22.3.c) RD 829/2023"
  difficulty: 2
  tags:
  - "órgano"
  - "estructura"
# anchor: boe-a-2023-25758-df-septima
- id: m01-l07-q0210
  prompt:
    es: "Según el Real Decreto-ley 6/2023, de 19 de diciembre, su libro segundo se aplica a la Administración del Estado como norma de desarrollo, ¿de cuál de las siguientes normas?"
  options:
  - id: a
    text:
      es: "De la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública."
  - id: b
    correct: true
    text:
      es: "Del texto refundido de la Ley del Estatuto Básico del Empleado Público."
  - id: c
    text:
      es: "Del Reglamento General de Ingreso aprobado por el Real Decreto 364/1995."
  - id: d
    text:
      es: "De la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público."
  explanation:
    es: "La disposición final séptima.2 RDL 6/2023 aplica el libro segundo a la Administración del Estado «como norma de desarrollo del texto refundido de la Ley del Estatuto Básico del Empleado Público». No lo presenta como desarrollo de la Ley 30/1984, que es anterior al Estatuto. El Reglamento General de Ingreso del Real Decreto 364/1995 es una norma reglamentaria: una norma con rango de ley no lo desarrolla. La Ley 40/2015 regula el sector público, no la función pública."
  citation: "disposición final séptima.2 RDL 6/2023"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1995-8729-art-41
- id: m01-l07-q0213
  prompt:
    es: "De acuerdo con el artículo 41.1 del Real Decreto 364/1995, de 10 de marzo, podrán tomar parte en los concursos los funcionarios:"
  options:
  - id: a
    correct: true
    text:
      es: "cualquiera que sea su situación administrativa, excepto los suspensos en firme mientras dure la suspensión."
  - id: b
    text:
      es: "que se encuentren en servicio activo o en servicios especiales, con exclusión de cualquier otra situación."
  - id: c
    text:
      es: "cualquiera que sea su situación administrativa, excepto los excedentes voluntarios por interés particular."
  - id: d
    text:
      es: "cualquiera que sea su situación administrativa, excepto los que estén en suspensión provisional de funciones."
  explanation:
    es: "El artículo 41.1 RD 364/1995 abre los concursos a los funcionarios «cualquiera que sea su situación administrativa, excepto los suspensos en firme que no podrán participar mientras dure la suspensión». La única exclusión es la suspensión firme. No se limita al servicio activo y a los servicios especiales, ni excluye a los excedentes voluntarios. La suspensión provisional tampoco impide participar: el artículo habla solo de los suspensos en firme."
  citation: "art. 41.1 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
