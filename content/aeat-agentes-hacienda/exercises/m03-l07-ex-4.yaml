# anchor: boe-a-2003-23186-art-128
- id: m03-l07-q0054
  prompt:
    es: "Conforme al artículo 128.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando la normativa del tributo lo establezca, la gestión se inicia mediante una declaración en la que el obligado manifiesta la realización del hecho imponible y comunica los datos para que la Administración cuantifique la obligación mediante:"
  options:
  - id: a
    text:
      es: "la comprobación del valor de los bienes declarados."
  - id: b
    text:
      es: "la práctica de una liquidación definitiva."
  - id: c
    correct: true
    text:
      es: "la práctica de una liquidación provisional."
  - id: d
    text:
      es: "la extensión de un acta de inspección."
  explanation:
    es: "La declaración que inicia este procedimiento aporta los datos necesarios para que la Administración liquide con carácter provisional (art. 128.1). No se liquida de forma definitiva ni mediante acta, y la comprobación de valores es una actuación posible dentro del procedimiento, no su resultado."
  citation: "art. 128.1 LGT"
  difficulty: 1
  tags:
  - "declaración"
  - "iniciación"
# anchor: boe-a-2003-23186-art-128
- id: m03-l07-q0055
  prompt:
    es: "¿Qué debe hacer el obligado tributario en la declaración que inicia el procedimiento de gestión tributaria mediante declaración, según el artículo 128.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Manifestar la realización del hecho imponible y determinar él mismo el importe de la deuda tributaria que ingresa."
  - id: b
    correct: true
    text:
      es: "Manifestar la realización del hecho imponible y comunicar los datos necesarios para que la Administración practique una liquidación provisional."
  - id: c
    text:
      es: "Manifestar su conformidad con la deuda que la Administración determine tras actuaciones de comprobación."
  - id: d
    text:
      es: "Solicitar la devolución del tributo y comunicar los datos necesarios para calcular su importe."
  explanation:
    es: "En este procedimiento el obligado declara el hecho imponible y aporta los datos, y la Administración cuantifica con una liquidación provisional. Si el obligado calcula e ingresa la deuda, es una autoliquidación. La conformidad con una deuda determinada tras comprobar corresponde a otros procedimientos. La solicitud de devolución inicia otro procedimiento distinto."
  citation: "art. 128.1 LGT"
  difficulty: 2
  tags:
  - "declaración"
  - "iniciación"
# anchor: boe-a-2003-23186-art-128
- id: m03-l07-q0056
  prompt:
    es: "De acuerdo con el artículo 128.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el procedimiento iniciado mediante declaración que ha terminado por caducidad:"
  options:
  - id: a
    correct: true
    text:
      es: "La Administración puede iniciarlo de nuevo para liquidar el tributo dentro del plazo de prescripción."
  - id: b
    text:
      es: "La Administración no puede iniciarlo de nuevo, porque la caducidad extingue su derecho a liquidar."
  - id: c
    text:
      es: "La Administración puede iniciarlo de nuevo solo durante los seis meses siguientes a la caducidad."
  - id: d
    text:
      es: "La Administración puede iniciarlo de nuevo sin límite de tiempo mientras el tributo no se haya pagado."
  explanation:
    es: "La caducidad no impide reiniciar: la Administración puede abrir de nuevo el procedimiento mientras no haya prescrito su derecho a liquidar (art. 128.2). El límite es el plazo de prescripción, no seis meses ni la ausencia de plazo."
  citation: "art. 128.2 LGT"
  difficulty: 2
  tags:
  - "declaración"
  - "caducidad"
# anchor: boe-a-2003-23186-art-129
- id: m03-l07-q0057
  prompt:
    es: "Según el artículo 129.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración debe notificar la liquidación en seis meses desde el día siguiente a la finalización del plazo para presentar la declaración o desde el día siguiente a:"
  options:
  - id: a
    text:
      es: "la fecha en que el obligado presente las alegaciones a la propuesta de liquidación."
  - id: b
    correct: true
    text:
      es: "la comunicación de la Administración por la que se inicie de nuevo el procedimiento tras la caducidad."
  - id: c
    text:
      es: "la notificación del requerimiento de datos que la Administración dirija al obligado en el curso del procedimiento de liquidación."
  - id: d
    text:
      es: "la fecha del devengo del tributo al que se refiere la declaración presentada."
  explanation:
    es: "El plazo de seis meses puede contarse desde el fin del plazo de presentación o, en el reinicio por caducidad, desde el día siguiente a la comunicación con que la Administración lo inicia de nuevo. El requerimiento, las alegaciones y el devengo no abren el cómputo."
  citation: "art. 129.1 LGT"
  difficulty: 2
  tags:
  - "declaración"
  - "plazos"
# anchor: boe-a-2003-23186-art-129
- id: m03-l07-q0058
  prompt:
    es: "De acuerdo con el artículo 129.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en el supuesto de presentación de declaraciones extemporáneas, el plazo de seis meses para notificar la liquidación comenzará a contarse desde:"
  options:
  - id: a
    correct: true
    text:
      es: "el día siguiente a la presentación de la declaración."
  - id: b
    text:
      es: "el primer día del periodo impositivo posterior al de la declaración."
  - id: c
    text:
      es: "la fecha del devengo del tributo al que se refiere la declaración."
  - id: d
    text:
      es: "el día siguiente a aquel en que la Administración advierta la presentación tardía."
  explanation:
    es: "Si la declaración se presenta fuera de plazo, los seis meses se cuentan desde el día siguiente a su presentación. Ni el devengo, ni el momento en que la Administración la detecta, ni el periodo impositivo siguiente son el punto de partida."
  citation: "art. 129.1 LGT"
  difficulty: 1
  tags:
  - "declaración"
  - "plazos"
  - "extemporánea"
# anchor: boe-a-2003-23186-art-129
- id: m03-l07-q0059
  prompt:
    es: "Distribuciones Aranda, S.L. presenta fuera de plazo, el lunes 10 de noviembre de 2025, la declaración de un tributo cuya gestión se inicia mediante declaración. El plazo para presentarla terminó el lunes 15 de septiembre de 2025 y la normativa del tributo no fija otro plazo para notificar la liquidación. Según el artículo 129.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿desde qué día empieza a contarse el plazo de seis meses para notificarla?"
  options:
  - id: a
    text:
      es: "Desde el 16 de septiembre de 2025, día siguiente al fin del plazo de presentación."
  - id: b
    text:
      es: "Desde el 10 de noviembre de 2025, mismo día de la presentación."
  - id: c
    correct: true
    text:
      es: "Desde el 11 de noviembre de 2025, día siguiente al de la presentación."
  - id: d
    text:
      es: "Desde el 1 de octubre de 2025, primer día del mes siguiente al fin del plazo."
  explanation:
    es: "La declaración es extemporánea, así que el plazo se cuenta desde el día siguiente a la presentación: el martes 11 de noviembre de 2025 (art. 129.1). El día siguiente al fin del plazo de presentación solo vale para declaraciones presentadas en plazo. El mismo día de la presentación no cuenta, y no hay regla de primer día del mes."
  citation: "art. 129.1 LGT"
  difficulty: 2
  tags:
  - "declaración"
  - "plazos"
  - "extemporánea"
  - "cómputo"
# anchor: boe-a-2003-23186-art-129
- id: m03-l07-q0060
  prompt:
    es: "Almacenes Rivas, S.L. presenta en plazo, el miércoles 3 de septiembre de 2025, la declaración de un tributo cuya gestión se inicia mediante declaración. El plazo para presentarla terminaba el martes 30 de septiembre de 2025 y la normativa del tributo no fija otro plazo para notificar la liquidación. Según el artículo 129.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿desde qué día se cuenta el plazo de seis meses para notificarla?"
  options:
  - id: a
    text:
      es: "Desde el 3 de septiembre de 2025, día de la presentación de la declaración."
  - id: b
    text:
      es: "Desde el 30 de septiembre de 2025, último día del plazo de presentación."
  - id: c
    text:
      es: "Desde el 4 de septiembre de 2025, día siguiente a la presentación de la declaración por el obligado."
  - id: d
    correct: true
    text:
      es: "Desde el 1 de octubre de 2025, día siguiente a la finalización del plazo de presentación."
  explanation:
    es: "Presentada en plazo, la declaración no adelanta el cómputo: los seis meses corren desde el día siguiente a la finalización del plazo para presentarla, el miércoles 1 de octubre de 2025 (art. 129.1). El día siguiente a la presentación se aplica solo a las extemporáneas. El último día del plazo ya está dentro de él."
  citation: "art. 129.1 LGT"
  difficulty: 2
  tags:
  - "declaración"
  - "plazos"
  - "cómputo"
# anchor: boe-a-2003-23186-art-129
- id: m03-l07-q0061
  prompt:
    es: "Conforme al artículo 129.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, respecto al plazo de seis meses para notificar la liquidación en el procedimiento iniciado mediante declaración, la normativa de cada tributo:"
  options:
  - id: a
    text:
      es: "no podrá modificarlo, por ser un plazo fijado por la Ley General Tributaria."
  - id: b
    text:
      es: "solo podrá reducirlo, sin que quepa ampliarlo en ningún caso."
  - id: c
    text:
      es: "solo podrá ampliarlo hasta un máximo de doce meses."
  - id: d
    correct: true
    text:
      es: "podrá señalar plazos diferentes para notificar la liquidación."
  explanation:
    es: "El artículo 129.1 deja a la normativa de cada tributo señalar plazos diferentes de seis meses, sin fijar un tope ni limitar el sentido del cambio. Por eso no es un plazo inmodificable ni solo ampliable hasta doce meses ni solo reducible."
  citation: "art. 129.1 LGT"
  difficulty: 2
  tags:
  - "declaración"
  - "plazos"
# anchor: boe-a-2003-23186-art-129
- id: m03-l07-q0062
  prompt:
    es: "Según el artículo 129.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las actuaciones de la Administración en el procedimiento iniciado mediante declaración:"
  options:
  - id: a
    correct: true
    text:
      es: "Puede requerir al obligado para que aclare los datos consignados o presente justificante de ellos, y realizar actuaciones de comprobación de valores."
  - id: b
    text:
      es: "Debe iniciar un procedimiento de comprobación limitada para requerir la aclaración de los datos al obligado."
  - id: c
    text:
      es: "Solo puede utilizar los datos consignados por el obligado en su declaración, sin acudir a otros que obren en su poder."
  - id: d
    text:
      es: "Puede requerir justificantes al obligado, pero no puede realizar actuaciones de comprobación de valores."
  explanation:
    es: "La Administración puede usar los datos de la declaración o cualquier otro que obre en su poder, requerir aclaración o justificantes y realizar actuaciones de comprobación de valores (art. 129.2). No está limitada a los datos declarados, la comprobación de valores no le está vedada y no necesita abrir una comprobación limitada para requerir."
  citation: "art. 129.2 LGT"
  difficulty: 2
  tags:
  - "declaración"
  - "tramitación"
# anchor: boe-a-2007-15984-art-133
- id: m03-l07-q0063
  prompt:
    es: "De acuerdo con el artículo 133.1 del Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, aprobado por el Real Decreto 1065/2007, de 27 de julio, cuando en un procedimiento iniciado mediante declaración se requieran datos o documentos al obligado, se le otorgará para aportarlos, salvo que la normativa específica establezca otro plazo, uno de:"
  options:
  - id: a
    text:
      es: "un mes, contado a partir del día siguiente al de la notificación del requerimiento."
  - id: b
    correct: true
    text:
      es: "10 días, contados a partir del día siguiente al de la notificación del requerimiento."
  - id: c
    text:
      es: "15 días, contados a partir del día siguiente al de la notificación del requerimiento."
  - id: d
    text:
      es: "5 días, contados a partir del día siguiente al de la notificación del requerimiento."
  explanation:
    es: "El plazo es de 10 días desde el día siguiente a la notificación del requerimiento (art. 133.1 RGAT). Quince días es el de las alegaciones en la rectificación de autoliquidaciones. Un mes y cinco días no corresponden a este trámite."
  citation: "art. 133.1 RGAT"
  difficulty: 1
  tags:
  - "declaración"
  - "plazos"
# anchor: boe-a-2003-23186-art-129
- id: m03-l07-q0064
  prompt:
    es: "Conforme al artículo 129.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando los datos o valores tenidos en cuenta no se correspondan con los consignados por el obligado en su declaración, la propuesta de liquidación se notifica, con una referencia sucinta a los hechos y fundamentos de derecho, para que el obligado:"
  options:
  - id: a
    text:
      es: "preste su conformidad expresa a los hechos de la propuesta."
  - id: b
    text:
      es: "ingrese la cuantía propuesta en periodo voluntario de pago."
  - id: c
    correct: true
    text:
      es: "alegue lo que convenga a su derecho."
  - id: d
    text:
      es: "presente una autoliquidación complementaria en el mismo plazo."
  explanation:
    es: "La propuesta de liquidación se notifica para que el obligado alegue lo que convenga a su derecho. No sustituye a una autoliquidación complementaria, no abre el pago en voluntaria y no pide conformidad."
  citation: "art. 129.3 LGT"
  difficulty: 1
  tags:
  - "declaración"
  - "tramitación"
# anchor: boe-a-2003-23186-art-129
- id: m03-l07-q0065
  prompt:
    es: "De acuerdo con el artículo 129.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la liquidación del procedimiento iniciado mediante declaración cuando los datos de la Administración coinciden con los declarados:"
  options:
  - id: a
    text:
      es: "Debe esperarse a que el obligado presente los justificantes de los datos declarados."
  - id: b
    correct: true
    text:
      es: "Realizadas las actuaciones de calificación y cuantificación oportunas, se notifica sin más trámite la liquidación que proceda."
  - id: c
    text:
      es: "Debe notificarse siempre una propuesta de liquidación para que el obligado alegue."
  - id: d
    text:
      es: "Debe iniciarse un procedimiento de comprobación limitada antes de liquidar."
  explanation:
    es: "La propuesta de liquidación se exige cuando los datos o valores de la Administración no coinciden con los declarados. Si coinciden, tras las actuaciones de calificación y cuantificación se notifica la liquidación sin más trámite. No hace falta esperar justificantes ni abrir otro procedimiento."
  citation: "art. 129.3 LGT"
  difficulty: 3
  tags:
  - "declaración"
  - "tramitación"
# anchor: boe-a-2003-23186-art-130
- id: m03-l07-q0066
  prompt:
    es: "Según el artículo 130 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el procedimiento iniciado mediante declaración presentada por el obligado tributario terminará, entre otras causas, por:"
  options:
  - id: a
    text:
      es: "liquidación definitiva practicada por los órganos de inspección tributaria."
  - id: b
    text:
      es: "subsanación del dato objeto del requerimiento por parte del obligado tributario."
  - id: c
    text:
      es: "resolución en la que se indique que no procede practicar liquidación provisional."
  - id: d
    correct: true
    text:
      es: "liquidación provisional practicada por la Administración tributaria."
  explanation:
    es: "La liquidación provisional es la primera causa de terminación del procedimiento iniciado mediante declaración (art. 130.a). La liquidación definitiva de la inspección no lo termina. La resolución de que no procede liquidar y la subsanación del dato son formas de terminar la verificación de datos (art. 133.1)."
  citation: "art. 130 LGT"
  difficulty: 1
  tags:
  - "declaración"
  - "terminación"
