# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q001
  prompt:
    es: "¿Cuál de los siguientes años es el de la publicación del plan de la red ARPANET por Lawrence Roberts, según la historia de Internet de la Internet Society?"
  options:
  - id: a
    text:
      es: "En 1962, año de los memorandos de Licklider sobre la «Galactic Network»"
  - id: b
    text:
      es: "En 1965, año del enlace de prueba entre los ordenadores TX-2 y Q-32"
  - id: c
    correct: true
    text:
      es: "En 1967, año de la conferencia donde Roberts presentó su plan"
  - id: d
    text:
      es: "En 1969, año en que se instaló el primer nodo en la UCLA"
  explanation:
    es: "Roberts fue a DARPA a finales de 1966 y publicó su plan para ARPANET en 1967. 1962 es el año de los memorandos de Licklider, no del plan de Roberts. 1965 es el año del experimento que unió el TX-2 y el Q-32 con una línea telefónica. 1969 es el año en que BBN instaló el primer nodo en la UCLA, dos años después de publicarse el plan."
  citation: "fuente: `isoc-historia-internet.html`; «Origins of the Internet»"
  difficulty: 1
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q002
  prompt:
    es: "¿Cuál de los siguientes centros fue el primer nodo de ARPANET, donde BBN instaló el primer procesador de mensajes de interfaz (IMP) en septiembre de 1969?"
  options:
  - id: a
    correct: true
    text:
      es: "El Network Measurement Center de Kleinrock, en la UCLA"
  - id: b
    text:
      es: "La Universidad de Utah, otro de los nodos añadidos más tarde"
  - id: c
    text:
      es: "La Universidad de California en Santa Bárbara, nodo añadido más tarde"
  - id: d
    text:
      es: "El Stanford Research Institute (SRI), que aportó el segundo nodo"
  explanation:
    es: "El Network Measurement Center de Kleinrock en la UCLA fue elegido como primer nodo de ARPANET. El SRI aportó el segundo nodo, que se conectó un mes después. Santa Bárbara fue uno de los dos nodos que se añadieron después de conectarse el SRI. Utah fue el otro de los dos nodos que se añadieron después de conectarse el SRI."
  citation: "fuente: `isoc-historia-internet.html`; «Origins of the Internet»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q003
  prompt:
    es: "¿Hacia qué nodo salió el primer mensaje entre dos ordenadores de ARPANET, enviado desde el laboratorio de Kleinrock un mes después de instalarse el primer nodo?"
  options:
  - id: a
    text:
      es: "Hacia la Universidad de California en Santa Bárbara, otro nodo posterior"
  - id: b
    correct: true
    text:
      es: "Hacia el SRI, que acababa de conectarse a ARPANET"
  - id: c
    text:
      es: "Hacia BBN, la empresa que instaló el primer IMP"
  - id: d
    text:
      es: "Hacia la Universidad de Utah, uno de los nodos posteriores"
  explanation:
    es: "La página dice que, un mes después, al conectarse el SRI, se envió el primer mensaje entre ordenadores desde el laboratorio de Kleinrock hacia el SRI. BBN instaló el IMP de la UCLA, pero no recibió ese primer mensaje, que fue al SRI. Utah se añadió después, junto con Santa Bárbara, y no fue el destino del primer mensaje. Santa Bárbara se añadió después, junto con Utah, y no fue el destino del primer mensaje."
  citation: "fuente: `isoc-historia-internet.html`; «One month later, when SRI was connected to the ARPANET, the first host-to-host message was sent from Kleinrock's laboratory to SRI.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q004
  prompt:
    es: "¿Cuántos ordenadores centrales (hosts) estaban conectados entre sí en la ARPANET inicial a finales de 1969, según la historia de Internet de la Internet Society?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuatro, con los nodos de la UCLA, el SRI, Santa Bárbara y Utah"
  - id: b
    text:
      es: "Dos, solo con los nodos de la UCLA y del SRI"
  - id: c
    text:
      es: "Cinco, con un nodo más en BBN para los IMP"
  - id: d
    text:
      es: "Tres, con los nodos de la UCLA, el SRI y Santa Bárbara"
  explanation:
    es: "A finales de 1969, cuatro ordenadores centrales estaban conectados en la ARPANET inicial. Dos son los nodos que existían al enviarse el primer mensaje, no los de finales de 1969. Tres dejan fuera a Utah, que se añadió junto con Santa Bárbara antes de acabar 1969. Cinco no es la cifra de la página, que habla de cuatro ordenadores centrales a finales de 1969."
  citation: "fuente: `isoc-historia-internet.html`; «Thus, by the end of 1969, four host computers were connected together into the initial ARPANET, and the budding Internet was off the ground.»"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q005
  prompt:
    es: "¿Cuál de los siguientes años es el de la llegada del correo electrónico a ARPANET, cuando Ray Tomlinson escribió el software básico de envío y lectura de mensajes?"
  options:
  - id: a
    text:
      es: "En 1969, año en que se instaló el primer nodo en la UCLA"
  - id: b
    correct: true
    text:
      es: "En 1972, el mismo año de la primera demostración pública de ARPANET"
  - id: c
    text:
      es: "En 1983, año del paso de ARPANET del protocolo NCP a TCP/IP, el 1 de enero"
  - id: d
    text:
      es: "En 1990, año en que se desmanteló la propia ARPANET"
  explanation:
    es: "El correo electrónico se introdujo en 1972: en marzo Tomlinson escribió el software básico de envío y lectura. 1969 es el año del primer nodo, tres años antes del correo. 1983 es el año en que ARPANET pasó de NCP a TCP/IP. 1990 es el año en que se desmanteló ARPANET, cuando el correo llevaba casi dos décadas en uso."
  citation: "fuente: `isoc-historia-internet.html`; «It was also in 1972 that the initial \"hot\" application, electronic mail, was introduced.»"
  difficulty: 1
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q006
  prompt:
    es: "¿Quién escribió en marzo de 1972, en BBN, el software básico de envío y lectura de mensajes de correo electrónico para los desarrolladores de ARPANET?"
  options:
  - id: a
    text:
      es: "Bob Kahn, que organizó la demostración de octubre en la ICCC"
  - id: b
    correct: true
    text:
      es: "Ray Tomlinson, que trabajaba en BBN"
  - id: c
    text:
      es: "Steve Crocker, que dirigía el Network Working Group"
  - id: d
    text:
      es: "Larry Roberts, que en julio escribió la primera utilidad de correo"
  explanation:
    es: "Ray Tomlinson, de BBN, escribió en marzo de 1972 el software básico de envío y lectura de correo. Roberts escribió en julio una utilidad para listar, leer, archivar, reenviar y responder mensajes, que amplió el software de Tomlinson. Kahn organizó en octubre de 1972 la demostración pública de ARPANET. Crocker dirigía el grupo que terminó el protocolo NCP y estableció la serie de RFC."
  citation: "fuente: `isoc-historia-internet.html`; «In March Ray Tomlinson at BBN wrote the basic email message send and read software, motivated by the need of the ARPANET developers for an easy coordination mechanism.»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q007
  prompt:
    es: "¿Cuál de las siguientes aplicaciones de red tuvo, según la historia de Internet, el mayor impacto entre las innovaciones de la época de ARPANET?"
  options:
  - id: a
    text:
      es: "La transferencia de ficheros, aplicación muy importante en esa época"
  - id: b
    text:
      es: "El acceso remoto con Telnet, también muy importante entonces"
  - id: c
    correct: true
    text:
      es: "El correo electrónico, la mayor aplicación de red durante más de una década"
  - id: d
    text:
      es: "La voz en paquetes, precursora de la telefonía por Internet"
  explanation:
    es: "La página señala que el correo electrónico es probablemente la innovación de esa época con mayor impacto. La transferencia de ficheros fue muy importante, pero la página da al correo el mayor impacto. El acceso remoto con Telnet también fue muy importante, pero no el de mayor impacto. La voz en paquetes fue una de las aplicaciones propuestas en los primeros tiempos, sin ese impacto."
  citation: "fuente: `isoc-historia-internet.html`; «However, while file transfer and remote login (Telnet) were very important applications, electronic mail has probably had the most significant impact of the innovations from that era.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q008
  prompt:
    es: "¿Cómo se llamó el protocolo de host a host de ARPANET que terminó en diciembre de 1970 el grupo de trabajo dirigido por S. Crocker?"
  options:
  - id: a
    text:
      es: "TCP/IP, el protocolo que ideó Kahn después y que lo sustituyó"
  - id: b
    text:
      es: "Telnet, el protocolo de inicio de sesión remoto"
  - id: c
    text:
      es: "FTP, el protocolo con el que se pidieron las RFC en línea"
  - id: d
    correct: true
    text:
      es: "NCP, el Network Control Protocol"
  explanation:
    es: "El Network Working Group de Crocker terminó en diciembre de 1970 el protocolo inicial de host a host, llamado NCP. TCP/IP es el protocolo posterior que Kahn desarrolló para una red de arquitectura abierta y que sustituyó a NCP en 1983. FTP es la aplicación con la que se accedía a las RFC en línea, no el protocolo de host a host. Telnet es una aplicación de acceso remoto, no el protocolo de host a host que terminó el grupo de Crocker."
  citation: "fuente: `isoc-historia-internet.html`; «Origins of the Internet»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q009
  prompt:
    es: "¿Cuál de los siguientes años es el del paso de ARPANET del protocolo NCP a TCP/IP, con una transición que se produjo un 1 de enero?"
  options:
  - id: a
    text:
      es: "En 1980, cuando TCP/IP se adoptó como estándar de defensa"
  - id: b
    correct: true
    text:
      es: "En 1983, tras varios años de planificación"
  - id: c
    text:
      es: "En 1985, cuando Jennings llegó a NSF para dirigir NSFNET"
  - id: d
    text:
      es: "En 1990, cuando se desmanteló la propia ARPANET"
  explanation:
    es: "La transición de NCP a TCP/IP se hizo el 1 de enero de 1983, tras varios años de planificación. 1980 es el año en que TCP/IP se adoptó como estándar de defensa, tres años antes. 1985 es el año en que Dennis Jennings llegó a NSF, dos años después del cambio. 1990 es el año en que se desmanteló ARPANET."
  citation: "fuente: `isoc-historia-internet.html`; «Proving the Ideas»"
  difficulty: 1
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q010
  prompt:
    es: "¿Cuál de las siguientes afirmaciones describe cómo fue la transición de ARPANET de NCP a TCP/IP del 1 de enero de 1983, según la historia de Internet?"
  options:
  - id: a
    correct: true
    text:
      es: "Simultánea: todos los equipos debían convertirse a la vez, tras años de preparación"
  - id: b
    text:
      es: "Gradual: cada equipo cambiaba de protocolo cuando podía, durante varios años"
  - id: c
    text:
      es: "Parcial: solo cambiaron los equipos militares y el resto siguió con NCP"
  - id: d
    text:
      es: "Opcional: los equipos podían seguir con NCP y comunicarse igual"
  explanation:
    es: "La transición fue de tipo «flag-day»: exigía que todos los equipos se convirtieran a la vez y se preparó durante varios años. La conversión gradual contradice que todos los equipos debían convertirse a la vez. Seguir con NCP dejaba al equipo comunicándose con mecanismos ad hoc, no «igual», según la página. No cambiaron solo los equipos militares: la página exige la conversión simultánea de todos los equipos o quedarse con mecanismos ad hoc."
  citation: "fuente: `isoc-historia-internet.html`; «Proving the Ideas»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q011
  prompt:
    es: "¿Cuál de los siguientes años es el del desmantelamiento definitivo de la propia ARPANET, cuando TCP/IP ya había desplazado a casi todos los demás protocolos de redes de área extensa?"
  options:
  - id: a
    correct: true
    text:
      es: "En 1990"
  - id: b
    text:
      es: "En 1983, año de la transición a TCP/IP"
  - id: c
    text:
      es: "En 1995, año en que el FNC definió el término Internet"
  - id: d
    text:
      es: "En 1986, año en que Steve Wolff asumió la dirección de NSFNET"
  explanation:
    es: "ARPANET se desmanteló en 1990, cuando TCP/IP ya se había impuesto a los demás protocolos de área extensa. 1983 es el año del paso de NCP a TCP/IP, tras el cual ARPANET siguió funcionando. 1986 es el año en que Steve Wolff tomó el programa NSFNET. 1995 es el año de la resolución del FNC que define Internet, cinco años después."
  citation: "fuente: `isoc-historia-internet.html`; «Transition to Widespread Infrastructure»"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q012
  prompt:
    es: "¿Cuál de los siguientes pares de redes resultó de dividir ARPANET tras pasar de NCP a TCP/IP, separando los usos operativos de los de investigación?"
  options:
  - id: a
    text:
      es: "BITNET y USENET, las redes de otros colectivos"
  - id: b
    correct: true
    text:
      es: "MILNET, para necesidades operativas, y ARPANET, para investigación"
  - id: c
    text:
      es: "Packet Radio y Packet Satellite, las otras redes experimentales"
  - id: d
    text:
      es: "NSFNET y CSNET, dos redes académicas distintas de la propia ARPANET"
  explanation:
    es: "La transición a TCP/IP permitió dividir ARPANET en MILNET, para necesidades operativas, y ARPANET, para investigación. NSFNET y CSNET son redes distintas de ARPANET, no las dos en que esta se dividió. Packet Radio y Packet Satellite eran, con ARPANET, las tres primeras redes del experimento, no resultado de su división. BITNET y USENET eran redes ajenas, que no nacieron de dividir ARPANET."
  citation: "fuente: `isoc-historia-internet.html`; «The transition of ARPANET from NCP to TCP/IP permitted it to be split into a MILNET supporting operational requirements and an ARPANET supporting research needs.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q013
  prompt:
    es: "¿Cuál de las siguientes ideas técnicas clave sostiene Internet tal como se conoce hoy, según la historia de Internet de la Internet Society?"
  options:
  - id: a
    text:
      es: "Una única red de diseño uniforme, dirigida desde un centro global de operaciones"
  - id: b
    text:
      es: "La conmutación de circuitos, que unía las redes bit a bit en un circuito extremo a extremo"
  - id: c
    text:
      es: "Una arquitectura concreta que dictaba la tecnología de cada red conectada"
  - id: d
    correct: true
    text:
      es: "La arquitectura de red abierta, con redes independientes de diseño libre"
  explanation:
    es: "Internet se basa en la arquitectura de red abierta: cada red se diseña por separado y se conecta mediante una arquitectura de interconexión. La conmutación de circuitos era el método tradicional de federar redes, anterior a esa idea. Una red única y uniforme contradice que Internet reúna varias redes independientes de diseño arbitrario, sin control global a nivel de operaciones. En la arquitectura abierta, la tecnología de cada red no la dicta una arquitectura concreta, sino que la elige libremente cada proveedor."
  citation: "fuente: `isoc-historia-internet.html`; «The Initial Internetting Concepts»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q014
  prompt:
    es: "¿Quién introdujo la idea de la arquitectura de red abierta poco después de llegar a DARPA en 1972, en un programa que se llamó «Internetting»?"
  options:
  - id: a
    text:
      es: "Tim Berners-Lee, inventor de la World Wide Web"
  - id: b
    correct: true
    text:
      es: "Bob Kahn, en el programa de radio de paquetes"
  - id: c
    text:
      es: "J. C. R. Licklider, autor del concepto de «Galactic Network»"
  - id: d
    text:
      es: "Leonard Kleinrock, autor de la teoría de conmutación de paquetes"
  explanation:
    es: "Kahn introdujo la idea de arquitectura abierta poco después de llegar a DARPA en 1972, dentro del programa de radio de paquetes. Licklider describió en 1962 la «Galactic Network», una década antes. Kleinrock publicó en 1961 el primer artículo de teoría de conmutación de paquetes. Berners-Lee es el inventor de la Web, muy posterior a la arquitectura abierta."
  citation: "fuente: `isoc-historia-internet.html`; «The Initial Internetting Concepts»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q015
  prompt:
    es: "¿Quién describió en memorandos de agosto de 1962 el concepto de «Galactic Network», un conjunto de ordenadores interconectados por todo el mundo?"
  options:
  - id: a
    text:
      es: "Lawrence Roberts, que publicó el plan de ARPANET"
  - id: b
    text:
      es: "Frank Heart, que dirigía el grupo de BBN ganador de los IMP"
  - id: c
    text:
      es: "Leonard Kleinrock, que publicó la primera teoría de conmutación de paquetes"
  - id: d
    correct: true
    text:
      es: "J. C. R. Licklider, del MIT"
  explanation:
    es: "Licklider escribió en agosto de 1962 los memorandos sobre su «Galactic Network». Kleinrock publicó en 1961 el primer artículo sobre la teoría de conmutación de paquetes. Roberts publicó en 1967 el plan de ARPANET. Frank Heart dirigía el grupo de BBN que ganó en diciembre de 1968 el concurso de los IMP."
  citation: "fuente: `isoc-historia-internet.html`; «Origins of the Internet»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q016
  prompt:
    es: "¿Quién publicó en julio de 1961 el primer artículo sobre la teoría de conmutación de paquetes y en 1964 el primer libro sobre el tema?"
  options:
  - id: a
    correct: true
    text:
      es: "Leonard Kleinrock, entonces en el MIT"
  - id: b
    text:
      es: "Paul Baran, del grupo RAND, autor de un estudio de voz segura"
  - id: c
    text:
      es: "J. C. R. Licklider, que escribió los memorandos de 1962"
  - id: d
    text:
      es: "Donald Davies, que presentó un concepto de red de paquetes del NPL"
  explanation:
    es: "Kleinrock publicó el primer artículo sobre conmutación de paquetes en julio de 1961 y el primer libro en 1964. Licklider escribió en 1962 los memorandos sobre la «Galactic Network». Davies presentó desde el NPL un concepto de red de paquetes en la misma conferencia en que Roberts presentó su plan. Baran, de RAND, trabajó en 1964 en redes de paquetes para voz segura militar."
  citation: "fuente: `isoc-historia-internet.html`; «Origins of the Internet»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q017
  prompt:
    es: "¿Quién es, según la historia de Internet, el inventor de la World Wide Web, cuyo consorcio W3C se encarga de evolucionar sus protocolos y estándares?"
  options:
  - id: a
    text:
      es: "Vint Cerf, que dirigió el equipo de Stanford de la especificación de TCP"
  - id: b
    text:
      es: "Jon Postel, editor de las RFC y gestor de los números de protocolo"
  - id: c
    text:
      es: "Bob Kahn, que organizó la demostración pública de ARPANET en 1972"
  - id: d
    correct: true
    text:
      es: "Tim Berners-Lee, que dirigió al principio el W3C desde el MIT"
  explanation:
    es: "Tim Berners-Lee es el inventor de la World Wide Web y dirigió al principio el W3C desde el MIT, junto con Al Vezza. Cerf dirigió el equipo de Stanford que redactó la especificación detallada de TCP. Kahn organizó en 1972 la demostración pública de ARPANET. Postel fue editor de las RFC y gestionó la asignación de números de protocolo."
  citation: "fuente: `isoc-historia-internet.html`; «Formation of the Broad Community»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q018
  prompt:
    es: "¿Cuál de las siguientes funciones tenía el Network Information Center del SRI, que dirigía Elizabeth Feinler, en la red ARPANET?"
  options:
  - id: a
    text:
      es: "Preparar el sistema de medición de la red en el laboratorio de Kleinrock, en la UCLA"
  - id: b
    text:
      es: "Optimizar la topología y la economía de la red con Network Analysis Corporation"
  - id: c
    text:
      es: "Instalar los IMP en cada nodo y construir los conmutadores de paquetes"
  - id: d
    correct: true
    text:
      es: "Mantener las tablas de nombres de host y direcciones, y el directorio de las RFC"
  explanation:
    es: "El Network Information Center del SRI mantenía las tablas de correspondencia entre nombres de host y direcciones y el directorio de las RFC. Instalar los IMP era tarea del equipo de BBN, que ganó el concurso para construirlos. La topología y la economía las diseñó y optimizó Roberts con Howard Frank y su equipo de Network Analysis Corporation. El sistema de medición de la red lo preparó el equipo de Kleinrock en la UCLA."
  citation: "fuente: `isoc-historia-internet.html`; «Origins of the Internet»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q019
  prompt:
    es: "¿Cuál de las siguientes definiciones corresponde a los Interface Message Processors (IMP) cuyo desarrollo ganó en diciembre de 1968 el grupo de Frank Heart en BBN?"
  options:
  - id: a
    text:
      es: "El protocolo de host a host de la red, terminado en 1970"
  - id: b
    text:
      es: "Los ordenadores centrales (hosts) que ejecutaban las aplicaciones"
  - id: c
    correct: true
    text:
      es: "Los conmutadores de paquetes, componentes clave de la red ARPANET"
  - id: d
    text:
      es: "El sistema de medición de la red, preparado en la UCLA"
  explanation:
    es: "Los IMP eran los conmutadores de paquetes, uno de los componentes clave de ARPANET. Los ordenadores centrales eran los hosts que se conectaban a cada IMP; el primero se conectó junto con el IMP de la UCLA. El protocolo de host a host fue el NCP, que terminó el grupo de Crocker. El sistema de medición de la red lo preparó el equipo de Kleinrock, no BBN."
  citation: "fuente: `isoc-historia-internet.html`; «an RFQ was released by DARPA for the development of one of the key components, the packet switches called Interface Message Processors (IMP's).»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-isoc-historia-internet-html
- id: m06-l08-q020
  prompt:
    es: "¿Qué organizó Kahn en octubre de 1972 en el International Computer Communication Conference (ICCC), según la historia de Internet?"
  options:
  - id: a
    correct: true
    text:
      es: "La primera demostración pública de la tecnología ARPANET, un gran éxito"
  - id: b
    text:
      es: "La transición de ARPANET del protocolo NCP al protocolo TCP/IP en 1983"
  - id: c
    text:
      es: "La creación de la serie de notas Request for Comments, en la UCLA"
  - id: d
    text:
      es: "La primera conexión entre dos nodos, la UCLA y el SRI"
  explanation:
    es: "Kahn organizó en la ICCC, en octubre de 1972, la demostración pública inicial de ARPANET. La conexión entre la UCLA y el SRI se produjo en 1969. El paso de NCP a TCP/IP fue el 1 de enero de 1983. La serie de RFC la estableció Crocker en 1969."
  citation: "fuente: `isoc-historia-internet.html`; «In October 1972, Kahn organized a large, very successful demonstration of the ARPANET at the International Computer Communication Conference (ICCC).»"
