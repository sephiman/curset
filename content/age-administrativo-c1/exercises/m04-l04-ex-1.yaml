    es: "El artículo 114.12 dice que el personal funcionario interino toma posesión «al día siguiente al del nombramiento»: el miércoles 10 de febrero de 2027. El martes 9 de febrero de 2027 es el mismo día del nombramiento. El miércoles 24 de febrero de 2027 aplica los quince días naturales del funcionario de carrera. El martes 9 de marzo de 2027 aplica el mes del funcionario de carrera con cambio de localidad."
  citation: "art. 114.12 RDL 6/2023"
  difficulty: 2
  tags:
