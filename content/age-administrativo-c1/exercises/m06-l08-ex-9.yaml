# anchor: fuente-aepd-guia-cookies-pdf
- id: m06-l08-q257
  prompt:
    es: "¿Qué dos tipos de cookies distingue la guía de la AEPD según el plazo de tiempo que permanecen activadas en el equipo del usuario?"
  options:
  - id: a
    text:
      es: "Cookies propias y cookies de terceros"
  - id: b
    text:
      es: "Cookies de preferencias y cookies publicitarias"
  - id: c
    correct: true
    text:
      es: "Cookies de sesión y cookies persistentes"
  - id: d
    text:
      es: "Cookies técnicas y cookies de análisis"
  explanation:
    es: "Según el plazo de tiempo que permanecen activadas en el equipo terminal, la guía distingue las cookies de sesión y las cookies persistentes. Cookies propias y de terceros es la clasificación según la entidad que las gestiona. Cookies técnicas y de análisis es la clasificación según su finalidad. Cookies de preferencias y publicitarias es una clasificación según su finalidad."
  citation: "fuente: `aepd-guia-cookies.pdf`; «2.1.3. Tipos de cookies según el plazo de tiempo que permanecen activadas»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-edge-atajos-html
- id: m06-l08-q258
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas abre una nueva ventana de Edge, sin ser de InPrivate, en Microsoft Edge, en Windows 11?"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl+N"
  - id: b
    text:
      es: "Ctrl+Mayús+K"
  - id: c
    text:
      es: "Ctrl+T"
  - id: d
    text:
      es: "Ctrl+Mayús+T"
  explanation:
    es: "Ctrl+N abre una nueva ventana. Ctrl+T abre una pestaña nueva y cambia a ella. Ctrl+Mayús+T vuelve a abrir la pestaña cerrada más recientemente. Ctrl+Mayús+K duplica la pestaña actual."
  citation: "fuente: `ms-edge-atajos.html`; «Métodos abreviados de teclado en Microsoft Edge»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m06-l08-q259
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas cierra la ventana actual, con todas sus pestañas, en Microsoft Edge, en Windows 11?"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl+Mayús+W"
  - id: b
    text:
      es: "Ctrl+W"
  - id: c
    text:
      es: "Ctrl+Mayús+Suprimir"
  - id: d
    text:
      es: "Ctrl+Mayús+T"
  explanation:
    es: "Ctrl+Mayús+W cierra la ventana actual. Ctrl+W cierra solo la pestaña actual. Ctrl+Mayús+T vuelve a abrir la pestaña cerrada más recientemente. Ctrl+Mayús+Suprimir abre las opciones de borrar los datos de exploración."
  citation: "fuente: `ms-edge-atajos.html`; «Métodos abreviados de teclado en Microsoft Edge»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m06-l08-q260
  prompt:
    es: "En Microsoft Edge, en Windows 11, la combinación Ctrl+Pestaña, que actúa sobre las pestañas abiertas en la ventana:"
  options:
  - id: a
    text:
      es: "Cambia a la última pestaña"
  - id: b
    text:
      es: "Abre una pestaña nueva"
  - id: c
    text:
      es: "Cambia a la pestaña anterior"
  - id: d
    correct: true
    text:
      es: "Cambia a la pestaña siguiente"
  explanation:
    es: "Ctrl+Pestaña cambia a la pestaña siguiente. Cambiar a la pestaña anterior es la función de Ctrl+Mayús+Pestaña. Pasar a la pestaña final es la función de Ctrl+9. Abrir una pestaña nueva es la función de Ctrl+T."
  citation: "fuente: `ms-edge-atajos.html`; «Métodos abreviados de teclado en Microsoft Edge»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m06-l08-q261
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿qué hace la combinación Alt+Mayús+B respecto a la barra de favoritos?"
  options:
  - id: a
    text:
      es: "Guarda la pestaña actual como favorita"
  - id: b
    text:
      es: "Muestra u oculta la barra de favoritos"
  - id: c
    correct: true
    text:
      es: "Establece el foco en el primer elemento de la barra de favoritos"
  - id: d
    text:
      es: "Abre Favoritos en un panel lateral"
  explanation:
    es: "Alt+Mayús+B establece el foco en el primer elemento de la barra de favoritos. Mostrar u ocultar la barra de favoritos es la función de Ctrl+Mayús+B. Guardar la pestaña actual como favorita es la función de Ctrl+D. Abrir Favoritos es la función de Ctrl+Mayús+O."
  citation: "fuente: `ms-edge-atajos.html`; «Métodos abreviados de teclado en Microsoft Edge»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q262
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿qué pasos permiten quitar una extensión desde el botón Extensiones, a la derecha de la barra de direcciones?"
  options:
  - id: a
    text:
      es: "Extensiones › Obtener extensiones para Microsoft Edge › Obtener"
  - id: b
    text:
      es: "Extensiones › Notificar abuso › Rellenar el formulario"
  - id: c
    correct: true
    text:
      es: "Extensiones › Más acciones › Quitar de Microsoft Edge › Quitar"
  - id: d
    text:
      es: "Extensiones › Administrar extensiones › botón de alternancia"
  explanation:
    es: "Desde el botón Extensiones se selecciona Más acciones junto a la extensión y después Quitar de Microsoft Edge › Quitar. Administrar extensiones y el botón de alternancia desactivan la extensión, sin quitarla. Obtener extensiones para Microsoft Edge sirve para agregar extensiones nuevas. Notificar abuso sirve para informar de una extensión que infringe las directivas, en el sitio web de complementos."
  citation: "fuente: `ms-edge-extensiones.html`; «Quitar una extensión de Microsoft Edge»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q263
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿qué se selecciona junto a la extensión buscada en el sitio de complementos de Edge, antes de revisar sus permisos?"
  options:
  - id: a
    text:
      es: "Administrar extensiones"
  - id: b
    text:
      es: "Quitar"
  - id: c
    text:
      es: "Agregar extensión"
  - id: d
    correct: true
    text:
      es: "Obtener"
  explanation:
    es: "Se busca la extensión y se selecciona Obtener; después se revisan los permisos y se selecciona Agregar extensión. Agregar extensión se selecciona después de revisar los permisos. Quitar es la opción para eliminar una extensión. Administrar extensiones es la opción para desactivar una extensión."
  citation: "fuente: `ms-edge-extensiones.html`; «Buscar y agregar una extensión a Microsoft Edge»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q264
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿qué opción se selecciona en la página de una extensión del sitio de complementos de Edge para dejar una reseña?"
  options:
  - id: a
    text:
      es: "Obtener extensión de la tienda"
  - id: b
    correct: true
    text:
      es: "Agregar una reseña"
  - id: c
    text:
      es: "Notificar abuso de la extensión"
  - id: d
    text:
      es: "Agregar extensión tras el permiso"
  explanation:
    es: "Para dejar una clasificación o comentarios se abre la extensión en el sitio web de complementos y se selecciona Agregar una reseña. Notificar abuso sirve para informar de una extensión que infringe las directivas de los complementos. Obtener extensión es el botón para instalar una extensión desde Chrome Web Store. Agregar extensión es el botón que confirma la instalación tras revisar los permisos."
  citation: "fuente: `ms-edge-extensiones.html`; «Dejar una clasificación o un comentario»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-edge-inprivate-html
- id: m06-l08-q265
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿qué permisos de ubicación usa una exploración de InPrivate, que no evita que los sitios soliciten la ubicación precisa?"
  options:
  - id: a
    text:
      es: "Los de la última ventana de InPrivate cerrada en el equipo"
  - id: b
    text:
      es: "Los de una configuración propia de InPrivate, siempre desactivada"
  - id: c
    text:
      es: "Los de la cuenta de Microsoft asociada al historial de exploración"
  - id: d
    correct: true
    text:
      es: "Los del perfil desde el que se inició la sesión de InPrivate"
  explanation:
    es: "La página dice: «La exploración de InPrivate usa la configuración de permisos de ubicación del perfil desde el que se inició la sesión de InPrivate». Los permisos de la última ventana de InPrivate cerrada contradicen que se tome el perfil. Una configuración propia de InPrivate, siempre desactivada, tampoco: usa la del perfil. Y la cuenta de Microsoft asociada al historial no es el origen: la página dice que InPrivate no asocia el historial de exploración con una cuenta de Microsoft."
  citation: "fuente: `ms-edge-inprivate.html`; «¿Qué hace Microsoft Edge con tus datos mientras te encuentras en InPrivate?»"
  difficulty: 3
  tags:
  - "configuración"
