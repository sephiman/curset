# anchor: boe-a-2011-18541-art-28
- id: m02-l03-q109
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, se concederá el acceso a documentos que contengan datos de carácter personal, sin necesidad de consentimiento de sus titulares, cuando se proceda previamente a:"
  options:
  - id: a
    text:
      es: "La certificación del Registro Civil sobre el fallecimiento de todos los afectados."
  - id: b
    text:
      es: "La autorización escrita del responsable del archivo que custodia los documentos."
  - id: c
    text:
      es: "La declaración de interés legítimo del solicitante ante el responsable del archivo."
  - id: d
    correct: true
    text:
      es: "La oportuna disociación de los datos, de modo que se impida la identificación de los afectados."
  explanation:
    es: "Sin consentimiento, el acceso procede si antes se disocian los datos y no se puede identificar a nadie. La certificación del Registro Civil acredita el fallecimiento en otro supuesto. El interés legítimo y la autorización del responsable no sustituyen la disociación."
  citation: "art. 28.4 RD 1708/2011"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2011-18541-art-30
- id: m02-l03-q110
  prompt:
    es: "Según el Real Decreto 1708/2011, de 18 de noviembre, por el que se establece el Sistema Español de Archivos, la resolución de la solicitud de acceso o de consulta deberá adoptarse y notificarse lo antes posible y, en todo caso, en el plazo máximo de un mes desde:"
  options:
  - id: a
    text:
      es: "La entrada de la solicitud en el archivo que custodia los documentos."
  - id: b
    correct: true
    text:
      es: "La recepción por el órgano competente para tramitarla."
  - id: c
    text:
      es: "La presentación de la solicitud en cualquier registro."
  - id: d
    text:
      es: "La fecha en que se subsanen las deficiencias de la solicitud."
  explanation:
    es: "El mes empieza con la recepción de la solicitud por el órgano competente para tramitarla. Contarlo desde la presentación en un registro, desde la subsanación o desde la entrada en el archivo custodio cambia el momento inicial."
  citation: "art. 30.1 RD 1708/2011"
  difficulty: 3
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-2011-18541-art-30
- id: m02-l03-q111
  prompt:
    es: "¿Qué sentido tiene el silencio en las solicitudes de acceso a documentos de los archivos de la Administración General del Estado cuando vence el plazo máximo para resolver?"
  options:
  - id: a
    correct: true
    text:
      es: "La solicitud de acceso se entiende estimada."
  - id: b
    text:
      es: "La solicitud de acceso se entiende desestimada."
  - id: c
    text:
      es: "La solicitud caduca y debe presentarse de nuevo."
  - id: d
    text:
      es: "La solicitud se entiende inadmitida a trámite."
  explanation:
    es: "Transcurrido el plazo sin resolución expresa, la solicitud se entiende estimada. Desestimada, inadmitida o caducada son efectos que el real decreto no prevé."
  citation: "art. 30.4 RD 1708/2011"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2011-18541-art-30
- id: m02-l03-q112
  prompt:
    es: "¿Cuál es el plazo máximo para resolver y notificar la solicitud de acceso o de consulta de documentos de archivo?"
  options:
  - id: a
    text:
      es: "Dos meses desde la recepción por el archivo custodio."
  - id: b
    correct: true
    text:
      es: "Un mes desde la recepción por el órgano competente."
  - id: c
    text:
      es: "Tres meses desde la presentación de la solicitud."
  - id: d
    text:
      es: "Diez días hábiles desde la presentación en el registro."
  explanation:
    es: "El plazo es de un mes desde la recepción por el órgano competente para tramitarla. Diez días hábiles, dos meses y tres meses son plazos que no corresponden a este procedimiento."
  citation: "art. 30.1 RD 1708/2011"
  difficulty: 2
  tags:
  - "plazo"
