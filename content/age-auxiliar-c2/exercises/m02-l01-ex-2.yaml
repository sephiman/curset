# anchor: boe-a-2013-12632-art-4
- id: m02-l01-q004
  prompt:
    es: "De acuerdo con el artículo 4.1 del Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, son personas con discapacidad las que presentan deficiencias físicas, mentales, intelectuales o sensoriales:"
  options:
  - id: a
    text:
      es: "Permanentes y declaradas judicialmente que, al interactuar con diversas barreras, impidan su participación plena y efectiva en la sociedad."
  - id: b
    correct: true
    text:
      es: "Previsiblemente permanentes que, al interactuar con diversas barreras, puedan impedir su participación plena y efectiva en la sociedad."
  - id: c
    text:
      es: "Temporales o permanentes que les impidan en todo caso desempeñar una actividad laboral en igualdad de condiciones."
  - id: d
    text:
      es: "Previsiblemente permanentes que les impidan valerse por sí mismas en las actividades básicas de la vida diaria."
  explanation:
    es: "El artículo 4.1 exige deficiencias «previsiblemente permanentes que, al interactuar con diversas barreras, puedan impedir su participación plena y efectiva en la sociedad, en igualdad de condiciones con los demás». No pide una declaración judicial, no admite deficiencias temporales ni se refiere a la actividad laboral. La imposibilidad de valerse en las actividades básicas de la vida diaria describe la dependencia, no la definición de discapacidad del artículo 4.1."
  citation: "art. 4.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-4
- id: m02-l01-q005
  prompt:
    es: "Según el artículo 4.2 del Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, el grado mínimo de discapacidad reconocido para tener la consideración de persona con discapacidad es:"
  options:
  - id: a
    text:
      es: "Un grado del 25 por ciento."
  - id: b
    text:
      es: "Un grado del 45 por ciento."
  - id: c
    correct: true
    text:
      es: "Un grado del 33 por ciento."
  - id: d
    text:
      es: "Un grado del 65 por ciento."
  explanation:
    es: "El artículo 4.2 da esa consideración a quienes tengan reconocido «un grado de discapacidad igual o superior al 33 por ciento»; el mínimo es, por tanto, el 33 por ciento. El 25 y el 45 por ciento no aparecen en el artículo. El 65 por ciento es el grado al que el mismo apartado asimila la dependencia en grado II y III, no el umbral general."
  citation: "art. 4.2 RDL 1/2013"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2013-12632-art-28
- id: m02-l01-q006
  prompt:
    es: "Según el artículo 28.1 del Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, las condiciones básicas de accesibilidad de las oficinas públicas serán exigibles:"
  options:
  - id: a
    correct: true
    text:
      es: "En los plazos y términos establecidos reglamentariamente."
  - id: b
    text:
      es: "En los plazos que fije cada departamento ministerial mediante orden."
  - id: c
    text:
      es: "Desde el momento en que las solicite la persona con discapacidad."
  - id: d
    text:
      es: "En los plazos que acuerde la Conferencia Sectorial competente."
  explanation:
    es: "El artículo 28.1 dice que las condiciones básicas de accesibilidad de las oficinas públicas y servicios de atención al ciudadano «serán exigibles en los plazos y términos establecidos reglamentariamente», con los plazos máximos de la disposición adicional tercera. No los fija cada departamento por orden ni una Conferencia Sectorial, y no dependen de que las solicite la persona con discapacidad."
  citation: "art. 28.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2007-6239-art-1
- id: m02-l01-q008
  prompt:
    es: "Según el artículo 1.2.a) del Real Decreto 366/2007, de 16 de marzo, las Oficinas de Atención al Ciudadano son dependencias o espacios físicos que la Administración General del Estado dedica:"
  options:
  - id: a
    correct: true
    text:
      es: "Exclusiva o prioritariamente al contacto directo con los ciudadanos y sus representantes."
  - id: b
    text:
      es: "Exclusivamente a la recepción de las solicitudes dirigidas a la Administración General del Estado."
  - id: c
    text:
      es: "Prioritariamente a la atención telefónica y telemática de los ciudadanos y sus representantes."
  - id: d
    text:
      es: "Exclusivamente al registro y archivo de la documentación presentada por los interesados."
  explanation:
    es: "El artículo 1.2.a) define las Oficinas como espacios que la Administración dedica «exclusiva o prioritariamente al contacto directo con los ciudadanos y sus representantes». Recibir solicitudes es solo una de sus finalidades, y la definición no exige exclusividad. La atención telefónica o telemática no es contacto directo en un espacio físico. El registro y archivo tampoco agota lo que hace la Oficina."
  citation: "art. 1.2.a) RD 366/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-2
- id: m02-l01-q010
  prompt:
    es: "Según el artículo 2 del Real Decreto 366/2007, de 16 de marzo, ¿mediante cuál de los siguientes medios asegura la Administración General del Estado los derechos de los ciudadanos con discapacidad?"
  options:
  - id: a
    text:
      es: "La acción positiva para compensar las desventajas, aplicable solo en los procedimientos de concurrencia competitiva."
  - id: b
    correct: true
    text:
      es: "La acción positiva para compensar las desventajas que estos ciudadanos pudieran presentar en sus relaciones con la Administración."
  - id: c
    text:
      es: "La garantía de la igualdad de resultados, con independencia de las desventajas que estos ciudadanos pudieran presentar."
  - id: d
    text:
      es: "La exención de los requisitos documentales que se exigen al resto de los ciudadanos en sus relaciones con la Administración."
  explanation:
    es: "La letra b) del artículo 2 recoge «la acción positiva para compensar las desventajas que estos ciudadanos en sus relaciones con la Administración pudieran presentar». El artículo no limita esa acción a los procedimientos de concurrencia competitiva. La letra a) garantiza la igualdad de oportunidades, no de resultados. Ninguna letra exime de los requisitos documentales; la letra c) habla de medios y apoyos suplementarios."
  citation: "art. 2.b) RD 366/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-4
- id: m02-l01-q012
  prompt:
    es: "Según las recomendaciones del artículo 4.2.a) del Real Decreto 366/2007, de 16 de marzo, con carácter preferente y siempre que resulte posible, la Oficina de Atención al Ciudadano se ubicará:"
  options:
  - id: a
    text:
      es: "En la primera planta, con ascensor accesible."
  - id: b
    text:
      es: "En la planta más próxima al aparcamiento."
  - id: c
    correct: true
    text:
      es: "En planta a nivel de la vía pública."
  - id: d
    text:
      es: "En un edificio de uso exclusivo administrativo."
  explanation:
    es: "El artículo 4.2.a) recomienda que, «con carácter preferente y siempre que resulte posible, la Oficina se ubicará en planta a nivel de la vía pública». Las rampas o ascensores solo entran «en caso contrario», como alternativa, no como ubicación preferente en la primera planta. La cercanía al aparcamiento y el uso exclusivo del edificio no son el criterio de esa letra."
  citation: "art. 4.2.a) RD 366/2007"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-7
- id: m02-l01-q013
  prompt:
    es: "¿Cómo estarán situados los paneles de información gráfica de la señalización interior accesible de las Oficinas de Atención al Ciudadano de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Perpendicularmente a la dirección de la marcha."
  - id: b
    text:
      es: "Frente a la puerta de entrada, sobre el dintel."
  - id: c
    text:
      es: "Detrás del mostrador, a la vista del empleado."
  - id: d
    correct: true
    text:
      es: "Paralelamente a la dirección de la marcha."
  explanation:
    es: "El artículo 7.a) RD 366/2007 recomienda que los paneles de información gráfica estén «situados paralelamente a la dirección de la marcha» y, siempre que sea posible, adyacentes a alguna pared o superficie. Situarlos perpendicularmente a la marcha contradice esa letra. Sobre el dintel de la puerta o detrás del mostrador no se permite el acercamiento que el mismo artículo exige para interactuar con ellos."
  citation: "art. 7.a) RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-7
- id: m02-l01-q014
  prompt:
    es: "En la señalización interior accesible de las Oficinas de Atención al Ciudadano de la Administración General del Estado, la información relevante se dispondrá:"
  options:
  - id: a
    correct: true
    text:
      es: "Al menos, en dos de las tres modalidades sensoriales: visual, acústica y táctil."
  - id: b
    text:
      es: "Al menos, en una de las modalidades sensoriales, a elección de la Oficina."
  - id: c
    text:
      es: "Solo en la modalidad visual, con símbolos estándar internacionales."
  - id: d
    text:
      es: "En la modalidad acústica, cuando lo solicite la persona con discapacidad."
  explanation:
    es: "El artículo 7.c) RD 366/2007 recomienda disponer la información relevante «al menos, en dos de las tres modalidades sensoriales: visual, acústica y táctil». Una sola modalidad a elección de la Oficina, la sola modalidad visual y la acústica a petición del interesado quedan por debajo de ese mínimo de dos."
  citation: "art. 7.c) RD 366/2007"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-8
- id: m02-l01-q015
  prompt:
    es: "Según las recomendaciones del artículo 8.2 del Real Decreto 366/2007, de 16 de marzo, sobre la configuración de los puestos de atención, los mostradores y puntos de atención:"
  options:
  - id: a
    text:
      es: "Se situarán en una zona reservada y cerrada, separada del espacio de circulación de los usuarios del edificio."
  - id: b
    text:
      es: "Tendrán en toda su longitud una única altura, la de una mesa de trabajo, para todo tipo de usuarios."
  - id: c
    correct: true
    text:
      es: "No dispondrán de vidrios u otros obstáculos que dificulten la transmisión del sonido y la comunicación visual."
  - id: d
    text:
      es: "Contarán con un intérprete de lengua de signos presente durante todo el horario de atención al público."
  explanation:
    es: "El artículo 8.2.c) recomienda que los mostradores y puntos de atención «no dispondrán de vidrios u otros obstáculos que dificultan la transmisión del sonido y la comunicación visual». La letra b) pide que el espacio inmediato a los mostradores esté libre de obstáculos, no separado de la circulación. La letra a) pide que al menos una parte, no toda la longitud, esté a la altura de una mesa de trabajo. Ninguna letra exige un intérprete de lengua de signos presente en todo el horario."
  citation: "art. 8.2.c) RD 366/2007"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-8
- id: m02-l01-q016
  prompt:
    es: "Según el artículo 8.2.e) del Real Decreto 366/2007, de 16 de marzo, ¿con qué fin se dotarán de videotelefonía, de permitirlo técnicamente, los puntos con información telefónica?"
  options:
  - id: a
    text:
      es: "Para verificar la identidad del interlocutor."
  - id: b
    correct: true
    text:
      es: "Para facilitar la lectura labial."
  - id: c
    text:
      es: "Para grabar la atención prestada al ciudadano."
  - id: d
    text:
      es: "Para sustituir la atención presencial en la Oficina."
  explanation:
    es: "El artículo 8.2.e) recomienda dotar los puntos con información telefónica de telefonía de texto, de fax y, de permitirlo técnicamente, de videotelefonía «para facilitar la lectura labial». Verificar la identidad, grabar la atención o sustituir la atención presencial no son la finalidad que da el artículo."
  citation: "art. 8.2.e) RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-11
- id: m02-l01-q017
  prompt:
    es: "¿En cuál de los siguientes casos podrán exceptuarse parcialmente las condiciones de accesibilidad de las Oficinas de Atención al Ciudadano de la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "Cuando la Oficina atienda a menos de cien ciudadanos al mes y disponga además de un servicio de atención telefónica."
  - id: b
    text:
      es: "Cuando así lo acuerde el titular de la Oficina por razones de seguridad del personal que presta servicio en ella."
  - id: c
    text:
      es: "Cuando ninguna persona con discapacidad haya solicitado la adaptación de la Oficina durante el último año natural."
  - id: d
    correct: true
    text:
      es: "Cuando circunstancias de infraestructura o protección del patrimonio hagan su aplicación imposible material o económicamente."
  explanation:
    es: "El artículo 11.1 RD 366/2007 permite exceptuar parcialmente las condiciones del capítulo cuando en el edificio o su entorno «concurran circunstancias de infraestructura o protección del patrimonio que hagan su aplicación imposible material o económicamente». El número de visitas, la decisión del titular de la Oficina por seguridad y la falta de solicitudes de adaptación no son causas de excepción."
  citation: "art. 11.1 RD 366/2007"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2026-18509-art-10
- id: m02-l01-q019
  prompt:
    es: "Según el artículo 10.2.a) del Reglamento de las condiciones básicas de accesibilidad cognitiva, aprobado por el Real Decreto 707/2026, de 2 de septiembre, ¿qué documentos deberán estar disponibles en lectura fácil?"
  options:
  - id: a
    text:
      es: "Solo las resoluciones que pongan fin a los procedimientos administrativos."
  - id: b
    text:
      es: "Los presupuestos y las cuentas anuales de cada organismo público."
  - id: c
    text:
      es: "Las memorias anuales de actividad de cada departamento ministerial."
  - id: d
    correct: true
    text:
      es: "Los formularios o solicitudes y las guías de cumplimentación de procedimientos."
  explanation:
    es: "El artículo 10.2.a) del Reglamento, que se aplica desde el 2 de enero de 2027, impone la «disponibilidad en lectura fácil tanto de formularios o solicitudes, como de las guías de cumplimentación de procedimientos». No limita la obligación a las resoluciones finales, y los presupuestos, las cuentas anuales y las memorias de actividad no están en esa letra."
  citation: "art. 10.2.a) Reglamento aprobado por RD 707/2026"
  difficulty: 3
  tags:
  - "requisito"
# anchor: fuente-boe-analisis-ce-xml
- id: m02-l01-q035
  prompt:
    es: "El artículo 49 de la Constitución Española de 1978, sobre las personas con discapacidad, tiene su redacción vigente por la reforma constitucional de:"
  options:
  - id: a
    text:
      es: "27 de septiembre de 2011."
  - id: b
    text:
      es: "19 de mayo de 2026."
  - id: c
    text:
      es: "27 de agosto de 1992."
  - id: d
    correct: true
    text:
      es: "15 de febrero de 2024."
  explanation:
    es: "El análisis del BOE registra que el artículo 49 se modifica por la reforma de 15 de febrero de 2024. Las otras fechas son reformas constitucionales reales que afectaron a otros artículos: el 135 en 2011, el 69.3 en 2026 y el 13.2 en 1992."
  citation: "fuente: `boe-analisis-ce.xml`"
  difficulty: 1
  tags:
  - "fecha"
# anchor: fuente-boe-ce-1978-original-pdf
- id: m02-l01-q036
  prompt:
    es: "Antes de la reforma de 2024, el artículo 49 de la Constitución Española de 1978 encargaba a los poderes públicos una política de:"
  options:
  - id: a
    correct: true
    text:
      es: "Previsión, tratamiento, rehabilitación e integración de los disminuidos físicos, sensoriales y psíquicos."
  - id: b
    text:
      es: "Prevención, asistencia, promoción y protección de los discapacitados físicos y mentales."
  - id: c
    text:
      es: "Previsión, tratamiento, educación e inserción laboral de los minusválidos físicos y psíquicos."
  - id: d
    text:
      es: "Protección, atención, rehabilitación y autonomía de las personas con deficiencias permanentes."
  explanation:
    es: "La redacción original del artículo 49 hablaba de previsión, tratamiento, rehabilitación e integración de los disminuidos físicos, sensoriales y psíquicos. Las otras formulaciones cambian las acciones o los destinatarios y no corresponden a esa redacción: discapacitados, minusválidos o personas con deficiencias permanentes no son los términos de la Constitución de 1978."
  citation: "fuente: `boe-ce-1978-original.pdf`; artículo 49"
  difficulty: 3
  tags:
  - "concepto"
  - "fecha"
# anchor: boe-a-1978-31229-art-49
- id: m02-l01-q037
  prompt:
    es: "Conforme al artículo 49.1 de la Constitución Española de 1978, las personas con discapacidad ejercen los derechos del título I en condiciones de:"
  options:
  - id: a
    text:
      es: "Igualdad formal y protección preferente."
  - id: b
    text:
      es: "Libertad condicionada y asistencia especializada."
  - id: c
    correct: true
    text:
      es: "Libertad e igualdad reales y efectivas."
  - id: d
    text:
      es: "Igualdad jurídica y participación subsidiaria."
  explanation:
    es: "El artículo 49.1 habla de libertad e igualdad reales y efectivas. Una igualdad solo formal, una libertad condicionada o una igualdad jurídica con participación subsidiaria cambian los términos del texto."
  citation: "art. 49.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-49
- id: m02-l01-q038
  prompt:
    es: "En el mandato constitucional sobre las personas con discapacidad, ¿cómo se regulará la protección especial necesaria para que ejerzan los derechos previstos en el título I?"
  options:
  - id: a
    text:
      es: "Por medio de un real decreto."
  - id: b
    text:
      es: "Por medio de una orden ministerial."
  - id: c
    correct: true
    text:
      es: "Por medio de una ley."
  - id: d
    text:
      es: "Por medio de un reglamento."
  explanation:
    es: "El artículo 49.1 reserva a la ley la protección especial necesaria. Un real decreto, una orden ministerial o un reglamento son normas del Gobierno o de la Administración, que no cumplen esa reserva."
  citation: "art. 49.1 CE"
  difficulty: 2
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-49
- id: m02-l01-q039
  prompt:
    es: "Según la Constitución Española de 1978, los poderes públicos impulsarán políticas que garanticen la plena autonomía personal y la inclusión social de las personas con discapacidad, en:"
  options:
  - id: a
    correct: true
    text:
      es: "Entornos universalmente accesibles."
  - id: b
    text:
      es: "Entornos adaptados a cada caso concreto."
  - id: c
    text:
      es: "Entornos especialmente protegidos."
  - id: d
    text:
      es: "Entornos plenamente integrados en la comunidad."
  explanation:
    es: "El artículo 49.2 exige entornos universalmente accesibles. Los entornos adaptados a cada caso, los especialmente protegidos o los integrados en la comunidad no son la expresión del texto."
  citation: "art. 49.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-49
- id: m02-l01-q040
  prompt:
    es: "En las políticas de inclusión de las personas con discapacidad que impulsan los poderes públicos, ¿qué han de fomentar estos respecto de las organizaciones de esas personas?"
  options:
  - id: a
    text:
      es: "Su financiación, en los términos que fije el Gobierno."
  - id: b
    text:
      es: "Su representación obligatoria en las Cortes Generales."
  - id: c
    text:
      es: "Su tutela, en los términos que establezcan los reglamentos."
  - id: d
    correct: true
    text:
      es: "Su participación, en los términos que la ley establezca."
  explanation:
    es: "El artículo 49.2 dice que los poderes públicos fomentarán la participación de sus organizaciones, en los términos que la ley establezca. La financiación, la representación obligatoria en las Cortes y la tutela por reglamento no aparecen en el precepto."
  citation: "art. 49.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-4
- id: m02-l01-q042
  prompt:
    es: "Según el Real Decreto Legislativo 1/2013, de 29 de noviembre, por el que se aprueba el Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, son personas con discapacidad las que presentan deficiencias previsiblemente permanentes que, al interactuar con diversas barreras, puedan impedir:"
  options:
  - id: a
    text:
      es: "Su acceso al empleo público, en igualdad de condiciones con los demás."
  - id: b
    text:
      es: "Su capacidad de obrar plena, en igualdad de condiciones con los demás."
  - id: c
    text:
      es: "Su participación en la vida política, en igualdad de condiciones con los demás."
  - id: d
    correct: true
    text:
      es: "Su participación plena y efectiva en la sociedad, en igualdad de condiciones con los demás."
  explanation:
    es: "El artículo 4.1 habla de impedir la participación plena y efectiva en la sociedad. El acceso al empleo público, la capacidad de obrar y la vida política son ámbitos concretos que el texto no usa para la definición."
  citation: "art. 4.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-4
- id: m02-l01-q043
  prompt:
    es: "Según el Real Decreto Legislativo 1/2013, de 29 de noviembre, por el que se aprueba el Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, las deficiencias que presentan las personas con discapacidad son:"
  options:
  - id: a
    text:
      es: "Físicas, psíquicas, orgánicas o sociales."
  - id: b
    correct: true
    text:
      es: "Físicas, mentales, intelectuales o sensoriales."
  - id: c
    text:
      es: "Motoras, mentales, cognitivas o auditivas."
  - id: d
    text:
      es: "Físicas, intelectuales, sensoriales o económicas."
  explanation:
    es: "El artículo 4.1 enumera deficiencias físicas, mentales, intelectuales o sensoriales, previsiblemente permanentes. Las demás listas sustituyen alguna categoría por otra que el artículo no menciona: psíquicas, orgánicas, sociales, motoras, cognitivas, auditivas o económicas."
  citation: "art. 4.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-4
- id: m02-l01-q044
  prompt:
    es: "Según el Real Decreto Legislativo 1/2013, de 29 de noviembre, tienen también la consideración de personas con discapacidad aquellas a quienes se haya reconocido un grado de discapacidad igual o superior al:"
  options:
  - id: a
    correct: true
    text:
      es: "33 por ciento."
  - id: b
    text:
      es: "25 por ciento."
  - id: c
    text:
      es: "50 por ciento."
  - id: d
    text:
      es: "66 por ciento."
  explanation:
    es: "El artículo 4.2 fija el 33 por ciento como grado mínimo reconocido. El 25 por ciento queda por debajo, y el 50 y el 66 por ciento son umbrales superiores que no figuran en el apartado."
  citation: "art. 4.2 RDL 1/2013"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2013-12632-art-2
- id: m02-l01-q046
  prompt:
    es: "Según el Real Decreto Legislativo 1/2013, de 29 de noviembre, la inclusión asegura, desde la valoración positiva de la diversidad humana, la presencia, participación y progreso plenos de todas las personas en:"
  options:
  - id: a
    text:
      es: "Los ámbitos laboral y educativo."
  - id: b
    text:
      es: "Los servicios públicos de la Administración."
  - id: c
    text:
      es: "Los entornos urbanos y las edificaciones."
  - id: d
    correct: true
    text:
      es: "Las diferentes esferas de la vida."
  explanation:
    es: "La definición del artículo 2.j) habla de las diferentes esferas de la vida. El ámbito laboral y educativo, los servicios públicos o los entornos urbanos son ámbitos concretos que restringen la definición."
  citation: "art. 2.j) RDL 1/2013"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-2
- id: m02-l01-q047
  prompt:
    es: "Según el Real Decreto Legislativo 1/2013, de 29 de noviembre, por el que se aprueba el Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, la inclusión es un proceso o estado:"
  options:
  - id: a
    correct: true
    text:
      es: "De carácter irrenunciable."
  - id: b
    text:
      es: "De carácter voluntario."
  - id: c
    text:
      es: "De carácter transitorio."
  - id: d
    text:
      es: "De carácter subsidiario."
  explanation:
    es: "El artículo 2.j) define la inclusión como proceso o estado irrenunciable. Voluntario, transitorio y subsidiario son calificativos que el texto no usa y que contradicen su carácter irrenunciable."
  citation: "art. 2.j) RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-2
- id: m02-l01-q048
  prompt:
    es: "Según el Real Decreto Legislativo 1/2013, de 29 de noviembre, la accesibilidad universal es la condición que deben cumplir los entornos, procesos, bienes, productos y servicios para ser comprensibles, utilizables y practicables por todas las personas, en condiciones de seguridad y comodidad y de la forma:"
  options:
  - id: a
    text:
      es: "Más asistida y segura posible."
  - id: b
    text:
      es: "Más gratuita y uniforme posible."
  - id: c
    correct: true
    text:
      es: "Más autónoma y natural posible."
  - id: d
    text:
      es: "Más rápida y eficiente posible."
  explanation:
    es: "El artículo 2.k) termina con la forma más autónoma y natural posible. Asistida, gratuita y uniforme, o rápida y eficiente, son adjetivos que el texto no usa y que no definen la accesibilidad universal."
  citation: "art. 2.k) RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-2
- id: m02-l01-q049
  prompt:
    es: "Según el Real Decreto Legislativo 1/2013, de 29 de noviembre, el diseño universal o diseño para todas las personas concibe entornos, productos y servicios que puedan ser utilizados por todas las personas, en la mayor extensión posible, sin necesidad de:"
  options:
  - id: a
    text:
      es: "Adaptación, pero sí con diseño especializado."
  - id: b
    correct: true
    text:
      es: "Adaptación ni diseño especializado."
  - id: c
    text:
      es: "Diseño especializado, pero sí con adaptación posterior."
  - id: d
    text:
      es: "Autorización ni evaluación técnica previas."
  explanation:
    es: "El artículo 2.l) excluye tanto la adaptación como el diseño especializado. Admitir uno de los dos contradice «ni»; la autorización o evaluación técnica previas son requisitos que el artículo no menciona."
  citation: "art. 2.l) RDL 1/2013"
  difficulty: 3
  tags:
  - "concepto"
