- id: m01-l09-q139
  prompt:
    es: "Según la Constitución Española de 1978, las materias no atribuidas expresamente al Estado por ella podrán corresponder a las Comunidades Autónomas, en virtud de:"
  options:
  - id: a
    correct: true
    text:
      es: "Sus respectivos Estatutos."
  - id: b
    text:
      es: "Las leyes marco que dicten las Cortes Generales."
  - id: c
    text:
      es: "Las leyes de armonización que dicte el Estado."
  - id: d
    text:
      es: "La delegación del Gobierno de la Nación mediante Real Decreto."
  explanation:
    es: "Las materias no atribuidas expresamente al Estado pueden corresponder a las Comunidades en virtud de sus Estatutos, según el artículo 149.3. Las leyes marco permiten dictar normas legislativas en materias estatales y las de armonización limitan a las Comunidades, no les atribuyen materias. La delegación por Real Decreto no es la vía que el artículo señala."
