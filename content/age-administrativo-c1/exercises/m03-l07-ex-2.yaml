- id: m03-l07-q047
  prompt:
    es: "¿Desde cuándo tiene efectos constitutivos la resolución que acuerda la rectificación de la mención registral del sexo de una persona?"
  options:
  - id: a
    correct: true
    text:
      es: "A partir de su inscripción en el Registro Civil"
  - id: b
    text:
      es: "Desde la fecha de presentación de la solicitud"
  - id: c
    text:
      es: "Desde la fecha en que se dicta la resolución"
  - id: d
    text:
      es: "Seis meses después de su inscripción en el Registro"
  explanation:
    es: "El artículo 46.1 de la Ley 4/2023 dice que la resolución «tendrá efectos constitutivos a partir de su inscripción en el Registro Civil». No los tiene desde la solicitud ni desde que se dicta. Los seis meses desde la inscripción son el plazo para poder recuperar la mención anterior (art. 47), no el momento de los efectos."
  citation: "art. 46.1 Ley 4/2023"
  difficulty: 2
  tags:
