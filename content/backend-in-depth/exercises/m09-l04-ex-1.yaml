- id: m09-l04-q21
  prompt:
    en: An application pages through Elasticsearch results with `search_after`, sorts on a field that is not unique,
      and uses no point in time. What can happen to its paged results?
  options:
  - id: a
    text:
      en: Elasticsearch adds an implicit `_shard_doc` tiebreaker, so the pages stay complete
  - id: b
    text:
      en: The request is rejected, because `search_after` always requires a point in time
  - id: c
    correct: true
    text:
      en: They could miss or duplicate hits, so the sort should include a tiebreaker field
  - id: d
    text:
      en: Only the first page is returned, because `search_after` runs a single request
  explanation:
    en: If you don’t include a tiebreaker field, your paged results could miss or duplicate hits. The implicit `_shard_doc`
      tiebreaker is wrong because it is added only to PIT search requests. Rejection without a point in time is
      wrong because, if you cannot use a PIT, the documentation recommends a tiebreaker field in your sort. A single
      request is wrong because `search_after` requires multiple search requests with the same query and sort values.
  citation: es-paginate-search-results#search-after
- id: m09-l04-q22
  prompt:
    en: In Elasticsearch full-text search, an inverted index is made up of two key components. What does its dictionary
      contain?
  options:
  - id: a
    text:
      en: For each term, a list of document IDs where the term appears
  - id: b
    text:
      en: The relevance score of each document for the query
  - id: c
    correct: true
    text:
      en: A sorted list of all unique terms in the collection of documents in the index
  - id: d
    text:
      en: The analyzers that transform the text before it is indexed
  explanation:
    en: The dictionary is a sorted list of all unique terms in the collection of documents in the index. The list
      of document IDs for each term is wrong because that is the posting list. The relevance score of each document
      is wrong because it is the `_score` produced by relevance scoring, a separate step. The analyzers are wrong
      because the dictionary is a sorted list of terms, and the text analysis happens before the inverted index
      is built.
  citation: es-how-full-text-works#elastic-docs-v3
