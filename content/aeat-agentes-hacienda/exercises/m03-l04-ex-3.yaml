# anchor: boe-a-2003-23186-art-48
- id: m03-l04-q0339
  prompt:
    es: "Textiles Navarro, S.L. tiene su domicilio social en Soria, pero no puede determinarse el lugar donde lleva a cabo la gestión administrativa y la dirección de sus negocios. Su inmovilizado vale 0,4 millones de euros en Soria, 2,5 en Zamora y 3,1 en León, y obtiene en Zamora la mayor parte de sus ingresos. Según el artículo 48.2.b) de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál es su domicilio fiscal?"
  options:
  - id: a
    text:
      es: "Soria, por ser su domicilio social."
  - id: b
    correct: true
    text:
      es: "León, donde radica el mayor valor del inmovilizado."
  - id: c
    text:
      es: "Zamora, por ser donde obtiene la mayor parte de sus ingresos."
  - id: d
    text:
      es: "El lugar que determine la Administración tributaria según su criterio."
  explanation:
    es: "Para las personas jurídicas, el artículo 48.2.b) atiende primero al domicilio social si allí está centralizada la gestión y, si no, al lugar donde se lleva a cabo la gestión o dirección. Cuando no puede determinarse con esos criterios, prevalece el lugar de mayor valor del inmovilizado, que es León. El domicilio social no basta sin gestión centralizada, el origen de los ingresos no es criterio y la Administración no elige libremente."
  citation: "art. 48.2 LGT"
  difficulty: 3
  tags:
  - "condición"
# anchor: boe-a-2003-23186-art-48
- id: m03-l04-q0342
  prompt:
    es: "De acuerdo con el artículo 48.2.d) de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando la persona o entidad no residente en España opere mediante establecimiento permanente, su domicilio fiscal es el que resulte de aplicar a dicho establecimiento:"
  options:
  - id: a
    text:
      es: "la normativa reguladora de cada tributo, sin más reglas."
  - id: b
    correct: true
    text:
      es: "las reglas establecidas para las personas físicas y para las personas jurídicas."
  - id: c
    text:
      es: "la regla del domicilio del representante designado conforme al artículo 47."
  - id: d
    text:
      es: "la regla del lugar donde la entidad tenga su sede de dirección en el extranjero."
  explanation:
    es: "Con establecimiento permanente, el artículo 48.2.d) aplica a ese establecimiento las reglas de las personas físicas y de las personas jurídicas. La normativa de cada tributo y el domicilio del representante son las reglas para el no residente que no opera con establecimiento permanente. La sede en el extranjero no es criterio del precepto."
  citation: "art. 48.2 LGT"
  difficulty: 2
  tags:
  - "sujeto"
  - "condición"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0001
  prompt:
    es: "De acuerdo con el artículo 68.8 de la Ley 58/2003, de 17 de diciembre, General Tributaria, interrumpido el plazo de prescripción para un obligado tributario, ese efecto:"
  options:
  - id: a
    correct: true
    text:
      es: "se extiende a todos los demás obligados, incluidos los responsables."
  - id: b
    text:
      es: "se limita a ese obligado y no alcanza a los responsables."
  - id: c
    text:
      es: "se extiende a los demás obligados, salvo a los responsables subsidiarios."
  - id: d
    text:
      es: "se extiende a los demás obligados solo si la Administración se lo notifica a cada uno."
  explanation:
    es: "El artículo 68.8 dice que la interrupción para un obligado se extiende a todos los demás, responsables incluidos. Limitarla al obligado al que se dirige la actuación contradice la regla. Tampoco hay excepción para los responsables subsidiarios, que están comprendidos entre «los responsables». Y la ley no exige notificar la interrupción a cada obligado para que surta efecto frente a él."
  citation: "art. 68.8 LGT"
  difficulty: 1
  tags:
  - "efecto"
  - "sujeto"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0003
  prompt:
    es: "Según el artículo 68.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si el plazo de prescripción se interrumpió por la declaración de concurso del deudor, ¿cuándo se inicia de nuevo el cómputo?"
  options:
  - id: a
    text:
      es: "Cuando la Administración tributaria reciba la notificación del auto de declaración del concurso."
  - id: b
    text:
      es: "Cuando se publique la declaración de concurso en el «Boletín Oficial del Estado»."
  - id: c
    correct: true
    text:
      es: "Cuando adquiera firmeza la resolución judicial de conclusión del concurso."
  - id: d
    text:
      es: "Cuando la administración concursal presente el informe sobre la masa activa y pasiva."
  explanation:
    es: "La regla especial del artículo 68.7 para el concurso fija el reinicio en la firmeza de la resolución judicial de conclusión del concurso, no en su declaración. La notificación del auto o la publicación de la declaración son hechos del inicio del concurso, que es lo que interrumpe. El informe de la administración concursal no figura entre los hitos que reabren el cómputo."
  citation: "art. 68.7 LGT"
  difficulty: 2
  tags:
  - "fecha"
  - "efecto"
# anchor: boe-a-2003-23186-art-67
- id: m03-l04-q0006
  prompt:
    es: "Una sentencia que declara improcedente la liquidación de un impuesto abonado por Iván Salcedo adquiere firmeza el 10 de enero de 2024. Iván quiere pedir la devolución del ingreso indebido. Conforme a la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿desde qué día comienza a contarse su plazo de prescripción?"
  options:
  - id: a
    text:
      es: "Desde el 10 de enero de 2024."
  - id: b
    text:
      es: "Desde el 1 de enero de 2024."
  - id: c
    correct: true
    text:
      es: "Desde el 11 de enero de 2024."
  - id: d
    text:
      es: "Desde el 1 de enero de 2025."
  explanation:
    es: "Para el derecho a solicitar devoluciones (art. 66.c), si el ingreso indebido deriva de una sentencia que declara improcedente el acto, el plazo se cuenta desde el día siguiente a aquel en que adquiera firmeza (art. 67.1). Firme el 10 de enero, empieza el 11. Contarlo desde la propia fecha de firmeza no respeta el «día siguiente», y ni el inicio del año de la sentencia ni el del año siguiente son fechas que marque la norma."
  citation: "art. 67.1 LGT"
  difficulty: 3
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-2003-23186-art-69
- id: m03-l04-q0012
  prompt:
    es: "De acuerdo con el artículo 69.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la prescripción ganada, una vez producida, respecto de la deuda tributaria:"
  options:
  - id: a
    text:
      es: "suspende su exigibilidad hasta que se practique una nueva liquidación."
  - id: b
    correct: true
    text:
      es: "la extingue."
  - id: c
    text:
      es: "reduce la deuda tributaria al importe de la cuota, sin recargos ni intereses."
  - id: d
    text:
      es: "convierte la deuda tributaria en una obligación natural no exigible."
  explanation:
    es: "El artículo 69.3 es una frase corta: la prescripción ganada extingue la deuda tributaria. No la suspende hasta una liquidación posterior, no la reduce a la cuota sin accesorios, y la ley no la mantiene como obligación natural sin exigibilidad; la deuda deja de existir."
  citation: "art. 69.3 LGT"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0013
  prompt:
    es: "De acuerdo con el artículo 68.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, cuando el plazo se hubiera interrumpido por la interposición del recurso ante la jurisdicción contencioso-administrativa, el cómputo se inicia de nuevo cuando la Administración tributaria reciba la notificación:"
  options:
  - id: a
    text:
      es: "de la admisión a trámite del recurso por el órgano jurisdiccional."
  - id: b
    text:
      es: "de la resolución del Tribunal Económico-Administrativo que se impugnó."
  - id: c
    text:
      es: "de la sentencia dictada en primera instancia, aunque no sea firme."
  - id: d
    correct: true
    text:
      es: "de la resolución firme que ponga fin al proceso judicial o que levante la paralización."
  explanation:
    es: "Con recurso contencioso-administrativo el artículo 68.7 reinicia el cómputo cuando la Administración recibe la notificación de la resolución firme que pone fin al proceso o que levanta la paralización. La admisión a trámite es el principio del proceso, y la resolución económico-administrativa es previa al recurso. Una sentencia no firme no pone fin al proceso judicial."
  citation: "art. 68.7 LGT"
  difficulty: 2
  tags:
  - "fecha"
  - "efecto"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0014
  prompt:
    es: "De acuerdo con el artículo 68.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el reinicio del cómputo tras aprobarse un convenio concursal:"
  options:
  - id: a
    correct: true
    text:
      es: "Para las deudas no sometidas al convenio, el plazo se inicia de nuevo en el momento de su aprobación."
  - id: b
    text:
      es: "Para las deudas no sometidas al convenio, el plazo se inicia de nuevo cuando se declare cumplido el convenio."
  - id: c
    text:
      es: "Para las deudas sometidas al convenio, el plazo se inicia de nuevo en el momento de su aprobación, aunque no sean exigibles."
  - id: d
    text:
      es: "Para todas las deudas, el plazo se inicia de nuevo cuando adquiera firmeza la resolución de conclusión del concurso."
  explanation:
    es: "El artículo 68.7 distingue: si se aprobó un convenio, el plazo reinicia en su aprobación para las deudas no sometidas a él, y para las sometidas cuando resulten exigibles al deudor. El cumplimiento del convenio no es hito de la norma, y para las deudas sometidas no basta la aprobación sino su exigibilidad. La firmeza de la conclusión del concurso es la regla de cuando no hay convenio."
  citation: "art. 68.7 LGT"
  difficulty: 3
  tags:
  - "fecha"
  - "efecto"
# anchor: boe-a-2003-23186-art-67
- id: m03-l04-q0044
  prompt:
    es: "El impuesto sobre bienes inmuebles de 2023 que debe pagar Rosa Cuesta se liquida por recibo, sin que ella presente declaración ni autoliquidación. El tributo se devengó el 1 de enero de 2023. Según la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿desde qué día comienza a contarse el plazo de prescripción del derecho de la Administración a determinar la deuda?"
  options:
  - id: a
    text:
      es: "Desde el 2 de enero de 2023, el día siguiente al devengo."
  - id: b
    text:
      es: "Desde el día siguiente a aquel en que finalice el plazo reglamentario para presentar la declaración."
  - id: c
    correct: true
    text:
      es: "Desde el 1 de enero de 2023, el día del devengo."
  - id: d
    text:
      es: "Desde el día siguiente a aquel en que finalice el plazo de pago en período voluntario."
  explanation:
    es: "En los tributos de cobro periódico por recibo en que no hace falta declaración ni autoliquidación para liquidar, el plazo del artículo 66.a) comienza el día del devengo (art. 67.1), no al día siguiente. No hay plazo de presentación que sirva de referencia, y el fin del período de pago voluntario es el origen del plazo para exigir el pago."
  citation: "art. 67.1 LGT"
  difficulty: 3
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0046
  prompt:
    es: "¿Cuál de las siguientes actuaciones interrumpe, según el artículo 68.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo de prescripción del derecho a determinar la deuda tributaria mediante liquidación?"
  options:
  - id: a
    text:
      es: "Cualquier actuación fehaciente del obligado tributario conducente al pago o extinción de la deuda tributaria."
  - id: b
    correct: true
    text:
      es: "Cualquier actuación fehaciente del obligado tributario conducente a la liquidación o autoliquidación de la deuda tributaria."
  - id: c
    text:
      es: "Cualquier acción de la Administración dirigida de forma efectiva a la recaudación de la deuda tributaria."
  - id: d
    text:
      es: "La declaración del concurso del deudor."
  explanation:
    es: "El artículo 68.1.c) interrumpe el plazo de liquidar con la actuación fehaciente del obligado conducente a la liquidación o autoliquidación. La actuación conducente al pago o extinción, la acción dirigida a recaudar y la declaración de concurso interrumpen el plazo del derecho a exigir el pago (art. 68.2)."
  citation: "art. 68.1 LGT"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0047
  prompt:
    es: "De acuerdo con el artículo 68.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la acción de la Administración que interrumpe el plazo para determinar la deuda:"
  options:
  - id: a
    text:
      es: "Interrumpe el plazo aunque se realice sin conocimiento formal del obligado, si es conducente a la liquidación."
  - id: b
    text:
      es: "Interrumpe el plazo solo si se dirige a la misma obligación tributaria que se pretende liquidar."
  - id: c
    correct: true
    text:
      es: "Debe realizarse con conocimiento formal del obligado tributario y puede dirigirse inicialmente a otra obligación por una incorrecta declaración."
  - id: d
    text:
      es: "Interrumpe el plazo únicamente si consiste en la notificación de un acuerdo de inicio de actuaciones inspectoras."
  explanation:
    es: "El artículo 68.1.a) exige una acción de la Administración con conocimiento formal del obligado, conducente a la regularización, comprobación, inspección, aseguramiento o liquidación, aunque se dirija inicialmente a una obligación distinta por la incorrecta declaración del obligado. Sin conocimiento formal no interrumpe, y la norma no limita el efecto a la misma obligación ni a las actuaciones inspectoras."
  citation: "art. 68.1 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "efecto"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0048
  prompt:
    es: "¿Cuál de las siguientes circunstancias interrumpe, según el artículo 68.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo de prescripción del derecho de la Administración para exigir el pago de las deudas liquidadas?"
  options:
  - id: a
    text:
      es: "La remisión del tanto de culpa a la jurisdicción penal."
  - id: b
    text:
      es: "La presentación de denuncia ante el Ministerio Fiscal."
  - id: c
    text:
      es: "Cualquier actuación fehaciente del obligado conducente a la liquidación de la deuda."
  - id: d
    correct: true
    text:
      es: "La declaración del concurso del deudor."
  explanation:
    es: "Para el plazo del derecho a exigir el pago, el artículo 68.2.b) incluye la declaración del concurso del deudor y el ejercicio de acciones civiles o penales dirigidas al cobro. El tanto de culpa y la denuncia ante el Ministerio Fiscal figuran entre las causas que interrumpen el plazo para liquidar (art. 68.1.b), como la actuación del obligado conducente a la liquidación (art. 68.1.c)."
  citation: "art. 68.2 LGT"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0050
  prompt:
    es: "De acuerdo con el artículo 68.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las actuaciones que interrumpen el plazo de prescripción y las de naturaleza análoga producen efectos interruptivos cuando se realicen:"
  options:
  - id: a
    text:
      es: "en otro Estado, aunque no se enmarquen en la asistencia mutua."
  - id: b
    text:
      es: "en cualquier comunidad autónoma, sin necesidad de notificarlas al obligado."
  - id: c
    correct: true
    text:
      es: "en otro Estado en el marco de la asistencia mutua."
  - id: d
    text:
      es: "en otro Estado, solo si ha ratificado un convenio de doble imposición con España."
  explanation:
    es: "El artículo 68.5 da efecto interruptivo a las actuaciones realizadas en otro Estado, pero solo en el marco de la asistencia mutua. No basta que se hagan fuera, ni la norma habla de comunidades autónomas ni condiciona el efecto a un convenio de doble imposición."
  citation: "art. 68.5 LGT"
  difficulty: 1
  tags:
  - "condición"
  - "efecto"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0051
  prompt:
    es: "Nuria Peña presentó su autoliquidación del impuesto el 1 de julio de 2022 y el plazo para determinar la deuda empezó a contarse el 2 de julio de 2022. El 12 de mayo de 2024 la Administración le notificó el inicio de una comprobación que no caducó, sin recurso judicial ni concurso. Según la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuándo vence, como pronto, el nuevo plazo de prescripción?"
  options:
  - id: a
    text:
      es: "El 2 de julio de 2026."
  - id: b
    text:
      es: "El 12 de mayo de 2026."
  - id: c
    text:
      es: "El 12 de mayo de 2029."
  - id: d
    correct: true
    text:
      es: "El 12 de mayo de 2028."
  explanation:
    es: "Interrumpido el plazo del artículo 66.a), se inicia de nuevo el cómputo de cuatro años (art. 68.6); sin recurso judicial ni concurso no se aplica el apartado 7. Desde el 12 de mayo de 2024 el plazo vence el 12 de mayo de 2028. El 2 de julio de 2026 sería el vencimiento sin interrupción, el 12 de mayo de 2026 supone dos años, y el 12 de mayo de 2029 suma cinco."
  citation: "art. 68.6 LGT"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0052
  prompt:
    es: "De acuerdo con el artículo 68.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre el reinicio del cómputo tras una interrupción por causas judiciales:"
  options:
  - id: a
    correct: true
    text:
      es: "No se aplica al plazo para exigir el pago cuando no se hubiera acordado la suspensión en vía contencioso-administrativa."
  - id: b
    text:
      es: "Se aplica siempre al plazo para exigir el pago, haya o no suspensión en vía contencioso-administrativa."
  - id: c
    text:
      es: "No se aplica nunca al plazo del derecho a determinar la deuda mediante liquidación."
  - id: d
    text:
      es: "Se aplica solo cuando el recurso se interpone ante el Tribunal Económico-Administrativo."
  explanation:
    es: "El último párrafo del artículo 68.7 excluye el reinicio especial del apartado 7 para el plazo de exigir el pago si no se acordó la suspensión en vía contencioso-administrativa. Que se aplique siempre contradice esa excepción, y el apartado sí rige para el plazo de liquidar. Tampoco depende de que el recurso sea económico-administrativo."
  citation: "art. 68.7 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "efecto"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0053
  prompt:
    es: "De acuerdo con el artículo 68.8 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si la obligación es mancomunada y solo se reclama a uno de los obligados tributarios la parte que le corresponde, el plazo de prescripción:"
  options:
  - id: a
    text:
      es: "se interrumpe también para los demás obligados."
  - id: b
    correct: true
    text:
      es: "no se interrumpe para los demás obligados."
  - id: c
    text:
      es: "se interrumpe para los demás obligados, salvo para los responsables."
  - id: d
    text:
      es: "se suspende para los demás obligados hasta que se resuelva la reclamación."
  explanation:
    es: "En la obligación mancomunada, reclamar a uno solo su parte no interrumpe el plazo para los demás (art. 68.8). Es la excepción a la regla general de que la interrupción alcanza a todos los obligados, incluidos los responsables. La suspensión del plazo del artículo 66.b) es otra figura, vinculada a litigio, concurso u otras causas legales."
  citation: "art. 68.8 LGT"
  difficulty: 1
  tags:
  - "efecto"
  - "condición"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0055
  prompt:
    es: "¿Cuál de las siguientes definiciones de obligaciones tributarias conexas es CORRECTA según el artículo 68.9 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Aquellas en las que alguno de sus elementos resulten afectados o se determinen en función de los correspondientes a otra obligación o período distinto."
  - id: b
    text:
      es: "Aquellas que se refieren al mismo período impositivo y a la misma obligación tributaria de distintos obligados."
  - id: c
    text:
      es: "Aquellas que derivan de un mismo procedimiento de comprobación, aunque sus elementos sean independientes."
  - id: d
    text:
      es: "Aquellas cuyo hecho imponible se realiza en el mismo ejercicio por el mismo obligado tributario."
  explanation:
    es: "El artículo 68.9 define las obligaciones conexas como las que tienen algún elemento afectado, o determinado en función de otra obligación o período distinto. Compartir período o ejercicio, o derivar del mismo procedimiento con elementos independientes, no crea la dependencia de elementos que exige la norma."
  citation: "art. 68.9 LGT"
  difficulty: 2
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-66-bis
- id: m03-l04-q0114
  prompt:
    es: "De acuerdo con el artículo 66 bis.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la prescripción del artículo 66 no afecta al derecho de la Administración para realizar comprobaciones e investigaciones conforme al artículo 115, salvo lo dispuesto en:"
  options:
  - id: a
    correct: true
    text:
      es: "la regla de los diez años para comprobar bases, cuotas o deducciones pendientes."
  - id: b
    text:
      es: "la regla de los cuatro años para exigir el pago de las deudas liquidadas."
  - id: c
    text:
      es: "la regla de efectos de la interrupción sobre las deudas liquidadas del obligado."
  - id: d
    text:
      es: "la regla de conservación de obligaciones formales vinculadas a otras deudas."
  explanation:
    es: "El artículo 66 bis.1 separa la prescripción del artículo 66 de las comprobaciones e investigaciones del artículo 115, y deja a salvo el apartado 2 del propio artículo 66 bis, que fija los diez años para comprobar bases, cuotas o deducciones pendientes de compensación o aplicación. Los cuatro años de exigir el pago son el plazo general del artículo 66, y los efectos de la interrupción y la conservación de obligaciones formales son materias de los artículos 68 y 70, sin relación con esta salvedad. En el examen 2024 (pregunta 43) la plantilla oficial dio otra respuesta; esta pregunta sigue el texto del artículo."
  citation: "art. 66 bis.1 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "efecto"
# anchor: boe-a-2003-23186-art-67
- id: m03-l04-q0116
  prompt:
    es: "De acuerdo con el artículo 67.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en el supuesto de tributos que graven una misma operación y sean incompatibles entre sí, el plazo para solicitar la devolución del ingreso indebido del tributo improcedente comienza a contarse desde:"
  options:
  - id: a
    text:
      es: "el día siguiente a aquel en que se realizó el ingreso del tributo improcedente."
  - id: b
    text:
      es: "la fecha en que la Administración tributaria notifique la liquidación del tributo improcedente."
  - id: c
    correct: true
    text:
      es: "la resolución del órgano específicamente previsto para dirimir cuál es el tributo procedente."
  - id: d
    text:
      es: "el día siguiente a la finalización del plazo de presentación de la autoliquidación del tributo procedente."
  explanation:
    es: "Cuando dos tributos incompatibles gravan la misma operación, el artículo 67.1 cuenta el plazo desde la resolución del órgano específicamente previsto para dirimir cuál es el procedente. No parte del ingreso ni de la notificación de una liquidación, ni de la autoliquidación del tributo procedente."
  citation: "art. 67.1 LGT"
  difficulty: 2
  tags:
  - "fecha"
# anchor: boe-a-2003-23186-art-67
- id: m03-l04-q0117
  prompt:
    es: "De acuerdo con el artículo 67.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, si los hechos que constituyen el presupuesto de la responsabilidad solidaria se producen con posterioridad al plazo de pago en período voluntario del deudor principal, el plazo de prescripción se inicia:"
  options:
  - id: a
    text:
      es: "desde el día siguiente a la finalización del plazo de pago en período voluntario del deudor principal."
  - id: b
    text:
      es: "desde la notificación de la declaración de responsabilidad al responsable solidario."
  - id: c
    text:
      es: "desde la notificación de la última actuación recaudatoria al deudor principal."
  - id: d
    correct: true
    text:
      es: "a partir del momento en que tales hechos hubieran tenido lugar."
  explanation:
    es: "El artículo 67.2 contiene una excepción: si los hechos que fundan la responsabilidad solidaria son posteriores al plazo voluntario del deudor principal, el plazo empieza cuando ocurran. La regla general es el día siguiente al fin de ese plazo. La notificación de la declaración de responsabilidad no marca el inicio, y la última actuación recaudatoria es la regla de los subsidiarios."
  citation: "art. 67.2 LGT"
  difficulty: 3
  tags:
  - "fecha"
  - "condición"
# anchor: boe-a-2003-23186-art-67
- id: m03-l04-q0118
  prompt:
    es: "De acuerdo con el artículo 67.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo de prescripción del derecho a solicitar una devolución derivada de la normativa de un tributo, si las normas del tributo no fijan plazo para solicitarla, comienza a contarse:"
  options:
  - id: a
    text:
      es: "desde el día siguiente a aquel en que se devengó el tributo."
  - id: b
    correct: true
    text:
      es: "desde el día siguiente a aquel en que dicha devolución pudo solicitarse."
  - id: c
    text:
      es: "desde el día siguiente a aquel en que finalice el plazo de pago en período voluntario."
  - id: d
    text:
      es: "desde el día siguiente a aquel en que la Administración reconozca el derecho a la devolución."
  explanation:
    es: "El artículo 67.1.c) cuenta el plazo desde el día siguiente al fin del plazo para solicitar la devolución o, en defecto de plazo, desde el día siguiente a aquel en que pudo solicitarse. El devengo y el fin del período de pago voluntario no son hitos de ese derecho. El reconocimiento por la Administración es el inicio del derecho a obtener la devolución (art. 67.1.d)."
  citation: "art. 67.1 LGT"
  difficulty: 2
  tags:
  - "fecha"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0120
  prompt:
    es: "De acuerdo con el artículo 68.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo de prescripción del derecho de la Administración para exigir el pago de las deudas se interrumpe por cualquier acción de la Administración tributaria, realizada con conocimiento formal del obligado, dirigida:"
  options:
  - id: a
    text:
      es: "a la comprobación de los elementos de la obligación tributaria."
  - id: b
    text:
      es: "a la liquidación de todos o parte de los elementos de la obligación."
  - id: c
    text:
      es: "al reconocimiento de la devolución derivada de la normativa del tributo."
  - id: d
    correct: true
    text:
      es: "de forma efectiva a la recaudación de la deuda tributaria."
  explanation:
    es: "El artículo 68.2.a) interrumpe el plazo de pago con la acción de la Administración dirigida de forma efectiva a la recaudación. La comprobación y la liquidación interrumpen el plazo de determinar la deuda (art. 68.1.a), y la dirigida a la devolución el plazo de obtenerla (art. 68.4)."
  citation: "art. 68.2 LGT"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-68
- id: m03-l04-q0121
  prompt:
    es: "De acuerdo con el artículo 68.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el plazo de prescripción del derecho a solicitar devoluciones se interrumpe por cualquier actuación fehaciente del obligado tributario que pretenda:"
  options:
  - id: a
    correct: true
    text:
      es: "la devolución, el reembolso o la rectificación de su autoliquidación."
  - id: b
    text:
      es: "el pago o la extinción de la deuda tributaria."
  - id: c
    text:
      es: "la liquidación o autoliquidación de la deuda tributaria."
  - id: d
    text:
      es: "el fraccionamiento o aplazamiento del pago de la deuda ante la Administración tributaria."
  explanation:
    es: "El artículo 68.3 interrumpe el derecho a solicitar devoluciones con la actuación fehaciente del obligado que pretenda la devolución, el reembolso o la rectificación de su autoliquidación. Pagar o extinguir interrumpe el plazo de exigir el pago (art. 68.2.c), la actuación conducente a liquidar el de determinar la deuda (art. 68.1.c), y el aplazamiento no está en el precepto."
  citation: "art. 68.3 LGT"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2003-23186-art-70
- id: m03-l04-q0124
  prompt:
    es: "De acuerdo con el artículo 70.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las obligaciones de conservación y suministro de información de las letras d), e) y f) del artículo 29.2, respecto de otras personas o entidades, se cumplen en el plazo mercantil o en el de exigencia de las propias obligaciones formales:"
  options:
  - id: a
    correct: true
    text:
      es: "si este último fuese superior."
  - id: b
    text:
      es: "si este último fuese inferior."
  - id: c
    text:
      es: "en todo caso, con independencia de cuál sea mayor."
  - id: d
    text:
      es: "si lo autoriza el órgano competente de la Administración tributaria."
  explanation:
    es: "El artículo 70.2 aplica el plazo mercantil, o el de exigencia de las propias obligaciones formales del obligado si este último fuera superior. La regla del plazo inferior invierte el criterio, y la norma no deja la elección a un acuerdo del órgano competente."
  citation: "art. 70.2 LGT"
  difficulty: 1
  tags:
  - "plazo"
  - "condición"
# anchor: boe-a-2003-23186-art-70
- id: m03-l04-q0125
  prompt:
    es: "De acuerdo con el artículo 70.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la obligación de justificar la procedencia de los datos que tengan su origen en operaciones realizadas en períodos impositivos prescritos se mantiene durante el plazo de prescripción del derecho para determinar las deudas tributarias afectadas por la operación y, en todo caso:"
  options:
  - id: a
    text:
      es: "durante seis años a partir del último asiento en los libros."
  - id: b
    correct: true
    text:
      es: "en los supuestos del artículo 66 bis, apartados 2 y 3."
  - id: c
    text:
      es: "en los supuestos del artículo 68, apartados 6 y 7."
  - id: d
    text:
      es: "durante cuatro años desde que finalice el período impositivo prescrito."
  explanation:
    es: "El artículo 70.3 mantiene la obligación de justificar durante el plazo de prescripción del derecho a determinar las deudas afectadas y, además, en todo caso en los supuestos del artículo 66 bis, apartados 2 y 3. Los seis años del Código de Comercio, los apartados 6 y 7 del artículo 68 (reinicio del cómputo) y los cuatro años desde el fin del período no son lo que dice el precepto."
  citation: "art. 70.3 LGT"
  difficulty: 3
  tags:
  - "plazo"
  - "requisito"
