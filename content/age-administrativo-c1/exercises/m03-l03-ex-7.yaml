# anchor: boe-a-2015-10565-art-66
- id: m03-l03-q199
  prompt:
    es: "Según el artículo 66.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo debe indicar la solicitud un lugar físico para practicar la notificación?"
  options:
  - id: a
    text:
      es: "Siempre, además del medio electrónico que se identifique."
  - id: b
    correct: true
    text:
      es: "En defecto de la identificación de un medio electrónico."
  - id: c
    text:
      es: "Solo cuando el solicitante sea una persona jurídica."
  - id: d
    text:
      es: "Nunca, porque la solicitud solo puede designar un medio electrónico."
  explanation:
    es: "El artículo 66.1.b) exige identificar «el medio electrónico, o en su defecto, lugar físico en que desea que se practique la notificación». El lugar físico es subsidiario: no se exige siempre junto al medio electrónico, pero tampoco está excluido. La ley no lo reserva a las personas jurídicas."
  citation: "art. 66.1.b) LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-25
- id: m03-l03-q301
  prompt:
    es: "¿En cuál de los siguientes procedimientos produce la caducidad el vencimiento del plazo máximo sin resolución expresa notificada, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "En uno iniciado de oficio del que pudiera derivarse el reconocimiento de derechos."
  - id: b
    text:
      es: "En uno iniciado a solicitud del interesado sin norma que disponga otro sentido del silencio."
  - id: c
    correct: true
    text:
      es: "En uno iniciado de oficio en que la Administración ejerce potestades sancionadoras."
  - id: d
    text:
      es: "En uno de responsabilidad patrimonial iniciado a solicitud del particular."
  explanation:
    es: "El artículo 25.1.b) dice que en los procedimientos en que la Administración ejercite potestades sancionadoras o de intervención con efectos desfavorables «se producirá la caducidad». En los de oficio que pueden reconocer derechos, los comparecidos pueden entender desestimadas sus pretensiones (art. 25.1.a). En los iniciados a solicitud rige el silencio estimatorio salvo norma en contrario (art. 24.1). En la responsabilidad patrimonial el silencio es desestimatorio (arts. 24.1 y 91.3)."
  citation: "art. 25.1.b) LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-82
- id: m03-l03-q302
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué trámite tiene lugar, instruido el procedimiento, inmediatamente antes de redactar la propuesta de resolución?"
  options:
  - id: a
    text:
      es: "El período de información pública del expediente."
  - id: b
    text:
      es: "La apertura del período de prueba ordinario."
  - id: c
    text:
      es: "Las actuaciones complementarias indispensables."
  - id: d
    correct: true
    text:
      es: "El trámite de audiencia a los interesados."
  explanation:
    es: "El artículo 82.1 dice: «Instruidos los procedimientos, e inmediatamente antes de redactar la propuesta de resolución, se pondrán de manifiesto a los interesados»: es el trámite de audiencia. La información pública la acuerda el órgano cuando la naturaleza del procedimiento lo requiere, sin ese lugar fijo. La prueba forma parte de la instrucción. Las actuaciones complementarias se acuerdan «antes de dictar resolución», no antes de la propuesta."
  citation: "art. 82.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-91
- id: m03-l03-q303
  prompt:
    es: "Según el artículo 91.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿desde cuándo se cuentan los seis meses tras los cuales la resolución de responsabilidad patrimonial puede entenderse contraria?"
  options:
  - id: a
    text:
      es: "Desde que se produjo el hecho que motiva la indemnización."
  - id: b
    correct: true
    text:
      es: "Desde que se inició el procedimiento de responsabilidad patrimonial."
  - id: c
    text:
      es: "Desde que se notificó al particular la admisión de su reclamación."
  - id: d
    text:
      es: "Desde que finalizó el trámite de audiencia del procedimiento."
  explanation:
    es: "El artículo 91.3 cuenta los seis meses «desde que se inició el procedimiento». No se cuentan desde el hecho lesivo, ni desde una admisión de la reclamación, ni desde el final de la audiencia."
  citation: "art. 91.3 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2015-10565-art-88
- id: m03-l03-q304
  prompt:
    es: "Según el artículo 88.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué pueden hacer los interesados cuando se les pone de manifiesto una cuestión conexa no planteada?"
  options:
  - id: a
    text:
      es: "Solo formular alegaciones, sin aportar ningún medio de prueba sobre la cuestión."
  - id: b
    text:
      es: "Interponer recurso de alzada contra el acuerdo que les pone de manifiesto la cuestión."
  - id: c
    correct: true
    text:
      es: "Formular las alegaciones que estimen pertinentes y aportar, en su caso, los medios de prueba."
  - id: d
    text:
      es: "Pedir que la cuestión se tramite en otro procedimiento, lo que suspende el plazo para resolver."
  explanation:
    es: "El artículo 88.1 permite al órgano pronunciarse sobre cuestiones conexas no planteadas poniéndolo antes de manifiesto a los interesados, «para que formulen las alegaciones que estimen pertinentes y aporten, en su caso, los medios de prueba». Las alegaciones no excluyen la prueba. La ley no prevé un recurso de alzada contra ese trámite ni una petición de procedimiento separado que suspenda el plazo para resolver."
  citation: "art. 88.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-106
- id: m03-l03-q201
  prompt:
    es: "De acuerdo con el artículo 106.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la declaración de oficio de la nulidad de un acto en los supuestos del artículo 47.1 requiere:"
  options:
  - id: a
    text:
      es: "Dictamen previo del Consejo de Estado u órgano consultivo autonómico equivalente, incluso desfavorable."
  - id: b
    correct: true
    text:
      es: "Dictamen favorable previo del Consejo de Estado u órgano consultivo autonómico equivalente, si lo hubiere."
  - id: c
    text:
      es: "Informe previo de la Abogacía del Estado o del servicio jurídico de la Comunidad Autónoma."
  - id: d
    text:
      es: "Autorización previa del órgano superior jerárquico del que dictó el acto que se revisa."
  explanation:
    es: "El artículo 106.1 exige el «previo dictamen favorable del Consejo de Estado u órgano consultivo equivalente de la Comunidad Autónoma, si lo hubiere». El dictamen tiene que ser favorable: con un dictamen desfavorable la nulidad no se declara. El precepto no pide un informe de la Abogacía del Estado ni la autorización del superior jerárquico del órgano que dictó el acto."
  citation: "art. 106.1 LPAC"
  difficulty: 1
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-2015-10565-art-106
- id: m03-l03-q202
  prompt:
    es: "¿Cuál de los siguientes actos, incurso en un supuesto del artículo 47.1, puede declararse nulo de oficio conforme al artículo 106.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Solo un acto que no haya sido recurrido en plazo, pero nunca uno que puso fin a la vía."
  - id: b
    correct: true
    text:
      es: "Un acto que haya puesto fin a la vía administrativa o que no haya sido recurrido en plazo."
  - id: c
    text:
      es: "Un acto todavía recurrible en alzada, mientras no haya transcurrido el plazo de un mes."
  - id: d
    text:
      es: "Un acto recurrido en alzada en plazo, con el recurso pendiente de resolver."
  explanation:
    es: "El artículo 106.1 permite declarar la nulidad de los actos «que hayan puesto fin a la vía administrativa o que no hayan sido recurridos en plazo». Los dos supuestos valen, de modo que limitarlo a los actos no recurridos es incorrecto. Un acto todavía recurrible en alzada no ha puesto fin a la vía ni ha dejado pasar el plazo, y lo mismo ocurre con el que tiene una alzada pendiente: en ese caso la nulidad se hace valer en el recurso."
  citation: "art. 106.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2015-10565-art-106
- id: m03-l03-q203
  prompt:
    es: "Según el artículo 106.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo y a iniciativa de quién declaran las Administraciones de oficio la nulidad de los actos del artículo 47.1?"
  options:
  - id: a
    correct: true
    text:
      es: "En cualquier momento, por iniciativa propia o a solicitud de interesado."
  - id: b
    text:
      es: "En los cuatro años siguientes a la fecha del acto, solo por iniciativa propia."
  - id: c
    text:
      es: "En cualquier momento, pero solo por iniciativa propia, nunca a solicitud de interesado."
  - id: d
    text:
      es: "En el año siguiente a la notificación, por iniciativa propia o a solicitud de interesado."
  explanation:
    es: "El artículo 106.1 dice que las Administraciones declaran de oficio la nulidad «en cualquier momento, por iniciativa propia o a solicitud de interesado». Los cuatro años son el límite de la declaración de lesividad de los actos anulables, según el artículo 107.2, no de la nulidad. El plazo de un año a partir de la notificación contradice «en cualquier momento». Excluir la solicitud del interesado contradice «o a solicitud de interesado», que el apartado admite expresamente."
  citation: "art. 106.1 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-106
- id: m03-l03-q204
  prompt:
    es: "Conforme al artículo 106.5 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si la revisión de oficio se inició a solicitud de interesado y pasan seis meses sin resolver:"
  options:
  - id: a
    text:
      es: "Se podrá entender estimada la solicitud por silencio administrativo."
  - id: b
    correct: true
    text:
      es: "Se podrá entender desestimada la solicitud por silencio administrativo."
  - id: c
    text:
      es: "Se producirá la caducidad del procedimiento de revisión de oficio iniciado."
  - id: d
    text:
      es: "El órgano deberá recabar un nuevo dictamen del Consejo de Estado."
  explanation:
    es: "El artículo 106.5 distingue según cómo empezó el procedimiento: «Si el procedimiento se hubiera iniciado a solicitud de interesado, se podrá entender la misma desestimada por silencio administrativo». El silencio es negativo, no estimatorio. La caducidad es la consecuencia del procedimiento iniciado de oficio. El precepto no ordena pedir un nuevo dictamen al Consejo de Estado."
  citation: "art. 106.5 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-2015-10565-art-106
- id: m03-l03-q205
  prompt:
    es: "Un Ministerio acuerda el jueves, 15 de enero de 2026, iniciar de oficio la revisión de un acto nulo. ¿Qué día vence el plazo cuyo transcurso sin resolución produce la caducidad del procedimiento?"
  options:
  - id: a
    text:
      es: "El miércoles, 15 de abril de 2026."
  - id: b
    text:
      es: "El viernes, 15 de enero de 2027."
  - id: c
    text:
      es: "El martes, 15 de enero de 2030."
  - id: d
    correct: true
    text:
      es: "El miércoles, 15 de julio de 2026."
  explanation:
    es: "El artículo 106.5 de la Ley 39/2015 fija seis meses desde el inicio para el procedimiento iniciado de oficio. El plazo por meses empieza el día siguiente, viernes 16 de enero, y concluye el mismo día del sexto mes, el miércoles 15 de julio de 2026, que es hábil (art. 30.4). En un plazo por meses los festivos intermedios no cuentan; solo importa que el último día sea hábil. El 15 de abril corresponde a tres meses, el plazo general para resolver; el 15 de enero de 2027 a un año, que el precepto no recoge; y 2030 aplica los cuatro años de la declaración de lesividad."
  citation: "art. 106.5 LPAC"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-107
- id: m03-l03-q206
  prompt:
    es: "De acuerdo con el artículo 107.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los actos favorables para los interesados que sean anulables, previa declaración de lesividad, se impugnan:"
  options:
  - id: a
    correct: true
    text:
      es: "Ante el orden jurisdiccional contencioso-administrativo, por la Administración."
  - id: b
    text:
      es: "Ante el órgano superior jerárquico del que los dictó, mediante recurso de alzada."
  - id: c
    text:
      es: "Ante el Consejo de Estado, que resuelve mediante un dictamen vinculante."
  - id: d
    text:
      es: "Ante el mismo órgano que los dictó, mediante recurso extraordinario de revisión."
  explanation:
    es: "Según el artículo 107.1, las Administraciones «podrán impugnar ante el orden jurisdiccional contencioso-administrativo los actos favorables para los interesados que sean anulables», previa su declaración de lesividad para el interés público. La Administración no anula por sí misma esos actos. La alzada y el extraordinario de revisión son recursos de los interesados, no vías de la Administración contra sus propios actos, y el Consejo de Estado no resuelve la impugnación."
  citation: "art. 107.1 LPAC"
  difficulty: 1
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2015-10565-art-107
- id: m03-l03-q207
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la declaración de lesividad es correcta según el artículo 107.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Exige la previa audiencia de los interesados y no es susceptible de recurso."
  - id: b
    text:
      es: "Puede adoptarse sin audiencia de los interesados y no es susceptible de recurso."
  - id: c
    text:
      es: "Exige la previa audiencia de quienes aparezcan como interesados y es recurrible en alzada."
  - id: d
    text:
      es: "Puede adoptarse sin audiencia de los interesados y es recurrible en vía administrativa."
  explanation:
    es: "El artículo 107.2 dice que la declaración de lesividad «exigirá la previa audiencia de cuantos aparezcan como interesados» y que «no será susceptible de recurso». Las opciones que suprimen la audiencia contradicen la primera regla. Las que la hacen recurrible, en alzada o en vía administrativa, contradicen la segunda."
  citation: "art. 107.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
  - "efecto"
# anchor: boe-a-2015-10565-art-107
- id: m03-l03-q208
  prompt:
    es: "Un acto favorable para un particular, que incurre en una causa de anulabilidad, se dictó el miércoles, 26 de enero de 2022. ¿Hasta qué día puede la Administración adoptar su declaración de lesividad?"
  options:
  - id: a
    correct: true
    text:
      es: "Hasta el lunes, 26 de enero de 2026."
  - id: b
    text:
      es: "Hasta el jueves, 26 de enero de 2023."
  - id: c
    text:
      es: "Hasta el viernes, 26 de enero de 2024."
  - id: d
    text:
      es: "Hasta el martes, 26 de julio de 2022."
  explanation:
    es: "La declaración de lesividad «no podrá adoptarse una vez transcurridos cuatro años desde que se dictó el acto» (art. 107.2 de la Ley 39/2015). Contados de fecha a fecha desde el 26 de enero de 2022, los cuatro años terminan el lunes 26 de enero de 2026, día hábil. El 26 de enero de 2023 aplica un año y el de 2024 aplica dos, plazos que el precepto no fija. El 26 de julio de 2022 aplica seis meses, que es el plazo de caducidad del procedimiento de lesividad, no el límite para declararla."
  citation: "art. 107.2 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-107
- id: m03-l03-q209
  prompt:
    es: "El procedimiento para declarar lesivo un acto favorable anulable se inicia el martes, 20 de octubre de 2026. ¿Qué día vence el plazo cuyo transcurso sin declarar la lesividad produce la caducidad?"
  options:
  - id: a
    text:
      es: "El miércoles, 20 de enero de 2027."
  - id: b
    text:
      es: "El viernes, 20 de noviembre de 2026."
  - id: c
    text:
      es: "El miércoles, 20 de octubre de 2027."
  - id: d
    correct: true
    text:
      es: "El martes, 20 de abril de 2027."
  explanation:
    es: "El artículo 107.3 de la Ley 39/2015 fija la caducidad cuando pasan «seis meses desde la iniciación del procedimiento» sin declarar la lesividad. Desde el martes 20 de octubre de 2026, el plazo concluye el mismo día del sexto mes, el martes 20 de abril de 2027, que es hábil. En un plazo por meses los festivos intermedios no cuentan; solo importa que el último día sea hábil. El 20 de enero de 2027 aplica tres meses, el 20 de noviembre de 2026 un mes y el 20 de octubre de 2027 un año; ninguno de esos plazos es el del artículo 107.3."
  citation: "art. 107.3 LPAC"
  difficulty: 2
  tags:
  - "cómputo"
  - "fecha"
  - "plazo"
# anchor: boe-a-2015-10565-art-107
- id: m03-l03-q210
  prompt:
    es: "Según el artículo 107.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si el acto que se quiere declarar lesivo proviene de la Administración General del Estado, ¿quién adopta la declaración?"
  options:
  - id: a
    correct: true
    text:
      es: "El órgano de la Administración General del Estado competente en la materia."
  - id: b
    text:
      es: "El Consejo de Ministros, previo dictamen del Consejo de Estado."
  - id: c
    text:
      es: "El órgano superior jerárquico del que dictó el acto, en todo caso."
  - id: d
    text:
      es: "La persona titular del Ministerio de Hacienda, sea cual sea el departamento."
  explanation:
    es: "El artículo 107.4 atribuye la declaración, cuando el acto proviene de la Administración General del Estado o de una Comunidad Autónoma, al «órgano de cada Administración competente en la materia». La ley no la reserva al Consejo de Ministros ni pide dictamen del Consejo de Estado para ella. Tampoco la da siempre al superior jerárquico ni al Ministerio de Hacienda."
  citation: "art. 107.4 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2015-10565-art-109
- id: m03-l03-q212
  prompt:
    es: "Fuera de los casos de nulidad y lesividad, las Administraciones Públicas pueden revocar sus actos de gravamen o desfavorables:"
  options:
  - id: a
    text:
      es: "En cualquier momento, sin límite temporal alguno."
  - id: b
    text:
      es: "Dentro de los cuatro años siguientes a la fecha en que se dictaron."
  - id: c
    correct: true
    text:
      es: "Mientras no haya transcurrido el plazo de prescripción."
  - id: d
    text:
      es: "Solo con dictamen previo favorable del Consejo de Estado."
  explanation:
    es: "El artículo 109.1 de la Ley 39/2015 permite revocar los actos de gravamen o desfavorables «mientras no haya transcurrido el plazo de prescripción». La rectificación de errores es la que cabe «en cualquier momento» (art. 109.2). Los cuatro años son el límite de la declaración de lesividad, y el dictamen favorable del Consejo de Estado se exige para la nulidad de oficio, no para revocar."
  citation: "art. 109.1 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "concepto"
# anchor: boe-a-2015-10565-art-109
- id: m03-l03-q213
  prompt:
    es: "Señale la respuesta correcta sobre la revocación de los actos de gravamen o desfavorables, según el artículo 109.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    text:
      es: "Solo alcanza a los actos favorables para los interesados, previa declaración de su lesividad."
  - id: b
    text:
      es: "Exige el dictamen favorable previo del Consejo de Estado u órgano consultivo equivalente."
  - id: c
    correct: true
    text:
      es: "No puede constituir dispensa o exención no permitida por las leyes ni ser contraria a la igualdad."
  - id: d
    text:
      es: "Puede acordarse aunque sea contraria al interés público, siempre que beneficie al interesado."
  explanation:
    es: "El artículo 109.1 condiciona la revocación a que «no constituya dispensa o exención no permitida por las leyes, ni sea contraria al principio de igualdad, al interés público o al ordenamiento jurídico». La revocación recae sobre actos de gravamen o desfavorables; los actos favorables anulables siguen la vía de la lesividad (art. 107). El dictamen del Consejo de Estado es propio de la nulidad de oficio. La revocación contraria al interés público está prohibida aunque beneficie al interesado."
  citation: "art. 109.1 LPAC"
  difficulty: 2
  tags:
  - "requisito"
  - "concepto"
# anchor: boe-a-2015-10565-art-109
- id: m03-l03-q214
  prompt:
    es: "Según el artículo 109.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las Administraciones Públicas podrán rectificar los errores materiales, de hecho o aritméticos de sus actos:"
  options:
  - id: a
    text:
      es: "Dentro de los cuatro años siguientes a la fecha en que se dictó el acto."
  - id: b
    text:
      es: "Mientras no haya transcurrido el plazo de prescripción de la acción."
  - id: c
    correct: true
    text:
      es: "En cualquier momento, sin que la ley establezca un plazo máximo para hacerlo."
  - id: d
    text:
      es: "Dentro del mes siguiente a la notificación del acto que contiene el error."
  explanation:
    es: "El artículo 109.2 dice que las Administraciones pueden rectificar los errores materiales, de hecho o aritméticos «en cualquier momento, de oficio o a instancia de los interesados». Los cuatro años son el límite de la declaración de lesividad del artículo 107.2. El plazo de prescripción es el límite de la revocación de los actos de gravamen, en el artículo 109.1, y no el de la rectificación. Un mes desde la notificación contradice «en cualquier momento»."
  citation: "art. 109.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-109
- id: m03-l03-q215
  prompt:
    es: "Las Administraciones Públicas pueden rectificar en cualquier momento los errores de sus actos que sean:"
  options:
  - id: a
    text:
      es: "Materiales, de hecho o de derecho."
  - id: b
    correct: true
    text:
      es: "Materiales, de hecho o aritméticos."
  - id: c
    text:
      es: "De derecho, siempre que no alteren el fallo."
  - id: d
    text:
      es: "Solo aritméticos o de transcripción."
  explanation:
    es: "El artículo 109.2 de la Ley 39/2015 se refiere a «los errores materiales, de hecho o aritméticos existentes en sus actos». El error de derecho queda fuera: un acto con un error de derecho se corrige por la revisión de oficio, la lesividad o los recursos, no por rectificación. Limitar la rectificación a los errores aritméticos deja fuera los materiales y los de hecho, que el precepto incluye."
  citation: "art. 109.2 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-110
- id: m03-l03-q216
  prompt:
    es: "De acuerdo con el artículo 110 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, no caben las facultades de revisión cuando, por el tiempo transcurrido u otras circunstancias, su ejercicio resulte contrario:"
  options:
  - id: a
    text:
      es: "A la equidad, a la seguridad jurídica, al interés general o a las leyes."
  - id: b
    text:
      es: "A la buena fe, a la confianza legítima, al interés público o a la Constitución."
  - id: c
    correct: true
    text:
      es: "A la equidad, a la buena fe, al derecho de los particulares o a las leyes."
  - id: d
    text:
      es: "Al interés público, a la igualdad, al derecho de los particulares o a los reglamentos."
  explanation:
    es: "El artículo 110 enumera cuatro límites: la revisión no cabe cuando su ejercicio «resulte contrario a la equidad, a la buena fe, al derecho de los particulares o a las leyes». Las demás opciones cambian alguno de esos términos por la seguridad jurídica, el interés general, la confianza legítima, la Constitución, la igualdad o los reglamentos. La igualdad y el interés público son límites de la revocación (art. 109.1), no del artículo 110."
  citation: "art. 110 LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-111
- id: m03-l03-q217
  prompt:
    es: "En los organismos públicos estatales, ¿cuál de las siguientes reglas de competencia para la revisión de oficio recoge el artículo 111 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "El Ministro de Hacienda revisa los actos del máximo órgano rector y los de sus órganos dependientes."
  - id: b
    correct: true
    text:
      es: "El órgano de adscripción revisa los actos del máximo órgano rector, y este los de sus órganos dependientes."
  - id: c
    text:
      es: "Cada órgano del organismo revisa sus propios actos, sin que intervenga nunca el órgano de adscripción."
  - id: d
    text:
      es: "El Consejo de Estado revisa los actos del máximo órgano rector, y el Ministro los de los demás."
  explanation:
    es: "El artículo 111.c) reparte la competencia en dos escalones: los órganos de adscripción revisan los actos «dictados por el máximo órgano rector», y los máximos órganos rectores los «dictados por los órganos de ellos dependientes». Ningún órgano revisa sus propios actos, el Ministerio de Hacienda no tiene una competencia general sobre los organismos de otros departamentos y el Consejo de Estado dictamina, pero no revisa."
  citation: "art. 111.c) LPAC"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2015-10565-art-111
- id: m03-l03-q218
  prompt:
    es: "Según el artículo 111.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿quién revisa de oficio un acto nulo de un órgano dependiente del máximo órgano rector de un organismo público estatal?"
  options:
  - id: a
    text:
      es: "El órgano al que está adscrito el organismo público."
  - id: b
    text:
      es: "El Subsecretario del departamento de adscripción."
  - id: c
    text:
      es: "El mismo órgano dependiente que dictó el acto."
  - id: d
    correct: true
    text:
      es: "El máximo órgano rector del organismo público."
  explanation:
    es: "El artículo 111.c).2.º de la Ley 39/2015 atribuye a «los máximos órganos rectores» de los organismos públicos la revisión de los actos «dictados por los órganos de ellos dependientes». El órgano de adscripción revisa solo los actos del propio máximo órgano rector (art. 111.c).1.º). La ley no da esta competencia al Subsecretario ni al órgano autor del acto."
  citation: "art. 111.c) LPAC"
  difficulty: 3
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2015-10565-art-112
- id: m03-l03-q219
  prompt:
    es: "En el procedimiento administrativo común, ¿qué recurso cabe en vía administrativa contra una disposición administrativa de carácter general?"
  options:
  - id: a
    correct: true
    text:
      es: "Ninguno: contra ella no cabe recurso en vía administrativa."
  - id: b
    text:
      es: "El recurso potestativo de reposición ante el órgano que la aprobó."
  - id: c
    text:
      es: "El recurso de alzada ante el superior jerárquico del que la aprobó."
  - id: d
    text:
      es: "El recurso extraordinario de revisión en los casos del artículo 125.1."
  explanation:
    es: "El artículo 112.3 de la Ley 39/2015 dice: «Contra las disposiciones administrativas de carácter general no cabrá recurso en vía administrativa». La reposición, la alzada y el extraordinario de revisión se dirigen contra actos, no contra reglamentos. La disposición se impugna directamente ante el orden contencioso-administrativo (art. 25.1 LJCA)."
  citation: "art. 112.3 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-114
- id: m03-l03-q220
  prompt:
    es: "Según la regulación de los recursos administrativos, ¿cuál de las siguientes resoluciones pone fin a la vía administrativa?"
  options:
  - id: a
    text:
      es: "El acuerdo que inicia un procedimiento sancionador."
  - id: b
    correct: true
    text:
      es: "La resolución por la que se decide un recurso de alzada."
  - id: c
    text:
      es: "El acto de trámite que abre un período de prueba."
  - id: d
    text:
      es: "La propuesta de resolución que formula el instructor."
  explanation:
    es: "El artículo 114.1.a) de la Ley 39/2015 incluye entre los actos que ponen fin a la vía administrativa «las resoluciones de los recursos de alzada». El acuerdo de iniciación, la apertura de un período de prueba y la propuesta de resolución son actos del curso del procedimiento: ninguno lo termina, y menos aún agota la vía administrativa."
  citation: "art. 114.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2015-10565-art-114
- id: m03-l03-q223
  prompt:
    es: "Según el artículo 114.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿agota la vía administrativa la desestimación de una reclamación de responsabilidad patrimonial por una Dirección General con superior?"
  options:
  - id: a
    text:
      es: "No, salvo que la dicte un Ministro o un Secretario de Estado en ejercicio de sus competencias."
  - id: b
    text:
      es: "No, salvo que el Consejo de Estado haya emitido dictamen en el procedimiento de reclamación."
  - id: c
    text:
      es: "Sí, pero solo cuando la resolución estime total o parcialmente la reclamación presentada."
  - id: d
    correct: true
    text:
      es: "Sí, pone fin a la vía administrativa aunque la dicte un órgano con superior jerárquico."
  explanation:
    es: "El artículo 114.1.e) de la Ley 39/2015 incluye entre los actos que ponen fin a la vía administrativa «la resolución administrativa de los procedimientos de responsabilidad patrimonial». No distingue por el órgano que la dicta ni por su sentido, estimatorio o desestimatorio. Contra ella cabe reposición potestativa o recurso contencioso-administrativo directo (art. 123.1), no alzada. El dictamen del Consejo de Estado no influye en que la resolución agote la vía."
  citation: "art. 114.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
  - "concepto"
