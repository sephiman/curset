# anchor: boe-a-2017-12902-art-2
- id: m03-l04-q001
  prompt:
    es: "De acuerdo con el artículo 2.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, son contratos del sector público y están sometidos a dicha ley:"
  options:
  - id: a
    text:
      es: "Los contratos onerosos o gratuitos, cualquiera que sea su naturaleza, que celebren las entidades del artículo 3."
  - id: b
    text:
      es: "Los contratos onerosos de naturaleza administrativa que celebren las entidades del artículo 3."
  - id: c
    text:
      es: "Los contratos onerosos, cualquiera que sea su naturaleza jurídica, de valor estimado superior a 15.000 euros."
  - id: d
    correct: true
    text:
      es: "Los contratos onerosos, cualquiera que sea su naturaleza jurídica, que celebren las entidades del artículo 3."
  explanation:
    es: "El artículo 2.1 LCSP define los contratos del sector público como «los contratos onerosos, cualquiera que sea su naturaleza jurídica, que celebren las entidades enumeradas en el artículo 3». La opción que los limita a los de naturaleza administrativa contradice el inciso «cualquiera que sea su naturaleza jurídica»: también hay contratos privados del sector público. La que añade los contratos gratuitos olvida que la ley exige que sean onerosos. La que fija un valor estimado mínimo de 15.000 euros confunde la definición con el umbral del contrato menor de suministro y servicios, que no saca a esos contratos de la ley."
  citation: "art. 2.1 LCSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-32
- id: m03-l04-q002
  prompt:
    es: "Según el artículo 32.2.b) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿qué parte de sus actividades debe dedicar un medio propio personificado a los cometidos que le confía el poder adjudicador que lo controla?"
  options:
  - id: a
    text:
      es: "Más del 50 por ciento de las actividades del ente destinatario del encargo."
  - id: b
    text:
      es: "Al menos el 75 por ciento de las actividades del ente destinatario del encargo."
  - id: c
    correct: true
    text:
      es: "Más del 80 por ciento de las actividades del ente destinatario del encargo."
  - id: d
    text:
      es: "Más del 90 por ciento de las actividades del ente destinatario del encargo."
  explanation:
    es: "El artículo 32.2.b) LCSP exige «que más del 80 por ciento de las actividades del ente destinatario del encargo se lleven a cabo en el ejercicio de los cometidos que le han sido confiados por el poder adjudicador que hace el encargo y que lo controla», o por otras personas jurídicas controladas del mismo modo. Las opciones del 50 y del 75 por ciento se quedan por debajo de la cifra legal. La del 90 por ciento la eleva: la ley pide superar el 80, no el 90."
  citation: "art. 32.2.b) LCSP"
  difficulty: 2
  tags:
  - "cantidad"
  - "requisito"
# anchor: boe-a-2017-12902-art-32
- id: m03-l04-q003
  prompt:
    es: "El encargo que un poder adjudicador hace a un medio propio personificado que cumple todos los requisitos legales para serlo:"
  options:
  - id: a
    text:
      es: "Es un contrato de servicios de tramitación ordinaria."
  - id: b
    text:
      es: "Es un contrato privado de la Administración."
  - id: c
    text:
      es: "Es un contrato administrativo especial."
  - id: d
    correct: true
    text:
      es: "No tiene la consideración de contrato."
  explanation:
    es: "El artículo 32.1 LCSP dice que «el encargo que cumpla dichos requisitos no tendrá la consideración de contrato». Por eso no es un contrato administrativo especial ni un contrato privado de la Administración: ambas son clases de contrato de los artículos 25 y 26. Tampoco es un contrato de servicios: el poder adjudicador ejecuta la prestación de forma directa, valiéndose del medio propio."
  citation: "art. 32.1 LCSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-13
- id: m03-l04-q004
  prompt:
    es: "Un ministerio contrata con una sola empresa la redacción del proyecto y la ejecución de la obra de ampliación de su sede. ¿Qué tipo de contrato celebra?"
  options:
  - id: a
    correct: true
    text:
      es: "Un contrato administrativo de obras."
  - id: b
    text:
      es: "Un contrato administrativo de suministro."
  - id: c
    text:
      es: "Un contrato administrativo de servicios."
  - id: d
    text:
      es: "Un contrato de concesión de obras."
  explanation:
    es: "El artículo 13.1.a) LCSP define como contrato de obras el que tiene por objeto «la ejecución de una obra, aislada o conjuntamente con la redacción del proyecto». Que incluya la redacción del proyecto no lo convierte en contrato de servicios. No es concesión de obras porque la empresa no recibe el derecho a explotar la obra. El suministro recae sobre productos o bienes muebles, no sobre la ejecución de una obra."
  citation: "art. 13.1 LCSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-14
- id: m03-l04-q005
  prompt:
    es: "De acuerdo con el artículo 14.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en la concesión de obras la contraprestación a favor del concesionario consiste:"
  options:
  - id: a
    text:
      es: "En un precio fijo, sin que el concesionario asuma riesgo alguno en la explotación."
  - id: b
    correct: true
    text:
      es: "Únicamente en el derecho a explotar la obra, o en dicho derecho acompañado del de percibir un precio."
  - id: c
    text:
      es: "Únicamente en el precio que le abona la Administración por la obra ejecutada y recibida."
  - id: d
    text:
      es: "En el derecho a explotar la obra durante un plazo que nunca puede superar los cinco años."
  explanation:
    es: "Según el artículo 14.1 LCSP, la contraprestación «consiste, o bien únicamente en el derecho a explotar la obra […], o bien en dicho derecho acompañado del de percibir un precio». La opción del precio abonado por la obra ejecutada describe un contrato de obras, no una concesión. La que limita la explotación a cinco años es falsa: el artículo 29.6 admite concesiones de más de cinco años. La del precio fijo sin riesgo contradice el artículo 14.4, que exige transferir al concesionario un riesgo operacional."
  citation: "art. 14.1 LCSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-15
- id: m03-l04-q006
  prompt:
    es: "¿Cuál de los siguientes rasgos es propio del contrato de concesión de servicios, según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "El concesionario cobra siempre de la Administración un precio fijo, sin asumir riesgo alguno de demanda."
  - id: b
    text:
      es: "El contrato solo puede encomendarse a personas jurídicas, nunca a personas naturales."
  - id: c
    text:
      es: "El servicio gestionado debe ser ajeno a la titularidad o competencia del poder adjudicador."
  - id: d
    correct: true
    text:
      es: "El derecho a explotar el servicio implica transferir al concesionario el riesgo operacional."
  explanation:
    es: "El artículo 15.2 LCSP establece que «el derecho de explotación de los servicios implicará la transferencia al concesionario del riesgo operacional». La opción del precio fijo sin riesgo de demanda niega ese riesgo, que según el artículo 14.4 abarca el de demanda o el de suministro. La del servicio ajeno a la competencia contradice el artículo 15.1, que habla de un servicio «cuya prestación sea de su titularidad o competencia». La que excluye a las personas naturales también lo contradice: el contrato se encomienda «a una o varias personas, naturales o jurídicas»."
  citation: "art. 15 LCSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-16
- id: m03-l04-q009
  prompt:
    es: "¿Cómo se califica el contrato que tiene por objeto la adquisición, para un ministerio, de programas de ordenador desarrollados a medida?"
  options:
  - id: a
    text:
      es: "Como un contrato privado de la Administración."
  - id: b
    correct: true
    text:
      es: "Como un contrato administrativo de servicios."
  - id: c
    text:
      es: "Como un contrato administrativo de suministro."
  - id: d
    text:
      es: "Como un contrato mixto de suministro y servicios."
  explanation:
    es: "El artículo 16.3.b) LCSP considera suministro la adquisición de equipos, sistemas y programas para el tratamiento de la información, «a excepción de los contratos de adquisición de programas de ordenador desarrollados a medida, que se considerarán contratos de servicios». La opción del suministro aplica la regla general y olvida la excepción. La del contrato mixto no cabe: la ley lo califica entero como servicios. La del contrato privado tampoco: un contrato de servicios de un ministerio es administrativo (art. 25.1.a)."
  citation: "art. 16.3.b) LCSP"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2017-12902-art-16
- id: m03-l04-q010
  prompt:
    es: "Según el artículo 16.3 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cómo se considera en todo caso el contrato que tiene por objeto la adquisición de energía transformada?"
  options:
  - id: a
    text:
      es: "Como un contrato administrativo especial."
  - id: b
    text:
      es: "Como un contrato de servicios."
  - id: c
    correct: true
    text:
      es: "Como un contrato de suministro."
  - id: d
    text:
      es: "Como un contrato de concesión de servicios."
  explanation:
    es: "El artículo 16.3 LCSP enumera los contratos que «en todo caso» son de suministro, y su letra d) incluye «los que tengan por objeto la adquisición de energía primaria o energía transformada». No es un contrato de servicios, que recae sobre prestaciones de hacer. No es una concesión de servicios, porque no se encomienda la gestión de un servicio. Tampoco es un contrato administrativo especial: la ley lo califica expresamente como suministro."
  citation: "art. 16.3.d) LCSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-17
- id: m03-l04-q011
  prompt:
    es: "Según el artículo 17 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, son contratos de servicios los que tienen por objeto prestaciones de hacer consistentes en una actividad o dirigidas a obtener:"
  options:
  - id: a
    text:
      es: "Un resultado consistente en una obra o en un suministro."
  - id: b
    text:
      es: "Una obra completa susceptible de ser entregada al uso general."
  - id: c
    correct: true
    text:
      es: "Un resultado distinto de una obra o suministro."
  - id: d
    text:
      es: "Un bien mueble fabricado según características fijadas por la entidad."
  explanation:
    es: "El artículo 17 LCSP define los servicios como prestaciones de hacer «dirigidas a la obtención de un resultado distinto de una obra o suministro». La opción del resultado consistente en una obra o un suministro dice lo contrario. La de la obra completa entregable al uso general describe el objeto del contrato de obras (art. 13.3). La del bien fabricado según características fijadas por la entidad es un contrato de fabricación, que el artículo 16.3.c) considera suministro."
  citation: "art. 17 LCSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-18
- id: m03-l04-q012
  prompt:
    es: "De acuerdo con el artículo 18.1.a) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en un contrato mixto compuesto en parte por servicios y en parte por suministros, el objeto principal se determina:"
  options:
  - id: a
    text:
      es: "En función de cuál de las dos prestaciones tenga una duración mayor."
  - id: b
    correct: true
    text:
      es: "En función de cuál sea el mayor de los valores estimados de los servicios o de los suministros."
  - id: c
    text:
      es: "Atendiendo siempre a la prestación de suministro, que prevalece sobre la de servicios."
  - id: d
    text:
      es: "Por elección libre del órgano de contratación, motivada en el expediente."
  explanation:
    es: "Para los mixtos de servicios y suministros, el artículo 18.1.a) LCSP dice que «el objeto principal se determinará en función de cuál sea el mayor de los valores estimados de los respectivos servicios o suministros». La duración de las prestaciones no es el criterio. Tampoco prevalece siempre el suministro. Y el órgano de contratación no elige libremente: la ley fija el criterio del mayor valor estimado."
  citation: "art. 18.1.a) LCSP"
  difficulty: 3
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2017-12902-art-18
- id: m03-l04-q013
  prompt:
    es: "Según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, para fijar las normas de adjudicación de un contrato mixto que comprende prestaciones propias de un contrato de obras y de uno de servicios, se atiende:"
  options:
  - id: a
    text:
      es: "A las normas del contrato de servicios, en todo caso."
  - id: b
    text:
      es: "A la prestación de mayor duración."
  - id: c
    correct: true
    text:
      es: "Al carácter de la prestación principal."
  - id: d
    text:
      es: "A las normas del contrato de obras, en todo caso."
  explanation:
    es: "El artículo 18.1.a) LCSP dispone que, cuando un contrato mixto comprenda prestaciones propias de dos o más contratos de obras, suministros o servicios, «se atenderá al carácter de la prestación principal». No se aplican en todo caso las normas de las obras ni las de los servicios: decide cuál de las dos prestaciones es la principal. La duración de las prestaciones no es el criterio que fija la ley."
  citation: "art. 18.1.a) LCSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-25
- id: m03-l04-q014
  prompt:
    es: "Conforme al artículo 25.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, los contratos de obra, concesión de obra, concesión de servicios, suministro y servicios tienen carácter administrativo:"
  options:
  - id: a
    correct: true
    text:
      es: "Siempre que se celebren por una Administración Pública, salvo los que la ley declara privados."
  - id: b
    text:
      es: "Siempre que los celebre una entidad del sector público con la condición de poder adjudicador."
  - id: c
    text:
      es: "Solo cuando su valor estimado supera los umbrales fijados para el contrato menor."
  - id: d
    text:
      es: "Solo cuando están sujetos a regulación armonizada, cualquiera que sea la entidad pública que los celebre."
  explanation:
    es: "El artículo 25.1 LCSP da carácter administrativo a esos contratos «siempre que se celebren por una Administración Pública», con la salvedad de los privados de los números 1.º y 2.º de su letra a). La opción del poder adjudicador es demasiado amplia: los poderes adjudicadores que no son Administración Pública celebran contratos privados (art. 26.1.b). La regulación armonizada y el umbral del contrato menor no deciden si un contrato es administrativo o privado."
  citation: "art. 25.1 LCSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-26
- id: m03-l04-q015
  prompt:
    es: "Una entidad del sector público que es poder adjudicador, pero que no tiene la condición de Administración Pública, celebra un contrato de servicios. ¿Qué carácter tiene ese contrato?"
  options:
  - id: a
    text:
      es: "Tiene carácter de contrato administrativo."
  - id: b
    text:
      es: "Es administrativo si está sujeto a regulación armonizada."
  - id: c
    text:
      es: "Tiene carácter de contrato administrativo especial."
  - id: d
    correct: true
    text:
      es: "Tiene carácter de contrato privado."
  explanation:
    es: "El artículo 26.1.b) LCSP considera contratos privados «los celebrados por entidades del sector público que siendo poder adjudicador no reúnan la condición de Administraciones Públicas». No es administrativo, porque el artículo 25.1 exige que lo celebre una Administración Pública. Por la misma razón no es administrativo especial. Estar sujeto a regulación armonizada no cambia su carácter privado."
  citation: "art. 26.1 LCSP"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-25
- id: m03-l04-q016
  prompt:
    es: "Además de los de obra, concesión, suministro y servicios, ¿cuáles de los siguientes contratos de una Administración Pública son administrativos según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público?"
  options:
  - id: a
    text:
      es: "Los de suscripción a revistas, publicaciones periódicas y bases de datos."
  - id: b
    text:
      es: "Los que celebre cualquier poder adjudicador que no sea Administración Pública."
  - id: c
    correct: true
    text:
      es: "Los declarados así expresamente por una ley y los que tengan naturaleza administrativa especial."
  - id: d
    text:
      es: "Todos los contratos que celebre una Administración Pública, cualquiera que sea su objeto."
  explanation:
    es: "El artículo 25.1.b) LCSP añade como administrativos «los contratos declarados así expresamente por una Ley» y los de objeto distinto que tengan naturaleza administrativa especial. No lo son todos los contratos de una Administración Pública: los de otro objeto son privados (art. 26.1.a). Los de un poder adjudicador que no es Administración Pública también son privados (art. 26.1.b). Los de suscripción a revistas, publicaciones periódicas y bases de datos son justamente una de las excepciones privadas del artículo 25.1.a)."
  citation: "art. 25.1 LCSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2017-12902-art-19
- id: m03-l04-q017
  prompt:
    es: "Según el artículo 19.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, los contratos de obras, concesión, suministro y servicios están sujetos a regulación armonizada si alcanzan el umbral y, además:"
  options:
  - id: a
    text:
      es: "El contrato se adjudica por el procedimiento abierto."
  - id: b
    correct: true
    text:
      es: "La entidad contratante tiene el carácter de poder adjudicador."
  - id: c
    text:
      es: "El contrato se financia con fondos de la Unión Europea."
  - id: d
    text:
      es: "La entidad contratante tiene la condición de Administración Pública."
  explanation:
    es: "El artículo 19.1 LCSP somete a regulación armonizada estos contratos cuando su valor estimado iguala o supera los umbrales, «siempre que la entidad contratante tenga el carácter de poder adjudicador». No hace falta que sea Administración Pública: basta con ser poder adjudicador. La financiación europea no es requisito. El procedimiento de adjudicación tampoco: la regulación armonizada depende del valor y de la entidad, no del procedimiento elegido."
  citation: "art. 19.1 LCSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2017-12902-art-20
- id: m03-l04-q018
  prompt:
    es: "Según el artículo 20.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, vigente desde el 1 de enero de 2026, están sujetos a regulación armonizada los contratos de obras de valor estimado:"
  options:
  - id: a
    correct: true
    text:
      es: "Igual o superior a 5.404.000 euros."
  - id: b
    text:
      es: "Estrictamente superior a 5.404.000 euros."
  - id: c
    text:
      es: "Igual o superior a 2.000.000 de euros."
  - id: d
    text:
      es: "Igual o superior a 5.538.000 euros."
  explanation:
    es: "Desde el 1 de enero de 2026 el artículo 20.1 LCSP dice «igual o superior a 5.404.000 euros»: la Orden HAC/1517/2025 sustituyó la cifra de 5.538.000 euros, que es la anterior. La opción «estrictamente superior a 5.404.000 euros» deja fuera el contrato que iguala el umbral, y la ley lo incluye. Los 2.000.000 de euros son el límite de las obras en el procedimiento abierto simplificado (art. 159.1.a), no el umbral armonizado."
  citation: "art. 20.1 LCSP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-20
- id: m03-l04-q020
  prompt:
    es: "Según el artículo 20.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿desde qué valor estimado está sujeto a regulación armonizada un contrato de concesión de servicios?"
  options:
  - id: a
    correct: true
    text:
      es: "Desde 5.404.000 euros, el mismo umbral que el de los contratos de obras."
  - id: b
    text:
      es: "Desde 216.000 euros, como los servicios de las demás entidades del sector público."
  - id: c
    text:
      es: "Desde 750.000 euros, como los servicios sociales y específicos del anexo IV."
  - id: d
    text:
      es: "Desde 140.000 euros, como los servicios de la Administración General del Estado."
  explanation:
    es: "El artículo 20.1 LCSP agrupa las obras, la concesión de obras y la concesión de servicios con un único umbral: valor estimado «igual o superior a 5.404.000 euros». Los 140.000 y los 216.000 euros son los umbrales de los contratos de servicios del artículo 22.1.a) y b), no los de la concesión de servicios. Los 750.000 euros son el umbral de los servicios sociales y específicos del anexo IV (art. 22.1.c)."
  citation: "art. 20.1 LCSP"
  difficulty: 3
  tags:
  - "cantidad"
# anchor: boe-a-2017-12902-art-21
- id: m03-l04-q021
  prompt:
    es: "Según el artículo 21.1.a) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, desde 2026 los suministros adjudicados por la Administración General del Estado están sujetos a regulación armonizada desde:"
  options:
  - id: a
    correct: true
    text:
      es: "Un valor estimado de 140.000 euros."
  - id: b
    text:
      es: "Un valor estimado de 143.000 euros."
  - id: c
    text:
      es: "Un valor estimado de 221.000 euros."
  - id: d
    text:
      es: "Un valor estimado de 216.000 euros."
  explanation:
    es: "El artículo 21.1.a) LCSP fija el umbral en «140.000 euros, cuando se trate de contratos adjudicados por la Administración General del Estado, sus Organismos Autónomos, o las Entidades Gestoras y Servicios Comunes de la Seguridad Social». La cifra de 143.000 euros es la anterior, sustituida por la Orden HAC/1517/2025 desde el 1 de enero de 2026. Los 216.000 euros son el umbral de los demás suministros (art. 21.1.b), y los 221.000 euros su cifra anterior."
  citation: "art. 21.1.a) LCSP"
  difficulty: 1
  tags:
  - "cantidad"
