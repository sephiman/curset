      es: "5"
  - id: b
    text:
      es: "6"
  - id: c
    correct: true
    text:
      es: "7"
  - id: d
    text:
      es: "8"
  explanation:
    es: "La página enumera siete tipos de error: #N/A, #¡VALOR!, #¡REF!, #¡DIV/0!, #¡NUM!, #¿NOMBRE? y #¡NULO!."
