# anchor: celex-32013r0952-art-70
- id: m03-l20-q0030
  prompt:
    es: "De acuerdo con el artículo 70, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, el valor de transacción es el precio realmente pagado o por pagar por las mercancías cuando se vendan:"
  options:
  - id: a
    text:
      es: "Para su consumo en el territorio aduanero de la Unión, sin ajuste alguno sobre el precio facturado."
  - id: b
    correct: true
    text:
      es: "Para su exportación al territorio aduanero de la Unión, ajustado, en su caso."
  - id: c
    text:
      es: "Dentro del territorio aduanero de la Unión, a personas no vinculadas con el vendedor."
  - id: d
    text:
      es: "Para su exportación fuera del territorio aduanero de la Unión, ajustado, en su caso, por la Comisión."
  explanation:
    es: "El valor de transacción es el precio de las mercancías vendidas para su exportación al territorio aduanero de la Unión, ajustado cuando proceda. La venta para el consumo en la Unión y sin ajuste no es la que describe el artículo. Las ventas dentro de la Unión a personas no vinculadas pertenecen a otro método de valoración, no a este. Y la venta se hace para exportar a la Unión, no fuera de ella, ni lo ajusta la Comisión."
  citation: "art. 70.1 CAU"
  difficulty: 2
  tags:
  - "valor en aduana"
  - "valor de transacción"
# anchor: celex-32013r0952-art-70
- id: m03-l20-q0031
  prompt:
    es: "De acuerdo con el artículo 70, apartado 1, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre la base principal para determinar el valor en aduana de las mercancías:"
  options:
  - id: a
    correct: true
    text:
      es: "Es el valor de transacción, es decir, el precio realmente pagado o por pagar por las mercancías vendidas para su exportación a la Unión, ajustado en su caso."
  - id: b
    text:
      es: "Es el precio medio de mercado de las mercancías en el territorio aduanero de la Unión el día en que se admite la declaración."
  - id: c
    text:
      es: "Es el valor que fijan las autoridades aduaneras para cada partida, sin tener en cuenta el precio pagado por el comprador."
  - id: d
    text:
      es: "Es el valor en libros que el importador tenga registrado en su contabilidad para las mercancías importadas."
  explanation:
    es: "La base principal es el valor de transacción, que parte del precio realmente pagado o por pagar. No es un precio medio de mercado, ni un valor fijado por la autoridad al margen del precio, ni el valor contable del importador: ninguno de los tres es el criterio del artículo 70.1."
  citation: "art. 70.1 CAU"
  difficulty: 1
  tags:
  - "valor en aduana"
  - "valor de transacción"
# anchor: celex-32013r0952-art-70
- id: m03-l20-q0032
  prompt:
    es: "De acuerdo con el artículo 70, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, el precio realmente pagado o por pagar es el pago total que el comprador haya efectuado o deba efectuar:"
  options:
  - id: a
    correct: true
    text:
      es: "Al vendedor o a un tercero en favor del vendedor, por las mercancías importadas."
  - id: b
    text:
      es: "Al vendedor o a las autoridades aduaneras, por las mercancías importadas y por los derechos que graven su importación."
  - id: c
    text:
      es: "Únicamente al vendedor, por las mercancías importadas, sin contar lo pagado a terceros."
  - id: d
    text:
      es: "Al vendedor o a un tercero en favor del comprador, por las mercancías importadas y por los gastos de su transporte."
  explanation:
    es: "El pago total incluye lo pagado al vendedor y lo pagado a un tercero en favor del vendedor. No se cuentan los derechos pagados a las autoridades aduaneras, que no forman parte del precio. Tampoco se limita a lo abonado al vendedor, porque el artículo recoge expresamente al tercero. Y el tercero ha de recibir el pago en favor del vendedor, no del comprador."
  citation: "art. 70.2 CAU"
  difficulty: 2
  tags:
  - "valor en aduana"
  - "precio pagado"
# anchor: celex-32013r0952-art-70
- id: m03-l20-q0034
  prompt:
    es: "¿Qué pagos incluye el precio realmente pagado o por pagar por las mercancías importadas, conforme al artículo 70, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión?"
  options:
  - id: a
    correct: true
    text:
      es: "Todos los pagos efectuados o por efectuar como condición de la venta de esas mercancías."
  - id: b
    text:
      es: "Solo los pagos efectuados en la fecha de la venta, con exclusión de los pagos aplazados."
  - id: c
    text:
      es: "Solo los pagos efectuados en la moneda de un Estado miembro, con exclusión de los demás."
  - id: d
    text:
      es: "Solo los pagos que figuren en la factura emitida por el vendedor de las mercancías."
  explanation:
    es: "El precio incluye todos los pagos efectuados o por efectuar como condición de la venta, lo que alcanza a los pagos aplazados. No se limita a los hechos en la fecha de la venta, ni a los hechos en una moneda concreta, ni a los que consten en la factura: el criterio es que sean condición de la venta."
  citation: "art. 70.2 CAU"
  difficulty: 2
  tags:
  - "valor en aduana"
  - "precio pagado"
# anchor: celex-32013r0952-art-71
- id: m03-l20-q0036
  prompt:
    es: "El comprador de unas mercancías soporta 3 000 euros de gastos de corretaje y 1 000 euros de comisión de compra, y ninguno de ellos está incluido en el precio de 50 000 euros pagado al vendedor. Según el artículo 71, apartado 1, letra a), del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cuánto se suma al precio por estos conceptos?"
  options:
  - id: a
    text:
      es: "4 000 euros: se suman ambos conceptos al precio realmente pagado."
  - id: b
    correct: true
    text:
      es: "3 000 euros: los gastos de corretaje se suman y la comisión de compra no."
  - id: c
    text:
      es: "1 000 euros: solo se suma la comisión de compra."
  - id: d
    text:
      es: "Nada, porque estos conceptos no están incluidos en el precio realmente pagado."
  explanation:
    es: "Los gastos de corretaje que soporta el comprador y no están en el precio se suman: 3 000 euros. La comisión de compra queda fuera de lo que se suma. Por eso no son 4 000 euros ni 1 000 euros. Y que no estén incluidos en el precio no impide sumarlos: es la condición para sumarlos, no para excluirlos."
  citation: "art. 71.1.a) CAU"
  difficulty: 2
  tags:
  - "valor en aduana"
  - "comisiones"
  - "cómputo"
# anchor: celex-32013r0952-art-71
- id: m03-l20-q0037
  prompt:
    es: "De acuerdo con el artículo 71, apartado 1, letra e), del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, los gastos de transporte, de seguro, de carga y de manipulación asociados al transporte completan el precio realmente pagado hasta:"
  options:
  - id: a
    text:
      es: "El almacén del importador en el que se depositen finalmente las mercancías."
  - id: b
    text:
      es: "La aduana en la que se admita la declaración en aduana de despacho a libre práctica de las mercancías."
  - id: c
    correct: true
    text:
      es: "El lugar por donde se introducen las mercancías en el territorio aduanero de la Unión."
  - id: d
    text:
      es: "El lugar en el que el comprador pague el precio al vendedor."
  explanation:
    es: "Estos costes se suman hasta el lugar por donde las mercancías se introducen en el territorio aduanero de la Unión. No se llega al almacén del importador, ni a la aduana de despacho, ni al lugar del pago, que no son el punto que fija el texto."
  citation: "art. 71.1.e) CAU"
  difficulty: 1
  tags:
  - "valor en aduana"
  - "transporte"
# anchor: celex-32013r0952-art-71
- id: m03-l20-q0038
  prompt:
    es: "Un importador paga 20 000 euros por unas mercancías. Hasta el lugar por donde entran en el territorio aduanero de la Unión soporta 2 000 euros de transporte, 300 euros de seguro y 500 euros de carga y manipulación asociadas al transporte. Después de la entrada paga 800 euros por llevarlas a su almacén. Según los artículos 71 y 72 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cuál es el valor en aduana, si no concurre ningún otro elemento?"
  options:
  - id: a
    text:
      es: "23 600 euros: se suma también el transporte realizado después de la entrada en el territorio aduanero."
  - id: b
    text:
      es: "22 300 euros: se suman el transporte y el seguro, pero no la carga ni la manipulación."
  - id: c
    text:
      es: "22 500 euros: se suman el transporte y la carga y manipulación, pero no el seguro."
  - id: d
    correct: true
    text:
      es: "22 800 euros: se suman el transporte, el seguro y la carga y manipulación hasta la entrada, y no el transporte posterior."
  explanation:
    es: "Al precio de 20 000 euros se suman los costes hasta el lugar de entrada: 2 000 de transporte, 300 de seguro y 500 de carga y manipulación, lo que da 22 800 euros. Los 800 euros posteriores a la entrada no se incluyen según el artículo 72.a). Con ellos saldrían 23 600 euros. Sin la carga y la manipulación, 22 300 euros. Sin el seguro, 22 500 euros. El artículo 71.1.e) incluye los tres conceptos."
  citation: "art. 71.1.e) CAU"
  difficulty: 3
  tags:
  - "valor en aduana"
  - "transporte"
  - "cómputo"
# anchor: celex-32013r0952-art-71
- id: m03-l20-q0039
  prompt:
    es: "De acuerdo con el artículo 71, apartado 1, letra e), del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre los elementos que se suman al precio realmente pagado:"
  options:
  - id: a
    text:
      es: "Los gastos de montaje de las máquinas importadas realizados después de su entrada en el territorio aduanero de la Unión."
  - id: b
    text:
      es: "Las comisiones de compra soportadas por el comprador, aunque no estén incluidas en el precio realmente pagado."
  - id: c
    text:
      es: "Los pagos por el derecho de distribución o reventa de las mercancías, aunque no sean condición de la venta."
  - id: d
    correct: true
    text:
      es: "Los gastos de carga y de manipulación asociados al transporte hasta el lugar por donde las mercancías se introducen en el territorio aduanero de la Unión."
  explanation:
    es: "Se suman los gastos de carga y manipulación asociados al transporte hasta el lugar de introducción. Los de montaje posteriores a la entrada, las comisiones de compra y los pagos por el derecho de distribución o reventa que no son condición de la venta son elementos que el artículo 72 excluye del valor en aduana."
  citation: "art. 71.1.e) CAU"
  difficulty: 2
  tags:
  - "valor en aduana"
  - "transporte"
# anchor: celex-32013r0952-art-71
- id: m03-l20-q0041
  prompt:
    es: "Según el artículo 71, apartado 3, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿puede una autoridad aduanera añadir al precio pagado gastos de almacenamiento posteriores a la entrada que no figuran en el artículo 71?"
  options:
  - id: a
    text:
      es: "Sí, porque la lista del artículo 71 es orientativa y la autoridad puede completarla con otros elementos razonables que estime oportunos."
  - id: b
    text:
      es: "Sí, porque los gastos posteriores a la entrada se suman al precio cuando los soporta el comprador."
  - id: c
    text:
      es: "No, porque los gastos de almacenamiento solo se incluyen cuando los soporta el vendedor de las mercancías."
  - id: d
    correct: true
    text:
      es: "No, porque al determinar el valor en aduana solo pueden sumarse al precio los elementos previstos en el artículo 71."
  explanation:
    es: "Solo pueden sumarse los elementos previstos en el artículo 71, y el almacenamiento posterior no figura entre ellos. La lista no es orientativa. Tampoco se suman los gastos posteriores a la entrada por el hecho de que los soporte el comprador: los que el artículo cita llegan hasta el lugar de introducción. Y la razón no es quién soporta el gasto: el criterio del texto es que el elemento esté en el artículo 71."
  citation: "art. 71.3 CAU"
  difficulty: 2
  tags:
  - "valor en aduana"
  - "elementos del valor"
# anchor: celex-32013r0952-art-72
- id: m03-l20-q0042
  prompt:
    es: "¿Cuál de los siguientes elementos NO se incluye en el valor en aduana al aplicar el valor de transacción, de acuerdo con el artículo 72 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión?"
  options:
  - id: a
    text:
      es: "El coste de los envases que, a efectos aduaneros, se considere que forman un todo con la mercancía."
  - id: b
    text:
      es: "El coste de embalaje, en la medida en que lo soporte el comprador y no esté incluido en el precio."
  - id: c
    text:
      es: "Los gastos de seguro de las mercancías importadas hasta el lugar por donde se introducen en el territorio aduanero, soportados por el comprador."
  - id: d
    correct: true
    text:
      es: "Los gastos de montaje de las máquinas importadas realizados después de su entrada en el territorio aduanero de la Unión."
  explanation:
    es: "Los gastos de montaje posteriores a la entrada no se incluyen según el artículo 72.b). El coste de los envases que forman un todo con la mercancía, el de embalaje soportado por el comprador y el seguro hasta el lugar de introducción son elementos que el artículo 71 suma al precio."
  citation: "art. 72 CAU"
  difficulty: 2
  tags:
  - "valor en aduana"
  - "elementos excluidos"
# anchor: celex-32013r0952-art-72
- id: m03-l20-q0043
  prompt:
    es: "Un importador paga 15 000 euros por una máquina vendida para su exportación a la Unión. Tras su entrada en el territorio aduanero de la Unión paga 1 200 euros por el montaje y 300 euros por la asistencia técnica del primer mes. No concurre ningún otro elemento. Según el artículo 72 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, ¿cuál es el valor en aduana?"
  options:
  - id: a
    text:
      es: "16 500 euros, porque se suman los gastos de montaje y de asistencia técnica al precio pagado."
  - id: b
    text:
      es: "16 200 euros, porque se suma el montaje y solo se excluye la asistencia técnica."
  - id: c
    correct: true
    text:
      es: "15 000 euros, porque los gastos de montaje y de asistencia técnica posteriores a la entrada no se incluyen."
  - id: d
    text:
      es: "13 500 euros, porque los gastos posteriores a la entrada se restan del precio pagado."
  explanation:
    es: "El artículo 72.b) excluye del valor en aduana los gastos de montaje y de asistencia técnica realizados después de la entrada, así que el valor es el precio de 15 000 euros. Sumar ambos da 16 500 euros. Sumar solo el montaje da 16 200 euros, y la asistencia técnica también está excluida. Y restar los 1 500 euros del precio daría 13 500 euros, pero excluir un elemento no es restarlo del precio."
  citation: "art. 72 CAU"
  difficulty: 3
  tags:
  - "valor en aduana"
  - "elementos excluidos"
  - "cómputo"
# anchor: celex-32013r0952-art-72
- id: m03-l20-q0044
  prompt:
    es: "De acuerdo con el artículo 72 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, no se incluyen los intereses de un acuerdo de financiación del comprador por escrito, si este demuestra, cuando se requiere:"
  options:
  - id: a
    text:
      es: "Que las mercancías se venden al precio declarado y que el tipo de interés exigido es superior al aplicado corrientemente a tales transacciones."
  - id: b
    correct: true
    text:
      es: "Que las mercancías se venden efectivamente al precio declarado como realmente pagado o por pagar y que el tipo de interés exigido no excede del corriente."
  - id: c
    text:
      es: "Que el acuerdo de financiación fue autorizado por las autoridades aduaneras antes de la importación y fija un tipo de interés invariable."
  - id: d
    text:
      es: "Que los intereses corren a cargo del vendedor y no de otra persona, sin que importe el tipo de interés aplicado."
  explanation:
    es: "Los intereses se excluyen si el acuerdo consta por escrito y, cuando se requiere, el comprador demuestra que las mercancías se venden al precio declarado y que el tipo de interés no excede del corriente. Un tipo superior al corriente no cumple la condición. El texto no exige autorización aduanera previa ni un tipo invariable. Y da igual que la financiación la asuma el vendedor u otra persona."
  citation: "art. 72 CAU"
  difficulty: 3
  tags:
  - "valor en aduana"
  - "elementos excluidos"
# anchor: celex-32013r0952-art-72
- id: m03-l20-q0045
  prompt:
    es: "De acuerdo con el artículo 72 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre los elementos excluidos del valor en aduana:"
  options:
  - id: a
    correct: true
    text:
      es: "Las comisiones de compra no se incluyen en el valor en aduana, a diferencia de las comisiones y los gastos de corretaje."
  - id: b
    text:
      es: "Las comisiones de compra y las de corretaje se suman al precio realmente pagado cuando las soporta el comprador."
  - id: c
    text:
      es: "Los gastos de construcción y de asistencia técnica posteriores a la entrada se suman al precio realmente pagado."
  - id: d
    text:
      es: "Los pagos por el derecho de distribución o reventa se suman siempre al precio realmente pagado, sea cual sea su origen o su cuantía."
  explanation:
    es: "Las comisiones de compra no se incluyen en el valor en aduana, mientras que las comisiones y los gastos de corretaje sí se suman en las condiciones del artículo 71.1.a). Sumar también las de compra contradice esa excepción. Los gastos de construcción y de asistencia técnica posteriores a la entrada están excluidos. Y los pagos por el derecho de distribución o reventa no se incluyen cuando no son condición de la venta."
  citation: "art. 72 CAU"
  difficulty: 2
  tags:
  - "valor en aduana"
  - "elementos excluidos"
# anchor: celex-32013r0952-art-72
- id: m03-l20-q0047
  prompt:
    es: "De acuerdo con el artículo 72 del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, no se incluyen en el valor en aduana los pagos que efectúe el comprador por el derecho de distribución o reventa de las mercancías importadas, cuando:"
  options:
  - id: a
    text:
      es: "Constituyan una condición de la venta de dichas mercancías, aunque se efectúen después de su entrada en la Unión."
  - id: b
    correct: true
    text:
      es: "No constituyan una condición de la venta de dichas mercancías para su exportación a la Unión."
  - id: c
    text:
      es: "Los efectúe el vendedor y no el comprador de las mercancías importadas, en cualquier caso."
  - id: d
    text:
      es: "Superen el valor de transacción de las mercancías importadas, por tratarse de un importe excesivo."
  explanation:
    es: "Los pagos por el derecho de distribución o reventa quedan fuera cuando no constituyen una condición de la venta para su exportación a la Unión. Si fueran condición de la venta, el artículo 71.1.c) los suma. El texto habla de pagos del comprador, no del vendedor, y no tiene en cuenta su cuantía."
  citation: "art. 72 CAU"
  difficulty: 3
  tags:
  - "valor en aduana"
  - "elementos excluidos"
# anchor: celex-32013r0952-art-71
- id: m03-l20-q0048
  prompt:
    es: "De acuerdo con el artículo 71, apartado 1, letra a), del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre el coste de embalaje:"
  options:
  - id: a
    text:
      es: "Se suma siempre al precio, aunque ya esté incluido en el precio realmente pagado."
  - id: b
    text:
      es: "No se suma al precio en ningún caso, porque el embalaje forma parte de las mercancías."
  - id: c
    correct: true
    text:
      es: "Se suma al precio en la medida en que lo soporte el comprador y no esté incluido en el precio realmente pagado."
  - id: d
    text:
      es: "Se suma al precio únicamente cuando lo soporta el vendedor de las mercancías."
  explanation:
    es: "El coste de embalaje se suma en la medida en que lo soporte el comprador y no esté ya incluido en el precio. Sumarlo siempre duplicaría lo que el precio ya recoge. No se excluye en todo caso: el artículo lo recoge entre los elementos que se suman. Y lo relevante es que lo soporte el comprador, no el vendedor."
  citation: "art. 71.1.a) CAU"
  difficulty: 1
  tags:
  - "valor en aduana"
  - "embalaje"
