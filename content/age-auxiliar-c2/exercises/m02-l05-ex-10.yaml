# anchor: fuente-ms-win-firewall-html
- id: m02-l05-q165
  prompt:
    es: "¿Cuál de las siguientes opciones es la diferencia clave entre una red privada y una red pública, según la página de Microsoft sobre el Firewall de Windows?"
  options:
  - id: a
    correct: true
    text:
      es: "Si otros dispositivos de la red pueden ver el dispositivo y, tal vez, conectarse a él."
  - id: b
    text:
      es: "La velocidad de la conexión de la red a Internet que usa el dispositivo conectado."
  - id: c
    text:
      es: "Si la red usa una conexión por cable o una conexión inalámbrica Wi-Fi de la zona."
  - id: d
    text:
      es: "Si el dispositivo tiene activado o no el Firewall de Windows en esa red."
  explanation:
    es: "La página dice: «La diferencia clave es si otros dispositivos de la misma red pueden ver el dispositivo y, tal vez, conectarse a él». No es la velocidad de la conexión, ni si es por cable o por Wi-Fi, ni el estado del firewall."
  citation: "fuente: `ms-win-firewall.html`; «Firewall y protección de red en la aplicación Seguridad de Windows»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-firewall-html
- id: m02-l05-q166
  prompt:
    es: "Según la página de Microsoft sobre el Firewall de Windows, ¿cuál de las siguientes redes es un ejemplo de red pública?"
  options:
  - id: a
    text:
      es: "Una red doméstica con los dispositivos de la familia."
  - id: b
    text:
      es: "Una red de dominio del área de trabajo."
  - id: c
    text:
      es: "Una red de confianza con solo dispositivos conocidos."
  - id: d
    correct: true
    text:
      es: "El Wi-Fi de una cafetería local, con extraños conectados."
  explanation:
    es: "La página dice que «el Wi-Fi en su cafetería local es una red pública», porque la mayoría de los otros dispositivos conectados pertenecen a extraños. La red doméstica es su ejemplo de red privada, las redes de dominio son las del área de trabajo y las redes privadas son las de confianza."
  citation: "fuente: `ms-win-firewall.html`; «Firewall y protección de red en la aplicación Seguridad de Windows»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-firewall-html
- id: m02-l05-q167
  prompt:
    es: "Como norma general, ¿en cuál de los siguientes tipos de red de Windows 11 tendrá el Firewall de Windows controles de seguridad más estrictos, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "En una red privada, por la menor confianza en los demás dispositivos."
  - id: b
    text:
      es: "En ambos tipos de red por igual, sea cual sea la confianza en los demás."
  - id: c
    correct: true
    text:
      es: "En una red pública, por la menor confianza en los demás dispositivos."
  - id: d
    text:
      es: "Solo en la red doméstica, por la presencia de los miembros de la familia."
  explanation:
    es: "La página dice que, como norma general, habrá «controles de seguridad más estrictos en una red pública que en una privada», por el nivel de confianza en las demás personas y dispositivos de esa red. No son iguales en ambas, y la red doméstica es su ejemplo de red privada."
  citation: "fuente: `ms-win-firewall.html`; «Firewall y protección de red en la aplicación Seguridad de Windows»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q240
  prompt:
    es: "Según el glosario de ciberseguridad del INCIBE, ¿a qué otro término remite la entrada del malvertising para su definición?"
  options:
  - id: a
    text:
      es: "Spyware"
  - id: b
    text:
      es: "Ransomware"
  - id: c
    text:
      es: "Backdoor"
  - id: d
    correct: true
    text:
      es: "Adware"
  explanation:
    es: "El glosario define malvertising con la indicación «Véase: Adware». «Spyware» es el programa espía que recopila información del equipo, un término distinto del adware. «Ransomware» es el malware que secuestra el dispositivo a cambio de un rescate, no el término al que remite malvertising. «Backdoor» es la puerta trasera que crea un troyano, no el término al que remite malvertising."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Malvertising»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q241
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde al adware, cuyo sinónimo es malvertising, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    text:
      es: "Software que recopila información del ordenador y la envía a una entidad remota"
  - id: b
    correct: true
    text:
      es: "Software apoyado en anuncios como parte del propio programa"
  - id: c
    text:
      es: "Software que secuestra el dispositivo y pide un rescate para devolver el acceso"
  - id: d
    text:
      es: "Software que se copia a sí mismo y se propaga automáticamente por una red"
  explanation:
    es: "El glosario define el adware como software apoyado en anuncios como parte del propio programa. «Software que recopila información del ordenador y la envía a una entidad remota» es la definición del spyware, no la del adware. «Software que secuestra el dispositivo y pide un rescate para devolver el acceso» es la definición del ransomware, no la del adware. «Software que se copia a sí mismo y se propaga automáticamente por una red» es la definición del gusano, no la del adware."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Adware»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q244
  prompt:
    es: "¿Cuál de las siguientes normas siguen las políticas de seguridad de la información que forman un SGSI, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    text:
      es: "La norma ISO 9001, de gestión de la calidad"
  - id: b
    correct: true
    text:
      es: "La norma ISO/IEC 27001"
  - id: c
    text:
      es: "La norma ISO 14001, de gestión ambiental"
  - id: d
    text:
      es: "La norma ISO/IEC 20000, de gestión de servicios"
  explanation:
    es: "El glosario define el SGSI como conjunto de políticas que siguen la norma ISO/IEC 27001. «La norma ISO 9001, de gestión de la calidad» no es la norma que cita el glosario para el SGSI. «La norma ISO 14001, de gestión ambiental» no es la norma que cita el glosario para el SGSI. «La norma ISO/IEC 20000, de gestión de servicios» no es la norma que cita el glosario para el SGSI. Lo que dice la fuente: «es un conjunto de políticas de seguridad de la información que siguen la norma ISO/IEC 27001»."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «SGSI»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q245
  prompt:
    es: "¿Qué tres propiedades de los activos de información busca asegurar un sistema de gestión de la seguridad de la información (SGSI), según el glosario del INCIBE?"
  options:
  - id: a
    correct: true
    text:
      es: "Confidencialidad, integridad y disponibilidad"
  - id: b
    text:
      es: "Autenticidad, trazabilidad, no repudio y autenticación"
  - id: c
    text:
      es: "Rapidez, capacidad, compatibilidad y velocidad"
  - id: d
    text:
      es: "Cifrado, anonimato, copia de seguridad y registro"
  explanation:
    es: "El glosario dice que busca asegurar confidencialidad, integridad y disponibilidad. «Autenticidad, trazabilidad, no repudio y autenticación» no son las propiedades que cita el glosario para el SGSI. «Rapidez, capacidad, compatibilidad y velocidad» no son las propiedades que cita el glosario para el SGSI. «Cifrado, anonimato, copia de seguridad y registro» no son las propiedades que cita el glosario para el SGSI. Lo que dice la fuente: «buscando asegurar la confidencialidad, integridad y disponibilidad de los activos de información»."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «SGSI»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q246
  prompt:
    es: "¿Qué busca minimizar un SGSI, el conjunto de procesos de una organización para gestionar la accesibilidad de la información, según el glosario del INCIBE?"
  options:
  - id: a
    correct: true
    text:
      es: "Los riesgos de seguridad de la información"
  - id: b
    text:
      es: "Los costes de adquisición de los equipos informáticos"
  - id: c
    text:
      es: "El número de usuarios con acceso a la red corporativa"
  - id: d
    text:
      es: "El tiempo de respuesta de las aplicaciones de la organización"
  explanation:
    es: "El glosario dice que el SGSI minimiza a la vez los riesgos de seguridad de la información. «Los costes de adquisición de los equipos informáticos» no es lo que el glosario dice que minimiza el SGSI. «El número de usuarios con acceso a la red corporativa» no es lo que el glosario dice que minimiza el SGSI. «El tiempo de respuesta de las aplicaciones de la organización» no es lo que el glosario dice que minimiza el SGSI. Lo que dice la fuente: «minimizando a la vez los riesgos de seguridad de la información»."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «SGSI»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q247
  prompt:
    es: "¿Qué causas puede tener una amenaza informática, según la definición del glosario de ciberseguridad del INCIBE sobre las circunstancias desfavorables?"
  options:
  - id: a
    text:
      es: "Solo intencionadas, por la acción de un atacante"
  - id: b
    text:
      es: "Solo técnicas, por fallos del software o del hardware"
  - id: c
    correct: true
    text:
      es: "Naturales, accidentales o intencionadas"
  - id: d
    text:
      es: "Solo humanas, por errores de los usuarios del sistema"
  explanation:
    es: "El glosario dice que puede tener causas naturales, ser accidental o intencionada. «Solo intencionadas, por la acción de un atacante» contradice el glosario, que admite causas naturales y accidentales. «Solo técnicas, por fallos del software o del hardware» contradice el glosario, que cita causas naturales, accidentales o intencionadas. «Solo humanas, por errores de los usuarios del sistema» contradice el glosario, que incluye las causas naturales."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Amenaza»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q248
  prompt:
    es: "¿Cuál de las siguientes consecuencias sobre los activos puede provocar una amenaza cuando ocurre, según el glosario de ciberseguridad del INCIBE?"
  options:
  - id: a
    correct: true
    text:
      es: "Indisponibilidad, mal funcionamiento o pérdida de valor"
  - id: b
    text:
      es: "Aumento de capacidad, mayor rendimiento o ahorro de costes"
  - id: c
    text:
      es: "Cifrado de los datos, firma digital o certificación"
  - id: d
    text:
      es: "Actualización del software, copia de seguridad o restauración"
  explanation:
    es: "El glosario cita la indisponibilidad, el funcionamiento incorrecto o la pérdida de valor. «Aumento de capacidad, mayor rendimiento o ahorro de costes» son efectos positivos, contrarios a las consecuencias negativas del glosario. «Cifrado de los datos, firma digital o certificación» son medidas de protección, no consecuencias de una amenaza. «Actualización del software, copia de seguridad o restauración» son medidas de protección, no consecuencias de una amenaza."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Amenaza»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q250
  prompt:
    es: "Señale qué hace un insider, la persona perteneciente a una organización que se define con ese término, según el glosario de ciberseguridad del INCIBE:"
  options:
  - id: a
    text:
      es: "Investiga un sistema para reportar fallos y prevenir accesos no autorizados"
  - id: b
    text:
      es: "Suplanta a una entidad por correo para conseguir credenciales de usuarios"
  - id: c
    correct: true
    text:
      es: "Divulga información sensible de la empresa de forma intencionada"
  - id: d
    text:
      es: "Promueve una ideología política con ataques a páginas web"
  explanation:
    es: "El glosario define al insider como persona de la organización que divulga información sensible de forma intencionada. «Investiga un sistema para reportar fallos y prevenir accesos no autorizados» es la definición de hacker del glosario, no la de insider. «Suplanta a una entidad por correo para conseguir credenciales de usuarios» es la definición de phishing, no la de insider. «Promueve una ideología política con ataques a páginas web» es la definición del hacktivista, no la de insider."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Insider»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q251
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde al hacker según el glosario de ciberseguridad del INCIBE, que lo define por su conocimiento de las tecnologías?"
  options:
  - id: a
    correct: true
    text:
      es: "Persona que investiga un sistema para reportar fallos de seguridad y prevenir accesos no autorizados"
  - id: b
    text:
      es: "Persona de una organización que divulga información sensible de forma intencionada"
  - id: c
    text:
      es: "Ciberdelincuente que usa sus conocimientos para promover su ideología política"
  - id: d
    text:
      es: "Persona que roba credenciales mediante correos que suplantan a una entidad"
  explanation:
    es: "El glosario describe al hacker como quien investiga sistemas para reportar fallos y prevenir accesos. «Persona de una organización que divulga información sensible de forma intencionada» es la definición de insider, no la de hacker. «Ciberdelincuente que usa sus conocimientos para promover su ideología política» es la definición del hacktivista, no la de hacker. «Persona que roba credenciales mediante correos que suplantan a una entidad» es la acción del phishing, no la definición de hacker."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Hacker»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q254
  prompt:
    es: "¿Cuál de los siguientes programas figura, según el glosario de ciberseguridad del INCIBE, entre los programas maliciosos que caben en la definición de malware?"
  options:
  - id: a
    correct: true
    text:
      es: "Los backdoors"
  - id: b
    text:
      es: "Los cortafuegos"
  - id: c
    text:
      es: "Los antivirus"
  - id: d
    text:
      es: "Los gestores de contraseñas"
  explanation:
    es: "El glosario cita virus, gusanos, troyanos, backdoors y spyware dentro de la definición. «Los cortafuegos» son programas o dispositivos que limitan el tráfico, no programas maliciosos. «Los antivirus» evitan que se ejecute software malicioso, no son malware. «Los gestores de contraseñas» guardan contraseñas cifradas, no son malware."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Malware»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m02-l05-q257
  prompt:
    es: "¿Qué datos busca conseguir el phishing de un usuario al suplantar a una entidad por correo o mensaje instantáneo, según el glosario del INCIBE?"
  options:
  - id: a
    text:
      es: "Su historial de navegación y las cookies del navegador"
  - id: b
    text:
      es: "Las firmas antivirus guardadas en su equipo"
  - id: c
    text:
      es: "La configuración de red de su router doméstico"
  - id: d
    correct: true
    text:
      es: "Sus credenciales o los datos de su tarjeta"
  explanation:
    es: "El glosario dice que busca credenciales o información de la tarjeta de crédito. «Su historial de navegación y las cookies del navegador» no son los datos que el glosario cita como objetivo del phishing. «Las firmas antivirus guardadas en su equipo» no son los datos que el glosario cita como objetivo del phishing. «La configuración de red de su router doméstico» no son los datos que el glosario cita como objetivo del phishing. Lo que dice la fuente: «para conseguir las credenciales o información de»."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «Phishing»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-entra-mfa-html
- id: m02-l05-q261
  prompt:
    es: "¿Cuál de los siguientes métodos de verificación adicional figura entre los que pueden usarse con la autenticación multifactor de Microsoft Entra, según la página?"
  options:
  - id: a
    text:
      es: "El Administrador de tareas de Windows"
  - id: b
    text:
      es: "El Firewall de Windows Defender"
  - id: c
    text:
      es: "El Historial de archivos de Windows"
  - id: d
    correct: true
    text:
      es: "Windows Hello para empresas"
  explanation:
    es: "La página enumera Windows Hello para empresas entre las formas adicionales de verificación. «El Administrador de tareas de Windows» es una herramienta del sistema, no un método de verificación. «El Firewall de Windows Defender» es un cortafuegos, no un método de verificación. «El Historial de archivos de Windows» es una copia de seguridad, no un método de verificación."
  citation: "fuente: `ms-entra-mfa.html`; «Cómo funciona: autenticación multifactor de Microsoft Entra»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-entra-mfa-html
- id: m02-l05-q262
  prompt:
    es: "¿Hay que modificar las aplicaciones y servicios para que usen la autenticación multifactor de Microsoft Entra, según la página de Microsoft sobre cómo funciona?"
  options:
  - id: a
    text:
      es: "Sí, cada aplicación debe incorporar su propio módulo de verificación"
  - id: b
    correct: true
    text:
      es: "No, porque la comprobación forma parte del inicio de sesión de Entra"
  - id: c
    text:
      es: "Sí, pero solo las aplicaciones de Microsoft Office"
  - id: d
    text:
      es: "No, porque la autenticación multifactor solo protege contraseñas locales"
  explanation:
    es: "La página dice que no hay que cambiar las aplicaciones: el desafío se procesa en el inicio de sesión. «Sí, cada aplicación debe incorporar su propio módulo de verificación» contradice la página, que no exige cambios en las aplicaciones. «Sí, pero solo las aplicaciones de Microsoft Office» contradice la página, que no exige cambios en ninguna aplicación. «No, porque la autenticación multifactor solo protege contraseñas locales» no es lo que dice la página, que habla del inicio de sesión de Entra. Lo que dice la fuente: «No es necesario cambiar las aplicaciones y los servicios para usar la autenticación multifactor de Microsoft Entra»."
  citation: "fuente: `ms-entra-mfa.html`; «Cómo funciona: autenticación multifactor de Microsoft Entra»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-update-html
- id: m02-l05-q264
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes rutas permite quitar una actualización instalada, aunque Microsoft no lo recomienda salvo necesidad?"
  options:
  - id: a
    text:
      es: "Windows Update › Pausar actualizaciones › Desinstalar actualizaciones"
  - id: b
    correct: true
    text:
      es: "Windows Update › Historial › Desinstalar actualizaciones"
  - id: c
    text:
      es: "Seguridad de Windows › Protección contra virus y amenazas › Desinstalar"
  - id: d
    text:
      es: "Windows Update › Programar el reinicio › Desinstalar actualizaciones"
  explanation:
    es: "La página da esa ruta para quitar una actualización instalada. «Windows Update › Pausar actualizaciones › Desinstalar actualizaciones» no existe esa ruta: la pausa solo detiene temporalmente las descargas. «Seguridad de Windows › Protección contra virus y amenazas › Desinstalar» es el apartado del antivirus, no el de las actualizaciones. «Windows Update › Programar el reinicio › Desinstalar actualizaciones» no existe esa ruta: programar el reinicio solo fija la hora del reinicio."
  citation: "fuente: `ms-win-update.html`; «Windows Update: Preguntas más frecuentes»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-update-html
- id: m02-l05-q267
  prompt:
    es: "En Windows 11, ¿qué permite definir el usuario para que los reinicios automáticos solo tengan lugar cuando no esté usando el dispositivo, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Las horas de pausa"
  - id: b
    text:
      es: "Las horas de examen"
  - id: c
    correct: true
    text:
      es: "Las horas activas"
  - id: d
    text:
      es: "Las horas de acceso"
  explanation:
    es: "La página indica que las horas activas evitan reinicios automáticos mientras se usa el dispositivo. «Las horas de pausa» no es el ajuste que cita la página para limitar los reinicios automáticos. «Las horas de examen» no es el ajuste que cita la página para limitar los reinicios automáticos. «Las horas de acceso» no es el ajuste que cita la página para limitar los reinicios automáticos. Lo que dice la fuente: «Puedes definir las horas activas para asegurarte de que los reinicios automáticos solo tengan lugar cuando no estés usando el dispositivo»."
  citation: "fuente: `ms-win-update.html`; «Windows Update: Preguntas más frecuentes»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-update-html
- id: m02-l05-q269
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes afirmaciones sobre el consumo de batería de las actualizaciones de Windows es correcta, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Las actualizaciones consumen el doble de batería que el uso normal."
  - id: b
    correct: true
    text:
      es: "Las actualizaciones no gastan más batería que otros procesos del sistema."
  - id: c
    text:
      es: "Las actualizaciones se instalan solo si el dispositivo está enchufado."
  - id: d
    text:
      es: "Las actualizaciones agotan la batería si se instalan en horas activas."
  explanation:
    es: "La página afirma que no consumen más batería que otros procesos típicos. «Las actualizaciones consumen el doble de batería que el uso normal.» contradice la página. «Las actualizaciones se instalan solo si el dispositivo está enchufado.» no es lo que dice la página, que solo recomienda dejarlo enchufado. «Las actualizaciones agotan la batería si se instalan en horas activas.» no es lo que dice la página, que habla de instalar fuera de las horas activas. Lo que dice la fuente: «Las actualizaciones de Windows no consumen más batería que otros procesos típicos del sistema»."
  citation: "fuente: `ms-win-update.html`; «Windows Update: Preguntas más frecuentes»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-firewall-html
- id: m02-l05-q272
  prompt:
    es: "En Windows 11, ¿qué hace el Firewall de Windows para proteger el dispositivo, según la página de Microsoft sobre firewall y protección de red?"
  options:
  - id: a
    text:
      es: "Examina los archivos del equipo en busca de virus y amenazas"
  - id: b
    text:
      es: "Descarga e instala las actualizaciones de seguridad del sistema"
  - id: c
    text:
      es: "Cifra la unidad de disco con una clave del módulo TPM"
  - id: d
    correct: true
    text:
      es: "Filtra el tráfico de red y bloquea accesos no autorizados"
  explanation:
    es: "La página dice que ayuda a proteger el dispositivo filtrando el tráfico y bloqueando el acceso no autorizado. «Examina los archivos del equipo en busca de virus y amenazas» es la función del antivirus, no del firewall. «Descarga e instala las actualizaciones de seguridad del sistema» es la función de Windows Update, no del firewall. «Cifra la unidad de disco con una clave del módulo TPM» es la función de BitLocker, no del firewall."
  citation: "fuente: `ms-win-firewall.html`; «Firewall y protección de red en la aplicación Seguridad de Windows»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-firewall-html
- id: m02-l05-q275
  prompt:
    es: "En Windows 11, ¿qué abre la opción Configuración avanzada de Firewall y protección de red, según la página de Microsoft sobre el Firewall de Windows?"
  options:
  - id: a
    correct: true
    text:
      es: "El clásico firewall de Windows Defender, con reglas de entrada y salida"
  - id: b
    text:
      es: "La lista de las actualizaciones instaladas en el equipo"
  - id: c
    text:
      es: "El examen sin conexión del Antivirus de Microsoft Defender"
  - id: d
    text:
      es: "El administrador de dispositivos con los periféricos conectados"
  explanation:
    es: "La página dice que abre el clásico firewall de Windows Defender con reglas de entrada y salida. «La lista de las actualizaciones instaladas en el equipo» es el historial de Windows Update, no la configuración avanzada del firewall. «El examen sin conexión del Antivirus de Microsoft Defender» es una opción del antivirus, no de la configuración avanzada del firewall. «El administrador de dispositivos con los periféricos conectados» no es lo que abre la configuración avanzada del firewall. Lo que dice la fuente: «Configuración avanzada: Se abrirá el clásico firewall de Windows Defender, herramienta que te permite crear reglas de entrada o salida»."
  citation: "fuente: `ms-win-firewall.html`; «Firewall y protección de red en la aplicación Seguridad de Windows»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-firewall-html
- id: m02-l05-q276
  prompt:
    es: "En Windows 11, ¿qué ejemplo da la página de Microsoft de una red privada, en la que se confía en los demás dispositivos conectados?"
  options:
  - id: a
    correct: true
    text:
      es: "La red doméstica de la familia"
  - id: b
    text:
      es: "El Wi-Fi de una cafetería local"
  - id: c
    text:
      es: "La red de un aeropuerto con acceso libre"
  - id: d
    text:
      es: "El punto de acceso de un hotel para huéspedes"
  explanation:
    es: "La página pone como ejemplo de red privada la red doméstica. «El Wi-Fi de una cafetería local» es el ejemplo de red pública que da la página. «La red de un aeropuerto con acceso libre» no es el ejemplo de red privada que da la página. «El punto de acceso de un hotel para huéspedes» no es el ejemplo de red privada que da la página. Lo que dice la fuente: «Tu red doméstica podría ser un ejemplo de una red privada»."
  citation: "fuente: `ms-win-firewall.html`; «Firewall y protección de red en la aplicación Seguridad de Windows»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-antivirus-html
- id: m02-l05-q277
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones de examen del antivirus examina todos los archivos y programas del dispositivo, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Examen rápido"
  - id: b
    text:
      es: "Examen personalizado"
  - id: c
    text:
      es: "Examen sin conexión"
  - id: d
    correct: true
    text:
      es: "Examen completo"
  explanation:
    es: "La página indica que el examen completo examina todos los archivos y programas del dispositivo. «Examen rápido» es la opción para no dedicar tiempo a revisar todos los archivos y carpetas. «Examen personalizado» examina solo los archivos y carpetas que el usuario selecciona. «Examen sin conexión» se ejecuta tras un reinicio, sin cargar Windows, no recorre todo el dispositivo en línea."
  citation: "fuente: `ms-win-antivirus.html`; «Protección contra amenazas y virus en la aplicación Seguridad de Windows»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-antivirus-html
- id: m02-l05-q278
  prompt:
    es: "En Windows 11, ¿qué opción de examen del antivirus examina solo los archivos y carpetas que selecciona el usuario, según la página de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Examen personalizado"
  - id: b
    text:
      es: "Examen completo del equipo"
  - id: c
    text:
      es: "Examen rápido"
  - id: d
    text:
      es: "Examen programado"
  explanation:
    es: "La página dice que el examen personalizado analiza solo lo que el usuario selecciona. «Examen completo del equipo» examina todos los archivos y programas del dispositivo. «Examen rápido» es la opción corta para quien no quiere ejecutar un examen completo. «Examen programado» no figura entre las opciones de examen de la página. Lo que dice la fuente: «Examen personalizado : examina solo los archivos y carpetas que selecciones»."
  citation: "fuente: `ms-win-antivirus.html`; «Protección contra amenazas y virus en la aplicación Seguridad de Windows»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-antivirus-html
- id: m02-l05-q282
  prompt:
    es: "En Windows 11, ¿qué función de Seguridad de Windows evita que aplicaciones malintencionadas cambien la configuración importante del Antivirus de Microsoft Defender?"
  options:
  - id: a
    text:
      es: "La protección en tiempo real"
  - id: b
    text:
      es: "El acceso controlado a carpetas"
  - id: c
    correct: true
    text:
      es: "La protección contra alteraciones"
  - id: d
    text:
      es: "La protección proporcionada en la nube"
  explanation:
    es: "La página la define como la característica que evita que apps malintencionadas cambien esa configuración. «La protección en tiempo real» supervisa continuamente el dispositivo en busca de amenazas, no protege la configuración. «El acceso controlado a carpetas» protege los archivos de carpetas frente a aplicaciones desconocidas, no la configuración. «La protección proporcionada en la nube» envía información a Microsoft para identificar amenazas, no protege la configuración."
  citation: "fuente: `ms-win-antivirus.html`; «Protección contra amenazas y virus en la aplicación Seguridad de Windows»"
  difficulty: 2
  tags:
  - "concepto"
