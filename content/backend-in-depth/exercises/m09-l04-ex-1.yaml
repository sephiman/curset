- id: m09-l04-q01
  prompt:
    en: In Resilience4j, the immutable `AtomicRateLimiter.State` records data about the last call. Which statement
      about its `activePermissions` field is correct?
  options:
  - id: a
    correct: true
    text:
      en: It counts the available permissions after the last call and can be negative when permissions were reserved
  - id: b
    text:
      en: It holds the cycle number that the last call used
  - id: c
    text:
      en: It holds the number of nanoseconds the last call had to wait for permission
  - id: d
    text:
      en: It never goes below zero, because permissions cannot be reserved ahead of a cycle
  explanation:
    en: '`activePermissions` is the count of available permissions after the last call, and it can be negative if
      some permissions were reserved. The cycle number that the last call used lives in the separate field `activeCycle`.
      The number of nanoseconds to wait for permission lives in the separate field `nanosToWait`. A value that never
      goes below zero is wrong because the field can be negative when some permissions were reserved.'
  citation: resilience4j-ratelimiter#internals
- id: m09-l04-q03
  prompt:
    en: In the `RateLimit-Policy` header field draft, a quota policy item carries several parameters. Which parameter
      is REQUIRED, while the others are OPTIONAL?
  options:
  - id: a
    text:
      en: '`w`, the time window'
  - id: b
    correct: true
    text:
      en: '`q`, the quota allocated by the policy'
  - id: c
    text:
      en: '`qu`, the quota unit'
  - id: d
    text:
      en: '`pk`, the partition key'
  explanation:
    en: The REQUIRED `q` parameter indicates the quota allocated by the policy measured in quota units. The `w`
      parameter is wrong because the time window is conveyed by the OPTIONAL `w` parameter. The `qu` parameter is
      wrong because the quota unit is conveyed by the OPTIONAL `qu` parameter. The `pk` parameter is wrong because
      the partition key is conveyed by the OPTIONAL `pk` parameter.
  citation: ietf-httpapi-ratelimit-headers#content
  extract:
    en: The REQUIRED "q" parameter indicates the quota allocated by this policy measured in quota units.
