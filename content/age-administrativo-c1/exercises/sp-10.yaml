  lesson: m04-l04
  prompt:
    es: "¿Hasta qué fecha puede solicitar Don Gaspar Ibarra Ledesma su reingreso al servicio activo según el Real Decreto 365/1995, de 10 de marzo, para que no se le declare en excedencia voluntaria por interés particular?"
  options:
  - id: a
    text:
      es: "El viernes, 1 de octubre de 2027."
  - id: b
    text:
      es: "El miércoles, 15 de septiembre de 2027."
  - id: c
    correct: true
    text:
      es: "El jueves, 30 de septiembre de 2027."
  - id: d
    text:
      es: "El martes, 30 de noviembre de 2027."
  explanation:
    es: "En la excedencia por prestación de servicios en el sector público, cesado el funcionario como funcionario de carrera o personal laboral fijo, debe pedir el reingreso en el plazo máximo de un mes; si no, se le declara en excedencia voluntaria por interés particular (art. 15.3 RD 365/1995). El mes se cuenta desde el día siguiente al cese y concluye el mismo día del mes de vencimiento o, si no existe, el último del mes (art. 30.4 LPAC): septiembre no tiene día 31 y el plazo acaba el jueves, 30 de septiembre de 2027, hábil. La fecha del viernes, 1 de octubre de 2027, pasa el último día del mes. La del miércoles, 15 de septiembre de 2027, cuenta quince días. La del martes, 30 de noviembre de 2027, cuenta tres meses."
  citation: "art. 15.3 RD 365/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1995-8729-art-56
- id: q14
  lesson: m04-l05
  prompt:
    es: "Según el Real Decreto 364/1995, de 10 de marzo, ¿hasta qué fecha, sin prórroga, debe efectuarse el nombramiento en la libre designación de la Subdirección General convocada por el FEGA?"
  options:
  - id: a
    correct: true
    text:
      es: "El lunes, 30 de agosto de 2027."
  - id: b
    text:
      es: "El domingo, 29 de agosto de 2027."
  - id: c
    text:
      es: "El miércoles, 29 de septiembre de 2027."
  - id: d
    text:
      es: "El viernes, 13 de agosto de 2027."
  explanation:
    es: "Los nombramientos de libre designación se hacen en el plazo máximo de un mes contado desde la finalización del de presentación de solicitudes, prorrogable hasta un mes más (art. 56.1 RD 364/1995). Las solicitudes terminan el jueves, 29 de julio de 2027, y el mes acaba el domingo, 29 de agosto; como es inhábil, pasa al lunes, 30 de agosto de 2027 (art. 30.5 LPAC), pues agosto es hábil en el procedimiento administrativo. La fecha del domingo, 29 de agosto de 2027, no prorroga el último día inhábil. La del miércoles, 29 de septiembre de 2027, suma la prórroga de un mes, que el artículo solo permite y aquí no consta. La del viernes, 13 de agosto de 2027, cuenta quince días naturales."
  citation: "art. 56.1 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-11719-art-48
- id: q15
  lesson: m04-l05
  prompt:
    es: "¿Cuántos días de permiso corresponden a Doña Valeria Cortés Ugarte por la hospitalización de su suegro, conforme al texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre?"
  options:
  - id: a
    text:
      es: "Cuatro días hábiles, por ser un familiar de segundo grado por afinidad."
  - id: b
    text:
      es: "Cinco días naturales, por ser un pariente de primer grado por afinidad."
  - id: c
    text:
      es: "Tres días hábiles, porque el permiso solo cubre a los hijos y al cónyuge."
  - id: d
    correct: true
    text:
      es: "Cinco días hábiles, por ser el suegro un pariente de primer grado por afinidad."
  explanation:
    es: "Por accidente o enfermedad graves, hospitalización o intervención quirúrgica con reposo domiciliario del cónyuge, la pareja de hecho o parientes hasta el primer grado por consanguinidad o afinidad, el permiso es de cinco días hábiles (art. 48.a) TREBEP); el suegro es pariente de primer grado por afinidad. La opción de cuatro días hábiles es la de los familiares de segundo grado. La de cinco días naturales cambia hábiles por naturales. La de tres días hábiles restringe el permiso a los hijos y al cónyuge, cuando la ley incluye a los parientes hasta el primer grado por afinidad."
  citation: "art. 48.a) TREBEP"
  difficulty: 1
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2015-11719-art-98
- id: q16
  lesson: m04-l06
  prompt:
    es: "Según el artículo 98.3 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, ¿hasta qué fecha puede mantenerse, como máximo, la suspensión provisional de Don Cristóbal Aranda Ferrer, salvo paralización imputable a él?"
  options:
  - id: a
    text:
      es: "El lunes, 28 de febrero de 2028."
  - id: b
    correct: true
    text:
      es: "El martes, 29 de febrero de 2028."
  - id: c
    text:
      es: "El miércoles, 1 de marzo de 2028."
  - id: d
    text:
      es: "El sábado, 26 de febrero de 2028."
  explanation:
    es: "La suspensión provisional como medida cautelar en un expediente disciplinario no puede exceder de seis meses, salvo paralización imputable al interesado (art. 98.3 TREBEP). Los plazos en meses concluyen el mismo día del mes de vencimiento o, si no existe, el último del mes (art. 30.4 LPAC): febrero de 2028 no tiene día 30 y, por ser bisiesto, termina el día 29. El plazo acaba el martes, 29 de febrero de 2028. La fecha del lunes, 28 de febrero de 2028, olvida que 2028 es bisiesto. La del miércoles, 1 de marzo de 2028, pasa al mes siguiente. La del sábado, 26 de febrero de 2028, cuenta 180 días."
  citation: "art. 98.3 TREBEP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2003-21614-art-63
- id: q17
  lesson: m05-l02
  prompt:
    es: "¿A quién corresponde autorizar la transferencia de crédito que proyecta la Presidencia del FEGA, según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "A la persona titular del Ministerio de Hacienda, que autoriza todas las transferencias de los organismos autónomos."
  - id: b
    text:
      es: "Al Consejo de Ministros, por afectar la transferencia al presupuesto de un organismo autónomo."
  - id: c
    text:
      es: "A la persona titular del Ministerio de Agricultura, Pesca y Alimentación, por ser el departamento de adscripción."
  - id: d
    correct: true
    text:
      es: "A la Presidencia del FEGA, que ejerce en su presupuesto las competencias que la ley da a los ministros."
  explanation:
    es: "Los presidentes y directores de los organismos autónomos ejercen, en sus presupuestos, las competencias que la ley da a los ministros, que pueden avocarlas (art. 63.2 LGP). Una transferencia entre créditos de un mismo programa que no afecta a personal es de las que autoriza el titular del ministerio con informe favorable de la Intervención Delegada (art. 63.1.a), y en un organismo autónomo la autoriza su Presidencia, ya que el Ministerio no avoca. La opción del Ministerio de Hacienda se refiere a las que el departamento no puede acordar, como las que afectan a personal (art. 62.1.a). La del Consejo de Ministros recoge supuestos reservados, como las transferencias entre secciones por reorganización. La del Ministerio de Agricultura, Pesca y Alimentación solo valdría si avocara."
  citation: "art. 63.2 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1996-1578-art-13
- id: q25
  lesson: m05-l03
  prompt:
    es: "¿Hasta qué fecha debe fiscalizar la Intervención Delegada el expediente de gasto del convenio, conforme al Real Decreto 2188/1995, de 28 de diciembre, por el que se desarrolla el régimen del control interno ejercido por la Intervención General de la Administración del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "El jueves, 4 de noviembre de 2027."
  - id: b
    text:
      es: "El miércoles, 3 de noviembre de 2027."
  - id: c
    text:
      es: "El viernes, 12 de noviembre de 2027."
  - id: d
    text:
      es: "El viernes, 19 de noviembre de 2027."
  explanation:
    es: "La Intervención fiscaliza el expediente en un plazo máximo de 10 días contado desde el siguiente a la recepción, que se reduce a cinco cuando se ha declarado urgente la tramitación (art. 13.2 RD 2188/1995); los días son hábiles (art. 30.2 LPAC). Se cuentan desde el jueves, 28 de octubre de 2027: el 28 y el 29 son 2, el lunes, 1 de noviembre, es festivo y del martes 2 al jueves 4 van los 3 restantes. Termina el jueves, 4 de noviembre de 2027. La fecha del miércoles, 3 de noviembre de 2027, no descuenta el festivo del 1 de noviembre. La del viernes, 12 de noviembre de 2027, aplica los diez días de la tramitación ordinaria. La del viernes, 19 de noviembre de 2027, aplica quince días hábiles, el plazo de la discrepancia."
  citation: "art. 13.2 RD 2188/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1996-1578-art-16
- id: q19
  lesson: m05-l03
  prompt:
    es: "Señale la respuesta correcta sobre la fecha hasta la que puede el FEGA plantear la discrepancia por el reparo que no acepta, según el Real Decreto 2188/1995, de 28 de diciembre:"
  options:
  - id: a
    text:
      es: "El martes, 7 de diciembre de 2027."
  - id: b
    text:
      es: "El miércoles, 1 de diciembre de 2027."
  - id: c
    correct: true
    text:
      es: "El jueves, 9 de diciembre de 2027."
  - id: d
    text:
      es: "El martes, 30 de noviembre de 2027."
  explanation:
    es: "El órgano gestor que no acepta el reparo plantea la discrepancia a la Intervención en el plazo de quince días (art. 16.1 RD 2188/1995), hábiles (art. 30.2 LPAC). Se cuentan desde el miércoles, 17 de noviembre de 2027: del 17 al 19 van 3, del lunes 22 al viernes 26 van 8, del lunes 29 de noviembre al viernes 3 de diciembre van 13, el lunes 6 es festivo, el martes 7 es el 14, el miércoles 8 es festivo y el jueves 9 es el 15. Termina el jueves, 9 de diciembre de 2027. La fecha del martes, 7 de diciembre de 2027, no descuenta los festivos del 6 y el 8 de diciembre. La del miércoles, 1 de diciembre de 2027, cuenta quince días naturales. La del martes, 30 de noviembre de 2027, aplica diez días hábiles."
  citation: "art. 16.1 RD 2188/1995"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2003-21614-art-156
- id: q20
  lesson: m05-l03
  prompt:
    es: "Según el artículo 156.1 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, omitida la fiscalización previa preceptiva del gasto de la campaña de divulgación, el FEGA:"
  options:
  - id: a
    text:
      es: "Puede reconocer la obligación, pero no tramitar el pago hasta que se subsane la omisión."
  - id: b
    correct: true
    text:
      es: "No puede reconocer la obligación ni tramitar el pago mientras no se subsane la omisión del trámite."
  - id: c
    text:
      es: "Debe declarar nulo de pleno derecho el contrato con la agencia y suspender la campaña."
  - id: d
    text:
      es: "Puede tramitar el pago si su Presidencia asume por escrito la responsabilidad del gasto."
  explanation:
    es: "Si la función interventora era preceptiva y se omitió, no se puede reconocer la obligación, ni tramitar el pago, ni intervenir favorablemente estas actuaciones hasta que se subsane la omisión (art. 156.1 LGP). La opción que permite reconocer la obligación solo frena el pago y deja pasar un paso que la ley también bloquea. La de la nulidad de pleno derecho del contrato y la suspensión de la campaña inventa un efecto que el artículo no prevé. La de la responsabilidad asumida por la Presidencia no sustituye la subsanación."
  citation: "art. 156.1 LGP"
  difficulty: 1
  tags:
  - "efecto"
  - "procedimiento"
