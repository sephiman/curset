# anchor: fuente-ms-win-menu-inicio-html
- id: m02-l06-q147
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones hay que seleccionar, tras hacer clic con el botón derecho en un elemento anclado, para quitarlo del menú Inicio?"
  options:
  - id: a
    text:
      es: "Desanclar de la barra de tareas"
  - id: b
    correct: true
    text:
      es: "Desanclar de Inicio"
  - id: c
    text:
      es: "Desanclar del acceso rápido"
  - id: d
    text:
      es: "Anclar a Inicio"
  explanation:
    es: "La página dice que, para quitar una aplicación anclada o un acceso directo del menú Inicio, se hace clic con el botón derecho y se selecciona Desanclar de Inicio. Desanclar de la barra de tareas quita un icono de la barra, Desanclar del acceso rápido una carpeta del Acceso rápido y Anclar a Inicio hace lo contrario."
  citation: "fuente: `ms-win-menu-inicio.html`; «Desanclar un elemento del menú Inicio»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-menu-inicio-html
- id: m02-l06-q148
  prompt:
    es: "En el menú Inicio de Windows 11, el orden de los elementos anclados se cambia:"
  options:
  - id: a
    text:
      es: "seleccionando Mostrar todo en la sección Anclados"
  - id: b
    correct: true
    text:
      es: "arrastrando el elemento desde su posición actual a otra"
  - id: c
    text:
      es: "eligiendo la vista Categoría en la sección Todas"
  - id: d
    text:
      es: "arrastrando el elemento sobre otro elemento anclado"
  explanation:
    es: "La página dice que, para cambiar el orden de las chinchetas, se arrastra la chincheta desde su posición actual a otra. Mostrar todo expande la sección, la vista Categoría es de Todas y arrastrar un elemento sobre otro crea una carpeta."
  citation: "fuente: `ms-win-menu-inicio.html`; «Reorganizar y agrupar las chinchetas»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-menu-inicio-html
- id: m02-l06-q150
  prompt:
    es: "En Windows 11, ¿cómo se eligen las carpetas que aparecen junto al botón de encendido del menú Inicio?"
  options:
  - id: a
    text:
      es: "Con clic derecho en la barra de tareas, Configuración de la barra de tareas y Comportamientos"
  - id: b
    text:
      es: "Con clic derecho en un elemento anclado y Anclar a Inicio"
  - id: c
    text:
      es: "Con clic derecho en una carpeta del Explorador y Anclar a acceso rápido"
  - id: d
    correct: true
    text:
      es: "Con clic derecho en la parte inferior del menú Inicio, Configuración de Inicio y Carpetas"
  explanation:
    es: "La página dice que se selecciona Inicio, se hace clic con el botón derecho en la parte inferior del menú Inicio, se elige Configuración de Inicio y, en Carpetas, se activan las que se quieren junto al botón de Inicio/Apagado. Los comportamientos de la barra de tareas sirven para la alineación, y Anclar a Inicio y Anclar a acceso rápido anclan elementos."
  citation: "fuente: `ms-win-menu-inicio.html`; «Personalizar el área de cuenta»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-menu-inicio-html
- id: m02-l06-q206
  prompt:
    es: "En Windows 11, ¿cómo se crea una carpeta de chinchetas en el menú Inicio con las aplicaciones y los sitios web anclados?"
  options:
  - id: a
    text:
      es: "Seleccionando «Mostrar todo» en la sección de chinchetas"
  - id: b
    correct: true
    text:
      es: "Arrastrando un elemento anclado sobre otro"
  - id: c
    text:
      es: "Haciendo clic con el botón derecho en un elemento y eligiendo «Anclar a Inicio»"
  - id: d
    text:
      es: "Arrastrando un elemento anclado fuera del menú Inicio"
  explanation:
    es: "Para crear una carpeta se arrastra un elemento anclado sobre otro; la carpeta se crea automáticamente y se le puede cambiar el nombre. «Haciendo clic con el botón derecho en un elemento y eligiendo «Anclar a Inicio»»: así se ancla un elemento al menú Inicio, no se crea una carpeta. «Seleccionando «Mostrar todo» en la sección de chinchetas»: «Mostrar todo» deja expandida la sección de anclados la próxima vez que se abra Inicio. «Arrastrando un elemento anclado fuera del menú Inicio»: para quitar una chincheta de una carpeta se abre la carpeta y se arrastra la chincheta fuera de ella."
  citation: "fuente: `ms-win-menu-inicio.html`; «Para crear una carpeta, arrastre un elemento anclado sobre otro para crear una carpeta.»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q151
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes métodos abreviados de teclado con la tecla Windows abre Microsoft Copilot, según la tabla de métodos abreviados?"
  options:
  - id: a
    text:
      es: "Windows+S"
  - id: b
    text:
      es: "Windows+H"
  - id: c
    correct: true
    text:
      es: "Windows+C"
  - id: d
    text:
      es: "Windows+V"
  explanation:
    es: "La tabla de la tecla Windows asigna a Windows+C «Abre Microsoft Copilot o Microsoft 365 Copilot». Windows+S abre la búsqueda, Windows+H abre el dictado por voz y Windows+V abre el historial del Portapapeles."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-copilot-windows-html
- id: m02-l06-q152
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones inicia la aplicación Copilot desde el teclado, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "La tecla Windows sola, sin combinar con otra"
  - id: b
    correct: true
    text:
      es: "La tecla Copilot del teclado"
  - id: c
    text:
      es: "La combinación Ctrl+Esc"
  - id: d
    text:
      es: "La combinación Windows+Z"
  explanation:
    es: "La página dice que Copilot se inicia presionando la tecla Copilot del teclado o con Windows+C. La tecla Windows sola abre o cierra el menú Inicio, Ctrl+Esc abre el menú Inicio y Windows+Z abre los diseños de ajuste."
  citation: "fuente: `ms-copilot-windows.html`; «Presione la tecla Copilot del teclado.»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-copilot-windows-html
- id: m02-l06-q153
  prompt:
    es: "En Windows 11, ¿qué puede iniciar el método abreviado de teclado de Copilot, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "La aplicación completa o solo una vista rápida más pequeña"
  - id: b
    text:
      es: "Solo la aplicación completa, siempre en pantalla completa"
  - id: c
    text:
      es: "Solo una vista rápida, nunca la aplicación completa"
  - id: d
    text:
      es: "Solo el chat de Copilot dentro del navegador Edge"
  explanation:
    es: "La página dice que la tecla de método abreviado de Windows puede iniciar la aplicación completa o solo una vista rápida más pequeña, y que se configura en los métodos abreviados de teclado de Copilot de la cuenta. Las otras opciones restringen el resultado a una sola forma."
  citation: "fuente: `ms-copilot-windows.html`; «Abrir Copilot con una tecla de método abreviado de Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-copilot-windows-html
- id: m02-l06-q154
  prompt:
    es: "Señale la afirmación correcta sobre la aplicación Copilot en los equipos con Windows 11, según la ayuda de Microsoft:"
  options:
  - id: a
    text:
      es: "Solo se puede obtener descargándola de la Microsoft Store, en cualquier equipo"
  - id: b
    text:
      es: "Solo se abre con la tecla Copilot, sin otra combinación de teclas"
  - id: c
    text:
      es: "Solo funciona con una cuenta profesional o educativa de Microsoft 365"
  - id: d
    correct: true
    text:
      es: "En equipos nuevos viene instalada, anclada a la barra de tareas o en el menú Inicio"
  explanation:
    es: "La página dice que en equipos nuevos con Windows 11 la aplicación ya debería estar instalada, anclada a la barra de tareas o en el menú Inicio, que se descarga de la Microsoft Store si aún no está, que también se abre con Windows+C y que se inicia sesión con una cuenta profesional o educativa o con una cuenta personal."
  citation: "fuente: `ms-copilot-windows.html`; «En equipos nuevos con Windows 11, la aplicación Copilot ya debería estar instalada de forma predeterminada. Puede encontrar la aplicación Copilot anclada a la barra de tareas o en el menú Inicio.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-copilot-windows-html
- id: m02-l06-q155
  prompt:
    es: "¿En qué ruta de la aplicación Configuración de Windows 11 se configura el botón de acceso directo del lápiz para que abra Copilot?"
  options:
  - id: a
    text:
      es: "Configuración › Sistema › Multitarea › Escritorios"
  - id: b
    text:
      es: "Configuración › Sistema › Notificaciones › No molestar"
  - id: c
    correct: true
    text:
      es: "Configuración › Bluetooth & dispositivos › Lápiz & Windows Ink"
  - id: d
    text:
      es: "Configuración › Cuentas › Opciones de inicio de sesión › Windows Hello"
  explanation:
    es: "La página indica que se va a Configuración › Bluetooth & dispositivos › Lápiz & Windows Ink, se busca Elija qué hace el botón de acceso directo y se selecciona Igual que la clave Copilot. Las demás rutas son las de Escritorios, que decide las ventanas de la barra de tareas con varios escritorios, No molestar, que silencia notificaciones, y Windows Hello, del inicio de sesión."
  citation: "fuente: `ms-copilot-windows.html`; «Abrir Copilot con un botón de acceso directo de lápiz para Windows»"
  difficulty: 2
  tags:
  - "ofimática-menú"
  - "configuración"
# anchor: fuente-ms-learn-ia-generativa-html
- id: m02-l06-q174
  prompt:
    es: "Según Microsoft Learn, ¿qué ocurre cuando se introduce dos veces la misma entrada en un modelo de inteligencia artificial generativa?"
  options:
  - id: a
    text:
      es: "Devuelve la misma salida solo si la entrada es texto y no si es una imagen o un audio"
  - id: b
    text:
      es: "Devuelve siempre la misma salida, porque repite el patrón que aprendió durante el entrenamiento"
  - id: c
    text:
      es: "Genera de nuevo la misma salida, porque el modelo guarda las respuestas anteriores a cada entrada"
  - id: d
    correct: true
    text:
      es: "No genera la misma salida, porque está diseñado para producir contenido único"
  explanation:
    es: "Los modelos de IA generativa están diseñados para generar contenido único, así que no generan la misma salida para entradas idénticas, sea cual sea el formato. El modelo no guarda respuestas: usa los patrones del entrenamiento para construir cada salida, y esto vale tanto para texto como para imágenes o audio."
  citation: "fuente: `ms-learn-ia-generativa.html`; «Cómo funciona la IA generativa»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-learn-ia-generativa-html
- id: m02-l06-q175
  prompt:
    es: "En una aplicación de IA generativa que usa lenguaje natural como entrada, ¿qué ocurre cuando la salida es audio o imágenes, según Microsoft Learn?"
  options:
  - id: a
    text:
      es: "Se recupera de Internet un archivo ya existente que coincida con lo que se ha pedido"
  - id: b
    text:
      es: "El modelo de lenguaje genera también ese formato por sí solo, igual que genera el texto"
  - id: c
    correct: true
    text:
      es: "Modelos adicionales aportan los datos y patrones para generar salidas en ese formato"
  - id: d
    text:
      es: "La aplicación sustituye la salida por una descripción en texto del audio o de la imagen pedidos"
  explanation:
    es: "Si la salida es texto, el LLM la genera por sí solo; si es audio o imágenes, modelos adicionales aportan los datos y patrones de ese formato. La salida es contenido generado en ese formato, no una descripción en texto, y es contenido nuevo, no un archivo recuperado de Internet."
  citation: "fuente: `ms-learn-ia-generativa.html`; «Cómo funciona la IA generativa»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-copilot-introduccion-html
- id: m02-l06-q176
  prompt:
    es: "Según Microsoft, ¿en qué se basan todas las experiencias de Microsoft Copilot para comprender y generar lenguaje natural?"
  options:
  - id: a
    text:
      es: "En macros grabadas por el administrador de la organización"
  - id: b
    text:
      es: "En reglas fijas que asocian cada pregunta con una respuesta guardada"
  - id: c
    correct: true
    text:
      es: "En modelos de lenguaje de gran tamaño (LLM)"
  - id: d
    text:
      es: "En un motor de búsqueda que solo devuelve una lista de enlaces"
  explanation:
    es: "Todas las experiencias de Copilot están impulsadas por modelos de lenguaje de gran tamaño (LLM) para comprender y generar lenguaje natural. Una tabla de respuestas guardadas y una lista de enlaces no generan lenguaje natural, y las macros no son un modelo de lenguaje."
  citation: "fuente: `ms-copilot-introduccion.html`; «Introducción a Microsoft Copilot»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-copilot-windows-html
- id: m02-l06-q177
  prompt:
    es: "Si la aplicación Microsoft Copilot aún no está en un PC con Windows, ¿desde dónde indica Microsoft que se descarga?"
  options:
  - id: a
    text:
      es: "App Store de Apple"
  - id: b
    correct: true
    text:
      es: "Microsoft Store"
  - id: c
    text:
      es: "Samsung Galaxy Store"
  - id: d
    text:
      es: "Google Play"
  explanation:
    es: "La página manda descargar la aplicación Copilot de la Microsoft Store. Google Play y Samsung Galaxy Store figuran en la página de Enlace Móvil como orígenes de la aplicación para Android, y la App Store como origen de la de iPhone."
  citation: "fuente: `ms-copilot-windows.html`; «Acceso a Microsoft Copilot en Windows»"
  difficulty: 1
  tags:
  - "concepto"
