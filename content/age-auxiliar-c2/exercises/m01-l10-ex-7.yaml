# anchor: celex-12016e-txt-art-260
- id: m01-l10-q131
  prompt:
    es: "Señale qué podrá imponer el Tribunal de Justicia de la Unión Europea al Estado miembro cuando declare que ha incumplido su sentencia, de acuerdo con el artículo 260.2 del Tratado de Funcionamiento de la Unión Europea:"
  options:
  - id: a
    correct: true
    text:
      es: "El pago de una suma a tanto alzado o de una multa coercitiva."
  - id: b
    text:
      es: "La suspensión de su derecho de voto en el Consejo."
  - id: c
    text:
      es: "La retirada de su juez del Tribunal de Justicia."
  - id: d
    text:
      es: "La anulación de los actos nacionales contrarios al Derecho de la Unión."
  explanation:
    es: "El Tribunal puede imponer el pago de una suma a tanto alzado o de una multa coercitiva. La suspensión del derecho de voto, la retirada del juez nacional y la anulación de actos nacionales no son sanciones que el artículo prevea."
  citation: "art. 260.2 TFUE"
  difficulty: 3
  tags:
  - "efecto"
# anchor: celex-12016e-txt-art-263
- id: m01-l10-q132
  prompt:
    es: "Según el artículo 263 del Tratado de Funcionamiento de la Unión Europea, el Tribunal de Justicia de la Unión Europea controla la legalidad de los actos del Parlamento Europeo y del Consejo Europeo:"
  options:
  - id: a
    text:
      es: "Cualquiera que sea su naturaleza."
  - id: b
    text:
      es: "Que sean recomendaciones o dictámenes."
  - id: c
    text:
      es: "Solo si afectan a más de un Estado miembro."
  - id: d
    correct: true
    text:
      es: "Destinados a producir efectos jurídicos frente a terceros."
  explanation:
    es: "Controla los actos del Parlamento y del Consejo Europeo destinados a producir efectos jurídicos frente a terceros. No controla todos los actos sin distinción. Las recomendaciones y dictámenes quedan fuera cuando son del Consejo, la Comisión o el Banco Central Europeo, y el control no depende de que afecten a más de un Estado."
  citation: "art. 263 TFUE"
  difficulty: 3
  tags:
  - "competencia"
# anchor: celex-12016e-txt-art-263
- id: m01-l10-q133
  prompt:
    es: "De acuerdo con el artículo 263 del Tratado de Funcionamiento de la Unión Europea, el Tribunal controla la legalidad de los actos del Consejo, de la Comisión y del Banco Central Europeo, con excepción de:"
  options:
  - id: a
    text:
      es: "Los reglamentos."
  - id: b
    text:
      es: "Las decisiones."
  - id: c
    correct: true
    text:
      es: "Las recomendaciones y los dictámenes."
  - id: d
    text:
      es: "Los actos legislativos."
  explanation:
    es: "Quedan fuera del control las recomendaciones y los dictámenes. Los reglamentos, las decisiones y los actos legislativos son actos que el Tribunal sí controla."
  citation: "art. 263 TFUE"
  difficulty: 3
  tags:
  - "excepción"
# anchor: celex-12016e-txt-art-264
- id: m01-l10-q134
  prompt:
    es: "Señale qué hará el Tribunal de Justicia de la Unión Europea si el recurso de anulación fuere fundado, conforme al artículo 264 del Tratado de Funcionamiento de la Unión Europea:"
  options:
  - id: a
    text:
      es: "Modificará el acto impugnado en lo que proceda."
  - id: b
    correct: true
    text:
      es: "Declarará nulo y sin valor ni efecto alguno el acto impugnado."
  - id: c
    text:
      es: "Suspenderá el acto hasta que la institución lo rectifique."
  - id: d
    text:
      es: "Devolverá el acto a la institución para que dicte otro."
  explanation:
    es: "Si el recurso es fundado, el Tribunal declara nulo el acto impugnado. No lo modifica, ni lo suspende hasta su rectificación, ni lo devuelve a la institución autora."
  citation: "art. 264 TFUE"
  difficulty: 1
  tags:
  - "efecto"
# anchor: celex-12016m-txt-art-19
- id: m01-l10-q137
  prompt:
    es: "Conforme al artículo 19.1 del Tratado de la Unión Europea, el Tribunal de Justicia de la Unión Europea, que comprende el Tribunal de Justicia, el Tribunal General y los tribunales especializados, garantizará:"
  options:
  - id: a
    text:
      es: "La ejecución del presupuesto y la gestión de los programas."
  - id: b
    text:
      es: "La definición de las orientaciones y prioridades políticas generales de la Unión."
  - id: c
    correct: true
    text:
      es: "El respeto del Derecho en la interpretación y aplicación de los Tratados."
  - id: d
    text:
      es: "La coherencia de los trabajos de las demás formaciones del Consejo."
  explanation:
    es: "El artículo 19.1 encarga al Tribunal garantizar el respeto del Derecho en la interpretación y aplicación de los Tratados. Ejecutar el presupuesto y gestionar los programas es función de la Comisión, según el artículo 17.1. Definir las orientaciones y prioridades políticas generales es función del Consejo Europeo, según el artículo 15.1. Velar por la coherencia de los trabajos de las demás formaciones corresponde al Consejo de Asuntos Generales, según el artículo 16.6."
  citation: "art. 19.1 TUE"
  difficulty: 1
  tags:
  - "competencia"
