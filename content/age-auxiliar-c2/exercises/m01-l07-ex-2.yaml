# anchor: boe-a-2013-12887-art-17
- id: m01-l07-q018
  prompt:
    es: "¿A quién debe dirigirse la solicitud de acceso a la información pública que posee un órgano administrativo, conforme a la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "Al Consejo de Transparencia y Buen Gobierno, que la remitirá al órgano competente"
  - id: b
    text:
      es: "Al Ministerio para la Transformación Digital y de la Función Pública, en todo caso"
  - id: c
    text:
      es: "Al Defensor del Pueblo, que la tramitará como una queja"
  - id: d
    correct: true
    text:
      es: "Al titular del órgano administrativo o entidad que posea la información"
  explanation:
    es: "El artículo 17.1 dice que la solicitud «deberá dirigirse al titular del órgano administrativo o entidad que posea la información». El Consejo de Transparencia y Buen Gobierno interviene después, si hay reclamación (art. 24). Ningún ministerio centraliza las solicitudes, y el Defensor del Pueblo no las tramita."
  citation: "art. 17.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2013-12887-art-17
- id: m01-l07-q019
  prompt:
    es: "De acuerdo con el artículo 17 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, en relación con los motivos de la solicitud de acceso a la información pública:"
  options:
  - id: a
    text:
      es: "El solicitante debe motivar su solicitud, salvo que la información ya esté publicada"
  - id: b
    text:
      es: "El solicitante debe acreditar un interés legítimo y directo en la información"
  - id: c
    correct: true
    text:
      es: "El solicitante no está obligado a motivar su solicitud de acceso"
  - id: d
    text:
      es: "El solicitante debe motivar su solicitud cuando afecte a datos de terceros"
  explanation:
    es: "El artículo 17.3 empieza así: «El solicitante no está obligado a motivar su solicitud de acceso a la información». La ley no hace excepciones por que la información esté publicada o afecte a terceros. Tampoco exige un interés legítimo: el derecho es de todas las personas (art. 12)."
  citation: "art. 17.3 Ley 19/2013"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-17
- id: m01-l07-q020
  prompt:
    es: "Según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, la ausencia de motivación en una solicitud de acceso a la información pública:"
  options:
  - id: a
    text:
      es: "Será causa de inadmisión a trámite mediante resolución motivada"
  - id: b
    correct: true
    text:
      es: "No será por sí sola causa de rechazo de la solicitud"
  - id: c
    text:
      es: "Obligará a requerir al solicitante para que la motive en diez días"
  - id: d
    text:
      es: "Suspenderá el plazo para resolver hasta que el solicitante la subsane"
  explanation:
    es: "El artículo 17.3 dice que «la ausencia de motivación no será por si sola causa de rechazo de la solicitud». No está entre las causas de inadmisión del artículo 18.1. El requerimiento de diez días del artículo 19.2 es para concretar una solicitud que no identifica bien la información, no para motivarla. Por lo mismo, no suspende el plazo para resolver."
  citation: "art. 17.3 Ley 19/2013"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2013-12887-art-17
- id: m01-l07-q021
  prompt:
    es: "¿En qué lengua pueden los solicitantes de información dirigirse a las Administraciones Públicas, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "Exclusivamente en castellano, como lengua española oficial del Estado"
  - id: b
    text:
      es: "En castellano o en la lengua cooficial del lugar de residencia del solicitante"
  - id: c
    text:
      es: "En cualquiera de las lenguas oficiales de la Unión Europea"
  - id: d
    correct: true
    text:
      es: "En cualquiera de las lenguas cooficiales del Estado en el territorio en el que radique la Administración"
  explanation:
    es: "El artículo 17.4 permite dirigirse a las Administraciones «en cualquiera de las lenguas cooficiales del Estado en el territorio en el que radique la Administración en cuestión». No se limita al castellano. El criterio es el territorio de la Administración, no la residencia del solicitante. La ley no menciona las lenguas oficiales de la Unión Europea."
  citation: "art. 17.4 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-18
- id: m01-l07-q022
  prompt:
    es: "¿Cuál de las siguientes solicitudes de acceso a la información pública se inadmitirá a trámite, según la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno?"
  options:
  - id: a
    text:
      es: "La que no exponga los motivos por los que se solicita la información"
  - id: b
    text:
      es: "La que se presente en una lengua cooficial distinta del castellano"
  - id: c
    correct: true
    text:
      es: "La que se refiera a información que esté en curso de elaboración o de publicación general"
  - id: d
    text:
      es: "La que se refiera a datos meramente identificativos de los responsables del órgano"
  explanation:
    es: "El artículo 18.1.a) inadmite las solicitudes «que se refieran a información que esté en curso de elaboración o de publicación general». La falta de motivos no es causa de rechazo (art. 17.3). La solicitud puede presentarse en cualquier lengua cooficial del territorio (art. 17.4). El acceso a datos meramente identificativos se concede con carácter general (art. 15.2)."
  citation: "art. 18.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2013-12887-art-18
- id: m01-l07-q023
  prompt:
    es: "De acuerdo con el artículo 18 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, se inadmitirán las solicitudes referidas a información auxiliar o de apoyo, como la contenida en:"
  options:
  - id: a
    correct: true
    text:
      es: "Notas, borradores, opiniones, resúmenes, comunicaciones e informes internos o entre órganos o entidades administrativas"
  - id: b
    text:
      es: "Resoluciones definitivas que pongan fin a la vía administrativa"
  - id: c
    text:
      es: "Contratos, convenios y subvenciones con repercusión económica o presupuestaria"
  - id: d
    text:
      es: "Directrices, instrucciones y circulares que supongan una interpretación del Derecho"
  explanation:
    es: "El artículo 18.1.b) pone como ejemplo de información auxiliar o de apoyo la contenida en «notas, borradores, opiniones, resúmenes, comunicaciones e informes internos o entre órganos o entidades administrativas». Los contratos, convenios y subvenciones son información que hay que publicar (art. 8.1), igual que las directrices e instrucciones que interpretan el Derecho (art. 7). Una resolución definitiva no es información auxiliar."
  citation: "art. 18.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "excepción"
  - "concepto"
# anchor: boe-a-2013-12887-art-19
- id: m01-l07-q026
  prompt:
    es: "¿Qué debe hacer el sujeto que recibe una solicitud de acceso sobre información que no obra en su poder, si conoce cuál es el competente?"
  options:
  - id: a
    text:
      es: "Inadmitirla e indicar en la resolución cuál es el órgano competente"
  - id: b
    text:
      es: "Remitirla al competente, sin necesidad de informar de ello al solicitante"
  - id: c
    text:
      es: "Devolverla al solicitante para que la presente ante el órgano competente"
  - id: d
    correct: true
    text:
      es: "Remitirla al competente e informar de esta circunstancia al solicitante"
  explanation:
    es: "El artículo 19.1 Ley 19/2013 dice que el sujeto «la remitirá al competente, si lo conociera, e informará de esta circunstancia al solicitante». La inadmisión con indicación del competente es para el caso contrario, cuando el competente se desconoce (art. 18.1.d) y 18.2). La ley exige informar al solicitante y no prevé devolverle la solicitud."
  citation: "art. 19.1 Ley 19/2013"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2013-12887-art-19
- id: m01-l07-q027
  prompt:
    es: "De acuerdo con el artículo 19 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, si la solicitud no identifica suficientemente la información, se pedirá al solicitante que la concrete:"
  options:
  - id: a
    correct: true
    text:
      es: "En diez días, advirtiéndole de que, si no lo hace, se le tendrá por desistido"
  - id: b
    text:
      es: "En quince días, advirtiéndole de que, si no lo hace, se le tendrá por desistido"
  - id: c
    text:
      es: "En diez días, advirtiéndole de que, si no lo hace, se archivará por caducidad"
  - id: d
    text:
      es: "En un mes, advirtiéndole de que, si no lo hace, se le tendrá por desistido"
  explanation:
    es: "El artículo 19.2 fija «un plazo de diez días, con indicación de que, en caso de no hacerlo, se le tendrá por desistido». Los quince días son el plazo de alegaciones de los terceros (art. 19.3). Un mes es el plazo para resolver (art. 20.1). La consecuencia es el desistimiento, no la caducidad."
  citation: "art. 19.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2013-12887-art-19
- id: m01-l07-q028
  prompt:
    es: "Según el artículo 19 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿qué plazo tienen los terceros debidamente identificados para alegar si la información solicitada puede afectar a sus derechos?"
  options:
  - id: a
    text:
      es: "Un plazo de diez días para realizar las alegaciones oportunas"
  - id: b
    text:
      es: "Un plazo de un mes para realizar las alegaciones oportunas"
  - id: c
    correct: true
    text:
      es: "Un plazo de quince días para realizar las alegaciones oportunas"
  - id: d
    text:
      es: "Un plazo de cinco días hábiles para realizar las alegaciones oportunas"
  explanation:
    es: "El artículo 19.3 concede a los terceros «un plazo de quince días para que puedan realizar las alegaciones que estimen oportunas». Diez días es el plazo para que el solicitante concrete su solicitud (art. 19.2). Un mes es el plazo para resolver (art. 20.1). Cinco días no aparece en este procedimiento."
  citation: "art. 19.3 Ley 19/2013"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2013-12887-art-19
- id: m01-l07-q029
  prompt:
    es: "De acuerdo con el artículo 19 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, cuando se da audiencia a terceros afectados, el plazo para dictar resolución queda suspendido hasta que:"
  options:
  - id: a
    text:
      es: "El Consejo de Transparencia y Buen Gobierno emita informe sobre las alegaciones"
  - id: b
    correct: true
    text:
      es: "Se hayan recibido las alegaciones o haya transcurrido el plazo para su presentación"
  - id: c
    text:
      es: "Los terceros presten su consentimiento expreso y por escrito al acceso"
  - id: d
    text:
      es: "Se reciban las alegaciones, sin que baste el transcurso del plazo"
  explanation:
    es: "El artículo 19.3 mantiene la suspensión del plazo para resolver «hasta que se hayan recibido las alegaciones o haya transcurrido el plazo para su presentación». Basta con que pase el plazo, aunque no lleguen alegaciones. La ley no pide informe del Consejo en este trámite, y la suspensión no depende del consentimiento de los terceros."
  citation: "art. 19.3 Ley 19/2013"
  difficulty: 3
  tags:
  - "efecto"
  - "plazo"
# anchor: boe-a-2013-12887-art-20
- id: m01-l07-q031
  prompt:
    es: "¿En qué caso puede ampliarse por otro mes el plazo para resolver una solicitud de acceso a la información pública?"
  options:
  - id: a
    text:
      es: "Cuando la información pueda afectar a derechos o intereses de terceros debidamente identificados"
  - id: b
    text:
      es: "Cuando el solicitante no haya motivado su solicitud de acceso a la información"
  - id: c
    text:
      es: "Cuando el órgano carezca de medios suficientes, sin necesidad de notificarlo al solicitante"
  - id: d
    correct: true
    text:
      es: "Cuando el volumen o la complejidad de la información lo hagan necesario, previa notificación al solicitante"
  explanation:
    es: "El artículo 20.1 Ley 19/2013 permite ampliar el plazo por otro mes «en el caso de que el volumen o la complejidad de la información que se solicita así lo hagan necesario y previa notificación al solicitante». La afectación a terceros abre el trámite de alegaciones y suspende el plazo (art. 19.3); no lo amplía. La falta de motivación no tiene efectos (art. 17.3). La falta de medios no es causa de ampliación, y la notificación al solicitante es obligatoria."
  citation: "art. 20.1 Ley 19/2013"
  difficulty: 1
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2013-12887-art-20
- id: m01-l07-q032
  prompt:
    es: "De acuerdo con el artículo 20 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, serán motivadas las resoluciones en materia de acceso que:"
  options:
  - id: a
    text:
      es: "Denieguen totalmente el acceso, pero no las que concedan un acceso parcial a la información"
  - id: b
    text:
      es: "Denieguen el acceso, salvo cuando la denegación se funde en la protección de datos personales"
  - id: c
    text:
      es: "Concedan el acceso pese a la oposición de un tercero, pero no las que lo denieguen"
  - id: d
    correct: true
    text:
      es: "Denieguen el acceso, concedan el acceso parcial o por una modalidad distinta a la solicitada, o lo permitan pese a la oposición de un tercero"
  explanation:
    es: "El artículo 20.2 exige motivar «las resoluciones que denieguen el acceso, las que concedan el acceso parcial o a través de una modalidad distinta a la solicitada y las que permitan el acceso cuando haya habido oposición de un tercero». El acceso parcial también se motiva. La ley no exceptúa las denegaciones basadas en la protección de datos. Las denegaciones se motivan siempre."
  citation: "art. 20.2 Ley 19/2013"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12887-art-20
- id: m01-l07-q033
  prompt:
    es: "Señale la respuesta correcta sobre el plazo máximo para resolver una solicitud de acceso a la información pública conforme a la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno:"
  options:
  - id: a
    text:
      es: "Transcurrido sin resolución expresa notificada, la solicitud se entiende estimada"
  - id: b
    text:
      es: "Transcurrido sin resolución expresa notificada, se produce la caducidad del procedimiento"
  - id: c
    correct: true
    text:
      es: "Transcurrido sin resolución expresa notificada, la solicitud se entiende desestimada"
  - id: d
    text:
      es: "Es de tres meses, ampliable por otros tres si la información es compleja"
  explanation:
    es: "El artículo 20.4 dice que, transcurrido el plazo máximo sin resolución expresa notificada, «se entenderá que la solicitud ha sido desestimada». El silencio no es estimatorio ni produce la caducidad. El plazo es de un mes, ampliable por otro mes (art. 20.1), no de tres meses."
  citation: "art. 20.4 Ley 19/2013"
  difficulty: 1
  tags:
  - "efecto"
  - "plazo"
