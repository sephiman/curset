m11-l04-q09:
  key:
    anchor: mockito-javadoc-source#2
    sentence: Although it is possible to verify a stubbed invocation, usually it's just redundant
  wrong:
  - option: Impossible, because a stubbed call is not recorded as an interaction
    anchor: mockito-javadoc-source#1
    sentence: Once created, a mock will remember all interactions.
  - option: Required, because a wrong return value would otherwise go unnoticed
    anchor: mockito-javadoc-source#2
    sentence: If your code cares what get(0) returns, then something else breaks (often before verify() even gets executed).
  - option: Required, because `verify` works only on calls that were stubbed first
    anchor: mockito-javadoc-source#2
    sentence: If your code doesn't care what get(0) returns, then it should not be stubbed.
