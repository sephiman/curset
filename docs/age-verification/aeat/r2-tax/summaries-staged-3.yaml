# Tax-part summaries, batch 3 (III.7–III.10), staged for the blind check.
m03-l07: Los procedimientos de gestión tributaria de la LGT y el RGAT son, entre otros, el de devolución, el iniciado mediante
  declaración, el de verificación de datos, el de comprobación de valores y el de comprobación limitada. Cada uno tiene sus
  supuestos de inicio, sus trámites y sus formas de terminación. La rectificación de autoliquidaciones y el procedimiento
  de devolución tienen reglas propias en el RGAT.
m03-l08: La inspección de los tributos comprueba e investiga, con facultades de examen, entrada y requerimiento, y documenta
  sus actuaciones en comunicaciones, diligencias, informes y actas. Las actuaciones del procedimiento inspector deben concluir
  en 18 meses, o en 27 en los supuestos del artículo 150.1 de la LGT, y sus actas pueden ser con acuerdo, de conformidad o
  de disconformidad. Durante el procedimiento pueden adoptarse medidas cautelares.
m03-l09: Las deudas tributarias pueden extinguirse por pago, prescripción, compensación o condonación, por los medios previstos
  en la normativa aduanera y por los demás medios previstos en las leyes. La LGT y el RGR regulan la forma, el momento, los
  plazos, la imputación y la consignación del pago. El aplazamiento y el fraccionamiento se conceden previa solicitud del
  obligado, devengan intereses de demora y deben garantizarse, aunque no se exigen garantías, entre otros casos, cuando la
  deuda en conjunto no excede de 50.000 euros, límite que fija la Orden HFP/311/2023.
m03-l10: La deuda tributaria se extingue también por compensación, de oficio o a instancia del obligado, por deducciones sobre
  transferencias a las entidades de derecho público y por condonación, solo en virtud de ley. Si los obligados al pago resultan
  fallidos, el crédito se declara incobrable y se da de baja provisional. El procedimiento de apremio termina con el pago,
  con la declaración de crédito incobrable o con la extinción de la deuda por otra causa.
