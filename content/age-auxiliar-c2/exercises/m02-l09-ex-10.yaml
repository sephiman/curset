    es: "La página dice que COINCIDIRX devuelve la posición relativa de un elemento de una matriz o rango. «BUSCARX»: BUSCARX devuelve el elemento de la coincidencia inicial, no su posición. «FORMULATEXTO»: FORMULATEXTO devuelve la fórmula de una referencia como texto. «ÍNDICE»: ÍNDICE elige un valor mediante un índice."
