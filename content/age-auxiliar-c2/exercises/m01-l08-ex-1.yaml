    text:
      es: "Los Subsecretarios y los Secretarios generales."
  - id: d
    text:
      es: "Los Delegados del Gobierno."
  explanation:
    es: "Corresponde a los órganos superiores establecer los planes de actuación. Los órganos directivos, entre ellos Subsecretarios, Secretarios generales y Delegados del Gobierno, los desarrollan y ejecutan."
