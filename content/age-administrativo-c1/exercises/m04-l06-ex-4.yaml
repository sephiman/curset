# anchor: boe-a-1986-1216-art-20
- id: m04-l06-q155
  prompt:
    es: "Una funcionaria cometió una falta muy grave el lunes, 26 de mayo de 2025, descubierta el lunes, 16 de junio de 2025. Según el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿qué día vence la prescripción de la falta?"
  options:
  - id: a
    text:
      es: "El miércoles, 26 de mayo de 2027."
  - id: b
    text:
      es: "El viernes, 26 de mayo de 2028."
  - id: c
    correct: true
    text:
      es: "El lunes, 26 de mayo de 2031."
  - id: d
    text:
      es: "El lunes, 16 de junio de 2031."
  explanation:
    es: "El artículo 20.1 del Reglamento dice que las faltas muy graves prescriben «a los seis años» y que el plazo se cuenta «desde que la falta se hubiere cometido». Los plazos en meses y años se cuentan de fecha a fecha: del lunes, 26 de mayo de 2025 al lunes, 26 de mayo de 2031. Contar desde el descubrimiento da el lunes, 16 de junio de 2031. Tres años es el plazo del Estatuto Básico para las faltas muy graves. Dos años es el de las graves."
