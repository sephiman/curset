  tags:
  - "cantidad"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m06-l05-q144
  prompt:
    es: "En una referencia estructurada de Excel 365, ¿cuál de los siguientes especificadores de elemento hace referencia solo a la fila de encabezado de la tabla?"
  options:
  - id: a
    text:
      es: "#Datos"
  - id: b
    text:
      es: "#Totales"
  - id: c
    text:
      es: "#Todas"
  - id: d
    correct: true
    text:
      es: "#Encabezados"
  explanation:
    es: "#Encabezados hace referencia solo a la fila de encabezado. #Datos solo a las filas de datos, #Totales solo a la fila del total y #Todas a toda la tabla."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «#Encabezados — Solo la fila de encabezado.»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m06-l05-q145
  prompt:
    es: "En Excel 365, ¿qué ocurre con las referencias estructuradas de una fórmula cuando se copia esa fórmula a otra celda?"
  options:
  - id: a
    text:
      es: "Se ajustan como una serie de especificadores de columna"
  - id: b
    text:
      es: "Se convierten en referencias absolutas de estilo A1"
  - id: c
    text:
      es: "Se ajustan igual que las referencias relativas de celda"
  - id: d
    correct: true
    text:
      es: "Permanecen iguales"
  explanation:
    es: "Al copiar o mover una fórmula con referencias estructuradas, estas permanecen iguales. Solo al rellenar, y según la dirección y la tecla, los especificadores de columna se ajustan como una serie."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «Estrategias para trabajar con referencias estructuradas»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m06-l05-q146
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes opciones describe qué ocurre con las fórmulas que usan una columna de una tabla si se cambia el nombre de esa columna?"
  options:
  - id: a
    correct: true
    text:
      es: "Excel actualiza su uso en todas las referencias estructuradas del libro"
  - id: b
    text:
      es: "Siguen apuntando al nombre anterior y muestran un error en cada fórmula"
  - id: c
    text:
      es: "Excel las convierte en referencias de celda explícitas de estilo A1"
  - id: d
    text:
      es: "Solo se actualizan las de la hoja donde está la tabla de origen"
  explanation:
    es: "Si se cambia el nombre de una columna o tabla, Excel cambia automáticamente su uso en todas las referencias estructuradas del libro, no solo en una hoja ni dejando el nombre anterior."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «Estrategias para trabajar con referencias estructuradas»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-referencias-estructuradas-html
- id: m06-l05-q147
  prompt:
    es: "Señale qué ocurre en Excel 365 con las referencias estructuradas cuando una tabla se convierte en un rango."
  options:
  - id: a
    text:
      es: "Permanecen y siguen usando los nombres de tabla y de columna"
  - id: b
    text:
      es: "Cambian a referencias relativas de estilo A1"
  - id: c
    correct: true
    text:
      es: "Cambian a las referencias absolutas equivalentes de estilo A1"
  - id: d
    text:
      es: "Se eliminan de las fórmulas y quedan solo valores calculados"
  explanation:
    es: "Al convertir una tabla en un rango, las referencias cambian a las referencias absolutas equivalentes de estilo A1. No permanecen con nombres de columna ni se vuelven relativas."
  citation: "fuente: `ms-excel-referencias-estructuradas.html`; «Estrategias para trabajar con referencias estructuradas»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-funcion-no-html
- id: m06-l05-q148
  prompt:
    es: "En una hoja de Excel 365, A2 contiene el valor 50. ¿Qué muestra la celda que contiene =NO(A2>100)?"
  options:
  - id: a
    text:
      es: "FALSO"
  - id: b
    correct: true
    text:
      es: "VERDADERO"
  - id: c
    text:
      es: "50"
  - id: d
    text:
      es: "100"
  explanation:
    es: "A2>100 es FALSO, y si el valor lógico es FALSO, NO devuelve VERDADERO. FALSO sería el resultado sin invertir; 50 y 100 son valores de entrada, no un resultado lógico."
  citation: "fuente: `ms-excel-funcion-no.html`; «Observaciones»"
  difficulty: 1
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-no-html
- id: m06-l05-q149
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes afirmaciones describe lo que hace la función NO con su argumento?"
  options:
  - id: a
    text:
      es: "Devuelve VERDADERO si alguno de sus argumentos es VERDADERO"
  - id: b
    text:
      es: "Devuelve VERDADERO solo si todos sus argumentos son VERDADEROS"
  - id: c
    text:
      es: "Realiza una prueba lógica y devuelve un valor según el resultado"
  - id: d
    correct: true
    text:
      es: "Invierte el valor lógico del argumento"
  explanation:
    es: "NO invierte el valor del argumento. La que devuelve VERDADERO si alguno lo es es O, la de todos los argumentos verdaderos es Y (AND) y la prueba lógica con un valor para cada caso es SI."
  citation: "fuente: `ms-excel-funcion-no.html`; «Detalles técnicos»"
  difficulty: 1
  tags:
  - "función"
  - "concepto"
# anchor: fuente-ms-excel-funcion-o-html
- id: m06-l05-q150
  prompt:
    es: "En una hoja de Excel 365, A1 contiene 5 y B1 contiene 3. ¿Qué muestra la celda que contiene =O(A1<B1;A1=B1)?"
  options:
  - id: a
    text:
      es: "VERDADERO"
  - id: b
    text:
      es: "5"
  - id: c
    correct: true
    text:
      es: "FALSO"
  - id: d
    text:
      es: "3"
  explanation:
    es: "A1<B1 es FALSO y A1=B1 también, y O devuelve FALSO si todos sus argumentos se evalúan como FALSO. VERDADERO exigiría que alguna condición se cumpliera; 5 y 3 no son valores lógicos."
  citation: "fuente: `ms-excel-funcion-o.html`; «Detalles técnicos»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-o-html
- id: m06-l05-q151
  prompt:
    es: "En una hoja de Excel 365, A2 contiene 70. ¿Qué muestra =SI(O(A2<0;A2>50);A2;\"El valor está fuera del rango\")?"
  options:
  - id: a
    text:
      es: "El valor está fuera del rango"
  - id: b
    correct: true
    text:
      es: "70"
  - id: c
    text:
      es: "VERDADERO"
  - id: d
    text:
      es: "FALSO"
  explanation:
    es: "A2>50 es VERDADERO, así que O es VERDADERO y SI muestra el valor de A2, 70. El mensaje solo aparece si ninguna condición de O se cumple; VERDADERO y FALSO serían el resultado de O sin SI."
  citation: "fuente: `ms-excel-funcion-o.html`; «Ejemplos»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-funcion-o-html
- id: m06-l05-q153
  prompt:
    es: "En Excel 365, si un argumento de referencia de O contiene texto o celdas vacías junto a valores lógicos, ¿cuál de las siguientes opciones describe lo que hace O con ellos?"
  options:
  - id: a
    text:
      es: "Los evalúa como FALSO"
  - id: b
    correct: true
    text:
      es: "Los pasa por alto"
  - id: c
    text:
      es: "Los evalúa como VERDADERO"
  - id: d
