# anchor: boe-a-2003-23186-art-49
- id: m03-l03-q0131
  prompt:
    es: "Conforme al artículo 49 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la obligación tributaria principal y la de realizar pagos a cuenta se determinarán a partir de las bases tributarias, los tipos de gravamen y los demás elementos del capítulo, según disponga:"
  options:
  - id: a
    text:
      es: "el reglamento de cada tributo."
  - id: b
    correct: true
    text:
      es: "la ley de cada tributo."
  - id: c
    text:
      es: "la Administración tributaria en cada ejercicio."
  - id: d
    text:
      es: "la orden ministerial del Ministro de Hacienda."
  explanation:
    es: "La obligación principal y los pagos a cuenta se determinan según disponga la ley de cada tributo. Ni el reglamento, ni la Administración en cada ejercicio, ni una orden ministerial fijan por sí mismos esos elementos."
  citation: "art. 49 LGT"
  difficulty: 1
  tags:
  - "definición"
  - "órgano"
# anchor: boe-a-2003-23186-art-50
- id: m03-l03-q0132
  prompt:
    es: "Según el artículo 50.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la base imponible es la magnitud dineraria o de otra naturaleza que resulta de:"
  options:
  - id: a
    text:
      es: "la aplicación del tipo de gravamen sobre la cuota íntegra del tributo."
  - id: b
    text:
      es: "la práctica de las reducciones legales sobre la base liquidable."
  - id: c
    correct: true
    text:
      es: "la medición o valoración del hecho imponible."
  - id: d
    text:
      es: "la determinación de la cuota diferencial por la Administración."
  explanation:
    es: "La base imponible resulta de medir o valorar el hecho imponible. El tipo de gravamen se aplica a la base liquidable y da la cuota íntegra. Las reducciones se practican sobre la base imponible, no sobre la liquidable, y la cuota diferencial es una magnitud posterior."
  citation: "art. 50.1 LGT"
  difficulty: 1
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-50
- id: m03-l03-q0133
  prompt:
    es: "De acuerdo con el artículo 50.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la base imponible podrá determinarse por los siguientes métodos:"
  options:
  - id: a
    text:
      es: "estimación directa, estimación objetiva y estimación presuntiva."
  - id: b
    correct: true
    text:
      es: "estimación directa, estimación objetiva y estimación indirecta."
  - id: c
    text:
      es: "estimación directa y estimación indirecta, sin que la ley prevea otros métodos."
  - id: d
    text:
      es: "estimación directa, estimación objetiva y estimación de oficio."
  explanation:
    es: "Los métodos del artículo 50.2 son tres: estimación directa, objetiva e indirecta. La estimación presuntiva y la de oficio no son métodos que la ley enumere, y no es cierto que solo existan los dos de directa e indirecta, porque falta la objetiva."
  citation: "art. 50.2 LGT"
  difficulty: 1
  tags:
  - "definición"
  - "condición"
# anchor: boe-a-2003-23186-art-50
- id: m03-l03-q0134
  prompt:
    es: "Conforme al artículo 50.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la determinación de las bases imponibles:"
  options:
  - id: a
    text:
      es: "Con carácter general se determinan por estimación directa, y la estimación objetiva, cuando la ley la establezca, tiene carácter obligatorio para los obligados."
  - id: b
    text:
      es: "Con carácter general se determinan por estimación objetiva, y la estimación directa solo se aplica cuando el obligado la solicita."
  - id: c
    text:
      es: "Con carácter general se determinan por estimación directa, y la estimación indirecta tiene carácter voluntario cuando la ley la establezca."
  - id: d
    correct: true
    text:
      es: "Con carácter general se determinan por estimación directa, y la estimación objetiva, cuando la ley la establezca, tiene en todo caso carácter voluntario para los obligados."
  explanation:
    es: "La regla general es la estimación directa. La ley puede establecer la objetiva, que es siempre voluntaria. No es obligatoria, la general no es la objetiva y la voluntariedad no corresponde a la indirecta, que es subsidiaria de los demás métodos."
  citation: "art. 50.3 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "definición"
# anchor: boe-a-2003-23186-art-50
- id: m03-l03-q0135
  prompt:
    es: "De acuerdo con el artículo 50.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, en relación con la determinación de la base imponible, la estimación indirecta tendrá carácter:"
  options:
  - id: a
    text:
      es: "preferente respecto de los demás métodos de determinación, y se aplicará cuando concurra alguna de las circunstancias legales."
  - id: b
    text:
      es: "voluntario para los obligados tributarios, y se aplicará cuando la ley de cada tributo así lo establezca."
  - id: c
    correct: true
    text:
      es: "subsidiario respecto de los demás métodos de determinación, y se aplicará cuando concurra alguna de las circunstancias legales."
  - id: d
    text:
      es: "subsidiario respecto de los demás métodos, y se aplicará cuando la Administración lo decida discrecionalmente."
  explanation:
    es: "La estimación indirecta es subsidiaria de los demás métodos y solo se aplica cuando concurra alguna de las circunstancias legales. No es preferente, ni voluntaria, y no depende de una decisión discrecional de la Administración."
  citation: "art. 50.4 LGT"
  difficulty: 2
  tags:
  - "condición"
  - "definición"
# anchor: boe-a-2003-23186-art-54
- id: m03-l03-q0137
  prompt:
    es: "Según el artículo 54 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿sobre qué magnitud se practican las reducciones establecidas en la ley para obtener la base liquidable?"
  options:
  - id: a
    text:
      es: "Sobre la cuota íntegra del tributo."
  - id: b
    correct: true
    text:
      es: "Sobre la base imponible."
  - id: c
    text:
      es: "Sobre la cuota líquida del tributo."
  - id: d
    text:
      es: "Sobre la cuota diferencial del tributo."
  explanation:
    es: "Las reducciones se practican sobre la base imponible y dan la base liquidable. La cuota íntegra, la líquida y la diferencial son magnitudes posteriores, que se obtienen a partir de la base liquidable."
  citation: "art. 54 LGT"
  difficulty: 1
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-56
- id: m03-l03-q0140
  prompt:
    es: "De acuerdo con el artículo 56.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la cuota íntegra se determinará:"
  options:
  - id: a
    text:
      es: "aplicando el tipo de gravamen a la cuota líquida, o según cantidad fija señalada al efecto."
  - id: b
    text:
      es: "aplicando el tipo de gravamen a la base liquidable, sin que pueda determinarse según cantidad fija."
  - id: c
    text:
      es: "aplicando el tipo de gravamen a la base liquidable, o según cantidad variable que fije la Administración."
  - id: d
    correct: true
    text:
      es: "aplicando el tipo de gravamen a la base liquidable, o según cantidad fija señalada al efecto."
  explanation:
    es: "La cuota íntegra se determina aplicando el tipo de gravamen a la base liquidable o según una cantidad fija señalada al efecto. La cuota líquida es posterior a la íntegra, no puede ser su base. Excluir la cantidad fija o dejar que la Administración fije una cantidad variable altera la regla."
  citation: "art. 56.1 LGT"
  difficulty: 1
  tags:
  - "definición"
  - "condición"
# anchor: boe-a-2003-23186-art-56
- id: m03-l03-q0141
  prompt:
    es: "La ley de un impuesto fija una reducción de 10.000 euros sobre la base imponible y un tipo de gravamen del 20 por ciento. Marina Cano tiene en 2025 una base imponible de 50.000 euros. Conforme a los artículos 54, 55.1 y 56.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál es su cuota íntegra?"
  options:
  - id: a
    correct: true
    text:
      es: "8.000 euros, el 20 por ciento de la base liquidable de 40.000 euros."
  - id: b
    text:
      es: "10.000 euros, el 20 por ciento de la base imponible de 50.000 euros."
  - id: c
    text:
      es: "2.000 euros, el 20 por ciento de la reducción de 10.000 euros."
  - id: d
    text:
      es: "40.000 euros, porque la base liquidable ya es la cuota íntegra."
  explanation:
    es: "La base liquidable es la base imponible menos las reducciones: 50.000 menos 10.000 son 40.000 euros. La cuota íntegra aplica el tipo a la base liquidable: el 20 por ciento de 40.000 son 8.000 euros. Aplicar el tipo a la base imponible da 10.000, aplicarlo a la reducción da 2.000, y la base liquidable no es la cuota íntegra."
  citation: "art. 56.1 LGT"
  difficulty: 2
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2003-23186-art-56
- id: m03-l03-q0142
  prompt:
    es: "Conforme al artículo 56.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la cuota íntegra deberá reducirse de oficio cuando de la aplicación de los tipos de gravamen resulte que a un incremento de la base corresponde:"
  options:
  - id: a
    text:
      es: "una porción de cuota inferior a dicho incremento."
  - id: b
    text:
      es: "una porción de cuota igual a dicho incremento."
  - id: c
    correct: true
    text:
      es: "una porción de cuota superior a dicho incremento."
  - id: d
    text:
      es: "una porción de cuota superior a la base imponible total."
  explanation:
    es: "La cuota se reduce de oficio cuando un incremento de la base lleva a una porción de cuota superior a ese incremento. Si fuera inferior o igual, la regla no juega, y compararla con la base imponible total no es el criterio del precepto."
  citation: "art. 56.3 LGT"
  difficulty: 3
  tags:
  - "condición"
  - "efecto"
# anchor: boe-a-2003-23186-art-56
- id: m03-l03-q0143
  prompt:
    es: "Según el artículo 56.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la reducción de oficio de la cuota íntegra:"
  options:
  - id: a
    text:
      es: "Debe comprender como máximo el exceso de cuota sobre el incremento de la base, y se exceptúan los casos en que la deuda deba pagarse por medio de efectos timbrados."
  - id: b
    text:
      es: "Debe comprender al menos el exceso de cuota sobre el incremento de la base, y se aplica también a las deudas que deban pagarse por medio de efectos timbrados."
  - id: c
    text:
      es: "Debe comprender al menos el exceso de cuota sobre el incremento de la base, y se exceptúan las deudas pagadas mediante aplazamiento o fraccionamiento."
  - id: d
    correct: true
    text:
      es: "Debe comprender al menos el exceso de cuota sobre el incremento de la base, y se exceptúan los casos en que la deuda deba pagarse por medio de efectos timbrados."
  explanation:
    es: "La reducción comprende al menos el exceso de cuota, no como máximo, y no se aplica a las deudas que deban pagarse mediante efectos timbrados. Las deudas aplazadas o fraccionadas no figuran entre las excepciones del apartado."
  citation: "art. 56.3 LGT"
  difficulty: 3
  tags:
  - "condición"
  - "efecto"
# anchor: boe-a-2003-23186-art-56
- id: m03-l03-q0144
  prompt:
    es: "Según el artículo 56.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el importe de la cuota íntegra podrá modificarse mediante la aplicación de las reducciones o límites que:"
  options:
  - id: a
    text:
      es: "la Administración tributaria fije en cada liquidación."
  - id: b
    correct: true
    text:
      es: "la ley de cada tributo establezca en cada caso."
  - id: c
    text:
      es: "el reglamento de cada tributo establezca para cada ejercicio."
  - id: d
    text:
      es: "la ley de presupuestos establezca con carácter general para todos los tributos."
  explanation:
    es: "Las reducciones o límites que modifican la cuota íntegra los establece la ley de cada tributo en cada caso. No los fija la Administración liquidando, ni un reglamento por ejercicio, ni una ley de presupuestos con alcance general sobre todos los tributos."
  citation: "art. 56.4 LGT"
  difficulty: 1
  tags:
  - "condición"
  - "órgano"
# anchor: boe-a-2003-23186-art-56
- id: m03-l03-q0146
  prompt:
    es: "Según el artículo 56.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la cuota diferencial será el resultado de minorar la cuota líquida en el importe de:"
  options:
  - id: a
    text:
      es: "los recargos, intereses de demora y sanciones que correspondan según la normativa de cada tributo."
  - id: b
    correct: true
    text:
      es: "las deducciones, pagos fraccionados, retenciones, ingresos a cuenta y cuotas, conforme a la normativa de cada tributo."
  - id: c
    text:
      es: "las deducciones y bonificaciones, pero no los pagos fraccionados ni las retenciones de cada tributo."
  - id: d
    text:
      es: "las reducciones y límites que la ley de cada tributo establezca en cada caso."
  explanation:
    es: "La cuota diferencial resulta de restar a la cuota líquida las deducciones, los pagos fraccionados, las retenciones, los ingresos a cuenta y las cuotas, según la normativa de cada tributo. Los recargos, intereses y sanciones no se restan, sino que se suman en su caso a la deuda. Y excluir los pagos a cuenta contradice la lista, mientras que las reducciones y límites actúan sobre la cuota íntegra."
  citation: "art. 56.6 LGT"
  difficulty: 2
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-56
- id: m03-l03-q0147
  prompt:
    es: "La cuota íntegra de Marina Cano en 2025 es de 8.000 euros. La ley del tributo prevé deducciones por 500 euros y bonificaciones por 300 euros, y Marina ha soportado retenciones por 1.000 euros y realizado pagos fraccionados por 2.000 euros. Conforme a los artículos 56.5 y 56.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál es su cuota diferencial?"
  options:
  - id: a
    text:
      es: "7.200 euros, la cuota líquida resultante de restar las deducciones y bonificaciones."
  - id: b
    text:
      es: "5.000 euros, tras restar de la cuota íntegra las retenciones y los pagos fraccionados."
  - id: c
    text:
      es: "4.700 euros, tras restar las bonificaciones, las retenciones y los pagos fraccionados."
  - id: d
    correct: true
    text:
      es: "4.200 euros, tras minorar la cuota líquida de 7.200 euros en las retenciones y los pagos fraccionados."
  explanation:
    es: "La cuota líquida es la íntegra menos las deducciones y bonificaciones: 8.000 menos 500 y menos 300 son 7.200 euros. La cuota diferencial resta de ella las retenciones y los pagos fraccionados: 7.200 menos 1.000 y menos 2.000 son 4.200 euros. Los 7.200 euros son la cuota líquida, no la diferencial. Partir de la cuota íntegra da 5.000 y olvida las deducciones y bonificaciones, y dejar fuera las deducciones da 4.700."
  citation: "art. 56.6 LGT"
  difficulty: 3
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2003-23186-art-56
- id: m03-l03-q0148
  prompt:
    es: "¿Cuál de las siguientes secuencias recoge el orden en que se obtienen las magnitudes de cuantificación de la obligación tributaria que regulan los artículos 50 a 56 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Base liquidable, base imponible, cuota íntegra, cuota líquida y cuota diferencial."
  - id: b
    text:
      es: "Base imponible, base liquidable, cuota líquida, cuota íntegra y cuota diferencial."
  - id: c
    correct: true
    text:
      es: "Base imponible, base liquidable, cuota íntegra, cuota líquida y cuota diferencial."
  - id: d
    text:
      es: "Base imponible, cuota íntegra, base liquidable, cuota diferencial y cuota líquida."
  explanation:
    es: "Primero se mide el hecho imponible (base imponible), después se practican las reducciones (base liquidable), se aplica el tipo (cuota íntegra), se aplican las deducciones y similares (cuota líquida) y por último se minoran los pagos a cuenta (cuota diferencial). Empezar por la base liquidable, aplicar la cuota líquida antes de la íntegra o dejar la diferencial antes de la líquida invierte alguno de esos pasos."
  citation: "art. 56 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "condición"
# anchor: boe-a-2003-23186-art-58
- id: m03-l03-q0149
  prompt:
    es: "Según el artículo 58.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la deuda tributaria está constituida por:"
  options:
  - id: a
    correct: true
    text:
      es: "la cuota o cantidad a ingresar que resulte de la obligación tributaria principal o de las obligaciones de realizar pagos a cuenta."
  - id: b
    text:
      es: "la cuota o cantidad a ingresar que resulte de la obligación tributaria principal o de las obligaciones entre particulares resultantes del tributo."
  - id: c
    text:
      es: "la cuota o cantidad a ingresar que resulte de las obligaciones tributarias formales o de las de realizar pagos a cuenta."
  - id: d
    text:
      es: "la cuota o cantidad a ingresar que resulte de la obligación tributaria principal, con exclusión de los pagos a cuenta."
  explanation:
    es: "La deuda tributaria la constituye la cuota que resulte de la obligación principal o de las de realizar pagos a cuenta. Las obligaciones entre particulares no forman parte de ella, las formales no tienen carácter pecuniario, y los pagos a cuenta no se excluyen."
  citation: "art. 58.1 LGT"
  difficulty: 2
  tags:
  - "definición"
  - "condición"
# anchor: boe-a-2003-23186-art-54
- id: m03-l03-q0153
  prompt:
    es: "Un impuesto tiene en 2025 una base imponible de 30.000 euros y su ley establece reducciones por un total de 4.500 euros. Conforme al artículo 54 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál es la base liquidable?"
  options:
  - id: a
    text:
      es: "34.500 euros, resultado de sumar las reducciones a la base imponible."
  - id: b
    text:
      es: "30.000 euros, porque las reducciones se aplican a la cuota y no a la base."
  - id: c
    correct: true
    text:
      es: "25.500 euros, resultado de restar las reducciones de la base imponible."
  - id: d
    text:
      es: "4.500 euros, porque la base liquidable es el importe de las reducciones."
  explanation:
    es: "La base liquidable resulta de practicar en la base imponible las reducciones de la ley: 30.000 menos 4.500 son 25.500 euros. Sumarlas da 34.500, que es un error de signo. Aplicarlas a la cuota las confunde con las deducciones, y la base liquidable no es el importe de las reducciones."
  citation: "art. 54 LGT"
  difficulty: 2
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2003-23186-art-56
- id: m03-l03-q0154
  prompt:
    es: "La cuota íntegra de un contribuyente en 2025 es de 6.000 euros. La ley del tributo prevé una bonificación de 600 euros y una deducción de 400 euros. Conforme al artículo 56.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál es la cuota líquida?"
  options:
  - id: a
    text:
      es: "6.600 euros, resultado de sumar la bonificación y la deducción a la cuota íntegra del tributo."
  - id: b
    text:
      es: "5.400 euros, resultado de restar solo la deducción de la cuota íntegra."
  - id: c
    text:
      es: "5.600 euros, resultado de restar solo la bonificación de la cuota íntegra."
  - id: d
    correct: true
    text:
      es: "5.000 euros, resultado de restar la bonificación y la deducción de la cuota íntegra."
  explanation:
    es: "La cuota líquida aplica sobre la cuota íntegra las deducciones y bonificaciones: 6.000 menos 600 y menos 400 son 5.000 euros. Sumarlas daría 6.600. Restar solo una de ellas da 5.400 o 5.600, y deja sin aplicar la otra."
  citation: "art. 56.5 LGT"
  difficulty: 2
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2003-23186-art-58
- id: m03-l03-q0155
  prompt:
    es: "¿Cuál de las siguientes prestaciones integra, en su caso, la deuda tributaria según el artículo 58.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    correct: true
    text:
      es: "Los recargos del período ejecutivo que correspondan al obligado."
  - id: b
    text:
      es: "Las sanciones por infracciones tributarias que se impongan al obligado."
  - id: c
    text:
      es: "Las obligaciones formales de presentar declaraciones periódicas."
  - id: d
    text:
      es: "Las cantidades repercutidas entre particulares por razón del tributo."
  explanation:
    es: "Los recargos del período ejecutivo integran la deuda tributaria. Las sanciones quedan fuera, según el apartado 3. Las obligaciones formales no tienen carácter pecuniario, y las cantidades repercutidas entre particulares son una obligación entre particulares, no una parte de la deuda."
  citation: "art. 58.2 LGT"
  difficulty: 2
  tags:
  - "definición"
# anchor: boe-a-2003-23186-art-58
- id: m03-l03-q0165
  prompt:
    es: "Según el artículo 58.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, además de la cuota o cantidad a ingresar, la deuda tributaria está integrada, en su caso, por:"
  options:
  - id: a
    text:
      es: "Las costas devengadas en el procedimiento de apremio a cargo del deudor."
  - id: b
    correct: true
    text:
      es: "Los recargos exigibles legalmente sobre las bases o las cuotas, a favor del Tesoro o de otros entes públicos."
  - id: c
    text:
      es: "Las multas coercitivas impuestas por incumplir los requerimientos de la Administración."
  - id: d
    text:
      es: "Los precios públicos exigidos por servicios de la Administración tributaria."
  explanation:
    es: "La deuda tributaria incluye, en su caso, el interés de demora, los recargos por declaración extemporánea, los recargos del período ejecutivo y los recargos exigibles legalmente sobre las bases o las cuotas a favor del Tesoro o de otros entes públicos (art. 58.2.d). Las costas del apremio, las multas coercitivas y los precios públicos no figuran en esa lista cerrada."
  citation: "art. 58.2 LGT"
  difficulty: 2
  tags:
  - "deuda tributaria"
  - "recargos"
