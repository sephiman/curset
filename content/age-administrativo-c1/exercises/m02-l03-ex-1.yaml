# anchor: boe-a-2015-10565-art-14
- id: m02-l03-q001
  prompt:
    es: "De acuerdo con el artículo 14.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las personas físicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Podrán elegir en todo momento si se comunican por medios electrónicos o no, salvo que estén obligadas a ello."
  - id: b
    text:
      es: "Deberán comunicarse por medios electrónicos, salvo que acrediten no disponer de los medios necesarios para ello."
  - id: c
    text:
      es: "Podrán elegir al inicio del procedimiento si se comunican por medios electrónicos, sin poder cambiar después de medio."
  - id: d
    text:
      es: "Podrán elegir si se comunican por medios electrónicos solo en los procedimientos en que la Administración lo prevea."
  explanation:
    es: "El artículo 14.1 dice que las personas físicas «podrán elegir en todo momento» si se comunican por medios electrónicos o no, salvo que estén obligadas. La regla general es la elección, no la obligación con una excepción por falta de medios. La elección no queda fijada al inicio: el mismo apartado permite modificar el medio «en cualquier momento». Tampoco depende de que la Administración la prevea en cada procedimiento."
  citation: "art. 14.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-14
- id: m02-l03-q002
  prompt:
    es: "¿Puede una persona física no obligada a relacionarse electrónicamente modificar el medio que eligió para comunicarse con las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Sí, pero solo una vez en cada procedimiento."
  - id: b
    text:
      es: "Solo al iniciar un nuevo procedimiento administrativo."
  - id: c
    correct: true
    text:
      es: "Sí, podrá modificarlo en cualquier momento."
  - id: d
    text:
      es: "No, el medio elegido vincula hasta la resolución."
  explanation:
    es: "El artículo 14.1 LPAC dice que «el medio elegido por la persona para comunicarse con las Administraciones Públicas podrá ser modificado por aquella en cualquier momento». La ley no limita el cambio a una vez por procedimiento ni lo reserva para el inicio de un procedimiento nuevo. Tampoco dice que el medio elegido vincule hasta la resolución."
  citation: "art. 14.1 LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-14
- id: m02-l03-q003
  prompt:
    es: "¿Cuál de los siguientes sujetos está obligado por la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas a relacionarse electrónicamente con las Administraciones para cualquier trámite de un procedimiento?"
  options:
  - id: a
    text:
      es: "Las personas físicas que dispongan de certificado electrónico."
  - id: b
    correct: true
    text:
      es: "Las entidades sin personalidad jurídica."
  - id: c
    text:
      es: "Las personas físicas que perciban prestaciones públicas."
  - id: d
    text:
      es: "Los interesados que ya hayan presentado una solicitud electrónica."
  explanation:
    es: "El artículo 14.2 LPAC incluye entre los obligados, en su letra b), a «las entidades sin personalidad jurídica». Las personas físicas, tengan o no certificado electrónico y perciban o no prestaciones, pueden elegir según el artículo 14.1, salvo la obligación que imponga un reglamento. Haber presentado una vez una solicitud electrónica tampoco crea la obligación: el medio elegido se puede cambiar en cualquier momento."
  citation: "art. 14.2 LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-14
- id: m02-l03-q004
  prompt:
    es: "¿Para qué trámites están obligados los empleados de las Administraciones Públicas a relacionarse electrónicamente con ellas?"
  options:
  - id: a
    correct: true
    text:
      es: "Para los que realicen por razón de su condición de empleado público."
  - id: b
    text:
      es: "Para cualquier trámite, también los que hagan como particulares."
  - id: c
    text:
      es: "Solo para los procedimientos de provisión de puestos de trabajo."
  - id: d
    text:
      es: "Solo para los trámites que realicen ante su propio departamento."
  explanation:
    es: "La letra e) del artículo 14.2 LPAC obliga a los empleados públicos «para los trámites y actuaciones que realicen con ellas por razón de su condición de empleado público», en la forma que determine cada Administración. Como particulares conservan la elección del artículo 14.1. La ley no reduce la obligación a la provisión de puestos ni a los trámites ante su propio departamento."
  citation: "art. 14.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2021-5032-art-3
- id: m02-l03-q005
  prompt:
    es: "El órgano competente tiene constancia el jueves 4 de febrero de 2027 de que una persona física no obligada quiere relacionarse electrónicamente. Según el Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, la comunicación produce efectos a partir del:"
  options:
  - id: a
    text:
      es: "Martes 9 de febrero de 2027."
  - id: b
    text:
      es: "Miércoles 10 de febrero de 2027."
  - id: c
    correct: true
    text:
      es: "Jueves 11 de febrero de 2027."
  - id: d
    text:
      es: "Viernes 5 de febrero de 2027."
  explanation:
    es: "El artículo 3.2 del Reglamento dice que los efectos se producen «a partir del quinto día hábil siguiente» a aquel en que el órgano tuvo constancia. Los días hábiles excluyen sábados, domingos y festivos (art. 30.2 LPAC), y en esas fechas no hay festivos. Desde el jueves 4: viernes 5 (primero), lunes 8 (segundo), martes 9 (tercero), miércoles 10 (cuarto) y jueves 11 (quinto). El martes 9 resulta de contar cinco días naturales. El miércoles 10 es el cuarto día hábil. El viernes 5 es el día siguiente, sin espera."
  citation: "art. 3.2 RD 203/2021"
  difficulty: 3
  tags:
  - "cómputo"
  - "fecha"
# anchor: boe-a-2021-5032-art-3
- id: m02-l03-q006
  prompt:
    es: "De acuerdo con el artículo 3.2 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, la comunicación de la persona física no obligada de que quiere relacionarse electrónicamente produce efectos a partir del:"
  options:
  - id: a
    text:
      es: "Día siguiente a aquel en que el órgano competente haya tenido constancia de ella."
  - id: b
    text:
      es: "Décimo día hábil siguiente a aquel en que la persona haya presentado la comunicación."
  - id: c
    text:
      es: "Quinto día natural siguiente a aquel en que la persona haya presentado la comunicación."
  - id: d
    correct: true
    text:
      es: "Quinto día hábil siguiente a aquel en que el órgano competente haya tenido constancia de ella."
  explanation:
    es: "El artículo 3.2 fija los efectos «a partir del quinto día hábil siguiente a aquel en que el órgano competente para tramitar el procedimiento haya tenido constancia» de la comunicación. No son inmediatos al día siguiente. El plazo no es de diez días ni se cuenta en días naturales, y su referencia es la constancia del órgano, no la presentación."
  citation: "art. 3.2 RD 203/2021"
  difficulty: 2
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-2015-10565-art-9
- id: m02-l03-q007
  prompt:
    es: "Según el artículo 9.2.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuánto tiempo ha de transcurrir desde la comunicación del sistema de identificación antes de su eficacia jurídica?"
  options:
  - id: a
    correct: true
    text:
      es: "Dos meses desde la comunicación."
  - id: b
    text:
      es: "Un mes desde la comunicación."
  - id: c
    text:
      es: "Diez días desde la comunicación."
  - id: d
    text:
      es: "Tres meses desde la comunicación."
  explanation:
    es: "La letra c) del artículo 9.2 dice que, «de forma previa a la eficacia jurídica del sistema, habrán de transcurrir dos meses desde dicha comunicación». Diez días es el plazo del informe de la Secretaría de Estado de Seguridad, no la espera del sistema. El precepto no habla de un mes ni de tres meses."
  citation: "art. 9.2.c) LPAC"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-9
- id: m02-l03-q008
  prompt:
    es: "De acuerdo con el artículo 9.2.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el órgano estatal competente por seguridad pública podrá acudir a la vía jurisdiccional previo informe vinculante de:"
  options:
  - id: a
    text:
      es: "La Secretaría General de Administración Digital, que deberá emitirlo en diez días."
  - id: b
    correct: true
    text:
      es: "La Secretaría de Estado de Seguridad, que deberá emitirlo en diez días."
  - id: c
    text:
      es: "La Secretaría de Estado de Seguridad, que deberá emitirlo en un mes."
  - id: d
    text:
      es: "La Abogacía General del Estado, que deberá emitirlo en quince días."
  explanation:
    es: "El artículo 9.2.c) LPAC dice que, durante los dos meses desde la comunicación, el órgano estatal competente por motivos de seguridad pública podrá acudir a la vía jurisdiccional «previo informe vinculante de la Secretaría de Estado de Seguridad, que deberá emitir en el plazo de diez días desde su solicitud». La Secretaría General de Administración Digital recibe la comunicación previa del sistema, y no emite ese informe. Un mes confunde el plazo del informe con el periodo de dos meses antes de la eficacia del sistema: el informe se emite en diez días. La Abogacía General del Estado no es el órgano que nombra la letra c): nombra a la Secretaría de Estado de Seguridad."
  citation: "art. 9.2.c) LPAC"
  difficulty: 3
  tags:
  - "órgano"
  - "plazo"
# anchor: fuente-clave-que-es-html
- id: m02-l03-q009
  prompt:
    es: "Según la página «¿Qué es Cl@ve?» del portal de Cl@ve, consultada el 16 de octubre de 2026, este sistema permite al ciudadano identificarse ante la Administración mediante:"
  options:
  - id: a
    text:
      es: "Datos biométricos registrados en una oficina pública."
  - id: b
    text:
      es: "Un código seguro de verificación recibido por correo postal."
  - id: c
    text:
      es: "La tarjeta sanitaria con chip y su número personal."
  - id: d
    correct: true
    text:
      es: "Claves concertadas, es decir, usuario más contraseña."
  explanation:
    es: "La página dice que el objetivo de Cl@ve es que el ciudadano pueda identificarse «mediante claves concertadas (usuario más contraseña)». No describe identificación por datos biométricos ni por tarjeta sanitaria. El código seguro de verificación sirve para comprobar documentos, no para identificar al ciudadano."
  citation: "fuente: `clave-que-es.html`"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-clave-que-es-html
- id: m02-l03-q010
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre Cl@ve recoge su portal, en la página «¿Qué es Cl@ve?» consultada el 16 de octubre de 2026?"
  options:
  - id: a
    correct: true
    text:
      es: "Complementa los sistemas de acceso mediante DNI-e y certificado electrónico."
  - id: b
    text:
      es: "Sustituye al DNI-e y al certificado electrónico, que dejan de admitirse."
  - id: c
    text:
      es: "Es un sistema propio de cada ministerio, sin uso por otras Administraciones."
  - id: d
    text:
      es: "Solo permite la firma electrónica, pero no la identificación del ciudadano."
  explanation:
    es: "La página dice que «Cl@ve complementa los actuales sistemas de acceso mediante DNI-e y certificado electrónico». No los sustituye. La misma página la describe como «una plataforma común para la identificación, autenticación y firma electrónica», así que no es propia de cada ministerio ni se limita a la firma."
  citation: "fuente: `clave-que-es.html`"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-40
- id: m02-l03-q011
  prompt:
    es: "Según el artículo 40.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las Administraciones podrán identificarse mediante un sello electrónico basado en un certificado reconocido o cualificado que reúna los requisitos exigidos por:"
  options:
  - id: a
    text:
      es: "El Esquema Nacional de Seguridad."
  - id: b
    correct: true
    text:
      es: "La legislación de firma electrónica."
  - id: c
    text:
      es: "La legislación de protección de datos personales."
  - id: d
    text:
      es: "La legislación de contratos del sector público."
  explanation:
    es: "El artículo 40.1 exige un certificado que reúna «los requisitos exigidos por la legislación de firma electrónica». El precepto no remite al Esquema Nacional de Seguridad, a la legislación de protección de datos ni a la de contratos del sector público."
  citation: "art. 40.1 LRJSP"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-40
- id: m02-l03-q012
  prompt:
    es: "De acuerdo con el artículo 40.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, se entenderá identificada la Administración Pública respecto de la información que:"
  options:
  - id: a
    text:
      es: "Se publique en el Boletín Oficial del Estado con su sello."
  - id: b
    text:
      es: "Se remita a través de la Dirección Electrónica Habilitada única."
  - id: c
    text:
      es: "Se incorpore a su sede con un código seguro de verificación."
  - id: d
    correct: true
    text:
      es: "Se publique como propia en su portal de internet."
  explanation:
    es: "El artículo 40.2 dice que se entenderá identificada la Administración «respecto de la información que se publique como propia en su portal de internet». El precepto no se refiere al Boletín Oficial del Estado, a la Dirección Electrónica Habilitada única ni al código seguro de verificación."
  citation: "art. 40.2 LRJSP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2021-5032-anexo
- id: m02-l03-q013
  prompt:
    es: "De acuerdo con el anexo de definiciones del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, el certificado electrónico es el documento emitido y firmado por la Autoridad de Certificación que:"
  options:
  - id: a
    text:
      es: "Identifica una clave privada con el prestador que la custodia."
  - id: b
    text:
      es: "Vincula un sello electrónico con el órgano que lo utiliza."
  - id: c
    correct: true
    text:
      es: "Identifica una clave pública con su propietario."
  - id: d
    text:
      es: "Acredita la integridad de un documento mediante un código."
  explanation:
    es: "El anexo define el certificado electrónico como el «documento emitido y firmado por la Autoridad de Certificación que identifica una clave pública con su propietario». La clave que identifica es la pública, no la privada, y la vincula con su propietario, no con un prestador. Vincular un sello con un órgano o acreditar la integridad de un documento no es lo que dice la definición."
  citation: "anexo RD 203/2021"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-anexo
- id: m02-l03-q014
  prompt:
    es: "En la Administración electrónica, ¿qué entidad emite y firma el certificado electrónico que identifica una clave pública con su propietario?"
  options:
  - id: a
    text:
      es: "La Autoridad de Registro."
  - id: b
    text:
      es: "La Autoridad de Validación."
  - id: c
    text:
      es: "La Secretaría General de Administración Digital."
  - id: d
    correct: true
    text:
      es: "La Autoridad de Certificación."
  explanation:
    es: "El anexo del Reglamento aprobado por el Real Decreto 203/2021 define el certificado electrónico como el documento «emitido y firmado por la Autoridad de Certificación». La Autoridad de Registro y la Autoridad de Validación son otras figuras de la infraestructura de certificados, no las que emiten y firman. La Secretaría General de Administración Digital no expide certificados según esta definición."
  citation: "anexo RD 203/2021"
  difficulty: 2
  tags:
  - "órgano"
  - "concepto"
# anchor: boe-a-2015-10565-art-12
- id: m02-l03-q015
  prompt:
    es: "Según el artículo 12.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si un interesado no obligado carece de los medios electrónicos necesarios, ¿quién puede realizar válidamente su identificación o firma electrónica?"
  options:
  - id: a
    correct: true
    text:
      es: "Un funcionario público, mediante el sistema de firma electrónica del que esté dotado."
  - id: b
    text:
      es: "Un funcionario público, mediante un certificado electrónico expedido a nombre del interesado."
  - id: c
    text:
      es: "Un empleado de la oficina de registro, con el certificado electrónico de su departamento."
  - id: d
    text:
      es: "Un notario, mediante una diligencia de identificación del interesado ante él."
  explanation:
    es: "El artículo 12.2 dice que la identificación o firma «podrá ser válidamente realizada por un funcionario público mediante el uso del sistema de firma electrónica del que esté dotado para ello». El funcionario usa su propio sistema, no un certificado a nombre del interesado ni el certificado del departamento. El precepto no atribuye esta actuación a un notario."
  citation: "art. 12.2 LPAC"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2021-5032-art-30
- id: m02-l03-q016
  prompt:
    es: "En el ámbito estatal, ¿en qué registro ha de estar inscrito el funcionario que identifica o firma electrónicamente en nombre de un interesado sin medios electrónicos?"
  options:
  - id: a
    text:
      es: "En el Registro Electrónico de Apoderamientos de la Administración General del Estado."
  - id: b
    text:
      es: "En el Registro Central de Personal de la Administración General del Estado."
  - id: c
    correct: true
    text:
      es: "En el Registro de Funcionarios Habilitados de la Administración General del Estado."
  - id: d
    text:
      es: "En el Registro Electrónico General de la Administración General del Estado."
  explanation:
    es: "El artículo 30.2 del Reglamento aprobado por el Real Decreto 203/2021 exige un funcionario «inscrito a tal efecto en el Registro de Funcionarios Habilitados de la Administración General del Estado». El Registro Electrónico de Apoderamientos inscribe poderes. El Registro Central de Personal inscribe al personal. El Registro Electrónico General recibe solicitudes y escritos. Ninguno de los tres habilita para esta actuación."
  citation: "art. 30.2 RD 203/2021"
  difficulty: 2
  tags:
  - "requisito"
  - "órgano"
