# anchor: boe-a-1986-1216-art-1
- id: m01-l07-q0060
  prompt:
    es: "De acuerdo con su artículo 1, el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, aprobado por el Real Decreto 33/1986, de 10 de enero, se aplica:"
  options:
  - id: a
    text:
      es: "Al personal funcionario y laboral de todas las Administraciones públicas."
  - id: b
    correct: true
    text:
      es: "Al personal funcionario comprendido en el artículo 1.1 de la Ley 30/1984."
  - id: c
    text:
      es: "Al personal laboral de la Administración del Estado y de sus organismos."
  - id: d
    text:
      es: "Al personal funcionario y laboral comprendido en el artículo 1.1 de la Ley 30/1984."
  explanation:
    es: "El artículo 1 lo aplica «al personal funcionario comprendido en el artículo 1, 1, de la Ley 30/1984». El personal laboral queda fuera, tanto el de la Administración del Estado como el del mismo artículo 1.1. Tampoco alcanza a todas las Administraciones públicas: su título lo ciñe a los funcionarios de la Administración del Estado."
  citation: "art. 1 RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-7
- id: m01-l07-q0071
  prompt:
    es: "De acuerdo con el artículo 7.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, es falta grave la tolerancia de los superiores respecto de la comisión, por sus subordinados, de:"
  options:
  - id: a
    correct: true
    text:
      es: "Faltas muy graves o graves."
  - id: b
    text:
      es: "Faltas de cualquier clase, también leves."
  - id: c
    text:
      es: "Faltas leves, cuando se repitan."
  - id: d
    text:
      es: "Faltas muy graves, pero no graves."
  explanation:
    es: "La letra d) del artículo 7.1 habla de la tolerancia «respecto de la comisión de faltas muy graves o graves de sus subordinados». No incluye las leves, ni siquiera cuando se repiten. Y no se limita a las muy graves: también cuentan las graves."
  citation: "art. 7.1.d) RD 33/1986"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-14
- id: m01-l07-q0083
  prompt:
    es: "¿Cuál de las siguientes sanciones figura en el Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "El demérito a efectos de carrera."
  - id: b
    text:
      es: "El despido disciplinario."
  - id: c
    text:
      es: "El traslado forzoso sin cambio de residencia."
  - id: d
    correct: true
    text:
      es: "El traslado con cambio de residencia."
  explanation:
    es: "El artículo 14 del Reglamento enumera la separación del servicio, la suspensión de funciones, el «traslado con cambio de residencia» y el apercibimiento; su apartado d) figura como derogado. El demérito y el traslado forzoso sin cambio de residencia son sanciones del artículo 96.1 del Estatuto, no del Reglamento. El despido disciplinario es del personal laboral."
  citation: "art. 14 RD 33/1986"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1986-1216-art-20
- id: m01-l07-q0086
  prompt:
    es: "De acuerdo con el artículo 20.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, las faltas muy graves, graves y leves prescriben, respectivamente:"
  options:
  - id: a
    text:
      es: "A los tres años, a los dos años y a los seis meses."
  - id: b
    text:
      es: "A los seis años, a los tres años y a los seis meses."
  - id: c
    text:
      es: "A los cinco años, a los dos años y a los tres meses."
  - id: d
    correct: true
    text:
      es: "A los seis años, a los dos años y al mes."
  explanation:
    es: "El artículo 20.1 del Reglamento dice: «Las faltas muy graves prescribirán a los seis años, las graves a los dos años y las leves al mes». Tres años, dos años y seis meses son los plazos del artículo 97.1 del Estatuto. Las otras dos series no figuran en ninguno de los dos textos."
  citation: "art. 20.1 RD 33/1986"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1986-1216-art-21
- id: m01-l07-q0087
  prompt:
    es: "Según el artículo 21.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, ¿en qué plazo prescriben las sanciones impuestas por faltas muy graves y por faltas leves?"
  options:
  - id: a
    text:
      es: "A los tres años y al año, respectivamente."
  - id: b
    text:
      es: "A los tres años y al mes, respectivamente."
  - id: c
    text:
      es: "A los seis años y a los seis meses, respectivamente."
  - id: d
    correct: true
    text:
      es: "A los seis años y al mes, respectivamente."
  explanation:
    es: "El artículo 21.1 dice que las sanciones por faltas muy graves prescriben «a los seis años» y las impuestas por faltas leves «al mes». Tres años y un año son los plazos del artículo 97.1 del Estatuto. Las otras combinaciones mezclan cifras de uno y otro texto."
  citation: "art. 21.1 RD 33/1986"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1986-1216-art-7
- id: m01-l07-q0097
  prompt:
    es: "¿Cuál de las siguientes conductas es falta grave según el artículo 7.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado?"
  options:
  - id: a
    text:
      es: "La incorrección con el público, superiores, compañeros o subordinados."
  - id: b
    correct: true
    text:
      es: "El abuso de autoridad en el ejercicio del cargo."
  - id: c
    text:
      es: "El descuido o negligencia en el ejercicio de sus funciones."
  - id: d
    text:
      es: "La falta de asistencia injustificada de un día."
  explanation:
    es: "El abuso de autoridad en el ejercicio del cargo es la falta grave de la letra b) del artículo 7.1. La incorrección, el descuido o negligencia y la falta de asistencia de un día son faltas leves del artículo 8."
  citation: "art. 7.1 RD 33/1986"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-11719-art-98
- id: m01-l07-q0108
  prompt:
    es: "De acuerdo con el artículo 98.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, la sanción por faltas muy graves o graves solo puede imponerse:"
  options:
  - id: a
    text:
      es: "Mediante procedimiento sumario con audiencia al interesado."
  - id: b
    correct: true
    text:
      es: "Mediante el procedimiento previamente establecido."
  - id: c
    text:
      es: "Mediante resolución motivada del órgano que ordenó la incoación."
  - id: d
    text:
      es: "Mediante el procedimiento que acuerde en cada caso el Instructor."
  explanation:
    es: "El artículo 98.1 dice que no podrá imponerse sanción por faltas muy graves o graves «sino mediante el procedimiento previamente establecido». El procedimiento sumario con audiencia al interesado es el de las faltas leves. Una resolución motivada del órgano que ordenó la incoación, sin más, se salta ese procedimiento. El Instructor tampoco elige el procedimiento: viene fijado de antemano."
  citation: "art. 98.1 TREBEP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1986-1216-art-33
- id: m01-l07-q0118
  prompt:
    es: "Según el artículo 33.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, iniciado el procedimiento, pueden adoptar las medidas provisionales que se estimen oportunas:"
  options:
  - id: a
    text:
      es: "El Instructor, de oficio o a petición del Secretario."
  - id: b
    correct: true
    text:
      es: "La autoridad que acordó la incoación del procedimiento."
  - id: c
    text:
      es: "El Secretario del expediente, a propuesta del Instructor."
  - id: d
    text:
      es: "El órgano competente para imponer la sanción definitiva."
  explanation:
    es: "El artículo 33.1 dice: «Iniciado el procedimiento, la Autoridad que acordó la incoación podrá adoptar las medidas provisionales que estime oportunas». El Instructor y el Secretario no tienen esa facultad. El órgano que impone la sanción solo entra al final, para resolver."
  citation: "art. 33.1 RD 33/1986"
  difficulty: 2
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1995-8730-art-21
- id: m01-l07-q0124
  prompt:
    es: "Según el artículo 21.4 del Reglamento de Situaciones Administrativas de los Funcionarios Civiles de la Administración General del Estado, el suspenso provisional tiene derecho a percibir:"
  options:
  - id: a
    correct: true
    text:
      es: "El 75 por 100 de su sueldo, trienios y pagas extraordinarias, y toda la prestación económica por hijo a cargo."
  - id: b
    text:
      es: "El 50 por 100 de su sueldo, trienios y pagas extraordinarias, y la mitad de la prestación económica por hijo a cargo."
  - id: c
    text:
      es: "El 75 por 100 de sus retribuciones básicas y complementarias, sin la prestación económica por hijo a cargo."
  - id: d
    text:
      es: "Todo su sueldo y sus trienios, sin pagas extraordinarias ni prestación económica por hijo a cargo."
  explanation:
    es: "El artículo 21.4 da al suspenso provisional «el 75 por 100 de su sueldo, trienios y pagas extraordinarias, así como la totalidad de la prestación económica por hijo a cargo». El porcentaje no es el 50 por 100, no alcanza a las complementarias y la prestación por hijo se cobra entera. Tampoco se cobra el sueldo íntegro."
  citation: "art. 21.4 RD 365/1995"
  difficulty: 2
  tags:
  - "efecto"
  - "cantidad"
# anchor: boe-a-1986-1216-art-35
- id: m01-l07-q0128
  prompt:
    es: "De acuerdo con el artículo 35.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, el Instructor formulará el pliego de cargos en un plazo:"
  options:
  - id: a
    text:
      es: "No superior a dos meses, contados a partir de la incoación del procedimiento."
  - id: b
    text:
      es: "No superior a tres meses, contados a partir de la incoación del procedimiento."
  - id: c
    text:
      es: "No superior a un mes, contado desde la primera declaración del inculpado."
  - id: d
    correct: true
    text:
      es: "No superior a un mes, contado a partir de la incoación del procedimiento."
  explanation:
    es: "El artículo 35.1 fija «un plazo no superior a un mes, contados a partir de la incoación del procedimiento». Dos o tres meses es más de lo que el artículo concede. El plazo corre desde la incoación, no desde la primera declaración del inculpado."
  citation: "art. 35.1 RD 33/1986"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1986-1216-art-37
- id: m01-l07-q0138
  prompt:
    es: "Según el artículo 37.1 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, si el plazo para practicar las pruebas se cuenta desde el día siguiente al miércoles, 10 de febrero de 2027, ¿cuándo vence?"
  options:
  - id: a
    text:
      es: "El miércoles, 24 de febrero de 2027."
  - id: b
    correct: true
    text:
      es: "El miércoles, 10 de marzo de 2027."
  - id: c
    text:
      es: "El jueves, 11 de marzo de 2027."
  - id: d
    text:
      es: "El viernes, 12 de marzo de 2027."
  explanation:
    es: "El artículo 37.1 da un mes para la práctica de las pruebas. Un plazo en meses que empieza el día siguiente al 10 de febrero termina el mismo día del mes de vencimiento (artículo 30.4 de la Ley 39/2015): el miércoles 10 de marzo de 2027. El jueves 11 añade un día. El viernes 12 son treinta días naturales, que en febrero no equivalen a un mes. El 24 de febrero son diez días hábiles."
  citation: "art. 37.1 RD 33/1986"
  difficulty: 2
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-1986-1216-art-41
- id: m01-l07-q0140
  prompt:
    es: "De acuerdo con el artículo 41 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, cumplimentadas las diligencias, se dará vista del expediente al inculpado:"
  options:
  - id: a
    text:
      es: "Con carácter inmediato, para que alegue en el plazo de quince días lo que estime pertinente."
  - id: b
    text:
      es: "Dentro del mes siguiente, para que alegue en el plazo de diez días lo que estime pertinente."
  - id: c
    text:
      es: "Solo si lo solicita, para que alegue en el plazo de diez días lo que estime pertinente."
  - id: d
    correct: true
    text:
      es: "Con carácter inmediato, para que alegue en el plazo de diez días lo que estime pertinente."
  explanation:
    es: "El artículo 41 dice que se dará vista del expediente «con carácter inmediato para que en el plazo de diez días alegue lo que estime pertinente a su defensa». El plazo no es de quince días. La vista no se aplaza al mes siguiente ni depende de que el inculpado la pida."
  citation: "art. 41 RD 33/1986"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1986-1216-art-42
- id: m01-l07-q0143
  prompt:
    es: "De acuerdo con el artículo 42 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, la propuesta de resolución la formula:"
  options:
  - id: a
    text:
      es: "El Instructor, dentro del mes siguiente."
  - id: b
    text:
      es: "El Subsecretario del Departamento, dentro de los diez días siguientes."
  - id: c
    text:
      es: "El órgano competente para sancionar, dentro de los diez días siguientes."
  - id: d
    correct: true
    text:
      es: "El Instructor, dentro de los diez días siguientes."
  explanation:
    es: "El artículo 42 dice: «El Instructor formulará dentro de los diez días siguientes la propuesta de resolución». El plazo no es de un mes. La propuesta no la hace el Subsecretario ni el órgano que sanciona: la fase instructora y la sancionadora van a órganos distintos."
  citation: "art. 42 RD 33/1986"
  difficulty: 1
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-1986-1216-art-43
- id: m01-l07-q0144
  prompt:
    es: "Según el artículo 43 del Reglamento de Régimen Disciplinario de los Funcionarios de la Administración del Estado, notificada la propuesta de resolución, ¿ante quién y en qué plazo puede alegar el interesado?"
  options:
  - id: a
    text:
      es: "Ante el órgano competente para sancionar, en el plazo de diez días."
  - id: b
    text:
      es: "Ante el Instructor, en el plazo de un mes."
  - id: c
    correct: true
    text:
      es: "Ante el Instructor, en el plazo de diez días."
  - id: d
    text:
      es: "Ante el Subsecretario del Departamento, en el plazo de quince días."
  explanation:
    es: "El artículo 43 dice que la propuesta se notifica «para que, en el plazo de diez días, pueda alegar ante el Instructor cuanto considere conveniente en su defensa». Las alegaciones no van al órgano que sanciona ni al Subsecretario, y el plazo no es de un mes ni de quince días."
  citation: "art. 43 RD 33/1986"
  difficulty: 1
  tags:
  - "órgano"
  - "plazo"
