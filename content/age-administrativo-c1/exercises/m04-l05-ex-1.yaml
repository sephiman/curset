# anchor: boe-a-2015-11719-df-cuarta
- id: m04-l05-q001
  prompt:
    es: "Según la disposición final cuarta.1 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto Legislativo 5/2015, de 30 de octubre, lo establecido en el capítulo III de su título V producirá efectos:"
  options:
  - id: a
    correct: true
    text:
      es: "a partir de la entrada en vigor de las leyes de Función Pública que se dicten en desarrollo del Estatuto."
  - id: b
    text:
      es: "a partir de la entrada en vigor del propio Estatuto, sin necesidad de ningún desarrollo legal o reglamentario posterior."
  - id: c
    text:
      es: "a partir de la aprobación de los reglamentos de provisión de puestos de cada Administración Pública."
  - id: d
    text:
      es: "a partir de la aprobación de las relaciones de puestos de trabajo de cada Departamento ministerial."
  explanation:
    es: "La disposición final cuarta.1 TREBEP dice que lo establecido en el capítulo III del título V «producirá efectos a partir de la entrada en vigor de las leyes de Función Pública que se dicten en desarrollo de este Estatuto». No surte efectos con el Estatuto mismo: queda diferido. La disposición no habla de reglamentos de provisión ni de relaciones de puestos de trabajo: lo que exige es una ley de Función Pública."
  citation: "disposición final cuarta.1 TREBEP"
  difficulty: 2
  tags:
  - "efecto"
  - "estructura"
# anchor: boe-a-2023-25758-df-septima
- id: m04-l05-q002
  prompt:
    es: "Según la disposición final séptima.2 del Real Decreto-ley 6/2023, de 19 de diciembre, el libro segundo de ese real decreto-ley se aplica:"
  options:
  - id: a
    correct: true
    text:
      es: "exclusivamente a la Administración del Estado, como norma de desarrollo del Estatuto Básico del Empleado Público."
  - id: b
    text:
      es: "a todas las Administraciones Públicas, como legislación básica del Estado en materia de función pública."
  - id: c
    text:
      es: "a la Administración del Estado y, con carácter supletorio, a las Administraciones de las Comunidades Autónomas."
  - id: d
    text:
      es: "a las Administraciones Públicas que todavía no hayan aprobado sus propias leyes de Función Pública."
  explanation:
    es: "La disposición final séptima.2 RDL 6/2023 dice que el libro segundo no tiene carácter básico y se aplica «exclusivamente a la Administración del Estado como norma de desarrollo» del texto refundido del Estatuto Básico. Por eso no es legislación básica para todas las Administraciones. Tampoco se aplica de forma supletoria a las Comunidades Autónomas ni a las Administraciones sin ley propia: la palabra «exclusivamente» lo descarta."
  citation: "disposición final séptima.2 RDL 6/2023"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2023-25758-df-septima
- id: m04-l05-q003
  prompt:
    es: "Según el Real Decreto-ley 6/2023, de 19 de diciembre, su libro segundo se aplica a la Administración del Estado como norma de desarrollo, ¿de cuál de las siguientes normas?"
  options:
  - id: a
    text:
      es: "De la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública."
  - id: b
    correct: true
    text:
      es: "Del texto refundido de la Ley del Estatuto Básico del Empleado Público."
  - id: c
    text:
      es: "Del Reglamento General de Ingreso aprobado por el Real Decreto 364/1995."
  - id: d
    text:
      es: "De la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público."
  explanation:
    es: "La disposición final séptima.2 RDL 6/2023 aplica el libro segundo a la Administración del Estado «como norma de desarrollo del texto refundido de la Ley del Estatuto Básico del Empleado Público». No lo presenta como desarrollo de la Ley 30/1984, que es anterior al Estatuto. El Reglamento General de Ingreso del Real Decreto 364/1995 es una norma reglamentaria: una norma con rango de ley no lo desarrolla. La Ley 40/2015 regula el sector público, no la función pública."
  citation: "disposición final séptima.2 RDL 6/2023"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-1995-8729-art-36
- id: m04-l05-q004
  prompt:
    es: "De acuerdo con el artículo 36 del Real Decreto 364/1995, de 10 de marzo, los puestos de trabajo adscritos a funcionarios se proveerán por los procedimientos de:"
  options:
  - id: a
    text:
      es: "libre designación, que es el sistema normal, o de concurso, según determinen las relaciones de puestos de trabajo."
  - id: b
    correct: true
    text:
      es: "concurso, que es el sistema normal, o de libre designación, según determinen las relaciones de puestos de trabajo."
  - id: c
    text:
      es: "concurso, que es el sistema normal, o de libre designación, según determine en cada caso la convocatoria."
  - id: d
    text:
      es: "concurso o de libre designación, a elección del órgano convocante según la urgencia de la provisión."
  explanation:
    es: "El artículo 36.1 RD 364/1995 dice que los puestos se proveen por «concurso, que es el sistema normal de provisión, o de libre designación, de conformidad con lo que determinen las relaciones de puestos de trabajo». El sistema normal es el concurso, no la libre designación. Qué puestos van por cada sistema lo fijan las relaciones de puestos de trabajo, no cada convocatoria ni el órgano convocante según la urgencia."
  citation: "art. 36 RD 364/1995"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1995-8729-art-36
- id: m04-l05-q005
  prompt:
    es: "Según el artículo 36 del Real Decreto 364/1995, de 10 de marzo, ¿qué carácter tiene la cobertura de puestos de trabajo mediante comisión de servicios y adscripción provisional?"
  options:
  - id: a
    correct: true
    text:
      es: "Temporal, en los supuestos previstos en el propio Reglamento."
  - id: b
    text:
      es: "Definitiva, cuando el concurso convocado para el puesto quede desierto."
  - id: c
    text:
      es: "Definitiva, cuando lo exijan las necesidades del servicio y lo prevea un Plan de Empleo."
  - id: d
    text:
      es: "Temporal, pero solo en los puestos que las relaciones reserven a la libre designación."
  explanation:
    es: "El artículo 36.3 RD 364/1995 dice que los puestos «temporalmente podrán ser cubiertos mediante comisión de servicios y adscripción provisional, en los supuestos previstos en este Reglamento». Las dos formas son temporales, así que ninguna cubre el puesto con carácter definitivo, ni por concurso desierto ni por un Plan de Empleo. El Plan de Empleo es el marco de la reasignación de efectivos. El artículo no las limita a los puestos de libre designación."
  citation: "art. 36 RD 364/1995"
  difficulty: 1
  tags:
  - "procedimiento"
  - "concepto"
# anchor: boe-a-1995-8729-art-36
- id: m04-l05-q006
  prompt:
    es: "Conforme al artículo 36 del Real Decreto 364/1995, de 10 de marzo, la reasignación de efectivos procede cuando las necesidades del servicio lo exijan y:"
  options:
  - id: a
    correct: true
    text:
      es: "como consecuencia de un Plan de Empleo."
  - id: b
    text:
      es: "como consecuencia de un concurso que haya quedado desierto."
  - id: c
    text:
      es: "como consecuencia del reingreso al servicio activo sin reserva de puesto."
  - id: d
    text:
      es: "como consecuencia del cese en un puesto de libre designación."
  explanation:
    es: "El artículo 36.2 RD 364/1995 permite cubrir puestos «mediante redistribución de efectivos o por reasignación de efectivos como consecuencia de un Plan de Empleo». Las otras opciones son supuestos de otras figuras: el concurso desierto con provisión urgente lleva a la comisión de servicios forzosa, y el reingreso sin reserva de puesto y el cese en libre designación llevan a la adscripción provisional."
  citation: "art. 36 RD 364/1995"
  difficulty: 2
  tags:
  - "procedimiento"
  - "requisito"
# anchor: boe-a-1995-8729-art-36
- id: m04-l05-q008
  prompt:
    es: "En la Administración General del Estado, ¿qué instrumento determina qué puestos de trabajo adscritos a funcionarios se proveen por libre designación?"
  options:
  - id: a
    text:
      es: "La convocatoria de cada procedimiento, en atención a la urgencia de la provisión."
  - id: b
    correct: true
    text:
      es: "Las relaciones de puestos de trabajo, en atención a la naturaleza de sus funciones."
  - id: c
    text:
      es: "La resolución del Subsecretario de cada Departamento, en atención al nivel del puesto."
  - id: d
    text:
      es: "La oferta de empleo público anual, en atención a las necesidades de personal."
  explanation:
    es: "El artículo 36.1 RD 364/1995 manda proveer los puestos por concurso o libre designación «de conformidad con lo que determinen las relaciones de puestos de trabajo en atención a la naturaleza de sus funciones». La convocatoria se limita a llamar a la provisión de un puesto ya calificado. El artículo no da esa decisión al Subsecretario. La oferta de empleo público trata del ingreso, no de la provisión de puestos."
  citation: "art. 36 RD 364/1995"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1995-8729-art-41
- id: m04-l05-q009
  prompt:
    es: "De acuerdo con el artículo 41.1 del Real Decreto 364/1995, de 10 de marzo, podrán tomar parte en los concursos los funcionarios:"
  options:
  - id: a
    correct: true
    text:
      es: "cualquiera que sea su situación administrativa, excepto los suspensos en firme mientras dure la suspensión."
  - id: b
    text:
      es: "que se encuentren en servicio activo o en servicios especiales, con exclusión de cualquier otra situación."
  - id: c
    text:
      es: "cualquiera que sea su situación administrativa, excepto los excedentes voluntarios por interés particular."
  - id: d
    text:
      es: "cualquiera que sea su situación administrativa, excepto los que estén en suspensión provisional de funciones."
  explanation:
    es: "El artículo 41.1 RD 364/1995 abre los concursos a los funcionarios «cualquiera que sea su situación administrativa, excepto los suspensos en firme que no podrán participar mientras dure la suspensión». La única exclusión es la suspensión firme. No se limita al servicio activo y a los servicios especiales, ni excluye a los excedentes voluntarios. La suspensión provisional tampoco impide participar: el artículo habla solo de los suspensos en firme."
  citation: "art. 41.1 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-41
- id: m04-l05-q010
  prompt:
    es: "Un funcionario de la Administración General del Estado cumple una suspensión firme de funciones hasta el 30 de junio de 2026. ¿Puede participar en un concurso cuyo plazo de solicitudes termina el 15 de mayo de 2026?"
  options:
  - id: a
    text:
      es: "Sí, siempre que la suspensión haya terminado antes de la toma de posesión del destino."
  - id: b
    text:
      es: "Sí, pero solo a puestos de su mismo Departamento y de igual nivel que el que tenía."
  - id: c
    text:
      es: "No, hasta que hayan pasado dos años desde el día en que termine la suspensión."
  - id: d
    correct: true
    text:
      es: "No, porque los suspensos en firme no pueden participar mientras dure la suspensión."
  explanation:
    es: "El artículo 41.1 RD 364/1995 excluye a «los suspensos en firme que no podrán participar mientras dure la suspensión», y los requisitos se reúnen en la fecha en que termina el plazo de solicitudes. El 15 de mayo de 2026 la suspensión sigue vigente, así que no puede participar. No importa que termine antes de la toma de posesión, porque esa no es la fecha de referencia. El artículo no abre una participación limitada a su Departamento. Tampoco exige esperar dos años desde el fin de la suspensión: la exclusión dura solo mientras dura la suspensión."
  citation: "art. 41.1 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1995-8729-art-41
- id: m04-l05-q011
  prompt:
    es: "Según el artículo 41.1 del Real Decreto 364/1995, de 10 de marzo, ¿cuál de las siguientes afirmaciones sobre la participación de los funcionarios en los concursos es correcta?"
  options:
  - id: a
    text:
      es: "Solo pueden participar los funcionarios destinados en el Ministerio que convoca el concurso o en sus organismos."
  - id: b
    text:
      es: "Solo pueden participar los funcionarios con destino en el municipio donde radican los puestos convocados."
  - id: c
    correct: true
    text:
      es: "Como regla general, no se les limita por el Ministerio en que prestan servicio ni por su municipio de destino."
  - id: d
    text:
      es: "No se les limita por razón del Ministerio, pero sí por el municipio, salvo autorización del órgano convocante."
  explanation:
    es: "El artículo 41.1 RD 364/1995 permite participar «sin ninguna limitación por razón del Ministerio en el que prestan servicio o de su municipio de destino», salvo en los concursos que un Plan de Empleo reserve. No hay restricción a los destinados en el Ministerio convocante ni a los del mismo municipio. Tampoco hay un límite por municipio que el órgano convocante pueda levantar: el artículo excluye los dos límites a la vez."
  citation: "art. 41.1 RD 364/1995"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-41
- id: m04-l05-q012
  prompt:
    es: "Según el artículo 41.1 del Real Decreto 364/1995, de 10 de marzo, un concurso puede reservarse a los funcionarios destinados en determinadas áreas, sectores o departamentos:"
  options:
  - id: a
    text:
      es: "cuando así lo acuerde el Departamento convocante por necesidades del servicio."
  - id: b
    correct: true
    text:
      es: "cuando así se haga en aplicación de lo dispuesto en un Plan de Empleo."
  - id: c
    text:
      es: "cuando así lo proponga la Comisión de Valoración antes de valorar los méritos."
  - id: d
    text:
      es: "cuando así lo autorice la Junta de Personal del centro donde radican los puestos."
  explanation:
    es: "El artículo 41.1 RD 364/1995 excluye toda limitación por Ministerio o municipio, «salvo en los concursos que, en aplicación de lo dispuesto en un Plan de Empleo, se reserven para los funcionarios destinados en las áreas, sectores o departamentos que se determinen». La reserva solo cabe por un Plan de Empleo. El artículo no la deja en manos del Departamento convocante, de la Comisión de Valoración ni de la Junta de Personal."
  citation: "art. 41.1 RD 364/1995"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1995-8729-art-41
- id: m04-l05-q013
  prompt:
    es: "Según el artículo 41.2 del Real Decreto 364/1995, de 10 de marzo, la permanencia mínima de dos años para participar en concursos se exceptúa en el ámbito de:"
  options:
  - id: a
    correct: true
    text:
      es: "una Secretaría de Estado o, en defecto de aquella, de un Departamento ministerial."
  - id: b
    text:
      es: "un Departamento ministerial o, en defecto de aquel, de una Secretaría de Estado."
  - id: c
    text:
      es: "una Dirección General o, en defecto de aquella, de una Secretaría General."
  - id: d
    text:
      es: "una Subsecretaría o, en defecto de aquella, de un organismo autónomo."
  explanation:
    es: "El artículo 41.2 RD 364/1995 exige dos años en cada puesto de destino definitivo, «salvo en el ámbito de una Secretaría de Estado o de un Departamento ministerial, en defecto de aquélla». El orden es ese: primero la Secretaría de Estado y, si no la hay, el Departamento. La opción que invierte el orden lo altera. Las Direcciones Generales, Secretarías Generales, Subsecretarías y organismos autónomos no aparecen en el artículo."
  citation: "art. 41.2 RD 364/1995"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-1995-8729-art-41
- id: m04-l05-q014
  prompt:
    es: "Según el artículo 41.2 del Real Decreto 364/1995, de 10 de marzo, ¿en qué puestos deben permanecer los funcionarios un mínimo de dos años para poder participar en los concursos de provisión?"
  options:
  - id: a
    text:
      es: "En cualquier puesto, incluido el desempeñado en comisión de servicios."
  - id: b
    text:
      es: "En el Cuerpo o Escala de pertenencia, con independencia del puesto."
  - id: c
    text:
      es: "Solo en los puestos obtenidos por el sistema de libre designación."
  - id: d
    correct: true
    text:
      es: "En cada puesto de trabajo de destino definitivo."
  explanation:
    es: "El artículo 41.2 RD 364/1995 dice que los funcionarios «deberán permanecer en cada puesto de trabajo de destino definitivo un mínimo de dos años». El destino provisional, como la comisión de servicios, no entra en la regla. La permanencia se mide en el puesto, no en el Cuerpo o Escala. Tampoco se limita a los puestos de libre designación: el artículo habla de cada puesto de destino definitivo."
  citation: "art. 41.2 RD 364/1995"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1995-8729-art-41
- id: m04-l05-q015
  prompt:
    es: "Según el artículo 41.2 del Real Decreto 364/1995, de 10 de marzo, ¿cuál de las siguientes circunstancias NO exime de la permanencia mínima de dos años en el puesto de destino definitivo para concursar?"
  options:
  - id: a
    text:
      es: "Que el puesto de trabajo que el funcionario ocupa haya sido suprimido."
  - id: b
    text:
      es: "Que el funcionario haya sido removido del puesto que obtuvo por concurso."
  - id: c
    correct: true
    text:
      es: "Que el puesto convocado sea de nivel superior y esté en otro Departamento ministerial."
  - id: d
    text:
      es: "Que el puesto convocado esté en el ámbito de la misma Secretaría de Estado."
  explanation:
    es: "El artículo 41.2 RD 364/1995 exceptúa de los dos años el ámbito de una Secretaría de Estado o, en su defecto, de un Departamento ministerial, los supuestos del párrafo segundo del artículo 20.1.e) de la Ley 30/1984, que es la remoción del puesto obtenido por concurso, y la supresión de puestos de trabajo. Concursar a un puesto de nivel superior en otro Departamento no figura entre las excepciones, así que sigue exigiendo los dos años. Las otras tres circunstancias sí eximen."
  citation: "art. 41.2 RD 364/1995"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-1995-8729-art-41
- id: m04-l05-q016
  prompt:
    es: "Cuatro funcionarios de la Administración General del Estado llevan un año en su puesto de destino definitivo. ¿Cuál de ellos puede participar en un concurso según el Real Decreto 364/1995, de 10 de marzo?"
  options:
  - id: a
    text:
      es: "El que concursa a un puesto de igual nivel en otro Departamento."
  - id: b
    correct: true
    text:
      es: "El que concursa a un puesto de su misma Secretaría de Estado."
  - id: c
    text:
      es: "El que concursa a un puesto de nivel superior en otro Departamento."
  - id: d
    text:
      es: "El que concursa a un puesto de un organismo de otro Departamento."
  explanation:
    es: "El artículo 41.2 RD 364/1995 exige dos años en el puesto de destino definitivo, «salvo en el ámbito de una Secretaría de Estado o de un Departamento ministerial, en defecto de aquélla». Con un año solo puede concursar quien opta a un puesto de su misma Secretaría de Estado. Concursar a otro Departamento, sea al mismo nivel, a uno superior o a un organismo suyo, no está entre las excepciones, así que los otros tres necesitan los dos años."
  citation: "art. 41.2 RD 364/1995"
  difficulty: 2
  tags:
  - "excepción"
  - "requisito"
# anchor: boe-a-1995-8729-art-53
- id: m04-l05-q017
  prompt:
    es: "Según el Real Decreto 364/1995, de 10 de marzo, ¿cuál de las siguientes afirmaciones sobre el plazo de presentación de solicitudes en el concurso y en la libre designación es correcta?"
  options:
  - id: a
    correct: true
    text:
      es: "Es de quince días hábiles tanto en el concurso como en la libre designación."
  - id: b
    text:
      es: "Es de quince días hábiles en el concurso y de quince días naturales en la libre designación."
  - id: c
    text:
      es: "Es de quince días naturales en el concurso y de quince días hábiles en la libre designación."
  - id: d
    text:
      es: "Es de quince días hábiles en el concurso; en la libre designación lo fija cada convocatoria."
  explanation:
    es: "En el concurso, el artículo 42.2 RD 364/1995 fija «quince días hábiles, contados a partir del siguiente al de la publicación de la convocatoria»; en la libre designación, el artículo 53 dice que las solicitudes se dirigen «dentro de los quince días hábiles siguientes al de la publicación de la convocatoria». El plazo es el mismo y en días hábiles en los dos. Ninguno se cuenta en días naturales, y el plazo de la libre designación lo fija el propio Reglamento, no cada convocatoria."
  citation: "art. 53 RD 364/1995"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1995-8729-art-53
- id: m04-l05-q018
  prompt:
    es: "Según el artículo 53 del Real Decreto 364/1995, de 10 de marzo, en el procedimiento de libre designación las solicitudes se dirigirán:"
  options:
  - id: a
    text:
      es: "al titular del centro al que está adscrito el puesto, dentro de los quince días hábiles siguientes a la publicación."
  - id: b
    text:
      es: "a la unidad de personal del Departamento de origen del candidato, dentro de los quince días hábiles siguientes."
  - id: c
    text:
      es: "al órgano convocante, dentro de los quince días naturales siguientes al de la publicación de la convocatoria."
  - id: d
    correct: true
    text:
      es: "al órgano convocante, en los quince días hábiles siguientes al de la publicación de la convocatoria."
  explanation:
    es: "El artículo 53 RD 364/1995 dice: «Las solicitudes se dirigirán, dentro de los quince días hábiles siguientes al de la publicación de la convocatoria, al órgano convocante». El destinatario no es el titular del centro del puesto ni la unidad de personal del Departamento de origen, aunque el plazo de esas opciones sea correcto. La opción del órgano convocante con quince días naturales cambia la clase de días: el artículo dice hábiles."
  citation: "art. 53 RD 364/1995"
  difficulty: 2
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-2007-6115-art-53
- id: m04-l05-q019
  prompt:
    es: "Según el artículo 53 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, en las comisiones de valoración de méritos, el principio de composición equilibrada de ambos sexos se aplica a:"
  options:
  - id: a
    text:
      es: "la totalidad de los miembros de la comisión, sea cual sea el órgano que los designe."
  - id: b
    text:
      es: "los miembros designados a propuesta del centro directivo que administra el personal, solo."
  - id: c
    correct: true
    text:
      es: "la representación de la Administración General del Estado y de sus organismos públicos."
  - id: d
    text:
      es: "los presidentes y secretarios de la comisión, titulares y suplentes, únicamente."
  explanation:
    es: "El artículo 53 LO 3/2007 dice que «la representación de la Administración General del Estado y de los organismos públicos vinculados o dependientes de ella en las comisiones de valoración de méritos para la provisión de puestos de trabajo se ajustará al principio de composición equilibrada de ambos sexos». El principio se aplica a la representación de la Administración, no a todos los miembros sea quien sea quien los designe. Tampoco se limita a los miembros propuestos por el centro directivo de personal ni a presidentes y secretarios."
  citation: "art. 53 LO 3/2007"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-2007-6115-da-primera
- id: m04-l05-q020
  prompt:
    es: "De acuerdo con la disposición adicional primera de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, hay composición equilibrada cuando, en el conjunto a que se refiera, las personas de cada sexo:"
  options:
  - id: a
    text:
      es: "no superan el setenta por ciento ni son menos del treinta por ciento."
  - id: b
    correct: true
    text:
      es: "no superan el sesenta por ciento ni son menos del cuarenta por ciento."
  - id: c
    text:
      es: "no superan el cincuenta y cinco por ciento ni son menos del cuarenta y cinco."
  - id: d
    text:
      es: "no superan los dos tercios ni son menos de un tercio del total."
  explanation:
    es: "La disposición adicional primera LO 3/2007 define la composición equilibrada como la presencia de mujeres y hombres en la que «las personas de cada sexo no superen el sesenta por ciento ni sean menos del cuarenta por ciento». Las bandas de setenta y treinta, de cincuenta y cinco y cuarenta y cinco, y de dos tercios y un tercio no son las de la ley."
  citation: "disposición adicional primera LO 3/2007"
  difficulty: 1
  tags:
  - "cantidad"
  - "composición"
# anchor: boe-a-2007-6115-da-primera
- id: m04-l05-q021
  prompt:
    es: "La representación de la Administración en la comisión de valoración de un concurso tiene cinco miembros. ¿Cuál de estas composiciones es equilibrada según la Ley Orgánica 3/2007, de 22 de marzo?"
  options:
  - id: a
    correct: true
    text:
      es: "Tres mujeres y dos hombres."
  - id: b
    text:
      es: "Cuatro mujeres y un hombre."
  - id: c
    text:
      es: "Cuatro hombres y una mujer."
  - id: d
    text:
      es: "Cinco personas del mismo sexo."
  explanation:
    es: "La disposición adicional primera LO 3/2007 pide que las personas de cada sexo «no superen el sesenta por ciento ni sean menos del cuarenta por ciento», y el artículo 53 aplica ese principio a la representación de la Administración en las comisiones de valoración. Con cinco miembros, tres mujeres son el 60 % y dos hombres el 40 %: cumple. Cuatro de un sexo y uno del otro dan un 80 % y un 20 %, fuera de la banda. Cinco del mismo sexo son el 100 %."
  citation: "disposición adicional primera LO 3/2007"
  difficulty: 2
  tags:
