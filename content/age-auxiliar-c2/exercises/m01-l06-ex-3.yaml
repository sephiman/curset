- id: m01-l06-q092
  prompt:
    es: "Señale durante cuántos años estimularán la acción los Objetivos y las metas de la Agenda 2030, según el preámbulo de la Resolución 70/1 de la Asamblea General de las Naciones Unidas:"
  options:
  - id: a
    text:
      es: "Diez años."
  - id: b
    correct: true
    text:
      es: "Quince años."
  - id: c
    text:
      es: "Veinte años."
  - id: d
    text:
      es: "Cinco años."
