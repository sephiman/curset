# anchor: fuente-ms-outlook-buscar-html
- id: m06-l07-q124
  prompt:
    es: "En Outlook 365, ¿cuál de las siguientes opciones describe lo que devuelve la búsqueda cc:\"miguel tórrez\" según la tabla de ejemplos de la ayuda de Outlook?"
  options:
  - id: a
    text:
      es: "Los elementos cuyo asunto contiene la frase miguel tórrez"
  - id: b
    text:
      es: "Los elementos en los que miguel tórrez está en la línea CCO"
  - id: c
    correct: true
    text:
      es: "Los elementos con el nombre miguel tórrez en la línea Cc"
  - id: d
    text:
      es: "Los elementos enviados desde miguel tórrez"
  explanation:
    es: "La palabra clave cc: busca el nombre para mostrar en la línea Cc. Los elementos enviados desde miguel tórrez los halla de:\"miguel tórrez\". Los que tienen la frase en el asunto, asunto:\"miguel tórrez\". La línea CCO se busca con cco:."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-outlook-buscar-html
- id: m06-l07-q125
  prompt:
    es: "En Outlook 365, ¿qué búsqueda devuelve los elementos en los que la dirección bobbymoore@contoso.com figura en la línea Cc, según la tabla de ejemplos de la ayuda?"
  options:
  - id: a
    text:
      es: "cco:bobbymoore@contoso.com"
  - id: b
    correct: true
    text:
      es: "CC:bobbymoore@contoso.com"
  - id: c
    text:
      es: "para:bobbymoore@contoso.com"
  - id: d
    text:
      es: "de:bobbymoore@contoso.com"
  explanation:
    es: "CC: seguido de la dirección busca esa dirección en la línea Cc. cco: busca en la línea CCO. de: limita a los elementos enviados desde esa dirección. para: halla los elementos que se enviaron a esa persona cuando se busca en Elementos enviados."
  citation: "fuente: `ms-outlook-buscar.html`; «Tablas de referencia de búsqueda para Outlook»"
