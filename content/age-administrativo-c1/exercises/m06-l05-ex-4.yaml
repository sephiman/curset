# anchor: fuente-ms-excel-atajos-html
- id: m06-l05-q104
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes teclas edita la celda activa y coloca el punto de inserción al final de su contenido?"
  options:
  - id: a
    text:
      es: "F4"
  - id: b
    text:
      es: "F3"
  - id: c
    text:
      es: "F11"
  - id: d
    correct: true
    text:
      es: "F2"
  explanation:
    es: "F2 edita la celda activa y coloca el punto de inserción al final de su contenido. F4 repite el último comando o recorre las combinaciones de referencias absolutas y relativas, F3 muestra el cuadro Pegar nombre y F11 crea un gráfico en una hoja de gráfico distinta."
  citation: "fuente: `ms-excel-atajos.html`; «Teclas de función»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-excel-atajos-html
- id: m06-l05-q105
  prompt:
    es: "En Excel 365, ¿cuál de los siguientes métodos abreviados comienza una nueva línea dentro de la misma celda?"
  options:
  - id: a
    text:
      es: "Ctrl+Entrar"
  - id: b
    correct: true
    text:
      es: "Alt+Entrar"
  - id: c
    text:
      es: "Mayús+Entrar"
  - id: d
    text:
      es: "Alt+F1"
  explanation:
    es: "Alt+Entrar comienza una nueva línea en la misma celda. Ctrl+Entrar rellena el rango seleccionado con la entrada actual, Mayús+Entrar completa la entrada y selecciona la celda de encima y Alt+F1 crea un gráfico incrustado."
  citation: "fuente: `ms-excel-atajos.html`; «Otras teclas de método abreviado útiles»"
  difficulty: 1
  tags:
  - "atajo"
