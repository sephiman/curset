# anchor: boe-a-2015-11719-art-22
- id: m05-l04-q091
  prompt:
    es: "Conforme al artículo 22.1 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿cómo se clasifican las retribuciones de los funcionarios de carrera?"
  options:
  - id: a
    text:
      es: "Se clasifican en retribuciones fijas y retribuciones variables, según su periodicidad."
  - id: b
    text:
      es: "Se clasifican en retribuciones personales y retribuciones de puesto, según su devengo."
  - id: c
    text:
      es: "Se clasifican en retribuciones salariales y retribuciones no salariales, según su naturaleza."
  - id: d
    correct: true
    text:
      es: "Se clasifican en retribuciones básicas y retribuciones complementarias."
  explanation:
    es: "El artículo 22.1 dice que las retribuciones de los funcionarios de carrera «se clasifican en básicas y complementarias». Fijas y variables, personales y de puesto, y salariales y no salariales son clasificaciones que el artículo no establece, y la distinción entre salariales y no salariales es propia del personal laboral."
  citation: "art. 22.1 TREBEP"
  difficulty: 1
  tags:
  - "concepto"
  - "estructura"
# anchor: boe-a-1984-17387-art-23
- id: m05-l04-q092
  prompt:
    es: "Según el artículo 23.3.c) de la Ley 30/1984, de 2 de agosto, de Medidas para la Reforma de la Función Pública, el complemento de productividad está destinado a retribuir:"
  options:
  - id: a
    text:
      es: "la antigüedad del funcionario, por cada tres años de servicios prestados en un mismo cuerpo o escala."
  - id: b
    correct: true
    text:
      es: "el especial rendimiento, la actividad extraordinaria y el interés o iniciativa con que el funcionario desempeñe su trabajo."
  - id: c
    text:
      es: "la adscripción del cuerpo o escala del funcionario a un determinado grupo de clasificación profesional."
  - id: d
    text:
      es: "el importe de cada una de las dos mensualidades que se perciben en junio y en diciembre."
  explanation:
    es: "El artículo 23.3.c) destina el complemento de productividad a retribuir «el especial rendimiento, la actividad extraordinaria y el interés o iniciativa con que el funcionario desempeñe su trabajo». La antigüedad por trienios, el sueldo del grupo y las pagas extraordinarias son retribuciones básicas, no complementarias."
  citation: "art. 23.3 Ley 30/1984"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2019-7414-art-59
- id: m05-l04-q093
  prompt:
    es: "Según el artículo 59.5.2.5 del IV Convenio colectivo único para el personal laboral de la Administración General del Estado, a un puesto con complemento de prolongación de jornada:"
  options:
  - id: a
    text:
      es: "solo puede asignársele la modalidad DH1 del complemento de disponibilidad horaria."
  - id: b
    text:
      es: "puede asignársele cualquier complemento de disponibilidad horaria si no supera cuarenta horas semanales."
  - id: c
    correct: true
    text:
      es: "no puede asignársele ningún complemento de disponibilidad horaria."
  - id: d
    text:
      es: "solo puede asignársele disponibilidad horaria cuando la jornada semanal no exceda de treinta y cinco horas."
  explanation:
    es: "El artículo 59.5.2.5 dispone que los puestos con el complemento de prolongación de jornada «no podrán tener asignado ningún complemento de disponibilidad horaria». Por eso no cabe ni una modalidad concreta ni una condición por horas: el límite de cuarenta horas semanales en cómputo anual es el tope de la propia prolongación, no una condición para acumular disponibilidad."
  citation: "art. 59.5.2.5 IV Convenio único"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
