# anchor: fuente-ms-win-recortes-html
- id: m06-l03-q235
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes combinaciones de teclas abre la superposición de la herramienta Recortes para capturar una instantánea de imagen?"
  options:
  - id: a
    text:
      es: "Windows+Mayús+R"
  - id: b
    text:
      es: "Windows+Mayús+M"
  - id: c
    correct: true
    text:
      es: "Windows+Mayús+S"
  - id: d
    text:
      es: "Windows+S"
  explanation:
    es: "La página de Recortes dice que la tecla Windows con Mayús y S abre la superposición para capturar una instantánea de imagen. Windows+Mayús+R captura un clip de vídeo, Windows+Mayús+M restaura las ventanas minimizadas y Windows+S abre la búsqueda."
  citation: "fuente: `ms-win-recortes.html`; «Abrir la herramienta Recortes»"
  difficulty: 1
  tags:
