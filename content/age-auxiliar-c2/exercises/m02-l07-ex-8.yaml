    text:
      es: "Forma libre"
  - id: c
    text:
      es: "Ventana"
  - id: d
    text:
      es: "Pantalla completa"
  explanation:
    es: "La página dice que el recorte de forma libre permite dibujar una forma libre alrededor de un objeto. Rectángulo arrastra el cursor para formar un rectángulo, Ventana selecciona una ventana y Pantalla completa captura toda la pantalla."
