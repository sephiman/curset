# anchor: boe-a-2003-21614-art-73
- id: m05-l05-q022
  prompt:
    es: "¿Cuál de las siguientes es la última fase de la gestión del Presupuesto de gastos del Estado, de sus organismos autónomos y de la Seguridad Social?"
  options:
  - id: a
    text:
      es: "La ordenación del pago de la obligación reconocida."
  - id: b
    correct: true
    text:
      es: "El pago material de la obligación ya ordenada."
  - id: c
    text:
      es: "El reconocimiento de la obligación derivada del gasto comprometido."
  - id: d
    text:
      es: "El compromiso del gasto previamente aprobado."
  explanation:
    es: "El artículo 73.1 enumera las fases en este orden: aprobación del gasto, compromiso, reconocimiento de la obligación, ordenación del pago y pago material. El pago material cierra la lista. La ordenación del pago es la fase anterior, y el reconocimiento de la obligación y el compromiso del gasto vienen antes."
  citation: "art. 73.1 LGP"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-2002-12506-apartado-septimo
- id: m05-l05-q025
  prompt:
    es: "Cuando el acreedor directo comunica al órgano gestor competente la transmisión de las certificaciones, cuentas o títulos que representen débitos de la Administración General del Estado, la propuesta de pago se expide a favor:"
  options:
  - id: a
    text:
      es: "Del cedente, con los datos del cesionario y la fecha de comunicación de la transmisión."
  - id: b
    correct: true
    text:
      es: "Del cesionario, con los datos del cedente y la fecha de comunicación de la transmisión."
  - id: c
    text:
      es: "Del cedente, hasta que la oficina de contabilidad certifique la toma de razón de la cesión."
  - id: d
    text:
      es: "Del cesionario, sin más dato del cedente que su número de identificación fiscal."
  explanation:
    es: "Según el apartado séptimo.1.3 de la Orden PRE/1576/2002, la propuesta de pago se expide a favor del cesionario e indica también los datos del cedente y la fecha de comunicación de la transmisión a la Administración. Expedirla a favor del cedente, con o sin esperar a la certificación de toma de razón, desconoce la cesión comunicada. Y los datos del cedente no se limitan a su número de identificación fiscal."
  citation: "apartado séptimo.1.3 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2002-12506-apartado-septimo
- id: m05-l05-q026
  prompt:
    es: "En las propuestas de pago a favor de la Administración General del Estado, los créditos de los capítulos 2, 6 y 8 con presupuesto definitivo anual superior a 50 millones de euros tienen como límite de cada propuesta:"
  options:
  - id: a
    text:
      es: "La doceava parte del crédito presupuestario anual del capítulo de gasto al que pertenecen, en cada propuesta."
  - id: b
    text:
      es: "La tercera parte del crédito presupuestario anual del capítulo de gasto al que pertenecen, en cada propuesta."
  - id: c
    text:
      es: "La décima parte del crédito presupuestario anual del capítulo de gasto al que pertenecen, en cada propuesta."
  - id: d
    correct: true
    text:
      es: "La cuarta parte del crédito presupuestario anual del capítulo de gasto al que pertenecen, en cada propuesta."
  explanation:
    es: "Para los capítulos 2, 6 y 8 con presupuesto definitivo anual superior a 50 millones de euros, cada propuesta no puede superar una cuarta parte del crédito presupuestario anual del capítulo. La doceava parte es el límite de los capítulos 4 y 7. Un tercio y una décima parte no son límites de la orden."
  citation: "apartado séptimo.5.2 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2002-12506-apartado-septimo
- id: m05-l05-q027
  prompt:
    es: "En las propuestas de pago a favor de la Administración General del Estado y del sector público institucional estatal, ¿a qué capítulos se aplica el límite de la doceava parte del crédito presupuestario definitivo anual?"
  options:
  - id: a
    correct: true
    text:
      es: "A los capítulos 4 y 7, de transferencias corrientes y de transferencias de capital."
  - id: b
    text:
      es: "A los capítulos 2 y 6, de gastos corrientes en bienes y servicios y de inversiones reales."
  - id: c
    text:
      es: "A los capítulos 1 y 2, de gastos de personal y de gastos corrientes en bienes y servicios."
  - id: d
    text:
      es: "A los capítulos 8 y 9, de activos y de pasivos financieros."
  explanation:
    es: "El límite de la doceava parte del crédito presupuestario definitivo anual rige para los capítulos 4 y 7, de transferencias. Los capítulos 2, 6 y 8 tienen el límite de una cuarta parte, si su presupuesto definitivo anual supera 50 millones de euros. Los capítulos de personal y de pasivos financieros no figuran en ninguno de los dos límites."
  citation: "apartado séptimo.5.3 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2002-12506-apartado-septimo
- id: m05-l05-q028
  prompt:
    es: "En las propuestas de pago a favor de la Administración General del Estado y de su sector público institucional, ¿quién puede acordar la superación de los límites de importe, previa justificación motivada de la entidad beneficiaria?"
  options:
  - id: a
    text:
      es: "La Intervención General de la Administración del Estado."
  - id: b
    text:
      es: "La Dirección General de Presupuestos."
  - id: c
    text:
      es: "La persona titular del Ministerio de Hacienda."
  - id: d
    correct: true
    text:
      es: "La Dirección General del Tesoro y Política Financiera."
  explanation:
    es: "La Dirección General del Tesoro y Política Financiera puede acordar que se supere el límite, previa justificación debidamente motivada de la entidad beneficiaria del pago. La Intervención General de la Administración del Estado controla el gasto y la Dirección General de Presupuestos gestiona los créditos: ninguna acuerda la superación. La persona titular del Ministerio de Hacienda queda un nivel por encima y la orden no le atribuye esa facultad."
  citation: "apartado séptimo.5.2 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2002-12506-apartado-septimo
- id: m05-l05-q029
  prompt:
    es: "Con carácter general, ¿a favor de quiénes se expiden las propuestas de pago de las obligaciones de la Administración General del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "De los acreedores directos, salvo en los supuestos en que lo sean de agentes mediadores en el pago."
  - id: b
    text:
      es: "De las Cajas pagadoras, Habilitaciones y Pagadurías de cada departamento ministerial."
  - id: c
    text:
      es: "De la Dirección General del Tesoro y Política Financiera, que las reparte entre los acreedores."
  - id: d
    text:
      es: "De los órganos gestores, que abonan después a los acreedores finales."
  explanation:
    es: "El apartado séptimo.1 de la Orden PRE/1576/2002 dispone que todas las propuestas de pago se expiden a favor de los acreedores directos, salvo en los supuestos del séptimo.2, en que lo son de agentes mediadores en el pago. Las Cajas pagadoras, Habilitaciones y Pagadurías son esos agentes mediadores, pero solo en los supuestos del séptimo.2. La Dirección General del Tesoro y los órganos gestores no son perceptores de la propuesta."
  citation: "apartado séptimo.1 Orden PRE/1576/2002"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1989-14441-art-1
- id: m05-l05-q030
  prompt:
    es: "¿Qué carácter tienen las provisiones de fondos que se realizan a pagadurías, cajas y habilitaciones como anticipos de Caja fija?"
  options:
  - id: a
    text:
      es: "Presupuestario y permanente, con aplicación inmediata al capítulo de gastos corrientes en bienes y servicios."
  - id: b
    text:
      es: "Extrapresupuestario y temporal, hasta la justificación de los gastos al final del ejercicio."
  - id: c
    correct: true
    text:
      es: "Extrapresupuestario y permanente, para la atención inmediata de gastos periódicos o repetitivos."
  - id: d
    text:
      es: "Presupuestario y temporal, con el carácter de pagos a justificar."
  explanation:
    es: "El artículo 1 define los anticipos de Caja fija como provisiones de fondos de carácter extrapresupuestario y permanente a pagadurías, cajas y habilitaciones. Presupuestario y temporal, con carácter de pago a justificar, es justo lo contrario: el propio artículo dice que no tienen la consideración de pagos a justificar. Las otras dos opciones cambian una de las dos notas, presupuestario por extrapresupuestario o temporal por permanente."
  citation: "art. 1 RD 725/1989"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1989-14441-art-1
- id: m05-l05-q031
  prompt:
    es: "Los anticipos de Caja fija se destinan a la atención inmediata de gastos periódicos o repetitivos, como los referentes a:"
  options:
  - id: a
    text:
      es: "Retribuciones del personal, cuotas de la Seguridad Social y gastos de formación y acción social."
  - id: b
    text:
      es: "Adquisición de bienes inventariables, construcción de edificios y compra de maquinaria."
  - id: c
    correct: true
    text:
      es: "Dietas, gastos de locomoción, material no inventariable, conservación y tracto sucesivo."
  - id: d
    text:
      es: "Subvenciones y transferencias corrientes a otras entidades públicas y privadas."
  explanation:
    es: "El artículo 1 cita como ejemplos las dietas, los gastos de locomoción, el material no inventariable, la conservación y el tracto sucesivo, todos del capítulo de gastos corrientes en bienes y servicios. Las retribuciones y las cuotas sociales son gastos de personal. Los bienes inventariables son inversiones reales, y las transferencias y subvenciones no son gastos corrientes en bienes y servicios."
  citation: "art. 1 RD 725/1989"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1989-14441-art-2
- id: m05-l05-q032
  prompt:
    es: "¿Quiénes pueden establecer el sistema de anticipos de Caja fija, mediante acuerdo de sus titulares?"
  options:
  - id: a
    correct: true
    text:
      es: "Los Departamentos ministeriales y los Organismos autónomos, administrativos, comerciales, industriales o financieros."
  - id: b
    text:
      es: "Solo los Departamentos ministeriales, previo informe de la Intervención General de la Administración del Estado."
  - id: c
    text:
      es: "Las Delegaciones de Hacienda, mediante resolución del Delegado de Hacienda de cada provincia donde tengan sede."
  - id: d
    text:
      es: "Las Cajas pagadoras, mediante acuerdo del Cajero pagador con el visto bueno del Interventor delegado del departamento."
  explanation:
    es: "El artículo 2.1 faculta a los Departamentos ministeriales y a los Organismos autónomos, de cualquier tipo, a establecer el sistema mediante acuerdo de sus titulares. No es exclusivo de los departamentos, ni lo establecen las Delegaciones de Hacienda ni las propias Cajas pagadoras, que son las receptoras del anticipo."
  citation: "art. 2.1 RD 725/1989"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2003-21614-art-78
- id: m05-l05-q033
  prompt:
    es: "Un organismo autónomo tiene 3.000.000 de euros de créditos de gastos corrientes en bienes y servicios. ¿Cuál es el máximo de sus anticipos de Caja fija?"
  options:
  - id: a
    text:
      es: "150.000 euros, el cinco por ciento del total de esos créditos."
  - id: b
    text:
      es: "300.000 euros, el diez por ciento del total de esos créditos."
  - id: c
    text:
      es: "420.000 euros, el catorce por ciento del total de esos créditos."
  - id: d
    correct: true
    text:
      es: "210.000 euros, el siete por ciento del total de esos créditos."
  explanation:
    es: "El artículo 78.3 LGP dice que la cuantía global de los anticipos de caja fija «no podrá superar para cada ministerio u organismo autónomo el siete por ciento del total de créditos del capítulo destinado a gastos corrientes en bienes y servicios»: 3.000.000 x 0,07 = 210.000 euros. El 14 por ciento es el máximo que el segundo párrafo autoriza a la Agencia Española de Cooperación Internacional, no a un organismo autónomo ordinario. El 10 por ciento es el máximo del tercer párrafo, aplicable solo a los créditos del artículo 23 del programa 222A del Ministerio del Interior. El cinco por ciento no coincide con el siete por ciento del primer párrafo."
  citation: "art. 78.3 LGP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2003-21614-art-78
- id: m05-l05-q035
  prompt:
    es: "Según el artículo 78.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el siete por ciento puede subir hasta el diez por ciento de los créditos del artículo 23 del programa 222A del Ministerio del Interior, aplicable:"
  options:
  - id: a
    text:
      es: "A toda la gestión de anticipos de Caja fija del Ministerio del Interior y de sus organismos."
  - id: b
    text:
      es: "Solo a los anticipos de las Cajas pagadoras periféricas del Ministerio del Interior."
  - id: c
    correct: true
    text:
      es: "Únicamente a la gestión del indicado artículo, «Indemnizaciones por razón del servicio»."
  - id: d
    text:
      es: "A la gestión de todos los artículos del capítulo 2 del programa 222A de ese Ministerio."
  explanation:
    es: "La ley permite elevar el porcentaje hasta el diez por ciento de los créditos del artículo 23, «Indemnizaciones por razón del servicio», del programa 222A, y lo hace aplicable únicamente a la gestión de ese artículo. No vale para toda la gestión del Ministerio ni para las Cajas periféricas ni para el resto de artículos del programa."
  citation: "art. 78.3 LGP"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-1989-14441-art-2
- id: m05-l05-q036
  prompt:
    es: "¿Cuál de los siguientes pagos individualizados puede superar los 5.000 euros con cargo al anticipo de Caja fija?"
  options:
  - id: a
    text:
      es: "La compra de material de oficina no inventariable del departamento y de sus servicios."
  - id: b
    text:
      es: "La reparación de la maquinaria y de las instalaciones de un servicio del departamento."
  - id: c
    correct: true
    text:
      es: "El pago de la factura de energía eléctrica de un edificio del departamento."
  - id: d
    text:
      es: "El alquiler de un local para una oficina del departamento en la capital."
  explanation:
    es: "El artículo 2.3 prohíbe los pagos individualizados superiores a 5.000 euros, excepto los de teléfono, energía eléctrica, combustibles o indemnizaciones por razón del servicio. La energía eléctrica es una de esas excepciones. El material de oficina no inventariable, la reparación de maquinaria y el alquiler de un local no lo son, así que no pueden pasar de 5.000 euros."
  citation: "art. 2.3 RD 725/1989"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-1989-14441-art-2
- id: m05-l05-q037
  prompt:
    es: "¿Puede la Caja pagadora de un ministerio abonar con el anticipo de Caja fija una única factura de teléfono de 5.800 euros?"
  options:
  - id: a
    text:
      es: "No, porque ningún pago individualizado con cargo al anticipo puede superar los 5.000 euros."
  - id: b
    text:
      es: "Sí, pero solo si la factura se fracciona en dos pagos de 2.900 euros cada uno."
  - id: c
    text:
      es: "No, porque el teléfono no es un gasto corriente en bienes y servicios del presupuesto."
  - id: d
    correct: true
    text:
      es: "Sí, porque los gastos de teléfono están exceptuados del límite de 5.000 euros por pago."
  explanation:
    es: "El límite de 5.000 euros por pago individualizado tiene excepciones, entre ellas el teléfono, así que una factura de 5.800 euros puede pagarse con el anticipo. Fraccionar un único gasto en varios pagos está prohibido. Y el teléfono sí es un gasto corriente en bienes y servicios, por lo que no queda fuera por esa causa."
  citation: "art. 2.3 RD 725/1989"
  difficulty: 2
  tags:
  - "excepción"
  - "cantidad"
# anchor: boe-a-1989-14441-art-2
- id: m05-l05-q038
  prompt:
    es: "Según el artículo 2.3 del Real Decreto 725/1989, de 16 de junio, sobre anticipos de Caja fija, a efectos de los límites del anticipo de Caja fija, ¿qué queda prohibido?"
  options:
  - id: a
    text:
      es: "Acumular en un solo justificante pagos de diversos gastos, pero no fraccionar un único gasto en varios pagos."
  - id: b
    correct: true
    text:
      es: "Acumular en un solo justificante pagos de diversos gastos y fraccionar un único gasto en varios pagos."
  - id: c
    text:
      es: "Fraccionar un único gasto en varios pagos, pero no acumular en un solo justificante pagos de diversos gastos."
  - id: d
    text:
      es: "Fraccionar un único gasto en varios pagos solo cuando el gasto supere los 5.000 euros."
  explanation:
    es: "El artículo 2.3 prohíbe las dos cosas: acumular en un solo justificante pagos de diversos gastos y fraccionar un único gasto en varios pagos. Las opciones que prohíben solo una de las dos conductas están incompletas. Y el fraccionamiento está prohibido siempre, no solo cuando el gasto supere 5.000 euros."
  citation: "art. 2.3 RD 725/1989"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1989-14441-art-2
- id: m05-l05-q039
  prompt:
    es: "Establecido el sistema de anticipos de Caja fija en un Ministerio, no pueden tramitarse libramientos aplicados al presupuesto a favor de perceptores directos:"
  options:
  - id: a
    text:
      es: "Por importe inferior a 600 euros, con imputación a los conceptos del artículo 1, incluidos los de reposición."
  - id: b
    text:
      es: "Por importe superior a 600 euros, con imputación a los conceptos del artículo 1, salvo los de reposición."
  - id: c
    correct: true
    text:
      es: "Por importe inferior a 600 euros, con imputación a los conceptos del artículo 1, salvo los de reposición."
  - id: d
    text:
      es: "Por importe inferior a 5.000 euros, con imputación a gastos de personal, salvo los de dietas o locomoción."
  explanation:
    es: "Una vez establecido el sistema, no pueden tramitarse libramientos al presupuesto a favor de perceptores directos por importe inferior a 600 euros con imputación a los conceptos del artículo 1, excepto los de reposición del anticipo. Incluir la reposición contradice la excepción. Invertir el umbral a más de 600 euros prohíbe lo contrario de lo que dice el texto, y los 5.000 euros y los gastos de personal pertenecen a otro límite y a otro capítulo."
  citation: "art. 2.3 RD 725/1989"
  difficulty: 3
  tags:
  - "cantidad"
  - "excepción"
# anchor: boe-a-1996-2749-apartado-decimo
- id: m05-l05-q040
  prompt:
    es: "Según el apartado décimo.2 de la Orden de 1 de febrero de 1996 por la que se aprueban los documentos contables a utilizar por la Administración General del Estado, ¿quién autoriza el documento Adopción/Distribución de anticipos de caja fija?"
  options:
  - id: a
    correct: true
    text:
      es: "La Autoridad que haya adoptado el correspondiente acuerdo."
  - id: b
    text:
      es: "El jefe de la Unidad Central a la que esté adscrita la caja pagadora."
  - id: c
    text:
      es: "El Interventor delegado que informa favorablemente el acuerdo de distribución."
  - id: d
    text:
      es: "El Cajero pagador de la Caja que recibe el anticipo."
  explanation:
    es: "El documento de adopción o distribución de anticipos de caja fija lo autoriza la Autoridad que adoptó el acuerdo. El jefe de la Unidad Central autoriza otro documento: el de control de pagos a justificar. El Interventor delegado informa el acuerdo pero no autoriza el documento, y el Cajero pagador es el receptor del anticipo."
  citation: "apartado décimo.2 Orden de documentos contables"
  difficulty: 3
  tags:
  - "órgano"
# anchor: boe-a-1989-14441-art-6
- id: m05-l05-q041
  prompt:
    es: "Según el artículo 6.1 del Real Decreto 725/1989, de 16 de junio, sobre anticipos de Caja fija, los fondos de las cuentas de anticipos de Caja fija se disponen mediante cheques nominativos o transferencias bancarias autorizados con:"
  options:
  - id: a
    text:
      es: "La firma individual del Cajero pagador, con el visto bueno posterior del Interventor delegado de la Caja."
  - id: b
    correct: true
    text:
      es: "Las firmas mancomunadas del Cajero pagador y del funcionario que designe el Jefe de la Unidad de la Caja pagadora."
  - id: c
    text:
      es: "Las firmas mancomunadas del Cajero pagador y del Interventor delegado del departamento ministerial correspondiente."
  - id: d
    text:
      es: "La firma del Jefe de la Unidad Administrativa, que puede delegarla en el Cajero pagador de la Caja pagadora."
  explanation:
    es: "Los fondos se disponen con las firmas mancomunadas del Cajero pagador y del funcionario que designe el Jefe de la Unidad Administrativa a la que esté adscrita la Caja, o de sus sustitutos. La firma individual del Cajero y la del Jefe, delegable en el Cajero, rompen la mancomunidad. El Interventor delegado controla pero no firma las disposiciones de fondos."
  citation: "art. 6.1 RD 725/1989"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1989-14441-art-7
- id: m05-l05-q042
  prompt:
    es: "De acuerdo con el artículo 7.1 del Real Decreto 725/1989, de 16 de junio, sobre anticipos de Caja fija, los Cajeros pagadores rinden cuentas de los gastos atendidos, además de en diciembre, cuando:"
  options:
  - id: a
    text:
      es: "El Interventor delegado lo requiera por escrito al final de cada trimestre natural."
  - id: b
    text:
      es: "Se agote el límite de 5.000 euros fijado para cada pago individualizado."
  - id: c
    correct: true
    text:
      es: "Sus necesidades de tesorería aconsejen la reposición de los fondos utilizados."
  - id: d
    text:
      es: "El Jefe de la Unidad Administrativa lo ordene por escrito a la Caja pagadora."
  explanation:
    es: "Los Cajeros pagadores rinden cuentas a medida que sus necesidades de tesorería aconsejen la reposición de los fondos utilizados y, necesariamente, en el mes de diciembre. El requerimiento trimestral del Interventor, el agotamiento del límite de 5.000 euros por pago y la orden escrita del Jefe de la Unidad no son momentos de rendición que fije el artículo."
  citation: "art. 7.1 RD 725/1989"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1989-14441-art-7
- id: m05-l05-q044
  prompt:
    es: "Según el artículo 7.3 del Real Decreto 725/1989, de 16 de junio, sobre anticipos de Caja fija, la Intervención autoriza los documentos contables de reposición una vez comprobado que:"
  options:
  - id: a
    text:
      es: "Cada factura de las cuentas es inferior a 5.000 euros, sin excepción alguna por el concepto del gasto."
  - id: b
    text:
      es: "El examen fiscal posterior de las cuentas no ha señalado defectos ni anomalías de ningún tipo."
  - id: c
    text:
      es: "El Cajero pagador ha rendido las cuentas en el mes de diciembre del ejercicio anterior."
  - id: d
    correct: true
    text:
      es: "El importe total de las cuentas justificativas coincide con el de los documentos contables."
  explanation:
    es: "La Intervención comprueba que el importe total de las cuentas justificativas coincide con el de los documentos contables y los autoriza, con independencia del resultado del examen fiscal. Por eso la ausencia de defectos en ese examen no es requisito. El límite de 5.000 euros tiene excepciones y la rendición en diciembre es solo uno de los momentos de rendir cuentas."
  citation: "art. 7.3 RD 725/1989"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1989-14441-art-7
- id: m05-l05-q045
  prompt:
    es: "Según el artículo 7.4 del Real Decreto 725/1989, de 16 de junio, sobre anticipos de Caja fija, ante defectos señalados por la Intervención, ¿qué plazos tiene el órgano gestor para alegar y subsanar y para dar cuenta al Interventor?"
  options:
  - id: a
    text:
      es: "Diez días para alegar y subsanar, y diez días más para dar cuenta al Interventor."
  - id: b
    correct: true
    text:
      es: "Quince días para alegar y subsanar, y quince días para dar cuenta al Interventor."
  - id: c
    text:
      es: "Un mes para alegar y subsanar, y quince días para dar cuenta al Interventor delegado."
  - id: d
    text:
      es: "Quince días para alegar y subsanar, y un mes para dar cuenta al Interventor delegado."
  explanation:
    es: "Si el informe hace constar defectos o anomalías, el órgano gestor alega y, en su caso, subsana en un plazo de quince días, antes de remitir la cuenta al Tribunal de Cuentas, y da cuenta al Interventor en otro plazo de quince días. Las demás opciones sustituyen uno de los dos plazos, o ambos, por diez días o por un mes."
  citation: "art. 7.4 RD 725/1989"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1989-14441-art-7
- id: m05-l05-q046
  prompt:
    es: "Tras el informe de la Intervención sobre una cuenta de anticipos de Caja fija, ¿quién envía la cuenta al Tribunal de Cuentas?"
  options:
  - id: a
    correct: true
    text:
      es: "Los Jefes de las Unidades Administrativas que aprobaron la cuenta."
  - id: b
    text:
      es: "La Intervención delegada, central o territorial, que la examinó."
  - id: c
    text:
      es: "El Cajero pagador que la rindió, con el informe de la Intervención adjunto."
  - id: d
    text:
      es: "La Dirección General del Tesoro y Política Financiera, tras el informe."
  explanation:
    es: "El informe de la Intervención se remite, junto con la cuenta, a los Jefes de las Unidades Administrativas que aprobaron la cuenta, que la envían al Tribunal de Cuentas. La Intervención solo informa, el Cajero pagador rindió la cuenta antes y la Dirección General del Tesoro no interviene en el envío."
  citation: "art. 7.4 RD 725/1989"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1989-14441-art-9
- id: m05-l05-q047
  prompt:
    es: "Un Ministerio formula en la primera quincena de abril de 2027 el estado de situación de Tesorería de sus Cajas pagadoras, según el artículo 9.1 del Real Decreto 725/1989, de 16 de junio, sobre anticipos de Caja fija. ¿A qué fecha debe referirse?"
  options:
  - id: a
    text:
      es: "Al viernes 1 de enero de 2027, primer día del ejercicio y del primer trimestre."
  - id: b
    correct: true
    text:
      es: "Al miércoles 31 de marzo de 2027, último día del trimestre natural inmediato anterior."
  - id: c
    text:
      es: "Al jueves 15 de abril de 2027, último día de la primera quincena de abril."
  - id: d
    text:
      es: "Al viernes 30 de abril de 2027, último día del mes de formulación del estado."
  explanation:
    es: "El artículo 9.1 manda formular, como mínimo, en las primeras quincenas de enero, abril, julio y octubre, estados de situación de Tesorería referidos al último día del trimestre inmediato anterior. Para el estado de abril de 2027, el trimestre anterior termina el miércoles 31 de marzo de 2027. El primer día del ejercicio, el último de la quincena y el último de abril no son la fecha de referencia."
  citation: "art. 9.1 RD 725/1989"
  difficulty: 2
  tags:
  - "fecha"
  - "cómputo"
# anchor: boe-a-1996-2627-regla-36
- id: m05-l05-q048
  prompt:
    es: "La propuesta de reposición de fondos al Cajero pagador de un anticipo de Caja fija se contabiliza con un documento ADOK, que:"
  options:
  - id: a
    text:
      es: "Se acompaña al acuerdo de distribución y se expide por el importe total del anticipo concedido a la Caja pagadora."
  - id: b
    text:
      es: "Se expide a favor del Interventor delegado, antes de que el Cajero pagador rinda la cuenta justificativa."
  - id: c
    text:
      es: "Se remite a la Dirección General del Tesoro, que lo expide con cargo a una aplicación extrapresupuestaria."
  - id: d
    correct: true
    text:
      es: "Se acompaña a la cuenta justificativa y se expide con cargo a las mismas aplicaciones y por sus importes."
  explanation:
    es: "La regla 36 contabiliza con un documento ADOK la aplicación a presupuesto de los gastos y la propuesta de reposición de fondos, y lo acompaña a la cuenta justificativa, con las mismas aplicaciones y los importes de la cuenta. No se refiere al importe total del anticipo ni se expide antes de la cuenta, ni a favor del Interventor, ni por la Dirección General del Tesoro con aplicación extrapresupuestaria."
  citation: "regla 36 IOC"
  difficulty: 3
  tags:
  - "procedimiento"
