- id: m03-l04-q027
  prompt:
    es: "Un organismo autónomo estatal licita en 2026 el mantenimiento de sus equipos informáticos con un valor estimado de 140.000 euros justos. ¿Está sujeto a regulación armonizada?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, porque su valor estimado es igual al umbral de 140.000 euros."
  - id: b
    text:
      es: "No, porque los contratos de servicios solo se armonizan desde 750.000 euros."
  - id: c
    text:
      es: "No, porque para estar sujeto el valor estimado debe superar los 140.000 euros."
  - id: d
    text:
      es: "No, porque para los organismos autónomos el umbral es de 216.000 euros."
  explanation:
    es: "El artículo 22.1 LCSP somete a regulación armonizada los servicios cuyo valor estimado «sea igual o superior» al umbral, y para los organismos autónomos el umbral es de 140.000 euros (letra a). Un valor igual al umbral basta, así que falla la opción que exige superarlo. Los 216.000 euros son para las entidades distintas de la Administración General del Estado, sus organismos autónomos y las Entidades Gestoras. Los 750.000 euros solo rigen para los servicios del anexo IV."
  citation: "art. 22.1.a) LCSP"
  difficulty: 3
  tags:
  - "cantidad"
