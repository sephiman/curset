  difficulty: 2
  tags:
  - "bienes de inversión"
# anchor: boe-a-1992-28740-art-109
- id: m03-l19-q0214
  prompt:
    es: "Conforme al artículo 109.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, para regularizar, conocido el porcentaje de deducción definitivo de cada año, se determina el importe de la deducción que procedería:"
  options:
  - id: a
    text:
      es: "si las cuotas se hubiesen soportado al valor de mercado del bien en ese año."
  - id: b
    correct: true
    text:
      es: "si la repercusión de las cuotas se hubiese soportado en el año que se considere."
  - id: c
    text:
      es: "si el porcentaje provisional de ese año hubiese sido igual al de la adquisición."
  - id: d
    text:
      es: "si el bien de inversión se hubiese adquirido en el año anterior al que se considere."
  explanation:
    es: "La primera regla calcula la deducción que procedería si las cuotas se hubieran soportado en el año considerado, con el porcentaje definitivo de ese año. Cambiar el año de adquisición, usar el porcentaje provisional o el valor de mercado no es lo que dice el artículo."
  citation: "art. 109 LIVA"
  difficulty: 3
  tags:
  - "bienes de inversión"
  - "regularización"
# anchor: boe-a-1992-28740-art-109
- id: m03-l19-q0215
  prompt:
    es: "Según el artículo 109.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, el importe de la deducción que procedería en el año considerado, una vez determinado, se resta:"
  options:
  - id: a
    text:
      es: "del importe de la deducción efectuada en el año inmediato anterior al considerado."
  - id: b
    text:
      es: "del importe de la base imponible de la adquisición del bien de inversión."
  - id: c
    correct: true
    text:
      es: "del de la deducción efectuada en el año en que tuvo lugar la repercusión."
  - id: d
    text:
      es: "del importe de la cuota soportada en el año de la adquisición del bien."
  explanation:
    es: "La resta se hace contra la deducción efectuada en el año de la repercusión. No se resta de la cuota total, de la deducción del año anterior ni de la base imponible de la adquisición."
  citation: "art. 109 LIVA"
  difficulty: 3
  tags:
  - "bienes de inversión"
  - "regularización"
# anchor: boe-a-1992-28740-art-107
- id: m03-l19-q0229
  prompt:
    es: "Señale la respuesta CORRECTA sobre la regularización de las cuotas deducibles por la adquisición de terrenos o edificaciones cuya utilización efectiva se inicia después de adquiridos, de acuerdo con el artículo 107.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    correct: true
    text:
      es: "Se efectúa el año en que se inicia su utilización o entrada en funcionamiento y los nueve años naturales siguientes."
  - id: b
    text:
      es: "Se efectúa el año de la adquisición y los nueve años naturales siguientes, sea cual sea la fecha de utilización."
  - id: c
    text:
      es: "Se efectúa el año en que se inicia su utilización o entrada en funcionamiento y los cuatro años naturales siguientes."
  - id: d
    text:
      es: "Se efectúa el año en que se inicia su utilización o entrada en funcionamiento y los diez años naturales siguientes."
  explanation:
    es: "Si la utilización efectiva o la entrada en funcionamiento de terrenos o edificaciones se inicia después de su adquisición, la regularización se efectúa el año en que se producen esas circunstancias y los nueve años naturales siguientes (art. 107.Tres). Los cuatro años siguientes son los de los demás bienes de inversión (art. 107.Uno). Contar desde la adquisición ignora el retraso en la utilización. Y los diez años no son el plazo: el divisor de diez de la regularización anual no es el período (art. 109)."
  citation: "art. 107.Tres LIVA"
  difficulty: 2
  tags:
  - "regularización"
  - "bienes de inversión"
# anchor: boe-a-1992-28740-art-108
- id: m03-l19-q0230
  prompt:
    es: "Según el artículo 108.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué consideración tienen, a efectos de los bienes de inversión, los envases y embalajes aunque sean susceptibles de reutilización?"
  options:
  - id: a
    text:
      es: "Tienen la consideración de bienes de inversión solo si se cargan a los destinatarios de la operación."
  - id: b
    text:
      es: "Tienen la consideración de bienes de inversión si se utilizan más de un año en la actividad."
  - id: c
    text:
      es: "Tienen la consideración de bienes de inversión cuando su valor de adquisición supera quinientas mil pesetas."
  - id: d
    correct: true
    text:
      es: "No tienen la consideración de bienes de inversión, aunque sean susceptibles de reutilización."
  explanation:
    es: "Los envases y embalajes, aunque sean susceptibles de reutilización, no tienen la consideración de bienes de inversión (art. 108.Dos.3.º). Que se utilicen más de un año es el rasgo general de los bienes de inversión (art. 108.Uno), pero el apartado Dos excluye expresamente estos bienes. El umbral de quinientas mil pesetas es la exclusión de otros bienes de menor valor (art. 108.Dos.5.º) y no convierte en bien de inversión lo que el apartado excluye. Cargar su importe a los destinatarios los incluye en la base imponible (art. 78.Dos.6.º) y no cambia su condición."
  citation: "art. 108.Dos LIVA"
  difficulty: 3
