  tags:
  - "configuración"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q242
  prompt:
    es: "¿Cuál de las siguientes opciones se selecciona después de Extensiones, en Microsoft Edge, en Windows 11, para buscar una extensión nueva?"
  options:
  - id: a
    text:
      es: "Administrar extensiones"
  - id: b
    correct: true
    text:
      es: "Obtener extensiones para Microsoft Edge"
  - id: c
    text:
      es: "Más acciones"
  - id: d
    text:
      es: "Notificar abuso"
  explanation:
    es: "Tras seleccionar Extensiones se elige Obtener extensiones para Microsoft Edge. Administrar extensiones es la opción para desactivar una extensión. Más acciones es la opción para quitar una extensión, junto a la extensión que se quiere quitar. Notificar abuso es la opción para informar de una extensión en el sitio web de complementos."
  citation: "fuente: `ms-edge-extensiones.html`; «Buscar y agregar una extensión a Microsoft Edge»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q243
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿qué botón se selecciona, tras revisar los permisos que pide una extensión, para seguir con la instalación?"
  options:
  - id: a
    text:
      es: "Quitar la extensión"
  - id: b
    correct: true
    text:
      es: "Agregar extensión"
  - id: c
    text:
      es: "Obtener la extensión"
  - id: d
    text:
      es: "Permitir otros almacenes"
  explanation:
    es: "Tras revisar los permisos requeridos por la extensión se selecciona Agregar extensión para continuar. Obtener es el botón que se selecciona antes, junto a la extensión que se quiere agregar. Quitar es la opción para eliminar una extensión de Edge. Permitir es la opción del cuadro de diálogo para permitir extensiones de otros almacenes."
  citation: "fuente: `ms-edge-extensiones.html`; «Buscar y agregar una extensión a Microsoft Edge»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q244
  prompt:
    es: "En Microsoft Edge, en Windows 11, ¿pueden usarse en Microsoft Edge las extensiones diseñadas para Google Chrome?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí, pueden usarse, por ejemplo agregándolas desde Chrome Web Store"
  - id: b
    text:
      es: "Sí, pero solo en una ventana de InPrivate de Microsoft Edge"
  - id: c
    text:
      es: "Sí, pero solo en Windows 10, no en Windows 11"
  - id: d
    text:
      es: "No, solo funcionan las extensiones del sitio de complementos de Microsoft Edge"
  explanation:
    es: "Las extensiones diseñadas para Google Chrome también pueden usarse en Microsoft Edge, por ejemplo desde Chrome Web Store. La página dice que las de Chrome también pueden usarse en Edge, no solo las de su propio sitio de complementos. No se limitan a InPrivate: pueden usarse en Edge, y en InPrivate solo se ejecutan las que tienen permiso concedido. La página se aplica a Windows 11 y Windows 10, sin limitar a Windows 10 las extensiones de Chrome."
  citation: "fuente: `ms-edge-extensiones.html`; «Agregar una extensión a Microsoft Edge desde Chrome Web Store»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q246
  prompt:
    es: "Señale cómo se desactiva una extensión, sin quitarla, en Microsoft Edge, en Windows 11, según la página de Microsoft sobre extensiones:"
  options:
  - id: a
    correct: true
    text:
      es: "Extensiones › Administrar extensiones y el botón de alternancia"
  - id: b
    text:
      es: "Extensiones › Más acciones junto a la extensión › Quitar de Microsoft Edge"
  - id: c
    text:
      es: "Clic derecho en el icono de la extensión › Quitar de Microsoft Edge › Quitar"
  - id: d
    text:
      es: "Extensiones › Obtener extensiones para Microsoft Edge, y el botón Obtener"
  explanation:
    es: "Para desactivar una extensión se selecciona Extensiones › Administrar extensiones y el botón de alternancia junto a la extensión. Extensiones › Más acciones › Quitar de Microsoft Edge es uno de los métodos para quitar la extensión, no para desactivarla. El clic derecho en el icono de la extensión y Quitar de Microsoft Edge › Quitar es el otro método para quitarla. Obtener extensiones para Microsoft Edge sirve para buscar y agregar extensiones nuevas."
  citation: "fuente: `ms-edge-extensiones.html`; «Desactivar una extensión en Microsoft Edge»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q247
  prompt:
    es: "¿Cuál de las siguientes secuencias de pasos permite quitar una extensión desde su icono, a la derecha de la barra de direcciones de Microsoft Edge?"
  options:
  - id: a
    correct: true
    text:
      es: "Clic derecho en el icono › Quitar de Microsoft Edge › Quitar"
  - id: b
    text:
      es: "Clic derecho en el icono › Notificar abuso › Quitar"
  - id: c
    text:
      es: "Clic derecho en el icono › Obtener extensiones para Microsoft Edge"
  - id: d
    text:
      es: "Clic derecho en el icono › Administrar extensiones › Desactivar"
  explanation:
    es: "Con el botón derecho en el icono de la extensión se selecciona Quitar de Microsoft Edge y después Quitar. Administrar extensiones y el botón de alternancia es el método para desactivar, no para quitar. Obtener extensiones para Microsoft Edge sirve para agregar extensiones, no para quitarlas. Notificar abuso es la opción para informar al sitio web de complementos de una extensión que infringe sus directivas."
  citation: "fuente: `ms-edge-extensiones.html`; «Quitar una extensión de Microsoft Edge»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q248
  prompt:
    es: "¿Qué son las extensiones o complementos de Microsoft Edge, según la página de Microsoft sobre agregar, desactivar o quitar extensiones?"
  options:
  - id: a
    text:
      es: "Opciones del menú de más opciones para anclar sitios a Inicio"
  - id: b
    correct: true
    text:
      es: "Herramientas sencillas que personalizan la experiencia con el explorador"
  - id: c
    text:
      es: "Ventanas de exploración que borran los datos al cerrarse todas"
  - id: d
    text:
      es: "Páginas de lenguaje de marcado de hipertexto guardadas en el equipo"
  explanation:
    es: "Las extensiones o complementos son herramientas sencillas que personalizan la experiencia con el explorador y ofrecen más control. Las páginas de lenguaje de marcado de hipertexto son los archivos .htm y .html, no las extensiones. Las ventanas que borran los datos al cerrarse todas son las de InPrivate. Anclar sitios a Inicio es una opción de Más herramientas, no una extensión."
  citation: "fuente: `ms-edge-extensiones.html`; «Buscar y agregar una extensión a Microsoft Edge»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q249
  prompt:
    es: "¿Cuál de los siguientes lugares sirve para informar de una extensión que contiene malware o infringe las directivas de complementos de Edge?"
  options:
  - id: a
    text:
      es: "En el menú Inicio de Windows, con Desanclar de Inicio"
  - id: b
    correct: true
    text:
      es: "En el sitio web de complementos de Microsoft Edge, con Notificar abuso"
  - id: c
    text:
      es: "En Extensiones › Administrar extensiones, con el botón de alternancia"
  - id: d
    text:
      es: "En Configuración y más › historial, con Notificar abuso"
  explanation:
    es: "Se informa del abuso en el sitio web de complementos de Microsoft Edge, seleccionando la extensión y Notificar abuso. Administrar extensiones sirve para desactivar extensiones, no para notificar abusos. El historial no tiene una opción para notificar abusos de extensiones. Desanclar de Inicio quita un elemento anclado del menú Inicio."
  citation: "fuente: `ms-edge-extensiones.html`; «Informar abuso»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l08-q250
  prompt:
    es: "En Windows 11, ¿qué elementos muestra el área de chinchetas del menú Inicio, anclados en formato de cuadrícula?"
  options:
  - id: a
    text:
      es: "Solo aplicaciones y sitios web, sin archivos ni carpetas"
