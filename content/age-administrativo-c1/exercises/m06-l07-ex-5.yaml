  - id: b
    text:
      es: "Eliminar"
  - id: c
    correct: true
    text:
      es: "Restringir"
  - id: d
    text:
      es: "Cerrar"
  explanation:
    es: "El grupo Restringir de la pestaña Buscar reúne las opciones para mejorar los resultados. Cerrar contiene Cerrar búsqueda. Preferencias es un grupo de la pestaña Enviar y recibir. Eliminar es un grupo de la pestaña Inicio."
