# anchor: fuente-ms-office-pdf-html
- id: m02-l08-q164
  prompt:
    es: "En Word 365, ¿qué se elige tras seleccionar Crear marcadores con al guardar un PDF?"
  options:
  - id: a
    text:
      es: "Intervalo de páginas o Documento con marcas"
  - id: b
    text:
      es: "Documento o Propiedades del documento"
  - id: c
    text:
      es: "Etiquetas de la estructura o Cifrar el documento"
  - id: d
    correct: true
    text:
      es: "Encabezados o Marcadores de Word"
  explanation:
    es: "La página dice: «Para crear un conjunto de marcadores en el archivo PDF, seleccione Crear marcadores con. Después, elija Encabezados o, si ha agregado marcadores a su documento, Marcadores de Word». Por eso «Intervalo de páginas o Documento con marcas», «Documento o Propiedades del documento» y «Etiquetas de la estructura o Cifrar el documento» no son lo que se elige: la página reserva Propiedades del documento, las etiquetas de estructura y el cifrado para otras casillas de las opciones del PDF."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-office-pdf-html
- id: m02-l08-q165
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones de PDF restringe el acceso de modo que solo las personas con una contraseña puedan abrirlo?"
  options:
  - id: a
    text:
      es: "Etiquetas de la estructura del documento para accesibilidad"
  - id: b
    text:
      es: "Propiedades del documento"
  - id: c
    correct: true
    text:
      es: "Cifrar el documento con una contraseña"
  - id: d
    text:
      es: "Texto de mapa de bits cuando es posible que las fuentes no se incrusten"
  explanation:
    es: "La página dice: «Para restringir el acceso de modo que solo las personas con la contraseña puedan abrir el PDF, seleccione esta opción», y Word abre el cuadro Cifrar documento PDF. «Etiquetas de la estructura del documento para accesibilidad» sirve «para facilitar la lectura del documento en un software de lectura de pantalla». «Propiedades del documento» sirve para incluirlas en el PDF. «Texto de mapa de bits cuando es posible que las fuentes no se incrusten» hace que el PDF use imágenes de mapa de bits del texto cuando las fuentes no se pueden incrustar; ninguna pide contraseña."
  citation: "fuente: `ms-office-pdf.html`; «Guardar o convertir a PDF o XPS en aplicaciones de escritorio de Office»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-office-pdf-html
- id: m02-l08-q166
  prompt:
    es: "En Word 365, ¿cómo se abre un archivo PDF para poder copiar su contenido al documento?"
  options:
  - id: a
    correct: true
    text:
      es: "Con Archivo › Abrir, buscando el archivo PDF"
  - id: b
    text:
      es: "Con Archivo › Guardar una copia, eligiendo PDF en la lista"
  - id: c
    text:
      es: "Con Insertar › Captura de pantalla sobre el visor de PDF"
  - id: d
    text:
      es: "Con Revisar › Traducir sobre el archivo PDF"
  explanation:
    es: "La página dice: «Vaya a Archivo>Abrir y busque el archivo PDF. Word abre el contenido del archivo PDF en un archivo nuevo». «Archivo › Guardar una copia, eligiendo PDF en la lista» crea un PDF a partir del documento, según la lista desplegable donde «seleccione PDF», pero no abre uno existente. «Insertar › Captura de pantalla sobre el visor de PDF» y «Revisar › Traducir sobre el archivo PDF» no son rutas que la página dé para abrir un PDF; la única que da es Archivo>Abrir."
  citation: "fuente: `ms-office-pdf.html`; «Abrir y copiar el contenido de un PDF con Word»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-imprimir-html
- id: m02-l08-q167
  prompt:
    es: "Según la página de Microsoft sobre cómo imprimir en Word 365, ¿qué imprime el documento al seleccionar Imprimir documento con revisiones?"
  options:
  - id: a
    text:
      es: "Solo las propiedades del documento, en una página aparte"
  - id: b
    correct: true
    text:
      es: "El documento con comentarios y marcas de revisión"
  - id: c
    text:
      es: "Solo la página que se muestra en la vista previa"
  - id: d
    text:
      es: "El documento sin comentarios ni marcas de revisión"
  explanation:
    es: "La página dice: «En Configuración, seleccione Imprimir documento con revisiones», y añade que «el documento se imprimirá con comentarios». Por eso «el documento sin comentarios ni marcas de revisión» es lo contrario. «Solo las propiedades del documento, en una página aparte» corresponde a Imprimir propiedades del documento, otra opción. «Solo la página que se muestra en la vista previa» corresponde a Imprimir página actual: «Para imprimir la página que se muestra en la Vista previa, seleccione Imprimir página actual»."
  citation: "fuente: `ms-word-imprimir.html`; «Imprimir los comentarios del documento»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-imprimir-html
- id: m02-l08-q168
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones imprime solo la página que se muestra en la vista previa?"
  options:
  - id: a
    correct: true
    text:
      es: "Imprimir página actual"
  - id: b
    text:
      es: "Imprimir todas las páginas"
  - id: c
    text:
      es: "Impresión personalizada"
  - id: d
    text:
      es: "Imprimir documento con revisiones"
  explanation:
    es: "La página dice: «Para imprimir la página que se muestra en la Vista previa, seleccione Imprimir página actual». «Imprimir todas las páginas» es la «opción predeterminada» de la lista de Configuración, la que imprime todo el documento. «Impresión personalizada» sirve para páginas concretas: «Para imprimir páginas consecutivas como de la 1 a la 3, seleccione Impresión personalizada». «Imprimir documento con revisiones» imprime con comentarios y marcas de revisión, no solo la página en vista previa."
  citation: "fuente: `ms-word-imprimir.html`; «Imprimir páginas determinadas»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-imprimir-html
- id: m02-l08-q169
  prompt:
    es: "Según la página de Microsoft sobre cómo imprimir en Word 365, ¿cuándo aparecen en Configuración las opciones de impresión en color, blanco y negro y escala de grises?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando la impresora elegida admite esas opciones"
  - id: b
    text:
      es: "Siempre que el documento tenga imágenes de fondo"
  - id: c
    text:
      es: "Solo cuando el documento tiene comentarios"
  - id: d
    text:
      es: "Solo al activar Imprimir documento con revisiones"
  explanation:
    es: "La página dice: «Si la impresora que ha elegido en Impresora admite las opciones de impresión de color, blanco y negro y escala de grises, dichas opciones aparecerán en la lista en Configuración». Por eso «siempre que el documento tenga imágenes de fondo», «solo cuando el documento tiene comentarios» y «solo al activar Imprimir documento con revisiones» no son la condición: la página la pone en la impresora elegida, no en el contenido del documento ni en otra opción de Configuración."
  citation: "fuente: `ms-word-imprimir.html`; «Imprimir un documento en Word para Windows»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-word-opciones-mostrar-html
- id: m02-l08-q170
  prompt:
    es: "¿Cuál de las siguientes descripciones corresponde a la opción Imprimir dibujos creados en Word de las Opciones de Word (Mostrar) en Word 365?"
  options:
  - id: a
    text:
      es: "Solo las imágenes insertadas desde un archivo"
  - id: b
    text:
      es: "Solo los colores e imágenes de fondo"
  - id: c
    text:
      es: "Solo las propiedades del documento, en una página aparte"
  - id: d
    correct: true
    text:
      es: "Todos los objetos de dibujo, como las formas"
  explanation:
    es: "La página dice: «Seleccione esta opción para imprimir todos los objetos de dibujo, como formas y cuadros de texto». «Solo las imágenes insertadas desde un archivo» no es lo que describe: la página habla de los objetos de dibujo creados en Word. «Solo los colores e imágenes de fondo» es Imprimir imágenes y colores de fondo, otra opción. «Solo las propiedades del documento, en una página aparte» es Imprimir propiedades del documento, que imprime el resumen «en una página independiente»."
  citation: "fuente: `ms-word-opciones-mostrar.html`; «Opciones de impresión»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-word-opciones-mostrar-html
- id: m02-l08-q171
  prompt:
    es: "Según la página de Opciones de Word (Mostrar), al desactivar la casilla Imprimir dibujos creados en Word en Word 365:"
  options:
  - id: a
    correct: true
    text:
      es: "Word imprime un cuadro en blanco en lugar de cada objeto de dibujo"
  - id: b
    text:
      es: "Word imprime todos los objetos de dibujo en blanco y negro, sin color"
  - id: c
    text:
      es: "Word omite los cuadros de texto y las imágenes, pero imprime las formas"
  - id: d
    text:
      es: "Word imprime los objetos de dibujo en una página aparte, al final"
  explanation:
    es: "La página dice: «Desactivar esta casilla puede acelerar el proceso de impresión, ya que Word imprime un cuadro en blanco en lugar de cada objeto de dibujo». Por eso «todos los objetos de dibujo en blanco y negro, sin color» no es lo que ocurre, ni lo es «omite los cuadros de texto y las imágenes, pero imprime las formas»: lo que cambia es que cada objeto sale como un cuadro en blanco. «Imprime los objetos de dibujo en una página aparte, al final» tampoco consta: la página solo usa la página independiente para las propiedades del documento."
  citation: "fuente: `ms-word-opciones-mostrar.html`; «Opciones de impresión»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-opciones-mostrar-html
- id: m02-l08-q172
  prompt:
    es: "Según la página de Opciones de Word (Mostrar), la opción Imprimir propiedades del documento de Word 365 imprime la información de resumen:"
  options:
  - id: a
    text:
      es: "En el encabezado de cada página del documento impreso"
  - id: b
    text:
      es: "En la primera página, antes del texto del documento impreso"
  - id: c
    text:
      es: "En el margen de cada página, junto a los comentarios impresos"
  - id: d
    correct: true
    text:
      es: "En una página independiente, después de imprimir el documento"
  explanation:
    es: "La página dice que Imprimir propiedades del documento imprime la información de resumen «en una página independiente después de imprimir el documento». En el encabezado de cada página no es una página independiente. En la primera página, antes del texto, contradice «después de imprimir el documento». Y en el margen junto a los comentarios impresos tampoco es una página aparte: la propiedad se imprime en su propia página, tras el documento."
  citation: "fuente: `ms-word-opciones-mostrar.html`; «Opciones de impresión»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-opciones-mostrar-html
- id: m02-l08-q173
  prompt:
    es: "En Word 365, ¿qué actualiza la opción Actualizar campos antes de imprimir de las Opciones de Word (Mostrar) antes de imprimir el documento?"
  options:
  - id: a
    text:
      es: "Solo los campos de fecha del documento"
  - id: b
    correct: true
    text:
      es: "Todos los campos del documento"
  - id: c
    text:
      es: "Solo la información vinculada de otros documentos"
  - id: d
    text:
      es: "Solo los campos de entrada de índice"
  explanation:
    es: "La página dice: «Seleccione esta opción para actualizar todos los campos de un documento antes de imprimirlo». Por eso «solo los campos de fecha del documento» y «solo los campos de entrada de índice» se quedan cortos: la página dice todos los campos. «Solo la información vinculada de otros documentos» corresponde a otra opción, Actualizar los datos vinculados antes de imprimir, que actualiza «toda la información vinculada de un documento»."
  citation: "fuente: `ms-word-opciones-mostrar.html`; «Opciones de impresión»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-word-opciones-mostrar-html
- id: m02-l08-q174
  prompt:
    es: "¿Cuál de las siguientes opciones de impresión de Opciones de Word (Mostrar) imprime todo el texto con formato oculto en Word 365?"
  options:
  - id: a
    text:
      es: "Imprimir imágenes y colores de fondo"
  - id: b
    text:
      es: "Imprimir propiedades del documento"
  - id: c
    correct: true
    text:
      es: "Imprimir texto oculto"
  - id: d
    text:
      es: "Actualizar campos antes de imprimir"
  explanation:
    es: "La página dice de Imprimir texto oculto: «Seleccione esta opción para imprimir todo el texto con formato oculto». «Imprimir imágenes y colores de fondo» imprime «todos los colores e imágenes de fondo». «Imprimir propiedades del documento» imprime el resumen en una página independiente. «Actualizar campos antes de imprimir» actualiza todos los campos del documento antes de imprimirlo. Ninguna imprime texto oculto."
  citation: "fuente: `ms-word-opciones-mostrar.html`; «Opciones de impresión»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m02-l08-q026
  prompt:
    es: "En Word 365, ¿cuál de las siguientes descripciones corresponde al contenido de la barra de herramientas de acceso rápido?"
  options:
  - id: a
    correct: true
    text:
      es: "Un conjunto de comandos independientes de la pestaña mostrada"
  - id: b
    text:
      es: "Las pestañas y los grupos de comandos de la cinta de opciones"
  - id: c
    text:
      es: "Los estilos individuales de la galería de estilos de la cinta"
  - id: d
    text:
      es: "Las listas de valores de sangría y espaciado"
  explanation:
    es: "La página dice: la barra «contiene un conjunto de comandos que son independientes de la pestaña que se muestra actualmente en la cinta de opciones». «Las pestañas y los grupos de comandos de la cinta de opciones» describe la propia cinta, no la barra, que contiene comandos. «Los estilos individuales de la galería de estilos de la cinta» y «las listas de valores de sangría y espaciado» no pueden agregarse: «Solo se pueden agregar comandos a la barra de herramientas de acceso rápido»."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Personalizar la barra de herramientas de acceso rápido»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m02-l08-q027
  prompt:
    es: "En Word 365, ¿cómo se quita un comando de la barra de herramientas de acceso rápido?"
  options:
  - id: a
    text:
      es: "Con clic derecho en el comando y Ocultar etiquetas de comando de la barra"
  - id: b
    text:
      es: "Con clic derecho en la cinta y Ocultar barra de herramientas de acceso rápido"
  - id: c
    text:
      es: "Con Restablecer solo la barra de herramientas de acceso rápido"
  - id: d
    correct: true
    text:
      es: "Con clic derecho en el comando y Quitar de la barra de herramientas de acceso rápido"
  explanation:
    es: "La página dice: «Haga clic con el botón derecho en el comando que desea quitar de la barra de herramientas de acceso rápido. Seleccione Quitar de la barra de herramientas de acceso rápido en el menú contextual». «Ocultar etiquetas de comando de la barra» solo cambia las etiquetas de texto de los botones. «Ocultar barra de herramientas de acceso rápido» oculta toda la barra, no un comando. «Restablecer solo la barra de herramientas de acceso rápido» devuelve la barra a su configuración predeterminada, no quita un comando concreto."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Quitar un comando de la barra de herramientas de acceso rápido»"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m02-l08-q028
  prompt:
    es: "Según la página de Microsoft, ¿cómo se aumenta en Word 365 el tamaño de los botones de la barra de herramientas de acceso rápido?"
  options:
  - id: a
    text:
      es: "Con una opción de Archivo › Opciones"
  - id: b
    text:
      es: "Con clic derecho en la barra y Ampliar botones"
  - id: c
    correct: true
    text:
      es: "Solo bajando la resolución de pantalla"
  - id: d
    text:
      es: "Mostrando la barra en varias líneas"
  explanation:
    es: "La página dice: «No se puede aumentar el tamaño de los botones que representan los comandos con una opción en Microsoft Office. La única forma de aumentar el tamaño de los botones es bajar la resolución de pantalla». Por eso «con una opción de Archivo › Opciones» y «con clic derecho en la barra y Ampliar botones» no existen como vías. «Mostrando la barra en varias líneas» tampoco: la página dice «No puede mostrar la barra de herramientas de acceso rápido en varias líneas»."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Personalizar la barra de herramientas de acceso rápido»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m02-l08-q029
  prompt:
    es: "Según la página de Microsoft, ¿cuál de los siguientes elementos se puede agregar a la barra de herramientas de acceso rápido de Word 365?"
  options:
  - id: a
    text:
      es: "Estilos individuales de la cinta de opciones"
  - id: b
    correct: true
    text:
      es: "Comandos"
  - id: c
    text:
      es: "Listas con valores de sangría y espaciado"
  - id: d
    text:
      es: "Documentos completos de la lista de recientes"
  explanation:
    es: "La página dice: «Solo se pueden agregar comandos a la barra de herramientas de acceso rápido». Los «estilos individuales de la cinta de opciones» y las «listas con valores de sangría y espaciado» se citan expresamente como elementos que «no se pueden agregar a esta barra de herramientas». «Documentos completos de la lista de recientes» tampoco: no es un comando, y la página admite comandos y nada más."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Personalizar la barra de herramientas de acceso rápido»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-office-barra-acceso-rapido-html
- id: m02-l08-q030
  prompt:
    es: "En Word 365, ¿qué ocurre al importar un archivo de personalización de la cinta de opciones?"
  options:
  - id: a
    text:
      es: "Se suman a las personalizaciones anteriores de la cinta y de la barra"
  - id: b
    text:
      es: "Se aplican solo a la barra de herramientas de acceso rápido de Word"
  - id: c
    text:
      es: "Se guardan las anteriores en un archivo de copia automático de Word"
  - id: d
    correct: true
    text:
      es: "Se pierden las personalizaciones anteriores de la cinta y de la barra"
  explanation:
    es: "La página dice: «Al importar un archivo de personalización de la cinta de opciones, perderá todas las personalizaciones anteriores de la cinta y de la barra de herramientas de acceso rápido». Por eso «se suman a las personalizaciones anteriores» es lo contrario; «se aplican solo a la barra de herramientas de acceso rápido de Word» es falso, porque afectan también a la cinta; y «se guardan las anteriores en un archivo de copia automático de Word» tampoco consta: la página dice que se pierden."
  citation: "fuente: `ms-office-barra-acceso-rapido.html`; «Importar una barra de herramientas de acceso rápido personalizada»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-cinta-html
- id: m02-l08-q032
  prompt:
    es: "Señale qué ocurre en Word 365 si se intenta quitar una pestaña predeterminada de la cinta, según la página de Microsoft:"
  options:
  - id: a
    text:
      es: "Se puede quitar con Eliminar, igual que una personalizada"
  - id: b
    text:
      es: "Se puede quitar solo si se exporta antes la personalización"
  - id: c
    text:
      es: "Se puede quitar solo la pestaña Archivo, no las demás"
  - id: d
    correct: true
    text:
      es: "No se puede quitar, solo ocultar; una personalizada sí"
  explanation:
    es: "La página dice: «No puede quitar una pestaña predeterminada, pero puede quitar una pestaña personalizada». Quitarla con Eliminar es lo que la página permite solo con las personalizadas. Exportar antes la personalización es una función distinta que la página cita aparte, junto a importar una cinta personalizada, y no condiciona la eliminación. Y quitar solo Archivo invierte la página: de Archivo dice que ni siquiera se puede ocultar, mientras que las demás predeterminadas se pueden ocultar con la casilla."
  citation: "fuente: `ms-word-cinta.html`; «Quitar una pestaña personalizada»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-cinta-html
- id: m02-l08-q033
  prompt:
    es: "En Word 365, ¿cuál de las siguientes opciones indica en qué grupos de la cinta se pueden agregar, mover o quitar comandos?"
  options:
  - id: a
    text:
      es: "En cualquier grupo, también los predeterminados"
  - id: b
    correct: true
    text:
      es: "Solo en los grupos personalizados"
  - id: c
    text:
      es: "Solo en los grupos predeterminados"
  - id: d
    text:
      es: "Solo en la pestaña Archivo"
  explanation:
    es: "La página dice: «Solo puede agregar, mover o quitar comandos en grupos personalizados». Por eso «en cualquier grupo, también los predeterminados» y «solo en los grupos predeterminados» contradicen la frase: las predeterminadas son justo donde no se puede. «Solo en la pestaña Archivo» tampoco: la página solo menciona Archivo para decir que esa pestaña no se puede ocultar."
  citation: "fuente: `ms-word-cinta.html`; «Agregar, mover o quitar comandos de grupos personalizados»"
  difficulty: 1
  tags:
  - "requisito"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m02-l08-q035
  prompt:
    es: "Según la página de Opciones de Word (Guardar), para aplicar una nueva ubicación de archivo predeterminada a un servidor de red en Word 365 hay que:"
  options:
  - id: a
    text:
      es: "Cerrar la sesión de Windows"
  - id: b
    text:
      es: "Volver a guardar todos los documentos abiertos"
  - id: c
    correct: true
    text:
      es: "Reiniciar Word"
  - id: d
    text:
      es: "Activar el Autoguardado de los archivos de OneDrive"
  explanation:
    es: "La página dice: «Debe reiniciar Word para aplicar la nueva ubicación de archivo predeterminada a un servidor de red». Por eso «cerrar la sesión de Windows» es más de lo que pide, pues basta con reiniciar Word; «volver a guardar todos los documentos abiertos» no aplica la ubicación; y «activar el Autoguardado de los archivos de OneDrive» es otra función: el Autoguardado guarda el archivo cada pocos segundos y no aplica ninguna ubicación."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Opciones de Word (Guardar)»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-word-opciones-guardar-html
- id: m02-l08-q036
  prompt:
    es: "Con la ubicación de archivo predeterminada configurada en Word 365, ¿puede el usuario guardar un documento en otra ubicación o con otro formato?"
  options:
  - id: a
    correct: true
    text:
      es: "Sí: siempre que guarde, puede elegir otra ubicación o formato"
  - id: b
    text:
      es: "No: Word guarda siempre en la ubicación y el formato predeterminados"
  - id: c
    text:
      es: "Sí, pero solo en otro formato; la ubicación no se puede cambiar"
  - id: d
    text:
      es: "Sí, pero solo si antes se desactiva Autorrecuperación"
  explanation:
    es: "La página dice: «Siempre que guarde un documento, puede invalidar esta configuración seleccionando una ubicación o formato diferente en el cuadro de diálogo Abrir, Guardar o Guardar como». Guardar siempre en la ubicación y el formato predeterminados contradice «siempre que guarde» y «invalidar». Poder cambiar solo el formato contradice «una ubicación o formato diferente». Y la dependencia de desactivar Autorrecuperación no existe: Autorrecuperación es otra opción de la misma página, con su propio intervalo, que no interviene en la elección de la ubicación al guardar."
  citation: "fuente: `ms-word-opciones-guardar.html`; «Opciones de Word (Guardar)»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-opciones-mostrar-html
- id: m02-l08-q037
  prompt:
    es: "En Word 365, ¿cuál de las siguientes descripciones corresponde a la marca de formato Caracteres de tabulación de las Opciones de Word (Mostrar)?"
  options:
  - id: a
    text:
      es: "Los espacios entre palabras como puntos"
  - id: b
    correct: true
    text:
      es: "Los caracteres de tabulación como flechas"
  - id: c
    text:
      es: "Los extremos de párrafo con el símbolo de párrafo"
  - id: d
    text:
      es: "El texto con formato oculto con una línea de puntos"
  explanation:
    es: "La página dice de Caracteres de tabulación: «Seleccione esta opción para mostrar los caracteres de tabulación como flechas». «Los espacios entre palabras como puntos» es la marca Espacios; «los extremos de párrafo con el símbolo de párrafo» es Marcas de párrafo; «el texto con formato oculto con una línea de puntos» es Texto oculto: «mostrar una línea de puntos debajo del texto que tiene formato de oculto»."
  citation: "fuente: `ms-word-opciones-mostrar.html`; «Mostrar siempre estas marcas de formato en la pantalla»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-word-cinta-html
- id: m02-l08-q143
  prompt:
    es: "En Word 365, ¿cuál de las siguientes rutas abre la ventana Personalizar la cinta de opciones?"
  options:
  - id: a
    text:
      es: "Inicio › Opciones › Personalizar cinta de opciones"
  - id: b
    correct: true
    text:
      es: "Archivo › Opciones › Personalizar cinta de opciones"
  - id: c
    text:
      es: "Vista › Opciones › Personalizar cinta de opciones"
  - id: d
    text:
      es: "Revisar › Opciones › Personalizar cinta de opciones"
  explanation:
    es: "La página lleva a Personalizar cinta de opciones desde Archivo › Opciones. La página parte de Archivo, no de Inicio. La página parte de Archivo, no de Vista. La página parte de Archivo, no de Revisar."
  citation: "fuente: `ms-word-cinta.html`; «Personalizar la cinta de opciones en Word»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-cinta-html
- id: m02-l08-q144
  prompt:
    es: "Según la página de Microsoft, ¿qué se puede personalizar de la cinta de opciones de Word 365?"
  options:
  - id: a
    text:
      es: "El tamaño del texto de la cinta de opciones"
  - id: b
    text:
      es: "El color de los iconos de la cinta de opciones"
  - id: c
    correct: true
    text:
      es: "El orden de las pestañas y los comandos"
  - id: d
    text:
      es: "El tamaño de la cinta de opciones"
  explanation:
    es: "La página dice: «puede personalizar su cinta de opciones para organizar las pestañas y los comandos en el orden que desee». La página dice que no se puede reducir el tamaño del texto ni de los iconos de la cinta. La página dice que no se puede cambiar el color de la cinta o de sus iconos. La página dice que no se puede reducir el tamaño de la cinta."
  citation: "fuente: `ms-word-cinta.html`; «¿Qué se puede personalizar?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-word-cinta-html
- id: m02-l08-q145
  prompt:
    es: "Según la página de Microsoft, las personalizaciones de la cinta de opciones de Word 365 se aplican:"
  options:
  - id: a
    correct: true
    text:
      es: "Solo en la aplicación de Office en la que se está trabajando"
  - id: b
    text:
      es: "En todas las aplicaciones de Office instaladas"
  - id: c
    text:
      es: "En Word y en Excel, pero no en Outlook"
  - id: d
    text:
      es: "En todos los documentos de Word, pero solo en la pestaña Inicio"
  explanation:
    es: "La página dice: «las personalizaciones solo se aplican al programa de Office en el que está trabajando en ese momento». La página dice que no se verán en Excel, por ejemplo. La página dice que los cambios hechos en Word no se ven en Excel. Las personalizaciones se aplican al programa, no a una pestaña concreta."
  citation: "fuente: `ms-word-cinta.html`; «¿Qué se puede personalizar?»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-cinta-html
- id: m02-l08-q146
  prompt:
    es: "En la ventana Personalizar la cinta de opciones de Word 365, ¿cómo se oculta una pestaña predeterminada?"
  options:
  - id: a
    text:
      es: "Seleccionando Eliminar con la pestaña marcada"
  - id: b
    text:
      es: "Seleccionando Restablecer solo la pestaña seleccionada"
  - id: c
    correct: true
    text:
      es: "Desactivando la casilla situada junto a la pestaña"
  - id: d
    text:
      es: "Seleccionando Cambiar nombre y dejando el nombre en blanco"
  explanation:
    es: "La página dice: «desactive la casilla situada junto a la pestaña predeterminada o a la pestaña personalizada que desea ocultar». No se puede quitar una pestaña predeterminada, solo ocultarla. Restablecer devuelve la pestaña a su configuración predeterminada. Cambiar nombre sirve para dar otro nombre a la pestaña."
  citation: "fuente: `ms-word-cinta.html`; «Ocultar una pestaña predeterminada o personalizada»"
  difficulty: 1
  tags:
  - "procedimiento"
