# anchor: boe-a-2003-23186-art-225
- id: m03-l14-q0084
  prompt:
    es: "Según el artículo 225.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, tratándose de actos dictados por delegación y salvo que en esta se diga otra cosa, el recurso de reposición se resuelve por:"
  options:
  - id: a
    text:
      es: "El superior jerárquico del órgano delegado."
  - id: b
    text:
      es: "El tribunal económico-administrativo regional."
  - id: c
    text:
      es: "El órgano delegante, que otorgó la delegación."
  - id: d
    correct: true
    text:
      es: "El órgano delegado, que dictó el acto."
  explanation:
    es: "Para los actos dictados por delegación, y salvo disposición en contrario de la delegación, resuelve el órgano delegado (art. 225.1). No el delegante, ni un superior, ni el tribunal económico-administrativo, que resuelve reclamaciones."
  citation: "art. 225.1 LGT"
  difficulty: 1
  tags:
  - "reposición"
  - "órgano"
# anchor: boe-a-2003-23186-art-225
- id: m03-l14-q0086
  prompt:
    es: "Conforme al artículo 225.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el órgano competente para conocer del recurso de reposición no puede abstenerse de resolver, sin que pueda alegarse:"
  options:
  - id: a
    text:
      es: "Falta de competencia por razón de la cuantía."
  - id: b
    text:
      es: "Ausencia de alegaciones del recurrente."
  - id: c
    text:
      es: "Existencia de un recurso judicial pendiente sobre el mismo acto."
  - id: d
    correct: true
    text:
      es: "Duda racional o deficiencia de los preceptos legales."
  explanation:
    es: "La prohibición de abstenerse del artículo 225.2 impide alegar duda racional o deficiencia de los preceptos legales. La falta de competencia por cuantía, la ausencia de alegaciones o un recurso judicial pendiente no figuran como excusa válida en ese texto."
  citation: "art. 225.2 LGT"
  difficulty: 2
  tags:
  - "reposición"
  - "resolución"
# anchor: boe-a-2003-23186-art-225
- id: m03-l14-q0087
  prompt:
    es: "Lucas Pardo Ríos interpone el lunes 11 de mayo de 2026 recurso de reposición. El plazo se cuenta según el artículo 30.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas y no hay períodos excluidos del cómputo. Conforme al artículo 225.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el órgano competente puede notificar la resolución hasta el:"
  options:
  - id: a
    correct: true
    text:
      es: "Jueves 11 de junio de 2026."
  - id: b
    text:
      es: "Martes 26 de mayo de 2026."
  - id: c
    text:
      es: "Sábado 11 de julio de 2026."
  - id: d
    text:
      es: "Viernes 12 de junio de 2026."
  explanation:
    es: "El plazo es de un mes contado desde el día siguiente al de presentación del recurso (art. 225.4). Empieza el 12 de mayo y termina el mismo día del mes siguiente, el jueves 11 de junio de 2026 (art. 30.4 LPAC). El 12 de junio ya está fuera, el 11 de julio sería a dos meses y el 26 de mayo se quedaría en quince días."
  citation: "art. 225.4 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "reposición"
  - "cómputo"
# anchor: boe-a-2003-23186-art-225
- id: m03-l14-q0089
  prompt:
    es: "De acuerdo con el artículo 225.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, transcurrido el plazo de un mes desde la interposición del recurso de reposición, el interesado puede considerar desestimado el recurso al objeto de:"
  options:
  - id: a
    correct: true
    text:
      es: "Interponer la reclamación procedente."
  - id: b
    text:
      es: "Solicitar la revocación del acto recurrido."
  - id: c
    text:
      es: "Interponer un nuevo recurso de reposición."
  - id: d
    text:
      es: "Pedir la caducidad del procedimiento de reposición."
  explanation:
    es: "El silencio en la reposición es desestimatorio y permite interponer la reclamación procedente (art. 225.5). No abre la revocación, no permite repetir la reposición (art. 225.6) y no se habla de caducidad en este recurso."
  citation: "art. 225.5 LGT"
  difficulty: 1
  tags:
  - "reposición"
  - "silencio"
# anchor: boe-a-2003-23186-art-225
- id: m03-l14-q0090
  prompt:
    es: "Tomás Blanco Ríos interpuso recurso de reposición contra una liquidación y, transcurrido un mes desde su interposición, no se le ha notificado resolución. Según el artículo 225.5 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué puede hacer?"
  options:
  - id: a
    text:
      es: "Esperar a la resolución expresa, sin poder interponer aún la reclamación."
  - id: b
    text:
      es: "Considerar estimado el recurso y exigir la devolución de lo ingresado."
  - id: c
    text:
      es: "Interponer de nuevo el recurso de reposición ante el mismo órgano."
  - id: d
    correct: true
    text:
      es: "Considerar desestimado el recurso e interponer la reclamación económico-administrativa."
  explanation:
    es: "Vencido el mes sin resolución, el interesado puede considerar desestimado el recurso y acudir a la reclamación económico-administrativa (art. 225.5). El silencio no es estimatorio. No está obligado a esperar. Y contra la resolución de reposición no cabe de nuevo este recurso (art. 225.6)."
  citation: "art. 225.5 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "reposición"
  - "silencio"
# anchor: boe-a-2003-23186-art-225
- id: m03-l14-q0091
  prompt:
    es: "Conforme al artículo 225.6 de la Ley 58/2003, de 17 de diciembre, General Tributaria, contra la resolución de un recurso de reposición:"
  options:
  - id: a
    text:
      es: "Puede interponerse de nuevo este recurso si surgen cuestiones distintas."
  - id: b
    text:
      es: "Solo puede interponerse recurso de alzada ordinario."
  - id: c
    text:
      es: "Puede interponerse de nuevo este recurso por una sola vez."
  - id: d
    correct: true
    text:
      es: "No puede interponerse de nuevo este recurso."
  explanation:
    es: "El artículo 225.6 prohíbe repetir la reposición contra su resolución, sin salvedades por cuestiones nuevas ni por una segunda vez. Y el alzada ordinario es un recurso de la vía económico-administrativa contra resoluciones de tribunales, no contra la reposición."
  citation: "art. 225.6 LGT"
  difficulty: 1
  tags:
  - "reposición"
  - "recurso"
# anchor: boe-a-2003-23186-art-225
- id: m03-l14-q0092
  prompt:
    es: "Según los artículos 223.1 y 225.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cuál es el plazo máximo del que dispone el órgano para notificar la resolución del recurso de reposición?"
  options:
  - id: a
    text:
      es: "Tres meses contados desde el día siguiente al de la notificación del acto."
  - id: b
    text:
      es: "Seis meses contados desde el día siguiente al de presentación del recurso."
  - id: c
    text:
      es: "Un año contado desde el día siguiente al de presentación del recurso."
  - id: d
    correct: true
    text:
      es: "Un mes contado desde el día siguiente al de presentación del recurso."
  explanation:
    es: "La reposición se resuelve en un mes desde el día siguiente al de la presentación (art. 225.4). Seis meses es el plazo del procedimiento abreviado y de la revocación, y un año el de la reclamación general. Y tres meses no corresponde a la reposición."
  citation: "art. 225.4 LGT"
  difficulty: 2
  tags:
  - "plazos"
  - "comparación"
# anchor: boe-a-2003-23186-art-213
- id: m03-l14-q0094
  prompt:
    es: "En relación con las resoluciones de los órganos económico-administrativos, el artículo 213.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria dispone que:"
  options:
  - id: a
    text:
      es: "Pueden ser anuladas por la Administración tributaria en perjuicio de los interesados."
  - id: b
    text:
      es: "Pueden ser revocadas por el órgano que las dictó conforme a lo previsto en el artículo 219."
  - id: c
    correct: true
    text:
      es: "Pueden ser declaradas lesivas conforme a lo previsto en el artículo 218."
  - id: d
    text:
      es: "Pueden ser declaradas lesivas únicamente por el Tribunal Económico-Administrativo Central."
  explanation:
    es: "El artículo 213.2 prevé que las resoluciones de los órganos económico-administrativos puedan ser declaradas lesivas según el artículo 218. No se citan la revocación ni una competencia exclusiva del tribunal central. Y la anulación en perjuicio de los interesados está prohibida fuera de los casos de los artículos 217 y 220 (art. 218.1)."
  citation: "art. 213.2 LGT"
  difficulty: 2
  tags:
  - "revisión"
  - "lesividad"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0095
  prompt:
    es: "Según el artículo 217.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿cómo más puede iniciarse el procedimiento de nulidad de pleno derecho, además de por acuerdo del órgano que dictó el acto o de su superior jerárquico?"
  options:
  - id: a
    text:
      es: "Por requerimiento de la Intervención General de la Administración del Estado."
  - id: b
    correct: true
    text:
      es: "A instancia del interesado."
  - id: c
    text:
      es: "Por denuncia de cualquier ciudadano ante la Administración."
  - id: d
    text:
      es: "Por orden del Tribunal Económico-Administrativo Central."
  explanation:
    es: "La segunda vía de inicio del artículo 217.2 es la instancia del interesado. La denuncia ciudadana, la orden del tribunal central y el requerimiento de la Intervención no figuran como formas de iniciarlo."
  citation: "art. 217.2 LGT"
  difficulty: 1
  tags:
  - "nulidad"
  - "inicio"
# anchor: boe-a-2003-23186-art-217
- id: m03-l14-q0096
  prompt:
    es: "Según los artículos 217.4 y 219.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿en cuál de los siguientes procedimientos la declaración exige dictamen favorable previo del Consejo de Estado u órgano equivalente de la comunidad autónoma, si lo hubiere?"
  options:
  - id: a
    text:
      es: "En la devolución de ingresos indebidos."
  - id: b
    text:
      es: "En la revocación de los actos de aplicación de los tributos."
  - id: c
    text:
      es: "En la rectificación de errores materiales, de hecho o aritméticos."
  - id: d
    correct: true
    text:
      es: "En la declaración de nulidad de pleno derecho."
  explanation:
    es: "Solo la nulidad de pleno derecho requiere dictamen favorable previo del Consejo de Estado (art. 217.4). La revocación exige un informe del órgano de asesoramiento jurídico (art. 219.3), y la rectificación y la devolución no exigen dictamen."
  citation: "art. 217.4 LGT"
  difficulty: 2
  tags:
  - "nulidad"
  - "dictamen"
# anchor: boe-a-2003-23186-art-219
- id: m03-l14-q0097
  prompt:
    es: "Según el artículo 219.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, una de las causas de revocación es que circunstancias sobrevenidas que afecten a una situación jurídica particular pongan de manifiesto:"
  options:
  - id: a
    text:
      es: "La ilegalidad del procedimiento seguido."
  - id: b
    text:
      es: "La incompetencia del órgano que lo dictó."
  - id: c
    correct: true
    text:
      es: "La improcedencia del acto dictado."
  - id: d
    text:
      es: "La prescripción del derecho a liquidar."
  explanation:
    es: "La segunda causa del artículo 219.1 son las circunstancias sobrevenidas que muestran la improcedencia del acto dictado. La ilegalidad del procedimiento, la incompetencia y la prescripción no son esa causa. De hecho, la prescripción impide revocar (art. 219.2)."
  citation: "art. 219.1 LGT"
  difficulty: 2
  tags:
  - "revocación"
  - "causas"
# anchor: boe-a-2003-23186-art-224
- id: m03-l14-q0101
  prompt:
    es: "Una sociedad recurre en reposición una liquidación de 50.000 euros y ofrece como garantía un aval solidario de una entidad de crédito que cubre el importe, los intereses de demora de la suspensión y los recargos que procederían. Conforme al artículo 224 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué efecto produce?"
  options:
  - id: a
    text:
      es: "La suspensión de la ejecución, pero únicamente por seis meses."
  - id: b
    text:
      es: "Ninguno, porque el aval no es una garantía admitida para la reposición."
  - id: c
    text:
      es: "Solo la suspensión de los intereses de demora del acto impugnado."
  - id: d
    correct: true
    text:
      es: "La suspensión automática de la ejecución del acto impugnado."
  explanation:
    es: "El aval solidario de entidad de crédito es una de las garantías del artículo 224.2, y si cubre el importe, los intereses y los recargos (art. 224.1) la suspensión es automática. No se limita a los intereses ni a seis meses. Y sí es una garantía admitida."
  citation: "art. 224.2 LGT"
  difficulty: 2
  tags:
  - "supuesto"
  - "reposición"
  - "garantías"
