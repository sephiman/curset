# anchor: boe-a-2015-11719-art-50
- id: m01-l14-q398
  prompt:
    es: "Doña Carmen Esteban Lorente estuvo en incapacidad temporal desde el martes, 4 de noviembre de 2025, hasta el viernes, 27 de febrero de 2026, y no pudo empezar sus vacaciones de 2025. ¿Hasta qué fecha puede disfrutarlas?"
  options:
  - id: a
    text:
      es: "El jueves, 31 de diciembre de 2026."
  - id: b
    text:
      es: "El martes, 4 de mayo de 2027."
  - id: c
    correct: true
    text:
      es: "El miércoles, 30 de junio de 2027."
  - id: d
    text:
      es: "El viernes, 27 de agosto de 2027."
  explanation:
    es: "Si la incapacidad temporal impide iniciar las vacaciones dentro del año natural al que corresponden, se pueden disfrutar siempre que no hayan pasado más de dieciocho meses desde el final del año en que se originaron. Las vacaciones de 2025 se originaron en 2025, que acabó el miércoles, 31 de diciembre de 2025; sumados dieciocho meses, el límite es el miércoles, 30 de junio de 2027. La fecha del jueves, 31 de diciembre de 2026, cuenta solo doce meses. La del martes, 4 de mayo de 2027, cuenta dieciocho meses desde el inicio de la incapacidad. La del viernes, 27 de agosto de 2027, los cuenta desde su fin."
  citation: "art. 50.2 TREBEP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2000-12140-art-21
- id: m01-l14-q412
  prompt:
    es: "¿Qué percibe Doña Irene Sandoval Rueda el lunes, 17 de mayo de 2027, si sigue de licencia por enfermedad desde el lunes, 1 de febrero de 2027?"
  options:
  - id: a
    text:
      es: "La totalidad de sus retribuciones, a cargo de los órganos de personal, igual que durante los tres primeros meses."
  - id: b
    text:
      es: "Solo un subsidio por incapacidad temporal a cargo de la MUFACE, sin retribuciones básicas."
  - id: c
    correct: true
    text:
      es: "Las retribuciones básicas, la prestación por hijo a cargo, en su caso, y un subsidio a cargo de la MUFACE."
  - id: d
    text:
      es: "Las retribuciones básicas y las complementarias, a cargo de la MUFACE durante toda la licencia."
  explanation:
    es: "Durante los tres primeros meses el mutualista percibe la totalidad de sus retribuciones, y desde el cuarto mes percibe las retribuciones básicas, la prestación por hijo a cargo, en su caso, y un subsidio a cargo de la MUFACE (art. 21.1.b) RDL 4/2000). La licencia de Doña Irene empieza el lunes, 1 de febrero de 2027; febrero, marzo y abril son los tres primeros meses, y el lunes, 17 de mayo, está en el cuarto. La opción de la totalidad de las retribuciones describe lo que cobra hasta el 30 de abril. La del subsidio sin retribuciones básicas omite parte de la prestación. La de la MUFACE durante toda la licencia le atribuye también los tres primeros meses y las retribuciones complementarias."
  citation: "art. 21.1.b) RDL 4/2000"
  difficulty: 2
  tags:
  - "efecto"
  - "cantidad"
# anchor: boe-a-2023-16462-art-1
- id: m01-l14-q420
  prompt:
    es: "Don Esteban Arroyo Lozano usa su automóvil, autorizado en la orden de comisión, y recorre 236 kilómetros entre ida y vuelta. ¿Qué importe le corresponde por el uso del vehículo, según la Orden HFP/793/2023, de 12 de julio?"
  options:
  - id: a
    correct: true
    text:
      es: "61,36 euros por los 236 kilómetros recorridos con el automóvil."
  - id: b
    text:
      es: "30,68 euros por los 118 kilómetros recorridos solo en el trayecto de ida."
  - id: c
    text:
      es: "25,02 euros por los 236 kilómetros con el importe de la motocicleta."
  - id: d
    text:
      es: "122,72 euros por contar dos veces los kilómetros de ida y vuelta."
  explanation:
    es: "El uso del vehículo particular se indemniza con 0,26 euros por kilómetro recorrido en automóvil (art. 1 Orden HFP/793/2023). Son 236 kilómetros entre ida y vuelta: 236 por 0,26, es decir, 61,36 euros. La cifra de 30,68 euros cuenta solo el trayecto de ida. La de 25,02 euros aplica el importe de la motocicleta, 0,106 euros por kilómetro. La de 122,72 euros cuenta dos veces los kilómetros, porque los 236 ya incluyen ida y vuelta."
  citation: "art. 1 Orden HFP/793/2023"
  difficulty: 1
  tags:
  - "cantidad"
  - "cómputo"
