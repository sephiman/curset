# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q248
  prompt:
    es: "¿Qué son las extensiones o complementos de Microsoft Edge, según la página de Microsoft sobre agregar, desactivar o quitar extensiones?"
  options:
  - id: a
    text:
      es: "Opciones del menú de más opciones para anclar sitios a Inicio"
  - id: b
    correct: true
    text:
      es: "Herramientas sencillas que personalizan la experiencia con el explorador"
  - id: c
    text:
      es: "Ventanas de exploración que borran los datos al cerrarse todas"
  - id: d
    text:
      es: "Páginas de lenguaje de marcado de hipertexto guardadas en el equipo"
  explanation:
    es: "Las extensiones o complementos son herramientas sencillas que personalizan la experiencia con el explorador y ofrecen más control. Las páginas de lenguaje de marcado de hipertexto son los archivos .htm y .html, no las extensiones. Las ventanas que borran los datos al cerrarse todas son las de InPrivate. Anclar sitios a Inicio es una opción de Más herramientas, no una extensión."
  citation: "fuente: `ms-edge-extensiones.html`; «Buscar y agregar una extensión a Microsoft Edge»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-edge-extensiones-html
- id: m06-l08-q249
  prompt:
    es: "¿Cuál de los siguientes lugares sirve para informar de una extensión que contiene malware o infringe las directivas de complementos de Edge?"
  options:
  - id: a
    text:
      es: "En el menú Inicio de Windows, con Desanclar de Inicio"
  - id: b
    correct: true
    text:
      es: "En el sitio web de complementos de Microsoft Edge, con Notificar abuso"
  - id: c
    text:
      es: "En Extensiones › Administrar extensiones, con el botón de alternancia"
  - id: d
    text:
      es: "En Configuración y más › historial, con Notificar abuso"
  explanation:
    es: "Se informa del abuso en el sitio web de complementos de Microsoft Edge, seleccionando la extensión y Notificar abuso. Administrar extensiones sirve para desactivar extensiones, no para notificar abusos. El historial no tiene una opción para notificar abusos de extensiones. Desanclar de Inicio quita un elemento anclado del menú Inicio."
  citation: "fuente: `ms-edge-extensiones.html`; «A la derecha de la ventana que se abre, seleccione Notificar abuso.»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l08-q250
  prompt:
    es: "En Windows 11, ¿qué elementos muestra el área de chinchetas del menú Inicio, anclados en formato de cuadrícula?"
  options:
  - id: a
    text:
      es: "Solo aplicaciones y sitios web, sin archivos ni carpetas"
  - id: b
    text:
      es: "Solo aplicaciones y archivos, sin carpetas ni sitios web"
  - id: c
    correct: true
    text:
      es: "Aplicaciones, archivos, carpetas y sitios web anclados"
  - id: d
    text:
      es: "Solo archivos y carpetas, sin aplicaciones ni sitios web"
  explanation:
    es: "Las chinchetas son aplicaciones, archivos, carpetas y sitios web anclados en formato de cuadrícula. La página incluye también carpetas y sitios web entre las chinchetas. La página incluye también archivos y carpetas entre las chinchetas. La página incluye también aplicaciones y sitios web entre las chinchetas."
  citation: "fuente: `ms-win-menu-inicio.html`; «Estructura del menú Inicio»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l08-q251
  prompt:
    es: "¿Cuál de las siguientes cosas se hace en Edge, antes de elegir el menú de más opciones, para anclar un sitio web al menú Inicio de Windows 11?"
  options:
  - id: a
    text:
      es: "Abrir una ventana de InPrivate con Ctrl+Mayús+N"
  - id: b
    correct: true
    text:
      es: "Abrir Edge y navegar al sitio web que se quiere anclar"
  - id: c
    text:
      es: "Guardar el sitio web como favorito con Ctrl+D en la barra de direcciones"
  - id: d
    text:
      es: "Agregar el sitio web a una colección con Ctrl+Mayús+Y"
  explanation:
    es: "La página dice: «Para sitios web, abre Edge y navega al sitio web que quieres anclar. Después, selecciona el menú de más opciones › Más herramientas › Anclar a Inicio». Ctrl+Mayús+N abre una nueva ventana de InPrivate, según la tabla de atajos de Edge, y no figura entre los pasos para anclar. Ctrl+D guarda la pestaña actual como favorita, otra acción distinta de anclar al menú Inicio. Y Ctrl+Mayús+Y abre Colecciones, que no tiene relación con anclar un sitio."
  citation: "fuente: `ms-win-menu-inicio.html`; «Anclar y desanclar aplicaciones o accesos directos»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l08-q252
  prompt:
    es: "En Windows 11, ¿qué opción se selecciona al hacer clic con el botón derecho en un elemento anclado al menú Inicio para quitarlo de él?"
  options:
  - id: a
    text:
      es: "Configuración de Inicio"
  - id: b
    correct: true
    text:
      es: "Desanclar de Inicio"
  - id: c
    text:
      es: "Mostrar todo"
  - id: d
    text:
      es: "Anclar a Inicio"
  explanation:
    es: "Para quitar un elemento anclado se hace clic con el botón derecho en él y se selecciona Desanclar de Inicio. Anclar a Inicio es la opción para añadir un elemento al menú Inicio. Configuración de Inicio es la opción del menú contextual de la parte inferior del menú Inicio, para elegir las carpetas junto al botón de encendido. Mostrar todo hace que la sección de chinchetas permanezca expandida, y no quita elementos."
  citation: "fuente: `ms-win-menu-inicio.html`; «Anclar y desanclar aplicaciones o accesos directos»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l08-q254
  prompt:
    es: "En Windows 11, ¿qué ocurre con una carpeta de chinchetas del menú Inicio cuando solo queda un pin en ella?"
  options:
  - id: a
    correct: true
    text:
      es: "Que la carpeta se quita del menú Inicio"
  - id: b
    text:
      es: "Que la carpeta se conserva vacía en el menú Inicio"
  - id: c
    text:
      es: "Que la carpeta pasa al área de cuenta junto al botón de encendido"
  - id: d
    text:
      es: "Que la carpeta se convierte en una carpeta del Explorador"
  explanation:
    es: "La página dice: «Cuando solo queda un pin, la carpeta se quita del menú Inicio». Conservarla vacía contradice ese «se quita». Pasarla al área de cuenta no cuadra con lo que la página dice de esa zona: el área de cuenta tiene el icono de perfil y el botón de encendido, y las carpetas que aparecen junto a él son ubicaciones comunes como Documentos o Descargas, que se eligen en la configuración. Y convertirla en carpeta del Explorador tampoco: la carpeta de chinchetas es una agrupación de pines del menú Inicio, no una carpeta del sistema de archivos."
  citation: "fuente: `ms-win-menu-inicio.html`; «Organizar las chinchetas en carpetas»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l08-q255
  prompt:
    es: "¿Cuál de las siguientes acciones ancla una carpeta al menú Inicio de Windows 11 desde el Explorador, según la página de Microsoft?"
  options:
  - id: a
    text:
      es: "Clic con el botón derecho en la carpeta y Desanclar de Inicio"
  - id: b
    text:
      es: "Clic con el botón derecho en la carpeta y Configuración de Inicio"
  - id: c
    correct: true
    text:
      es: "Clic con el botón derecho en la carpeta y Anclar a Inicio"
  - id: d
    text:
      es: "Arrastrar la carpeta sobre una chincheta para crear un grupo"
  explanation:
    es: "En el Explorador se hace clic con el botón derecho en una carpeta y se selecciona Anclar a Inicio. Desanclar de Inicio quita un elemento ya anclado. Configuración de Inicio es la opción para elegir las carpetas junto al botón de encendido, no para anclar una carpeta. Arrastrar sobre una chincheta crea una carpeta de chinchetas, no ancla una carpeta del Explorador."
  citation: "fuente: `ms-win-menu-inicio.html`; «Anclar y desanclar aplicaciones o accesos directos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-menu-inicio-html
- id: m06-l08-q256
  prompt:
    es: "En Windows 11, ¿qué se hace en el cuadro de búsqueda de la barra de tareas para anclar una aplicación al menú Inicio?"
  options:
  - id: a
    text:
      es: "Escribir el nombre de la aplicación y pulsar Ctrl+D"
  - id: b
    text:
      es: "Escribir el nombre de la aplicación y arrastrarla sobre otra chincheta"
  - id: c
    correct: true
    text:
      es: "Escribir el nombre, clic con el botón derecho en la aplicación y Anclar a Inicio"
  - id: d
    text:
      es: "Escribir el nombre de la aplicación y elegir Mostrar todo"
  explanation:
    es: "En el cuadro de búsqueda se escribe el nombre de la aplicación, se hace clic con el botón derecho en ella y se selecciona Anclar a Inicio. Ctrl+D es el método abreviado de Edge para guardar una pestaña como favorita, no para anclar aplicaciones. Arrastrar sobre otra chincheta crea una carpeta de chinchetas. Mostrar todo hace que la sección de chinchetas permanezca expandida, no ancla aplicaciones."
  citation: "fuente: `ms-win-menu-inicio.html`; «Anclar y desanclar aplicaciones o accesos directos»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-aepd-guia-cookies-pdf
- id: m06-l08-q257
  prompt:
    es: "¿Qué dos tipos de cookies distingue la guía de la AEPD según el plazo de tiempo que permanecen activadas en el equipo del usuario?"
  options:
  - id: a
    text:
      es: "Cookies propias y cookies de terceros"
  - id: b
    text:
      es: "Cookies de preferencias y cookies publicitarias"
  - id: c
    correct: true
    text:
      es: "Cookies de sesión y cookies persistentes"
  - id: d
    text:
      es: "Cookies técnicas y cookies de análisis"
  explanation:
    es: "Según el plazo de tiempo que permanecen activadas en el equipo terminal, la guía distingue las cookies de sesión y las cookies persistentes. Cookies propias y de terceros es la clasificación según la entidad que las gestiona. Cookies técnicas y de análisis es la clasificación según su finalidad. Cookies de preferencias y publicitarias es una clasificación según su finalidad."
  citation: "fuente: `aepd-guia-cookies.pdf`; «2.1.3. Tipos de cookies según el plazo de tiempo que permanecen activadas»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-edge-atajos-html
- id: m06-l08-q258
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas abre una nueva ventana de Edge, sin ser de InPrivate, en Microsoft Edge, en Windows 11?"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl+N"
  - id: b
    text:
      es: "Ctrl+Mayús+K"
  - id: c
    text:
      es: "Ctrl+T"
  - id: d
    text:
      es: "Ctrl+Mayús+T"
  explanation:
    es: "Ctrl+N abre una nueva ventana. Ctrl+T abre una pestaña nueva y cambia a ella. Ctrl+Mayús+T vuelve a abrir la pestaña cerrada más recientemente. Ctrl+Mayús+K duplica la pestaña actual."
  citation: "fuente: `ms-edge-atajos.html`; «Ctrl+ N — Abrir una nueva ventana»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-edge-atajos-html
- id: m06-l08-q259
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas cierra la ventana actual, con todas sus pestañas, en Microsoft Edge, en Windows 11?"
  options:
  - id: a
    correct: true
    text:
      es: "Ctrl+Mayús+W"
  - id: b
    text:
      es: "Ctrl+W"
  - id: c
    text:
      es: "Ctrl+Mayús+Suprimir"
  - id: d
    text:
      es: "Ctrl+Mayús+T"
  explanation:
    es: "Ctrl+Mayús+W cierra la ventana actual. Ctrl+W cierra solo la pestaña actual. Ctrl+Mayús+T vuelve a abrir la pestaña cerrada más recientemente. Ctrl+Mayús+Suprimir abre las opciones de borrar los datos de exploración."
  citation: "fuente: `ms-edge-atajos.html`; «Métodos abreviados de teclado en Microsoft Edge»"
  difficulty: 2
  tags:
