- id: m02-l07-q034
  prompt:
    es: "En la Calculadora de Windows 11, ¿qué botones sirven para almacenar valores durante el cálculo, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "El botón Historial y los botones de modo"
  - id: b
    text:
      es: "Los botones de moneda, volumen y longitud"
  - id: c
    correct: true
    text:
      es: "Los botones de memoria: MC, MR, M+ y M–"
  - id: d
    text:
