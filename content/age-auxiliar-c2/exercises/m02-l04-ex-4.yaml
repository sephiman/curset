  prompt:
    es: "La norma sobre accesibilidad de los sitios web del sector público encomienda el seguimiento y los informes ante la Comisión Europea al Ministerio de Política Territorial y Función Pública. ¿Qué ministerio ejerce hoy esa función de administración pública?"
  options:
