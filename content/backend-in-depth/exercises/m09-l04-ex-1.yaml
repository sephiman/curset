- id: m09-l04-q25
  prompt:
    en: According to the OWASP LLM01:2025 entry on prompt injection, which of the following statements about prompt
      injection vulnerabilities is correct?
  options:
  - id: a
    text:
      en: Injected input works only when a human reader can see it
  - id: b
    text:
      en: Injected input comes only from prompts that the user types directly
  - id: c
    text:
      en: Retrieval Augmented Generation (RAG) and fine-tuning fully mitigate the vulnerability
  - id: d
    correct: true
    text:
      en: Injected input does not need to be human-visible or readable, as long as the model parses the content
  explanation:
    en: Prompt injections do not need to be human-visible or readable, as long as the content is parsed by the model.
      Visibility to a human reader is wrong because that is not required for the model to be affected. Input only
      from direct user prompts is wrong because indirect prompt injections occur when an LLM accepts input from
      external sources, such as websites or files. Full mitigation by RAG and fine-tuning is wrong because research
      shows that they do not fully mitigate prompt injection vulnerabilities.
  citation: owasp-llm-top10-prompt-injection#main
  extract:
    en: prompt injections do not need to be human-visible/readable, as long as the content is parsed by the model.
- id: m09-l04-q26
  prompt:
    en: According to the OWASP LLM01:2025 entry on prompt injection, how is jailbreaking related to prompt injection
      as an attack on a model's safety protocols?
  options:
  - id: a
    correct: true
    text:
      en: Jailbreaking is a form of prompt injection in which the inputs make the model disregard its safety protocols
        entirely
  - id: b
    text:
      en: Jailbreaking is an unrelated vulnerability that prompt injection cannot cause
  - id: c
    text:
      en: Preventing jailbreaking only needs safeguards in system prompts and input handling
  - id: d
    text:
      en: Jailbreaking is the only form of prompt injection, so indirect injections do not count
  explanation:
    en: Jailbreaking is a form of prompt injection where the attacker provides inputs that cause the model to disregard
      its safety protocols entirely. An unrelated vulnerability is wrong because prompt injection and jailbreaking
      are related concepts. Prevention through system prompt safeguards alone is wrong because effective prevention
      of jailbreaking requires ongoing updates to the model’s training and safety mechanisms. Jailbreaking as the
      only form is wrong because indirect prompt injections occur when an LLM accepts input from external sources.
  citation: owasp-llm-top10-prompt-injection#main
  extract:
    en: Jailbreaking is a form of prompt injection where the attacker provides inputs that cause the model to disregard
      its safety protocols entirely.
