# anchor: fuente-ms-word-atajos-html
- id: m02-l08-q070
  prompt:
    es: "En Word 365, ¿cuál de los siguientes métodos abreviados de teclado muestra el panel de tareas Traductor?"
  options:
  - id: a
    correct: true
    text:
      es: "Alt+Mayús+F7"
  - id: b
    text:
      es: "Ctrl+Mayús+F7"
  - id: c
    text:
      es: "Alt+F7"
  - id: d
    text:
      es: "Mayús+F7"
  explanation:
    es: "En la fila de F7 de la tabla, «Alt+Mayús+F7: muestra el panel de tareas Traductor». Mayús+F7 muestra el diccionario de sinónimos, Alt+F7 busca el siguiente error gramatical u ortográfico y Ctrl+Mayús+F7 actualiza la información vinculada de un documento de origen."
  citation: "fuente: `ms-word-atajos.html`; «Usar métodos abreviados de tecla de función»"
  difficulty: 3
  tags:
