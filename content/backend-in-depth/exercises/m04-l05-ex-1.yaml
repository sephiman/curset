- id: m04-l05-q04
  prompt:
    en: A function in a Kotlin companion object is annotated with `@JvmStatic`. What does the compiler generate
      for it, according to Kotlin's documentation on calling Kotlin from Java?
  options:
  - id: a
    correct: true
    text:
      en: A static method in the enclosing class and an instance method in the companion object
  - id: b
    text:
      en: A static method in the enclosing class only, with no method in the companion object
  - id: c
    text:
      en: An instance method in the companion object only, which Java must call through `Companion`
  - id: d
    text:
      en: A static method that replaces the instance method, so the call through `Companion` stops working
  explanation:
    en: The compiler generates both a static method in the enclosing class and an instance method in the companion
      object. A static method alone is not generated, because the compiler generates both methods. An instance method
      alone is not generated, because Java can call the function on both the enclosing class and the companion object.
      The instance method is not replaced, because the call through `Companion` still works and the instance method
      remains.
  citation: kotlin-docs-java-to-kotlin-interop#static-methods
  extract:
    en: 'If you use @JvmStatic on a function in a companion object, the compiler generates both a static method
      in the enclosing class and an instance method in the companion object:'
- id: m04-l05-q05
  prompt:
    en: A Kotlin function calls a Java method that declares a checked `IOException`. According to Kotlin's Java
      interoperability documentation, what does the Kotlin compiler force the caller to do?
  options:
  - id: a
    correct: true
    text:
      en: Nothing, because Kotlin does not force you to do anything
  - id: b
    text:
      en: Catch the exception with `try` and `catch`
  - id: c
    text:
      en: Annotate the calling function with `@Throws(IOException::class)`
  - id: d
    text:
      en: Declare `IOException` in a `throws` clause of the Kotlin function
  explanation:
    en: Kotlin does not force you to do anything when you call a Java method that declares a checked exception.
      It does not force a `try` and `catch`, because in Kotlin all exceptions are unchecked and the compiler does
      not force you to catch any of them. It does not force `@Throws` on the caller, because Kotlin does not have
      checked exceptions. It does not force a `throws` clause, because normally the Java signatures of Kotlin functions
      do not declare exceptions thrown.
  citation: kotlin-docs-java-interop#checked-exceptions
  extract:
    en: 'So, when you call a Java method that declares a checked exception, Kotlin does not force you to do anything:'
