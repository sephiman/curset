# anchor: boe-a-2015-10566-art-57
- id: m01-l08-q198
  prompt:
    es: "Conforme al artículo 57.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, mediante Real Decreto del Presidente del Gobierno se efectúa:"
  options:
  - id: a
    text:
      es: "La creación y supresión de las Direcciones Generales y de las Subdirecciones Generales."
  - id: b
    correct: true
    text:
      es: "La determinación del número, la denominación y el ámbito de competencia de los Ministerios y de las Secretarías de Estado."
  - id: c
    text:
      es: "La creación y supresión de los órganos de nivel inferior a Subdirección General."
  - id: d
    text:
      es: "La determinación de la estructura de las Delegaciones y Subdelegaciones del Gobierno."
  explanation:
    es: "El artículo 57.3 reserva al Real Decreto del Presidente del Gobierno el número, la denominación y el ámbito de competencia de los Ministerios y de las Secretarías de Estado. Las Direcciones Generales y las Subdirecciones Generales se crean y suprimen por Real Decreto del Consejo de Ministros, según el artículo 59.1. Los órganos de nivel inferior a Subdirección General se crean y suprimen por orden del Ministro respectivo, según el artículo 59.2. La estructura de las Delegaciones y Subdelegaciones del Gobierno se fija por Real Decreto del Consejo de Ministros, según el artículo 76.1."
  citation: "art. 57.3 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-62
- id: m01-l08-q118
  prompt:
    es: "Conforme al artículo 62.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Secretarios de Estado son directamente responsables de:"
  options:
  - id: a
    correct: true
    text:
      es: "La ejecución de la acción del Gobierno en un sector de actividad específica."
  - id: b
    text:
      es: "La gestión de los servicios comunes del Ministerio."
  - id: c
    text:
      es: "La representación ordinaria del Departamento."
  - id: d
    text:
      es: "La coordinación de las Delegaciones del Gobierno."
  explanation:
    es: "El artículo 62.1 los hace directamente responsables de la ejecución de la acción del Gobierno en un sector de actividad específica. Los servicios comunes los gestiona la Subsecretaría, la representación ordinaria del Ministerio es de los Subsecretarios y las Delegaciones del Gobierno pertenecen a la organización territorial."
  citation: "art. 62.1 LRJSP"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-62
- id: m01-l08-q119
  prompt:
    es: "Según el artículo 62.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué órganos son directamente responsables de la ejecución de la acción del Gobierno en un sector de actividad específica?"
  options:
