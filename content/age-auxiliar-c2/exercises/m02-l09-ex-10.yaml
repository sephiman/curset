# anchor: fuente-ms-excel-funciones-categoria-html
- id: m02-l09-q264
  prompt:
    es: "Señale la función de Microsoft Excel 365 que filtra un rango de datos basándose en los criterios que se definan, según la ayuda de Microsoft:"
  options:
  - id: a
    text:
      es: "BUSCARX"
  - id: b
    text:
      es: "ORDENAR"
  - id: c
    correct: true
    text:
      es: "FILTRAR"
  - id: d
    text:
      es: "ÍNDICE"
  explanation:
    es: "La página dice que FILTRAR filtra un rango de datos basándose en los criterios que se definan. «ORDENAR»: ORDENAR ordena el contenido de un rango o matriz. «BUSCARX»: BUSCARX busca en un rango o matriz y devuelve la coincidencia inicial. «ÍNDICE»: ÍNDICE elige un valor de una referencia o matriz."
  citation: "fuente: `ms-excel-funciones-categoria.html`; «Funciones de búsqueda y referencia»"
  difficulty: 1
