  prompt:
    es: "Según la disposición adicional primera de la Orden HAC/1425/2025, de 9 de diciembre, por la que se desarrollan para el año 2026 el método de estimación objetiva del Impuesto sobre la Renta de las Personas Físicas y el régimen especial simplificado del Impuesto sobre el Valor Añadido, ¿en qué porcentaje pueden reducir el rendimiento neto de módulos de 2026?"
