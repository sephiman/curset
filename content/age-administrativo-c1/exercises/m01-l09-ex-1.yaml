# anchor: boe-a-1978-31229-art-2
- id: m01-l09-q001
  prompt:
    es: "De acuerdo con el artículo 2 de la Constitución Española de 1978, la Constitución se fundamenta en:"
  options:
  - id: a
    correct: true
    text:
      es: "La indisoluble unidad de la Nación española, patria común e indivisible de todos los españoles."
  - id: b
    text:
      es: "La unidad de la Nación española y en la autonomía de las nacionalidades y regiones que la integran."
  - id: c
    text:
      es: "La indivisible unidad del Estado español, patria común de todos los ciudadanos."
  - id: d
    text:
      es: "La solidaridad entre todas las nacionalidades y regiones que integran la Nación española."
  explanation:
    es: "El artículo 2 dice que la Constitución «se fundamenta en la indisoluble unidad de la Nación española, patria común e indivisible de todos los españoles». La autonomía de las nacionalidades y regiones no es un fundamento: la Constitución la «reconoce y garantiza». Hablar de la «indivisible unidad del Estado español» y de «ciudadanos» cambia las palabras del artículo, que dice «Nación española» y «españoles». La solidaridad también se reconoce y garantiza, pero no es aquello en lo que se fundamenta."
  citation: "art. 2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-137
- id: m01-l09-q002
  prompt:
    es: "¿En qué entidades se organiza territorialmente el Estado según el título VIII de la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "En municipios, en comarcas, en provincias y en las Comunidades Autónomas que se constituyan."
  - id: b
    text:
      es: "En municipios, en islas y en las Comunidades Autónomas que se constituyan."
  - id: c
    text:
      es: "En provincias, en Comunidades Autónomas y en las demás entidades locales que se constituyan."
  - id: d
    correct: true
    text:
      es: "En municipios, en provincias y en las Comunidades Autónomas que se constituyan."
  explanation:
    es: "El artículo 137 dice que el Estado «se organiza territorialmente en municipios, en provincias y en las Comunidades Autónomas que se constituyan». Las comarcas no aparecen en el artículo. Las islas tampoco: tienen administración propia en los archipiélagos, pero el artículo 137 no las nombra. La fórmula de las «demás entidades locales» quita los municipios y añade algo que el texto no menciona."
  citation: "art. 137 CE"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-138
- id: m01-l09-q004
  prompt:
    es: "Según el artículo 138.1 de la Constitución Española de 1978, ¿a qué circunstancias atiende en particular el Estado al velar por el equilibrio económico entre las diversas partes del territorio?"
  options:
  - id: a
    text:
      es: "A las circunstancias de las zonas de montaña."
  - id: b
    correct: true
    text:
      es: "A las circunstancias del hecho insular."
  - id: c
    text:
      es: "A las circunstancias de las regiones con menor renta."
  - id: d
    text:
      es: "A las circunstancias de las ciudades de Ceuta y Melilla."
  explanation:
    es: "El artículo 138.1 dice que el Estado vela por ese equilibrio «atendiendo en particular a las circunstancias del hecho insular». Las zonas de montaña, las regiones con menor renta y las ciudades de Ceuta y Melilla no aparecen en el artículo."
  citation: "art. 138.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-138
- id: m01-l09-q006
  prompt:
    es: "De acuerdo con el artículo 138.2 de la Constitución Española de 1978, las diferencias entre los Estatutos de las distintas Comunidades Autónomas:"
  options:
  - id: a
    text:
      es: "No podrán implicar, salvo autorización de las Cortes Generales, privilegios económicos o sociales."
  - id: b
    text:
      es: "No podrán implicar, en ningún caso, diferencias en el nivel de competencias asumidas."
  - id: c
    correct: true
    text:
      es: "No podrán implicar, en ningún caso, privilegios económicos o sociales."
  - id: d
    text:
      es: "Deberán compensarse con cargo al Fondo de Compensación interterritorial."
  explanation:
    es: "El artículo 138.2 dice que esas diferencias «no podrán implicar, en ningún caso, privilegios económicos o sociales». No hay excepción por autorización de las Cortes. Las competencias sí pueden ser distintas de un Estatuto a otro: cada uno recoge las que asume (art. 147.2.d). El Fondo de Compensación corrige desequilibrios económicos (art. 158.2), no las diferencias entre Estatutos."
  citation: "art. 138.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-139
- id: m01-l09-q007
  prompt:
    es: "De acuerdo con el artículo 139.2 de la Constitución Española de 1978, ninguna autoridad podrá adoptar medidas que directa o indirectamente obstaculicen:"
  options:
  - id: a
    correct: true
    text:
      es: "La libertad de circulación y establecimiento de las personas y la libre circulación de bienes en todo el territorio español."
  - id: b
    text:
      es: "La libertad de circulación de las personas y de los trabajadores dentro de la Unión Europea."
  - id: c
    text:
      es: "La libertad de residencia de los españoles y la libre prestación de servicios en el extranjero."
  - id: d
    text:
      es: "La libre circulación de capitales y de mercancías entre el territorio español y el exterior, incluidos los demás Estados miembros."
  explanation:
    es: "El artículo 139.2 prohíbe medidas que obstaculicen «la libertad de circulación y establecimiento de las personas y la libre circulación de bienes en todo el territorio español». El artículo mira al territorio español, no a la Unión Europea, al extranjero ni a los intercambios con el exterior."
  citation: "art. 139.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-143
- id: m01-l09-q008
  prompt:
    es: "¿Cuál de las siguientes entidades puede acceder a su autogobierno y constituirse en Comunidad Autónoma, en el ejercicio del derecho a la autonomía reconocido en la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Las agrupaciones de municipios con identidad lingüística propia."
  - id: b
    correct: true
    text:
      es: "Las provincias con entidad regional histórica."
  - id: c
    text:
      es: "Las comarcas con características culturales y económicas comunes."
  - id: d
    text:
      es: "Las mancomunidades de municipios limítrofes de distintas provincias."
  explanation:
    es: "El artículo 143.1 permite acceder al autogobierno a «las provincias limítrofes con características históricas, culturales y económicas comunes, los territorios insulares y las provincias con entidad regional histórica». Las agrupaciones de municipios, las comarcas y las mancomunidades no están en esa lista: el artículo habla siempre de provincias o de territorios insulares."
  citation: "art. 143.1 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-143
- id: m01-l09-q009
  prompt:
    es: "De acuerdo con el artículo 143.2 de la Constitución Española de 1978, la iniciativa del proceso autonómico corresponde a todas las Diputaciones interesadas o al órgano interinsular correspondiente y:"
  options:
  - id: a
    correct: true
    text:
      es: "A las dos terceras partes de los municipios cuya población represente, al menos, la mayoría del censo electoral de cada provincia o isla."
  - id: b
    text:
      es: "A las tres cuartas partes de los municipios cuya población represente, al menos, la mayoría del censo electoral de cada provincia o isla."
  - id: c
    text:
      es: "A la mayoría absoluta de los municipios cuya población represente, al menos, las dos terceras partes del censo electoral de cada provincia."
  - id: d
    text:
      es: "A las dos terceras partes de los municipios, siempre que lo ratifique en referéndum la mayoría absoluta de los electores."
  explanation:
    es: "El artículo 143.2 atribuye la iniciativa a las Diputaciones o al órgano interinsular «y a las dos terceras partes de los municipios cuya población represente, al menos, la mayoría del censo electoral de cada provincia o isla». Las tres cuartas partes y el referéndum de ratificación son requisitos del artículo 151.1, no del 143.2. La mayoría absoluta de municipios con dos tercios del censo invierte las cifras."
  citation: "art. 143.2 CE"
  difficulty: 1
  tags:
  - "requisito"
  - "mayoría"
# anchor: boe-a-1978-31229-art-143
- id: m01-l09-q010
  prompt:
    es: "¿En qué plazo deben cumplirse los requisitos de la iniciativa del proceso autonómico que corresponde a las Diputaciones y a los municipios interesados?"
  options:
  - id: a
    text:
      es: "En el plazo de tres meses desde el primer acuerdo adoptado por alguna de las Corporaciones locales interesadas."
  - id: b
    text:
      es: "En el plazo de seis meses desde la publicación del acuerdo de la Diputación provincial interesada."
  - id: c
    text:
      es: "En el plazo de un año desde el primer acuerdo adoptado por alguna de las Corporaciones locales interesadas."
  - id: d
    correct: true
    text:
      es: "En el plazo de seis meses desde el primer acuerdo adoptado por alguna de las Corporaciones locales interesadas."
  explanation:
    es: "El artículo 143.2 dice que los requisitos «deberán ser cumplidos en el plazo de seis meses desde el primer acuerdo adoptado al respecto por alguna de las Corporaciones locales interesadas». Tres meses y un año no son el plazo del artículo. El plazo no cuenta desde la publicación del acuerdo de la Diputación."
  citation: "art. 143.2 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-143
- id: m01-l09-q011
  prompt:
    es: "Si la iniciativa del proceso autonómico no prospera, ¿cuándo puede reiterarse según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Solamente podrá reiterarse pasados tres años."
  - id: b
    correct: true
    text:
      es: "Solamente podrá reiterarse pasados cinco años."
  - id: c
    text:
      es: "Solamente podrá reiterarse pasado un año."
  - id: d
    text:
      es: "Solamente podrá reiterarse pasados cuatro años."
  explanation:
    es: "El artículo 143.3 dice: «La iniciativa, en caso de no prosperar, solamente podrá reiterarse pasados cinco años». Uno, tres y cuatro años no aparecen en el artículo. Cinco años es también el plazo del artículo 148.2 para ampliar competencias."
  citation: "art. 143.3 CE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-151
- id: m01-l09-q012
  prompt:
    es: "De acuerdo con el artículo 151.1 de la Constitución Española de 1978, no será preciso esperar el plazo de cinco años del artículo 148.2 cuando la iniciativa sea acordada, además de por las Diputaciones, por:"
  options:
  - id: a
    text:
      es: "Las dos terceras partes de los municipios de cada una de las provincias afectadas que representen, al menos, la mayoría del censo electoral de cada una de ellas."
  - id: b
    text:
      es: "Las tres cuartas partes de los municipios de cada una de las provincias afectadas que representen, al menos, las dos terceras partes del censo electoral."
  - id: c
    correct: true
    text:
      es: "Las tres cuartas partes de los municipios de cada una de las provincias afectadas que representen, al menos, la mayoría del censo electoral de cada una de ellas."
  - id: d
    text:
      es: "La mayoría absoluta de los municipios de cada una de las provincias afectadas que representen, al menos, las tres cuartas partes del censo electoral."
  explanation:
    es: "El artículo 151.1 exige «las tres cuartas partes de los municipios de cada una de las provincias afectadas que representen, al menos, la mayoría del censo electoral de cada una de ellas». Las dos terceras partes de los municipios son la cifra del artículo 143.2. Dos tercios o tres cuartos del censo no son la parte que deben representar esos municipios."
  citation: "art. 151.1 CE"
  difficulty: 2
  tags:
  - "requisito"
  - "mayoría"
# anchor: boe-a-1978-31229-art-151
- id: m01-l09-q013
  prompt:
    es: "Según el artículo 151.1 de la Constitución Española de 1978, ¿qué mayoría exige el referéndum de ratificación de la iniciativa del proceso autonómico?"
  options:
  - id: a
    text:
      es: "El voto afirmativo de la mayoría absoluta de los votantes de cada provincia."
  - id: b
    text:
      es: "La mayoría de los votos válidamente emitidos en cada provincia."
  - id: c
    correct: true
    text:
      es: "El voto afirmativo de la mayoría absoluta de los electores de cada provincia."
  - id: d
    text:
      es: "El voto afirmativo de las tres quintas partes de los electores del conjunto del territorio."
  explanation:
    es: "El artículo 151.1 exige la ratificación «mediante referéndum por el voto afirmativo de la mayoría absoluta de los electores de cada provincia». Cuentan los electores, no los votantes. La mayoría de los votos válidamente emitidos es la que pide el artículo 151.2 para aprobar el proyecto de Estatuto en referéndum, no para ratificar la iniciativa. Tres quintos del conjunto del territorio no aparecen en el artículo."
  citation: "art. 151.1 CE"
  difficulty: 3
  tags:
  - "mayoría"
# anchor: boe-a-1978-31229-art-151
- id: m01-l09-q014
  prompt:
    es: "Cuando la iniciativa autonómica se acuerda con las tres cuartas partes de los municipios y se ratifica en referéndum, ¿qué plazo no es preciso dejar transcurrir?"
  options:
  - id: a
    text:
      es: "El plazo de seis meses para cumplir los requisitos de la iniciativa autonómica."
  - id: b
    correct: true
    text:
      es: "El plazo de cinco años para ampliar competencias mediante la reforma del Estatuto."
  - id: c
    text:
      es: "El plazo de cinco años para reiterar una iniciativa autonómica que no prosperó."
  - id: d
    text:
      es: "El plazo de dos meses para que la Comisión Constitucional examine el proyecto."
  explanation:
    es: "El artículo 151.1 dice que «no será preciso dejar transcurrir el plazo de cinco años, a que se refiere el apartado 2 del artículo 148», que es el plazo para ampliar competencias reformando el Estatuto. Los seis meses sí se aplican: la iniciativa debe acordarse «dentro del plazo del artículo 143.2». Los cinco años para reiterar una iniciativa fallida son los del artículo 143.3, que el 151.1 no excluye. Los dos meses de la Comisión Constitucional forman parte del procedimiento del 151.2."
  citation: "art. 151.1 CE"
  difficulty: 3
  tags:
  - "plazo"
  - "excepción"
# anchor: boe-a-1978-31229-art-151
- id: m01-l09-q015
  prompt:
    es: "De acuerdo con el artículo 151.2 de la Constitución Española de 1978, el proyecto de Estatuto aprobado por la Asamblea de Parlamentarios se remite a la Comisión Constitucional del Congreso, que lo examinará:"
  options:
  - id: a
    correct: true
    text:
      es: "Dentro del plazo de dos meses, con el concurso y asistencia de una delegación de la Asamblea proponente."
  - id: b
    text:
      es: "Dentro del plazo de tres meses, con el concurso y asistencia de una delegación de la Asamblea proponente."
  - id: c
    text:
      es: "Dentro del plazo de dos meses, con el concurso y asistencia de una delegación del órgano preautonómico."
  - id: d
    text:
      es: "Dentro del plazo de un mes, previo dictamen del Consejo de Estado sobre su adecuación constitucional."
  explanation:
    es: "El artículo 151.2 dice que la Comisión Constitucional, «dentro del plazo de dos meses, lo examinará con el concurso y asistencia de una delegación de la Asamblea proponente». Tres meses y un mes no son el plazo del artículo. La delegación es de la Asamblea proponente, no de un órgano preautonómico. El artículo no prevé dictamen del Consejo de Estado."
  citation: "art. 151.2 CE"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-151
- id: m01-l09-q016
  prompt:
    es: "Cuando la iniciativa del proceso autonómico ha sido ratificada en referéndum, ¿cómo se constituye la Asamblea que elabora el proyecto de Estatuto?"
  options:
  - id: a
    text:
      es: "El Congreso convoca a los Diputados y Senadores elegidos en el territorio, que se constituyen en Asamblea."
  - id: b
    text:
      es: "El Rey convoca a los Diputados y Senadores elegidos en el territorio, que se constituyen en Asamblea."
  - id: c
    text:
      es: "El Presidente del Senado convoca a los Diputados y Senadores elegidos en el territorio, que se constituyen en Asamblea."
  - id: d
    correct: true
    text:
      es: "El Gobierno convoca a los Diputados y Senadores elegidos en el territorio, que se constituyen en Asamblea."
  explanation:
    es: "El artículo 151.2 dice: «El Gobierno convocará a todos los Diputados y Senadores elegidos en las circunscripciones comprendidas en el ámbito territorial que pretenda acceder al autogobierno, para que se constituyan en Asamblea». No los convoca el Congreso, ni el Rey, ni el Presidente del Senado."
  citation: "art. 151.2 CE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-151
- id: m01-l09-q017
  prompt:
    es: "¿Cuál de las siguientes afirmaciones es correcta sobre el proyecto de Estatuto cuando no se alcanza acuerdo en la Comisión Constitucional del Congreso, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Se archiva y la iniciativa solo puede reiterarse pasados cinco años."
  - id: b
    correct: true
    text:
      es: "Se tramita como proyecto de ley ante las Cortes Generales y el texto que estas aprueben se somete a referéndum en las provincias."
  - id: c
    text:
      es: "Se somete directamente a referéndum en las provincias afectadas, sin intervención de las Cortes Generales."
  - id: d
    text:
      es: "Se tramita como proyecto de ley ante las Cortes Generales y entra en vigor sin necesidad de referéndum."
  explanation:
    es: "El artículo 151.2 dice que, sin acuerdo, «el proyecto de Estatuto será tramitado como proyecto de ley ante las Cortes Generales. El texto aprobado por éstas será sometido a referéndum del cuerpo electoral de las provincias». El proyecto no se archiva: los cinco años para reiterar son del artículo 143.3, para la iniciativa que no prospera. Intervienen las Cortes y hay referéndum después: ni se salta un paso ni el otro."
  citation: "art. 151.2 CE"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1978-31229-art-151
- id: m01-l09-q018
  prompt:
    es: "Según el artículo 151.3 de la Constitución Española de 1978, ¿qué ocurre si una o varias provincias no aprueban en referéndum el proyecto de Estatuto?"
  options:
  - id: a
    correct: true
    text:
      es: "No se impide la constitución entre las restantes de la Comunidad Autónoma proyectada."
  - id: b
    text:
      es: "Se impide la constitución de la Comunidad Autónoma proyectada en todas las provincias."
  - id: c
    text:
      es: "Las provincias que lo rechazaron quedan integradas en la Comunidad si lo acuerdan sus Diputaciones."
  - id: d
    text:
      es: "Debe repetirse el referéndum en esas provincias en el plazo de seis meses."
  explanation:
    es: "El artículo 151.3 dice que «la no aprobación del proyecto de Estatuto por una o varias provincias no impedirá la constitución entre las restantes de la Comunidad Autónoma proyectada». El rechazo no bloquea a las demás provincias. Las Diputaciones no pueden integrar a las que votaron no. El artículo no prevé repetir el referéndum."
  citation: "art. 151.3 CE"
  difficulty: 3
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-dt-segunda
- id: m01-l09-q019
  prompt:
    es: "De acuerdo con la disposición transitoria segunda de la Constitución Española de 1978, los territorios que hubiesen plebiscitado afirmativamente proyectos de Estatuto podían proceder inmediatamente conforme al artículo 148.2 si así lo acordaban:"
  options:
  - id: a
    text:
      es: "Por mayoría de dos tercios, sus órganos preautonómicos colegiados superiores, comunicándolo a las Cortes Generales."
  - id: b
    text:
      es: "Por mayoría absoluta, las Diputaciones provinciales afectadas, comunicándolo al Gobierno."
  - id: c
    correct: true
    text:
      es: "Por mayoría absoluta, sus órganos preautonómicos colegiados superiores, comunicándolo al Gobierno."
  - id: d
    text:
      es: "Por mayoría absoluta, los Diputados y Senadores elegidos en su territorio, comunicándolo al Congreso."
  explanation:
    es: "La disposición transitoria segunda dice que podían hacerlo «cuando así lo acordaren, por mayoría absoluta, sus órganos preautonómicos colegiados superiores, comunicándolo al Gobierno». La mayoría no era de dos tercios y la comunicación iba al Gobierno, no a las Cortes. El acuerdo no correspondía a las Diputaciones ni a los parlamentarios del territorio."
  citation: "disposición transitoria segunda CE"
  difficulty: 3
  tags:
  - "mayoría"
  - "órgano"
# anchor: boe-a-1978-31229-art-144
- id: m01-l09-q020
  prompt:
    es: "De acuerdo con el artículo 144 de la Constitución Española de 1978, autorizar o acordar un Estatuto de autonomía para territorios que no estén integrados en la organización provincial corresponde:"
  options:
  - id: a
    text:
      es: "A las Cortes Generales, mediante ley ordinaria, por motivos de interés general."
  - id: b
    text:
      es: "Al Gobierno, mediante real decreto, previa audiencia de las Cortes Generales."
  - id: c
    text:
      es: "Al Congreso de los Diputados, por mayoría absoluta, por motivos de interés nacional."
  - id: d
    correct: true
    text:
      es: "A las Cortes Generales, mediante ley orgánica, por motivos de interés nacional."
  explanation:
    es: "El artículo 144 dice que «las Cortes Generales, mediante ley orgánica, podrán, por motivos de interés nacional» autorizar o acordar ese Estatuto (letra b). No basta una ley ordinaria y el motivo es el interés nacional, no el general. No decide el Gobierno por real decreto ni el Congreso solo: decide el conjunto de las Cortes mediante ley orgánica."
  citation: "art. 144.b) CE"
  difficulty: 1
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-1978-31229-art-144
- id: m01-l09-q021
  prompt:
    es: "¿Cuál de las siguientes facultades corresponde a las Cortes Generales, mediante ley orgánica y por motivos de interés nacional, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Autorizar la federación de dos o más Comunidades Autónomas limítrofes."
  - id: b
    correct: true
    text:
      es: "Autorizar la constitución de una comunidad autónoma cuando su ámbito territorial no supere el de una provincia y no reúna las condiciones del apartado 1 del artículo 143."
  - id: c
    text:
      es: "Autorizar la constitución de una comunidad autónoma cuando su ámbito territorial supere el de una provincia y no reúna las condiciones del apartado 1 del artículo 143."
  - id: d
    text:
      es: "Sustituir la iniciativa de las Diputaciones en la reforma de los Estatutos de autonomía."
  explanation:
    es: "El artículo 144.a) permite a las Cortes, por ley orgánica y por interés nacional, «autorizar la constitución de una comunidad autónoma cuando su ámbito territorial no supere el de una provincia y no reúna las condiciones del apartado 1 del artículo 143». La federación de Comunidades no se admite en ningún caso (art. 145.1). El texto dice «no supere» el ámbito de una provincia, no «supere». La sustitución que permite la letra c) del artículo es la de la iniciativa de las Corporaciones locales del artículo 143.2, no una iniciativa de reforma estatutaria."
  citation: "art. 144.a) CE"
  difficulty: 2
  tags:
