# anchor: boe-a-1978-31229-art-81
- id: m01-l01-q0065
  prompt:
    es: "El desarrollo de los derechos fundamentales y de las libertades públicas se hace, conforme al artículo 81.1 de la Constitución Española de 1978, mediante:"
  options:
  - id: a
    text:
      es: "Una ley ordinaria aprobada por mayoría simple."
  - id: b
    correct: true
    text:
      es: "Una ley orgánica."
  - id: c
    text:
      es: "Un decreto legislativo del Gobierno."
  - id: d
    text:
      es: "Un real decreto-ley convalidado por el Congreso."
  explanation:
    es: "El artículo 81.1 dice que son leyes orgánicas las relativas al desarrollo de los derechos fundamentales y de las libertades públicas. Una ley ordinaria con mayoría simple no cumple la exigencia. El decreto legislativo y el real decreto-ley son normas del Gobierno, y el desarrollo de estos derechos requiere una ley orgánica, con la mayoría absoluta del Congreso del artículo 81.2."
  citation: "art. 81.1 CE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-1979-23709-art-1
- id: m01-l01-q0100
  prompt:
    es: "Conforme al artículo 1.1 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, el Tribunal, como intérprete supremo de la Constitución, es independiente de los demás órganos constitucionales y se somete únicamente:"
  options:
  - id: a
    text:
      es: "A la Constitución y a la doctrina del Tribunal Supremo."
  - id: b
    text:
      es: "A la Constitución y a las leyes ordinarias."
  - id: c
    text:
      es: "A la Constitución, a su Ley Orgánica y a los criterios del Consejo General del Poder Judicial."
  - id: d
    correct: true
    text:
      es: "A la Constitución y a su propia Ley Orgánica."
  explanation:
    es: "El artículo 1.1 dice que el Tribunal «está sometido sólo a la Constitución y a la presente Ley Orgánica». La doctrina del Tribunal Supremo no lo vincula, porque el Tribunal es independiente de los demás órganos constitucionales. Las leyes ordinarias tampoco son su parámetro de sometimiento: lo es su propia Ley Orgánica. Añadir los criterios del Consejo General del Poder Judicial contradice esa independencia."
  citation: "art. 1.1 LOTC"
  difficulty: 1
  tags:
  - "concepto"
  - "competencia"
# anchor: boe-a-1979-23709-art-1
- id: m01-l01-q0101
  prompt:
    es: "Señale la respuesta correcta sobre el Tribunal Constitucional, de acuerdo con el artículo 1.2 de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional:"
  options:
  - id: a
    text:
      es: "Se organiza en Salas territoriales, una por cada Comunidad Autónoma, con jurisdicción limitada a su ámbito."
  - id: b
    correct: true
    text:
      es: "Es único en su orden y extiende su jurisdicción a todo el territorio nacional."
  - id: c
    text:
      es: "Está integrado en el Poder Judicial y sometido a la dirección del Consejo General del Poder Judicial."
  - id: d
    text:
      es: "Es un órgano consultivo del Gobierno que carece de jurisdicción propia."
  explanation:
    es: "El artículo 1.2 lo define como «único en su orden», con jurisdicción en todo el territorio nacional. Un Tribunal dividido en Salas territoriales choca con esa unidad. Tampoco forma parte del Poder Judicial ni depende del Consejo General del Poder Judicial: el artículo 1.1 lo declara independiente de los demás órganos constitucionales. Y ejerce jurisdicción propia, de modo que no es un órgano consultivo del Gobierno."
  citation: "art. 1.2 LOTC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-169
- id: m01-l01-q0135
  prompt:
    es: "Según el artículo 169 de la Constitución Española de 1978, no podrá iniciarse la reforma constitucional en un determinado momento. ¿Cuál de las siguientes situaciones lo impide?"
  options:
  - id: a
    text:
      es: "El último año de la legislatura de las Cortes Generales."
  - id: b
    text:
      es: "El primer año posterior a la disolución de las Cortes Generales."
  - id: c
    text:
      es: "La tramitación de una moción de censura contra el Gobierno."
  - id: d
    correct: true
    text:
      es: "El tiempo de guerra o la vigencia de alguno de los estados previstos en el artículo 116."
  explanation:
    es: "El artículo 169 prohíbe iniciar la reforma «en tiempo de guerra o de vigencia de alguno de los estados previstos en el artículo 116». El último año de legislatura, el primer año tras una disolución y la tramitación de una moción de censura no figuran como impedimento. La moción de censura sí frena la propuesta de disolución (artículo 115.2), pero no la reforma."
  citation: "art. 169 CE"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1978-31229-art-168
- id: m01-l01-q0002
  prompt:
    es: "¿Cuál de las siguientes reformas parciales de la Constitución Española de 1978 exige el procedimiento agravado, con aprobación del principio por dos tercios de cada Cámara y disolución de las Cortes?"
  options:
  - id: a
    correct: true
    text:
      es: "La que afecte a la sección 1.ª del capítulo segundo del título I."
  - id: b
    text:
      es: "La que afecte al capítulo tercero del título I."
  - id: c
    text:
      es: "La que afecte a la sección 2.ª del capítulo segundo del título I."
  - id: d
    text:
      es: "La que afecte al título III, De las Cortes Generales."
  explanation:
    es: "El artículo 168 cubre la revisión total y la parcial que afecte al título preliminar, a la sección 1.ª del capítulo segundo del título I o al título II. El capítulo tercero y la sección 2.ª del capítulo segundo pertenecen al título I, pero la lista del artículo solo nombra la sección 1.ª. El título III, De las Cortes Generales, tampoco es uno de los tres bloques de la lista. Esas tres reformas siguen el procedimiento del artículo 167."
  citation: "art. 168 CE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-1978-31229-art-12
- id: m01-l01-q0027
  prompt:
    es: "Según la Constitución Española de 1978, que fija la mayoría de edad en el capítulo primero del título I, los españoles son mayores de edad:"
  options:
  - id: a
    text:
      es: "A los dieciséis años, si están emancipados."
  - id: b
    text:
      es: "A los veintiún años, como regla general."
  - id: c
    text:
      es: "A los diecinueve años, cumplido el curso escolar."
  - id: d
    correct: true
    text:
      es: "A los dieciocho años."
  explanation:
    es: "El artículo 12 fija la mayoría de edad a los dieciocho años, sin condiciones. Los dieciséis años con emancipación, los veintiún años como regla general y los diecinueve tras el curso escolar son otras cifras u otros requisitos, y el artículo no hace depender la mayoría de edad de la emancipación ni del curso."
  citation: "art. 12 CE"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-1978-31229-art-17
- id: m01-l01-q0032
  prompt:
    es: "Según el artículo 17.4 de la Constitución Española de 1978, ¿qué determinará la ley en relación con la prisión provisional?"
  options:
  - id: a
    text:
      es: "La duración mínima que debe tener en cada caso."
  - id: b
    text:
      es: "Los delitos para los que se acuerda sin resolución judicial."
  - id: c
    correct: true
    text:
      es: "El plazo máximo de su duración."
  - id: d
    text:
      es: "El órgano administrativo que la acuerda."
  explanation:
    es: "El artículo 17.4 remite a la ley la determinación del plazo máximo de duración de la prisión provisional. Un plazo mínimo obligatorio no es un límite a la privación de libertad. Acordarla sin resolución judicial o por un órgano administrativo contradice el sistema de garantías del propio artículo 17, que somete la privación de libertad a la forma y los casos previstos en la ley y a la autoridad judicial."
  citation: "art. 17.4 CE"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-18
- id: m01-l01-q0033
  prompt:
    es: "Según el artículo 18.3 de la Constitución Española de 1978, dentro de los derechos al honor y a la intimidad, se garantiza el secreto de las comunicaciones, salvo:"
  options:
  - id: a
    text:
      es: "Consentimiento del titular, resolución judicial o flagrante delito."
  - id: b
    correct: true
    text:
      es: "Una resolución judicial."
  - id: c
    text:
      es: "Autorización del Ministerio Fiscal en casos de urgencia."
  - id: d
    text:
      es: "Orden de la autoridad gubernativa en las investigaciones de terrorismo."
  explanation:
    es: "El artículo 18.3 solo admite una excepción: la resolución judicial. Las excepciones del consentimiento del titular y del flagrante delito pertenecen a la inviolabilidad del domicilio, del artículo 18.2, y no se trasladan a las comunicaciones. El Ministerio Fiscal y la autoridad gubernativa no pueden levantar el secreto sin resolución judicial."
  citation: "art. 18.3 CE"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-1978-31229-art-21
- id: m01-l01-q0036
  prompt:
    es: "Conforme al artículo 21.1 de la Constitución Española de 1978, se reconoce el derecho de reunión, que se caracteriza por ser:"
  options:
  - id: a
    text:
      es: "Pacífica y con autorización previa."
  - id: b
    text:
      es: "Pública y sin armas, con comunicación previa."
  - id: c
    text:
      es: "Pacífica, siempre que se celebre en lugar cerrado."
  - id: d
    correct: true
    text:
      es: "Pacífica y sin armas."
  explanation:
    es: "El artículo 21.1 reconoce el derecho de reunión pacífica y sin armas. La autorización previa la excluye el propio apartado. La comunicación previa solo se pide en las reuniones en lugares de tránsito público y en las manifestaciones (artículo 21.2). Limitarlo a lugares cerrados es incompatible con ese apartado 2, que regula las reuniones en lugares de tránsito público."
  citation: "art. 21 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-23
- id: m01-l01-q0040
  prompt:
    es: "Señale la respuesta correcta sobre el acceso a las funciones y cargos públicos, según el artículo 23.2 de la Constitución Española de 1978, para los ciudadanos:"
  options:
  - id: a
    correct: true
    text:
      es: "En condiciones de igualdad, con los requisitos que señalen las leyes."
  - id: b
    text:
      es: "En condiciones de igualdad, con los requisitos que fije el Gobierno."
  - id: c
    text:
      es: "Con preferencia para los funcionarios de carrera."
  - id: d
    text:
      es: "En condiciones de reciprocidad, según los tratados."
  explanation:
    es: "El artículo 23.2 reconoce el acceso en condiciones de igualdad, con los requisitos que señalen las leyes: los fija el legislador, no el Gobierno. La preferencia de los funcionarios de carrera contradice la igualdad. La reciprocidad por tratado es la excepción del artículo 13.2 para el sufragio municipal de los extranjeros, no el criterio de acceso a cargos públicos."
  citation: "art. 23.2 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-25
- id: m01-l01-q0041
  prompt:
    es: "Conforme al artículo 25.3 de la Constitución Española de 1978, la Administración civil no podrá imponer sanciones que, directa o subsidiariamente, impliquen:"
  options:
  - id: a
    text:
      es: "Privación de derechos políticos."
  - id: b
    text:
      es: "Una multa superior al daño causado."
  - id: c
    text:
      es: "La suspensión de la actividad profesional."
  - id: d
    correct: true
    text:
      es: "Privación de libertad."
  explanation:
    es: "El artículo 25.3 veda a la Administración civil las sanciones que impliquen privación de libertad, directa o subsidiariamente. La privación de derechos políticos, la multa superior al daño y la suspensión de la actividad profesional son otras clases de sanción, que el apartado no veta."
  citation: "art. 25.3 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-27
- id: m01-l01-q0042
  prompt:
    es: "Conforme al artículo 27.1 de la Constitución Española de 1978, que se ubica entre los derechos fundamentales de la sección 1.ª del capítulo segundo, todos tienen derecho:"
  options:
  - id: a
    text:
      es: "A la educación superior gratuita."
  - id: b
    correct: true
    text:
      es: "A la educación."
  - id: c
    text:
      es: "A la enseñanza obligatoria en el centro que elijan."
  - id: d
    text:
      es: "A la formación profesional de su elección."
  explanation:
    es: "El artículo 27.1 reconoce a todos el derecho a la educación, en términos generales. La gratuidad se predica solo de la enseñanza básica (apartado 4), de modo que la educación superior gratuita no es el contenido del apartado 1. La enseñanza obligatoria en el centro elegido y la formación profesional de su elección concretan un derecho más específico que el que enuncia el apartado 1."
  citation: "art. 27.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-31
- id: m01-l01-q0045
  prompt:
    es: "¿Cuál de las siguientes características atribuye el artículo 31.1 de la Constitución Española de 1978, que regula el sostenimiento de los gastos públicos, al sistema tributario justo?"
  options:
  - id: a
    text:
      es: "Que podrá tener alcance confiscatorio en tiempos de crisis."
  - id: b
    text:
      es: "Que tendrá alcance retroactivo cuando favorezca al contribuyente."
  - id: c
    correct: true
    text:
      es: "Que en ningún caso tendrá alcance confiscatorio."
  - id: d
    text:
      es: "Que se basará exclusivamente en el principio de progresividad."
  explanation:
    es: "El artículo 31.1 dice que el sistema tributario justo, inspirado en los principios de igualdad y progresividad, no tendrá en ningún caso alcance confiscatorio. Admitir ese alcance en tiempos de crisis contradice el «en ningún caso». El alcance retroactivo no figura en el artículo. La progresividad es uno de los dos principios que lo inspiran, junto con la igualdad: no se basa solo en ella."
  citation: "art. 31.1 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-32
- id: m01-l01-q0046
  prompt:
    es: "Según el artículo 32.1 de la Constitución Española de 1978, el hombre y la mujer tienen derecho a contraer matrimonio con:"
  options:
  - id: a
    correct: true
    text:
      es: "Plena igualdad jurídica."
  - id: b
    text:
      es: "Plena capacidad de obrar."
  - id: c
    text:
      es: "Plena libertad de régimen económico."
  - id: d
    text:
      es: "Plena equiparación entre las formas civil y religiosa."
  explanation:
    es: "El artículo 32.1 habla de contraer matrimonio «con plena igualdad jurídica». Los demás calificativos, capacidad de obrar, régimen económico y equiparación entre formas de matrimonio, quedan para la ley, que según el apartado 2 regula las formas, la edad y capacidad y los derechos y deberes de los cónyuges."
  citation: "art. 32.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-37
- id: m01-l01-q0049
  prompt:
    es: "¿Cuál de los siguientes derechos corresponde a la sección 2.ª del capítulo segundo del título I de la Constitución Española de 1978, De los derechos y deberes de los ciudadanos?"
  options:
  - id: a
    text:
      es: "El derecho de reunión pacífica y sin armas."
  - id: b
    correct: true
    text:
      es: "El derecho a la negociación colectiva laboral."
  - id: c
    text:
      es: "El derecho de asociación."
  - id: d
    text:
      es: "El derecho de petición individual y colectiva."
  explanation:
    es: "La negociación colectiva laboral del artículo 37.1 está en la sección 2.ª, que va de los artículos 30 a 38. El derecho de reunión (artículo 21), el de asociación (artículo 22) y el de petición (artículo 29) son derechos fundamentales de la sección 1.ª, de los artículos 15 a 29."
  citation: "art. 37.1 CE"
  difficulty: 3
  tags:
  - "estructura"
