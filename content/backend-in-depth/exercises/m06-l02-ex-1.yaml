- id: m06-l02-q16
  prompt:
    en: In Jakarta Persistence 3.2, an update involves entities with versions and entities without versions. For
      which entities must the provider verify optimistic locks?
  options:
  - id: a
    correct: true
    text:
      en: Only the versioned entities, with no guarantee for the whole object graph
  - id: b
    text:
      en: Every entity, comparing the full state of those that have no version at all
  - id: c
    text:
      en: None of them, because the operation fails when one entity has no version
  - id: d
    text:
      en: Every entity, with consistency of the whole object graph fully guaranteed
  explanation:
    en: The provider is only required to verify entities that do have a version. Comparing entities without a version
