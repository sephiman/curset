  - "envases"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0039
  prompt:
    es: "De acuerdo con el artículo 80.Uno.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la base imponible se reduce en el importe de los descuentos y bonificaciones otorgados con posterioridad al momento en que la operación se haya realizado, siempre que:"
  options:
  - id: a
    correct: true
    text:
      es: "sean debidamente justificados."
  - id: b
    text:
      es: "figuren en un contrato firmado antes de la operación."
  - id: c
    text:
      es: "se concedan en función del volumen de operaciones del año."
  - id: d
    text:
      es: "hayan sido comunicados previamente a la Administración tributaria."
  explanation:
    es: "El descuento posterior reduce la base imponible con la única condición de que esté debidamente justificado. La ley no exige un volumen anual, un contrato anterior ni una comunicación previa a la Administración."
  citation: "art. 80.Uno.2.º LIVA"
  difficulty: 1
  tags:
  - "modificación de la base imponible"
  - "descuentos"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0040
  prompt:
    es: "Señale la respuesta CORRECTA sobre la modificación de la base imponible según el artículo 80.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "La base no se modifica cuando, con arreglo a los usos de comercio, se altere el precio después del momento en que la operación se haya efectuado."
  - id: b
    text:
      es: "La base se modifica en la cuantía correspondiente solo cuando una resolución judicial firme deje sin efecto totalmente las operaciones gravadas."
  - id: c
    text:
      es: "La base se modifica en la cuantía correspondiente cuando el sujeto pasivo lo solicite, aunque no haya resolución ni se altere el precio de la operación."
  - id: d
    correct: true
    text:
      es: "La base se modifica en la cuantía correspondiente cuando, por resolución firme, judicial o administrativa, queden sin efecto total o parcialmente las operaciones gravadas."
  explanation:
    es: "El apartado Dos modifica la base cuando una resolución firme, judicial o administrativa, deja sin efecto la operación total o parcialmente, o cuando se altera el precio después de efectuada, también conforme a Derecho o usos de comercio. No exige resolución judicial ni anulación total, y no basta la mera petición del sujeto pasivo."
  citation: "art. 80.Dos LIVA"
  difficulty: 3
  tags:
  - "modificación de la base imponible"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0041
  prompt:
    es: "Conforme al artículo 80.Tres de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué debe dictarse con posterioridad al devengo para que la base imponible pueda reducirse cuando el destinatario de las operaciones sujetas no haya hecho efectivo el pago de las cuotas repercutidas?"
  options:
  - id: a
    correct: true
    text:
      es: "Auto de declaración de concurso."
  - id: b
    text:
      es: "Sentencia firme que condene al destinatario al pago de la deuda."
  - id: c
    text:
      es: "Providencia de apremio contra el destinatario por la deuda tributaria."
  - id: d
    text:
      es: "Requerimiento de la Agencia Tributaria al destinatario de la operación."
  explanation:
    es: "La reducción por concurso exige que el destinatario no haya pagado las cuotas y que, tras el devengo, se dicte auto de declaración de concurso. Una sentencia de condena, un requerimiento o una providencia de apremio no son el presupuesto del apartado Tres."
  citation: "art. 80.Tres LIVA"
  difficulty: 1
  tags:
  - "modificación de la base imponible"
  - "concurso"
# anchor: boe-a-1992-28740-art-80
