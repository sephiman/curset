type: quiz
variants:
- id: m07-l06-q01
  prompt:
    en: In gRPC, which call type has the client send a stream of messages while the server responds with a single
      message and its status details?
  options:
  - id: a
    correct: true
    text:
      en: Client-streaming RPC
  - id: b
    text:
      en: Unary RPC
  - id: c
    text:
      en: Server-streaming RPC
  - id: d
    text:
      en: Bidirectional streaming RPC
  explanation:
    en: In a client-streaming RPC the client sends a stream of messages and the server responds with a single message.
      A unary RPC is wrong, because there the client sends a single request and gets back a single response. A server-streaming
      RPC is wrong, because there the server returns a stream of messages in response to a client's request. A bidirectional
      streaming RPC is wrong, because there the two streams are independent and the client and server can read and
      write messages in any order.
  citation: grpc-core-concepts#client-streaming-rpc
  extract:
    en: A client-streaming RPC is similar to a unary RPC, except that the client sends a stream of messages to the
      server instead of a single message.
- id: m07-l06-q02
  prompt:
    en: In a gRPC bidirectional streaming RPC, how do the client stream and the server stream relate to each other
      when messages are read and written?
  options:
  - id: a
    text:
      en: The server may write only after it has received all of the client's messages
  - id: b
    text:
      en: The client must send its first message before the server may send its initial metadata
  - id: c
    text:
      en: Each request must be followed by exactly one response, in a fixed order
  - id: d
    correct: true
    text:
      en: The two streams are independent, so messages can be read and written in any order
  explanation:
    en: The two streams are independent, so the client and server can read and write messages in any order. The
      claim that the server may only write at the end is wrong, because a server can wait for all client messages
      but the two sides can also play ping-pong. The claim that the client must go first is wrong, because the server
      can choose to send back its initial metadata or wait for the client to start streaming messages. The claim
      that the streams are locked in a fixed order is wrong, because client-side and server-side stream processing
      is application specific.
  citation: grpc-core-concepts#bidirectional-streaming-rpc
  extract:
    en: Since the two streams are independent, the client and server can read and write messages in any order.
- id: m07-l06-q03
  prompt:
    en: A gRPC client sets a deadline for an RPC and the server does not answer in time. With which error is the
      RPC terminated?
  options:
  - id: a
    text:
      en: '`INVALID_ARGUMENT`'
  - id: b
    correct: true
    text:
      en: '`DEADLINE_EXCEEDED`'
  - id: c
    text:
      en: '`UNAVAILABLE`'
  - id: d
    text:
      en: '`RESOURCE_EXHAUSTED`'
  explanation:
    en: The RPC is terminated with a `DEADLINE_EXCEEDED` error. `INVALID_ARGUMENT` is wrong, because it means the
      client specified an invalid argument. `UNAVAILABLE` is wrong, because it means the service is currently unavailable.
      `RESOURCE_EXHAUSTED` is wrong, because it means some resource has been exhausted, perhaps a per-user quota.
  citation: grpc-core-concepts#deadlines
  extract:
    en: gRPC allows clients to specify how long they are willing to wait for an RPC to complete before the RPC is
      terminated with a DEADLINE_EXCEEDED error.
- id: m07-l06-q04
  prompt:
    en: Which statement about automatic deadline propagation from an incoming gRPC call to the outgoing calls of
      the same server is correct?
  options:
  - id: a
    text:
      en: Every implementation propagates the deadline automatically, so no configuration is ever needed
  - id: b
    text:
      en: The server must always copy the deadline into each outgoing call by hand, because no implementation does
        it
  - id: c
    text:
      en: The server should give each outgoing call its own fresh deadline, whatever the original client set
  - id: d
    correct: true
    text:
      en: In some languages it must be explicitly enabled, for example C++, and in others it is on by default, for
        example Java and Go
  explanation:
    en: In some languages propagation must be explicitly enabled, for example C++, and in others it is enabled by
      default, for example Java and Go. The claim that every implementation propagates automatically is wrong, because
      automatic propagation is supported by some gRPC implementations. The claim that no implementation propagates
      is wrong, because propagation avoids the error-prone approach of manually including the deadline for each
      outgoing RPC. The claim that each outgoing call gets a fresh deadline is wrong, because a server that also
      acts as a client would want to honor the deadline set by the original client.
  citation: grpc-deadlines#deadline-propagation
  extract:
    en: In some languages this behavior needs to be explicitly enabled (e.g. C++) and in others it is enabled by
      default (e.g. Java and Go).
- id: m07-l06-q05
  prompt:
    en: When gRPC propagates a deadline to an outgoing call, it converts the deadline into a timeout with the elapsed
      time deducted. Why does it do that?
  options:
  - id: a
    text:
      en: So that the downstream server can restart the full original timeout from zero
  - id: b
    text:
      en: Because no gRPC language API can express a deadline as a fixed point in time
  - id: c
    correct: true
    text:
      en: A deadline is a point in time, and the clocks of the two servers might not be synchronized
  - id: d
    text:
      en: Because the server is never able to include the deadline in its outgoing calls itself
  explanation:
    en: A deadline is a set point in time, and propagating it as-is is problematic because the clocks on the two
      servers might not be synchronized. The claim that the timeout restarts from zero is wrong, because the server
      that also acts as a client would want to honor the deadline set by the original client. The claim that no
      language API uses a fixed point in time is wrong, because some language APIs work in terms of a deadline,
      which is a fixed point in time. The claim that a server cannot include the deadline itself is wrong, because
      manually including the deadline for each outgoing RPC is possible, though error-prone.
  citation: grpc-deadlines#deadline-propagation
  extract:
    en: Since a deadline is set point in time, propagating it as-is to a server can be problematic as the clocks
      on the two servers might not be synchronized.
- id: m07-l06-q06
  prompt:
    en: A gRPC client cancels an RPC that the server is still processing. What should the server do when the RPC
      is cancelled?
  options:
  - id: a
    text:
      en: Finish the work in progress and then discard the result
  - id: b
    text:
      en: Keep the calls it made to upstream servers running, since only the client side is cancelled
  - id: c
    text:
      en: Ignore the cancellation, because only the server is allowed to cancel an RPC
  - id: d
    correct: true
    text:
      en: Stop any ongoing computation and end its side of the stream
  explanation:
    en: The server should stop any ongoing computation and end its side of the stream. The claim that the server
      finishes its work is wrong, because a cancellation terminates the RPC immediately so that no further work
      is done. The claim that upstream calls keep running is wrong, because cancellation should ideally propagate
      to all ongoing computation in the system initiated by the original client RPC call. The claim that only the
      server can cancel is wrong, because either the client or the server can cancel an RPC at any time.
  citation: grpc-cancellation#overview
  extract:
    en: When an RPC is cancelled, the server should stop any ongoing computation and end its side of the stream.
- id: m07-l06-q07
  prompt:
    en: A gRPC service rejects a write because a client-specified test-and-set failed, and the client should restart
      its whole read-modify-write sequence. Which status code does the guideline suggest?
  options:
  - id: a
    text:
      en: '`UNAVAILABLE`'
  - id: b
    text:
      en: '`FAILED_PRECONDITION`'
  - id: c
    correct: true
    text:
      en: '`ABORTED`'
  - id: d
    text:
      en: '`INVALID_ARGUMENT`'
  explanation:
    en: '`ABORTED` is the code when the client should retry at a higher level, for example restarting a read-modify-write
      sequence. `UNAVAILABLE` is wrong, because it fits when the client can retry just the failing call. `FAILED_PRECONDITION`
      is wrong, because it fits when the client should not retry until the system state has been explicitly fixed.
      `INVALID_ARGUMENT` is wrong, because it indicates arguments that are problematic regardless of the state of
      the system.'
  citation: grpc-status-codes#the-full-list-of-status-codes
  extract:
    en: (b) Use ABORTED if the client should retry at a higher level (e.g., when a client-specified test-and-set
      fails, indicating the client should restart a read-modify-write sequence).
- id: m07-l06-q08
  prompt:
    en: A gRPC server rejects a request because the caller used up a per-user quota. Which status code must it use
      instead of `PERMISSION_DENIED`?
  options:
  - id: a
    text:
      en: '`UNAUTHENTICATED`'
  - id: b
    text:
      en: '`FAILED_PRECONDITION`'
  - id: c
    correct: true
    text:
      en: '`RESOURCE_EXHAUSTED`'
  - id: d
    text:
      en: '`OUT_OF_RANGE`'
  explanation:
    en: '`PERMISSION_DENIED` must not be used for rejections caused by exhausting some resource, so `RESOURCE_EXHAUSTED`
      is used for those errors. `UNAUTHENTICATED` is wrong, because it means the request does not have valid authentication
      credentials for the operation. `FAILED_PRECONDITION` is wrong, because it means the system is not in a state
      required for the operation''s execution. `OUT_OF_RANGE` is wrong, because it means the operation was attempted
      past the valid range, such as reading past end-of-file.'
  citation: grpc-status-codes#the-full-list-of-status-codes
  extract:
    en: PERMISSION_DENIED must not be used for rejections caused by exhausting some resource (use RESOURCE_EXHAUSTED
      instead for those errors).
- id: m07-l06-q10
  prompt:
    en: Which gRPC status code is most likely a transient condition that can be corrected by retrying with a backoff?
  options:
  - id: a
    text:
      en: '`INTERNAL`'
  - id: b
    correct: true
    text:
      en: '`UNAVAILABLE`'
  - id: c
    text:
      en: '`DATA_LOSS`'
  - id: d
    text:
      en: '`UNIMPLEMENTED`'
  explanation:
    en: '`UNAVAILABLE` is most likely a transient condition, which can be corrected by retrying with a backoff.
      `INTERNAL` is wrong, because it means some invariants expected by the underlying system have been broken,
      a serious error. `DATA_LOSS` is wrong, because it means unrecoverable data loss or corruption. `UNIMPLEMENTED`
      is wrong, because it means the operation is not implemented or not supported or enabled in this service.'
  citation: grpc-status-codes#the-full-list-of-status-codes
  extract:
    en: This is most likely a transient condition, which can be corrected by retrying with a backoff.
- id: m07-l06-q11
  prompt:
    en: Which schema change to a Protocol Buffers message is wire-unsafe, so that old and new parsers can break
      on each other's data?
  options:
  - id: a
    correct: true
    text:
      en: Changing the field number of an existing field
  - id: b
    text:
      en: Adding a new field to the message
  - id: c
    text:
      en: Adding an additional value to an enum used in the message
  - id: d
    text:
      en: Removing a field and never using its number again
  explanation:
    en: Changing the field number of an existing field is not safe, because it is equivalent to deleting the field
      and adding a new one. Adding a new field is wrong, because adding new fields is safe. Adding an enum value
      is wrong, because adding additional values to an enum is safe. Removing a field is wrong, because removing
      fields is safe as long as the same field number is not used again.
  citation: protobuf-proto3#wire-unsafe-changes
- id: m07-l06-q12
  prompt:
    en: An old binary parses Protocol Buffers data that a new binary wrote with additional fields. What happens
      to those additional fields in the old binary?
  options:
  - id: a
    correct: true
    text:
      en: They become unknown fields in the old binary
  - id: b
    text:
      en: They are dropped, and the old binary does not write them out again
  - id: c
    text:
      en: The parse of the whole message fails with an error in the old binary
  - id: d
    text:
      en: They are merged into the nearest known field whose type matches
  explanation:
    en: Those new fields become unknown fields in the old binary. The claim that they are dropped is wrong, because
      proto3 messages preserve unknown fields and include them during parsing and in the serialized output. The
      claim that the parse fails is wrong, because wire-safe changes carry no risk of data loss or new parse failures.
      The claim that they are merged into a known field is wrong, because unknown fields are well-formed serialized
      data representing fields that the parser does not recognize.
  citation: protobuf-proto3#unknowns
- id: m07-l06-q13
  prompt:
    en: In a proto3 message, which field numbers should be used for the most frequently set fields because they
      take the least space in the wire format?
  options:
  - id: a
    text:
      en: 16 through 2047
  - id: b
    correct: true
    text:
      en: 1 through 15
  - id: c
    text:
      en: 19,000 through 19,999
  - id: d
    text:
      en: Any number above 536,870,911
  explanation:
    en: Field numbers 1 through 15 should be used for the most frequently set fields. 16 through 2047 is wrong,
      because those numbers take two bytes to encode. 19,000 through 19,999 is wrong, because those numbers are
      reserved for the Protobuf implementation. Any number above 536,870,911 is wrong, because each field needs
      a number between 1 and 536,870,911.
  citation: protobuf-proto3#assigning
- id: m07-l06-q14
  prompt:
    en: In Spring for GraphQL, when must you use a `BatchLoaderRegistry` registration instead of a `@BatchMapping`
      method to load related entities?
  options:
  - id: a
    correct: true
    text:
      en: When the loading needs more information about the parent `@SchemaMapping` call, such as `@Argument` or
        context data
  - id: b
    text:
      en: When the field name must differ from the name of the method
  - id: c
    text:
      en: When the batch loading function must return a `Mono` of a map
  - id: d
    text:
      en: When the loaded entities must be registered in the `BatchLoaderRegistry` at all
  explanation:
    en: '`BatchLoaderRegistry` is required when the use case needs more information about the parent `@SchemaMapping`
      call, such as `@Argument` or context data. The claim that a different field name needs the registry is wrong,
      because the field name and the type name can both be customized through annotation attributes. The claim that
      a `Mono` return needs the registry is wrong, because the `@BatchMapping` example itself returns `Mono<Map<Book,
      Author>>`. The claim that only the registry registers batch loading is wrong, because a `@BatchMapping` method
      itself becomes a batch loading function in the `BatchLoaderRegistry`, with the parent instances as keys.'
  citation: spring-graphql-controllers#controllers.batch-mapping
