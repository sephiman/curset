# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q232
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes combinaciones de teclas de la tabla de métodos abreviados crea otro escritorio?"
  options:
  - id: a
    correct: true
    text:
      es: "Windows+Ctrl+D"
  - id: b
    text:
      es: "Windows+Ctrl+F4"
  - id: c
    text:
      es: "Windows+Ctrl+Flecha derecha"
  - id: d
    text:
      es: "Windows+Tab"
  explanation:
    es: "La tabla de métodos abreviados de varios escritorios asigna a Windows+Ctrl+D «Crear otro escritorio». Windows+Ctrl+F4 cierra el escritorio en uso, Windows+Ctrl+Flecha derecha alterna entre los escritorios creados a la derecha y Windows+Tab abre la Vista de tareas."
  citation: "fuente: `ms-win-atajos.html`; «Varios métodos abreviados de teclado de escritorios»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q233
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes combinaciones de teclas cierra el escritorio que se está usando en ese momento?"
  options:
  - id: a
    correct: true
    text:
      es: "Windows+Ctrl+F4"
  - id: b
    text:
      es: "Windows+Ctrl+D"
  - id: c
    text:
      es: "Windows+Ctrl+Flecha izquierda"
  - id: d
    text:
      es: "Alt+F4"
  explanation:
    es: "La tabla de varios escritorios asigna a Windows+Ctrl+F4 «Cerrar el escritorio que estás usando». Windows+Ctrl+D crea otro escritorio, Windows+Ctrl+Flecha izquierda alterna entre los escritorios de la izquierda y Alt+F4 cierra la ventana activa, no el escritorio."
  citation: "fuente: `ms-win-atajos.html`; «Varios métodos abreviados de teclado de escritorios»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q234
  prompt:
    es: "¿Cuál de las siguientes combinaciones de teclas permite alternar con el teclado entre los escritorios creados situados a la derecha en Windows 11?"
  options:
  - id: a
    text:
      es: "Windows+Flecha derecha"
  - id: b
    text:
      es: "Windows+Alt+Flecha abajo"
  - id: c
    text:
      es: "Windows+Ctrl+D"
  - id: d
    correct: true
    text:
      es: "Windows+Ctrl+Flecha derecha"
  explanation:
    es: "La tabla de varios escritorios asigna a Windows+Ctrl+Flecha derecha «Alternar entre otros escritorios que has creado a la derecha». Windows+Flecha derecha acopla la ventana al lado derecho de la pantalla, Windows+Alt+Flecha abajo acopla la ventana activa a la mitad inferior y Windows+Ctrl+D crea otro escritorio."
  citation: "fuente: `ms-win-atajos.html`; «Varios métodos abreviados de teclado de escritorios»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q235
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes combinaciones de teclas abre la Vista de tareas, desde la que se puede crear un escritorio nuevo?"
  options:
  - id: a
    text:
      es: "Windows+Ctrl+D"
  - id: b
    text:
      es: "Windows+Alt+Flecha arriba"
  - id: c
    correct: true
    text:
      es: "Windows+Tab"
  - id: d
    text:
      es: "Alt+Esc"
  explanation:
    es: "La tabla de varios escritorios asigna a Windows+Tab «Abrir la Vista de tareas». Windows+Ctrl+D crea otro escritorio, Windows+Alt+Flecha arriba acopla la ventana activa a la mitad superior y Alt+Esc se desplaza por las ventanas en el orden en que se abrieron."
  citation: "fuente: `ms-win-atajos.html`; «Varios métodos abreviados de teclado de escritorios»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-escritorios-html
- id: m06-l02-q236
  prompt:
    es: "En Windows 11, ¿qué se puede hacer con el ratón para abrir la Vista de tareas y crear desde ella un nuevo escritorio?"
  options:
  - id: a
    text:
      es: "Mantener el puntero sobre el botón Maximizar de una ventana"
  - id: b
    correct: true
    text:
      es: "Mantener el puntero sobre el icono de Vista de tareas de la barra"
  - id: c
    text:
      es: "Mantener el puntero sobre el botón Widgets de la barra de tareas"
  - id: d
    text:
      es: "Seleccionar la esquina más alejada de la barra de tareas"
  explanation:
    es: "La página indica que, para crear un nuevo escritorio, se mantiene el puntero sobre el icono de Vista de tareas de la barra de tareas o se presiona Windows y Tab, y luego se selecciona Nuevo escritorio. El puntero sobre Maximizar muestra los diseños de ajuste, sobre Widgets abre el panel de widgets y la esquina más alejada muestra el escritorio."
  citation: "fuente: `ms-win-escritorios.html`; «Crear un nuevo escritorio»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-escritorios-html
- id: m06-l02-q237
  prompt:
    es: "En Windows 11, una vez abierta la Vista de tareas, para crear un escritorio nuevo se selecciona la opción:"
  options:
  - id: a
    text:
      es: "Elegir fondo"
  - id: b
    correct: true
    text:
      es: "Nuevo escritorio"
  - id: c
    text:
      es: "Mostrar el escritorio"
  - id: d
    text:
      es: "Nuevo › Acceso directo"
  explanation:
    es: "La página dice que, tras abrir la Vista de tareas, se selecciona Nuevo escritorio. Elegir fondo cambia la imagen de un escritorio ya creado y Nuevo › Acceso directo es la ruta del clic derecho en un área vacía del escritorio para crear un acceso directo. Mostrar el escritorio minimiza las ventanas."
  citation: "fuente: `ms-win-escritorios.html`; «Crear un nuevo escritorio»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-escritorios-html
- id: m06-l02-q238
  prompt:
    es: "¿Cómo se configura en Windows 11 un fondo distinto para cada escritorio virtual creado con la Vista de tareas?"
  options:
  - id: a
    correct: true
    text:
      es: "Con clic derecho en ese escritorio, en la Vista de tareas, y Elegir fondo"
  - id: b
    text:
      es: "Con clic derecho en un área vacía del escritorio y la opción Ver"
  - id: c
    text:
      es: "Con Configuración › Personalización › Temas › Configuración del icono de escritorio"
  - id: d
    text:
      es: "Con Configuración › Sistema › Multitarea › Escritorios"
  explanation:
    es: "La página indica que, en la Vista de tareas, se hace clic con el botón derecho en el escritorio que se desea personalizar y se selecciona Elegir fondo. El menú Ver del escritorio cambia el tamaño de los iconos, la configuración del icono de escritorio elige iconos como Este equipo y la Papelera, y Multitarea › Escritorios decide qué ventanas muestra la barra de tareas."
  citation: "fuente: `ms-win-escritorios.html`; «Configure fondos para cada escritorio»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-escritorios-html
- id: m06-l02-q239
  prompt:
    es: "Señale la afirmación correcta sobre los fondos de los distintos escritorios virtuales de Windows 11:"
  options:
  - id: a
    text:
      es: "Cada escritorio puede tener una presentación de diapositivas diferente de las demás"
  - id: b
    text:
      es: "Cada escritorio puede tener un color sólido diferente al de los demás escritorios"
  - id: c
    text:
      es: "Todos los escritorios deben compartir siempre el mismo fondo de pantalla elegido"
  - id: d
    correct: true
    text:
      es: "Cada escritorio puede tener su imagen, pero no una presentación ni un color sólido propios"
  explanation:
    es: "La página dice que solo es posible configurar un fondo personalizado para cada escritorio cuando se usa una imagen, y que no se puede usar una presentación de diapositivas ni un color sólido diferente en cada uno. Por eso ninguna de las otras afirmaciones se sostiene."
  citation: "fuente: `ms-win-escritorios.html`; «Configure fondos para cada escritorio»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-escritorios-html
- id: m06-l02-q240
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones de Configuración › Sistema › Multitarea › Escritorios hace que la barra de tareas muestre las ventanas abiertas de todos los escritorios?"
  options:
  - id: a
    text:
      es: "Solo en el escritorio que estoy usando"
  - id: b
    text:
      es: "Mostrar mi barra de tareas en todas las pantallas"
  - id: c
    correct: true
    text:
      es: "En todos los escritorios"
  - id: d
    text:
      es: "Mostrar todas las ventanas abiertas al presionar Alt+TAB"
  explanation:
    es: "La página dice que En todos los escritorios muestra en la barra de tareas las ventanas abiertas de todos los escritorios. Solo en el escritorio que estoy usando muestra únicamente las del escritorio actual. Mostrar mi barra de tareas en todas las pantallas es una opción de comportamiento con varios monitores, y la opción de Alt+TAB solo afecta a las ventanas que muestra esa combinación."
  citation: "fuente: `ms-win-escritorios.html`; «Personalizar la experiencia de múltiples escritorios»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-win-escritorios-html
- id: m06-l02-q241
  prompt:
    es: "Con varios escritorios en Windows 11, ¿qué dos valores ofrece Configuración para las ventanas abiertas que muestra la barra de tareas?"
  options:
  - id: a
    text:
      es: "Solo en la pantalla principal y En todas las pantallas conectadas"
  - id: b
    text:
      es: "Solo en las aplicaciones ancladas y En todas las aplicaciones abiertas"
  - id: c
    correct: true
    text:
      es: "Solo en el escritorio que estoy usando y En todos los escritorios"
  - id: d
    text:
      es: "En el escritorio actual y En el último escritorio que se usó"
  explanation:
    es: "La página enumera dos opciones para las ventanas abiertas en la barra de tareas con varios escritorios: Solo en el escritorio que estoy usando, que muestra las del escritorio actual, y En todos los escritorios, que muestra las de todos. Las otras parejas cambian los términos por pantallas, aplicaciones o un último escritorio, y contradicen los dos valores que enumera la página."
  citation: "fuente: `ms-win-escritorios.html`; «Personalizar la experiencia de múltiples escritorios»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-varias-pantallas-html
- id: m06-l02-q242
  prompt:
    es: "En Windows 11, ¿qué combinación de teclas permite elegir cómo se muestra el contenido en las pantallas conectadas?"
  options:
  - id: a
    text:
      es: "Windows+K"
  - id: b
    correct: true
    text:
      es: "Windows+P"
  - id: c
    text:
      es: "Windows+O"
  - id: d
    text:
      es: "Windows+Mayús+Flecha derecha"
  explanation:
    es: "La página dice que, para cambiar lo que se muestra en las pantallas, se presiona la tecla Windows y P. Según la tabla de métodos abreviados, Windows+K abre Transmitir desde la Configuración rápida, Windows+O bloquea la orientación del dispositivo y Windows+Mayús+Flecha derecha mueve la ventana activa al monitor de la derecha."
  citation: "fuente: `ms-win-varias-pantallas.html`; «Elija una opción de pantalla»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-varias-pantallas-html
- id: m06-l02-q243
  prompt:
    es: "En el menú de Windows+P de Windows 11, ¿cuál de las siguientes opciones muestra lo mismo en todas las pantallas?"
  options:
  - id: a
    correct: true
    text:
      es: "Duplicar"
  - id: b
    text:
      es: "Extender"
  - id: c
    text:
      es: "Solo la pantalla del PC"
  - id: d
    text:
      es: "Solo la segunda pantalla"
  explanation:
    es: "La tabla de la página dice que, para ver lo mismo en todas las pantallas, se elige Duplicar. Extender muestra el escritorio en varias pantallas, Solo la pantalla del PC muestra todo en una sola pantalla y Solo la segunda pantalla lo muestra todo únicamente en la segunda."
  citation: "fuente: `ms-win-varias-pantallas.html`; «Elija una opción de pantalla»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-win-varias-pantallas-html
- id: m06-l02-q244
  prompt:
    es: "En Windows 11, con las pantallas extendidas, ¿qué permite hacer la opción Extender del menú de Windows+P?"
  options:
  - id: a
    text:
      es: "Ver lo mismo en todas las pantallas conectadas al equipo"
  - id: b
    text:
      es: "Ver todo el contenido solo en la segunda pantalla conectada"
  - id: c
    text:
      es: "Ver todo en una sola pantalla, la del propio PC"
  - id: d
    correct: true
    text:
      es: "Ver el escritorio en varias pantallas y mover elementos"
  explanation:
    es: "La tabla dice que Extender muestra el escritorio en varias pantallas y que, con pantallas extendidas, se pueden mover elementos entre ellas. Ver lo mismo en todas corresponde a Duplicar, el contenido solo en la segunda pantalla a Solo la segunda pantalla y todo en una sola pantalla a Solo la pantalla del PC."
  citation: "fuente: `ms-win-varias-pantallas.html`; «Elija una opción de pantalla»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-varias-pantallas-html
- id: m06-l02-q245
  prompt:
    es: "En Windows 11, ¿qué se ve en las pantallas conectadas cuando se elige la opción Solo la segunda pantalla del menú de Windows+P?"
  options:
  - id: a
    text:
      es: "Lo mismo en todas las pantallas conectadas"
  - id: b
    text:
      es: "Todo en una sola pantalla, la del propio PC"
  - id: c
    text:
      es: "El escritorio repartido entre varias pantallas"
  - id: d
    correct: true
    text:
      es: "Todo el contenido solo en la segunda pantalla"
  explanation:
    es: "La tabla dice que Solo la segunda pantalla muestra todo el contenido solo en la segunda pantalla. Lo mismo en todas es Duplicar, todo en una sola pantalla es Solo la pantalla del PC y el escritorio en varias pantallas es Extender."
  citation: "fuente: `ms-win-varias-pantallas.html`; «Elija una opción de pantalla»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-win-varias-pantallas-html
- id: m06-l02-q246
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones del menú de Windows+P se elige para verlo todo en una sola pantalla?"
  options:
  - id: a
    text:
      es: "Duplicar"
  - id: b
    text:
      es: "Extender"
  - id: c
    correct: true
    text:
      es: "Solo la pantalla del PC"
  - id: d
    text:
      es: "Solo la segunda pantalla"
  explanation:
    es: "La tabla dice que, para verlo todo en una sola pantalla, se elige Solo la pantalla del PC. Duplicar repite el contenido en todas las pantallas, Extender muestra el escritorio en varias y Solo la segunda pantalla lo lleva únicamente a la segunda."
  citation: "fuente: `ms-win-varias-pantallas.html`; «Elija una opción de pantalla»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-win-varias-pantallas-html
- id: m06-l02-q247
  prompt:
    es: "Señale la afirmación correcta sobre la configuración de las pantallas externas conectadas a un PC con Windows 11:"
  options:
  - id: a
    text:
      es: "Solo se puede ajustar la configuración de la pantalla principal del equipo"
  - id: b
    correct: true
    text:
      es: "La configuración de cada pantalla externa se puede ajustar por separado"
  - id: c
    text:
      es: "Cualquier ajuste de una pantalla se aplica a todas las demás"
  - id: d
    text:
      es: "La resolución de las pantallas externas no se puede cambiar"
  explanation:
    es: "La página dice que, tras conectar el PC a pantallas externas, se puede ajustar la configuración de cada una de ellas, y que entre las opciones está cambiar la resolución, la escala y el diseño. Por eso las otras tres afirmaciones, que la limitan a la principal, la hacen común o impiden cambiar la resolución, son incorrectas."
  citation: "fuente: `ms-win-varias-pantallas.html`; «Cambiar las opciones de pantalla»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-varias-pantallas-html
- id: m06-l02-q248
  prompt:
    es: "En Windows 11, ¿cómo se cambia la forma en que están organizadas varias pantallas, por ejemplo para que el ratón pase de una a otra con suavidad?"
  options:
  - id: a
    correct: true
    text:
      es: "Arrastrando cada pantalla a la posición deseada y seleccionando Aplicar"
  - id: b
    text:
      es: "Eligiendo Duplicar en el menú de Windows+P para ver lo mismo en todas"
  - id: c
    text:
      es: "Seleccionando Identificar en cada una de las pantallas conectadas"
  - id: d
    text:
      es: "Seleccionando Detectar para buscar pantallas en la configuración"
  explanation:
    es: "La página dice que, en Configuración de pantalla, se selecciona la pantalla, se arrastra a la posición deseada y se selecciona Aplicar. Duplicar repite el contenido en todas las pantallas, Identificar muestra un número en cada pantalla y Detectar sirve para buscar una pantalla conectada que no aparece."
  citation: "fuente: `ms-win-varias-pantallas.html`; «Organizar las pantallas»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-varias-pantallas-html
- id: m06-l02-q249
  prompt:
    es: "En Windows 11, ¿qué muestra la opción Identificar de la configuración de varias pantallas conectadas?"
  options:
  - id: a
    correct: true
    text:
      es: "Un número en la pantalla a la que está asignado"
  - id: b
    text:
      es: "El nombre del fabricante de cada pantalla"
  - id: c
    text:
      es: "Las pantallas conectadas que no aparecen en Configuración"
  - id: d
    text:
      es: "La posición física de cada pantalla respecto a las demás"
  explanation:
    es: "La página dice que, al identificar una pantalla, se muestra un número en la pantalla a la que está asignado. Buscar una pantalla conectada que no se muestra en Configuración es la función de Detectar, y la posición relativa se ajusta arrastrando las pantallas, no con Identificar."
  citation: "fuente: `ms-win-varias-pantallas.html`; «Identificar una pantalla»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-varias-pantallas-html
- id: m06-l02-q250
  prompt:
    es: "Para conectar una pantalla inalámbrica en Windows 11, ¿cuál de las siguientes combinaciones de teclas abre Transmitir, según la página sobre varios monitores?"
  options:
  - id: a
    text:
      es: "Windows+P"
  - id: b
    text:
      es: "Windows+O"
  - id: c
    text:
      es: "Windows+H"
  - id: d
    correct: true
    text:
      es: "Windows+K"
  explanation:
    es: "La página dice que, con un adaptador de pantalla inalámbrico, se presiona la tecla Windows y K para abrir Transmitir. Según la tabla de métodos abreviados, Windows+P elige un modo de presentación, Windows+O bloquea la orientación del dispositivo y Windows+H abre el dictado por voz."
  citation: "fuente: `ms-win-varias-pantallas.html`; «Antes de empezar»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-varias-pantallas-html
- id: m06-l02-q251
  prompt:
    es: "En Windows 11, ¿qué ocurre con las ventanas del monitor externo al desacoplar el equipo, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Se cierran y hay que abrirlas de nuevo al volver a acoplar el equipo"
  - id: b
    text:
      es: "Pasan a la pantalla del PC y se maximizan"
  - id: c
    correct: true
    text:
      es: "Se minimizan, y al volver a acoplar Windows las coloca donde estaban"
  - id: d
    text:
      es: "Se quedan abiertas en la pantalla del PC en su posición anterior"
  explanation:
    es: "La página dice que, al desacoplar el equipo, se minimizan las ventanas del monitor externo, y que al volver a acoplarlo Windows las coloca exactamente donde estaban. Las otras tres opciones hablan de cerrarlas, maximizarlas o dejarlas abiertas, lo que contradice que se minimizan."
  citation: "fuente: `ms-win-varias-pantallas.html`; «Varias opciones de visualización»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-varias-pantallas-html
- id: m06-l02-q252
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes casillas de la sección Varias pantallas hace que Windows minimice las ventanas cuando se desconecta un monitor?"
  options:
  - id: a
    text:
      es: "Recordar ubicaciones de ventanas en función de la conexión del monitor"
  - id: b
    correct: true
    text:
      es: "Minimizar ventanas cuando un monitor está desconectado"
  - id: c
    text:
      es: "Mostrar mi barra de tareas en todas las pantallas"
  - id: d
    text:
      es: "Mostrar todas las ventanas abiertas al presionar Alt+TAB"
  explanation:
    es: "La página enumera la casilla Minimizar ventanas cuando un monitor está desconectado. Recordar ubicaciones de ventanas es la otra casilla de esa sección. Mostrar mi barra de tareas en todas las pantallas es un comportamiento de la barra de tareas y la opción de Alt+TAB pertenece a la configuración de Multitarea."
  citation: "fuente: `ms-win-varias-pantallas.html`; «Varias opciones de visualización»"
  difficulty: 3
  tags:
  - "configuración"
# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q253
  prompt:
    es: "En Windows 11, ¿en qué carpeta guarda Windows la captura de pantalla completa que se hace con la tecla Windows y Impr Pant?"
  options:
  - id: a
    text:
      es: "En la subcarpeta Grabaciones de pantalla de Vídeos"
  - id: b
    correct: true
    text:
