- id: m09-l02-q02
  prompt:
    en: In PostgreSQL declarative partitioning, where is the row data of a partitioned table physically stored once
      rows have been inserted into it?
  options:
  - id: a
    correct: true
    text:
      en: In the partitions, which are otherwise-ordinary tables associated with the partitioned table
  - id: b
    text:
      en: In the partitioned table itself, which keeps its own copy of every row
  - id: c
    text:
      en: In one shared heap that all partitions read through their partition bounds
  - id: d
    text:
      en: In foreign tables only, because every partition must be a foreign table
  explanation:
    en: The storage belongs to the partitions, which are otherwise-ordinary tables. A copy in the partitioned table
      itself is wrong because the partitioned table is a virtual table with no storage of its own. A shared heap
      is wrong because each partition stores its own subset of the data as defined by its partition bounds. Foreign
      tables only is wrong because partitions can also be foreign tables, not that they must be.
  citation: pg-ddl-partitioning#DDL-PARTITIONING-DECLARATIVE
  extract:
    en: Instead, the storage belongs to partitions, which are otherwise-ordinary tables associated with the partitioned
      table.
- id: m09-l02-q04
  prompt:
    en: In PostgreSQL declarative partitioning, how can an existing regular table that already holds rows become
      a partition of a partitioned table?
  options:
  - id: a
    text:
      en: By converting it in place into a partitioned table
  - id: b
    text:
      en: By detaching it from the partitioned table with `DETACH PARTITION`
  - id: c
    text:
      en: Only by copying its rows into a newly created partition, because a table cannot be added as it is
  - id: d
    correct: true
    text:
      en: By attaching it as a partition of the partitioned table
  explanation:
    en: An existing regular table can be added as a partition of a partitioned table. Converting a regular table
      in place is wrong because it is not possible to turn a regular table into a partitioned table. Detaching is
      wrong because removing a partition turns it into a standalone table. Copying the rows is wrong because an
      existing table can be added as a partition as it is.
  citation: pg-ddl-partitioning#DDL-PARTITIONING-DECLARATIVE
  extract:
    en: it is possible to add an existing regular or partitioned table as a partition of a partitioned table
