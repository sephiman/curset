# anchor: boe-a-2015-10566-art-3
- id: m01-l06-q021
  prompt:
    es: "Según el artículo 3.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿cuál de los siguientes principios deben respetar las Administraciones Públicas en su actuación y relaciones?"
  options:
  - id: a
    text:
      es: "Responsabilidad patrimonial por la gestión de los servicios públicos."
  - id: b
    text:
      es: "Rendición de cuentas ante el Consejo de Transparencia y Buen Gobierno."
  - id: c
    text:
      es: "Publicidad activa de la gestión de los fondos públicos."
  - id: d
    correct: true
    text:
      es: "Responsabilidad por la gestión pública."
  explanation:
    es: "La letra f) del artículo 3.1 recoge la «responsabilidad por la gestión pública». La responsabilidad patrimonial, la rendición de cuentas ante el Consejo de Transparencia y Buen Gobierno y la publicidad activa de los fondos públicos no están en la lista de principios del artículo 3.1."
  citation: "art. 3.1.f LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12887-art-1
- id: m01-l06-q022
  prompt:
    es: "Según el artículo 1 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, ¿quiénes deben cumplir las obligaciones de buen gobierno que la Ley establece?"
  options:
  - id: a
    text:
      es: "Todos los empleados públicos, sea cual sea su vínculo con la Administración."
  - id: b
    text:
      es: "Las personas que ejerzan el derecho de acceso a la información pública."
  - id: c
    correct: true
    text:
      es: "Los responsables públicos, con las consecuencias derivadas de su incumplimiento."
  - id: d
    text:
      es: "Las entidades privadas que perciban ayudas o subvenciones públicas."
  explanation:
    es: "El artículo 1 habla de «las obligaciones de buen gobierno que deben cumplir los responsables públicos así como las consecuencias derivadas de su incumplimiento». No las extiende a todos los empleados públicos, a quienes piden información ni a las entidades privadas que reciben ayudas."
  citation: "art. 1 Ley 19/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-transparencia-planes-accion-html
- id: m01-l06-q023
  prompt:
    es: "Según el Portal de la Transparencia, los Planes de Gobierno Abierto de España recogen el conjunto de actuaciones a las que se compromete:"
  options:
  - id: a
    correct: true
    text:
      es: "La Administración General del Estado, con otras Administraciones públicas y con la sociedad civil."
  - id: b
    text:
      es: "El conjunto de las Administraciones públicas españolas, sin intervención de la sociedad civil."
  - id: c
    text:
      es: "La Alianza para el Gobierno Abierto, con los Estados que la integran."
  - id: d
    text:
      es: "El Consejo de Transparencia y Buen Gobierno, en colaboración con las Comunidades Autónomas."
  explanation:
    es: "El Portal dice que los planes recogen las actuaciones a las que se compromete «la Administración General del Estado, en colaboración con otras Administraciones públicas y con la sociedad civil». La sociedad civil sí interviene. Los planes son de España, no de la Alianza, y no los asume el Consejo de Transparencia y Buen Gobierno."
  citation: "fuente: `transparencia-planes-accion.html`"
  difficulty: 2
  tags:
  - "competencia"
# anchor: fuente-transparencia-planes-accion-html
- id: m01-l06-q024
  prompt:
    es: "¿En qué ámbitos se compromete a avanzar la Administración General del Estado con los Planes de Gobierno Abierto de España?"
  options:
  - id: a
    text:
      es: "En publicidad activa, derecho de acceso y buen gobierno."
  - id: b
    text:
      es: "En eficacia, jerarquía, descentralización y coordinación."
  - id: c
    text:
      es: "En simplicidad, claridad y proximidad a los ciudadanos."
  - id: d
    correct: true
    text:
      es: "En participación, transparencia, integridad y sensibilización social."
  explanation:
    es: "Según el Portal de la Transparencia, los planes sirven para avanzar «en la participación, la transparencia, la integridad y la sensibilización social». La opción de «publicidad activa» recoge contenidos de la Ley 19/2013. La de «eficacia, jerarquía» son principios del primer párrafo del artículo 3.1 de la Ley 40/2015 y la de «simplicidad, claridad», su letra b)."
  citation: "fuente: `transparencia-planes-accion.html`"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-transparencia-planes-anteriores-html
- id: m01-l06-q025
  prompt:
    es: "¿Qué periodo abarcó el I Plan de Gobierno Abierto de España, el primero desarrollado tras la incorporación de España a la Alianza para el Gobierno Abierto?"
  options:
  - id: a
    text:
      es: "El periodo comprendido entre 2011 y 2013."
  - id: b
    correct: true
    text:
      es: "El periodo comprendido entre 2012 y 2014."
  - id: c
    text:
      es: "El periodo comprendido entre 2014 y 2016."
  - id: d
    text:
      es: "El periodo comprendido entre 2017 y 2019."
  explanation:
    es: "El Portal de la Transparencia fecha el I Plan en 2012-2014. 2014-2016 es el II Plan y 2017-2019, el III. 2011 es el año en que España se unió a la OGP, no el inicio de un plan."
  citation: "fuente: `transparencia-planes-anteriores.html`"
  difficulty: 2
  tags:
  - "fecha"
# anchor: fuente-transparencia-planes-anteriores-html
