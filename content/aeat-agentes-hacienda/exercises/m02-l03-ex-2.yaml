# anchor: boe-a-2015-10565-art-9
- id: m02-l03-q0045
  prompt:
    es: "Según el artículo 9.2.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuánto tiempo ha de transcurrir desde la comunicación del sistema de identificación antes de su eficacia jurídica?"
  options:
  - id: a
    correct: true
    text:
      es: "Dos meses desde la comunicación."
  - id: b
    text:
      es: "Un mes desde la comunicación."
  - id: c
    text:
      es: "Diez días desde la comunicación."
  - id: d
    text:
      es: "Tres meses desde la comunicación."
  explanation:
    es: "La letra c) del artículo 9.2 dice que, «de forma previa a la eficacia jurídica del sistema, habrán de transcurrir dos meses desde dicha comunicación». Diez días es el plazo del informe de la Secretaría de Estado de Seguridad, no la espera del sistema. El precepto no habla de un mes ni de tres meses."
  citation: "art. 9.2.c) LPAC"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-9
- id: m02-l03-q0046
  prompt:
    es: "De acuerdo con el artículo 9.2.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el órgano estatal competente por seguridad pública podrá acudir a la vía jurisdiccional previo informe vinculante de:"
  options:
  - id: a
    text:
      es: "La Secretaría General de Administración Digital, que deberá emitirlo en diez días."
  - id: b
    correct: true
    text:
      es: "La Secretaría de Estado de Seguridad, que deberá emitirlo en diez días."
  - id: c
    text:
      es: "La Secretaría de Estado de Seguridad, que deberá emitirlo en un mes."
  - id: d
    text:
      es: "La Abogacía General del Estado, que deberá emitirlo en quince días."
  explanation:
    es: "El artículo 9.2.c) LPAC dice que, durante los dos meses desde la comunicación, el órgano estatal competente por motivos de seguridad pública podrá acudir a la vía jurisdiccional «previo informe vinculante de la Secretaría de Estado de Seguridad, que deberá emitir en el plazo de diez días desde su solicitud». La Secretaría General de Administración Digital recibe la comunicación previa del sistema, y no emite ese informe. Un mes confunde el plazo del informe con el periodo de dos meses antes de la eficacia del sistema: el informe se emite en diez días. La Abogacía General del Estado no es el órgano que nombra la letra c): nombra a la Secretaría de Estado de Seguridad."
  citation: "art. 9.2.c) LPAC"
  difficulty: 3
  tags:
  - "órgano"
  - "plazo"
# anchor: fuente-clave-que-es-html
- id: m02-l03-q0047
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre Cl@ve recoge su portal, en la página «¿Qué es Cl@ve?» consultada el 16 de octubre de 2026?"
  options:
  - id: a
    correct: true
    text:
      es: "Complementa los sistemas de acceso mediante DNI-e y certificado electrónico."
  - id: b
    text:
      es: "Sustituye al DNI-e y al certificado electrónico, que dejan de admitirse."
  - id: c
    text:
      es: "Es un sistema propio de cada ministerio, sin uso por otras Administraciones."
  - id: d
    text:
      es: "Solo permite la firma electrónica, pero no la identificación del ciudadano."
  explanation:
    es: "La página dice que «Cl@ve complementa los actuales sistemas de acceso mediante DNI-e y certificado electrónico». No los sustituye. La misma página la describe como «una plataforma común para la identificación, autenticación y firma electrónica», así que no es propia de cada ministerio ni se limita a la firma."
  citation: "fuente: `clave-que-es.html`"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-clave-que-es-html
- id: m02-l03-q0056
  prompt:
    es: "Según la página «¿Qué es Cl@ve?» del portal de Cl@ve, ¿cómo se define esta herramienta de acceso electrónico a los servicios públicos?"
  options:
  - id: a
    text:
      es: "Una dirección electrónica habilitada para recibir notificaciones de las Administraciones."
  - id: b
    correct: true
    text:
      es: "Una plataforma común para la identificación, autenticación y firma electrónica."
  - id: c
    text:
      es: "Un registro de los funcionarios habilitados para firmar en nombre de los interesados."
  - id: d
    text:
      es: "Una sede electrónica desde la que se accede a todas las sedes asociadas."
  explanation:
    es: "La página describe Cl@ve como una plataforma común para la identificación, autenticación y firma electrónica. El registro de funcionarios, la dirección habilitada y la sede de acceso a las sedes asociadas son otros servicios."
  citation: "fuente: `clave-que-es.html`; «¿Qué es Cl@ve?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-clave-que-es-html
- id: m02-l03-q0057
  prompt:
    es: "Según la página «¿Qué es Cl@ve?», ¿mediante qué se identifica el ciudadano ante la Administración con Cl@ve, además de los sistemas de DNI-e y certificado electrónico?"
  options:
  - id: a
    text:
      es: "Mediante firma manuscrita escaneada y enviada por correo."
  - id: b
    correct: true
    text:
      es: "Mediante claves concertadas, esto es, usuario más contraseña."
  - id: c
    text:
      es: "Mediante tarjeta criptográfica con certificado físico en exclusiva."
  - id: d
    text:
      es: "Mediante huella dactilar tomada en la oficina de registro."
  explanation:
    es: "Cl@ve permite identificarse con claves concertadas (usuario más contraseña) y complementa el DNI-e y el certificado. La tarjeta en exclusiva, la huella en oficina y la firma manuscrita escaneada no son sus medios."
  citation: "fuente: `clave-que-es.html`; «¿Qué es Cl@ve?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-clave-que-es-html
- id: m02-l03-q0058
  prompt:
    es: "Según la página «¿Qué es Cl@ve?» del portal de Cl@ve, ¿de qué dos formas accede el ciudadano a los servicios electrónicos una vez que se ha registrado?"
  options:
  - id: a
    text:
      es: "Con Cl@ve Sede o con Cl@ve Registro."
  - id: b
    text:
      es: "Con Cl@ve Electrónica o con Cl@ve Digital."
  - id: c
    correct: true
    text:
      es: "Con Cl@ve Móvil o con Cl@ve Permanente."
  - id: d
    text:
      es: "Con Cl@ve Notificaciones o con Cl@ve Carpeta."
  explanation:
    es: "Tras registrarse se accede con Cl@ve Móvil o con Cl@ve Permanente. Las otras denominaciones no corresponden a ningún modo de acceso de esa plataforma."
  citation: "fuente: `clave-que-es.html`; «¿Qué es Cl@ve?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-9
- id: m02-l03-q0087
  prompt:
    es: "De acuerdo con el artículo 9.2.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, para que las Administraciones Públicas admitan cualquier otro sistema de identificación que consideren válido, debe haber una comunicación previa a:"
  options:
  - id: a
    text:
      es: "la Agencia Española de Protección de Datos."
  - id: b
    correct: true
    text:
      es: "la Secretaría General de Administración Digital."
  - id: c
    text:
      es: "el Consejo de Transparencia y Buen Gobierno, a través de su sede electrónica."
  - id: d
    text:
      es: "la Secretaría de Estado de Seguridad."
  explanation:
    es: "El artículo 9.2.c) exige la comunicación previa a la Secretaría General de Administración Digital. La Secretaría de Estado de Seguridad interviene solo con un informe vinculante cuando el órgano de seguridad pública acude a la vía jurisdiccional, no como destinataria de la comunicación. La Agencia Española de Protección de Datos y el Consejo de Transparencia y Buen Gobierno no aparecen en ese procedimiento."
  citation: "art. 9.2.c) LPAC"
  difficulty: 1
  tags:
  - "identificación"
  - "órgano"
# anchor: boe-a-2015-10565-art-9
- id: m02-l03-q0088
  prompt:
    es: "Según el artículo 9.2.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la comunicación a la Secretaría General de Administración Digital de un sistema de identificación distinto de los certificados cualificados debe ir acompañada de:"
  options:
  - id: a
    correct: true
    text:
      es: "una declaración responsable de que se cumplen todos los requisitos establecidos en la normativa vigente."
  - id: b
    text:
      es: "un informe vinculante de la Secretaría de Estado de Seguridad."
  - id: c
    text:
      es: "una auditoría externa que certifique la seguridad del sistema."
  - id: d
    text:
      es: "una garantía económica que cubra los riesgos del sistema."
  explanation:
    es: "El artículo 9.2.c) dice que la comunicación vendrá acompañada de una declaración responsable de que se cumplen los requisitos de la normativa vigente. El informe vinculante de la Secretaría de Estado de Seguridad se emite después, solo si el órgano de seguridad pública acude a la vía jurisdiccional. Una auditoría externa o una garantía económica no están previstas."
  citation: "art. 9.2.c) LPAC"
  difficulty: 1
  tags:
  - "identificación"
  - "requisito"
# anchor: boe-a-2015-10565-art-9
- id: m02-l03-q0089
  prompt:
    es: "De acuerdo con el artículo 9.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las Administraciones Públicas deben garantizar que la utilización de uno de los sistemas basados en certificados cualificados sea posible:"
  options:
  - id: a
    text:
      es: "solo en los procedimientos iniciados a solicitud del interesado."
  - id: b
    text:
      es: "para todo procedimiento, salvo cuando se admita en él otro sistema que la Administración considere válido."
  - id: c
    text:
      es: "solo cuando el interesado no disponga de un sistema distinto que la Administración considere válido."
  - id: d
    correct: true
    text:
      es: "para todo procedimiento, aun cuando se admita en él alguno de los sistemas del resto."
  explanation:
    es: "El artículo 9.2 obliga a que los sistemas con certificados cualificados (letras a y b) puedan usarse en todo procedimiento aunque se admita también un sistema de la letra c). Por eso no vale limitarlo a los procedimientos de parte, ni exceptuar los casos en que se admita otro sistema, ni condicionarlo a que el interesado carezca de uno distinto."
  citation: "art. 9.2 LPAC"
  difficulty: 2
  tags:
  - "identificación"
  - "garantía"
# anchor: boe-a-2015-10565-art-10
- id: m02-l03-q0090
  prompt:
    es: "Conforme al artículo 10.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los interesados podrán firmar a través de cualquier medio que permita acreditar:"
  options:
  - id: a
    text:
      es: "la identidad del firmante mediante certificado cualificado y la fecha cierta del documento."
  - id: b
    text:
      es: "la autoría del documento y su conservación durante un mínimo de cinco años."
  - id: c
    correct: true
    text:
      es: "la autenticidad de la expresión de su voluntad y consentimiento, así como la integridad e inalterabilidad del documento."
  - id: d
    text:
      es: "únicamente la identidad del firmante y su capacidad de obrar."
  explanation:
    es: "El artículo 10.1 admite cualquier medio que acredite la autenticidad de la voluntad y el consentimiento y la integridad e inalterabilidad del documento. No se exige certificado cualificado ni fecha cierta, ni un plazo de conservación, ni se agota en la identidad y la capacidad de obrar del firmante."
  citation: "art. 10.1 LPAC"
  difficulty: 1
  tags:
  - "firma"
  - "requisito"
# anchor: boe-a-2015-10565-art-10
- id: m02-l03-q0092
  prompt:
    es: "Según el artículo 10.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en qué lista deben estar incluidos los prestadores que expiden los certificados cualificados para los sistemas de firma electrónica válidos?"
  options:
  - id: a
    text:
      es: "En el Registro Electrónico de Apoderamientos de la Administración General del Estado."
  - id: b
    correct: true
    text:
      es: "En la «Lista de confianza de prestadores de servicios de certificación»."
  - id: c
    text:
      es: "En el listado de prestadores acreditados ante la Secretaría de Estado de Seguridad."
  - id: d
    text:
      es: "En la relación de sistemas comunicados a la Secretaría General de Administración Digital."
  explanation:
    es: "El artículo 10.2 exige que los prestadores figuren en la «Lista de confianza de prestadores de servicios de certificación». El Registro Electrónico de Apoderamientos sirve para acreditar la representación, no para prestadores de certificados. La Secretaría de Estado de Seguridad no lleva ese listado, y la relación de sistemas comunicados corresponde a los de la letra c), no a los certificados cualificados."
  citation: "art. 10.2 LPAC"
  difficulty: 2
  tags:
  - "firma"
  - "prestadores"
# anchor: boe-a-2015-10565-art-10
- id: m02-l03-q0093
  prompt:
    es: "El 3 de noviembre de 2025 una Administración comunica a la Secretaría General de Administración Digital que admitirá un sistema de firma propio, con registro previo de usuarios. El 20 de diciembre de 2025 pretende ya aplicarlo. Según el artículo 10.2.c) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿puede hacerlo?"
  options:
  - id: a
    correct: true
    text:
      es: "No, porque el sistema solo tiene eficacia jurídica cuando han pasado dos meses desde la comunicación."
  - id: b
    text:
      es: "Sí, porque basta con que haya pasado un mes desde la comunicación."
  - id: c
    text:
      es: "Sí, porque la eficacia del sistema es inmediata desde que se comunica."
  - id: d
    text:
      es: "No, porque antes necesita la aprobación expresa del Consejo de Ministros."
  explanation:
    es: "Antes de la eficacia jurídica del sistema deben transcurrir dos meses desde la comunicación, y del 3 de noviembre al 20 de diciembre de 2025 no han pasado. No basta un mes, ni la eficacia es inmediata. La ley tampoco exige el acuerdo del Consejo de Ministros para esos sistemas."
  citation: "art. 10.2 LPAC"
  difficulty: 3
  tags:
  - "firma"
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-11
- id: m02-l03-q0094
  prompt:
    es: "De acuerdo con el artículo 11.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, con carácter general, para realizar cualquier actuación prevista en el procedimiento administrativo basta con que los interesados acrediten previamente su identidad:"
  options:
  - id: a
    text:
      es: "mediante firma electrónica cualificada en cada actuación."
  - id: b
    text:
      es: "mediante comparecencia personal ante el órgano que tramita."
  - id: c
    text:
      es: "con el sistema de identificación que el órgano instructor fije expresamente para cada procedimiento."
  - id: d
    correct: true
    text:
      es: "a través de cualquiera de los medios de identificación previstos en la Ley."
  explanation:
    es: "El artículo 11.1 dice que basta acreditar previamente la identidad por cualquiera de los medios de identificación que prevé la Ley. No exige firma cualificada en cada actuación, ni comparecencia personal, ni que el instructor elija un sistema para cada procedimiento."
  citation: "art. 11.1 LPAC"
  difficulty: 2
  tags:
  - "identificación"
