# anchor: boe-a-2021-5032-art-3
- id: m02-l04-q169
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, la voluntad de relacionarse electrónicamente, o de dejar de hacerlo, puede manifestarse en una fase posterior del procedimiento, si bien deberá comunicarse al órgano competente de forma que:"
  options:
  - id: a
    text:
      es: "Se inscriba en el Registro Electrónico General."
  - id: b
    correct: true
    text:
      es: "Quede constancia de la misma."
  - id: c
    text:
      es: "Se publique en el Punto de Acceso General electrónico."
  - id: d
    text:
      es: "Se notifique a la Secretaría General de Administración Digital."
  explanation:
    es: "Aunque la decisión se tome más tarde, hay que comunicarla de modo que quede constancia. Su publicación en el Punto de Acceso General, su inscripción en el registro y su notificación a la Secretaría General no se exigen."
  citation: "art. 3.2 RD 203/2021"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-14
- id: m02-l04-q173
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, el medio elegido por las personas físicas para comunicarse con las Administraciones Públicas podrá ser modificado:"
  options:
  - id: a
    text:
      es: "Una vez al año, comunicándolo a la sede electrónica."
  - id: b
    text:
      es: "Solo al inicio de cada procedimiento administrativo."
  - id: c
    correct: true
    text:
      es: "Por la propia persona en cualquier momento."
  - id: d
    text:
      es: "Por la Administración, si lo exige la tramitación."
  explanation:
    es: "El artículo dice que el medio elegido «podrá ser modificado por aquella en cualquier momento»: la decisión es de la persona y no tiene límite temporal. Limitarla al inicio del procedimiento o a una vez al año añade restricciones que el texto no contiene. Que la modifique la Administración invierte quién decide."
  citation: "art. 14.1 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2021-5032-art-3
- id: m02-l04-q174
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, la comunicación de la persona física no obligada, de que quiere relacionarse electrónicamente con la Administración, produce efectos a partir del quinto día hábil siguiente a aquel en que:"
  options:
  - id: a
    text:
      es: "Se dicte el acto de iniciación del procedimiento."
  - id: b
    text:
      es: "La persona interesada la presente en el registro electrónico general de la Administración competente."
  - id: c
    text:
      es: "Se publique en la sede electrónica de la Administración u organismo actuante."
  - id: d
    correct: true
    text:
      es: "El órgano competente para tramitar el procedimiento haya tenido constancia de ella."
  explanation:
    es: "Los efectos se producen desde el quinto día hábil siguiente a aquel en que el órgano competente para la tramitación tuvo constancia de la comunicación. El día de presentación en el registro, la publicación en la sede y el acto de iniciación no son el punto de partida del plazo en el artículo."
  citation: "art. 3.2 RD 203/2021"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-9
- id: m02-l04-q175
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los sistemas de identificación que las Administraciones consideren válidos, el informe vinculante de la Secretaría de Estado de Seguridad, previo a acudir a la vía jurisdiccional por motivos de seguridad pública, deberá emitirse en el plazo de:"
  options:
  - id: a
    text:
      es: "Un mes desde la comunicación del sistema."
  - id: b
    text:
      es: "Cinco días hábiles desde su solicitud."
  - id: c
    text:
      es: "Dos meses desde su solicitud."
  - id: d
    correct: true
    text:
      es: "Diez días desde su solicitud."
  explanation:
    es: "La Secretaría de Estado de Seguridad emite su informe vinculante en diez días desde su solicitud. Los dos meses son el plazo previo a la eficacia jurídica del sistema, contado desde la comunicación, no el del informe. Cinco días hábiles y un mes no figuran en el apartado."
  citation: "art. 9.2.c) LPAC"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-40
- id: m02-l04-q176
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las Administraciones Públicas podrán identificarse mediante un sello electrónico basado en un certificado electrónico reconocido o cualificado que reúna los requisitos exigidos por:"
  options:
  - id: a
    text:
      es: "La normativa de protección de datos personales."
  - id: b
    text:
      es: "Las normas técnicas de la sede electrónica."
  - id: c
    correct: true
    text:
      es: "La legislación de firma electrónica."
  - id: d
    text:
      es: "El Esquema Nacional de Interoperabilidad."
  explanation:
    es: "El certificado del sello ha de reunir los requisitos de la legislación de firma electrónica. El Esquema Nacional de Interoperabilidad, la protección de datos y las normas técnicas de la sede no se citan para el certificado del sello."
  citation: "art. 40.1 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-38
- id: m02-l04-q017
  prompt:
    es: "De acuerdo con el artículo 38.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la titularidad de la sede electrónica corresponde:"
  options:
  - id: a
    text:
      es: "Exclusivamente a la Administración General del Estado, que la gestiona a través del Punto de Acceso General de cada departamento."
  - id: b
    text:
      es: "A una Administración Pública, sin que puedan ser titulares de una sede los organismos públicos ni las entidades de Derecho Público."
  - id: c
    text:
      es: "Al órgano que gestiona sus servicios, aunque no tenga competencias sobre los procedimientos que se tramitan a través de ella."
  - id: d
    correct: true
    text:
      es: "A una Administración Pública, o bien a uno o varios organismos públicos o entidades de Derecho Público en el ejercicio de sus competencias."
  explanation:
    es: "El artículo 38.1 atribuye la titularidad «a una Administración Pública, o bien a una o varios organismos públicos o entidades de Derecho Público en el ejercicio de sus competencias». No la reserva a la Administración General del Estado. Tampoco excluye a los organismos públicos ni a las entidades de Derecho Público. La titularidad se vincula al ejercicio de las propias competencias, no a la mera gestión."
  citation: "art. 38.1 LRJSP"
  difficulty: 1
  tags:
  - "concepto"
  - "competencia"
# anchor: boe-a-2021-5032-art-9
- id: m02-l04-q020
  prompt:
    es: "Según la normativa estatal de actuación por medios electrónicos, ¿qué actuaciones y trámites se realizan mediante la sede electrónica de una Administración Pública?"
  options:
  - id: a
    text:
      es: "Solo los procedimientos iniciados a solicitud del interesado que requieran su firma electrónica cualificada."
  - id: b
    text:
      es: "Solo los que no requieran la identificación de la Administración ni la identificación o firma de los interesados."
  - id: c
    correct: true
    text:
      es: "Todos los que requieran la identificación de la Administración y, en su caso, la identificación o firma de los interesados."
  - id: d
    text:
      es: "Solo la publicación de la información general de la Administración titular, sin trámites que exijan identificación."
  explanation:
    es: "El artículo 9.1 del Reglamento aprobado por el Real Decreto 203/2021 dice que mediante la sede «se realizarán todas las actuaciones y trámites» que requieran la identificación de la Administración y, en su caso, la identificación o firma de los interesados. No se limita a los procedimientos a solicitud del interesado ni a la firma cualificada. Los trámites que exigen identificación son justamente los suyos. La sola publicación de información es propia del portal."
  citation: "art. 9.1 RD 203/2021"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-6
- id: m02-l04-q021
  prompt:
    es: "De acuerdo con el artículo 6.1 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, en la Administración General del Estado la creación o supresión de portales se lleva a cabo:"
  options:
  - id: a
    text:
      es: "Por real decreto acordado en Consejo de Ministros, a propuesta de la persona titular del ministerio correspondiente."
  - id: b
    text:
      es: "Por resolución de la persona titular de la Subsecretaría del ministerio correspondiente."
  - id: c
    correct: true
    text:
      es: "Por orden de la persona titular del ministerio correspondiente o por resolución de la persona titular del órgano superior."
  - id: d
    text:
      es: "Por orden de la persona titular del ministerio correspondiente, sin que quepa la resolución de un órgano superior."
  explanation:
    es: "El artículo 6.1 dice que, en la Administración General del Estado, la creación o supresión de portales se hará «por orden de la persona titular del ministerio correspondiente o por resolución de la persona titular del órgano superior». No exige real decreto. No la atribuye a la Subsecretaría. La resolución del órgano superior sí está admitida."
  citation: "art. 6.1 RD 203/2021"
  difficulty: 2
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2021-5032-art-6
- id: m02-l04-q023
  prompt:
    es: "Según el artículo 6.1 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, ¿qué requiere la supresión de un portal de internet en el ámbito estatal?"
  options:
  - id: a
    correct: true
    text:
      es: "La previa comunicación a los dos ministerios que el precepto designa."
  - id: b
    text:
      es: "El informe favorable de la Comisión Ministerial de Administración Digital y la comunicación posterior a dos ministerios."
  - id: c
    text:
      es: "La autorización previa del Consejo de Ministros, a propuesta del departamento afectado."
  - id: d
    text:
      es: "El informe previo y favorable de la Secretaría General de Administración Digital."
  explanation:
    es: "El artículo 6.1 dice que «la supresión de portales requerirá la previa comunicación» al Ministerio de Política Territorial y Función Pública y al Ministerio de Asuntos Económicos y Transformación Digital (hoy, en los dos casos, Ministerio para la Transformación Digital y de la Función Pública). El informe favorable de la Comisión Ministerial seguido de comunicación es lo que exige la creación, no la supresión. El precepto no pide autorización del Consejo de Ministros ni informe de la Secretaría General de Administración Digital."
  citation: "art. 6.1 RD 203/2021"
  difficulty: 3
  tags:
  - "requisito"
  - "procedimiento"
# anchor: boe-a-2021-5032-art-10
- id: m02-l04-q024
  prompt:
    es: "¿Qué consideración tiene una sede electrónica asociada que se crea, por razones técnicas y organizativas, a partir de otra sede electrónica?"
  options:
  - id: a
    text:
      es: "Tiene consideración de portal de internet de la sede principal."
  - id: b
    text:
      es: "Tiene consideración de sede electrónica solo a efectos de notificaciones."
  - id: c
    correct: true
    text:
      es: "Tiene consideración de sede electrónica a todos los efectos."
  - id: d
    text:
      es: "Tiene consideración de subsede sin efectos jurídicos propios."
  explanation:
    es: "El artículo 10.1 del Reglamento aprobado por el Real Decreto 203/2021 dice que «la sede electrónica asociada tendrá consideración de sede electrónica a todos los efectos». No es un portal. Su consideración de sede no se limita a las notificaciones, y no carece de efectos jurídicos propios."
  citation: "art. 10.1 RD 203/2021"
  difficulty: 2
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-2018-12699-art-7
- id: m02-l04-q025
  prompt:
    es: "¿Cuál de las siguientes circunstancias permite, con carácter excepcional, exceptuar el cumplimiento de los requisitos de accesibilidad según el Real Decreto 1112/2018, de 7 de septiembre?"
  options:
  - id: a
    text:
      es: "La falta de prioridad o de tiempo de la entidad obligada para adaptar sus contenidos."
  - id: b
    correct: true
    text:
      es: "La carga desproporcionada que el cumplimiento pueda suponer para la entidad obligada."
  - id: c
    text:
      es: "La solicitud expresa de la persona usuaria a la que se dirige el contenido."
  - id: d
    text:
      es: "La autorización previa del Consejo de Ministros para cada sitio web concreto."
  explanation:
    es: "El artículo 7.1 permite exceptuar los requisitos, con carácter excepcional, «en atención a la carga desproporcionada que el cumplimiento de los requisitos de accesibilidad pueda suponer para la entidad obligada». El artículo 7.3 niega expresamente que la falta de prioridad o de tiempo permita apreciar esa excepción. El real decreto no la hace depender de una solicitud de la persona usuaria ni de una autorización del Consejo de Ministros."
  citation: "art. 7.1 RD 1112/2018"
  difficulty: 2
  tags:
  - "excepción"
# anchor: boe-a-2018-12699-art-16
- id: m02-l04-q027
  prompt:
    es: "En la Administración General del Estado, ¿en qué ámbito se designan las Unidades responsables de accesibilidad de los sitios web y aplicaciones móviles?"
  options:
  - id: a
    text:
      es: "En el ámbito de las Secretarías Generales Técnicas de cada Departamento."
  - id: b
    correct: true
    text:
      es: "En el ámbito de las Subsecretarías de cada Departamento."
  - id: c
    text:
      es: "En el ámbito de la Secretaría General de Administración Digital."
  - id: d
    text:
      es: "En el ámbito de las Delegaciones del Gobierno en cada comunidad."
  explanation:
    es: "El artículo 16.1 del Real Decreto 1112/2018 dice que en la Administración General del Estado las Unidades responsables «se designarán en el ámbito de las Subsecretarías de cada Departamento». No en las Secretarías Generales Técnicas, que dependen de la Subsecretaría. Tampoco en la Secretaría General de Administración Digital ni en las Delegaciones del Gobierno."
  citation: "art. 16.1 RD 1112/2018"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2021-5032-art-6
- id: m02-l04-q052
  prompt:
    es: "De acuerdo con el artículo 6.1 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, la resolución de la persona titular de la Presidencia o de la Dirección sirve para crear o suprimir los portales:"
  options:
  - id: a
    text:
      es: "De los departamentos ministeriales que carezcan de un órgano superior propio."
  - id: b
    text:
      es: "De las Delegaciones y Subdelegaciones del Gobierno en las comunidades autónomas."
  - id: c
    text:
      es: "De las sociedades mercantiles estatales y de las fundaciones del sector público."
  - id: d
    correct: true
    text:
      es: "De los organismos públicos y entidades de derecho público vinculados o dependientes."
  explanation:
    es: "El artículo 6.1 reserva la resolución de la persona titular de la Presidencia o de la Dirección para los portales «de sus organismos públicos y entidades de derecho público vinculados o dependientes». En los ministerios, los portales se crean o suprimen por orden de su titular o por resolución del órgano superior, no por una resolución de Presidencia o Dirección. Las Delegaciones del Gobierno son órganos de la Administración General del Estado. Las sociedades mercantiles y las fundaciones no son entidades de derecho público, y el precepto no las nombra."
  citation: "art. 6.1 RD 203/2021"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-2021-5032-art-6
- id: m02-l04-q053
  prompt:
    es: "De acuerdo con el artículo 6.2 del Reglamento aprobado por el Real Decreto 203/2021, de 30 de marzo, la dirección electrónica de un nuevo portal en el ámbito estatal deberá incluir, como nombre de dominio de segundo nivel:"
  options:
  - id: a
    text:
      es: "El dominio «.age.es»."
  - id: b
    text:
      es: "El dominio «.admin.es»."
  - id: c
    correct: true
    text:
      es: "El dominio «.gob.es»."
  - id: d
    text:
      es: "El dominio «.estado.es»."
  explanation:
    es: "El artículo 6.2 dice que el acto de creación identificará la dirección electrónica del portal, «que deberá incluir el nombre de dominio de segundo nivel «.gob.es»». Los dominios «.age.es», «.admin.es» y «.estado.es» no figuran en el precepto."
  citation: "art. 6.2 RD 203/2021"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-38
- id: m02-l04-q054
  prompt:
    es: "De acuerdo con el artículo 38.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, el establecimiento de una sede electrónica conlleva la responsabilidad del titular respecto de:"
  options:
  - id: a
    text:
      es: "La integridad y veracidad de la información publicada en ella, pero no de su actualización periódica."
  - id: b
    correct: true
    text:
      es: "La integridad, veracidad y actualización de la información y los servicios accesibles a través de ella."
  - id: c
    text:
      es: "La veracidad de la información publicada en ella, pero no de los servicios que se presten a través de ella."
  - id: d
    text:
      es: "La disponibilidad continua de la sede y de sus servicios, pero no de la información que publique en ella."
  explanation:
    es: "El artículo 38.2 hace responsable al titular «respecto de la integridad, veracidad y actualización de la información y los servicios a los que pueda accederse a través de la misma». La responsabilidad cubre la actualización y alcanza a los servicios. El precepto no la reduce a la disponibilidad de la sede ni excluye la información."
  citation: "art. 38.2 LRJSP"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2018-12699-art-2
- id: m02-l04-q055
  prompt:
    es: "Señale la respuesta correcta sobre el ámbito de aplicación del Real Decreto 1112/2018, de 7 de septiembre, sobre accesibilidad de los sitios web y aplicaciones para dispositivos móviles del sector público:"
  options:
  - id: a
    text:
      es: "No se aplica a las entidades que integran la Administración Local."
  - id: b
    correct: true
    text:
      es: "Se aplica también a la Administración de Justicia."
  - id: c
    text:
      es: "Se aplica solo a la Administración General del Estado y a sus organismos."
  - id: d
    text:
      es: "No se aplica al sector público institucional."
  explanation:
    es: "El artículo 2.2 dice que lo dispuesto en el real decreto «también será de aplicación a la Administración de Justicia». El artículo 2.1 incluye en el sector público a la Administración General del Estado, las de las comunidades autónomas, las entidades de la Administración Local, el sector público institucional y las asociaciones constituidas por las Administraciones. Por eso no excluye a las entidades locales ni al sector público institucional, y no se limita a la Administración General del Estado."
  citation: "art. 2.2 RD 1112/2018"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2018-12699-art-5
- id: m02-l04-q056
  prompt:
    es: "De acuerdo con el artículo 5.1 del Real Decreto 1112/2018, de 7 de septiembre, los contenidos de los sitios web y aplicaciones móviles de las entidades obligadas deben ser:"
  options:
  - id: a
    text:
      es: "Perceptibles, operables, comprensibles y gratuitos."
  - id: b
    text:
      es: "Visibles, interoperables, legibles y robustos."
  - id: c
    text:
      es: "Perceptibles, interoperables, comprensibles y seguros."
  - id: d
    correct: true
    text:
      es: "Perceptibles, operables, comprensibles y robustos."
  explanation:
    es: "El artículo 5.1 exige contenidos «perceptibles, operables, comprensibles y robustos». Las demás series cambian alguno de los cuatro términos: gratuitos, visibles, interoperables, legibles o seguros no son los que usa el precepto."
  citation: "art. 5.1 RD 1112/2018"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2018-12699-art-15
- id: m02-l04-q057
  prompt:
    es: "De acuerdo con el artículo 15.1 del Real Decreto 1112/2018, de 7 de septiembre, la declaración de accesibilidad será actualizada:"
  options:
  - id: a
    text:
      es: "Como mínimo cada tres años, o cuando lo solicite la Unidad responsable de accesibilidad."
  - id: b
    text:
      es: "Solo cuando se realice una revisión de accesibilidad, sin una periodicidad mínima."
  - id: c
    correct: true
    text:
      es: "Como mínimo una vez al año, o cada vez que se realice una revisión de accesibilidad."
  - id: d
    text:
      es: "Como mínimo cada seis meses, o cada vez que se modifique el sitio web."
  explanation:
    es: "El artículo 15.1 dice que la declaración «será actualizada periódicamente, como mínimo una vez al año, o cada vez que se realice una revisión de accesibilidad». Sí hay periodicidad mínima, y es anual, no de tres años ni de seis meses. El precepto no la vincula a una petición de la Unidad responsable ni a cada modificación del sitio."
  citation: "art. 15.1 RD 1112/2018"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2015-10566-art-39
- id: m02-l04-q095
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, se entiende por portal de internet el punto de acceso electrónico cuya titularidad corresponda a una Administración Pública, organismo público o entidad de Derecho Público que permite el acceso a través de internet a:"
  options:
  - id: a
    correct: true
    text:
      es: "La información publicada y, en su caso, a la sede electrónica correspondiente."
  - id: b
    text:
      es: "Los procedimientos tramitados y, en su caso, al registro electrónico general."
  - id: c
    text:
      es: "Los documentos archivados y, en su caso, a la carpeta ciudadana del interesado."
  - id: d
    text:
      es: "Las notificaciones pendientes y, en su caso, a la dirección electrónica habilitada."
  explanation:
    es: "El portal permite el acceso a la información publicada y, si la hay, a la sede electrónica. Los procedimientos con el registro, las notificaciones con la dirección habilitada y los documentos con la carpeta ciudadana son combinaciones que el artículo no recoge."
  citation: "art. 39 LRJSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-38
- id: m02-l04-q096
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la sede electrónica es aquella dirección electrónica, disponible para los ciudadanos a través de redes de telecomunicaciones, cuya titularidad corresponde a una Administración Pública o a organismos públicos o entidades de Derecho Público en:"
  options:
  - id: a
    correct: true
    text:
      es: "El ejercicio de sus competencias."
  - id: b
    text:
      es: "El ámbito de sus convenios de colaboración."
  - id: c
    text:
      es: "La ejecución de las decisiones del Gobierno."
  - id: d
    text:
      es: "La forma que determine la Administración matriz."
  explanation:
    es: "La titularidad se ejerce en el ejercicio de las competencias del titular. Los convenios, las decisiones del Gobierno y la determinación de la Administración matriz no son el marco que fija la definición."
  citation: "art. 38.1 LRJSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-9
- id: m02-l04-q097
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, mediante la sede electrónica se realizan todas las actuaciones y trámites que requieran la identificación de la Administración Pública y, en su caso:"
  options:
  - id: a
    text:
      es: "La designación de un representante ante el órgano competente."
  - id: b
    correct: true
    text:
      es: "La identificación o firma electrónica de las personas interesadas."
  - id: c
    text:
      es: "La presencia física de la persona interesada en la oficina."
  - id: d
    text:
      es: "El pago de las tasas que se devenguen por el trámite."
  explanation:
    es: "La sede sirve para los trámites que requieran identificar a la Administración y, en su caso, identificar o firmar electrónicamente al interesado. La presencia física, el pago de tasas y la designación de representante no son parte de la definición."
  citation: "art. 9.1 RD 203/2021"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2021-5032-art-10
- id: m02-l04-q098
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, se podrán crear sedes electrónicas asociadas a una sede electrónica atendiendo a razones:"
  options:
  - id: a
    text:
      es: "Presupuestarias y de personal."
  - id: b
    text:
      es: "Territoriales y competenciales."
  - id: c
    correct: true
    text:
      es: "Técnicas y organizativas."
  - id: d
    text:
      es: "Jurídicas y de seguridad."
  explanation:
    es: "Las sedes asociadas se crean por razones técnicas y organizativas. Las razones territoriales, presupuestarias o jurídicas no figuran en el precepto."
  citation: "art. 10.1 RD 203/2021"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2021-5032-art-6
- id: m02-l04-q099
  prompt:
    es: "Según el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, aprobado por el Real Decreto 203/2021, de 30 de marzo, la creación de portales de internet en el ámbito estatal requerirá informe favorable de:"
  options:
  - id: a
    text:
      es: "La Agencia Española de Protección de Datos y su Presidencia."
  - id: b
    correct: true
    text:
      es: "La Comisión Ministerial de Administración Digital respectiva."
  - id: c
    text:
      es: "El Consejo de Ministros, mediante acuerdo expreso del Gobierno."
  - id: d
    text:
      es: "El Consejo de Transparencia y Buen Gobierno del Estado."
