type: quiz
variants:
- id: m01-l03-qa03
  prompt:
    en: According to Alistair Cockburn in The Hexagonal (Ports & Adapters) Architecture, why is the application
      drawn as a hexagon rather than as a stack of layers or as another shape?
  options:
  - id: a
    correct: true
    text:
      en: To give the people doing the drawing room to insert ports and adapters as they need
  - id: b
    text:
      en: Because a well-formed application has exactly six ports, one for each side of the shape
  - id: c
    text:
      en: To stress the left-right asymmetry between the user side and the database side of the application
  - id: d
    text:
      en: To keep the one-dimensional layered picture, with the user interface on top and the database below
  explanation:
    en: Cockburn writes that the hexagon allows the people doing the drawing to have room to insert ports and adapters
      as they need. He rejects the claim that a well-formed application has exactly six ports, because he writes
      that the hexagon highlights a defined number of different ports, two, three or four, with four the most he
      has met. He rejects the claim that the shape stresses the left-right asymmetry, because he writes that the
      primary purpose of the pattern is to focus on the inside-outside asymmetry. He rejects the claim that it keeps
      the layered picture, because he writes that it is meant to get away from the one-dimensional layered picture.
  citation: cockburn-hexagonal-architecture#a195fd4ba8fc05c14272b6c02cb8dd80
