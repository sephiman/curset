# anchor: boe-a-2007-6239-art-14
- id: m02-l01-q080
  prompt:
    es: "En la formación del personal de la Administración General del Estado que presta servicios de atención al ciudadano se atenderá especialmente, según el Real Decreto 366/2007, de 16 de marzo, al conocimiento de:"
  options:
  - id: a
    text:
      es: "Las distintas lenguas oficiales y su uso en los servicios."
  - id: b
    correct: true
    text:
      es: "Las distintas discapacidades y sus consecuencias en el desarrollo de los servicios."
  - id: c
    text:
      es: "Las distintas normas de accesibilidad y su régimen sancionador."
  - id: d
    text:
      es: "Los distintos procedimientos y sus plazos de resolución."
  explanation:
    es: "El artículo 14.2 pone el acento en conocer las distintas discapacidades y sus consecuencias en el desarrollo de los servicios de atención. Las lenguas oficiales, el régimen sancionador y los plazos de resolución no son el contenido que cita."
  citation: "art. 14.2 RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-14
- id: m02-l01-q081
  prompt:
    es: "La formación del personal que presta servicios de atención al ciudadano incluye, según el Real Decreto 366/2007, de 16 de marzo, el uso de medios auxiliares:"
  options:
  - id: a
    correct: true
    text:
      es: "Facilitadores del trato con las personas con discapacidad."
  - id: b
    text:
      es: "Sustitutivos de la atención presencial a estas personas."
  - id: c
    text:
      es: "Obligatorios para toda la plantilla de la Oficina."
  - id: d
    text:
      es: "Homologados por la Secretaría General para la Administración Pública."
  explanation:
    es: "El artículo 14.2 se refiere a medios auxiliares facilitadores del trato e interacción con las personas con discapacidad. No sustituyen la atención presencial, no se declaran obligatorios para toda la plantilla y no se menciona que los homologue la Secretaría General."
  citation: "art. 14.2 RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-7
- id: m02-l01-q082
  prompt:
    es: "¿A qué deben ser adyacentes, siempre que sea posible, los paneles de información gráfica de la señalización interior accesible de las Oficinas de Atención al Ciudadano?"
  options:
  - id: a
    text:
      es: "A las puertas de acceso a la Oficina."
  - id: b
    text:
      es: "Al mostrador de atención al público."
  - id: c
    text:
      es: "A las zonas de espera de la Oficina."
  - id: d
    correct: true
    text:
      es: "A alguna pared o superficie."
  explanation:
    es: "El artículo 7.a) pide paneles adyacentes a alguna pared o superficie, de modo que no queden ocultos por obstáculos. Las puertas de acceso, el mostrador y las zonas de espera no son las referencias que cita."
  citation: "art. 7.a) RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12632-art-2
- id: m02-l01-q083
  prompt:
    es: "¿Cómo se denomina la condición que deben cumplir los entornos, procesos, bienes, productos y servicios para ser comprensibles, utilizables y practicables por todas las personas en condiciones de seguridad y comodidad?"
  options:
  - id: a
    text:
      es: "Los ajustes razonables."
  - id: b
    text:
      es: "El diálogo civil."
  - id: c
    correct: true
    text:
      es: "La accesibilidad universal."
  - id: d
    text:
      es: "La igualdad de oportunidades."
  explanation:
    es: "El artículo 2.k) define así la accesibilidad universal. Los ajustes razonables son modificaciones al caso concreto de una persona, el diálogo civil es la participación de las organizaciones de personas con discapacidad y la igualdad de oportunidades es la ausencia de discriminación."
  citation: "art. 2.k) RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-2
- id: m02-l01-q084
  prompt:
    es: "¿Cómo se denomina la actividad por la que se conciben o proyectan desde el origen entornos, productos y servicios utilizables por todas las personas, sin necesidad de adaptación ni diseño especializado?"
  options:
  - id: a
    correct: true
    text:
      es: "El diseño universal o diseño para todas las personas."
  - id: b
    text:
      es: "Los ajustes razonables."
  - id: c
    text:
      es: "El diálogo civil."
  - id: d
    text:
      es: "La igualdad de oportunidades."
  explanation:
    es: "El artículo 2.l) llama diseño universal o diseño para todas las personas a esa actividad de concepción desde el origen. Los ajustes razonables adaptan el entorno a una persona concreta, el diálogo civil es la participación de las organizaciones y la igualdad de oportunidades es la ausencia de discriminación."
  citation: "art. 2.l) RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-49
- id: m02-l01-q085
  prompt:
    es: "En el precepto constitucional sobre las personas con discapacidad, ¿qué dos finalidades deben garantizar las políticas que impulsan los poderes públicos?"
  options:
  - id: a
    text:
      es: "La plena integración laboral y la protección jurídica."
  - id: b
    correct: true
    text:
      es: "La plena autonomía personal y la inclusión social."
  - id: c
    text:
      es: "La atención sanitaria y la rehabilitación funcional."
  - id: d
    text:
      es: "La igualdad formal y la asistencia económica."
  explanation:
    es: "El artículo 49.2 menciona la plena autonomía personal y la inclusión social. La integración laboral, la rehabilitación o la asistencia económica no son las finalidades que cita; la rehabilitación pertenece a la redacción anterior a la reforma de 2024."
  citation: "art. 49.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-49
- id: m02-l01-q086
  prompt:
    es: "En el precepto constitucional sobre las personas con discapacidad, ¿en relación con qué derechos se les garantiza el ejercicio en condiciones de libertad e igualdad reales y efectivas?"
  options:
  - id: a
    text:
      es: "Los previstos en el título preliminar."
  - id: b
    correct: true
    text:
      es: "Los previstos en el título I."
  - id: c
    text:
      es: "Los previstos en el título II."
  - id: d
    text:
      es: "Los previstos en el título VIII."
  explanation:
    es: "El artículo 49.1 se integra en el título I y habla de «los derechos previstos en este Título». El título preliminar, el II sobre la Corona y el VIII sobre la organización territorial son otros títulos de la Constitución."
  citation: "art. 49.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-12
- id: m02-l01-q089
  prompt:
    es: "En las Oficinas de Atención al Ciudadano de la Administración General del Estado, ¿cuándo se ofrecen los documentos e impresos en formatos alternativos, como tipografías ampliadas o braille?"
  options:
  - id: a
    text:
      es: "De oficio, en todos los impresos de la Oficina."
  - id: b
    text:
      es: "Cuando lo solicite una asociación que la represente."
  - id: c
    text:
      es: "Solo en las Oficinas determinadas por resolución."
  - id: d
    correct: true
    text:
      es: "A requerimiento de la persona con discapacidad."
  explanation:
    es: "El artículo 12.2 los ofrece a requerimiento de la persona con discapacidad. No se imprimen de oficio en todos los impresos, la solicitud de una asociación no sustituye la de la persona y la regla no se limita a las Oficinas determinadas por resolución."
  citation: "art. 12.2 RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-13
- id: m02-l01-q090
  prompt:
    es: "En los impresos destinados a cumplimentación por los ciudadanos de la Administración General del Estado, ¿para qué se reservarán espacios apropiados en tamaño?"
  options:
  - id: a
    text:
      es: "Para añadir los datos de otros interesados."
  - id: b
    text:
      es: "Para anexar la documentación acreditativa."
  - id: c
    text:
      es: "Para consignar las observaciones de la Oficina."
  - id: d
    correct: true
    text:
      es: "Para ser rellenados con comodidad."
  explanation:
    es: "El artículo 13.2 reserva espacios apropiados en tamaño para ser rellenados con comodidad. Añadir datos de otros interesados, anexar documentación y consignar observaciones de la Oficina no son la finalidad que indica."
  citation: "art. 13.2 RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2013-12632-art-4
- id: m02-l01-q091
  prompt:
    es: "Según el Real Decreto Legislativo 1/2013, de 29 de noviembre, las deficiencias físicas, mentales, intelectuales o sensoriales de las personas con discapacidad deben ser:"
  options:
  - id: a
    text:
      es: "De naturaleza temporal o permanente."
  - id: b
    text:
      es: "De naturaleza necesariamente grave."
  - id: c
    correct: true
    text:
      es: "De naturaleza previsiblemente permanente."
  - id: d
    text:
      es: "De naturaleza reconocida por un órgano oficial."
  explanation:
    es: "El artículo 4.1 las califica de previsiblemente permanentes. No basta con que sean temporales, el texto no exige gravedad y el reconocimiento oficial de un grado solo opera en el apartado siguiente."
  citation: "art. 4.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-4
- id: m02-l01-q094
  prompt:
    es: "Según el Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, las deficiencias físicas, mentales, intelectuales o sensoriales, previsiblemente permanentes, de una persona pueden impedir su participación plena y efectiva en la sociedad cuando interactúa con:"
  options:
  - id: a
    text:
      es: "Otras deficiencias de carácter temporal."
  - id: b
    correct: true
    text:
      es: "Diversas barreras."
  - id: c
    text:
      es: "Los apoyos y ayudas técnicas a su alcance."
  - id: d
    text:
      es: "Las limitaciones económicas de su entorno familiar."
  explanation:
    es: "El artículo 4.1 define a las personas con discapacidad por unas deficiencias previsiblemente permanentes que, al interactuar con diversas barreras, pueden impedir su participación plena y efectiva. Otras deficiencias de carácter temporal no son el elemento con el que interactúan: la definición exige que las propias deficiencias sean previsiblemente permanentes. Los apoyos y las ayudas técnicas no figuran como término de esa interacción, que es con barreras. Las limitaciones económicas del entorno familiar tampoco son las barreras que cita la definición."
  citation: "art. 4.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-1
- id: m02-l01-q095
  prompt:
    es: "Según el Real Decreto 366/2007, de 16 de marzo, las Oficinas de Atención al Ciudadano son las dependencias o espacios físicos que la Administración General del Estado dedica al contacto directo con los ciudadanos y sus representantes con carácter:"
  options:
  - id: a
    text:
      es: "Preferente o subsidiario."
  - id: b
    text:
      es: "Prioritario y excepcional."
  - id: c
    correct: true
    text:
      es: "Exclusivo o prioritario."
  - id: d
    text:
      es: "Temporal o itinerante."
  explanation:
    es: "El artículo 1.2.a) define las Oficinas como dependencias o espacios físicos que la Administración dedica exclusiva o prioritariamente al contacto directo con los ciudadanos. Preferente o subsidiario cambia el adverbio y hace subsidiaria una dedicación que la norma pone en primer plano. Prioritario y excepcional contradice la dedicación habitual que supone «exclusiva o prioritariamente». Temporal o itinerante recuerda a las Oficinas con especialidades del artículo 4.3, que son una excepción y no la definición."
  citation: "art. 1.2.a) RD 366/2007"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2007-6239-art-2
- id: m02-l01-q096
  prompt:
    es: "Según el Real Decreto 366/2007, de 16 de marzo, la Administración General del Estado asegura a los ciudadanos con discapacidad la efectividad de sus derechos, entre otros medios, mediante la acción positiva, cuya finalidad es compensar:"
  options:
  - id: a
    text:
      es: "Los costes de adaptación en que incurran las Oficinas de Atención al Ciudadano."
  - id: b
    text:
      es: "Las diferencias de renta frente a los demás ciudadanos que acuden a las Oficinas."
  - id: c
    text:
      es: "Los retrasos de sus procedimientos frente a los de los demás ciudadanos."
  - id: d
    correct: true
    text:
      es: "Las desventajas que pudieran presentar en sus relaciones con la Administración."
  explanation:
    es: "El artículo 2.b) pone la acción positiva al servicio de compensar las desventajas que estos ciudadanos pudieran presentar en sus relaciones con la Administración. Los costes de adaptación de las Oficinas son de la Administración, no de los ciudadanos: la acción positiva compensa lo que ellos padecen. Las diferencias de renta quedan fuera del ámbito que fija el texto, que son las relaciones con la Administración. Los retrasos de sus procedimientos frente a los de los demás tampoco son la desventaja que cita el apartado, que no compara el ritmo de tramitación."
  citation: "art. 2.b) RD 366/2007"
  difficulty: 2
  tags:
  - "concepto"
  - "finalidad"
# anchor: boe-a-2007-6239-art-8
- id: m02-l01-q098
  prompt:
    es: "Según el Real Decreto 366/2007, de 16 de marzo, entre las recomendaciones sobre la configuración de los puestos de atención, los mostradores y puntos de atención no dispondrán de vidrios u otros obstáculos que dificulten la transmisión del sonido y:"
  options:
  - id: a
    text:
      es: "La circulación de las personas usuarias de sillas de ruedas."
  - id: b
    correct: true
    text:
      es: "La comunicación visual entre el usuario y el empleado."
  - id: c
    text:
      es: "La lectura de los paneles de información gráfica."
  - id: d
    text:
      es: "El uso de los sistemas de telefonía de texto."
  explanation:
    es: "El artículo 8.2.c) dice que los mostradores y puntos de atención no tendrán vidrios u otros obstáculos que dificulten la transmisión del sonido y la comunicación visual entre el usuario y el empleado. La circulación de las sillas de ruedas la trata el apartado b), con el espacio libre junto al mostrador. Los paneles de información gráfica pertenecen a la señalización interior del artículo 7. La telefonía de texto es de los puntos con información telefónica, en el apartado e)."
  citation: "art. 8.2.c) RD 366/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6239-art-13
- id: m02-l01-q100
  prompt:
    es: "Hasta el 1 de enero de 2027, el Real Decreto 366/2007, de 16 de marzo, exige que los documentos e impresos estén redactados con un lenguaje simple y directo, sin que se utilicen:"
  options:
  - id: a
    text:
      es: "Tecnicismos jurídicos ni administrativos."
  - id: b
    text:
      es: "Imágenes, pictogramas ni símbolos gráficos."
  - id: c
    text:
      es: "Cifras, fechas ni referencias normativas."
  - id: d
    correct: true
    text:
      es: "Siglas o abreviaturas."
  explanation:
    es: "Hasta el 1 de enero de 2027 el artículo 13.1 pide un lenguaje simple y directo, sin siglas ni abreviaturas. Los tecnicismos, las imágenes o pictogramas y las cifras o referencias normativas no aparecen en la prohibición: el texto la limita a las siglas y abreviaturas. Desde el 2 de enero de 2027 la redacción cambia y remite al Reglamento de las condiciones básicas de accesibilidad cognitiva."
  citation: "art. 13.1 RD 366/2007"
  difficulty: 1
  tags:
  - "requisito"
  - "norma-anterior"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q020
  prompt:
    es: "Según el artículo 4.d) del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, ¿quiénes pueden formular las iniciativas o sugerencias para mejorar la calidad de los servicios?"
  options:
  - id: a
    text:
      es: "Solo los ciudadanos interesados en un procedimiento."
  - id: b
    text:
      es: "Solo las asociaciones de usuarios inscritas."
  - id: c
    correct: true
    text:
      es: "Los ciudadanos o los propios empleados públicos."
  - id: d
    text:
      es: "Solo los empleados públicos del servicio afectado."
  explanation:
    es: "El artículo 4.d) se refiere a las iniciativas o sugerencias «formuladas por los ciudadanos, o por los propios empleados públicos». No exige ser interesado en un procedimiento ni formar parte de una asociación inscrita, y no las reserva a los empleados del servicio afectado."
  citation: "art. 4.d) RD 208/1996"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1996-4997-art-4
- id: m02-l01-q021
  prompt:
    es: "Según el artículo 4.e) del Real Decreto 208/1996, de 9 de febrero, por el que se regulan los servicios de información administrativa y atención al ciudadano, la atención al ciudadano incluye recibir las quejas y reclamaciones por:"
  options:
  - id: a
    correct: true
    text:
      es: "Las tardanzas, desatenciones o cualquier otro tipo de actuación irregular en el funcionamiento de las dependencias."
  - id: b
    text:
      es: "Las resoluciones administrativas desfavorables, para su revisión de oficio por el mismo órgano que las dictó."
  - id: c
    text:
      es: "Los daños causados por el funcionamiento de los servicios públicos, a efectos de su indemnización económica."
  - id: d
    text:
      es: "Las tardanzas en la tramitación de los expedientes, con exclusión de cualquier otro tipo de actuación irregular."
  explanation:
    es: "El artículo 4.e) se refiere a las quejas y reclamaciones «por las tardanzas, desatenciones o por cualquier otro tipo de actuación irregular que observen en el funcionamiento de las dependencias administrativas». No son una vía para revisar resoluciones desfavorables ni para pedir una indemnización por daños, y el artículo no se limita a las tardanzas."
  citation: "art. 4.e) RD 208/1996"
  difficulty: 2
  tags:
  - "concepto"
