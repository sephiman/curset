# anchor: boe-a-2003-23186-art-97
- id: m03-l05-q0118
  prompt:
    es: "De acuerdo con el artículo 97 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las actuaciones y procedimientos de aplicación de los tributos se regulan, supletoriamente, por:"
  options:
  - id: a
    text:
      es: "las normas del Código Civil sobre obligaciones y contratos."
  - id: b
    text:
      es: "las disposiciones de la Ley de Enjuiciamiento Civil sobre actos de comunicación."
  - id: c
    text:
      es: "las instrucciones internas de la Agencia Estatal de Administración Tributaria."
  - id: d
    correct: true
    text:
      es: "las disposiciones generales sobre los procedimientos administrativos."
  explanation:
    es: "El artículo 97.b) llama supletoriamente a las disposiciones generales sobre los procedimientos administrativos. El Código Civil, la Ley de Enjuiciamiento Civil y las instrucciones internas no son la norma supletoria que prevé."
  citation: "art. 97 LGT"
  difficulty: 1
  tags:
  - "normas comunes"
  - "fuentes"
# anchor: boe-a-2003-23186-art-97
- id: m03-l05-q0119
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la regulación de las actuaciones y procedimientos de aplicación de los tributos es CORRECTA, según el artículo 97 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Se regulan por las disposiciones generales sobre procedimientos administrativos y, supletoriamente, por las normas especiales del título III."
  - id: b
    correct: true
    text:
      es: "Se regulan por las normas especiales del título III y su normativa reglamentaria, y supletoriamente por las disposiciones generales sobre procedimientos administrativos."
  - id: c
    text:
      es: "Se regulan exclusivamente por las normas especiales del título III, sin aplicación supletoria de otras normas."
  - id: d
    text:
      es: "Se regulan por las normas especiales del título III y, supletoriamente, por las instrucciones de cada Administración."
  explanation:
    es: "Las normas especiales del título III y su desarrollo reglamentario, junto con las normas procedimentales de otras leyes tributarias, se aplican con preferencia, y las disposiciones generales sobre procedimientos administrativos actúan supletoriamente. Las opciones invierten ese orden, excluyen la supletoriedad o la sitúan en instrucciones internas."
  citation: "art. 97 LGT"
  difficulty: 2
  tags:
  - "normas comunes"
  - "fuentes"
# anchor: boe-a-2003-23186-art-98
- id: m03-l05-q0120
  prompt:
    es: "Según el artículo 98.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las actuaciones y procedimientos tributarios podrán iniciarse de oficio o a instancia del obligado tributario, mediante:"
  options:
  - id: a
    text:
      es: "declaración o solicitud escrita, sin que quepa otro medio de iniciación."
  - id: b
    text:
      es: "autoliquidación, declaración, solicitud o denuncia pública de cualquier ciudadano."
  - id: c
    text:
      es: "comunicación o solicitud presentadas necesariamente por medios telemáticos."
  - id: d
    correct: true
    text:
      es: "autoliquidación, declaración, comunicación, solicitud o cualquier otro medio previsto en la normativa tributaria."
  explanation:
    es: "El artículo 98.1 admite autoliquidación, declaración, comunicación, solicitud o cualquier otro medio que prevea la normativa tributaria. No lo limita a la declaración o la solicitud, no cita la denuncia pública y no impone los medios telemáticos."
  citation: "art. 98.1 LGT"
  difficulty: 2
  tags:
  - "iniciación"
  - "medios"
# anchor: boe-a-2003-23186-art-98
- id: m03-l05-q0121
  prompt:
    es: "Conforme al artículo 98.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, los documentos de iniciación de las actuaciones y procedimientos tributarios deben incluir, en todo caso, el nombre y apellidos o razón social y:"
  options:
  - id: a
    text:
      es: "el domicilio fiscal del obligado y, en su caso, el de la persona que lo represente."
  - id: b
    text:
      es: "la firma manuscrita o electrónica del obligado y el lugar designado para notificaciones."
  - id: c
    correct: true
    text:
      es: "el número de identificación fiscal del obligado y, en su caso, de la persona que lo represente."
  - id: d
    text:
      es: "el número de identificación fiscal del obligado y la acreditación de su capacidad de obrar, en su caso."
  explanation:
    es: "Los documentos de iniciación incluyen el nombre o razón social y el número de identificación fiscal del obligado y, en su caso, de su representante. El domicilio fiscal, la firma y el lugar de notificaciones, o la acreditación de la capacidad de obrar, no son contenido que fije el artículo."
  citation: "art. 98.2 LGT"
  difficulty: 2
  tags:
  - "iniciación"
  - "contenido"
# anchor: boe-a-2003-23186-art-98
- id: m03-l05-q0122
  prompt:
    es: "De acuerdo con el artículo 98.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la Administración tributaria podrá aprobar modelos y sistemas normalizados de autoliquidaciones, declaraciones, comunicaciones y solicitudes para los casos en que se produzca:"
  options:
  - id: a
    text:
      es: "la presentación telemática obligatoria de los documentos tributarios."
  - id: b
    text:
      es: "la comprobación simultánea de varios obligados tributarios del mismo sector."
  - id: c
    text:
      es: "la reiteración de errores materiales en las declaraciones presentadas."
  - id: d
    correct: true
    text:
      es: "la tramitación masiva de las actuaciones y procedimientos tributarios."
  explanation:
    es: "El artículo 98.3 justifica los modelos y sistemas normalizados por la tramitación masiva. La presentación telemática obligatoria es materia del apartado 4, y la comprobación simultánea y la reiteración de errores no son el supuesto de la norma."
  citation: "art. 98.3 LGT"
  difficulty: 1
  tags:
  - "iniciación"
  - "modelos"
# anchor: boe-a-2003-23186-art-98
- id: m03-l05-q0123
  prompt:
    es: "Según el artículo 98.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿quién puede determinar, en el ámbito de competencias del Estado, los supuestos y condiciones en que los obligados deben presentar sus documentos por medios telemáticos?"
  options:
  - id: a
    correct: true
    text:
      es: "El Ministro de Hacienda."
  - id: b
    text:
      es: "El Director General de la Agencia Estatal de Administración Tributaria, mediante resolución publicada."
  - id: c
    text:
      es: "El Consejo de Ministros, mediante real decreto a propuesta de la Agencia Tributaria."
  - id: d
    text:
      es: "El Subsecretario de Hacienda, mediante instrucción dirigida a las delegaciones."
  explanation:
    es: "En el ámbito del Estado el artículo 98.4 atribuye esa facultad al Ministro de Hacienda. No corresponde al Director General de la Agencia, al Consejo de Ministros ni al Subsecretario."
  citation: "art. 98.4 LGT"
  difficulty: 2
  tags:
  - "iniciación"
  - "órgano"
# anchor: boe-a-2003-23186-art-99
- id: m03-l05-q0141
  prompt:
    es: "Conforme al artículo 99.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿qué facilitará en todo momento la Administración a los obligados tributarios en el desarrollo de las actuaciones y procedimientos tributarios?"
  options:
  - id: a
    text:
      es: "La obtención de beneficios fiscales y la reducción de los recargos aplicables."
  - id: b
    text:
      es: "La presentación de recursos y reclamaciones dentro de los plazos legales."
  - id: c
    text:
      es: "El acceso al expediente completo de otros obligados vinculados con el procedimiento."
  - id: d
    correct: true
    text:
      es: "El ejercicio de los derechos y el cumplimiento de sus obligaciones."
  explanation:
    es: "El artículo 99.1 impone facilitar el ejercicio de los derechos y el cumplimiento de las obligaciones. No habla de beneficios fiscales, de recursos en plazo ni de acceso a expedientes ajenos, que quedaría protegido por el carácter reservado de los datos."
  citation: "art. 99.1 LGT"
  difficulty: 1
  tags:
  - "desarrollo"
  - "derechos"
# anchor: boe-a-2003-23186-art-99
- id: m03-l05-q0142
  prompt:
    es: "Según el artículo 99.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede el obligado rehusar presentar de nuevo un documento ya presentado por él mismo y que obra en poder de la Administración tributaria actuante en el procedimiento?"
  options:
  - id: a
    text:
      es: "No, porque debe aportar de nuevo todo documento que el órgano actuante le requiera."
  - id: b
    text:
      es: "Sí, pero solo si lo presentó ante cualquier Administración pública, aunque no sea la actuante."
  - id: c
    correct: true
    text:
      es: "Sí, porque puede rehusar los documentos que ya haya presentado el propio obligado y que estén en poder de la Administración actuante."
  - id: d
    text:
      es: "No, salvo que el documento tuviera más de cuatro años de antigüedad."
  explanation:
    es: "El artículo 99.2 permite rehusar los documentos que no sean exigibles y los que el propio obligado haya presentado antes y estén en poder de la Administración actuante. No hay obligación general de volver a aportarlos, la regla se refiere a la Administración actuante, no a cualquiera, y no depende de la antigüedad."
  citation: "art. 99.2 LGT"
  difficulty: 2
  tags:
  - "desarrollo"
  - "documentos"
# anchor: boe-a-2003-23186-art-99
- id: m03-l05-q0143
  prompt:
    es: "Según el artículo 99.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, aunque el obligado pueda rehusar documentos ya presentados, se podrá en todo caso requerirle:"
  options:
  - id: a
    text:
      es: "la presentación nueva de toda la documentación que ya hubiera aportado."
  - id: b
    text:
      es: "la ratificación de cualquier dato que conste en las bases de datos de la Administración."
  - id: c
    text:
      es: "la ratificación de datos propios, pero no de los de terceros previamente aportados."
  - id: d
    correct: true
    text:
      es: "la ratificación de datos específicos propios o de terceros, previamente aportados."
  explanation:
    es: "El artículo 99.2 permite requerir la ratificación de datos específicos, propios o de terceros, ya aportados. No permite exigir de nuevo toda la documentación ni ratificar cualquier dato de las bases, y no excluye los datos de terceros."
  citation: "art. 99.2 LGT"
  difficulty: 3
  tags:
  - "desarrollo"
  - "ratificación"
# anchor: boe-a-2003-23186-art-99
- id: m03-l05-q0146
  prompt:
    es: "¿En qué trámite se facilitan las copias de los documentos del expediente cuando no hay trámite de audiencia, según el artículo 99.4 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "El de apertura del procedimiento, tras la notificación del inicio."
  - id: b
    correct: true
    text:
      es: "El de alegaciones posterior a la propuesta de resolución."
  - id: c
    text:
      es: "El de resolución, junto con la notificación del acuerdo final."
  - id: d
    text:
      es: "El de prueba, cuando se admita la que proponga el obligado."
  explanation:
    es: "Las copias se entregan en el trámite de audiencia o, si no lo hay, en el de alegaciones posterior a la propuesta de resolución. No se facilitan al abrir el procedimiento, ni con la resolución, ni en un trámite de prueba."
  citation: "art. 99.4 LGT"
  difficulty: 2
  tags:
  - "desarrollo"
  - "copias"
# anchor: boe-a-2003-23186-art-99
- id: m03-l05-q0149
  prompt:
    es: "¿Cuál de los siguientes documentos se define en el artículo 99.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, como aquel a través del cual la Administración notifica al obligado el inicio del procedimiento u otros hechos o circunstancias relativos al mismo o efectúa los requerimientos necesarios?"
  options:
  - id: a
    text:
      es: "Las diligencias de la Administración tributaria."
  - id: b
    text:
      es: "Los informes de la Administración tributaria."
  - id: c
    correct: true
    text:
      es: "Las comunicaciones de la Administración tributaria."
  - id: d
    text:
      es: "Las propuestas de liquidación de la Administración."
  explanation:
    es: "El artículo 99.7 define las comunicaciones como los documentos por los que la Administración notifica el inicio del procedimiento u otros hechos o efectúa requerimientos. Las diligencias hacen constar hechos y manifestaciones, los informes se emiten por mandato legal o a petición de otros órganos y las propuestas de liquidación no son una forma de documentar actuaciones según ese apartado."
  citation: "art. 99.7 LGT"
  difficulty: 1
  tags:
  - "desarrollo"
  - "documentos"
# anchor: boe-a-2003-23186-art-99
- id: m03-l05-q0150
  prompt:
    es: "De acuerdo con el artículo 99.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre las diligencias en los procedimientos de aplicación de los tributos:"
  options:
  - id: a
    correct: true
    text:
      es: "Son documentos públicos que se extienden para hacer constar hechos y manifestaciones, y no pueden contener propuestas de liquidaciones tributarias."
  - id: b
    text:
      es: "Son documentos privados que recogen las alegaciones del obligado y pueden contener propuestas de liquidación."
  - id: c
    text:
      es: "Son los documentos por los que se notifica al obligado el inicio del procedimiento y se le formulan requerimientos."
  - id: d
    text:
      es: "Son informes que la Administración emite de oficio y que pueden contener propuestas de liquidación firmadas por el obligado."
  explanation:
    es: "Las diligencias son documentos públicos que hacen constar hechos y manifestaciones del obligado o de la persona con quien se entienden las actuaciones, y no pueden contener propuestas de liquidación. No son documentos privados, ni son las comunicaciones, ni informes."
  citation: "art. 99.7 LGT"
  difficulty: 2
  tags:
  - "desarrollo"
  - "documentos"
# anchor: boe-a-2003-23186-art-99
- id: m03-l05-q0151
  prompt:
    es: "Según el artículo 99.7 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las diligencias, que son documentos públicos para hacer constar hechos y manifestaciones, no podrán contener:"
  options:
  - id: a
    text:
      es: "manifestaciones de la persona con la que se entiendan las actuaciones."
  - id: b
    text:
      es: "la constancia de los hechos relevantes para el procedimiento."
  - id: c
    correct: true
    text:
      es: "propuestas de liquidaciones tributarias."
  - id: d
    text:
      es: "las manifestaciones del propio obligado tributario sobre los hechos."
  explanation:
    es: "El artículo 99.7 excluye de las diligencias las propuestas de liquidaciones tributarias. Pueden recoger hechos y manifestaciones del obligado o de la persona con la que se entiendan las actuaciones, que es su finalidad."
  citation: "art. 99.7 LGT"
  difficulty: 1
  tags:
  - "desarrollo"
  - "documentos"
# anchor: boe-a-2003-23186-art-99
- id: m03-l05-q0153
  prompt:
    es: "De acuerdo con el artículo 99.8 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre cuándo se podrá prescindir del trámite de audiencia previo a la propuesta de resolución:"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando se suscriban actas con acuerdo o cuando las normas del procedimiento prevean un trámite de alegaciones posterior a la propuesta."
  - id: b
    text:
      es: "Cuando el obligado renuncie por escrito a la audiencia o cuando el procedimiento se inicie a instancia de parte."
  - id: c
    text:
      es: "Cuando hayan transcurrido seis meses desde el inicio del procedimiento sin que el obligado comparezca."
  - id: d
    text:
      es: "Cuando se suscriban actas con acuerdo o cuando el obligado reconozca la deuda en el trámite de alegaciones."
  explanation:
    es: "Se puede prescindir de la audiencia cuando se suscriban actas con acuerdo o cuando las normas del procedimiento prevean alegaciones posteriores a la propuesta. La renuncia del obligado, el inicio a instancia de parte, el transcurso de seis meses y el reconocimiento de deuda no son los supuestos de la ley."
  citation: "art. 99.8 LGT"
  difficulty: 2
  tags:
  - "desarrollo"
  - "audiencia"
# anchor: boe-a-2003-23186-art-99
- id: m03-l05-q0154
  prompt:
    es: "Conforme al artículo 99.9 de la Ley 58/2003, de 17 de diciembre, General Tributaria, señale la respuesta CORRECTA sobre la utilización de sistemas digitales de videoconferencia en las actuaciones tributarias:"
  options:
  - id: a
    correct: true
    text:
      es: "Su utilización la determina la Administración Tributaria y requiere la conformidad del obligado en relación con su uso y con la fecha y hora de su desarrollo."
  - id: b
    text:
      es: "Su utilización la determina el obligado tributario y requiere la conformidad de la Administración en cada actuación."
  - id: c
    text:
      es: "Su utilización la determina la Administración Tributaria y no requiere la conformidad del obligado tributario."
  - id: d
    text:
      es: "Su utilización requiere autorización judicial previa cuando las actuaciones se refieran a obligados no residentes."
  explanation:
    es: "La videoconferencia se utiliza cuando lo determine la Administración, con la conformidad del obligado sobre su uso y sobre la fecha y hora. No decide el obligado, no basta la decisión unilateral de la Administración y no hay autorización judicial."
  citation: "art. 99.9 LGT"
  difficulty: 2
  tags:
  - "desarrollo"
  - "videoconferencia"
# anchor: boe-a-2003-23186-art-99
- id: m03-l05-q0155
  prompt:
    es: "Según el artículo 99.9 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las actuaciones de la Administración y de los obligados podrán realizarse a través de sistemas digitales que permitan la comunicación bidireccional y simultánea de imagen y sonido, mediante:"
  options:
  - id: a
    correct: true
    text:
      es: "la videoconferencia u otro sistema similar."
  - id: b
    text:
      es: "el correo electrónico certificado con acuse de recibo."
  - id: c
    text:
      es: "la comunicación telefónica con grabación de la conversación."
  - id: d
    text:
      es: "la mensajería instantánea con confirmación de lectura."
  explanation:
    es: "El artículo 99.9 se refiere a la videoconferencia u otro sistema similar que permita comunicación bidireccional y simultánea de imagen y sonido. El correo certificado, la llamada telefónica grabada y la mensajería no ofrecen esa interacción visual."
  citation: "art. 99.9 LGT"
  difficulty: 1
  tags:
  - "desarrollo"
  - "videoconferencia"
# anchor: boe-a-2007-15984-art-91
- id: m03-l05-q0156
  prompt:
    es: "Conforme al artículo 91.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿qué límite tiene la ampliación de los plazos para cumplir trámites que puede conceder, a petición del obligado, el órgano que tramita el procedimiento?"
  options:
  - id: a
    text:
      es: "Un tercio de dichos plazos."
  - id: b
    correct: true
    text:
      es: "La mitad de dichos plazos."
  - id: c
    text:
      es: "La totalidad de dichos plazos."
  - id: d
    text:
      es: "Un máximo de tres meses."
  explanation:
    es: "La ampliación no puede exceder de la mitad del plazo (art. 91.1). Un tercio, la totalidad o un tope absoluto de tres meses no son el límite."
  citation: "art. 91.1 RGAT"
  difficulty: 1
  tags:
  - "ampliación de plazos"
  - "límite"
# anchor: boe-a-2007-15984-art-91
- id: m03-l05-q0157
  prompt:
    es: "Un requerimiento concede a Óscar Palacios 10 días para aportar documentación. Óscar solicita en plazo la ampliación y se cumplen los demás requisitos. Según el artículo 91.1 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿cuál es la ampliación máxima que puede concederse?"
  options:
  - id: a
    correct: true
    text:
      es: "La ampliación máxima es de 5 días."
  - id: b
    text:
      es: "La ampliación máxima es de 10 días."
  - id: c
    text:
      es: "La ampliación máxima es de 3 días."
  - id: d
    text:
      es: "La ampliación máxima es de 7 días."
  explanation:
    es: "La ampliación no puede exceder de la mitad del plazo inicial: la mitad de 10 días son 5 días. Duplicar el plazo, aplicar tres días, que es el tiempo de solicitud del apartado 3, o siete días no responden a la regla."
  citation: "art. 91.1 RGAT"
  difficulty: 1
  tags:
  - "ampliación de plazos"
  - "cómputo"
# anchor: boe-a-2007-15984-art-91
- id: m03-l05-q0158
  prompt:
    es: "Conforme al artículo 91.2 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria, ¿puede concederse una segunda ampliación de un plazo de trámite si el obligado alega nuevas circunstancias justificadas tras haber obtenido ya una ampliación?"
  options:
  - id: a
    text:
      es: "Sí, porque se concede una segunda ampliación si se justifican nuevas circunstancias."
  - id: b
    correct: true
    text:
      es: "No, porque no se concede más de una ampliación del plazo respectivo."
  - id: c
    text:
      es: "Sí, hasta duplicar el plazo inicialmente fijado entre ambas ampliaciones."
  - id: d
    text:
      es: "Sí, siempre que no se perjudiquen derechos de terceros."
  explanation:
    es: "El artículo 91.2 prohíbe conceder más de una ampliación del plazo respectivo. Nuevas circunstancias, un tope total o la ausencia de perjuicio a terceros, que es un requisito del apartado 3 y no una excepción, no la permiten."
  citation: "art. 91.2 RGAT"
  difficulty: 2
  tags:
  - "ampliación de plazos"
  - "límite"
# anchor: boe-a-2007-15984-art-91
- id: m03-l05-q0159
  prompt:
    es: "¿Con qué antelación a la finalización del plazo debe solicitarse la ampliación de un plazo de trámite para que pueda otorgarse, según el artículo 91.3 del Real Decreto 1065/2007, de 27 de julio, por el que se aprueba el Reglamento General de las actuaciones y los procedimientos de gestión e inspección tributaria?"
  options:
  - id: a
    text:
      es: "Los diez días previos a la finalización del plazo que se pretende ampliar."
