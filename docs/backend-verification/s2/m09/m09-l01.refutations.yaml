m09-l01-q04:
  key:
    anchor: protobuf-proto-best-practices#reserve-tag-numbers
    sentence: When you delete a field that’s no longer used, reserve its tag number so that no one accidentally re-uses it in the future.
  wrong:
  - option: Give it to the next field you add, so that tag numbers stay compact
    anchor: protobuf-proto-best-practices#reuse-number
    sentence: Never re-use a tag number.
  - option: Keep it for a field of another type, because only the number is encoded
    anchor: protobuf-proto-best-practices#change-type
    sentence: Almost never change the type of a field; it’ll mess up deserialization, same as re-using a tag number.
  - option: Leave it undeclared, because a deleted number cannot be used by mistake
    anchor: protobuf-proto-best-practices#reserve-tag-numbers
    sentence: reserve its tag number so that no one accidentally re-uses it in the future.
m09-l01-q05:
  key:
    anchor: ietf-httpapi-idempotency-key#content
    sentence: If there is an attempt to reuse an idempotency key with a different request payload, the resource SHOULD reply with an HTTP 422 status code
  wrong:
  - option: '`400`'
    anchor: ietf-httpapi-idempotency-key#content
    sentence: If the Idempotency-Key request header is missing for a documented idempotent operation requiring this header, the resource SHOULD reply with an HTTP 400 status code
  - option: '`409`'
    anchor: ietf-httpapi-idempotency-key#content
    sentence: If the request is retried, while the original request is still being processed, the resource SHOULD reply with an HTTP 409 status code
  - option: '`429`'
    anchor: ietf-httpapi-idempotency-key#content
    sentence: For other 4xx/5xx errors, such as 401, 403, 500, 502, 503, 504, 429, or any other HTTP error code that is not listed here, the client SHOULD act appropriately by following the resource's documentation.
