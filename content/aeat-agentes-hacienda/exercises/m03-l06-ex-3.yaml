# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0046
  prompt:
    es: "Según el artículo 101.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el porcentaje de retención e ingreso a cuenta sobre los rendimientos del trabajo derivados de relaciones laborales o estatutarias y de pensiones y haberes pasivos se determina:"
  options:
  - id: a
    correct: true
    text:
      es: "con arreglo al procedimiento que reglamentariamente se establezca."
  - id: b
    text:
      es: "por resolución de la Administración tributaria para cada perceptor."
  - id: c
    text:
      es: "aplicando el 15 por ciento que fija directamente la ley a toda retribución."
  - id: d
    text:
      es: "mediante acuerdo entre el pagador y el perceptor de los rendimientos."
  explanation:
    es: "Para el trabajo derivado de relaciones laborales o estatutarias y para las pensiones, el porcentaje se determina con arreglo al procedimiento que reglamentariamente se establezca (artículo 101.1). El 15 por ciento no es un tipo general, sino el de los atrasos. Un pacto entre pagador y perceptor no puede fijarlo, porque lo fija el procedimiento reglamentario. Tampoco hay una resolución de la Administración para cada perceptor."
  citation: "art. 101.1 LIRPF"
  difficulty: 1
  tags:
  - "porcentajes"
  - "retención"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0047
  prompt:
    es: "De acuerdo con el artículo 101.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la retención de los administradores baja del 35 al 19 por ciento cuando los rendimientos proceden de entidades con un importe neto de la cifra de negocios inferior a:"
  options:
  - id: a
    correct: true
    text:
      es: "100.000 euros, en los términos que reglamentariamente se establezcan."
  - id: b
    text:
      es: "10.000 euros, en los términos que reglamentariamente se establezcan."
  - id: c
    text:
      es: "6 millones de euros, en los términos que reglamentariamente se establezcan."
  - id: d
    text:
      es: "150.000 euros, en los términos que reglamentariamente se establezcan."
  explanation:
    es: "La rebaja al 19 por ciento para administradores se aplica si la entidad tiene un importe neto de la cifra de negocios inferior a 100.000 euros, en los términos que fije el reglamento (artículo 101.2). Los 150.000 euros y los 10.000 euros no son el umbral de la ley. Los 6 millones de euros son el límite que la Ley del Impuesto sobre Sociedades usa en el pago fraccionado, otra figura que no tiene relación con este apartado."
  citation: "art. 101.2 LIRPF"
  difficulty: 2
  tags:
  - "porcentajes"
  - "administradores"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0050
  prompt:
    es: "De acuerdo con el artículo 101 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, sin considerar la reducción del 60 por ciento para Ceuta y Melilla, ¿cuál de estas rentas se retiene con el mismo porcentaje que los rendimientos del capital mobiliario?"
  options:
  - id: a
    text:
      es: "Los rendimientos procedentes de la cesión del derecho a la explotación del derecho de imagen."
  - id: b
    text:
      es: "Los rendimientos de actividades profesionales establecidos en vía reglamentaria."
  - id: c
    text:
      es: "Los rendimientos procedentes de actividades forestales."
  - id: d
    correct: true
    text:
      es: "Las ganancias patrimoniales derivadas de la transmisión de derechos de suscripción."
  explanation:
    es: "Los rendimientos del capital mobiliario se retienen con carácter general al 19 por ciento (artículo 101.4), igual que las ganancias patrimoniales de la transmisión de derechos de suscripción (artículo 101.6). Las actividades forestales tributan al 2 por ciento, la cesión del derecho de imagen al 24 y las actividades profesionales establecidas en vía reglamentaria al 15."
  citation: "art. 101.4 LIRPF"
  difficulty: 2
  tags:
  - "porcentajes"
  - "retención"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0051
  prompt:
    es: "De acuerdo con el artículo 101.5.a) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el porcentaje de retención sobre los rendimientos de actividades profesionales establecidos en vía reglamentaria es del 15 por ciento; no obstante, se aplicará el 7 por ciento sobre:"
  options:
  - id: a
    correct: true
    text:
      es: "los rendimientos de actividades profesionales que se establezcan reglamentariamente."
  - id: b
    text:
      es: "los rendimientos de actividades profesionales, sin necesidad de previsión reglamentaria alguna."
  - id: c
    text:
      es: "los rendimientos de actividades ganaderas de engorde de porcino y de avicultura."
  - id: d
    text:
      es: "los rendimientos de actividades profesionales cuyo importe anual no supere 15.000 euros."
  explanation:
    es: "El 7 por ciento se aplica a los rendimientos de actividades profesionales que se establezcan reglamentariamente (artículo 101.5.a). El apartado no fija un umbral legal de 15.000 euros ni permite aplicarlo sin esa previsión del reglamento. Las actividades ganaderas de engorde de porcino y de avicultura tienen su propio tipo, del 1 por ciento, en la letra b)."
  citation: "art. 101.5.a) LIRPF"
  difficulty: 2
  tags:
  - "porcentajes"
  - "actividades profesionales"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0052
  prompt:
    es: "Según el artículo 101.5.b) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿a cuál de las siguientes actividades se aplica un porcentaje de retención del 1 por ciento, inferior al general del 2 por ciento de los rendimientos agrícolas o ganaderos?"
  options:
  - id: a
    correct: true
    text:
      es: "A las actividades ganaderas de engorde de porcino y avicultura."
  - id: b
    text:
      es: "A las actividades agrícolas de cultivo de cereales."
  - id: c
    text:
      es: "A las actividades ganaderas de vacuno de leche."
  - id: d
    text:
      es: "A las actividades forestales de aprovechamiento maderero."
  explanation:
    es: "Los rendimientos agrícolas o ganaderos se retienen al 2 por ciento, salvo las actividades ganaderas de engorde de porcino y avicultura, que lo hacen al 1 por ciento (artículo 101.5.b). El vacuno de leche y el cultivo de cereales quedan dentro de la regla general del 2 por ciento. Las actividades forestales tienen su propia letra, la c), también al 2 por ciento."
  citation: "art. 101.5.b) LIRPF"
  difficulty: 2
  tags:
  - "porcentajes"
  - "actividades agrícolas"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0054
  prompt:
    es: "De acuerdo con el artículo 101.6 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el porcentaje de pagos a cuenta sobre las ganancias patrimoniales derivadas de las transmisiones o reembolsos de acciones y participaciones de instituciones de inversión colectiva será del:"
  options:
  - id: a
    text:
      es: "24 por ciento, igual que el de los rendimientos de la cesión del derecho a la explotación del derecho de imagen."
  - id: b
    text:
      es: "15 por ciento, igual que el de los rendimientos del capital mobiliario procedentes de la propiedad intelectual."
  - id: c
    correct: true
    text:
      es: "19 por ciento, igual que el de las ganancias derivadas de la transmisión de derechos de suscripción."
  - id: d
    text:
      es: "7 por ciento, igual que el de los anticipos a cuenta derivados de la cesión de derechos de autor."
  explanation:
    es: "Las ganancias patrimoniales por transmisiones o reembolsos de acciones y participaciones de instituciones de inversión colectiva soportan el 19 por ciento (artículo 101.6), el mismo que las derivadas de la transmisión de derechos de suscripción. El 15 por ciento es el tipo del capital mobiliario procedente de la propiedad intelectual cuando el contribuyente no es el autor. El 24 por ciento corresponde a la cesión del derecho de imagen, y el 7 por ciento a los anticipos de derechos de autor."
  citation: "art. 101.6 LIRPF"
  difficulty: 2
  tags:
  - "porcentajes"
  - "ganancias patrimoniales"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0055
  prompt:
    es: "¿Cuál de los siguientes rendimientos tiene un porcentaje de retención e ingreso a cuenta del 19 por ciento, según el artículo 101.9 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Los procedentes de la propiedad intelectual, cualquiera que sea su calificación."
  - id: b
    correct: true
    text:
      es: "Los procedentes del arrendamiento de bienes muebles, negocios o minas."
  - id: c
    text:
      es: "Los procedentes de actividades agrícolas o ganaderas."
  - id: d
    text:
      es: "Los procedentes de la cesión del derecho a la explotación del derecho de imagen."
  explanation:
    es: "Los rendimientos de la propiedad industrial, de la asistencia técnica y del arrendamiento de bienes muebles, negocios o minas se retienen al 19 por ciento (artículo 101.9). La propiedad intelectual lleva su propio tipo, el 15 por ciento, con el 7 por ciento en los casos del apartado. La cesión del derecho de imagen se retiene al 24 por ciento y las actividades agrícolas o ganaderas al 2 por ciento, salvo el engorde de porcino y la avicultura."
  citation: "art. 101.9 LIRPF"
  difficulty: 2
  tags:
  - "porcentajes"
  - "retención"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0057
  prompt:
    es: "De acuerdo con el artículo 101.10 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el porcentaje de retención e ingreso a cuenta sobre los rendimientos procedentes de la cesión del derecho a la explotación del derecho de imagen, cualquiera que sea su calificación, será el:"
  options:
  - id: a
    text:
      es: "19 por ciento, salvo el ingreso a cuenta del artículo 92.8, que es del 24 por ciento."
  - id: b
    text:
      es: "15 por ciento, salvo el ingreso a cuenta del artículo 92.8, que es del 7 por ciento."
  - id: c
    correct: true
    text:
      es: "24 por ciento, salvo el ingreso a cuenta del artículo 92.8, que es del 19 por ciento."
  - id: d
    text:
      es: "35 por ciento, salvo el ingreso a cuenta del artículo 92.8, que es del 19 por ciento."
  explanation:
    es: "La cesión del derecho a la explotación del derecho de imagen se retiene al 24 por ciento, y el ingreso a cuenta del artículo 92.8 se fija en el 19 por ciento (artículo 101.10). Invertir los porcentajes atribuye a la retención el tipo del ingreso a cuenta. El 35 por ciento es el de los administradores y miembros de consejos de administración, y el 15 por ciento y el 7 por ciento son los de otros rendimientos, como los cursos o los anticipos de derechos de autor."
  citation: "art. 101.10 LIRPF"
  difficulty: 2
  tags:
  - "porcentajes"
  - "derecho de imagen"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0058
  prompt:
    es: "De acuerdo con el artículo 101.11 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el porcentaje de los pagos fraccionados será del 20 por ciento cuando se trate de actividades que determinen el rendimiento neto por el método de:"
  options:
  - id: a
    text:
      es: "cualquier método, cuando se trate de actividades agrícolas, ganaderas, forestales o pesqueras."
  - id: b
    text:
      es: "estimación objetiva, en cualquiera de sus modalidades."
  - id: c
    correct: true
    text:
      es: "estimación directa, en cualquiera de sus modalidades."
  - id: d
    text:
      es: "estimación directa simplificada, pero no en la modalidad normal."
  explanation:
    es: "El 20 por ciento se aplica a las actividades en estimación directa, en cualquiera de sus modalidades (artículo 101.11.a). La estimación objetiva tiene porcentajes propios, del 4, 3 y 2 por ciento. Excluir la modalidad normal contradice la expresión «cualquiera de sus modalidades». Las actividades agrícolas, ganaderas, forestales o pesqueras pagan el 2 por ciento sea cual sea el método."
  citation: "art. 101.11 LIRPF"
  difficulty: 1
  tags:
  - "porcentajes"
  - "pagos fraccionados"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0060
  prompt:
    es: "De acuerdo con el artículo 101.11 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué porcentaje de pago fraccionado se aplica a las actividades que determinan su rendimiento neto por estimación objetiva y tienen solo una persona asalariada?"
  options:
  - id: a
    text:
      es: "El 20 por ciento, propio de la estimación directa."
  - id: b
    text:
      es: "El 2 por ciento, propio de quienes no disponen de personal asalariado."
  - id: c
    correct: true
    text:
      es: "El 3 por ciento, en lugar del 4 por ciento general de la estimación objetiva."
  - id: d
    text:
      es: "El 4 por ciento, que es el porcentaje general de la estimación objetiva sin distinguir personal asalariado."
  explanation:
    es: "En estimación objetiva el porcentaje general es el 4 por ciento, que baja al 3 por ciento para las actividades con solo una persona asalariada y al 2 por ciento cuando no hay personal asalariado (artículo 101.11.b). El 4 por ciento ignora la rebaja por tener una sola persona asalariada. El 20 por ciento es el de la estimación directa. El 2 por ciento corresponde a quien no tiene personal asalariado, no a quien tiene uno."
  citation: "art. 101.11 LIRPF"
  difficulty: 3
  tags:
  - "porcentajes"
  - "pagos fraccionados"
  - "estimación objetiva"
# anchor: boe-a-2007-6820-art-108
- id: m03-l06-q0061
  prompt:
    es: "Según el artículo 108.1 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, el obligado a retener presenta, en los primeros veinte días naturales de abril, julio, octubre y enero, declaración de las retenciones e ingresos a cuenta correspondientes a:"
  options:
  - id: a
    correct: true
    text:
      es: "el trimestre natural inmediato anterior."
  - id: b
    text:
      es: "el semestre natural inmediato anterior al de la declaración."
  - id: c
    text:
      es: "el mes natural inmediato anterior."
  - id: d
    text:
      es: "el año natural inmediato anterior."
  explanation:
    es: "En los meses de abril, julio, octubre y enero se declaran e ingresan las retenciones y los ingresos a cuenta del trimestre natural inmediato anterior (artículo 108.1). La declaración por el mes inmediato anterior es el régimen especial de los retenedores en los que concurren las circunstancias de los números 1.º y 2.º del apartado 3 del artículo 71 del Reglamento del Impuesto sobre el Valor Añadido. Los períodos de seis meses y de un año no son los que fija el apartado."
  citation: "art. 108.1 RIRPF"
  difficulty: 1
  tags:
  - "plazo"
  - "retenciones"
# anchor: boe-a-2007-6820-art-108
- id: m03-l06-q0062
  prompt:
    es: "De acuerdo con el artículo 108.1 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, con carácter general el obligado a retener presenta la declaración de las retenciones del trimestre natural inmediato anterior en los primeros veinte días naturales de los meses de:"
  options:
  - id: a
    correct: true
    text:
      es: "abril, julio, octubre y enero."
  - id: b
    text:
      es: "marzo, junio, septiembre y diciembre."
  - id: c
    text:
      es: "enero, abril, julio y noviembre."
  - id: d
    text:
      es: "abril, octubre y diciembre."
  explanation:
    es: "El plazo general del artículo 108.1 son los primeros veinte días naturales de abril, julio, octubre y enero, es decir, el mes siguiente a cada trimestre. Marzo, junio, septiembre y diciembre son los últimos meses de cada trimestre, no los de presentación. Abril, octubre y diciembre son los meses del pago fraccionado del Impuesto sobre Sociedades del artículo 40.1 de su ley. Noviembre no figura en ningún plazo del apartado."
  citation: "art. 108.1 RIRPF"
  difficulty: 1
  tags:
  - "plazo"
  - "retenciones"
# anchor: boe-a-2007-6820-art-108
- id: m03-l06-q0063
  prompt:
    es: "De acuerdo con el artículo 108.1 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, los retenedores en los que concurran las circunstancias de los números 1.º y 2.º del artículo 71.3 del Reglamento del Impuesto sobre el Valor Añadido declaran e ingresan lo retenido:"
  options:
  - id: a
    text:
      es: "en los veinte primeros días naturales de cada semestre, por el semestre inmediato anterior."
  - id: b
    text:
      es: "en los veinte primeros días naturales de abril, julio, octubre y enero, por el trimestre anterior."
  - id: c
    text:
      es: "en los treinta primeros días naturales de cada mes, por el mes inmediato anterior."
  - id: d
    correct: true
    text:
      es: "en los veinte primeros días naturales de cada mes, por el mes inmediato anterior."
  explanation:
    es: "Los retenedores en los que concurren las circunstancias de los números 1.º y 2.º del apartado 3 del artículo 71 del Reglamento del Impuesto sobre el Valor Añadido declaran e ingresan en los veinte primeros días naturales de cada mes, por el mes inmediato anterior (artículo 108.1). El plazo trimestral es el general, que no se aplica a ellos. Los treinta días no son el plazo del apartado para el mes. El semestre no existe como período de declaración en este artículo."
  citation: "art. 108.1 RIRPF"
  difficulty: 2
  tags:
  - "plazo"
  - "retenciones"
# anchor: boe-a-2007-6820-art-109
- id: m03-l06-q0064
  prompt:
    es: "De acuerdo con el artículo 109.2 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, los contribuyentes que desarrollen actividades profesionales no estarán obligados a efectuar pago fraccionado en relación con ellas si, en el año natural anterior:"
  options:
  - id: a
    text:
      es: "al menos el 50 por ciento de los ingresos de la actividad fueron objeto de retención o ingreso a cuenta."
  - id: b
    correct: true
    text:
      es: "al menos el 70 por ciento de los ingresos de la actividad fueron objeto de retención o ingreso a cuenta."
  - id: c
    text:
      es: "la totalidad de los ingresos de la actividad fue objeto de retención o ingreso a cuenta."
  - id: d
    text:
      es: "al menos el 90 por ciento de los ingresos de la actividad fueron objeto de retención o ingreso a cuenta."
  explanation:
    es: "La exclusión del pago fraccionado para actividades profesionales exige que en el año natural anterior al menos el 70 por ciento de los ingresos de la actividad hubiera sufrido retención o ingreso a cuenta (artículo 109.2). Los umbrales del 50 por ciento y del 90 por ciento no son los de la norma, y exigir la totalidad de los ingresos añade un requisito que el apartado no impone."
  citation: "art. 109.2 RIRPF"
  difficulty: 2
  tags:
  - "pagos fraccionados"
  - "excepción"
# anchor: boe-a-2007-6820-art-109
- id: m03-l06-q0065
  prompt:
    es: "Doña Elisa Paz ejerce una actividad profesional. En 2025 obtuvo ingresos de la actividad por 40.000 euros, de los cuales 27.000 euros fueron objeto de retención. Conforme al artículo 109.2 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, ¿está obligada a efectuar pago fraccionado por esa actividad en 2026?"
  options:
  - id: a
    text:
      es: "No, porque la exclusión exige que se hayan retenido todos los ingresos de la actividad."
  - id: b
    text:
      es: "Sí, porque los profesionales siempre están obligados al pago fraccionado, sea cual sea la retención soportada."
  - id: c
    text:
      es: "No, porque más de la mitad de sus ingresos de 2025 fue objeto de retención."
  - id: d
    correct: true
    text:
      es: "Sí, porque en 2025 solo el 67,5 por ciento de sus ingresos fue objeto de retención, menos del 70 por ciento exigido."
  explanation:
    es: "La relación de ingresos retenidos es 27.000 entre 40.000, es decir, el 67,5 por ciento, que no alcanza el 70 por ciento que el artículo 109.2 exige para quedar excluida del pago fraccionado. Queda obligada al pago fraccionado. El umbral no es la mitad de los ingresos, ni la totalidad: es el 70 por ciento. La obligación de los profesionales tampoco es incondicional, porque el propio apartado prevé la exclusión."
  citation: "art. 109.2 RIRPF"
  difficulty: 3
  tags:
  - "cómputo"
  - "pagos fraccionados"
  - "excepción"
# anchor: boe-a-2007-6820-art-109
- id: m03-l06-q0067
  prompt:
    es: "Señale la respuesta CORRECTA sobre los contribuyentes que desarrollen actividades forestales, de acuerdo con el artículo 109.4 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Están obligados a efectuar pago fraccionado en todo caso, porque la exclusión del 70 por ciento solo rige para actividades profesionales."
  - id: b
    text:
      es: "No están obligados a efectuar pago fraccionado si en el año natural anterior al menos el 50 por ciento de los ingresos de la actividad fue objeto de retención."
  - id: c
    text:
      es: "No están obligados a efectuar pago fraccionado si en el año natural anterior al menos el 70 por ciento de los ingresos totales, incluidas las subvenciones, fue objeto de retención."
  - id: d
    correct: true
    text:
      es: "No están obligados a efectuar pago fraccionado si en el año natural anterior al menos el 70 por ciento de los ingresos de la actividad, sin las subvenciones ni las indemnizaciones, fue objeto de retención."
  explanation:
    es: "Para las actividades forestales rige el 70 por ciento sobre los ingresos procedentes de la actividad, con excepción de las subvenciones corrientes y de capital y de las indemnizaciones (artículo 109.4). Incluir las subvenciones en la base contradice esa excepción. El umbral del 50 por ciento no es el de la norma. La regla no es exclusiva de los profesionales: los apartados 3 y 4 la extienden a las actividades agrícolas, ganaderas y forestales."
  citation: "art. 109.4 RIRPF"
  difficulty: 3
  tags:
  - "pagos fraccionados"
  - "excepción"
# anchor: boe-a-2007-6820-art-111
- id: m03-l06-q0068
  prompt:
    es: "Según el artículo 111.1 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, los empresarios y profesionales declaran e ingresan trimestralmente las cantidades del pago fraccionado; el cuarto trimestre lo hacen:"
  options:
  - id: a
    text:
      es: "entre el día 1 y el 30 del mes de abril."
  - id: b
    text:
      es: "entre el día 1 y el 20 del mes de enero."
  - id: c
    correct: true
    text:
      es: "entre el día 1 y el 30 del mes de enero."
  - id: d
    text:
      es: "entre el día 1 y el 20 del mes de diciembre."
  explanation:
    es: "El cuarto trimestre del pago fraccionado se declara e ingresa entre el día 1 y el 30 de enero (artículo 111.1), a diferencia de los tres primeros, que terminan el día 20. El día 20 de enero es el límite de las retenciones del artículo 108.1. El mes de diciembre es de un trimestre aún no concluido. Abril es el mes del primer trimestre del año siguiente."
  citation: "art. 111.1 RIRPF"
  difficulty: 2
  tags:
  - "plazo"
  - "pagos fraccionados"
# anchor: boe-a-2007-6820-art-111
- id: m03-l06-q0069
  prompt:
    es: "Según el artículo 111.1 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, ¿hasta qué fecha debe un empresario declarar e ingresar el pago fraccionado correspondiente al tercer trimestre de 2026, de julio a septiembre?"
  options:
  - id: a
    text:
      es: "Hasta el 30 de octubre de 2026."
  - id: b
    correct: true
    text:
      es: "Hasta el 20 de octubre de 2026."
  - id: c
    text:
      es: "Hasta el 30 de enero de 2027."
  - id: d
    text:
      es: "Hasta el 20 de noviembre de 2026."
  explanation:
    es: "Los tres primeros trimestres se declaran e ingresan entre el día 1 y el 20 de abril, julio y octubre (artículo 111.1), de modo que el tercer trimestre de 2026 termina el 20 de octubre de 2026. El 30 es el límite solo del cuarto trimestre, que se presenta en enero. El 20 de noviembre y el 30 de enero de 2027 no corresponden a ningún trimestre en esos términos."
  citation: "art. 111.1 RIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "plazo"
  - "pagos fraccionados"
# anchor: boe-a-2007-6820-art-111
- id: m03-l06-q0070
  prompt:
    es: "De acuerdo con el artículo 111.1 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, cuando de la aplicación del importe del fraccionamiento no resulten cantidades a ingresar, los contribuyentes presentarán:"
  options:
  - id: a
    text:
      es: "una comunicación de datos para solicitar la devolución."
  - id: b
    text:
      es: "ninguna declaración, al no resultar importe alguno."
  - id: c
    text:
      es: "una declaración complementaria del trimestre anterior."
  - id: d
    correct: true
    text:
      es: "una declaración negativa, aunque no haya cantidad a ingresar."
  explanation:
    es: "Si no resultan cantidades a ingresar, el artículo 111.1 obliga a presentar una declaración negativa. La complementaria sirve para completar o modificar una declaración anterior. La comunicación de datos se presenta para que la Administración determine una devolución. No presentar nada contradice la obligación expresa del apartado."
  citation: "art. 111.1 RIRPF"
  difficulty: 1
  tags:
  - "pagos fraccionados"
  - "declaración negativa"
# anchor: boe-a-2014-12328-art-40
- id: m03-l06-q0072
  prompt:
    es: "De acuerdo con el artículo 40.1 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, los contribuyentes efectuarán en abril, octubre y diciembre un pago fraccionado a cuenta de la liquidación correspondiente al período impositivo que esté en curso:"
  options:
  - id: a
    correct: true
    text:
      es: "el día 1 de cada uno de los meses indicados."
  - id: b
    text:
      es: "el último día de cada uno de los meses indicados."
  - id: c
    text:
      es: "el día 1 de enero del año natural en que se paga."
  - id: d
    text:
      es: "el día en que concluye el plazo de ingreso."
  explanation:
    es: "El pago fraccionado se hace a cuenta de la liquidación del período impositivo que esté en curso el día 1 de cada uno de los meses de abril, octubre y diciembre (artículo 40.1). El último día del mes y el día en que concluye el plazo de ingreso son referencias que el apartado no usa. El 1 de enero fija el inicio del año natural, no el período que está en curso en cada fecha de pago."
  citation: "art. 40.1 LIS"
  difficulty: 2
  tags:
  - "pago fraccionado"
  - "período impositivo"
# anchor: boe-a-2014-12328-art-40
- id: m03-l06-q0073
  prompt:
    es: "Según el artículo 40.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, la base para calcular el pago fraccionado es la cuota íntegra del último período impositivo cuyo plazo de declaración estuviese vencido el primer día de los 20 naturales, minorada en:"
  options:
  - id: a
    text:
      es: "la cuota líquida mínima y los pagos fraccionados de los períodos impositivos anteriores."
  - id: b
    correct: true
    text:
      es: "las deducciones y bonificaciones aplicables al contribuyente y las retenciones e ingresos a cuenta correspondientes a aquel."
  - id: c
    text:
      es: "los pagos fraccionados efectuados en el período y las bases imponibles negativas pendientes de compensar."
  - id: d
    text:
      es: "las deducciones y bonificaciones aplicables al contribuyente, pero no las retenciones e ingresos a cuenta."
  explanation:
    es: "La base del pago fraccionado es la cuota íntegra del último período con plazo de declaración vencido, minorada en las deducciones y bonificaciones aplicables y en las retenciones e ingresos a cuenta de ese período (artículo 40.2). Dejar fuera las retenciones omite una de las minoraciones. Los pagos fraccionados y las bases imponibles negativas no son minoraciones de esa cuota en el apartado. La cuota líquida mínima tampoco figura como sustracción."
  citation: "art. 40.2 LIS"
  difficulty: 3
  tags:
  - "pago fraccionado"
  - "base"
# anchor: boe-a-2014-12328-art-40
- id: m03-l06-q0074
  prompt:
    es: "De acuerdo con el artículo 40.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, la cuantía del pago fraccionado general es el resultado de aplicar a la base:"
  options:
  - id: a
    text:
      es: "el porcentaje del 25 por ciento."
  - id: b
    correct: true
    text:
      es: "el porcentaje del 18 por ciento."
  - id: c
    text:
      es: "el porcentaje del 23 por ciento."
  - id: d
    text:
      es: "el porcentaje del 19 por ciento."
  explanation:
    es: "La modalidad general del artículo 40.2 aplica a la base el 18 por ciento. El 23 y el 25 por ciento son los mínimos de la disposición adicional decimocuarta, que operan sobre el resultado contable en la otra modalidad. El 19 por ciento es el tipo de retención de varias rentas del Impuesto sobre la Renta de las Personas Físicas, no un porcentaje de este pago."
  citation: "art. 40.2 LIS"
  difficulty: 1
  tags:
  - "pago fraccionado"
  - "porcentaje"
# anchor: boe-a-2014-12328-art-40
- id: m03-l06-q0075
  prompt:
    es: "Rutas del Sur, S.L., con período impositivo igual al año natural, efectúa en abril de 2026 su pago fraccionado general. El plazo de declaración de 2025 vence el 27 de julio de 2026 y el de 2024 venció el 25 de julio de 2025. La cuota íntegra de 2024 fue de 100.000 euros y la de 2025 de 200.000 euros; las deducciones y bonificaciones de 2024 suman 10.000 euros y sus retenciones e ingresos a cuenta, 5.000 euros. Conforme al artículo 40.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, ¿qué importe corresponde?"
  options:
  - id: a
    text:
      es: "33.300 euros, el 18 por ciento de 185.000 euros."
  - id: b
    text:
      es: "18.000 euros, el 18 por ciento de 100.000 euros."
  - id: c
    correct: true
    text:
      es: "15.300 euros, el 18 por ciento de 85.000 euros."
  - id: d
    text:
      es: "16.200 euros, el 18 por ciento de 90.000 euros."
  explanation:
    es: "El 1 de abril de 2026 el plazo de declaración de 2025 aún no ha vencido, así que la base parte de 2024, el último período con plazo vencido: 100.000 menos 10.000 de deducciones y bonificaciones y 5.000 de retenciones e ingresos a cuenta da 85.000 euros, y el 18 por ciento son 15.300 euros (artículo 40.2). Los 33.300 euros parten de la cuota de 2025, cuyo plazo no estaba vencido. Los 16.200 euros olvidan restar las retenciones e ingresos a cuenta. Los 18.000 euros aplican el porcentaje a la cuota íntegra sin minoración alguna."
  citation: "art. 40.2 LIS"
  difficulty: 3
  tags:
  - "cómputo"
  - "pago fraccionado"
  - "base"
# anchor: boe-a-2014-12328-art-40
- id: m03-l06-q0076
  prompt:
    es: "Según el artículo 40.2 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, cuando el último período impositivo concluido sea de duración inferior al año, para calcular la base del pago fraccionado se tomará también en cuenta:"
  options:
  - id: a
    text:
      es: "la cuota líquida de los dos períodos impositivos siguientes, hasta completar un período de 12 meses."
  - id: b
    correct: true
    text:
      es: "la parte proporcional de la cuota de períodos impositivos anteriores, hasta completar un período de 12 meses."
  - id: c
    text:
      es: "la cuota íntegra del período impositivo en curso, prorrateada por los días transcurridos."
  - id: d
    text:
      es: "la parte proporcional de la base imponible de períodos impositivos anteriores, hasta completar un período de 24 meses."
  explanation:
    es: "Si el último período concluido dura menos de un año, se suma la parte proporcional de la cuota de períodos anteriores hasta completar 12 meses (artículo 40.2). El período en curso no se utiliza, porque la base se construye con períodos ya concluidos. La referencia son las cuotas, no las bases imponibles, y el objetivo son 12 meses y no 24. Los períodos siguientes no existen todavía en el momento del pago."
  citation: "art. 40.2 LIS"
  difficulty: 3
  tags:
  - "pago fraccionado"
  - "base"
# anchor: boe-a-2014-12328-art-40
- id: m03-l06-q0077
  prompt:
    es: "De acuerdo con el artículo 40.3 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, los pagos fraccionados también podrán realizarse, a opción del contribuyente, sobre la parte de la base imponible del período de los:"
  options:
  - id: a
    text:
      es: "4, 8 u 11 primeros meses de cada año natural."
  - id: b
    text:
      es: "6, 9 u 12 primeros meses de cada año natural."
  - id: c
    text:
      es: "3, 6 u 9 primeros meses de cada año natural."
  - id: d
    correct: true
    text:
      es: "3, 9 u 11 primeros meses de cada año natural."
  explanation:
    es: "La modalidad optativa del artículo 40.3 toma la base imponible de los 3, 9 u 11 primeros meses de cada año natural, que se corresponden con los pagos de abril, octubre y diciembre. Los demás grupos de meses no coinciden con esos períodos de ingreso."
  citation: "art. 40.3 LIS"
  difficulty: 2
  tags:
  - "pago fraccionado"
  - "modalidad"
