      es: "Extensiones › Obtener extensiones para Microsoft Edge › Obtener"
  - id: b
    text:
      es: "Extensiones › Notificar abuso › Rellenar el formulario"
  - id: c
    correct: true
    text:
      es: "Extensiones › Más acciones › Quitar de Microsoft Edge › Quitar"
  - id: d
