# anchor: fuente-ms-excel-si-anidadas-html
- id: m02-l09-q253
  prompt:
    es: "En Excel 365 configurado en español, ¿cuál de los siguientes atajos inserta saltos de línea en la barra de fórmulas, antes del texto que se pasa a una línea nueva?"
  options:
  - id: a
    text:
      es: "Mayús+Entrar"
  - id: b
    correct: true
    text:
      es: "Alt+Entrar"
  - id: c
    text:
      es: "Ctrl+Mayús+Entrar"
  - id: d
    text:
      es: "Ctrl+Entrar"
  explanation:
    es: "La página recomienda pulsar Alt+Entrar antes del texto que se quiere ajustar a una nueva línea. «Ctrl+Entrar»: rellena el rango seleccionado con la entrada actual, según la página de atajos. «Mayús+Entrar»: completa la entrada y selecciona la celda de encima. «Ctrl+Mayús+Entrar»: la página lo da para introducir una fórmula de matriz."
