- id: m03-l04-q023
  prompt:
    es: "Según el artículo 21.1.a) de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, cuando el suministro lo adjudican órganos de contratación del sector de la defensa, el umbral de 140.000 euros se aplica:"
  options:
  - id: a
    text:
      es: "Solo a los contratos de suministro que hayan sido declarados secretos o reservados."
  - id: b
    text:
      es: "Solo a los contratos de suministro de valor estimado superior a un millón de euros."
  - id: c
    text:
      es: "A todos los contratos de suministro de esos órganos, sin excepción."
  - id: d
    correct: true
    text:
      es: "Solo a los contratos de suministro que tengan por objeto los productos enumerados en el anexo II."
  explanation:
    es: "El artículo 21.1.a) LCSP dice que, cuando adjudican órganos de contratación del sector de la defensa, el umbral de 140.000 euros «solo se aplicará respecto de los contratos de suministro que tengan por objeto los productos enumerados en el anexo II». Aplicarlo a todos los suministros de esos órganos contradice «solo». El criterio es el objeto del contrato, los productos del anexo II, y no que esté declarado secreto o reservado ni que supere un millón de euros."
