# anchor: fuente-ms-excel-error-nombre-html
- id: m06-l05-q218
  prompt:
    es: "En Excel 365, ¿cuál de las siguientes causas provoca el error #¿NOMBRE? en una fórmula como =SUMA(Ganancias)?"
  options:
  - id: a
    correct: true
