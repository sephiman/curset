- id: m06-l03-q053
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿cuál de las siguientes teclas cambia el nombre del elemento seleccionado?"
  options:
  - id: a
    text:
      es: "F3"
  - id: b
    text:
      es: "F4"
  - id: c
    text:
      es: "F5"
  - id: d
    correct: true
    text:
      es: "F2"
  explanation:
    es: "La tabla del Explorador asigna a F2 «Cambiar el nombre del elemento seleccionado». F3 busca un archivo o carpeta, F4 selecciona la barra de direcciones para cambiar la ruta actual y F5 actualiza la ventana."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m06-l03-q054
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué ocurre al pulsar Mayús+Supr con un archivo seleccionado?"
  options:
  - id: a
    text:
      es: "Se elimina y se mueve a la Papelera de reciclaje del equipo"
  - id: b
    text:
      es: "Se corta para pegarlo después en otra ubicación del equipo"
  - id: c
    correct: true
    text:
      es: "Se elimina permanentemente sin moverlo a la Papelera de reciclaje"
  - id: d
    text:
      es: "Se muestra su menú contextual con todas las opciones disponibles"
  explanation:
    es: "La tabla del Explorador asigna a Mayús+Supr «Eliminar permanentemente el elemento seleccionado sin moverlo a la papelera de reciclaje». Moverlo a la Papelera es lo que hacen Supr o Ctrl+D; cortar es Ctrl+X, y el menú contextual se muestra con Mayús+F10."
