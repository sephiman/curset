# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0045
  prompt:
    es: "Según el artículo 80.Cuatro.A.3.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, para considerar incobrable un crédito, el destinatario de la operación debe actuar como empresario o profesional o, en otro caso, la base imponible, IVA excluido, ha de ser:"
  options:
  - id: a
    text:
      es: "superior a 500 euros, con el IVA excluido."
  - id: b
    text:
      es: "igual o superior a 300 euros, con el IVA excluido."
  - id: c
    correct: true
    text:
      es: "superior a 50 euros, con el IVA excluido."
  - id: d
    text:
      es: "superior a 5.000 euros, con el IVA excluido."
  explanation:
    es: "Si el destinatario no es empresario ni profesional, la base imponible de la operación, IVA excluido, debe superar 50 euros. Las demás cantidades no son el umbral de la tercera condición."
  citation: "art. 80.Cuatro.A.3.ª LIVA"
  difficulty: 2
  tags:
  - "modificación de la base imponible"
  - "incobrables"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0046
  prompt:
    es: "Papelería Quevedo, S.L. vende a una persona física que no es empresaria ni profesional unos muebles con una base imponible de 40 euros, IVA excluido, el 2 de enero de 2025. No los cobra, lo consigna en los Libros Registros y requiere notarialmente el pago el 10 de febrero de 2026. Según el artículo 80.Cuatro de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿puede reducir la base imponible por crédito incobrable?"
  options:
  - id: a
    text:
      es: "Sí, porque ha transcurrido más de un año desde el devengo y consta en los Libros Registros."
  - id: b
    text:
      es: "No, porque el requerimiento notarial no es un medio válido para instar el cobro del crédito."
  - id: c
    correct: true
    text:
      es: "No, porque el destinatario no es empresario ni profesional y la base imponible no supera 50 euros."
  - id: d
    text:
      es: "Sí, porque el requerimiento notarial acredita fehacientemente la reclamación del cobro al deudor."
  explanation:
    es: "Cumple el año (del 2 de enero de 2025 al 2 de enero de 2026), el registro y el requerimiento notarial, que es un medio válido de instar el cobro (art. 80.Cuatro.A.1.ª, 2.ª y 4.ª). Pero el destinatario no es empresario ni profesional y la base, 40 euros, no supera 50 (art. 80.Cuatro.A.3.ª), así que no procede reducirla."
  citation: "art. 80.Cuatro.A.3.ª LIVA"
  difficulty: 3
  tags:
  - "modificación de la base imponible"
  - "incobrables"
  - "cómputo"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0047
  prompt:
    es: "De acuerdo con el artículo 80.Cuatro.A.4.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, para considerar incobrable un crédito, el sujeto pasivo debe haber instado su cobro mediante reclamación judicial al deudor, por medio de requerimiento notarial al mismo o:"
  options:
  - id: a
    correct: true
    text:
      es: "por cualquier otro medio que acredite fehacientemente la reclamación del cobro a aquel."
  - id: b
    text:
      es: "por una comunicación a la Agencia Tributaria de la existencia del impago."
  - id: c
    text:
      es: "por un simple recordatorio de pago remitido al deudor por correo ordinario o por correo electrónico."
  - id: d
    text:
      es: "por una reclamación económico-administrativa ante el tribunal competente."
  explanation:
    es: "Además de la vía judicial y del requerimiento notarial, vale cualquier medio que acredite fehacientemente la reclamación. Un recordatorio ordinario no la acredita, y la comunicación a la Agencia Tributaria o la reclamación económico-administrativa no reclaman el cobro al deudor."
  citation: "art. 80.Cuatro.A.4.ª LIVA"
  difficulty: 2
  tags:
  - "modificación de la base imponible"
  - "incobrables"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0048
  prompt:
    es: "Conforme al artículo 80.Cuatro.B de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la modificación de la base imponible por créditos incobrables debe realizarse en el plazo de:"
  options:
  - id: a
    correct: true
    text:
      es: "los seis meses siguientes a la finalización del período de seis meses o un año de la primera condición."
  - id: b
    text:
      es: "cuatro años desde el devengo del impuesto repercutido en la operación de la que deriva el crédito."
  - id: c
    text:
      es: "un mes desde la fecha del requerimiento notarial o de la reclamación judicial al deudor."
  - id: d
    text:
      es: "los tres meses siguientes a la finalización del período de seis meses o un año de la primera condición."
  explanation:
    es: "La modificación se hace en los seis meses siguientes al fin del período de seis meses o un año de la primera condición. Tres meses, un mes desde la reclamación o cuatro años desde el devengo no son el plazo del apartado B."
  citation: "art. 80.Cuatro.B LIVA"
  difficulty: 2
  tags:
  - "modificación de la base imponible"
  - "incobrables"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0049
  prompt:
    es: "Carpintería Segura, S.L., con un volumen de operaciones de 400.000 euros en 2025, devenga el 10 de enero de 2026 una cuota repercutida a otra sociedad que no la paga. Opta por el plazo de seis meses de la primera condición. Consta en los Libros Registros, el destinatario es empresario y reclama judicialmente en febrero de 2026. Según el artículo 80.Cuatro de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿puede modificar la base imponible el 20 de noviembre de 2026?"
  options:
  - id: a
    text:
      es: "No, porque con ese volumen de operaciones solo puede aplicar el plazo de un año."
  - id: b
    text:
      es: "No, porque aún no ha transcurrido un año desde el devengo de la operación."
  - id: c
    text:
      es: "No, porque la modificación debió hacerse en los seis meses siguientes al devengo."
  - id: d
    correct: true
    text:
      es: "Sí, porque ya ha transcurrido el período de seis meses y aún no han pasado los seis meses siguientes para modificar."
  explanation:
    es: "Con volumen de 400.000 euros, inferior a 6.010.121,04, puede optar por seis meses: el período termina en julio de 2026. La modificación puede hacerse en los seis meses siguientes, hasta enero de 2027, y el 20 de noviembre de 2026 está dentro. Esperar un año es solo la otra opción, el plazo no cuenta desde el devengo y el empresario pequeño puede elegir seis meses."
  citation: "art. 80.Cuatro.B LIVA"
  difficulty: 3
  tags:
  - "modificación de la base imponible"
  - "incobrables"
  - "cómputo"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0050
  prompt:
    es: "Según el artículo 80.Cinco.1.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, no procede la modificación de la base imponible por impago, entre otros, en los créditos que disfruten de:"
  options:
  - id: a
    text:
      es: "privilegio general reconocido en el procedimiento concursal del deudor."
  - id: b
    text:
      es: "garantía personal prestada por el administrador de la sociedad deudora."
  - id: c
    text:
      es: "aval prestado por el propio sujeto pasivo acreedor a favor del deudor."
  - id: d
    correct: true
    text:
      es: "garantía real, en la parte garantizada."
  explanation:
    es: "La exclusión alcanza a los créditos con garantía real, en la parte garantizada. La garantía personal de un administrador, el privilegio concursal y el aval del propio acreedor no figuran entre los casos del número 1.ª."
  citation: "art. 80.Cinco.1.ª LIVA"
  difficulty: 1
  tags:
  - "modificación de la base imponible"
  - "incobrables"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0051
  prompt:
    es: "De acuerdo con el artículo 80.Cinco.1.ª.b) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, no procede modificar la base imponible en los créditos afianzados por entidades de crédito o sociedades de garantía recíproca o cubiertos por un contrato de seguro de crédito o de caución:"
  options:
  - id: a
    text:
      es: "en la parte no afianzada ni asegurada del crédito."
  - id: b
    text:
      es: "en su totalidad, aunque la fianza o el seguro cubran solo una parte."
  - id: c
    text:
      es: "solo cuando el afianzado sea una persona jurídica."
  - id: d
    correct: true
    text:
      es: "en la parte afianzada o asegurada."
  explanation:
    es: "La exclusión se limita a la parte afianzada o asegurada, así que la parte no cubierta sí puede dar lugar a modificación. No alcanza al crédito entero y la ley no distingue por la naturaleza del afianzado."
  citation: "art. 80.Cinco.1.ª LIVA"
  difficulty: 1
  tags:
  - "modificación de la base imponible"
  - "incobrables"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0052
  prompt:
    es: "Conforme al artículo 80.Cinco.1.ª.c) de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, tampoco procede la modificación de la base imponible por impago en los créditos entre:"
  options:
  - id: a
    text:
      es: "personas o entidades establecidas en distintos Estados miembros de la Unión."
  - id: b
    text:
      es: "empresarios o profesionales que apliquen el régimen especial del criterio de caja."
  - id: c
    correct: true
    text:
      es: "personas o entidades vinculadas definidas en el artículo 79, apartado cinco."
  - id: d
    text:
      es: "personas o entidades vinculadas definidas en el artículo 5 de la Ley."
  explanation:
    es: "La exclusión es para créditos entre personas o entidades vinculadas conforme al artículo 79, apartado cinco. La vinculación no se define por el establecimiento en otro Estado, ni por el criterio de caja, ni por el artículo 5."
  citation: "art. 80.Cinco.1.ª LIVA"
  difficulty: 2
  tags:
  - "modificación de la base imponible"
  - "incobrables"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0053
  prompt:
    es: "Señale la respuesta CORRECTA sobre el destinatario no establecido en el territorio de aplicación del impuesto, según el artículo 80.Cinco.2.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "No procede la modificación de la base imponible, sin excepción alguna, cuando el destinatario no esté establecido en el territorio."
  - id: b
    correct: true
    text:
      es: "No procede la modificación de la base imponible, salvo en los créditos incobrables por un proceso de insolvencia declarado por un órgano jurisdiccional de otro Estado miembro."
  - id: c
    text:
      es: "Procede siempre la modificación de la base imponible, con independencia de su lugar de establecimiento, si el crédito es incobrable."
  - id: d
    text:
      es: "No procede la modificación de la base imponible, salvo en los créditos incobrables de destinatarios que sean personas jurídicas sin actividad empresarial."
  explanation:
    es: "Si el destinatario no está establecido en el territorio de aplicación, ni en Canarias, Ceuta o Melilla, no procede modificar, salvo los créditos incobrables por insolvencia declarada por un órgano jurisdiccional de otro Estado miembro. Quedan fuera de la exclusión los destinatarios establecidos en el territorio, en Canarias, Ceuta o Melilla, y el tipo de persona jurídica no es el criterio."
  citation: "art. 80.Cinco.2.ª LIVA"
  difficulty: 3
  tags:
  - "modificación de la base imponible"
  - "incobrables"
# anchor: boe-a-1992-28740-art-81
- id: m03-l19-q0179
  prompt:
    es: "Según el artículo 81.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿en qué régimen se determina con carácter general la base imponible?"
  options:
  - id: a
    text:
      es: "Estimación indirecta, salvo que el sujeto pasivo opte por la estimación directa."
  - id: b
    correct: true
    text:
      es: "Estimación directa, sin más excepciones que las de la ley y las del régimen de estimación indirecta."
  - id: c
    text:
      es: "Estimación objetiva, con las excepciones que fije cada ejercicio la Administración tributaria mediante resolución."
  - id: d
    text:
      es: "Estimación directa, sin más excepciones que las del régimen de módulos aprobado por orden."
  explanation:
    es: "La regla general es la estimación directa, con las excepciones que establece la propia ley y las de la estimación indirecta de bases. No es estimación objetiva ni indirecta por defecto, y las excepciones no vienen de módulos por orden."
  citation: "art. 81.Uno LIVA"
  difficulty: 2
  tags:
  - "base imponible"
# anchor: boe-a-1992-28740-art-78
- id: m03-l19-q0182
  prompt:
    es: "Según el artículo 78.Dos.5.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, se incluyen en el concepto de contraprestación, en los casos de resolución de las operaciones sujetas, las percepciones:"
  options:
  - id: a
    text:
      es: "abonadas por terceros al destinatario como compensación de la resolución."
  - id: b
    text:
      es: "retenidas por el destinatario de la operación frente al pago del precio."
  - id: c
    correct: true
    text:
      es: "retenidas con arreglo a derecho por el obligado a efectuar la prestación."
  - id: d
    text:
      es: "devueltas al destinatario por el obligado a efectuar la prestación."
  explanation:
    es: "Forman parte de la contraprestación las percepciones que el obligado a prestar retiene con arreglo a derecho cuando se resuelve la operación. Las devueltas al destinatario, las retenidas por este y las abonadas por terceros no responden a esa descripción."
  citation: "art. 78.Dos.5.º LIVA"
  difficulty: 1
  tags:
  - "base imponible"
  - "contraprestación"
# anchor: boe-a-1992-28740-art-78
- id: m03-l19-q0184
  prompt:
    es: "¿Cuál de las siguientes subvenciones se considera vinculada directamente al precio de las operaciones sujetas, según el artículo 78.Dos.3.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "La establecida en función de las pérdidas del ejercicio y determinada con anterioridad a la realización de la operación."
  - id: b
    correct: true
    text:
      es: "La establecida en función del número de unidades entregadas y determinada con anterioridad a la realización de la operación."
  - id: c
    text:
      es: "La establecida en función del número de unidades entregadas y determinada con posterioridad a la realización de la operación."
  - id: d
    text:
      es: "La establecida con carácter genérico para financiar la actividad y determinada al cierre del ejercicio."
  explanation:
    es: "Solo la subvención fijada según unidades entregadas o volumen de servicios y determinada antes de la operación se vincula directamente al precio. Si se determina después, depende de las pérdidas o es una ayuda genérica a la actividad, no cumple esas dos condiciones."
  citation: "art. 78.Dos.3.º LIVA"
  difficulty: 2
  tags:
  - "base imponible"
  - "subvenciones"
# anchor: boe-a-1992-28740-art-78
- id: m03-l19-q0185
  prompt:
    es: "Señale la respuesta CORRECTA sobre los envases y embalajes en la base imponible, según el artículo 78.Dos.6.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    correct: true
    text:
      es: "Se incluye su importe, incluso el de los susceptibles de devolución, cargado a los destinatarios, cualquiera que sea el concepto por el que se perciba."
  - id: b
    text:
      es: "Se incluye su importe solo cuando no sean susceptibles de devolución, y cargado a los destinatarios con ese concepto."
  - id: c
    text:
      es: "Se incluye su importe únicamente cuando se perciba bajo el concepto de precio de los bienes envasados."
  - id: d
    text:
      es: "No se incluye su importe cuando sean susceptibles de devolución, aunque se cargue a los destinatarios de la operación."
  explanation:
    es: "El importe de los envases y embalajes cargado al destinatario se incluye aunque sean devolubles y con independencia del concepto bajo el que se perciba. Limitarlo a los no devolubles, excluir los devolubles o exigir un concepto concreto cambia la regla."
  citation: "art. 78.Dos.6.º LIVA"
  difficulty: 2
  tags:
  - "base imponible"
  - "envases"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0186
  prompt:
    es: "Aluminios Cantabria, S.A. vende mercancía por 10.000 euros, IVA excluido, con devengo el 5 de marzo de 2026. El 20 de diciembre de 2026 concede al cliente una bonificación de 500 euros por volumen de compras, debidamente justificada, y no la había pactado antes de la operación. Según el artículo 80.Uno.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿en qué cuantía queda la base imponible?"
  options:
  - id: a
    text:
      es: "9.500 euros, pero solo si la bonificación se hubiese pactado antes de realizar la operación."
  - id: b
    text:
      es: "10.500 euros, porque la bonificación se suma a la contraprestación inicial de la operación."
  - id: c
    correct: true
    text:
      es: "9.500 euros, porque el descuento posterior debidamente justificado reduce la base imponible."
  - id: d
    text:
      es: "10.000 euros, porque la bonificación se concedió después del devengo y no puede reducir la base."
  explanation:
    es: "La bonificación otorgada con posterioridad a la operación y debidamente justificada reduce la base: 10.000 - 500 = 9.500 euros. No hace falta que se pactara antes, no queda sin efecto por ser posterior y no se suma a la contraprestación."
  citation: "art. 80.Uno LIVA"
  difficulty: 2
  tags:
  - "modificación de la base imponible"
  - "descuentos"
  - "cómputo"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0187
  prompt:
    es: "Bebidas Miño, S.L. factura bebidas por 3.000 euros, IVA excluido, y carga a su cliente 200 euros por envases reutilizables. El cliente devuelve los envases en el mismo año. Según los artículos 78.Dos.6.º y 80.Uno.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuál es la base imponible tras la devolución?"
  options:
  - id: a
    text:
      es: "3.400 euros, porque los envases devueltos se suman por segunda vez a la base."
  - id: b
    text:
      es: "3.200 euros, porque los envases se incluyen en la base aunque se devuelvan."
  - id: c
    text:
      es: "2.800 euros, porque se restan los envases de la base de las bebidas."
  - id: d
    correct: true
    text:
      es: "3.000 euros, porque los 200 euros de envases devueltos reducen la base inicial de 3.200."
  explanation:
    es: "Los envases cargados se incluyen en la base (3.200), y su devolución, al ser reutilizables, la reduce en su importe: 3.000 euros. Dejar la base en 3.200 ignora la devolución, y 2.800 resta unos envases que nunca estuvieron fuera de la base de las bebidas."
  citation: "art. 80.Uno LIVA"
  difficulty: 3
  tags:
  - "modificación de la base imponible"
  - "envases"
  - "cómputo"
# anchor: boe-a-1992-28740-art-79
- id: m03-l19-q0188
  prompt:
    es: "Muebles Castilla, S.L. destina a uso propio, como autoconsumo, un armario que fabricó con materiales por valor de 5.500 euros y mano de obra de su personal por 1.500 euros. Según el artículo 79.Tres.2.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuál es la base imponible?"
  options:
  - id: a
    text:
      es: "1.500 euros, que son el coste de los gastos de personal de su fabricación."
  - id: b
    text:
      es: "8.500 euros, que son el coste de fabricación incrementado en el beneficio habitual."
  - id: c
    correct: true
    text:
      es: "7.000 euros, que son el coste de los bienes y servicios utilizados, incluidos los gastos de personal."
  - id: d
    text:
      es: "5.500 euros, que son el coste de los materiales utilizados, sin los gastos de personal."
  explanation:
    es: "El bien se sometió a un proceso de elaboración, así que la base es el coste de los bienes y servicios utilizados con los gastos de personal: 5.500 + 1.500 = 7.000. Quitar el personal, tomar solo el personal o añadir un beneficio no figura en la regla."
  citation: "art. 79.Tres LIVA"
  difficulty: 2
  tags:
  - "base imponible"
  - "autoconsumo"
  - "cómputo"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0207
  prompt:
    es: "Señale la respuesta CORRECTA sobre los créditos adeudados o afianzados por Entes públicos, según el artículo 80.Cinco.1.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Procede siempre la modificación de la base imponible en ellos, por el simple transcurso del año desde el devengo de la operación."
  - id: b
    correct: true
    text:
      es: "No procede la modificación de la base imponible en ellos, sin perjuicio de lo que dispone para los créditos incobrables."
  - id: c
    text:
      es: "No procede la modificación de la base imponible en ellos, en ningún caso y sin excepción alguna."
  - id: d
    text:
      es: "Procede la modificación de la base imponible en ellos solo cuando el ente público sea una entidad local."
  explanation:
    es: "La letra d) excluye la modificación en los créditos adeudados o afianzados por Entes públicos, sin perjuicio de lo que se dispone para los incobrables, que se acreditan con certificación del órgano competente. No es una regla de modificación por el mero transcurso del tiempo ni se limita a entes locales."
  citation: "art. 80.Cinco.1.ª LIVA"
  difficulty: 3
  tags:
  - "modificación de la base imponible"
  - "incobrables"
# anchor: boe-a-1992-28740-art-80
- id: m03-l19-q0208
  prompt:
    es: "De acuerdo con el artículo 80.Cuatro de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, los créditos correspondientes a las cuotas repercutidas por las operaciones gravadas que sean total o parcialmente incobrables permiten una reducción:"
  options:
  - id: a
    text:
      es: "de la cuota repercutida a cargo del destinatario."
  - id: b
    text:
      es: "de la base imponible solo si son totalmente incobrables."
  - id: c
    text:
      es: "total de la base imponible en todo caso."
  - id: d
    correct: true
    text:
      es: "proporcional de la base imponible."
  explanation:
    es: "La reducción es proporcional a la parte incobrable, total o parcial. No es total en todo caso, no actúa sobre la cuota del destinatario y no exige que el crédito sea íntegramente incobrable."
  citation: "art. 80.Cuatro LIVA"
  difficulty: 2
  tags:
  - "modificación de la base imponible"
  - "incobrables"
# anchor: boe-a-1992-28740-art-79
- id: m03-l19-q0220
  prompt:
    es: "Cuando en un autoconsumo los bienes se entregan en el mismo estado en que fueron adquiridos y su valor no ha experimentado alteraciones, ¿cuál es la base imponible según el artículo 79.Tres.1.ª de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "El precio de venta al público de bienes similares en el territorio de aplicación del impuesto."
  - id: b
    text:
      es: "El valor de mercado de los bienes en el momento en que se efectúa el autoconsumo."
  - id: c
    text:
      es: "El coste de los bienes utilizados, incluidos los gastos de personal del sujeto pasivo."
  - id: d
    correct: true
    text:
      es: "La que se hubiese fijado en la operación por la que se adquirieron esos bienes."
  explanation:
    es: "Si los bienes se entregan en el mismo estado en que fueron adquiridos, sin proceso de fabricación, elaboración o transformación, la base imponible es la fijada en la operación por la que se adquirieron (art. 79.Tres.1.ª). El valor de los bienes en el momento de la entrega es la base solo cuando su valor ha experimentado alteraciones (art. 79.Tres.3.ª), y el enunciado excluye esa hipótesis. El coste de los bienes y servicios utilizados, con gastos de personal, corresponde a los bienes sometidos a elaboración o transformación (art. 79.Tres.2.ª). El precio de venta al público de bienes similares no es una regla del artículo."
  citation: "art. 79.Tres LIVA"
  difficulty: 1
  tags:
  - "base imponible"
  - "autoconsumo"
# anchor: boe-a-1992-28740-art-79
- id: m03-l19-q0221
  prompt:
    es: "¿Qué tipo de cambio se aplica a la base imponible cuando la contraprestación se hubiese fijado en moneda o divisa distintas de las españolas, según el artículo 79.Once de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "El tipo de cambio vendedor, fijado por el Banco de España, vigente en el momento del cobro."
  - id: b
    correct: true
    text:
      es: "El tipo de cambio vendedor, fijado por el Banco de España, vigente en el momento del devengo."
  - id: c
    text:
      es: "El tipo de cambio vendedor, fijado por el Banco Central Europeo, vigente en el momento del devengo."
  - id: d
    text:
      es: "El tipo de cambio comprador, fijado por el Banco de España, vigente en el momento del devengo."
  explanation:
    es: "Se aplica el tipo de cambio vendedor, fijado por el Banco de España, vigente en el momento del devengo (art. 79.Once). El tipo comprador cambia la modalidad de cambio. Tomar el del momento del cobro desplaza la fecha de referencia, que es el devengo. Y atribuir la fijación del tipo al Banco Central Europeo cambia el organismo, que es el Banco de España."
  citation: "art. 79.Once LIVA"
  difficulty: 1
  tags:
  - "base imponible"
  - "tipo de cambio"
# anchor: boe-a-1992-28740-art-82
- id: m03-l19-q0223
  prompt:
    es: "Según el artículo 82.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la base imponible de las adquisiciones intracomunitarias de bienes se determina:"
  options:
  - id: a
    text:
      es: "Sumando al valor de aduana los conceptos que enumera la Ley, como en las importaciones."
  - id: b
    text:
      es: "Por el coste de los bienes en el Estado miembro de partida, incluidos los gastos de transporte."
  - id: c
    text:
      es: "Por el valor normal de mercado de los bienes en el Estado miembro de partida."
  - id: d
    correct: true
    text:
      es: "De acuerdo con las reglas de los artículos anteriores, relativas a la contraprestación y a las reglas especiales."
  explanation:
    es: "La base imponible de las adquisiciones intracomunitarias de bienes se determina de acuerdo con las reglas de los artículos anteriores, es decir, con las generales de la contraprestación y las especiales (art. 82.Uno). Sumar al valor de aduana ciertos conceptos es la regla de las importaciones (art. 83.Uno). El valor normal de mercado en el Estado de partida y el coste de los bienes en ese Estado no son reglas que fije el artículo."
  citation: "art. 82.Uno LIVA"
  difficulty: 2
  tags:
  - "base imponible"
  - "adquisiciones intracomunitarias"
