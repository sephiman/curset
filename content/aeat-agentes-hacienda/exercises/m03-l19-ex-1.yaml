# anchor: boe-a-1992-28740-art-75
- id: m03-l19-q0001
  prompt:
    es: "¿Cuándo se devenga el impuesto en las entregas de bienes efectuadas en virtud de contratos de arrendamiento-venta, según el artículo 75.Uno.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "Cuando se formalice por escrito el contrato de arrendamiento-venta entre las partes."
  - id: b
    text:
      es: "Cuando se pague la última de las cuotas pactadas en el contrato de arrendamiento-venta."
  - id: c
    correct: true
    text:
      es: "Cuando los bienes que constituyan su objeto se pongan en posesión del adquirente."
  - id: d
    text:
      es: "Cuando se transmita la propiedad de los bienes que constituyan su objeto al adquirente."
  explanation:
    es: "En el arrendamiento-venta el impuesto se devenga cuando los bienes se ponen en posesión del adquirente. No espera al pago de la última cuota ni a la transmisión de la propiedad, y tampoco nace con la firma del contrato."
  citation: "art. 75.Uno.1.º LIVA"
  difficulty: 1
  tags:
  - "devengo"
  - "entregas de bienes"
# anchor: boe-a-1992-28740-art-75
- id: m03-l19-q0002
  prompt:
    es: "Señale la respuesta CORRECTA sobre el devengo del impuesto en las entregas de bienes según el artículo 75.Uno.1.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "Se devenga cuando el transmitente decide emitir la factura de la operación, sea cual sea la fecha de entrega del bien."
  - id: b
    correct: true
    text:
      es: "Se devenga cuando tenga lugar la puesta a disposición del bien al adquirente o, en su caso, cuando se efectúe conforme a la legislación que le sea aplicable."
  - id: c
    text:
      es: "Se devenga cuando las partes firman el contrato de compraventa, aunque el bien no se haya puesto a disposición del adquirente."
  - id: d
    text:
      es: "Se devenga cuando el adquirente inscribe el bien a su nombre en el registro público que corresponda en cada caso."
  explanation:
    es: "La regla general es la puesta a disposición del adquirente o, en su caso, el momento que fije la legislación aplicable a la entrega. La inscripción registral, la firma del contrato y la decisión de facturar no son momentos de devengo de esta regla."
  citation: "art. 75.Uno.1.º LIVA"
  difficulty: 1
  tags:
  - "devengo"
  - "entregas de bienes"
# anchor: boe-a-1992-28740-art-75
- id: m03-l19-q0003
  prompt:
    es: "Según el artículo 75.Uno.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuándo se devenga el impuesto en las prestaciones de servicios, salvo las excepciones que el propio número establece?"
  options:
  - id: a
    text:
      es: "Cuando se emita la factura que documente la prestación del servicio realizado."
  - id: b
    text:
      es: "Cuando el destinatario pague el precio pactado por la prestación del servicio."
  - id: c
    correct: true
    text:
      es: "Cuando se presten, ejecuten o efectúen las operaciones gravadas."
  - id: d
    text:
      es: "Cuando se firme el contrato que obliga al prestador a realizar el servicio."
  explanation:
    es: "En los servicios el devengo se produce al prestarlos, ejecutarlos o efectuarlos. La factura, el pago y la firma del contrato son hechos distintos que no fijan el momento del devengo en la regla general."
  citation: "art. 75.Uno.2.º LIVA"
  difficulty: 1
  tags:
  - "devengo"
  - "servicios"
# anchor: boe-a-1992-28740-art-75
- id: m03-l19-q0004
  prompt:
    es: "Según el artículo 75.Uno.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuándo se devenga el impuesto en las ejecuciones de obra con aportación de materiales?"
  options:
  - id: a
    correct: true
    text:
      es: "En el momento en que los bienes a que se refieran se pongan a disposición del dueño de la obra."
  - id: b
    text:
      es: "En el momento en que el contratista inicie la ejecución de la obra contratada."
  - id: c
    text:
      es: "A 31 de diciembre de cada año por la parte proporcional correspondiente al período transcurrido."
  - id: d
    text:
      es: "El último día del mes en que se haya ejecutado cada parte de la obra contratada."
  explanation:
    es: "En la obra con aportación de materiales el devengo llega cuando los bienes se ponen a disposición del dueño de la obra. El reparto a 31 de diciembre es la regla de los servicios continuados de más de un año, y el inicio de la obra o el cierre de mes no figuran en el precepto."
  citation: "art. 75.Uno.2.º LIVA"
  difficulty: 1
  tags:
  - "devengo"
  - "ejecución de obra"
# anchor: boe-a-1992-28740-art-75
- id: m03-l19-q0005
  prompt:
    es: "Consultoría Navarra, S.L., establecida en otro Estado miembro, presta a Hermanos Prado, S.L., empresa establecida en España, un servicio continuado durante 36 meses desde el 1 de julio de 2025, por un precio total de 108.000 euros, IVA excluido, repartido por igual a lo largo de la prestación. No se pactan pagos anticipados y el destinatario es el sujeto pasivo conforme al artículo 84.Uno.2.º. Según el artículo 75.Uno.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué importe se devenga el 31 de diciembre de 2025?"
  options:
  - id: a
    text:
      es: "108.000 euros, que corresponden a la totalidad del precio pactado para la prestación."
  - id: b
    text:
      es: "36.000 euros, que corresponden al primer año completo de la prestación del servicio."
  - id: c
    correct: true
    text:
      es: "18.000 euros, que corresponden a los seis meses transcurridos desde el inicio de la prestación."
  - id: d
    text:
      es: "9.000 euros, que corresponden a los tres últimos meses del año natural 2025."
  explanation:
    es: "El servicio dura más de un año, el destinatario es el sujeto pasivo y no hay pagos anticipados: el impuesto se devenga a 31 de diciembre por la parte proporcional del período transcurrido. Del 1 de julio al 31 de diciembre de 2025 pasan 6 meses de 36, y 108.000 x 6 / 36 son 18.000 euros. El año completo, los tres últimos meses y el precio total no responden a ese período."
  citation: "art. 75.Uno.2.º LIVA"
  difficulty: 3
  tags:
  - "devengo"
  - "servicios continuados"
  - "cómputo"
# anchor: boe-a-1992-28740-art-75
- id: m03-l19-q0007
  prompt:
    es: "Gestiones Duero, S.L. adquiere en nombre propio, por encargo de Talleres Ebro, S.L., una máquina mediante un contrato de comisión de compra firmado el 1 de febrero de 2026. El proveedor entrega la máquina al comisionista el 10 de marzo, este la entrega al comitente el 20 de marzo y el comitente paga la comisión el 30 de abril. ¿En qué fecha se devenga, conforme al artículo 75.Uno.4.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, la transmisión entre comisionista y comitente?"
  options:
  - id: a
    text:
      es: "El 30 de abril de 2026, cuando el comitente paga la comisión pactada."
  - id: b
    text:
      es: "El 20 de marzo de 2026, cuando el comisionista entrega la máquina al comitente."
  - id: c
    text:
      es: "El 1 de febrero de 2026, cuando se firma el contrato de comisión de compra."
  - id: d
    correct: true
    text:
      es: "El 10 de marzo de 2026, cuando al comisionista le es entregada la máquina."
  explanation:
    es: "Con un comisionista que actúa en nombre propio en una compra, el impuesto se devenga cuando a este le son entregados los bienes: el 10 de marzo de 2026. La entrega posterior al comitente, la firma del contrato y el pago de la comisión no fijan el devengo."
  citation: "art. 75.Uno.4.º LIVA"
  difficulty: 2
  tags:
  - "devengo"
  - "comisión"
  - "cómputo"
# anchor: boe-a-1992-28740-art-75
- id: m03-l19-q0008
  prompt:
    es: "Según el artículo 75.Uno.5.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿cuándo se devenga el impuesto en los supuestos de autoconsumo?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando se efectúen las operaciones gravadas."
  - id: b
    text:
      es: "Cuando el empresario las incluya en su contabilidad."
  - id: c
    text:
      es: "El último día del año natural en que se efectúen."
  - id: d
    text:
      es: "Cuando el empresario presente la autoliquidación del período."
  explanation:
    es: "En el autoconsumo el devengo coincide con la realización de las operaciones gravadas. La contabilización, el último día del año y la presentación de la autoliquidación no son el momento que fija el precepto."
  citation: "art. 75.Uno.5.º LIVA"
  difficulty: 1
  tags:
  - "devengo"
  - "autoconsumo"
# anchor: boe-a-1992-28740-art-75
- id: m03-l19-q0009
  prompt:
    es: "¿En qué momento se devenga el impuesto en los arrendamientos, en los suministros y, en general, en las operaciones de tracto sucesivo o continuado, según el artículo 75.Uno.7.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "En el momento en que se emita la factura final con el total de las percepciones."
  - id: b
    correct: true
    text:
      es: "En el momento en que resulte exigible la parte del precio que comprenda cada percepción."
  - id: c
    text:
      es: "En el momento en que se cobre efectivamente la parte del precio que comprenda cada percepción."
  - id: d
    text:
      es: "En el momento en que finalice el contrato de arrendamiento o de suministro firmado."
  explanation:
    es: "En las operaciones de tracto sucesivo cada percepción se devenga cuando es exigible, no cuando se cobra. El fin del contrato y la factura final no fijan el devengo de cada parte del precio."
  citation: "art. 75.Uno.7.º LIVA"
  difficulty: 1
  tags:
  - "devengo"
  - "tracto sucesivo"
# anchor: boe-a-1992-28740-art-75
- id: m03-l19-q0010
  prompt:
    es: "Marta Olmo arrienda un local a una sociedad desde el 1 de octubre de 2025 por 1.200 euros al mes, IVA excluido. Las partes pactan el precio pero no determinan el momento de su exigibilidad. Según el artículo 75.Uno.7.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, ¿qué importe se devenga el 31 de diciembre de 2025?"
  options:
  - id: a
    text:
      es: "4.800 euros, que corresponden a cuatro meses de renta del arrendamiento."
  - id: b
    text:
      es: "1.200 euros, que corresponden solo al mes de diciembre de 2025."
  - id: c
    correct: true
    text:
      es: "3.600 euros, que corresponden a los tres meses transcurridos desde el inicio del arrendamiento."
  - id: d
    text:
      es: "14.400 euros, que corresponden a un año completo de renta del local."
  explanation:
    es: "Si el precio está pactado pero no se ha determinado cuándo es exigible, el impuesto se devenga a 31 de diciembre por la parte proporcional del período transcurrido desde el inicio. De octubre a diciembre de 2025 son 3 meses: 3 x 1.200 = 3.600 euros. Un mes, cuatro meses o un año no coinciden con ese período."
  citation: "art. 75.Uno.7.º LIVA"
  difficulty: 2
  tags:
  - "devengo"
  - "tracto sucesivo"
  - "cómputo"
# anchor: boe-a-1992-28740-art-75
- id: m03-l19-q0012
  prompt:
    es: "¿Cuándo se devenga el impuesto en las operaciones sujetas a gravamen que originen pagos anticipados anteriores a la realización del hecho imponible, según el artículo 75.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido?"
  options:
  - id: a
    text:
      es: "En el momento de la expedición de la factura por el importe total que figure en ella."
  - id: b
    text:
      es: "En el momento de la realización del hecho imponible por la totalidad del precio pactado."
  - id: c
    text:
      es: "En el momento del cobro total del precio, y nunca antes de que este se perciba por completo por el transmitente."
  - id: d
    correct: true
    text:
      es: "En el momento del cobro total o parcial del precio por los importes efectivamente percibidos."
  explanation:
    es: "Los pagos anticipados devengan el impuesto cuando se cobran, y por lo efectivamente cobrado, ya sea total o parcialmente. Esperar al cobro completo, a la realización del hecho imponible o a la factura contradice el precepto."
  citation: "art. 75.Dos LIVA"
  difficulty: 1
  tags:
  - "devengo"
  - "pagos anticipados"
# anchor: boe-a-1992-28740-art-76
- id: m03-l19-q0015
  prompt:
    es: "Conforme al artículo 76 de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, en las adquisiciones intracomunitarias de bienes, el impuesto se devenga en el momento en que se consideren efectuadas las entregas de bienes similares de conformidad con el artículo 75, y:"
  options:
  - id: a
    text:
      es: "es de aplicación el devengo de los derechos de importación de la legislación aduanera."
  - id: b
    correct: true
    text:
      es: "no es de aplicación el apartado dos del artículo 75, relativo a los pagos anticipados."
  - id: c
    text:
      es: "no es de aplicación el apartado uno del artículo 75, relativo a la puesta a disposición."
  - id: d
    text:
      es: "es de aplicación el apartado dos del artículo 75, relativo a los pagos anticipados."
  explanation:
    es: "El artículo 76 remite al 75 para el momento del devengo, pero excluye su apartado dos: los pagos anticipados no devengan por sí solos la adquisición intracomunitaria. El apartado uno sí se aplica por remisión, y los derechos de importación son la referencia de las importaciones."
  citation: "art. 76 LIVA"
  difficulty: 2
  tags:
  - "devengo"
  - "adquisiciones intracomunitarias"
# anchor: boe-a-1992-28740-art-77
- id: m03-l19-q0016
  prompt:
    es: "De acuerdo con el artículo 77.Uno de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido, en las importaciones de bienes el devengo del impuesto se produce en el momento en que hubiera tenido lugar el devengo de:"
  options:
  - id: a
    text:
      es: "los derechos de importación, de acuerdo con la legislación aduanera, solo si están sujetas a ellos."
  - id: b
    correct: true
    text:
      es: "los derechos de importación, de acuerdo con la legislación aduanera, estén o no sujetas a ellos."
  - id: c
    text:
      es: "los impuestos especiales, de acuerdo con su normativa, aunque la importación no esté sujeta a ellos."
  - id: d
    text:
      es: "las cuotas del impuesto en las entregas interiores, de acuerdo con el artículo 75 de la Ley."
  explanation:
    es: "El devengo de la importación sigue al de los derechos de importación conforme a la legislación aduanera, con independencia de que la importación esté o no sujeta a ellos. Limitarlo a las importaciones sujetas añade una condición que el texto excluye, y los impuestos especiales o el artículo 75 no son la referencia."
  citation: "art. 77.Uno LIVA"
  difficulty: 2
  tags:
  - "devengo"
  - "importaciones"
# anchor: boe-a-1992-28740-art-75
- id: m03-l19-q0218
  prompt:
    es: "Señale la respuesta CORRECTA sobre la regla de devengo en las operaciones que originan pagos anticipados, de acuerdo con el artículo 75.Dos de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    text:
      es: "No es aplicable a las prestaciones de servicios que se lleven a cabo de forma continuada durante más de un año."
  - id: b
    text:
      es: "No es aplicable a los arrendamientos y suministros, que se devengan cuando resulta exigible cada percepción."
  - id: c
    correct: true
    text:
      es: "No es aplicable a las entregas de bienes comprendidas en el artículo 25 de la propia Ley."
  - id: d
    text:
      es: "No es aplicable a las ejecuciones de obra con aportación de materiales cuando el cobro sea anterior a la entrega."
  explanation:
    es: "El impuesto se devenga en el momento del cobro total o parcial del precio por los importes efectivamente percibidos, y esta regla no es aplicable a las entregas de bienes comprendidas en el artículo 25 (art. 75.Dos). Es la única excepción que fija el apartado. Las prestaciones de servicios continuadas de más de un año solo escapan al cobro anticipado cuando no dan lugar a pagos anticipados, así que con pago anticipado la regla sí se aplica (art. 75.Uno.2.º). Tampoco están exceptuadas las ejecuciones de obra con aportación de materiales ni los arrendamientos y suministros: el apartado se refiere a todas las operaciones sujetas con pagos anticipados."
  citation: "art. 75.Dos LIVA"
  difficulty: 1
  tags:
  - "devengo"
  - "pagos anticipados"
# anchor: boe-a-1992-28740-art-75
- id: m03-l19-q0219
  prompt:
    es: "Señale la respuesta CORRECTA sobre el devengo en las prestaciones de servicios de duración superior a un año sin pagos anticipados cuyo destinatario es el sujeto pasivo conforme al artículo 84.Uno.2.º, de acuerdo con el artículo 75.Uno.2.º de la Ley 37/1992, de 28 de diciembre, del Impuesto sobre el Valor Añadido:"
  options:
  - id: a
    correct: true
    text:
      es: "Se devenga el 31 de diciembre de cada año por la parte proporcional correspondiente al período transcurrido desde el inicio o desde el anterior devengo."
  - id: b
    text:
      es: "Se devenga el 1 de enero de cada año por la parte proporcional correspondiente al año siguiente."
  - id: c
    text:
      es: "Se devenga una sola vez, al finalizar la prestación del servicio, por la totalidad de la contraprestación."
  - id: d
    text:
      es: "Se devenga el 31 de diciembre de cada año por la totalidad de la contraprestación pactada para toda la prestación."
  explanation:
    es: "En estas prestaciones, de duración superior a un año y sin pagos anticipados, el devengo se produce a 31 de diciembre de cada año por la parte proporcional correspondiente al período transcurrido desde el inicio de la operación o desde el anterior devengo (art. 75.Uno.2.º). Esperar al final de la prestación es la regla general de los servicios, pero la norma la sustituye aquí por devengos anuales. El 1 de enero y la parte del año siguiente invierten la fecha y el período. Devengar toda la contraprestación el 31 de diciembre ignora que solo se devenga la parte proporcional del período transcurrido."
  citation: "art. 75.Uno LIVA"
  difficulty: 2
  tags:
  - "devengo"
  - "prestaciones de servicios"
