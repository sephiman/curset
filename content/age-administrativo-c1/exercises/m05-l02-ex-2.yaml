# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q045
  prompt:
    es: "Según el artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué porcentajes del crédito inicial limitan el gasto de los ejercicios posteriores, por orden, del primero al cuarto?"
  options:
  - id: a
    text:
      es: "El 80, el 70, el 60 y el 50 por ciento."
  - id: b
    text:
      es: "El 70, el 50, el 50 y el 40 por ciento."
  - id: c
    correct: true
    text:
      es: "El 70, el 60, el 50 y el 50 por ciento."
  - id: d
    text:
      es: "El 60, el 50, el 40 y el 30 por ciento."
  explanation:
    es: "El primer ejercicio posterior admite el 70 por ciento del crédito inicial, el segundo el 60 y el tercero y el cuarto el 50. Las otras series recorren escalones distintos que la ley no recoge."
  citation: "art. 47.2 LGP"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q046
  prompt:
    es: "El crédito inicial de una operación plurianual es de 950.000 euros. Según el artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cuánto puede imputarse como máximo al ejercicio inmediato siguiente?"
  options:
  - id: a
    text:
      es: "570.000 euros."
  - id: b
    correct: true
    text:
      es: "665.000 euros."
  - id: c
    text:
      es: "475.000 euros."
  - id: d
    text:
      es: "855.000 euros."
  explanation:
    es: "El ejercicio inmediato siguiente admite el 70 por ciento del crédito inicial: 950.000 × 0,70 = 665.000 euros. Los 570.000 son el 60 por ciento, los 475.000 el 50 por ciento y los 855.000 el 90 por ciento, un porcentaje que la ley no contempla."
  citation: "art. 47.2 LGP"
  difficulty: 1
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q047
  prompt:
    es: "El crédito inicial de una operación plurianual es de 640.000 euros. Conforme al artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cuánto puede imputarse como máximo al segundo ejercicio posterior?"
  options:
  - id: a
    correct: true
    text:
      es: "384.000 euros."
  - id: b
    text:
      es: "448.000 euros."
  - id: c
    text:
      es: "320.000 euros."
  - id: d
    text:
      es: "256.000 euros."
  explanation:
    es: "El segundo ejercicio admite el 60 por ciento del crédito inicial: 640.000 × 0,60 = 384.000 euros. Los 448.000 son el 70 por ciento, los 320.000 el 50 por ciento y los 256.000 el 40 por ciento."
  citation: "art. 47.2 LGP"
  difficulty: 1
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2003-21614-art-47
- id: m05-l02-q048
  prompt:
    es: "El crédito inicial de una operación plurianual es de 840.000 euros. Según el artículo 47.2 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿cuánto puede imputarse como máximo al cuarto ejercicio posterior?"
  options:
  - id: a
    text:
      es: "588.000 euros."
  - id: b
    text:
      es: "504.000 euros."
  - id: c
    correct: true
    text:
      es: "420.000 euros."
  - id: d
    text:
      es: "630.000 euros."
  explanation:
    es: "El tercer y el cuarto ejercicio admiten el 50 por ciento del crédito inicial: 840.000 × 0,50 = 420.000 euros. Los 588.000 son el 70 por ciento, los 504.000 el 60 por ciento y los 630.000 el 75 por ciento."
