- id: g-self-invocation
  term:
    en: self invocation
  definition:
    en: A method within the target object calling another method of the target object, which in proxy mode does not lead to an actual transaction at runtime even if the invoked method is marked with @Transactional.
  origin: m01-l04
  citation: spring-fw-tx-declarative-annotations#using-transactional
- id: g-common-pool
  term:
    en: common pool
  definition:
    en: The static ForkJoinPool returned by ForkJoinPool.commonPool(), used by any ForkJoinTask that is not explicitly submitted to a specified pool.
  origin: m01-l04
  citation: javadoc-forkjoinpool#class-forkjoinpool
- id: g-work-stealing
  term:
    en: work-stealing
  definition:
    en: 'The way a ForkJoinPool runs tasks: all threads in the pool attempt to find and execute tasks submitted to the pool and/or created by other active tasks.'
  origin: m01-l04
  citation: javadoc-forkjoinpool#class-forkjoinpool
