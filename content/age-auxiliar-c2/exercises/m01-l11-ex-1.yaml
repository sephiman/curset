# anchor: boe-a-2015-10565-art-4
- id: m01-l11-q059
  prompt:
    es: "Una persona no ha iniciado un procedimiento administrativo, pero tiene derechos que pueden resultar afectados por la decisión que en él se adopte. ¿Cuál es su posición en ese procedimiento?"
  options:
  - id: a
    text:
      es: "Solo es interesada si se persona antes de la resolución definitiva."
  - id: b
    correct: true
    text:
      es: "Se la considera interesada en el procedimiento, sin más requisitos."
  - id: c
    text:
      es: "Solo es interesada si el órgano instructor la emplaza de forma expresa."
  - id: d
    text:
      es: "No es interesada, porque no ha promovido el procedimiento."
  explanation:
    es: "El artículo 4.1.b) LPAC considera interesados a «los que, sin haber iniciado el procedimiento, tengan derechos que puedan resultar afectados por la decisión que en el mismo se adopte». No pide nada más. La condición de personarse mientras no haya resolución definitiva es la de la letra c), para quien solo tiene intereses legítimos, no derechos. El emplazamiento por el instructor no es un requisito de la ley. Haber promovido el procedimiento es el caso de la letra a), no el único."
  citation: "art. 4.1.b) LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-5
- id: m01-l11-q126
  prompt:
    es: "Según el artículo 5.6 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿quién concede el plazo para subsanar la falta de acreditación de la representación, y de cuántos días es como regla?"
  options:
  - id: a
    text:
      es: "La oficina de registro, que debe conceder diez días al efecto."
  - id: b
    text:
      es: "El órgano administrativo, que debe conceder un mes al efecto."
  - id: c
    text:
      es: "El superior jerárquico del instructor, que debe conceder tres días."
  - id: d
    correct: true
    text:
      es: "El órgano administrativo, que debe conceder diez días al efecto."
  explanation:
    es: "El artículo 5.6 LPAC habla del «plazo de diez días que deberá conceder al efecto el órgano administrativo». Lo concede el órgano que tramita, no la oficina de registro ni el superior jerárquico del instructor. El plazo de la regla es de diez días, no de un mes ni de tres días."
  citation: "art. 5.6 LPAC"
  difficulty: 2
  tags:
  - "órgano"
  - "plazo"
# anchor: boe-a-2015-10565-art-5
- id: m01-l11-q127
  prompt:
    es: "Un representante presenta alegaciones sin acreditar su representación. El órgano le concede plazo y la acredita dentro de él. ¿Qué valor tienen esas alegaciones?"
  options:
  - id: a
    text:
      es: "Deben presentarse de nuevo, ya con la representación debidamente acreditada."
  - id: b
    text:
      es: "Valen solo desde la fecha en que se acreditó la representación ante el órgano."
  - id: c
    text:
      es: "Solo valen si el interesado las ratifica después de forma personal."
  - id: d
    correct: true
    text:
      es: "Valen como presentadas, porque el defecto se subsanó dentro del plazo concedido."
  explanation:
    es: "El artículo 5.6 LPAC dice que la falta de acreditación «no impedirá que se tenga por realizado el acto de que se trate», siempre que se aporte o se subsane en el plazo concedido. Las alegaciones valen tal como se presentaron: no hay que repetirlas ni pedir al interesado que las ratifique. Su fecha tampoco pasa a ser la del día en que se acreditó la representación, porque el acto se tiene por realizado."
  citation: "art. 5.6 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-3
- id: m01-l11-q346
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los patrimonios independientes o autónomos tienen capacidad de obrar ante las Administraciones Públicas cuando:"
  options:
  - id: a
    text:
      es: "Lo autorice el órgano competente."
  - id: b
    text:
      es: "Lo prevean sus propios estatutos o su escritura de constitución."
  - id: c
    text:
      es: "Lo reconozca una resolución judicial firme."
  - id: d
    correct: true
    text:
      es: "La Ley así lo declare expresamente."
  explanation:
    es: "Según el artículo 3.c), los grupos de afectados, las uniones y entidades sin personalidad jurídica y los patrimonios independientes o autónomos solo tienen capacidad de obrar cuando la Ley lo declare expresamente. No basta la autorización del órgano ante el que actúan, ni lo que digan sus estatutos o su escritura, ni una resolución judicial firme."
  citation: "art. 3.c) LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-5
- id: m01-l11-q347
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si los interesados con capacidad de obrar actúan por medio de representante, las actuaciones administrativas se entienden con:"
  options:
  - id: a
    correct: true
    text:
      es: "El representante, salvo manifestación expresa en contra del interesado."
  - id: b
    text:
      es: "El interesado, salvo que el representante pida lo contrario por escrito."
  - id: c
    text:
      es: "El interesado y el representante conjuntamente, en todo caso."
  - id: d
    text:
      es: "El representante, sin que el interesado pueda manifestar lo contrario."
  explanation:
    es: "El artículo 5.1 dice que las actuaciones se entienden con el representante, salvo manifestación expresa en contra del interesado. La decisión de entenderse con el interesado la toma este, no el representante. La actuación conjunta no es la regla, y la opción que niega al interesado toda manifestación en contra elimina la salvedad de la ley."
  citation: "art. 5.1 LPAC"
  difficulty: 2
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2015-10565-art-5
- id: m01-l11-q348
  prompt:
    es: "Señale la actuación en nombre de otra persona para la que debe acreditarse la representación, según el artículo 5.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Interponer recursos."
  - id: b
    text:
      es: "Realizar gestiones de mero trámite."
  - id: c
    text:
      es: "Consultar el estado de un expediente."
  - id: d
    text:
      es: "Pedir cita previa."
  explanation:
    es: "El artículo 5.3 exige acreditar la representación para formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir de acciones y renunciar a derechos. Para los actos y gestiones de mero trámite, como consultar un expediente o pedir cita, la representación se presume."
  citation: "art. 5.3 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-5
- id: m01-l11-q349
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la acreditación de la representación es correcta, conforme al artículo 5.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Puede hacerse por cualquier medio válido en Derecho que deje constancia fidedigna de su existencia."
  - id: b
    text:
      es: "Solo puede hacerse mediante escritura pública otorgada ante notario."
  - id: c
    text:
      es: "Solo puede hacerse mediante apoderamiento apud acta ante un funcionario."
  - id: d
    text:
      es: "Debe hacerse siempre mediante inscripción previa en el registro electrónico de apoderamientos."
  explanation:
    es: "El artículo 5.4 admite cualquier medio válido en Derecho que deje constancia fidedigna de la representación. La escritura notarial, el apoderamiento apud acta y la inscripción en el registro electrónico de apoderamientos son medios válidos, pero la ley no obliga a usar uno solo de ellos."
  citation: "art. 5.4 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-11
- id: m01-l11-q350
  prompt:
    es: "Según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, con carácter general, para cualquier actuación del procedimiento administrativo basta con que los interesados acrediten previamente:"
  options:
  - id: a
    text:
      es: "Su domicilio, mediante certificado de empadronamiento."
  - id: b
    text:
      es: "Su firma electrónica avanzada, en todo caso."
  - id: c
    text:
      es: "Su capacidad de obrar, ante el órgano competente para resolver el procedimiento."
  - id: d
    correct: true
    text:
      es: "Su identidad, mediante alguno de los medios de identificación que prevé la Ley."
  explanation:
    es: "El artículo 11.1 se conforma con que el interesado acredite previamente su identidad por alguno de los medios de identificación de la Ley. No pide el domicilio, ni la firma electrónica avanzada en todo caso, ni una acreditación previa de la capacidad de obrar."
  citation: "art. 11.1 LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-3
- id: m01-l11-q401
  prompt:
    es: "Conforme al artículo 3.b) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, los menores de edad tienen capacidad de obrar para los derechos cuya actuación permita el ordenamiento sin la asistencia de:"
  options:
  - id: a
    text:
      es: "El Ministerio Fiscal, en todo caso."
  - id: b
    text:
      es: "Un Abogado designado por el órgano."
  - id: c
    correct: true
    text:
      es: "Quien ejerza la patria potestad, tutela o curatela."
  - id: d
    text:
      es: "Un representante legal designado por el órgano que tramite el procedimiento."
  explanation:
    es: "El artículo 3.b) reconoce capacidad de obrar a los menores para los derechos e intereses cuya actuación esté permitida sin la asistencia de quien ejerza la patria potestad, tutela o curatela. No se requiere la intervención del Ministerio Fiscal, de un Abogado ni de un representante designado por el órgano."
  citation: "art. 3.b) LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-3
- id: m01-l11-q403
  prompt:
    es: "¿Cuál de las siguientes normas determina la capacidad de obrar de las personas físicas o jurídicas ante las Administraciones Públicas, conforme al artículo 3.a) de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Las normas del Derecho penal."
  - id: b
    correct: true
    text:
      es: "Las normas del Derecho civil."
  - id: c
    text:
      es: "Las normas del Derecho mercantil."
  - id: d
    text:
      es: "Las normas del Derecho administrativo."
  explanation:
    es: "El artículo 3.a) da capacidad de obrar ante las Administraciones a las personas físicas o jurídicas que la ostenten con arreglo a las normas civiles. Las normas del Derecho penal, mercantil y administrativo no son la referencia que fija ese apartado, aunque el interesado actúe ante una Administración."
  citation: "art. 3.a) LPAC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-11
- id: m01-l11-q404
  prompt:
    es: "¿Cuál de las siguientes actuaciones exige a los interesados el uso obligatorio de firma, conforme al artículo 11.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    text:
      es: "Ver el expediente."
  - id: b
    text:
      es: "Aportar documentos en el trámite de audiencia."
  - id: c
    correct: true
    text:
      es: "Interponer recursos."
  - id: d
    text:
      es: "Consultar el estado de su procedimiento en la sede electrónica."
  explanation:
    es: "El artículo 11.2 exige firma para formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir de acciones y renunciar a derechos. Ver el expediente, aportar documentos en la audiencia y consultar el estado del procedimiento en la sede electrónica no figuran en esa lista, y para ellos basta acreditar la identidad, como dice el artículo 11.1."
  citation: "art. 11.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-40
- id: m01-l11-q031
  prompt:
    es: "Según el artículo 40.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, notificará las resoluciones y actos administrativos a los interesados cuyos derechos e intereses resulten afectados:"
  options:
  - id: a
    text:
      es: "El órgano que haya instruido el procedimiento."
  - id: b
    text:
      es: "El superior jerárquico del órgano que los dicte."
  - id: c
    text:
      es: "La oficina de asistencia en materia de registro."
  - id: d
    correct: true
    text:
      es: "El órgano que dicte esas resoluciones y actos."
  explanation:
    es: "El artículo 40.1 dice: «El órgano que dicte las resoluciones y actos administrativos los notificará a los interesados cuyos derechos e intereses sean afectados por aquéllos». La obligación no recae en el instructor, en la oficina de registro ni en el superior jerárquico."
  citation: "art. 40.1 LPAC"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2015-10565-art-40
- id: m01-l11-q032
  prompt:
    es: "Conforme al artículo 40.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, toda notificación deberá ser cursada dentro del plazo de diez días contados:"
  options:
  - id: a
    text:
      es: "A partir de la fecha de la solicitud del interesado."
  - id: b
    correct: true
    text:
      es: "A partir de la fecha en que el acto haya sido dictado."
  - id: c
    text:
      es: "A partir de la fecha en que el acto se publique."
  - id: d
    text:
      es: "A partir de la fecha en que el acto sea firme."
  explanation:
    es: "El artículo 40.2 dice que la notificación «deberá ser cursada dentro del plazo de diez días a partir de la fecha en que el acto haya sido dictado». El plazo no cuenta desde la firmeza, desde la solicitud ni desde una publicación."
  citation: "art. 40.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2015-10565-art-30
- id: m01-l11-q034
  prompt:
    es: "Según el artículo 30.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, cuando los plazos se señalan por días, ¿cómo se entienden?"
  options:
  - id: a
    correct: true
    text:
      es: "Como hábiles, salvo que una ley o el Derecho de la Unión Europea exprese otro cómputo."
  - id: b
    text:
      es: "Como naturales, salvo que una ley o el Derecho de la Unión Europea exprese otro cómputo."
  - id: c
    text:
      es: "Como naturales, salvo que el órgano que dicte el acto disponga otra cosa."
  - id: d
    text:
      es: "Como hábiles, salvo que una disposición reglamentaria exprese otro cómputo distinto."
  explanation:
    es: "El artículo 30.2 dice: «Siempre que por Ley o en el Derecho de la Unión Europea no se exprese otro cómputo, cuando los plazos se señalen por días, se entiende que éstos son hábiles». La regla son los días hábiles, no los naturales. La excepción la fija una ley o el Derecho de la Unión Europea, no un reglamento ni el órgano que dicta el acto."
  citation: "art. 30.2 LPAC"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2015-10565-art-40
- id: m01-l11-q035
  prompt:
    es: "Según el artículo 40.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, además del texto íntegro de la resolución, ¿qué debe contener toda notificación?"
  options:
  - id: a
    text:
      es: "La indicación de si el acto es firme y la identidad de los demás interesados en el procedimiento."
  - id: b
    text:
      es: "La fecha en que el acto adquirirá firmeza si no se interpone recurso alguno contra él."
  - id: c
    correct: true
    text:
      es: "La indicación de si pone fin o no a la vía administrativa y los recursos que procedan."
  - id: d
    text:
      es: "El informe jurídico que sirvió de fundamento a la resolución notificada."
  explanation:
    es: "El artículo 40.2 exige el texto íntegro de la resolución «con indicación de si pone fin o no a la vía administrativa, la expresión de los recursos que procedan», el órgano ante el que presentarlos y el plazo. No exige identificar a los demás interesados ni adjuntar informes. Tampoco pide indicar la fecha de firmeza."
  citation: "art. 40.2 LPAC"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-41
- id: m01-l11-q037
  prompt:
    es: "De acuerdo con el artículo 41.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las notificaciones se practicarán en todo caso por medios electrónicos cuando:"
  options:
  - id: a
    text:
      es: "El interesado haya comunicado una dirección de correo electrónico."
  - id: b
    correct: true
    text:
      es: "El interesado resulte obligado a recibirlas por esta vía."
  - id: c
    text:
      es: "El acto que se notifique ponga fin a la vía administrativa."
  - id: d
    text:
      es: "El interesado haya presentado su solicitud por medios electrónicos."
  explanation:
    es: "El artículo 41.1 dice que las notificaciones se practicarán preferentemente por medios electrónicos «y, en todo caso, cuando el interesado resulte obligado a recibirlas por esta vía». Presentar la solicitud por medios electrónicos no basta por sí solo. El tipo de acto no decide el medio. La dirección de correo electrónico comunicada sirve para los avisos, no para practicar notificaciones."
  citation: "art. 41.1 LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-41
- id: m01-l11-q038
  prompt:
    es: "Según el artículo 41.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en qué supuesto podrán las Administraciones practicar las notificaciones por medios no electrónicos?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando el interesado comparezca espontáneamente en una oficina de asistencia en materia de registro y pida allí la notificación."
  - id: b
    text:
      es: "Cuando el interesado obligado a relacionarse electrónicamente pida por escrito que se le notifique en papel en su domicilio habitual."
  - id: c
    text:
      es: "Cuando el acto que haya de notificarse sea de gravamen o desfavorable para el interesado o su representante."
  - id: d
    text:
      es: "Cuando el interesado no haya accedido a una notificación electrónica anterior en el plazo de diez días naturales."
  explanation:
    es: "El artículo 41.1.a) permite la notificación no electrónica «con ocasión de la comparecencia espontánea del interesado o su representante en las oficinas de asistencia en materia de registro» cuando solicite en ese momento la notificación personal. El obligado a relacionarse electrónicamente no puede pedir el papel. El carácter desfavorable del acto no cambia el medio. Si no se accede a una notificación electrónica obligatoria en diez días naturales, se entiende rechazada (art. 43.2)."
  citation: "art. 41.1.a) LPAC"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-41
- id: m01-l11-q039
  prompt:
    es: "Conforme al artículo 41.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en ningún caso se efectuarán por medios electrónicos las notificaciones:"
  options:
  - id: a
    correct: true
    text:
      es: "Que contengan medios de pago a favor de los obligados, tales como cheques."
  - id: b
    text:
      es: "Que contengan actos de gravamen o desfavorables para el interesado."
  - id: c
    text:
      es: "Que se practiquen en procedimientos de carácter sancionador."
  - id: d
    text:
      es: "Que vayan dirigidas a personas físicas no obligadas a relacionarse electrónicamente."
  explanation:
    es: "El artículo 41.2.b) excluye «las que contengan medios de pago a favor de los obligados, tales como cheques». Las personas no obligadas pueden elegir que se les notifique por medios electrónicos (art. 41.1). Ni los actos de gravamen ni los procedimientos sancionadores figuran en el artículo 41.2."
  citation: "art. 41.2.b) LPAC"
  difficulty: 1
  tags:
  - "excepción"
# anchor: boe-a-2015-10565-art-41
- id: m01-l11-q040
  prompt:
    es: "Señale la respuesta correcta sobre el aviso de puesta a disposición de una notificación, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Su falta de práctica no impedirá que la notificación sea considerada plenamente válida."
  - id: b
    text:
      es: "Su falta de práctica determina la anulabilidad de la notificación, practicada en papel o electrónicamente."
  - id: c
    text:
      es: "Se envía al interesado sólo si lo pide de nuevo en cada procedimiento."
  - id: d
    text:
      es: "Sólo se envía cuando la notificación se practica por medios electrónicos."
  explanation:
    es: "El artículo 41.6 dice: «La falta de práctica de este aviso no impedirá que la notificación sea considerada plenamente válida». El aviso se envía «con independencia de que la notificación se realice en papel o por medios electrónicos». Va al dispositivo o a la dirección de correo que el interesado haya comunicado; no hay que pedirlo en cada procedimiento."
  citation: "art. 41.6 LPAC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2015-10565-art-42
- id: m01-l11-q042
  prompt:
    es: "De acuerdo con el artículo 42.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, todas las notificaciones que se practiquen en papel deberán:"
  options:
  - id: a
    text:
      es: "Ser publicadas además en el tablón de edictos de la Administración u Organismo actuante."
  - id: b
    text:
      es: "Ser remitidas también, en formato electrónico, a la dirección de correo electrónico que el interesado haya comunicado."
  - id: c
    text:
      es: "Ser entregadas en mano al interesado por un empleado público de la Administración notificante."
  - id: d
    correct: true
    text:
      es: "Ser puestas a disposición del interesado en la sede electrónica de la Administración u Organismo actuante."
  explanation:
    es: "El artículo 42.1 dice que todas las notificaciones en papel «deberán ser puestas a disposición del interesado en la sede electrónica de la Administración u Organismo actuante». El tablón de edictos no es una regla general: el artículo 44 lo prevé como publicación facultativa y previa en la notificación infructuosa, con el anuncio en el «Boletín Oficial del Estado» como vía principal. La copia por correo electrónico no sustituye a la sede: el artículo 41.6 manda enviar un aviso a la dirección que el interesado haya comunicado, y su falta de práctica no invalida la notificación. La entrega en mano por un empleado público no es la regla del artículo 42.1: es la regla del domicilio del artículo 42.2, donde puede recibirla cualquier persona mayor de catorce años."
  citation: "art. 42.1 LPAC"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-42
- id: m01-l11-q044
  prompt:
    es: "Según el artículo 42.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, si nadie se hace cargo de la notificación en el domicilio, ¿cómo se repetirá el intento?"
  options:
  - id: a
    text:
      es: "Hasta dos veces y en horas distintas dentro de los tres días siguientes."
  - id: b
    text:
      es: "Por una sola vez y a la misma hora dentro de los diez días siguientes."
  - id: c
    text:
      es: "Por una sola vez y en hora distinta dentro de los quince días siguientes."
  - id: d
    correct: true
    text:
      es: "Por una sola vez y en una hora distinta dentro de los tres días siguientes."
  explanation:
    es: "El artículo 42.2 dice que el intento «se repetirá por una sola vez y en una hora distinta dentro de los tres días siguientes». No hay dos repeticiones. La hora tiene que ser distinta. El plazo es de tres días, no de diez ni de quince."
  citation: "art. 42.2 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "procedimiento"
# anchor: boe-a-2015-10565-art-43
- id: m01-l11-q046
  prompt:
    es: "Según el artículo 43.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las notificaciones por medios electrónicos se practicarán:"
  options:
  - id: a
    text:
      es: "Mediante su envío a la dirección de correo electrónico o al dispositivo que el interesado haya comunicado a la Administración."
  - id: b
    text:
      es: "Sólo a través de la dirección electrónica habilitada única, sin que quepa nunca la comparecencia en la sede electrónica."
  - id: c
    correct: true
    text:
      es: "Mediante comparecencia en la sede electrónica, a través de la dirección electrónica habilitada única o por ambos sistemas."
  - id: d
    text:
      es: "Sólo mediante comparecencia en la sede electrónica, sin que quepa usar la dirección electrónica habilitada."
  explanation:
    es: "El artículo 43.1 dice que se practicarán «mediante comparecencia en la sede electrónica de la Administración u Organismo actuante, a través de la dirección electrónica habilitada única o mediante ambos sistemas, según disponga cada Administración u Organismo». El correo electrónico comunicado sirve para avisos, no para notificar. El artículo admite los dos sistemas y su uso conjunto; no excluye ninguno."
  citation: "art. 43.1 LPAC"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10565-art-43
- id: m01-l11-q047
  prompt:
    es: "¿Qué se entiende por comparecencia en la sede electrónica a efectos de la notificación electrónica, según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas?"
  options:
  - id: a
    correct: true
    text:
      es: "El acceso por el interesado o su representante debidamente identificado al contenido de la notificación."
  - id: b
    text:
      es: "La presencia física del interesado en la oficina de asistencia en materia de registro del órgano."
  - id: c
    text:
      es: "La puesta a disposición de la notificación en la sede electrónica de la Administración actuante."
  - id: d
    text:
      es: "La recepción en el dispositivo del interesado del aviso de puesta a disposición de la notificación."
  explanation:
    es: "El artículo 43.1 dice: «se entiende por comparecencia en la sede electrónica, el acceso por el interesado o su representante debidamente identificado al contenido de la notificación». Recibir el aviso no es acceder al contenido. La presencia en una oficina de registro es el supuesto de notificación no electrónica del artículo 41.1.a). La puesta a disposición es el paso previo al acceso, no la comparecencia."
  citation: "art. 43.1 LPAC"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10565-art-43
- id: m01-l11-q050
  prompt:
    es: "De acuerdo con el artículo 43.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la notificación electrónica se entiende rechazada a los diez días naturales sin acceso cuando:"
  options:
  - id: a
    correct: true
    text:
      es: "Sea de carácter obligatorio o haya sido expresamente elegida por el interesado."
  - id: b
    text:
      es: "Se haya enviado al interesado el aviso de su puesta a disposición en la sede electrónica."
  - id: c
    text:
      es: "Se haya intentado antes, sin éxito, la notificación en papel."
  - id: d
    text:
      es: "Contenga un acto de gravamen o desfavorable para el interesado o su representante."
  explanation:
    es: "El artículo 43.2 aplica el rechazo «cuando la notificación por medios electrónicos sea de carácter obligatorio, o haya sido expresamente elegida por el interesado». El aviso no es requisito: su falta no impide la validez de la notificación (art. 41.6). El contenido del acto no cuenta. El artículo no exige un intento previo en papel."
  citation: "art. 43.2 LPAC"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-10565-art-43
- id: m01-l11-q051
  prompt:
    es: "Según el artículo 43.4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, a efectos de las notificaciones, el Punto de Acceso General electrónico de la Administración funcionará como:"
  options:
  - id: a
    text:
      es: "Una sede electrónica."
  - id: b
    text:
      es: "Un registro electrónico general."
  - id: c
    text:
      es: "Una dirección electrónica habilitada única."
  - id: d
    correct: true
    text:
      es: "Un portal de acceso."
  explanation:
    es: "El artículo 43.4 dice que los interesados «podrán acceder a las notificaciones desde el Punto de Acceso General electrónico de la Administración, que funcionará como un portal de acceso». No lo define como sede electrónica, registro ni dirección electrónica habilitada única. La notificación se practica en la sede o en la dirección habilitada (art. 43.1)."
  citation: "art. 43.4 LPAC"
  difficulty: 2
  tags:
  - "concepto"
