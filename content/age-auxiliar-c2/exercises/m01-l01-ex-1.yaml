# anchor: boe-a-1978-31229-df
- id: m01-l01-q001
  prompt:
    es: "¿Cuándo entró en vigor la Constitución Española de 1978, según lo que dispone su propio texto sobre su entrada en vigor?"
  options:
  - id: a
    correct: true
    text:
      es: "El mismo día de la publicación de su texto oficial en el «Boletín Oficial del Estado»."
  - id: b
    text:
      es: "A los veinte días de su completa publicación en el «Boletín Oficial del Estado»."
  - id: c
    text:
      es: "El día siguiente al de la publicación de su texto oficial en el «Boletín Oficial del Estado»."
  - id: d
    text:
      es: "El día de su sanción por el Rey, el 27 de diciembre de 1978."
  explanation:
    es: "La disposición final dice que la Constitución «entrará en vigor el mismo día de la publicación de su texto oficial en el boletín oficial del Estado». No hay vacatio de veinte días ni entrada en vigor al día siguiente. La sanción del Rey, el 27 de diciembre de 1978, es anterior a la publicación y no marca la entrada en vigor."
  citation: "disposición final CE"
  difficulty: 2
  tags:
  - "fecha"
  - "efecto"
# anchor: boe-a-1978-31229-dd-3
- id: m01-l01-q033
  prompt:
    es: "Según la disposición derogatoria 3 de la Constitución Española de 1978, además de las leyes y normas anteriores que enumera expresamente, quedan derogadas:"
  options:
  - id: a
    correct: true
    text:
      es: "Cuantas disposiciones se opongan a lo establecido en la Constitución."
  - id: b
    text:
      es: "Solo las disposiciones de rango legal que se opongan al título preliminar."
  - id: c
    text:
      es: "Únicamente las leyes anteriores a 1978 que contradigan los derechos fundamentales."
  - id: d
    text:
      es: "Las disposiciones que el Tribunal Constitucional declare contrarias a la Constitución."
  explanation:
    es: "La disposición derogatoria 3 deroga «cuantas disposiciones se opongan a lo establecido en esta Constitución», sin distinguir rango ni materia. Restringirla a las de rango legal y al título preliminar, o a las leyes anteriores sobre derechos fundamentales, añade límites que el texto no pone. La derogación la produce la propia Constitución, de modo que no necesita una declaración previa del Tribunal Constitucional."
  citation: "disposición derogatoria 3 CE"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1978-31229-art-137
- id: m01-l01-q034
  prompt:
    es: "Conforme al artículo 137 de la Constitución Española de 1978, que abre el título VIII, De la Organización Territorial del Estado, este se organiza territorialmente en:"
  options:
  - id: a
    text:
      es: "Municipios, comarcas y Comunidades Autónomas."
  - id: b
    text:
      es: "Provincias, regiones y nacionalidades."
  - id: c
    correct: true
    text:
      es: "Municipios, provincias y Comunidades Autónomas que se constituyan."
  - id: d
    text:
      es: "Municipios, provincias y áreas metropolitanas."
  explanation:
    es: "El artículo 137 enumera tres niveles: municipios, provincias y las Comunidades Autónomas que se constituyan. La opción de las comarcas sustituye a la provincia, que es uno de los tres. La de regiones y nacionalidades usa términos del artículo 2 y deja fuera al municipio. La que añade las áreas metropolitanas suma un cuarto nivel a los tres que cierra el artículo."
  citation: "art. 137 CE"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-1978-31229-art-168
- id: m01-l01-q036
  prompt:
    es: "¿Cuál de las siguientes reformas parciales de la Constitución Española de 1978 exige el procedimiento agravado, con aprobación del principio por dos tercios de cada Cámara y disolución de las Cortes?"
  options:
  - id: a
    correct: true
    text:
      es: "La que afecte a la sección 1.ª del capítulo segundo del título I."
  - id: b
    text:
      es: "La que afecte al capítulo tercero del título I."
  - id: c
    text:
      es: "La que afecte a la sección 2.ª del capítulo segundo del título I."
  - id: d
    text:
      es: "La que afecte al título III, De las Cortes Generales."
  explanation:
    es: "El artículo 168 cubre la revisión total y la parcial que afecte al título preliminar, a la sección 1.ª del capítulo segundo del título I o al título II. El capítulo tercero y la sección 2.ª del capítulo segundo pertenecen al título I, pero la lista del artículo solo nombra la sección 1.ª. El título III, De las Cortes Generales, tampoco es uno de los tres bloques de la lista. Esas tres reformas siguen el procedimiento del artículo 167."
  citation: "art. 168 CE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "excepción"
# anchor: boe-a-1978-31229-preambulo
- id: m01-l01-q109
  prompt:
    es: "¿Cuál de los siguientes órganos aprueba la Constitución, según la fórmula con la que el preámbulo de la Constitución Española de 1978 presenta su texto?"
  options:
  - id: a
    text:
      es: "El Gobierno."
  - id: b
    text:
      es: "El Consejo de Estado."
  - id: c
    correct: true
    text:
      es: "Las Cortes."
  - id: d
    text:
      es: "El Rey."
  explanation:
    es: "La fórmula final del preámbulo dice que las Cortes aprueban y el pueblo español ratifica. La aprobación es de las Cortes. El Gobierno no interviene en esa fórmula. El Consejo de Estado es un órgano consultivo y tampoco aprueba el texto. El Rey sanciona la Constitución después, pero el preámbulo no le atribuye la aprobación."
  citation: "preámbulo CE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-1978-31229-dd-1
- id: m01-l01-q110
  prompt:
    es: "Conforme a la disposición derogatoria 1 de la Constitución Española de 1978, queda derogada, entre otras normas anteriores, la Ley 1/1977, de 4 de enero, para:"
  options:
  - id: a
    text:
      es: "La Reforma Electoral."
  - id: b
    correct: true
    text:
      es: "La Reforma Política."
  - id: c
    text:
      es: "La Reforma Administrativa."
  - id: d
    text:
      es: "La Reforma Constitucional."
  explanation:
    es: "La disposición derogatoria 1 deroga la Ley 1/1977, de 4 de enero, para la Reforma Política. Las otras tres opciones cambian la materia por otra reforma que suena igual: la electoral, la administrativa y la constitucional. Ninguna es el título de esa ley."
  citation: "disposición derogatoria 1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-168
- id: m01-l01-q111
  prompt:
    es: "Conforme al artículo 168.1 de la Constitución Española de 1978, la aprobación del principio de una revisión total de la Constitución exige, antes de disolver las Cortes, una mayoría de:"
  options:
  - id: a
    text:
      es: "Dos tercios del Congreso, sin votación del Senado."
  - id: b
    text:
      es: "Dos tercios del Congreso y tres quintos del Senado."
  - id: c
    text:
      es: "Tres cuartos de cada una de las Cámaras."
  - id: d
    correct: true
    text:
      es: "Dos tercios de cada Cámara."
  explanation:
    es: "El artículo 168.1 pide aprobar el principio por mayoría de dos tercios de cada Cámara, y disolver las Cortes de inmediato. La opción que deja fuera al Senado olvida que vota cada Cámara. La que mezcla dos tercios del Congreso con tres quintos del Senado fija una cifra distinta para cada una. Los tres cuartos son una mayoría que la Constitución no usa en este procedimiento."
  citation: "art. 168 CE"
  difficulty: 3
  tags:
  - "mayoría"
  - "procedimiento"
# anchor: boe-a-1978-31229-art-9
- id: m01-l01-q004
  prompt:
    es: "De acuerdo con el artículo 9.3 de la Constitución Española de 1978, entre otros principios, la Constitución garantiza la irretroactividad de:"
  options:
  - id: a
    correct: true
    text:
      es: "Las disposiciones sancionadoras no favorables o restrictivas de derechos individuales."
  - id: b
    text:
      es: "Las disposiciones sancionadoras favorables o ampliatorias de derechos individuales."
  - id: c
    text:
      es: "Todas las disposiciones de carácter general, salvo las de naturaleza tributaria."
  - id: d
    text:
      es: "Las leyes orgánicas que regulen el ejercicio de los derechos fundamentales."
  explanation:
    es: "El artículo 9.3 garantiza «la irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales». La opción de las disposiciones «favorables o ampliatorias» invierte el sentido: lo que se prohíbe aplicar hacia atrás es lo desfavorable. La irretroactividad no alcanza a todas las disposiciones generales ni se refiere a las leyes orgánicas de desarrollo de derechos."
  citation: "art. 9.3 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-1
- id: m01-l01-q037
  prompt:
    es: "Según la Constitución Española de 1978, en su título preliminar, España se constituye en un Estado que se define con los siguientes calificativos:"
  options:
  - id: a
    text:
      es: "Social, autonómico y democrático de Derecho."
  - id: b
    text:
      es: "Democrático y descentralizado de Derecho."
  - id: c
    text:
      es: "Federal y social, con una Monarquía como forma de Estado."
  - id: d
    correct: true
    text:
      es: "Social y democrático de Derecho."
  explanation:
    es: "El artículo 1.1 dice «Estado social y democrático de Derecho». El calificativo autonómico y el de descentralizado sustituyen uno de los dos adjetivos o añaden otro al texto. La opción federal contradice el modelo de organización territorial que fija el artículo 137: municipios, provincias y Comunidades Autónomas. La Monarquía es la forma política del Estado (artículo 1.3), no un calificativo del Estado de Derecho."
  citation: "art. 1.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-1
- id: m01-l01-q038
  prompt:
    es: "Señale la respuesta correcta sobre los valores superiores del ordenamiento jurídico que propugna España, según el artículo 1.1 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "La libertad, la justicia, la solidaridad y el pluralismo político."
  - id: b
    correct: true
    text:
      es: "La libertad, la justicia, la igualdad y el pluralismo político."
  - id: c
    text:
      es: "La libertad, la seguridad, la igualdad y la participación política."
  - id: d
    text:
      es: "La dignidad, la justicia, la igualdad y el pluralismo político."
  explanation:
    es: "Los valores superiores del artículo 1.1 son la libertad, la justicia, la igualdad y el pluralismo político. La solidaridad figura en el artículo 2, entre las nacionalidades y regiones, no entre los valores. La seguridad y la participación política cambian dos de los cuatro. La dignidad aparece en el artículo 10.1 como fundamento del orden político, no como valor superior del 1.1."
  citation: "art. 1.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-1
- id: m01-l01-q039
  prompt:
    es: "Conforme al artículo 1.2 de la Constitución Española de 1978, que forma parte del título preliminar junto con los artículos 1.1 y 1.3, los poderes del Estado emanan:"
  options:
  - id: a
    text:
      es: "De la Nación española, que es indisoluble."
  - id: b
    text:
      es: "De la Constitución, que los crea y los ordena."
  - id: c
    text:
      es: "De los Estatutos de Autonomía y de las leyes."
  - id: d
    correct: true
    text:
      es: "Del pueblo español, titular de la soberanía nacional."
  explanation:
    es: "El artículo 1.2 dice que la soberanía nacional reside en el pueblo español, «del que emanan los poderes del Estado». La Nación española es el sujeto de la unidad indisoluble del artículo 2, no el origen de los poderes. La Constitución los regula, pero no es la fuente de la que emanan. Los Estatutos de Autonomía y las leyes que los desarrollan son normas que se apoyan en esa soberanía, no su origen."
  citation: "art. 1.2 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-2
- id: m01-l01-q042
  prompt:
    es: "Conforme al artículo 2 de la Constitución Española de 1978, que sigue en el título preliminar al artículo que define el Estado, esta se fundamenta en:"
  options:
  - id: a
    correct: true
    text:
      es: "La indisoluble unidad de la Nación española."
  - id: b
    text:
      es: "La indisoluble unidad de los pueblos de España."
  - id: c
    text:
      es: "La soberanía compartida entre el Estado y las Comunidades Autónomas."
  - id: d
    text:
      es: "El principio de descentralización política del territorio del Estado."
  explanation:
    es: "El artículo 2 funda la Constitución en la indisoluble unidad de la Nación española, patria común e indivisible de todos los españoles. Hablar de unidad de los pueblos cambia el sujeto. La soberanía no se comparte con las Comunidades Autónomas: reside en el pueblo español. La descentralización sí se garantiza, pero como derecho a la autonomía, no como fundamento de la Constitución."
  citation: "art. 2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-2
- id: m01-l01-q043
  prompt:
    es: "Según el artículo 2 de la Constitución Española de 1978, esta reconoce y garantiza a las nacionalidades y regiones que integran la Nación española:"
  options:
  - id: a
    correct: true
    text:
      es: "El derecho a la autonomía, y la solidaridad entre todas ellas."
  - id: b
    text:
      es: "El derecho a la libre determinación."
  - id: c
    text:
      es: "El derecho a la soberanía."
  - id: d
    text:
      es: "Un régimen fiscal propio sin solidaridad."
  explanation:
    es: "El artículo 2 reconoce y garantiza el derecho a la autonomía de las nacionalidades y regiones y la solidaridad entre todas ellas. La libre determinación excede ese derecho y choca con la indisoluble unidad de la Nación en la que el propio artículo funda la Constitución. La soberanía no es de las nacionalidades y regiones: reside en el pueblo español (artículo 1.2). El régimen fiscal propio sin solidaridad contradice la garantía expresa de la solidaridad entre todas ellas."
  citation: "art. 2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-3
- id: m01-l01-q044
  prompt:
    es: "Conforme al artículo 3.1 de la Constitución Española de 1978, el castellano es la lengua española oficial del Estado y todos los españoles tienen respecto de ella:"
  options:
  - id: a
    text:
      es: "El derecho de conocerla y el deber de usarla."
  - id: b
    text:
      es: "El deber de conocerla y de usarla siempre."
  - id: c
    correct: true
    text:
      es: "El deber de conocerla y el derecho a usarla."
  - id: d
    text:
      es: "El derecho a conocerla y a usarla."
  explanation:
    es: "El artículo 3.1 impone el deber de conocerla y reconoce el derecho a usarla. La opción que invierte los términos pone el deber en usarla y el derecho en conocerla. La que extiende el deber de usarla a todas las Comunidades Autónomas ignora que el artículo 3.2 hace oficiales las demás lenguas en las respectivas Comunidades. La que elimina todo deber contradice la mitad inicial de la regla."
  citation: "art. 3.1 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-7
- id: m01-l01-q047
  prompt:
    es: "¿Cuál de las siguientes organizaciones debe tener, conforme al artículo 7 de la Constitución Española de 1978, una estructura interna y un funcionamiento democráticos?"
  options:
  - id: a
    text:
      es: "Las Fuerzas Armadas."
  - id: b
    correct: true
    text:
      es: "Los sindicatos de trabajadores y las asociaciones empresariales."
  - id: c
    text:
      es: "Las asociaciones de consumidores y usuarios."
  - id: d
    text:
      es: "Los municipios y las provincias."
  explanation:
    es: "El artículo 7 aplica ese requisito a los sindicatos de trabajadores y a las asociaciones empresariales, igual que el artículo 6 lo aplica a los partidos políticos. Las Fuerzas Armadas aparecen en el artículo 8.1 con otra función, la de defender la soberanía y el ordenamiento constitucional. Las asociaciones de consumidores y usuarios no son los sujetos del artículo 7, que habla de intereses económicos y sociales de trabajadores y empresarios. Los municipios y las provincias son entidades territoriales del artículo 137, no organizaciones de ese tipo."
  citation: "art. 7 CE"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-8
- id: m01-l01-q048
  prompt:
    es: "Señale la respuesta correcta sobre los Ejércitos que constituyen las Fuerzas Armadas, según el artículo 8.1 de la Constitución Española de 1978:"
  options:
  - id: a
    text:
      es: "El Ejército de Tierra, la Armada, el Ejército del Aire y la Guardia Civil."
  - id: b
    text:
      es: "El Ejército de Tierra, la Armada y la Infantería de Marina."
  - id: c
    text:
      es: "El Ejército de Tierra, el Ejército del Aire y el Cuerpo Nacional de Policía."
  - id: d
    correct: true
    text:
      es: "El Ejército de Tierra, la Armada y el Ejército del Aire."
  explanation:
    es: "El artículo 8.1 enumera el Ejército de Tierra, la Armada y el Ejército del Aire. La Guardia Civil y el Cuerpo Nacional de Policía no son Ejércitos, y el artículo cierra la lista en tres. La opción de la Infantería de Marina omite el Ejército del Aire, que sí es uno de los tres, y cita una unidad que no es uno de ellos."
  citation: "art. 8.1 CE"
  difficulty: 2
  tags:
  - "composición"
  - "órgano"
# anchor: boe-a-1978-31229-art-8
- id: m01-l01-q049
  prompt:
    es: "Conforme al artículo 8.1 de la Constitución Española de 1978, además de garantizar la soberanía e independencia de España, las Fuerzas Armadas tienen como misión:"
  options:
  - id: a
    correct: true
    text:
      es: "Defender su integridad territorial y el ordenamiento constitucional."
  - id: b
    text:
      es: "Mantener el orden público y garantizar la seguridad."
  - id: c
    text:
      es: "Proteger el libre ejercicio de los derechos y libertades."
  - id: d
    text:
      es: "Defender la unidad de la Nación y la forma política del Estado."
  explanation:
    es: "Junto a garantizar la soberanía e independencia, el artículo 8.1 les encomienda defender la integridad territorial de España y el ordenamiento constitucional. El orden público, la seguridad y la protección del libre ejercicio de los derechos son misiones de otro tipo: el artículo limita la misión de las Fuerzas Armadas a esos cuatro objetos. La defensa de la unidad de la Nación y de la forma política sustituye «integridad territorial» y «ordenamiento constitucional» por conceptos distintos."
  citation: "art. 8.1 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-9
- id: m01-l01-q050
  prompt:
    es: "Conforme al artículo 9.1 de la Constitución Española de 1978, la sujeción de los ciudadanos y de los poderes públicos se establece respecto de:"
  options:
  - id: a
    text:
      es: "La Constitución, salvo las normas reglamentarias."
  - id: b
    text:
      es: "La Constitución y las leyes orgánicas."
  - id: c
    correct: true
    text:
      es: "La Constitución y el resto del ordenamiento jurídico."
  - id: d
    text:
      es: "El ordenamiento jurídico, sin la Constitución."
  explanation:
    es: "El artículo 9.1 sujeta a ciudadanos y poderes públicos a la Constitución y al resto del ordenamiento jurídico, sin excepciones por rango. Excluir las normas reglamentarias o limitarse a las leyes orgánicas recorta el ordenamiento. Dejar fuera a la Constitución invierte la regla: la sujeción a ella va primero."
  citation: "art. 9.1 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-9
- id: m01-l01-q051
  prompt:
    es: "Conforme al artículo 9.3 de la Constitución Española de 1978, la Constitución garantiza el principio de legalidad, la jerarquía normativa, la publicidad de las normas y, entre otros:"
  options:
  - id: a
    text:
      es: "El principio de separación de poderes."
  - id: b
    text:
      es: "El principio de proporcionalidad de las sanciones."
  - id: c
    correct: true
    text:
      es: "El principio de seguridad jurídica."
  - id: d
    text:
      es: "El principio de presunción de inocencia."
  explanation:
    es: "La seguridad jurídica figura en el artículo 9.3 entre los principios garantizados. La enumeración es cerrada: legalidad, jerarquía normativa, publicidad de las normas, irretroactividad de las disposiciones sancionadoras no favorables, seguridad jurídica, responsabilidad e interdicción de la arbitrariedad. La separación de poderes, la proporcionalidad de las sanciones y la presunción de inocencia quedan fuera de ella."
  citation: "art. 9.3 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-9
- id: m01-l01-q052
  prompt:
    es: "¿Cuál de las siguientes garantías figura expresamente en la enumeración del artículo 9.3 de la Constitución Española de 1978, relativo a los principios del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "La interdicción de la arbitrariedad de los poderes públicos."
  - id: b
    text:
      es: "La proporcionalidad de las sanciones administrativas."
  - id: c
    text:
      es: "La presunción de legalidad de los actos de la Administración."
  - id: d
    text:
      es: "La separación entre el Gobierno y la Administración."
  explanation:
    es: "El artículo 9.3 garantiza, entre otros, la interdicción de la arbitrariedad de los poderes públicos. La proporcionalidad de las sanciones, la presunción de legalidad de los actos y la separación entre Gobierno y Administración son reglas que el ordenamiento conoce, pero ninguna se recoge en esa lista."
  citation: "art. 9.3 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-9
- id: m01-l01-q053
  prompt:
    es: "¿Cuál de los siguientes principios NO está garantizado expresamente por el artículo 9.3 de la Constitución Española de 1978, que enumera varias garantías?"
  options:
  - id: a
    text:
      es: "La publicidad de las normas."
  - id: b
    text:
      es: "La jerarquía normativa."
  - id: c
    text:
      es: "La responsabilidad de los poderes públicos."
  - id: d
    correct: true
    text:
      es: "La separación de poderes."
  explanation:
    es: "La separación de poderes queda fuera de la enumeración cerrada del artículo 9.3. La publicidad de las normas, la jerarquía normativa y la responsabilidad sí figuran en ella, junto con la legalidad, la irretroactividad de las disposiciones sancionadoras no favorables, la seguridad jurídica y la interdicción de la arbitrariedad."
  citation: "art. 9.3 CE"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-1
- id: m01-l01-q112
  prompt:
    es: "Según el artículo 1.2 de la Constitución Española de 1978, ¿qué reside en el pueblo español, del que a su vez emanan los poderes del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "La soberanía nacional."
  - id: b
    text:
      es: "La unidad de la Nación, que es indisoluble."
  - id: c
    text:
      es: "La jefatura del Estado, que ostenta el Rey."
  - id: d
    text:
      es: "El mando supremo de las Fuerzas Armadas."
  explanation:
    es: "El artículo 1.2 dice que la soberanía nacional reside en el pueblo español. La unidad de la Nación es el fundamento de la Constitución según el artículo 2, no algo que resida en el pueblo. La jefatura del Estado la ostenta el Rey, y el mando supremo de las Fuerzas Armadas es una función suya."
  citation: "art. 1.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-1
- id: m01-l01-q113
  prompt:
    es: "Conforme al artículo 1.3 de la Constitución Española de 1978, que cierra el artículo 1 del título preliminar, la forma política del Estado español es:"
  options:
  - id: a
    text:
      es: "La Monarquía absoluta."
  - id: b
    text:
      es: "La República federal."
  - id: c
    correct: true
    text:
      es: "La Monarquía parlamentaria."
  - id: d
    text:
      es: "La República parlamentaria."
  explanation:
    es: "El artículo 1.3 fija como forma política del Estado la Monarquía parlamentaria. La Monarquía absoluta mantiene la Corona y quita el carácter parlamentario. La República federal y la República parlamentaria sustituyen la Monarquía, que el artículo mantiene."
  citation: "art. 1.3 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-5
- id: m01-l01-q114
  prompt:
    es: "¿Cuál de las siguientes denominaciones da la Constitución Española de 1978, en su título preliminar, a Madrid como capital del Estado?"
  options:
  - id: a
    text:
      es: "La ciudad de Madrid."
  - id: b
    text:
      es: "La corte de Madrid."
  - id: c
    text:
      es: "El municipio de Madrid."
  - id: d
    correct: true
    text:
      es: "La villa de Madrid."
  explanation:
    es: "El artículo 5 dice que la capital del Estado es la villa de Madrid. Las otras tres opciones cambian la palabra: ciudad, corte y municipio. Ninguna aparece en el artículo."
  citation: "art. 5 CE"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-6
- id: m01-l01-q115
  prompt:
    es: "Señale la afirmación correcta sobre los partidos políticos, según lo que dispone el artículo 6 de la Constitución Española de 1978:"
  options:
  - id: a
    correct: true
    text:
      es: "Su estructura interna y su funcionamiento deberán ser democráticos."
  - id: b
    text:
      es: "Su estructura interna y su funcionamiento son libres dentro del respeto a la ley."
  - id: c
    text:
      es: "Su creación y el ejercicio de su actividad deberán ser democráticos."
  - id: d
    text:
      es: "Su creación exige la autorización previa del Gobierno de la Nación."
  explanation:
    es: "El artículo 6 exige que la estructura interna y el funcionamiento de los partidos sean democráticos. Lo que es libre, dentro del respeto a la Constitución y a la ley, es su creación y el ejercicio de su actividad: por eso la opción que declara libre la estructura interna y la que exige carácter democrático a la creación intercambian los dos elementos. La autorización previa del Gobierno contradice la libertad de creación."
  citation: "art. 6 CE"
  difficulty: 2
  tags:
  - "requisito"
