    es: "De acuerdo con el artículo 240, apartado 2, del Reglamento (UE) nº 952/2013 del Parlamento Europeo y del Consejo, de 9 de octubre de 2013, por el que se establece el código aduanero de la Unión, señale la respuesta CORRECTA sobre los depósitos aduaneros:"
  options:
  - id: a
    text:
