# anchor: boe-a-2007-6115-art-3
- id: m03-l07-q001
  prompt:
    es: "Según el artículo 3 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, el principio de igualdad de trato supone, en especial, la ausencia de las discriminaciones derivadas de:"
  options:
  - id: a
    correct: true
    text:
      es: "La maternidad, la asunción de obligaciones familiares y el estado civil"
  - id: b
    text:
      es: "La maternidad, la orientación sexual y la situación socioeconómica"
  - id: c
    text:
      es: "El embarazo, la lactancia y la reducción de jornada por cuidado"
  - id: d
    text:
      es: "La edad, la asunción de obligaciones familiares y la nacionalidad de la persona"
  explanation:
    es: "El artículo 3 nombra en especial las discriminaciones derivadas de «la maternidad, la asunción de obligaciones familiares y el estado civil». La orientación sexual y la situación socioeconómica no están en ese artículo. Tampoco el embarazo, la lactancia y la reducción de jornada, aunque la ley trate el embarazo en otro precepto. La edad y la nacionalidad tampoco figuran en la lista del artículo 3."
  citation: "art. 3 LO 3/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-6
- id: m03-l07-q002
  prompt:
    es: "¿Qué figura de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres consiste en tratar a una persona, en atención a su sexo, de manera menos favorable que a otra en situación comparable?"
  options:
  - id: a
    text:
      es: "Discriminación indirecta por razón de sexo"
  - id: b
    text:
      es: "Orden de discriminar por razón de sexo"
  - id: c
    correct: true
    text:
      es: "Discriminación directa por razón de sexo"
  - id: d
    text:
      es: "Discriminación por embarazo o maternidad"
  explanation:
    es: "El artículo 6.1 llama discriminación directa por razón de sexo a ese trato menos favorable que otra persona en situación comparable. La discriminación indirecta nace de una disposición, criterio o práctica aparentemente neutros (art. 6.2). La orden de discriminar es otra figura del artículo 6.3, que la ley considera discriminatoria. La discriminación por embarazo o maternidad es un supuesto concreto que regula el artículo 8."
  citation: "art. 6.1 LO 3/2007"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-6
- id: m03-l07-q003
  prompt:
    es: "¿Qué figura de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres se da cuando una disposición, criterio o práctica aparentemente neutros pone a personas de un sexo en desventaja particular?"
  options:
  - id: a
    text:
      es: "Discriminación directa por razón de sexo"
  - id: b
    correct: true
    text:
      es: "Discriminación indirecta por razón de sexo"
  - id: c
    text:
      es: "Orden de discriminar por razón de sexo"
  - id: d
    text:
      es: "Acoso por razón de sexo en el trabajo"
  explanation:
    es: "El artículo 6.2 define así la discriminación indirecta por razón de sexo. La discriminación directa es el trato menos favorable que otra persona en situación comparable (art. 6.1), sin una regla aparentemente neutra de por medio. La orden de discriminar es la figura del artículo 6.3. El acoso por razón de sexo es un comportamiento que atenta contra la dignidad (art. 7.2), no una disposición o práctica."
  citation: "art. 6.2 LO 3/2007"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-6
- id: m03-l07-q004
  prompt:
    es: "Según el artículo 6.2 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, una práctica aparentemente neutra que pone a un sexo en desventaja particular no es discriminación indirecta si:"
  options:
  - id: a
    text:
      es: "Se aplica por igual a todas las personas, con independencia de su sexo"
  - id: b
    text:
      es: "Está prevista en una norma con rango de ley publicada en el boletín oficial"
  - id: c
    text:
      es: "Afecta a menos del cuarenta por ciento de las personas del sexo que resulta perjudicado por ella"
  - id: d
    correct: true
    text:
      es: "Puede justificarse objetivamente por una finalidad legítima, con medios necesarios y adecuados"
  explanation:
    es: "El artículo 6.2 salva el caso en que la disposición, criterio o práctica pueda «justificarse objetivamente en atención a una finalidad legítima» con medios «necesarios y adecuados». Que la práctica se aplique por igual a todos es justo lo que la hace aparentemente neutra, y no la salva. La ley no exime a las prácticas previstas en una norma con rango de ley. Tampoco fija un umbral de personas afectadas."
  citation: "art. 6.2 LO 3/2007"
  difficulty: 3
  tags:
  - "excepción"
  - "concepto"
# anchor: boe-a-2007-6115-art-7
- id: m03-l07-q005
  prompt:
    es: "¿Cuál de los siguientes comportamientos constituye acoso sexual a los efectos de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres?"
  options:
  - id: a
    text:
      es: "Cualquier comportamiento realizado en función del sexo de una persona que atente contra su dignidad"
  - id: b
    text:
      es: "Solo el comportamiento físico de naturaleza sexual reiterado en el tiempo contra una misma persona"
  - id: c
    text:
      es: "Solo el comportamiento verbal de naturaleza sexual de un superior jerárquico hacia un subordinado"
  - id: d
    correct: true
    text:
      es: "Cualquier comportamiento, verbal o físico, de naturaleza sexual que atente contra la dignidad de una persona"
  explanation:
    es: "El artículo 7.1 llama acoso sexual a «cualquier comportamiento, verbal o físico, de naturaleza sexual» que tenga el propósito o produzca el efecto de atentar contra la dignidad de una persona. El comportamiento realizado en función del sexo de la persona es el acoso por razón de sexo del artículo 7.2. La ley no exige que el comportamiento sea físico ni que se repita. Tampoco lo limita al trato verbal de un superior jerárquico."
  citation: "art. 7.1 LO 3/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-7
- id: m03-l07-q006
  prompt:
    es: "Según el artículo 7.1 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, la definición de acoso sexual que esta ley da a sus efectos se establece:"
  options:
  - id: a
    text:
      es: "Con exclusión de las conductas que tipifica el Código Penal"
  - id: b
    correct: true
    text:
      es: "Sin perjuicio de lo establecido en el Código Penal"
  - id: c
    text:
      es: "Solo para las relaciones laborales y de empleo público"
  - id: d
    text:
      es: "Sin perjuicio de lo que dispongan los convenios colectivos"
  explanation:
    es: "El artículo 7.1 abre la definición con la cláusula «sin perjuicio de lo establecido en el Código Penal». No excluye las conductas que sean delito: deja a salvo el Código Penal. La definición no se limita al empleo, porque la ley rige en todos los ámbitos. La salvedad que hace el artículo es la del Código Penal, no la de los convenios colectivos."
  citation: "art. 7.1 LO 3/2007"
  difficulty: 3
  tags:
  - "concepto"
  - "excepción"
# anchor: boe-a-2007-6115-art-7
- id: m03-l07-q007
  prompt:
    es: "Según el artículo 7.2 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, constituye acoso por razón de sexo cualquier comportamiento realizado en función del sexo de una persona:"
  options:
  - id: a
    correct: true
    text:
      es: "Con el propósito o el efecto de atentar contra su dignidad y de crear un entorno intimidatorio, degradante u ofensivo"
  - id: b
    text:
      es: "Con el propósito de atentar contra su dignidad, siempre que se repita durante un periodo continuado de tiempo"
  - id: c
    text:
      es: "Que, siendo de naturaleza sexual, verbal o física, atente contra su libertad e indemnidad sexuales"
  - id: d
    text:
      es: "Que suponga para ella un trato menos favorable que el que recibe otra persona en una situación comparable a la suya"
  explanation:
    es: "El artículo 7.2 exige «el propósito o el efecto de atentar contra su dignidad y de crear un entorno intimidatorio, degradante u ofensivo». Basta el efecto, sin propósito, y la ley no pide que el comportamiento se repita. La naturaleza sexual es propia del acoso sexual del artículo 7.1. El trato menos favorable que otra persona en situación comparable define la discriminación directa del artículo 6.1."
  citation: "art. 7.2 LO 3/2007"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-7
- id: m03-l07-q008
  prompt:
    es: "Conforme a la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, el acoso por razón de sexo es un comportamiento que atenta contra la dignidad de una persona y se realiza:"
  options:
  - id: a
    text:
      es: "Con una naturaleza sexual, verbal o física"
  - id: b
    text:
      es: "Por quien sea o haya sido cónyuge de la víctima"
  - id: c
    correct: true
    text:
      es: "En función del sexo de la persona afectada"
  - id: d
    text:
      es: "Por un superior jerárquico de la persona afectada"
  explanation:
    es: "El artículo 7.2 define el acoso por razón de sexo como el comportamiento «realizado en función del sexo de una persona». La naturaleza sexual, verbal o física, es la nota del acoso sexual (art. 7.1). La relación de cónyuge o expareja delimita la violencia de género de la Ley Orgánica 1/2004, no este acoso. La ley no exige que el autor sea un superior jerárquico."
  citation: "art. 7.2 LO 3/2007"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-11
- id: m03-l07-q009
  prompt:
    es: "De acuerdo con el artículo 11.1 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, los Poderes Públicos adoptarán medidas específicas en favor de las mujeres para:"
  options:
  - id: a
    text:
      es: "Compensar la pérdida de retribuciones derivada de la maternidad y la lactancia"
  - id: b
    text:
      es: "Garantizar su presencia mayoritaria en los órganos de selección de personal"
  - id: c
    correct: true
    text:
      es: "Corregir situaciones patentes de desigualdad de hecho respecto de los hombres"
  - id: d
    text:
      es: "Sancionar las conductas de acoso sexual en el ámbito de las relaciones laborales"
  explanation:
    es: "El artículo 11.1 dice que las medidas se adoptan «para corregir situaciones patentes de desigualdad de hecho respecto de los hombres». No las vincula a compensar retribuciones. Los órganos de selección deben tener presencia equilibrada (art. 53), no mayoría de mujeres. Sancionar el acoso no es el fin de las acciones positivas."
  citation: "art. 11.1 LO 3/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-11
- id: m03-l07-q010
  prompt:
    es: "¿Durante cuánto tiempo son aplicables, según la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, las medidas específicas que adoptan los Poderes Públicos en favor de las mujeres?"
  options:
  - id: a
    correct: true
    text:
      es: "En tanto subsistan las situaciones de desigualdad de hecho que corrigen"
  - id: b
    text:
      es: "Durante un plazo máximo de cuatro años, prorrogable por otros cuatro"
  - id: c
    text:
      es: "Durante la legislatura en que las apruebe el Consejo de Ministros"
  - id: d
    text:
      es: "Con carácter indefinido, aunque desaparezcan las situaciones de desigualdad"
  explanation:
    es: "El artículo 11.1 dice que estas medidas «serán aplicables en tanto subsistan dichas situaciones» de desigualdad de hecho. La ley no fija un plazo de cuatro años ni lo liga a la legislatura. Tampoco son indefinidas: dejan de aplicarse cuando desaparece la desigualdad que corrigen."
  citation: "art. 11.1 LO 3/2007"
  difficulty: 2
  tags:
  - "plazo"
  - "requisito"
# anchor: boe-a-2007-6115-art-11
- id: m03-l07-q011
  prompt:
    es: "¿Cuál de los siguientes requisitos deben cumplir, según la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, las acciones positivas en relación con el objetivo perseguido en cada caso?"
  options:
  - id: a
    text:
      es: "Ser temporales y revisables cada año por el Gobierno"
  - id: b
    text:
      es: "Ser necesarias e imprescindibles para alcanzar ese objetivo"
  - id: c
    text:
      es: "Ser objetivas y motivadas en un informe de impacto de género"
  - id: d
    correct: true
    text:
      es: "Ser razonables y proporcionadas en relación con ese objetivo"
  explanation:
    es: "El artículo 11.1 dice que las medidas «habrán de ser razonables y proporcionadas en relación con el objetivo perseguido en cada caso». Son temporales porque duran mientras subsista la desigualdad, pero la ley no prevé una revisión anual. La ley no exige que sean imprescindibles. El informe de impacto de género acompaña a las convocatorias de pruebas selectivas (art. 55), no a estas medidas."
  citation: "art. 11.1 LO 3/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6115-art-45
- id: m03-l07-q012
  prompt:
    es: "¿A partir de cuántos trabajadores deben las empresas, según la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, dirigir sus medidas de igualdad a elaborar y aplicar un plan de igualdad?"
  options:
  - id: a
    text:
      es: "A partir de veinticinco trabajadores en plantilla"
  - id: b
    correct: true
    text:
      es: "A partir de cincuenta trabajadores en plantilla"
  - id: c
    text:
      es: "A partir de cien trabajadores en plantilla"
  - id: d
    text:
      es: "A partir de doscientos cincuenta trabajadores en plantilla"
  explanation:
    es: "El artículo 45.2 impone el plan de igualdad a «las empresas de cincuenta o más trabajadores». Veinticinco trabajadores queda por debajo de ese umbral. Cien y doscientos cincuenta trabajadores son cifras más altas que la ley no usa en este apartado."
  citation: "art. 45.2 LO 3/2007"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2007-6115-art-45
- id: m03-l07-q013
  prompt:
    es: "Según el artículo 45.2 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, en las empresas de cincuenta o más trabajadores las medidas de igualdad deberán dirigirse a:"
  options:
  - id: a
    text:
      es: "La obtención del distintivo empresarial en materia de igualdad"
  - id: b
    correct: true
    text:
      es: "La elaboración y aplicación de un plan de igualdad"
  - id: c
    text:
      es: "La creación de una unidad de igualdad en la dirección de la empresa"
  - id: d
    text:
      es: "La elaboración de un informe anual de impacto de género"
  explanation:
    es: "El artículo 45.2 dice que esas medidas «deberán dirigirse a la elaboración y aplicación de un plan de igualdad». El distintivo empresarial (art. 50) es voluntario y reconoce a las empresas que destacan en igualdad. Las unidades de igualdad son órganos de los Ministerios (art. 77). El informe de impacto de género acompaña a las convocatorias de pruebas selectivas (art. 55)."
  citation: "art. 45.2 LO 3/2007"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2007-6115-art-49
- id: m03-l07-q014
  prompt:
    es: "De acuerdo con el artículo 49 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, las medidas de fomento que el Gobierno establezca para impulsar la adopción voluntaria de planes de igualdad:"
  options:
  - id: a
    correct: true
    text:
      es: "Incluirán el apoyo técnico necesario"
  - id: b
    text:
      es: "Consistirán en reducciones de las cuotas empresariales a la Seguridad Social"
  - id: c
    text:
      es: "Requerirán que la empresa haya obtenido el distintivo en materia de igualdad"
  - id: d
    text:
      es: "Se dirigirán solo a las empresas obligadas por su convenio colectivo"
  explanation:
    es: "El artículo 49 dice que las medidas de fomento «incluirán el apoyo técnico necesario». No las concreta en reducciones de cuotas a la Seguridad Social. No exigen haber obtenido antes el distintivo del artículo 50. Van especialmente dirigidas a las pequeñas y medianas empresas, no solo a las obligadas por convenio, que además ya tendrían que elaborar el plan."
  citation: "art. 49 LO 3/2007"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2007-6115-art-49
- id: m03-l07-q015
  prompt:
    es: "¿A cuál de los siguientes grupos de empresas se dirigen especialmente las medidas de fomento de los planes de igualdad voluntarios, según la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres?"
  options:
  - id: a
    text:
      es: "A las empresas obligadas por convenio colectivo a tener plan"
  - id: b
    text:
      es: "A las empresas que ya hayan obtenido el distintivo de igualdad"
  - id: c
    correct: true
    text:
      es: "A las pequeñas y las medianas empresas"
  - id: d
    text:
      es: "A las empresas de trabajo temporal y a las cooperativas"
  explanation:
    es: "El artículo 49 dirige las medidas de fomento «especialmente» a «las pequeñas y las medianas empresas». Las empresas obligadas por convenio ya deben elaborar el plan (art. 45.3), de modo que su adopción no es voluntaria. El distintivo de igualdad es otra figura (art. 50) y no delimita a los destinatarios. La ley no menciona a las empresas de trabajo temporal ni a las cooperativas."
  citation: "art. 49 LO 3/2007"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2007-6115-da-primera
- id: m03-l07-q016
  prompt:
    es: "Conforme a la disposición adicional primera de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, hay composición equilibrada cuando, en el conjunto a que se refiera, las personas de cada sexo:"
  options:
  - id: a
    text:
      es: "No superen el cincuenta y cinco por ciento ni sean menos del cuarenta y cinco"
  - id: b
    correct: true
    text:
      es: "No superen el sesenta por ciento ni sean menos del cuarenta por ciento"
  - id: c
    text:
      es: "No superen los dos tercios del total ni sean menos de un tercio"
  - id: d
    text:
      es: "No superen el setenta por ciento ni sean menos del treinta por ciento"
  explanation:
    es: "La disposición adicional primera dice que las personas de cada sexo «no superen el sesenta por ciento ni sean menos del cuarenta por ciento». El margen del cincuenta y cinco y el cuarenta y cinco por ciento es más estrecho que el de la ley. Los dos tercios y el tercio, y el setenta y el treinta por ciento, son más amplios."
  citation: "disposición adicional primera LO 3/2007"
  difficulty: 1
  tags:
  - "cantidad"
  - "concepto"
# anchor: boe-a-2007-6115-da-primera
- id: m03-l07-q017
  prompt:
    es: "Un órgano de nueve miembros debe tener composición equilibrada en el sentido de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres. ¿Cuántas mujeres ha de tener, como mínimo?"
  options:
  - id: a
    text:
      es: "Un mínimo de tres mujeres"
  - id: b
    correct: true
    text:
      es: "Un mínimo de cuatro mujeres"
  - id: c
    text:
      es: "Un mínimo de cinco mujeres"
  - id: d
    text:
      es: "Un mínimo de seis mujeres"
  explanation:
    es: "Cada sexo debe estar entre el cuarenta y el sesenta por ciento del total (disposición adicional primera). El cuarenta por ciento de nueve es 3,6, así que hacen falta al menos cuatro mujeres. Con cuatro mujeres y cinco hombres, los hombres son el 55,6 por ciento, dentro del límite. Con tres mujeres solo hay un 33,3 por ciento. Cinco mujeres cumplen la regla, pero no son el mínimo. Seis mujeres son el 66,7 por ciento y superan el sesenta."
  citation: "disposición adicional primera LO 3/2007"
  difficulty: 3
  tags:
  - "cantidad"
  - "cómputo"
# anchor: boe-a-2007-6115-art-53
- id: m03-l07-q018
  prompt:
    es: "Según el artículo 53 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, los tribunales y órganos de selección de la Administración General del Estado responderán a la presencia equilibrada:"
  options:
  - id: a
    text:
      es: "Sin excepción alguna, cualquiera que sea el cuerpo o escala convocado"
  - id: b
    correct: true
    text:
      es: "Salvo por razones fundadas y objetivas, debidamente motivadas"
  - id: c
    text:
      es: "Salvo en los procesos selectivos de promoción interna del personal"
  - id: d
    text:
      es: "Salvo cuando lo autorice la Dirección General de la Función Pública"
  explanation:
    es: "El artículo 53 admite apartarse de la presencia equilibrada solo «por razones fundadas y objetivas, debidamente motivadas». Por eso no es una regla sin excepción. La ley no exceptúa la promoción interna. Tampoco somete la excepción a la autorización de un órgano: exige motivarla."
  citation: "art. 53 LO 3/2007"
  difficulty: 2
  tags:
  - "excepción"
  - "composición"
# anchor: boe-a-2007-6115-art-55
- id: m03-l07-q020
  prompt:
    es: "¿Qué informe debe acompañar, según la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, a la aprobación de convocatorias de pruebas selectivas para el acceso al empleo público?"
  options:
  - id: a
    text:
      es: "Un informe de la Comisión Interministerial de Igualdad"
  - id: b
    text:
      es: "Un informe de la unidad de igualdad del Ministerio"
  - id: c
    text:
      es: "Un dictamen del Consejo de Participación de la Mujer"
  - id: d
    correct: true
    text:
      es: "Un informe de impacto de género"
  explanation:
    es: "El artículo 55 exige que la aprobación de esas convocatorias se acompañe «de un informe de impacto de género». La Comisión Interministerial de Igualdad coordina las políticas de los departamentos (art. 76), no informa cada convocatoria. Las unidades de igualdad asesoran en la elaboración del informe de impacto (art. 77), pero no es su informe el que exige la ley. El Consejo de Participación de la Mujer es un órgano de consulta (art. 78) que no interviene aquí."
  citation: "art. 55 LO 3/2007"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2007-6115-art-55
- id: m03-l07-q021
  prompt:
    es: "Según el artículo 55 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, la aprobación de convocatorias de pruebas selectivas debe acompañarse de un informe de impacto de género, salvo:"
  options:
  - id: a
    text:
      es: "En las convocatorias de promoción interna"
  - id: b
    correct: true
    text:
      es: "En los casos de urgencia"
  - id: c
    text:
      es: "Cuando se convoquen menos de cinco plazas"
  - id: d
    text:
      es: "En las convocatorias de personal laboral"
  explanation:
    es: "La única salvedad del artículo 55 son los «casos de urgencia», y siempre sin perjuicio de la prohibición de discriminación por razón de sexo. La ley no exceptúa la promoción interna ni las convocatorias de personal laboral. Tampoco fija un número mínimo de plazas."
  citation: "art. 55 LO 3/2007"
  difficulty: 3
  tags:
  - "excepción"
# anchor: boe-a-2007-6115-art-64
- id: m03-l07-q022
  prompt:
    es: "Según el artículo 64 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, ¿quién aprueba el Plan para la Igualdad entre mujeres y hombres en la Administración General del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "El Gobierno, al inicio de cada legislatura"
  - id: b
    text:
      es: "El Ministerio de Igualdad, al inicio de cada legislatura"
  - id: c
    text:
      es: "Las Cortes Generales, al inicio de cada legislatura"
  - id: d
    text:
      es: "La Comisión Interministerial de Igualdad, al inicio de cada legislatura"
  explanation:
    es: "El artículo 64 dice que «el Gobierno aprobará, al inicio de cada legislatura», el Plan. El Ministerio de Igualdad no lo aprueba por sí solo. Las Cortes Generales no aprueban planes del Gobierno. La Comisión Interministerial de Igualdad coordina las políticas de los departamentos (art. 76), pero no aprueba este Plan."
  citation: "art. 64 LO 3/2007"
  difficulty: 1
  tags:
  - "órgano"
# anchor: boe-a-2007-6115-art-64
- id: m03-l07-q024
  prompt:
    es: "El Plan para la Igualdad entre mujeres y hombres en la Administración General del Estado y en sus organismos públicos lo aprueba el Gobierno:"
  options:
  - id: a
    text:
      es: "Con cada Ley de Presupuestos Generales del Estado"
  - id: b
    text:
      es: "Tras la evaluación anual del Consejo de Ministros"
  - id: c
    correct: true
    text:
      es: "Al inicio de cada legislatura"
  - id: d
    text:
      es: "Cada cuatro años, a propuesta de la Comisión Interministerial"
  explanation:
    es: "El artículo 64 de la Ley Orgánica 3/2007 dice que el Gobierno aprobará el Plan «al inicio de cada legislatura». No va unido a la Ley de Presupuestos. La evaluación anual del Consejo de Ministros mide su cumplimiento, no da lugar a un Plan nuevo. La ley no fija un periodo de cuatro años ni una propuesta de la Comisión Interministerial."
  citation: "art. 64 LO 3/2007"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2007-6115-art-76
- id: m03-l07-q025
  prompt:
    es: "Según el artículo 76 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, la Comisión Interministerial de Igualdad entre mujeres y hombres es:"
  options:
  - id: a
    correct: true
    text:
      es: "El órgano colegiado responsable de coordinar las políticas y medidas de igualdad adoptadas por los departamentos ministeriales"
  - id: b
    text:
      es: "El órgano directivo al que cada Ministerio encomienda las funciones relacionadas con el principio de igualdad"
  - id: c
    text:
      es: "El órgano colegiado de consulta y asesoramiento que sirve de cauce a la participación de las mujeres"
  - id: d
    text:
      es: "El órgano colegiado encargado de evaluar cada año el cumplimiento del Plan para la Igualdad en la Administración General del Estado"
  explanation:
    es: "El artículo 76 la define como «el órgano colegiado responsable de la coordinación de las políticas y medidas adoptadas por los departamentos ministeriales» en materia de igualdad. El órgano directivo de cada Ministerio con funciones de igualdad es la unidad de igualdad (art. 77). El órgano de consulta que canaliza la participación de las mujeres es el Consejo de Participación de la Mujer (art. 78). La evaluación anual del Plan corresponde al Consejo de Ministros (art. 64)."
  citation: "art. 76 LO 3/2007"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
