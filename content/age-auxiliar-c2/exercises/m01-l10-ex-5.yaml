# anchor: celex-12016m-txt-art-17
- id: m01-l10-q029
  prompt:
    es: "De acuerdo con el artículo 17 del Tratado de la Unión Europea, a partir del 1 de noviembre de 2014 la Comisión estará compuesta por un número de miembros correspondiente:"
  options:
  - id: a
    text:
      es: "A la mitad del número de Estados miembros, incluidos su Presidente y el Alto Representante, salvo que el Consejo Europeo decida por unanimidad modificarlo."
  - id: b
    correct: true
    text:
      es: "A los dos tercios del número de Estados miembros, incluidos su Presidente y el Alto Representante, salvo que el Consejo Europeo decida por unanimidad modificarlo."
  - id: c
    text:
      es: "A los dos tercios del número de Estados miembros, sin contar a su Presidente ni al Alto Representante."
  - id: d
    text:
      es: "A los dos tercios del número de Estados miembros, salvo que el Consejo decida por mayoría cualificada modificarlo."
  explanation:
    es: "El artículo 17.5 TUE dice que la Comisión estará compuesta «por un número de miembros correspondiente a los dos tercios del número de Estados miembros, que incluirá a su Presidente y al Alto Representante […], a menos que el Consejo Europeo decida por unanimidad modificar dicho número». La mitad cambia la fracción. El Presidente y el Alto Representante se cuentan dentro. Quien puede modificar el número es el Consejo Europeo por unanimidad, no el Consejo por mayoría cualificada."
  citation: "art. 17.5 TUE"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: fuente-ue-comision-europea-html
- id: m01-l10-q030
  prompt:
    es: "A fecha de 16 de octubre de 2026, según la ficha de la Comisión Europea en el portal oficial de la Unión, el liderazgo político de la Comisión lo forma un equipo de:"
  options:
  - id: a
    text:
      es: "Dieciocho comisarios, los dos tercios del número de países miembros, incluida la presidenta."
  - id: b
    text:
      es: "Veintiocho comisarios, uno de cada país miembro, más la presidenta."
  - id: c
    correct: true
    text:
      es: "Veintisiete comisarios, uno de cada país miembro, en el que se incluye a la presidenta."
  - id: d
    text:
      es: "Treinta comisarios, incluidos la presidenta y el Alto Representante."
  explanation:
    es: "La ficha de la Comisión en el portal de la Unión, consultada el 16-10-2026, dice que el liderazgo político corresponde a «un equipo de veintisiete comisarios, uno de cada país miembro, en el que se incluye a la presidenta de la Comisión». Dieciocho sería el resultado de aplicar los dos tercios del artículo 17.5 TUE, no la cifra de la ficha. La presidenta está dentro de los veintisiete, no se suma. Treinta no es la cifra de la ficha."
  citation: "fuente: `ue-comision-europea.html`"
  difficulty: 2
  tags:
  - "composición"
  - "cantidad"
# anchor: celex-12016m-txt-art-17
- id: m01-l10-q031
  prompt:
    es: "De acuerdo con el artículo 17 del Tratado de la Unión Europea, el candidato al cargo de Presidente de la Comisión:"
  options:
  - id: a
    text:
      es: "Lo propone el Consejo por unanimidad y lo elige el Parlamento Europeo por mayoría de los votos emitidos."
  - id: b
    text:
      es: "Lo propone el Parlamento Europeo y lo nombra el Consejo Europeo por unanimidad."
  - id: c
    text:
      es: "Lo propone el Consejo Europeo por mayoría cualificada y lo elige el Parlamento Europeo por mayoría de dos tercios."
  - id: d
    correct: true
    text:
      es: "Lo propone el Consejo Europeo por mayoría cualificada y lo elige el Parlamento Europeo por mayoría de los miembros que lo componen."
  explanation:
    es: "El artículo 17.7 TUE dice que el Consejo Europeo propondrá al Parlamento, «por mayoría cualificada, un candidato al cargo de Presidente de la Comisión», y que «el Parlamento Europeo elegirá al candidato por mayoría de los miembros que lo componen». No propone el Consejo ni el Parlamento. La mayoría de los votos emitidos y los dos tercios no son las del artículo."
  citation: "art. 17.7 TUE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "mayoría"
  - "órgano"
# anchor: celex-12016m-txt-art-17
- id: m01-l10-q032
  prompt:
    es: "Si el candidato a Presidente de la Comisión no obtiene en el Parlamento Europeo la mayoría necesaria, ¿qué prevé el Tratado de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "Que el Consejo Europeo proponga, en el plazo de un mes y por mayoría cualificada, un nuevo candidato."
  - id: b
    text:
      es: "Que el Consejo Europeo proponga, en el plazo de tres meses y por unanimidad, un nuevo candidato."
  - id: c
    text:
      es: "Que el Parlamento Europeo elija directamente a otro candidato de entre sus diputados."
  - id: d
    text:
      es: "Que el Consejo Europeo pueda nombrar al mismo candidato si lo acuerda por unanimidad."
  explanation:
    es: "El artículo 17.7 TUE dice: «Si el candidato no obtiene la mayoría necesaria, el Consejo Europeo propondrá en el plazo de un mes, por mayoría cualificada, un nuevo candidato». Tres meses y unanimidad cambian plazo y mayoría. El Parlamento no elige por su cuenta a otro candidato. El Consejo Europeo no puede imponer al candidato rechazado."
  citation: "art. 17.7 TUE"
  difficulty: 3
  tags:
  - "plazo"
  - "procedimiento"
# anchor: celex-12016m-txt-art-17
- id: m01-l10-q033
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre el nombramiento de la Comisión es correcta según el Tratado de la Unión Europea?"
  options:
  - id: a
    text:
      es: "Tras el voto de aprobación colegiado del Parlamento Europeo, el Consejo nombra la Comisión por unanimidad de sus miembros."
  - id: b
    correct: true
    text:
      es: "Tras el voto de aprobación colegiado del Parlamento Europeo, el Consejo Europeo nombra la Comisión por mayoría cualificada."
  - id: c
    text:
      es: "Cada comisario se somete individualmente a un voto de investidura del Parlamento y lo nombra el Presidente de la Comisión."
  - id: d
    text:
      es: "La lista de los demás miembros de la Comisión la adopta el Parlamento Europeo, de común acuerdo con el Presidente electo."
  explanation:
    es: "El artículo 17.7 TUE dice que el Presidente, el Alto Representante y los demás miembros «se someterán colegiadamente al voto de aprobación del Parlamento Europeo» y que, sobre esa base, «la Comisión será nombrada por el Consejo Europeo, por mayoría cualificada». No la nombra el Consejo, ni por unanimidad. El voto es colegiado, no individual. La lista la adopta el Consejo de común acuerdo con el Presidente electo, no el Parlamento."
  citation: "art. 17.7 TUE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "órgano"
# anchor: celex-12016e-txt-art-250
- id: m01-l10-q034
  prompt:
    es: "Según el artículo 250 del Tratado de Funcionamiento de la Unión Europea, ¿por qué mayoría se adoptan los acuerdos de la Comisión?"
  options:
  - id: a
    text:
      es: "Por mayoría de los votos emitidos."
  - id: b
    text:
      es: "Por mayoría cualificada de sus miembros."
  - id: c
    correct: true
    text:
      es: "Por mayoría de sus miembros."
  - id: d
    text:
      es: "Por consenso de todos sus miembros."
  explanation:
    es: "El artículo 250 TFUE dice que «los acuerdos de la Comisión se adoptarán por mayoría de sus miembros» y que su reglamento interno fija el quórum. La mayoría de los votos emitidos es la regla del Parlamento Europeo (art. 231 TFUE). La mayoría cualificada es la del Consejo (art. 16.3 TUE) y el consenso la del Consejo Europeo (art. 15.4 TUE)."
  citation: "art. 250 TFUE"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: celex-12016e-txt-art-247
- id: m01-l10-q035
  prompt:
    es: "De acuerdo con el artículo 247 del Tratado de Funcionamiento de la Unión Europea, el miembro de la Comisión que haya cometido una falta grave podrá ser cesado:"
  options:
  - id: a
    text:
      es: "Por el Parlamento Europeo, mediante una moción de censura individual."
  - id: b
    text:
      es: "Por el Consejo Europeo, por mayoría cualificada, a propuesta del Presidente de la Comisión."
  - id: c
    text:
      es: "Por el Tribunal de Justicia, a instancia del Parlamento Europeo, por mayoría de dos tercios."
  - id: d
    correct: true
    text:
      es: "Por el Tribunal de Justicia, a instancia del Consejo, por mayoría simple, o de la Comisión."
  explanation:
    es: "El artículo 247 TFUE dice que el miembro de la Comisión que haya cometido una falta grave «podrá ser cesado por el Tribunal de Justicia, a instancia del Consejo, por mayoría simple, o de la Comisión». La moción de censura del Parlamento es colectiva y afecta a toda la Comisión (art. 234 TFUE). El Consejo Europeo no cesa comisarios. El Parlamento no está entre quienes pueden instar el cese."
  citation: "art. 247 TFUE"
  difficulty: 3
  tags:
  - "órgano"
  - "procedimiento"
# anchor: celex-12016m-txt-art-17
- id: m01-l10-q100
  prompt:
    es: "Señale la función que corresponde a la Comisión, de acuerdo con el artículo 17.1 del Tratado de la Unión Europea:"
  options:
  - id: a
    text:
      es: "Garantizar el respeto del Derecho en la interpretación y aplicación de los Tratados."
  - id: b
    text:
      es: "Definir las orientaciones y prioridades políticas generales de la Unión."
  - id: c
    text:
      es: "Ejercer la función legislativa conjuntamente con el Parlamento Europeo."
  - id: d
    correct: true
    text:
      es: "Ejecutar el presupuesto y gestionar los programas."
  explanation:
    es: "La Comisión ejecuta el presupuesto y gestiona los programas. Garantizar el respeto del Derecho en la interpretación de los Tratados es función del Tribunal de Justicia. Definir las orientaciones y prioridades políticas generales corresponde al Consejo Europeo. La función legislativa la ejerce conjuntamente con el Parlamento el Consejo."
  citation: "art. 17.1 TUE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: celex-12016m-txt-art-17
- id: m01-l10-q101
  prompt:
    es: "Conforme al artículo 17.1 del Tratado de la Unión Europea, la Comisión asumirá la representación exterior de la Unión, con excepción de:"
  options:
  - id: a
    text:
      es: "La política comercial común y de los demás casos previstos por los Tratados."
  - id: b
    text:
      es: "La política agrícola común y de los demás casos previstos por los Tratados."
  - id: c
    correct: true
    text:
      es: "La política exterior y de seguridad común y de los demás casos previstos por los Tratados."
  - id: d
    text:
      es: "La política de competencia y de los demás casos previstos por los Tratados."
  explanation:
    es: "La Comisión representa a la Unión hacia el exterior, salvo en la política exterior y de seguridad común y en los demás casos previstos por los Tratados. La política comercial, la agrícola y la de competencia no son excepciones que el artículo recoja."
  citation: "art. 17.1 TUE"
  difficulty: 2
  tags:
  - "competencia"
# anchor: celex-12016m-txt-art-17
- id: m01-l10-q102
