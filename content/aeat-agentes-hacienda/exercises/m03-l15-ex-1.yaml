# anchor: boe-a-2006-20764-art-1
- id: m03-l15-q0001
  prompt:
    es: "De acuerdo con el artículo 1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el Impuesto sobre la Renta de las Personas Físicas es un tributo:"
  options:
  - id: a
    text:
      es: "de carácter personal y directo que grava, según los principios de generalidad, capacidad económica y no confiscatoriedad, la renta de las personas físicas."
  - id: b
    text:
      es: "de carácter real y directo que grava, según los principios de igualdad, generalidad y progresividad, la renta de las personas físicas."
  - id: c
    correct: true
    text:
      es: "de carácter personal y directo que grava, según los principios de igualdad, generalidad y progresividad, la renta de las personas físicas."
  - id: d
    text:
      es: "de carácter personal e indirecto que grava, según los principios de igualdad, generalidad y progresividad, la renta de las personas físicas."
  explanation:
    es: "El artículo 1 LIRPF define el impuesto como tributo personal y directo y fija tres principios: igualdad, generalidad y progresividad. La versión que lo presenta como real cambia su naturaleza, que atiende a las circunstancias personales y familiares. La que lo llama indirecto lo confunde con los impuestos que gravan el consumo. La lista de capacidad económica y no confiscatoriedad sustituye los principios del artículo por otros que este no menciona."
  citation: "art. 1 LIRPF"
  difficulty: 1
  tags:
  - "naturaleza"
# anchor: boe-a-2006-20764-art-2
- id: m03-l15-q0002
  prompt:
    es: "Señale la respuesta CORRECTA sobre el objeto del Impuesto sobre la Renta de las Personas Físicas, de acuerdo con el artículo 2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Es la renta del contribuyente obtenida en territorio español, cualquiera que sea la residencia del pagador."
  - id: b
    text:
      es: "Es la renta del contribuyente, con independencia del lugar donde se hubiesen producido, siempre que el pagador resida en territorio español."
  - id: c
    text:
      es: "Es la renta del contribuyente formada solo por sus rendimientos y por las ganancias y pérdidas patrimoniales, sin imputaciones de renta."
  - id: d
    correct: true
    text:
      es: "Es la renta del contribuyente, con independencia del lugar donde se hubiesen producido sus componentes y cualquiera que sea la residencia del pagador."
  explanation:
    es: "El objeto es la totalidad de rendimientos, ganancias y pérdidas patrimoniales e imputaciones de renta que establezca la ley, sin importar dónde se produjeron ni dónde reside el pagador (art. 2 LIRPF). Limitarlo al territorio español o exigir un pagador residente añade condiciones que el artículo no contiene. Excluir las imputaciones de renta deja fuera uno de los componentes que el propio artículo enumera."
  citation: "art. 2 LIRPF"
  difficulty: 2
  tags:
  - "objeto"
# anchor: boe-a-2006-20764-art-3
- id: m03-l15-q0003
  prompt:
    es: "Según el artículo 3.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cómo se configura el Impuesto sobre la Renta de las Personas Físicas respecto de las Comunidades Autónomas?"
  options:
  - id: a
    text:
      es: "Como un impuesto estatal no susceptible de cesión, aunque las Comunidades Autónomas participan en su recaudación mediante transferencias."
  - id: b
    text:
      es: "Como un impuesto cedido totalmente, en los términos de la Ley Orgánica de Financiación de las Comunidades Autónomas y de las normas de cesión de tributos del Estado a ellas."
  - id: c
    correct: true
    text:
      es: "Como un impuesto cedido parcialmente, en los términos de la Ley Orgánica de Financiación de las Comunidades Autónomas y de las normas de cesión de tributos."
  - id: d
    text:
      es: "Como un impuesto propio de cada Comunidad Autónoma, que lo regula con plena autonomía normativa y lo gestiona en su territorio."
  explanation:
    es: "El artículo 3.1 LIRPF lo declara impuesto cedido parcialmente. No está cedido totalmente, porque el Estado conserva parte de la recaudación y de la regulación. Tampoco es propio de las Comunidades Autónomas ni un impuesto estatal sin cesión alguna."
  citation: "art. 3.1 LIRPF"
  difficulty: 1
  tags:
  - "cesión"
# anchor: boe-a-2006-20764-art-3
- id: m03-l15-q0005
  prompt:
    es: "Según el artículo 3.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, si una Comunidad Autónoma de régimen común no ha asumido ni ejercido competencias normativas sobre el impuesto, ¿con qué elementos se exige la cuota líquida a sus residentes?"
  options:
  - id: a
    text:
      es: "Con las deducciones establecidas por el Estado y el mínimo personal y familiar de la última norma autonómica vigente."
  - id: b
    text:
      es: "Con el mínimo personal y familiar establecido por el Estado, sin deducciones, que corresponden en exclusiva a las Comunidades Autónomas."
  - id: c
    correct: true
    text:
      es: "Con el mínimo personal y familiar y las deducciones establecidos por el Estado."
  - id: d
    text:
      es: "Con el mínimo personal y familiar y las deducciones que fije el Reglamento del impuesto para esa Comunidad."
  explanation:
    es: "Si la Comunidad no ha asumido o ejercido las competencias, la cuota líquida se exige con el mínimo personal y familiar y las deducciones estatales (art. 3.3 LIRPF). El Reglamento no fija elementos específicos para cada Comunidad. Las deducciones estatales sí se aplican, y no hay una norma autonómica anterior a la que acudir."
  citation: "art. 3.3 LIRPF"
  difficulty: 2
  tags:
  - "cuota líquida"
# anchor: boe-a-2006-20764-art-4
- id: m03-l15-q0006
  prompt:
    es: "De acuerdo con el artículo 4 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el impuesto se aplica en todo el territorio español, sin perjuicio de los regímenes tributarios forales de concierto y convenio económico en vigor, respectivamente, en:"
  options:
  - id: a
    text:
      es: "la Comunidad Foral de Navarra y en las Ciudades de Ceuta y Melilla."
  - id: b
    text:
      es: "los Territorios Históricos del País Vasco y en la Comunidad Autónoma de Canarias."
  - id: c
    correct: true
    text:
      es: "los Territorios Históricos del País Vasco y en la Comunidad Foral de Navarra."
  - id: d
    text:
      es: "la Comunidad Foral de Navarra y en los Territorios Históricos del País Vasco."
  explanation:
    es: "El concierto económico corresponde al País Vasco y el convenio económico a Navarra, en ese orden (art. 4.2 LIRPF). La opción que invierte el orden atribuye el concierto a Navarra. Canarias, Ceuta y Melilla no tienen régimen foral: el artículo 4.3 solo ordena atender a sus especialidades."
  citation: "art. 4 LIRPF"
  difficulty: 2
  tags:
  - "territorio"
# anchor: boe-a-2006-20764-art-4
- id: m03-l15-q0007
  prompt:
    es: "Señale la respuesta CORRECTA sobre la aplicación del Impuesto sobre la Renta de las Personas Físicas en Canarias, Ceuta y Melilla, según el artículo 4 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    text:
      es: "Se aplica el régimen tributario foral de convenio económico, como en la Comunidad Foral de Navarra."
  - id: b
    correct: true
    text:
      es: "Se tienen en cuenta las especialidades previstas en su normativa específica y en la propia ley."
  - id: c
    text:
      es: "Se excluye la aplicación del impuesto, por tener un régimen económico y fiscal propio."
  - id: d
    text:
      es: "Se aplica sin especialidad alguna, porque el impuesto rige en todo el territorio español."
  explanation:
    es: "El artículo 4.3 LIRPF ordena atender a las especialidades de su normativa específica y de la propia ley. No se aplican los regímenes forales, que son solo los de concierto y convenio. El impuesto sí rige allí, y precisamente con esas especialidades, no sin ellas."
  citation: "art. 4.3 LIRPF"
  difficulty: 1
  tags:
  - "territorio"
# anchor: boe-a-2006-20764-art-5
- id: m03-l15-q0008
  prompt:
    es: "Según el artículo 5 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué efecto tiene lo establecido en la ley respecto de los tratados y convenios internacionales que hayan pasado a formar parte del ordenamiento interno?"
  options:
  - id: a
    correct: true
    text:
      es: "Se entiende sin perjuicio de lo dispuesto en dichos tratados y convenios internacionales."
  - id: b
    text:
      es: "Se aplica con carácter supletorio de lo dispuesto en dichos tratados y convenios internacionales, que se entienden derogados."
  - id: c
    text:
      es: "Solo cede ante los tratados y convenios internacionales ratificados con posterioridad a la ley."
  - id: d
    text:
      es: "Prevalece sobre lo dispuesto en dichos tratados y convenios internacionales, salvo pacto de reciprocidad."
  explanation:
    es: "El artículo 5 LIRPF dice que la ley se entiende sin perjuicio de los tratados y convenios internacionales incorporados al ordenamiento interno, de modo que estos se respetan. Ni prevalece la ley con excepción de la reciprocidad, ni los tratados quedan derogados, ni el artículo distingue según su fecha."
  citation: "art. 5 LIRPF"
  difficulty: 1
  tags:
  - "tratados"
# anchor: boe-a-2006-20764-art-4
- id: m03-l15-q0148
  prompt:
    es: "Según el artículo 4 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué ocurre con la aplicación del impuesto respecto de un contribuyente residente en Pamplona que obtiene rendimientos del trabajo?"
  options:
  - id: a
    text:
      es: "El impuesto se aplica sin perjuicio del régimen tributario foral de concierto económico en vigor en la Comunidad Foral de Navarra."
  - id: b
    text:
      es: "El impuesto se aplica sin especialidad alguna, porque rige por igual en todo el territorio español."
  - id: c
    correct: true
    text:
      es: "El impuesto se aplica sin perjuicio del régimen tributario foral de convenio económico en vigor en la Comunidad Foral de Navarra."
  - id: d
    text:
      es: "El impuesto no se aplica, porque la Comunidad Foral de Navarra tiene un régimen económico y fiscal propio, como Canarias."
  explanation:
    es: "Navarra tiene convenio económico y el País Vasco concierto, y la ley se aplica sin perjuicio de ambos (art. 4.1 y 4.2 LIRPF). Confundir el convenio con el concierto invierte los regímenes. Y no se aplica sin especialidad ni queda excluido: el impuesto rige en todo el territorio español salvo esas salvedades forales."
  citation: "art. 4 LIRPF"
  difficulty: 2
  tags:
  - "territorio"
# anchor: boe-a-2006-20764-art-6
- id: m03-l15-q0009
  prompt:
    es: "Conforme al artículo 6.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, componen la renta del contribuyente:"
  options:
  - id: a
    text:
      es: "los rendimientos del trabajo, los rendimientos del capital, los rendimientos de las actividades económicas y las ganancias patrimoniales, sin las pérdidas patrimoniales."
  - id: b
    text:
      es: "los rendimientos del trabajo, los rendimientos del capital, los rendimientos de las actividades económicas, las ganancias y pérdidas patrimoniales y las rentas exentas que se establezcan por ley."
  - id: c
    correct: true
    text:
      es: "los rendimientos del trabajo, los rendimientos del capital, los rendimientos de las actividades económicas, las ganancias y pérdidas patrimoniales y las imputaciones de renta que se establezcan por ley."
  - id: d
    text:
      es: "los rendimientos del trabajo, los rendimientos del capital, las ganancias y pérdidas patrimoniales y las imputaciones de renta, sin los rendimientos de las actividades económicas."
  explanation:
    es: "La renta se compone de cinco elementos: rendimientos del trabajo, del capital y de las actividades económicas, ganancias y pérdidas patrimoniales e imputaciones de renta establecidas por ley (art. 6.2 LIRPF). Las rentas exentas no figuran entre esos elementos. Las otras dos opciones suprimen un elemento, los rendimientos de actividades económicas o las pérdidas patrimoniales."
  citation: "art. 6.2 LIRPF"
  difficulty: 2
  tags:
  - "componentes"
# anchor: boe-a-2006-20764-art-6
- id: m03-l15-q0010
  prompt:
    es: "Según el artículo 6.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cómo se clasifica la renta a efectos de la determinación de la base imponible y del cálculo del impuesto?"
  options:
  - id: a
    text:
      es: "En renta regular y renta obtenida de forma irregular."
  - id: b
    correct: true
    text:
      es: "En renta general y renta del ahorro."
  - id: c
    text:
      es: "En renta ordinaria y renta extraordinaria."
  - id: d
    text:
      es: "En renta del trabajo y renta del capital."
  explanation:
    es: "La renta se clasifica en general y del ahorro (art. 6.3 LIRPF). Las demás denominaciones no son clasificaciones de la ley: los rendimientos del trabajo y del capital son componentes de la renta, no sus dos clases, y la irregularidad solo da lugar a una reducción en los rendimientos."
  citation: "art. 6.3 LIRPF"
  difficulty: 1
  tags:
  - "clasificación"
# anchor: boe-a-2006-20764-art-6
- id: m03-l15-q0011
  prompt:
    es: "De acuerdo con el artículo 6.4 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre la renta que se encuentra sujeta al Impuesto sobre Sucesiones y Donaciones:"
  options:
  - id: a
    text:
      es: "Está sujeta al Impuesto sobre la Renta de las Personas Físicas, pero exenta de gravamen."
  - id: b
    text:
      es: "Está sujeta al Impuesto sobre la Renta de las Personas Físicas solo cuando el causante era residente en España."
  - id: c
    correct: true
    text:
      es: "No está sujeta al Impuesto sobre la Renta de las Personas Físicas."
  - id: d
    text:
      es: "Está sujeta a ambos impuestos, con deducción en la cuota por la doble imposición."
  explanation:
    es: "La renta sujeta al Impuesto sobre Sucesiones y Donaciones no está sujeta al IRPF (art. 6.4 LIRPF). No es una exención, que presupone sujeción, ni hay doble imposición con deducción. Y la ley no distingue por la residencia del causante."
  citation: "art. 6.4 LIRPF"
  difficulty: 2
  tags:
  - "no sujeción"
# anchor: boe-a-2006-20764-art-6
- id: m03-l15-q0012
  prompt:
    es: "Según el artículo 6.5 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué se presume respecto de la prestación de servicios susceptibles de generar rendimientos del trabajo sin que se haya pactado contraprestación alguna?"
  options:
  - id: a
    text:
      es: "Que la prestación está retribuida, sin que se admita prueba en contrario."
  - id: b
    text:
      es: "Nada: la Administración debe probar en todo caso la existencia de retribución."
  - id: c
    correct: true
    text:
      es: "Que la prestación está retribuida, salvo prueba en contrario."
  - id: d
    text:
      es: "Que la prestación es gratuita, salvo prueba en contrario."
  explanation:
    es: "El artículo 6.5 LIRPF presume retribuidas las prestaciones de bienes, derechos o servicios susceptibles de generar rendimientos del trabajo o del capital, y admite prueba en contrario. La presunción de gratuidad invierte la regla. Una presunción sin prueba en contrario sería absoluta, y la ley no la establece. Y sí hay presunción: la carga de desvirtuarla recae en el contribuyente."
  citation: "art. 6.5 LIRPF"
  difficulty: 2
  tags:
  - "presunción"
# anchor: boe-a-2006-20764-art-6
- id: m03-l15-q0013
  prompt:
    es: "¿Cuál de los siguientes elementos NO compone la renta del contribuyente, de acuerdo con el artículo 6.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Las ganancias y pérdidas patrimoniales."
  - id: b
    correct: true
    text:
      es: "Las reducciones aplicables a la base imponible."
  - id: c
    text:
      es: "Las imputaciones de renta que se establezcan por ley."
  - id: d
    text:
      es: "Los rendimientos de las actividades económicas."
  explanation:
    es: "Las reducciones de la base imponible se aplican después de calcular la renta y no la componen. Las otras tres opciones figuran en la lista del artículo 6.2 LIRPF: ganancias y pérdidas patrimoniales, rendimientos de actividades económicas e imputaciones de renta por ley."
  citation: "art. 6.2 LIRPF"
  difficulty: 1
  tags:
  - "componentes"
  - "negativa"
# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0014
  prompt:
    es: "De acuerdo con el artículo 7.g) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, están exentas las pensiones por inutilidad o incapacidad permanente del régimen de clases pasivas, siempre que la lesión o enfermedad que hubiera sido causa de aquellas:"
  options:
  - id: a
    text:
      es: "le impidiera ejercer la profesión u oficio que desempeñaba habitualmente."
  - id: b
    text:
      es: "le inhabilitara para todo trabajo remunerado al servicio de las Administraciones Públicas."
  - id: c
    text:
      es: "supusiera un grado de discapacidad igual o superior al 65 por ciento."
  - id: d
    correct: true
    text:
      es: "inhabilitara por completo al perceptor de la pensión para toda profesión u oficio."
  explanation:
    es: "La exención del artículo 7.g) LIRPF exige que la lesión o enfermedad inhabilite por completo para toda profesión u oficio. Impedir solo la profesión habitual es un requisito más laxo. El ámbito público como límite y el grado de discapacidad del 65 por ciento son condiciones que el precepto no contiene: el 65 por ciento aparece en otro artículo, el 19.2.f), para el incremento de otros gastos."
  citation: "art. 7.g) LIRPF"
  difficulty: 1
  tags:
  - "exención"
# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0016
  prompt:
    es: "Según el artículo 7.x) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, están exentas las prestaciones económicas públicas vinculadas al servicio para cuidados en el entorno familiar, de asistencia personal y de cuidados y apoyos en viviendas que se derivan de la:"
  options:
  - id: a
    text:
      es: "Ley 49/2002, de 23 de diciembre, de régimen fiscal de las entidades sin fines lucrativos y de los incentivos fiscales al mecenazgo."
  - id: b
    text:
      es: "Real Decreto Legislativo 8/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley General de la Seguridad Social."
  - id: c
    correct: true
    text:
      es: "Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia."
  - id: d
    text:
      es: "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas."
  explanation:
    es: "La exención del artículo 7.x) LIRPF alcanza las prestaciones económicas vinculadas al servicio que derivan de la Ley 39/2006 de dependencia. La Ley 39/2015 regula el procedimiento administrativo. La Ley 49/2002 se cita en el artículo 7.j) por las becas de entidades sin fines lucrativos, y la Ley General de la Seguridad Social, en la letra h). Ninguna es la norma de la dependencia."
  citation: "art. 7.x) LIRPF"
  difficulty: 2
  tags:
  - "exención"
  - "dependencia"
# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0018
  prompt:
    es: "Conforme al artículo 7.z) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, están exentas las prestaciones y ayudas familiares percibidas de cualquiera de las Administraciones Públicas, ya sean vinculadas a:"
  options:
  - id: a
    correct: true
    text:
      es: "nacimiento, adopción, acogimiento o cuidado de hijos menores."
  - id: b
    text:
      es: "nacimiento, adopción, acogimiento o escolarización de hijos menores de edad."
  - id: c
    text:
      es: "nacimiento, adopción, acogimiento o cuidado de hijos menores o de mayores dependientes."
  - id: d
    text:
      es: "nacimiento, adopción o matrimonio, siempre que las abone la Administración General del Estado."
  explanation:
    es: "La letra z) exime las ayudas familiares de cualquier Administración Pública vinculadas a nacimiento, adopción, acogimiento o cuidado de hijos menores (art. 7.z) LIRPF). Los mayores dependientes y la escolarización no figuran en la letra. El matrimonio tampoco, y el precepto no limita el pagador a la Administración del Estado: dice cualquiera de las Administraciones Públicas."
  citation: "art. 7.z) LIRPF"
  difficulty: 1
  tags:
  - "exención"
# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0019
  prompt:
    es: "Según el artículo 7.z) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cómo tributa la ayuda de 1.000 euros que concede un ayuntamiento a un contribuyente por el nacimiento de su hija?"
  options:
  - id: a
    text:
      es: "Tributa como rendimiento del trabajo, porque la concede una entidad local."
  - id: b
    correct: true
    text:
      es: "Está exenta, por ser una ayuda familiar percibida de una Administración Pública vinculada al nacimiento de un hijo."
  - id: c
    text:
      es: "Tributa como ganancia patrimonial, por ser una ayuda pública sin contraprestación."
  - id: d
    text:
      es: "Está exenta solo si la concede la Administración General del Estado."
  explanation:
    es: "El ayuntamiento es una Administración Pública y la ayuda se vincula al nacimiento de un hijo, de modo que cae en la letra z) del artículo 7 LIRPF y está exenta. La letra no distingue entre Administraciones, por lo que no importa que sea local ni exige que sea la estatal. Al ser renta exenta, no tributa como rendimiento del trabajo ni como ganancia patrimonial."
  citation: "art. 7.z) LIRPF"
  difficulty: 1
  tags:
  - "exención"
# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0020
  prompt:
    es: "De acuerdo con el artículo 7.r) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, están exentas las prestaciones percibidas por entierro o sepelio, con el límite:"
  options:
  - id: a
    correct: true
    text:
      es: "del importe total de los gastos incurridos."
  - id: b
    text:
      es: "de 1.500 euros anuales por fallecido."
  - id: c
    text:
      es: "de tres veces el indicador público de renta de efectos múltiples."
  - id: d
    text:
      es: "del 50 por ciento de los gastos incurridos."
  explanation:
    es: "La exención por entierro o sepelio llega hasta el importe total de los gastos incurridos (art. 7.r) LIRPF). No hay un tope fijo de euros ni un porcentaje de los gastos. El múltiplo del indicador público de renta de efectos múltiples es el límite de otras letras del artículo 7, como la w), no el de la r)."
  citation: "art. 7.r) LIRPF"
  difficulty: 1
  tags:
  - "exención"
  - "límite"
# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0021
  prompt:
    es: "Tras el fallecimiento de su padre, Remedios Gil cobra en 2026 una prestación de 3.000 euros por entierro. Los gastos de sepelio que ha incurrido ascienden a 2.200 euros. Según el artículo 7.r) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué importe de la prestación está exento?"
  options:
  - id: a
    text:
      es: "3.000 euros, porque la exención no tiene límite."
  - id: b
    text:
      es: "1.500 euros, que es el límite anual fijo para esta prestación."
  - id: c
    correct: true
    text:
      es: "2.200 euros, que es el importe total de los gastos incurridos."
  - id: d
    text:
      es: "800 euros, que es la diferencia entre la prestación y los gastos."
  explanation:
    es: "La exención no excede de los gastos incurridos: 2.200 euros (art. 7.r) LIRPF). Quedan 800 euros por encima de ese límite, que no están exentos, y la diferencia no es la parte exenta. Tampoco la exención carece de límite ni existe un tope fijo de 1.500 euros."
  citation: "art. 7.r) LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "supuesto"
  - "exención"
# anchor: boe-a-2007-6820-art-2
- id: m03-l15-q0025
  prompt:
    es: "Conforme al artículo 2.1 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, para que las becas de entidades sin fines lucrativos y fundaciones bancarias cumplan los principios de la exención, es requisito que la adjudicación se lleve a cabo en régimen de:"
  options:
  - id: a
    text:
      es: "libre designación entre los candidatos que cumplan los requisitos de la convocatoria."
  - id: b
    correct: true
    text:
      es: "concurrencia competitiva."
  - id: c
    text:
      es: "sorteo público entre todos los solicitantes admitidos."
  - id: d
    text:
      es: "adjudicación directa por el órgano de gobierno de la entidad."
  explanation:
    es: "La adjudicación en régimen de concurrencia competitiva es el tercer requisito del artículo 2.1 RIRPF. La adjudicación directa, la libre designación y el sorteo suprimen la competencia entre candidatos que el precepto exige."
  citation: "art. 2.1 RIRPF"
  difficulty: 1
  tags:
  - "beca"
  - "requisitos"
# anchor: boe-a-2007-6820-art-2
- id: m03-l15-q0026
  prompt:
    es: "Según el artículo 2.1 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, no están exentas las ayudas al estudio de un Ente Público cuyos destinatarios sean exclusiva o fundamentalmente sus trabajadores o sus cónyuges o parientes, hasta el:"
  options:
  - id: a
    text:
      es: "cuarto grado inclusive, en línea directa o colateral, consanguínea o por afinidad."
  - id: b
    text:
      es: "tercer grado inclusive, solo en línea directa y por consanguinidad."
  - id: c
    correct: true
    text:
      es: "tercer grado inclusive, en línea directa o colateral, consanguínea o por afinidad."
  - id: d
    text:
      es: "segundo grado inclusive, en línea directa o colateral, consanguínea o por afinidad."
  explanation:
    es: "El parentesco llega hasta el tercer grado inclusive, en línea directa o colateral, por consanguinidad o afinidad (art. 2.1 RIRPF). Los grados segundo y cuarto cambian el alcance. Restringirlo a la línea directa y a la consanguinidad deja fuera a los colaterales y a los afines, que el reglamento incluye."
  citation: "art. 2.1 RIRPF"
  difficulty: 2
  tags:
  - "beca"
  - "grado"
# anchor: boe-a-2007-6820-art-2
- id: m03-l15-q0027
  prompt:
    es: "Según el artículo 2.1 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, las becas públicas percibidas para cursar estudios reglados están exentas cuando la concesión se ajuste a los principios de:"
  options:
  - id: a
    text:
      es: "generalidad, progresividad y capacidad económica de los beneficiarios de las becas."
  - id: b
    correct: true
    text:
      es: "mérito y capacidad, generalidad y no discriminación en las condiciones de acceso y publicidad de la convocatoria."
  - id: c
    text:
      es: "igualdad, mérito y capacidad, y transparencia en la adjudicación de las ayudas."
  - id: d
    text:
      es: "mérito y capacidad, concurrencia competitiva y publicidad de la convocatoria en el Boletín Oficial del Estado o de la comunidad autónoma."
  explanation:
    es: "Los principios son mérito y capacidad, generalidad y no discriminación en las condiciones de acceso y publicidad de la convocatoria (art. 2.1 RIRPF). La concurrencia competitiva es un requisito de las becas privadas, no un principio de las públicas. Las otras dos combinaciones sustituyen principios del reglamento por otros que este no cita."
  citation: "art. 2.1 RIRPF"
  difficulty: 2
  tags:
  - "beca"
  - "principios"
# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0030
  prompt:
    es: "Conforme al artículo 7.n) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, están exentas las prestaciones por desempleo reconocidas por la respectiva entidad gestora cuando se perciban:"
  options:
  - id: a
    text:
      es: "en la modalidad de pago único, con independencia del destino que se dé a las cantidades percibidas."
  - id: b
    text:
      es: "de forma periódica durante más de un año, siempre que el beneficiario no rechace ofertas de empleo."
  - id: c
    correct: true
    text:
      es: "en la modalidad de pago único, siempre que las cantidades se destinen a las finalidades y en los casos previstos en su norma reguladora."
  - id: d
    text:
      es: "en cualquier modalidad de pago, siempre que no excedan de tres veces el indicador público de renta de efectos múltiples."
  explanation:
    es: "La exención se reconoce al desempleo cobrado en pago único y condicionada a su destino a las finalidades y casos de la norma reguladora (art. 7.n) LIRPF). Ignorar el destino elimina la condición. Extenderla a cualquier modalidad convierte en exento todo el desempleo, cuando el artículo 17.1.b) lo incluye entre los rendimientos del trabajo. Y la percepción periódica no está prevista."
  citation: "art. 7.n) LIRPF"
  difficulty: 2
  tags:
  - "exención"
  - "desempleo"
# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0031
  prompt:
    es: "De acuerdo con el artículo 7.n) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, la exención del pago único del desempleo está condicionada al mantenimiento de la acción o participación durante el plazo de cinco años, en el supuesto de que el contribuyente se hubiera integrado en:"
  options:
  - id: a
    text:
      es: "sociedades de responsabilidad limitada, pero no cuando se integre en cooperativas de trabajo asociado."
  - id: b
    text:
      es: "sociedades laborales o cooperativas de trabajo asociado, pero no cuando aporte capital a una entidad mercantil."
  - id: c
    text:
      es: "una comunidad de bienes o una sociedad civil, o hubiera realizado una aportación a una entidad sin fines lucrativos."
  - id: d
    correct: true
    text:
      es: "sociedades laborales o cooperativas de trabajo asociado, o hubiera realizado una aportación al capital social de una entidad mercantil."
  explanation:
    es: "La condición de mantenimiento se aplica a quien se integra en sociedades laborales o cooperativas de trabajo asociado o aporta capital a una entidad mercantil (art. 7.n) LIRPF). Excluir la aportación a entidades mercantiles recorta el supuesto. Las comunidades de bienes y las sociedades civiles no son los destinos del precepto, ni lo son las entidades sin fines lucrativos, y no se limita a las sociedades de responsabilidad limitada."
  citation: "art. 7.n) LIRPF"
  difficulty: 3
  tags:
  - "exención"
  - "condición"
# anchor: boe-a-2006-20764-art-7
- id: m03-l15-q0032
  prompt:
    es: "Elena Paz, desempleada, cobra en mayo de 2026 el desempleo en pago único y lo aporta como capital a una sociedad laboral en la que se integra como socia. En junio de 2029 vende sus participaciones. Según el artículo 7.n) de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cumple la condición de mantenimiento?"
  options:
  - id: a
    text:
      es: "Sí, porque el plazo de mantenimiento de la participación es de tres años."
  - id: b
    text:
      es: "Sí, porque basta con haber mantenido la participación hasta el final del período impositivo siguiente."
  - id: c
    text:
      es: "No, porque el plazo de mantenimiento de la participación es de diez años."
  - id: d
    correct: true
    text:
      es: "No, porque debía mantener la participación durante cinco años y la vendió a los tres años y un mes."
  explanation:
    es: "El plazo de mantenimiento es de cinco años (art. 7.n) LIRPF). Desde mayo de 2026 llegaría hasta mayo de 2031, y Elena vende en junio de 2029, tras tres años y un mes. Ni tres años ni diez son el plazo de la ley, y no basta un período impositivo más."
  citation: "art. 7.n) LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "supuesto"
  - "plazo"
