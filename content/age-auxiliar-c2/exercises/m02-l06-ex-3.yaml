# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q052
  prompt:
    es: "En Windows 11, con varias ventanas abiertas, se pulsa Windows+D y, a continuación, se vuelve a pulsar. ¿Cuál de las siguientes describe lo que ocurre?"
  options:
  - id: a
    text:
      es: "Primero se muestran la fecha y la hora en el escritorio y después se ocultan"
  - id: b
    text:
      es: "Primero se abre la Vista de tareas y después se vuelve a cerrar"
  - id: c
    correct: true
    text:
      es: "Primero se muestra el escritorio y, con la segunda pulsación, se vuelve a ocultar"
  - id: d
    text:
      es: "Primero se crea otro escritorio y después se cierra el que se usa"
  explanation:
    es: "Windows+D sirve para «mostrar y ocultar el escritorio»: al pulsarla una vez se muestra y al pulsarla de nuevo se oculta. Mostrar y ocultar la fecha y la hora es Windows+Alt+D. La Vista de tareas se abre con Windows+Tab. Crear otro escritorio es Windows+Ctrl+D y cerrar el que se usa, Windows+Ctrl+F4."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q054
  prompt:
    es: "En Windows 11, ¿qué hace la combinación de teclas Windows+Alt+D según la tabla de métodos abreviados con la tecla Windows?"
  options:
  - id: a
    text:
      es: "Muestra y oculta todos los iconos del escritorio"
  - id: b
    text:
      es: "Crea otro escritorio y cambia a él directamente"
  - id: c
    correct: true
    text:
      es: "Muestra y oculta la fecha y la hora en el escritorio"
  - id: d
    text:
      es: "Muestra y oculta el escritorio, como hace Windows+D"
  explanation:
    es: "La tabla asigna a Windows+Alt+D «Mostrar y ocultar la fecha y hora en el escritorio». Los iconos del escritorio se ocultan desactivando Mostrar iconos del escritorio en el menú Ver. Crear otro escritorio es Windows+Ctrl+D. Mostrar y ocultar el escritorio es Windows+D, sin Alt."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m02-l06-q061
  prompt:
    es: "En Windows 11, ¿qué ocurre al desactivar la opción Mostrar iconos del escritorio en el menú Ver del menú contextual del escritorio?"
  options:
  - id: a
    correct: true
    text:
      es: "Se ocultan temporalmente todos los iconos hasta volver a marcar la opción"
  - id: b
    text:
      es: "Se eliminan todos los accesos directos y se envían a la Papelera"
  - id: c
    text:
      es: "Se ocultan Este equipo, Red y la Papelera, pero no los demás"
  - id: d
    text:
      es: "Se ocultan los iconos de la bandeja del sistema de la barra de tareas"
  explanation:
    es: "La página dice que desactivar Mostrar iconos del escritorio «ocultará temporalmente todos los iconos» y que vuelven a verse al marcar de nuevo la opción. No elimina nada ni envía nada a la Papelera. Afecta a todos los iconos, no solo a los predeterminados. Los iconos de la bandeja del sistema se eligen en la configuración de la barra de tareas."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Mostrar u ocultar todos los iconos del escritorio»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m02-l06-q062
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes rutas del menú contextual del escritorio inicia la creación de un nuevo acceso directo?"
  options:
  - id: a
    text:
      es: "Clic derecho en un área vacía del escritorio › Ver › Iconos pequeños"
  - id: b
    text:
      es: "Clic derecho en un área vacía del escritorio › Ver › Iconos medianos"
  - id: c
    text:
      es: "Clic derecho en un área vacía del escritorio › Ver › Mostrar iconos del escritorio"
  - id: d
    correct: true
    text:
      es: "Clic derecho en un área vacía del escritorio › Nuevo › Acceso directo"
  explanation:
    es: "La página manda hacer clic con el botón derecho en un área vacía del escritorio y seleccionar Nuevo › Acceso directo. El menú Ver sirve para elegir entre iconos grandes, medianos o pequeños y para desactivar Mostrar iconos del escritorio, que oculta los iconos; no crea accesos directos."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Agregar accesos directos al escritorio»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m02-l06-q063
  prompt:
    es: "En Windows 11, al crear un acceso directo con Nuevo › Acceso directo en el escritorio, ¿a qué elementos puede apuntar según las indicaciones?"
  options:
  - id: a
    text:
      es: "Solo a un archivo o a una carpeta del propio equipo"
  - id: b
    text:
      es: "Solo a una aplicación instalada que aparezca en Inicio"
  - id: c
    correct: true
    text:
      es: "A un archivo, a una carpeta o a una página web concretos"
  - id: d
    text:
      es: "Solo a un archivo guardado en la carpeta Escritorio"
  explanation:
    es: "La página dice que se siguen las indicaciones «para crear un acceso directo a un archivo, carpeta o página web específicos». Limitarlo a archivos y carpetas deja fuera las páginas web. Las aplicaciones se llevan al escritorio de otra forma, arrastrándolas desde Inicio, pero no son lo único posible. Nada limita el destino a la carpeta Escritorio."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Agregar accesos directos al escritorio»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m02-l06-q064
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes formas crea en el escritorio un acceso directo a una aplicación instalada?"
  options:
  - id: a
    correct: true
    text:
      es: "Abrir Inicio › Todo y arrastrar la aplicación hasta el escritorio"
  - id: b
    text:
      es: "Abrir Inicio › Todo y pulsar Supr con la aplicación seleccionada"
  - id: c
    text:
      es: "Abrir Inicio › Todo y elegir Anclar a la barra de tareas"
  - id: d
    text:
      es: "Abrir Inicio › Todo y pulsar Alt+Barra espaciadora sobre la aplicación"
  explanation:
    es: "Para aplicaciones, la página manda seleccionar Inicio y Todo, buscar la aplicación y arrastrarla y colocarla en el escritorio. Supr elimina el elemento seleccionado. Anclar a la barra de tareas lleva la aplicación a la barra de tareas, no al escritorio. Alt+Barra espaciadora abre el menú contextual de la ventana activa."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Arrastre y coloque en el escritorio la aplicación para la que quiere crear un acceso directo.»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m02-l06-q065
  prompt:
    es: "En Windows 11, ¿cómo se crea en el escritorio un acceso directo a la página web que está abierta en el explorador?"
  options:
  - id: a
    correct: true
    text:
      es: "Arrastrando al escritorio el icono Ver información del sitio, junto a la URL"
  - id: b
    text:
      es: "Pulsando Windows+D con la página abierta en el explorador web"
  - id: c
    text:
      es: "Eligiendo Anclar a Inicio en el menú de más opciones del explorador"
  - id: d
    text:
      es: "Pulsando Alt+Barra espaciadora con la ventana del explorador activa"
  explanation:
    es: "La página indica hacer clic y arrastrar «el icono Ver información del sitio (icono de candado o controles deslizantes junto a la dirección URL) al escritorio». Windows+D muestra y oculta el escritorio. Anclar a Inicio lleva el sitio al menú Inicio, no al escritorio. Alt+Barra espaciadora abre el menú contextual de la ventana activa."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Agregar accesos directos al escritorio»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-onedrive-restaurar-html
- id: m02-l06-q066
  prompt:
    es: "En Windows 11, ¿qué comando se elige en el menú contextual de un archivo de la Papelera de reciclaje para recuperarlo?"
  options:
  - id: a
    text:
      es: "Volver a colocar"
  - id: b
    text:
      es: "Cortar"
  - id: c
    correct: true
    text:
      es: "Restaurar"
  - id: d
    text:
      es: "Abrir"
  explanation:
    es: "La página dice que, en Windows, se abre la Papelera de reciclaje, se hace clic con el botón derecho en los archivos y se selecciona Restaurar, y que el archivo vuelve a su carpeta original. Volver a colocar es el comando de la Papelera de un Mac, según la misma página. Cortar y Abrir no recuperan el archivo en su carpeta original."
  citation: "fuente: `ms-onedrive-restaurar.html`; «Restaurar archivos o carpetas de OneDrive desde la papelera de reciclaje del equipo»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-win-iconos-escritorio-html
- id: m02-l06-q067
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes descripciones corresponde a la Papelera de reciclaje, uno de los iconos del escritorio?"
  options:
  - id: a
    correct: true
    text:
      es: "El lugar donde se almacenan de forma temporal los archivos eliminados"
  - id: b
    text:
      es: "El lugar donde quedan los archivos eliminados con Mayús+Supr"
  - id: c
    text:
      es: "El icono que da acceso a las unidades y dispositivos conectados"
  - id: d
    text:
      es: "El icono que permite ver los recursos de red y conectarse a ellos"
  explanation:
    es: "La página describe la Papelera de reciclaje como el lugar «donde se almacenan temporalmente los archivos eliminados». Mayús+Supr elimina el elemento «sin moverlo a la papelera de reciclaje», según la tabla del Explorador. El acceso a las unidades y dispositivos es el icono Este equipo, y los recursos de red, el icono Red."
  citation: "fuente: `ms-win-iconos-escritorio.html`; «Personalizar los iconos del escritorio predeterminados»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q068
  prompt:
    es: "En el Explorador de archivos de Windows 11, ¿qué combinación de teclas elimina el elemento seleccionado de forma permanente, sin moverlo a la Papelera de reciclaje?"
  options:
  - id: a
    text:
      es: "Supr"
  - id: b
    text:
      es: "Ctrl+Supr"
  - id: c
    text:
      es: "Ctrl+Alt+Supr"
  - id: d
    correct: true
    text:
      es: "Mayús+Supr"
  explanation:
    es: "La tabla del Explorador asigna a Mayús+Supr «Eliminar permanentemente el elemento seleccionado sin moverlo a la papelera de reciclaje». Supr, en cambio, lo mueve a la Papelera. Ctrl+Supr elimina palabras a la derecha del cursor al editar texto, y Ctrl+Alt+Supr cambia a la pantalla de seguridad."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q069
  prompt:
    es: "En el Explorador de archivos de Windows 11, pulsar la tecla Supr con un elemento seleccionado:"
  options:
  - id: a
    text:
      es: "lo elimina de forma permanente, sin pasar por la Papelera"
  - id: b
    text:
      es: "cambia el nombre del elemento que está seleccionado"
  - id: c
    text:
      es: "muestra el menú contextual del elemento seleccionado"
  - id: d
    correct: true
    text:
      es: "lo elimina y lo mueve a la Papelera de reciclaje"
  explanation:
    es: "La tabla del Explorador dice de Supr: «Eliminar el elemento seleccionado y moverlo a la papelera de reciclaje». La eliminación permanente sin pasar por la Papelera es Mayús+Supr. Cambiar el nombre es F2. Mostrar el menú contextual del elemento es Mayús+F10."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado del Explorador de archivos»"
  difficulty: 2
  tags:
  - "atajo"
  - "comportamiento"
# anchor: fuente-ms-onedrive-restaurar-html
- id: m02-l06-q070
  prompt:
    es: "En un equipo con Windows 11 que sincroniza OneDrive, ¿cuál de las siguientes afirmaciones sobre los archivos eliminados de la nube es correcta?"
  options:
  - id: a
    correct: true
    text:
      es: "No aparecen en la Papelera de reciclaje del equipo, aunque estuvieran marcados como solo en línea"
  - id: b
    text:
      es: "Aparecen en la Papelera de reciclaje del equipo y se recuperan con Restaurar"
  - id: c
    text:
      es: "Aparecen en la Papelera del equipo solo si estaban marcados como solo en línea"
  - id: d
    text:
      es: "Aparecen en la Papelera del equipo durante 30 días y después se eliminan"
  explanation:
    es: "La página dice que los archivos eliminados de la nube, «incluidos los marcados como solo en línea», no aparecen «en la Papelera de reciclaje ni en la Papelera del equipo»; quizá se puedan restaurar desde la papelera web de OneDrive o de SharePoint. Por eso son falsas las tres opciones que los sitúan en la Papelera del equipo. Los 30 días que da la página son el plazo de restauración de OneDrive para cuentas personales, no un plazo de la Papelera de Windows."
  citation: "fuente: `ms-onedrive-restaurar.html`; «Restaurar archivos o carpetas de OneDrive desde la papelera de reciclaje del equipo»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l06-q071
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes afirmaciones sobre la alineación predeterminada de la barra de tareas es correcta?"
  options:
  - id: a
    text:
      es: "Está alineada a la izquierda de forma predeterminada y puede centrarse"
  - id: b
    text:
      es: "Está centrada de forma predeterminada y su alineación no puede cambiarse"
  - id: c
    text:
      es: "Está centrada de forma predeterminada y puede alinearse a la derecha"
  - id: d
    correct: true
    text:
      es: "Está centrada de forma predeterminada y puede alinearse a la izquierda"
  explanation:
    es: "La página dice: «De manera predeterminada, la barra de tareas está centrada en Windows 11. Si quiere que se alinee a la izquierda, consulte Cambiar la alineación de la barra de tareas». No está a la izquierda por defecto, y su alineación sí puede cambiarse. La configuración solo ofrece el centro o la izquierda, no la derecha."
  citation: "fuente: `ms-win-barra-tareas.html`; «Configurar el diseño de la barra de tareas»"
  difficulty: 1
  tags:
  - "configuración"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l06-q072
  prompt:
    es: "Señale la afirmación correcta sobre lo que permite la configuración de la barra de tareas de Windows 11 respecto a su posición:"
  options:
  - id: a
    text:
      es: "Moverla a la parte superior o a un lateral de la pantalla"
  - id: b
    text:
      es: "Moverla arriba o abajo, pero no alinear sus iconos"
  - id: c
    text:
      es: "Alinear sus iconos a la izquierda o a la derecha de la barra"
  - id: d
    correct: true
    text:
      es: "Alinear sus iconos al centro o a la izquierda, pero no moverla"
  explanation:
    es: "La página dice que la configuración permite «alinear los iconos de la barra de tareas en el centro o a la izquierda» y que «no hay ninguna configuración para mover una barra de tareas a la parte superior o lateral de la pantalla»; la barra se coloca en la parte inferior. Moverla arriba o a un lado no es posible en Windows 11. La alineación a la derecha no figura entre las opciones."
  citation: "fuente: `ms-win-barra-tareas.html`; «Cambiar la alineación de la barra de tareas»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l06-q073
  prompt:
    es: "En Windows 11, dentro de la configuración de la barra de tareas, ¿qué sección hay que expandir para elegir la alineación de la barra?"
  options:
  - id: a
    text:
      es: "Elementos de la barra de tareas"
  - id: b
    correct: true
    text:
      es: "Comportamientos de la barra de tareas"
  - id: c
    text:
      es: "Iconos de la bandeja del sistema"
  - id: d
    text:
      es: "Otros iconos de la bandeja del sistema"
  explanation:
    es: "La página indica: «Expanda los comportamientos de la barra de tareas y seleccione la opción que desee para alinear la barra de tareas». En los elementos de la barra de tareas se activan o desactivan Widgets y Vista de tareas, y se configura Buscar. En Iconos de la bandeja del sistema se eligen Menú lápiz, Teclado táctil y Panel táctil virtual. En Otros iconos de la bandeja del sistema se gestiona el menú de iconos ocultos."
  citation: "fuente: `ms-win-barra-tareas.html`; «Cambiar la alineación de la barra de tareas»"
  difficulty: 2
  tags:
  - "ofimática-menú"
  - "configuración"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l06-q074
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes elementos NO es uno de los componentes que la página de Microsoft enumera en la barra de tareas?"
  options:
  - id: a
    text:
      es: "Widgets"
  - id: b
    text:
      es: "Vista de tareas"
  - id: c
    text:
      es: "Bandeja del sistema"
  - id: d
    correct: true
    text:
      es: "Recomendaciones"
  explanation:
    es: "La página enumera seis componentes de la barra de tareas de Windows 11: Widgets, Inicio, Buscar, Vista de tareas, Aplicaciones y Bandeja del sistema. Recomendaciones no es uno de ellos: es una sección del menú Inicio."
  citation: "fuente: `ms-win-barra-tareas.html`; «La barra de tareas de Windows consta de varios componentes, cada uno de los cuales tiene un propósito único:»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l06-q075
  prompt:
    es: "En Windows 11, en el menú desplegable que configura el área de búsqueda de la barra de tareas, ¿qué hace la opción Ocultar?"
  options:
  - id: a
    text:
      es: "Desactiva Windows Search en todo el sistema operativo"
  - id: b
    text:
      es: "Oculta el cuadro de texto y deja solo el icono de búsqueda"
  - id: c
    text:
      es: "Oculta los resultados web de Microsoft Bing en la búsqueda"
  - id: d
    correct: true
    text:
      es: "Quita la característica de búsqueda de la barra de tareas"
  explanation:
    es: "La página dice que Ocultar «quita la característica de búsqueda de la barra de tareas». No desactiva la búsqueda: la misma página indica que también se puede buscar abriendo el menú Inicio y escribiendo. Dejar solo el icono es la opción Solo el icono de búsqueda. Ocultar no se refiere a los resultados de Bing."
  citation: "fuente: `ms-win-barra-tareas.html`; «Buscar»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l06-q076
  prompt:
    es: "En Windows 11, al configurar el área de búsqueda de la barra de tareas, ¿cuál de las siguientes opciones muestra un cuadro de texto completo para escribir la búsqueda?"
  options:
  - id: a
    text:
      es: "Icono y etiqueta de búsqueda"
  - id: b
    text:
      es: "Solo el icono de búsqueda"
  - id: c
    text:
      es: "Ocultar"
  - id: d
    correct: true
    text:
      es: "Cuadro de búsqueda"
  explanation:
    es: "La página dice que Cuadro de búsqueda «muestra un cuadro de texto completo para escribir la búsqueda». Icono y etiqueta de búsqueda muestra un icono junto con la etiqueta «Buscar», Solo el icono de búsqueda muestra solo el icono y Ocultar quita la búsqueda de la barra de tareas."
  citation: "fuente: `ms-win-barra-tareas.html`; «Buscar»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l06-q077
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes iconos se puede elegir en Iconos de la bandeja del sistema, dentro de la configuración de la barra de tareas?"
  options:
  - id: a
    text:
      es: "Vista de tareas"
  - id: b
    text:
      es: "Widgets"
  - id: c
    correct: true
    text:
      es: "Teclado táctil"
  - id: d
    text:
      es: "Buscar"
  explanation:
    es: "La página dice que en Iconos de la bandeja del sistema «las opciones son Menú lápiz, Teclado táctil y Panel táctil virtual». Vista de tareas y Widgets se activan o desactivan en los elementos de la barra de tareas, y Buscar se configura allí con un menú desplegable."
  citation: "fuente: `ms-win-barra-tareas.html`; «Bandeja del sistema»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l06-q078
  prompt:
    es: "En Windows 11, ¿qué es el área de desbordamiento que se configura en Otros iconos de la bandeja del sistema?"
  options:
  - id: a
    text:
      es: "El área de la esquina que muestra el escritorio al seleccionarla"
  - id: b
    correct: true
    text:
      es: "El menú de iconos ocultos de la bandeja del sistema"
  - id: c
    text:
      es: "El panel de widgets con contenido dinámico"
  - id: d
    text:
      es: "El área de calendario y centro de notificaciones"
  explanation:
    es: "La página llama área de desbordamiento al «menú de iconos ocultos» que se habilita en Otros iconos de la bandeja del sistema; para ocultar un icono, se arrastra desde la bandeja hasta ese área. El área de la esquina muestra el escritorio. El panel de widgets se abre con su botón o con Windows+W. El calendario y el centro de notificaciones se abren con el reloj o la campana."
  citation: "fuente: `ms-win-barra-tareas.html`; «Bandeja del sistema»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l06-q079
  prompt:
    es: "En Windows 11, según la página de Microsoft sobre la barra de tareas, un distintivo en el botón de una aplicación de la barra indica:"
  options:
  - id: a
    text:
      es: "que la aplicación está abierta, aunque no sea la activa"
  - id: b
    correct: true
    text:
      es: "que hay o debe haber alguna actividad con esa aplicación"
  - id: c
    text:
      es: "que la aplicación es la que está en uso en ese momento"
  - id: d
    text:
      es: "que la aplicación está anclada a la barra de tareas"
  explanation:
    es: "La página define el distintivo como «una alerta para informarte de que se está realizando alguna actividad o es necesario que se realice con esa aplicación». Que la aplicación esté abierta lo indica una línea bajo su icono, y la aplicación activa se resalta con el color de énfasis. Anclar una aplicación se hace con Anclar a la barra de tareas, no con un distintivo."
  citation: "fuente: `ms-win-barra-tareas.html`; «Mostrar distintivos en las aplicaciones de la barra de tareas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l06-q080
  prompt:
    es: "En Windows 11, con la opción Ocultar automáticamente la barra de tareas activada, la barra vuelve a verse:"
  options:
  - id: a
    text:
      es: "pasando el ratón sobre el borde superior de la pantalla o tocándolo"
  - id: b
    text:
      es: "haciendo clic con el botón derecho en un área vacía del escritorio"
  - id: c
    text:
      es: "manteniendo el puntero sobre el botón Maximizar de una ventana"
  - id: d
    correct: true
    text:
      es: "pasando el ratón sobre el borde inferior de la pantalla o tocándolo"
  explanation:
    es: "La página dice: «Para ver la barra de tareas después de que esté oculta, pase el mouse sobre el borde inferior de la pantalla o toque». El borde superior no la muestra: en Windows 11 la barra está abajo. El clic derecho en el escritorio abre su menú contextual. El puntero sobre Maximizar abre el menú flotante Acoplar."
  citation: "fuente: `ms-win-barra-tareas.html`; «Ocultar la barra de tareas automáticamente»"
  difficulty: 1
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-atajos-html
- id: m02-l06-q081
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes acciones abre otra instancia de una aplicación que ya está abierta, desde su icono de la barra de tareas?"
  options:
  - id: a
    text:
      es: "Mantener pulsadas Ctrl+Mayús y seleccionar el icono de la aplicación"
  - id: b
    correct: true
    text:
      es: "Mantener pulsada Mayús y seleccionar el icono de la aplicación"
  - id: c
    text:
      es: "Mantener pulsada Ctrl y seleccionar el icono de la aplicación"
  - id: d
    text:
      es: "Mantener pulsada Mayús y hacer clic derecho en el icono de la aplicación"
  explanation:
    es: "La tabla de la barra de tareas dice que Mayús+seleccionar un icono de aplicación sirve para «abrir otra instancia de la aplicación». Con Ctrl+Mayús se abre la aplicación como administrador. Con Ctrl se cambia el foco entre las ventanas de un grupo. Mayús+clic con el botón derecho muestra el menú de la ventana de la aplicación."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado de la barra de tareas»"
  difficulty: 3
  tags:
  - "atajo"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l06-q082
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes acciones muestra la lista de accesos directos de una aplicación de la barra de tareas, con sus archivos recientes?"
  options:
  - id: a
    correct: true
    text:
      es: "Hacer clic con el botón derecho en el icono de la aplicación"
  - id: b
    text:
      es: "Mantener el puntero sobre el botón Maximizar de su ventana"
  - id: c
    text:
      es: "Mantener pulsada Mayús y seleccionar el icono de la aplicación"
  - id: d
    text:
      es: "Seleccionar el área de la esquina más alejada de la barra de tareas"
  explanation:
    es: "La página dice que cada aplicación de la barra de tareas ofrece una lista de accesos directos y que, para verla, «simplemente haga clic con el botón derecho en el icono de la aplicación». El puntero sobre Maximizar abre el menú flotante Acoplar. Mayús al seleccionar el icono abre otra instancia. El área de la esquina muestra el escritorio."
  citation: "fuente: `ms-win-barra-tareas.html`; «Aplicaciones»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-win-barra-tareas-html
- id: m02-l06-q083
  prompt:
    es: "En Windows 11, con varios monitores conectados, ¿qué hace la opción Mostrar mi barra de tareas en todas las pantallas al habilitarla?"
  options:
  - id: a
    text:
      es: "Hace que las ventanas abiertas aparezcan duplicadas en todas las pantallas"
  - id: b
    correct: true
    text:
      es: "Hace que la barra de tareas aparezca en todas las pantallas que están conectadas"
  - id: c
    text:
      es: "Hace que la barra de tareas se mueva a la parte superior de la segunda pantalla"
  - id: d
    text:
      es: "Hace que la barra de tareas se oculte en todas las pantallas salvo la principal"
  explanation:
    es: "La página dice que, con la opción habilitada, «la barra de tareas aparece en todas las pantallas conectadas», con acceso a las aplicaciones ancladas, el menú Inicio y la bandeja del sistema en cada una. La opción no duplica ventanas. En Windows 11 no hay configuración para mover la barra a la parte superior. Ocultarla en las demás pantallas es lo contrario de lo que hace."
  citation: "fuente: `ms-win-barra-tareas.html`; «Mostrar la barra de tareas en todas las pantallas»"
  difficulty: 2
  tags:
  - "configuración"
