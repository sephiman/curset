# anchor: fuente-ms-access-consulta-seleccion-html
- id: m02-l10-q162
  prompt:
    es: "En Access 365, ¿cómo se escribe en la fila Campo la expresión de un campo calculado para que la columna se llame «Última actualización»?"
  options:
  - id: a
    text:
      es: "Precedida de Última actualización y de un signo igual"
  - id: b
    correct: true
    text:
      es: "Precedida de Última actualización y de dos puntos"
  - id: c
    text:
      es: "Seguida de Última actualización entre corchetes"
  - id: d
    text:
      es: "Precedida de Última actualización y de un punto y coma"
  explanation:
    es: "La ayuda dice: «Anteponga la expresión con el nombre que desea utilizar en la expresión de salida, seguido de dos puntos», y el ejemplo es «inicie la expresión con Última actualización:». El signo igual y el punto y coma no valen: la frase fija un único separador, los dos puntos. Y el nombre entre corchetes después de la expresión contradice el verbo «Anteponga»: el nombre va delante de la expresión, no detrás."
  citation: "fuente: `ms-access-consulta-seleccion.html`; «Usar una expresión como campo de salida»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q163
  prompt:
    es: "En la cuadrícula de diseño de una consulta de Access 365, ¿cuál de las siguientes formas abre el cuadro Zoom para escribir la expresión de un campo calculado?"
  options:
  - id: a
    text:
      es: "Con el botón derecho en la fila Criterios y la opción Generar"
  - id: b
    text:
      es: "Con doble clic en la fila Total de la columna"
  - id: c
    correct: true
    text:
      es: "Con el botón derecho en la fila Campo y la opción Zoom"
  - id: d
    text:
      es: "Con el botón Ejecutar del grupo Resultados de la cinta"
  explanation:
    es: "La ayuda indica: «haga clic con el botón derecho en la fila Campo y, después, haga clic en Zoom en el menú contextual». La fila Criterios recibe los criterios, no la expresión del campo; la fila Total sirve para elegir funciones de agregado y Ejecutar, del grupo Resultados, lanza la consulta."
  citation: "fuente: `ms-access-consultas.html`; «Hacer cálculos basados en los datos»"
  difficulty: 2
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q164
  prompt:
    es: "En una consulta de Access 365, ¿cuál de las siguientes opciones describe lo que calcula el campo Subtotal: ([Cantidad]*[Precio unitario])-([Cantidad]*[Precio unitario]*[Descuento])?"
  options:
  - id: a
    text:
      es: "La suma de las cantidades de todos los productos pedidos"
  - id: b
    text:
      es: "El precio unitario con el descuento sumado al precio"
  - id: c
    text:
      es: "El descuento medio aplicado a cada pedido del cliente"
  - id: d
    correct: true
    text:
      es: "El precio total de cada producto menos el descuento total"
  explanation:
    es: "La ayuda describe esa expresión como la que multiplica la cantidad por el precio y la cantidad por el precio y el descuento para «restar el descuento total del precio total». No suma cantidades, no suma el descuento al precio unitario y no calcula ninguna media."
  citation: "fuente: `ms-access-consultas.html`; «Hacer cálculos basados en los datos»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q165
  prompt:
    es: "Según la ayuda de Microsoft sobre expresiones, un campo calculado de una consulta de Access 365 es:"
  options:
  - id: a
    correct: true
    text:
      es: "una columna de la consulta que es el resultado de una expresión."
  - id: b
    text:
      es: "una columna de la tabla que guarda los datos de otra consulta."
  - id: c
    text:
      es: "una fila de la cuadrícula que limita los registros del resultado."
  - id: d
    text:
      es: "un campo de la tabla que se rellena con un valor aleatorio."
  explanation:
    es: "La ayuda dice: «Un campo calculado es una columna en una consulta que es el resultado de una expresión». No es una columna de tabla que guarde otra consulta, ni una fila de criterios, que es la que limita los registros, ni un valor aleatorio; este último se parece al valor Aleatorio de Autonumeración, que es otra cosa."
  citation: "fuente: `ms-access-expresiones.html`; «Consultas y filtros»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-consulta-seleccion-html
- id: m02-l10-q166
  prompt:
    es: "Señale qué ocurre con los datos cuando se guarda una consulta de selección en Access 365:"
  options:
  - id: a
    text:
      es: "Se guarda una copia de los datos en una tabla oculta del archivo"
  - id: b
    correct: true
    text:
      es: "No se guarda una copia de los datos; la consulta muestra los de las tablas"
  - id: c
    text:
      es: "Se guardan solo los datos de los campos numéricos de la consulta"
  - id: d
    text:
      es: "Se guarda una copia de los datos solamente si el archivo es .accdb"
  explanation:
    es: "La nota de la ayuda dice: «Una consulta solo muestra datos, no los almacena. Al guardar una consulta, no se guarda una copia de los datos». Por eso no hay copia en una tabla oculta, ni de los campos numéricos, ni en el formato .accdb."
  citation: "fuente: `ms-access-consulta-seleccion.html`; «Ventajas de usar una consulta»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q167
  prompt:
    es: "En una expresión de Access 365, ¿cuál de las siguientes parejas de operadores se usa para combinar cadenas de texto?"
  options:
  - id: a
    text:
      es: "El punto y coma (;) y el signo igual (=)"
  - id: b
    text:
      es: "La barra (/) y la barra invertida (\\)"
  - id: c
    correct: true
    text:
      es: "El Y comercial (&) y el signo más (+)"
  - id: d
    text:
      es: "El asterisco (*) y el signo de porcentaje (%)"
  explanation:
    es: "La página dice que las expresiones «usan los & operadores (Y comercial) y + (signo más) para combinar cadenas de texto». La pareja con el signo igual falla porque el igual encabeza las expresiones de los controles, como =[Nombre] & \" \" & [Apellidos], y no une cadenas. La barra (/) y el asterisco (*) son, según la página, operadores aritméticos, junto con + y -. Y el signo de porcentaje es un comodín de criterios, otra función que unir texto."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones de texto en consultas»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q168
  prompt:
    es: "En una consulta de Access 365, ¿cuál de las siguientes opciones muestra el campo calculado MenosTreinta: Fecha()-30?"
  options:
  - id: a
    text:
      es: "La fecha 30 días posterior a la fecha actual"
  - id: b
    text:
      es: "Los 30 últimos registros de la tabla"
  - id: c
    text:
      es: "La fecha del mes anterior con día 30"
  - id: d
    correct: true
    text:
      es: "La fecha 30 días anterior a la fecha actual"
  explanation:
    es: "La ayuda describe «MinusThirty: Date( )- 30» como un campo que usa la función Fecha «para mostrar la fecha 30 días anterior a la fecha actual». La fecha posterior exigiría sumar 30, y la expresión no cuenta registros ni calcula meses."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones de fecha en consultas»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q169
  prompt:
    es: "En una consulta de Access 365, ¿qué muestra un campo calculado con la función Medio aplicada así: Medio([Teléfono],2,3)?"
  options:
  - id: a
    correct: true
    text:
      es: "Los tres caracteres a partir del segundo del teléfono"
  - id: b
    text:
      es: "Los tres primeros caracteres del valor del campo Teléfono"
  - id: c
    text:
      es: "Los dos últimos caracteres del valor del campo Teléfono"
  - id: d
    text:
      es: "Los tres últimos caracteres del valor del campo Teléfono"
  explanation:
    es: "La ayuda explica que Mid([Phone],2,3) usa la función Medio «para mostrar los tres caracteres a partir del segundo carácter del valor del campo Teléfono». Los primeros caracteres los devuelve la función Izq y los últimos, la función Der («los dos últimos caracteres», en el ejemplo de CódigoDeTipo)."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones de texto en consultas»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q170
  prompt:
    es: "En una consulta de Access 365, ¿cuál de las siguientes funciones muestra los dos últimos caracteres del valor del campo CódigoDeActivo?"
  options:
  - id: a
    text:
      es: "Izq"
  - id: b
    correct: true
    text:
      es: "Der"
  - id: c
    text:
      es: "Medio"
  - id: d
    text:
      es: "Longitud"
  explanation:
    es: "La ayuda dice que «TypeCode: Right([AssetCode], 2)» usa la función Der «para mostrar los dos últimos caracteres». Izq muestra el primer carácter en el ejemplo de InicialDeProducto, Medio muestra caracteres desde una posición dada y Longitud cuenta los caracteres de un texto."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones de texto en consultas»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q171
  prompt:
    es: "En una consulta de Access 365, ¿qué muestra el campo calculado TiempoDeEspera: [FechaObligatoria] - [FechaDeEnvío]?"
  options:
  - id: a
    text:
      es: "La suma de los valores de los campos FechaObligatoria y FechaDeEnvío"
  - id: b
    text:
      es: "La fecha de envío incrementada en la fecha obligatoria"
  - id: c
    correct: true
    text:
      es: "La diferencia entre los valores de FechaObligatoria y FechaDeEnvío"
  - id: d
    text:
      es: "El número de registros con FechaObligatoria posterior a FechaDeEnvío"
  explanation:
    es: "La ayuda dice que LeadTime: [RequiredDate] - [ShippedDate] «muestra la diferencia entre los valores de los campos FechaObligatoria y FechaDeEnvío». No suma ni incrementa fechas, y la expresión opera fila a fila, sin contar registros."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones aritméticas en consultas»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q172
  prompt:
    es: "En Access 365, ¿cuál de las siguientes opciones indica cuántos argumentos recibe la función SiInm y cuáles son?"
  options:
  - id: a
    text:
      es: "Dos: una expresión y el valor que se devuelve si es verdadera"
  - id: b
    text:
      es: "Tres: una expresión, un campo y un operador de comparación"
  - id: c
    text:
      es: "Cuatro: una expresión, dos valores y un valor para los campos nulos"
  - id: d
    correct: true
    text:
      es: "Tres: una expresión, el valor si es verdadera y el si es falsa"
  explanation:
    es: "La ayuda dice: «Se pasan tres argumentos a la función SiInm: el primer argumento es una expresión [...], el segundo es el valor que se devuelve si la expresión es verdadera y el tercero es el valor devuelto si la expresión es falsa». Por eso no son dos, ni incluyen un campo y un operador, ni existe un cuarto argumento para nulos."
  citation: "fuente: `ms-access-expresiones.html`; «Condiciones de solo dos valores»"
  difficulty: 1
  tags:
  - "función"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q173
  prompt:
    es: "En una expresión SiInm de Access 365, ¿cuándo devuelve la función el valor del tercer argumento de la lista?"
  options:
  - id: a
    correct: true
    text:
      es: "Cuando la expresión del primer argumento es falsa"
  - id: b
    text:
      es: "Cuando la expresión del primer argumento es verdadera"
  - id: c
    text:
      es: "Cuando algún campo de la expresión es nulo"
  - id: d
    text:
      es: "Siempre, después de evaluar el segundo argumento"
  explanation:
    es: "La ayuda dice: «El segundo argumento es el valor que se devuelve si la expresión es verdadera y el tercer argumento es el valor devuelto si la expresión es falsa». El valor del tercer argumento es el de la expresión falsa, no el de la verdadera, que corresponde al segundo. Los nulos no tienen argumento propio: en los ejemplos de la página, EsNulo va dentro de la expresión del primer argumento. Y devolver siempre el tercero tras evaluar el segundo contradice que la función «devuelva uno de dos valores posibles»."
  citation: "fuente: `ms-access-expresiones.html`; «Condiciones de solo dos valores»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q174
  prompt:
    es: "En un control de Access 365 con la expresión SiInm(EsNulo([País o región]); \" \"; [País]), ¿qué se muestra si el valor de País o región es nulo?"
  options:
  - id: a
    text:
      es: "El valor del control País"
  - id: b
    correct: true
    text:
      es: "Una cadena vacía"
  - id: c
    text:
      es: "Un mensaje de error de valor nulo"
  - id: d
    text:
      es: "El texto «Nulo»"
  explanation:
    es: "La ayuda dice que =IIf(IsNull([Country/region]), \" \", [Country]) muestra «una cadena vacía si el valor del control País o región es nulo; en caso contrario, se muestra el valor del control País o región». El valor de País solo se muestra si País o región no es nulo; la expresión no produce un mensaje de error ni escribe el texto «Nulo»."
  citation: "fuente: `ms-access-expresiones.html`; «Condiciones de solo dos valores»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q175
  prompt:
    es: "En Access 365, con el criterio Como [¿Qué ciudad?]&\"*\", ¿qué devuelve la consulta si el usuario escribe *s*?"
  options:
  - id: a
    text:
      es: "Todas las ciudades que empiezan por la letra s"
  - id: b
    text:
      es: "Todas las ciudades que acaban en la letra s"
  - id: c
    correct: true
    text:
      es: "Todas las ciudades que contienen la letra s"
  - id: d
    text:
      es: "Solo la ciudad cuyo nombre es *s*"
  explanation:
    es: "La ayuda dice que, si el usuario escribe *s*, «la consulta devolverá todas las ciudades que contengan la letra \"s\"»: el asterisco entre comillas del criterio permite escribir comodines. Las ciudades que empiezan por s son el caso de escribir solo s, como el ejemplo de la letra L. Las que acaban en s no se pueden pedir así: el criterio añade siempre un asterisco al final de lo que se escribe, de modo que el texto escrito nunca queda anclado al final. Y *s* no se toma como nombre literal, porque la página dice que los asteriscos escritos funcionan como caracteres comodín."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de parámetros»"
  difficulty: 2
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q176
  prompt:
    es: "En el cuadro de diálogo Parámetros de la consulta de Access 365, ¿qué debe coincidir con la petición que se usa en la fila Criterios?"
  options:
  - id: a
    text:
      es: "El nombre de la tabla de origen de la consulta"
  - id: b
    text:
      es: "El tipo de datos de la clave principal de la tabla"
  - id: c
    text:
      es: "El nombre del campo de la fila Campo de la cuadrícula"
  - id: d
    correct: true
    text:
      es: "La petición escrita en la columna Parámetro"
  explanation:
    es: "La ayuda dice: «Asegúrese de que cada parámetro coincida con la petición que usa en la fila Criterios de la cuadrícula de diseño de la consulta», y pide escribir esa petición en la columna Parámetro del cuadro de diálogo Parámetros de la consulta. La petición es el texto entre corchetes que pregunta al usuario, como [¿Qué ciudad?], por lo que no es el nombre de la tabla ni el del campo de la fila Campo. El tipo de datos de la clave principal tampoco: el tipo de datos del parámetro se elige aparte, en la columna Tipo de datos."
  citation: "fuente: `ms-access-consultas.html`; «Especificar los tipos de datos de los parámetros»"
  difficulty: 2
  tags:
  - "requisito"
# anchor: fuente-ms-access-consulta-seleccion-html
- id: m02-l10-q177
  prompt:
    es: "Según la ayuda de Access 365, ¿qué puede usarse como campo de salida de una consulta de selección para realizar cálculos o usar una función?"
  options:
  - id: a
    correct: true
    text:
      es: "Una expresión"
  - id: b
    text:
      es: "Una fila de totales de la hoja de datos"
  - id: c
    text:
      es: "Una consulta de parámetros"
  - id: d
    text:
      es: "Una regla de validación"
  explanation:
    es: "La ayuda dice: «Si desea realizar cálculos o usar una función para generar resultados de consultas, puede usar una expresión como campo de salida». La fila Total de la hoja de datos suma valores de columnas, la consulta de parámetros pide valores y la regla de validación comprueba datos al escribirlos; ninguna se presenta como campo de salida."
  citation: "fuente: `ms-access-consulta-seleccion.html`; «Usar una expresión como campo de salida»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-consulta-seleccion-html
- id: m02-l10-q178
  prompt:
    es: "En una consulta de Access 365, ¿dónde se escriben los criterios alternativos de un valor de campo?"
  options:
  - id: a
    text:
      es: "En la fila Mostrar de la columna"
  - id: b
    correct: true
    text:
      es: "En la fila O, bajo la fila Criterios"
  - id: c
    text:
      es: "En la fila Ordenar de la columna"
  - id: d
    text:
      es: "En la fila Total de la columna"
  explanation:
    es: "La ayuda dice: «Especifique los criterios alternativos en la fila O, bajo la fila Criterios». Mostrar sirve para ocultar o ver el campo en el resultado y Total, para elegir la función de resumen; Ordenar es otra fila de la cuadrícula, y la página sitúa los criterios alternativos solo en la fila O."
  citation: "fuente: `ms-access-consulta-seleccion.html`; «Paso 4: Especificar criterios»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-access-consulta-seleccion-html
- id: m02-l10-q179
  prompt:
    es: "En la vista Diseño de una consulta de Access 365, ¿cuál de las siguientes filas no se muestra de manera predeterminada y se activa con Totales?"
  options:
  - id: a
    text:
      es: "La fila Criterios"
  - id: b
    text:
      es: "La fila Campo"
  - id: c
    correct: true
    text:
      es: "La fila Total"
  - id: d
    text:
      es: "La fila Mostrar"
  explanation:
    es: "La ayuda dice: «Para resumir los datos en una consulta, use la fila Total. De manera predeterminada, la fila Total no se muestra en la vista Diseño». Criterios, Campo y Mostrar son filas de la cuadrícula que ya aparecen al crear la consulta, como en los pasos de agregar campos y escribir criterios."
  citation: "fuente: `ms-access-consulta-seleccion.html`; «Paso 5: Resumir datos»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-expresiones-html
- id: m02-l10-q198
  prompt:
    es: "En una consulta de Access 365, ¿qué función muestra el primer carácter del valor del campo NombreDeProducto en un campo calculado?"
  options:
  - id: a
    correct: true
    text:
      es: "Izq"
  - id: b
    text:
      es: "Der"
  - id: c
    text:
      es: "Medio"
  - id: d
    text:
      es: "Longitud"
  explanation:
    es: "La ayuda dice que «ProductInitial: Left([ProductName], 1)» usa la función Izq «para mostrar [...] el primer carácter». Der muestra los últimos caracteres, Medio los que empiezan en una posición dada y Longitud cuenta los caracteres del texto."
  citation: "fuente: `ms-access-expresiones.html`; «Operaciones de texto en consultas»"
  difficulty: 2
  tags:
  - "función"
# anchor: fuente-ms-access-consultas-html
- id: m02-l10-q199
  prompt:
    es: "En una consulta de Access 365, ¿con qué se pueden agrupar los datos por valores de campo?"
  options:
  - id: a
    text:
      es: "Con la fila Total de la hoja de datos"
  - id: b
    correct: true
    text:
      es: "Con la fila Totales de la cuadrícula de diseño"
  - id: c
    text:
      es: "Con la fila Criterios de la cuadrícula de diseño"
  - id: d
    text:
      es: "Con la fila Anexar a de la cuadrícula de diseño"
  explanation:
    es: "La ayuda dice que, aunque tienen nombres parecidos, «puede agrupar datos por valores de campo con la fila Totales en la cuadrícula de diseño», mientras que la fila Total de una hoja de datos se agrega a los resultados de una consulta de totales. La fila Criterios limita registros y Anexar a es de las consultas de datos anexados."
  citation: "fuente: `ms-access-consultas.html`; «Crear una consulta de totales»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-union-html
- id: m02-l10-q243
  prompt:
    es: "En Access 365, ¿cuál de las siguientes afirmaciones sobre una consulta de unión es correcta?"
  options:
  - id: a
    text:
      es: "Une las tablas mediante una combinación interna automática."
  - id: b
    correct: true
    text:
      es: "No tiene vista Diseño y sus resultados son siempre de solo lectura."
  - id: c
    text:
      es: "Se crea en la vista Diseño arrastrando las tablas relacionadas."
  - id: d
    text:
      es: "Permite modificar los valores desde la vista Hoja de datos."
  explanation:
    es: "En una consulta de unión la vista Diseño no está disponible, solo se puede cambiar entre Hoja de datos y SQL, y siempre es de solo lectura. Crearla en la vista Diseño no es posible: las tablas no están relacionadas en una consulta de unión y no se puede usar el diseñador gráfico. Modificar valores en Hoja de datos contradice su carácter de solo lectura. La combinación interna automática es propia de las consultas con tablas relacionadas, no de la unión."
  citation: "fuente: `ms-access-union.html`; «Usar una consulta de unión para combinar varias consultas en un mismo resultado»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-no-coincidentes-html
- id: m02-l10-q248
  prompt:
    es: "¿Cuál de los siguientes asistentes de Crear › Consultas de Access 365 permite ver los elementos de la primera tabla que no tienen acción correspondiente en la segunda?"
  options:
  - id: a
    correct: true
    text:
      es: "Asistente para consultas de buscar no coincidentes"
  - id: b
    text:
      es: "Asistente para formularios"
  - id: c
    text:
      es: "Asistente para buscar consultas duplicadas"
  - id: d
    text:
      es: "Asistente para consultas sencillas"
  explanation:
    es: "El Asistente para consultas de buscar no coincidentes sirve para revisar los elementos de una tabla sin elemento correspondiente en la otra tabla, por ejemplo los productos que no se han vendido nunca. El Asistente para consultas sencillas crea una consulta de selección. El Asistente para buscar consultas duplicadas localiza registros repetidos en una tabla. El Asistente para formularios crea formularios, no consultas."
  citation: "fuente: `ms-access-no-coincidentes.html`; «¿Cuándo debo buscar registros no coincidentes?»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-access-duplicados-html
- id: m02-l10-q249
  prompt:
    es: "En Access 365, ¿cuál de las siguientes opciones recomienda la ayuda de Microsoft para buscar registros duplicados de varias tablas?"
  options:
  - id: a
    text:
      es: "Dividir la base de datos en front-end y back-end"
  - id: b
    text:
      es: "Compactar y reparar la base de datos"
  - id: c
    correct: true
    text:
      es: "Crear una consulta de unión"
  - id: d
    text:
      es: "Ejecutar una consulta de actualización"
  explanation:
    es: "Para buscar duplicados de varias tablas, la ayuda indica crear una consulta de unión, mientras que el asistente de duplicados trabaja sobre la tabla elegida. Una consulta de actualización cambia datos, no los localiza. Compactar y reparar elimina el espacio no utilizado del archivo. Dividir la base de datos separa las tablas, en el back-end, de las consultas, formularios e informes, en el front-end."
  citation: "fuente: `ms-access-duplicados.html`; «Buscar registros duplicados»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-access-sql-conceptos-html
- id: m02-l10-q251
  prompt:
    es: "Según la ayuda de Access 365, ¿cuál de las siguientes opciones usan en segundo plano todas las consultas que se ejecutan?"
  options:
  - id: a
    text:
      es: "Macros incrustadas"
  - id: b
    text:
      es: "El Generador de expresiones"
  - id: c
    correct: true
    text:
      es: "SQL"
  - id: d
    text:
      es: "VBA"
  explanation:
    es: "La página dice que todas las consultas que se ejecutan usan SQL en segundo plano. VBA es el lenguaje de los módulos, y la sintaxis de SQL solo comparte con él algunos elementos. Las macros incrustadas son las que se adjuntan a una propiedad como Al hacer clic de un botón de comando. El Generador de expresiones sirve para crear cálculos, y no es lo que ejecuta la consulta."
  citation: "fuente: `ms-access-sql-conceptos.html`; «¿Qué es SQL?»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-access-combinaciones-html
- id: m02-l10-q260
  prompt:
    es: "En una consulta de Access 365, ¿cuál de las siguientes combinaciones crea Access cuando se crea una combinación sin especificar de qué tipo es?"
  options:
  - id: a
    text:
      es: "Una combinación cruzada"
  - id: b
    text:
      es: "Una combinación externa izquierda"
  - id: c
    correct: true
    text:
      es: "Una combinación interna"
  - id: d
    text:
      es: "Una combinación externa derecha"
  explanation:
    es: "Cuando se crea una combinación sin especificar el tipo, Access asume una combinación interna, que solo incluye datos con correspondencia en ambas tablas. Las combinaciones externas izquierda y derecha añaden las filas restantes de una de las tablas, y exigen cambiar la combinación interna existente. La combinación cruzada es lo que resulta al olvidar unir dos tablas en una consulta."
  citation: "fuente: `ms-access-combinaciones.html`; «Combinaciones internas: solo datos relacionados de ambas tablas combinadas»"
  difficulty: 2
  tags:
  - "concepto"
