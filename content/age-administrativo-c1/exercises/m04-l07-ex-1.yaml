# anchor: boe-a-2000-12140-preambulo
- id: m04-l07-q001
  prompt:
    es: "Según el preámbulo del Real Decreto Legislativo 4/2000, de 23 de junio, por el que se aprueba el texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, ¿qué ley estableció ese Régimen especial?"
  options:
  - id: a
    text:
      es: "La Ley 193/1963, de 28 de diciembre, de bases de la Seguridad Social"
  - id: b
    text:
      es: "La Ley 50/1998, de 30 de diciembre, de Medidas fiscales, administrativas y del orden social"
  - id: c
    correct: true
    text:
      es: "La Ley 29/1975, de 27 de junio, sobre Seguridad Social de los Funcionarios Civiles del Estado"
  - id: d
    text:
      es: "La Ley 55/1999, de 29 de diciembre, de Medidas fiscales, administrativas y del orden social"
  explanation:
    es: "El preámbulo dice que el Régimen especial «fue establecido por la Ley 29/1975, de 27 de junio». La Ley 193/1963 de bases de la Seguridad Social aparece en el mismo preámbulo solo como origen de los criterios que inspiran el Régimen. La Ley 50/1998 facultó al Gobierno para elaborar el texto refundido. La Ley 55/1999 prorrogó esa delegación hasta el 30 de junio de 2000."
  citation: "preámbulo RDL 4/2000"
  difficulty: 1
  tags:
  - "concepto"
  - "fecha"
# anchor: boe-a-2000-12140-art-2
- id: m04-l07-q003
  prompt:
    es: "¿Qué mecanismos de cobertura integran el Régimen especial de Seguridad Social de los Funcionarios Civiles del Estado?"
  options:
  - id: a
    text:
      es: "El Régimen General de la Seguridad Social y el Régimen del Mutualismo Administrativo"
  - id: b
    text:
      es: "El Régimen de Clases Pasivas del Estado y el Régimen General de la Seguridad Social"
  - id: c
    text:
      es: "El Régimen del Mutualismo Administrativo y las mutualidades de cada departamento ministerial"
  - id: d
    correct: true
    text:
      es: "El Régimen de Clases Pasivas del Estado y el Régimen del Mutualismo Administrativo"
  explanation:
    es: "El artículo 2.1 nombra dos mecanismos: «a) El Régimen de Clases Pasivas del Estado» y «b) El Régimen del Mutualismo Administrativo». El Régimen General de la Seguridad Social no es un mecanismo de este Régimen especial: el artículo 2.2 lo aplica solo a quienes ingresan desde 2011 y solo para pensiones. Las mutualidades por departamento no existen en el texto."
  citation: "art. 2.1 RDL 4/2000"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2000-12140-dd-unica
- id: m04-l07-q004
  prompt:
    es: "¿En qué situación está hoy la Ley 29/1975, de 27 de junio, sobre Seguridad Social de los Funcionarios Civiles del Estado?"
  options:
  - id: a
    text:
      es: "Sigue vigente en lo que no se oponga al Real Decreto Legislativo 4/2000"
  - id: b
    correct: true
    text:
      es: "Está derogada en su totalidad por el Real Decreto Legislativo 4/2000"
  - id: c
    text:
      es: "Está derogada solo en lo que regulaba el Régimen de Clases Pasivas"
  - id: d
    text:
      es: "Sigue vigente como norma de desarrollo del texto refundido de 2000"
  explanation:
    es: "La disposición derogatoria única del Real Decreto Legislativo 4/2000 deroga «en su totalidad» la Ley 29/1975. No queda vigente en lo que no se oponga, porque la derogación es total. No se limita a las Clases Pasivas. Una ley derogada no puede seguir como norma de desarrollo."
  citation: "disposición derogatoria única a).1 RDL 4/2000"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2000-12140-art-2
- id: m04-l07-q005
  prompt:
    es: "Según el artículo 2.2 del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, quedan en el Régimen General a los exclusivos efectos de pensiones los funcionarios de carrera civiles del Estado que hayan ingresado:"
  options:
  - id: a
    text:
      es: "A partir del 1 de enero de 2010"
  - id: b
    correct: true
    text:
      es: "A partir del 1 de enero de 2011"
  - id: c
    text:
      es: "A partir del 3 de diciembre de 2010"
  - id: d
    text:
      es: "A partir del 1 de enero de 2012"
  explanation:
    es: "El artículo 2.2 fija la fecha: los que «hayan ingresado a partir del 1 de enero de 2011». El 3 de diciembre de 2010 es la fecha del Real Decreto-ley 13/2010 que el artículo cita, no la de ingreso. Las fechas de 2010 y 2012 no están en el artículo."
  citation: "art. 2.2 RDL 4/2000"
  difficulty: 1
  tags:
  - "fecha"
# anchor: boe-a-2000-12140-art-2
- id: m04-l07-q006
  prompt:
    es: "Un funcionario de carrera de la Administración Civil del Estado que entró por primera vez en la función pública en 2015 está incluido, a los exclusivos efectos de pensiones, en:"
  options:
  - id: a
    text:
      es: "El Régimen de Clases Pasivas del Estado"
  - id: b
    text:
      es: "El Régimen del Mutualismo Administrativo, gestionado por la MUFACE"
  - id: c
    text:
      es: "El Régimen de Clases Pasivas, con cotización a la MUFACE"
  - id: d
    correct: true
    text:
      es: "El Régimen General de la Seguridad Social"
  explanation:
    es: "Ingresó después del 1 de enero de 2011, así que el artículo 2.2 lo integra «en el Régimen General de la Seguridad Social a los exclusivos efectos de pensiones». No entra en Clases Pasivas: la regla de continuidad solo protege a quien ya estaba en ese régimen a 31 de diciembre de 2010. El Mutualismo Administrativo sigue cubriéndolo, pero no paga sus pensiones de jubilación."
  citation: "art. 2.2 RDL 4/2000"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2000-12140-art-3
- id: m04-l07-q007
  prompt:
    es: "Según el artículo 3.1.b) del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, los funcionarios en prácticas que aspiren a incorporarse a Cuerpos de la Administración Civil del Estado:"
  options:
  - id: a
    correct: true
    text:
      es: "Quedan obligatoriamente incluidos, en la forma que reglamentariamente se determine"
  - id: b
    text:
      es: "Quedan excluidos hasta que tomen posesión como funcionarios de carrera del Cuerpo"
  - id: c
    text:
      es: "Pueden incorporarse voluntariamente, abonando a su cargo la cuota del Estado"
  - id: d
    text:
      es: "Quedan incluidos solo si la duración del curso selectivo supera los seis meses"
  explanation:
    es: "El artículo 3.1 dice que «quedan obligatoriamente incluidos» los funcionarios en prácticas que aspiren a Cuerpos de la Administración Civil del Estado, «en la forma que reglamentariamente se determine». No esperan a la toma de posesión como funcionarios de carrera. La inclusión no es voluntaria ni depende de lo que dure el curso selectivo."
  citation: "art. 3.1.b) RDL 4/2000"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-2000-12140-art-3
- id: m04-l07-q009
  prompt:
    es: "¿Cuál de los siguientes colectivos queda excluido del Régimen especial de Seguridad Social de los Funcionarios Civiles del Estado y se rige por sus normas específicas?"
  options:
  - id: a
    text:
      es: "Los funcionarios de carrera de la Administración Civil del Estado en excedencia forzosa"
  - id: b
    text:
      es: "Los funcionarios de carrera de la Administración Civil del Estado en expectativa de destino"
  - id: c
    text:
      es: "Los funcionarios de carrera de la Administración Civil del Estado en servicios en Comunidades Autónomas"
  - id: d
    correct: true
    text:
      es: "Los funcionarios de la Administración Local"
  explanation:
    es: "El artículo 3.2.a) excluye a «los funcionarios de la Administración Local». Los funcionarios de carrera de la Administración Civil del Estado en excedencia forzosa, en expectativa de destino o en servicios en Comunidades Autónomas siguen dentro: el artículo 7.1 les conserva la condición de mutualista con los mismos derechos que en servicio activo."
  citation: "art. 3.2 RDL 4/2000"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2000-12140-art-3
- id: m04-l07-q010
  prompt:
    es: "Según el artículo 3.2 del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, quedan excluidos de este Régimen especial y se rigen por sus normas específicas, entre otros:"
  options:
  - id: a
    text:
      es: "Los funcionarios de carrera de la Administración Civil del Estado en suspensión provisional de funciones"
  - id: b
    correct: true
    text:
      es: "Los funcionarios de organismos autónomos"
  - id: c
    text:
      es: "Los funcionarios de carrera de la Administración Civil del Estado en excedencia por cuidado de familiares"
  - id: d
    text:
      es: "Los funcionarios de carrera transferidos a Comunidades Autónomas que sigan en su Cuerpo estatal"
  explanation:
    es: "El artículo 3.2.b) excluye a «los funcionarios de organismos autónomos». La suspensión provisional de funciones y la excedencia por cuidado de familiares están entre las situaciones en que el artículo 7.1 conserva la condición de mutualista. El transferido solo queda excluido si ingresa en Cuerpos o Escalas propios de la Comunidad Autónoma (artículo 3.2.g); si sigue en su Cuerpo estatal, sigue dentro."
  citation: "art. 3.2 RDL 4/2000"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2000-12140-art-3
- id: m04-l07-q011
  prompt:
    es: "Según el artículo 3.2 del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, ¿qué colectivo queda excluido de este Régimen especial?"
  options:
  - id: a
    text:
      es: "Los funcionarios de carrera de la Administración Civil del Estado de nuevo ingreso"
  - id: b
    text:
      es: "El personal de administración y servicios de la Administración Civil del Estado"
  - id: c
    correct: true
    text:
      es: "Los funcionarios de la Administración de la Seguridad Social"
  - id: d
    text:
      es: "Los funcionarios en prácticas de Cuerpos de la Administración Civil del Estado"
  explanation:
    es: "El artículo 3.2.e) excluye a «los funcionarios de la Administración de la Seguridad Social». La exclusión de nuevo ingreso es para los funcionarios de las Comunidades Autónomas, no para los de la Administración Civil del Estado. La del personal de administración y servicios es para el «propio de las universidades». Los funcionarios en prácticas de Cuerpos estatales están incluidos por el artículo 3.1.b)."
  citation: "art. 3.2 RDL 4/2000"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2000-12140-art-7
- id: m04-l07-q012
  prompt:
    es: "Según el artículo 7.1 del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, los funcionarios de carrera civiles del Estado se incorporan obligatoriamente como mutualistas a la MUFACE:"
  options:
  - id: a
    correct: true
    text:
      es: "En el momento de la toma de posesión de su cargo"
  - id: b
    text:
      es: "En el momento de la publicación de su nombramiento"
  - id: c
    text:
      es: "Al mes siguiente de la toma de posesión de su cargo"
  - id: d
    text:
      es: "Cuando lo soliciten ante la Mutualidad General en el plazo de un mes"
  explanation:
    es: "El artículo 7.1 fija la incorporación «en el momento de la toma de posesión de su cargo». No es la publicación del nombramiento ni el mes siguiente. Tampoco depende de una solicitud: la incorporación es obligatoria."
  citation: "art. 7.1 RDL 4/2000"
  difficulty: 1
  tags:
  - "plazo"
# anchor: boe-a-2000-12140-art-7
- id: m04-l07-q013
  prompt:
    es: "Según el artículo 7.1 del texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, ¿en cuál de estas situaciones conserva el funcionario la condición de mutualista con los mismos derechos que en servicio activo?"
  options:
  - id: a
    correct: true
    text:
      es: "En la excedencia por el cuidado de familiares"
  - id: b
    text:
      es: "En la excedencia voluntaria por interés particular"
  - id: c
    text:
      es: "En la excedencia voluntaria por agrupación familiar"
  - id: d
    text:
      es: "En la excedencia voluntaria por prestación de servicios en el sector público"
  explanation:
    es: "El artículo 7.1.e) incluye la «excedencia por el cuidado de familiares» entre las situaciones en que se conserva la condición de mutualista. Las otras tres son modalidades de excedencia voluntaria, y el artículo 8.1.a) hace causar baja como mutualista obligatorio a quien pasa a excedencia voluntaria «en cualquiera de sus modalidades»."
  citation: "art. 7.1 RDL 4/2000"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-2000-12140-art-8
- id: m04-l07-q014
  prompt:
    es: "¿Cuáles de los siguientes funcionarios de carrera de la Administración Civil del Estado causan baja como mutualistas obligatorios de la MUFACE?"
  options:
  - id: a
    text:
      es: "Los funcionarios que pasen a la situación de excedencia forzosa, cualquiera que sea su causa"
  - id: b
    correct: true
    text:
      es: "Los funcionarios que pasen a excedencia voluntaria, en cualquiera de sus modalidades"
  - id: c
    text:
      es: "Los funcionarios que pasen a la situación de servicios en Comunidades Autónomas"
  - id: d
    text:
      es: "Los funcionarios declarados en suspensión provisional de funciones durante un expediente"
  explanation:
    es: "El artículo 8.1.a) da de baja a los que pasen «a la situación de excedencia voluntaria, en cualquiera de sus modalidades», salvo la opción del artículo 7.3. La excedencia forzosa, los servicios en Comunidades Autónomas y la suspensión provisional de funciones están en el artículo 7.1, entre las situaciones que conservan la condición de mutualista."
  citation: "art. 8.1 RDL 4/2000"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2000-12140-art-8
- id: m04-l07-q015
  prompt:
    es: "Un funcionario de carrera de la Administración Civil del Estado pierde esa condición por renuncia. ¿Qué efecto tiene la pérdida sobre su condición de mutualista obligatorio de la MUFACE?"
  options:
  - id: a
    text:
      es: "Conserva la condición de mutualista obligatorio, porque la renuncia es voluntaria"
  - id: b
    text:
      es: "Conserva la condición de mutualista obligatorio hasta cumplir la edad de jubilación"
  - id: c
    text:
      es: "Causa baja solo si la pérdida deriva de una sanción disciplinaria firme"
  - id: d
    correct: true
    text:
      es: "Causa baja como mutualista obligatorio, cualquiera que sea la causa de la pérdida"
  explanation:
    es: "El artículo 8.1.b) da de baja como mutualistas obligatorios a «los funcionarios que pierdan tal condición, cualquiera que sea la causa». La renuncia es una de esas causas, así que no conserva la condición. La baja no espera a la edad de jubilación ni depende de que la pérdida venga de una sanción."
  citation: "art. 8.1 RDL 4/2000"
  difficulty: 1
  tags:
  - "efecto"
# anchor: boe-a-2000-12140-art-8
- id: m04-l07-q016
  prompt:
    es: "El funcionario que causa baja en la MUFACE por pasar a excedencia voluntaria puede mantener el alta como mutualista voluntario siempre que:"
  options:
  - id: a
    text:
      es: "Abone a su cargo la cuota del funcionario, mientras el Estado mantiene la suya"
  - id: b
    text:
      es: "Acredite un período previo de cotización a la Mutualidad General de al menos seis meses"
  - id: c
    correct: true
    text:
      es: "Abone exclusivamente a su cargo las cuotas correspondientes al funcionario y al Estado"
  - id: d
    text:
      es: "Lo autorice la Dirección de la MUFACE, previo informe de su órgano de personal"
  explanation:
    es: "El artículo 8.2 permite el alta voluntaria «siempre que abonen exclusivamente a su cargo las cuotas correspondientes al funcionario y al Estado». El Estado deja de pagar su parte. Los seis meses de cotización son el requisito del subsidio por incapacidad temporal, no de esta opción. El artículo no exige autorización de la Dirección."
  citation: "art. 8.2 RDL 4/2000"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2003-7527-art-10
- id: m04-l07-q017
  prompt:
    es: "¿Ante quién y en qué plazo ejercita el funcionario que pasa a excedencia voluntaria la opción de seguir como mutualista voluntario de la MUFACE?"
  options:
  - id: a
    text:
      es: "Ante su órgano de personal, en el plazo de un mes"
  - id: b
    correct: true
    text:
      es: "Ante la Mutualidad General, en el plazo de un mes"
  - id: c
    text:
      es: "Ante la Mutualidad General, en el plazo de quince días"
  - id: d
    text:
      es: "Ante la Mutualidad General, en el plazo de tres meses"
  explanation:
    es: "El artículo 10.3 dice que el interesado ejercita la opción «ante la Mutualidad General, en el plazo de un mes». No se presenta ante el órgano de personal. Quince días y tres meses no son el plazo de este artículo."
  citation: "art. 10.3 RD 375/2003"
  difficulty: 2
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-2003-7527-art-10
- id: m04-l07-q018
  prompt:
    es: "Si quien pierde la condición de funcionario no ejercita la opción de seguir como mutualista voluntario, ¿con qué fecha causa baja en la MUFACE?"
  options:
  - id: a
    correct: true
    text:
      es: "Con la misma fecha de efectos del acto administrativo correspondiente"
  - id: b
    text:
      es: "Con la fecha en que termina el plazo de un mes para ejercer la opción"
  - id: c
    text:
      es: "Con la fecha en que la MUFACE dicta la resolución que declara la baja"
  - id: d
    text:
      es: "Con el último día del mes en que se le notificó el acto"
  explanation:
    es: "El artículo 10.3 dice que, si no ejercita la opción, causa baja «con la misma fecha de efectos de los actos administrativos correspondientes». La baja no se retrasa al final del plazo de un mes ni al último día del mes. Tampoco depende de una resolución posterior de la MUFACE."
  citation: "art. 10.3 RD 375/2003"
  difficulty: 3
  tags:
  - "efecto"
  - "fecha"
# anchor: boe-a-2003-7527-art-10
- id: m04-l07-q019
  prompt:
    es: "Un funcionario recibe el miércoles 13 de enero de 2027 la notificación de su excedencia voluntaria, con efectos ese día. Según el artículo 10.3 del Reglamento General del Mutualismo Administrativo, ¿hasta qué día puede optar por seguir como mutualista voluntario?"
  options:
  - id: a
    text:
      es: "Hasta el sábado 13 de febrero de 2027"
  - id: b
    text:
      es: "Hasta el viernes 12 de febrero de 2027"
  - id: c
    correct: true
    text:
      es: "Hasta el lunes 15 de febrero de 2027"
  - id: d
    text:
      es: "Hasta el miércoles 10 de febrero de 2027"
  explanation:
    es: "El plazo es de un mes desde la recepción de la notificación. Por el artículo 30.4 LPAC, el mes se cuenta desde el día siguiente, jueves 14 de enero, y termina el mismo día de la notificación en el mes de vencimiento: el sábado 13 de febrero de 2027. Ese día es inhábil, así que el plazo pasa al primer día hábil siguiente, el lunes 15 de febrero (artículo 30.5 LPAC). El viernes 12 de febrero sale de contar treinta días naturales, y el miércoles 10 de febrero de contar veinte días hábiles; el plazo es de un mes, no de días."
  citation: "art. 10.3 RD 375/2003"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
