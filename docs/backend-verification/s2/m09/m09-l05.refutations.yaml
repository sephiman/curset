    sentence: the setting can be set to -1 to disable periodic refresh operations.
m09-l05-q10:
  key:
    anchor: es-translog#elastic-docs-v3
    sentence: In the event of a crash, recent operations that have been acknowledged but not yet included in the last Lucene commit are instead recovered from the translog when the shard recovers.
  wrong:
  - option: From the segments in the filesystem cache, which are always flushed before the acknowledgement
    anchor: es-near-real-time-search#elastic-docs-v3
    sentence: The new segment is written to the filesystem cache first (which is cheap) and only later is it flushed to disk (which is expensive).
  - option: It cannot be recovered, because changes after a commit are kept only in memory
    anchor: es-translog#elastic-docs-v3
    sentence: recent operations that have been acknowledged but not yet included in the last Lucene commit are instead recovered from the translog when the shard recovers.
  - option: From the last refresh, which persisted the operation to disk
    anchor: es-near-real-time-search#elastic-docs-v3
    sentence: Lucene allows new segments to be written and opened, making the documents they contain visible to search without performing a full commit.
m09-l05-q11:
  key:
    anchor: es-translog#elastic-docs-v3
    sentence: An Elasticsearch flush is the process of performing a Lucene commit and starting a new translog generation.
  wrong:
  - option: It writes and opens a new segment so that documents become visible to search
    anchor: es-near-real-time-search#elastic-docs-v3
    sentence: In Elasticsearch, this process of writing and opening a new segment is called a refresh.
  - option: It merges small segments into larger ones in the background
    anchor: es-merge-settings#merge-scheduling
    sentence: The merge scheduler controls the execution of merge operations when they are needed.
  - option: It creates a replica shard as a copy of a primary shard
    anchor: es-clusters-nodes-shards#elastic-docs-v3
    sentence: A replica shard is a copy of a primary shard.
m09-l05-q12:
  key:
    anchor: es-index-basics#how-an-index-stores-data
    sentence: The number of primary shards is fixed at index creation
  wrong:
  - option: The number of primary shards can be changed at any time with `index.number_of_shards`
    anchor: es-index-basics#how-an-index-stores-data
    sentence: The number of primary shards is fixed at index creation
  - option: A replica shard holds a different subset of the documents than its primary shard
    anchor: es-clusters-nodes-shards#elastic-docs-v3
    sentence: A replica shard is a copy of a primary shard.
  - option: Every document belongs to several primary shards, which share its storage
    anchor: es-index-basics#how-an-index-stores-data
    sentence: Every document belongs to exactly one primary shard.
m09-l05-q13:
  key:
    anchor: es-reading-and-writing-documents#basic-write-model
    sentence: Once all in-sync replicas have successfully performed the operation and responded to the primary, the primary acknowledges the successful completion of the request to the client.
  wrong:
  - option: As soon as the primary has executed the operation locally, before the replicas
    anchor: es-reading-and-writing-documents#basic-write-model
    sentence: these are the set of "good" shard copies that are guaranteed to have processed all of the index and delete operations that have been acknowledged to the user.
  - option: Once every replica shard, including offline ones, has indexed the document
    anchor: es-reading-and-writing-documents#basic-write-model
    sentence: Since replicas can be offline, the primary is not required to replicate to all replicas.
  - option: After the next Lucene commit has persisted the operation to disk
    anchor: es-translog#elastic-docs-v3
    sentence: recent operations that have been acknowledged but not yet included in the last Lucene commit are instead recovered from the translog when the shard recovers.
m09-l05-q14:
  key:
    anchor: es-merge-settings#merge-scheduling
    sentence: Smaller merges are prioritized over larger ones, across all shards on the node.
  wrong:
  - option: Larger merges are prioritized over smaller ones, so that segments shrink faster
    anchor: es-merge-settings#merge-scheduling
    sentence: Smaller merges are prioritized over larger ones, across all shards on the node.
  - option: Merges run without any disk IO throttling, so bursts proceed at full disk speed
    anchor: es-merge-settings#merge-scheduling
    sentence: Merges are disk IO throttled so that bursts, while merging activity is otherwise low, are smoothed out in order to not impact indexing throughput.
  - option: At most a fixed number of merges can be enqueued for the thread pool
    anchor: es-merge-settings#merge-scheduling
    sentence: There is no limit on the number of merges that can be enqueued for execution on the thread pool.
