# anchor: boe-a-2003-23186-art-122
- id: m03-l06-q0021
  prompt:
    es: "De acuerdo con el artículo 122.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las autoliquidaciones complementarias tienen como finalidad completar o modificar las presentadas con anterioridad y se podrán presentar cuando de ellas resulte:"
  options:
  - id: a
    text:
      es: "un importe a ingresar inferior al de la autoliquidación anterior o una cantidad a devolver o a compensar superior a la anteriormente autoliquidada."
  - id: b
    text:
      es: "un importe a ingresar inferior al de la autoliquidación anterior o una cantidad a devolver o a compensar inferior a la anteriormente autoliquidada."
  - id: c
    text:
      es: "un importe a ingresar superior al de la autoliquidación anterior o una cantidad a devolver o a compensar superior a la anteriormente autoliquidada."
  - id: d
    correct: true
    text:
      es: "un importe a ingresar superior al de la autoliquidación anterior o una cantidad a devolver o a compensar inferior a la anteriormente autoliquidada."
  explanation:
    es: "La complementaria solo procede si empeora el resultado para el obligado: más ingreso o menos devolución o compensación que en la autoliquidación anterior. Las otras combinaciones mezclan un resultado que favorece al obligado con otro que lo perjudica, o ambos a su favor, y en esos casos el artículo 122.2 remite a los apartados 3 y 4 del artículo 120, es decir, a la rectificación."
  citation: "art. 122.2 LGT"
  difficulty: 2
  tags:
  - "complementarias"
# anchor: boe-a-2003-23186-art-122
- id: m03-l06-q0022
  prompt:
    es: "Don Raúl Pons presentó una autoliquidación con un importe a ingresar de 1.000 euros y comprueba ahora que debió ser de 700 euros. Conforme al artículo 122.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, ¿puede presentar una autoliquidación complementaria?"
  options:
  - id: a
    text:
      es: "Sí, porque la complementaria sirve para modificar cualquier autoliquidación presentada con anterioridad."
  - id: b
    correct: true
    text:
      es: "No, porque de ella no resultaría un importe a ingresar superior al anterior; debe instar la rectificación de la autoliquidación."
  - id: c
    text:
      es: "No, porque la autoliquidación ya presentada solo puede modificarla la Administración mediante liquidación."
  - id: d
    text:
      es: "Sí, pero solo si la presenta dentro del plazo establecido para la presentación de la autoliquidación."
  explanation:
    es: "La complementaria exige que resulte un importe a ingresar superior al anterior o una devolución inferior. Aquí el nuevo importe, 700 euros, es menor que los 1.000 euros ya autoliquidados, de modo que el artículo 122.2 remite a los apartados 3 y 4 del artículo 120 y al obligado le corresponde instar la rectificación. La complementaria no sirve para modificar cualquier autoliquidación, sino solo en el sentido indicado. El plazo no es el criterio que decide: lo es el signo del resultado. La Administración no es la única que puede modificar la autoliquidación, porque el obligado puede rectificarla."
  citation: "art. 122.2 LGT"
  difficulty: 3
  tags:
  - "complementarias"
  - "rectificación"
# anchor: boe-a-2003-23186-art-122
- id: m03-l06-q0023
  prompt:
    es: "Según el artículo 122.3 de la Ley 58/2003, de 17 de diciembre, General Tributaria, las declaraciones o comunicaciones de datos complementarias o sustitutivas se presentan haciendo constar si se trata de una u otra modalidad, con la finalidad de:"
  options:
  - id: a
    text:
      es: "completar o modificar únicamente las autoliquidaciones presentadas con anterioridad."
  - id: b
    text:
      es: "anular las presentadas con anterioridad cuando haya prescrito el derecho de la Administración."
  - id: c
    correct: true
    text:
      es: "completar o reemplazar las presentadas con anterioridad."
  - id: d
    text:
      es: "rectificar las liquidaciones practicadas con anterioridad por la Administración."
  explanation:
    es: "Las declaraciones y comunicaciones complementarias completan y las sustitutivas reemplazan las presentadas antes, según el artículo 122.3. Completar o modificar solo autoliquidaciones es la finalidad de las autoliquidaciones complementarias del apartado 2. Rectificar liquidaciones de la Administración pertenece a los procedimientos de revisión, no a este precepto. La prescripción del derecho de la Administración es el límite para presentarlas, no una finalidad de anular."
  citation: "art. 122.3 LGT"
  difficulty: 2
  tags:
  - "complementarias"
  - "sustitutivas"
# anchor: boe-a-2003-23186-art-23
- id: m03-l06-q0024
  prompt:
    es: "Según el artículo 23.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria, la obligación tributaria de realizar pagos a cuenta de la obligación tributaria principal consiste en satisfacer un importe a la Administración tributaria por:"
  options:
  - id: a
    text:
      es: "el obligado a realizar pagos fraccionados, por el retenedor o por el sustituto del contribuyente."
  - id: b
    correct: true
    text:
      es: "el obligado a realizar pagos fraccionados, por el retenedor o por el obligado a realizar ingresos a cuenta."
  - id: c
    text:
      es: "el contribuyente, por el retenedor o por el obligado a repercutir el impuesto en cada operación gravada realizada."
  - id: d
    text:
      es: "el obligado a realizar pagos fraccionados, por el repercutido o por el obligado a ingresar a cuenta."
  explanation:
    es: "El artículo 23.1 enumera tres obligados: quien realiza pagos fraccionados, el retenedor y quien hace ingresos a cuenta. El sustituto del contribuyente es otra figura, que ocupa su lugar en la obligación principal. El contribuyente y el obligado a repercutir no figuran en la enumeración. El repercutido soporta la repercusión, pero no es quien satisface el pago a cuenta."
  citation: "art. 23.1 LGT"
  difficulty: 2
  tags:
  - "pagos a cuenta"
  - "obligados"
# anchor: boe-a-2003-23186-art-23
- id: m03-l06-q0025
  prompt:
    es: "Señale la respuesta CORRECTA sobre la obligación tributaria de realizar pagos a cuenta, de acuerdo con el artículo 23.1 de la Ley 58/2003, de 17 de diciembre, General Tributaria:"
  options:
  - id: a
    text:
      es: "Tiene carácter accesorio respecto de la obligación tributaria principal."
  - id: b
    correct: true
    text:
      es: "Tiene carácter autónomo respecto de la obligación tributaria principal."
  - id: c
    text:
      es: "Depende de la obligación tributaria principal y se extingue junto con ella."
  - id: d
    text:
      es: "Solo nace cuando la Administración ha liquidado la obligación tributaria principal."
  explanation:
    es: "El artículo 23.1 declara la obligación de realizar pagos a cuenta autónoma respecto de la principal. Calificarla de accesoria la subordina a esa obligación, que es lo contrario. Hacerla depender de la principal y extinguirla con ella niega la autonomía. Condicionar su nacimiento a la liquidación de la principal tampoco encaja: son obligaciones con vida propia."
  citation: "art. 23.1 LGT"
  difficulty: 1
  tags:
  - "pagos a cuenta"
  - "autonomía"
# anchor: boe-a-2003-23186-art-23
- id: m03-l06-q0026
  prompt:
    es: "De acuerdo con el artículo 23.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria, el contribuyente podrá deducir de la obligación tributaria principal el importe de los pagos a cuenta soportados, salvo que:"
  options:
  - id: a
    correct: true
    text:
      es: "la ley propia de cada tributo establezca la posibilidad de deducir una cantidad distinta a dicho importe."
  - id: b
    text:
      es: "el reglamento de cada tributo establezca la posibilidad de deducir una cantidad distinta a dicho importe de pagos a cuenta."
  - id: c
    text:
      es: "la Administración tributaria acuerde deducir una cantidad distinta en el procedimiento de comprobación."
  - id: d
    text:
      es: "el contribuyente no haya presentado en plazo la autoliquidación del tributo."
  explanation:
    es: "La excepción del artículo 23.2 la fija la ley propia de cada tributo. Un reglamento no puede alterar esa regla, porque el precepto remite a la ley. La Administración tampoco decide en cada comprobación una cantidad distinta. La presentación fuera de plazo de la autoliquidación no figura como causa de excepción en el apartado."
  citation: "art. 23.2 LGT"
  difficulty: 2
  tags:
  - "pagos a cuenta"
  - "deducción"
# anchor: boe-a-2006-20764-art-99
- id: m03-l06-q0027
  prompt:
    es: "De acuerdo con el artículo 99.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, los pagos a cuenta del impuesto, que en todo caso tienen la consideración de deuda tributaria, podrán consistir en:"
  options:
  - id: a
    text:
      es: "retenciones, pagos fraccionados y anticipos de cuota."
  - id: b
    correct: true
    text:
      es: "retenciones, ingresos a cuenta y pagos fraccionados."
  - id: c
    text:
      es: "retenciones, ingresos a cuenta y recargos del período ejecutivo."
  - id: d
    text:
      es: "retenciones, repercusiones y pagos fraccionados."
  explanation:
    es: "El artículo 99.1 enumera tres clases de pago a cuenta del impuesto: retenciones, ingresos a cuenta y pagos fraccionados. Los recargos del período ejecutivo son una consecuencia del impago, no un pago a cuenta. La repercusión es un mecanismo del Impuesto sobre el Valor Añadido, ajeno a esta lista. Los anticipos de cuota no figuran entre las clases que el precepto prevé."
  citation: "art. 99.1 LIRPF"
  difficulty: 1
  tags:
  - "pagos a cuenta"
  - "clases"
# anchor: boe-a-2006-20764-art-99
- id: m03-l06-q0028
  prompt:
    es: "¿Qué consideración tienen en todo caso los pagos a cuenta del Impuesto sobre la Renta de las Personas Físicas, según el artículo 99.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "No tienen la consideración de deuda tributaria hasta que se practica la liquidación definitiva."
  - id: b
    text:
      es: "Tienen la consideración de deuda tributaria solo los pagos fraccionados."
  - id: c
    text:
      es: "Tienen la consideración de obligación accesoria de la obligación principal."
  - id: d
    correct: true
    text:
      es: "Tienen en todo caso la consideración de deuda tributaria."
  explanation:
    es: "El artículo 99.1 atribuye a los pagos a cuenta, en todo caso, la consideración de deuda tributaria, sea cual sea su clase. Reservarla a los pagos fraccionados excluye las retenciones y los ingresos a cuenta. Condicionarla a la liquidación definitiva niega el carácter inmediato que el apartado les da. Calificarlos de obligación accesoria contradice tanto el 99.1 como la autonomía que el artículo 23.1 de la Ley General Tributaria les reconoce."
  citation: "art. 99.1 LIRPF"
  difficulty: 1
  tags:
  - "pagos a cuenta"
  - "deuda tributaria"
# anchor: boe-a-2006-20764-art-99
- id: m03-l06-q0029
  prompt:
    es: "Según el artículo 99.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las entidades y las personas jurídicas, incluidas las entidades en atribución de rentas, que satisfagan o abonen rentas sujetas al impuesto estarán obligadas a:"
  options:
  - id: a
    text:
      es: "practicar retención e ingreso a cuenta, en la cantidad que se determine por ley, y a ingresar su importe en el Tesoro."
  - id: b
    text:
      es: "practicar retención e ingreso a cuenta solo cuando el perceptor lo solicite, y a ingresar su importe en el Tesoro."
  - id: c
    correct: true
    text:
      es: "practicar retención e ingreso a cuenta, en la cantidad que se determine reglamentariamente, y a ingresar su importe en el Tesoro."
  - id: d
    text:
      es: "practicar retención e ingreso a cuenta, en la cantidad que se determine reglamentariamente, y a ingresar su importe en la Seguridad Social."
  explanation:
    es: "Las entidades y personas jurídicas que satisfacen rentas sujetas deben retener e ingresar a cuenta en la cantidad que se determine reglamentariamente y ingresar el importe en el Tesoro (artículo 99.2). Remitir la cuantía a la ley altera la fuente de la que depende. El destino del ingreso es el Tesoro, no la Seguridad Social. La obligación no depende de que el perceptor lo pida: nace por satisfacer rentas sujetas."
  citation: "art. 99.2 LIRPF"
  difficulty: 2
  tags:
  - "obligados"
  - "retención"
# anchor: boe-a-2006-20764-art-99
- id: m03-l06-q0030
  prompt:
    es: "Según el artículo 99.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, un contribuyente por este impuesto que ejerza actividades económicas, ¿en qué supuesto está obligado a practicar retención e ingreso a cuenta?"
  options:
  - id: a
    text:
      es: "Únicamente cuando el perceptor sea una entidad no residente en territorio español."
  - id: b
    text:
      es: "Respecto de cualquier renta que satisfaga, aunque no guarde relación con su actividad económica ordinaria."
  - id: c
    text:
      es: "Solo cuando contrate trabajadores por cuenta ajena a jornada completa."
  - id: d
    correct: true
    text:
      es: "Respecto de las rentas que satisfaga o abone en el ejercicio de dichas actividades."
  explanation:
    es: "El contribuyente que ejerce actividades económicas retiene sobre las rentas que satisfaga en el ejercicio de esas actividades (artículo 99.2). No retiene por cualquier pago, incluido el que no guarda relación con su actividad. La obligación tampoco se limita a quien contrata trabajadores a jornada completa, porque alcanza a todas las rentas sujetas satisfechas en la actividad. El perceptor no tiene que ser un no residente: el precepto no lo exige."
  citation: "art. 99.2 LIRPF"
  difficulty: 2
  tags:
  - "obligados"
  - "actividades económicas"
# anchor: boe-a-2006-20764-art-99
- id: m03-l06-q0031
  prompt:
    es: "Según el artículo 99.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué obligación tienen las personas físicas, jurídicas y demás entidades no residentes en territorio español que operan en él mediante establecimiento permanente?"
  options:
  - id: a
    correct: true
    text:
      es: "Están sujetas a las mismas obligaciones de retención e ingreso a cuenta que las entidades que satisfacen rentas sujetas."
  - id: b
    text:
      es: "Están sujetas únicamente si la Administración tributaria las requiere expresamente para ello."
  - id: c
    text:
      es: "No están sujetas, salvo que satisfagan rendimientos de actividades económicas a personas residentes."
  - id: d
    text:
      es: "Solo están sujetas cuando satisfacen rendimientos del trabajo, y no respecto de otras rentas."
  explanation:
    es: "Los no residentes que operan con establecimiento permanente quedan sujetos a las mismas obligaciones de retención e ingreso a cuenta (artículo 99.2). La restricción a los rendimientos del trabajo es la regla de los no residentes que operan sin establecimiento permanente, no la de quienes lo tienen. Tampoco se exige que paguen a residentes ni que la renta sea de actividades económicas. No hace falta un requerimiento de la Administración, porque la obligación nace de la ley."
  citation: "art. 99.2 LIRPF"
  difficulty: 2
  tags:
  - "obligados"
  - "no residentes"
# anchor: boe-a-2006-20764-art-99
- id: m03-l06-q0032
  prompt:
    es: "La entidad Nordhaven Consulting, Ltd., no residente y sin establecimiento permanente en España, satisface a una persona que trabaja en territorio español 2.000 euros mensuales. Según el artículo 99.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿debe practicar retención e ingreso a cuenta?"
  options:
  - id: a
    text:
      es: "No, porque la obligación solo alcanza a los no residentes que operan mediante establecimiento permanente."
  - id: b
    correct: true
    text:
      es: "Sí, respecto de los rendimientos del trabajo que satisface, aunque no opere mediante establecimiento permanente."
  - id: c
    text:
      es: "No, porque la retención sobre rendimientos del trabajo corresponde únicamente al trabajador perceptor."
  - id: d
    text:
      es: "Sí, pero solo respecto de los rendimientos de actividades económicas, y no de los del trabajo que satisfaga a sus empleados."
  explanation:
    es: "El artículo 99.2 sujeta a los no residentes que operan sin establecimiento permanente por los rendimientos del trabajo que satisfagan. Restringir la obligación a quienes tienen establecimiento permanente ignora esa extensión. Atribuir la retención al trabajador invierte el sistema, en el que retiene el pagador. Limitarla a las actividades económicas excluye justamente la renta que el precepto menciona, los rendimientos del trabajo."
  citation: "art. 99.2 LIRPF"
  difficulty: 2
  tags:
  - "obligados"
  - "no residentes"
# anchor: boe-a-2006-20764-art-99
- id: m03-l06-q0033
  prompt:
    es: "De acuerdo con el artículo 99.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, las entidades aseguradoras domiciliadas en otro Estado miembro del Espacio Económico Europeo que operen en España en régimen de libre prestación de servicios deben practicar retención e ingreso a cuenta en relación con:"
  options:
  - id: a
    text:
      es: "las operaciones que se realicen en España, solo si cuentan con establecimiento permanente."
  - id: b
    correct: true
    text:
      es: "las operaciones que se realicen en España."
  - id: c
    text:
      es: "las operaciones que realicen en cualquier Estado miembro del Espacio Económico Europeo."
  - id: d
    text:
      es: "únicamente las operaciones con contribuyentes residentes en el Estado donde estén domiciliadas."
  explanation:
    es: "Las aseguradoras del Espacio Económico Europeo en libre prestación de servicios retienen por las operaciones que se realicen en España (artículo 99.2). El alcance no son las operaciones en todo el Espacio Económico Europeo ni las referidas al Estado de domicilio. Condicionarlo a un establecimiento permanente contradice el supuesto del precepto, que es precisamente la libre prestación sin él."
  citation: "art. 99.2 LIRPF"
  difficulty: 2
  tags:
  - "obligados"
  - "aseguradoras"
# anchor: boe-a-2006-20764-art-99
- id: m03-l06-q0034
  prompt:
    es: "De acuerdo con el artículo 99.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en ningún caso estarán obligadas a practicar retención o ingreso a cuenta:"
  options:
  - id: a
    text:
      es: "los contribuyentes por el impuesto que ejerzan actividades económicas, por las rentas satisfechas en ellas."
  - id: b
    text:
      es: "las personas jurídicas que satisfagan o abonen rentas sujetas al impuesto."
  - id: c
    correct: true
    text:
      es: "las misiones diplomáticas u oficinas consulares en España de Estados extranjeros."
  - id: d
    text:
      es: "las entidades en atribución de rentas que satisfagan rentas sujetas al impuesto."
  explanation:
    es: "El artículo 99.2 excluye en todo caso a las misiones diplomáticas u oficinas consulares en España de Estados extranjeros. Las entidades en atribución de rentas están incluidas expresamente entre las entidades obligadas. Los contribuyentes con actividades económicas retienen por las rentas que satisfacen en ellas. Las personas jurídicas que satisfacen rentas sujetas son el primer grupo de obligados del precepto."
  citation: "art. 99.2 LIRPF"
  difficulty: 1
  tags:
  - "obligados"
  - "exclusión"
# anchor: boe-a-2006-20764-art-99
- id: m03-l06-q0035
  prompt:
    es: "De acuerdo con el artículo 99.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál de los siguientes sujetos está obligado a practicar retención e ingreso a cuenta por las rentas sujetas al impuesto que satisface?"
  options:
  - id: a
    text:
      es: "Una oficina consular de un Estado extranjero situada en España."
  - id: b
    text:
      es: "Una persona física no residente sin establecimiento permanente, por cualquier renta que satisfaga."
  - id: c
    correct: true
    text:
      es: "Una persona jurídica residente en España que satisface rentas sujetas al impuesto."
  - id: d
    text:
      es: "La misión diplomática de un Estado extranjero acreditada en España."
  explanation:
    es: "Las personas jurídicas que satisfacen rentas sujetas están obligadas a retener e ingresar a cuenta (artículo 99.2). Las oficinas consulares y las misiones diplomáticas de Estados extranjeros en España quedan excluidas en todo caso. El no residente sin establecimiento permanente solo retiene por los rendimientos del trabajo que satisfaga y por otros rendimientos sometidos a retención que sean gasto deducible, no por cualquier renta."
  citation: "art. 99.2 LIRPF"
  difficulty: 2
  tags:
  - "obligados"
  - "exclusión"
# anchor: boe-a-2006-20764-art-99
- id: m03-l06-q0036
  prompt:
    es: "Señale la respuesta CORRECTA sobre los sujetos obligados a retener o a ingresar a cuenta, de acuerdo con el artículo 99.4 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas:"
  options:
  - id: a
    correct: true
    text:
      es: "Asumen la obligación de efectuar el ingreso en el Tesoro, sin que el incumplimiento de la obligación de retener pueda excusarles de ella."
  - id: b
    text:
      es: "Quedan excusados de ingresar en el Tesoro cuando incumplen la obligación de retener o de ingresar a cuenta."
  - id: c
    text:
      es: "Asumen la obligación de ingresar, pero esta pasa al perceptor cuando no se ha practicado la retención."
  - id: d
    text:
      es: "Asumen la obligación de efectuar el ingreso en el Tesoro solo si han practicado efectivamente la retención."
  explanation:
    es: "Los obligados a retener asumen el ingreso en el Tesoro y no pueden excusarse de él por haber incumplido la obligación de retener (artículo 99.4). Condicionar el ingreso a que se haya retenido premiaría el incumplimiento. Trasladar la obligación al perceptor cuando no hubo retención contradice el apartado, que la mantiene en el retenedor. Excusar el ingreso por incumplir la retención dice justo lo contrario de la regla."
  citation: "art. 99.4 LIRPF"
  difficulty: 2
  tags:
  - "obligados"
  - "ingreso"
# anchor: boe-a-2006-20764-art-99
- id: m03-l06-q0037
  prompt:
    es: "Según el artículo 99.7 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿quiénes están obligados a efectuar pagos fraccionados a cuenta del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    text:
      es: "Las entidades y personas jurídicas que satisfagan rentas sujetas, en la cantidad que fije la ley y con ingreso en el Tesoro."
  - id: b
    text:
      es: "Los contribuyentes que obtengan rendimientos del trabajo, que lo ingresan cuando se lo exija el pagador."
  - id: c
    text:
      es: "Los contribuyentes que obtengan rendimientos del capital mobiliario, en el plazo que fije la propia ley."
  - id: d
    correct: true
    text:
      es: "Los contribuyentes que ejerzan actividades económicas, que autoliquidan e ingresan su importe en las condiciones que reglamentariamente se determinen."
  explanation:
    es: "Los pagos fraccionados corresponden a los contribuyentes que ejercen actividades económicas, que los autoliquidan e ingresan en las condiciones que fije el reglamento (artículo 99.7). Los rendimientos del trabajo y los del capital mobiliario soportan retención o ingreso a cuenta, no pago fraccionado. Las entidades que satisfacen rentas sujetas no hacen pagos fraccionados por ello: retienen e ingresan a cuenta conforme al artículo 99.2."
  citation: "art. 99.7 LIRPF"
  difficulty: 1
  tags:
  - "pagos fraccionados"
  - "obligados"
# anchor: boe-a-2007-6820-art-112
- id: m03-l06-q0038
  prompt:
    es: "De acuerdo con el artículo 112 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, el pago fraccionado correspondiente a los rendimientos de actividades económicas obtenidos por entidades en régimen de atribución de rentas se efectuará por:"
  options:
  - id: a
    text:
      es: "cada uno de los socios, comuneros o partícipes, a partes iguales y con independencia de su participación."
  - id: b
    text:
      es: "el socio, comunero o partícipe con mayor participación, que lo repercute después a los demás en proporción a su participación."
  - id: c
    correct: true
    text:
      es: "cada uno de los socios, comuneros o partícipes, en proporción a su participación en el beneficio de la entidad."
  - id: d
    text:
      es: "la propia entidad, por el total de los rendimientos de actividades económicas obtenidos."
  explanation:
    es: "En las entidades en atribución de rentas el pago fraccionado lo hace cada socio, comunero o partícipe en proporción a su participación en el beneficio (artículo 112). La entidad en atribución de rentas no es la que lo ingresa. Repartirlo a partes iguales desconoce la proporción que fija la norma. Concentrarlo en el partícipe mayoritario con repercusión posterior a los demás no está previsto: cada uno ingresa su parte."
  citation: "art. 112 RIRPF"
  difficulty: 2
  tags:
  - "pagos fraccionados"
  - "atribución de rentas"
# anchor: boe-a-2007-6820-art-112
- id: m03-l06-q0039
  prompt:
    es: "La comunidad de bienes Huerta Alta, entidad en régimen de atribución de rentas, ejerce una actividad económica y sus tres comuneros participan en el beneficio al 50, 30 y 20 por ciento. El pago fraccionado correspondiente a esos rendimientos es de 4.000 euros. Conforme al artículo 112 del Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento del Impuesto sobre la Renta de las Personas Físicas, ¿qué importe ingresa el comunero con el 20 por ciento?"
  options:
  - id: a
    correct: true
    text:
      es: "800 euros, el 20 por ciento del pago fraccionado correspondiente a los rendimientos."
  - id: b
    text:
      es: "4.000 euros, porque cada comunero ingresa el total y se compensan después."
  - id: c
    text:
      es: "2.000 euros, porque el pago lo efectúa el comunero con mayor participación."
  - id: d
    text:
      es: "1.333,33 euros, por reparto a partes iguales entre los tres comuneros."
  explanation:
    es: "El pago fraccionado se ingresa por cada comunero en proporción a su participación en el beneficio (artículo 112). Al 20 por ciento le corresponden 800 euros de los 4.000. El reparto por cabezas, 1.333,33 euros, ignora las participaciones. Los 2.000 euros son el 50 por ciento del comunero mayoritario, que no paga por los demás. El ingreso del total por cada uno duplicaría el pago sin base en la norma."
  citation: "art. 112 RIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "pagos fraccionados"
  - "atribución de rentas"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0040
  prompt:
    es: "De acuerdo con el artículo 101 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, sin considerar la reducción del 60 por ciento para Ceuta y Melilla, ¿cuál de estas rentas tiene el mismo porcentaje de retención que el arrendamiento de inmuebles urbanos?"
  options:
  - id: a
    text:
      es: "Los rendimientos procedentes de actividades agrícolas o ganaderas."
  - id: b
    text:
      es: "Los rendimientos procedentes de la cesión del derecho a la explotación del derecho de imagen."
  - id: c
    correct: true
    text:
      es: "Los premios por la participación en juegos, concursos, rifas o combinaciones aleatorias."
  - id: d
    text:
      es: "Los rendimientos derivados de impartir cursos, conferencias, coloquios y seminarios."
  explanation:
    es: "El arrendamiento o subarrendamiento de inmuebles urbanos tributa al 19 por ciento (artículo 101.8) y los premios por juegos, concursos, rifas o combinaciones aleatorias también (artículo 101.7). Los cursos y conferencias se retienen al 15 por ciento, la cesión del derecho de imagen al 24 y las actividades agrícolas o ganaderas al 2, salvo el engorde de porcino y la avicultura, al 1."
  citation: "art. 101.8 LIRPF"
  difficulty: 2
  tags:
  - "porcentajes"
  - "retención"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0041
  prompt:
    es: "Según el artículo 101.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el porcentaje de retención e ingreso a cuenta sobre los rendimientos del trabajo derivados de impartir cursos, conferencias, coloquios, seminarios y similares, siempre que se ceda el derecho a su explotación, será del:"
  options:
  - id: a
    text:
      es: "35 por ciento, sin perjuicio del 7 por ciento previsto para las obras literarias, artísticas o científicas en determinadas condiciones."
  - id: b
    correct: true
    text:
      es: "15 por ciento, sin perjuicio del 7 por ciento previsto para las obras literarias, artísticas o científicas en determinadas condiciones."
  - id: c
    text:
      es: "19 por ciento, sin perjuicio del 7 por ciento previsto para las obras literarias, artísticas o científicas en determinadas condiciones."
  - id: d
    text:
      es: "24 por ciento, sin perjuicio del 7 por ciento previsto para las obras literarias, artísticas o científicas en determinadas condiciones."
  explanation:
    es: "Los rendimientos del trabajo por impartir cursos, conferencias, coloquios, seminarios y similares se retienen al 15 por ciento (artículo 101.3). El 7 por ciento es una excepción solo para las obras literarias, artísticas o científicas. El 19 por ciento es el tipo de otras rentas, como el arrendamiento o los premios. El 24 por ciento es el de la cesión del derecho de imagen, y el 35 por ciento el de los administradores y miembros de consejos de administración."
  citation: "art. 101.3 LIRPF"
  difficulty: 1
  tags:
  - "porcentajes"
  - "retención"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0042
  prompt:
    es: "Don Julián Roca, escritor, cede a la editorial Letras Vivas, S.L., el derecho a explotar una obra literaria y cobra 4.000 euros, habiendo comunicado a la editorial sus circunstancias. Los rendimientos íntegros de esa clase del ejercicio anterior fueron 12.000 euros y representaron el 80 por ciento de la suma de sus rendimientos íntegros de actividades económicas y del trabajo. Según el artículo 101.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué retención practica la editorial?"
  options:
  - id: a
    text:
      es: "960 euros, el 24 por ciento de 4.000 euros."
  - id: b
    text:
      es: "600 euros, el 15 por ciento de 4.000 euros."
  - id: c
    text:
      es: "760 euros, el 19 por ciento de 4.000 euros."
  - id: d
    correct: true
    text:
      es: "280 euros, el 7 por ciento de 4.000 euros."
  explanation:
    es: "Para las obras literarias rige el 7 por ciento si el volumen de rendimientos íntegros del ejercicio anterior es inferior a 15.000 euros y representa más del 75 por ciento de la suma de los rendimientos de actividades económicas y del trabajo (artículo 101.3). Aquí 12.000 euros es inferior a 15.000 y el 80 por ciento supera el 75, así que la retención es el 7 por ciento de 4.000, es decir, 280 euros. Los 600 euros corresponden al tipo general del 15 por ciento, que se aplica cuando no se cumplen ambos requisitos. Los 760 euros y los 960 euros aplican el 19 y el 24 por ciento, que son tipos de otras rentas."
  citation: "art. 101.3 LIRPF"
  difficulty: 3
  tags:
  - "cómputo"
  - "porcentajes"
  - "retención"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0043
  prompt:
    es: "Doña Nuria Bosch, escritora, cede a la editorial Ediciones Torre, S.L., el derecho a explotar una obra literaria y cobra 2.000 euros. Sus rendimientos íntegros de esa clase del ejercicio anterior fueron 14.000 euros y suponen el 70 por ciento de la suma de sus rendimientos íntegros de actividades económicas y del trabajo de ese ejercicio. Conforme al artículo 101.3 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué retención corresponde?"
  options:
  - id: a
    correct: true
    text:
      es: "300 euros, el 15 por ciento de 2.000 euros, porque esos rendimientos no superan el 75 por ciento de la suma."
  - id: b
    text:
      es: "0 euros, porque la cesión del derecho a explotar una obra no está sujeta a retención."
  - id: c
    text:
      es: "380 euros, el 19 por ciento de 2.000 euros, porque se trata de rendimientos del trabajo sin tipo específico."
  - id: d
    text:
      es: "140 euros, el 7 por ciento de 2.000 euros, porque el volumen de 14.000 euros es inferior a 15.000 euros."
  explanation:
    es: "El 7 por ciento exige dos requisitos a la vez: rendimientos del ejercicio anterior inferiores a 15.000 euros y más del 75 por ciento de la suma de rendimientos de actividades económicas y del trabajo (artículo 101.3). Los 14.000 euros cumplen el primero, pero el 70 por ciento no supera el 75, así que se aplica el 15 por ciento general: 300 euros. Aplicar el 7 por ciento mirando solo el volumen ignora el segundo requisito. El 19 por ciento no es el tipo de estos rendimientos, que tienen su tipo propio en el apartado. La cesión del derecho de explotación sí está sujeta, porque el propio apartado fija su porcentaje."
  citation: "art. 101.3 LIRPF"
  difficulty: 3
  tags:
  - "cómputo"
  - "porcentajes"
  - "retención"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0044
  prompt:
    es: "De acuerdo con el artículo 101.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, tratándose de atrasos del trabajo que corresponda imputar a ejercicios anteriores, el porcentaje de retención e ingreso a cuenta será del 15 por ciento, salvo que resulten de aplicación los porcentajes previstos para:"
  options:
  - id: a
    correct: true
    text:
      es: "los administradores y miembros de consejos de administración, y para los cursos, conferencias u obras literarias, artísticas o científicas."
  - id: b
    text:
      es: "las ganancias patrimoniales y los premios por participación en juegos, concursos, rifas o combinaciones aleatorias."
  - id: c
    text:
      es: "el capital mobiliario y las actividades económicas, que tienen sus propios porcentajes."
  - id: d
    text:
      es: "el arrendamiento de inmuebles urbanos y la propiedad industrial, con independencia de su calificación."
  explanation:
    es: "Los atrasos se retienen al 15 por ciento salvo que resulten aplicables los porcentajes de los administradores y miembros de consejos de administración o los de cursos, conferencias y obras literarias, artísticas o científicas (artículo 101.1, con remisión a los apartados 2 y 3). El capital mobiliario y las actividades económicas, las ganancias patrimoniales y los premios, y el arrendamiento y la propiedad industrial tienen porcentajes propios en otros apartados, pero el artículo 101.1 no los prevé como excepción para los atrasos."
  citation: "art. 101.1 LIRPF"
  difficulty: 3
  tags:
  - "porcentajes"
  - "retención"
  - "atrasos"
# anchor: boe-a-2006-20764-art-101
- id: m03-l06-q0045
  prompt:
    es: "En octubre de 2026, la empresa Manufacturas Duero, S.A., abona a un trabajador 4.000 euros de atrasos de su salario que corresponde imputar a 2025. No se trata de rendimientos de administradores ni de cursos, conferencias u obras. Conforme al artículo 101.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿qué retención corresponde sobre esos atrasos?"
  options:
  - id: a
    correct: true
    text:
      es: "600 euros, el 15 por ciento de los atrasos."
  - id: b
    text:
      es: "280 euros, el 7 por ciento de los atrasos."
  - id: c
    text:
      es: "760 euros, el 19 por ciento de los atrasos."
  - id: d
    text:
      es: "1.400 euros, el 35 por ciento de los atrasos."
  explanation:
    es: "Los atrasos que corresponde imputar a ejercicios anteriores se retienen al 15 por ciento, salvo los casos de los apartados 2 y 3 del artículo 101, que aquí no concurren: 15 por ciento de 4.000 euros son 600 euros. El 19 por ciento es el tipo de otras rentas, como el arrendamiento. El 35 por ciento corresponde a administradores y miembros de consejos, y el 7 por ciento a obras literarias o anticipos de derechos de autor."
  citation: "art. 101.1 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "porcentajes"
  - "atrasos"
