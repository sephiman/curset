- id: g-outbox-pattern
  term: {en: outbox pattern}
  definition: {en: "A way to safely and reliably exchange data between multiple (micro) services. An implementation avoids inconsistencies between a service's internal state and the state in events consumed by services that need the same data."}
  origin: m08-l03
  citation: "debezium-outbox-event-router#dbz-doc-main"
- id: g-logical-decoding
  term: {en: logical decoding}
  definition: {en: "A PostgreSQL mechanism that allows the extraction of the changes that were committed to the transaction log and the processing of these changes with the help of an output plug-in."}
  origin: m08-l03
  citation: "debezium-postgresql#postgresql-overview"
- id: g-skip-locked
  term: {en: SKIP LOCKED}
  definition: {en: "A locking option of SELECT where any selected rows that cannot be immediately locked are skipped."}
  origin: m08-l03
  citation: "pg-sql-select#SQL-FOR-UPDATE-SHARE"
