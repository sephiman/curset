    sentence: For example, if you provide web-specific configuration, your class may need to be applied after WebMvcAutoConfiguration.
  - option: '`@DependsOn`, because it orders the beans of the classes'
    anchor: spring-boot-features-developing-auto-configuration#features.developing-auto-configuration.locating-auto-configuration-candidates
    sentence: The order in which those beans are subsequently created is unaffected and is determined by each bean’s dependencies and any @DependsOn relationships.
  - option: '`@ComponentScan`, because it finds the classes in order'
    anchor: spring-boot-features-developing-auto-configuration#features.developing-auto-configuration.locating-auto-configuration-candidates
    sentence: Make sure that they are defined in a specific package space and that they are never the target of component scanning.
