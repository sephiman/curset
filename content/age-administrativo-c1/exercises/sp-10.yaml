# anchor: boe-a-2015-10565-art-87
- id: q05
  lesson: m03-l03
  prompt:
    es: "Conforme a la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la fecha límite para practicar las actuaciones complementarias que la Presidencia del FEGA acuerda en el reintegro de Ganadería Sierra Norte, S.L. es:"
  options:
  - id: a
    text:
      es: "El miércoles, 10 de noviembre de 2027."
  - id: b
    correct: true
    text:
      es: "El jueves, 18 de noviembre de 2027."
  - id: c
    text:
      es: "El martes, 16 de noviembre de 2027."
  - id: d
    text:
      es: "El miércoles, 17 de noviembre de 2027."
  explanation:
    es: "Las actuaciones complementarias deben practicarse en un plazo no superior a quince días (art. 87 LPAC), hábiles (art. 30.2). Se cuentan desde el miércoles, 27 de octubre de 2027, sin los festivos del lunes 1 y el martes 9 de noviembre: el 27, 28 y 29 de octubre son 3, del martes 2 al viernes 5 de noviembre van 7, el lunes 8 es el 8, del miércoles 10 al viernes 12 van 11, y del lunes 15 al jueves 18 completan los 15. Termina el jueves, 18 de noviembre de 2027. La fecha del miércoles, 10 de noviembre de 2027, cuenta quince días naturales. La del martes, 16 de noviembre de 2027, no descuenta ningún festivo. La del miércoles, 17 de noviembre de 2027, descuenta el 1 de noviembre pero no el 9."
  citation: "art. 87 LPAC"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2006-13371-art-70
- id: q06
  lesson: m05-l06
  prompt:
    es: "Señale la respuesta correcta sobre la fecha en que vence el plazo improrrogable que el Reglamento de la Ley General de Subvenciones, aprobado por el Real Decreto 887/2006, de 21 de julio, da a Frutas del Jarama, S.L. para presentar la justificación:"
  options:
  - id: a
    correct: true
    text:
      es: "El miércoles, 29 de septiembre de 2027."
  - id: b
    text:
      es: "El jueves, 23 de septiembre de 2027."
  - id: c
    text:
      es: "El martes, 28 de septiembre de 2027."
  - id: d
    text:
      es: "El miércoles, 22 de septiembre de 2027."
  explanation:
    es: "Transcurrido el plazo de justificación, el órgano competente requiere al beneficiario para que la presente en el plazo improrrogable de quince días (art. 70.3 RLGS). El reglamento no habla de días naturales, y los plazos por días son hábiles (art. 30.2 LPAC). Se cuentan desde el jueves, 9 de septiembre de 2027, sin festivos: el 9 y el 10 son 2, del lunes 13 al viernes 17 van 7, del 20 al 24 van 12, y el lunes 27, el martes 28 y el miércoles 29 completan los 15. Termina el miércoles, 29 de septiembre de 2027. La fecha del jueves, 23 de septiembre de 2027, cuenta quince días naturales. La del martes, 28 de septiembre de 2027, cuenta el día del requerimiento como primero. La del miércoles, 22 de septiembre de 2027, aplica los diez días de la subsanación del artículo 68 LPAC."
  citation: "art. 70.3 RLGS"
  difficulty: 1
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-158
- id: q24
  lesson: m03-l04
  prompt:
    es: "¿Hasta qué fecha podía el FEGA adjudicar el contrato de servicios de auditoría, según la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, si el pliego no fija otro plazo y no procede ampliarlo?"
  options:
  - id: a
    text:
      es: "El viernes, 2 de julio de 2027."
  - id: b
    text:
      es: "El martes, 7 de septiembre de 2027."
  - id: c
    correct: true
    text:
      es: "El martes, 17 de agosto de 2027."
  - id: d
    text:
      es: "El lunes, 19 de julio de 2027."
  explanation:
    es: "Con una pluralidad de criterios, el plazo máximo de adjudicación es de dos meses a contar desde la apertura de las proposiciones, salvo otro plazo del pliego (art. 158.2 LCSP). Los plazos por meses concluyen el mismo día del mes de vencimiento (art. 30.4 LPAC): del jueves, 17 de junio de 2027, al martes, 17 de agosto de 2027, que es día hábil. La fecha del viernes, 2 de julio de 2027, aplica los quince días del criterio único del precio (art. 158.1), que son naturales (disposición adicional duodécima). La del martes, 7 de septiembre de 2027, suma los quince días hábiles de ampliación por ofertas anormalmente bajas, que aquí no constan. La del lunes, 19 de julio de 2027, cuenta un solo mes y lo pasa al lunes por ser sábado el último día."
  citation: "art. 158.2 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-50
- id: q08
  lesson: m03-l04
  prompt:
    es: "Conforme al artículo 50.1 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿hasta qué fecha puede Controles Integrales del Centro, S.L. presentar el escrito del recurso especial contra la adjudicación ante el órgano competente?"
  options:
  - id: a
    text:
      es: "El martes, 3 de agosto de 2027."
  - id: b
    text:
      es: "El viernes, 6 de agosto de 2027."
  - id: c
    text:
      es: "El miércoles, 8 de septiembre de 2027."
  - id: d
    correct: true
    text:
      es: "El lunes, 9 de agosto de 2027."
  explanation:
    es: "El recurso especial contra la adjudicación se presenta en quince días hábiles desde el día siguiente a su notificación (art. 50.1 LCSP), ante el Tribunal Administrativo Central de Recursos Contractuales, que está en Madrid (art. 45.1), y cabe en un contrato de servicios de más de cien mil euros de valor estimado (art. 44.1). Agosto es hábil en el procedimiento administrativo. Se cuentan desde el martes, 20 de julio de 2027, sin festivos: del 20 al 23 van 4, del lunes 26 al viernes 30 van 9, del lunes 2 al viernes 6 de agosto van 14, y el lunes 9 de agosto es el día 15. Termina el lunes, 9 de agosto de 2027. La fecha del martes, 3 de agosto de 2027, cuenta quince días naturales. La del viernes, 6 de agosto de 2027, cuenta el día de la notificación como primero. La del miércoles, 8 de septiembre de 2027, excluye agosto como en el contencioso-administrativo, donde sí es inhábil."
  citation: "art. 50.1 LCSP"
  difficulty: 2
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2017-12902-art-210
- id: q09
  lesson: m03-l04
  prompt:
    es: "Según el artículo 210.2 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, el acto formal y positivo de recepción del informe final de Seguridad Digital Meseta, S.L. debe producirse, como máximo, no más tarde de:"
  options:
  - id: a
    correct: true
    text:
      es: "El martes, 7 de diciembre de 2027."
  - id: b
    text:
      es: "El sábado, 4 de diciembre de 2027."
  - id: c
    text:
      es: "El lunes, 6 de diciembre de 2027."
  - id: d
    text:
      es: "El viernes, 3 de diciembre de 2027."
  explanation:
    es: "La recepción exige un acto formal y positivo dentro del mes siguiente a la entrega, si el pliego no fija otro plazo (art. 210.2 LCSP). Los plazos por meses concluyen el mismo día del mes de vencimiento y, si ese día es inhábil, pasan al primer día hábil siguiente (art. 30.4 y 30.5 LPAC). El mes de la entrega del jueves, 4 de noviembre de 2027, acaba el sábado, 4 de diciembre; el lunes, 6 de diciembre, es festivo, y el plazo termina el martes, 7 de diciembre de 2027. La fecha del sábado, 4 de diciembre de 2027, no prorroga el último día inhábil. La del lunes, 6 de diciembre de 2027, olvida que es festivo. La del viernes, 3 de diciembre de 2027, cuenta el día de la entrega como primero."
  citation: "art. 210.2 LCSP"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-2003-21614-art-60
- id: q27
  lesson: m05-l02
  prompt:
    es: "Las Cortes Generales no aprueban el proyecto de ley del crédito extraordinario del FEGA. Según el artículo 60.3 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿con cargo a qué se cancela el anticipo de Tesorería que el Gobierno concedió al organismo?"
  options:
  - id: a
    correct: true
    text:
      es: "Con cargo a los créditos del FEGA cuya minoración ocasione menos trastornos para el servicio público."
  - id: b
    text:
      es: "Con cargo al Fondo de Contingencia, que atiende los créditos extraordinarios que las Cortes no aprueban."
  - id: c
    text:
      es: "Con cargo al remanente de tesorería del FEGA no aplicado a su presupuesto al fin del ejercicio anterior."
  - id: d
    text:
      es: "Con una nueva operación de Tesorería, que el Gobierno autoriza para devolver el anticipo concedido."
  explanation:
    es: "Si las Cortes Generales no aprueban el proyecto de ley del crédito extraordinario, el Gobierno, a propuesta del Ministro de Hacienda, cancela el anticipo con cargo a los créditos del departamento ministerial u organismo autónomo cuya minoración ocasione menos trastornos para el servicio público (art. 60.3 LGP). Como el gasto inaplazable es del FEGA, que es organismo autónomo, se minoran créditos del propio FEGA. El Fondo de Contingencia financia créditos extraordinarios, no cancela anticipos. El remanente de tesorería no aplicado financia los créditos extraordinarios de un organismo autónomo (art. 56.2 LGP), no la cancelación. La nueva operación de Tesorería sustituiría una deuda por otra y la ley no la prevé."
  citation: "art. 60.3 LGP"
  difficulty: 2
  tags:
  - "órgano"
  - "requisito"
# anchor: boe-a-2023-25758-art-114
- id: q11
  lesson: m04-l03
  prompt:
    es: "De las siguientes opciones, ¿cuál es la condición que tiene Don Abel Quintanilla Soto durante el curso selectivo que realiza en el FEGA como fase del proceso de ingreso?"
  options:
  - id: a
    text:
      es: "Funcionario de carrera, con destino provisional en el FEGA hasta superar el curso."
  - id: b
    text:
      es: "Funcionario interino, nombrado para cubrir una plaza vacante mientras dura el curso."
  - id: c
    text:
      es: "Aspirante sin condición de funcionario, que solo la adquiere al tomar posesión de su destino."
  - id: d
    correct: true
    text:
      es: "Personal funcionario en prácticas, mientras dura esa fase del proceso selectivo de ingreso."
  explanation:
    es: "Los sistemas de selección pueden incorporar un curso selectivo, y durante esa fase la persona aspirante tiene la condición de personal funcionario en prácticas (art. 114.8 RDL 6/2023). No es funcionario de carrera, que exige además nombramiento, acatamiento y toma de posesión. Tampoco es interino, que cubre plazas vacantes o necesidades temporales y no accede por un proceso de ingreso a un cuerpo. La opción del aspirante sin condición de funcionario hasta tomar posesión ignora que el curso selectivo ya le da la de funcionario en prácticas."
  citation: "art. 114.8 RDL 6/2023"
  difficulty: 1
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-2023-25758-art-114
- id: q21
  lesson: m04-l04
  prompt:
    es: "Conforme al Real Decreto-ley 6/2023, de 19 de diciembre, ¿hasta qué fecha debe tomar posesión Doña Leonor Escudero Navas como funcionaria de carrera, a contar desde la publicación de su nombramiento?"
  options:
  - id: a
    text:
      es: "El sábado, 31 de julio de 2027."
  - id: b
    correct: true
    text:
      es: "El lunes, 2 de agosto de 2027."
  - id: c
    text:
      es: "El viernes, 30 de julio de 2027."
  - id: d
    text:
      es: "El martes, 17 de agosto de 2027."
  explanation:
    es: "La toma de posesión del funcionario de carrera es dentro de quince días naturales a partir de la publicación del nombramiento, y de un mes si supone cambio de localidad de residencia (art. 114.12 RDL 6/2023); Doña Leonor ya reside en Madrid, donde está su destino. Los días se cuentan desde el día siguiente (art. 30.3 LPAC): el sábado, 17 de julio de 2027, es el primero y el sábado, 31 de julio de 2027, el decimoquinto. Como es inhábil, el plazo pasa al lunes, 2 de agosto de 2027 (art. 30.5). La fecha del sábado, 31 de julio de 2027, no prorroga el último día inhábil. La del viernes, 30 de julio de 2027, cuenta el día de la publicación como primero. La del martes, 17 de agosto de 2027, aplica el mes del cambio de residencia, que acaba el lunes, 16 de agosto, festivo en Madrid, y pasa al día hábil siguiente."
  citation: "art. 114.12 RDL 6/2023"
  difficulty: 3
  tags:
  - "plazo"
  - "cómputo"
# anchor: boe-a-1995-8730-art-15
