m09-case-b-q01:
  key:
    anchor: pg-sql-select#SQL-FOR-UPDATE-SHARE
    sentence: With NOWAIT, the statement reports an error, rather than waiting, if a selected row cannot be locked immediately.
  wrong:
  - option: '`SKIP LOCKED`'
    anchor: pg-sql-select#SQL-FOR-UPDATE-SHARE
    sentence: With SKIP LOCKED, any selected rows that cannot be immediately locked are skipped.
  - option: '`FOR SHARE`'
    anchor: pg-explicit-locking#LOCKING-ROWS
    sentence: A shared lock blocks other transactions from performing UPDATE, DELETE, SELECT FOR UPDATE or SELECT FOR NO KEY UPDATE on these rows
  - option: '`FOR KEY SHARE`'
    anchor: pg-explicit-locking#LOCKING-ROWS
    sentence: 'Behaves similarly to FOR SHARE, except that the lock is weaker: SELECT FOR UPDATE is blocked, but not SELECT FOR NO KEY UPDATE.'
