# anchor: boe-a-2006-20764-art-58
- id: m03-l16-q0046
  prompt:
    es: "Según el artículo 58.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el mínimo por descendientes es de 2.400 euros anuales por el primero, 2.700 euros por el segundo, 4.000 euros por el tercero y:"
  options:
  - id: a
    text:
      es: "4.000 euros anuales por el cuarto y siguientes."
  - id: b
    correct: true
    text:
      es: "4.500 euros anuales por el cuarto y siguientes."
  - id: c
    text:
      es: "5.500 euros anuales por el cuarto y siguientes."
  - id: d
    text:
      es: "4.500 euros anuales solo por el cuarto."
  explanation:
    es: "La escala termina en 4.500 euros anuales por el cuarto y siguientes (art. 58.1). Mantener los 4.000 euros del tercero no crea el escalón. Los 5.500 euros no son una cuantía de la ley. Y limitar los 4.500 euros al cuarto deja sin cuantía a los siguientes."
  citation: "art. 58.1 LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-58
- id: m03-l16-q0047
  prompt:
    es: "Elena Ruiz convive con sus tres hijos de 20, 17 y 14 años, que no tienen rentas ni discapacidad. Ningún otro contribuyente tiene derecho al mínimo por ellos. Según el artículo 58.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál es su mínimo por descendientes?"
  options:
  - id: a
    correct: true
    text:
      es: "Su mínimo por descendientes es de 9.100 euros anuales."
  - id: b
    text:
      es: "Su mínimo por descendientes es de 7.200 euros anuales."
  - id: c
    text:
      es: "Su mínimo por descendientes es de 9.600 euros anuales."
  - id: d
    text:
      es: "Su mínimo por descendientes es de 11.900 euros anuales."
  explanation:
    es: "Los tres hijos son menores de veinticinco años y conviven con ella, de modo que el mínimo es 2.400 + 2.700 + 4.000 = 9.100 euros (art. 58.1). Aplicar 2.400 euros a cada hijo da 7.200. Tomar 4.500 euros para el tercero da 9.600. Y añadir 2.800 euros, que solo corresponden a menores de tres años, da 11.900."
  citation: "art. 58.1 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2006-20764-art-58
- id: m03-l16-q0048
  prompt:
    es: "¿Cuál es el importe máximo de rentas anuales, excluidas las exentas, que puede tener un descendiente para que genere el mínimo por descendientes según el artículo 58.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas?"
  options:
  - id: a
    correct: true
    text:
      es: "Es de 8.000 euros anuales."
  - id: b
    text:
      es: "Es de 1.800 euros anuales."
  - id: c
    text:
      es: "Es de 5.550 euros anuales."
  - id: d
    text:
      es: "Es de 22.000 euros anuales."
  explanation:
    es: "El descendiente que genera el mínimo no puede tener rentas anuales superiores a 8.000 euros, excluidas las exentas (art. 58.1). Los 1.800 euros son el límite de rentas del artículo 61 cuando el descendiente presenta declaración. Los 5.550 euros son el mínimo del contribuyente y los 22.000 euros, el límite de obligación de declarar por rendimientos del trabajo."
  citation: "art. 58.1 LIRPF"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-58
- id: m03-l16-q0049
  prompt:
    es: "De acuerdo con el artículo 58.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, el mínimo por descendientes se aplica por cada descendiente que sea:"
  options:
  - id: a
    text:
      es: "menor de dieciocho años, o con discapacidad cualquiera que sea su edad."
  - id: b
    text:
      es: "menor de veinticinco años, y con discapacidad en todo caso."
  - id: c
    text:
      es: "menor de treinta años, o con discapacidad solo si es menor de edad."
  - id: d
    correct: true
    text:
      es: "menor de veinticinco años, o con discapacidad cualquiera que sea su edad."
  explanation:
    es: "El mínimo se aplica por cada descendiente menor de veinticinco años o con discapacidad cualquiera que sea su edad (art. 58.1). Fijar los dieciocho años o los treinta recorta o amplía la edad. Exigir además la discapacidad convierte en acumulativos dos requisitos que la ley presenta como alternativos. Y limitar la discapacidad a los menores de edad contradice el \"cualquiera que sea su edad\"."
  citation: "art. 58.1 LIRPF"
  difficulty: 1
  tags:
  - "condición"
# anchor: boe-a-2006-20764-art-58
- id: m03-l16-q0050
  prompt:
    es: "Conforme al artículo 58.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, señale la respuesta CORRECTA sobre las personas asimiladas a los descendientes a efectos del mínimo por descendientes:"
  options:
  - id: a
    text:
      es: "Solo son descendientes quienes tienen vínculo de filiación con el contribuyente, sin asimilar a los tutelados ni acogidos."
  - id: b
    text:
      es: "Se asimilan a los descendientes únicamente los tutelados; los acogidos quedan excluidos."
  - id: c
    correct: true
    text:
      es: "Se asimilan a los descendientes las personas vinculadas al contribuyente por razón de tutela y acogimiento, en los términos de la legislación civil aplicable."
  - id: d
    text:
      es: "Se asimila a la convivencia la dependencia respecto del contribuyente en todo caso, incluso cuando resulte de aplicación lo dispuesto en los artículos 64 y 75."
  explanation:
    es: "La ley asimila a los descendientes a quienes están vinculados al contribuyente por tutela y acogimiento, en los términos de la legislación civil (art. 58.1). Limitarlo a la filiación o a los tutelados deja fuera casos que el texto incluye. La dependencia se asimila a la convivencia salvo cuando sea aplicable lo dispuesto en los artículos 64 y 75, de modo que no vale en todo caso."
  citation: "art. 58.1 LIRPF"
  difficulty: 2
  tags:
  - "sujeto"
# anchor: boe-a-2006-20764-art-58
- id: m03-l16-q0051
  prompt:
    es: "Según el artículo 58.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿en cuántos euros anuales se aumenta el mínimo por descendientes cuando el descendiente es menor de tres años?"
  options:
  - id: a
    text:
      es: "Se aumenta en 2.400 euros anuales."
  - id: b
    correct: true
    text:
      es: "Se aumenta en 2.800 euros anuales."
  - id: c
    text:
      es: "Se aumenta en 1.400 euros anuales."
  - id: d
    text:
      es: "Se aumenta en 3.000 euros anuales."
  explanation:
    es: "El aumento por descendiente menor de tres años es de 2.800 euros anuales (art. 58.2). Los 2.400 euros son la cuantía por el primer descendiente, los 1.400 euros el aumento por superar los 75 años de un ascendiente y los 3.000 euros el mínimo por discapacidad del contribuyente."
  citation: "art. 58.2 LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-58
- id: m03-l16-q0052
  prompt:
    es: "Lucía Vera convive con su hija de 2 años a la fecha de devengo. La niña no tiene rentas y ningún otro contribuyente tiene derecho al mínimo por ella. Es la única descendiente de Lucía. Conforme al artículo 58 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál es el mínimo por descendientes?"
  options:
  - id: a
    text:
      es: "El mínimo por descendientes es de 2.400 euros anuales."
  - id: b
    correct: true
    text:
      es: "El mínimo por descendientes es de 5.200 euros anuales."
  - id: c
    text:
      es: "El mínimo por descendientes es de 2.800 euros anuales."
  - id: d
    text:
      es: "El mínimo por descendientes es de 5.500 euros anuales."
  explanation:
    es: "Por el primer descendiente corresponden 2.400 euros y, al ser menor de tres años, el mínimo se aumenta en 2.800: 2.400 + 2.800 = 5.200 euros (art. 58.1 y 58.2). Los 2.400 euros olvidan el aumento y los 2.800 euros olvidan la cuantía base. Los 5.500 euros parten de la cuantía del segundo descendiente, 2.700, que no es la que corresponde a una única hija."
  citation: "art. 58.2 LIRPF"
  difficulty: 2
  tags:
  - "cómputo"
  - "cantidad"
# anchor: boe-a-2006-20764-art-58
- id: m03-l16-q0053
  prompt:
    es: "Conforme al artículo 58.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, en los supuestos de adopción o acogimiento, tanto preadoptivo como permanente, el aumento se produce, con independencia de la edad del menor, en el período impositivo en que se inscriba en el Registro Civil y:"
  options:
  - id: a
    correct: true
    text:
      es: "en los dos períodos impositivos siguientes."
  - id: b
    text:
      es: "en los tres períodos impositivos siguientes."
  - id: c
    text:
      es: "en el período impositivo siguiente únicamente."
  - id: d
    text:
      es: "en los cuatro períodos impositivos siguientes."
  explanation:
    es: "El aumento se aplica en el período de la inscripción y en los dos siguientes (art. 58.2). Tres años es la duración de la deducción por maternidad en adopción (art. 81.1), no la del aumento del mínimo. Uno y cuatro períodos no coinciden con el texto."
  citation: "art. 58.2 LIRPF"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-58
- id: m03-l16-q0054
  prompt:
    es: "Según el artículo 58.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, cuando en una adopción o acogimiento no sea necesaria la inscripción en el Registro Civil, ¿cuándo se puede practicar el aumento del mínimo por descendientes menores de tres años?"
  options:
  - id: a
    text:
      es: "En el período impositivo en que el menor cumpla tres años y en los dos siguientes."
  - id: b
    text:
      es: "Únicamente en el período impositivo en que se produzca la resolución judicial o administrativa."
  - id: c
    text:
      es: "En el período impositivo en que se produzca la resolución judicial o administrativa y en los tres siguientes."
  - id: d
    correct: true
    text:
      es: "En el período impositivo en que se produzca la resolución judicial o administrativa correspondiente y en los dos siguientes."
  explanation:
    es: "Sin inscripción, el aumento se practica en el período de la resolución judicial o administrativa y en los dos siguientes (art. 58.2). Tomar como punto de partida el cumpleaños de tres años no tiene apoyo en el texto. Aplicarlo solo en el período de la resolución o ampliarlo a tres períodos cambia la duración."
  citation: "art. 58.2 LIRPF"
  difficulty: 3
  tags:
  - "plazo"
# anchor: boe-a-2006-20764-art-59
- id: m03-l16-q0055
  prompt:
    es: "De acuerdo con el artículo 59.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, ¿cuál es el importe anual del mínimo por ascendientes por cada ascendiente mayor de 65 años que conviva con el contribuyente y cumpla el límite de rentas?"
  options:
  - id: a
    text:
      es: "Es de 1.400 euros anuales."
  - id: b
    text:
      es: "Es de 2.400 euros anuales."
  - id: c
    correct: true
    text:
      es: "Es de 1.150 euros anuales."
  - id: d
    text:
      es: "Es de 2.550 euros anuales."
  explanation:
    es: "El mínimo por ascendientes es de 1.150 euros anuales por cada ascendiente mayor de 65 años que conviva con el contribuyente y no supere los 8.000 euros de rentas (art. 59.1). Los 1.400 euros son el aumento para mayores de 75 años. Los 2.400 euros son la cuantía por el primer descendiente. Y los 2.550 euros, la suma de la cuantía base y del aumento, solo corresponde a mayores de 75."
  citation: "art. 59.1 LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-59
- id: m03-l16-q0056
  prompt:
    es: "Según el artículo 59.2 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, cuando el ascendiente es mayor de 75 años, el mínimo por ascendientes se aumenta en:"
  options:
  - id: a
    text:
      es: "una cantidad de 2.800 euros anuales."
  - id: b
    text:
      es: "una cantidad de 2.400 euros anuales."
  - id: c
    correct: true
    text:
      es: "una cantidad de 1.400 euros anuales."
  - id: d
    text:
      es: "una cantidad de 1.200 euros anuales."
  explanation:
    es: "El aumento para ascendientes mayores de 75 años es de 1.400 euros anuales (art. 59.2). Los 2.800 euros son el aumento por descendiente menor de tres años, los 2.400 euros la cuantía por el primer descendiente y los 1.200 euros no figuran en el artículo."
  citation: "art. 59.2 LIRPF"
  difficulty: 1
  tags:
  - "cantidad"
# anchor: boe-a-2006-20764-art-59
- id: m03-l16-q0057
  prompt:
    es: "De acuerdo con el artículo 59.1 de la Ley 35/2006, de 28 de noviembre, del Impuesto sobre la Renta de las Personas Físicas, entre otros casos, se considera que conviven con el contribuyente los ascendientes con discapacidad que, dependiendo del mismo, sean:"
  options:
  - id: a
    text:
      es: "atendidos en su propio domicilio por una persona contratada."
  - id: b
    correct: true
    text:
      es: "internados en centros especializados."
  - id: c
    text:
      es: "residentes en otra localidad con una pensión de la Seguridad Social."
  - id: d
    text:
      es: "mayores de 75 años que vivan en una residencia privada sin depender del contribuyente."
  explanation:
    es: "La ley considera que conviven los ascendientes con discapacidad que, dependiendo del contribuyente, estén internados en centros especializados (art. 59.1). Los demás supuestos no dependen del contribuyente o no están en el texto: atención domiciliaria por un tercero, residencia en otra localidad con pensión propia o residencia privada sin dependencia."
  citation: "art. 59.1 LIRPF"
  difficulty: 2
  tags:
  - "condición"
