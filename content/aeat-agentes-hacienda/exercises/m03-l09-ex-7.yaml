# anchor: boe-a-2005-14803-art-52
- id: m03-l09-q0184
  prompt:
    es: "Según el artículo 52.4.a del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si el acuerdo denegatorio de un aplazamiento solicitado en período voluntario se cumple ingresando la deuda en el plazo del artículo 62.2 de la Ley General Tributaria, procederá la liquidación de los intereses de demora devengados:"
  options:
  - id: a
    text:
      es: "A partir del día de presentación de la solicitud hasta la fecha de notificación de la denegación."
  - id: b
    text:
      es: "A partir del día siguiente al de la notificación de la denegación hasta la fecha del ingreso realizado."
  - id: c
    correct: true
    text:
      es: "A partir del día siguiente al del vencimiento del plazo de ingreso en período voluntario hasta la fecha del ingreso realizado."
  - id: d
    text:
      es: "A partir del día de la providencia de apremio hasta la fecha del ingreso realizado."
  explanation:
    es: "Los intereses se liquidan desde el día siguiente al del vencimiento del plazo voluntario hasta la fecha del ingreso hecho en el plazo abierto con la denegación (artículo 52.4.a). No empiezan con la solicitud ni con la notificación de la denegación, y no hay providencia de apremio porque se ingresó a tiempo."
  citation: "art. 52.4 RGR"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "resolución"
  - "denegación"
  - "intereses"
# anchor: boe-a-2005-14803-art-52
- id: m03-l09-q0185
  prompt:
    es: "De acuerdo con el artículo 52.2 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, en la resolución que concede el aplazamiento o fraccionamiento podrán establecerse las condiciones que se estimen oportunas para asegurar:"
  options:
  - id: a
    correct: true
    text:
      es: "El pago efectivo en el plazo más breve posible y la preferencia de la deuda aplazada o fraccionada."
  - id: b
    text:
      es: "El pago efectivo en el plazo más largo posible y la preferencia de la deuda aplazada o fraccionada."
  - id: c
    text:
      es: "El pago efectivo en el plazo más breve posible, sin afectar a la preferencia de la deuda aplazada."
  - id: d
    text:
      es: "El pago efectivo en el plazo que designe el obligado y la preferencia de sus demás deudas."
  explanation:
    es: "La resolución puede establecer condiciones para asegurar el pago efectivo en el plazo más breve posible y garantizar la preferencia de la deuda aplazada o fraccionada (artículo 52.2). El plazo más largo, el que designe el obligado o la preferencia de sus otras deudas no son las finalidades del precepto."
  citation: "art. 52.2 RGR"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "resolución"
# anchor: boe-a-2005-14803-art-54
- id: m03-l09-q0186
  prompt:
    es: "Conforme al artículo 54.2.b del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, si en un fraccionamiento con dispensa total de garantías no se paga una fracción con deudas en período voluntario al solicitarse, se exige su importe, los intereses hasta el vencimiento y:"
  options:
  - id: a
    text:
      es: "El recargo del período ejecutivo sobre el importe de la fracción, sin los intereses."
  - id: b
    correct: true
    text:
      es: "El recargo del período ejecutivo sobre la suma de ambos conceptos."
  - id: c
    text:
      es: "El recargo del período ejecutivo sobre el total de las fracciones pendientes."
  - id: d
    text:
      es: "Un recargo del 25 por ciento sobre la suma de ambos conceptos."
  explanation:
    es: "Se exige el importe de la fracción, sus intereses y el recargo del período ejecutivo sobre la suma de ambos conceptos (artículo 54.2.b). El recargo no se calcula solo sobre el importe, ni sobre el total de las fracciones pendientes, y no es del 25 por ciento."
  citation: "art. 54.2 RGR"
  difficulty: 2
  tags:
  - "aplazamiento"
  - "falta de pago"
  - "fraccionamiento"
# anchor: boe-a-2005-14803-art-46
- id: m03-l09-q0191
  prompt:
    es: "Según el artículo 46.6 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, el órgano competente notifica el lunes 8 de marzo de 2027 a Floristería Jara, S.L. un requerimiento para subsanar su solicitud de aplazamiento, que no reúne los requisitos. Sin festivos, ¿hasta qué día puede la sociedad atender el requerimiento?"
  options:
  - id: a
    correct: true
    text:
      es: "El lunes 22 de marzo de 2027, a los diez días hábiles contados desde el día siguiente a la notificación."
  - id: b
    text:
      es: "El jueves 18 de marzo de 2027, a los diez días naturales contados desde el día siguiente a la notificación."
  - id: c
    text:
      es: "El viernes 19 de marzo de 2027, a los diez días hábiles contados desde el mismo día de la notificación."
  - id: d
    text:
      es: "El jueves 8 de abril de 2027, a un mes contado desde el día siguiente a la notificación."
  explanation:
    es: "El órgano competente requiere al solicitante que subsane en 10 días contados a partir del siguiente al de la notificación del requerimiento (art. 46.6 RGR). Los plazos señalados por días excluyen los sábados, los domingos y los festivos (art. 30.2 de la Ley 39/2015). Desde el martes 9 de marzo, los diez días hábiles son el 9, 10, 11 y 12, del 15 al 19 y el 22 de marzo, y el plazo acaba el lunes 22. Contar días naturales da el jueves 18. Contar como primero el día de la notificación da el viernes 19, y la norma empieza al día siguiente. Un mes no es el plazo del requerimiento."
  citation: "art. 46.6 RGR"
  difficulty: 2
  tags:
  - "cómputo"
  - "subsanación"
  - "días hábiles"
# anchor: boe-a-2005-14803-art-48
- id: m03-l09-q0192
  prompt:
    es: "A Panificadora Soto, S.L. se le notifica el martes 9 de febrero de 2027 el acuerdo de concesión de un aplazamiento que había solicitado el 5 de enero de 2027. Conforme al artículo 48.6 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, ¿hasta qué día debe formalizar la garantía para que el acuerdo conserve su eficacia?"
  options:
  - id: a
    text:
      es: "El martes 9 de marzo de 2027, a un mes de la notificación del acuerdo de concesión."
  - id: b
    text:
      es: "El lunes 9 de agosto de 2027, a los seis meses de la notificación del acuerdo de concesión."
  - id: c
    correct: true
    text:
      es: "El viernes 9 de abril de 2027, a los dos meses de la notificación del acuerdo de concesión."
  - id: d
    text:
      es: "El viernes 5 de marzo de 2027, a los dos meses de la presentación de la solicitud."
  explanation:
    es: "La garantía debe formalizarse en el plazo de dos meses contados a partir del día siguiente al de la notificación del acuerdo de concesión, y su eficacia queda condicionada a esa formalización (art. 48.6 RGR). Notificado el 9 de febrero de 2027, los dos meses acaban el 9 de abril de 2027, viernes. Un mes es la mitad del plazo. Seis meses es la cifra del artículo 48.5, que exige que la vigencia del aval exceda al menos en ese tiempo al vencimiento de los plazos garantizados, no el plazo para formalizar. Contar desde la solicitud, el 5 de enero, cambia el origen: el plazo corre desde la notificación del acuerdo."
  citation: "art. 48.6 RGR"
  difficulty: 2
  tags:
  - "cómputo"
  - "garantía"
  - "formalización"
# anchor: boe-a-2005-14803-art-47
- id: m03-l09-q0196
  prompt:
    es: "Conforme al artículo 47.4 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre el acuerdo de inadmisión de una solicitud de aplazamiento o fraccionamiento:"
  options:
  - id: a
    correct: true
    text:
      es: "Contra él cabe la interposición de recurso o reclamación económico-administrativa."
  - id: b
    text:
      es: "Contra él no cabe recurso alguno, porque la solicitud se tiene por no presentada."
  - id: c
    text:
      es: "Contra él cabe solo recurso de reposición, sin reclamación económico-administrativa."
  - id: d
    text:
      es: "Contra él cabe reclamación económico-administrativa, pero no recurso de reposición."
  explanation:
    es: "Contra el acuerdo de inadmisión cabe recurso o reclamación económico-administrativa (art. 47.4 RGR). Negar todo recurso contradice ese precepto: que la solicitud se tenga por no presentada (art. 47.3) no cierra la vía de impugnación del acuerdo. Las dos últimas opciones eligen una sola de las dos vías, y la norma admite ambas."
  citation: "art. 47.4 RGR"
  difficulty: 2
  tags:
  - "inadmisión"
  - "recursos"
# anchor: boe-a-2005-14803-art-52
- id: m03-l09-q0197
  prompt:
    es: "Según el artículo 52.6 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre la falta de notificación de la resolución de una solicitud de aplazamiento o fraccionamiento:"
  options:
  - id: a
    correct: true
    text:
      es: "Transcurridos seis meses sin notificación, la solicitud se puede entender desestimada para recurrir o esperar la resolución expresa."
  - id: b
    text:
      es: "Transcurridos seis meses sin notificación, la solicitud se entiende estimada y se concede con los plazos solicitados."
  - id: c
    text:
      es: "Transcurridos tres meses sin notificación, la solicitud se entiende desestimada y debe presentarse una nueva."
  - id: d
    text:
      es: "Transcurridos seis meses sin notificación, la solicitud caduca y se archiva sin posibilidad de recurso."
  explanation:
    es: "La resolución debe notificarse en el plazo de seis meses, y pasado ese plazo sin notificación la solicitud se puede entender desestimada a los efectos de interponer el recurso o esperar la resolución expresa (art. 52.6 RGR). La norma no prevé estimación por silencio, ni un plazo de tres meses, ni caducidad con archivo: el solicitante conserva la opción de recurrir la denegación presunta o aguardar la resolución."
  citation: "art. 52.6 RGR"
  difficulty: 2
  tags:
  - "resolución"
  - "silencio"
  - "recurso"
# anchor: boe-a-2005-14803-art-46
- id: m03-l09-q0198
  prompt:
    es: "De acuerdo con el artículo 46.1 del Real Decreto 939/2005, de 29 de julio, por el que se aprueba el Reglamento General de Recaudación, señale la respuesta CORRECTA sobre el plazo para presentar la solicitud de aplazamiento de una deuda en período voluntario de ingreso:"
  options:
  - id: a
    text:
      es: "En cualquier momento anterior a la notificación del acuerdo de enajenación de los bienes embargados."
  - id: b
    text:
      es: "Dentro de los diez días siguientes al vencimiento del plazo de ingreso en período voluntario."
  - id: c
    correct: true
    text:
      es: "Dentro del plazo de ingreso que fija la Ley General Tributaria para cada deuda o su normativa específica."
  - id: d
    text:
      es: "Hasta que se notifique la providencia de apremio de la deuda, aunque haya vencido el plazo de ingreso."
  explanation:
    es: "Las solicitudes de deudas en período voluntario se presentan dentro del plazo fijado para el ingreso en el artículo 62.1, 2 y 3 de la Ley General Tributaria o en la normativa específica (art. 46.1.a RGR). El momento anterior a la notificación del acuerdo de enajenación es el límite de las solicitudes de deudas en período ejecutivo (art. 46.1.b). Un plazo de diez días posterior al vencimiento voluntario no existe en la norma, y pedir el aplazamiento una vez vencido el plazo y hasta el apremio ya no es período voluntario."
  citation: "art. 46.1 RGR"
  difficulty: 1
  tags:
  - "solicitud"
  - "plazo"
  - "período voluntario"
# anchor: boe-a-2003-23186-art-65
- id: m03-l09-q0201
  prompt:
    es: "¿Cuál de las siguientes deudas tributarias es inaplazable, según el artículo 65.2 de la Ley 58/2003, de 17 de diciembre, General Tributaria?"
  options:
  - id: a
    text:
      es: "Una liquidación de IRPF practicada por la Administración y notificada en período voluntario."
  - id: b
    text:
      es: "La autoliquidación anual del Impuesto sobre Sociedades de una sociedad que la presenta en plazo."
  - id: c
    correct: true
    text:
      es: "La que se exige por medio de efectos timbrados."
  - id: d
    text:
      es: "Una deuda en período ejecutivo respecto de la cual todavía no se ha notificado el acuerdo de enajenación."
  explanation:
    es: "No pueden aplazarse ni fraccionarse las deudas cuya exacción se realice por medio de efectos timbrados (art. 65.2.a), y sus solicitudes se inadmiten. La liquidación de IRPF en período voluntario, la autoliquidación anual del Impuesto sobre Sociedades y la deuda en período ejecutivo no figuran entre las excepciones del artículo 65.2: el artículo 65.1 permite aplazar las deudas en ambos períodos, y la excepción de Sociedades afecta a los pagos fraccionados, no a la autoliquidación anual."
  citation: "art. 65.2 LGT"
  difficulty: 2
  tags:
  - "inaplazables"
  - "efectos timbrados"
