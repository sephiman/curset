m07-l04-q09:
  key:
    anchor: rfc9110#section-13.1.2
    sentence: An origin server that evaluates an If-None-Match condition MUST NOT perform the requested method if the condition evaluates to false; instead, the origin server MUST respond with either a) the 304 (Not Modified) status code if the request method is GET or HEAD or b) the 412 (Precondition Failed) status code for all other request methods.
  wrong:
  - option: '`200`'
    anchor: rfc9110#section-13.1.2
    sentence: An origin server that evaluates an If-None-Match condition MUST NOT perform the requested method if the condition evaluates to false; instead, the origin server MUST respond with either a) the 304 (Not Modified) status code if the request method is GET or HEAD or b) the 412 (Precondition Failed) status code for all other request methods.
    exclusive: true
  - option: '`412`'
    anchor: rfc9110#section-13.1.2
    sentence: An origin server that evaluates an If-None-Match condition MUST NOT perform the requested method if the condition evaluates to false; instead, the origin server MUST respond with either a) the 304 (Not Modified) status code if the request method is GET or HEAD or b) the 412 (Precondition Failed) status code for all other request methods.
    exclusive: true
  - option: '`204`'
    anchor: rfc9110#section-13.1.2
    sentence: An origin server that evaluates an If-None-Match condition MUST NOT perform the requested method if the condition evaluates to false; instead, the origin server MUST respond with either a) the 304 (Not Modified) status code if the request method is GET or HEAD or b) the 412 (Precondition Failed) status code for all other request methods.
    exclusive: true
m07-l04-q10:
  key:
    anchor: rfc9110#section-13.1.2
    sentence: If-None-Match can also be used with a value of "*" to prevent an unsafe request method (e.g., PUT) from inadvertently modifying an existing representation of the target resource when the client believes that the resource does not have a current representation (Section 9.2.1).
  wrong:
  - option: It makes the `PUT` succeed only when a current representation already exists
    anchor: rfc9110#section-13.1.2
    sentence: If the field value is "*", the condition is false if the origin server has a current representation for the target resource.
  - option: It makes the server answer the `PUT` with `304 Not Modified`
    anchor: rfc9110#section-13.1.2
    sentence: An origin server that evaluates an If-None-Match condition MUST NOT perform the requested method if the condition evaluates to false; instead, the origin server MUST respond with either a) the 304 (Not Modified) status code if the request method is GET or HEAD or b) the 412 (Precondition Failed) status code for all other request methods.
  - option: It can be combined with entity tags in one list, such as `*, "xyzzy"`
    anchor: rfc9110#section-13.1.2
    sentence: Note that an If-None-Match header field with a list value containing "*" and other values (including other instances of "*") is syntactically invalid
m07-l04-q11:
  key:
    anchor: rfc9110#section-12.5.5
    sentence: In other words, Vary expands the cache key required to match a new request to the stored cache entry.
  wrong:
  - option: It tells caches how long the response stays fresh
    anchor: rfc9111#section-4.2
    sentence: The primary mechanism for determining freshness is for an origin server to provide an explicit expiration time in the future, using either the Expires header field (Section 5.3) or the max-age response directive (Section 5.2.2.1).
  - option: It carries the entity tag that validates the stored response
    anchor: rfc9110#section-8.8.3
    sentence: The "ETag" field in a response provides the current entity tag for the selected representation, as determined at the conclusion of handling the request.
  - option: It forbids caches from storing the response at all
    anchor: rfc9110#section-12.5.5
    sentence: An origin server SHOULD generate a Vary header field on a cacheable response when it wishes that response to be selectively reused for subsequent requests.
m07-l04-q12:
  key:
    anchor: rfc9110#section-12.1
    sentence: It limits the reusability of responses for shared caching.
  wrong:
  - option: The server must send the user agent a list of representations to choose from
    anchor: rfc9110#section-12
    sentence: '"reactive" negotiation, where the server provides a list of representations for the user agent to choose from;'
  - option: A user agent can rely on its preferences always being honored by the origin server
    anchor: rfc9110#section-12.1
    sentence: A user agent cannot rely on proactive negotiation preferences being consistently honored
  - option: It avoids exposing the user agent's capabilities, since few request header fields are sent
    anchor: rfc9110#section-12.1
    sentence: Having the user agent describe its capabilities in every request can be both very inefficient (given that only a small percentage of responses have multiple representations) and a potential risk to the user's privacy;
m07-l04-q13:
  key:
    anchor: rfc9110#section-12.5.3
    sentence: (As defined in Section 12.4.2, a qvalue of 0 means "not acceptable".)
  wrong:
  - option: The content coding is preferred over every other listed coding
    anchor: rfc9110#section-12.5.3
    sentence: the acceptable content coding with the highest non-zero qvalue is preferred.
  - option: The content coding is acceptable but has the lowest priority
    anchor: rfc9110#section-12.5.3
    sentence: If the representation's content coding is one of the content codings listed in the Accept-Encoding field value, then it is acceptable unless it is accompanied by a qvalue of 0.
  - option: The content coding has no weight, which is treated like an omitted weight
    anchor: rfc9110#section-12.5.4
    sentence: (no value is the same as q=1)
m07-l04-q14:
  key:
    anchor: rfc9110#section-8.4
    sentence: Content-Encoding is primarily used to allow a representation's data to be compressed without losing the identity of its underlying media type.
  wrong:
  - option: To list the content codings that the user agent accepts in the response
    anchor: rfc9110#section-12.5.3
    sentence: When sent by a user agent in a request, Accept-Encoding indicates the content codings acceptable in a response.
  - option: To list the content codings in the order that the server prefers them
    anchor: rfc9110#section-8.4
    sentence: If one or more encodings have been applied to a representation, the sender that applied the encodings MUST generate a Content-Encoding header field that lists the content codings in the order in which they were applied.
  - option: To apply a coding to one connection hop only, between two intermediaries
    anchor: rfc9110#section-8.4
    sentence: Unlike Transfer-Encoding (Section 6.1 of [HTTP/1.1]), the codings listed in Content-Encoding are a characteristic of the representation
