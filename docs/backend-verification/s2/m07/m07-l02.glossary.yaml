- id: g-http-pipelining
  term: {en: pipelining}
  definition: {en: "A client that supports persistent connections may \"pipeline\" its requests, that is, send multiple requests without waiting for each response."}
  origin: m07-l02
  citation: "rfc9112#section-9.3.2"
- id: g-hpack
  term: {en: HPACK}
  definition: {en: "The header compression format of HTTP/2: it treats a list of header fields as an ordered collection of name-value pairs that can include duplicate pairs, and encodes them with header field tables that map header fields to indexed values."}
  origin: m07-l02
  citation: "rfc7541#section-1.1"
- id: g-connection-id
  term: {en: connection ID}
  definition: {en: "One of the identifiers that each QUIC connection possesses, each of which can identify the connection; its primary function is to ensure that changes in addressing at lower protocol layers do not cause packets to be delivered to the wrong endpoint."}
  origin: m07-l02
  citation: "rfc9000#section-5.1"
- id: g-nat-rebinding
  term: {en: NAT rebinding}
  definition: {en: "A change of address due to a middlebox, usually a NAT, allocating a new outgoing port or even a new outgoing IP address for a flow."}
  origin: m07-l02
  citation: "rfc9000#section-9"
