# anchor: boe-a-2023-5366-art-9
- id: m01-l06-q0064
  prompt:
    es: "Conforme al artículo 9.1 de la Ley 4/2023, de 28 de febrero, el Consejo de Participación de las Personas LGTBI es el órgano de:"
  options:
  - id: a
    text:
      es: "Asesoramiento jurídico del Gobierno en materia de igualdad de trato."
  - id: b
    text:
      es: "Inspección de las empresas en materia de igualdad efectiva."
  - id: c
    correct: true
    text:
      es: "Participación ciudadana en materia de derechos y libertades de las personas LGTBI."
  - id: d
    text:
      es: "Control de los procedimientos de rectificación registral."
  explanation:
    es: "El Consejo es el órgano de participación ciudadana en materia de derechos y libertades de las personas LGTBI. No asesora jurídicamente al Gobierno, ni inspecciona empresas, ni controla las rectificaciones registrales, que se tramitan ante el Registro Civil."
  citation: "art. 9.1 Ley 4/2023"
  difficulty: 1
  tags:
  - "organo"
# anchor: boe-a-2023-5366-art-43
- id: m01-l06-q0065
  prompt:
    es: "Señale ante qué órgano puede solicitar por sí misma una persona española mayor de dieciséis años la rectificación de la mención registral relativa al sexo, según el artículo 43.1 de la Ley 4/2023, de 28 de febrero:"
  options:
  - id: a
    correct: true
    text:
      es: "El Registro Civil."
  - id: b
    text:
      es: "Un juzgado de primera instancia."
  - id: c
    text:
      es: "El Ministerio de Igualdad."
  - id: d
    text:
      es: "La Autoridad Independiente para la Igualdad de Trato y la No Discriminación."
  explanation:
    es: "El artículo 43.1 establece que la solicitud se presenta ante el Registro Civil. No hace falta acudir a un juzgado de primera instancia, y ni el Ministerio de Igualdad ni la Autoridad Independiente intervienen en esa rectificación."
  citation: "art. 43.1 Ley 4/2023"
  difficulty: 1
  tags:
  - "organo"
# anchor: boe-a-2026-20528-df-vigesimoctava
- id: m01-l06-q0073
  prompt:
    es: "La Ley 4/2026, de 1 de octubre, se publicó en el «Boletín Oficial del Estado» el sábado 3 de octubre de 2026 y entra en vigor a los veinte días de su publicación. ¿En qué fecha entra en vigor?"
  options:
  - id: a
    text:
      es: "El 22 de octubre de 2026."
  - id: b
    text:
      es: "El 1 de noviembre de 2026."
  - id: c
    text:
      es: "El 3 de noviembre de 2026."
  - id: d
    correct: true
    text:
      es: "El 23 de octubre de 2026."
  explanation:
    es: "Contando veinte días naturales desde el sábado 3 de octubre, el día 1 es el 4 de octubre y el día 20 es el viernes 23 de octubre de 2026, fecha de entrada en vigor. El 22 de octubre es solo el día diecinueve. El 1 de noviembre sumaría veintinueve días y el 3 de noviembre, un mes completo, que no es el plazo de la disposición final vigesimoctava."
  citation: "disposición final vigesimoctava Ley 4/2026"
  difficulty: 3
  tags:
  - "cómputo"
  - "plazo"
# anchor: boe-a-2013-12632-art-4
- id: m01-l06-q0074
  prompt:
    es: "¿Cuál de las siguientes opciones recoge las deficiencias que presentan las personas con discapacidad, según el artículo 4.1 del Real Decreto Legislativo 1/2013, de 29 de noviembre?"
  options:
  - id: a
    text:
      es: "Físicas, psíquicas o sociales, temporales o permanentes."
  - id: b
    text:
      es: "Físicas y mentales, siempre que sean de nacimiento."
  - id: c
    correct: true
    text:
      es: "Físicas, mentales, intelectuales o sensoriales, previsiblemente permanentes."
  - id: d
    text:
      es: "Intelectuales o sensoriales, únicamente si son totales."
  explanation:
    es: "El artículo 4.1 enumera las deficiencias físicas, mentales, intelectuales o sensoriales, previsiblemente permanentes. No habla de deficiencias sociales ni temporales, no exige que sean de nacimiento y no restringe la discapacidad intelectual o sensorial a los casos de deficiencia total."
  citation: "art. 4.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-4
- id: m01-l06-q0075
  prompt:
    es: "Según el artículo 4.1 del Real Decreto Legislativo 1/2013, de 29 de noviembre, las deficiencias previsiblemente permanentes, al interactuar con diversas barreras, pueden impedir la participación plena y efectiva de la persona:"
  options:
  - id: a
    text:
      es: "En el empleo público, en igualdad de condiciones con los demás."
  - id: b
    correct: true
    text:
      es: "En la sociedad, en igualdad de condiciones con los demás."
  - id: c
    text:
      es: "En la vida política, salvo que alcance el grado de discapacidad del 33 por ciento."
  - id: d
    text:
      es: "En el sistema educativo, sin referencia a los demás."
  explanation:
    es: "La definición habla de la participación plena y efectiva en la sociedad, en igualdad de condiciones con los demás, sin acotarla a un ámbito como el empleo público, la vida política o el sistema educativo. El 33 por ciento es otro criterio, el del artículo 4.2, y no condiciona la participación política."
  citation: "art. 4.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-4
- id: m01-l06-q0078
  prompt:
    es: "A una persona se le ha reconocido un grado de discapacidad del 34 por ciento. Conforme al Real Decreto Legislativo 1/2013, de 29 de noviembre, ¿tiene la consideración de persona con discapacidad a efectos de la ley?"
  options:
  - id: a
    text:
      es: "No, porque el grado reconocido ha de ser igual o superior al 50 por ciento."
  - id: b
    text:
      es: "No, porque solo tienen esa consideración quienes presenten una discapacidad intelectual."
  - id: c
    text:
      es: "No, porque necesita además que sus deficiencias sean de nacimiento."
  - id: d
    correct: true
    text:
      es: "Sí, porque el grado reconocido es igual o superior al 33 por ciento."
  explanation:
    es: "Con un 34 por ciento supera el umbral del 33 por ciento del artículo 4.2 y se le aplica la ley. El umbral no es del 50 por ciento, la ley no limita el concepto a la discapacidad intelectual y no exige que las deficiencias sean de nacimiento."
  citation: "art. 4.2 RDL 1/2013"
  difficulty: 2
  tags:
  - "caso"
  - "cifra"
# anchor: boe-a-2013-12632-art-2
- id: m01-l06-q0080
  prompt:
    es: "Conforme al artículo 2.j) del Real Decreto Legislativo 1/2013, de 29 de noviembre, la inclusión asegura, desde la valoración positiva de la diversidad humana, la presencia, participación y progreso plenos de:"
  options:
  - id: a
    text:
      es: "Las personas con discapacidad en el ámbito laboral."
  - id: b
    correct: true
    text:
      es: "Todas las personas en las diferentes esferas de la vida."
  - id: c
    text:
      es: "Las personas con un grado de discapacidad igual o superior al 33 por ciento."
  - id: d
    text:
      es: "Las personas beneficiarias del Sistema para la Autonomía y Atención a la Dependencia."
  explanation:
    es: "La definición de inclusión se refiere a todas las personas en las diferentes esferas de la vida, no solo a quienes tienen discapacidad ni solo al ámbito laboral. Tampoco se limita a quienes alcanzan el 33 por ciento de grado ni a los beneficiarios del sistema de dependencia."
  citation: "art. 2.j) RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-95
- id: m01-l06-q0082
  prompt:
    es: "¿Cuál de las siguientes conductas es una infracción grave, según el artículo 95.3 del Real Decreto Legislativo 1/2013, de 29 de noviembre?"
  options:
  - id: a
    correct: true
    text:
      es: "Los actos discriminatorios u omisiones que supongan un trato menos favorable a la persona con discapacidad en relación con otra en situación comparable."
  - id: b
    text:
      es: "Las vejaciones que padezcan las personas en sus derechos fundamentales por razón de su discapacidad."
  - id: c
    text:
      es: "Conculcar deliberadamente la dignidad de las personas con discapacidad con condiciones o cargas humillantes."
  - id: d
    text:
      es: "Generar deliberadamente situaciones de riesgo o grave daño para la integridad física o psíquica de esas personas."
  explanation:
    es: "El trato menos favorable respecto de otra persona en situación análoga o comparable es infracción grave según el artículo 95.3.a). Las vejaciones en derechos fundamentales, conculcar deliberadamente la dignidad con cargas humillantes y generar deliberadamente situaciones de riesgo o grave daño están tipificadas como muy graves en el artículo 95.4."
  citation: "art. 95.3 RDL 1/2013"
  difficulty: 3
  tags:
  - "lista"
# anchor: boe-a-2013-12632-art-95
- id: m01-l06-q0088
  prompt:
    es: "Según el artículo 95.4 del Real Decreto Legislativo 1/2013, de 29 de noviembre, es infracción muy grave incumplir las normas legales sobre accesibilidad cuando ese incumplimiento impida o dificulte gravemente el ejercicio de:"
  options:
  - id: a
    text:
      es: "Derechos económicos y sociales de carácter prestacional."
  - id: b
    correct: true
    text:
      es: "Derechos fundamentales y el disfrute de libertades públicas."
  - id: c
    text:
      es: "Derechos laborales reconocidos en convenio colectivo."
  - id: d
    text:
      es: "Derechos de participación en los procedimientos de contratación pública."
  explanation:
    es: "El artículo 95.4.g) se refiere al ejercicio de derechos fundamentales y al disfrute de libertades públicas. Los derechos prestacionales, los laborales de convenio y los de participación en la contratación pública no son el objeto de esa infracción muy grave."
  citation: "art. 95.4.g) RDL 1/2013"
  difficulty: 3
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-42
- id: m01-l06-q0090
  prompt:
    es: "En los supuestos de exención excepcional de la cuota de reserva del artículo 42.1 del Real Decreto Legislativo 1/2013, de 29 de noviembre, las medidas alternativas aplicables se determinan:"
  options:
  - id: a
    correct: true
    text:
      es: "Reglamentariamente."
  - id: b
    text:
      es: "Mediante convenio colectivo de empresa."
  - id: c
    text:
      es: "Caso por caso, por la autoridad laboral."
  - id: d
    text:
      es: "Libremente por el empresario."
  explanation:
    es: "El artículo 42.1 condiciona la exención a que se apliquen las medidas alternativas que se determinen reglamentariamente. No las fija el convenio colectivo de empresa ni la autoridad laboral caso por caso, y el empresario no puede elegirlas libremente."
  citation: "art. 42.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2013-12632-art-42
- id: m01-l06-q0091
  prompt:
    es: "Si el empresario opta voluntariamente por la exención de la cuota de reserva del artículo 42.1 del Real Decreto Legislativo 1/2013, de 29 de noviembre, debe comunicar su opción debidamente a:"
  options:
  - id: a
    text:
      es: "La Inspección General de Servicios."
  - id: b
    text:
      es: "El Servicio Público de Empleo Estatal."
  - id: c
    text:
      es: "La representación legal de los trabajadores."
  - id: d
    correct: true
    text:
      es: "La autoridad laboral."
  explanation:
    es: "La opción voluntaria del empresario se comunica a la autoridad laboral. La Inspección General de Servicios actúa en el empleo público, el Servicio Público de Empleo Estatal no es el destinatario que fija el artículo y la representación de los trabajadores no recibe esa comunicación."
  citation: "art. 42.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "organo"
# anchor: boe-a-2013-12632-art-42
- id: m01-l06-q0093
  prompt:
    es: "Una empresa privada tiene 49 trabajadores. Según el artículo 42.1 del Real Decreto Legislativo 1/2013, de 29 de noviembre, ¿está obligada a que el 2 por 100 de su plantilla sean trabajadores con discapacidad?"
  options:
  - id: a
    correct: true
    text:
      es: "No, la obligación alcanza a las empresas con 50 o más trabajadores."
  - id: b
    text:
      es: "Sí, porque la obligación alcanza a toda empresa privada."
  - id: c
    text:
      es: "No, porque la obligación solo alcanza a las empresas públicas."
  - id: d
    text:
      es: "Sí, si la autoridad laboral lo exige expresamente."
  explanation:
    es: "La cuota de reserva alcanza a las empresas públicas y privadas con 50 o más trabajadores, y con 49 no se llega al umbral. No se aplica a toda empresa privada, no se limita a las públicas y no depende de una exigencia expresa de la autoridad laboral."
  citation: "art. 42.1 RDL 1/2013"
  difficulty: 2
  tags:
  - "caso"
  - "cifra"
# anchor: boe-a-2013-12632-art-95
- id: m01-l06-q0095
  prompt:
    es: "Conforme al artículo 95.4 del Real Decreto Legislativo 1/2013, de 29 de noviembre, es infracción muy grave conculcar deliberadamente la dignidad de las personas con discapacidad imponiendo condiciones o cargas humillantes para el acceso a:"
  options:
  - id: a
    text:
      es: "Los puestos reservados en las ofertas de empleo público."
  - id: b
    correct: true
    text:
      es: "Los bienes, productos y servicios a disposición del público."
  - id: c
    text:
      es: "Los procedimientos de reconocimiento del grado de discapacidad."
  - id: d
    text:
      es: "Los puestos de trabajo de las empresas de cincuenta o más trabajadores."
  explanation:
    es: "El artículo 95.4.c) refiere la infracción al acceso a los bienes, productos y servicios a disposición del público. Los puestos reservados en las ofertas de empleo público, los procedimientos de reconocimiento del grado de discapacidad y los puestos de trabajo de las empresas obligadas a la cuota de reserva no son el objeto de esa letra."
  citation: "art. 95.4 RDL 1/2013"
  difficulty: 2
  tags:
  - "fact:95-4-c"
# anchor: boe-a-2013-12632-art-2
- id: m01-l06-q0096
  prompt:
    es: "Según el artículo 2.j) del Real Decreto Legislativo 1/2013, de 29 de noviembre, la inclusión es un presupuesto irrenunciable para:"
  options:
  - id: a
    correct: true
    text:
      es: "Hacer efectivos los derechos humanos."
  - id: b
    text:
      es: "Garantizar la accesibilidad universal de los entornos."
  - id: c
    text:
      es: "Reconocer el grado de discapacidad igual o superior al 33 por ciento."
  - id: d
    text:
      es: "Cumplir la cuota de reserva del 2 por 100 de la plantilla."
  explanation:
    es: "La definición presenta la inclusión como presupuesto irrenunciable para hacer efectivos los derechos humanos. No la vincula con la accesibilidad universal de los entornos, con el reconocimiento del grado de discapacidad del 33 por ciento (artículo 4.2) ni con la cuota de reserva del 2 por 100 de las empresas de cincuenta o más trabajadores (artículo 42.1)."
  citation: "art. 2.j) RDL 1/2013"
  difficulty: 2
  tags:
  - "fact:2-j-presupuesto"
