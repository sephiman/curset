- id: m09-l03-q01
  prompt:
    en: In PostgreSQL, row security is enabled on a table with `ALTER TABLE ... ENABLE ROW LEVEL SECURITY` but the
      table has no policy. What can an ordinary user do with its rows?
  options:
  - id: a
    text:
      en: See and modify all rows, because the SQL privilege system alone decides access
  - id: b
    correct: true
    text:
      en: See and modify no rows, because a default-deny policy is used
  - id: c
    text:
      en: See all rows but update none of them
  - id: d
    text:
      en: Nothing, because every query fails with an error until a policy is created
  explanation:
    en: With row security enabled and no policy, a default-deny policy is used, so no rows are visible or can be
      modified. Seeing and modifying all rows is wrong because all normal access must be allowed by a row security
      policy. Seeing all rows is wrong because no rows will be visible or updatable. Failing with an error is wrong
      because typically no error occurs when a row is not visible.
  citation: pg-ddl-rowsecurity#DDL-ROWSECURITY; pg-sql-createpolicy#id-1.9.3.75.5
  extract:
    en: If no policy exists for the table, a default-deny policy is used, meaning that no rows are visible or can
      be modified.
- id: m09-l03-q02
  prompt:
    en: In PostgreSQL, an `UPDATE` policy defines only a `USING` expression and no `WITH CHECK` expression. Against
      what are the new rows produced by an `UPDATE` checked?
  options:
  - id: a
    text:
      en: Against no expression, so any new row value is allowed
  - id: b
    text:
      en: Against an implicit `WITH CHECK (true)` expression
  - id: c
    text:
      en: Against the `USING` expressions of the `SELECT` policies only
  - id: d
    correct: true
    text:
      en: Against the same `USING` expression
  explanation:
    en: When no `WITH CHECK` expression is defined, the `USING` expression is used both for the visible rows and
      for the new rows allowed to be added. Checking against no expression, against an implicit `WITH CHECK (true)`
      expression, and against the `SELECT` policies only are three other choices than the `USING` expression of
      the policy itself.
  citation: pg-sql-createpolicy#id-1.9.3.75.5
  extract:
    en: For policies that can have both USING and WITH CHECK expressions (ALL and UPDATE), if no WITH CHECK expression
      is defined, then the USING expression will be used both to determine which rows are visible (normal USING
      case) and which new rows will be allowed to be added (WITH CHECK case).
- id: m09-l03-q03
  prompt:
    en: In PostgreSQL, two permissive policies and one restrictive policy of the same command type apply to a query.
      How are their expressions combined?
  options:
  - id: a
    text:
      en: All three expressions are combined with OR, so any one of them grants access
  - id: b
    text:
      en: All three expressions are combined with AND, so every policy must pass
  - id: c
    correct: true
    text:
      en: The permissive expressions are combined with OR, the restrictive one with AND, and the results with AND
  - id: d
    text:
      en: Only the restrictive policy is applied, because the stricter policy overrides the others
  explanation:
    en: Permissive expressions are combined with OR, restrictive expressions with AND, and the two results with
      AND. Combining all three with OR is wrong because restrictive policies are combined using AND. Combining all
      three with AND is wrong because at least one permissive policy must grant access, so permissive policies are
      not all required. Applying only the restrictive policy is wrong because without a permissive policy access
      is denied.
  citation: pg-sql-createpolicy#id-1.9.3.75.6.4; pg-ddl-rowsecurity#DDL-ROWSECURITY
  extract:
    en: Thus all the PERMISSIVE policy expressions are combined using OR, all the RESTRICTIVE policy expressions
      are combined using AND, and the results are combined using AND.
- id: m09-l03-q04
  prompt:
    en: In PostgreSQL, how can the owner of a table be made subject to the row security policies of its own table?
  options:
  - id: a
    correct: true
    text:
      en: With `ALTER TABLE ... FORCE ROW LEVEL SECURITY`
  - id: b
    text:
      en: With `ALTER TABLE ... ENABLE ROW LEVEL SECURITY`, which applies to every role including the owner
  - id: c
    text:
      en: By granting the owner the `BYPASSRLS` attribute
  - id: d
    text:
      en: It is not possible, because table owners always bypass row security
  explanation:
    en: A table owner can choose to be subject to row security with `ALTER TABLE ... FORCE ROW LEVEL SECURITY`.
      Enabling row security is wrong because the table owner is typically not subject to the policies. Granting
      `BYPASSRLS` is wrong because roles with that attribute always bypass row security. Saying it is impossible
      is wrong because the owner can choose to be subject to row security.
  citation: pg-ddl-rowsecurity#DDL-ROWSECURITY
  extract:
    en: though a table owner can choose to be subject to row security with ALTER TABLE ... FORCE ROW LEVEL SECURITY.
- id: m09-l03-q05
  prompt:
    en: In PostgreSQL 15 and later, which schema usage pattern does the default configuration support without any
      change to its privileges or search path?
  options:
  - id: a
    correct: true
    text:
      en: Constraining ordinary users to user-private schemas
  - id: b
    text:
      en: Keeping the default search path and granting privileges to create in the public schema
  - id: c
    text:
      en: Removing the public schema from the default search path
  - id: d
    text:
      en: Installing the shared applications into the private schema of each user
  explanation:
    en: The default configuration of PostgreSQL 15 and later supports constraining ordinary users to user-private
      schemas. Keeping the default search path with create privileges on the public schema is the default only in
      databases upgraded from PostgreSQL 14 or earlier. Removing the public schema from the search path needs a
      change to `postgresql.conf` or `ALTER ROLE ALL SET search_path`. Installing shared applications in private
      schemas is wrong because they go into separate schemas.
  citation: pg-ddl-schemas#DDL-SCHEMAS-PATTERNS
  extract:
    en: In PostgreSQL 15 and later, the default configuration supports this usage pattern.
- id: m09-l03-q08
  prompt:
    en: In Java 25, the snippet works out what a Kafka client group can use with a per-broker quota of 10 MB/s,
      3 brokers and 4 producer instances sharing the quota evenly. What does it print?
  options:
  - id: a
    text:
      en: 'per-broker quota MB/s: 10.0

        cluster-wide ceiling MB/s: 10.0

        share per producer instance at the ceiling MB/s: 2.5

        share per producer instance on one broker MB/s: 0.8'
  - id: b
    correct: true
    text:
      en: 'per-broker quota MB/s: 10.0

        cluster-wide ceiling MB/s: 30.0

        share per producer instance at the ceiling MB/s: 7.5

        share per producer instance on one broker MB/s: 2.5'
  - id: c
    text:
      en: 'per-broker quota MB/s: 10.0

        cluster-wide ceiling MB/s: 30.0

        share per producer instance at the ceiling MB/s: 120.0

        share per producer instance on one broker MB/s: 40.0'
  - id: d
    text:
      en: 'per-broker quota MB/s: 10.0

        cluster-wide ceiling MB/s: 3.3

        share per producer instance at the ceiling MB/s: 0.8

        share per producer instance on one broker MB/s: 2.5'
  explanation:
    en: The quota applies per broker, so the ceiling is 10 MB/s times 3 brokers, and 4 instances share it evenly,
      which gives the recorded output. The output with a ceiling of 10.0 is wrong because the quota is defined per
      broker, not for the cluster. The output with 120.0 is wrong because the ceiling is divided among the instances,
      not multiplied by them. The output with a ceiling of 3.3 is wrong because the quota is multiplied by the number
      of brokers, not divided.
  citation: kafka-design#enforcement
  extract:
    en: This quota is defined on a per-broker basis.
  snippet: m09-l03/QuotaShare.java
- id: m09-l03-q09
  prompt:
    en: In Resilience4j, which statement about the `SemaphoreBulkhead`, one of the two bulkhead implementations
      that limit the number of concurrent executions, is correct?
  options:
  - id: a
    correct: true
    text:
      en: It is up to the client to size the thread pool consistently with the bulkhead configuration
  - id: b
    text:
      en: It limits concurrency with a bounded queue and a fixed thread pool
  - id: c
    text:
      en: It provides a shadow thread pool for each bulkhead, as Hystrix does
  - id: d
    text:
      en: It sizes the thread pool automatically from the bulkhead configuration
  explanation:
    en: With the `SemaphoreBulkhead` it is up to the client to size the thread pool consistently with the bulkhead
      configuration. The bounded queue and fixed thread pool belong to the `FixedThreadPoolBulkhead`. A shadow thread
      pool is wrong because, unlike Hystrix, it does not provide a shadow thread pool option. Automatic sizing is
      wrong because the client is responsible for the sizing.
  citation: resilience4j-bulkhead#introduction
- id: m09-l03-q10
  prompt:
    en: In Kubernetes on Linux nodes, how is a `cpu` limit enforced when a container approaches it?
  options:
  - id: a
    text:
      en: By terminating the container with an out of memory (OOM) kill
  - id: b
    text:
      en: Loosely, since a container may use more CPU than its limit when the node has spare CPU
  - id: c
    correct: true
    text:
      en: By CPU throttling, with the kernel restricting access to the CPU
  - id: d
    text:
      en: By the scheduler, which refuses to place Pods whose containers could exceed the limit
  explanation:
    en: A cpu limit is enforced by CPU throttling, where the kernel restricts access to the CPU. The OOM kill is
      wrong because it enforces memory limits. Loose enforcement is wrong because containers may not use more CPU
      than their cpu limit. The scheduler is wrong because the kubelet and container runtime apply the limits and
      the kernel enforces them.
  citation: k8s-resource-management#requests-and-limits
  extract:
    en: cpu limits are enforced by CPU throttling.
- id: m09-l03-q11
  prompt:
    en: In Kubernetes, when a Node runs out of resources, in which order are Pods evicted by quality of service
      class?
  options:
  - id: a
    text:
      en: '`Guaranteed` first, then `Burstable`, and finally `BestEffort` Pods'
  - id: b
    text:
      en: '`Burstable` first, then `BestEffort`, and finally `Guaranteed` Pods'
  - id: c
    text:
      en: '`Burstable` first, then `Guaranteed`, and finally `BestEffort` Pods'
  - id: d
    correct: true
    text:
      en: '`BestEffort` first, then `Burstable`, and finally `Guaranteed` Pods'
  explanation:
    en: Kubernetes first evicts `BestEffort` Pods, followed by `Burstable` and finally `Guaranteed` Pods. The order
      starting with `Guaranteed`, the order starting with `Burstable` then `BestEffort`, and the order starting
      with `Burstable` then `Guaranteed` are three other orders than the single one the documentation gives.
  citation: k8s-qos#quality-of-service-classes
  extract:
    en: When a Node runs out of resources, Kubernetes will first evict BestEffort Pods running on that Node, followed
      by Burstable and finally Guaranteed Pods.
- id: m09-l03-q12
  prompt:
    en: In Kubernetes on Linux nodes, what can happen to a container that uses more memory than its `memory` limit?
  options:
  - id: a
    text:
      en: It is slowed down by CPU throttling until its memory use falls
  - id: b
    correct: true
    text:
      en: The kernel may terminate it with an out of memory (OOM) kill
  - id: c
    text:
      en: It is killed immediately, at the moment it goes over the limit
  - id: d
    text:
      en: It is never terminated, because the limit only affects scheduling
  explanation:
    en: A container that uses more than its memory limit may be terminated by the kernel. CPU throttling is wrong
      because it enforces cpu limits. An immediate kill is wrong because a container that over allocates memory
      may not be immediately killed. Never terminating is wrong because memory limits are enforced by the kernel
      with OOM kills.
  citation: k8s-resource-management#requests-and-limits
  extract:
    en: When a container uses more than its memory limit, the kernel may terminate it.
