# anchor: boe-a-2015-10566-art-57
- id: m01-l08-q013
  prompt:
    es: "Según el artículo 57.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la Administración General del Estado se organiza en Presidencia del Gobierno y en Ministerios, comprendiendo cada uno de ellos:"
  options:
  - id: a
    text:
      es: "Un único sector de actividad administrativa, sin excepción posible."
  - id: b
    text:
      es: "Una o varias áreas territoriales de gestión integrada."
  - id: c
    text:
      es: "Uno o varios servicios comunes de gestión compartida."
  - id: d
    correct: true
    text:
      es: "Uno o varios sectores funcionalmente homogéneos de actividad administrativa."
  explanation:
    es: "El artículo 57.1 dice que cada Ministerio comprende «uno o varios sectores funcionalmente homogéneos de actividad administrativa». No se limita a un único sector. La gestión territorial integrada corresponde a las Delegaciones del Gobierno (art. 55.1), y los servicios comunes son una parte de cada Ministerio, no lo que lo define."
  citation: "art. 57.1 LRJSP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-57
- id: m01-l08-q014
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre la organización de la Administración General del Estado es correcta, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Se organiza en Ministerios y en Secretarías de Estado."
  - id: b
    text:
      es: "Se organiza en Vicepresidencias del Gobierno y en Ministerios."
  - id: c
    text:
      es: "Se organiza en Ministerios y en Organismos públicos dependientes."
  - id: d
    correct: true
    text:
      es: "Se organiza en Presidencia del Gobierno y en Ministerios."
  explanation:
    es: "El artículo 57.1 dice: «La Administración General del Estado se organiza en Presidencia del Gobierno y en Ministerios». Las Secretarías de Estado existen dentro de los Ministerios (art. 58.1). Las Vicepresidencias no aparecen en el artículo. Los Organismos públicos forman el sector público institucional, no esta organización."
  citation: "art. 57.1 LRJSP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-57
- id: m01-l08-q015
  prompt:
    es: "Según el artículo 57.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿mediante qué norma se establecen el número, la denominación y el ámbito de competencia de los Ministerios y Secretarías de Estado?"
  options:
  - id: a
    text:
      es: "Mediante Real Decreto del Consejo de Ministros, a propuesta del Presidente."
  - id: b
    text:
      es: "Mediante ley ordinaria aprobada por las Cortes Generales."
  - id: c
    text:
      es: "Mediante Real Decreto del Consejo de Ministros, a propuesta del Ministro de Hacienda."
  - id: d
    correct: true
    text:
      es: "Mediante Real Decreto del Presidente del Gobierno."
  explanation:
    es: "El artículo 57.3 dice que esos extremos «se establecen mediante Real Decreto del Presidente del Gobierno». No es un Real Decreto del Consejo de Ministros, propuesto por nadie, ni una ley de las Cortes."
  citation: "art. 57.3 LRJSP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2023-23537-art-1
- id: m01-l08-q016
  prompt:
    es: "¿En cuántos departamentos ministeriales estructura la Administración General del Estado el Real Decreto 829/2023, de 20 de noviembre, por el que se reestructuran los departamentos ministeriales?"
  options:
  - id: a
    correct: true
    text:
      es: "En un total de veintidós departamentos ministeriales."
  - id: b
    text:
      es: "En un total de veinte departamentos ministeriales."
  - id: c
    text:
      es: "En un total de veintiún departamentos ministeriales."
  - id: d
    text:
      es: "En un total de veintitrés departamentos ministeriales."
  explanation:
    es: "El artículo 1 del Real Decreto 829/2023 enumera veintidós departamentos, del Ministerio de Asuntos Exteriores, Unión Europea y Cooperación al Ministerio de Juventud e Infancia. No son veinte, veintiuno ni veintitrés."
  citation: "art. 1 RD 829/2023"
  difficulty: 2
  tags:
  - "cantidad"
# anchor: boe-a-2015-10566-art-58
- id: m01-l08-q017
  prompt:
    es: "De acuerdo con el artículo 58.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, para la gestión de los servicios comunes, los Ministerios contarán en todo caso con:"
  options:
  - id: a
    correct: true
    text:
      es: "Una Subsecretaría y, dependiendo de ella, una Secretaría General Técnica."
  - id: b
    text:
      es: "Una Secretaría de Estado y, dependiendo de ella, una Subsecretaría."
  - id: c
    text:
      es: "Una Subsecretaría y, dependiendo de ella, una Secretaría General."
  - id: d
    text:
      es: "Una Secretaría General y, dependiendo de ella, una Secretaría General Técnica."
  explanation:
    es: "El artículo 58.2 dice que los Ministerios «contarán, en todo caso, con una Subsecretaría, y dependiendo de ella una Secretaría General Técnica». Las Secretarías de Estado y las Secretarías Generales pueden existir o no (art. 58.1) y gestionan un sector de actividad, no los servicios comunes."
  citation: "art. 58.2 LRJSP"
  difficulty: 2
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-58
- id: m01-l08-q018
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué órganos de los Ministerios son los órganos de gestión de una o varias áreas funcionalmente homogéneas?"
  options:
  - id: a
    text:
      es: "Las Secretarías de Estado del Ministerio."
  - id: b
    correct: true
    text:
      es: "Las Direcciones Generales del Ministerio."
  - id: c
    text:
      es: "Las Secretarías Generales Técnicas del Ministerio."
  - id: d
    text:
      es: "Las Subdirecciones Generales del Ministerio."
  explanation:
    es: "El artículo 58.3 dice: «Las Direcciones Generales son los órganos de gestión de una o varias áreas funcionalmente homogéneas». Las Secretarías Generales Técnicas gestionan servicios comunes (art. 58.2). Las Subdirecciones Generales son la división interna de las Direcciones Generales (art. 58.4). Las Secretarías de Estado gestionan un sector de actividad (art. 58.1)."
  citation: "art. 58.3 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-58
- id: m01-l08-q019
  prompt:
    es: "Según el artículo 58.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, además de organizarse dentro de las Direcciones Generales, las Subdirecciones Generales:"
  options:
  - id: a
    correct: true
    text:
      es: "Podrán adscribirse directamente a otros órganos directivos de mayor nivel o a órganos superiores del Ministerio."
  - id: b
    text:
      es: "Podrán adscribirse directamente a los Organismos públicos vinculados o dependientes del Ministerio."
  - id: c
    text:
      es: "Podrán adscribirse directamente a las Delegaciones del Gobierno en las Comunidades Autónomas."
  - id: d
    text:
      es: "No podrán depender de ningún órgano distinto de la Dirección General en la que se integren."
  explanation:
    es: "El artículo 58.4 permite que se adscriban «directamente Subdirecciones Generales a otros órganos directivos de mayor nivel o a órganos superiores del Ministerio». La adscripción es a órganos del propio Ministerio, no a Organismos públicos ni a Delegaciones del Gobierno. La opción «no podrán depender» niega lo que el artículo permite."
  citation: "art. 58.4 LRJSP"
  difficulty: 3
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-59
- id: m01-l08-q021
  prompt:
    es: "¿Cuál de los siguientes es el instrumento por el que se crea una Dirección General en un Ministerio, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Resolución del Subsecretario, a través de la relación de puestos de trabajo."
  - id: b
    correct: true
    text:
      es: "Real Decreto del Consejo de Ministros, a iniciativa del Ministro interesado."
  - id: c
    text:
      es: "Orden del Ministro interesado, previa autorización del Ministro para la Transformación Digital y de la Función Pública."
  - id: d
    text:
      es: "Real Decreto del Presidente del Gobierno, a propuesta del Ministro interesado."
  explanation:
    es: "El artículo 59.1 dice que las Direcciones Generales «se crean, modifican y suprimen por Real Decreto del Consejo de Ministros, a iniciativa del Ministro interesado» y a propuesta del Ministro de Hacienda y Administraciones Públicas (hoy, para la Transformación Digital y de la Función Pública). La orden ministerial con autorización previa sirve para órganos inferiores a Subdirección General (art. 59.2). El Real Decreto del Presidente fija los Ministerios y Secretarías de Estado (art. 57.3). Las relaciones de puestos de trabajo crean unidades que no son órganos (art. 59.3)."
  citation: "art. 59.1 LRJSP"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: boe-a-2015-10566-art-60
- id: m01-l08-q022
  prompt:
    es: "Según el artículo 60.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Ministros son los jefes superiores del Departamento y superiores jerárquicos directos de:"
  options:
  - id: a
    text:
      es: "Los Secretarios de Estado y Directores generales."
  - id: b
    text:
      es: "Los Subsecretarios y Secretarios generales técnicos."
  - id: c
    text:
      es: "Los Secretarios generales técnicos y Directores generales."
  - id: d
    correct: true
    text:
      es: "Los Secretarios de Estado y Subsecretarios."
  explanation:
    es: "El artículo 60.1 hace a los Ministros «superiores jerárquicos directos de los Secretarios de Estado y Subsecretarios». Los Directores generales dependen de alguno de ellos (art. 60.2). Los Secretarios generales técnicos dependen del Subsecretario (art. 65.1)."
  citation: "art. 60.1 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-61
- id: m01-l08-q024
  prompt:
    es: "¿Cuál de las siguientes funciones corresponde a los Ministros como titulares de su departamento, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Convocar y resolver las pruebas selectivas de personal funcionario y laboral."
  - id: b
    correct: true
    text:
      es: "Ejercer la potestad reglamentaria en las materias propias de su Departamento."
  - id: c
    text:
      es: "Desempeñar la jefatura superior de todo el personal del Departamento."
  - id: d
    text:
      es: "Ostentar la representación ordinaria del Ministerio y dirigir los servicios comunes."
  explanation:
    es: "El artículo 61.a atribuye a los Ministros «Ejercer la potestad reglamentaria en las materias propias de su Departamento». La jefatura superior del personal, la representación ordinaria con la dirección de los servicios comunes y las pruebas selectivas corresponden a los Subsecretarios (art. 63.1, letras f, encabezamiento y m)."
  citation: "art. 61.a LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-12
- id: m01-l08-q025
  prompt:
    es: "De acuerdo con la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿quién nombra y separa a los Ministros que forman parte del Gobierno?"
  options:
  - id: a
    text:
      es: "El Rey, a propuesta del Congreso de los Diputados."
  - id: b
    text:
      es: "El Consejo de Ministros, a propuesta de su Presidente."
  - id: c
    correct: true
    text:
      es: "El Rey, a propuesta del Presidente del Gobierno."
  - id: d
    text:
      es: "El Presidente del Gobierno, dando cuenta al Rey."
  explanation:
    es: "El artículo 12.2 de la Ley 50/1997 dice que los Ministros «serán nombrados y separados por el Rey, a propuesta del Presidente del Gobierno». El Presidente propone pero no nombra. El Congreso no propone Ministros. El Consejo de Ministros no nombra a sus miembros."
  citation: "art. 12.2 Ley 50/1997"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-62
- id: m01-l08-q026
  prompt:
    es: "Según el artículo 62 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué competencia corresponde a los Secretarios de Estado en materia de nombramientos?"
  options:
  - id: a
    correct: true
    text:
      es: "Nombrar y separar a los Subdirectores Generales de la Secretaría de Estado."
  - id: b
    text:
      es: "Nombrar y separar a los Directores generales adscritos a la Secretaría de Estado."
  - id: c
    text:
      es: "Nombrar y separar a los Subsecretarios de los Ministerios de su área."
  - id: d
    text:
      es: "Nombrar a los Subdelegados del Gobierno en las provincias de su ámbito."
  explanation:
    es: "El artículo 62.2.c atribuye a los Secretarios de Estado «Nombrar y separar a los Subdirectores Generales de la Secretaría de Estado». Los Directores generales y los Subsecretarios se nombran por Real Decreto del Consejo de Ministros (arts. 66.2 y 63.3). Los Subdelegados los nombra el Delegado del Gobierno (art. 74)."
  citation: "art. 62.2.c LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-62
- id: m01-l08-q027
  prompt:
    es: "De acuerdo con el artículo 62.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, los Secretarios de Estado resuelven los recursos contra resoluciones de órganos directivos directamente dependientes cuyos actos:"
  options:
  - id: a
    text:
      es: "Agoten la vía administrativa, así como los conflictos de atribuciones entre dichos órganos."
  - id: b
    text:
      es: "No agoten la vía administrativa, salvo los dictados en materia de personal."
  - id: c
    text:
      es: "Pongan fin a la vía administrativa, previo informe del Subsecretario del Departamento."
  - id: d
    correct: true
    text:
      es: "No agoten la vía administrativa, así como los conflictos de atribuciones entre dichos órganos."
  explanation:
    es: "El artículo 62.2.i atribuye a los Secretarios de Estado resolver los recursos contra resoluciones de los órganos directivos que dependan directamente de él «y cuyos actos no agoten la vía administrativa, así como los conflictos de atribuciones». Si los actos agotan la vía administrativa o le ponen fin, no hay recurso ante el Secretario de Estado. La ley no excluye los actos en materia de personal."
  citation: "art. 62.2.i LRJSP"
  difficulty: 3
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-62
- id: m01-l08-q028
  prompt:
    es: "¿Cuál de las siguientes competencias en materia de contratos y convenios corresponde a los Secretarios de Estado, según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Celebrar contratos relativos a asuntos de su Secretaría de Estado y los convenios no reservados al Ministro."
  - id: b
    text:
      es: "Celebrar cualesquiera contratos y convenios del Ministerio, incluidos los reservados al Ministro, sin autorización previa."
  - id: c
    text:
      es: "Celebrar solo los contratos que les delegue expresamente el Consejo de Ministros."
  - id: d
    text:
      es: "Celebrar los contratos de los servicios comunes del Ministerio, por delegación del Subsecretario."
  explanation:
    es: "El artículo 62.2.g atribuye a los Secretarios de Estado «Celebrar contratos relativos a asuntos de su Secretaría de Estado y los convenios no reservados al Ministro del que dependan». Los convenios reservados al Ministro quedan fuera, y la autorización sigue siendo necesaria cuando sea preceptiva. La competencia es propia, no delegada por el Consejo de Ministros ni por el Subsecretario."
  citation: "art. 62.2.g LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-1997-25336-art-15
- id: m01-l08-q029
  prompt:
    es: "Según la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿cómo se nombra y se separa a los Secretarios de Estado?"
  options:
  - id: a
    text:
      es: "Por orden del Ministro del Departamento al que pertenezcan, previa comunicación al Consejo de Ministros."
  - id: b
    text:
      es: "Por Real Decreto del Presidente del Gobierno, a propuesta del Ministro del Departamento."
  - id: c
    correct: true
    text:
      es: "Por Real Decreto del Consejo de Ministros, a propuesta del Presidente del Gobierno o del Ministro del Departamento."
  - id: d
    text:
      es: "Por el Rey, a propuesta del Presidente del Gobierno, del mismo modo que a los Ministros."
  explanation:
    es: "El artículo 15.1 de la Ley 50/1997 dice que son nombrados y separados «por Real Decreto del Consejo de Ministros, aprobado a propuesta del Presidente del Gobierno o del miembro del Gobierno a cuyo Departamento pertenezcan». El nombramiento por el Rey es el de los Ministros (art. 12.2). No basta una orden ministerial, y el Real Decreto es del Consejo de Ministros, no del Presidente."
  citation: "art. 15.1 Ley 50/1997"
  difficulty: 2
  tags:
  - "procedimiento"
