  options:
  - id: a
    correct: true
    text:
      en: 'floor modulus of -4 and 3: 2

        remainder of -4 and 3: -1

        bit set length 6, set bits 3'
  - id: b
    text:
      en: 'floor modulus of -4 and 3: -1

        remainder of -4 and 3: -1

        bit set length 6, set bits 3'
  - id: c
    text:
      en: 'floor modulus of -4 and 3: 2

        remainder of -4 and 3: 2

        bit set length 6, set bits 3'
  - id: d
    text:
      en: 'floor modulus of -4 and 3: 2

        remainder of -4 and 3: -1

        bit set length 3, set bits 3'
  explanation:
    en: 'The floor modulus takes the sign of the divisor 3 and gives 2, the `%` operator keeps the sign of the dividend
      and gives -1, and bits 1, 3 and 5 give a length of 6 and a cardinality of 3. The line `floor modulus of -4
      and 3: -1` gives the result of `%`, but `floorMod` follows the divisor. The line `remainder of -4 and 3: 2`
      gives the result of `floorMod`, but `%` is -1 for a negative dividend. The line `bit set length 3` takes the
