# anchor: boe-a-2015-10566-art-69
- id: m01-l08-q164
  prompt:
    es: "Las Delegaciones del Gobierno tienen su sede en la localidad donde radique el Consejo de Gobierno de la Comunidad Autónoma, salvo que acuerde ubicarla en otra distinta el:"
  options:
  - id: a
    text:
      es: "Ministro del Interior."
  - id: b
    text:
      es: "Delegado del Gobierno."
  - id: c
    correct: true
    text:
      es: "Consejo de Ministros."
  - id: d
    text:
      es: "Presidente de la Comunidad Autónoma."
  explanation:
    es: "El artículo 69.2 deja al Consejo de Ministros la posibilidad de ubicar la sede en otra localidad. No pueden decidirlo el Ministro del Interior ni el Delegado del Gobierno por sí solos, ni el Presidente de la Comunidad Autónoma, que no forma parte de la Administración General del Estado."
  citation: "art. 69.2 LRJSP"
  difficulty: 3
  tags:
  - "órgano"
  - "excepción"
# anchor: boe-a-2015-10566-art-69
- id: m01-l08-q199
  prompt:
    es: "Conforme al artículo 69.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, existirá una Delegación del Gobierno en cada una de:"
  options:
  - id: a
    text:
      es: "Las provincias."
  - id: b
    correct: true
    text:
      es: "Las Comunidades Autónomas."
  - id: c
    text:
      es: "Los partidos judiciales."
  - id: d
    text:
      es: "Las capitales de provincia."
  explanation:
    es: "El artículo 69.1 crea una Delegación del Gobierno en cada Comunidad Autónoma, con sede donde radique su Consejo de Gobierno. En cada provincia de las Comunidades pluriprovinciales no hay Delegación, sino un Subdelegado bajo la dependencia del Delegado, como dicen los artículos 69.4 y 74. Las capitales de provincia no tienen órgano propio en el artículo 69, y los partidos judiciales tampoco son ámbito de ninguna Delegación ni Subdelegación."
  citation: "art. 69.1 LRJSP"
  difficulty: 1
  tags:
  - "estructura"
# anchor: boe-a-2015-10566-art-5
- id: m01-l08-q165
  prompt:
    es: "¿Qué unidades tienen la consideración de órganos administrativos, según el artículo 5.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Las unidades administrativas a las que se atribuyan funciones con efectos jurídicos frente a terceros o cuya actuación tenga carácter preceptivo."
  - id: b
    text:
      es: "Todas las unidades administrativas integradas en un Ministerio."
  - id: c
    text:
      es: "Las unidades que se establecen mediante relaciones de puestos de trabajo."
  - id: d
    text:
      es: "Las unidades cuyo titular tiene la condición de alto cargo."
  explanation:
    es: "El artículo 5.1 define el órgano administrativo por sus funciones: efectos jurídicos frente a terceros o actuación preceptiva. No basta estar integrado en un Ministerio, ni que la unidad se establezca en una relación de puestos de trabajo, que es el modo de crear cualquier unidad según el artículo 56.3. El rango de alto cargo del titular tampoco decide el carácter de órgano."
  citation: "art. 5.1 LRJSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-5
- id: m01-l08-q166
  prompt:
    es: "Conforme al artículo 5.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, tienen la consideración de órganos administrativos las unidades con funciones de efectos jurídicos frente a terceros, o cuya actuación tenga carácter:"
  options:
  - id: a
    text:
      es: "Facultativo."
  - id: b
    text:
      es: "Consultivo."
  - id: c
    text:
      es: "Reglado."
  - id: d
    correct: true
    text:
      es: "Preceptivo."
  explanation:
    es: "El artículo 5.1 exige actuación de carácter preceptivo. La actuación facultativa, la consultiva o la reglada no hacen de una unidad un órgano."
  citation: "art. 5.1 LRJSP"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-5
- id: m01-l08-q167
  prompt:
    es: "Según el artículo 5.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿a quién corresponde delimitar, en su ámbito competencial, las unidades administrativas que configuran sus órganos administrativos?"
  options:
  - id: a
    text:
      es: "Al Gobierno de la Nación para todas las Administraciones."
  - id: b
    text:
      es: "A las Cortes Generales mediante ley."
  - id: c
    text:
      es: "A la Comisión interministerial de coordinación de la Administración periférica."
  - id: d
    correct: true
    text:
      es: "A cada Administración Pública."
  explanation:
    es: "El artículo 5.2 deja la delimitación a cada Administración Pública en su ámbito competencial. No la centraliza el Gobierno de la Nación ni requiere una ley de las Cortes, y la Comisión interministerial solo coordina la Administración periférica."
  citation: "art. 5.2 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-5
- id: m01-l08-q168
  prompt:
    es: "Señale cuál de los siguientes NO es un requisito mínimo para la creación de cualquier órgano administrativo, según el artículo 5.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    correct: true
    text:
      es: "Obtener el informe previo del Consejo de Estado."
  - id: b
    text:
      es: "Delimitar sus funciones y competencias."
  - id: c
    text:
      es: "Dotarlo de los créditos necesarios para su puesta en marcha y funcionamiento."
  - id: d
    text:
      es: "Determinar su dependencia jerárquica."
  explanation:
    es: "El informe previo del Consejo de Estado no figura entre los requisitos del artículo 5.3. Sí exige determinar la forma de integración y la dependencia jerárquica, delimitar las funciones y competencias, y dotar los créditos necesarios."
  citation: "art. 5.3 LRJSP"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-5
- id: m01-l08-q169
  prompt:
    es: "Conforme al artículo 5.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la creación de cualquier órgano administrativo exige, al menos, determinar su forma de integración en la Administración Pública y:"
  options:
  - id: a
    text:
      es: "Su ámbito territorial."
  - id: b
    text:
      es: "Su régimen de personal."
  - id: c
    correct: true
    text:
      es: "Su dependencia jerárquica."
  - id: d
    text:
      es: "Su sede."
  explanation:
    es: "El artículo 5.3.a une la forma de integración y la dependencia jerárquica. El ámbito territorial, el régimen de personal y la sede no figuran entre los requisitos mínimos del artículo."
  citation: "art. 5.3 LRJSP"
  difficulty: 2
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-5
- id: m01-l08-q170
  prompt:
    es: "¿Cuál de las siguientes enumeraciones recoge los requisitos mínimos de creación de cualquier órgano administrativo, según el artículo 5.3 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "Forma de integración y dependencia jerárquica, funciones y competencias, y relación de puestos de trabajo."
  - id: b
    correct: true
    text:
      es: "Forma de integración y dependencia jerárquica, funciones y competencias, y créditos necesarios."
  - id: c
    text:
      es: "Dependencia jerárquica, funciones y competencias, y autorización del Consejo de Ministros."
  - id: d
    text:
      es: "Forma de integración, sede y ámbito territorial, y créditos necesarios."
  explanation:
    es: "El artículo 5.3 pide tres cosas: integración y dependencia jerárquica, funciones y competencias, y créditos para su funcionamiento. Las otras enumeraciones sustituyen un elemento por la relación de puestos de trabajo, por la autorización del Consejo de Ministros o por la sede y el ámbito territorial."
  citation: "art. 5.3 LRJSP"
  difficulty: 3
  tags:
  - "requisito"
# anchor: boe-a-2015-10566-art-5
- id: m01-l08-q171
  prompt:
    es: "Conforme al artículo 5.4 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, no pueden crearse nuevos órganos que supongan duplicación de otros ya existentes si al mismo tiempo no:"
  options:
  - id: a
    text:
      es: "Se suprime el órgano existente en todo caso."
  - id: b
    text:
      es: "Se obtiene el informe favorable del órgano ya existente."
  - id: c
    correct: true
    text:
      es: "Se suprime o restringe debidamente la competencia de estos."
  - id: d
    text:
      es: "Se transfiere su personal al nuevo órgano."
  explanation:
    es: "El artículo 5.4 admite el nuevo órgano si al mismo tiempo se suprime o restringe debidamente la competencia de los existentes. No exige suprimirlos siempre, ni el informe favorable de esos órganos, ni el traspaso de su personal."
  citation: "art. 5.4 LRJSP"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-2015-10566-art-56
- id: m01-l08-q172
  prompt:
    es: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las unidades administrativas son los elementos organizativos básicos de:"
  options:
  - id: a
    text:
      es: "Las relaciones de puestos de trabajo."
  - id: b
    correct: true
    text:
      es: "Las estructuras orgánicas."
  - id: c
    text:
      es: "Los servicios comunes."
  - id: d
    text:
      es: "Los órganos colegiados."
  explanation:
    es: "El artículo 56.1 las define como elementos organizativos básicos de las estructuras orgánicas. Las relaciones de puestos de trabajo son el instrumento que las establece, los servicios comunes son un tipo de funciones y los órganos colegiados son otra figura distinta."
  citation: "art. 56.1 LRJSP"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2015-10566-art-56
- id: m01-l08-q173
  prompt:
    es: "Señale la respuesta correcta sobre las unidades administrativas, de acuerdo con el artículo 56 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público:"
  options:
  - id: a
    text:
      es: "Se crean por Real Decreto del Consejo de Ministros y se integran en una Subsecretaría."
  - id: b
    text:
      es: "Son los elementos organizativos básicos de los órganos colegiados y se establecen por orden ministerial."
  - id: c
    text:
      es: "Se establecen mediante las relaciones de puestos de trabajo y constituyen en todo caso órganos administrativos."
  - id: d
    correct: true
    text:
      es: "Se establecen mediante las relaciones de puestos de trabajo y se integran en un determinado órgano."
  explanation:
    es: "Según el artículo 56.3, las unidades se establecen mediante las relaciones de puestos de trabajo y se integran en un determinado órgano. No se crean por Real Decreto ni se integran siempre en una Subsecretaría, no son elementos básicos de los órganos colegiados, y solo son órganos las que cumplan el artículo 5.1."
  citation: "art. 56.3 LRJSP"
  difficulty: 3
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-2015-10566-art-78
- id: m01-l08-q174
  prompt:
    es: "Conforme al artículo 78.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, la Comisión interministerial de coordinación de la Administración periférica del Estado coordina la actuación de la Administración periférica con:"
  options:
  - id: a
    correct: true
    text:
      es: "Los Departamentos ministeriales."
  - id: b
    text:
      es: "Las Comunidades Autónomas."
  - id: c
    text:
      es: "Las Entidades locales."
  - id: d
    text:
      es: "Los Delegados del Gobierno."
  explanation:
    es: "El artículo 78.2 le encarga coordinar la Administración periférica con los distintos Departamentos ministeriales. Su función no mira a las Comunidades Autónomas ni a las Entidades locales, y los Delegados del Gobierno forman parte de esa Administración periférica."
  citation: "art. 78.2 LRJSP"
  difficulty: 2
  tags:
  - "competencia"
# anchor: boe-a-2015-10566-art-78
- id: m01-l08-q175
  prompt:
    es: "¿Qué órgano coordina la actuación de la Administración periférica del Estado con los Departamentos ministeriales, según el artículo 78 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    text:
      es: "La Comisión territorial de asistencia al Delegado del Gobierno."
  - id: b
    correct: true
    text:
      es: "La Comisión interministerial de coordinación de la Administración periférica del Estado."
  - id: c
    text:
      es: "La Conferencia Sectorial de Administración Pública."
  - id: d
    text:
      es: "La Secretaría General de la Delegación del Gobierno."
  explanation:
    es: "El artículo 78.2 atribuye esa coordinación a la Comisión interministerial. La Comisión territorial asiste al Delegado en su Comunidad, la Conferencia Sectorial es un órgano de cooperación con las Comunidades Autónomas y la Secretaría General gestiona los servicios comunes de la Delegación."
  citation: "art. 78.2 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-2015-10566-art-79
- id: m01-l08-q176
  prompt:
    es: "Según el artículo 79.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en cada Comunidad Autónoma pluriprovincial existirá una Comisión territorial de asistencia al Delegado del Gobierno, presidida por:"
  options:
  - id: a
    text:
      es: "El Presidente de la Comunidad Autónoma."
  - id: b
    text:
      es: "El Secretario General de la Delegación."
  - id: c
    correct: true
    text:
      es: "El Delegado del Gobierno en la Comunidad Autónoma."
  - id: d
    text:
      es: "El Subdelegado de la provincia donde radique la sede."
  explanation:
    es: "El artículo 79.1.a la hace presidir por el Delegado del Gobierno. No la preside el Presidente autonómico, ni el Secretario General, ni un Subdelegado: los Subdelegados son sus miembros."
  citation: "art. 79.1 LRJSP"
  difficulty: 2
  tags:
  - "órgano"
  - "composición"
# anchor: boe-a-2015-10566-art-79
- id: m01-l08-q177
  prompt:
    es: "¿Cuál de las siguientes opciones indica quiénes integran la Comisión territorial de asistencia al Delegado del Gobierno de cada Comunidad Autónoma pluriprovincial, según el artículo 79.1 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público?"
  options:
  - id: a
    correct: true
    text:
      es: "Los Subdelegados del Gobierno en las provincias de la Comunidad."
  - id: b
    text:
      es: "Los Directores Insulares."
  - id: c
    text:
      es: "Los Presidentes de las Diputaciones provinciales."
  - id: d
    text:
      es: "Los Secretarios generales técnicos de los Ministerios."
  explanation:
    es: "El artículo 79.1.a la integra con los Subdelegados del Gobierno en las provincias de la Comunidad. Los Directores Insulares, los Presidentes de las Diputaciones y los Secretarios generales técnicos no son miembros."
  citation: "art. 79.1 LRJSP"
  difficulty: 2
  tags:
  - "composición"
