# anchor: fuente-ms-win-atajos-html
- id: m06-l02-q325
  prompt:
    es: "En Windows 11, ¿cuál de los siguientes métodos abreviados de teclado con la tecla Windows abre Microsoft Copilot, según la tabla de métodos abreviados?"
  options:
  - id: a
    text:
      es: "Windows+S"
  - id: b
    text:
      es: "Windows+H"
  - id: c
    correct: true
    text:
      es: "Windows+C"
  - id: d
    text:
      es: "Windows+V"
  explanation:
    es: "La tabla de la tecla Windows asigna a Windows+C «Abre Microsoft Copilot o Microsoft 365 Copilot». Windows+S abre la búsqueda, Windows+H abre el dictado por voz y Windows+V abre el historial del Portapapeles."
  citation: "fuente: `ms-win-atajos.html`; «Métodos abreviados de teclado con las teclas de Windows»"
  difficulty: 1
  tags:
  - "atajo"
# anchor: fuente-ms-copilot-windows-html
- id: m06-l02-q326
  prompt:
    es: "En Windows 11, ¿cuál de las siguientes opciones inicia la aplicación Copilot desde el teclado, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "La tecla Windows sola, sin combinar con otra"
  - id: b
    correct: true
    text:
      es: "La tecla Copilot del teclado"
  - id: c
    text:
      es: "La combinación Ctrl+Esc"
  - id: d
    text:
      es: "La combinación Windows+Z"
  explanation:
    es: "La página dice que Copilot se inicia presionando la tecla Copilot del teclado o con Windows+C. La tecla Windows sola abre o cierra el menú Inicio, Ctrl+Esc abre el menú Inicio y Windows+Z abre los diseños de ajuste."
  citation: "fuente: `ms-copilot-windows.html`; «Abrir Copilot con una tecla de método abreviado de Windows»"
  difficulty: 2
  tags:
  - "atajo"
# anchor: fuente-ms-copilot-windows-html
- id: m06-l02-q327
  prompt:
    es: "En Windows 11, ¿qué puede iniciar el método abreviado de teclado de Copilot, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "La aplicación completa o solo una vista rápida más pequeña"
  - id: b
    text:
      es: "Solo la aplicación completa, siempre en pantalla completa"
  - id: c
    text:
      es: "Solo una vista rápida, nunca la aplicación completa"
  - id: d
    text:
      es: "Solo el chat de Copilot dentro del navegador Edge"
  explanation:
    es: "La página dice que la tecla de método abreviado de Windows puede iniciar la aplicación completa o solo una vista rápida más pequeña, y que se configura en los métodos abreviados de teclado de Copilot de la cuenta. Las otras opciones restringen el resultado a una sola forma."
  citation: "fuente: `ms-copilot-windows.html`; «Abrir Copilot con una tecla de método abreviado de Windows»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-copilot-windows-html
- id: m06-l02-q328
  prompt:
    es: "Señale la afirmación correcta sobre la aplicación Copilot en los equipos con Windows 11, según la ayuda de Microsoft:"
  options:
  - id: a
    text:
      es: "Solo se puede obtener descargándola de la Microsoft Store, en cualquier equipo"
  - id: b
    text:
      es: "Solo se abre con la tecla Copilot, sin otra combinación de teclas"
  - id: c
    text:
      es: "Solo funciona con una cuenta profesional o educativa de Microsoft 365"
  - id: d
    correct: true
    text:
      es: "En equipos nuevos viene instalada, anclada a la barra de tareas o en el menú Inicio"
  explanation:
    es: "La página dice que en equipos nuevos con Windows 11 la aplicación ya debería estar instalada, anclada a la barra de tareas o en el menú Inicio, que se descarga de la Microsoft Store si aún no está, que también se abre con Windows+C y que se inicia sesión con una cuenta profesional o educativa o con una cuenta personal."
  citation: "fuente: `ms-copilot-windows.html`; «Abrir Copilot con una tecla de método abreviado de Windows»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-copilot-windows-html
- id: m06-l02-q330
  prompt:
    es: "¿En qué ruta de la aplicación Configuración de Windows 11 se configura el botón de acceso directo del lápiz para que abra Copilot?"
  options:
  - id: a
    text:
      es: "Configuración › Sistema › Multitarea › Escritorios"
  - id: b
    text:
      es: "Configuración › Sistema › Notificaciones › No molestar"
  - id: c
    correct: true
    text:
      es: "Configuración › Bluetooth & dispositivos › Lápiz & Windows Ink"
  - id: d
    text:
      es: "Configuración › Cuentas › Opciones de inicio de sesión › Windows Hello"
  explanation:
    es: "La página indica que se va a Configuración › Bluetooth & dispositivos › Lápiz & Windows Ink, se busca Elija qué hace el botón de acceso directo y se selecciona Igual que la clave Copilot. Las demás rutas son las de Escritorios, que decide las ventanas de la barra de tareas con varios escritorios, No molestar, que silencia notificaciones, y Windows Hello, del inicio de sesión."
  citation: "fuente: `ms-copilot-windows.html`; «Abrir Copilot con un botón de acceso directo de lápiz para Windows»"
  difficulty: 2
  tags:
  - "ofimática-menú"
  - "configuración"
# anchor: fuente-ms-copilot-windows-html
- id: m06-l02-q331
  prompt:
    es: "En Copilot para Windows, ¿cuál de las siguientes características puede ver las ventanas del explorador o las aplicaciones abiertas en la pantalla y ayudar a hacer algo paso a paso?"
  options:
  - id: a
    text:
      es: "Buscar archivos con Copilot"
  - id: b
    correct: true
    text:
      es: "Copilot Vision"
  - id: c
    text:
      es: "Ver contenido web"
  - id: d
    text:
      es: "Compatibilidad con la configuración de Windows"
  explanation:
    es: "La página dice que Copilot Vision puede ver las ventanas del explorador o las aplicaciones abiertas en la pantalla y responder preguntas o ayudar a hacer algo paso a paso. Buscar archivos con Copilot busca y lee archivos del dispositivo, Ver contenido web abre los vínculos en un panel lateral y la compatibilidad con la configuración guía a la opción relevante de Configuración."
  citation: "fuente: `ms-copilot-windows.html`; «Características adicionales de la aplicación Copilot para Windows»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-copilot-windows-html
- id: m06-l02-q332
  prompt:
    es: "En Copilot para Windows, ¿cuál de las siguientes características abre el contenido de un vínculo en un panel lateral junto a la conversación?"
  options:
  - id: a
    correct: true
    text:
      es: "Ver contenido web"
  - id: b
    text:
      es: "Copilot Vision"
  - id: c
    text:
      es: "Buscar archivos con Copilot"
  - id: d
    text:
      es: "Realizar una captura de pantalla"
  explanation:
    es: "La página dice que, al seleccionar un vínculo, Copilot abre el contenido en un panel lateral junto a la conversación, en lugar de en una ventana del explorador independiente. Copilot Vision observa las ventanas abiertas, Buscar archivos con Copilot busca en el dispositivo y la captura de pantalla carga una imagen para formular una pregunta."
  citation: "fuente: `ms-copilot-windows.html`; «Características adicionales de la aplicación Copilot para Windows»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-copilot-windows-html
- id: m06-l02-q333
  prompt:
    es: "En Copilot para Windows, ¿qué permite hacer la característica Buscar archivos con Copilot, según la ayuda de Microsoft?"
  options:
  - id: a
    correct: true
    text:
      es: "Buscar, abrir y formular preguntas sobre el contenido de un archivo del dispositivo"
  - id: b
    text:
      es: "Ver las ventanas abiertas y ayudar paso a paso a hacer una tarea"
  - id: c
    text:
      es: "Abrir los vínculos en un panel lateral junto a la conversación"
  - id: d
    text:
      es: "Guiar hasta la opción relevante de la Configuración de Windows"
  explanation:
    es: "La página dice que Copilot en Windows puede ayudar a buscar, abrir y formular preguntas sobre el contenido de un archivo del dispositivo, incluidos los archivos sincronizados de OneDrive. Ver ventanas abiertas es Copilot Vision, abrir vínculos en un panel lateral es Ver contenido web y guiar a la Configuración es la compatibilidad con la configuración de Windows."
  citation: "fuente: `ms-copilot-windows.html`; «Características adicionales de la aplicación Copilot para Windows»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-copilot-windows-html
- id: m06-l02-q334
  prompt:
    es: "En Copilot para Windows, ¿cuál de las siguientes acciones realiza la compatibilidad con la configuración de Windows ante una petición como «Haz que mi pantalla sea más fácil de leer»?"
  options:
  - id: a
    text:
      es: "Abre los vínculos en un panel lateral junto a la conversación"
  - id: b
    text:
      es: "Ve las ventanas abiertas y ayuda paso a paso a hacer la tarea"
  - id: c
    text:
      es: "Busca y lee archivos .docx, .xlsx, .pptx, .txt, .pdf y .json"
  - id: d
    correct: true
    text:
      es: "Guía hasta la opción relevante de la Configuración de Windows"
  explanation:
    es: "La página dice que Copilot guía a la opción relevante de la Configuración de Windows. Abrir vínculos en un panel lateral es Ver contenido web, ver las ventanas abiertas es Copilot Vision y leer archivos .docx, .xlsx, .pptx, .txt, .pdf y .json es Buscar archivos con Copilot."
  citation: "fuente: `ms-copilot-windows.html`; «Características adicionales de la aplicación Copilot para Windows»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-copilot-introduccion-html
- id: m06-l02-q335
  prompt:
    es: "¿Cuál de las siguientes opciones recoge lo que, según Microsoft, impulsa todas las experiencias de Microsoft Copilot?"
  options:
  - id: a
    text:
      es: "Modelos de lenguaje de gran tamaño, fundamentación solo en datos locales del equipo y acceso definido por el administrador"
  - id: b
    text:
      es: "Un buscador de palabras clave, fundamentación en datos web u organizativos y acceso definido por permisos de usuario"
  - id: c
    correct: true
    text:
      es: "Modelos de lenguaje de gran tamaño, fundamentación en datos web u organizativos y acceso definido por permisos de usuario"
  - id: d
    text:
      es: "Modelos de lenguaje de gran tamaño, fundamentación en datos web u organizativos y acceso sin restricciones para todos"
  explanation:
    es: "La página dice que todas las experiencias de Microsoft Copilot están impulsadas por modelos de lenguaje de gran tamaño (LLM) para la comprensión y generación del lenguaje natural, por la fundamentación en datos web u organizativos (Microsoft Graph y Work IQ) y por un acceso definido por permisos de usuario, con seguridad y cumplimiento obligatorios. Las otras opciones cambian uno de los tres elementos."
  citation: "fuente: `ms-copilot-introduccion.html`; «Introducción a Microsoft Copilot»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-copilot-introduccion-html
- id: m06-l02-q336
  prompt:
    es: "Según Microsoft, ¿en qué datos se fundamentan las respuestas de todas las experiencias de Microsoft Copilot?"
  options:
  - id: a
    text:
      es: "Solo en datos web públicos obtenidos mediante Bing"
  - id: b
    correct: true
    text:
      es: "En datos web u organizativos, mediante Microsoft Graph y Work IQ"
  - id: c
    text:
      es: "Solo en los archivos almacenados en el equipo del usuario"
  - id: d
    text:
      es: "Solo en los correos electrónicos del buzón del usuario"
  explanation:
    es: "La página dice que todas las experiencias de Copilot tienen fundamentación en datos web u organizativos (Microsoft Graph y Work IQ). Las demás opciones la reducen a una única fuente: web pública, archivos locales o correo."
  citation: "fuente: `ms-copilot-introduccion.html`; «Introducción a Microsoft Copilot»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-ms-copilot-introduccion-html
- id: m06-l02-q337
  prompt:
    es: "Según la documentación de Microsoft, ¿qué nombre recibe ahora la aplicación que antes se llamaba Microsoft 365 Copilot?"
  options:
  - id: a
    text:
      es: "Microsoft Copilot Chat"
  - id: b
    correct: true
    text:
      es: "Microsoft Copilot"
  - id: c
    text:
      es: "Microsoft Copilot Cowork"
  - id: d
    text:
      es: "Microsoft Copilot Code"
  explanation:
    es: "La página dice que la aplicación Microsoft 365 Copilot ahora se denomina Microsoft Copilot. Microsoft Copilot Chat es el nombre actual de la aplicación Microsoft 365 Copilot Chat, y Cowork y Code son funciones de Copilot que se usan mediante facturación basada en el uso."
  citation: "fuente: `ms-copilot-introduccion.html`; «Introducción a Microsoft Copilot»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-word-copilot-html
- id: m06-l02-q338
  prompt:
    es: "En Word para Microsoft 365, ¿cuál de los siguientes botones se selecciona en la esquina del documento para abrir Copilot?"
  options:
  - id: a
    correct: true
    text:
      es: "El botón de Acción dinámica de Copilot"
  - id: b
    text:
      es: "El botón Resumen por Copilot"
  - id: c
    text:
      es: "El botón Copilot Vision"
  - id: d
    text:
      es: "El botón Solo chat"
  explanation:
    es: "La página dice que se abre un documento en Word y se selecciona el botón de Acción dinámica de Copilot en la esquina del documento. Resumen por Copilot es el botón de Outlook para resumir una conversación, Copilot Vision es una característica de la aplicación Copilot de Windows y Solo chat es una opción que se elige después, en el panel de chat."
  citation: "fuente: `ms-word-copilot.html`; «Abrir Copilot en Word»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-copilot-html
- id: m06-l02-q339
  prompt:
    es: "En Word para Microsoft 365, ¿cómo se abre Copilot al seleccionar su botón en la esquina del documento?"
  options:
  - id: a
    text:
      es: "En una ventana aparte del Explorador de archivos"
  - id: b
    text:
      es: "En el panel de chat, con el modo Solo chat activado"
  - id: c
    text:
      es: "En la barra de tareas, como aplicación independiente"
  - id: d
    correct: true
    text:
      es: "En el panel de chat, con el modo de edición activado"
  explanation:
    es: "La página dice que Copilot se abre en el panel de chat con el modo de edición activado. Solo chat es una opción que se selecciona después, y la página dice que Copilot trabaja en el lienzo de Word y en el panel de chat, no en una ventana aparte."
  citation: "fuente: `ms-word-copilot.html`; «Abrir Copilot en Word»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-copilot-html
- id: m06-l02-q340
  prompt:
    es: "En Word para Microsoft 365, ¿cuál de las siguientes opciones se selecciona para que Copilot responda en el chat y no realice cambios en el documento?"
  options:
  - id: a
    text:
      es: "Editar con Copilot"
  - id: b
    text:
      es: "Reescribir"
  - id: c
    correct: true
    text:
      es: "Solo chat"
  - id: d
    text:
      es: "Iniciar un borrador"
  explanation:
    es: "La página dice que se selecciona Solo chat para que Copilot responda en el chat y no realice cambios en el documento. Editar con Copilot sirve para mejorar un documento existente, Reescribir es una opción preestablecida sobre el texto seleccionado e Iniciar un borrador genera contenido nuevo."
  citation: "fuente: `ms-word-copilot.html`; «Comprender y actuar sobre el contenido del documento»"
  difficulty: 3
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-word-copilot-html
- id: m06-l02-q341
  prompt:
    es: "En Word para Microsoft 365, ¿cómo se hace un cambio rápido en un fragmento concreto con Copilot?"
  options:
  - id: a
    text:
      es: "Seleccionando el texto y eligiendo la opción Solo chat"
  - id: b
    text:
      es: "Escribiendo / en el panel de chat y el nombre de un correo"
  - id: c
    correct: true
    text:
      es: "Seleccionando el texto y eligiendo una opción preestablecida, como Reescribir"
  - id: d
    text:
      es: "Seleccionando Resumen por Copilot en la parte superior"
  explanation:
    es: "La página dice que, para un cambio rápido en un fragmento específico, se selecciona el texto y se elige una opción preestablecida, como Reescribir. Solo chat impide los cambios en el documento, escribir / sirve para indicar un documento, correo o reunión que Copilot debe usar y Resumen por Copilot es de Outlook."
  citation: "fuente: `ms-word-copilot.html`; «Mejorar un documento existente»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-copilot-html
- id: m06-l02-q342
  prompt:
    es: "En Word para Microsoft 365, ¿cómo procede Copilot antes de cambiar un documento que se comparte con otras personas?"
  options:
  - id: a
    text:
      es: "Aplica los cambios y los deja marcados para revisarlos después"
  - id: b
    correct: true
    text:
      es: "Muestra en el chat una vista previa de los cambios y espera a que se revisen y aprueben"
  - id: c
    text:
      es: "Crea una copia del documento y cambia solo esa copia"
  - id: d
    text:
      es: "Agrega los cambios al documento y los muestra después en el chat"
  explanation:
    es: "La página dice que, cuando Copilot planea cambiar un documento compartido, primero muestra una vista previa de los cambios sugeridos en el chat y no se agrega nada hasta que se revisa y aprueba. También dice que se trabaja en el archivo original en lugar de crear copias adicionales."
  citation: "fuente: `ms-word-copilot.html`; «Mejorar un documento existente»"
  difficulty: 2
  tags:
  - "comportamiento"
# anchor: fuente-ms-word-copilot-html
- id: m06-l02-q343
  prompt:
    es: "En Word para Microsoft 365, ¿qué se dice de los idiomas que admite Copilot respecto a los de la interfaz de Word?"
  options:
  - id: a
    correct: true
    text:
      es: "Copilot admite menos idiomas que la interfaz de Word"
  - id: b
    text:
      es: "Copilot admite más idiomas que la interfaz de Word"
  - id: c
    text:
      es: "Copilot admite exactamente los mismos idiomas que la interfaz"
  - id: d
    text:
      es: "Copilot admite todos los idiomas de Microsoft 365"
  explanation:
    es: "La página dice que Copilot admite menos idiomas que la interfaz de Word, por lo que la disponibilidad puede variar según el idioma. Más idiomas, los mismos o todos los de Microsoft 365 contradicen esa frase."
  citation: "fuente: `ms-word-copilot.html`; «Otras notas y sugerencias»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-ms-word-copilot-html
- id: m06-l02-q344
  prompt:
    es: "¿Cuál de las siguientes tareas es propia de Copilot en Word para Microsoft 365, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Generar gráficos y tablas dinámicas con vínculos editables a datos de origen"
  - id: b
    text:
      es: "Resumir un hilo de correo desde Resumen por Copilot en Outlook"
  - id: c
    text:
      es: "Transcribir reuniones y capturar elementos de acción en Teams"
  - id: d
    correct: true
    text:
      es: "Iniciar un borrador desde una indicación, un esquema, notas o un archivo"
  explanation:
    es: "La página dice que Copilot en Word sirve para crear, es decir, iniciar un borrador desde una indicación, un esquema, notas o un archivo al que se hace referencia. Los gráficos y las tablas dinámicas son de Excel, el resumen de un hilo es de Outlook y la transcripción de reuniones es de Teams."
  citation: "fuente: `ms-word-copilot.html`; «Cómo te ayuda Copilot a trabajar en Word»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-ms-excel-copilot-html
- id: m06-l02-q345
  prompt:
    es: "En Excel para Microsoft 365, ¿dónde está el icono de Copilot que se selecciona para abrirlo?"
  options:
  - id: a
    text:
      es: "En la esquina superior derecha del explorador Edge"
  - id: b
    text:
      es: "En la parte superior de la conversación de correo"
  - id: c
    text:
      es: "En la barra de tareas de Windows, junto al menú Inicio"
  - id: d
    correct: true
    text:
      es: "En la esquina inferior derecha de Excel"
  explanation:
    es: "La página dice que se selecciona el icono de Copilot en la esquina inferior derecha de Excel. El icono de Copilot Chat en Edge está en la esquina superior derecha del explorador, Resumen por Copilot está en la parte superior de la conversación de correo y la aplicación Copilot de Windows se encuentra anclada a la barra de tareas o en Inicio."
  citation: "fuente: `ms-excel-copilot.html`; «Abrir Copilot en Excel»"
  difficulty: 1
  tags:
  - "ofimática-menú"
# anchor: fuente-ms-excel-copilot-html
- id: m06-l02-q346
  prompt:
    es: "En Excel para Microsoft 365, ¿en qué modo se abre Copilot de forma predeterminada, entre los tres que ofrece?"
  options:
  - id: a
    text:
      es: "En modo plan"
  - id: b
    text:
      es: "En modo de solo chat"
  - id: c
    correct: true
    text:
      es: "En modo de edición"
  - id: d
    text:
      es: "En modo de análisis"
  explanation:
    es: "La página dice que Copilot en Excel ofrece tres modos, editar, planear o chatear, y que de forma predeterminada se abre en modo de edición. El modo plan y el de solo chat son otros dos, y no existe un modo de análisis entre los tres."
  citation: "fuente: `ms-excel-copilot.html`; «Elegir entre el modo de edición, chat y plan»"
  difficulty: 2
  tags:
  - "configuración"
# anchor: fuente-ms-excel-copilot-html
- id: m06-l02-q347
  prompt:
    es: "En Excel para Microsoft 365, ¿cuál de las siguientes acciones realiza el modo plan de Copilot, según la ayuda de Microsoft?"
  options:
  - id: a
    text:
      es: "Edita el libro directamente a partir de las solicitudes recibidas"
  - id: b
    correct: true
    text:
      es: "Genera un plan que se revisa y confirma antes de empezar a editar el libro"
  - id: c
    text:
      es: "Mantiene las respuestas en el chat sin hacer cambios en el libro"
  - id: d
    text:
      es: "Importa datos de otros libros guardados en OneDrive o SharePoint"
  explanation:
    es: "La página dice que el modo Plan crea un enfoque estructurado: en lugar de acciones inmediatas, Copilot genera un plan para revisar y confirmar el enfoque antes de empezar. Editar el libro directamente es el modo de edición, mantener las respuestas en el chat es el modo de solo chat e importar datos de otros libros es una de las tareas que puede hacer Copilot."
  citation: "fuente: `ms-excel-copilot.html`; «Elegir entre el modo de edición, chat y plan»"
  difficulty: 2
