type: quiz
variants:
- id: m09-l01-q01
  prompt:
    en: In the Prometheus documentation, a φ-quantile with φ equal to 0.95 over a set of observations is also called
      which of these statistics?
  options:
  - id: a
    correct: true
    text:
      en: The 95th percentile of the observations
  - id: b
    text:
      en: The median of the observations
  - id: c
    text:
      en: The 99th percentile of the observations
  - id: d
    text:
      en: The 5th percentile of the observations
  explanation:
    en: The 0.95-quantile is also called the 95th percentile. The median is the 0.5-quantile, not the 0.95-quantile.
      The 99th percentile and the 5th percentile are different statistics, because the documentation names the 0.95-quantile
      the 95th percentile.
  citation: prom-histograms#quantiles
  extract:
    en: The 0.95-quantile is also called the 95th percentile.
- id: m09-l01-q03
  prompt:
    en: 'In Java 25, the snippet sizes an index from these assumptions: 1000 entries per second, eight-hour days,
      20 days, 16-byte entries and 4,000-byte pages. What does it print?'
  options:
  - id: a
    text:
      en: 'seconds per day: 86400

        entries: 1728000000

        bytes: 27648000000

        gigabytes: 27.6

        leaf pages: 6912000'
  - id: b
    correct: true
    text:
      en: 'seconds per day: 28800

        entries: 576000000

        bytes: 9216000000

        gigabytes: 9.2

        leaf pages: 2304000'
  - id: c
    text:
      en: 'seconds per day: 28800

        entries: 576000000

        bytes: 576000000

        gigabytes: 0.6

        leaf pages: 144000'
  - id: d
    text:
      en: 'seconds per day: 28800

        entries: 576000000

        bytes: 9216000000

        gigabytes: 8.6

        leaf pages: 2304000'
  explanation:
    en: The snippet multiplies 1000 entries by 28800 seconds and 20 days, then 16 bytes and 4,000-byte pages, which
      gives the recorded output. The output with 86400 seconds is wrong because the day has eight hours. The output
      with 576000000 bytes is wrong because each entry takes 16 bytes. The output with 8.6 gigabytes is wrong because
      the snippet divides by 1e9, not by 2^30.
  citation: paper-oneil-lsm-tree#p3
  snippet: m09-l01/IndexCapacity.java
- id: m09-l01-q04
  prompt:
    en: According to the Protobuf best-practices page, what should you do with the tag number of a field you delete
      because it is no longer used?
  options:
  - id: a
    text:
      en: Give it to the next field you add, so that tag numbers stay compact
  - id: b
    text:
      en: Keep it for a field of another type, because only the number is encoded
  - id: c
    text:
      en: Leave it undeclared, because a deleted number cannot be used by mistake
  - id: d
    correct: true
    text:
      en: Reserve it, so that no one accidentally re-uses it in the future
  explanation:
    en: Reserving the tag number prevents anyone from accidentally re-using it in the future. Giving it to a new
      field is wrong because the page says to never re-use a tag number. Keeping it for a field of another type
      is wrong because changing the type of a field messes up deserialization. Leaving it undeclared is wrong because
      a number that is not reserved can be re-used by accident.
  citation: protobuf-proto-best-practices#reserve-tag-numbers; protobuf-proto-best-practices#reuse-number; protobuf-proto-best-practices#change-type
- id: m09-l01-q05
  prompt:
    en: In the Idempotency-Key Internet-Draft, which HTTP status code should a resource reply with when a client
      reuses an idempotency key with a different request payload?
  options:
  - id: a
    text:
      en: '`400`'
  - id: b
    text:
      en: '`409`'
  - id: c
    correct: true
    text:
      en: '`422`'
  - id: d
    text:
      en: '`429`'
  explanation:
    en: The resource replies with `422` when a key is reused with a different request payload. The status `400`
      is for a missing `Idempotency-Key` header. The status `409` is for a retry while the original request is still
      being processed. The status `429` is among the other errors that the draft leaves to the resource documentation.
  citation: ietf-httpapi-idempotency-key#content
  extract:
    en: If there is an attempt to reuse an idempotency key with a different request payload, the resource SHOULD
      reply with an HTTP 422 status code
- id: m09-l01-q06
  prompt:
    en: In PostgreSQL with the C locale, which condition on an indexed column can the query planner serve with a
      B-tree index?
  options:
  - id: a
    text:
      en: '`col LIKE ''%bar''`'
  - id: b
    correct: true
    text:
      en: '`col LIKE ''foo%''`'
  - id: c
    text:
      en: '`col ILIKE ''foo%''`'
  - id: d
    text:
      en: '`col LIKE other_col || ''%''`'
  explanation:
    en: The planner can use a B-tree index for `col LIKE 'foo%'` because the pattern is a constant anchored to the
      beginning of the string. The condition `col LIKE '%bar'` is ruled out because the documentation says a leading
      wildcard does not qualify. The condition `col ILIKE 'foo%'` is ruled out because `ILIKE` needs a pattern that
      starts with non-alphabetic characters. The condition `col LIKE other_col || '%'` is ruled out because the
      pattern must be a constant.
  citation: pg-indexes-types#INDEXES-TYPES-BTREE
  extract:
    en: The optimizer can also use a B-tree index for queries involving the pattern matching operators LIKE and
      ~ if the pattern is a constant and is anchored to the beginning of the string
- id: m09-l01-q07
  prompt:
    en: In the Prometheus documentation, among N observations, at which rank is the observation value that is the
      φ-quantile, for φ between 0 and 1?
  options:
  - id: a
    correct: true
    text:
      en: Number φ*N
  - id: b
    text:
      en: Number N/φ
  - id: c
    text:
      en: Number (1 − φ)*N
  - id: d
    text:
      en: Number φ + N
  explanation:
    en: The φ-quantile ranks at number φ*N among the N observations. The ranks N/φ, (1 − φ)*N and φ + N are other
      values than the φ*N that the documentation states.
  citation: prom-histograms#quantiles
  extract:
    en: The φ-quantile is the observation value that ranks at number φ*N among the N observations.
- id: m09-l01-q09
  prompt:
    en: According to the Protobuf best-practices page, which change to an existing field should you almost never
      make, because it messes up deserialization?
  options:
  - id: a
    text:
      en: Reserving the tag number of a deleted field
  - id: b
    text:
      en: Reserving the name of a deleted field
  - id: c
    correct: true
    text:
      en: Changing the type of the field
  - id: d
    text:
      en: Reserving tag numbers without declaring a type
  explanation:
    en: Changing the type of a field is the change to almost never make, because it messes up deserialization. Reserving
      the tag number of a deleted field is recommended so that no one re-uses it. Reserving the name is allowed
      to avoid recycling deleted field names. Reserving tag numbers without a type is enough, because no type is
      required.
  citation: protobuf-proto-best-practices#change-type; protobuf-proto-best-practices#reserve-tag-numbers
- id: m09-l01-q10
  prompt:
    en: A service runs on 12 replicated instances, and the team needs one overall 95th percentile of request durations.
      According to the Prometheus guide on histograms and summaries, which statement about aggregating across instances
      is correct?
  options:
  - id: a
    text:
      en: Averaging the 0.95-quantiles exposed by the summaries gives the overall 95th percentile
  - id: b
    correct: true
    text:
      en: A summary cannot be used when observations from several instances must be aggregated
  - id: c
    text:
      en: A native histogram cannot be aggregated, because each instance uses incompatible buckets
  - id: d
    text:
      en: A classic histogram can never be aggregated, whatever its bucket boundaries
  explanation:
    en: You cannot use a summary if you need to aggregate the observations from a number of instances. Averaging
      summary quantiles is wrong, because averaging the quantiles yields statistically nonsensical values. A native
      histogram that cannot be aggregated is wrong, because its buckets are always compatible and aggregation is
      ad-hoc with a `PromQL` expression. A classic histogram that never aggregates is wrong, because aggregation
      works provided there are no changes in bucket boundaries.
  citation: prom-histograms#errors-of-quantile-estimation; prom-histograms#quantiles
  extract:
    en: you cannot use a summary if you need to aggregate the observations from a number of instances
- id: m09-l01-q11
  prompt:
    en: A client sends a payment request twice after a timeout, and the resource must recognise the second request
      as a retry. According to the Idempotency-Key Internet-Draft, who generates the idempotency key that makes
      this possible?
  options:
  - id: a
    correct: true
    text:
      en: The client
  - id: b
    text:
      en: The resource, when it receives the first request
  - id: c
    text:
      en: An API gateway placed in front of the resource
  - id: d
    text:
      en: The database that stores the payment
  explanation:
    en: An idempotency key is a unique value generated by the client, which the resource uses to recognize subsequent
      retries of the same request. The resource generating the key is wrong, because the resource only uses the
      key to recognize retries. An API gateway generating the key is wrong, because the draft names the client as
      the generator. The payment database generating the key is wrong, because the draft names the client as the
      generator.
  citation: ietf-httpapi-idempotency-key#content
  extract:
    en: An idempotency key is a unique value generated by the client which the resource uses to recognize subsequent
      retries of the same request
- id: m09-l01-q13
  prompt:
    en: According to the LSM-tree paper by O'Neil and colleagues, which index operation remains relatively costly
      even though the LSM-tree defers and batches index changes?
  options:
  - id: a
    text:
      en: Frequent index inserts into the index
  - id: b
    text:
      en: Migrating deferred index changes out to disk
  - id: c
    text:
      en: Deletes, updates and long latency finds
  - id: d
    correct: true
    text:
      en: Finds that require an immediate response
  explanation:
    en: Only finds that require immediate response remain relatively costly with an LSM-tree. Frequent index inserts
      are wrong, because the LSM-tree performs them with much less disk arm use and at an order of magnitude lower
      cost. Migrating deferred changes is wrong, because the LSM-tree migrates them out to disk in a particularly
      efficient way reminiscent of merge sort. Deletes, updates and long latency finds are wrong, because the LSM-tree
      supports them with the same deferred efficiency.
  citation: paper-oneil-lsm-tree#p3
