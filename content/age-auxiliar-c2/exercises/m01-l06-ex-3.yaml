  difficulty: 3
  tags:
  - "procedimiento"
# anchor: fuente-un-res-70-1-agenda-2030-pdf
- id: m01-l06-q042
  prompt:
    es: "Según el párrafo 87 de la Resolución 70/1 de la Asamblea General de las Naciones Unidas, de 25 de septiembre de 2015, el foro político de alto nivel se reunirá:"
  options:
  - id: a
    text:
      es: "Cada año, bajo los auspicios de la Asamblea General."
  - id: b
    correct: true
    text:
      es: "Cada cuatro años, bajo los auspicios de la Asamblea General."
  - id: c
    text:
      es: "Cada cuatro años, bajo los auspicios del Consejo Económico y Social."
  - id: d
    text:
      es: "Cada dos años, bajo los auspicios del Consejo de Seguridad."
  explanation:
    es: "El párrafo 87 habla del foro político de alto nivel «que se reunirá cada cuatro años bajo los auspicios de la Asamblea General». Bajo los auspicios del Consejo Económico y Social el foro hace los exámenes periódicos del párrafo 84; la reunión cada cuatro años es la de la Asamblea General. El Consejo de Seguridad no interviene."
  citation: "fuente: `un-res-70-1-agenda-2030.pdf`"
  difficulty: 2
  tags:
  - "plazo"
