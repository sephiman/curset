  explanation:
    es: "Ejecutar reglas ahora, en Archivo › Administrar reglas y alertas, ejecuta manualmente las reglas elegidas. Cambiar regla permite modificar el tipo de cambio de una regla. Nueva regla crea una regla nueva. Eliminar quita la regla seleccionada."
