# anchor: fuente-ms-win-colores-html
- id: m02-l06-q166
  prompt:
    es: "En Windows 11, en Configuración › Personalización › Colores, ¿qué efecto tienen los efectos de transparencia cuando están habilitados?"
  options:
  - id: a
    text:
      es: "Windows elige por sí solo un color de énfasis a partir de la imagen que se usa como fondo"
  - id: b
    text:
      es: "El modo de color cambia entre Claro y Oscuro según la hora del día, sin que el usuario lo elija"
  - id: c
    text:
      es: "El color de énfasis elegido se aplica también a las barras de título y a los bordes de las ventanas"
  - id: d
    correct: true
    text:
      es: "Algunos fondos y superficies de ventanas parecen ligeramente transparentes, con desenfoque acrílico"
  explanation:
    es: "Los efectos de transparencia hacen que algunos fondos y superficies parezcan ligeramente transparentes con un desenfoque acrílico. Aplicar el color de énfasis a las barras de título es otra opción de la misma página, que Windows elija el color de énfasis es el valor Automático, y el modo Claro u Oscuro se elige aparte en Elegir el modo, sin cambio automático por hora."
  citation: "fuente: `ms-win-colores.html`; «Efectos de transparencia»"
  difficulty: 1
  tags:
