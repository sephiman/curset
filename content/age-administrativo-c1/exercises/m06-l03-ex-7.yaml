# anchor: fuente-ms-win-desuso-html
- id: m06-l03-q222
  prompt:
    es: "Según Microsoft, ¿cuál de las siguientes aplicaciones de Windows 11 se recomienda para crear y editar documentos de texto sin formato, como los archivos con extensión .txt?"
  options:
  - id: a
    correct: true
    text:
      es: "El Bloc de notas de Windows"
  - id: b
    text:
      es: "Microsoft Word, de la suite de Microsoft 365"
  - id: c
    text:
      es: "Paint, la aplicación de edición gráfica"
  - id: d
    text:
      es: "La Calculadora, con sus modos de cálculo"
  explanation:
    es: "La página recomienda el Bloc de notas de Windows para documentos de texto sin formato como .txt y Microsoft Word para documentos de texto enriquecido como .doc y .rtf. Paint es una aplicación de edición gráfica y la Calculadora hace cálculos."
  citation: "fuente: `ms-win-desuso.html`; «WordPad»"
  difficulty: 1
  tags:
  - "concepto"
