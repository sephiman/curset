  - "composición"
# anchor: boe-a-1995-8729-art-47
- id: m04-l05-q022
  prompt:
    es: "Según el artículo 47.1 del Real Decreto 364/1995, de 10 de marzo, el concurso se resuelve en dos meses desde el día siguiente al de la finalización del plazo de solicitudes. ¿Por qué vía puede establecerse un plazo distinto?"
  options:
  - id: a
    text:
      es: "Por acuerdo motivado de la Comisión de Valoración."
  - id: b
    text:
      es: "Por resolución del Subsecretario del Departamento convocante."
  - id: c
    text:
      es: "Por informe de la Junta de Personal del centro afectado."
  - id: d
    correct: true
    text:
      es: "Por la propia convocatoria del concurso."
  explanation:
    es: "El artículo 47.1 RD 364/1995 fija dos meses «salvo que la propia convocatoria establezca otro distinto». La vía es la convocatoria. El artículo no permite cambiar ese plazo por acuerdo de la Comisión de Valoración, por resolución del Subsecretario ni por informe de la Junta de Personal."
  citation: "art. 47.1 RD 364/1995"
  difficulty: 1
  tags:
  - "plazo"
  - "competencia"
# anchor: boe-a-1995-8729-art-50
- id: m04-l05-q023
  prompt:
    es: "Según el artículo 50.1 del Real Decreto 364/1995, de 10 de marzo, los funcionarios que accedan a un puesto por concurso podrán ser removidos, entre otras causas sobrevenidas, por:"
  options:
  - id: a
    text:
      es: "la pérdida de confianza del órgano que efectuó el nombramiento, apreciada por este de forma discrecional."
  - id: b
    text:
      es: "una reorganización de la unidad que no altere el contenido del puesto en la relación de puestos de trabajo."
  - id: c
    correct: true
    text:
      es: "una falta de capacidad para su desempeño manifestada por rendimiento insuficiente, que no comporte inhibición."
  - id: d
    text:
      es: "cualquier rendimiento insuficiente, aunque comporte inhibición del funcionario en el ejercicio de sus tareas."
  explanation:
    es: "El artículo 50.1 RD 364/1995 admite la remoción por una alteración del contenido del puesto hecha a través de las relaciones de puestos de trabajo, o por «una falta de capacidad para su desempeño manifestada por rendimiento insuficiente, que no comporte inhibición». La pérdida de confianza apreciada de forma discrecional es propia del cese en libre designación, no de la remoción. Una reorganización que no altera el contenido del puesto no es causa. El rendimiento insuficiente que comporta inhibición queda fuera del artículo."
  citation: "art. 50.1 RD 364/1995"
  difficulty: 2
  tags:
  - "concepto"
  - "requisito"
# anchor: boe-a-1995-8729-art-50
- id: m04-l05-q024
  prompt:
    es: "Un funcionario obtuvo su puesto por concurso. Una modificación de la relación de puestos de trabajo altera el contenido del puesto y cambia los supuestos que sirvieron de base a la convocatoria. ¿Qué puede acordarse?"
  options:
  - id: a
    text:
      es: "Su cese discrecional, como en la libre designación."
  - id: b
    correct: true
    text:
      es: "Su remoción del puesto, por una causa sobrevenida."
  - id: c
    text:
      es: "Su reasignación de efectivos, sin Plan de Empleo."
  - id: d
    text:
      es: "Su redistribución a un puesto de nivel inferior."
  explanation:
    es: "El artículo 50.1 RD 364/1995 permite remover a quien accedió por concurso por causas sobrevenidas «derivadas de una alteración en el contenido del puesto, realizada a través de las relaciones de puestos de trabajo, que modifique los supuestos que sirvieron de base a la convocatoria». Ese es el caso. El cese discrecional es propio de la libre designación. La reasignación de efectivos exige un Plan de Empleo. La redistribución lleva a puestos del mismo nivel, no a uno inferior."
  citation: "art. 50.1 RD 364/1995"
  difficulty: 2
  tags:
  - "concepto"
  - "efecto"
# anchor: boe-a-1995-8729-art-50
- id: m04-l05-q025
  prompt:
    es: "Según el artículo 50.1 del Real Decreto 364/1995, de 10 de marzo, en los supuestos de incumplimiento que cita su párrafo segundo, la propuesta de remoción solo podrá formularse:"
  options:
  - id: a
    correct: true
    text:
      es: "cuando quede establecida la ausencia de responsabilidad disciplinaria y la causa sea imputable al funcionario."
  - id: b
    text:
      es: "cuando quede acreditada la responsabilidad disciplinaria del funcionario por esos mismos hechos, mediante expediente."
  - id: c
    text:
      es: "cuando la causa del incumplimiento sea imputable a la unidad en que presta servicio el funcionario."
  - id: d
    text:
      es: "cuando el funcionario no haya presentado alegaciones dentro del plazo que se le haya concedido."
  explanation:
    es: "El párrafo segundo del artículo 50.1 RD 364/1995 dice que no se podrá formular propuesta de remoción «en tanto no quede establecida la ausencia de responsabilidad disciplinaria del funcionario y sólo cuando la causa del incumplimiento sea imputable al mismo». Lo que se exige es descartar la responsabilidad disciplinaria, no acreditarla. La causa ha de ser imputable al funcionario, no a su unidad. El artículo no condiciona la propuesta a que el funcionario no haya alegado."
  citation: "art. 50.1 RD 364/1995"
  difficulty: 3
  tags:
  - "requisito"
  - "excepción"
# anchor: boe-a-1995-8729-art-50
- id: m04-l05-q026
  prompt:
    es: "Señale la respuesta correcta sobre los funcionarios que acceden a un puesto por concurso, según el Real Decreto 364/1995, de 10 de marzo:"
  options:
  - id: a
    text:
      es: "Pueden ser cesados del puesto con carácter discrecional por el órgano que los nombró."
  - id: b
    text:
      es: "Ocupan el puesto con carácter provisional durante el primer año desde la toma de posesión."
  - id: c
    text:
      es: "No pueden ser removidos del puesto hasta que hayan pasado dos años desde la toma de posesión."
  - id: d
    correct: true
    text:
      es: "Pueden ser removidos del puesto por causas sobrevenidas que el Reglamento enumera."
  explanation:
    es: "El artículo 50.1 RD 364/1995 dice que los funcionarios que acceden a un puesto por concurso «podrán ser removidos por causas sobrevenidas», y las enumera: alteración del contenido del puesto o falta de capacidad. El cese discrecional es el de la libre designación, no el del concurso. El artículo no da al puesto un primer año provisional ni fija un plazo de dos años antes de poder remover."
  citation: "art. 50.1 RD 364/1995"
  difficulty: 1
  tags:
  - "concepto"
