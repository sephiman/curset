# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q201
  prompt:
    es: "¿Cuál de las siguientes definiciones corresponde a una cookie, según el glosario de términos de ciberseguridad de INCIBE?"
  options:
  - id: a
    text:
      es: "Un número único que identifica a todo sistema conectado a una red"
  - id: b
    text:
      es: "Un servicio que asocia cada nombre de dominio con información sobre él"
  - id: c
    text:
      es: "Un programa que monitoriza la información que circula por la red"
  - id: d
    correct: true
    text:
      es: "Un pequeño fichero que un sitio web guarda en el equipo del usuario"
  explanation:
    es: "Una cookie es un pequeño fichero que almacena información enviada por un sitio web y que se guarda en el equipo del usuario, de modo que el sitio puede consultar su actividad previa. El número único que identifica a todo sistema conectado a una red es la dirección IP. El programa que monitoriza la información que circula por la red es un sniffer. El servicio que asocia cada nombre de dominio con información sobre él es el DNS."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.3.29. Cookie»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q202
  prompt:
    es: "Según el glosario de INCIBE, ¿dónde se almacena una cookie, que es información enviada por un sitio web?"
  options:
  - id: a
    correct: true
    text:
      es: "En el equipo del usuario, para que el sitio web consulte su actividad"
  - id: b
    text:
      es: "En el servidor DNS, junto con la información del nombre de dominio"
  - id: c
    text:
      es: "En el servidor del sitio web, que la envía de nuevo al navegador cuando se pide"
  - id: d
    text:
      es: "En el router de la red local, que la comparte con todos los equipos"
  explanation:
    es: "La cookie se almacena en el equipo del usuario, de manera que el sitio web puede consultar la actividad previa del usuario. La cookie no se guarda en el servidor del sitio web: se almacena en el equipo del usuario. El servidor DNS asocia nombres de dominio con información; no guarda las cookies. El glosario sitúa la cookie en el equipo del usuario, no en el router de la red local."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.3.29. Cookie»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q203
  prompt:
    es: "Señale la ventaja que ofrece al usuario una cookie cuando introduce su nombre de usuario y contraseña, según el glosario de INCIBE:"
  options:
  - id: a
    text:
      es: "Distinguir si quien entra en la página es un humano o un bot"
  - id: b
    text:
      es: "Cifrar la información que viaja entre su navegador y el servidor"
  - id: c
    text:
      es: "Traducir el nombre de la página en una dirección IP"
  - id: d
    correct: true
    text:
      es: "No tener que introducirlos para cada página del servidor"
  explanation:
    es: "Entre las funciones de la cookie está llevar el control de usuarios: al introducir el usuario y la contraseña se almacena una cookie para no tener que introducirlos en cada página del servidor. Cifrar la información entre navegador y servidor es lo que hace HTTPS. Distinguir a un humano de un bot es la función del CAPTCHA. Traducir nombres en direcciones IP es la función del DNS."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.3.29. Cookie»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q204
  prompt:
    es: "Según el glosario de INCIBE, ¿qué puede significar un ataque contra la privacidad de los usuarios relacionado con las cookies?"
  options:
  - id: a
    text:
      es: "Que lleven el control de usuarios para no repetir la contraseña"
  - id: b
    text:
      es: "Que se almacenen en el equipo del usuario en lugar de en el servidor"
  - id: c
    text:
      es: "Que cifren el tráfico entre el navegador y el servidor del sitio"
  - id: d
    correct: true
    text:
      es: "Que recaben información sobre los hábitos de navegación del usuario"
  explanation:
    es: "Una de las funciones de las cookies es recabar información sobre los hábitos de navegación del usuario, lo que puede ser un ataque contra la privacidad, por lo que hay que tener cuidado con ellas. Llevar el control de usuarios es la función que evita repetir el usuario y la contraseña, no la que puede atacar la privacidad. Almacenarse en el equipo del usuario es su forma de funcionar; el riesgo para la privacidad viene de recabar los hábitos de navegación. Cifrar el tráfico entre navegador y servidor es lo que hace HTTPS, no las cookies."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.3.29. Cookie»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-aepd-guia-cookies-pdf
- id: m06-l08-q205
  prompt:
    es: "¿Cuál de las siguientes cosas ocurre con las cookies de sesión al terminar la sesión, según la guía sobre el uso de las cookies de la AEPD?"
  options:
  - id: a
    text:
      es: "Siguen en el equipo durante un periodo de minutos a años"
  - id: b
    correct: true
    text:
      es: "Desaparecen del equipo del usuario"
  - id: c
    text:
      es: "Pasan a ser cookies persistentes en el equipo del usuario"
  - id: d
    text:
      es: "Se envían a un tercero para analizar los hábitos de navegación"
  explanation:
    es: "Las cookies de sesión recaban y almacenan datos mientras el usuario accede a una página web y desaparecen al terminar la sesión. Seguir en el equipo durante un periodo que va de minutos a años es lo que define a las cookies persistentes. La guía no dice que una cookie de sesión se convierta en persistente: son dos tipos según su plazo. La guía define las cookies de sesión por su plazo, y no por enviarlas a un tercero."
  citation: "fuente: `aepd-guia-cookies.pdf`; «2.1.3. Tipos de cookies según el plazo de tiempo que permanecen activadas»"
  difficulty: 1
  tags:
  - "concepto"
  - "comportamiento"
# anchor: fuente-aepd-guia-cookies-pdf
- id: m06-l08-q206
  prompt:
    es: "Según la guía sobre el uso de las cookies de la AEPD, ¿durante cuánto tiempo siguen almacenados en el equipo los datos de las cookies persistentes?"
  options:
  - id: a
    correct: true
    text:
      es: "Durante un periodo definido por el responsable, de minutos a varios años"
  - id: b
    text:
      es: "Hasta que termina la sesión del usuario en la página web"
  - id: c
    text:
      es: "Durante un periodo definido por el usuario, de unos segundos a unos días"
  - id: d
    text:
      es: "Durante un periodo fijo de treinta días fijado por el navegador"
  explanation:
    es: "En las cookies persistentes los datos siguen almacenados en el equipo durante un periodo definido por el responsable de la cookie, que va de unos minutos a varios años. Desaparecer al terminar la sesión es lo que ocurre con las cookies de sesión. El periodo no es fijo ni lo fija el navegador: lo define el responsable de la cookie. El periodo lo define el responsable de la cookie, no el usuario, y llega a varios años."
  citation: "fuente: `aepd-guia-cookies.pdf`; «2.1.3. Tipos de cookies según el plazo de tiempo que permanecen activadas»"
  difficulty: 2
  tags:
  - "concepto"
  - "cantidad"
# anchor: fuente-aepd-guia-cookies-pdf
- id: m06-l08-q207
  prompt:
    es: "¿Cuál de los siguientes usos suelen tener las cookies de sesión, según la guía sobre el uso de las cookies de la AEPD?"
  options:
  - id: a
    text:
      es: "Para almacenar información que se comparte con todos los sitios web visitados"
  - id: b
    correct: true
    text:
      es: "Para almacenar información que solo interesa conservar para prestar el servicio solicitado en una sola ocasión"
  - id: c
    text:
      es: "Para almacenar información que solo interesa a un tercero y no al usuario"
  - id: d
    text:
      es: "Para almacenar información que interesa conservar en futuras visitas durante años"
  explanation:
    es: "Las cookies de sesión se suelen emplear para guardar información que solo interesa conservar para prestar el servicio solicitado en una sola ocasión, como una lista de productos adquiridos. Conservar información en futuras visitas durante años es el caso de las cookies persistentes. La guía las vincula al servicio solicitado por el usuario en una sola ocasión, no a lo que interese a un tercero. La guía no habla de compartir la información con todos los sitios web visitados."
  citation: "fuente: `aepd-guia-cookies.pdf`; «2.1.3. Tipos de cookies según el plazo de tiempo que permanecen activadas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-aepd-guia-cookies-pdf
- id: m06-l08-q208
  prompt:
    es: "¿Qué recomienda la guía sobre el uso de las cookies de la AEPD cuando se instalen cookies persistentes?"
  options:
  - id: a
    correct: true
    text:
      es: "Reducir al mínimo necesario su duración, atendiendo a la finalidad de su uso"
  - id: b
    text:
      es: "Sustituirlas siempre por cookies de terceros, sin límite de duración"
  - id: c
    text:
      es: "Fijar una duración indefinida para no tener que volver a pedir permiso"
  - id: d
    text:
      es: "Mantenerlas el mayor tiempo posible, con independencia de su finalidad"
  explanation:
    es: "Cuando se instalen cookies persistentes, la guía recomienda reducir al mínimo necesario su duración temporal atendiendo a la finalidad de su uso. Mantenerlas el mayor tiempo posible contradice la recomendación de reducir su duración. Una duración indefinida contradice la recomendación de reducirla al mínimo necesario. La guía recomienda reducir la duración, no sustituir las persistentes por cookies de terceros."
  citation: "fuente: `aepd-guia-cookies.pdf`; «2.1.3. Tipos de cookies según el plazo de tiempo que permanecen activadas»"
  difficulty: 2
  tags:
  - "concepto"
# anchor: fuente-aepd-guia-cookies-pdf
- id: m06-l08-q209
  prompt:
    es: "¿Cuál de las siguientes medidas puede reducir los riesgos para la privacidad de los usuarios, según la guía sobre el uso de las cookies de la AEPD?"
  options:
  - id: a
    correct: true
    text:
      es: "Utilizar cookies de sesión en lugar de cookies persistentes"
  - id: b
    text:
      es: "Utilizar cookies persistentes en lugar de cookies de sesión"
  - id: c
    text:
      es: "Utilizar cookies de publicidad comportamental en lugar de cookies técnicas"
  - id: d
    text:
      es: "Utilizar cookies de sesión y persistentes con la misma duración"
  explanation:
    es: "Los riesgos para la privacidad podrían reducirse mediante la utilización de cookies de sesión, en lugar de cookies persistentes. Las cookies persistentes son las que, según la guía, deben valorarse por los riesgos que implican. Las cookies de publicidad comportamental crean un perfil de los hábitos de navegación, lo que no reduce los riesgos. La guía recomienda las de sesión y reducir al mínimo la duración de las persistentes, no igualarlas."
  citation: "fuente: `aepd-guia-cookies.pdf`; «2.1.3. Tipos de cookies según el plazo de tiempo que permanecen activadas»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-aepd-guia-cookies-pdf
- id: m06-l08-q210
  prompt:
    es: "Según la guía sobre el uso de las cookies de la AEPD, ¿qué cookies es más probable que se consideren exceptuadas del deber de consentimiento informado?"
  options:
  - id: a
    text:
      es: "Las cookies persistentes y las de sesión por igual"
  - id: b
    text:
      es: "Las cookies de publicidad comportamental, antes que las de sesión"
  - id: c
    text:
      es: "Las cookies persistentes, antes que las de sesión"
  - id: d
    correct: true
    text:
      es: "Las cookies de sesión, antes que las persistentes"
  explanation:
    es: "Es mucho más probable que se consideren exceptuadas las cookies de sesión que las persistentes, porque su caducidad debe estar relacionada con su finalidad. Decir que las persistentes se consideran antes exceptuadas invierte lo que dice la guía. Los fines publicitarios comportamentales son un ejemplo de finalidad no exenta, según la guía. La guía no las iguala: es mucho más probable la excepción para las de sesión."
  citation: "fuente: `aepd-guia-cookies.pdf`; «2.1.3. Tipos de cookies según el plazo de tiempo que permanecen activadas»"
  difficulty: 3
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q211
  prompt:
    es: "¿Cuál de las siguientes definiciones corresponde al session hijacking, según el glosario de términos de ciberseguridad de INCIBE?"
  options:
  - id: a
    text:
      es: "Una medida de seguridad que añade una capa al DNS para comprobar la integridad de los datos"
  - id: b
    correct: true
    text:
      es: "Un ataque que intercepta la sesión de un usuario para acceder a su información o servicios sin autorización"
  - id: c
    text:
      es: "Una técnica que suplanta a una entidad con un correo para conseguir credenciales o datos de tarjeta"
  - id: d
    text:
      es: "Un ataque que envía un gran número de paquetes ICMP de gran tamaño para sobrecargar la red"
  explanation:
    es: "El session hijacking es un ataque basado en interceptar la sesión de un usuario en Internet para acceder a su información o servicios sin autorización. Enviar paquetes ICMP de gran tamaño para sobrecargar la red es la inundación ICMP. Suplantar a una entidad por correo para obtener credenciales es el phishing. Añadir una capa de seguridad al DNS para comprobar la integridad es lo que hace DNSSEC."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.18.9. Session Hijacking»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q212
  prompt:
    es: "¿Con qué otro nombre se conoce el session hijacking, según el glosario de términos de ciberseguridad de INCIBE?"
  options:
  - id: a
    text:
      es: "Inundación de cookies"
  - id: b
    text:
      es: "Suplantación de identidad"
  - id: c
    correct: true
    text:
      es: "Secuestro de cookies"
  - id: d
    text:
      es: "Envenenamiento del DNS"
  explanation:
    es: "El glosario llama también al session hijacking secuestro de cookies. La suplantación de identidad es otra entrada: la actividad de un atacante que se hace pasar por otra persona. El envenenamiento del DNS es otra entrada del glosario, sin relación con las cookies de sesión. La inundación de cookies no es el nombre que da el glosario: es secuestro de cookies."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.18.9. Session Hijacking»"
  difficulty: 1
  tags:
  - "concepto"
# anchor: fuente-incibe-glosario-ciberseguridad-pdf
- id: m06-l08-q213
  prompt:
    es: "Señale en qué tipo de sesiones se suele dar el session hijacking, según el glosario de términos de ciberseguridad de INCIBE:"
  options:
  - id: a
    correct: true
    text:
      es: "En las sesiones no cifradas, como las HTTP"
  - id: b
    text:
      es: "En las sesiones autenticadas con un certificado X.509"
  - id: c
    text:
      es: "En las sesiones cifradas, como las HTTPS"
  - id: d
    text:
      es: "En las sesiones que no usan cookies de ningún tipo"
  explanation:
    es: "El session hijacking se suele dar en sesiones no cifradas como las HTTP. HTTPS cifra el tráfico; la página sitúa el ataque en sesiones no cifradas. La autenticación con certificado X.509 es un mecanismo de SSL, y no es lo que el glosario señala como terreno de este ataque. El ataque busca robar cookies de sesión, por lo que supone sesiones que usan cookies."
  citation: "fuente: `incibe-glosario-ciberseguridad.pdf`; «2.18.9. Session Hijacking»"
  difficulty: 2
  tags:
  - "concepto"
