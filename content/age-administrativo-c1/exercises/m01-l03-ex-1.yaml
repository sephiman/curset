# anchor: boe-a-1978-31229-art-66
- id: m01-l03-q001
  prompt:
    es: "De acuerdo con el artículo 66 de la Constitución Española de 1978, las Cortes Generales ejercen la potestad legislativa del Estado, controlan la acción del Gobierno y, además:"
  options:
  - id: a
    text:
      es: "Elaboran los Presupuestos Generales del Estado."
  - id: b
    correct: true
    text:
      es: "Aprueban los Presupuestos del Estado."
  - id: c
    text:
      es: "Dirigen la Administración civil y militar."
  - id: d
    text:
      es: "Ejercen la potestad reglamentaria del Estado."
  explanation:
    es: "El artículo 66.2 dice que las Cortes Generales «aprueban sus Presupuestos», los del Estado. Elaborar los Presupuestos no es función de las Cortes: el precepto solo les da su aprobación. Dirigir la Administración civil y militar y ejercer la potestad reglamentaria no figuran entre las funciones que enumera el artículo 66.2."
  citation: "art. 66.2 CE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: boe-a-1978-31229-art-67
- id: m01-l03-q002
  prompt:
    es: "De acuerdo con el artículo 67 de la Constitución Española de 1978, el acta de una Asamblea de Comunidad Autónoma no puede acumularse con:"
  options:
  - id: a
    correct: true
    text:
      es: "La de Diputado al Congreso."
  - id: b
    text:
      es: "La de Senador elegido en la provincia."
  - id: c
    text:
      es: "La de Senador designado por la Comunidad Autónoma."
  - id: d
    text:
      es: "La de miembro de cualquiera de las dos Cámaras."
  explanation:
    es: "El artículo 67.1 prohíbe «acumular el acta de una Asamblea de Comunidad Autónoma con la de Diputado al Congreso». La prohibición se refiere solo al Congreso. El precepto no la extiende al Senado, ni a los Senadores elegidos ni a los designados por la Comunidad Autónoma. Por la misma razón no alcanza a cualquiera de las dos Cámaras."
  citation: "art. 67.1 CE"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-67
- id: m01-l03-q003
  prompt:
    es: "¿Cuál de las siguientes afirmaciones sobre los miembros de las Cortes Generales recoge la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Nadie podrá ser miembro de las dos Cámaras simultáneamente."
  - id: b
    text:
      es: "Los Senadores designados por las Comunidades Autónomas podrán ser también Diputados."
  - id: c
    text:
      es: "Los Diputados podrán ser Senadores si renuncian a su asignación."
  - id: d
    text:
      es: "Nadie podrá ser miembro de las dos Cámaras durante más de dos legislaturas."
  explanation:
    es: "El artículo 67.1 dice: «Nadie podrá ser miembro de las dos Cámaras simultáneamente». La regla no tiene excepciones, así que no cabe ser a la vez Senador designado y Diputado, ni salvarla renunciando a la asignación. El límite de dos legislaturas no está en el precepto: lo que prohíbe es la pertenencia simultánea."
  citation: "art. 67.1 CE"
  difficulty: 1
  tags:
  - "requisito"
# anchor: boe-a-1978-31229-art-67
- id: m01-l03-q004
  prompt:
    es: "De acuerdo con el artículo 67 de la Constitución Española de 1978, los miembros de las Cortes Generales:"
  options:
  - id: a
    correct: true
    text:
      es: "No estarán ligados por mandato imperativo."
  - id: b
    text:
      es: "Estarán ligados por el mandato imperativo de sus electores."
  - id: c
    text:
      es: "Estarán ligados por las instrucciones de su Grupo Parlamentario."
  - id: d
    text:
      es: "No estarán ligados por mandato imperativo, salvo en las votaciones de investidura."
  explanation:
    es: "El artículo 67.2 dice que los miembros de las Cortes Generales «no estarán ligados por mandato imperativo». No lo están ni respecto de sus electores ni respecto de su Grupo Parlamentario. El precepto no prevé ninguna excepción, tampoco en la investidura."
  citation: "art. 67.2 CE"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1978-31229-art-68
- id: m01-l03-q005
  prompt:
    es: "Según el artículo 68 de la Constitución Española de 1978, ¿cuál es el número máximo de Diputados que puede componer el Congreso?"
  options:
  - id: a
    text:
      es: "Un máximo de 350 Diputados."
  - id: b
    text:
      es: "Un máximo de 300 Diputados."
  - id: c
    text:
      es: "Un máximo de 450 Diputados."
  - id: d
    correct: true
    text:
      es: "Un máximo de 400 Diputados."
  explanation:
    es: "El artículo 68.1 fija «un mínimo de 300 y un máximo de 400 Diputados». La cifra de 300 es el mínimo, no el máximo. Las de 350 y 450 no aparecen en el precepto."
  citation: "art. 68.1 CE"
  difficulty: 1
  tags:
  - "cantidad"
  - "composición"
# anchor: boe-a-1978-31229-art-68
- id: m01-l03-q006
  prompt:
    es: "Conforme al artículo 68 de la Constitución Española de 1978, en la elección del Congreso de los Diputados la circunscripción electoral es:"
  options:
  - id: a
    text:
      es: "La Comunidad Autónoma, y Ceuta y Melilla están representadas cada una por un Diputado."
  - id: b
    text:
      es: "La provincia, y Ceuta y Melilla están representadas cada una por dos Diputados."
  - id: c
    text:
      es: "La isla en las provincias insulares y la provincia en el resto del territorio."
  - id: d
    correct: true
    text:
      es: "La provincia, y Ceuta y Melilla están representadas cada una por un Diputado."
  explanation:
    es: "El artículo 68.2 dice: «La circunscripción electoral es la provincia. Las poblaciones de Ceuta y Melilla estarán representadas cada una de ellas por un Diputado». La circunscripción no es la Comunidad Autónoma. Ceuta y Melilla tienen un Diputado cada una, no dos. La isla como circunscripción es la regla del Senado en las provincias insulares (art. 69.3), no la del Congreso."
  citation: "art. 68.2 CE"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1978-31229-art-68
- id: m01-l03-q007
  prompt:
    es: "¿Cuándo deben celebrarse las elecciones al Congreso de los Diputados una vez terminado el mandato, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Entre los treinta días y sesenta días desde la terminación del mandato."
  - id: b
    text:
      es: "Entre los quince días y treinta días desde la terminación del mandato."
  - id: c
    text:
      es: "Entre los treinta días y noventa días desde la terminación del mandato."
  - id: d
    text:
      es: "Dentro de los veinticinco días siguientes a la terminación del mandato."
  explanation:
    es: "El artículo 68.6 dice que «las elecciones tendrán lugar entre los treinta días y sesenta días desde la terminación del mandato». Los plazos de quince a treinta días y de treinta a noventa días no están en el precepto. Los veinticinco días son el plazo para convocar el Congreso electo, y se cuentan desde la celebración de las elecciones."
  citation: "art. 68.6 CE"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-68
- id: m01-l03-q008
  prompt:
    es: "Según la Constitución Española de 1978, ¿en qué plazo deberá ser convocado el Congreso electo tras unas elecciones generales?"
  options:
  - id: a
    text:
      es: "Dentro de los treinta días siguientes a la celebración de las elecciones."
  - id: b
    text:
      es: "Dentro de los veinticinco días siguientes a la proclamación de los electos."
  - id: c
    text:
      es: "Entre los treinta días y sesenta días desde la celebración de las elecciones."
  - id: d
    correct: true
    text:
      es: "Dentro de los veinticinco días siguientes a la celebración de las elecciones."
  explanation:
    es: "El artículo 68.6 dice que «el Congreso electo deberá ser convocado dentro de los veinticinco días siguientes a la celebración de las elecciones». El plazo no es de treinta días. Se cuenta desde la celebración de las elecciones, no desde la proclamación de los electos. Los treinta a sesenta días son el plazo para celebrar las elecciones desde la terminación del mandato."
  citation: "art. 68.6 CE"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-69
- id: m01-l03-q010
  prompt:
    es: "¿Cuántos Senadores se eligen en cada provincia por sufragio universal, libre, igual, directo y secreto, según la Constitución Española de 1978?"
  options:
  - id: a
    text:
      es: "Tres Senadores en cada provincia."
  - id: b
    text:
      es: "Dos Senadores en cada provincia."
  - id: c
    correct: true
    text:
      es: "Cuatro Senadores en cada provincia."
  - id: d
    text:
      es: "Cinco Senadores en cada provincia."
  explanation:
    es: "El artículo 69.2 dice: «En cada provincia se elegirán cuatro Senadores». Tres Senadores corresponden a cada una de las islas mayores (art. 69.3). Dos son los de Ceuta y de Melilla (art. 69.4). La cifra de cinco no aparece."
  citation: "art. 69.2 CE"
  difficulty: 1
  tags:
  - "cantidad"
  - "composición"
# anchor: boe-a-1978-31229-art-69
- id: m01-l03-q011
  prompt:
    es: "De acuerdo con el artículo 69 de la Constitución Española de 1978, en las provincias insulares corresponden tres Senadores a cada una de las siguientes islas:"
  options:
  - id: a
    text:
      es: "Gran Canaria, Mallorca e Ibiza."
  - id: b
    text:
      es: "Tenerife, Mallorca y La Palma."
  - id: c
    correct: true
    text:
      es: "Gran Canaria, Mallorca y Tenerife."
  - id: d
    text:
      es: "Gran Canaria, Tenerife y Menorca."
  explanation:
    es: "El artículo 69.3 da tres Senadores a cada una de «las islas mayores −Gran Canaria, Mallorca y Tenerife−». Ibiza, La Palma y Menorca están en la lista de islas que eligen un Senador cada una."
  citation: "art. 69.3 CE"
  difficulty: 2
  tags:
  - "cantidad"
  - "composición"
# anchor: boe-a-1978-31229-art-69
- id: m01-l03-q012
  prompt:
    es: "¿Cuántos Senadores corresponden a la isla de Formentera según la Constitución Española de 1978, tras la reforma constitucional de 19 de mayo de 2026?"
  options:
  - id: a
    text:
      es: "Un Senador compartido con la isla de Ibiza."
  - id: b
    text:
      es: "Tres Senadores, como las islas mayores."
  - id: c
    correct: true
    text:
      es: "Un Senador, en circunscripción propia."
  - id: d
    text:
      es: "Dos Senadores, como Ceuta y Melilla."
  explanation:
    es: "Tras la reforma de 19 de mayo de 2026, el artículo 69.3 incluye a Formentera entre las islas que eligen «uno» y la hace circunscripción propia: cada isla con Cabildo o Consejo Insular constituye una circunscripción. La disposición transitoria única de la reforma solo pospone la eficacia de las circunscripciones de Ibiza y Formentera hasta la convocatoria de las primeras elecciones al Senado tras su entrada en vigor. El Senador compartido con Ibiza es la regla anterior a la reforma. Tres Senadores son los de las islas mayores, y dos los de Ceuta y de Melilla (art. 69.4)."
  citation: "art. 69.3 CE"
  difficulty: 3
  tags:
  - "cantidad"
  - "composición"
# anchor: boe-a-1978-31229-art-69
- id: m01-l03-q013
  prompt:
    es: "Según el artículo 69 de la Constitución Española de 1978, ¿cuál de las siguientes circunscripciones elige dos Senadores?"
  options:
  - id: a
    text:
      es: "Cada una de las islas de Ibiza y Menorca."
  - id: b
    text:
      es: "Cada una de las islas mayores."
  - id: c
    correct: true
    text:
      es: "Cada una de las ciudades de Ceuta y Melilla."
  - id: d
    text:
      es: "Cada una de las provincias no insulares."
  explanation:
    es: "El artículo 69.4 dice: «Las poblaciones de Ceuta y Melilla elegirán cada una de ellas dos Senadores». Ibiza y Menorca eligen uno cada una y las islas mayores tres (art. 69.3). Cada provincia elige cuatro (art. 69.2)."
  citation: "art. 69.4 CE"
  difficulty: 1
  tags:
  - "cantidad"
  - "composición"
# anchor: boe-a-1978-31229-art-69
- id: m01-l03-q014
  prompt:
    es: "Según la Constitución Española de 1978, señale la respuesta correcta sobre los Senadores que designan las Comunidades Autónomas:"
  options:
  - id: a
    correct: true
    text:
      es: "Designan un Senador y otro más por cada millón de habitantes de su respectivo territorio."
  - id: b
    text:
      es: "Designan un Senador y otro más por cada quinientos mil habitantes de su respectivo territorio."
  - id: c
    text:
      es: "Designan dos Senadores cada una, con independencia de la población de su territorio."
  - id: d
    text:
      es: "Designan un Senador y otro más por cada provincia de su respectivo territorio."
  explanation:
    es: "El artículo 69.5 dice que las Comunidades Autónomas «designarán además un Senador y otro más por cada millón de habitantes de su respectivo territorio». El tramo no es de quinientos mil habitantes ni depende del número de provincias. Tampoco es una cifra fija: crece con la población."
  citation: "art. 69.5 CE"
  difficulty: 2
  tags:
  - "cantidad"
  - "composición"
