# anchor: boe-a-1996-2627-regla-19
- id: m05-l03-q053
  prompt:
    es: "Al inicio de un expediente de gasto plurianual, ¿qué documento expide el Servicio Gestor con el importe de cada ejercicio afectado, según la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado?"
  options:
  - id: a
    text:
      es: "Un documento A de ejercicios posteriores."
  - id: b
    correct: true
    text:
      es: "Un documento RC de ejercicios posteriores."
  - id: c
    text:
      es: "Un documento D de ejercicios posteriores."
  - id: d
    text:
      es: "Un documento OK de ejercicios posteriores."
  explanation:
    es: "La regla 19.1 manda expedir al inicio un documento RC de ejercicios posteriores con el importe de cada ejercicio afectado. El A se formula una vez aprobado el expediente. El D, al comprometer. El OK reconoce la obligación y no existe en versión de ejercicios posteriores."
  citation: "regla 19.1 IOC"
  difficulty: 1
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-19
- id: m05-l03-q054
  prompt:
    es: "Registrado el documento RC de ejercicios posteriores de un gasto plurianual, ¿qué se minora según la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "Los límites existentes en las aplicaciones presupuestarias afectadas."
  - id: b
    text:
      es: "Los créditos iniciales de las aplicaciones afectadas del ejercicio corriente."
  - id: c
    text:
      es: "Los remanentes de crédito del ejercicio anterior en esas aplicaciones."
  - id: d
    text:
      es: "Las dotaciones de la sección presupuestaria del departamento."
  explanation:
    es: "La regla 19.1 dice que, registrado el RC de ejercicios posteriores, se minoran los límites existentes en las aplicaciones afectadas y las cuantías quedan reservadas para el expediente. No se minoran los créditos iniciales del ejercicio corriente, ni los remanentes del anterior, ni las dotaciones de la sección."
  citation: "regla 19.1 IOC"
  difficulty: 2
  tags:
  - "efecto"
# anchor: boe-a-1996-2627-regla-42
- id: m05-l03-q056
  prompt:
    es: "En la tramitación anticipada de expedientes de contratación, ¿qué detalla el documento RC de «tramitación anticipada», según la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado?"
  options:
  - id: a
    correct: true
    text:
      es: "El importe del gasto de cada uno de los ejercicios posteriores afectados."
  - id: b
    text:
      es: "El importe total del contrato, sin distribuirlo entre los distintos ejercicios afectados."
  - id: c
    text:
      es: "El importe del gasto imputable al ejercicio corriente y al primer ejercicio posterior."
  - id: d
    text:
      es: "El importe de la primera anualidad posterior, sin las anualidades de los ejercicios siguientes."
  explanation:
    es: "La regla 42.2.b) dice que el RC de «tramitación anticipada» detalla el importe del gasto que corresponde a cada uno de los ejercicios posteriores afectados. No recoge el total sin distribuir, ni el ejercicio corriente, ni solo la primera anualidad."
  citation: "regla 42.2.b) IOC"
  difficulty: 1
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-42
- id: m05-l03-q057
  prompt:
    es: "Si el expediente de contratación se tramita anticipadamente, ¿qué documento sustituye al RC de ejercicios posteriores de un expediente plurianual ordinario, según la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado?"
  options:
  - id: a
    text:
      es: "Un RC de ejercicio corriente, sin importes de ejercicios posteriores."
  - id: b
    text:
      es: "Un documento AD de «tramitación anticipada» con el importe del ejercicio corriente."
  - id: c
    text:
      es: "Un documento A de ejercicios posteriores con la distribución por anualidades."
  - id: d
    correct: true
    text:
      es: "Un RC de «tramitación anticipada», también con el importe de cada ejercicio posterior."
  explanation:
    es: "En la tramitación anticipada el documento de inicio es el RC de «tramitación anticipada», con el importe de cada ejercicio posterior. El RC de ejercicio corriente no recoge esos importes. El AD acumula autorización y compromiso, que son fases posteriores. El A de ejercicios posteriores se formula tras aprobar el expediente de gasto."
  citation: "regla 42.2.b) IOC"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-42
- id: m05-l03-q058
  prompt:
    es: "¿A qué expedientes se aplica el documento RC de «tramitación anticipada» de la regla 42.2.b) de la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado?"
  options:
  - id: a
    text:
      es: "A los expedientes de modificación de créditos."
  - id: b
    text:
      es: "A los expedientes de transferencia de crédito."
  - id: c
    correct: true
    text:
      es: "A los expedientes de contratación."
  - id: d
    text:
      es: "A los expedientes de prórroga del presupuesto."
  explanation:
    es: "La regla 42.2.b) regula el RC de «tramitación anticipada» dentro de la tramitación anticipada de expedientes de contratación. Las modificaciones de crédito, las transferencias y la prórroga del presupuesto se documentan con otros documentos y no se tramitan de esa forma."
  citation: "regla 42.2.b) IOC"
  difficulty: 1
  tags:
  - "concepto"
# anchor: boe-a-1996-2749-apartado-sexto
- id: m05-l03-q059
  prompt:
    es: "¿En qué operaciones se utiliza el documento MC, según la Orden de 1 de febrero de 1996 por la que se aprueban los documentos contables a utilizar por la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "En las operaciones de retención de crédito para gastar en expedientes de gasto."
  - id: b
    text:
      es: "En las operaciones de autorización del gasto imputables al Presupuesto corriente."
  - id: c
    correct: true
    text:
      es: "En las modificaciones presupuestarias que aumenten o disminuyan los créditos."
  - id: d
    text:
      es: "En las operaciones de reconocimiento de obligaciones del Presupuesto corriente."
  explanation:
    es: "El apartado sexto.1.a) dice que el documento MC se utiliza en las modificaciones presupuestarias que aumenten o disminuyan los créditos. La retención de crédito se documenta con el RC, la autorización con el A y el reconocimiento de obligaciones con el OK."
  citation: "apartado sexto.1 Orden de documentos contables"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-2003-21614-art-73
- id: m05-l03-q061
  prompt:
    es: "Un Subsecretario firma el contrato de suministro de mobiliario, ya aprobado el gasto, por 18.000 euros. Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué fase de la gestión del gasto se cumple con esa firma?"
  options:
  - id: a
    correct: true
    text:
      es: "La fase de compromiso de gasto."
  - id: b
    text:
      es: "La fase de aprobación del gasto."
  - id: c
    text:
      es: "La fase de reconocimiento de la obligación."
  - id: d
    text:
      es: "El pago material de la deuda."
  explanation:
    es: "La firma del contrato acuerda con un tercero la realización de un gasto previamente aprobado y vincula a la Hacienda Pública: es el compromiso. La aprobación ya se produjo. El reconocimiento de la obligación exige acreditar la prestación. El pago material cierra el procedimiento."
  citation: "art. 73.3 LGP"
  difficulty: 3
  tags:
  - "procedimiento"
  - "órgano"
# anchor: boe-a-2003-21614-art-74
- id: m05-l03-q062
  prompt:
    es: "¿Ante qué órgano interesan los Ministros la realización de los pagos correspondientes a las obligaciones que reconocen, según la Ley 47/2003, de 26 de noviembre, General Presupuestaria?"
  options:
  - id: a
    text:
      es: "Ante el Director General de Presupuestos."
  - id: b
    text:
      es: "Ante la Intervención General de la Administración del Estado."
  - id: c
    correct: true
    text:
      es: "Ante el Ordenador general de pagos del Estado."
  - id: d
    text:
      es: "Ante el Consejo de Ministros."
  explanation:
    es: "El artículo 74.1 dice que los Ministros interesan del Ordenador general de pagos del Estado la realización de los pagos. La Dirección General de Presupuestos gestiona los créditos y las modificaciones, no los pagos. La Intervención General controla. El Consejo de Ministros no interviene en cada pago."
  citation: "art. 74.1 LGP"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-2003-21614-art-74
- id: m05-l03-q063
  prompt:
    es: "El Ministro ha fijado un límite de 500.000 euros por debajo del cual no aprueba gastos. Un gasto de su departamento es de 300.000 euros. Según la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿a quién corresponde aprobarlo?"
  options:
  - id: a
    text:
      es: "Al Director General del Tesoro y Política Financiera."
  - id: b
    correct: true
    text:
      es: "Al Secretario de Estado o al Subsecretario del departamento."
  - id: c
    text:
      es: "Al Consejo de Ministros, por razón de la cuantía."
  - id: d
    text:
      es: "Al Ordenador general de pagos del Estado."
  explanation:
    es: "Por debajo del límite que fija el Ministro, la competencia para aprobar y comprometer pasa a los Secretarios de Estado y al Subsecretario del departamento. El Director General del Tesoro es el Ordenador general de pagos. El Consejo de Ministros solo interviene en los casos que la Ley le reserva. El Ordenador general de pagos no aprueba gastos."
  citation: "art. 74.1 LGP"
  difficulty: 1
  tags:
  - "competencia"
  - "órgano"
# anchor: boe-a-1996-2749-apartado-sexto
- id: m05-l03-q064
  prompt:
    es: "¿Qué documento se utiliza en las operaciones de compromiso de gasto imputables a Presupuestos futuros, según la Orden de 1 de febrero de 1996 por la que se aprueban los documentos contables a utilizar por la Administración General del Estado?"
  options:
  - id: a
    text:
      es: "El documento A de ejercicios posteriores."
  - id: b
    text:
      es: "El documento AD de ejercicios posteriores."
  - id: c
    correct: true
    text:
      es: "El documento D de ejercicios posteriores."
  - id: d
    text:
      es: "El documento OK de ejercicios posteriores."
  explanation:
    es: "El apartado sexto.1.i) asigna el documento D de ejercicios posteriores al compromiso de gasto imputable a Presupuestos futuros. El A de ejercicios posteriores recoge la autorización. El AD combina autorización y compromiso. El OK documenta el reconocimiento de obligaciones."
  citation: "apartado sexto.1 Orden de documentos contables"
  difficulty: 3
  tags:
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-77
- id: m05-l03-q065
  prompt:
    es: "Según la Orden de 1 de febrero de 1996 por la que se aprueba la Instrucción de operatoria contable a seguir en la ejecución del gasto del Estado, ¿quién expide el documento D cuando se formaliza un contrato?"
  options:
  - id: a
    text:
      es: "La oficina de contabilidad que registra el contrato formalizado."
  - id: b
    text:
      es: "La Dirección General de Presupuestos, por el importe total del contrato."
  - id: c
    correct: true
    text:
      es: "El Servicio gestor competente, por el importe del Presupuesto corriente."
  - id: d
    text:
      es: "La Intervención Delegada, tras fiscalizar el contrato formalizado."
  explanation:
    es: "La regla 77.2 dice que, cuando se formalizan los contratos, el Servicio gestor competente expide el documento D por el importe que corresponda al Presupuesto corriente y, en su caso, un D de ejercicios posteriores. La oficina de contabilidad registra los documentos que recibe, pero no los expide. La Dirección General de Presupuestos expide los de modificación de créditos, no el compromiso de un contrato. La Intervención Delegada controla el gasto y no formula documentos contables de compromiso."
  citation: "regla 77.2 IOC"
  difficulty: 1
  tags:
  - "órgano"
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-14
- id: m05-l03-q067
  prompt:
    es: "De acuerdo con la regla 14.1 de la Instrucción de operatoria contable, una vez registrado el documento RC, de retención de créditos para gastar, el sistema emite un certificado de:"
  options:
  - id: a
    text:
      es: "suficiencia del límite de compromisos de ejercicios posteriores."
  - id: b
    text:
      es: "conformidad de la prestación recibida por el Servicio Gestor."
  - id: c
    text:
      es: "cumplimiento de las condiciones del acuerdo de concesión."
  - id: d
    correct: true
    text:
      es: "existencia de crédito disponible para el expediente de gasto."
  explanation:
    es: "La regla 14.1 dice que, registrado el RC, el crédito queda retenido y se obtiene del sistema un certificado de existencia de crédito, que se remite al Servicio Gestor para incorporarlo al expediente. El certificado de suficiencia del límite de compromisos pertenece al RC de ejercicios posteriores de la regla 19.1. La conformidad de la prestación y las condiciones de la concesión corresponden a fases posteriores del gasto, no a la retención."
  citation: "regla 14.1 IOC"
  difficulty: 2
  tags:
  - "concepto"
  - "procedimiento"
# anchor: boe-a-1996-2627-regla-86
- id: m05-l03-q069
  prompt:
    es: "Según la regla 86.3 de la Instrucción de operatoria contable, en las subvenciones no nominativas con convocatoria previa de carácter periódico, ¿quién expide el documento A una vez aprobado el expediente de gasto?"
  options:
  - id: a
    text:
      es: "La oficina de contabilidad que registra la convocatoria publicada."
  - id: b
    correct: true
    text:
      es: "El Servicio gestor, y en su caso un documento A de ejercicios posteriores."
  - id: c
    text:
      es: "La Dirección General de Presupuestos, antes de la convocatoria."
  - id: d
    text:
      es: "La Intervención Delegada, al fiscalizar el expediente de gasto."
  explanation:
    es: "La regla 86.3 dice que se expide por el Servicio gestor un documento A y, en su caso, un documento A de ejercicios posteriores. La oficina de contabilidad registra los documentos y no los formula. La Dirección General de Presupuestos autoriza los de modificación de créditos y no disponibilidad. La Intervención Delegada controla el gasto sin expedir el documento de autorización."
  citation: "regla 86.3 IOC"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
