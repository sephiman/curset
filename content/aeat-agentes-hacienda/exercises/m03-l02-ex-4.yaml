# anchor: boe-a-1994-12973-apartado-octavo
- id: m03-l02-q0065
  prompt:
    es: "¿Cuál de los siguientes órganos integra el Departamento de Recursos Humanos, según el apartado octavo de la Orden de 2 de junio de 1994 por la que se desarrolla la estructura de la Agencia Estatal de Administración Tributaria?"
  options:
  - id: a
    text:
      es: "La Dirección Adjunta de Informática Tributaria."
  - id: b
    text:
      es: "La Dirección Adjunta de Gestión Económica."
  - id: c
    text:
      es: "La Dirección Adjunta de Vigilancia Aduanera."
  - id: d
    correct: true
    text:
      es: "La Dirección Adjunta de Recursos Humanos."
  explanation:
    es: "El Departamento de Recursos Humanos está integrado por la Dirección Adjunta de Recursos Humanos y tres Subdirecciones Generales. La Dirección Adjunta de Vigilancia Aduanera pertenece al Departamento de Aduanas e Impuestos Especiales. Las de Informática Tributaria y de Gestión Económica no figuran en este apartado."
  citation: "apartado octavo Orden de 2 de junio de 1994"
  difficulty: 1
  tags:
  - "Recursos Humanos"
  - "Dirección Adjunta"
