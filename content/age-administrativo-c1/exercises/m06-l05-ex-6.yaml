  - "configuración"
# anchor: fuente-ms-excel-error-na-html
- id: m06-l05-q211
  prompt:
    es: "En Excel 365, ¿qué efecto tiene usar VERDADERO en el argumento ordenado de la función BUSCARV?"
  options:
  - id: a
    correct: true
    text:
      es: "Busca una coincidencia aproximada, con riesgo de #N/A o resultados erróneos"
  - id: b
    text:
      es: "Busca una coincidencia exacta aunque la tabla de búsqueda no esté ordenada"
  - id: c
    text:
      es: "Ordena la tabla de búsqueda antes de buscar el valor indicado en ella"
  - id: d
    text:
      es: "Devuelve siempre el valor de la primera fila de la tabla de búsqueda"
  explanation:
    es: "Con VERDADERO se indica a la función que busque una coincidencia aproximada, lo que puede causar un error #N/A y resultados erróneos. La coincidencia exacta, aunque la tabla no esté ordenada, se pide con FALSO."
  citation: "fuente: `ms-excel-error-na.html`; «Usar el método de coincidencia aproximada o el método de coincidencia exacta (VERDADERO/FALSO)»"
  difficulty: 3
  tags:
  - "comportamiento"
# anchor: fuente-ms-excel-error-na-html
- id: m06-l05-q213
  prompt:
    es: "En Excel 365, B2 contiene 10, B3 contiene #N/A escrito a mano y C1 contiene =SUMA(B2:B3). ¿Qué devuelve C1?"
  options:
  - id: a
    text:
      es: "10"
  - id: b
    correct: true
    text:
      es: "#N/A"
  - id: c
    text:
      es: "0"
  - id: d
    text:
      es: "#¡VALOR!"
  explanation:
    es: "Las fórmulas que hacen referencia a celdas con #N/A no pueden calcular ningún valor y devuelven el error #N/A. Por eso no dan 10, ni 0, ni #¡VALOR!."
  citation: "fuente: `ms-excel-error-na.html`; «Si ha escrito de forma manual #N/A»"
  difficulty: 3
  tags:
  - "resultado-fórmula"
# anchor: fuente-ms-excel-error-na-html
- id: m06-l05-q214
  prompt:
    es: "En Excel 365, ¿qué ocurre con las celdas que contienen #N/A al crear un gráfico con esos datos?"
  options:
  - id: a
    correct: true
    text:
      es: "Sus valores no se representan en el gráfico"
  - id: b
    text:
      es: "Se representan como valores de 0 en el gráfico"
  - id: c
    text:
      es: "Impiden que Excel cree el gráfico"
  - id: d
    text:
      es: "Se sustituyen automáticamente por el promedio de la serie"
  explanation:
    es: "La página dice que «los valores #N/A no se representarán en un gráfico». Por eso se usa #N/A en los datos de gráficos: los valores 0, en cambio, sí se representan, como una línea recta en la parte inferior del gráfico, que es lo que contradice la opción de «valores de 0». Que impidan crear el gráfico choca con que la página los recomiende justo para gráficos. Y sustituirse por el promedio de la serie no es lo que ocurre: la página los describe como no representados, no como reemplazados."
  citation: "fuente: `ms-excel-error-na.html`; «Uso de #N/A con gráficos»"
  difficulty: 2
  tags:
  - "comportamiento"
