# anchor: boe-a-1978-31229-art-66
- id: m01-l03-q001
  prompt:
    es: "Conforme al artículo 94.1 de la Constitución Española de 1978, la prestación del consentimiento del Estado requiere la previa autorización de las Cortes Generales en los tratados o convenios que:"
  options:
  - id: a
    text:
      es: "Supongan modificación o derogación de algún real decreto o exijan su desarrollo reglamentario."
  - id: b
    text:
      es: "Supongan modificación o derogación de alguna orden ministerial."
  - id: c
    text:
      es: "Supongan modificación o derogación de alguna disposición reglamentaria del Gobierno."
  - id: d
    correct: true
    text:
      es: "Supongan modificación o derogación de alguna ley o exijan medidas legislativas para su ejecución."
  explanation:
    es: "El artículo 94.1.e) pide autorización previa de las Cortes para los tratados «que supongan modificación o derogación de alguna ley o exijan medidas legislativas para su ejecución». El apartado 1 lista los casos con «en los siguientes casos», y ninguno nombra normas del Gobierno. Un real decreto no es una ley ni una medida legislativa, y lo mismo vale para una orden ministerial y para una disposición reglamentaria del Gobierno: son normas reglamentarias, y el caso e) exige una ley."
  citation: "art. 94.1.e CE"
  difficulty: 2
  tags:
  - "requisito"
  - "órgano"
# anchor: boe-a-1981-10325-art-2
- id: m01-l03-q002
  prompt:
    es: "De acuerdo con el artículo 2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, el Defensor del Pueblo será elegido por las Cortes Generales para un periodo de:"
  options:
  - id: a
    text:
      es: "Cuatro años, y se dirigirá a ellas a través de los Presidentes del Congreso y del Senado."
  - id: b
    text:
      es: "Cinco años, y se dirigirá a ellas a través de la Mesa del Congreso de los Diputados."
  - id: c
    correct: true
    text:
      es: "Cinco años, y se dirigirá a ellas a través de los Presidentes del Congreso y del Senado."
  - id: d
    text:
      es: "Seis años, y se dirigirá a ellas a través del Presidente del Congreso de los Diputados."
  explanation:
    es: "El artículo 2.1 de la LO 3/1981 fija «un periodo de cinco años» y dice que el Defensor se dirigirá a las Cortes a través de los Presidentes del Congreso y del Senado. Cuatro y seis años no son el mandato. Tampoco se dirige a ellas a través de la Mesa del Congreso ni solo de su Presidente."
  citation: "art. 2.1 LO 3/1981"
  difficulty: 1
  tags:
  - "plazo"
  - "órgano"
# anchor: boe-a-1981-10325-art-2
- id: m01-l03-q003
  prompt:
    es: "Según el artículo 2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, ¿qué funciones tiene la Comisión Mixta Congreso-Senado que se designa en las Cortes Generales?"
  options:
  - id: a
    correct: true
    text:
      es: "Relacionarse con el Defensor del Pueblo e informar a los respectivos Plenos en cuantas ocasiones sea necesario."
  - id: b
    text:
      es: "Elegir al Defensor del Pueblo por mayoría de tres quintos de sus miembros."
  - id: c
    text:
      es: "Nombrar y separar a los Adjuntos del Defensor del Pueblo."
  - id: d
    text:
      es: "Tramitar las quejas que los ciudadanos dirijan a las Cortes Generales."
  explanation:
    es: "El artículo 2.2 de la LO 3/1981 crea una Comisión Mixta Congreso-Senado «encargada de relacionarse con el Defensor del Pueblo e informar a los respectivos Plenos en cuantas ocasiones sea necesario». La Comisión propone candidatos, pero eligen los Plenos (art. 2.4). Los Adjuntos los nombra y separa el Defensor (art. 8.2). Las quejas las tramita el Defensor."
  citation: "art. 2.2 LO 3/1981"
  difficulty: 1
  tags:
  - "órgano"
  - "competencia"
# anchor: boe-a-1981-10325-art-2
- id: m01-l03-q004
  prompt:
    es: "Conforme al artículo 2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, los acuerdos de la Comisión que propone a los Plenos el candidato o candidatos a Defensor del Pueblo se adoptarán por:"
  options:
  - id: a
    text:
      es: "Mayoría absoluta de la Comisión."
  - id: b
    correct: true
    text:
      es: "Mayoría simple de la Comisión."
  - id: c
    text:
      es: "Mayoría de tres quintos de la Comisión."
  - id: d
    text:
      es: "Mayoría de dos tercios de la Comisión."
  explanation:
    es: "El artículo 2.3 de la LO 3/1981 dice: «Los acuerdos de la Comisión se adoptarán por mayoría simple». Los tres quintos son la mayoría de la elección en el Pleno del Congreso y de la ratificación en el Senado (art. 2.4). La mayoría absoluta y la de dos tercios no aparecen para la Comisión."
  citation: "art. 2.3 LO 3/1981"
  difficulty: 2
  tags:
  - "mayoría"
# anchor: boe-a-1981-10325-art-2
- id: m01-l03-q005
  prompt:
    es: "Según la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, ¿qué votación necesita el candidato propuesto en primer término para quedar designado Defensor del Pueblo?"
  options:
  - id: a
    text:
      es: "Tres quintos de los miembros del Congreso y, en un plazo máximo de veinte días, ratificación por mayoría absoluta del Senado."
  - id: b
    text:
      es: "Mayoría absoluta del Congreso y, en un plazo máximo de veinte días, ratificación por esta misma mayoría del Senado."
  - id: c
    correct: true
    text:
      es: "Tres quintos de los miembros del Congreso y, en un plazo máximo de veinte días, ratificación por esta misma mayoría del Senado."
  - id: d
    text:
      es: "Tres quintos de los miembros del Congreso y, en un plazo máximo de diez días, ratificación por esta misma mayoría del Senado."
  explanation:
    es: "El artículo 2.4 de la LO 3/1981 exige «una votación favorable de las tres quintas partes de los miembros del Congreso» y, «en un plazo máximo de veinte días», la ratificación «por esta misma mayoría del Senado». La mayoría absoluta del Senado basta solo en las propuestas sucesivas del artículo 2.5. La mayoría absoluta del Congreso no es suficiente. Diez días es el término mínimo para convocar el Pleno del Congreso, no el plazo del Senado."
  citation: "art. 2.4 LO 3/1981"
  difficulty: 3
  tags:
  - "mayoría"
  - "plazo"
# anchor: boe-a-1981-10325-art-5
- id: m01-l03-q006
  prompt:
    es: "Señale la respuesta correcta sobre las causas de cese del Defensor del Pueblo previstas en la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo:"
  options:
  - id: a
    text:
      es: "Cesa por haber sido condenado, mediante sentencia firme, por cualquier delito, doloso o imprudente."
  - id: b
    text:
      es: "Cesa por la disolución de las Cortes Generales que lo eligieron."
  - id: c
    text:
      es: "Cesa por la pérdida de la confianza de la Comisión Mixta Congreso-Senado."
  - id: d
    correct: true
    text:
      es: "Cesa por haber sido condenado, mediante sentencia firme, por delito doloso."
  explanation:
    es: "El artículo 5.1 de la LO 3/1981 recoge como causa de cese «haber sido condenado, mediante sentencia firme, por delito doloso». El delito imprudente no es causa de cese. La disolución de las Cortes no interrumpe su actividad (art. 11.1). La pérdida de confianza de la Comisión no figura entre las causas."
  citation: "art. 5.1 LO 3/1981"
  difficulty: 2
  tags:
  - "concepto"
# anchor: boe-a-1981-10325-art-5
- id: m01-l03-q007
  prompt:
    es: "De acuerdo con el artículo 5 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, la vacante del Defensor del Pueblo en los casos de muerte, renuncia y expiración del mandato se declarará por:"
  options:
  - id: a
    text:
      es: "Los Presidentes del Congreso y del Senado, conjuntamente."
  - id: b
    correct: true
    text:
      es: "El Presidente del Congreso de los Diputados."
  - id: c
    text:
      es: "Las Cámaras, por mayoría de tres quintos de los componentes de cada una."
  - id: d
    text:
      es: "La Comisión Mixta Congreso-Senado, por mayoría simple."
  explanation:
    es: "El artículo 5.2 de la LO 3/1981 dice que la vacante «se declarará por el Presidente del Congreso en los casos de muerte, renuncia y expiración del plazo del mandato». La decisión de las Cámaras por tres quintos se reserva a los demás casos. Ni los dos Presidentes juntos ni la Comisión Mixta declaran la vacante."
  citation: "art. 5.2 LO 3/1981"
  difficulty: 3
  tags:
  - "órgano"
  - "mayoría"
# anchor: boe-a-1981-10325-art-6
- id: m01-l03-q008
  prompt:
    es: "Conforme al artículo 6 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, la decisión sobre la inculpación, prisión, procesamiento y juicio del Defensor del Pueblo corresponde exclusivamente a:"
  options:
  - id: a
    text:
      es: "La Sala de lo Penal de la Audiencia Nacional."
  - id: b
    text:
      es: "La Sala de lo Civil y Penal del Tribunal Superior de Justicia de Madrid."
  - id: c
    correct: true
    text:
      es: "La Sala de lo Penal del Tribunal Supremo."
  - id: d
    text:
      es: "El Pleno del Tribunal Constitucional."
  explanation:
    es: "El artículo 6.3 de la LO 3/1981 atribuye esa decisión «exclusivamente a la Sala de lo Penal del Tribunal Supremo». La Audiencia Nacional y el Tribunal Superior de Justicia de Madrid son órganos de nivel inferior. El Tribunal Constitucional no tiene jurisdicción penal."
  citation: "art. 6.3 LO 3/1981"
  difficulty: 2
  tags:
  - "órgano"
# anchor: boe-a-1981-10325-art-7
- id: m01-l03-q009
  prompt:
    es: "Según el artículo 7 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, ¿qué ocurre si el Defensor del Pueblo no cesa en su situación de incompatibilidad dentro de los diez días siguientes a su nombramiento?"
  options:
  - id: a
    text:
      es: "Se entiende que renuncia al cargo en la fecha en que se produjo la incompatibilidad."
  - id: b
    text:
      es: "Las Cámaras declaran la vacante por mayoría de tres quintos, previa audiencia del interesado."
  - id: c
    text:
      es: "Se le concede un nuevo plazo de diez días para que cese en la incompatibilidad."
  - id: d
    correct: true
    text:
      es: "Se entiende que no acepta el nombramiento."
  explanation:
    es: "El artículo 7.2 de la LO 3/1981 dice que, si no cesa en ese plazo, se entiende «en caso contrario que no acepta el nombramiento». La renuncia en la fecha de la incompatibilidad es la consecuencia de la incompatibilidad sobrevenida tras la toma de posesión (art. 7.3). La ley no prevé declaración de vacante por las Cámaras para este caso ni un nuevo plazo."
  citation: "art. 7.2 LO 3/1981"
  difficulty: 3
  tags:
  - "plazo"
  - "efecto"
# anchor: boe-a-1981-10325-art-15
- id: m01-l03-q011
  prompt:
    es: "¿En qué plazo máximo debe presentarse una queja ante el Defensor del Pueblo, según la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo?"
  options:
  - id: a
    text:
      es: "Tres meses, contados a partir del momento en que el interesado tuvo conocimiento de los hechos."
  - id: b
    text:
      es: "Un año, contado a partir del momento en que se produjeron los hechos objeto de la queja."
  - id: c
    correct: true
    text:
      es: "Un año, contado a partir del momento en que el interesado tuvo conocimiento de los hechos."
  - id: d
    text:
      es: "Seis meses, contados a partir de la notificación del acto administrativo que se discute."
  explanation:
    es: "El artículo 15.1 de la LO 3/1981 exige presentar la queja «en el plazo máximo de un año, contado a partir del momento en que tuviera conocimiento de los hechos objeto de la misma». Tres y seis meses no son el plazo. El año se cuenta desde que el interesado conoce los hechos, no desde que ocurrieron."
  citation: "art. 15.1 LO 3/1981"
  difficulty: 2
  tags:
  - "plazo"
# anchor: boe-a-1978-31229-art-68
- id: m01-l03-q016
  prompt:
    es: "Según el artículo 68 de la Constitución Española de 1978, ¿cuál es el número máximo de Diputados que puede componer el Congreso?"
  options:
  - id: a
    text:
      es: "Un máximo de 350 Diputados."
  - id: b
    text:
      es: "Un máximo de 300 Diputados."
  - id: c
    text:
      es: "Un máximo de 450 Diputados."
  - id: d
    correct: true
    text:
      es: "Un máximo de 400 Diputados."
  explanation:
    es: "El artículo 68.1 fija «un mínimo de 300 y un máximo de 400 Diputados». La cifra de 300 es el mínimo, no el máximo. Las de 350 y 450 no aparecen en el precepto."
  citation: "art. 68.1 CE"
  difficulty: 1
  tags:
  - "cantidad"
  - "composición"
# anchor: boe-a-1978-31229-art-68
- id: m01-l03-q017
  prompt:
    es: "Conforme al artículo 68 de la Constitución Española de 1978, en la elección del Congreso de los Diputados la circunscripción electoral es:"
  options:
  - id: a
    text:
      es: "La Comunidad Autónoma, y Ceuta y Melilla están representadas cada una por un Diputado."
  - id: b
    text:
      es: "La provincia, y Ceuta y Melilla están representadas cada una por dos Diputados."
  - id: c
    text:
      es: "La isla en las provincias insulares y la provincia en el resto del territorio."
  - id: d
    correct: true
    text:
      es: "La provincia, y Ceuta y Melilla están representadas cada una por un Diputado."
  explanation:
    es: "El artículo 68.2 dice: «La circunscripción electoral es la provincia. Las poblaciones de Ceuta y Melilla estarán representadas cada una de ellas por un Diputado». La circunscripción no es la Comunidad Autónoma. Ceuta y Melilla tienen un Diputado cada una, no dos. La isla como circunscripción es la regla del Senado en las provincias insulares (art. 69.3), no la del Congreso."
  citation: "art. 68.2 CE"
  difficulty: 2
  tags:
  - "composición"
# anchor: boe-a-1978-31229-art-68
- id: m01-l03-q018
  prompt:
    es: "¿Cuándo deben celebrarse las elecciones al Congreso de los Diputados una vez terminado el mandato, según la Constitución Española de 1978?"
  options:
  - id: a
    correct: true
    text:
      es: "Entre los treinta días y sesenta días desde la terminación del mandato."
  - id: b
    text:
      es: "Entre los quince días y treinta días desde la terminación del mandato."
  - id: c
    text:
      es: "Entre los treinta días y noventa días desde la terminación del mandato."
  - id: d
    text:
      es: "Dentro de los veinticinco días siguientes a la terminación del mandato."
  explanation:
    es: "El artículo 68.6 dice que «las elecciones tendrán lugar entre los treinta días y sesenta días desde la terminación del mandato». Los plazos de quince a treinta días y de treinta a noventa días no están en el precepto. Los veinticinco días son el plazo para convocar el Congreso electo, y se cuentan desde la celebración de las elecciones."
  citation: "art. 68.6 CE"
  difficulty: 2
  tags:
  - "plazo"
