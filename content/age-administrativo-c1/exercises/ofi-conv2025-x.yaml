    correct: true
  - id: c
    text:
      es: El Presidente del Congreso y el Presidente del Senado conjuntamente.
    correct: false
  - id: d
    text:
      es: El Presidente del Congreso. SUPUESTO I Jefe de Sección, con complemento de destino de nivel 22, en el Instituto
        Nacional de Estadística (INE), organismo autónomo que se adscribe al Ministerio de Economía, Comercio y Empresa. El
        puesto lo obtuvo por concurso el 11 de diciembre de 2024. Tras una inundación ocurrida en la Delegación del INE de
        Valencia, la funcionaria recibe una instrucción por escrito de su superior jerárquico para que confeccione un Excel
        con los datos recibidos sobre los gastos necesarios para paliar los desperfectos, pero la funcionaria se niega a confeccionar
        dicho Excel, desobedeciendo abiertamente la instrucción recibida. Asimismo, durante este fenómeno, debido al corte
        de luz se han perdido datos informáticos de los servidores del organismo autónomo y se hace necesario la adquisición
        de un desarrollo que permita trabajar de modo más eficiente con los datos que han podido mantenerse. Con ese objeto,
        se acude a la utilización de un sistema dinámico de adquisición de servicios de desarrollo de sistemas de administración
        electrónica. Una de las actuaciones a realizar tras la inundación será la de pintar la fachada de la Delegación, para
        lo cual se va a realizar un contrato de obras, por una cuantía de 17.600 euros, sin IVA. Además, es necesario llevar
        a cabo la compra de varias mesas de oficina, por un importe de 4.500 euros sin IVA, debido a que las anteriores han
        quedado inservibles y también la compra de ordenadores mediante un acuerdo marco. Una semana después de haber procedido
        al pintado de la sede, afloran grietas en los pilares de la fachada este del edificio, suponiendo una situación de
        grave peligro para la seguridad del mismo, obligando a tomar medidas por la vía de emergencia. Con posterioridad a
        esta actuación, el órgano de contratación promueve la contratación de un proyecto de obras destinado a reforzar la
        estabilidad de la estructura del edificio que ha sufrido daños como consecuencia del paso del tiempo y, especialmente,
        por las recientes inundaciones. El proyecto cuenta con un presupuesto base de licitación de 80.000 euros. Por otro
        lado, el INE anualmente tiene que atender el pago del arrendamiento de su sede de Castellón. Este año, además, se
        han detectado nuevas necesidades que suponen un incremento en el gasto del concepto 202, lo que ha supuesto una insuficiencia
        de crédito en la aplicación presupuestaria 27.101.923C.202 para el año en curso. Además, en el INE se plantea la posibilidad
        de contratar a personal laboral temporal como entrevistadores para la recogida de datos estadísticos. Por otro lado,
        con fecha 9 de febrero de 2026, Carmen Cuesta presenta en el registro electrónico del organismo solicitud de participación
        en un concurso de traslados del Ministerio para la Transformación Digital y de la Función Pública, para una plaza
        en el Gabinete del Ministro. Se da la circunstancia de que un primo hermano de la funcionaria es vocal en la Comisión
        de Valoración del concurso. Por último, un ciudadano presenta una reclamación al INE por unos datos personales inexactos
        que le conciernen y que figuran en una resolución dictada por la Presidenta del organismo, ejerciendo así su derecho
        de rectificación.
    correct: false
