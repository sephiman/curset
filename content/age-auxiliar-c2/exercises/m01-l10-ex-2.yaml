# anchor: celex-12016e-txt-art-235
- id: m01-l10-q005
  prompt:
    es: "De acuerdo con el artículo 235 del Tratado de Funcionamiento de la Unión Europea, cuando el Consejo Europeo se pronuncie por votación:"
  options:
  - id: a
    text:
      es: "Su Presidente participará en las votaciones, pero el Presidente de la Comisión no."
  - id: b
    text:
      es: "Su Presidente y el Presidente de la Comisión votarán solo en caso de empate."
  - id: c
    text:
      es: "El Presidente de la Comisión participará en las votaciones, pero su Presidente no."
  - id: d
    correct: true
    text:
      es: "Su Presidente y el Presidente de la Comisión no participarán en las votaciones."
  explanation:
    es: "El artículo 235.1 TFUE dice que «el Presidente del Consejo Europeo y el Presidente de la Comisión no participarán en las votaciones del Consejo Europeo cuando éste se pronuncie por votación». Ninguno de los dos vota, ni siempre ni para deshacer un empate, y el artículo no distingue entre ellos."
  citation: "art. 235.1 TFUE"
  difficulty: 2
  tags:
  - "mayoría"
  - "composición"
# anchor: celex-12016m-txt-art-15
- id: m01-l10-q007
  prompt:
    es: "¿Puede el Consejo Europeo poner fin al mandato de su Presidente antes de que concluya el período para el que fue elegido?"
  options:
  - id: a
    text:
      es: "Sí, en caso de impedimento o falta grave, pero solo por unanimidad."
  - id: b
    correct: true
    text:
      es: "Sí, en caso de impedimento o falta grave, por mayoría cualificada."
  - id: c
    text:
      es: "No; el mandato solo termina por expiración del plazo o por renuncia."
  - id: d
    text:
      es: "Sí, pero solo a propuesta del Parlamento Europeo por mayoría de dos tercios."
  explanation:
    es: "El artículo 15.5 TUE dice que, «en caso de impedimento o falta grave, el Consejo Europeo podrá poner fin a su mandato por el mismo procedimiento», es decir, por mayoría cualificada, la misma de la elección. No exige unanimidad ni propuesta del Parlamento, y sí permite el cese anticipado."
  citation: "art. 15.5 TUE"
  difficulty: 3
  tags:
  - "procedimiento"
  - "mayoría"
# anchor: celex-12016m-txt-art-18
- id: m01-l10-q008
  prompt:
    es: "De acuerdo con el artículo 18 del Tratado de la Unión Europea, el Alto Representante de la Unión para Asuntos Exteriores y Política de Seguridad será nombrado:"
  options:
  - id: a
    text:
      es: "Por el Consejo Europeo, por unanimidad, con la aprobación del Presidente del Parlamento Europeo."
  - id: b
    text:
      es: "Por el Consejo, por mayoría cualificada, a propuesta del Presidente de la Comisión."
  - id: c
    correct: true
    text:
      es: "Por el Consejo Europeo, por mayoría cualificada, con la aprobación del Presidente de la Comisión."
  - id: d
    text:
      es: "Por el Presidente de la Comisión Europea, con la aprobación del Consejo Europeo por mayoría cualificada."
  explanation:
    es: "El artículo 18.1 TUE dice que «el Consejo Europeo nombrará por mayoría cualificada, con la aprobación del Presidente de la Comisión, al Alto Representante». La unanimidad y la aprobación del Presidente del Parlamento no están en el artículo. El Consejo no lo nombra. El Presidente de la Comisión aprueba el nombramiento, pero no lo hace."
  citation: "art. 18.1 TUE"
  difficulty: 2
  tags:
  - "órgano"
  - "mayoría"
  - "procedimiento"
# anchor: celex-12016m-txt-art-15
- id: m01-l10-q047
  prompt:
    es: "Según el artículo 15 del Tratado de la Unión Europea, ¿qué debe hacer el Presidente del Consejo Europeo al término de cada reunión del Consejo Europeo?"
  options:
  - id: a
    correct: true
    text:
      es: "Presentar un informe al Parlamento Europeo."
  - id: b
    text:
      es: "Presentar un informe al Consejo de Asuntos Generales."
  - id: c
    text:
      es: "Presentar un informe a los Parlamentos nacionales."
  - id: d
    text:
      es: "Comparecer ante la Comisión para dar cuenta de los acuerdos."
  explanation:
    es: "La opción correcta es presentar un informe al Parlamento Europeo: el artículo 15.6.d) TUE dice que el Presidente, «al término de cada reunión del Consejo Europeo, presentará un informe al Parlamento Europeo». Con el Consejo de Asuntos Generales se apoya para preparar los trabajos, pero el informe no va a esa formación. Los Parlamentos nacionales no lo reciben. Con el Presidente de la Comisión coopera, pero no comparece ante la Comisión."
  citation: "art. 15.6 TUE"
  difficulty: 2
  tags:
  - "órgano"
  - "procedimiento"
# anchor: celex-12016e-txt-art-235
- id: m01-l10-q048
  prompt:
    es: "Según el artículo 235 del Tratado de Funcionamiento de la Unión Europea, ¿cómo se pronunciará el Consejo Europeo en las cuestiones de procedimiento y para la aprobación de su reglamento interno?"
  options:
  - id: a
    text:
      es: "Se pronunciará por consenso de sus miembros."
  - id: b
    text:
      es: "Se pronunciará por mayoría cualificada de sus miembros."
  - id: c
    text:
      es: "Se pronunciará por unanimidad de los miembros presentes."
  - id: d
    correct: true
    text:
      es: "Se pronunciará por mayoría simple."
  explanation:
    es: "La opción correcta es la mayoría simple: el artículo 235.3 TFUE dice que el Consejo Europeo «se pronunciará por mayoría simple en las cuestiones de procedimiento y para la aprobación de su reglamento interno». El consenso es su regla general (art. 15.4 TUE), que este apartado desplaza. La mayoría cualificada y la unanimidad no son las que fija el apartado."
  citation: "art. 235.3 TFUE"
  difficulty: 2
  tags:
  - "mayoría"
  - "procedimiento"
# anchor: celex-12016m-txt-art-15
- id: m01-l10-q051
  prompt:
    es: "De acuerdo con el artículo 15 del Tratado de la Unión Europea, el Consejo Europeo se reunirá con carácter ordinario:"
  options:
  - id: a
    text:
      es: "Una vez por semestre, por convocatoria conjunta de su Presidente y del Presidente de la Comisión."
  - id: b
    correct: true
    text:
      es: "Dos veces por semestre, convocado por su Presidente."
  - id: c
    text:
      es: "Una vez al mes, por convocatoria de su Presidente o a petición de un tercio de sus miembros."
  - id: d
    text:
      es: "Dos veces por semestre, por convocatoria del Presidente de la Comisión y del Alto Representante."
  explanation:
    es: "La opción correcta es dos veces por semestre, convocado por su Presidente: el artículo 15.3 TUE dice que el Consejo Europeo «se reunirá dos veces por semestre por convocatoria de su Presidente». Una vez por semestre y una vez al mes cambian la frecuencia. La convocatoria es solo de su Presidente: no es conjunta con el Presidente de la Comisión, no la hacen el Presidente de la Comisión y el Alto Representante y no la pide un tercio de los miembros."
  citation: "art. 15.3 TUE"
  difficulty: 2
  tags:
  - "procedimiento"
  - "cantidad"
# anchor: celex-12016m-txt-art-15
- id: m01-l10-q066
  prompt:
    es: "Conforme al artículo 15.1 del Tratado de la Unión Europea, el Consejo Europeo dará a la Unión los impulsos necesarios para su desarrollo y definirá:"
  options:
  - id: a
    text:
      es: "Sus normas legislativas y presupuestarias."
  - id: b
    correct: true
    text:
      es: "Sus orientaciones y prioridades políticas generales."
  - id: c
    text:
      es: "Sus actos de ejecución y sus actos delegados."
  - id: d
    text:
      es: "Su reglamento financiero y su programa anual."
  explanation:
    es: "El Consejo Europeo define las orientaciones y prioridades políticas generales de la Unión. No legisla, de modo que no define normas legislativas ni presupuestarias, y tampoco aprueba actos de ejecución ni delegados. El reglamento financiero y el programa anual no figuran en el artículo."
  citation: "art. 15.1 TUE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: celex-12016m-txt-art-15
- id: m01-l10-q067
  prompt:
    es: "Señale la afirmación correcta sobre el Consejo Europeo, de acuerdo con el artículo 15.1 del Tratado de la Unión Europea:"
  options:
  - id: a
    correct: true
    text:
      es: "No ejerce función legislativa alguna."
  - id: b
    text:
      es: "Ejerce conjuntamente con el Parlamento Europeo la función legislativa."
  - id: c
    text:
      es: "Ejerce la función legislativa cuando los Tratados lo prevén."
  - id: d
    text:
      es: "Ejerce la función legislativa por consenso de sus miembros."
  explanation:
    es: "El artículo 15.1 dice que el Consejo Europeo no ejercerá función legislativa alguna. La función legislativa conjunta con el Parlamento corresponde al Consejo, según el artículo 16.1. Tampoco la ejerce en ningún caso previsto por los Tratados ni por consenso: el artículo no deja excepción."
  citation: "art. 15.1 TUE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: celex-12016m-txt-art-15
- id: m01-l10-q068
  prompt:
    es: "Conforme al artículo 15.4 del Tratado de la Unión Europea, como regla general, salvo que los Tratados dispongan otra cosa, el Consejo Europeo se pronunciará:"
  options:
  - id: a
    text:
      es: "Por mayoría cualificada."
  - id: b
    text:
      es: "Por unanimidad."
  - id: c
    text:
      es: "Por mayoría simple."
  - id: d
    correct: true
    text:
      es: "Por consenso."
  explanation:
    es: "La regla general es el consenso. La mayoría cualificada es la regla general del Consejo, no del Consejo Europeo. La unanimidad solo rige donde los Tratados la exigen, y la mayoría simple se limita a las cuestiones de procedimiento y a su reglamento interno."
  citation: "art. 15.4 TUE"
  difficulty: 1
  tags:
  - "mayoría"
# anchor: celex-12016m-txt-art-15
- id: m01-l10-q069
  prompt:
    es: "¿Cuál de las siguientes personas forma parte del Consejo Europeo, además de los Jefes de Estado o de Gobierno de los Estados miembros y de su Presidente, de acuerdo con el artículo 15.2 del Tratado de la Unión Europea?"
  options:
  - id: a
    text:
      es: "El Presidente del Parlamento Europeo."
  - id: b
    text:
      es: "El Presidente del Tribunal de Justicia."
  - id: c
    correct: true
    text:
      es: "El Presidente de la Comisión."
  - id: d
    text:
      es: "El Alto Representante de la Unión para Asuntos Exteriores y Política de Seguridad."
  explanation:
    es: "Además de los Jefes de Estado o de Gobierno y de su Presidente, lo compone el Presidente de la Comisión. El Presidente del Parlamento Europeo no es miembro, aunque el Consejo Europeo puede invitarlo a comparecer. El Presidente del Tribunal de Justicia preside otra institución y no forma parte del Consejo Europeo. El Alto Representante solo participa en sus trabajos, pero no lo compone."
  citation: "art. 15.2 TUE"
  difficulty: 2
  tags:
  - "composición"
# anchor: celex-12016m-txt-art-15
- id: m01-l10-q070
  prompt:
    es: "Señale qué convocará el Presidente del Consejo Europeo cuando la situación lo exija, según el artículo 15.3 del Tratado de la Unión Europea:"
  options:
  - id: a
    text:
      es: "Una reunión conjunta con el Parlamento Europeo."
  - id: b
    correct: true
    text:
      es: "Una reunión extraordinaria del Consejo Europeo."
  - id: c
    text:
      es: "Una reunión extraordinaria del Consejo de Asuntos Generales."
  - id: d
    text:
      es: "Un período parcial de sesiones extraordinario del Parlamento Europeo."
  explanation:
    es: "Cuando la situación lo exige, el Presidente convoca una reunión extraordinaria del Consejo Europeo. No convoca reuniones conjuntas con el Parlamento, ni del Consejo de Asuntos Generales, ni períodos de sesiones del Parlamento, que se reúne a petición de la mayoría de sus miembros, del Consejo o de la Comisión."
  citation: "art. 15.3 TUE"
  difficulty: 2
  tags:
  - "procedimiento"
# anchor: celex-12016m-txt-art-15
- id: m01-l10-q071
  prompt:
    es: "¿Cuál de las siguientes duraciones corresponde al mandato del Presidente del Consejo Europeo, elegido por mayoría cualificada, según el artículo 15.5 del Tratado de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "Dos años y medio, renovable una sola vez."
  - id: b
    text:
      es: "Dos años, renovable sin límite."
  - id: c
    text:
      es: "Tres años, renovable una sola vez."
  - id: d
    text:
      es: "Seis años, no renovable."
  explanation:
    es: "El mandato es de dos años y medio y puede renovarse una sola vez. Dos años renovables sin límite, tres años y seis años no renovables no coinciden con el artículo."
  citation: "art. 15.5 TUE"
  difficulty: 1
  tags:
  - "plazo"
# anchor: celex-12016m-txt-art-15
- id: m01-l10-q072
  prompt:
    es: "Señale la respuesta correcta sobre el Presidente del Consejo Europeo, de acuerdo con el artículo 15.6 del Tratado de la Unión Europea:"
  options:
  - id: a
    text:
      es: "Podrá ejercer un mandato nacional si el Consejo Europeo lo autoriza por mayoría cualificada."
  - id: b
    text:
      es: "Presidirá el Consejo de Asuntos Exteriores."
  - id: c
    text:
      es: "Presentará un informe al Consejo de la Unión Europea al término de cada reunión."
  - id: d
    correct: true
    text:
      es: "No podrá ejercer mandato nacional alguno."
  explanation:
    es: "El Presidente del Consejo Europeo no puede ejercer mandato nacional alguno, sin excepción. El Consejo de Asuntos Exteriores lo preside el Alto Representante. Al término de cada reunión presenta el informe al Parlamento Europeo, no al Consejo de la Unión Europea."
  citation: "art. 15.6 TUE"
  difficulty: 3
  tags:
  - "requisito"
# anchor: celex-12016e-txt-art-235
- id: m01-l10-q073
  prompt:
    es: "Conforme al artículo 235.1 del Tratado de Funcionamiento de la Unión Europea, cuando el Consejo Europeo se pronuncie por mayoría cualificada, se le aplicarán:"
  options:
  - id: a
    text:
      es: "Las reglas de la mayoría de dos tercios del Parlamento Europeo."
  - id: b
    text:
      es: "Las reglas de la mayoría de los miembros que componen la Comisión."
  - id: c
    correct: true
    text:
      es: "Las mismas reglas de mayoría cualificada que rigen en el Consejo."
  - id: d
    text:
      es: "Las reglas propias que fije su reglamento interno."
  explanation:
    es: "El Consejo Europeo aplica, cuando vota por mayoría cualificada, el apartado 4 del artículo 16 del Tratado de la Unión Europea y el apartado 2 del artículo 238 de este Tratado, es decir, las definiciones de mayoría cualificada del Consejo. No se le aplican las reglas del Parlamento ni las de la Comisión, ni unas propias fijadas por su reglamento."
  citation: "art. 235.1 TFUE"
  difficulty: 3
  tags:
  - "mayoría"
# anchor: celex-12016m-txt-art-18
- id: m01-l10-q074
  prompt:
    es: "Según el artículo 18.2 del Tratado de la Unión Europea, el Alto Representante de la Unión para Asuntos Exteriores y Política de Seguridad estará al frente de:"
  options:
  - id: a
    text:
      es: "La política económica y monetaria de la Unión."
  - id: b
    correct: true
    text:
      es: "La política exterior y de seguridad común de la Unión."
  - id: c
    text:
      es: "La política comercial común y la ayuda humanitaria."
  - id: d
    text:
      es: "La política de seguridad interior y de justicia."
  explanation:
    es: "El Alto Representante está al frente de la política exterior y de seguridad común. La política económica y monetaria, la comercial y la de seguridad interior y justicia no son su ámbito en el artículo 18.2."
  citation: "art. 18.2 TUE"
  difficulty: 1
  tags:
  - "competencia"
# anchor: celex-12016m-txt-art-18
- id: m01-l10-q075
  prompt:
    es: "¿Cuál de los siguientes órganos preside el Alto Representante de la Unión para Asuntos Exteriores y Política de Seguridad, de acuerdo con el artículo 18.3 del Tratado de la Unión Europea?"
  options:
  - id: a
    correct: true
    text:
      es: "El Consejo de Asuntos Exteriores."
  - id: b
    text:
      es: "El Consejo de Asuntos Generales."
  - id: c
    text:
      es: "El Consejo Europeo."
  - id: d
    text:
      es: "El Comité de Representantes Permanentes."
  explanation:
    es: "El Alto Representante preside el Consejo de Asuntos Exteriores. El Consejo de Asuntos Generales sigue el sistema de presidencia rotatoria, el Consejo Europeo lo preside su Presidente y el Comité de Representantes Permanentes no figura entre los órganos que preside."
  citation: "art. 18.3 TUE"
  difficulty: 1
  tags:
  - "órgano"
# anchor: celex-12016m-txt-art-18
- id: m01-l10-q076
  prompt:
    es: "Conforme al artículo 18.4 del Tratado de la Unión Europea, el Alto Representante de la Unión para Asuntos Exteriores y Política de Seguridad será uno de los:"
  options:
  - id: a
    text:
      es: "Vicepresidentes del Parlamento Europeo."
  - id: b
    text:
      es: "Vicepresidentes del Consejo Europeo."
  - id: c
    text:
      es: "Miembros del Tribunal de Justicia."
  - id: d
    correct: true
    text:
      es: "Vicepresidentes de la Comisión."
  explanation:
    es: "El Alto Representante es uno de los Vicepresidentes de la Comisión. No es Vicepresidente del Parlamento Europeo ni del Consejo Europeo, y no forma parte del Tribunal de Justicia."
  citation: "art. 18.4 TUE"
  difficulty: 2
  tags:
  - "órgano"
